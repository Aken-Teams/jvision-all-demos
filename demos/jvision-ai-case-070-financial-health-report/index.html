<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>財務健檢報告所 · Financial Health Report</title>
<meta name="description" content="財報匯入、比率計算、風險評分到 AI 建議與健檢報告產出（純 UI 展示）。"/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0F172A;
  --color-on-primary:#FFFFFF;
  --color-secondary:#1E293B;
  --color-on-secondary:#FFFFFF;
  --color-accent:#22C55E;
  --color-on-accent:#0F172A;
  --color-background:#020617;
  --color-foreground:#F8FAFC;
  --color-card:#0E1223;
  --color-card-foreground:#F8FAFC;
  --color-muted:#1A1E2F;
  --color-muted-foreground:#94A3B8;
  --color-border:#334155;
  --color-destructive:#EF4444;
  --color-warning:#F59E0B;
  --color-info:#38BDF8;
  --color-ring:#FFFFFF;
  --blue:#22C55E;
  --ink:#F8FAFC;
  --muted:#A8B5C8;
  --line:#334155;
  --bg:var(--color-background);
  --card:var(--color-card);
  --soft:var(--color-muted);
  --ok:#22C55E;
  --warn:#F59E0B;
  --bad:#EF4444;
}
*{box-sizing:border-box}
html{color-scheme:dark;scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  font-family:"Fira Sans","Microsoft JhengHei",sans-serif;
  background:
    radial-gradient(circle at 14% -10%,rgba(34,197,94,.11),transparent 26rem),
    radial-gradient(circle at 94% 12%,rgba(56,189,248,.06),transparent 24rem),
    var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,[role="button"]{cursor:pointer}
.material-symbols-outlined{
  font-size:19px;
  line-height:1;
  vertical-align:middle;
  font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24
}
:focus-visible{
  outline:2px solid var(--color-ring);
  outline-offset:3px;
  box-shadow:0 0 0 5px rgba(34,197,94,.22)
}
.top{
  position:sticky;
  top:0;
  z-index:30;
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  align-items:center;
  gap:18px;
  padding:10px 22px;
  background:rgba(2,6,23,.94);
  border-bottom:1px solid var(--line);
  box-shadow:0 10px 30px rgba(0,0,0,.3);
  backdrop-filter:blur(18px)
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{
  position:relative;
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  flex:none;
  border:1px solid rgba(34,197,94,.45);
  border-radius:9px;
  color:var(--color-accent);
  background:linear-gradient(145deg,#162033,#09101e);
  box-shadow:inset 0 1px rgba(255,255,255,.07),0 0 20px rgba(34,197,94,.12)
}
.logo:after{
  content:"";
  position:absolute;
  right:5px;
  bottom:5px;
  width:5px;
  height:5px;
  border-radius:50%;
  background:var(--ok);
  box-shadow:0 0 9px var(--ok)
}
.logo .material-symbols-outlined{font-size:22px}
.brand b{
  display:block;
  color:#fff;
  font-size:15px;
  font-weight:700;
  letter-spacing:.02em;
  white-space:nowrap
}
.brand span:not(.material-symbols-outlined){
  display:block;
  margin-top:2px;
  color:var(--muted);
  font:500 9px/1.2 "Fira Code",monospace;
  letter-spacing:.14em;
  white-space:nowrap
}
.nav{
  min-width:0;
  display:flex;
  justify-content:flex-end;
  gap:4px;
  overflow-x:auto;
  scrollbar-width:none
}
.nav::-webkit-scrollbar{display:none}
.nav button{
  min-height:38px;
  padding:8px 10px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  flex:none;
  border:1px solid transparent;
  border-radius:7px;
  background:transparent;
  color:#AEBBD0;
  font-weight:600;
  font-size:12.5px;
  white-space:nowrap;
  transition:background-color .18s,border-color .18s,color .18s,transform .18s
}
.nav button:hover{
  color:#fff;
  border-color:#334155;
  background:#11182A
}
.nav button.on{
  color:#fff;
  border-color:rgba(34,197,94,.45);
  background:rgba(34,197,94,.11);
  box-shadow:inset 0 -2px var(--ok)
}
.nav button.on .material-symbols-outlined{color:var(--ok)}
.nav button .badge{
  min-width:19px;
  padding:1px 5px;
  border:1px solid rgba(239,68,68,.45);
  border-radius:999px;
  color:#FCA5A5;
  background:rgba(239,68,68,.12);
  font:700 10px "Fira Code",monospace;
  text-align:center
}
.who{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:154px;
  padding-left:16px;
  border-left:1px solid var(--line)
}
.who .av{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  flex:none;
  border:1px solid rgba(34,197,94,.35);
  border-radius:8px;
  color:var(--ok);
  background:#111A2B;
  font:700 13px "Fira Code",monospace
}
.who small{display:block;color:var(--muted);font-size:10.5px}
.who b{display:block;color:#fff;font-size:12.5px}
.wrap{width:min(100%,1440px);margin:auto;padding:20px 22px 34px}
.vh{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;
  min-height:58px;
  margin-bottom:14px
}
.vh h2{
  margin:0;
  color:#fff;
  font-size:21px;
  font-weight:700;
  letter-spacing:.01em;
  text-shadow:0 0 10px rgba(255,255,255,.13)
}
.vh p{margin:5px 0 0;color:var(--muted);font-size:12.5px}
.pill{
  min-height:32px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:5px 10px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#0A1020;
  color:#C9D5E6;
  font:500 11px "Fira Code",monospace;
  white-space:nowrap
}
.pill .material-symbols-outlined{color:var(--ok);font-size:16px}
.kpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
  margin-bottom:12px
}
.kpi{
  position:relative;
  min-width:0;
  overflow:hidden;
  padding:13px 14px 12px 16px;
  border:1px solid var(--line);
  border-radius:9px;
  background:linear-gradient(145deg,rgba(18,25,43,.98),rgba(10,15,29,.98));
  box-shadow:inset 0 1px rgba(255,255,255,.035),0 8px 24px rgba(0,0,0,.16)
}
.kpi:before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:3px;
  background:var(--ok);
  box-shadow:0 0 12px rgba(34,197,94,.38)
}
.kpi .l{color:var(--muted);font-size:11px;font-weight:600}
.kpi .v{
  margin-top:4px;
  color:#fff;
  font:700 25px/1.1 "Fira Code",monospace;
  letter-spacing:-.04em;
  font-variant-numeric:tabular-nums
}
.kpi .v small{color:#C4D0DF;font:500 11px "Fira Sans",sans-serif;letter-spacing:0}
.kpi .d{margin-top:5px;font:600 10.5px "Fira Code",monospace}
.kpi .ic{position:absolute;right:11px;top:11px;color:#64748B;opacity:.52}
.up{color:#86EFAC}.dn{color:#FCA5A5}
.grid{display:grid;gap:12px}.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.42fr) minmax(310px,.75fr)}
.g11{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr)}
.g12{grid-template-columns:minmax(320px,1fr) minmax(0,1.5fr)}
.card{
  min-width:0;
  padding:14px 15px;
  border:1px solid var(--line);
  border-radius:10px;
  background:linear-gradient(150deg,rgba(14,18,35,.99),rgba(8,13,27,.99));
  box-shadow:inset 0 1px rgba(255,255,255,.035),0 10px 30px rgba(0,0,0,.16)
}
.card h3{
  min-height:22px;
  margin:0 0 11px;
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
  color:#F8FAFC;
  font-size:13.5px;
  font-weight:700
}
.card h3>.material-symbols-outlined{color:var(--ok);font-size:18px}
.card h3 .grow{
  margin-left:auto;
  color:#86EFAC;
  font:500 10.5px "Fira Code",monospace
}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:2px 7px;
  border:1px solid;
  border-radius:5px;
  font-size:10px;
  font-weight:700;
  white-space:nowrap
}
.t-ok{color:#86EFAC;background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.34)}
.t-warn{color:#FCD34D;background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.34)}
.t-bad{color:#FCA5A5;background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.34)}
.t-info{color:#7DD3FC;background:rgba(56,189,248,.1);border-color:rgba(56,189,248,.32)}
.t-mut{color:#CBD5E1;background:rgba(148,163,184,.08);border-color:#334155}
.scroll{overflow:auto;scrollbar-color:#475569 #111827}
table.data{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  color:#DDE5F0;
  font-size:11.5px;
  font-variant-numeric:tabular-nums
}
table.data th,table.data td{
  height:39px;
  padding:8px 10px;
  border-bottom:1px solid #263248;
  text-align:left;
  white-space:nowrap
}
table.data th{
  position:sticky;
  top:0;
  z-index:1;
  color:#AFC0D5;
  background:#151C2E;
  font-size:10px;
  font-weight:700;
  letter-spacing:.045em
}
table.data tbody tr:last-child td{border-bottom:0}
table.data tbody tr{transition:background-color .16s}
table.data tbody tr:hover td{background:rgba(51,65,85,.22)}
table.data td:first-child,table.data td:nth-child(5){
  font-family:"Fira Code",monospace
}
table.data td.num,table.data th.num{text-align:right}
.num,.val,.gv,.bc b,.sc b,.rscore b{
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums
}
.chart{width:100%;min-height:60px}
.score{display:flex;align-items:center;gap:17px;flex-wrap:wrap}
.score .ring{width:150px;flex:none}
.score .sm{flex:1;min-width:190px}
.score .big{margin:0 0 7px;color:#fff;font-size:14px;font-weight:700}
.gline{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid #263248}
.gline:first-of-type{border-top:0}
.gline .gl{flex:1;min-width:0;color:#BCC9DA;font-size:11.5px;font-weight:600}
.gline .gv{width:28px;color:#fff;font-size:12.5px;font-weight:700;text-align:right}
.gbar{width:112px;height:6px;overflow:hidden;flex:none;border-radius:2px;background:#202A3D}
.gbar i{display:block;height:100%;border-radius:2px}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.itm{
  padding:10px 11px;
  border:1px solid #2A374D;
  border-left:3px solid var(--ok);
  border-radius:7px;
  background:#0B1120
}
.itm.flag{border-left-color:var(--bad);background:rgba(239,68,68,.035)}
.itm.warn{border-left-color:var(--warn);background:rgba(245,158,11,.035)}
.itm .in{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.itm .nm{color:#DFE7F1;font-size:11.5px;font-weight:600}
.itm .val{color:#fff;font-size:18px;font-weight:700}
.itm .ref{margin-top:3px;color:var(--muted);font-size:10.5px}
.g-ok{color:#86EFAC!important}.g-bad{color:#FCA5A5!important}.g-warn{color:#FCD34D!important}
.trk{display:flex;flex-direction:column;gap:8px}
.tk{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 10px;
  border:1px solid #2B384D;
  border-left:3px solid var(--warn);
  border-radius:7px;
  background:#0A1020
}
.tk.hi{border-left-color:var(--bad)}.tk.lo{border-left-color:var(--color-info)}
.tk .bx{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  flex:none;
  border:1px solid;
  border-radius:6px;
  font:700 12px "Fira Code",monospace
}
.tk .bx.hi{color:#FCA5A5;background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.4)}
.tk .bx.mid{color:#FCD34D;background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.4)}
.tk .bx.lo{color:#7DD3FC;background:rgba(56,189,248,.1);border-color:rgba(56,189,248,.4)}
.tk .in{min-width:0;flex:1}
.tk .in b{display:block;color:#EDF3FA;font-size:12px;font-weight:600}
.tk .in small{display:block;margin-top:3px;color:var(--muted);font-size:10.5px;line-height:1.4}
.tk .rt{flex:none;text-align:right}.tk .rt .dt{margin-top:3px;color:var(--muted);font:400 9.5px "Fira Code",monospace}
.drop{
  padding:22px 16px;
  border:1px dashed rgba(34,197,94,.58);
  border-radius:8px;
  background:rgba(34,197,94,.045);
  color:#86EFAC;
  font-size:13px;
  font-weight:700;
  text-align:center;
  transition:border-color .18s,background-color .18s
}
.drop:hover{border-color:var(--ok);background:rgba(34,197,94,.08)}
.drop .material-symbols-outlined{display:block;margin:0 auto 7px;font-size:30px}
.drop small{display:block;margin-top:5px;color:var(--muted);font-size:10.5px;font-weight:400}
.frow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #263248}
.frow:first-of-type{border-top:0}
.frow .fi{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  flex:none;
  border:1px solid #344258;
  border-radius:6px;
  color:#86EFAC;
  background:#11192A
}
.frow .fi .material-symbols-outlined{font-size:17px}
.frow .in{min-width:0;flex:1}
.frow .in b{display:block;overflow:hidden;color:#E7EDF6;font-size:11.5px;text-overflow:ellipsis;white-space:nowrap}
.frow .in small{display:block;margin-top:2px;color:var(--muted);font-size:10.5px}
.bchk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bc,.sc{
  padding:11px 8px;
  border:1px solid #2B374B;
  border-radius:7px;
  background:#11182A;
  text-align:center
}
.bc b,.sc b{display:block;color:#fff;font-size:18px;font-weight:700}
.bc span,.sc span{color:var(--muted);font-size:10.5px}
.draft{
  position:relative;
  padding:12px 13px;
  border:1px solid #2A374D;
  border-radius:8px;
  background:#0A1020
}
.draft+.draft{margin-top:9px}
.draft .dh{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.draft .dh .material-symbols-outlined{color:var(--ok);font-size:17px}
.draft .dh b{color:#EDF3FA;font-size:12.5px}
.draft p{margin:0;color:#C8D3E1;font-size:11.5px;line-height:1.7}
.draft .act{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.chipbtn{
  min-height:30px;
  padding:4px 9px;
  display:inline-flex;
  align-items:center;
  gap:4px;
  border:1px solid #3A485E;
  border-radius:6px;
  background:#111827;
  color:#C9D5E4;
  font-size:10.5px;
  font-weight:600;
  transition:color .18s,border-color .18s,background-color .18s
}
.chipbtn:hover{color:#fff;border-color:#64748B;background:#182236}
.chipbtn.on{color:#07130B;border-color:var(--ok);background:var(--ok)}
.chipbtn .material-symbols-outlined{font-size:14px}
.rep{overflow:hidden;border:0;border-radius:9px}
.rep .rh{
  display:flex;
  align-items:center;
  gap:13px;
  padding:16px 18px;
  color:#fff;
  border-bottom:1px solid rgba(34,197,94,.4);
  background:
    linear-gradient(100deg,rgba(34,197,94,.11),transparent 45%),
    #0B1221
}
.rep .rh .ra{
  width:48px;
  height:48px;
  display:grid;
  place-items:center;
  flex:none;
  border:1px solid rgba(34,197,94,.5);
  border-radius:7px;
  color:#86EFAC;
  background:#111D2C;
  font:700 19px "Fira Code",monospace
}
.rep .rh b{font-size:16px}
.rep .rh small{display:block;margin-top:3px;color:#AFC0D3;font:400 10.5px "Fira Code",monospace}
.rep .rh .rscore{
  margin-left:auto;
  padding:7px 15px;
  flex:none;
  border:1px solid rgba(239,68,68,.38);
  border-radius:7px;
  background:rgba(239,68,68,.08);
  text-align:center
}
.rep .rh .rscore b{display:block;color:#FCA5A5;font-size:24px}
.rep .rh .rscore span{display:block;color:#D5A6A6;font-size:9.5px}
.rep .rb{padding:15px 18px;background:#090F1D}
.sec{margin-bottom:15px}.sec:last-child{margin-bottom:0}
.sec h4{
  margin:0 0 8px;
  display:flex;
  align-items:center;
  gap:6px;
  color:#86EFAC;
  font-size:12px;
  font-weight:700
}
.sec h4 .material-symbols-outlined{font-size:16px}
.sec ul{margin:0;padding-left:18px;color:#C8D3E1;font-size:11.5px;line-height:1.75}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
.note{margin:11px 0 0;color:var(--muted);font-size:10.5px;line-height:1.6}
.btn{
  min-height:38px;
  padding:0 14px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  border:1px solid var(--ok);
  border-radius:7px;
  background:var(--ok);
  color:#061109;
  font-weight:700;
  font-size:11.5px;
  box-shadow:0 0 16px rgba(34,197,94,.1);
  transition:filter .18s,transform .18s,box-shadow .18s
}
.btn:hover{filter:brightness(1.08);box-shadow:0 0 20px rgba(34,197,94,.22);transform:translateY(-1px)}
.btn.ghost{color:#DCE6F2;border-color:#415069;background:#111827;box-shadow:none}
.btn.ghost:hover{border-color:#64748B;background:#182236}
.btn .material-symbols-outlined{font-size:17px}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:7px;color:var(--muted);font-size:10.5px}
.legend i{width:9px;height:9px;display:inline-block;margin-right:5px;border-radius:2px;vertical-align:middle}
.status-message{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:11px;
  padding:10px 12px;
  border:1px solid;
  border-radius:7px;
  font-size:11.5px;
  font-weight:600
}
.status-message.ok{color:#A7F3D0;border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.08)}
.status-message.bad{color:#FECACA;border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.08)}
.mono{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
@media(max-width:1050px){
  .top{grid-template-columns:auto 1fr}.who{display:none}
  .g2,.g21,.g12{grid-template-columns:1fr}
}
@media(max-width:768px){
  .top{padding:9px 14px;gap:12px}
  .brand span:not(.material-symbols-outlined){display:none}
  .nav button{min-width:40px;justify-content:center;padding:8px}
  .nav button>span:not(.material-symbols-outlined):not(.badge){display:none}
  .wrap{padding:16px 14px 28px}
  .vh{align-items:flex-start;flex-direction:column}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g11{grid-template-columns:1fr}
}
@media(max-width:520px){
  .top{grid-template-columns:40px 1fr}
  .brand>div:last-child{display:none}
  .nav{justify-content:flex-start}
  .kpis,.items,.bchk{grid-template-columns:1fr}
  .card{padding:12px}
  .score{justify-content:center}

}

 charts.push(c);
}

function show(i){
 nav.querySelectorAll("button").forEach(function(b){
  var active=+b.dataset.i===i;
  b.classList.toggle("on",active);
  b.setAttribute("aria-current",active?"page":"false");
 });
 vt.textContent=MOD[i][2];
 vd.textContent=MOD[i][3];
 view.innerHTML=SCREENS[i]();
 void view.offsetHeight;
 draw(i);
}
nav.addEventListener("click",function(e){
 var b=e.target.closest("button[data-i]");
 if(!b)return;
 var i=+b.dataset.i;
 if(location.hash!=="#v"+i)location.hash="v"+i;
 else show(i);
});
nav.addEventListener("keydown",function(e){
 var buttons=[].slice.call(nav.querySelectorAll("button[data-i]"));
 var current=buttons.indexOf(document.activeElement);
 if(current<0)return;
 if(e.key==="ArrowRight"||e.key==="ArrowLeft"){
  e.preventDefault();
  var next=e.key==="ArrowRight"?(current+1)%buttons.length:(current-1+buttons.length)%buttons.length;
  buttons[next].focus();
 }
});
function fromHash(){
 var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
 var n=document.querySelectorAll("[data-i]").length||6;
 show(m?Math.min(+m[1],n-1):0);
 try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
