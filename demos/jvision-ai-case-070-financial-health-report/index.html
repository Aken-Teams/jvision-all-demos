<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>財務健檢報告所 · Financial Health Report</title>
<meta name="description" content="財報匯入、比率計算、風險評分到 AI 建議與健檢報告產出（純 UI 展示）。"/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{--accent:#0369a1;--accent2:#38bdf8;--ink:#0b2338;--bg:#eef4f9;--card:#fff;--line:#dbe7f1;--soft:#eef6fc;--mut:#5a7089;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
/* top nav */
.top{background:linear-gradient(120deg,#062f4c,#0369a1);border-bottom:1px solid #0b3f63;display:flex;align-items:center;gap:16px;padding:11px 22px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent2),#0ea5e9);display:grid;place-items:center;color:#062f4c;flex:none;box-shadow:0 8px 18px rgba(3,105,161,.4)}
.logo .material-symbols-outlined{font-size:23px}
.brand b{font-size:15px;font-weight:800;display:block;font-family:"Noto Sans TC";color:#fff}
.brand span{font-size:10px;color:#9fd4f2;letter-spacing:2px}
.nav{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap;min-width:0}
.nav button{border:0;background:transparent;color:#cfe4f4;font:inherit;font-weight:700;font-size:13px;padding:9px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:rgba(255,255,255,.12);color:#fff}
.nav button.on{background:#fff;color:var(--accent)}
.nav button .badge{font-size:10px;font-weight:800;background:#fda4af;color:#7f1d1d;border-radius:999px;padding:1px 7px}
.nav button.on .badge{background:#fee2e2;color:#b91c1c}
.who{display:flex;align-items:center;gap:9px;padding-left:12px;border-left:1px solid rgba(255,255,255,.2);flex:none}
.who .av{width:34px;height:34px;border-radius:50%;background:#9fd4f2;color:#062f4c;font-weight:800;display:grid;place-items:center;font-size:13px}
.who small{color:#9fd4f2;font-size:11px;display:block}
.who b{font-size:12.5px;color:#fff}
/* main */
.wrap{max-width:1300px;margin:0 auto;padding:22px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:22px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:4px 0 0;color:var(--mut);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--accent);padding:6px 13px;border-radius:999px;font-size:12px;font-weight:800;border:1px solid var(--line)}
.pill .material-symbols-outlined{font-size:16px}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden;min-width:0}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent2),var(--accent))}
.kpi .l{font-size:12px;color:var(--mut);font-weight:700}
.kpi .v{font-size:26px;font-weight:900;margin-top:5px;font-family:Inter;color:var(--ink)}
.kpi .v small{font-size:13px;color:var(--mut);font-weight:700}
.kpi .d{font-size:11.5px;font-weight:800;margin-top:3px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.24}
.up{color:var(--ok)}.dn{color:var(--bad)}
/* grid */
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .95fr}
.g11{grid-template-columns:1fr 1fr}
.g21{grid-template-columns:1.5fr 1fr}
.g12{grid-template-columns:1fr 1.5fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
.card h3{margin:0 0 13px;font-size:14.5px;font-family:"Noto Sans TC";font-weight:800;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.card h3 .grow{margin-left:auto;font-size:12px;font-weight:700;color:var(--accent);cursor:pointer}
.tag{font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:20px;white-space:nowrap;display:inline-block}
.t-ok{background:#dcfce7;color:#15803d}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#e0f2fe;color:#0369a1}.t-mut{background:#eef2f6;color:#64748b}
/* table */
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{color:var(--mut);font-weight:800;font-size:11px;background:var(--soft);text-transform:uppercase;letter-spacing:.03em}
table.data td.num{text-align:right;font-family:Inter;font-weight:700}
table.data tr:hover td{background:var(--soft)}
.scroll{overflow-x:auto}
.chart{width:100%;min-height:60px}
/* score card (signature) */
.score{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.score .ring{width:150px;flex:none}
.score .sm{flex:1;min-width:180px}
.score .big{font-size:15px;font-weight:900;font-family:"Noto Sans TC";margin:0 0 8px}
.gline{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px dashed var(--line)}
.gline:first-of-type{border-top:0}
.gline .gl{flex:1;font-size:12.5px;color:var(--mut);font-weight:700;min-width:0}
.gline .gv{font-weight:900;font-family:Inter;font-size:14px}
.gbar{height:7px;border-radius:999px;background:var(--soft);overflow:hidden;width:120px;flex:none}
.gbar i{display:block;height:100%}
/* ratio items */
.items{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.itm{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff;border-left:4px solid var(--ok)}
.itm.flag{border-left-color:var(--bad);background:#fffafa}
.itm.warn{border-left-color:var(--warn);background:#fffdf5}
.itm .in{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.itm .nm{font-size:12.5px;font-weight:700;color:var(--ink);font-family:"Noto Sans TC"}
.itm .val{font-size:19px;font-weight:900;font-family:Inter}
.itm .val.g-ok{color:var(--ok)}.itm .val.g-bad{color:var(--bad)}.itm .val.g-warn{color:var(--warn)}
.itm .ref{font-size:11px;color:var(--mut);margin-top:3px}
/* risk rows */
.trk{display:flex;flex-direction:column;gap:10px}
.tk{border:1px solid var(--line);border-radius:13px;padding:12px 14px;display:flex;gap:12px;align-items:center;border-left:4px solid var(--warn)}
.tk.hi{border-left-color:var(--bad)}.tk.lo{border-left-color:var(--accent)}
.tk .bx{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none;font-weight:900;font-size:13px}
.tk .bx.hi{background:var(--bad)}.tk .bx.mid{background:var(--warn)}.tk .bx.lo{background:var(--accent)}
.tk .in{min-width:0;flex:1}
.tk .in b{font-size:13px;font-family:"Noto Sans TC";color:var(--ink);display:block}
.tk .in small{color:var(--mut);font-size:11.5px}
.tk .rt{text-align:right;flex:none}
.tk .rt .dt{font-size:11.5px;color:var(--mut)}
/* upload / files */
.drop{border:2px dashed var(--accent2);border-radius:14px;padding:22px;text-align:center;background:var(--soft);color:var(--accent);font-weight:800;font-family:"Noto Sans TC"}
.drop .material-symbols-outlined{font-size:34px;display:block;margin:0 auto 6px}
.drop small{display:block;color:var(--mut);font-weight:600;font-size:11.5px;margin-top:5px}
.frow{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);align-items:center}.frow:first-of-type{border-top:0}
.frow .fi{width:38px;height:38px;border-radius:10px;background:var(--soft);color:var(--accent);display:grid;place-items:center;flex:none}
.frow .in{flex:1;min-width:0}.frow .in b{font-size:13px;color:var(--ink)}.frow .in small{display:block;color:var(--mut);font-size:11.5px}
/* balance check */
.bchk{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bc{background:var(--soft);border-radius:13px;padding:13px;text-align:center}
.bc b{display:block;font-size:20px;font-weight:900;color:var(--ink);font-family:Inter}
.bc span{font-size:11.5px;color:var(--mut)}
/* ai draft */
.draft{border:1px solid var(--line);border-radius:14px;padding:15px 17px;background:#fff;position:relative}
.draft+.draft{margin-top:12px}
.draft .dh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.draft .dh .material-symbols-outlined{color:var(--accent)}
.draft .dh b{font-size:13.5px;font-family:"Noto Sans TC"}
.draft p{margin:0;font-size:13px;line-height:1.75;color:#33455a}
.draft .act{display:flex;gap:8px;margin-top:11px}
.chipbtn{border:1px solid var(--line);background:#fff;color:var(--accent);border-radius:999px;padding:5px 12px;font:inherit;font-size:11.5px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.chipbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chipbtn .material-symbols-outlined{font-size:15px}
/* report */
.rep{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.rep .rh{background:linear-gradient(120deg,#062f4c,#0369a1);color:#fff;padding:18px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.rep .rh .ra{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:22px;font-weight:900;flex:none}
.rep .rh b{font-size:18px}.rep .rh small{display:block;color:#bfe0f5;font-size:12px;margin-top:2px}
.rep .rh .rscore{margin-left:auto;text-align:center;background:rgba(255,255,255,.14);border-radius:13px;padding:8px 18px;flex:none}
.rep .rh .rscore b{font-size:26px}.rep .rh .rscore span{font-size:11px;color:#bfe0f5;display:block}
.rep .rb{padding:16px 20px}
.sec{margin-bottom:16px}.sec:last-child{margin-bottom:0}
.sec h4{margin:0 0 8px;font-size:13px;font-family:"Noto Sans TC";font-weight:800;color:var(--accent);display:flex;align-items:center;gap:6px}
.sec ul{margin:0;padding-left:18px;font-size:12.5px;line-height:1.8;color:#33455a}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.sc{background:var(--soft);border-radius:13px;padding:13px;text-align:center}
.sc b{display:block;font-size:22px;font-weight:900;color:var(--ink)}
.sc span{font-size:11.5px;color:var(--mut)}
.note{font-size:11.5px;color:var(--mut);margin:13px 0 0;line-height:1.6}
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px;border-radius:10px;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font:inherit;font-weight:800;font-size:13px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--line)}
.btn .material-symbols-outlined{font-size:18px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:8px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g11,.g21,.g12{grid-template-columns:1fr}.items{grid-template-columns:1fr}.bchk{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:14px}.nav button span:not(.material-symbols-outlined){display:none}.nav button{padding:9px}.who{display:none}.kpis{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo"><span class="material-symbols-outlined">clinical_notes</span></div><div><b>財務健檢報告所</b><span>FINANCIAL HEALTH REPORT</span></div></div>
  <nav class="nav" id="nav"></nav>
  <div class="who"><span class="av">蓁</span><div><b>李佩蓁</b><small>會計 · 健檢組</small></div></div>
</header>
<main class="wrap">
  <div class="vh"><div><h2 id="vt">健檢總覽</h2><p id="vd"></p></div><span class="pill" id="vpill"><span class="material-symbols-outlined">calendar_today</span>2026 Q2 · 截止 2026-07-31</span></div>
  <div id="view"></div>
</main>
<script>
var MOD=[
["健檢總覽","dashboard","健檢總覽","客戶健檢戰情、風險燈號與交期追蹤",""],
["財報匯入","upload_file","財報匯入","資產負債 / 損益 / 現金流三表匯入與平衡校驗",""],
["比率分析","calculate","比率分析","流動性、負債、獲利、週轉四類比率與產業對照",""],
["風險評分","shield","風險評分","財務健檢分數、風險雷達與紅旗依據","3"],
["AI 建議","auto_awesome","AI 建議","AI 生成觀察與改善建議草稿供覆核","4"],
["健檢報告","description","健檢報告","一鍵產出可比較的財務健檢報告與複核紀錄",""]];

// data
var CLIENTS=[
["FHR-070-01","宏達精密","電子零組件","李佩蓁","2026-07-20","hi","負債比偏高 82%","待覆核",58],
["FHR-070-02","青田食品","食品製造","王思婷","2026-07-23","hi","營運現金流轉負","風險評分",52],
["FHR-070-03","禾豐貿易","批發貿易","陳冠廷","2026-07-28","mid","應收帳齡拉長","建議草擬",67],
["FHR-070-04","立言科技","軟體服務","李佩蓁","2026-07-25","lo","獲利穩健成長","已核准",84],
["FHR-070-05","鼎泰營造","營造工程","王思婷","2026-07-30","mid","存貨週轉趨緩","比率分析",64],
["FHR-070-06","昌盛紡織","紡織成衣","陳冠廷","2026-08-02","lo","結構健康","待匯入",79],
["FHR-070-07","華聚生醫","生技醫療","李佩蓁","2026-08-05","hi","研發燒錢流動性緊","財報匯入",49],
["FHR-070-08","永新物流","運輸倉儲","王思婷","2026-08-08","lo","週轉良好","已核准",81]];

var FILES=[
["宏達精密_2026Q2_資產負債表.xlsx","balance","科目 62 筆 · 借貸平衡","done"],
["宏達精密_2026Q2_損益表.xlsx","income","科目 38 筆 · 已對應","done"],
["宏達精密_2026Q2_現金流量表.xlsx","cashflow","科目 24 筆 · 已對應","done"],
["宏達精密_2025Q2_三表(比較期).xlsx","history","去年同期 · 供趨勢對照","done"],
["應收帳款帳齡明細.csv","aging","112 筆客戶帳齡","warn"]];

// ratios: [name, value, unit, ref, grade, industry]
var RATIOS=[
["流動比率","0.94","倍","≥ 1.5","bad","1.62"],
["速動比率","0.61","倍","≥ 1.0","bad","1.18"],
["負債比率","82.3","%","≤ 60","bad","54.0"],
["利息保障倍數","2.1","倍","≥ 3.0","warn","4.6"],
["毛利率","23.8","%","≥ 25","warn","27.5"],
["淨利率","4.2","%","≥ 6","warn","7.1"],
["股東權益報酬率","6.8","%","≥ 10","warn","12.3"],
["應收帳款週轉","5.4","次","≥ 8","bad","8.9"],
["存貨週轉","6.1","次","≥ 7","warn","7.8"],
["總資產週轉","0.82","次","≥ 1.0","warn","1.05"]];

// risk: [name, dim, score, weight, grade, reason]
var RISK=[
["流動性風險","流動性",42,25,"hi","流動比 0.94 低於安全門檻，短期償債能力不足"],
["財務結構風險","負債",38,25,"hi","負債比 82.3%、利息保障倍數僅 2.1 倍"],
["獲利能力風險","獲利",64,20,"mid","毛利與淨利低於產業平均，成長趨緩"],
["營運週轉風險","週轉",58,20,"mid","應收帳款週轉 5.4 次，帳齡拉長綁住現金"],
["成長與現金流","現金流",71,10,"lo","本業仍有正現金流，但受應收擴大侵蝕"]];

// ai drafts: [tag, title, body]
var DRAFTS=[
["流動性","短期償債能力偏弱，建議強化現金部位","公司流動比率 0.94 倍、速動比率 0.61 倍，均低於產業安全水位，顯示以短期負債支應營運的比重偏高。建議與往來銀行協商展延部分短期借款、加速收回逾期應收帳款，並將 30 天以上帳款列為專案追蹤，逐步把流動比率拉回 1.2 倍以上。"],
["負債結構","負債比率偏高，宜降低財務槓桿","負債比率 82.3%、利息保障倍數 2.1 倍，財務槓桿高於同業（54%）。一旦獲利下滑，利息負擔將快速侵蝕本業。建議優先償還高利率短期借款、暫緩非必要資本支出，並評估以增資或處分閒置資產改善資本結構。"],
["營運週轉","應收與存貨週轉趨緩，現金被綁住","應收帳款週轉降至 5.4 次、存貨週轉 6.1 次，均低於同業。建議檢視前五大客戶信用條件、對帳齡超過 60 天者調整付款折扣誘因，並清理呆滯存貨，釋放約 1,800 萬元現金流。"],
["整體結論","綜合健檢：中高風險，建議列入季度追蹤","綜合流動性、負債結構與週轉表現，本期財務健檢分數 58 分（中高風險）。核心風險集中在短期償債與財務槓桿。若能於下季改善流動比與降低短債，分數可望回升至 70 分區間。建議列入高風險客戶季度追蹤名單。"]];

var nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
nav.innerHTML=MOD.map(function(m,i){return '<button data-i="'+i+'" class="'+(i===0?'on':'')+'"><span class="material-symbols-outlined">'+m[1]+'</span><span>'+m[0]+'</span>'+(m[4]?'<span class="badge">'+m[4]+'</span>':'')+'</button>';}).join('');

var gradeCls={ok:'g-ok',warn:'g-warn',bad:'g-bad'};
var gradeColor={hi:'#dc2626',mid:'#d97706',lo:'#0369a1'};
