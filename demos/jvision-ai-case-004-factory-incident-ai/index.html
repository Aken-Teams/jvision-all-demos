<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>工廠異常解碼台 · Incident War Room</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--accent:#f97316;--red:#ef4444;--amber:#f59e0b;--green:#22c55e;--bg:#0a0e16;--panel:#111826;--panel2:#0e1520;--line:#1e2a3c;--ink:#e7edf5;--mut:#8595ab}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.top{background:linear-gradient(90deg,#0d1420,#161f2e);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:11px 20px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--red),var(--accent));display:grid;place-items:center;font-weight:900;color:#180a02;flex:none;box-shadow:0 0 20px rgba(249,115,22,.55)}
.brand b{font-size:15px;font-weight:800;display:block;font-family:"Noto Sans TC"}
.brand span{font-size:10px;color:var(--accent);letter-spacing:2px}
.nav{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap;min-width:0}
.nav button{border:0;background:transparent;color:var(--mut);font:inherit;font-weight:600;font-size:13px;padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:#1a2436;color:var(--ink)}
.nav button.on{background:linear-gradient(135deg,var(--red),var(--accent));color:#fff}
.wrap{max-width:1300px;margin:0 auto;padding:20px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:20px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.siren{background:rgba(239,68,68,.14);color:#fca5a5;border:1px solid rgba(239,68,68,.4);padding:6px 13px;border-radius:8px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:7px}
.siren i{width:9px;height:9px;border-radius:50%;background:var(--red);display:inline-block;animation:bl .9s infinite}
@keyframes bl{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(239,68,68,.6)}50%{opacity:.4;box-shadow:0 0 0 6px rgba(239,68,68,0)}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 15px;position:relative}
.kpi .l{font-size:11.5px;color:var(--mut);font-weight:600}
.kpi .v{font-size:24px;font-weight:800;margin-top:3px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.grid{display:grid;gap:15px}.grid>*{min-width:0}
.g2{grid-template-columns:1.4fr .85fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px}
.card h3{margin:0 0 12px;font-size:13.5px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap;color:var(--ink)}
.card h3 .material-symbols-outlined{color:var(--accent)}
.andon{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}
.az{border-radius:12px;padding:13px;border:1px solid var(--line);position:relative;overflow:hidden}
.az.g{background:linear-gradient(135deg,rgba(34,197,94,.14),var(--panel2));border-color:rgba(34,197,94,.4)}
.az.a{background:linear-gradient(135deg,rgba(245,158,11,.16),var(--panel2));border-color:rgba(245,158,11,.45)}
.az.r{background:linear-gradient(135deg,rgba(239,68,68,.2),var(--panel2));border-color:rgba(239,68,68,.55)}
.az b{font-family:"Noto Sans TC";font-size:14px;display:block}
.az .stt{font-size:11px;font-weight:800;margin-top:6px;display:flex;align-items:center;gap:5px}
.az small{color:var(--mut);font-size:11px;display:block;margin-top:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.g{background:var(--green)}.dot.a{background:var(--amber)}.dot.r{background:var(--red);animation:bl .9s infinite}
.feed{display:flex;flex-direction:column;gap:8px}
.fi{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:9px;background:var(--panel2);border-left:3px solid var(--mut)}
.fi.r{border-color:var(--red)}.fi.a{border-color:var(--amber)}
.fi .material-symbols-outlined{font-size:18px;flex:none}
.fi.r .material-symbols-outlined{color:var(--red)}.fi.a .material-symbols-outlined{color:var(--amber)}
.fi b{font-size:12.5px;font-family:"Noto Sans TC"}
.fi small{display:block;color:var(--mut);font-size:11px;margin-top:1px}
.fi .tm{margin-left:auto;color:var(--mut);font-size:10.5px;white-space:nowrap;flex:none}
.chart{height:220px}
.tag{font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;white-space:nowrap}
.t-r{background:rgba(239,68,68,.2);color:#fca5a5}.t-a{background:rgba(245,158,11,.2);color:#fcd34d}.t-b{background:rgba(59,130,246,.2);color:#93c5fd}.t-g{background:rgba(34,197,94,.2);color:#86efac}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px}
table.data tr:hover td{background:var(--panel2)}
.disp{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:13px}
.dc{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:14px}
.dc .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.dc .h b{font-family:Inter;font-weight:800;font-size:13px;color:var(--accent)}
.dc .who{display:flex;align-items:center;gap:8px;margin:8px 0}
.dc .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--accent));display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;font-family:"Noto Sans TC"}
.dc .prog{height:6px;background:#1a2436;border-radius:5px;overflow:hidden;margin:9px 0 4px}
.dc .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--accent))}
.dc small{color:var(--mut);font-size:11px}
.rc{display:grid;grid-template-columns:1.1fr .9fr;gap:15px}.rc>*{min-width:0}
.cause{display:flex;flex-direction:column;gap:10px}
.cz{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:var(--panel2)}
.cz .ct{display:flex;justify-content:space-between;align-items:center}
.cz b{font-family:"Noto Sans TC";font-size:13px}
.cz .pb{height:7px;background:#1a2436;border-radius:5px;overflow:hidden;margin-top:7px}
.cz .pb i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--red))}
.cz small{color:var(--mut);font-size:11px;display:block;margin-top:5px}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.ti{position:relative;padding:0 0 15px 4px}
.ti::before{content:"";position:absolute;left:-20px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid var(--panel)}
.ti .tt{font-size:12.5px;font-family:"Noto Sans TC";font-weight:700}
.ti small{color:var(--mut);font-size:11px}
.kb{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:13px}
.kc{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:14px}
.kc .material-symbols-outlined{color:var(--accent);font-size:24px}
.kc b{display:block;font-family:"Noto Sans TC";font-size:14px;margin:7px 0 5px}
.kc p{margin:0;font-size:12px;color:var(--mut);line-height:1.6}
.kc .mt{margin-top:9px;font-size:11px;color:var(--accent);font-weight:700}
.scroll{overflow-x:auto}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.g2,.rc{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:14px}.nav button span:not(.material-symbols-outlined){display:none}.nav button{padding:9px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo">碼</div><div><b>工廠異常解碼台</b><span>INCIDENT WAR ROOM</span></div></div>
  <nav class="nav" id="nav"></nav>
</header>
<main class="wrap">
  <div class="vh"><div><h2 id="vt">異常監控</h2><p id="vd"></p></div><div class="siren"><i></i>2 起高風險異常處理中</div></div>
  <div id="view"></div>
</main>
<script>
const MOD=[["異常監控","monitor_heart","異常即時監控","整合設備、產線、品質訊號的即時異常 andon 看板"],
["通報立案","campaign","通報立案","異常案件通報、分級與立案追蹤"],
["派工處置","engineering","派工處置","處置派工、進度追蹤與停機影響"],
["AI 根因","psychology","AI 根因研判","AI 比對訊號與歷史案例推論根因與對策"],
["復原追蹤","restart_alt","復原追蹤","復原確認、再發防止與案件結案"],
["知識庫","menu_book","異常知識庫","案例、對策與標準作業知識累積"]];
const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span><span>'+m[0]+'</span>';b.onclick=()=>show(i);nav.appendChild(b);});

const ZONES=[["A 線 沖壓","g","正常","OEE 92% · 0 異常"],["B 線 焊接","r","異常停機","主軸振動超標 · 停機 12 分"],["C 線 塗裝","a","警示","VOC 濃度偏高趨勢"],["D 線 組裝","g","正常","OEE 88% · 0 異常"],["E 線 檢測","a","警示","CCD 誤判率上升"],["F 線 包裝","g","正常","OEE 95% · 0 異常"]];
const FEED=[["B 線 主軸振動 4.8mm/s","超過警戒值，自動立案 INC-2208","r","2 分前"],["C 線 VOC 118ppm","逼近上限 120ppm，建議通風","a","8 分前"],["E 線 CCD 誤判率 3.2%","連續 5 批上升，建議校正","a","15 分前"],["A 線 換模完成","恢復生產，稼動正常","g","31 分前"]];
const CASES=[["INC-2208","B 線焊接","主軸振動超標","高","處理中","t-r","10:42"],["INC-2207","C 線塗裝","VOC 濃度偏高","中","派工中","t-a","10:34"],["INC-2206","E 線檢測","CCD 誤判上升","中","研判中","t-a","10:27"],["INC-2205","D 線組裝","扭力值飄移","低","已結案","t-g","09:50"],["INC-2204","A 線沖壓","模具異音","中","已結案","t-g","09:12"]];
const DISP=[["INC-2208","B 線 主軸振動","林","林俊男 · 設備工程",65,"更換軸承中 · 預計 15 分復機"],["INC-2207","C 線 VOC 偏高","陳","陳怡君 · 廠務",30,"啟動強制排風 · 監測中"],["INC-2206","E 線 CCD 誤判","黃","黃志偉 · 品保",45,"重新校正光源與參數"]];
const CAUSES=[["主軸軸承磨損",78,"振動頻譜 BPFO 特徵明顯，與 3 起歷史案例吻合"],["潤滑不足",54,"潤滑週期已逾 220 小時，超出建議 200 小時"],["聯軸器對心偏差",31,"近 2 週振動趨勢緩升，符合對心不良模式"]];
const SIMILAR=[["INC-1987","2026-05 B 線主軸振動","更換 7014C 軸承後復機","已驗證"],["INC-1802","2026-02 A 線主軸異音","調整潤滑週期至 180h","已驗證"]];
const RECOV=[["10:42 異常告警觸發","系統 · B 線主軸振動 4.8mm/s"],["10:45 通報立案 INC-2208","現場 · 判定高風險、停機處置"],["10:52 派工林俊男處置","工程 · 研判軸承磨損，領用備品"],["11:08 更換軸承並動平衡","工程 · 振動降至 1.1mm/s"],["11:15 試車確認復機","主管 · 稼動恢復，結案並列入知識庫"]];
const KB=[["build","主軸振動異常處置 SOP","BPFO 特徵→軸承磨損→停機更換→動平衡校正，附標準工時與備品清單。","引用 12 次"],["science","VOC 濃度異常對策","偏高時強制排風、追溯塗料批次與環溫，超標即停線通報環安。","引用 7 次"],["visibility","CCD 誤判率上升處理","校正光源、更新樣本與閾值，必要時重訓模型。","引用 5 次"],["bolt","扭力飄移快速判斷","檢查氣壓、扭力槍校期與治具鎖點，30 秒定位。","引用 9 次"]];

const SCREENS=[
()=>`<div class="kpis">
 <div class="kpi"><div class="l">今日異常數</div><div class="v">14</div><div class="d" style="color:#fca5a5">2 高 · 4 中 · 8 低</div></div>
 <div class="kpi"><div class="l">處理中</div><div class="v" style="color:#fdba74">3</div><div class="d" style="color:var(--mut)">平均處置 18 分</div></div>
 <div class="kpi"><div class="l">MTTR 平均修復</div><div class="v">25<small style="font-size:12px"> 分</small></div><div class="d" style="color:#86efac">▼ 較 90 分</div></div>
 <div class="kpi"><div class="l">今日停機時數</div><div class="v">0.4<small style="font-size:12px"> h</small></div><div class="d" style="color:#86efac">▼ 較 3.2h</div></div>
</div>
<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">grid_view</span>產線異常 Andon 看板</h3><div class="andon">${ZONES.map(z=>`<div class="az ${z[1]}"><b>${z[0]}</b><div class="stt"><span class="dot ${z[1]}"></span>${z[2]}</div><small>${z[3]}</small></div>`).join('')}</div></div>
 <div class="card"><h3><span class="material-symbols-outlined">rss_feed</span>即時異常訊號流</h3><div class="feed">${FEED.map(f=>`<div class="fi ${f[2]}"><span class="material-symbols-outlined">${f[2]=='r'?'error':f[2]=='a'?'warning':'check_circle'}</span><div><b>${f[0]}</b><small>${f[1]}</small></div><span class="tm">${f[3]}</span></div>`).join('')}</div><h3 style="margin-top:14px"><span class="material-symbols-outlined">show_chart</span>B 線主軸振動</h3><div class="chart" id="c_sig" style="height:150px"></div></div>
</div>`,
()=>`<div class="grid g2"><div class="card"><h3><span class="material-symbols-outlined">list_alt</span>異常案件</h3><div class="scroll"><table class="data"><tr><th>案號</th><th>來源</th><th>異常</th><th>等級</th><th>狀態</th><th>時間</th></tr>${CASES.map(c=>`<tr><td><b style="color:var(--accent)">${c[0]}</b></td><td>${c[1]}</td><td>${c[2]}</td><td><span class="tag ${c[3]=='高'?'t-r':c[3]=='中'?'t-a':'t-b'}">${c[3]}</span></td><td><span class="tag ${c[5]}">${c[4]}</span></td><td>${c[6]}</td></tr>`).join('')}</table></div></div><div class="card"><h3><span class="material-symbols-outlined">donut_large</span>異常等級分佈</h3><div class="chart" style="height:250px" id="c_lv"></div></div></div>`,
()=>`<div class="card"><h3><span class="material-symbols-outlined">engineering</span>處置派工看板 <span class="tag t-r" style="margin-left:auto">進行中 3</span></h3><div class="disp">${DISP.map(d=>`<div class="dc"><div class="h"><b>${d[0]}</b><span class="tag t-a">處置中</span></div><small style="color:var(--ink)">${d[1]}</small><div class="who"><span class="av">${d[2]}</span><small>${d[3]}</small></div><div class="prog"><i style="width:${d[4]}%"></i></div><small>${d[5]}</small></div>`).join('')}</div></div>`,
()=>`<div class="rc"><div class="card"><h3><span class="material-symbols-outlined">psychology</span>AI 根因研判 · INC-2208</h3><p style="color:var(--mut);font-size:12.5px;margin:0 0 12px">B 線焊接主軸振動 4.8mm/s，AI 依訊號頻譜與歷史案例推論可能根因：</p><div class="cause">${CAUSES.map(c=>`<div class="cz"><div class="ct"><b>${c[0]}</b><span style="font-family:Inter;font-weight:800;color:var(--accent)">${c[1]}%</span></div><div class="pb"><i style="width:${c[1]}%"></i></div><small>${c[2]}</small></div>`).join('')}</div></div><div class="card"><h3><span class="material-symbols-outlined">history</span>相似歷史案例</h3>${SIMILAR.map(s=>`<div class="cz" style="margin-bottom:10px"><b>${s[0]}</b><small style="margin-top:3px">${s[1]}</small><small>對策：${s[2]} · <span class="tag t-g">${s[3]}</span></small></div>`).join('')}<div class="cz" style="border-color:rgba(249,115,22,.5)"><b style="color:var(--accent)">建議對策</b><small>停機更換主軸軸承（SP-BR08），完成後動平衡校正並縮短潤滑週期至 180 小時。</small></div></div></div>`,
()=>`<div class="grid g2"><div class="card"><h3><span class="material-symbols-outlined">timeline</span>INC-2208 復原歷程</h3><div class="tl">${RECOV.map(r=>`<div class="ti"><div class="tt">${r[0]}</div><small>${r[1]}</small></div>`).join('')}</div></div><div class="card"><h3><span class="material-symbols-outlined">verified</span>再發防止追蹤</h3><div class="cz" style="margin-bottom:10px"><b>縮短潤滑週期</b><small>200h → 180h，已更新保養排程 · <span class="tag t-g">已執行</span></small></div><div class="cz" style="margin-bottom:10px"><b>加裝振動連續監測</b><small>B 線主軸新增感測點 · <span class="tag t-a">進行中</span></small></div><div class="cz"><b>納入知識庫 SOP</b><small>主軸振動處置標準化 · <span class="tag t-g">已完成</span></small></div></div></div>`,
()=>`<div class="card"><h3><span class="material-symbols-outlined">menu_book</span>異常處置知識庫</h3><div class="kb">${KB.map(k=>`<div class="kc"><span class="material-symbols-outlined">${k[0]}</span><b>${k[1]}</b><p>${k[2]}</p><div class="mt">${k[3]}</div></div>`).join('')}</div></div>`
];
function draw(i){
 if(i==0){const c=echarts.init(document.getElementById('c_sig'));c.setOption({grid:{left:34,right:10,top:12,bottom:20},tooltip:{trigger:'axis'},xAxis:{type:'category',data:['','','','','','','now'],axisLabel:{color:'#8595ab',fontSize:9},axisLine:{lineStyle:{color:'#1e2a3c'}}},yAxis:{type:'value',axisLabel:{color:'#8595ab',fontSize:9},splitLine:{lineStyle:{color:'#1e2a3c'}}},series:[{type:'line',smooth:true,data:[1.2,1.5,2.3,3.2,3.9,4.4,4.8],areaStyle:{color:'rgba(239,68,68,.15)'},lineStyle:{color:'#ef4444',width:2.5},itemStyle:{color:'#ef4444'},markLine:{silent:true,data:[{yAxis:4.5}],lineStyle:{color:'#f59e0b',type:'dashed'},label:{formatter:'警戒',color:'#fcd34d',fontSize:9}}}]});}
