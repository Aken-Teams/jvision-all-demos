<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>工廠異常與改善追蹤台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
--color-primary:#2563EB;--color-on-primary:#FFF;--color-secondary:#3B82F6;
--color-on-secondary:#000;--color-accent:#EA580C;--color-on-accent:#000;
--color-background:#F8FAFC;--color-foreground:#1E293B;--color-card:#FFF;
--color-card-foreground:#1E293B;--color-muted:#E9EFF8;--color-muted-foreground:#475569;
--color-border:#E2E8F0;--color-destructive:#DC2626;--color-on-destructive:#FFF;
--color-ring:#2563EB;--blue:#2563EB;--ink:#1E293B;--muted:#475569;--line:#E2E8F0;
--green:#15803D;--amber:#A16207;--red:#DC2626;--shadow:0 10px 28px rgba(30,41,59,.07)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Fira Sans",sans-serif;line-height:1.5}
button{font:inherit}
button,.az,.dc,.kc,.cz{transition:border-color .2s,background-color .2s,box-shadow .2s,transform .2s}
button{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.material-symbols-outlined{font-size:20px;line-height:1;vertical-align:middle}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:28px;min-height:72px;padding:12px max(24px,calc((100vw - 1360px)/2));background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);box-shadow:0 4px 18px rgba(30,41,59,.04);backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:12px;min-width:245px}
.logo{display:grid;place-items:center;width:42px;height:42px;flex:none;background:var(--blue);color:#fff;border-radius:8px;font:700 16px "Fira Code";box-shadow:5px 5px 0 #BFDBFE}
.brand b{display:block;font-size:16px;font-weight:700;letter-spacing:.02em}
.brand span{display:block;margin-top:1px;color:var(--muted);font:500 9px "Fira Code";letter-spacing:.16em}
.nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{display:flex;align-items:center;gap:7px;min-height:44px;padding:9px 12px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--muted);font-weight:600;white-space:nowrap}
.nav button:hover{background:var(--color-muted);color:var(--ink)}
.nav button.on{background:var(--blue);color:#fff;box-shadow:0 5px 14px rgba(37,99,235,.22)}
.wrap{max-width:1360px;margin:auto;padding:30px 24px 54px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}
.vh h2{margin:0;font-size:clamp(24px,3vw,34px);line-height:1.2;letter-spacing:-.03em}
.vh p{max-width:700px;margin:7px 0 0;color:var(--muted);font-size:14px}
.siren{display:flex;align-items:center;gap:8px;min-height:38px;padding:7px 12px;border:1px solid #FCA5A5;border-radius:6px;background:#FEF2F2;color:#991B1B;font-size:12px;font-weight:700;white-space:nowrap}
.siren .material-symbols-outlined{font-size:18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{position:relative;overflow:hidden;padding:18px;background:var(--color-card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.kpi:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--blue)}
.kpi .l{color:var(--muted);font-size:12px;font-weight:600}
.kpi .v{margin-top:5px;font:700 28px "Fira Code";letter-spacing:-.04em}
.kpi .d{margin-top:3px;font-size:11px;font-weight:600}
.positive{color:#166534}.warning{color:#9A3412}.danger{color:#B91C1C}
.grid{display:grid;gap:16px}.grid>*{min-width:0}.g2{grid-template-columns:1.45fr .9fr}
.card{padding:18px;background:var(--color-card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.card h3{display:flex;align-items:center;gap:8px;margin:0 0 15px;font-size:14px;font-weight:700;letter-spacing:.01em}
.card h3 .material-symbols-outlined{color:var(--blue)}
.andon{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.az{position:relative;padding:14px;border:1px solid var(--line);border-radius:6px;background:#fff}
.az:hover,.dc:hover,.kc:hover,.cz:hover{transform:translateY(-2px);border-color:#93C5FD;box-shadow:0 8px 20px rgba(30,41,59,.08)}
.az.g{border-left:4px solid var(--green);background:#F0FDF4}
.az.a{border-left:4px solid var(--amber);background:#FFFBEB}
.az.r{border-left:4px solid var(--red);background:#FEF2F2}
.az b{display:block;font-size:14px}
.az .stt{display:flex;align-items:center;gap:5px;margin-top:7px;font-size:11px;font-weight:700}
.az small,.fi small,.dc small,.cz small,.ti small{display:block;color:var(--muted);font-size:11px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%}
.dot.g{background:var(--green)}.dot.a{background:var(--amber)}.dot.r{background:var(--red)}
.feed{display:flex;flex-direction:column;gap:8px}
.fi{display:flex;align-items:flex-start;gap:9px;padding:10px;border-left:3px solid #64748B;border-radius:4px;background:#F8FAFC}
.fi.r{border-color:var(--red)}.fi.a{border-color:var(--amber)}
.fi .material-symbols-outlined{flex:none;font-size:18px;color:#475569}
.fi.r .material-symbols-outlined{color:var(--red)}.fi.a .material-symbols-outlined{color:var(--amber)}
.fi b{font-size:12px}.fi .tm{margin-left:auto;color:var(--muted);font:500 10px "Fira Code";white-space:nowrap}
.chart{height:220px}.scroll{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:12px}
table.data th,table.data td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{background:#F1F5F9;color:#334155;font-size:11px;font-weight:700;letter-spacing:.02em}
table.data tr:hover td{background:#EFF6FF}
table.data td:first-child,table.data td:last-child{font-family:"Fira Code"}
table.data th:last-child,table.data td:last-child{text-align:right}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1px solid currentColor;border-radius:99px;font-size:10px;font-weight:700;line-height:1.2;white-space:nowrap}
.t-r{background:#FEF2F2;color:#B91C1C}.t-a{background:#FFFBEB;color:#92400E}
.t-b{background:#EFF6FF;color:#1D4ED8}.t-g{background:#F0FDF4;color:#166534}
.disp{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.dc,.cz,.kc{padding:15px;border:1px solid var(--line);border-radius:6px;background:#F8FAFC}
.dc .h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.dc .h b{color:var(--blue);font:700 13px "Fira Code"}
.dc .who{display:flex;align-items:center;gap:8px;margin:10px 0}
.av{display:grid;place-items:center;width:30px;height:30px;border-radius:4px;background:var(--blue);color:#fff;font-weight:700}
.prog,.pb{height:7px;margin:9px 0 5px;overflow:hidden;border-radius:99px;background:#DBE4F0}
.prog i,.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--color-secondary))}
.rc{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.rc>*{min-width:0}
.cause{display:flex;flex-direction:column;gap:10px}
.cz .ct{display:flex;align-items:center;justify-content:space-between}
.cz b{font-size:13px}.cz .ct span{font-family:"Fira Code"}
.tl{position:relative;padding-left:24px}
.tl:before{content:"";position:absolute;top:4px;bottom:4px;left:6px;width:2px;background:#BFDBFE}
.ti{position:relative;padding:0 0 17px 5px}
.ti:before{content:"";position:absolute;top:2px;left:-23px;width:12px;height:12px;border:3px solid #DBEAFE;border-radius:50%;background:var(--blue)}
.ti .tt{font-size:12px;font-weight:700}
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kc .material-symbols-outlined{color:var(--blue);font-size:25px}
.kc b{display:block;margin:8px 0 5px;font-size:14px}
.kc p{margin:0;color:var(--muted);font-size:12px;line-height:1.65}
.kc .mt{margin-top:10px;color:#1D4ED8;font:600 11px "Fira Code"}
.mono{font-family:"Fira Code"}
@keyframes reveal{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.kpi,.card,.az,.dc,.kc{animation:reveal .4s both}
.kpi:nth-child(2),.az:nth-child(2),.dc:nth-child(2),.kc:nth-child(2){animation-delay:.06s}
.kpi:nth-child(3),.az:nth-child(3),.dc:nth-child(3),.kc:nth-child(3){animation-delay:.12s}
.kpi:nth-child(4),.az:nth-child(4),.kc:nth-child(4){animation-delay:.18s}
@media(max-width:1024px){.top{align-items:flex-start;flex-direction:column;gap:8px}.nav{width:100%;margin:0}.kpis{grid-template-columns:repeat(2,1fr)}.g2,.rc{grid-template-columns:1fr}.kb{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.wrap{padding:22px 16px 42px}.vh{align-items:flex-start;flex-direction:column}.andon,.disp{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.top{padding:10px 14px}.brand{min-width:0}.nav button{padding:9px}.nav button span:last-child{display:none}.kpis,.andon,.disp,.kb{grid-template-columns:1fr}.card{padding:14px}.siren{white-space:normal}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
<div class="brand"><div class="logo">JT</div><div><b>工廠異常與改善追蹤台</b><span>PRODUCTION OPERATIONS</span></div></div>
<nav class="nav" id="nav" aria-label="主要功能"></nav>
</header>
<main class="wrap">
<div class="vh"><div><h2 id="vt">異常監控</h2><p id="vd"></p></div><div class="siren"><span class="material-symbols-outlined" aria-hidden="true">crisis_alert</span>2 起高風險異常處理中</div></div>
<div id="view"></div>
</main>
<script>
const MOD=[["異常監控","monitor_heart","異常即時監控","整合設備、產線、品質訊號的即時異常 andon 看板"],["通報立案","campaign","通報立案","異常案件通報、分級與立案追蹤"],["派工處置","engineering","派工處置","處置派工、進度追蹤與停機影響"],["AI 根因","psychology","AI 根因研判","AI 比對訊號與歷史案例推論根因與對策"],["復原追蹤","restart_alt","復原追蹤","復原確認、再發防止與案件結案"],["知識庫","menu_book","異常知識庫","案例、對策與標準作業知識累積"]];
const nav=document.getElementById("nav"),view=document.getElementById("view"),vt=document.getElementById("vt"),vd=document.getElementById("vd");
MOD.forEach((m,i)=>{const b=document.createElement("button");b.dataset.i=i;b.type="button";b.setAttribute("aria-label",m[0]);b.innerHTML=`<span class="material-symbols-outlined" aria-hidden="true">${m[1]}</span><span>${m[0]}</span>`;b.onclick=()=>{location.hash=`v${i}`};nav.appendChild(b)});
const ZONES=[["A 線 沖壓","g","正常","OEE 92% · 0 異常"],["B 線 焊接","r","異常停機","主軸振動超標 · 停機 12 分"],["C 線 塗裝","a","警示","VOC 濃度偏高趨勢"],["D 線 組裝","g","正常","OEE 88% · 0 異常"],["E 線 檢測","a","警示","CCD 誤判率上升"],["F 線 包裝","g","正常","OEE 95% · 0 異常"]];
const FEED=[["B 線 主軸振動 4.8mm/s","超過警戒值，自動立案 INC-2208","r","2 分前"],["C 線 VOC 118ppm","逼近上限 120ppm，建議通風","a","8 分前"],["E 線 CCD 誤判率 3.2%","連續 5 批上升，建議校正","a","15 分前"],["A 線 換模完成","恢復生產，稼動正常","g","31 分前"]];
const CASES=[["INC-2208","B 線焊接","主軸振動超標","高","處理中","t-r","10:42"],["INC-2207","C 線塗裝","VOC 濃度偏高","中","派工中","t-a","10:34"],["INC-2206","E 線檢測","CCD 誤判上升","中","研判中","t-a","10:27"],["INC-2205","D 線組裝","扭力值飄移","低","已結案","t-g","09:50"],["INC-2204","A 線沖壓","模具異音","中","已結案","t-g","09:12"]];
const DISP=[["INC-2208","B 線 主軸振動","林","林俊男 · 設備工程",65,"更換軸承中 · 預計 15 分復機"],["INC-2207","C 線 VOC 偏高","陳","陳怡君 · 廠務",30,"啟動強制排風 · 監測中"],["INC-2206","E 線 CCD 誤判","黃","黃志偉 · 品保",45,"重新校正光源與參數"]];
const CAUSES=[["主軸軸承磨損",78,"振動頻譜 BPFO 特徵明顯，與 3 起歷史案例吻合"],["潤滑不足",54,"潤滑週期已逾 220 小時，超出建議 200 小時"],["聯軸器對心偏差",31,"近 2 週振動趨勢緩升，符合對心不良模式"]];
const SIMILAR=[["INC-1987","2026-05 B 線主軸振動","更換 7014C 軸承後復機","已驗證"],["INC-1802","2026-02 A 線主軸異音","調整潤滑週期至 180h","已驗證"]];
const RECOV=[["10:42 異常告警觸發","系統 · B 線主軸振動 4.8mm/s"],["10:45 通報立案 INC-2208","現場 · 判定高風險、停機處置"],["10:52 派工林俊男處置","工程 · 研判軸承磨損，領用備品"],["11:08 更換軸承並動平衡","工程 · 振動降至 1.1mm/s"],["11:15 試車確認復機","主管 · 稼動恢復，結案並列入知識庫"]];
const KB=[["build","主軸振動異常處置 SOP","BPFO 特徵→軸承磨損→停機更換→動平衡校正，附標準工時與備品清單。","引用 12 次"],["science","VOC 濃度異常對策","偏高時強制排風、追溯塗料批次與環溫，超標即停線通報環安。","引用 7 次"],["visibility","CCD 誤判率上升處理","校正光源、更新樣本與閾值，必要時重訓模型。","引用 5 次"],["bolt","扭力飄移快速判斷","檢查氣壓、扭力槍校期與治具鎖點，30 秒定位。","引用 9 次"]];
const icon=n=>`<span class="material-symbols-outlined" aria-hidden="true">${n}</span>`;
const SCREENS=[
()=>`<div class="kpis"><div class="kpi"><div class="l">今日異常數</div><div class="v">14</div><div class="d danger">高 2 · 中 4 · 低 8</div></div><div class="kpi"><div class="l">處理中</div><div class="v">3</div><div class="d warning">平均處置 18 分</div></div><div class="kpi"><div class="l">MTTR 平均修復</div><div class="v">25<small> 分</small></div><div class="d positive">下降 · 較 90 分</div></div><div class="kpi"><div class="l">今日停機時數</div><div class="v">0.4<small> h</small></div><div class="d positive">下降 · 較 3.2h</div></div></div><div class="grid g2"><section class="card"><h3>${icon("grid_view")}產線異常 Andon 看板</h3><div class="andon">${ZONES.map(z=>`<div class="az ${z[1]}"><b>${z[0]}</b><div class="stt">${icon(z[1]=="g"?"check_circle":z[1]=="a"?"warning":"error")}${z[2]}</div><small>${z[3]}</small></div>`).join("")}</div></section><section class="card"><h3>${icon("rss_feed")}即時異常訊號流</h3><div class="feed">${FEED.map(f=>`<div class="fi ${f[2]}">${icon(f[2]=="r"?"error":f[2]=="a"?"warning":"check_circle")}<div><b>${f[0]}</b><small>${f[1]}</small></div><span class="tm">${f[3]}</span></div>`).join("")}</div><h3 style="margin-top:16px">${icon("show_chart")}B 線主軸振動</h3><div class="chart" id="c_sig" style="height:150px"></div></section></div>`,
()=>`<div class="grid g2"><section class="card"><h3>${icon("list_alt")}異常案件</h3><div class="scroll"><table class="data"><thead><tr><th>案號</th><th>來源</th><th>異常</th><th>等級</th><th>狀態</th><th>時間</th></tr></thead><tbody>${CASES.map(c=>`<tr><td><b class="mono" style="color:var(--blue)">${c[0]}</b></td><td>${c[1]}</td><td>${c[2]}</td><td><span class="tag ${c[3]=="高"?"t-r":c[3]=="中"?"t-a":"t-b"}">${icon(c[3]=="高"?"priority_high":c[3]=="中"?"warning":"info")}${c[3]}</span></td><td><span class="tag ${c[5]}">${c[4]}</span></td><td>${c[6]}</td></tr>`).join("")}</tbody></table></div></section><section class="card"><h3>${icon("donut_large")}異常等級分佈</h3><div class="chart" style="height:250px" id="c_lv"></div></section></div>`,
()=>`<section class="card"><h3>${icon("engineering")}處置派工看板 <span class="tag t-r" style="margin-left:auto">${icon("pending_actions")}進行中 3</span></h3><div class="disp">${DISP.map(d=>`<div class="dc"><div class="h"><b>${d[0]}</b><span class="tag t-a">${icon("engineering")}處置中</span></div><small style="color:var(--ink)">${d[1]}</small><div class="who"><span class="av">${d[2]}</span><small>${d[3]}</small></div><div class="prog" role="progressbar" aria-valuenow="${d[4]}" aria-valuemin="0" aria-valuemax="100"><i style="width:${d[4]}%"></i></div><small>${d[5]}</small></div>`).join("")}</div></section>`,
()=>`<div class="rc"><section class="card"><h3>${icon("psychology")}AI 根因研判 · INC-2208</h3><p style="color:var(--muted);font-size:12px;margin:0 0 13px">B 線焊接主軸振動 4.8mm/s，AI 依訊號頻譜與歷史案例推論可能根因：</p><div class="cause">${CAUSES.map(c=>`<div class="cz"><div class="ct"><b>${c[0]}</b><span style="font-weight:700;color:var(--blue)">${c[1]}%</span></div><div class="pb" role="progressbar" aria-valuenow="${c[1]}" aria-valuemin="0" aria-valuemax="100"><i style="width:${c[1]}%"></i></div><small>${c[2]}</small></div>`).join("")}</div></section><section class="card"><h3>${icon("history")}相似歷史案例</h3>${SIMILAR.map(s=>`<div class="cz" style="margin-bottom:10px"><b class="mono">${s[0]}</b><small>${s[1]}</small><small>對策：${s[2]} · <span class="tag t-g">${icon("verified")}${s[3]}</span></small></div>`).join("")}<div class="cz" style="border-left:4px solid var(--color-accent);background:#FFF7ED"><b style="color:#9A3412">建議對策</b><small>停機更換主軸軸承（SP-BR08），完成後動平衡校正並縮短潤滑週期至 180 小時。</small></div></section></div>`,
()=>`<div class="grid g2"><section class="card"><h3>${icon("timeline")}INC-2208 復原歷程</h3><div class="tl">${RECOV.map(r=>`<div class="ti"><div class="tt mono">${r[0]}</div><small>${r[1]}</small></div>`).join("")}</div></section><section class="card"><h3>${icon("verified")}再發防止追蹤</h3><div class="cz" style="margin-bottom:10px"><b>縮短潤滑週期</b><small>200h → 180h，已更新保養排程 · <span class="tag t-g">${icon("check_circle")}已執行</span></small></div><div class="cz" style="margin-bottom:10px"><b>加裝振動連續監測</b><small>B 線主軸新增感測點 · <span class="tag t-a">${icon("pending")}進行中</span></small></div><div class="cz"><b>納入知識庫 SOP</b><small>主軸振動處置標準化 · <span class="tag t-g">${icon("check_circle")}已完成</span></small></div></section></div>`,
