<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>稅務資料整理室 · Tax Filing Organizer</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#0f172a;
  --color-on-primary:#fff;
  --color-secondary:#334155;
  --color-on-secondary:#fff;
  --color-accent:#0369a1;
  --color-on-accent:#fff;
  --color-background:#f8fafc;
  --color-foreground:#020617;
  --color-card:#fff;
  --color-card-foreground:#020617;
  --color-muted:#e8ecf1;
  --color-muted-foreground:#475569;
  --color-border:#e2e8f0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#0f172a;
  --blue:#0369a1;
  --ink:#020617;
  --muted:#475569;
  --line:#e2e8f0;
  --accent:var(--color-accent);
  --accent2:#38bdf8;
  --bg:var(--color-background);
  --card:var(--color-card);
  --mut:var(--muted);
  --ok:#047857;
  --warn:#b45309;
  --bad:#dc2626;
  --info:#0369a1;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.045);
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{
  margin:0;
  min-width:320px;
  font-family:Lato,"Noto Sans TC",sans-serif;
  color:var(--ink);
  background:var(--bg);
  font-size:15px;
  line-height:1.5;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
button,a{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{font-size:20px;line-height:1;vertical-align:middle}
.shell{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.shell>*{min-width:0}
.side{
  position:sticky;
  top:0;
  height:100vh;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:4px;
  padding:24px 18px 18px;
  color:#cbd5e1;
  background:var(--color-primary);
  border-right:1px solid #1e293b;
}
.side .bd{
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 6px 24px;
  margin-bottom:8px;
  border-bottom:1px solid rgba(255,255,255,.14);
}
.side .lg{
  width:42px;
  height:42px;
  flex:none;
  display:grid;
  place-items:center;
  border:1px solid rgba(255,255,255,.3);
  border-radius:4px;
  color:#fff;
  background:#1e293b;
  font-family:"EB Garamond",serif;
  font-size:23px;
  font-weight:700;
}
.side .bd b{
  display:block;
  color:#fff;
  font-family:"EB Garamond","Noto Sans TC",serif;
  font-size:18px;
  font-weight:600;
  letter-spacing:.02em;
}
.side .bd span{
  display:block;
  margin-top:2px;
  color:#94a3b8;
  font-size:9px;
  font-weight:700;
  letter-spacing:.16em;
}
.side #nav{display:flex;flex-direction:column;gap:4px}
.side button{
  width:100%;
  min-height:44px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px 12px;
  border:1px solid transparent;
  border-radius:4px;
  color:#cbd5e1;
  background:transparent;
  font-weight:700;
  font-size:14px;
  text-align:left;
  white-space:nowrap;
  transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s ease;
}
.side button .material-symbols-outlined{color:#94a3b8;transition:color .2s ease}
.side button:hover{color:#fff;background:#1e293b;border-color:#334155}
.side button:hover .material-symbols-outlined{color:#e2e8f0}
.side button.on{
  color:#fff;
  background:var(--color-accent);
  border-color:#0284c7;
  box-shadow:inset 3px 0 #fff;
}
.side button.on .material-symbols-outlined{color:#fff}
.side .foot{
  margin-top:auto;
  padding:18px 8px 4px;
  border-top:1px solid rgba(255,255,255,.14);
  color:#94a3b8;
  font-size:11px;
  line-height:1.75;
}
.main{width:100%;max-width:1540px;padding:32px clamp(20px,3vw,48px) 48px}
.vh{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:24px;
  padding-bottom:18px;
  border-bottom:1px solid var(--line);
}
.vh h2{
  margin:0;
  color:var(--color-primary);
  font-family:"EB Garamond","Noto Sans TC",serif;
  font-size:clamp(28px,3vw,38px);
  font-weight:600;
  line-height:1.1;
  letter-spacing:-.02em;
}
.vh p{margin:7px 0 0;color:var(--muted);font-size:13px}
.live{
  display:flex;
  align-items:center;
  gap:8px;
  flex:none;
  padding:7px 11px;
  border:1px solid #bae6fd;
  border-radius:4px;
  color:#075985;
  background:#f0f9ff;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
}
.live i{
  width:8px;
  height:8px;
  display:inline-block;
  border:2px solid #fff;
  border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 0 1px var(--accent);
  animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.kpis,.stat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpis>*,.stat>*,.grid>*,.two>*,.rgrid>*{min-width:0}
.kpi,.st,.card,.mc,.rt2{
  border:1px solid var(--line);
  border-radius:6px;
  background:var(--card);
  box-shadow:var(--shadow);
}
.kpi{
  position:relative;
  overflow:hidden;
  min-height:124px;
  padding:19px 18px 17px;
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.kpi::after{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--accent)}
.kpi:hover,.st:hover,.mc:hover,.rt2:hover{border-color:#94a3b8;box-shadow:0 10px 28px rgba(15,23,42,.09);transform:translateY(-2px)}
.kpi .l,.st .l{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  letter-spacing:.02em;
}
.kpi .l .material-symbols-outlined{color:var(--accent);font-size:17px}
.kpi .v,.st .v,.mc .num,.rt2 .cnt{
  color:var(--color-primary);
  font-family:Lato,sans-serif;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;
}
.kpi .v{margin-top:8px;font-size:27px;font-weight:700;line-height:1.15}
.kpi .d{margin-top:5px;color:var(--ok);font-size:11px;font-weight:700}
.stat{gap:12px}
.st{min-height:92px;padding:15px 16px;transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease}
.st .v{margin-top:5px;font-size:21px;font-weight:700}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:minmax(0,1.4fr) minmax(300px,.9fr)}
.g11,.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{padding:19px 20px}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin:0 0 16px;
  color:var(--color-primary);
  font-family:"EB Garamond","Noto Sans TC",serif;
  font-size:17px;
  font-weight:600;
  line-height:1.3;
}
.card h3 .material-symbols-outlined{color:var(--accent);font-size:20px}
.card h3 .sp{
  margin-left:auto;
  color:var(--muted);
  font-family:Lato,"Noto Sans TC",sans-serif;
  font-size:11px;
  font-weight:700;
  letter-spacing:.02em;
}
.tag{
  display:inline-flex;
  align-items:center;
  min-height:24px;
  padding:3px 9px;
  border:1px solid transparent;
  border-radius:999px;
  font-size:10.5px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
}
.t-ok{color:#065f46;background:#ecfdf5;border-color:#a7f3d0}
.t-warn{color:#92400e;background:#fffbeb;border-color:#fde68a}
.t-bad{color:#b91c1c;background:#fef2f2;border-color:#fecaca}
.t-info{color:#075985;background:#f0f9ff;border-color:#bae6fd}
.t-mut{color:#334155;background:#f1f5f9;border-color:#cbd5e1}
.scroll,.mxwrap{overflow-x:auto;overscroll-behavior-inline:contain;scrollbar-color:#94a3b8 #f1f5f9}
table.data{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
table.data th,table.data td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.data th{
  color:#334155;
  background:#f1f5f9;
  font-size:11px;
  font-weight:700;
  letter-spacing:.035em;
  white-space:nowrap;
}
table.data tr:last-child td{border-bottom:0}
table.data tbody tr:hover td,table.data tr:hover td{background:#f8fafc}
table.data td:first-child b{font-family:var(--mono);font-size:11.5px;letter-spacing:-.02em}
table.data td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.data td[style*="min-width"]{text-align:left}
.bar,.dr .prog{height:7px;overflow:hidden;border-radius:2px;background:#e2e8f0}
.bar i,.dr .prog i{display:block;height:100%;border-radius:2px;background:var(--accent)}
.chart{position:relative;height:250px}
.alist,.dead,.dl2{display:flex;flex-direction:column}
.alist{gap:9px}
.al{
  display:flex;
  align-items:flex-start;
  gap:11px;
  padding:11px 12px;
  border:1px solid #fde68a;
  border-left:4px solid var(--warn);
  border-radius:4px;
  background:#fffbeb;
}
.al.bad{border-color:#fecaca;border-left-color:var(--bad);background:#fef2f2}
.al.info{border-color:#bae6fd;border-left-color:var(--info);background:#f0f9ff}
.al.ok{border-color:#a7f3d0;border-left-color:var(--ok);background:#ecfdf5}
.al .material-symbols-outlined{flex:none;color:var(--warn);font-size:19px}
.al.bad .material-symbols-outlined{color:var(--bad)}
.al.info .material-symbols-outlined{color:var(--info)}
.al.ok .material-symbols-outlined{color:var(--ok)}
.al b{color:var(--color-primary);font-size:12.5px}
.al small,.di .mid small,.ap .ab small{display:block;margin-top:2px;color:var(--muted);font-size:11px;line-height:1.5}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.mc,.rt2{padding:14px;transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease}
.mc b{display:block;font-size:14px}
.mc small,.rt2 small,.dr small,.ti small{color:var(--muted);font-size:11px}
.mc .num{margin:8px 0 6px;font-size:23px;font-weight:700}
table.mx{width:100%;min-width:640px;border-collapse:separate;border-spacing:0;font-size:12px}
table.mx th,table.mx td{padding:9px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}
table.mx th:first-child,table.mx td:first-child{border-left:1px solid var(--line)}
table.mx tr:first-child th{border-top:1px solid var(--line)}
table.mx th{color:#334155;background:#f1f5f9;font-size:11px;font-weight:700;white-space:nowrap}
table.mx td.cl{position:sticky;left:0;background:#fff;color:var(--color-primary);font-weight:700;text-align:left;white-space:nowrap}
table.mx th.cl{position:sticky;left:0;z-index:1;text-align:left}
.dc{width:26px;height:26px;display:inline-grid;place-items:center;border:1px solid transparent;border-radius:3px;font-size:14px;font-weight:700}
.dc.y{color:#065f46;background:#ecfdf5;border-color:#a7f3d0}
.dc.n{color:#b91c1c;background:#fef2f2;border-color:#fecaca}
.dc.p{color:#92400e;background:#fffbeb;border-color:#fde68a}
.dc.na{color:#475569;background:#f1f5f9;border-color:#cbd5e1}
.lgd{display:flex;gap:16px;flex-wrap:wrap;margin-top:13px;color:var(--muted);font-size:11px}
.lgd span{display:flex;align-items:center;gap:6px}
.lgd i{width:13px;height:13px;display:inline-block;border:1px solid #cbd5e1;border-radius:2px}
.dead{gap:10px}
.dr{padding:13px 14px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:4px;background:#fff}
.dr.warn{border-left-color:var(--warn)}
.dr.bad{border-left-color:var(--bad)}
.dr.ok{border-left-color:var(--ok)}
.dr .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dr .top b{color:var(--color-primary);font-size:13px}
.dr .top .dl{margin-left:auto;font-family:var(--mono);font-size:11.5px;font-weight:700;white-space:nowrap}
.dr .prog{margin:10px 0 5px}
.dr .prog i.w{background:var(--warn)}
.dr .prog i.b{background:var(--bad)}
.dl2{gap:8px}
.di{
  display:flex;
  align-items:center;
  gap:11px;
  min-height:58px;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:4px;
  background:#fff;
}
.di .ic{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  flex:none;
  border-radius:3px;
  color:#fff;
}
.di .mid{flex:1;min-width:0}
.di .mid b{font-size:12.5px}
.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.ti{position:relative;padding:0 0 17px 5px}
.ti::before{
  content:"";
  position:absolute;
  left:-23px;
  top:3px;
  width:11px;
  height:11px;
  border:3px solid #fff;
  border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 0 1px #94a3b8;
}
.ti.w::before{background:var(--warn)}
.ti.b::before{background:var(--bad)}
.ti.g::before{background:var(--ok)}
.ti .tt{color:var(--color-primary);font-size:12.5px;font-weight:700}
.ti .dsc{margin-top:3px;color:#334155;font-size:12px;line-height:1.55}
.appr{display:flex;flex-direction:column}
.ap{position:relative;display:flex;align-items:flex-start;gap:12px;padding-bottom:15px}
.ap::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--line)}
.ap:last-child::before{display:none}
.ap .dot{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  flex:none;
  border-radius:50%;
  color:#fff;
  font-family:var(--mono);
  font-size:12px;
  font-weight:700;
}
.ap .dot.done{background:var(--ok)}
.ap .dot.now{background:var(--accent);box-shadow:0 0 0 3px #bae6fd}
.ap .dot.wait{color:#334155;background:#e2e8f0;border:1px solid #cbd5e1}
.ap .dot.bad{background:var(--bad)}
.ap .ab{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:#fff}
.ap .ab b{color:var(--color-primary);font-size:13px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:11px}
.rt2 .rn{display:flex;align-items:center;gap:7px;color:var(--color-primary);font-size:13px;font-weight:700}
.rt2 .rn .material-symbols-outlined{color:var(--accent);font-size:19px}
.rt2 .cnt{margin:8px 0 3px;font-size:23px;font-weight:700}
@media(max-width:1024px){
  .shell{grid-template-columns:232px minmax(0,1fr)}
  .main{padding-inline:24px}
  .kpis,.stat{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2{grid-template-columns:1fr}
}
@media(max-width:768px){
  .shell{display:block}
  .side{position:static;height:auto;padding:14px 16px;overflow:visible}
  .side .bd{padding:0 2px 13px;margin:0}
  .side #nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .side button{justify-content:flex-start;min-height:46px;padding:9px;font-size:12px;white-space:normal}
  .side button.on{box-shadow:inset 0 -3px #fff}
  .side .foot{display:none}
  .main{padding:24px 16px 36px}
  .vh{align-items:flex-start;margin-bottom:18px}
  .vh h2{font-size:30px}
  .g11,.two{grid-template-columns:1fr}
  .card{padding:17px 15px}
}
@media(max-width:480px){
  .side #nav{grid-template-columns:repeat(2,minmax(0,1fr))}
  .vh{display:block}
  .live{width:max-content;margin-top:14px}
  .kpis,.stat{grid-template-columns:1fr;gap:10px}
  .kpi{min-height:108px}
  .card h3 .sp{width:100%;margin-left:28px}
  .dr .top .dl{width:100%;margin-left:0}
  table.data th,table.data td{padding:10px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .kpi:hover,.st:hover,.mc:hover,.rt2:hover{transform:none}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="bd"><div class="lg">稅</div><div><b>稅務資料整理室</b><span>TAX FILING ORGANIZER</span></div></div>
    <div id="nav"></div>
    <div class="foot">在辦稅務案件 32 件 · 承辦 6 人<br/>本期申報 24 · 缺件 7 · 逾期風險 2<br/>© JVISION Tax Organizer</div>
  </aside>
  <main class="main">
    <div class="vh"><div><h2 id="vt">整理總覽</h2><p id="vd"></p></div><div class="live"><i></i>整理進度即時彙整</div></div>
    <div id="view"></div>
  </main>
</div>
<script>
var MOD=[["整理總覽","dashboard","整理總覽","案件產能、文件收集與申報期限戰情"],
["客戶案件","folder_shared","客戶稅務案件","記帳／營所稅／營業稅案件清單與進度"],
["文件收集","checklist","應備文件收集","客戶 × 應備文件 已收/待補清單"],
["憑證整理","receipt_long","憑證整理分類","進銷項憑證分類、勾稽與異常"],
["申報編製","description","申報表編製","申報表產出、覆核與計費"],
["期限追蹤","event_upcoming","申報期限追蹤","法定期限倒數與交付排程"]];
var nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach(function(m,i){var b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span>'+m[0];b.onclick=function(){show(i);};nav.appendChild(b);});

var GRN='#0369a1',GRN2='#38bdf8',LIME='#64748b',TEAL='#0f766e',AMBER='#b45309',ROSE='#dc2626',SAGE='#94a3b8';
var fmt=function(n){return n.toLocaleString('en-US');};
var m2=function(n){return 'NT$'+fmt(n);};

/* case data: id,client,type,typTag,stage,stageTag,owner,progress,fee */
var CASES=[
["TX-3412","宏鼎精密工業","營所稅結算","warn","申報編製","info","徐子謙",82,168000],
["TX-3411","O田生技","營業稅(401)","ok","憑證整理","warn","林佩璇",64,32000],
["TX-3410","長晴工坊","記帳＋營業稅","info","文件收集","mut","王思涵",34,28000],
["TX-3409","O陽貿易","營業稅(401)","ok","申報交付","ok","陳彥宏",96,26000],
["TX-3408","米森餐飲","記帳服務","info","憑證整理","warn","王思涵",52,24000],
["TX-3407","橙果設計","營所稅結算","warn","申報編製","info","徐子謙",78,152000],

+'<div class="card"><h3><span class="material-symbols-outlined">insights</span>期限戰情</h3><div class="alist">'

+'<div class="al"><span class="material-symbols-outlined">schedule</span><div><b>營業稅 401 · 9/15 截止</b><small>本期 12 件，10 件已備媒體檔，2 件憑證整理中</small></div></div>'
+'<div class="al ok"><span class="material-symbols-outlined">verified</span><div><b>期限掌握率 96%</b><small>較上期提升 21pt，法定期限一律優先於內部排程</small></div></div>'

];

var _ch=[];
function clr(){_ch.forEach(function(c){try{c.destroy();}catch(e){}});_ch=[];}
function ctx(id){var el=document.getElementById(id);return el?el.getContext('2d'):null;}
function mk(id,cfg){var c=ctx(id);if(!c)return;_ch.push(new Chart(c,cfg));}
var GO={maintainAspectRatio:false,responsive:true};

function draw(i){
  clr();
  if(i==0){
    mk('cv_stack',{type:'bar',data:{labels:['記帳','營所稅','營業稅'],datasets:[
      {label:'文件收集',data:[3,2,3],backgroundColor:SAGE,stack:'a'},
      {label:'憑證整理',data:[4,2,4],backgroundColor:LIME,stack:'a'},
      {label:'申報編製',data:[3,3,3],backgroundColor:TEAL,stack:'a'},
      {label:'申報交付',data:[2,1,2],backgroundColor:GRN,stack:'a'}]},
      options:Object.assign({},GO,{plugins:{legend:{position:'top',labels:{boxWidth:12,font:{size:10}}}},scales:{x:{stacked:true,ticks:{font:{size:11}}},y:{stacked:true,ticks:{font:{size:10}}}}})});
    mk('cv_pie',{type:'doughnut',data:{labels:['記帳服務','營所稅結算','營業稅401'],datasets:[{data:[12,8,12],backgroundColor:[SAGE,TEAL,GRN],borderWidth:2,borderColor:'#fff'}]},
      options:Object.assign({},GO,{cutout:'56%',plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}}}})});
  }
  if(i==1){
    mk('cv_owner',{type:'bar',data:{labels:['王思涵','徐子謙','林佩璇','陳彥宏','黃冠廷'],datasets:[{data:[8,6,7,6,5],backgroundColor:[LIME,GRN,TEAL,SAGE,AMBER],borderRadius:5}]},
      options:Object.assign({},GO,{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:10}}},y:{ticks:{font:{size:11}}}}})});
  }
  if(i==2){
    mk('cv_chk',{type:'bar',data:{labels:CHK.map(function(r){return r[0];}),datasets:[{label:'完整率 %',data:CHKRATE,backgroundColor:CHKRATE.map(function(v){return v<40?ROSE:v<80?AMBER:GRN;}),borderRadius:5}]},
      options:Object.assign({},GO,{plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:10}}},y:{max:100,ticks:{font:{size:10},callback:function(v){return v+'%';}}}}})});
  }
  if(i==3){
    mk('cv_recon',{type:'line',data:{labels:['3月','4月','5月','6月','7月','8月'],datasets:[
      {label:'銷項稅額(萬)',data:[42,45,44,48,46,51],borderColor:GRN,backgroundColor:'rgba(21,128,61,.12)',fill:true,tension:.4,borderWidth:3},
      {label:'進項稅額(萬)',data:[31,33,32,35,34,38],borderColor:TEAL,backgroundColor:'rgba(14,116,144,.10)',fill:true,tension:.4,borderWidth:3}]},
      options:Object.assign({},GO,{plugins:{legend:{position:'top',labels:{boxWidth:12,font:{size:10}}}},scales:{x:{ticks:{font:{size:10}}},y:{ticks:{font:{size:10}}}}})});
  }
  if(i==4){
    mk('cv_forms',{type:'bar',data:{labels:['3月','4月','5月','6月','7月','8月'],datasets:[
      {label:'營所稅',data:[2,3,5,4,6,7],backgroundColor:GRN,stack:'f'},
      {label:'營業稅401',data:[9,7,11,8,10,12],backgroundColor:LIME,stack:'f'},
      {label:'扣繳/其他',data:[3,2,4,3,2,4],backgroundColor:AMBER,stack:'f'}]},
      options:Object.assign({},GO,{plugins:{legend:{position:'top',labels:{boxWidth:12,font:{size:10}}}},scales:{x:{stacked:true,ticks:{font:{size:10}}},y:{stacked:true,ticks:{font:{size:10}}}}})});
  }
  if(i==5){
    mk('cv_deadline',{type:'bar',data:{labels:['W1','W2','W3','W4','W5','W6'],datasets:[
      {label:'營業稅401',data:[4,2,5,3,2,4],backgroundColor:GRN,stack:'d'},
      {label:'營所稅',data:[2,1,3,2,4,2],backgroundColor:TEAL,stack:'d'},
      {label:'暫繳/其他',data:[1,1,0,2,1,1],backgroundColor:AMBER,stack:'d'}]},
      options:Object.assign({},GO,{plugins:{legend:{position:'top',labels:{boxWidth:12,font:{size:10}}}},scales:{x:{stacked:true,ticks:{font:{size:10}}},y:{stacked:true,ticks:{font:{size:10}}}}})});
  }
}
function show(i){
  nav.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',+b.dataset.i===i);});
  vt.textContent=MOD[i][2];vd.textContent=MOD[i][3];
  view.innerHTML=SCREENS[i]();
  void view.offsetHeight;
  draw(i);
}
window.addEventListener('resize',function(){_ch.forEach(function(c){try{c.resize();}catch(e){}});});
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
