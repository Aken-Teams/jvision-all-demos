<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>產品材料資料申報管理</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#fff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000;
  --color-accent:#ea580c;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#1e293b;
  --color-card:#fff;
  --color-card-foreground:#1e293b;
  --color-muted:#e9eff8;
  --color-muted-foreground:#475569;
  --color-border:#e2e8f0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#1e293b;
  --muted:#475569;
  --line:#e2e8f0;
  --ok:#15803d;
  --ok-soft:#dcfce7;
  --warn:#a14407;
  --warn-soft:#ffedd5;
  --bad:#b91c1c;
  --bad-soft:#fee2e2;
  --info:#1d4ed8;
  --info-soft:#dbeafe;
  --shadow:0 10px 28px rgba(15,23,42,.07);
  --shadow-sm:0 2px 8px rgba(15,23,42,.055);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  background:
    linear-gradient(90deg,rgba(37,99,235,.025) 1px,transparent 1px),
    linear-gradient(rgba(37,99,235,.025) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Fira Sans","Noto Sans TC",system-ui,sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased
}
button,a,[role="button"]{cursor:pointer}
button{font:inherit}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;font-style:normal;line-height:1;
  letter-spacing:normal;text-transform:none;white-space:nowrap;
  word-wrap:normal;direction:ltr;-webkit-font-feature-settings:"liga";
  -webkit-font-smoothing:antialiased
}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.topbar{
  position:sticky;top:0;z-index:50;
  color:var(--color-card-foreground);
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 rgba(15,23,42,.03);
  backdrop-filter:blur(16px)
}
.topbar-inner{
  width:min(1440px,100%);
  min-height:72px;margin:auto;padding:10px 24px;
  display:flex;align-items:center;gap:26px
}
.brand{display:flex;align-items:center;gap:12px;min-width:310px}
.logo{
  width:42px;height:42px;display:grid;place-items:center;flex:none;
  color:#fff;background:var(--blue);border-radius:8px;
  box-shadow:4px 4px 0 #bfdbfe
}
.logo .material-symbols-outlined{font-size:24px}
.brand .tt{min-width:0}
.brand .tt b{
  display:block;font-size:15px;font-weight:700;letter-spacing:.02em;
  white-space:nowrap
}
.brand .tt span{
  display:block;margin-top:1px;color:var(--muted);
  font-family:"Fira Code",monospace;font-size:10px;white-space:nowrap
}
.nav{
  display:flex;flex:1;justify-content:flex-end;gap:4px;
  min-width:0;overflow-x:auto;scrollbar-width:none
}
.nav::-webkit-scrollbar{display:none}
.nav button{
  position:relative;display:inline-flex;align-items:center;gap:7px;
  flex:none;padding:10px 11px;border:1px solid transparent;border-radius:7px;
  color:var(--muted);background:transparent;
  font-size:12px;font-weight:600;white-space:nowrap;
  transition:color .2s ease,background .2s ease,border-color .2s ease,transform .2s ease
}
.nav button:hover{color:var(--blue);background:#eff6ff;border-color:#dbeafe}
.nav button.on{color:#fff;background:var(--blue);border-color:var(--blue)}
.nav button.on::after{
  content:"";position:absolute;left:12px;right:12px;bottom:-11px;height:2px;background:var(--blue)
}
.nav button .material-symbols-outlined{font-size:18px}
main{width:min(1440px,100%);margin:auto;padding:30px 24px 64px}
.screen-head{
  position:relative;display:flex;align-items:flex-end;justify-content:space-between;
  gap:20px;margin-bottom:20px;padding:0 0 18px 18px;
  border-bottom:1px solid var(--line)
}
.screen-head::before{
  content:"";position:absolute;left:0;top:4px;bottom:18px;width:4px;background:var(--blue)
}
.screen-head h1{
  display:flex;align-items:center;gap:10px;margin:0;
  color:#0f172a;font-size:clamp(21px,2vw,28px);font-weight:700;
  line-height:1.2;letter-spacing:-.025em
}
.screen-head h1 .material-symbols-outlined{color:var(--blue);font-size:27px}
.screen-head p{margin:7px 0 0;color:var(--muted);font-size:13px}
.chip{
  display:inline-flex;align-items:center;gap:6px;flex:none;
  padding:7px 11px;color:#9a3412;background:#fff7ed;
  border:1px solid #fed7aa;border-radius:6px;font-size:12px;font-weight:700
}
.chip .material-symbols-outlined{font-size:17px}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g-1-2{grid-template-columns:minmax(280px,1fr) minmax(0,2fr)}
.panel,.kpi{
  min-width:0;background:var(--color-card);border:1px solid var(--line);
  border-radius:10px;box-shadow:var(--shadow-sm)
}
.panel{padding:18px}
.panel h3{
  display:flex;align-items:center;gap:8px;margin:0 0 14px;
  color:#0f172a;font-size:14px;font-weight:700
}
.panel h3 .material-symbols-outlined{color:var(--blue);font-size:19px}
.sub{color:var(--muted);font-size:11px;font-weight:400}
.kpi{
  position:relative;overflow:hidden;padding:17px 18px;
  transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease
}
.kpi:hover{transform:translateY(-2px);border-color:#bfdbfe;box-shadow:var(--shadow)}
.kpi::before{content:"";position:absolute;left:0;top:0;width:100%;height:3px;background:var(--blue)}
.kpi .lab{
  display:flex;align-items:center;gap:7px;
  color:var(--muted);font-size:12px;font-weight:600
}
.kpi .lab .material-symbols-outlined{color:var(--blue);font-size:18px}
.kpi .val{
  margin-top:8px;color:#0f172a;font-family:"Fira Code",monospace;
  font-size:28px;font-weight:700;line-height:1.2;letter-spacing:-.04em
}
.kpi .val small{
  color:var(--muted);font-family:"Fira Sans",sans-serif;
  font-size:12px;font-weight:500;letter-spacing:0
}
.kpi .dt{margin-top:6px;color:var(--muted);font-size:11px;font-weight:600}
.up{color:var(--ok)!important}.down{color:var(--bad)!important}
.tbl-wrap,.mtx-wrap,.chart-scroll{max-width:100%;overflow-x:auto}
table{width:100%;min-width:520px;border-collapse:separate;border-spacing:0;font-size:12.5px}
th,td{
  padding:10px 12px;border-bottom:1px solid var(--line);
  text-align:left;white-space:nowrap
}
th{
  color:#334155;background:#f1f5f9;font-size:11px;font-weight:700;
  letter-spacing:.035em
}
thead th:first-child{border-radius:6px 0 0}
thead th:last-child{border-radius:0 6px 0 0}
tbody tr{transition:background .18s ease}
tbody tr:hover{background:#f8fbff}
tbody tr:last-child td{border-bottom:0}
td.num{
  text-align:right;font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;font-weight:600
}
.bd{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 8px;border:1px solid transparent;border-radius:5px;
  font-size:11px;font-weight:700
}
.bd .material-symbols-outlined{font-size:14px}
.b-ok{color:#166534;background:var(--ok-soft);border-color:#bbf7d0}
.b-warn{color:#9a3412;background:var(--warn-soft);border-color:#fed7aa}
.b-bad{color:#991b1b;background:var(--bad-soft);border-color:#fecaca}
.b-info{color:#1e40af;background:var(--info-soft);border-color:#bfdbfe}
.b-mut{color:#475569;background:#f1f5f9;border-color:#e2e8f0}
.chart-box{position:relative;width:100%;height:260px;overflow:hidden}
.chart-sm{height:220px}
.tree{display:flex;flex-direction:column;gap:5px}
.tnode{
  display:flex;align-items:center;gap:8px;padding:9px 11px;
  color:#334155;background:#fff;border:1px solid var(--line);
  border-radius:6px;font-size:12px;transition:background .2s ease,border-color .2s ease
}
.tnode:hover{background:#eff6ff;border-color:#bfdbfe}
.tnode .material-symbols-outlined{color:var(--blue);font-size:18px}
.ind1{margin-left:24px}.ind2{margin-left:48px}
.pct{
  margin-left:auto;font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;font-weight:700
}
.kb{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:12px}
.kb-col{min-width:0;padding:11px;background:#f1f5f9;border:1px solid var(--line);border-radius:8px}
.kb-col h4{
  display:flex;align-items:center;justify-content:space-between;
  margin:0 0 10px;color:#334155;font-size:12px
}
.cnt{
  min-width:24px;padding:2px 7px;text-align:center;color:#1e40af;
  background:#dbeafe;border-radius:4px;font-family:"Fira Code",monospace;font-size:10px
}
.kcard{
  margin-bottom:8px;padding:10px;color:#334155;background:#fff;
  border:1px solid var(--line);border-left:3px solid var(--blue);
  border-radius:6px;font-size:12px;box-shadow:0 1px 2px rgba(15,23,42,.04);
  transition:transform .2s ease,border-color .2s ease
}
.kcard:hover{transform:translateX(2px);border-color:#93c5fd}
.kcard b{color:#0f172a;font-size:12px}
.kcard .m{
  display:flex;align-items:center;gap:5px;margin-top:4px;
  color:var(--muted);font-size:10.5px
}
.kcard .m .material-symbols-outlined{font-size:14px}
.mtx{min-width:650px}
.mtx th,.mtx td{padding:8px;border-right:1px solid var(--line);text-align:center}
.mtx th:first-child,.mtx td:first-child{border-left:1px solid var(--line)}
.mtx td.subst{text-align:left;font-weight:600}
.cell{display:block;padding:4px 7px;border:1px solid transparent;border-radius:4px;font-weight:700}
.c-clean{color:#166534;background:var(--ok-soft);border-color:#bbf7d0}
.c-decl{color:#9a3412;background:var(--warn-soft);border-color:#fed7aa}
.c-ban{color:#991b1b;background:var(--bad-soft);border-color:#fecaca}
.c-na{color:#64748b;background:#f1f5f9;border-color:#e2e8f0}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;color:var(--muted);font-size:11px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{display:inline-block;width:10px;height:10px;border:1px solid rgba(15,23,42,.14);border-radius:2px}
.judge-list{display:flex;flex-direction:column;gap:8px}
.judge{
  display:flex;align-items:center;gap:11px;padding:10px 11px;
  background:#fff;border:1px solid var(--line);border-radius:7px
}
.judge .ico{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:5px}
.judge .ico .material-symbols-outlined{font-size:20px}
.judge .txt{min-width:0;flex:1}
.judge .txt b{color:#0f172a;font-size:12.5px}
.judge .txt div{color:var(--muted);font-size:11px}
.tl{position:relative;padding-left:27px}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:#bfdbfe}
.tl-item{position:relative;padding:0 0 18px 6px}
.tl-item::before{
  content:"";position:absolute;left:-25px;top:3px;width:11px;height:11px;
  background:#fff;border:3px solid var(--blue);border-radius:50%
}
.tl-item .tt{color:#0f172a;font-size:12.5px;font-weight:700}
.tl-item .tm{
  margin-top:2px;color:#1d4ed8;font-family:"Fira Code",monospace;font-size:10px
}
.tl-item .ds{margin-top:3px;color:var(--muted);font-size:11.5px}
.sc-lvl{display:flex;align-items:stretch;gap:10px;margin-bottom:10px}
.sc-tag{
  align-self:center;flex:0 0 58px;color:#1d4ed8;
  font-family:"Fira Code",monospace;font-size:10px;font-weight:700
}
.sc-nodes{display:flex;flex:1;flex-wrap:wrap;gap:8px;min-width:0}
.sc-node{
  min-width:150px;padding:9px 11px;background:#fff;
  border:1px solid var(--line);border-top:3px solid var(--blue);
  border-radius:6px;font-size:11px
}
.sc-node b{display:block;color:#0f172a;font-size:12px}
.sc-node .st{color:var(--muted);font-family:"Fira Code",monospace;font-size:10px}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.screen-head,.kpi,.panel{animation:reveal .35s ease both}
.kpi:nth-child(2){animation-delay:.04s}
.kpi:nth-child(3){animation-delay:.08s}
.kpi:nth-child(4){animation-delay:.12s}
@media(max-width:1024px){
  .topbar-inner{align-items:flex-start;flex-direction:column;gap:8px;padding:10px 20px}
  .brand{min-width:0}
  .nav{width:100%;justify-content:flex-start}
  .nav button.on::after{bottom:-9px}
  main{padding:25px 20px 56px}
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:768px){
  .g-2,.g-3,.g-2-1,.g-1-2{grid-template-columns:1fr}
  .screen-head{align-items:flex-start;flex-direction:column}
  .chip{align-self:flex-start}
  .panel{padding:15px}
}
@media(max-width:480px){
  .topbar-inner{padding:9px 14px}
  .brand .tt span{max-width:230px;overflow:hidden;text-overflow:ellipsis}
  .nav button{padding:9px}
  .nav .txt-lbl{display:none}
  main{padding:21px 14px 48px}
  .g-kpi{grid-template-columns:1fr}
  .screen-head h1{font-size:21px}
  .kpi .val{font-size:26px}
  .ind1{margin-left:12px}.ind2{margin-left:24px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important
  }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined" aria-hidden="true">dataset</span></div>
      <div class="tt"><b>產品材料資料申報管理</b><span>PRODUCT MATERIAL COMPLIANCE · IMDS</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
  </div>
</header>
<main><div id="view" aria-live="polite"></div></main>
<script>
"use strict";
var NAV=[
  {icon:"science",label:"材料建檔"},
  {icon:"forward_to_inbox",label:"申報追蹤"},
  {icon:"policy",label:"物質篩檢"},
  {icon:"verified",label:"合規判定"},
  {icon:"send",label:"客戶提交"},
  {icon:"account_tree",label:"供應鏈追溯"}
];
var view=document.getElementById("view"),navEl=document.getElementById("nav"),charts=[];
function destroyCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy()}catch(e){}}charts=[]}
function mk(id,cfg){var el=document.getElementById(id);if(!el)return;var ch=new Chart(el.getContext("2d"),cfg);charts.push(ch);return ch}
(function(){
  var h="";
  for(var i=0;i<NAV.length;i++)h+='<button type="button" data-i="'+i+'" aria-label="'+NAV[i].label+'"><span class="material-symbols-outlined" aria-hidden="true">'+NAV[i].icon+'</span><span class="txt-lbl">'+NAV[i].label+'</span></button>';
  navEl.innerHTML=h;
  var btns=navEl.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++)btns[j].addEventListener("click",function(){
    var i=+this.getAttribute("data-i"),hash="#v"+i;
    if(location.hash!==hash)location.hash=hash;else show(i)
  })
})();
var C_GRID="#e2e8f0",C_MUT="#475569";
Chart.defaults.font.family="'Fira Sans',sans-serif";
Chart.defaults.color=C_MUT;
Chart.defaults.font.size=11.5;
function head(icon,title,desc,chipTxt,chipIcon){
  return '<div class="screen-head"><div><h1><span class="material-symbols-outlined" aria-hidden="true">'+icon+'</span>'+title+'</h1><p>'+desc+'</p></div><span class="chip"><span class="material-symbols-outlined" aria-hidden="true">'+(chipIcon||"bolt")+'</span>'+chipTxt+'</span></div>'
}
function kpi(lab,icon,val,unit,dt,dir){
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined" aria-hidden="true">'+icon+'</span>'+lab+'</div><div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div><div class="dt '+(dir||"")+'">'+dt+'</div></div>'
}
function s0(){
  var tree=[
    {lv:0,name:"料號 PN-4471 · 引擎支架總成",ic:"category",pct:"100.0%"},
    {lv:1,name:"半成品 · 鋁合金鑄件",ic:"widgets",pct:"78.4%"},
    {lv:2,name:"材料 · AlSi9Cu3 鑄鋁",ic:"grain",pct:"70.2%"},
    {lv:2,name:"物質 · 銅 Cu",ic:"radio_button_checked",pct:"3.1%"},
    {lv:1,name:"半成品 · 表面電鍍層",ic:"widgets",pct:"14.9%"},
    {lv:2,name:"物質 · 鋅 Zn",ic:"radio_button_checked",pct:"12.0%"},
    {lv:2,name:"物質 · 六價鉻 Cr(VI)",ic:"warning",pct:"0.02%"},
    {lv:1,name:"半成品 · 緊固件 M8",ic:"widgets",pct:"6.7%"}
  ],th="";
  for(var i=0;i<tree.length;i++){var n=tree[i];th+='<div class="tnode '+(n.lv===1?"ind1":n.lv===2?"ind2":"")+'"><span class="material-symbols-outlined" aria-hidden="true">'+n.ic+'</span><span>'+n.name+'</span><span class="pct">'+n.pct+'</span></div>'}
  var recent=[
    {pn:"PN-4471",nm:"引擎支架總成",node:24,comp:"92%",st:"建檔中",cls:"b-warn",ic:"edit"},
    {pn:"PN-3320",nm:"線束連接器",node:31,comp:"100%",st:"已完成",cls:"b-ok",ic:"check"},
    {pn:"PN-8815",nm:"ABS 控制殼",node:18,comp:"64%",st:"缺成分",cls:"b-bad",ic:"error"},
    {pn:"PN-2207",nm:"齒輪箱襯套",node:12,comp:"100%",st:"已完成",cls:"b-ok",ic:"check"},
    {pn:"PN-6640",nm:"密封橡膠圈",node:9,comp:"81%",st:"建檔中",cls:"b-warn",ic:"edit"}
  ],rt="";
  for(var r=0;r<recent.length;r++){var x=recent[r];rt+='<tr><td class="num">'+x.pn+'</td><td>'+x.nm+'</td><td class="num">'+x.node+'</td><td class="num">'+x.comp+'</td><td><span class="bd '+x.cls+'"><span class="material-symbols-outlined" aria-hidden="true">'+x.ic+'</span>'+x.st+'</span></td></tr>'}
  view.innerHTML=head("science","材料成分建檔 MDS","以樹狀結構建立零件的半成品、材料與物質層級，掌握成分完整度","建檔完成率 88%","donut_small")+

    btns[b].setAttribute("aria-current",on?"page":"false")
  }
  SCREENS[i]()
}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  show(m?Math.min(+m[1],SCREENS.length-1):0);
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
