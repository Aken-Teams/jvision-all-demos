<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>IMDS 國際材料資料系統</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#a16207;--accent2:#eab308;--accent-soft:#fef9c3;--accent-mid:#fde68a;
  --bg:#faf8f2;--panel:#ffffff;--ink:#2a2417;--muted:#78716c;--line:#ece7db;
  --ok:#15803d;--ok-soft:#dcfce7;--warn:#b45309;--warn-soft:#fef3c7;--bad:#b91c1c;--bad-soft:#fee2e2;
  --info:#0369a1;--info-soft:#e0f2fe;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(100deg,#3a2c08,#7a5209);color:#fff;box-shadow:0 2px 14px rgba(60,40,0,.22)}
.topbar-inner{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;flex:none;min-width:0}
.brand .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--accent2),#fbbf24);display:grid;place-items:center;color:#3a2c08;flex:none}
.brand .logo .material-symbols-outlined{font-size:24px}
.brand .tt{min-width:0}
.brand .tt b{display:block;font-size:15px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.brand .tt span{display:block;font-size:11px;color:#fde68a;white-space:nowrap}
.nav{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 auto;min-width:0;justify-content:flex-end}
.nav button{
  flex:none;white-space:nowrap;min-width:0;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;border:0;border-radius:10px;
  padding:8px 13px;font-family:inherit;font-size:13px;font-weight:600;
  color:#fef9c3;background:rgba(255,255,255,.09);transition:.15s;
}
.nav button .material-symbols-outlined{font-size:19px}
.nav button:hover{background:rgba(255,255,255,.2)}
.nav button.on{background:var(--accent2);color:#3a2c08;box-shadow:0 3px 9px rgba(234,179,8,.4)}
main{max-width:1360px;margin:0 auto;padding:22px 18px 60px}
.screen-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.screen-head h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.4px;display:flex;align-items:center;gap:10px}
.screen-head h1 .material-symbols-outlined{font-size:26px;color:var(--accent)}
.screen-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-mid)}
.chip .material-symbols-outlined{font-size:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(60,40,0,.04)}
.panel h3{margin:0 0 12px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.panel h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.sub{color:var(--muted);font-size:12px;font-weight:500}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(4,1fr)}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-2-1{grid-template-columns:2fr 1fr}
.g-1-2{grid-template-columns:1fr 2fr}
@media(max-width:820px){
  .g-kpi{grid-template-columns:repeat(2,1fr)}
  .g-2,.g-3,.g-2-1,.g-1-2{grid-template-columns:1fr}
}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden;min-width:0}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent2)}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--accent)}
.kpi .val{font-size:27px;font-weight:800;margin-top:6px;letter-spacing:.5px}
.kpi .val small{font-size:13px;font-weight:600;color:var(--muted)}
.kpi .dt{font-size:11px;margin-top:4px;font-weight:600}
.up{color:var(--ok)}.down{color:var(--bad)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;background:#fbf9f3}
tbody tr:hover{background:#fdfbf4}
td.num{font-variant-numeric:tabular-nums;font-weight:600}
.bd{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.bd .material-symbols-outlined{font-size:14px}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-info{background:var(--info-soft);color:var(--info)}
.b-mut{background:#f1ede3;color:var(--muted)}
.chart-box{position:relative;width:100%;height:260px}
.chart-sm{height:210px}
.chart-scroll{overflow-x:auto}
.bar{height:8px;border-radius:99px;background:#eee5cf;overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.tree{display:flex;flex-direction:column;gap:2px;font-size:13px}
.tnode{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#fff}
.tnode:hover{background:#fdfbf4}
.tnode .material-symbols-outlined{font-size:18px;color:var(--accent)}
.ind1{margin-left:22px}.ind2{margin-left:44px}
.pct{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:820px){.kb{grid-template-columns:1fr}}
.kb-col{background:#fbf9f3;border:1px solid var(--line);border-radius:14px;padding:11px;min-width:0}
.kb-col h4{margin:0 0 10px;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
.kb-col h4 .cnt{background:#fff;border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-size:11px;color:var(--muted)}
.kcard{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent2);border-radius:10px;padding:9px 10px;margin-bottom:9px;font-size:12px}
.kcard b{font-size:12.5px}
.kcard .m{color:var(--muted);font-size:11px;margin-top:3px;display:flex;align-items:center;gap:5px}
.kcard .m .material-symbols-outlined{font-size:14px}
.mtx-wrap{overflow-x:auto}
.mtx{border-collapse:collapse;min-width:600px;width:100%}
.mtx th,.mtx td{border:1px solid var(--line);text-align:center;padding:8px;font-size:12px;white-space:nowrap}
.mtx th{background:#fbf9f3}
.mtx td.subst{text-align:left;font-weight:600}
.cell{display:inline-block;width:100%;height:100%;font-weight:700;border-radius:6px;padding:3px 0}
.c-clean{background:var(--ok-soft);color:var(--ok)}
.c-decl{background:var(--warn-soft);color:var(--warn)}
.c-ban{background:var(--bad-soft);color:var(--bad)}
.c-na{background:#f4f1e9;color:#b8b0a0}
.gauge-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:820px){.gauge-row{grid-template-columns:1fr}}
.judge-list{display:flex;flex-direction:column;gap:9px}
.judge{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.judge .ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
.judge .ico .material-symbols-outlined{font-size:20px}
.judge .txt{min-width:0;flex:1 1 auto}
.judge .txt b{font-size:13px}
.judge .txt div{font-size:11.5px;color:var(--muted)}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--accent-mid)}
.tl-item{position:relative;padding:0 0 16px 6px}
.tl-item::before{content:"";position:absolute;left:-21px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent2);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent-mid)}
.tl-item .tt{font-size:13px;font-weight:700}
.tl-item .tm{font-size:11px;color:var(--muted)}
.tl-item .ds{font-size:12px;color:#57534e;margin-top:2px}
.sc-lvl{display:flex;gap:10px;align-items:stretch;margin-bottom:10px;flex-wrap:wrap}
.sc-tag{flex:none;align-self:center;font-size:11px;font-weight:800;color:var(--accent);width:56px}
.sc-nodes{display:flex;gap:9px;flex-wrap:wrap;flex:1 1 auto;min-width:0}
.sc-node{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 12px;font-size:12px;min-width:0;border-top:3px solid var(--accent2)}
.sc-node b{font-size:12.5px;display:block}
.sc-node .st{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
@media(max-width:560px){
  .nav button .txt-lbl{display:none}
  .nav button{padding:8px 10px}
}
/*ovfix*/@media(max-width:820px){.two,.g2,.g3,.g11,[class*="grid"]{grid-template-columns:1fr !important}}.chartbox,.chart-box{overflow:hidden;max-width:100%}.card,.panel,.two>*,[class*="grid"]>*{min-width:0}</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">database</span></div>
      <div class="tt"><b>IMDS 國際材料資料系統</b><span>International Material Data System · 材料合規管理平台</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</div>
<main><div id="view"></div></main>

<script>
"use strict";
var NAV=[
  {icon:"science",label:"材料建檔"},
  {icon:"forward_to_inbox",label:"申報追蹤"},
  {icon:"policy",label:"物質篩檢"},
  {icon:"verified",label:"合規判定"},
  {icon:"send",label:"客戶提交"},
  {icon:"account_tree",label:"供應鏈追溯"}
];
var view=document.getElementById("view");
var navEl=document.getElementById("nav");
var charts=[];
function destroyCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function mk(id,cfg){var el=document.getElementById(id);if(!el)return;var ch=new Chart(el.getContext("2d"),cfg);charts.push(ch);return ch;}

(function(){
  var h="";
  for(var i=0;i<NAV.length;i++){
    h+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+NAV[i].icon+'</span><span class="txt-lbl">'+NAV[i].label+'</span></button>';
  }
  navEl.innerHTML=h;
  var btns=navEl.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){show(+this.getAttribute("data-i"));});
  }
})();

var C_GRID="#ece7db",C_MUT="#78716c";
Chart.defaults.font.family="'Inter','Noto Sans TC',sans-serif";
Chart.defaults.color=C_MUT;
Chart.defaults.font.size=11.5;

function head(icon,title,desc,chipTxt,chipIcon){
  return '<div class="screen-head"><div><h1><span class="material-symbols-outlined">'+icon+'</span>'+title+'</h1><p>'+desc+'</p></div><span class="chip"><span class="material-symbols-outlined">'+(chipIcon||"bolt")+'</span>'+chipTxt+'</span></div>';
}
function kpi(lab,icon,val,unit,dt,dir){
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+icon+'</span>'+lab+'</div><div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div><div class="dt '+(dir||'')+'">'+dt+'</div></div>';
}

/* SCREEN 0: 材料建檔 MDS 成分樹 */
function s0(){
  var tree=[
    {lv:0,name:"料號 PN-4471 · 引擎支架總成",ic:"category",pct:"100.0%"},
    {lv:1,name:"半成品 · 鋁合金鑄件",ic:"widgets",pct:"78.4%"},
    {lv:2,name:"材料 · AlSi9Cu3 鑄鋁",ic:"grain",pct:"70.2%"},
    {lv:2,name:"物質 · 銅 Cu",ic:"radio_button_checked",pct:"3.1%"},
    {lv:1,name:"半成品 · 表面電鍍層",ic:"widgets",pct:"14.9%"},
    {lv:2,name:"物質 · 鋅 Zn",ic:"radio_button_checked",pct:"12.0%"},
    {lv:2,name:"物質 · 六價鉻 Cr(VI)",ic:"warning",pct:"0.02%"},
    {lv:1,name:"半成品 · 緊固件 M8",ic:"widgets",pct:"6.7%"}
  ];
  var th="";
  for(var i=0;i<tree.length;i++){var n=tree[i];th+='<div class="tnode '+(n.lv===1?'ind1':n.lv===2?'ind2':'')+'"><span class="material-symbols-outlined">'+n.ic+'</span><span>'+n.name+'</span><span class="pct">'+n.pct+'</span></div>';}
  var recent=[
    {pn:"PN-4471",nm:"引擎支架總成",node:24,comp:"92%",st:"建檔中",cls:"b-warn",ic:"edit"},
    {pn:"PN-3320",nm:"線束連接器",node:31,comp:"100%",st:"已完成",cls:"b-ok",ic:"check"},
    {pn:"PN-8815",nm:"ABS 控制殼",node:18,comp:"64%",st:"缺成分",cls:"b-bad",ic:"error"},
    {pn:"PN-2207",nm:"齒輪箱襯套",node:12,comp:"100%",st:"已完成",cls:"b-ok",ic:"check"},
    {pn:"PN-6640",nm:"密封橡膠圈",node:9,comp:"81%",st:"建檔中",cls:"b-warn",ic:"edit"}
  ];
  var rt="";
  for(var r=0;r<recent.length;r++){var x=recent[r];rt+='<tr><td class="num">'+x.pn+'</td><td>'+x.nm+'</td><td class="num">'+x.node+'</td><td class="num">'+x.comp+'</td><td><span class="bd '+x.cls+'"><span class="material-symbols-outlined">'+x.ic+'</span>'+x.st+'</span></td></tr>';}

  view.innerHTML=
    head("science","材料成分建檔 MDS","以樹狀結構建立零件的半成品、材料與物質層級，掌握成分完整度","建檔完成率 88%","donut_small")+
    '<div class="grid g-kpi" style="margin-bottom:14px">'+
      kpi("待建檔料號","assignment","46","件","本月新增 12","")+
      kpi("平均成分節點","account_tree","19.2","節點/件","涵蓋 3 層","")+
      kpi("成分完整度","donut_large","88","%","▲ 較上月 +6%","up")+
      kpi("缺件料號","report","7","件","▼ 減少 3 件","up")+
    '</div>'+
    '<div class="grid g-2-1">'+
      '<div class="panel"><h3><span class="material-symbols-outlined">account_tree</span>MDS 成分樹 · PN-4471 引擎支架總成 <span class="sub">（示意展開）</span></h3><div class="tree">'+th+'</div></div>'+
      '<div class="panel"><h3><span class="material-symbols-outlined">pie_chart</span>成分重量占比</h3><div class="chart-box chart-sm"><canvas id="c0a"></canvas></div></div>'+
    '</div>'+
    '<div class="panel" style="margin-top:14px"><h3><span class="material-symbols-outlined">history_edu</span>近期建檔料號</h3><div class="tbl-wrap"><table><thead><tr><th>料號</th><th>品名</th><th>節點數</th><th>完整度</th><th>狀態</th></tr></thead><tbody>'+rt+'</tbody></table></div></div>';

  void view.offsetHeight;
  mk("c0a",{type:"doughnut",data:{labels:["鑄鋁 AlSi9Cu3","鋅電鍍層","緊固件鋼材","其他物質"],datasets:[{data:[70.2,12.0,6.7,11.1],backgroundColor:["#a16207","#eab308","#fbbf24","#e7d9b0"],borderWidth:2,borderColor:"#fff"}]},options:{responsive:true,maintainAspectRatio:false,cutout:"58%",plugins:{legend:{position:"bottom",labels:{boxWidth:11,padding:9,font:{size:11}}}}}});
}

/* SCREEN 1: 申報追蹤 Kanban */
function s1(){
  var cols=[
    {t:"未發送",cnt:3,cards:[
      {b:"順昌精密",m:"PN-8815 · 需求 18 項物質",ic:"pending"},
      {b:"日鋼金屬",m:"PN-6640 · 需求 9 項物質",ic:"pending"},
      {b:"O豐橡膠",m:"PN-2207 · 需求 12 項物質",ic:"pending"}
    ]},
    {t:"已發送待回",cnt:4,cards:[
      {b:"O暘電材",m:"到期 08/22 · 已催 1 次",ic:"schedule"},
      {b:"O大工業",m:"到期 08/25",ic:"schedule"},
      {b:"至興精機",m:"到期 08/28",ic:"schedule"},
      {b:"廣運科技",m:"到期 08/30",ic:"schedule"}
    ]},
    {t:"已逾期",cnt:2,cards:[
      {b:"欣興電子",m:"逾期 6 天 · 已催 3 次",ic:"error"},
      {b:"O湖科技",m:"逾期 2 天 · 已催 2 次",ic:"error"}
    ]},
    {t:"已回覆",cnt:5,cards:[
      {b:"三陽金屬",m:"08/12 回覆 · 待審核",ic:"mark_email_read"},
      {b:"英利汽車",m:"08/11 回覆 · 待審核",ic:"mark_email_read"},
      {b:"為升電裝",m:"08/10 回覆 · 已審核",ic:"mark_email_read"}
    ]}
  ];
  var kb="";
  for(var i=0;i<cols.length;i++){
    var c=cols[i],cc="";
    for(var j=0;j<c.cards.length;j++){var cd=c.cards[j];cc+='<div class="kcard"><b>'+cd.b+'</b><div class="m"><span class="material-symbols-outlined">'+cd.ic+'</span>'+cd.m+'</div></div>';}
    kb+='<div class="kb-col"><h4>'+c.t+'<span class="cnt">'+c.cnt+'</span></h4>'+cc+'</div>';
  }
  view.innerHTML=
    head("forward_to_inbox","供應商申報請求追蹤","發送材料數據請求並追蹤各供應商回覆進度與逾期狀態","逾期率 14.3%","running_with_errors")+
    '<div class="grid g-kpi" style="margin-bottom:14px">'+
      kpi("進行中請求","outbox","14","筆","本週發出 6","")+
      kpi("平均回覆天數","schedule","5.8","天","▼ 較上月 -1.2","up")+
      kpi("申報完成率","task_alt","71","%","目標 90%","")+
      kpi("逾期供應商","warning","2","家","占 14.3%","down")+
    '</div>'+
    '<div class="panel" style="margin-bottom:14px"><h3><span class="material-symbols-outlined">view_kanban</span>申報請求看板</h3><div class="chart-scroll"><div class="kb">'+kb+'</div></div></div>'+
    '<div class="grid g-2">'+
      '<div class="panel"><h3><span class="material-symbols-outlined">stacked_bar_chart</span>各週申報狀態</h3><div class="chart-box"><canvas id="c1a"></canvas></div></div>'+
      '<div class="panel"><h3><span class="material-symbols-outlined">speed</span>供應商回覆時效分布</h3><div class="chart-box"><canvas id="c1b"></canvas></div></div>'+
    '</div>';
  void view.offsetHeight;
  mk("c1a",{type:"bar",data:{labels:["W29","W30","W31","W32","W33"],datasets:[
    {label:"已回覆",data:[8,10,9,12,11],backgroundColor:"#15803d",stack:"s"},
