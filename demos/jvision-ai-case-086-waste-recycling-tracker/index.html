<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>廢棄物回收追蹤站</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000;
  --color-secondary:#10b981;
  --color-on-secondary:#0f172a;
  --color-accent:#059669;
  --color-on-accent:#000;
  --color-background:#ecfdf5;
  --color-foreground:#064e3b;
  --color-card:#fff;
  --color-card-foreground:#064e3b;
  --color-muted:#e8f1f3;
  --color-muted-foreground:#475569;
  --color-border:#a7f3d0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#059669;
  --blue:#0369a1;
  --ink:#064e3b;
  --muted:#475569;
  --line:#a7f3d0;
  --green:#047857;
  --amber:#a16207;
  --accent2:#10b981;
  --panel:#fff;
  --soft:#f0fdf4;
  --grid:rgba(5,150,105,.09);
  --shadow:7px 7px 0 #064e3b;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{
  margin:0;
  min-width:320px;
  background-color:var(--color-background);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--ink);
  font-family:"Fira Sans",sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,a,[role=button]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:4px solid var(--color-ring);
  outline-offset:3px;
}
svg{display:block}
.icon{
  width:20px;height:20px;flex:none;
  stroke:currentColor;stroke-width:2;fill:none;
  stroke-linecap:square;stroke-linejoin:miter;
}
.icon-lg{width:27px;height:27px}
.topbar{
  position:sticky;top:0;z-index:50;
  color:#fff;
  background:var(--ink);
  border-bottom:4px solid #000;
}
.topbar-inner{
  max-width:1440px;margin:auto;padding:11px 20px;
  display:flex;align-items:center;gap:18px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-badge{
  width:44px;height:44px;display:grid;place-items:center;flex:none;
  color:#000;background:var(--color-secondary);
  border:3px solid #000;
}
.brand-txt{min-width:0}
.brand-txt b{
  display:block;font:700 17px/1.2 "Fira Code",monospace;
  letter-spacing:-.03em;
}
.brand-txt span{display:block;margin-top:3px;font-size:11px;color:#d1fae5}
.top-meta{
  margin-left:auto;display:flex;align-items:center;gap:8px;
  font:500 11px "Fira Code",monospace;
}
.chip{
  min-height:38px;padding:7px 10px;
  display:flex;align-items:center;gap:7px;
  color:#fff;border:1px solid #6ee7b7;background:#022c22;
}
.nav{
  max-width:1440px;margin:0 auto;padding:16px 20px 0;
}
.nav-row{
  display:grid;grid-template-columns:repeat(6,minmax(0,1fr));
  border:3px solid var(--ink);background:#fff;
}
.navbtn{
  min-height:58px;padding:9px 8px;
  display:flex;align-items:center;justify-content:center;gap:7px;
  border:0;border-right:2px solid var(--ink);
  color:var(--ink);background:#fff;
  font-weight:700;font-size:12px;
}
.navbtn:last-child{border-right:0}
.navbtn:hover{background:#d1fae5}
.navbtn.on{
  color:#000;background:var(--color-secondary);
  box-shadow:inset 0 -7px 0 #000;
}
.navbtn small{
  font:600 9px "Fira Code",monospace;
  color:inherit;opacity:.7;
}
main{max-width:1440px;margin:auto;padding:28px 20px 64px}
.screen{animation:screen-in .4s cubic-bezier(.2,.8,.2,1)}
.screen-head{
  margin-bottom:22px;padding:20px;
  display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;
  color:#fff;background:var(--ink);
  border:3px solid #000;box-shadow:var(--shadow);
}
.screen-head h1{
  margin:0;display:flex;align-items:center;gap:10px;
  font:700 clamp(22px,3vw,34px)/1.1 "Fira Code",monospace;
  letter-spacing:-.06em;
}
.screen-head p{margin:0 0 2px;color:#d1fae5;font-size:13px}
.tag{
  display:inline-block;padding:4px 8px;
  color:#000;background:var(--color-secondary);
  border:2px solid #000;
  font:700 10px "Fira Code",monospace;
  letter-spacing:0;
}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g2-21{grid-template-columns:2fr 1fr}
.mb{margin-bottom:18px}
.card,.kpi,.vcard{
  min-width:0;background:var(--panel);color:var(--ink);
  border:3px solid var(--ink);
}
.card{box-shadow:5px 5px 0 var(--ink)}
.card-h{
  min-height:48px;padding:10px 14px;
  display:flex;align-items:center;gap:8px;
  border-bottom:3px solid var(--ink);
  background:#d1fae5;
  font:700 13px "Fira Code",monospace;
}
.card-h .r{margin-left:auto;color:var(--muted);font:500 10px "Fira Code",monospace}
.card-pad{padding:16px}
.kpi{
  position:relative;padding:14px 14px 17px;
  overflow:hidden;box-shadow:4px 4px 0 var(--ink);
}
.kpi:nth-child(even){transform:translateY(7px)}
.kpi .ic{
  width:38px;height:38px;margin-bottom:12px;
  display:grid;place-items:center;
  color:#000;border:2px solid #000;
}
.kpi .lbl{font-weight:600;font-size:12px;color:var(--muted)}
.kpi .val{
  margin-top:2px;
  font:700 28px/1.15 "Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
.kpi .val small{font-size:12px;color:var(--muted)}
.kpi .dt{
  margin-top:8px;display:flex;align-items:center;gap:5px;
  font-weight:700;font-size:11px;
}
.kpi .dt svg{width:15px;height:15px}
.kpi .bar{position:absolute;inset:auto 0 0;height:7px}
.up{color:#047857}.down{color:#b91c1c}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.col{
  min-width:0;padding:10px;background:var(--soft);
  border:2px solid var(--ink);
}
.col-h{
  margin-bottom:10px;padding:2px 2px 9px;
  display:flex;align-items:center;gap:7px;
  border-bottom:2px dashed var(--ink);
  font:700 12px "Fira Code",monospace;
}
.dot{width:11px;height:11px;border:2px solid #000}
.cnt{
  margin-left:auto;padding:1px 7px;
  color:#000;background:#fff;border:2px solid var(--ink);
  font:700 10px "Fira Code",monospace;
}
.tik{
  margin-bottom:9px;padding:10px;
  background:#fff;border:2px solid var(--ink);
  border-left-width:8px;
}
.tik:last-child{margin-bottom:0}
.tt{
  display:flex;align-items:flex-start;justify-content:space-between;gap:8px;
  font-weight:700;font-size:12px;
}
.code,.mono{
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
.code{margin-top:2px;color:var(--muted);font-size:10px}
.meta{
  margin-top:6px;display:flex;flex-wrap:wrap;gap:5px 10px;
  color:var(--muted);font-size:10px;
}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta svg{width:13px;height:13px}
.wt{color:var(--ink);font-family:"Fira Code",monospace}
.b,.pill{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 7px;border:1px solid currentColor;
  font:700 10px "Fira Code",monospace;white-space:nowrap;
}
.b-g{color:#065f46;background:#d1fae5}
.b-a{color:#854d0e;background:#fef9c3}
.b-r{color:#991b1b;background:#fee2e2}
.b-b{color:#075985;background:#e0f2fe}
.b-s{color:#334155;background:#e2e8f0}
.tblwrap{overflow:auto}
table{
  width:100%;min-width:780px;border-collapse:collapse;
  font-size:12px;
}
th,td{
  padding:11px 12px;text-align:left;white-space:nowrap;
  border-right:1px solid var(--line);
  border-bottom:2px solid var(--ink);
}
th:last-child,td:last-child{border-right:0}
th{
  color:#fff;background:var(--ink);
  font:700 10px "Fira Code",monospace;
  letter-spacing:.04em;
}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#ecfdf5}
td.num{
  text-align:right;
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
.prog{height:14px;background:#dbe7e8;border:2px solid var(--ink)}
.prog i{display:block;height:100%}
.matrow{
  display:flex;align-items:center;gap:12px;padding:11px 0;
  border-bottom:2px solid var(--ink);
}
.matrow:last-child{border-bottom:0}
.matrow .nm{
  width:110px;flex:none;display:flex;align-items:center;gap:7px;
  font-weight:700;font-size:12px;
}
.sw{width:12px;height:12px;flex:none;border:1px solid #000}
.bwrap{flex:1;min-width:0}
.vv{
  width:130px;flex:none;text-align:right;
  font:500 11px "Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
.subgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:15px;align-items:center}
.donut-legend{display:flex;flex-direction:column;gap:7px}
.dl{display:flex;align-items:center;gap:7px;font-size:11px}
.dl b{
  margin-left:auto;text-align:right;
  font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums;
}
.tl{position:relative;padding-left:31px}
.tl:before{
  content:"";position:absolute;left:10px;top:8px;bottom:8px;
  width:4px;background:var(--ink);
}
.tl-item{position:relative;padding:0 0 22px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{
  position:absolute;left:-29px;top:1px;width:21px;height:21px;
  border:3px solid var(--ink);
}
.tl-t{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-weight:700;font-size:13px;
}
.tl-time{
  margin-top:2px;color:var(--muted);
  font:500 10px "Fira Code",monospace;
}
.tl-d{margin-top:5px;color:var(--muted);font-size:12px}
.chk{
  display:flex;align-items:flex-start;gap:10px;padding:11px 0;
  border-bottom:2px solid var(--ink);
}
.chk:last-child{border-bottom:0}
.ci{
  width:28px;height:28px;display:grid;place-items:center;flex:none;
  color:#fff;border:2px solid #000;
}
.ci svg{width:16px;height:16px}
.ct{font-weight:700;font-size:12px}
.cd{margin-top:2px;color:var(--muted);font-size:11px}
.cx{margin-left:auto;text-align:right;flex:none}
.vcard{padding:13px;box-shadow:4px 4px 0 var(--ink)}
.vh{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.vav{
  width:42px;height:42px;display:grid;place-items:center;flex:none;
  color:#000;border:2px solid #000;
  font:700 17px "Fira Code",monospace;
}
.vn{font-weight:700;font-size:13px}
.vs{color:var(--muted);font:500 10px "Fira Code",monospace}
.grade{
  margin-left:auto;font:700 24px "Fira Code",monospace;
}
.vstat{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--ink)}
.vstat>div{padding:8px 4px;text-align:center;border-right:2px solid var(--ink)}
.vstat>div:last-child{border-right:0}
.vv2{font:700 14px "Fira Code",monospace;font-variant-numeric:tabular-nums}
.vl2{color:var(--muted);font-size:9px}
.note{
  display:flex;align-items:flex-start;gap:7px;
  color:var(--muted);font-size:11px;
}
.note svg{color:var(--color-primary)}
.foot{
  margin-top:32px;padding:12px;
  text-align:center;color:#d1fae5;background:var(--ink);
  border:3px solid #000;
  font:500 10px "Fira Code",monospace;
}
@keyframes screen-in{
  from{opacity:0;transform:translateY(16px) scale(.985)}
  to{opacity:1;transform:none}
}
.grid-item{animation:grid-in .4s backwards cubic-bezier(.2,.9,.3,1.35)}
.grid-item:nth-child(2){animation-delay:.06s}
.grid-item:nth-child(3){animation-delay:.12s}
.grid-item:nth-child(4){animation-delay:.18s}
@keyframes grid-in{
  from{opacity:0;transform:translateY(16px) scale(.92)}
}
@media(max-width:1024px){
  .nav-row{grid-template-columns:repeat(3,1fr)}
  .navbtn:nth-child(3){border-right:0}
  .navbtn:nth-child(-n+3){border-bottom:2px solid var(--ink)}
  .g4{grid-template-columns:repeat(2,1fr)}
  .board{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:768px){
  .topbar-inner{align-items:flex-start}
  .top-meta{gap:4px}
  .chip{padding:7px}
  .chip span{display:none}
  .g3,.g2,.g2-21,.subgrid{grid-template-columns:1fr}
  .screen-head{align-items:flex-start;flex-direction:column}
}
@media(max-width:560px){
  .topbar-inner,.nav,main{padding-left:12px;padding-right:12px}
  .brand-txt span{display:none}
  .top-meta .chip:nth-child(-n+2){display:none}
  .nav-row{grid-template-columns:repeat(6,1fr)}
  .navbtn{min-height:52px;border-bottom:0!important}
  .navbtn:nth-child(3){border-right:2px solid var(--ink)}
  .navbtn .lbl-t,.navbtn small{display:none}
  .g4,.board{grid-template-columns:1fr}
  .kpi:nth-child(even){transform:none}
  .card-pad{padding:12px}
  .screen-head{padding:16px}
  .screen-head h1{font-size:21px}
  .matrow{gap:8px}
  .matrow .nm{width:90px}
  .vv{width:105px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    animation-duration:.01ms!important;
    animation-delay:0ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>
<body>

 return '<div class="screen-head"><h1>'+icon(ic,"icon-lg")+title+

}

 return '<article class="kpi grid-item"><div class="ic" style="background:'+o.c+'">'+icon(o.ic)+'</div>'+

 '<div class="bar" style="background:'+o.c+'"></div></article>'
}

var STATUS={"待派工":{c:"#94a3b8"},"清運中":{c:"#10b981"},"待磅重":{c:"#38bdf8"},"已完成":{c:"#059669"}};

}

var CHARTS=[null,chart1,chart2,null,chart4,chart5];
function show(i){
 i=Math.max(0,Math.min(i,5));
 if(chart){try{chart.destroy()}catch(e){}chart=null}
 document.querySelectorAll("[data-i]").forEach(function(b){
  var on=+b.getAttribute("data-i")===i;
  b.classList.toggle("on",on);
  b.setAttribute("aria-current",on?"page":"false")
 });
 var v=document.getElementById("view");
 v.innerHTML='<div class="screen">'+RENDER[i]()+'</div>';
 document.title=NAV[i].t+"｜廢棄物回收追蹤站";
 if(CHARTS[i]){try{CHARTS[i]()}catch(e){}}
}
function fromHash(){
 var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
 show(m?Math.min(+m[1],5):0);
 try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
</body>
</html>
