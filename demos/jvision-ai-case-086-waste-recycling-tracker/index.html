<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>廢棄物回收追蹤站</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#dc2626; --accent2:#f97316;
  --bg:#f5f5f4; --panel:#ffffff; --ink:#1c1917; --muted:#78716c;
  --line:#e7e5e4; --soft:#fafaf9;
  --green:#16a34a; --amber:#d97706; --blue:#2563eb; --slate:#475569;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter','Noto Sans TC',system-ui,sans-serif;
  background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; line-height:1.5;
}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;vertical-align:middle;}
.mi{font-size:20px;}

/* ===== TOP NAV ===== */
.topbar{
  position:sticky; top:0; z-index:50;
  background:linear-gradient(120deg,#7f1d1d,#dc2626 55%,#f97316);
  color:#fff; box-shadow:0 2px 10px rgba(0,0,0,.15);
}
.topbar-inner{max-width:1440px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand-badge{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none;border:1px solid rgba(255,255,255,.25);}
.brand-badge .material-symbols-outlined{font-size:24px;}
.brand-txt{display:flex;flex-direction:column;min-width:0;}
.brand-txt b{font-size:16px;font-weight:800;letter-spacing:.5px;white-space:nowrap;}
.brand-txt span{font-size:11px;opacity:.85;white-space:nowrap;}
.top-meta{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:12px;opacity:.92;flex-wrap:wrap;}
.top-meta .chip{background:rgba(255,255,255,.15);padding:5px 10px;border-radius:20px;display:flex;align-items:center;gap:5px;white-space:nowrap;}

/* ===== NAV BUTTONS ===== */
.nav{max-width:1440px;margin:0 auto;padding:0 20px;}
.nav-row{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);}
.navbtn{
  flex:none;white-space:nowrap;cursor:pointer;border:1px solid var(--line);
  background:var(--panel);color:var(--slate);font-family:inherit;font-size:13px;font-weight:600;
  padding:9px 14px;border-radius:10px;display:flex;align-items:center;gap:7px;transition:.15s;
}
.navbtn:hover{border-color:var(--accent);color:var(--accent);}
.navbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(220,38,38,.28);}
.navbtn .material-symbols-outlined{font-size:19px;}
.navbtn small{font-size:10px;opacity:.6;font-weight:500;}

/* ===== MAIN ===== */
main{max-width:1440px;margin:0 auto;padding:22px 20px 60px;}
.screen-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
.screen-head h2{margin:0;font-size:22px;font-weight:800;display:flex;align-items:center;gap:9px;}
.screen-head h2 .material-symbols-outlined{color:var(--accent);font-size:26px;}
.screen-head p{margin:0;color:var(--muted);font-size:13px;}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:#fef2f2;color:var(--accent);border:1px solid #fecaca;}

/* grids */
.grid{display:grid;gap:14px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g2-13{grid-template-columns:1fr 2fr;}
.g2-21{grid-template-columns:2fr 1fr;}
@media(max-width:820px){
  .g4,.g3,.g2,.g2-13,.g2-21{grid-template-columns:1fr;}
}
.grid>*{min-width:0;}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);}
.card-pad{padding:16px;}
.card-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;}
.card-h .material-symbols-outlined{color:var(--accent);font-size:20px;}
.card-h .r{margin-left:auto;font-size:11px;font-weight:600;color:var(--muted);}

/* KPI */
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.kpi .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;margin-bottom:10px;}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600;}
.kpi .val{font-size:26px;font-weight:800;line-height:1.15;margin-top:2px;}
.kpi .val small{font-size:13px;font-weight:600;color:var(--muted);}
.kpi .dt{font-size:11px;font-weight:700;margin-top:6px;display:inline-flex;align-items:center;gap:3px;}
.up{color:var(--green);}.down{color:var(--accent);}
.kpi .bar{position:absolute;left:0;bottom:0;height:3px;}

/* board / kanban */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media(max-width:820px){.board{grid-template-columns:1fr;}}
.board>*{min-width:0;}
.col{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px;}
.col-h{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13px;margin-bottom:9px;padding-bottom:8px;border-bottom:1px dashed var(--line);}
.col-h .dot{width:9px;height:9px;border-radius:50%;flex:none;}
.col-h .cnt{margin-left:auto;font-size:11px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 8px;color:var(--muted);}
.tik{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:9px;box-shadow:var(--shadow);border-left:3px solid var(--accent);}
.tik:last-child{margin-bottom:0;}
.tik .tt{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;justify-content:space-between;}
.tik .code{font-size:10px;color:var(--muted);font-weight:600;}
.tik .meta{font-size:11px;color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:6px 10px;}
.tik .meta span{display:inline-flex;align-items:center;gap:3px;}
.tik .wt{font-weight:800;color:var(--ink);}
.pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;}

/* table */
.tblwrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);background:var(--soft);font-weight:700;position:sticky;top:0;}
tbody tr:hover{background:var(--soft);}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}
.mono{font-variant-numeric:tabular-nums;}

/* badges */
.b{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
.b-g{background:#dcfce7;color:#15803d;}
.b-a{background:#fef3c7;color:#b45309;}
.b-r{background:#fee2e2;color:#b91c1c;}
.b-b{background:#dbeafe;color:#1d4ed8;}
.b-s{background:#f1f5f9;color:#475569;}

/* progress */
.prog{height:8px;background:#f1f5f9;border-radius:20px;overflow:hidden;}
.prog>i{display:block;height:100%;border-radius:20px;}

/* timeline */
.tl{position:relative;padding-left:26px;}
.tl:before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl-item{position:relative;padding:0 0 18px 0;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot{position:absolute;left:-22px;top:2px;width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);}
.tl-item .tl-t{font-weight:700;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.tl-item .tl-d{font-size:12px;color:var(--muted);margin-top:3px;}
.tl-item .tl-time{font-size:11px;color:var(--muted);font-weight:600;}

/* matrix / material bars */
.matrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
.matrow:last-child{border-bottom:none;}
.matrow .nm{width:96px;flex:none;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;}
.matrow .nm .sw{width:10px;height:10px;border-radius:3px;flex:none;}
.matrow .bwrap{flex:1;min-width:0;}
.matrow .vv{width:118px;flex:none;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;}

/* vendor cards */
.vcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);}
.vcard .vh{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.vcard .vav{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;flex:none;}
.vcard .vn{font-weight:800;font-size:14px;}
.vcard .vs{font-size:11px;color:var(--muted);}
.vcard .grade{margin-left:auto;font-size:20px;font-weight:900;flex:none;}
.vstat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px;}
.vstat>div{background:var(--soft);border-radius:9px;padding:8px;text-align:center;}
.vstat .vv2{font-weight:800;font-size:15px;}
.vstat .vl2{font-size:10px;color:var(--muted);}

/* compliance checklist */
.chk{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);}
.chk:last-child{border-bottom:none;}
.chk .ci{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;color:#fff;font-size:16px;}
.chk .ct{font-weight:700;font-size:13px;}
.chk .cd{font-size:12px;color:var(--muted);margin-top:2px;}
.chk .cx{margin-left:auto;flex:none;text-align:right;}

.note{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.foot{margin-top:26px;text-align:center;font-size:11px;color:var(--muted);}
.donut-legend{display:flex;flex-direction:column;gap:8px;justify-content:center;}
.donut-legend .dl{display:flex;align-items:center;gap:8px;font-size:12px;}
.donut-legend .dl .sw{width:11px;height:11px;border-radius:3px;flex:none;}
.donut-legend .dl b{margin-left:auto;font-variant-numeric:tabular-nums;}
.subgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center;}
@media(max-width:820px){.subgrid{grid-template-columns:1fr;}}
.subgrid>*{min-width:0;}
</style>
</head>

/* =================== SHOW =================== */
var RENDER=[screen0,screen1,screen2,screen3,screen4,screen5];
var CHARTS=[null,chart1,chart2,null,chart4,chart5];

function show(i){
  i=Math.max(0,Math.min(i,RENDER.length-1));
  if(chart){try{chart.destroy();}catch(e){}chart=null;}
  var btns=document.querySelectorAll('[data-i]');
  for(var k=0;k<btns.length;k++){btns[k].classList.toggle('on',+btns[k].getAttribute('data-i')===i);}
  var c=document.getElementById('view');
  c.innerHTML=RENDER[i]();
  void c.offsetHeight;
  if(CHARTS[i]){try{CHARTS[i]();}catch(e){}}
}

show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
