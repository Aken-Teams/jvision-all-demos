<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>存貨成本與呆滯料提列系統 Demo</title>
  <meta name="description" content="存貨計價、呆滯料齡分析與呆滯/跌價損失提列的單一操作平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root{
      --accent:#ea580c; --accent2:#fb923c; --accent-soft:#fff3ec;
      --ink:#1c1917; --muted:#78716c; --line:#eee6df; --bg:#f7f4f1; --card:#ffffff;
      --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
      background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
      min-width:0;
    }
    .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;line-height:1;vertical-align:middle;}
    a{color:inherit;text-decoration:none}

    /* top nav */
    .topbar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);}
    .topbar-in{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0;}
    .brand{display:flex;align-items:center;gap:10px;min-width:0;}
    .brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto;box-shadow:0 4px 12px rgba(234,88,12,.32);}
    .brand .logo .material-symbols-outlined{font-size:22px}
    .brand b{font-size:15px;font-weight:800;display:block;line-height:1.2}
    .brand span{font-size:11px;color:var(--muted)}
    .nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto;min-width:0;}
    .nav button{
      display:flex;align-items:center;gap:7px;border:1px solid transparent;background:transparent;
      color:var(--muted);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
      padding:8px 12px;border-radius:10px;white-space:nowrap;
    }
    .nav button .material-symbols-outlined{font-size:19px}
    .nav button:hover{background:var(--accent-soft);color:var(--accent)}
    .nav button.on{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(234,88,12,.3)}

    main{max-width:1360px;margin:0 auto;padding:20px 18px 60px;min-width:0;}
    .screen-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
    .screen-head .ic{width:46px;height:46px;border-radius:13px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
    .screen-head .ic .material-symbols-outlined{font-size:26px}
    .screen-head h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
    .screen-head p{margin:3px 0 0;font-size:13px;color:var(--muted);max-width:640px}
    .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-left:auto;white-space:nowrap}

    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;}
    .card-t{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin:0 0 12px}
    .card-t .material-symbols-outlined{font-size:19px;color:var(--accent)}
    .card-t small{font-weight:500;color:var(--muted);font-size:11px;margin-left:auto}

    /* grid helpers via classes (RWD) */
    .grid{display:grid;gap:14px;min-width:0}
    .g-kpi{grid-template-columns:repeat(4,1fr)}
    .g-2{grid-template-columns:1fr 1fr}
    .g-3{grid-template-columns:repeat(3,1fr)}
    .g-2a{grid-template-columns:1.5fr 1fr}
    .g-2b{grid-template-columns:1fr 1.3fr}
    @media(max-width:820px){
      .g-kpi{grid-template-columns:1fr 1fr}
      .g-2,.g-3,.g-2a,.g-2b{grid-template-columns:1fr}
    }

    .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
    .kpi .lab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
    .kpi .lab .material-symbols-outlined{font-size:16px;color:var(--accent)}
    .kpi .val{font-size:24px;font-weight:900;letter-spacing:-.02em;margin-top:6px}
    .kpi .val small{font-size:12px;font-weight:600;color:var(--muted)}
    .kpi .delta{font-size:11px;font-weight:700;margin-top:4px}
    .up{color:var(--bad)}.down{color:var(--ok)}

    table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
    th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
    th{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em;background:#fbf8f5}
    td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
    tbody tr:hover{background:var(--accent-soft)}
    .tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
    .t-ok{background:#e7f6ec;color:var(--ok)}
    .t-warn{background:#fdf0dc;color:var(--warn)}
    .t-bad{background:#fdeaea;color:var(--bad)}
    .t-info{background:#e6effd;color:var(--info)}
    .t-mute{background:#f0ece8;color:var(--muted)}

    .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .chart{width:100%;height:280px;overflow:hidden}
    .chart.sm{height:220px}

    /* kanban board */
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0}
    @media(max-width:820px){.board{grid-template-columns:1fr 1fr}}
    @media(max-width:520px){.board{grid-template-columns:1fr}}
    .col{background:#faf7f4;border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
    .col-h{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;margin-bottom:10px}
    .col-h .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
    .col-h .cnt{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px}
    .kcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:9px;border-left:3px solid var(--accent)}
    .kcard .sku{font-size:12px;font-weight:800}
    .kcard .nm{font-size:11px;color:var(--muted);margin:2px 0 7px}
    .kcard .row{display:flex;align-items:center;justify-content:space-between;font-size:11px}
    .kcard .amt{font-weight:800;font-variant-numeric:tabular-nums}
    .barmini{height:5px;border-radius:4px;background:#f0ece8;overflow:hidden;margin-top:7px}
    .barmini i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2))}

    /* timeline */
    .tl{position:relative;padding-left:22px}
    .tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
    .tl-i{position:relative;padding:0 0 16px 0}
    .tl-i:before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
    .tl-i.done:before{background:var(--accent)}
    .tl-i .tt{font-size:13px;font-weight:800}
    .tl-i .mt{font-size:11px;color:var(--muted);margin-top:2px}
    .tl-i .dd{font-size:12px;margin-top:5px;color:#44403c}

    .prog{height:8px;border-radius:6px;background:#f0ece8;overflow:hidden}
    .prog i{display:block;height:100%;border-radius:6px}
    .list{list-style:none;padding:0;margin:0}
    .li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px}
    .li:last-child{border-bottom:0}
    .li .ib{width:32px;height:32px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
    .li .ib .material-symbols-outlined{font-size:18px}
    .li b{font-size:12.5px}
    .li .sub{font-size:11px;color:var(--muted)}
    .li .end{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}

    .seg{display:inline-flex;background:#faf7f4;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
    .seg span{font-size:11.5px;font-weight:700;color:var(--muted);padding:5px 11px;border-radius:8px}
    .seg span.on{background:#fff;color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.06)}

    .note{font-size:11.5px;color:var(--muted);display:flex;align-items:flex-start;gap:7px;margin-top:10px}
    .note .material-symbols-outlined{font-size:16px;color:var(--accent);flex:0 0 auto}
    .mono{font-variant-numeric:tabular-nums;font-weight:700}

    @media(max-width:560px){
      .nav button span.txt{display:none}
      .nav button{padding:8px 9px}
      .brand span{display:none}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">inventory_2</span></div>
        <div>
          <b>存貨成本與呆滯料提列</b>
          <span>Inventory Costing &amp; Obsolescence Provision</span>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
    </div>
  </header>
  <main id="app"></main>

  <script>
  (function(){
    var charts=[];
    function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
    function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts.push(c);}
    function fmt(n){return n.toLocaleString("en-US");}

    var SCREENS=[
      {icon:"inventory_2",name:"存貨計價設定",txt:"計價設定"},
      {icon:"history",name:"呆滯料齡分析",txt:"料齡分析"},
      {icon:"trending_up",name:"跌價損失評估",txt:"跌價評估"},
      {icon:"request_quote",name:"提列計算引擎",txt:"提列計算"},
      {icon:"fact_check",name:"覆核與傳票",txt:"覆核傳票"},
      {icon:"insights",name:"報表與稽核",txt:"報表稽核"}
    ];

    // ---------- shared fake data ----------
    var accent="#ea580c",accent2="#fb923c";
    var axis={axisLine:{lineStyle:{color:"#e7ddd4"}},axisLabel:{color:"#8a8078",fontSize:11},splitLine:{lineStyle:{color:"#f2ece6"}}};

    function head(i,desc,pill){
      return '<div class="screen-head"><div class="ic"><span class="material-symbols-outlined">'+SCREENS[i].icon+'</span></div>'+
        '<div><h1>'+SCREENS[i].name+'</h1><p>'+desc+'</p></div>'+
        (pill?'<span class="pill"><span class="material-symbols-outlined" style="font-size:15px">bolt</span>'+pill+'</span>':'')+'</div>';
    }

    // ================= SCREEN 0 : 存貨計價設定 =================
    function s0(c){
      var rows=[
        ["RM-1042","冷軋鋼捲 SPCC 1.2mm","移動平均",2860,"公斤",4210,"NTD",1,"t-ok","已入帳"],
        ["RM-2087","鋁合金錠 A6063","移動平均",1740,"公斤",5980,"NTD",1,"t-ok","已入帳"],
        ["WIP-3310","沖壓半成品 F-220","先進先出",980,"件",128,"NTD",1,"t-warn","待結算"],
        ["FG-5501","精密齒輪 G-88","移動平均",520,"件",1860,"NTD",1,"t-ok","已入帳"],
        ["RM-1188","工程塑膠粒 PA66","先進先出",6200,"公斤",92,"NTD",1,"t-warn","待結算"],
        ["FG-6620","伺服馬達殼 M-30","移動平均",310,"件",2440,"NTD",1,"t-ok","已入帳"]
      ];
      var tb="";for(var i=0;i<rows.length;i++){var r=rows[i];
        tb+='<tr><td class="mono">'+r[0]+'</td><td>'+r[1]+'</td><td><span class="tag t-info">'+r[2]+'</span></td>'+
          '<td class="num mono">'+fmt(r[3])+' '+r[4]+'</td><td class="num mono">'+r[6]+' '+fmt(r[5])+'</td>'+
          '<td class="num mono">'+r[6]+' '+fmt(r[3]*r[5])+'</td><td><span class="tag '+r[7]+'">'+r[8]+'</span></td></tr>';
      }
      c.innerHTML=head(0,"設定各料號的存貨計價法（移動平均／先進先出），結算月末單位成本並完成成本入帳，作為呆滯與跌價評估的基礎。","本月 07/31 結算")+
        '<div class="grid g-kpi" style="margin-bottom:14px">'+
          kpi("account_tree","計價料號","1,284","+36 本月","up")+
          kpi("payments","存貨帳面總值","NTD 4.82 億","+2.1%","up")+
          kpi("rule","移動平均占比","68%","852 料號","")+
          kpi("task_alt","已完成入帳","94.5%","71 筆待結","down")+
        '</div>'+
        '<div class="grid g-2b">'+
          '<div class="card"><div class="card-t"><span class="material-symbols-outlined">payments</span>各料類存貨帳面值分佈<small>NTD 萬元</small></div><div id="c0a" class="chart sm"></div></div>'+
          '<div class="card"><div class="card-t"><span class="material-symbols-outlined">rule</span>計價法設定比例</div><div id="c0b" class="chart sm"></div></div>'+
        '</div>'+
        '<div class="card" style="margin-top:14px"><div class="card-t"><span class="material-symbols-outlined">inventory_2</span>月末存貨結存與單位成本<small>2026/07 結算</small></div>'+
          '<div class="scroll"><table><thead><tr><th>料號</th><th>品名</th><th>計價法</th><th class="num">結存數量</th><th class="num">單位成本</th><th class="num">帳面金額</th><th>狀態</th></tr></thead><tbody>'+tb+'</tbody></table></div>'+
          '<div class="note"><span class="material-symbols-outlined">info</span>先進先出料號需依批次順序結算，系統自動帶入最舊批次成本；待結算料號將於月結批次一併入帳。</div></div>';
      void c.offsetHeight;
      mk("c0a",{grid:{left:44,right:12,top:16,bottom:26},tooltip:{trigger:"axis"},
        xAxis:Object.assign({type:"category",data:["原物料","在製品","半成品","成品","備品"]},axis),
        yAxis:Object.assign({type:"value"},axis),
        series:[{type:"bar",data:[19800,8600,5400,12400,2200],itemStyle:{color:accent,borderRadius:[6,6,0,0]},barWidth:"52%"}]});
      mk("c0b",{tooltip:{trigger:"item"},legend:{bottom:0,textStyle:{fontSize:11,color:"#8a8078"}},
        series:[{type:"pie",radius:["46%","72%"],center:["50%","44%"],label:{show:false},
          data:[{value:852,name:"移動平均",itemStyle:{color:accent}},{value:432,name:"先進先出",itemStyle:{color:accent2}}]}]});
    }

    // ================= SCREEN 1 : 呆滯料齡分析（KANBAN signature） =================
    function s1(c){
      var cols=[
        {t:"0–90 天（正常）",clr:"#16a34a",cnt:842,cards:[
          {sku:"RM-1042",nm:"冷軋鋼捲 SPCC",amt:"12.0M",age:"18 天",pct:20},
          {sku:"FG-5501",nm:"精密齒輪 G-88",amt:"9.7M",age:"42 天",pct:47}
        ]},
        {t:"91–180 天（觀察）",clr:"#2563eb",cnt:214,cards:[
          {sku:"WIP-3310",nm:"沖壓半成品 F-220",amt:"1.3M",age:"126 天",pct:70},
          {sku:"RM-2087",nm:"鋁合金錠 A6063",amt:"4.4M",age:"152 天",pct:84}
        ]},
        {t:"181–365 天（呆滯）",clr:"#d97706",cnt:96,cards:[
          {sku:"FG-4401","nm":"舊款控制器 C-15",amt:"2.8M",age:"288 天",pct:79},
          {sku:"RM-1188",nm:"工程塑膠粒 PA66",amt:"0.57M",age:"333 天",pct:91}
        ]},
        {t:"逾 365 天（呆廢）",clr:"#dc2626",cnt:58,cards:[
          {sku:"FG-2203",nm:"停產機殼 H-09",amt:"3.6M",age:"612 天",pct:100},
          {sku:"WIP-1990",nm:"報廢治具 J-77",amt:"0.42M",age:"540 天",pct:100}
        ]}
      ];
      var board="";
      for(var i=0;i<cols.length;i++){var col=cols[i];var cc="";
        for(var j=0;j<col.cards.length;j++){var k=col.cards[j];
          cc+='<div class="kcard" style="border-left-color:'+col.clr+'"><div class="row"><span class="sku">'+k.sku+'</span><span class="amt">'+k.amt+'</span></div>'+
            '<div class="nm">'+k.nm+'</div><div class="row"><span style="color:#8a8078">庫齡 '+k.age+'</span><span class="tag t-mute">占存 '+k.pct+'%</span></div>'+
            '<div class="barmini"><i style="width:'+k.pct+'%;background:'+col.clr+'"></i></div></div>';
        }
        board+='<div class="col"><div class="col-h"><span class="dot" style="background:'+col.clr+'"></span>'+col.t+'<span class="cnt">'+col.cnt+'</span></div>'+cc+'</div>';
      }
      c.innerHTML=head(1,"依 SKU 統計庫齡分佈，將料號分佈於庫齡看板中，逾期未動用者依呆滯風險金額排序，鎖定需評估提列的品項。","看板視圖")+
        '<div class="grid g-kpi" style="margin-bottom:14px">'+
          kpi("history","平均庫齡","74 天","+6 天","up")+
          kpi("warning","呆滯料號","154 項","占 12%","up")+
          kpi("payments","呆滯庫存金額","NTD 3,940 萬","+8.2%","up")+
          kpi("trending_up","逾一年占比","4.5%","58 料號","up")+
        '</div>'+
        '<div class="card" style="margin-bottom:14px"><div class="card-t"><span class="material-symbols-outlined">history</span>呆滯料齡看板<small>依庫齡級距分群 · 卡片依金額排序</small></div>'+
          '<div class="scroll"><div class="board">'+board+'</div></div></div>'+
        '<div class="grid g-2">'+
          '<div class="card"><div class="card-t"><span class="material-symbols-outlined">insights</span>各庫齡級距金額分佈<small>NTD 萬元</small></div><div id="c1a" class="chart sm"></div></div>'+
          '<div class="card"><div class="card-t"><span class="material-symbols-outlined">monitoring</span>呆滯庫存金額趨勢<small>近 6 月</small></div><div id="c1b" class="chart sm"></div></div>'+
        '</div>';
      void c.offsetHeight;
      mk("c1a",{grid:{left:44,right:12,top:16,bottom:26},tooltip:{trigger:"axis"},
        xAxis:Object.assign({type:"category",data:["0-90","91-180","181-365","逾365"]},axis),
        yAxis:Object.assign({type:"value"},axis),
        series:[{type:"bar",barWidth:"52%",data:[
          {value:21700,itemStyle:{color:"#16a34a"}},{value:5800,itemStyle:{color:"#2563eb"}},
          {value:3370,itemStyle:{color:"#d97706"}},{value:4020,itemStyle:{color:"#dc2626"}}],itemStyle:{borderRadius:[6,6,0,0]}}]});
      mk("c1b",{grid:{left:46,right:14,top:16,bottom:26},tooltip:{trigger:"axis"},
        xAxis:Object.assign({type:"category",data:["2月","3月","4月","5月","6月","7月"]},axis),
        yAxis:Object.assign({type:"value"},axis),
        series:[{type:"line",smooth:true,data:[3120,3260,3410,3550,3710,3940],areaStyle:{color:"rgba(234,88,12,.14)"},lineStyle:{color:accent,width:3},itemStyle:{color:accent},symbolSize:7}]});
    }

    // ================= SCREEN 2 : 跌價損失評估 =================
    function s2(c){
      var rows=[
        ["FG-2203","停產機殼 H-09","成品",280,3600,"12,857","5,600","-7,257","-56.5%","t-bad"],
        ["FG-4401","舊款控制器 C-15","成品",640,2800,"4,375","2,750","-1,625","-37.1%","t-bad"],
        ["RM-1188","工程塑膠粒 PA66","原物料",6200,570,"92","78","-86.8萬","-15.2%","t-warn"],
