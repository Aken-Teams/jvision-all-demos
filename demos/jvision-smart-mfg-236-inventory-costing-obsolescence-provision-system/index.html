<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>存貨成本與呆滯料提列系統 Demo</title>
  <meta name="description" content="存貨計價、呆滯料齡分析與呆滯/跌價損失提列的單一操作平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
:root{
  --color-primary:#0f172a;
  --color-on-primary:#ffffff;
  --color-secondary:#1e293b;
  --color-on-secondary:#ffffff;
  --color-accent:#22c55e;
  --color-on-accent:#0f172a;
  --color-background:#020617;
  --color-foreground:#f8fafc;
  --color-card:#0e1223;
  --color-card-foreground:#f8fafc;
  --color-muted:#1a1e2f;
  --color-muted-foreground:#94a3b8;
  --color-border:#334155;
  --color-destructive:#ef4444;
  --color-ring:#ffffff;
  --blue:#38bdf8;
  --ink:#f8fafc;
  --muted:#94a3b8;
  --line:#334155;
  --bg:#020617;
  --card:#0e1223;
  --accent:#22c55e;
  --accent2:#38bdf8;
  --accent-soft:#102a20;
  --ok:#4ade80;
  --warn:#fbbf24;
  --bad:#f87171;
  --info:#7dd3fc;
}
*{box-sizing:border-box}
html{color-scheme:dark;background:var(--bg)}
html,body{margin:0;padding:0}
body{
  min-width:0;
  background-color:var(--bg);
  background-image:linear-gradient(rgba(51,65,85,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(51,65,85,.18) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Fira Sans",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;line-height:1;vertical-align:middle}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
::selection{background:var(--accent);color:var(--color-on-accent)}

.topbar{position:sticky;top:0;z-index:30;background:rgba(2,6,23,.97);border-bottom:2px solid var(--line)}
.topbar-in{max-width:1440px;margin:0 auto;padding:0 20px;display:flex;align-items:stretch;gap:20px;min-width:0}
.brand{display:flex;align-items:center;gap:12px;min-width:290px;padding:12px 0}
.brand .logo{width:42px;height:42px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:var(--accent);color:var(--color-on-accent);border:2px solid var(--ink);box-shadow:5px 5px 0 var(--blue)}
.brand .logo .material-symbols-outlined{font-size:23px}
.brand b{display:block;font-size:15px;font-weight:700;line-height:1.2;letter-spacing:.01em}
.brand span{font:500 10px/1.4 "Fira Code",monospace;color:#cbd5e1;text-transform:uppercase}
.nav{display:flex;align-items:stretch;margin-left:auto;min-width:0;overflow-x:auto;scrollbar-width:thin}
.nav button{display:flex;align-items:center;justify-content:center;gap:7px;min-height:66px;padding:10px 13px;border:0;border-left:1px solid var(--line);background:transparent;color:#cbd5e1;font-size:12px;font-weight:700;white-space:nowrap}
.nav button:last-child{border-right:1px solid var(--line)}
.nav button:hover{background:var(--muted);color:#fff}
.nav button.on{background:var(--accent);color:var(--color-on-accent);box-shadow:inset 0 -5px 0 #fff}
.nav button .material-symbols-outlined{font-size:19px}
.nav button:focus-visible{position:relative;z-index:2;outline-offset:-4px}

main{max-width:1440px;margin:0 auto;padding:28px 20px 64px;min-width:0}
.screen-head{position:relative;display:grid;grid-template-columns:54px minmax(0,1fr) auto;align-items:start;gap:14px;margin-bottom:20px;padding:20px;background:var(--color-primary);border:2px solid var(--line);border-left:8px solid var(--accent);box-shadow:8px 8px 0 #000}
.screen-head .ic{width:54px;height:54px;display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--color-on-accent);border:2px solid #fff}
.screen-head .ic .material-symbols-outlined{font-size:28px}
.screen-head h1{margin:0;font-size:clamp(20px,2.2vw,30px);font-weight:700;line-height:1.12;letter-spacing:-.03em}
.screen-head p{max-width:760px;margin:7px 0 0;color:#cbd5e1;font-size:13px;line-height:1.65}
.pill{display:inline-flex;align-items:center;gap:6px;align-self:start;margin-left:auto;padding:8px 11px;background:var(--accent);color:var(--color-on-accent);border:2px solid #fff;font:700 11px/1 "Fira Code",monospace;white-space:nowrap;text-transform:uppercase}

.grid{display:grid;gap:14px;min-width:0}
.g-kpi{grid-template-columns:repeat(4,1fr)}
.g-2{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-2a{grid-template-columns:1.5fr 1fr}
.g-2b{grid-template-columns:1fr 1.3fr}
.card,.kpi{min-width:0;background:var(--card);color:var(--color-card-foreground);border:2px solid var(--line);box-shadow:5px 5px 0 rgba(0,0,0,.8)}
.card{padding:16px}
.card-t{display:flex;align-items:center;gap:8px;margin:0 0 14px;padding-bottom:10px;border-bottom:2px solid var(--line);font-size:14px;font-weight:700;letter-spacing:.01em}
.card-t .material-symbols-outlined{font-size:20px;color:var(--accent)}
.card-t small{margin-left:auto;color:#cbd5e1;font:500 10px/1.3 "Fira Code",monospace;text-align:right}
.kpi{position:relative;overflow:hidden;padding:15px;border-top:5px solid var(--accent)}
.kpi::after{content:"";position:absolute;right:-18px;bottom:-18px;width:58px;height:58px;border:8px solid rgba(34,197,94,.09);transform:rotate(45deg)}
.kpi .lab{display:flex;align-items:center;gap:7px;color:#cbd5e1;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--accent)}
.kpi .val{position:relative;z-index:1;margin-top:10px;font:700 clamp(20px,2.1vw,28px)/1.05 "Fira Code",monospace;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:11px;color:#cbd5e1}
.kpi .delta{margin-top:7px;font:700 10px/1.2 "Fira Code",monospace}
.up{color:var(--bad)}
.down{color:var(--ok)}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line)}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:12px}
th,td{padding:10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th:last-child,td:last-child{border-right:0}
th{position:sticky;top:0;z-index:1;background:var(--color-secondary);color:#f8fafc;font:700 10px/1.3 "Fira Code",monospace;text-transform:uppercase;letter-spacing:.05em}
td{color:#e2e8f0}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#162337}
.card table tr[style]{background:var(--color-secondary)!important}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.num,.mono{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.mono{font-weight:600}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border:1px solid currentColor;font:700 10px/1.2 "Fira Code",monospace;white-space:nowrap}
.t-ok{background:#0d2a1b;color:#86efac}
.t-warn{background:#302408;color:#fde68a}
.t-bad{background:#351016;color:#fca5a5}
.t-info{background:#082f49;color:#bae6fd}
.t-mute{background:#1e293b;color:#cbd5e1}

.chart{width:100%;height:280px;overflow:hidden}
.chart.sm{height:220px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:0;min-width:860px;border:1px solid var(--line)}
.col{min-width:0;padding:11px;background:#090e1d;border-right:2px solid var(--line)}
.col:last-child{border-right:0}
.col-h{display:flex;align-items:center;gap:7px;min-height:36px;margin-bottom:10px;padding-bottom:9px;border-bottom:2px solid var(--line);font-size:11px;font-weight:700}
.col-h .dot{width:10px;height:10px;flex:0 0 auto;border:2px solid #fff}
.col-h .cnt{margin-left:auto;padding:2px 7px;background:var(--color-secondary);border:1px solid var(--line);color:#e2e8f0;font:700 10px/1 "Fira Code",monospace}
.kcard{margin-bottom:10px;padding:11px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent)}
.kcard:last-child{margin-bottom:0}
.kcard .sku,.kcard .amt{font:700 11px/1.3 "Fira Code",monospace}
.kcard .nm{margin:4px 0 8px;color:#cbd5e1;font-size:11px}
.kcard .row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10px}
.barmini,.prog{overflow:hidden;background:#273449;border:1px solid #475569}
.barmini{height:7px;margin-top:8px}
.barmini i,.prog i{display:block;height:100%}
.prog{height:10px}

.tl{position:relative;padding-left:27px}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:3px;background:var(--line)}
.tl-i{position:relative;padding:0 0 18px}
.tl-i::before{content:"";position:absolute;left:-25px;top:2px;width:14px;height:14px;background:var(--card);border:3px solid var(--accent)}
.tl-i.done::before{background:var(--accent);box-shadow:inset 0 0 0 2px var(--color-on-accent)}
.tl-i .tt{font-size:13px;font-weight:700}
.tl-i .mt{margin-top:3px;color:#cbd5e1;font:500 10px/1.4 "Fira Code",monospace}
.tl-i .dd{margin-top:6px;color:#e2e8f0;font-size:12px;line-height:1.55}
.list{list-style:none;padding:0;margin:0}
.li{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);font-size:12px}
.li:last-child{border-bottom:0}
.li .ib{width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:var(--color-secondary);color:var(--accent);border:1px solid var(--line)}
.li .ib .material-symbols-outlined{font-size:18px}
.li b{font-size:12px}
.li .sub{margin-top:3px;color:#cbd5e1;font-size:10px}
.li .end{margin-left:auto;text-align:right;font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;background:#090e1d;border:1px solid var(--line)}
.seg span{padding:6px 10px;color:#cbd5e1;font-size:11px;font-weight:700}
.seg span.on{background:var(--accent);color:var(--color-on-accent)}
.note{display:flex;align-items:flex-start;gap:7px;margin-top:11px;padding:10px;background:#091323;border-left:4px solid var(--blue);color:#cbd5e1;font-size:11px;line-height:1.55}
.note .material-symbols-outlined{flex:0 0 auto;color:var(--blue);font-size:17px}

@keyframes ledger-in{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.screen-head,.kpi,.card,.col{animation:ledger-in .38s cubic-bezier(.2,.9,.3,1.25) both}
.kpi:nth-child(2),.card:nth-child(2),.col:nth-child(2){animation-delay:.06s}
.kpi:nth-child(3),.col:nth-child(3){animation-delay:.12s}
.kpi:nth-child(4),.col:nth-child(4){animation-delay:.18s}

@media(max-width:1024px){
  .topbar-in{display:block;padding:0 16px}
  .brand{min-width:0;padding:10px 0}
  .nav{margin:0 -16px;border-top:1px solid var(--line)}
  .nav button{flex:1;min-height:52px;border-left:0;border-right:1px solid var(--line)}
  .g-kpi{grid-template-columns:repeat(2,1fr)}
  .g-2,.g-3,.g-2a,.g-2b{grid-template-columns:1fr}
}
@media(max-width:600px){
  main{padding:18px 12px 48px}
  .topbar-in{padding:0 12px}
  .nav{margin:0 -12px}
  .brand span{display:none}
  .nav button{min-width:52px;padding:9px 8px}
  .nav button span.txt{display:none}
  .screen-head{grid-template-columns:44px minmax(0,1fr);padding:15px;border-left-width:5px;box-shadow:5px 5px 0 #000}
  .screen-head .ic{width:44px;height:44px}
  .screen-head .pill{grid-column:1/-1;margin:0;justify-self:start}
  .g-kpi{grid-template-columns:1fr 1fr;gap:9px}
  .card{padding:12px}
  .kpi{padding:12px}
  .kpi .val{font-size:18px}
  .li{align-items:flex-start}
  .li .end{max-width:42%}
}
@media(max-width:390px){
  .g-kpi{grid-template-columns:1fr}
  .screen-head h1{font-size:19px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;scroll-behavior:auto!important;transition:none!important}
}
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">inventory_2</span></div>
        <div>
          <b>存貨成本與呆滯料提列</b>
          <span>Inventory Costing &amp; Obsolescence Provision</span>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
    </div>
  </header>
  <main id="app"></main>

  <script>
  (function(){
    var charts=[];
    function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
    function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts.push(c);}
    function fmt(n){return n.toLocaleString("en-US");}

    var SCREENS=[
      {icon:"inventory_2",name:"存貨計價設定",txt:"計價設定"},
      {icon:"history",name:"呆滯料齡分析",txt:"料齡分析"},
      {icon:"trending_up",name:"跌價損失評估",txt:"跌價評估"},
      {icon:"request_quote",name:"提列計算引擎",txt:"提列計算"},
      {icon:"fact_check",name:"覆核與傳票",txt:"覆核傳票"},
      {icon:"insights",name:"報表與稽核",txt:"報表稽核"}
    ];

    // ---------- shared fake data ----------
    var accent="#22c55e",accent2="#38bdf8";
    var axis={axisLine:{lineStyle:{color:"#334155"}},axisLabel:{color:"#cbd5e1",fontSize:11,fontFamily:"Fira Code"},splitLine:{lineStyle:{color:"#1e293b"}}};

    function head(i,desc,pill){
      return '<div class="screen-head"><div class="ic"><span class="material-symbols-outlined">'+SCREENS[i].icon+'</span></div>'+
        '<div><h1>'+SCREENS[i].name+'</h1><p>'+desc+'</p></div>'+
        (pill?'<span class="pill"><span class="material-symbols-outlined" style="font-size:15px">bolt</span>'+pill+'</span>':'')+'</div>';
    }

    // ================= SCREEN 0 : 存貨計價設定 =================
    function s0(c){
      var rows=[
        ["RM-1042","冷軋鋼捲 SPCC 1.2mm","移動平均",2860,"公斤",4210,"NTD",1,"t-ok","已入帳"],
        ["RM-2087","鋁合金錠 A6063","移動平均",1740,"公斤",5980,"NTD",1,"t-ok","已入帳"],
        ["WIP-3310","沖壓半成品 F-220","先進先出",980,"件",128,"NTD",1,"t-warn","待結算"],
        ["FG-5501","精密齒輪 G-88","移動平均",520,"件",1860,"NTD",1,"t-ok","已入帳"],
        ["RM-1188","工程塑膠粒 PA66","先進先出",6200,"公斤",92,"NTD",1,"t-warn","待結算"],
        ["FG-6620","伺服馬達殼 M-30","移動平均",310,"件",2440,"NTD",1,"t-ok","已入帳"]
      ];
      var tb="";for(var i=0;i<rows.length;i++){var r=rows[i];
        tb+='<tr><td class="mono">'+r[0]+'</td><td>'+r[1]+'</td><td><span class="tag t-info">'+r[2]+'</span></td>'+
          '<td class="num mono">'+fmt(r[3])+' '+r[4]+'</td><td class="num mono">'+r[6]+' '+fmt(r[5])+'</td>'+
          '<td class="num mono">'+r[6]+' '+fmt(r[3]*r[5])+'</td><td><span class="tag '+r[7]+'">'+r[8]+'</span></td></tr>';
      }
      c.innerHTML=head(0,"設定各料號的存貨計價法（移動平均／先進先出），結算月末單位成本並完成成本入帳，作為呆滯與跌價評估的基礎。","本月 07/31 結算")+
        '<div class="grid g-kpi" style="margin-bottom:14px">'+
          kpi("account_tree","計價料號","1,284","+36 本月","up")+
          kpi("payments","存貨帳面總值","NTD 4.82 億","+2.1%","up")+
          kpi("rule","移動平均占比","68%","852 料號","")+
          kpi("task_alt","已完成入帳","94.5%","71 筆待結","down")+
        '</div>'+
        '<div class="grid g-2b">'+
          '<div class="card"><div class="card-t"><span class="material-symbols-outlined">payments</span>各料類存貨帳面值分佈<small>NTD 萬元</small></div><div id="c0a" class="chart sm"></div></div>'+
          '<div class="card"><div class="card-t"><span class="material-symbols-outlined">rule</span>計價法設定比例</div><div id="c0b" class="chart sm"></div></div>'+
        '</div>'+
        '<div class="card" style="margin-top:14px"><div class="card-t"><span class="material-symbols-outlined">inventory_2</span>月末存貨結存與單位成本<small>2026/07 結算</small></div>'+
          '<div class="scroll"><table><thead><tr><th>料號</th><th>品名</th><th>計價法</th><th class="num">結存數量</th><th class="num">單位成本</th><th class="num">帳面金額</th><th>狀態</th></tr></thead><tbody>'+tb+'</tbody></table></div>'+
          '<div class="note"><span class="material-symbols-outlined">info</span>先進先出料號需依批次順序結算，系統自動帶入最舊批次成本；待結算料號將於月結批次一併入帳。</div></div>';
      void c.offsetHeight;
      mk("c0a",{grid:{left:44,right:12,top:16,bottom:26},tooltip:{trigger:"axis"},
        xAxis:Object.assign({type:"category",data:["原物料","在製品","半成品","成品","備品"]},axis),
        yAxis:Object.assign({type:"value"},axis),
        series:[{type:"bar",data:[19800,8600,5400,12400,2200],itemStyle:{color:accent,borderRadius:[6,6,0,0]},barWidth:"52%"}]});
      mk("c0b",{tooltip:{trigger:"item"},legend:{bottom:0,textStyle:{fontSize:11,color:"#8a8078"}},
        series:[{type:"pie",radius:["46%","72%"],center:["50%","44%"],label:{show:false},
          data:[{value:852,name:"移動平均",itemStyle:{color:accent}},{value:432,name:"先進先出",itemStyle:{color:accent2}}]}]});
    }

    // ================= SCREEN 1 : 呆滯料齡分析（KANBAN signature） =================
    function s1(c){
      var cols=[
        {t:"0–90 天（正常）",clr:"#16a34a",cnt:842,cards:[
          {sku:"RM-1042",nm:"冷軋鋼捲 SPCC",amt:"12.0M",age:"18 天",pct:20},
          {sku:"FG-5501",nm:"精密齒輪 G-88",amt:"9.7M",age:"42 天",pct:47}
        ]},
        {t:"91–180 天（觀察）",clr:"#2563eb",cnt:214,cards:[
          {sku:"WIP-3310",nm:"沖壓半成品 F-220",amt:"1.3M",age:"126 天",pct:70},
          {sku:"RM-2087",nm:"鋁合金錠 A6063",amt:"4.4M",age:"152 天",pct:84}
        ]},
        {t:"181–365 天（呆滯）",clr:"#d97706",cnt:96,cards:[
          {sku:"FG-4401","nm":"舊款控制器 C-15",amt:"2.8M",age:"288 天",pct:79},
          {sku:"RM-1188",nm:"工程塑膠粒 PA66",amt:"0.57M",age:"333 天",pct:91}
        ]},
        {t:"逾 365 天（呆廢）",clr:"#dc2626",cnt:58,cards:[
          {sku:"FG-2203",nm:"停產機殼 H-09",amt:"3.6M",age:"612 天",pct:100},
          {sku:"WIP-1990",nm:"報廢治具 J-77",amt:"0.42M",age:"540 天",pct:100}
        ]}
      ];
      var board="";
      for(var i=0;i<cols.length;i++){var col=cols[i];var cc="";

    }
    function tli(done,tt,mt,dd){
      return '<div class="tl-i'+(done?" done":"")+'"><div class="tt">'+tt+'</div><div class="mt">'+mt+'</div><div class="dd">'+dd+'</div></div>';
    }
    function repo(ic,tt,sub,st){
      return '<div class="li"><div class="ib"><span class="material-symbols-outlined">description</span></div><div><b>'+tt+'</b><div class="sub">'+sub+'</div></div><div class="end"><span class="tag t-ok">'+st+'</span></div></div>';
    }

    var RENDER=[s0,s1,s2,s3,s4,s5];

    // nav
    var nav=document.getElementById("nav");
    var nh="";for(var i=0;i<SCREENS.length;i++){
      nh+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+SCREENS[i].icon+'</span><span class="txt">'+SCREENS[i].txt+'</span></button>';
    }
    nav.innerHTML=nh;
    var btns=nav.querySelectorAll("button");
    for(var b=0;b<btns.length;b++){(function(bt){bt.addEventListener("click",function(){location.hash="v"+bt.getAttribute("data-i");});})(btns[b]);}

    function show(i){
      disposeCharts();
      for(var k=0;k<btns.length;k++){btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i);}
      var app=document.getElementById("app");
      RENDER[i](app);
    }
    window.addEventListener("resize",function(){for(var i=0;i<charts.length;i++){try{charts[i].resize();}catch(e){}}});

    window.show=show;
    function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
  })();
  </script>
</body>
</html>
