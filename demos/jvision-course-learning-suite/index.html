<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>課程與學習管理套件｜Jvision 系統 Demo</title>
<meta name="description" content="課程、學員、測驗到學習進度的教學管理" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Comic+Neue:wght@300;400;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#4F46E5;
  --color-on-primary:#FFFFFF;
  --color-secondary:#818CF8;
  --color-on-secondary:#0F172A;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#EEF2FF;
  --color-foreground:#1E1B4B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E1B4B;
  --color-muted:#EBEEF8;
  --color-muted-foreground:#475569;
  --color-border:#C7D2FE;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#4F46E5;

  --blue:#4F46E5;
  --ink:#1E1B4B;
  --muted:#475569;
  --line:#C7D2FE;

  --ok:#15803D;
  --okbg:#DCFCE7;
  --warn:#9A3412;
  --warnbg:#FFEDD5;
  --bad:#B91C1C;
  --badbg:#FEE2E2;
  --info:#1D4ED8;
  --infobg:#DBEAFE;
  --primary-shadow:#3730A3;
  --soft-shadow:#A5B4FC;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  background:
    radial-gradient(circle at 10% 0,rgba(129,140,248,.22),transparent 28rem),
    radial-gradient(circle at 100% 18%,rgba(234,88,12,.09),transparent 26rem),
    var(--color-background);
  color:var(--ink);
  font-family:"Comic Neue","Noto Sans TC",sans-serif;
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:4px solid rgba(79,70,229,.3);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  font-size:20px;
  line-height:1;
  vertical-align:middle;
}
.topbar{
  position:sticky;
  top:0;
  z-index:50;
  color:#fff;
  background:linear-gradient(125deg,#3730A3,#4F46E5 55%,#6366F1);
  border-bottom:4px solid #312E81;
  box-shadow:0 5px 0 #312E81,0 13px 26px rgba(49,46,129,.22);
}
.topbar-in{
  max-width:1360px;
  min-height:70px;
  margin:auto;
  padding:12px 22px;
  display:flex;
  align-items:center;
  gap:16px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  width:46px;
  height:46px;
  display:grid;
  place-items:center;
  flex:none;
  border:3px solid rgba(255,255,255,.85);
  border-radius:16px;
  background:#818CF8;
  box-shadow:inset 0 -5px 0 rgba(49,46,129,.3),4px 4px 0 #312E81;
}
.logo .material-symbols-outlined{font-size:27px}
.brand b,.screen-head h1,.card h3,.kpi .kv{font-family:"Baloo 2","Noto Sans TC",sans-serif}
.brand b{display:block;font-size:18px;line-height:1.15}
.brand small{display:block;margin-top:2px;font-size:12px;opacity:.86}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill{
  display:flex;
  align-items:center;
  gap:6px;
  padding:7px 12px;
  border:2px solid rgba(255,255,255,.55);
  border-radius:999px;
  background:rgba(255,255,255,.14);
  font-weight:700;
  font-size:12px;
}
.avatar{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border:3px solid #fff;
  border-radius:50%;
  background:#FFEDD5;
  color:#9A3412;
  font:700 15px "Baloo 2";
}
.nav{
  position:sticky;
  top:75px;
  z-index:40;
  border-bottom:3px solid var(--line);
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);
}
.nav-in{
  max-width:1360px;
  margin:auto;
  padding:10px 18px;
  display:flex;
  gap:9px;
  overflow-x:auto;
  scrollbar-width:thin;
}
.nav button{
  min-height:44px;
  padding:9px 14px;
  display:flex;
  align-items:center;
  gap:7px;
  flex:none;
  border:2px solid var(--line);
  border-radius:14px;
  background:#fff;
  color:var(--muted);
  box-shadow:0 3px 0 #A5B4FC;
  font-weight:700;
  transition:transform .2s ease-out,box-shadow .2s ease-out,color .2s,border-color .2s;
}
.nav button:hover{color:var(--blue);border-color:#818CF8;transform:translateY(-2px)}
.nav button:active{transform:translateY(2px);box-shadow:0 1px 0 #A5B4FC}
.nav button.on{
  color:#fff;
  border-color:#3730A3;
  background:var(--blue);
  box-shadow:0 4px 0 #312E81,0 9px 18px rgba(79,70,229,.2);
}
main{max-width:1360px;margin:auto;padding:28px 22px 64px}
.screen{animation:reveal .36s ease-out both}
.screen-head{
  margin-bottom:20px;
  display:flex;
  align-items:flex-end;
  gap:16px;
  flex-wrap:wrap;
}
.screen-head .st{min-width:0}
.screen-head h1{margin:0;font-size:clamp(25px,3vw,34px);line-height:1.15;letter-spacing:-.02em}
.screen-head p{max-width:760px;margin:5px 0 0;color:var(--muted);font-size:14px}
.sh-tag{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}
.btn{
  min-height:42px;
  padding:8px 14px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  border:2px solid var(--line);
  border-radius:14px;
  background:#fff;
  color:var(--ink);
  box-shadow:0 4px 0 #A5B4FC;
  font-weight:700;
  transition:transform .2s ease-out,box-shadow .2s ease-out,background .2s;
}
.btn:hover{background:#F8FAFF;transform:translateY(-2px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #A5B4FC}
.btn.primary{
  color:#fff;
  border-color:#3730A3;
  background:var(--blue);
  box-shadow:0 4px 0 #312E81;
}
.btn.accent{
  color:#fff;
  border-color:#9A3412;
  background:var(--color-accent);
  box-shadow:0 4px 0 #9A3412;
}
.grid{display:grid;gap:18px}
.grid>*{min-width:0}
.g-kpi{grid-template-columns:repeat(4,1fr)}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-32{grid-template-columns:2fr 1fr}
.g-23{grid-template-columns:1fr 2fr}
.card,.kpi{
  border:3px solid var(--line);
  border-radius:22px;
  background:var(--color-card);
  box-shadow:
    inset 0 -5px 0 rgba(199,210,254,.34),
    5px 6px 0 #A5B4FC,
    0 15px 30px rgba(49,46,129,.08);
}
.card{padding:20px}
.card h3{margin:0;font-size:17px;line-height:1.25}
.card-head{margin-bottom:16px;display:flex;align-items:center;gap:9px}
.card-head>.material-symbols-outlined{color:var(--blue);font-size:23px}
.card-head .r{margin-left:auto;color:var(--muted);font-size:12px;font-weight:700}
.kpi{position:relative;overflow:hidden;padding:17px 18px}
.kpi::after{
  content:"";
  position:absolute;
  right:-22px;
  top:-25px;
  width:76px;
  height:76px;
  border-radius:50%;
  background:rgba(129,140,248,.16);
}
.kpi .kl{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;font-weight:700}
.kpi .kl .material-symbols-outlined{color:var(--blue);font-size:19px}
.kpi .kv{margin:7px 0 1px;font-size:31px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .kd{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700}
.kpi .kd .material-symbols-outlined{font-size:16px}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
.badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:4px 9px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:11.5px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
}
.badge .material-symbols-outlined{font-size:14px}
.b-ok{background:var(--okbg);color:var(--ok)}
.b-warn{background:var(--warnbg);color:var(--warn)}
.b-bad{background:var(--badbg);color:var(--bad)}
.b-info{background:var(--infobg);color:var(--info)}
.b-mut{background:#F1F5F9;color:#475569}
.b-acc{background:#E0E7FF;color:#3730A3}
.tw{
  overflow-x:auto;
  border:2px solid var(--line);
  border-radius:17px;
  background:#fff;
}
table{width:100%;min-width:620px;border-collapse:collapse;font-size:13px}
th{
  padding:12px;
  text-align:left;
  color:#3730A3;
  background:#EEF2FF;
  border-bottom:3px solid var(--line);
  font-size:11.5px;
  letter-spacing:.03em;
  white-space:nowrap;
}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#F8FAFF}
th:nth-child(n+3),td:nth-child(n+3){font-variant-numeric:tabular-nums}
td.num{text-align:right;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.mono,.cid,.mini.id{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums}
.mini{color:var(--muted);font-size:11.5px;font-weight:600}
.who{display:flex;align-items:center;gap:9px}
.av{
  width:30px;
  height:30px;
  display:inline-grid;
  place-items:center;
  flex:none;
  border:2px solid #A5B4FC;
  border-radius:11px;
  background:#E0E7FF;
  color:#3730A3;
  font-weight:700;
}
.bar{height:10px;min-width:76px;overflow:hidden;border-radius:999px;background:#E2E8F0;box-shadow:inset 0 2px 3px rgba(15,23,42,.12)}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#818CF8,#4F46E5)}
.seg{display:inline-flex;padding:4px;gap:3px;border:2px solid var(--line);border-radius:14px;background:#E0E7FF}
.seg span{padding:5px 11px;border-radius:9px;color:var(--muted);font-size:12px;font-weight:700}
.seg .on{color:#3730A3;background:#fff;box-shadow:0 2px 0 #A5B4FC}
.board{min-width:820px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.col{
  padding:13px;
  display:flex;
  flex-direction:column;
  gap:11px;
  border:2px solid var(--line);
  border-radius:18px;
  background:#EEF2FF;
  box-shadow:inset 0 -4px 0 rgba(165,180,252,.35);
}
.col-h{padding:2px 3px;display:flex;align-items:center;gap:8px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid currentColor}
.cnt{margin-left:auto;padding:2px 8px;border:1px solid var(--line);border-radius:99px;background:#fff;color:var(--muted);font-size:11px}
.kcard{
  padding:13px;
  border:2px solid var(--line);
  border-radius:17px;
  background:#fff;
  box-shadow:0 4px 0 #A5B4FC;
  cursor:grab;
  transition:transform .2s ease-out,box-shadow .2s,border-color .2s;
}
.kcard:hover{transform:translateY(-3px);border-color:#818CF8;box-shadow:0 7px 0 #818CF8}
.kt{margin-bottom:7px;font-weight:700;line-height:1.35}
.kmeta,.kfoot{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.kmeta{margin-bottom:10px}
.kfoot{color:var(--muted);font-size:11.5px;font-weight:700}
.kfoot .r{margin-left:auto}
.tagcat{padding:3px 8px;border-radius:8px;font-size:10.5px;font-weight:700}
.chwrap{position:relative;width:100%;height:260px}
.chwrap.sm{height:210px}
.srow{padding:11px 2px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.ic{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  flex:none;
  border:2px solid #A5B4FC;
  border-radius:13px;
  background:#E0E7FF;
  color:#3730A3;
}
.nm{font-weight:700}.ds{color:var(--muted);font-size:12px}
.rv{margin-left:auto;text-align:right}.rv b{font:700 18px "Baloo 2";font-variant-numeric:tabular-nums}
.ring{
  --v:0;
  width:108px;
  height:108px;
  margin:auto;
  display:grid;
  place-items:center;
  border:3px solid #A5B4FC;
  border-radius:50%;
  background:conic-gradient(var(--blue) calc(var(--v)*1%),#E2E8F0 0);
  box-shadow:4px 5px 0 #A5B4FC;
}
.ring i{
  width:78px;
  height:78px;
  display:grid;
  place-content:center;
  border-radius:50%;
  background:#fff;
  text-align:center;
  font-style:normal;
}
.ring b{font:700 23px "Baloo 2";font-variant-numeric:tabular-nums}
.ring s{color:var(--muted);font-size:10.5px;text-decoration:none}
.note{
  padding:13px 14px;
  display:flex;
  gap:9px;
  border:2px solid #FDBA74;
  border-radius:15px;
  background:#FFF7ED;
  color:#7C2D12;
  font-size:12.5px;
}
.note .material-symbols-outlined{flex:none}
.attn{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.acell{
  aspect-ratio:1;
  display:grid;
  place-items:center;
  border:2px solid rgba(30,27,75,.22);
  border-radius:9px;
  color:#1E1B4B;
  font-size:10px;
  font-weight:700;
}
.legend{margin-top:10px;display:flex;gap:13px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border:1px solid #475569;border-radius:4px}
hr.sep{margin:17px 0;border:0;border-top:2px dashed var(--line)}
.tl{padding-left:8px}
.tl-item{position:relative;padding:0 0 21px 27px;border-left:3px solid var(--line)}
.tl-item:last-child{padding-bottom:0;border-left-color:transparent}
.tl-item::before{
  content:"";
  position:absolute;
  left:-9px;
  top:1px;
  width:14px;
  height:14px;
  border:3px solid var(--blue);
  border-radius:50%;
  background:#fff;
}
.tl-item.done::before{background:var(--blue)}
.tl-time{color:#3730A3;font-size:11px;font-weight:700}
.tl-t{font-weight:700}.tl-d{color:var(--muted);font-size:12px}
.cert{
  position:relative;
  overflow:hidden;
  padding:16px;
  border:3px solid #818CF8;
  border-radius:18px;
  background:linear-gradient(135deg,#EEF2FF,#fff);
  box-shadow:inset 0 -5px 0 rgba(199,210,254,.5),4px 5px 0 #A5B4FC;
}
.cert::after{
  content:"workspace_premium";
  position:absolute;
  right:-12px;
  bottom:-18px;
  color:#C7D2FE;
  font:92px "Material Symbols Outlined";
  opacity:.58;
}
.cert>*{position:relative;z-index:1}
.cn{font-weight:700}.cm{margin:2px 0 9px;color:var(--muted);font-size:12px}
.cid{color:#3730A3;font-size:11px;font-weight:700}
.funnel-row{margin-bottom:12px}
.funnel-meta{margin-bottom:5px;display:flex;justify-content:space-between;font-weight:700;font-size:12.5px}
.funnel-bar{
  height:29px;
  min-width:56px;
  display:flex;
  align-items:center;
  padding-left:10px;
  border:2px solid rgba(49,46,129,.26);
  border-radius:10px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.chapter{margin-bottom:13px}
.chapter-title{margin-bottom:7px;display:flex;align-items:center;gap:6px;font-weight:700}
.lesson{
  margin-bottom:6px;
  padding:7px 9px;
  display:flex;
  align-items:center;
  gap:8px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#F8FAFF;
}
.lesson .name{flex:1;min-width:0;font-size:12.5px;font-weight:700}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:900px){
  .g-kpi{grid-template-columns:repeat(2,1fr)}
  .g-2,.g-32,.g-23{grid-template-columns:1fr}
}
@media(max-width:600px){
  .topbar-in{padding:10px 14px}
  .brand small,.top-actions .pill{display:none}
  .brand b{font-size:15px}
  .nav{top:71px}
  .nav-in{padding:9px 12px}
  .nav button{width:44px;padding:9px;justify-content:center}
  .nav .lbl{display:none}
  main{padding:22px 14px 50px}
  .screen-head{align-items:stretch}
  .sh-tag{width:100%;margin-left:0}
  .sh-tag .btn{flex:1}
  .g-kpi{grid-template-columns:1fr 1fr;gap:12px}
  .card{padding:16px}
  .kpi{padding:14px}
  .kpi .kv{font-size:26px}
}
@media(max-width:390px){
  .g-kpi{grid-template-columns:1fr}
  .seg{max-width:100%;overflow:auto}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .screen,.nav button:hover,.btn:hover,.kcard:hover{transform:none!important}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined" aria-hidden="true">school</span></div>
      <div>
        <b>課程與學習管理套件</b>
        <small>Course &amp; Learning Management Suite</small>
      </div>
    </div>
    <div class="top-actions">
      <span class="pill"><span class="material-symbols-outlined" aria-hidden="true">calendar_today</span>2026 春季班</span>
      <span class="pill" aria-label="7 則通知"><span class="material-symbols-outlined" aria-hidden="true">notifications</span>7</span>
      <div class="avatar" aria-label="教務管理員">教</div>
    </div>
  </div>
</header>
<nav class="nav" aria-label="主要功能"><div class="nav-in" id="nav"></div></nav>
<main><div id="app" aria-live="polite"></div></main>
<script>
"use strict";
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function badge(c,i,t){return'<span class="badge '+c+'">'+(i?'<span class="material-symbols-outlined" aria-hidden="true">'+i+'</span>':'')+esc(t)+'</span>'}
function bar(p){var v=Math.max(0,Math.min(100,p||0));return'<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+v+'"><i style="width:'+v+'%"></i></div>'}
function initial(n){return esc(String(n||"?").slice(0,1))}
var NAV=[
 {i:0,ic:"view_kanban",t:"開課看板"},
 {i:1,ic:"menu_book",t:"課程教材庫"},
 {i:2,ic:"groups",t:"班級名冊"},
 {i:3,ic:"quiz",t:"作業測驗"},
 {i:4,ic:"trending_up",t:"學習進度"},
 {i:5,ic:"workspace_premium",t:"結業證書"}
];
var CHARTS=[],AC="#4F46E5",AC2="#818CF8",AC3="#C7D2FE";
Chart.defaults.font.family='"Comic Neue","Noto Sans TC",sans-serif';
Chart.defaults.font.size=12;
Chart.defaults.color="#475569";
function killCharts(){CHARTS.forEach(function(c){try{c.destroy()}catch(e){}});CHARTS=[]}
function kpiCard(k){return'<div class="kpi"><div class="kl"><span class="material-symbols-outlined" aria-hidden="true">'+k.ic+'</span>'+esc(k.l)+'</div><div class="kv">'+esc(k.v)+'</div><div class="kd '+(k.dc||"flat")+'"><span class="material-symbols-outlined" aria-hidden="true">'+(k.di||"info")+'</span>'+esc(k.d)+'</div></div>'}
function screenHead(t,s,a){return'<div class="screen-head"><div class="st"><h1>'+esc(t)+'</h1><p>'+esc(s)+'</p></div><div class="sh-tag">'+a.join("")+'</div></div>'}

function baseOpts(legend){return{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:!!legend,position:"bottom",labels:{usePointStyle:true,padding:14}}},scales:{y:{beginAtZero:true,grid:{color:"#E0E7FF"}},x:{grid:{display:false}}}}}
function chart(id,type,labels,data){CHARTS.push(new Chart(document.getElementById(id),{type:type,data:{labels:labels,datasets:[{data:data,backgroundColor:[AC,AC2,"#6366F1","#A5B4FC","#C7D2FE"],borderColor:AC,borderRadius:8,borderWidth:type==="line"?3:0,tension:.4}]},options:baseOpts(false)}))}
function line(id,labels,data){CHARTS.push(new Chart(document.getElementById(id),{type:"line",data:{labels:labels,datasets:[{data:data,label:"趨勢",borderColor:AC,backgroundColor:"rgba(79,70,229,.14)",fill:true,tension:.4,borderWidth:3,pointBackgroundColor:AC}]},options:baseOpts(false)}))}
function multiLine(id,labels,sets){sets.forEach(function(s){s.backgroundColor="transparent";s.borderWidth=3;s.tension=.4});CHARTS.push(new Chart(document.getElementById(id),{type:"line",data:{labels:labels,datasets:sets},options:baseOpts(true)}))}
function donut(id,labels,data){CHARTS.push(new Chart(document.getElementById(id),{type:"doughnut",data:{labels:labels,datasets:[{data:data,backgroundColor:[AC,AC2,AC3],borderColor:"#fff",borderWidth:3}]},options:{responsive:true,maintainAspectRatio:false,cutout:"62%",plugins:{legend:{position:"bottom",labels:{usePointStyle:true,padding:14}}}}}))}
var SCREENS=[s0,s1,s2,s3,s4,s5];
function buildNav(){
 var el=document.getElementById("nav");
 el.innerHTML=NAV.map(function(n){return'<button type="button" data-i="'+n.i+'" aria-label="'+n.t+'">'+icon(n.ic)+'<span class="lbl">'+n.t+'</span></button>'}).join("");
 el.addEventListener("click",function(e){var b=e.target.closest("[data-i]");if(b)location.hash="v"+b.getAttribute("data-i")})
}
function show(i){
 i=Math.max(0,Math.min(5,i||0));
 killCharts();
 var out=SCREENS[i](),app=document.getElementById("app");
 app.innerHTML='<div class="screen">'+out.html+'</div>';
 document.querySelectorAll("[data-i]").forEach(function(b){var on=+b.getAttribute("data-i")===i;b.classList.toggle("on",on);b.setAttribute("aria-current",on?"page":"false")});
 if(out.init)try{out.init()}catch(e){}
}
function fromHash(){
 var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
 show(m?+m[1]:0);
 try{window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}catch(e){}
}
buildNav();
window.addEventListener("hashchange",fromHash);
