<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>課程與學習管理套件｜Jvision 系統 Demo</title>
<meta name="description" content="課程、學員、測驗到學習進度的教學管理" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#9333ea; --accent2:#c084fc; --accent-soft:#f3e8ff;
  --ink:#1e1b2e; --muted:#6b6580; --line:#ece7f4; --bg:#f6f3fb; --card:#ffffff;
  --ok:#16a34a; --okbg:#dcfce7; --warn:#d97706; --warnbg:#fef3c7; --bad:#dc2626; --badbg:#fee2e2;
  --info:#2563eb; --infobg:#dbeafe;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;font-size:20px}
/* top nav */
.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(100deg,#7c22ce,#9333ea 55%,#a855f7);color:#fff;box-shadow:0 4px 18px rgba(147,51,234,.28)}
.topbar-in{max-width:1360px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:none}
.brand .logo .material-symbols-outlined{font-size:24px}
.brand b{font-size:16px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.brand span{font-size:11.5px;opacity:.82;display:block;font-weight:500}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:12px;min-width:0}
.pill{background:rgba(255,255,255,.15);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
.avatar{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none}
.nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:62px;z-index:40}
.nav-in{max-width:1360px;margin:0 auto;padding:8px 16px;display:flex;gap:8px;flex-wrap:wrap}
.nav button{flex:none;white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--muted);padding:9px 14px;border-radius:11px;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.15s}
.nav button .material-symbols-outlined{font-size:19px}
.nav button:hover{border-color:var(--accent2);color:var(--accent)}
.nav button.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(147,51,234,.3)}
main{max-width:1360px;margin:0 auto;padding:22px 20px 60px}
.screen-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.screen-head .st{min-width:0}
.screen-head h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.2px}
.screen-head p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.sh-tag{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn .material-symbols-outlined{font-size:18px}
/* generic grids */
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(4,1fr)}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-32{grid-template-columns:2fr 1fr}
.g-23{grid-template-columns:1fr 2fr}
.g-mn{min-width:0}
.grid>*{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.card h3{margin:0 0 4px;font-size:15px;font-weight:800}
.card .sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.card-head h3{margin:0}
.card-head .material-symbols-outlined{color:var(--accent);font-size:22px}
.card-head .r{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
/* KPI */
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.kpi .kl{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .kl .material-symbols-outlined{font-size:17px;color:var(--accent)}
.kpi .kv{font-size:29px;font-weight:900;margin:8px 0 2px;letter-spacing:-.5px}
.kpi .kd{font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px}
.kpi .kd .material-symbols-outlined{font-size:16px}
.up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--muted)}
/* chips / badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.badge .material-symbols-outlined{font-size:14px}
.b-ok{background:var(--okbg);color:var(--ok)}
.b-warn{background:var(--warnbg);color:var(--warn)}
.b-bad{background:var(--badbg);color:var(--bad)}
.b-info{background:var(--infobg);color:var(--info)}
.b-mut{background:#eef0f4;color:var(--muted)}
.b-acc{background:var(--accent-soft);color:var(--accent)}
/* tables */
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:2px solid var(--line);white-space:nowrap;background:#faf8fe}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:#faf7fe}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
.tw table{min-width:600px}
.tw th:first-child,.tw td:first-child{padding-left:16px}
/* progress bar */
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.mini{font-size:11.5px;color:var(--muted);font-weight:600}
.av{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none}
.who{display:flex;align-items:center;gap:8px;min-width:0}
/* KANBAN board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;min-width:0}
.board>*{min-width:0}
.col{background:#f4f0fb;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.col-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px;padding:2px 4px}
.col-h .dot{width:9px;height:9px;border-radius:50%;flex:none}
.col-h .cnt{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:99px;font-size:11px;padding:1px 8px;color:var(--muted)}
.kcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 1px 2px rgba(30,27,46,.04);cursor:grab;transition:.15s}
.kcard:hover{box-shadow:0 6px 16px rgba(147,51,234,.14);border-color:var(--accent2);transform:translateY(-2px)}
.kcard .kt{font-weight:800;font-size:13.5px;margin-bottom:6px;line-height:1.35}
.kcard .kmeta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.kcard .kfoot{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);font-weight:600}
.kcard .kfoot .r{margin-left:auto;display:flex;align-items:center;gap:3px}
.tagcat{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:6px}
/* timeline */
.tl{position:relative;padding-left:8px}
.tl-item{position:relative;padding:0 0 20px 26px;border-left:2px solid var(--line)}
.tl-item:last-child{border-left-color:transparent;padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-8px;top:1px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.tl-item.done::before{background:var(--accent)}
.tl-t{font-weight:800;font-size:13.5px}
.tl-d{font-size:12.5px;color:var(--muted);margin-top:2px}
.tl-time{font-size:11px;color:var(--accent);font-weight:700}
/* segmented */
.seg{display:inline-flex;background:#f0ebf9;border-radius:10px;padding:3px;gap:2px}
.seg span{padding:5px 12px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--muted)}
.seg span.on{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* chart wrap */
.chwrap{position:relative;width:100%;height:260px}
.chwrap.sm{height:210px}
/* stat rows */
.srow{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:none}
.srow .ic{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.srow .nm{font-weight:700;font-size:13.5px}
.srow .ds{font-size:12px;color:var(--muted)}
.srow .rv{margin-left:auto;text-align:right;flex:none}
.srow .rv b{font-size:16px;font-weight:900}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;min-width:0}
.cal>*{min-width:0}
.cal .dh{text-align:center;font-size:11px;font-weight:800;color:var(--muted);padding:4px 0}
.cell{border:1px solid var(--line);border-radius:9px;min-height:74px;padding:6px;font-size:11px;display:flex;flex-direction:column;gap:3px;background:#fff}
.cell .dn{font-weight:800;font-size:12px;color:var(--muted)}
.cell.tod{border-color:var(--accent);background:var(--accent-soft)}
.cell.tod .dn{color:var(--accent)}
.ev{border-radius:5px;padding:2px 5px;font-size:10px;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* radial ring */
.ring{--v:0;width:104px;height:104px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--v)*1%),var(--line) 0);display:flex;align-items:center;justify-content:center;flex:none;margin:0 auto}
.ring>i{width:78px;height:78px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-style:normal}
.ring>i b{font-size:22px;font-weight:900}
.ring>i s{font-size:10.5px;color:var(--muted);text-decoration:none;font-weight:600}
/* cert card */
.cert{border:1px solid var(--accent2);border-radius:14px;padding:16px;background:linear-gradient(135deg,#faf5ff,#fff);position:relative;overflow:hidden}
.cert::after{content:"workspace_premium";font-family:"Material Symbols Outlined";position:absolute;right:-14px;bottom:-14px;font-size:96px;color:var(--accent-soft);opacity:.7}
.cert .cn{font-weight:900;font-size:15px}
.cert .cm{font-size:12px;color:var(--muted);margin:2px 0 10px}
.cert .cid{font-family:Inter;font-size:11px;letter-spacing:.5px;color:var(--accent);font-weight:800}
/* radar/matrix cell */
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.attn{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;min-width:0}
.attn>*{min-width:0}
.acell{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff}
hr.sep{border:none;border-top:1px solid var(--line);margin:16px 0}
.note{background:var(--accent-soft);border:1px solid var(--accent2);border-radius:12px;padding:12px 14px;font-size:12.5px;color:#6b21a8;display:flex;gap:9px;align-items:flex-start}
.note .material-symbols-outlined{font-size:19px;flex:none}
@media(max-width:820px){
  .g-kpi{grid-template-columns:repeat(2,1fr)}
  .g-2,.g-3,.g-32,.g-23{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .attn{grid-template-columns:repeat(6,1fr)}
}
@media(max-width:560px){
  .nav button .lbl{display:none}
  .nav button{padding:9px 12px}
  .brand span{display:none}
  .top-actions .pill{display:none}
  .g-kpi{grid-template-columns:1fr 1fr}
  .cal .dh:nth-child(n){font-size:10px}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">school</span></div>
      <div style="min-width:0">
        <b>課程與學習管理套件</b>
        <span>Course &amp; Learning Management Suite</span>
      </div>
    </div>
    <div class="top-actions">
      <span class="pill"><span class="material-symbols-outlined">calendar_today</span>2026 春季班</span>
      <span class="pill"><span class="material-symbols-outlined">notifications</span>7</span>
      <div class="avatar">教</div>
    </div>
  </div>
</div>
<div class="nav"><div class="nav-in" id="nav"></div></div>
<main><div id="app"></div></main>

<script>
"use strict";
/* ------------ shared helpers ------------ */
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function num(n){return (n==null||isNaN(n))?"0":Number(n).toLocaleString("en-US");}
function badge(cls,icon,txt){return '<span class="badge '+cls+'">'+(icon?'<span class="material-symbols-outlined">'+icon+'</span>':'')+esc(txt)+'</span>';}
function bar(p){var v=Math.max(0,Math.min(100,p||0));return '<div class="bar"><i style="width:'+v+'%"></i></div>';}
function initial(name){return esc(String(name||"?").slice(0,1));}

var NAV=[
  {i:0,ic:"view_kanban",t:"開課看板"},
  {i:1,ic:"menu_book",t:"課程教材庫"},
  {i:2,ic:"groups",t:"班級名冊"},
  {i:3,ic:"quiz",t:"作業測驗"},
  {i:4,ic:"trending_up",t:"學習進度"},
  {i:5,ic:"workspace_premium",t:"結業證書"}
];

/* chart instance registry */
var CHARTS=[];
function killCharts(){for(var k=0;k<CHARTS.length;k++){try{CHARTS[k].destroy();}catch(e){}}CHARTS=[];}
Chart.defaults.font.family='"Inter","Noto Sans TC",sans-serif';
Chart.defaults.font.size=12;
Chart.defaults.color="#6b6580";
var AC="#9333ea",AC2="#c084fc",AC3="#e9d5ff";

/* ============================================================ */
/* SCREEN 0 — KANBAN 開課看板 (signature)                        */
/* ============================================================ */
function s0(){
  var cols=[
    {name:"課程企劃",dot:"#94a3b8",tint:"b-mut"},
    {name:"教材製作",dot:"#2563eb",tint:"b-info"},
    {name:"審核上架",dot:"#d97706",tint:"b-warn"},
    {name:"已開課",dot:"#16a34a",tint:"b-ok"}
  ];
  var catColor={"程式設計":["#ede9fe","#6d28d9"],"設計美學":["#fce7f3","#be185d"],"商業管理":["#dbeafe","#1d4ed8"],"語言檢定":["#dcfce7","#15803d"],"資料科學":["#ffedd5","#c2410c"]};
  var cards=[
    {col:0,t:"Python 資料分析入門",cat:"資料科學",owner:"陳老師",due:"3/12",n:12,pri:"high"},
    {col:0,t:"UI/UX 使用者研究實戰",cat:"設計美學",owner:"林老師",due:"3/20",n:8,pri:"mid"},
    {col:0,t:"日檢 N2 文法衝刺",cat:"語言檢定",owner:"佐藤老師",due:"3/25",n:16,pri:"mid"},
    {col:1,t:"React 前端工程進階",cat:"程式設計",owner:"王老師",due:"3/08",n:24,pri:"high"},
    {col:1,t:"品牌視覺設計系統",cat:"設計美學",owner:"周老師",due:"3/15",n:14,pri:"mid"},
    {col:2,t:"專案管理 PMP 導論",cat:"商業管理",owner:"黃老師",due:"3/05",n:18,pri:"high"},
    {col:2,t:"商用英文簡報力",cat:"語言檢定",owner:"Emma老師",due:"3/10",n:10,pri:"low"},
    {col:3,t:"全端 JavaScript 開發",cat:"程式設計",owner:"李老師",due:"開課中",n:32,pri:"high"},
    {col:3,t:"數位行銷成長駭客",cat:"商業管理",owner:"吳老師",due:"開課中",n:27,pri:"mid"},
    {col:3,t:"AI 影像生成工作坊",cat:"設計美學",owner:"蔡老師",due:"開課中",n:21,pri:"mid"}
  ];
  var pri={high:badge("b-bad","priority_high","高優先"),mid:badge("b-warn","","一般"),low:badge("b-mut","","低")};
  var kpi=[
    {l:"規劃中課程",v:"5",d:"本季新企劃",ic:"lightbulb",dc:"up",di:"trending_up"},
    {l:"製作進行中",v:"38%",d:"平均完成度",ic:"construction",dc:"flat",di:"remove"},
    {l:"待審核上架",v:"2",d:"最快 3/05 上架",ic:"pending_actions",dc:"down",di:"trending_down"},
    {l:"本季已開課",v:"3",d:"共 80 位選課",ic:"rocket_launch",dc:"up",di:"trending_up"}
  ];
  var h='';
  h+=screenHead("開課看板","以拖曳看板管理課程從企劃、教材製作到審核上架的開課流程",[
    '<span class="seg"><span class="on">看板</span><span>清單</span><span>甘特</span></span>',
    '<button class="btn primary"><span class="material-symbols-outlined">add</span>新增課程</button>'
  ]);
  h+='<div class="grid g-kpi" style="margin-bottom:16px">'+kpi.map(kpiCard).join('')+'</div>';
  h+='<div class="card"><div class="card-head"><span class="material-symbols-outlined">view_kanban</span><h3>課程開課流程看板</h3><span class="r">拖曳卡片可切換階段 · 更新：今日 09:40</span></div>';
  h+='<div style="overflow-x:auto"><div class="board" style="min-width:760px">';
  for(var c=0;c<cols.length;c++){
    var list=cards.filter(function(x){return x.col===c;});
    h+='<div class="col"><div class="col-h"><span class="dot" style="background:'+cols[c].dot+'"></span>'+esc(cols[c].name)+'<span class="cnt">'+list.length+'</span></div>';
    for(var j=0;j<list.length;j++){
      var x=list[j],cc=catColor[x.cat]||["#eee","#333"];
      h+='<div class="kcard"><div class="kt">'+esc(x.t)+'</div>';
      h+='<div class="kmeta"><span class="tagcat" style="background:'+cc[0]+';color:'+cc[1]+'">'+esc(x.cat)+'</span>'+pri[x.pri]+'</div>';
      h+='<div class="kfoot"><span class="av">'+initial(x.owner)+'</span>'+esc(x.owner)+'<span class="r"><span class="material-symbols-outlined" style="font-size:15px">event</span>'+esc(x.due)+'</span></div>';
      h+='<div class="kfoot" style="margin-top:7px"><span class="material-symbols-outlined" style="font-size:15px;color:'+AC+'">group</span>'+x.n+' 位預選 · 單元 '+(x.n%10+4)+'</div></div>';
    }
    h+='</div>';
  }
  h+='</div></div></div>';

/* ------------ shared chart option builders ------------ */
function grad(){var c=document.createElement("canvas");var g=c.getContext("2d").createLinearGradient(0,0,0,220);g.addColorStop(0,"rgba(147,51,234,.28)");g.addColorStop(1,"rgba(147,51,234,0)");return g;}
function barOpts(){return{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:"#f0ecf7"},ticks:{precision:0}},x:{grid:{display:false}}}};}
function lineOpts(legend,yc){yc=yc||{};return{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:!!legend,position:"bottom",labels:{usePointStyle:true,boxWidth:8,padding:14}}},scales:{y:Object.assign({grid:{color:"#f0ecf7"},ticks:{precision:0}},yc),x:{grid:{display:false}}}};}
function donutOpts(){return{responsive:true,maintainAspectRatio:false,cutout:"62%",plugins:{legend:{position:"bottom",labels:{usePointStyle:true,boxWidth:9,padding:13}}}};}
function radarOpts(){return{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{usePointStyle:true,boxWidth:8,padding:14}}},scales:{r:{beginAtZero:true,max:100,grid:{color:"#ece7f4"},angleLines:{color:"#ece7f4"},pointLabels:{font:{size:11}},ticks:{display:false}}}};}
function dualOpts(){return{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{usePointStyle:true,boxWidth:8,padding:14}}},scales:{y:{position:"left",beginAtZero:true,max:100,grid:{color:"#f0ecf7"},title:{display:true,text:"繳交率 %"}},y1:{position:"right",beginAtZero:true,max:100,grid:{display:false},title:{display:true,text:"平均分"}},x:{grid:{display:false}}}};}

/* ------------ shared UI builders ------------ */
function kpiCard(k){return '<div class="kpi"><div class="kl"><span class="material-symbols-outlined">'+k.ic+'</span>'+esc(k.l)+'</div><div class="kv">'+esc(k.v)+'</div><div class="kd '+(k.dc||"flat")+'"><span class="material-symbols-outlined">'+(k.di||"remove")+'</span>'+esc(k.d)+'</div></div>';}
function screenHead(title,sub,tags){var h='<div class="screen-head"><div class="st"><h1>'+esc(title)+'</h1><p>'+esc(sub)+'</p></div>';if(tags&&tags.length){h+='<div class="sh-tag">'+tags.join('')+'</div>';}h+='</div>';return h;}

/* ------------ render loop ------------ */
var SCREENS=[s0,s1,s2,s3,s4,s5];
function buildNav(){
  var el=document.getElementById("nav");
  el.innerHTML=NAV.map(function(n){return '<button data-i="'+n.i+'"><span class="material-symbols-outlined">'+n.ic+'</span><span class="lbl">'+esc(n.t)+'</span></button>';}).join('');
  var btns=el.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].addEventListener("click",function(){show(+this.getAttribute("data-i"));});}
}
function show(i){
  var app=document.getElementById("app");
  killCharts();
  var out=SCREENS[i]();
  app.innerHTML=out.html;
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  void app.offsetHeight;
  if(out.init){try{out.init();}catch(e){}}
}
buildNav();
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m)return;var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
