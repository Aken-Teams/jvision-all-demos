<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>工程變更管理系統（ECN/ECR）｜Jvision 系統 Demo</title>
  <meta name="description" content="ECR 變更申請、影響範圍分析、多部門簽核、ECN 發行與生效導入追蹤" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root{
      --accent:#1d4ed8; --accent2:#60a5fa;
      --ink:#0f172a; --sub:#64748b; --line:#e2e8f0; --bg:#f1f5f9; --card:#ffffff;
      --side:#0b1220; --side2:#111c33; --sideln:#1e2b45; --sideink:#cbd5e1;
      --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
      --r:14px; --sh:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
    .msi{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
    .layout{display:flex;min-height:100vh;}
    /* sidebar */
    .side{width:248px;flex:0 0 248px;background:linear-gradient(180deg,var(--side),var(--side2));color:var(--sideink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
    .brand{padding:22px 20px 16px;border-bottom:1px solid var(--sideln);}
    .brand .logo{display:flex;align-items:center;gap:10px;}
    .brand .logo .mk{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 38px;}
    .brand .logo .mk .msi{font-size:22px;}
    .brand .tt{font-weight:800;font-size:15px;color:#fff;line-height:1.3;}
    .brand .sb{font-size:11px;color:#94a3b8;margin-top:2px;letter-spacing:.5px;}
    .navwrap{padding:12px 12px 20px;flex:1;}
    .navlabel{font-size:11px;color:#64748b;letter-spacing:1px;padding:10px 10px 6px;font-weight:700;}
    .nav{display:flex;flex-direction:column;gap:4px;}
    .nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;color:var(--sideink);padding:11px 12px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;transition:.15s;min-width:0;}
    .nav button .msi{font-size:20px;color:#93a5c4;flex:0 0 auto;}
    .nav button .nx{min-width:0;overflow:hidden;}
    .nav button .nx small{display:block;font-size:10.5px;font-weight:500;color:#7c8bab;margin-top:1px;}
    .nav button:hover{background:#182741;color:#fff;}
    .nav button.on{background:linear-gradient(135deg,var(--accent),#2563eb);color:#fff;box-shadow:0 4px 12px rgba(29,78,216,.4);}
    .nav button.on .msi{color:#fff;}
    .nav button.on small{color:#cfe0ff;}
    .sidefoot{padding:14px 18px;border-top:1px solid var(--sideln);font-size:11px;color:#64748b;}
    /* main */
    .main{flex:1;min-width:0;display:flex;flex-direction:column;}
    .topbar{background:var(--card);border-bottom:1px solid var(--line);padding:16px 26px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:20;}
    .topbar .htitle{font-size:18px;font-weight:800;min-width:0;}
    .topbar .hsub{font-size:12.5px;color:var(--sub);margin-top:2px;}
    .topbar .spacer{flex:1;}
    .pill{display:inline-flex;align-items:center;gap:6px;background:#eff4ff;color:var(--accent);border:1px solid #dbe6ff;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;}
    .pill .msi{font-size:16px;}
    .content{padding:24px 26px 48px;min-width:0;}
    /* generic */
    .grid{display:grid;gap:16px;min-width:0;}
    .g4{grid-template-columns:repeat(4,1fr);}
    .g3{grid-template-columns:repeat(3,1fr);}
    .g2{grid-template-columns:repeat(2,1fr);}
    .g23{grid-template-columns:2fr 1fr;}
    .g32{grid-template-columns:1fr 2fr;}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px;min-width:0;}
    .card h3{margin:0 0 3px;font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px;}
    .card h3 .msi{font-size:19px;color:var(--accent);}
    .card .csub{font-size:12px;color:var(--sub);margin:0 0 14px;}
    .kpi .lab{font-size:12.5px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:7px;}
    .kpi .lab .ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 32px;}
    .kpi .val{font-size:27px;font-weight:900;margin-top:9px;letter-spacing:-.5px;line-height:1;}
    .kpi .val small{font-size:13px;font-weight:700;color:var(--sub);margin-left:3px;}
    .kpi .dt{font-size:11.5px;margin-top:8px;font-weight:700;display:inline-flex;align-items:center;gap:3px;}
    .up{color:var(--ok);} .down{color:var(--bad);} .flat{color:var(--sub);}
    .chart{width:100%;height:280px;overflow:hidden;}
    .chart.sm{height:220px;}
    table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
    th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
    th{font-size:11.5px;color:var(--sub);font-weight:700;letter-spacing:.4px;background:#f8fafc;}
    tbody tr:hover{background:#f8faff;}
    .tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;}
    .t-ok{background:#dcfce7;color:#15803d;} .t-warn{background:#fef3c7;color:#b45309;}
    .t-bad{background:#fee2e2;color:#b91c1c;} .t-info{background:#dbeafe;color:#1d4ed8;}
    .t-grey{background:#e2e8f0;color:#475569;} .t-pur{background:#ede9fe;color:#6d28d9;}
    .ovf{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;}
    .ovf table{min-width:560px;} .ovf th{background:#f8fafc;} .ovf td,.ovf th{border-bottom:1px solid var(--line);}
    .ovf tr:last-child td{border-bottom:0;}
    .bar{height:8px;border-radius:6px;background:#e2e8f0;overflow:hidden;min-width:60px;}
    .bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
    .mono{font-family:"Inter",monospace;font-weight:700;font-size:12.5px;letter-spacing:.3px;}
    /* board */
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;min-width:0;}
    .col{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0;}
    .col .ch{font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--line);}
    .col .ch .n{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11px;color:var(--sub);}
    .tk{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;padding:10px 11px;margin-bottom:9px;box-shadow:var(--sh);}
    .tk .id{font-size:11px;color:var(--accent);font-weight:800;}
    .tk .ti{font-size:12.5px;font-weight:700;margin:3px 0 6px;line-height:1.35;}
    .tk .mt{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--sub);}
    .av{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;}
    /* timeline */
    .tl{position:relative;padding-left:26px;}
    .tl:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line);}
    .tli{position:relative;padding:0 0 20px 6px;}
    .tli:last-child{padding-bottom:0;}
    .tli .dot{position:absolute;left:-26px;top:1px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;}
    .tli .dot.done{background:var(--accent);border-color:var(--accent);}
    .tli .dot.done:after{content:"";width:6px;height:6px;border-radius:50%;background:#fff;}
    .tli .tt{font-size:13px;font-weight:800;}
    .tli .tm{font-size:11px;color:var(--sub);margin:2px 0 4px;}
    .tli .td{font-size:12.5px;color:#334155;line-height:1.5;}
    /* signoff chain */
    .chain{display:flex;flex-direction:column;gap:0;}
    .step{display:flex;gap:14px;align-items:flex-start;}
    .step .rail{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;}
    .step .node{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 40px;}
    .step .line{width:2px;flex:1;min-height:22px;background:var(--line);}
    .step:last-child .line{display:none;}
    .step .body{padding-bottom:18px;flex:1;min-width:0;}
    .step .r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
    .step .r1 .nm{font-size:13.5px;font-weight:800;}
    .step .r1 .rl{font-size:11.5px;color:var(--sub);}
    .step .r2{font-size:12px;color:#475569;margin-top:5px;line-height:1.5;}
    .step .r3{font-size:11px;color:var(--sub);margin-top:5px;}
    /* misc */
    .infoline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#475569;padding:9px 0;border-bottom:1px dashed var(--line);}
    .infoline:last-child{border-bottom:0;}
    .infoline .k{color:var(--sub);min-width:88px;flex:0 0 auto;}
    .infoline .v{font-weight:700;color:var(--ink);}
    .alert{display:flex;gap:11px;padding:12px 14px;border-radius:11px;margin-bottom:11px;align-items:flex-start;}
    .alert.hi{background:#fef2f2;border:1px solid #fecaca;} .alert.md{background:#fffbeb;border:1px solid #fde68a;}
    .alert.lo{background:#eff6ff;border:1px solid #bfdbfe;}
    .alert .msi{font-size:20px;flex:0 0 auto;}
    .alert.hi .msi{color:var(--bad);} .alert.md .msi{color:var(--warn);} .alert.lo .msi{color:var(--info);}
    .alert .at{font-size:13px;font-weight:800;}
    .alert .ad{font-size:12px;color:#475569;margin-top:2px;line-height:1.5;}
    .seg{display:inline-flex;background:#f1f5f9;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;}
    .seg span{padding:5px 12px;border-radius:8px;font-size:12px;font-weight:700;color:var(--sub);}
    .seg span.on{background:#fff;color:var(--accent);box-shadow:var(--sh);}
    .legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--sub);margin-top:8px;}
    .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle;}
    .gauge-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
    .minirow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
    .minirow:last-child{border-bottom:0;}
    .minirow .nm{font-size:12.5px;font-weight:700;flex:0 0 92px;min-width:0;}
    .minirow .txt{flex:1;min-width:0;font-size:11.5px;color:var(--sub);}
    h2.sec{font-size:15px;font-weight:800;margin:6px 0 14px;display:flex;align-items:center;gap:8px;}
    h2.sec .msi{color:var(--accent);font-size:20px;}
    .mt16{margin-top:16px;} .mt20{margin-top:20px;}
    /* responsive */
    @media(max-width:1100px){ .g4{grid-template-columns:repeat(2,1fr);} .board{grid-template-columns:repeat(2,1fr);} }
    @media(max-width:860px){
      .layout{flex-direction:column;}
      .side{width:100%;flex:none;height:auto;position:static;flex-direction:column;}
      .brand{border-bottom:1px solid var(--sideln);}
      .navwrap{padding:8px 10px;}
      .navlabel{display:none;}
      .nav{flex-direction:row;flex-wrap:wrap;gap:6px;}
      .nav button{width:auto;flex:1 1 auto;justify-content:center;padding:9px 12px;}
      .nav button .nx small{display:none;}
      .sidefoot{display:none;}
    }
    @media(max-width:820px){
      .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
      .board{grid-template-columns:1fr;}
    }
    @media(max-width:560px){
      .content{padding:18px 14px 40px;}
      .topbar{padding:13px 16px;}
      .nav button .nx{display:none;}
      .nav button{flex:0 0 auto;}
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="side">
      <div class="brand">
        <div class="logo">
          <div class="mk"><span class="msi">published_with_changes</span></div>
          <div>
            <div class="tt">工程變更管理</div>
            <div class="sb">ECN / ECR PLATFORM</div>
          </div>
        </div>
      </div>
      <div class="navwrap">
        <div class="navlabel">變更作業流程</div>
        <div class="nav" id="nav"></div>
      </div>
      <div class="sidefoot">Jvision Smart MFG · Demo 245<br/>研發變更管理平台</div>
    </aside>
    <div class="main">
      <div class="topbar">
        <div>
          <div class="htitle" id="htitle">變更申請 ECR</div>
          <div class="hsub" id="hsub">發起變更需求、填寫變更理由與期望效益</div>
        </div>
        <div class="spacer"></div>
        <span class="pill"><span class="msi">verified_user</span> ISO 9001 受控流程</span>
        <span class="pill"><span class="msi">calendar_today</span> 2026/08/14</span>
      </div>
      <div class="content" id="screen"></div>
    </div>
  </div>

  <script>
  var MODULES=[
    {icon:"request_quote",name:"變更申請 ECR",sub:"發起變更需求",desc:"發起變更需求、填寫變更理由與期望效益"},
    {icon:"account_tree",name:"影響範圍分析",sub:"BOM/庫存/客戶",desc:"自動盤點受影響 BOM、庫存與客戶專案"},
    {icon:"rule",name:"審查簽核路徑",sub:"多部門會簽",desc:"依變更類別自動組多部門審查與簽核鏈"},
    {icon:"description",name:"ECN 發行",sub:"版本與生效日",desc:"核定後產生變更通知、圖文版本與生效日"},
    {icon:"task_alt",name:"生效導入追蹤",sub:"新舊料切換",desc:"追蹤舊料耗盡、新料切換與工單同步"},
    {icon:"monitoring",name:"變更預警塔",sub:"風險即時預警",desc:"逾期簽核、新舊料混用風險即時預警"}
  ];
  var charts=[];
  function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
  function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts.push(c);}
  var PAL=["#1d4ed8","#60a5fa","#93c5fd","#a5b4fc","#38bdf8","#818cf8"];

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function tagCls(s){var m={"已核定":"t-ok","已發行":"t-ok","已生效":"t-ok","完成":"t-ok","通過":"t-ok","切換完成":"t-ok",
    "審查中":"t-info","評估中":"t-info","簽核中":"t-info","導入中":"t-info","進行中":"t-info",
    "待簽核":"t-warn","待評估":"t-warn","舊料耗用中":"t-warn","待確認":"t-warn","高":"t-bad","緊急":"t-bad",
    "退回":"t-bad","風險":"t-bad","中":"t-warn","低":"t-grey","草稿":"t-grey","製程":"t-pur","設計":"t-info","料件":"t-warn"};
    return m[s]||"t-grey";}
  function tag(s){return '<span class="tag '+tagCls(s)+'">'+esc(s)+'</span>';}

  /* ================= SCREEN 0 : ECR 變更申請 ================= */
  function s0(){
    var kpis=[
      {ic:"request_quote",bg:"#eff4ff",cl:"#1d4ed8",lab:"本月新增 ECR",val:"38",u:"件",dt:"較上月 +6",cls:"up",di:"trending_up"},
      {ic:"pending_actions",bg:"#fff7ed",cl:"#d97706",lab:"待評估",val:"9",u:"件",dt:"3 件逾 48hr",cls:"down",di:"error"},
      {ic:"schedule",bg:"#f0f9ff",cl:"#0284c7",lab:"平均受理時間",val:"5.4",u:"hr",dt:"目標 8hr 內",cls:"up",di:"trending_down"},
      {ic:"category",bg:"#f5f3ff",cl:"#7c3aed",lab:"設計類占比",val:"46",u:"%",dt:"製程 33% 料件 21%",cls:"flat",di:"remove"}
    ];
    var rows=[
      ["ECR-2608-041","PCBA-A7 主板散熱片變更","設計","高","王思穎","2026/08/14","待評估"],
      ["ECR-2608-039","外殼卡扣改射出成型","製程","中","陳柏宇","2026/08/13","評估中"],
      ["ECR-2608-037","電容 C12 替代料導入","料件","高","林孟潔","2026/08/13","評估中"],
      ["ECR-2608-034","絲印油墨環保替代","料件","低","張家豪","2026/08/12","待評估"],
      ["ECR-2608-031","焊接治具定位孔位調整","製程","中","黃冠廷","2026/08/12","已核定"],
      ["ECR-2608-028","端子鍍層由錫改鍍金","設計","高","吳雅筑","2026/08/11","已核定"]
    ];
    var trs=rows.map(function(r){return '<tr><td class="mono">'+r[0]+'</td><td>'+esc(r[1])+'</td><td>'+tag(r[2])+'</td><td>'+tag(r[3])+'</td><td>'+esc(r[4])+'</td><td>'+r[5]+'</td><td>'+tag(r[6])+'</td></tr>';}).join("");
    var el=document.getElementById("screen");
    el.innerHTML=''+
    '<div class="grid g4">'+kpis.map(function(k){return '<div class="card kpi"><div class="lab"><span class="ic" style="background:'+k.bg+';color:'+k.cl+'"><span class="msi">'+k.ic+'</span></span>'+k.lab+'</div><div class="val">'+k.val+'<small>'+k.u+'</small></div><div class="dt '+k.cls+'"><span class="msi" style="font-size:15px">'+k.di+'</span>'+k.dt+'</div></div>';}).join("")+'</div>'+
    '<div class="grid g23 mt16">'+
      '<div class="card"><h3><span class="msi">list_alt</span>近期變更申請（ECR）清單</h3><p class="csub">依受理時間排序，可依變更類別、優先度篩選</p><div class="ovf"><table><thead><tr><th>ECR 單號</th><th>變更標的</th><th>類別</th><th>優先度</th><th>提出人</th><th>提出日</th><th>狀態</th></tr></thead><tbody>'+trs+'</tbody></table></div></div>'+
      '<div class="card"><h3><span class="msi">edit_note</span>ECR 快速填單</h3><p class="csub">研發專員發起新變更申請</p>'+
        '<div class="infoline"><span class="k">變更標的</span><span class="v mono">PCBA-A7 / DWG-10428</span></div>'+
        '<div class="infoline"><span class="k">變更類別</span><span class="v">'+tag("設計")+'</span></div>'+
        '<div class="infoline"><span class="k">變更原因</span><span class="v">散熱不足致溫升超標</span></div>'+
        '<div class="infoline"><span class="k">期望效益</span><span class="v">溫升 −8℃、良率 +2%</span></div>'+
        '<div class="infoline"><span class="k">期望生效日</span><span class="v">2026/09/01</span></div>'+
        '<div class="infoline"><span class="k">影響評估</span><span class="v" style="color:var(--warn)">待系統展開</span></div>'+
        '<div style="margin-top:14px;display:flex;gap:8px"><span class="pill" style="background:var(--accent);color:#fff;border-color:var(--accent)"><span class="msi">send</span>送出評估</span><span class="pill"><span class="msi">save</span>存草稿</span></div>'+

  var SCREENS=[s0,s1,s2,s3,s4,s5];

  function buildNav(){
    var n=document.getElementById("nav");
    n.innerHTML=MODULES.map(function(m,i){return '<button data-i="'+i+'"><span class="msi">'+m.icon+'</span><span class="nx">'+m.name+'<small>'+m.sub+'</small></span></button>';}).join("");
    n.querySelectorAll("[data-i]").forEach(function(b){b.addEventListener("click",function(){location.hash="v"+b.getAttribute("data-i");});});
  }

  function show(i){
    var m=MODULES[i]||MODULES[0];
    document.getElementById("htitle").textContent=m.name;
    document.getElementById("hsub").textContent=m.desc;
    var btns=document.querySelectorAll("[data-i]");
    for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
    disposeCharts();
    (SCREENS[i]||s0)();
  }

  buildNav();
  window.addEventListener("resize",function(){for(var i=0;i<charts.length;i++){try{charts[i].resize();}catch(e){}}});

  function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
  </script>
