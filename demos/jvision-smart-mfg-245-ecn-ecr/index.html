<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>工程變更管理系統（ECN/ECR）｜Jvision 系統 Demo</title>
  <meta name="description" content="ECR 變更申請、影響範圍分析、多部門簽核、ECN 發行與生效導入追蹤" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700&family=Roboto+Mono:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root{
      --color-primary:#15803D;
      --color-on-primary:#FFFFFF;
      --color-secondary:#22C55E;
      --color-on-secondary:#0F172A;
      --color-accent:#D97706;
      --color-on-accent:#000000;
      --color-background:#F0FDF4;
      --color-foreground:#14532D;
      --color-card:#FFFFFF;
      --color-card-foreground:#14532D;
      --color-muted:#E8F0F1;
      --color-muted-foreground:#475569;
      --color-border:#BBF7D0;
      --color-destructive:#DC2626;
      --color-on-destructive:#FFFFFF;
      --color-ring:#15803D;
      --blue:#15803D;
      --ink:#14532D;
      --muted:#475569;
      --line:#BBF7D0;
      --ok:#15803D;
      --warn:#B45309;
      --bad:#B91C1C;
      --info:#0369A1;
      --card:#FFFFFF;
      --bg:#F0FDF4;
      --radius:20px 16px 22px 15px;
      --shadow:0 15px 35px rgba(20,83,45,.07),0 2px 8px rgba(20,83,45,.05);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:"Exo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    button,a,[role="button"]{cursor:pointer}
    button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
    .msi{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;line-height:1;vertical-align:middle}
    .layout{display:flex;min-height:100vh}
    .side{position:sticky;top:0;z-index:30;display:flex;flex:0 0 270px;flex-direction:column;height:100vh;overflow-y:auto;color:#DCFCE7;background:
      radial-gradient(circle at 10% 7%,rgba(34,197,94,.22),transparent 28%),
      linear-gradient(165deg,#14532D 0%,#166534 52%,#064E3B 100%)}
    .brand{padding:26px 20px 20px;border-bottom:1px solid rgba(220,252,231,.15)}
    .logo{display:flex;align-items:center;gap:12px}
    .mk{display:grid;width:44px;height:44px;flex:0 0 44px;place-items:center;border:1px solid rgba(255,255,255,.32);border-radius:17px 12px 18px 11px;color:#14532D;background:#DCFCE7;box-shadow:0 9px 24px rgba(0,0,0,.15)}
    .mk .msi{font-size:25px}
    .tt{font-size:16px;font-weight:700;color:#fff}
    .sb{margin-top:3px;color:#BBF7D0;font-family:"Roboto Mono",monospace;font-size:10px;letter-spacing:.08em}
    .navwrap{flex:1;padding:17px 13px}
    .navlabel{padding:6px 11px 10px;color:#A7F3D0;font-size:11px;font-weight:600;letter-spacing:.12em}
    .nav{display:flex;flex-direction:column;gap:6px}
    .nav button{display:flex;width:100%;min-height:52px;align-items:center;gap:12px;padding:10px 12px;border:1px solid transparent;border-radius:16px 12px 17px 11px;color:#DCFCE7;background:transparent;font:600 13px "Exo",sans-serif;text-align:left;transition:background .2s,border-color .2s,transform .2s}
    .nav button:hover{border-color:rgba(220,252,231,.25);background:rgba(255,255,255,.09);transform:translateX(2px)}
    .nav button.on{border-color:#86EFAC;color:#14532D;background:#F0FDF4;box-shadow:0 10px 25px rgba(0,0,0,.18)}
    .nav button .msi{font-size:21px}
    .nx{min-width:0}
    .nx small{display:block;margin-top:2px;color:#A7F3D0;font-size:10.5px;font-weight:400}
    .nav button.on small{color:#3F6212}
    .sidefoot{padding:16px 20px;border-top:1px solid rgba(220,252,231,.15);color:#BBF7D0;font-family:"Roboto Mono",monospace;font-size:10px;line-height:1.7}
    .main{display:flex;min-width:0;flex:1;flex-direction:column}
    .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:13px;flex-wrap:wrap;padding:17px 28px;border-bottom:1px solid rgba(187,247,208,.9);background:rgba(240,253,244,.9);backdrop-filter:blur(14px)}
    .htitle{font-size:20px;font-weight:700;letter-spacing:-.01em}
    .hsub{margin-top:3px;color:var(--muted);font-size:12px}
    .spacer{flex:1}
    .pill,.action{display:inline-flex;min-height:34px;align-items:center;justify-content:center;gap:6px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;color:#166534;background:#fff;font-size:11.5px;font-weight:600}
    .pill .msi,.action .msi{font-size:16px}
    .action{border-color:var(--color-primary);color:#fff;background:var(--color-primary);transition:background .2s,transform .2s,box-shadow .2s}
    .action:hover{background:#166534;box-shadow:0 8px 18px rgba(21,128,61,.2);transform:translateY(-1px)}
    .content{position:relative;min-width:0;padding:27px 28px 52px}
    .content:before{position:fixed;right:-100px;bottom:-120px;width:360px;height:360px;border-radius:46% 54% 65% 35%;background:rgba(34,197,94,.07);content:"";pointer-events:none}
    .grid{display:grid;min-width:0;gap:17px}
    .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .g23{grid-template-columns:2fr 1fr}
    .g32{grid-template-columns:1fr 2fr}
    .card{position:relative;min-width:0;padding:19px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow)}
    .card:after{position:absolute;top:0;right:22px;width:42px;height:4px;border-radius:0 0 8px 8px;background:linear-gradient(90deg,var(--color-primary),var(--color-secondary));content:"";opacity:.65}
    .card h3{display:flex;align-items:center;gap:8px;margin:0 0 4px;font-size:14px;font-weight:700}
    .card h3 .msi{color:var(--color-primary);font-size:20px}
    .csub{margin:0 0 15px;color:var(--muted);font-size:11.5px;line-height:1.55}
    .kpi{overflow:hidden}
    .kpi:before{position:absolute;right:-24px;bottom:-36px;width:105px;height:105px;border-radius:57% 43% 65% 35%;background:rgba(34,197,94,.08);content:""}
    .kpi .lab{position:relative;display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12px;font-weight:600}
    .ic{display:grid;width:35px;height:35px;flex:0 0 35px;place-items:center;border-radius:14px 10px 15px 9px}
    .val{position:relative;margin-top:12px;font:700 28px/1 "Roboto Mono",monospace;letter-spacing:-.04em}
    .val small{margin-left:4px;color:var(--muted);font:500 12px "Exo",sans-serif}
    .dt{position:relative;display:inline-flex;align-items:center;gap:4px;margin-top:9px;font-size:11px;font-weight:600}
    .up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
    .chart{width:100%;height:280px;overflow:hidden}.chart.sm{height:220px}
    .ovf{overflow-x:auto;border:1px solid var(--line);border-radius:15px;-webkit-overflow-scrolling:touch}
    table{width:100%;min-width:560px;border-collapse:collapse;font-size:12.5px}
    th,td{padding:11px 12px;border-bottom:1px solid #DCFCE7;text-align:left;white-space:nowrap}
    th{color:#365B47;background:#F0FDF4;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:none}
    td:nth-child(n+3){font-variant-numeric:tabular-nums}
    tbody tr{transition:background .18s}
    tbody tr:hover{background:#F7FFF9}
    tbody tr:last-child td{border-bottom:0}
    .mono{font-family:"Roboto Mono",monospace;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
    .tag{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border:1px solid currentColor;border-radius:999px;font-size:10.5px;font-weight:700;white-space:nowrap}
    .tag:before{width:5px;height:5px;border-radius:50%;background:currentColor;content:""}
    .t-ok{color:#166534;background:#DCFCE7}.t-warn{color:#92400E;background:#FEF3C7}
    .t-bad{color:#991B1B;background:#FEE2E2}.t-info{color:#075985;background:#E0F2FE}
    .t-grey{color:#475569;background:#F1F5F9}.t-pur{color:#6B21A8;background:#F3E8FF}
    .infoline{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);color:var(--muted);font-size:12px}
    .infoline:last-child{border-bottom:0}.infoline .k{width:90px;flex:0 0 90px}.infoline .v{color:var(--ink);font-weight:600}
    .minirow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #DCFCE7}
    .minirow:last-child{border:0}.minirow .nm{flex:0 0 105px;font-size:12px;font-weight:700}.minirow .txt{min-width:0;flex:1;color:var(--muted);font-size:11.5px;line-height:1.45}
    .alert{display:flex;gap:11px;align-items:flex-start;margin-bottom:11px;padding:13px 14px;border:1px solid;border-radius:17px 13px 18px 12px}
    .alert .msi{flex:0 0 auto;font-size:20px}.alert .at{font-size:12.5px;font-weight:700}.alert .ad{margin-top:3px;color:#475569;font-size:11.5px;line-height:1.55}
    .alert.hi{border-color:#FCA5A5;background:#FEF2F2}.alert.hi>.msi{color:var(--bad)}
    .alert.md{border-color:#FCD34D;background:#FFFBEB}.alert.md>.msi{color:var(--warn)}
    .alert.lo{border-color:#BAE6FD;background:#F0F9FF}.alert.lo>.msi{color:var(--info)}
    .board{display:grid;min-width:680px;grid-template-columns:repeat(4,1fr);gap:13px;padding:2px}
    .col{min-width:0;padding:12px;border:1px solid var(--line);border-radius:17px 13px 18px 12px;background:#F7FFF9}
    .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:9px;border-bottom:2px solid var(--line);font-size:12px;font-weight:700}
    .ch .n{padding:2px 8px;border:1px solid var(--line);border-radius:999px;background:#fff;font:600 10px "Roboto Mono",monospace}
    .tk{margin-bottom:9px;padding:11px;border:1px solid var(--line);border-left:4px solid var(--color-primary);border-radius:13px 10px 14px 9px;background:#fff;box-shadow:0 5px 14px rgba(20,83,45,.06)}
    .tk .id{color:var(--color-primary);font:700 10.5px "Roboto Mono",monospace}.tk .ti{margin:5px 0 8px;font-size:12px;font-weight:600;line-height:1.4}
    .tk .mt{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:10px}
    .av{display:inline-grid;width:22px;height:22px;place-items:center;border-radius:50%;color:#fff;background:var(--color-primary);font-size:10px;font-weight:700}
    .chain{display:flex;flex-direction:column}.step{display:flex;gap:14px}.rail{display:flex;flex:0 0 auto;flex-direction:column;align-items:center}
    .node{display:grid;width:40px;height:40px;flex:0 0 40px;place-items:center;border-radius:15px 11px 16px 10px;color:#fff}
    .step .line{width:2px;min-height:24px;flex:1;background:var(--line)}.step:last-child .line{display:none}
    .step .body{min-width:0;flex:1;padding-bottom:18px}.r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.nm{font-size:13px;font-weight:700}
    .r2{margin-top:5px;color:#475569;font-size:11.5px;line-height:1.5}.r3{margin-top:5px;color:var(--muted);font:400 10.5px "Roboto Mono",monospace}
    .legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:9px;color:var(--muted);font-size:11px}
    .legend i{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:50%;vertical-align:middle}
    .mt16{margin-top:16px}.mt20{margin-top:20px}
    .reveal{animation:reveal .36s ease-out both}
    @keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:860px){
      .layout{flex-direction:column}.side{position:static;width:100%;height:auto;flex:none}.brand{padding:15px 16px}.navwrap{padding:8px 10px 12px}.navlabel,.sidefoot{display:none}
      .nav{flex-direction:row;overflow-x:auto}.nav button{width:auto;min-width:52px;flex:0 0 auto;justify-content:center}.nx small{display:none}.topbar{top:0}
    }
    @media(max-width:820px){.g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}}
    @media(max-width:560px){
      .content{padding:18px 13px 42px}.topbar{padding:13px 15px}.topbar .pill:last-child{display:none}.nav button{padding:9px 11px}.nav button .nx{display:none}
      .card{padding:16px}.val{font-size:25px}.minirow{align-items:flex-start;flex-wrap:wrap}.minirow .nm{flex:1 1 120px}.minirow .txt{flex:1 1 180px}
    }
    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
      .reveal{animation:none!important}
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="side">
      <div class="brand">
        <div class="logo">
          <div class="mk"><span class="msi">published_with_changes</span></div>
          <div><div class="tt">工程變更管理</div><div class="sb">ECN / ECR PLATFORM</div></div>
        </div>
      </div>
      <div class="navwrap"><div class="navlabel">變更作業流程</div><nav class="nav" id="nav" aria-label="變更作業流程"></nav></div>
      <div class="sidefoot">Jvision Smart MFG · Demo 245<br />研發變更管理平台</div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><div class="htitle" id="htitle">變更申請 ECR</div><div class="hsub" id="hsub">發起變更需求、填寫變更理由與期望效益</div></div>
        <div class="spacer"></div>
        <span class="pill"><span class="msi">verified_user</span>ISO 9001 受控流程</span>
        <span class="pill"><span class="msi">calendar_today</span><span class="mono">2026/08/14</span></span>
      </header>
      <section class="content reveal" id="screen" aria-live="polite"></section>
    </main>
  </div>
  <script>
    var MODULES=[
      {icon:"request_quote",name:"變更申請 ECR",sub:"發起變更需求",desc:"發起變更需求、填寫變更理由與期望效益"},
      {icon:"account_tree",name:"影響範圍分析",sub:"BOM/庫存/客戶",desc:"自動盤點受影響 BOM、庫存與客戶專案"},
      {icon:"rule",name:"審查簽核路徑",sub:"多部門會簽",desc:"依變更類別自動組多部門審查與簽核鏈"},
      {icon:"description",name:"ECN 發行",sub:"版本與生效日",desc:"核定後產生變更通知、圖文版本與生效日"},
      {icon:"task_alt",name:"生效導入追蹤",sub:"新舊料切換",desc:"追蹤舊料耗盡、新料切換與工單同步"},
      {icon:"monitoring",name:"變更預警塔",sub:"風險即時預警",desc:"逾期簽核、新舊料混用風險即時預警"}
    ];
    var charts=[];
    var green="#15803D",lime="#22C55E",amber="#D97706",red="#DC2626",sky="#0284C7",grid="#DCFCE7",text="#475569";
    function disposeCharts(){charts.forEach(function(c){try{c.dispose()}catch(e){}});charts=[]}
    function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts.push(c)}
    function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
    function tagCls(s){var m={"已核定":"t-ok","已發行":"t-ok","已生效":"t-ok","完成":"t-ok","通過":"t-ok","切換完成":"t-ok","已送達":"t-ok","審查中":"t-info","評估中":"t-info","簽核中":"t-info","導入中":"t-info","進行中":"t-info","待簽核":"t-warn","待評估":"t-warn","舊料耗用中":"t-warn","待確認":"t-warn","高":"t-bad","緊急":"t-bad","退回":"t-bad","風險":"t-bad","中":"t-warn","低":"t-grey","草稿":"t-grey","製程":"t-pur","設計":"t-info","料件":"t-warn"};return m[s]||"t-grey"}
    function tag(s){return '<span class="tag '+tagCls(s)+'">'+esc(s)+'</span>'}
    function kpis(data){return '<div class="grid g4">'+data.map(function(k){return '<div class="card kpi"><div class="lab"><span class="ic" style="background:'+k[1]+';color:'+k[2]+'"><span class="msi">'+k[0]+'</span></span>'+k[3]+'</div><div class="val">'+k[4]+'<small>'+k[5]+'</small></div>'+(k[6]?'<div class="dt flat"><span class="msi" style="font-size:15px">info</span>'+k[6]+'</div>':'')+'</div>'}).join("")+'</div>'}
    function baseGrid(){return{left:8,right:18,top:22,bottom:12,containLabel:true}}
    function axis(){return{axisLine:{lineStyle:{color:"#A7F3D0"}},axisLabel:{color:text,fontFamily:"Roboto Mono"},axisTick:{show:false}}}

    function s0(){
      var rows=[
        ["ECR-2608-041","PCBA-A7 主板散熱片變更","設計","高","王思穎","2026/08/14","待評估"],
        ["ECR-2608-039","外殼卡扣改射出成型","製程","中","陳柏宇","2026/08/13","評估中"],
        ["ECR-2608-037","電容 C12 替代料導入","料件","高","林孟潔","2026/08/13","評估中"],
        ["ECR-2608-034","絲印油墨環保替代","料件","低","張家豪","2026/08/12","待評估"],
        ["ECR-2608-031","焊接治具定位孔位調整","製程","中","黃冠廷","2026/08/12","已核定"],
        ["ECR-2608-028","端子鍍層由錫改鍍金","設計","高","吳雅筑","2026/08/11","已核定"]
      ];
      var trs=rows.map(function(r){return '<tr><td class="mono">'+r[0]+'</td><td>'+esc(r[1])+'</td><td>'+tag(r[2])+'</td><td>'+tag(r[3])+'</td><td>'+r[4]+'</td><td class="mono">'+r[5]+'</td><td>'+tag(r[6])+'</td></tr>'}).join("");
      var el=document.getElementById("screen");
      el.innerHTML=kpis([
        ["request_quote","#DCFCE7",green,"本月新增 ECR","38","件","較上月 +6"],
        ["pending_actions","#FEF3C7",amber,"待評估","9","件","3 件逾 48hr"],
        ["schedule","#E0F2FE",sky,"平均受理時間","5.4","hr","目標 8hr 內"],
        ["category","#F3E8FF","#7E22CE","設計類占比","46","%","製程 33% 料件 21%"]
      ])+
      '<div class="grid g23 mt16"><div class="card"><h3><span class="msi">list_alt</span>近期變更申請（ECR）清單</h3><p class="csub">依受理時間排序，可依變更類別、優先度篩選</p><div class="ovf"><table><thead><tr><th>ECR 單號</th><th>變更標的</th><th>類別</th><th>優先度</th><th>提出人</th><th>提出日</th><th>狀態</th></tr></thead><tbody>'+trs+'</tbody></table></div></div>'+
      '<div class="card"><h3><span class="msi">edit_note</span>ECR 快速填單</h3><p class="csub">研發專員發起新變更申請</p>'+
      '<div class="infoline"><span class="k">變更標的</span><span class="v mono">PCBA-A7 / DWG-10428</span></div>'+
      '<div class="infoline"><span class="k">變更類別</span><span class="v">'+tag("設計")+'</span></div>'+
      '<div class="infoline"><span class="k">變更原因</span><span class="v">散熱不足致溫升超標</span></div>'+
      '<div class="infoline"><span class="k">期望效益</span><span class="v">溫升 −8℃、良率 +2%</span></div>'+
      '<div class="infoline"><span class="k">期望生效日</span><span class="v mono">2026/09/01</span></div>'+

      mk("c5b",{tooltip:{trigger:"axis"},grid:{left:8,right:25,top:25,bottom:12,containLabel:true},xAxis:Object.assign({type:"category",data:["W1","W2","W3","W4","W5","W6"]},axis()),yAxis:[{type:"value",name:"準時率%",min:60,max:100,splitLine:{lineStyle:{color:grid}},axisLabel:{color:text},nameTextStyle:{color:text}},{type:"value",name:"工時h",min:0,max:16,splitLine:{show:false},axisLabel:{color:text},nameTextStyle:{color:text}}],series:[{name:"ECN 準時發行率 %",type:"line",smooth:true,data:[71,74,79,82,85,88],symbolSize:7,lineStyle:{width:3,color:green},itemStyle:{color:green},areaStyle:{color:"rgba(34,197,94,.14)"}},{name:"平均會簽工時 hr",type:"line",yAxisIndex:1,smooth:true,data:[13.5,12.1,10.8,9.4,8.2,7.1],symbolSize:7,lineStyle:{width:3,color:amber},itemStyle:{color:amber}}]});
    }

    var SCREENS=[s0,s1,s2,s3,s4,s5];
    function buildNav(){
      var n=document.getElementById("nav");
      n.innerHTML=MODULES.map(function(m,i){return '<button type="button" data-i="'+i+'" aria-label="'+m.name+'"><span class="msi">'+m.icon+'</span><span class="nx">'+m.name+'<small>'+m.sub+'</small></span></button>'}).join("");
      n.querySelectorAll("[data-i]").forEach(function(b){b.addEventListener("click",function(){location.hash="v"+b.getAttribute("data-i")})});
    }
    function show(i){
      var m=MODULES[i]||MODULES[0],screen=document.getElementById("screen");
      document.getElementById("htitle").textContent=m.name;
      document.getElementById("hsub").textContent=m.desc;
      document.querySelectorAll("[data-i]").forEach(function(b){var on=+b.getAttribute("data-i")===i;b.classList.toggle("on",on);b.setAttribute("aria-current",on?"page":"false")});
      disposeCharts();
      screen.classList.remove("reveal");
      (SCREENS[i]||s0)();
      void screen.offsetHeight;
      screen.classList.add("reveal");
    }
    function fromHash(){
      var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
      var i=m?Math.min(+m[1],5):0;
      show(i);
      try{window.scrollTo(0,0)}catch(e){}
    }
    buildNav();
    window.addEventListener("resize",function(){charts.forEach(function(c){try{c.resize()}catch(e){}})});
    window.addEventListener("hashchange",fromHash);
    fromHash();
  </script>
