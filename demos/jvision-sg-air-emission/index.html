<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>空污排放與操作許可管理 · ESG 永續管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000000;
  --color-secondary:#10b981;
  --color-on-secondary:#0f172a;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#ecfdf5;
  --color-foreground:#064e3b;
  --color-card:#ffffff;
  --color-card-foreground:#064e3b;
  --color-muted:#e8f1f3;
  --color-muted-foreground:#475569;
  --color-border:#a7f3d0;
  --color-destructive:#dc2626;
  --color-on-destructive:#ffffff;
  --color-ring:#059669;
  --blue:#059669;
  --ink:#064e3b;
  --muted:#475569;
  --line:#a7f3d0;
  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --accent-soft:#d1fae5;
  --accent-soft2:#6ee7b7;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --th:#e8f7f1;
  --hov:#f0fdf4;
  --track:#dbe7e7;
  --sidebar:#043f32;
  --sidebar2:#064e3b;
  --side-edge:rgba(255,255,255,.14);
  --ok:#047857;
  --warn:#a16207;
  --bad:#dc2626;
  --info:#1d4ed8;
  --r:6px;
  --glow:rgba(5,150,105,.18);
  --shadow:0 1px 2px rgba(6,78,59,.06),0 8px 24px rgba(6,78,59,.05);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-width:320px}
body{
  font-family:"Fira Sans","Noto Sans TC",sans-serif;
  background:var(--bg);
  color:var(--ink);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;font-family:"Fira Sans","Noto Sans TC",sans-serif;letter-spacing:-.02em}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
::selection{background:#6ee7b7;color:#052e26}

.app{display:flex;min-height:100vh}
.sidebar{
  width:248px;
  flex:none;
  min-width:0;
  position:sticky;
  top:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  padding:24px 16px 18px;
  color:#ecfdf5;
  background:var(--sidebar);
  border-right:1px solid #065f46;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0;padding:0 8px 24px;border-bottom:1px solid rgba(255,255,255,.14)}
.brand-logo{
  width:40px;
  height:40px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#052e26;
  background:#34d399;
  border:1px solid #6ee7b7;
  border-radius:4px;
}
.brand-logo .material-symbols-outlined{font-size:23px}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-weight:700;font-size:15px;letter-spacing:.02em}
.brand-txt span{display:block;margin-top:2px;color:#a7f3d0;font-family:"Fira Code",monospace;font-size:9.5px;letter-spacing:.08em;white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:3px;min-width:0;margin-top:20px}
.nav button{
  position:relative;
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  min-height:44px;
  min-width:0;
  padding:10px 12px;
  border:1px solid transparent;
  border-radius:4px;
  background:transparent;
  color:#d1fae5;
  text-align:left;
  font-weight:500;
}
.nav button .material-symbols-outlined{font-size:19px;flex:none}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.1)}
.nav button.on{background:#d1fae5;color:#064e3b;border-color:#6ee7b7;font-weight:700;box-shadow:none}
.nav button.on::before{content:"";position:absolute;left:-17px;top:7px;bottom:7px;width:4px;background:#34d399}
.nav .idx{margin-left:auto;color:inherit;opacity:.7;font-family:"Fira Code",monospace;font-size:10px}
.side-foot{margin-top:auto;padding:16px 9px 0;border-top:1px solid rgba(255,255,255,.14);color:#a7f3d0;font-size:10.5px;line-height:1.7}
.side-foot b{color:#fff;font-family:"Fira Code",monospace}

.main{flex:1;min-width:0;padding:28px 32px 64px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.topbar h1{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;color:#052e26}
.topbar h1 .material-symbols-outlined{font-size:24px;color:var(--accent)}
.topbar .sub{margin-top:5px;color:var(--muted);font-size:12.5px}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:7px 11px;border:1px solid var(--line);border-radius:4px;background:rgba(255,255,255,.78);color:#334155;font-size:11.5px;font-weight:600}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px #d1fae5}
.avatar{width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex:none;border:1px solid #047857;border-radius:4px;background:#059669;color:#001b12;font-weight:700;font-size:12px}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card,.sec{padding:18px;min-width:0}
.sec{margin-bottom:14px}
.sec>h3,.card-h h3{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:#052e26}
.sec>h3{margin-bottom:13px}
.sec>h3 .material-symbols-outlined,.card-h h3 .material-symbols-outlined{font-size:18px;color:var(--accent)}
.sec>p{margin:0 0 13px;color:var(--muted);font-size:13px;line-height:1.75}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0;font-size:13px}
.dl dt{color:var(--muted);font-size:12px;font-weight:600}
.dl dd{margin:0;line-height:1.75}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h .hint{color:var(--muted);font-family:"Fira Code",monospace;font-size:10.5px}

.kpi,.stat,.tile{position:relative;min-width:0;padding:16px 17px;border-left:3px solid var(--accent);border-radius:0 var(--r) var(--r) 0;overflow:hidden}
.kpi::after{display:none}
.kpi .ico,.tile .ti{position:absolute;right:13px;top:13px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:1px solid #a7f3d0;border-radius:4px;background:#ecfdf5;color:#047857}
.kpi .ico .material-symbols-outlined,.tile .ti .material-symbols-outlined{font-size:19px}
.kpi .lbl,.stat .lbl{display:flex;align-items:center;gap:5px;margin-top:0;padding-right:36px;color:var(--muted);font-size:11.5px;font-weight:600}
.stat .lbl .material-symbols-outlined{font-size:15px;color:var(--accent)}
.kpi .val,.stat .val,.tile .tv{margin-top:6px;color:#052e26;font-family:"Fira Code",monospace;font-size:26px;font-weight:700;letter-spacing:-.04em;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .val small,.stat .val small{margin-left:4px;color:var(--muted);font-family:"Fira Sans","Noto Sans TC",sans-serif;font-size:12px;font-weight:600;letter-spacing:0}
.kpi .delta,.stat .d{display:inline-flex;align-items:center;gap:3px;margin-top:7px;font-size:11px;font-weight:700}
.delta.up,.d.up{color:#047857}
.delta.down,.d.down{color:#b91c1c}
.delta.flat,.d.flat{color:#475569}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:14px}
.tile{display:flex;flex-direction:column;gap:7px}
.tile b{padding-right:38px;font-size:13px;font-weight:700}
.tile p{margin:0;color:var(--muted);font-size:11.5px;line-height:1.55}

.card.pad0 .card-h{padding:17px 17px 0}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th{padding:10px 13px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--th);color:#334155;text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.035em;white-space:nowrap}
td{padding:10px 13px;border-bottom:1px solid #d9eee5;color:#163f35;white-space:nowrap}
th:nth-child(n+3),td:nth-child(n+3){text-align:right}
th:last-child,td:last-child{padding-right:17px}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--hov)}
.mono{font-family:"Fira Code",monospace;font-weight:600;letter-spacing:0}
td b{color:#052e26}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1px solid currentColor;border-radius:999px;font-size:10.5px;font-weight:700;line-height:1.3;white-space:nowrap}
.t-ok{background:#ecfdf5;color:#047857}
.t-warn{background:#fffbeb;color:#92400e}
.t-bad{background:#fef2f2;color:#b91c1c}
.t-info{background:#eff6ff;color:#1d4ed8}
.t-gray{background:#f1f5f9;color:#475569}
.t-acc,.t-pink{background:#ecfdf5;color:#047857}

.bar{height:7px;min-width:56px;overflow:hidden;border-radius:2px;background:var(--track)}
.bar>i{display:block;height:100%;border-radius:2px;background:var(--accent)}
.prog{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0}
.prog small{width:38px;flex:none;color:#334155;font-family:"Fira Code",monospace;font-size:10.5px;font-weight:600;text-align:right}

.tl{position:relative;padding-left:25px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item,.tl-i{position:relative;padding:0 0 17px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;left:-23px;top:3px;width:13px;height:13px;border:3px solid var(--accent);border-radius:50%;background:#fff}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font-family:"Fira Code",monospace;font-size:10.5px;font-weight:600}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:12.5px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:11.5px}

.chk{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px dashed var(--line);font-size:12.5px}
.chk:last-child{border-bottom:none}
.chk .material-symbols-outlined{font-size:19px}
.chk .ok{color:var(--ok)}
.chk .wait{color:var(--muted)}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--muted);font-size:11px}
.note{margin-top:13px;padding-top:12px;border-top:1px dashed var(--line);color:var(--muted);font-size:11.5px;line-height:1.7}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.col{display:flex;flex-direction:column;gap:9px;padding:11px;border:1px solid var(--line);border-radius:4px;background:var(--th)}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 6px;font-size:12.5px;font-weight:700}
.col-h .cnt{padding:1px 8px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);font-family:"Fira Code",monospace;font-size:10.5px}
.pcard{padding:11px 12px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:2px;background:#fff}
.pcard b{font-size:12.5px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--muted);font-size:11px}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:8px;color:var(--ink);font-size:11px}
.mini-av,.av{display:inline-flex;align-items:center;justify-content:center;flex:none;border:1px solid var(--line);border-radius:3px;background:var(--accent-soft);color:#065f46;font-weight:700}
.mini-av{width:18px;height:18px;font-size:9px}
.av{width:26px;height:26px;font-size:11px}
.who{display:inline-flex;align-items:center;gap:6px}

.lane{display:flex;flex-direction:column;gap:10px}
.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:4px;background:#fff}
.lane-row .num{width:31px;height:31px;display:flex;align-items:center;justify-content:center;flex:none;border:1px solid var(--line);border-radius:3px;background:var(--accent-soft);color:#065f46;font-family:"Fira Code",monospace;font-size:12px;font-weight:700}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:13.5px}
.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:11.5px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{width:22px;height:22px;z-index:1;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);border-radius:50%;background:#fff;color:#64748b;font-family:"Fira Code",monospace;font-size:10px}
.steps .ln{width:20px;height:2px;background:var(--line)}
.steps .s.done{border-color:var(--accent);background:var(--accent);color:#001b12}
.steps .s.cur{border-color:var(--accent);color:#047857;box-shadow:0 0 0 3px #d1fae5}
.steps .ln.done{background:var(--accent)}

.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 4px;border-bottom:1px dashed var(--line)}
.rep-row:last-child{border-bottom:none}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:13px}
.rep-row .sku span{color:var(--muted);font-size:11px}
.gauge{width:110px;flex:none}
.gauge .track{position:relative;height:8px;overflow:hidden;border-radius:2px;background:var(--track)}
.gauge .track i{display:block;height:100%;border-radius:2px;background:var(--accent)}
.gauge small{display:block;margin-top:3px;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;text-align:right}
.band{position:relative;height:26px;min-width:150px;border-radius:3px;background:var(--track)}
.band .rng{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--accent-soft)}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
.band .me{position:absolute;top:3px;width:12px;height:20px;border-radius:2px;background:var(--accent);box-shadow:0 2px 6px var(--glow)}

#screen{display:grid;grid-template-columns:392px minmax(0,1fr);grid-auto-rows:min-content;gap:14px;align-items:start}
#screen>*{grid-column:1/-1;margin-top:0!important}
#screen>.grid.g4:first-child{grid-column:1;grid-row:1;display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px;padding:0!important;border:none!important;background:none!important}
#screen>.grid.g4:first-child>*{flex:none!important;padding:16px!important;border-top:1px solid var(--line)!important;border-right:1px solid var(--line)!important;border-bottom:1px solid var(--line)!important;background:var(--panel)!important}
#screen>*:nth-child(2){grid-column:2;grid-row:1}
#screen>*:nth-child(2).grid{grid-template-columns:minmax(0,1fr)}
#screen>*:nth-child(2)>.card:first-child{min-height:314px}

@media(prefers-reduced-motion:no-preference){
  button,.card,.sec,.kpi,.stat,.tile,.pcard,.lane-row,tbody tr{transition:border-color .2s ease,background-color .2s ease,color .2s ease,box-shadow .2s ease,transform .2s ease}
  .card:hover,.sec:hover,.kpi:hover,.stat:hover,.tile:hover{border-color:#6ee7b7;box-shadow:0 2px 3px rgba(6,78,59,.07),0 12px 28px rgba(6,78,59,.08)}
  #screen>.grid,#screen>.card,#screen>.sec{animation:reveal .35s ease-out both}
  #screen>*:nth-child(2){animation-delay:.04s}
  #screen>*:nth-child(3){animation-delay:.08s}
  @keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
}
@media(max-width:1120px){
  #screen{grid-template-columns:minmax(0,1fr)}
  #screen>*,#screen>.grid.g4:first-child,#screen>*:nth-child(2){grid-column:1;grid-row:auto}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{position:static;width:100%;height:auto;flex-direction:row;align-items:center;flex-wrap:wrap;padding:12px 14px;gap:8px;border-right:0;border-bottom:1px solid #065f46}
  .brand{padding:0 12px 0 2px;border:0}
  .brand-logo{width:36px;height:36px}
  .side-foot{display:none}
  .nav{flex:1;flex-direction:row;flex-wrap:wrap;gap:5px;margin-top:0}
  .nav button{width:auto;min-height:42px;padding:9px 11px}
  .nav button.on::before{display:none}
  .nav .idx{display:none}
  .main{padding:21px 16px 48px}
}
@media(max-width:820px){
  .g2,.g3,.g23,.g32{grid-template-columns:1fr}
  .topbar{align-items:flex-start}
}
@media(max-width:700px){
  .dl{grid-template-columns:1fr;gap:2px 0}
  .dl dt{margin-top:9px}
}
@media(max-width:560px){
  .main{padding-inline:12px}
  #screen>.grid.g4:first-child,.g4{grid-template-columns:1fr 1fr!important}
  .board{grid-template-columns:1fr}
  .nav button .txt{display:none}
  .nav button{min-width:42px;justify-content:center}
  .topbar h1{font-size:18px}
  .top-right{width:100%;justify-content:flex-start}
  .kpi .val,.stat .val,.tile .tv{font-size:21px}
  .tile,.kpi,.stat{padding:14px!important}
}
@media(max-width:390px){
  #screen>.grid.g4:first-child,.g4{grid-template-columns:1fr!important}
  .chip{padding-inline:9px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">air</span></div>
      <div class="brand-txt"><b>空污管制台</b><span>AIR EMISSION PERMIT</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">污染源 28 座<br/>許可證 6 張<br/>版本 <b>v1.0.0</b> · 純 UI 展示</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1><span class="material-symbols-outlined" id="th-ico"></span><span id="th-title"></span></h1>
        <div class="sub" id="th-sub"></div>
      </div>
      <div class="top-right">
        <span class="chip"><span class="dot"></span>系統連線正常</span>
        <span class="chip"><span class="material-symbols-outlined" style="font-size:16px;color:var(--accent)">calendar_today</span>2026/08/20</span>
        <div class="avatar">資</div>
      </div>
    </div>
    <div id="screen"></div>
  </main>
</div>
<script>
/* ── 共用工具（同時支援兩種內容方言）── */
var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy()}catch(e){}}charts=[]}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function money(n){try{return Number(n).toLocaleString("en-US")}catch(e){return String(n)}}
function _kpi(a){return '<div class="grid g4">'+a.map(function(k){
  var ic=k.cls==="up"?"trending_up":(k.cls==="down"?"trending_down":"trending_flat");
  return '<div class="kpi"><div class="ico"><span class="material-symbols-outlined">'+k.ico+'</span></div>'+
   '<div class="lbl">'+esc(k.lbl)+'</div><div class="val">'+k.val+(k.u?'<small>'+k.u+'</small>':'')+'</div>'+
   '<div class="delta '+k.cls+'"><span class="material-symbols-outlined">'+ic+'</span>'+esc(k.d)+'</div></div>'}).join("")+'</div>'}
var kpiGrid=_kpi, stats=_kpi;
function tbl(h,r){return '<div style="overflow-x:auto"><table><thead><tr>'+h.map(function(x){return '<th>'+esc(x)+'</th>'}).join("")+
 '</tr></thead><tbody>'+r.map(function(x){return '<tr>'+x.map(function(c,i){return '<td'+(i===0?' class="mono"':'')+'>'+c+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div>'}
function pg(p){return '<div class="prog"><div class="bar" style="flex:1"><i style="width:'+p+'%"></i></div><small>'+p+'%</small></div>'}
var progCell=pg;
function _tl(a){return '<div class="tl">'+a.map(function(t){return '<div class="tl-item"><div class="tl-dot '+(t.k||"")+'"></div><div class="tl-time">'+esc(t.t)+'</div><b>'+esc(t.b)+'</b><p>'+esc(t.p)+'</p></div>'}).join("")+'</div>'}
var tl=_tl, tlHtml=_tl;
function card(t,ic,body,hint){return '<div class="card"><div class="card-h"><h3><span class="material-symbols-outlined">'+ic+'</span>'+t+'</h3>'+(hint?'<span class="hint">'+hint+'</span>':'')+'</div>'+body+'</div>'}
function cardT(t,ic,body,hint){return '<div class="card pad0"><div class="card-h" style="padding:17px 17px 0"><h3><span class="material-symbols-outlined">'+ic+'</span>'+t+'</h3>'+(hint?'<span class="hint">'+hint+'</span>':'')+'</div>'+body+'</div>'}
function stepsHtml(total,cur){var h="";for(var i=0;i<total;i++){if(i>0)h+='<span class="ln'+(i<=cur?' done':'')+'"></span>';
 h+='<span class="s '+(i<cur?'done':(i===cur?'cur':''))+'">'+(i<cur?'<span class="material-symbols-outlined" style="font-size:13px">check</span>':(i+1))+'</span>'}
 return '<div class="steps">'+h+'</div>'}

function mkArea(el,data,cats,name,x){push(el,{chart:Object.assign({},CB,{type:"area",height:_h(x,230)}),series:[{name:name,data:data}],

function buildNav(){var n=document.getElementById("nav");
 n.innerHTML=MODULES.map(function(m,i){return '<button type="button" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'}).join("");

function show(i){killCharts();var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i)});
 RENDER[i](document.getElementById("screen"))}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?Math.min(+m[1],MODULES.length-1):0);try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
