<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>個人財務管理｜Jvision 系統 Demo</title>
  <meta name="description" content="帳戶資產、交易記帳、預算控管、帳單提醒到財務分析的個人財務即時掌握" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --color-primary:#F59E0B;
      --color-on-primary:#0F172A;
      --color-secondary:#FBBF24;
      --color-on-secondary:#0F172A;
      --color-accent:#8B5CF6;
      --color-on-accent:#000000;
      --color-background:#0F172A;
      --color-foreground:#F8FAFC;
      --color-card:#222735;
      --color-card-foreground:#F8FAFC;
      --color-muted:#272F42;
      --color-muted-foreground:#AEBBD0;
      --color-border:#41506A;
      --color-destructive:#EF4444;
      --color-on-destructive:#000000;
      --color-ring:#F59E0B;
      --blue:#F59E0B;
      --ink:#F8FAFC;
      --muted:#AEBBD0;
      --line:#41506A;
      --success:#34D399;
      --warning:#FBBF24;
      --danger:#FB7185;
      --info:#7DD3FC;
      --radius:10px;
      --shadow:0 12px 28px rgba(0,0,0,.22);
    }
    *{box-sizing:border-box;min-width:0}
    html{color-scheme:dark;scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      background:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),
        var(--color-background);
      background-size:48px 48px;
      color:var(--color-foreground);
      font-family:"IBM Plex Sans","Noto Sans TC",system-ui,sans-serif;
      line-height:1.5;
      -webkit-font-smoothing:antialiased;
    }
    button{font:inherit}
    button,.tabs button{cursor:pointer}
    :focus-visible{
      outline:3px solid var(--color-ring);
      outline-offset:3px;
      box-shadow:0 0 0 5px rgba(245,158,11,.18);
    }
    .material-symbols-outlined{
      font-family:"Material Symbols Outlined";
      font-weight:normal;
      font-style:normal;
      font-size:20px;
      line-height:1;
      letter-spacing:normal;
      text-transform:none;
      display:inline-block;
      white-space:nowrap;
      word-wrap:normal;
      direction:ltr;
      -webkit-font-feature-settings:"liga";
      -webkit-font-smoothing:antialiased;
    }
    .topbar{
      position:sticky;
      top:0;
      z-index:50;
      border-bottom:1px solid var(--color-border);
      background:rgba(15,23,42,.94);
      backdrop-filter:blur(14px);
    }
    .brandrow{
      max-width:1440px;
      margin:auto;
      padding:15px 24px 10px;
      display:flex;
      align-items:center;
      gap:13px;
    }
    .logo{
      width:42px;
      height:42px;
      flex:0 0 42px;
      display:grid;
      place-items:center;
      color:var(--color-on-primary);
      background:var(--color-primary);
      border:1px solid #FCD34D;
      border-radius:8px;
      box-shadow:5px 5px 0 rgba(139,92,246,.48);
    }
    .logo .material-symbols-outlined{font-size:24px}
    .brand h1{
      margin:0;
      font-size:16px;
      font-weight:700;
      letter-spacing:.01em;
    }
    .brand p{
      margin:2px 0 0;
      color:var(--color-muted-foreground);
      font-size:12px;
    }
    .livepill{
      margin-left:auto;
      display:flex;
      align-items:center;
      gap:8px;
      padding:7px 11px;
      border:1px solid var(--color-border);
      border-radius:999px;
      background:var(--color-card);
      color:var(--color-muted-foreground);
      font-size:11.5px;
      white-space:nowrap;
    }
    .dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--success);
      box-shadow:0 0 0 4px rgba(52,211,153,.14);
      animation:pulse 2.4s ease-out infinite;
    }
    .tabs{
      max-width:1440px;
      margin:auto;
      padding:8px 24px 14px;
      display:flex;
      gap:7px;
      overflow-x:auto;
      scrollbar-width:thin;
    }
    .tabs button{
      flex:none;
      min-height:42px;
      display:flex;
      align-items:center;
      gap:8px;
      padding:9px 13px;
      border:1px solid var(--color-border);
      border-radius:8px;
      background:transparent;
      color:var(--color-muted-foreground);
      font-size:13px;
      font-weight:600;
      white-space:nowrap;
      transition:background-color .22s ease,border-color .22s ease,color .22s ease,transform .22s ease;
    }
    .tabs button:hover{
      color:var(--color-foreground);
      border-color:var(--color-primary);
      background:rgba(245,158,11,.08);
      transform:translateY(-1px);
    }
    .tabs button.on{
      border-color:var(--color-primary);
      background:var(--color-primary);
      color:var(--color-on-primary);
      box-shadow:4px 4px 0 rgba(139,92,246,.48);
    }
    main{width:min(100%,1440px);margin:auto;padding:28px 24px 32px}
    .screen{animation:screen-in .4s cubic-bezier(.2,.8,.2,1) both}
    .schead{
      margin-bottom:19px;
      display:grid;
      grid-template-columns:auto 1fr;
      grid-template-areas:"icon title" "icon copy";
      align-items:center;
      column-gap:12px;
    }
    .schead>.material-symbols-outlined{
      grid-area:icon;
      width:43px;
      height:43px;
      display:grid;
      place-items:center;
      border:1px solid rgba(245,158,11,.5);
      border-radius:8px;
      background:rgba(245,158,11,.1);
      color:var(--color-primary);
      font-size:23px;
    }
    .schead h2{
      grid-area:title;
      margin:0;
      font-size:clamp(20px,2vw,25px);
      line-height:1.2;
      font-weight:700;
      letter-spacing:-.02em;
    }
    .schead p{
      grid-area:copy;
      margin:2px 0 0;
      color:var(--color-muted-foreground);
      font-size:13px;
    }
    .grid{display:grid;gap:14px}
    .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .g23{grid-template-columns:minmax(0,1.55fr) minmax(320px,1fr)}
    .panel,.kpi,.acct,.goal{
      border:1px solid var(--color-border);
      border-radius:var(--radius);
      background:var(--color-card);
      box-shadow:0 1px 0 rgba(255,255,255,.04);
      transition:border-color .22s ease,transform .22s ease,box-shadow .22s ease;
    }
    .panel:hover,.kpi:hover,.acct:hover,.goal:hover{
      border-color:#60708D;
      box-shadow:var(--shadow);
      transform:translateY(-2px);
    }
    .panel{padding:17px}
    .panel h3{
      margin:0 0 14px;
      display:flex;
      align-items:center;
      gap:8px;
      font-size:14px;
      font-weight:700;
      letter-spacing:.01em;
    }
    .panel h3 .material-symbols-outlined{color:var(--color-primary)}
    .kpi{
      min-height:137px;
      padding:16px;
      position:relative;
      overflow:hidden;
    }
    .kpi:after{
      content:"";
      position:absolute;
      right:0;
      top:0;
      width:45px;
      height:4px;
      background:var(--color-primary);
    }
    .kpi .lbl{
      display:flex;
      align-items:center;
      gap:7px;
      color:var(--color-muted-foreground);
      font-size:12px;
      font-weight:500;
    }
    .kpi .lbl .material-symbols-outlined{color:var(--color-primary);font-size:18px}
    .kpi .val{
      margin-top:10px;
      font-size:clamp(22px,2.1vw,28px);
      font-weight:700;
      letter-spacing:-.025em;
      font-variant-numeric:tabular-nums;
    }
    .kpi .sub{margin-top:6px;color:var(--color-muted-foreground);font-size:11.5px}
    .up,.down,.flat{font-weight:600}
    .up{color:#6EE7B7}
    .down{color:#FDA4AF}
    .flat{color:#FCD34D}
    .sub.up:before,.chg.up:before{content:"↑ ";font-family:Arial,sans-serif}
    .sub.down:before,.chg.down:before{content:"! ";font-family:Arial,sans-serif}
    .sub.flat:before,.chg.flat:before{content:"— ";font-family:Arial,sans-serif}
    .acct{padding:14px;background:var(--color-muted)}
    .acct .bank{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:700}
    .acct .bank i{
      width:35px;
      height:35px;
      display:grid;
      place-items:center;
      border:1px solid rgba(245,158,11,.45);
      border-radius:7px;
      background:rgba(245,158,11,.1);
      color:var(--color-primary);
      font-style:normal;
    }
    .acct .no{
      margin-top:11px;
      color:var(--color-muted-foreground);
      font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
      font-size:11px;
      letter-spacing:.08em;
    }
    .acct .bal{
      margin-top:3px;
      font-size:20px;
      font-weight:700;
      font-variant-numeric:tabular-nums;
    }
    .acct .chg{margin-top:4px;font-size:11.5px}
    .scroll{overflow-x:auto;border-radius:8px}
    table{
      width:100%;
      min-width:560px;
      border-collapse:collapse;
      font-size:12.5px;
    }
    th,td{
      padding:11px 12px;
      border-bottom:1px solid var(--color-border);
      text-align:left;
      vertical-align:middle;
    }
    th{
      background:var(--color-muted);
      color:#CBD5E1;
      font-size:11.5px;
      font-weight:600;
      letter-spacing:.03em;
    }
    tbody tr{transition:background-color .2s ease}
    tbody tr:hover{background:rgba(245,158,11,.065)}
    td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
    tbody td:first-child{
      font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
      font-variant-numeric:tabular-nums;
      white-space:nowrap;
    }
    .tag,.chip{
      display:inline-flex;
      align-items:center;
      gap:5px;
      border-radius:999px;
      white-space:nowrap;
      font-weight:600;
    }
    .tag{padding:3px 9px;border:1px solid currentColor;font-size:11px}
    .tag:before{font-family:"Material Symbols Outlined";font-size:13px;line-height:1}
    .t-food{color:#FCD34D;background:rgba(251,191,36,.1)}
    .t-food:before{content:"restaurant"}
    .t-shop{color:#C4B5FD;background:rgba(139,92,246,.12)}
    .t-shop:before{content:"shopping_bag"}
    .t-trans{color:#BAE6FD;background:rgba(125,211,252,.1)}
    .t-trans:before{content:"directions_bus"}
    .t-in{color:#6EE7B7;background:rgba(52,211,153,.1)}
    .t-in:before{content:"arrow_downward"}
    .t-fun{color:#DDD6FE;background:rgba(167,139,250,.11)}
    .t-fun:before{content:"theaters"}
    .t-bill{color:#FDA4AF;background:rgba(239,68,68,.1)}
    .t-bill:before{content:"priority_high"}
    .chip{
      padding:5px 10px;
      border:1px solid var(--color-border);
      background:var(--color-muted);
      color:#CBD5E1;
      font-size:11px;
    }
    canvas{max-width:100%}
    .chartbox{position:relative;height:260px}
    .chartbox.sm{height:190px}
    .barrow{display:flex;flex-direction:column;gap:15px}
    .prog{
      height:9px;
      overflow:hidden;
      border:1px solid var(--color-border);
      border-radius:3px;
      background:#171D2A;
    }
    .prog>i{
      display:block;
      height:100%;
      border-radius:2px;
      background:var(--color-primary);
      transition:width .45s cubic-bezier(.2,.8,.2,1);
    }
    .prog.good>i{background:var(--success)}
    .prog.over>i{background:var(--danger)}
    .mini{color:var(--color-muted-foreground);font-size:11.5px}
    .tl{position:relative;padding-left:23px}
    .tl:before{
      content:"";
      position:absolute;
      left:6px;
      top:5px;
      bottom:7px;
      width:1px;
      background:var(--color-border);
    }
    .tl .ev{position:relative;padding:0 0 17px 12px}
    .tl .ev:before{
      content:"schedule";
      position:absolute;
      left:-25px;
      top:1px;
      width:17px;
      height:17px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:var(--color-muted);
      color:var(--warning);
      font:12px/1 "Material Symbols Outlined";
    }
    .tl .ev.due:before{
      content:"priority_high";
      background:var(--danger);
      color:#0F172A;
    }
    .tl .d{
      color:var(--color-muted-foreground);
      font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
      font-size:11px;
    }
    .tl .ti{margin:2px 0;font-size:13px;font-weight:600}
    .goal{padding:16px;background:var(--color-card)}
    .goal .gh{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700}
    .goal .gh .ic{
      width:37px;
      height:37px;
      display:grid;
      place-items:center;
      border:1px solid currentColor;
      border-radius:7px;
    }
    .goal .amt{color:var(--color-muted-foreground);font-size:13px}
    .goal .amt b{color:var(--color-foreground);font-size:16px}
    .ring{
      width:88px;
      height:88px;
      flex:none;
      position:relative;
      display:grid;
      place-items:center;
      border-radius:50%;
    }
    .ringcore{
      position:absolute;
      inset:8px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:var(--color-card);
    }
    .cal{
      min-width:560px;
      display:grid;
      grid-template-columns:repeat(7,1fr);
      gap:6px;
    }
    .cal .dow{
      padding:4px 0;
      color:var(--color-muted-foreground);
      font-size:11px;
      font-weight:600;
      text-align:center;
    }
    .cal .cell{
      min-height:66px;
      padding:7px;
      border:1px solid var(--color-border);
      border-radius:7px;
      background:var(--color-muted);
      font-size:11px;
    }
    .cal .cell.mut{opacity:.35}
    .cal .cell .dn{
      color:#CBD5E1;
      font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
      font-size:12px;
      font-weight:700;
    }
    .cal .bpill{
      margin-top:5px;
      padding:2px 5px;
      display:block;
      overflow:hidden;
      border:1px solid currentColor;
      border-radius:4px;
      font-size:10px;
      font-weight:600;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .cal .bpill.due{color:#FDA4AF;background:rgba(239,68,68,.09)}
    .cal .bpill.paid{color:#6EE7B7;background:rgba(52,211,153,.09)}
    .cal .today{
      outline:2px solid var(--color-primary);
      outline-offset:-2px;
    }
    .stcat{
      padding:9px 0;
      display:flex;
      align-items:center;
      gap:10px;
      border-bottom:1px solid var(--color-border);
      font-size:12.5px;
    }
    .stcat .sw{width:11px;height:11px;flex:none;border:1px solid rgba(255,255,255,.5);border-radius:2px}
    .stcat .nm{flex:1}
    .foot{
      margin-top:24px;
      padding:17px 0;
      border-top:1px solid var(--color-border);
      color:var(--color-muted-foreground);
      font-size:11.5px;
      text-align:center;
    }
    .foot b{color:var(--color-primary)}
    .screen .grid-item{animation:item-in .42s cubic-bezier(.22,1.2,.36,1) both}
    .screen .grid-item:nth-child(2){animation-delay:.06s}
    .screen .grid-item:nth-child(3){animation-delay:.12s}
    .screen .grid-item:nth-child(4){animation-delay:.18s}
    @keyframes pulse{
      0%{box-shadow:0 0 0 0 rgba(52,211,153,.45)}
      70%,100%{box-shadow:0 0 0 8px rgba(52,211,153,0)}
    }
    @keyframes screen-in{
      from{opacity:0;transform:translateY(8px)}
      to{opacity:1;transform:none}
    }
    @keyframes item-in{
      from{opacity:0;transform:translateY(14px) scale(.97)}
      to{opacity:1;transform:none}
    }
    @media(max-width:1024px){
      .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
      .g23{grid-template-columns:1fr}
    }
    @media(max-width:768px){
      .brandrow{padding-inline:16px}
      .tabs{padding-inline:16px}
      main{padding:22px 16px}
      .g2,.g3{grid-template-columns:1fr}
      .livepill{font-size:0;padding:8px}
      .livepill:after{content:"即時同步";font-size:11px}
    }
    @media(max-width:480px){
      .brand p{display:none}
      .brand h1{font-size:14px}
      .tabs button{padding:10px 12px}
      .tabs button .lbl{display:none}
      .g4{grid-template-columns:1fr}
      .kpi{min-height:120px}
      .schead{align-items:start}
      .schead p{margin-top:5px}
      .chartbox{height:235px}
    }
    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*:before,*:after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
        scroll-behavior:auto!important;
      }
      .screen,.screen .grid-item{animation:none!important}
      .dot{animation:none!important}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brandrow">
      <div class="logo" aria-hidden="true"><span class="material-symbols-outlined">account_balance_wallet</span></div>
      <div class="brand">
        <h1>個人財務管理 FinanceHub</h1>
        <p>帳戶資產 · 交易記帳 · 預算控管 · 帳單提醒 · 財務分析</p>
      </div>
      <div class="livepill"><span class="dot" aria-hidden="true"></span>資料即時同步 · 更新於 08:12</div>
    </div>
    <nav class="tabs" id="nav" aria-label="財務管理功能"></nav>
  </header>
  <main>
    <div id="view" aria-live="polite"></div>
  </main>

  <script>
    var MODULES=[
      {icon:"account_balance_wallet",name:"帳戶資產總覽",desc:"整合銀行、信用卡、投資與現金淨值"},
      {icon:"receipt_long",name:"交易記帳",desc:"收支明細登錄、自動分類與標籤"},
      {icon:"savings",name:"預算控管",desc:"分類預算編列與即時使用進度"},
      {icon:"notifications_active",name:"帳單提醒",desc:"週期帳單排程與到期預警"},
      {icon:"insights",name:"財務分析",desc:"收支趨勢、消費結構與淨值走勢"},
      {icon:"flag",name:"儲蓄目標",desc:"目標存款規劃與達成追蹤"}
    ];
    var fmt=function(n){
      try{return Number(n).toLocaleString("en-US")}
      catch(e){return String(n)}
    };
    function chartDefaults(){
      if(!window.Chart)return;
      Chart.defaults.color="#AEBBD0";
      Chart.defaults.borderColor="#41506A";
      Chart.defaults.font.family="'IBM Plex Sans','Noto Sans TC',sans-serif";
      Chart.defaults.font.size=11;
    }
    function head(icon,title,sub){
      return '<div class="schead"><span class="material-symbols-outlined" aria-hidden="true">'+icon+'</span><h2>'+title+'</h2><p>'+sub+'</p></div>';
    }
    function kpi(o){
      return '<div class="kpi grid-item"><div class="lbl"><span class="material-symbols-outlined" aria-hidden="true">'+o.i+'</span>'+o.l+'</div><div class="val">'+o.v+'</div><div class="sub '+(o.c||"")+'">'+o.s+'</div></div>';
    }
    function icon(name){
      return '<span class="material-symbols-outlined" aria-hidden="true">'+name+'</span>';
    }

    var ACCOUNTS=[
      {bank:"O宏世華 活存",ic:"account_balance",no:"**** 4821",bal:482350,chg:"+ $12,400 (本月)",cls:"up"},
      {bank:"O新 數位帳戶",ic:"savings",no:"**** 7130",bal:268900,chg:"+ $3,100 (本月)",cls:"up"},
      {bank:"O山 信用卡",ic:"credit_card",no:"**** 9042",bal:-38620,chg:"待繳 09/15",cls:"down"},
      {bank:"元O 證券投資",ic:"trending_up",no:"**** 2258",bal:915400,chg:"+ $41,200 (未實現)",cls:"up"},
      {bank:"街口 電子錢包",ic:"wallet",no:"**** 0067",bal:6820,chg:"- $1,240 (本月)",cls:"down"},
      {bank:"現金",ic:"payments",no:"實體現金",bal:8500,chg:"持平",cls:"flat"}
    ];
    function screen0(){
      var net=0;
