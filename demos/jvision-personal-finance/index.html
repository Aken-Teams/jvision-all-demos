<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>個人財務管理｜Jvision 系統 Demo</title>
  <meta name="description" content="帳戶資產、交易記帳、預算控管、帳單提醒到財務分析的個人財務即時掌握" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --accent:#be185d; --accent2:#fb7185;
      --bg:#0e0b12; --panel:#181320; --panel2:#211a2e; --line:#2f2540;
      --txt:#f4eef8; --mut:#a99cbb; --dim:#7d7090;
      --ok:#34d399; --warn:#fbbf24; --bad:#fb7185;
    }
    *{box-sizing:border-box;min-width:0}
    html,body{margin:0;padding:0}
    body{
      font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
      background:radial-gradient(1200px 700px at 15% -8%,#2a0f24 0%,transparent 55%),
                 radial-gradient(1000px 600px at 110% 0%,#241033 0%,transparent 50%),
                 var(--bg);
      color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased;
    }
    .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
    header.topbar{
      position:sticky;top:0;z-index:50;
      background:linear-gradient(180deg,rgba(20,14,28,.96),rgba(20,14,28,.86));
      backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
    }
    .brandrow{display:flex;align-items:center;gap:14px;padding:14px 20px 6px}
    .logo{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
      background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 18px rgba(190,24,93,.4)}
    .logo .material-symbols-outlined{font-size:24px}
    .brand h1{font-size:16px;margin:0;font-weight:800;letter-spacing:.3px}
    .brand p{font-size:11.5px;margin:2px 0 0;color:var(--mut)}
    .livepill{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--mut);
      background:var(--panel);border:1px solid var(--line);padding:6px 11px;border-radius:999px;white-space:nowrap}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.55)}70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
    nav.tabs{display:flex;flex-wrap:wrap;gap:8px;padding:8px 16px 14px}
    nav.tabs button{
      flex:none;white-space:nowrap;display:flex;align-items:center;gap:8px;
      background:var(--panel);color:var(--mut);border:1px solid var(--line);
      padding:9px 14px;border-radius:11px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.16s}
    nav.tabs button .material-symbols-outlined{font-size:19px}
    nav.tabs button:hover{color:var(--txt);border-color:var(--accent2)}
    nav.tabs button.on{background:linear-gradient(135deg,var(--accent),#9d1650);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(190,24,93,.35)}
    main{padding:20px;max-width:1360px;margin:0 auto}
    .screen{animation:fade .35s ease}
    @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .schead{display:flex;align-items:flex-end;gap:12px;margin:0 0 16px;flex-wrap:wrap}
    .schead .material-symbols-outlined{font-size:26px;color:var(--accent2)}
    .schead h2{margin:0;font-size:20px;font-weight:800}
    .schead p{margin:0;color:var(--mut);font-size:13px}
    .panel{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;padding:16px}
    .panel h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
    .panel h3 .material-symbols-outlined{font-size:19px;color:var(--accent2)}
    .grid{display:grid;gap:14px}
    .g4{grid-template-columns:repeat(4,1fr)}
    .g3{grid-template-columns:repeat(3,1fr)}
    .g2{grid-template-columns:repeat(2,1fr)}
    .g23{grid-template-columns:1.55fr 1fr}
    @media(max-width:820px){
      .g4,.g3,.g2,.g23{grid-template-columns:1fr}
    }
    .kpi{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:15px;padding:15px;position:relative;overflow:hidden}
    .kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,rgba(190,24,93,.28),transparent 70%)}
    .kpi .lbl{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
    .kpi .lbl .material-symbols-outlined{font-size:17px;color:var(--accent2)}
    .kpi .val{font-size:24px;font-weight:800;margin-top:8px;letter-spacing:.4px}
    .kpi .sub{font-size:11.5px;margin-top:5px;color:var(--dim)}
    .up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--warn)}
    table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
    th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
    th{color:var(--dim);font-weight:600;font-size:11.5px;position:sticky;top:0;background:var(--panel2)}
    tbody tr:hover{background:rgba(190,24,93,.08)}
    td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
    .tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 9px;border-radius:999px;font-weight:600;white-space:nowrap}
    .t-food{background:rgba(251,191,36,.16);color:#fcd34d}
    .t-shop{background:rgba(190,24,93,.18);color:#f9a8c4}
    .t-trans{background:rgba(96,165,250,.16);color:#93c5fd}
    .t-in{background:rgba(52,211,153,.16);color:#6ee7b7}
    .t-fun{background:rgba(167,139,250,.16);color:#c4b5fd}
    .t-bill{background:rgba(251,113,133,.16);color:#fda4af}
    .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--mut)}
    canvas{max-width:100%}
    .chartbox{position:relative;height:250px}
    .chartbox.sm{height:200px}
    .scroll{overflow-x:auto}
    .barrow{display:flex;flex-direction:column;gap:12px}
    .prog{height:9px;border-radius:999px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
    .prog>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
    .prog.over>i{background:linear-gradient(90deg,#b91c1c,var(--bad))}
    .prog.good>i{background:linear-gradient(90deg,#059669,var(--ok))}
    .mini{font-size:11.5px;color:var(--mut)}
    .acct{border:1px solid var(--line);border-radius:14px;padding:14px;background:linear-gradient(150deg,#1c1526,#241a33);position:relative;overflow:hidden}
    .acct .bank{display:flex;align-items:center;gap:10px;font-weight:700;font-size:13.5px}
    .acct .bank i{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
    .acct .bank i .material-symbols-outlined{font-size:19px}
    .acct .no{font-size:11px;color:var(--dim);margin-top:10px;letter-spacing:1px}
    .acct .bal{font-size:20px;font-weight:800;margin-top:4px}
    .acct .chg{font-size:11.5px;margin-top:4px}
    .tl{position:relative;padding-left:22px}
    .tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
    .tl .ev{position:relative;padding:0 0 16px 12px}
    .tl .ev::before{content:"";position:absolute;left:-20px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 3px rgba(251,113,133,.2)}
    .tl .ev.due::before{background:var(--warn);box-shadow:0 0 0 3px rgba(251,191,36,.2)}
    .tl .d{font-size:11px;color:var(--dim)}
    .tl .ti{font-size:13px;font-weight:600;margin:2px 0}
    .goal{border:1px solid var(--line);border-radius:14px;padding:15px;background:linear-gradient(160deg,#1b1425,#251b34)}
    .goal .gh{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
    .goal .gh .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
    .goal .amt{font-size:13px;color:var(--mut)}
    .goal .amt b{color:var(--txt);font-size:16px}
    .ring{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none}
    .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;min-width:520px}
    .cal .dow{font-size:11px;color:var(--dim);text-align:center;padding:4px 0}
    .cal .cell{border:1px solid var(--line);border-radius:9px;min-height:62px;padding:6px;background:var(--panel2);font-size:11px}
    .cal .cell.mut{opacity:.3}
    .cal .cell .dn{font-weight:700;font-size:12px;color:var(--mut)}
    .cal .bpill{margin-top:4px;font-size:10px;padding:2px 6px;border-radius:6px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .cal .bpill.due{background:rgba(251,113,133,.2);color:#fda4af}
    .cal .bpill.paid{background:rgba(52,211,153,.16);color:#6ee7b7}
    .cal .today{outline:2px solid var(--accent2)}
    .stcat{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
    .stcat .sw{width:11px;height:11px;border-radius:3px;flex:none}
    .stcat .nm{flex:1}
    .foot{margin-top:22px;text-align:center;color:var(--dim);font-size:11.5px;padding:16px 0}
    .foot b{color:var(--accent2)}
    @media(max-width:560px){
      nav.tabs button .lbl{display:none}
      nav.tabs button{padding:9px 11px}
      main{padding:14px}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brandrow">
      <div class="logo"><span class="material-symbols-outlined">account_balance_wallet</span></div>
      <div class="brand">
        <h1>個人財務管理 FinanceHub</h1>
        <p>帳戶資產 · 交易記帳 · 預算控管 · 帳單提醒 · 財務分析</p>
      </div>
      <div class="livepill"><span class="dot"></span>資料即時同步 · 更新於 08:12</div>
    </div>
    <nav class="tabs" id="nav"></nav>
  </header>
  <main><div id="view"></div></main>

  <script>
  var MODULES = [
    {icon:"account_balance_wallet", name:"帳戶資產總覽", desc:"整合銀行、信用卡、投資與現金淨值"},
    {icon:"receipt_long", name:"交易記帳", desc:"收支明細登錄、自動分類與標籤"},
    {icon:"savings", name:"預算控管", desc:"分類預算編列與即時使用進度"},
    {icon:"notifications_active", name:"帳單提醒", desc:"週期帳單排程與到期預警"},
    {icon:"insights", name:"財務分析", desc:"收支趨勢、消費結構與淨值走勢"},
    {icon:"flag", name:"儲蓄目標", desc:"目標存款規劃與達成追蹤"}
  ];
  var fmt = function(n){ try{ return Number(n).toLocaleString("en-US"); }catch(e){ return String(n); } };

  function chartDefaults(){
    if(window.Chart){
      Chart.defaults.color = "#a99cbb";
      Chart.defaults.borderColor = "#2f2540";
      Chart.defaults.font.family = "Inter, 'Noto Sans TC', sans-serif";
    }
  }

  function head(icon,title,sub){
    return '<div class="schead"><span class="material-symbols-outlined">'+icon+'</span>'+
           '<h2>'+title+'</h2><p>'+sub+'</p></div>';
  }
  function kpi(o){
    return '<div class="kpi"><div class="lbl"><span class="material-symbols-outlined">'+o.i+'</span>'+o.l+'</div>'+
           '<div class="val">'+o.v+'</div><div class="sub '+(o.c||'')+'">'+o.s+'</div></div>';
  }

  // ===== SCREEN 0: 帳戶資產總覽 =====
  var ACCOUNTS = [
    {bank:"O宏世華 活存", ic:"account_balance", no:"**** 4821", bal:482350, chg:"+ $12,400 (本月)", cls:"up"},
    {bank:"O新 數位帳戶", ic:"savings", no:"**** 7130", bal:268900, chg:"+ $3,100 (本月)", cls:"up"},
    {bank:"O山 信用卡", ic:"credit_card", no:"**** 9042", bal:-38620, chg:"待繳 09/15", cls:"down"},
    {bank:"元O 證券投資", ic:"trending_up", no:"**** 2258", bal:915400, chg:"+ $41,200 (未實現)", cls:"up"},
    {bank:"街口 電子錢包", ic:"wallet", no:"**** 0067", bal:6820, chg:"- $1,240 (本月)", cls:"down"},
    {bank:"現金", ic:"payments", no:"實體現金", bal:8500, chg:"持平", cls:"flat"}
  ];
  function screen0(){
    var cards = ACCOUNTS.map(function(a){
      return '<div class="acct"><div class="bank"><i><span class="material-symbols-outlined">'+a.ic+'</span></i>'+a.bank+'</div>'+
        '<div class="no">'+a.no+'</div><div class="bal">$'+fmt(a.bal)+'</div>'+
        '<div class="chg '+a.cls+'">'+a.chg+'</div></div>';
    }).join("");
    var net = 0; ACCOUNTS.forEach(function(a){net+=a.bal;});
    return head("account_balance_wallet","帳戶資產總覽","串接各金融帳戶，自動同步餘額並計算個人淨值") +
      '<div class="grid g4" style="margin-bottom:14px">'+
        kpi({i:"account_balance",l:"總淨值",v:"$"+fmt(net),s:"+ 4.8% vs 上月",c:"up"})+
        kpi({i:"savings",l:"流動資產",v:"$757,570",s:"活存 + 數位 + 錢包"})+
        kpi({i:"trending_up",l:"投資部位",v:"$915,400",s:"未實現 + $41,200",c:"up"})+
        kpi({i:"credit_card",l:"信用卡應繳",v:"$38,620",s:"到期 09/15",c:"down"})+
      '</div>'+
      '<div class="grid g23">'+
        '<div class="panel"><h3><span class="material-symbols-outlined">wallet</span>連結帳戶</h3>'+
          '<div class="grid g2">'+cards+'</div></div>'+
        '<div class="panel"><h3><span class="material-symbols-outlined">donut_large</span>資產配置</h3>'+
          '<div class="chartbox"><canvas id="c0a"></canvas></div>'+
          '<div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px">'+
            '<span class="chip">現金 32%</span><span class="chip">投資 55%</span>'+
            '<span class="chip">電子錢包 1%</span><span class="chip">負債 -12%</span></div>'+
        '</div>'+
      '</div>';
  }
  function init0(){
    new Chart(document.getElementById("c0a"),{
      type:"doughnut",
      data:{labels:["活存","數位帳戶","投資","電子錢包","現金"],
        datasets:[{data:[482350,268900,915400,6820,8500],
          backgroundColor:["#be185d","#fb7185","#f9a8c4","#a78bfa","#60a5fa"],borderColor:"#181320",borderWidth:2}]},
      options:{plugins:{legend:{position:"bottom",labels:{padding:14,boxWidth:12}}},cutout:"60%"}
    });
  }

  // ===== SCREEN 1: 交易記帳 =====
  var TXN = [
    {d:"08/13 08:02", m:"O家便利商店", cat:"食", tag:"t-food", note:"早餐＋咖啡", amt:-115},
    {d:"08/12 21:40", m:"薪資轉入 · 公司", cat:"收入", tag:"t-in", note:"8月薪資", amt:58200},
    {d:"08/12 19:15", m:"foodpanda", cat:"食", tag:"t-food", note:"晚餐外送", amt:-320},
    {d:"08/12 14:30", m:"UNIWEAR 信義店", cat:"購物", tag:"t-shop", note:"換季衣物", amt:-1690},
    {d:"08/11 08:55", m:"悠遊卡加值", cat:"交通", tag:"t-trans", note:"捷運通勤", amt:-500},
    {d:"08/11 12:10", m:"O丘咖啡", cat:"娛樂", tag:"t-fun", note:"與朋友聚會", amt:-260},
    {d:"08/10 09:00", m:"O通電信", cat:"帳單", tag:"t-bill", note:"手機費自動扣繳", amt:-799},
    {d:"08/10 20:22", m:"O豐量販", cat:"食", tag:"t-food", note:"一週採買", amt:-1420},
    {d:"08/09 16:45", m:"股利入帳 · 元O", cat:"收入", tag:"t-in", note:"季配息", amt:3150},
    {d:"08/09 11:30", m:"Netflix", cat:"娛樂", tag:"t-fun", note:"月訂閱", amt:-390}
  ];
  function screen1(){
    var rows = TXN.map(function(t){
      var cls = t.amt<0 ? "down" : "up";
      var sign = t.amt<0 ? "-$"+fmt(-t.amt) : "+$"+fmt(t.amt);
      return '<tr><td>'+t.d+'</td><td>'+t.m+'</td>'+
        '<td><span class="tag '+t.tag+'">'+t.cat+'</span></td>'+
        '<td style="color:var(--mut)">'+t.note+'</td>'+
        '<td class="num '+cls+'" style="font-weight:700">'+sign+'</td></tr>';
    }).join("");
    return head("receipt_long","交易記帳","匯入或手動登錄收支，系統依商店與關鍵字自動分類貼標") +
      '<div class="grid g4" style="margin-bottom:14px">'+
        kpi({i:"south_west",l:"本月支出",v:"$28,640",s:"共 47 筆交易",c:"down"})+
        kpi({i:"north_east",l:"本月收入",v:"$61,350",s:"薪資 + 股利",c:"up"})+
        kpi({i:"savings",l:"本月結餘",v:"$32,710",s:"儲蓄率 53%",c:"up"})+
        kpi({i:"auto_awesome",l:"自動分類率",v:"96.4%",s:"僅 2 筆待確認"})+
      '</div>'+
      '<div class="grid g23">'+
        '<div class="panel"><h3><span class="material-symbols-outlined">list_alt</span>最近交易明細</h3>'+
          '<div class="scroll"><table><thead><tr><th>時間</th><th>商店／來源</th><th>分類</th><th>備註</th><th class="num">金額</th></tr></thead>'+
          '<tbody>'+rows+'</tbody></table></div></div>'+
        '<div class="panel"><h3><span class="material-symbols-outlined">bar_chart</span>近 7 日收支</h3>'+
          '<div class="chartbox"><canvas id="c1a"></canvas></div>'+
          '<div style="margin-top:10px" class="mini">系統依商店名稱與關鍵字比對規則庫，自動歸類為食、購物、交通等分類。</div>'+
        '</div>'+
      '</div>';
  }
  function init1(){
    new Chart(document.getElementById("c1a"),{
      type:"bar",
      data:{labels:["08/07","08/08","08/09","08/10","08/11","08/12","08/13"],
        datasets:[
          {label:"支出",data:[-820,-1560,-1200,-3018,-1260,-2330,-115],backgroundColor:"#fb7185",borderRadius:5},
          {label:"收入",data:[0,0,3150,0,0,58200,0],backgroundColor:"#34d399",borderRadius:5}
        ]},
      options:{scales:{x:{grid:{color:"#241b33"}},y:{grid:{color:"#241b33"},ticks:{callback:function(v){return "$"+fmt(v);}}}},
        plugins:{legend:{position:"bottom",labels:{boxWidth:12}}}}
    });
  }

  // ===== SCREEN 2: 預算控管 =====
  var BUDGET = [
    {cat:"飲食", icon:"restaurant", bud:12000, used:9840},
    {cat:"購物", icon:"shopping_bag", bud:6000, used:6890},
    {cat:"交通", icon:"directions_bus", bud:3000, used:1720},
    {cat:"居住／帳單", icon:"home", bud:18000, used:16200},
    {cat:"娛樂", icon:"sports_esports", bud:4000, used:2380},
    {cat:"醫療", icon:"medical_services", bud:2500, used:640}
  ];
  function screen2(){
    var rows = BUDGET.map(function(b){
      var pct = Math.round(b.used/b.bud*100);
      var cls = pct>100 ? "over" : (pct>85 ? "" : "good");
      var w = Math.min(pct,100);
      var st = pct>100 ? '<span class="tag t-bill">超支 $'+fmt(b.used-b.bud)+'</span>'
             : pct>85 ? '<span class="tag t-food">接近上限</span>'
             : '<span class="tag t-in">充裕</span>';
      return '<div><div style="display:flex;align-items:center;gap:9px;margin-bottom:6px;flex-wrap:wrap">'+
        '<span class="material-symbols-outlined" style="font-size:19px;color:var(--accent2)">'+b.icon+'</span>'+
        '<b style="font-size:13px">'+b.cat+'</b>'+st+
        '<span class="mini" style="margin-left:auto">$'+fmt(b.used)+' / $'+fmt(b.bud)+' · '+pct+'%</span></div>'+
        '<div class="prog '+cls+'"><i style="width:'+w+'%"></i></div></div>';
    }).join("");
    return head("savings","預算控管","為各消費分類設定月度預算，即時比對已用金額並於超支前示警") +
      '<div class="grid g4" style="margin-bottom:14px">'+
        kpi({i:"account_balance_wallet",l:"月度總預算",v:"$45,500",s:"6 個分類"})+
        kpi({i:"receipt",l:"已使用",v:"$37,670",s:"占比 82.8%",c:"flat"})+
        kpi({i:"savings",l:"剩餘可用",v:"$7,830",s:"距月底 18 天",c:"up"})+
        kpi({i:"warning",l:"超支分類",v:"1 項",s:"購物超支 $890",c:"down"})+
      '</div>'+
      '<div class="grid g23">'+
        '<div class="panel"><h3><span class="material-symbols-outlined">tune</span>分類預算進度</h3><div class="barrow">'+rows+'</div></div>'+
        '<div class="panel"><h3><span class="material-symbols-outlined">radar</span>預算 vs 實際</h3>'+
          '<div class="chartbox"><canvas id="c2a"></canvas></div></div>'+
      '</div>';
  }
  function init2(){
    new Chart(document.getElementById("c2a"),{
      type:"radar",
      data:{labels:BUDGET.map(function(b){return b.cat;}),
        datasets:[
          {label:"預算",data:BUDGET.map(function(b){return b.bud;}),borderColor:"#a78bfa",backgroundColor:"rgba(167,139,250,.18)",pointBackgroundColor:"#a78bfa"},
          {label:"實際",data:BUDGET.map(function(b){return b.used;}),borderColor:"#fb7185",backgroundColor:"rgba(251,113,133,.22)",pointBackgroundColor:"#fb7185"}
        ]},
      options:{scales:{r:{angleLines:{color:"#2f2540"},grid:{color:"#2f2540"},pointLabels:{color:"#d9cee6",font:{size:11}},ticks:{color:"#7d7090",backdropColor:"transparent"}}},
        plugins:{legend:{position:"bottom",labels:{boxWidth:12}}}}
    });
  }

  // ===== SCREEN 3: 帳單提醒 (calendar signature) =====
  var BILLS = [
    {day:5, name:"房租", amt:15000, paid:true},
    {day:10, name:"手機費", amt:799, paid:true},
    {day:12, name:"水費", amt:340, paid:true},
    {day:15, name:"信用卡", amt:38620, paid:false},
    {day:18, name:"Netflix", amt:390, paid:false},
    {day:20, name:"電費", amt:1280, paid:false},
    {day:25, name:"保險費", amt:3200, paid:false},
    {day:28, name:"健身房", amt:1500, paid:false}
  ];
  function screen3(){
    var firstDow = 5, days = 31, today = 13;
    var billMap = {}; BILLS.forEach(function(b){billMap[b.day]=b;});
    var cells = "";
    var dows = ["日","一","二","三","四","五","六"];
    dows.forEach(function(d){cells+='<div class="dow">'+d+'</div>';});
    for(var i=0;i<firstDow;i++){cells+='<div class="cell mut"></div>';}
    for(var d=1;d<=days;d++){
      var b = billMap[d];
      var pill = b ? '<span class="bpill '+(b.paid?'paid':'due')+'">'+(b.paid?'✓ ':'')+b.name+'</span>' : "";
      cells += '<div class="cell'+(d===today?' today':'')+'"><span class="dn">'+d+'</span>'+pill+'</div>';
    }
    var upcoming = BILLS.filter(function(b){return !b.paid;}).map(function(b){
      var cls = b.day<=15 ? "due" : "";
      return '<div class="ev '+cls+'"><div class="d">08/'+(b.day<10?"0"+b.day:b.day)+' 到期</div>'+
        '<div class="ti">'+b.name+' · $'+fmt(b.amt)+'</div>'+
        '<div class="mini">'+(b.day<=15?"即將到期，建議儘早繳納":"週期帳單，已排程自動提醒")+'</div></div>';
    }).join("");
    var totalDue = 0; BILLS.forEach(function(b){if(!b.paid)totalDue+=b.amt;});
    return head("notifications_active","帳單提醒","建立週期性帳單排程，於到期前推播提醒避免逾期與滯納金") +
      '<div class="grid g4" style="margin-bottom:14px">'+
        kpi({i:"calendar_month",l:"本月帳單",v:"8 筆",s:"已繳 3 · 待繳 5"})+
        kpi({i:"pending_actions",l:"待繳總額",v:"$"+fmt(totalDue),s:"最近到期 09/15",c:"down"})+
        kpi({i:"schedule",l:"最近到期",v:"信用卡",s:"還有 2 天",c:"flat"})+
        kpi({i:"verified",l:"連續準時",v:"14 個月",s:"零逾期紀錄",c:"up"})+
      '</div>'+
      '<div class="grid g23">'+
        '<div class="panel"><h3><span class="material-symbols-outlined">event</span>2026 年 8 月 帳單日曆</h3>'+
          '<div class="scroll"><div class="cal">'+cells+'</div></div>'+
          '<div style="margin-top:12px;display:flex;gap:12px;flex-wrap:wrap">'+
            '<span class="chip"><span class="material-symbols-outlined" style="font-size:14px;color:var(--ok)">check_circle</span>已繳</span>'+
            '<span class="chip"><span class="material-symbols-outlined" style="font-size:14px;color:var(--bad)">error</span>待繳</span></div>'+
        '</div>'+
        '<div class="panel"><h3><span class="material-symbols-outlined">upcoming</span>待繳提醒</h3><div class="tl">'+upcoming+'</div></div>'+
      '</div>';
  }
  function init3(){ /* no chart on this screen */ }

  // ===== SCREEN 4: 財務分析 =====
  var STRUCT = [
    {nm:"居住／帳單", c:"#be185d", pct:39},
    {nm:"飲食", c:"#fb7185", pct:24},
    {nm:"購物", c:"#f9a8c4", pct:16},
    {nm:"娛樂", c:"#a78bfa", pct:9},
    {nm:"交通", c:"#60a5fa", pct:7},
    {nm:"其他", c:"#34d399", pct:5}
  ];
  function screen4(){
    var slist = STRUCT.map(function(s){
      return '<div class="stcat"><span class="sw" style="background:'+s.c+'"></span>'+
        '<span class="nm">'+s.nm+'</span><b>'+s.pct+'%</b></div>';
    }).join("");
    return head("insights","財務分析","檢視淨值走勢、收支趨勢與消費結構，找出可優化的支出") +
      '<div class="grid g4" style="margin-bottom:14px">'+
        kpi({i:"trending_up",l:"淨值成長 (年)",v:"+22.4%",s:"$1.64M → $2.01M",c:"up"})+
        kpi({i:"savings",l:"平均儲蓄率",v:"48.6%",s:"近 6 個月",c:"up"})+
        kpi({i:"payments",l:"月均支出",v:"$29,850",s:"低於去年 6.2%",c:"up"})+
        kpi({i:"category",l:"最大支出類",v:"居住",s:"占比 39%",c:"flat"})+
      '</div>'+
      '<div class="grid g23" style="margin-bottom:14px">'+
        '<div class="panel"><h3><span class="material-symbols-outlined">show_chart</span>淨值走勢（近 12 月）</h3>'+
          '<div class="chartbox"><canvas id="c4a"></canvas></div></div>'+
        '<div class="panel"><h3><span class="material-symbols-outlined">pie_chart</span>消費結構</h3>'+
          '<div class="chartbox sm"><canvas id="c4b"></canvas></div>'+
          '<div style="margin-top:8px">'+slist+'</div></div>'+
      '</div>'+
      '<div class="panel"><h3><span class="material-symbols-outlined">stacked_bar_chart</span>收入 vs 支出趨勢（近 6 月）</h3>'+
        '<div class="chartbox"><canvas id="c4c"></canvas></div></div>';
  }
  function init4(){
    new Chart(document.getElementById("c4a"),{
      type:"line",
      data:{labels:["9月","10月","11月","12月","1月","2月","3月","4月","5月","6月","7月","8月"],
        datasets:[{label:"淨值",data:[1642,1668,1701,1735,1760,1798,1832,1866,1901,1948,1985,2010],
          borderColor:"#fb7185",backgroundColor:"rgba(251,113,133,.14)",fill:true,tension:.35,pointRadius:2}]},
      options:{scales:{x:{grid:{color:"#241b33"}},y:{grid:{color:"#241b33"},ticks:{callback:function(v){return "$"+v+"K";}}}},
        plugins:{legend:{display:false}}}
    });
    new Chart(document.getElementById("c4b"),{
      type:"pie",
      data:{labels:["居住","飲食","購物","娛樂","交通","其他"],
        datasets:[{data:[39,24,16,9,7,5],backgroundColor:["#be185d","#fb7185","#f9a8c4","#a78bfa","#60a5fa","#34d399"],borderColor:"#181320",borderWidth:2}]},
      options:{plugins:{legend:{display:false}}}
    });
    new Chart(document.getElementById("c4c"),{
      type:"bar",
      data:{labels:["3月","4月","5月","6月","7月","8月"],
        datasets:[
          {label:"收入",data:[61300,60800,62100,61350,63000,61350],backgroundColor:"#34d399",borderRadius:5},
          {label:"支出",data:[31200,29800,30400,28900,31100,28640],backgroundColor:"#be185d",borderRadius:5}
        ]},
      options:{scales:{x:{grid:{color:"#241b33"}},y:{grid:{color:"#241b33"},ticks:{callback:function(v){return "$"+fmt(v);}}}},
        plugins:{legend:{position:"bottom",labels:{boxWidth:12}}}}
    });
  }

  // ===== SCREEN 5: 儲蓄目標 =====
  var GOALS = [
    {name:"緊急預備金", icon:"health_and_safety", c:"#34d399", target:300000, saved:255000, eta:"2026/11"},
    {name:"日本旅遊基金", icon:"flight", c:"#fb7185", target:80000, saved:52000, eta:"2027/03"},
    {name:"換購新車頭期", icon:"directions_car", c:"#a78bfa", target:400000, saved:118000, eta:"2028/06"},
    {name:"進修課程", icon:"school", c:"#60a5fa", target:60000, saved:54000, eta:"2026/09"}
  ];
  function screen5(){
    var cards = GOALS.map(function(g){
      var pct = Math.round(g.saved/g.target*100);
      var ring = "conic-gradient("+g.c+" "+(pct*3.6)+"deg,#2a2038 0)";
      return '<div class="goal"><div class="gh"><span class="ic" style="background:'+g.c+'22;color:'+g.c+'">'+
        '<span class="material-symbols-outlined">'+g.icon+'</span></span>'+g.name+'</div>'+
        '<div style="display:flex;align-items:center;gap:16px;margin-top:12px">'+
          '<div class="ring" style="background:'+ring+'"><div style="position:absolute;inset:8px;border-radius:50%;background:#1b1425;display:grid;place-items:center"><b style="color:'+g.c+';font-size:18px">'+pct+'%</b></div></div>'+
          '<div style="flex:1"><div class="amt">已存 <b>$'+fmt(g.saved)+'</b></div>'+
          '<div class="mini" style="margin-top:4px">目標 $'+fmt(g.target)+' · 預估達成 '+g.eta+'</div>'+
          '<div class="prog good" style="margin-top:8px"><i style="width:'+pct+'%;background:'+g.c+'"></i></div></div>'+
        '</div></div>';
    }).join("");
    var totalT=0,totalS=0; GOALS.forEach(function(g){totalT+=g.target;totalS+=g.saved;});
    return head("flag","儲蓄目標","設定目標存款金額並追蹤達成率，系統依每月結餘估算完成時間") +
      '<div class="grid g4" style="margin-bottom:14px">'+
        kpi({i:"flag",l:"進行中目標",v:"4 項",s:"1 項即將達成",c:"up"})+
        kpi({i:"savings",l:"累積儲蓄",v:"$"+fmt(totalS),s:"目標總額 $"+fmt(totalT)})+
        kpi({i:"percent",l:"整體達成率",v:Math.round(totalS/totalT*100)+"%",s:"穩定進度中",c:"up"})+
        kpi({i:"event_available",l:"最近達成",v:"進修課程",s:"預估 2026/09",c:"flat"})+
      '</div>'+
      '<div class="grid g2" style="margin-bottom:14px">'+cards+'</div>'+
      '<div class="panel"><h3><span class="material-symbols-outlined">savings</span>每月儲蓄累積走勢</h3>'+
        '<div class="chartbox"><canvas id="c5a"></canvas></div></div>';
  }
  function init5(){
    new Chart(document.getElementById("c5a"),{
      type:"line",
      data:{labels:["3月","4月","5月","6月","7月","8月"],
        datasets:[{label:"累積儲蓄",data:[298000,352000,398000,441000,478000,479000],
          borderColor:"#be185d",backgroundColor:"rgba(190,24,93,.16)",fill:true,tension:.3,pointRadius:3,pointBackgroundColor:"#fb7185"}]},
      options:{scales:{x:{grid:{color:"#241b33"}},y:{grid:{color:"#241b33"},ticks:{callback:function(v){return "$"+fmt(v);}}}},
        plugins:{legend:{display:false}}}
    });
  }

  // ---------------- controller ----------------
  var SCREENS = [
    {r:screen0, i:init0}, {r:screen1, i:init1}, {r:screen2, i:init2},
    {r:screen3, i:init3}, {r:screen4, i:init4}, {r:screen5, i:init5}
  ];
  function destroyCharts(){
    document.querySelectorAll("canvas").forEach(function(cv){
      var ex = (window.Chart && Chart.getChart) ? Chart.getChart(cv) : null;
      if(ex){ try{ ex.destroy(); }catch(e){} }
    });
  }
  function buildNav(){
    var nav = document.getElementById("nav");
    nav.innerHTML = MODULES.map(function(m,idx){
      return '<button data-i="'+idx+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="lbl">'+m.name+'</span></button>';
    }).join("");
    nav.querySelectorAll("button").forEach(function(b){
      b.addEventListener("click", function(){ show(+b.getAttribute("data-i")); });
    });
  }
  function show(i){
    i = Math.max(0, Math.min(i, SCREENS.length-1));
    destroyCharts();
    var nav = document.getElementById("nav");
    nav.querySelectorAll("button").forEach(function(b){
      b.classList.toggle("on", +b.getAttribute("data-i")===i);
    });
    var container = document.getElementById("view");
    container.innerHTML = '<div class="screen">'+ SCREENS[i].r() +
      '<div class="foot">Jvision <b>個人財務管理</b> Demo · 模組 '+(i+1)+' / 6 · 本頁為純前端展示，資料皆為模擬</div></div>';
    void container.offsetHeight;
    chartDefaults();
    try{ SCREENS[i].i(); }catch(e){ /* keep screen visible even if a chart fails */ }
  }
  buildNav();
  show(0);

  function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
  </script>
</body>
</html>
