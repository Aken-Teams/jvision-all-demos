<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>委外服務商治理與服務水準 · 經營治理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;

  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;

  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --accent-soft:#CCFBF1;
  --accent-soft2:#CCFBF1;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --th:#E6FFFA;
  --hov:#ECFDF5;
  --track:#D7E9E7;
  --sidebar:#134E4A;
  --sidebar2:#134E4A;
  --side-edge:#2DD4BF;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#0369A1;
  --r:8px;
  --glow:transparent;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Crimson Pro",serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit}
button,[role="button"],a{cursor:pointer}
h1,h2,h3,h4,.brand-txt,.nav button,.tag,.chip{
  font-family:"Cinzel","Cormorant Garamond",serif;
}
h1,h2,h3,h4{margin:0;color:var(--ink);line-height:1.2}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
::selection{background:var(--color-secondary);color:#0F172A}

.app{display:flex;min-height:100vh}
.sidebar{
  position:sticky;
  top:0;
  width:264px;
  height:100vh;
  flex:none;
  display:flex;
  flex-direction:column;
  min-width:0;
  padding:24px 18px;
  color:#F0FDFA;
  background:var(--sidebar);
  border-right:4px solid var(--color-secondary);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  padding:0 6px 25px;
  border-bottom:1px solid rgba(94,234,212,.35);
}
.brand-logo{
  width:42px;
  height:42px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#042F2E;
  background:var(--color-secondary);
  border:2px solid #99F6E4;
  border-radius:6px;
}
.brand-logo .material-symbols-outlined{font-size:24px}
.brand-txt{min-width:0}
.brand-txt b{
  display:block;
  color:#FFFFFF;
  font-size:15px;
  font-weight:600;
  letter-spacing:.035em;
}
.brand-txt span{
  display:block;
  margin-top:3px;
  overflow:hidden;
  color:#99F6E4;
  font-family:"Crimson Pro",serif;
  font-size:10px;
  font-weight:600;
  letter-spacing:.13em;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.nav{
  display:flex;
  flex-direction:column;
  gap:6px;
  min-width:0;
  margin-top:22px;
}
.nav button{
  position:relative;
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  min-height:46px;
  min-width:0;
  padding:10px 12px;
  color:#CCFBF1;
  background:transparent;
  border:1px solid transparent;
  border-radius:6px;
  font-size:13px;
  font-weight:600;
  letter-spacing:.02em;
  text-align:left;
  white-space:nowrap;
  transition:background-color 180ms ease,color 180ms ease,border-color 180ms ease;
}
.nav button .material-symbols-outlined{flex:none;font-size:20px}
.nav button:hover{color:#FFFFFF;background:#115E59;border-color:#2DD4BF}
.nav button.on{
  color:#042F2E;
  background:var(--color-secondary);
  border-color:#99F6E4;
}
.nav button.on::before{
  content:"";
  position:absolute;
  left:-19px;
  top:8px;
  bottom:8px;
  width:4px;
  background:var(--color-accent);
}
.nav .idx{
  margin-left:auto;
  color:inherit;
  font-family:"Crimson Pro",monospace;
  font-size:11px;
  font-variant-numeric:tabular-nums;
  opacity:.75;
}
.side-foot{
  margin-top:auto;
  padding:16px 8px 2px;
  color:#CCFBF1;
  border-top:1px solid rgba(94,234,212,.35);
  font-size:12px;
  line-height:1.7;
  font-variant-numeric:tabular-nums;
}
.side-foot b{color:#FFFFFF}

.main{flex:1;min-width:0;padding:28px clamp(18px,3vw,42px) 64px}
.topbar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:18px;
  margin-bottom:22px;
  padding-bottom:18px;
  border-bottom:2px solid var(--color-primary);
}
.topbar h1{
  display:flex;
  align-items:center;
  gap:10px;
  color:#134E4A;
  font-size:clamp(22px,2.2vw,30px);
  font-weight:600;
  letter-spacing:.015em;
}
.topbar h1 .material-symbols-outlined{
  display:flex;
  width:38px;
  height:38px;
  align-items:center;
  justify-content:center;
  color:#042F2E;
  background:var(--color-secondary);
  border-radius:4px;
  font-size:23px;
}
.topbar .sub{margin-top:6px;color:var(--muted);font-size:14px}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:36px;
  padding:6px 11px;
  color:#334155;
  background:#FFFFFF;
  border:1px solid #5EEAD4;
  border-radius:999px;
  font-family:"Crimson Pro",serif;
  font-size:12px;
  font-weight:600;
}
.chip .dot{
  width:9px;
  height:9px;
  border:2px solid #14532D;
  border-radius:50%;
  background:#22C55E;
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.avatar{
  width:38px;
  height:38px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#042F2E;
  background:var(--color-secondary);
  border:2px solid var(--color-primary);
  border-radius:50%;
  font-family:"Cinzel",serif;
  font-size:13px;
  font-weight:600;
}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--r);
}
.card,.sec{min-width:0;padding:18px}
.card,.sec,.kpi,.stat,.tile{
  animation:card-in 400ms cubic-bezier(.2,.8,.2,1) both;
}
.grid>*:nth-child(2){animation-delay:60ms}
.grid>*:nth-child(3){animation-delay:120ms}
.grid>*:nth-child(4){animation-delay:180ms}
@keyframes card-in{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.card:hover,.sec:hover,.kpi:hover,.stat:hover,.tile:hover{
  border-color:var(--color-primary);
  background:#FCFFFE;
}
.sec{margin-bottom:16px}
.sec>h3,.card-h h3{
  display:flex;
  align-items:center;
  gap:8px;
  color:#134E4A;
  font-size:15px;
  font-weight:600;
}
.sec>h3{margin-bottom:14px}
.sec>h3 .material-symbols-outlined,.card-h h3 .material-symbols-outlined{
  color:var(--accent);
  font-size:19px;
}
.sec>p{margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.75}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0;font-size:14px}
.dl dt{color:var(--muted);font-size:13px;font-weight:600}
.dl dd{margin:0;line-height:1.75}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:14px;
  flex-wrap:wrap;
}
.card-h .hint{color:var(--muted);font-size:12px}

.kpi,.stat{
  position:relative;
  min-width:0;
  overflow:hidden;
  padding:16px 18px;
  border-top:4px solid var(--color-primary);
}
.kpi::after{display:none}
.kpi .ico{
  position:relative;
  z-index:1;
  display:flex;
  width:38px;
  height:38px;
  align-items:center;
  justify-content:center;
  color:#115E59;
  background:#CCFBF1;
  border:1px solid #5EEAD4;
  border-radius:4px;
}
.kpi .ico .material-symbols-outlined{font-size:21px}
.kpi .lbl,.stat .lbl{
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:11px;
  color:var(--muted);
  font-size:13px;
  font-weight:600;
}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{color:var(--accent);font-size:16px}
.kpi .val,.stat .val,.tile .tv{
  margin-top:3px;
  color:#0F3D3A;
  font-family:"Crimson Pro",monospace;
  font-size:28px;
  font-weight:600;
  letter-spacing:-.02em;
  line-height:1.15;
  font-variant-numeric:tabular-nums lining-nums;
}
.kpi .val small,.stat .val small{margin-left:4px;color:var(--muted);font-size:13px;font-weight:600}
.kpi .delta,.stat .d{
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin-top:6px;
  font-size:12px;
  font-weight:600;
}
.delta.up,.d.up{color:#166534}
.delta.down,.d.down{color:#B91C1C}
.delta.flat,.d.flat{color:#475569}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:15px}

.card.pad0>div[style*="overflow-x"],.card.p0>div[style*="overflow-x"]{border-top:1px solid var(--line)}
table{
  width:100%;
  border-collapse:collapse;
  color:#1E3A3A;
  font-size:14px;
  font-variant-numeric:tabular-nums lining-nums;
}
th{
  padding:12px 14px;
  color:#334155;
  background:var(--th);
  border-bottom:2px solid var(--color-primary);
  font-family:"Cinzel","Crimson Pro",serif;
  font-size:11px;
  font-weight:600;
  letter-spacing:.035em;
  text-align:left;
  white-space:nowrap;
}
td{
  padding:12px 14px;
  border-bottom:1px solid #BEECE6;
  text-align:left;
  white-space:nowrap;
}
tr:last-child td{border-bottom:0}
tbody tr{transition:background-color 170ms ease}
tbody tr:hover{background:var(--hov)}
td b{color:#0F3D3A}
.mono{
  font-family:"Crimson Pro",ui-monospace,monospace;
  font-weight:600;
  letter-spacing:.02em;
  font-variant-numeric:tabular-nums;
}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  min-height:24px;
  padding:3px 9px;
  border:1px solid currentColor;
  border-radius:4px;
  font-family:"Crimson Pro",serif;
  font-size:12px;
  font-weight:600;
  line-height:1.2;
  white-space:nowrap;
}
.t-ok{color:#166534;background:#DCFCE7}
.t-warn{color:#92400E;background:#FEF3C7}
.t-bad{color:#B91C1C;background:#FEE2E2}
.t-info{color:#075985;background:#E0F2FE}
.t-gray{color:#475569;background:#F1F5F9}
.t-acc,.t-pink{color:#115E59;background:#CCFBF1}

.bar{height:8px;min-width:56px;overflow:hidden;background:var(--track);border:1px solid #B7D8D4;border-radius:2px}
.bar>i{display:block;height:100%;background:var(--color-primary);border-radius:0}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{
  width:40px;
  flex:none;
  color:var(--muted);
  font-family:"Crimson Pro",monospace;
  font-size:12px;
  font-weight:600;
  text-align:right;
  font-variant-numeric:tabular-nums;
}

.tl{position:relative;padding-left:27px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item,.tl-i{position:relative;padding:0 0 18px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{
  position:absolute;
  left:-26px;
  top:3px;
  width:15px;
  height:15px;
  background:#FFFFFF;
  border:4px solid var(--accent);
  border-radius:50%;
}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font-family:"Crimson Pro",monospace;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.tl-item b,.tl-i b{display:block;margin:2px 0;color:#134E4A;font-family:"Cinzel","Crimson Pro",serif;font-size:13px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:12px}

.chk{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px dashed #8EDDD3;font-size:13px}
.chk:last-child{border-bottom:0}
.chk .material-symbols-outlined{font-size:20px}
.chk .ok{color:var(--ok)}
.chk .wait{color:var(--muted)}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--muted);font-size:12px}
.note{margin-top:14px;padding-top:13px;color:var(--muted);border-top:1px dashed #8EDDD3;font-size:12px;line-height:1.7}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.board>*{min-width:0}
.col{
  display:flex;
  flex-direction:column;
  gap:9px;
  padding:12px;
  background:var(--th);
  border:1px solid var(--line);
  border-radius:var(--r);
}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 7px;color:#134E4A;font-family:"Cinzel","Crimson Pro",serif;font-size:13px;font-weight:600}
.col-h .cnt{padding:2px 9px;color:var(--muted);background:#FFFFFF;border:1px solid var(--line);border-radius:999px;font-family:"Crimson Pro",monospace;font-size:12px}
.pcard{padding:12px;background:#FFFFFF;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:4px}
.pcard b{color:#134E4A;font-family:"Cinzel","Crimson Pro",serif;font-size:13px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--muted);font-size:12px}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:8px;color:var(--ink);font-size:12px}
.mini-av,.av{display:inline-flex;flex:none;align-items:center;justify-content:center;color:#115E59;background:#CCFBF1;border:1px solid #5EEAD4;border-radius:50%;font-weight:600}
.mini-av{width:20px;height:20px;font-size:10px}
.av{width:28px;height:28px;font-size:12px}
.who{display:inline-flex;align-items:center;gap:6px}

.lane{display:flex;flex-direction:column;gap:11px}
.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:13px 14px;background:#FFFFFF;border:1px solid var(--line);border-radius:6px}
.lane-row .num{display:flex;width:32px;height:32px;flex:none;align-items:center;justify-content:center;color:#042F2E;background:var(--color-secondary);border-radius:4px;font-family:"Crimson Pro",monospace;font-size:14px;font-weight:600}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{color:#134E4A;font-family:"Cinzel","Crimson Pro",serif;font-size:14px}
.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:12px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{z-index:1;display:flex;width:24px;height:24px;align-items:center;justify-content:center;color:#64748B;background:#FFFFFF;border:2px solid #94A3B8;border-radius:50%;font-family:"Crimson Pro",monospace;font-size:12px}
.steps .ln{width:20px;height:2px;background:#94A3B8}
.steps .s.done{color:#FFFFFF;background:var(--accent);border-color:var(--accent)}
.steps .s.cur{color:#115E59;border-color:var(--accent);animation:pulse 1.6s ease-in-out infinite}
.steps .ln.done{background:var(--accent)}

.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 4px;border-bottom:1px dashed #8EDDD3}
.rep-row:last-child{border-bottom:0}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;color:#134E4A;font-family:"Cinzel","Crimson Pro",serif;font-size:13px}
.rep-row .sku span{color:var(--muted);font-size:12px}
.gauge{width:110px;flex:none}
.gauge .track{position:relative;height:8px;overflow:hidden;background:var(--track);border:1px solid #B7D8D4;border-radius:2px}
.gauge .track i{display:block;height:100%;background:var(--accent)}
.gauge small{display:block;margin-top:3px;color:var(--muted);font-family:"Crimson Pro",monospace;font-size:11px;text-align:right;font-variant-numeric:tabular-nums}

.band{position:relative;height:27px;min-width:150px;background:var(--track);border:1px solid #B7D8D4;border-radius:3px}
.band .rng{position:absolute;top:0;bottom:0;background:#99F6E4;border-radius:2px}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:#475569}
.band .me{position:absolute;top:3px;width:12px;height:19px;background:var(--accent);border:2px solid #115E59;border-radius:2px}

.tile{
  display:flex;
  flex-direction:column;
  gap:8px;
  min-width:0;
  padding:17px 18px;
  border-top:4px solid var(--color-primary);
}
.tile .ti{display:flex;width:38px;height:38px;align-items:center;justify-content:center;color:#115E59;background:#CCFBF1;border:1px solid #5EEAD4;border-radius:4px}
.tile .ti .material-symbols-outlined{font-size:21px}
.tile b{color:#134E4A;font-family:"Cinzel","Crimson Pro",serif;font-size:14px;font-weight:600}
.tile p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
.tile .tv{font-size:25px}

.apexcharts-text,.apexcharts-legend-text{font-family:"Crimson Pro",serif!important}
.apexcharts-tooltip{color:#134E4A!important;background:#FFFFFF!important;border:1px solid #5EEAD4!important;box-shadow:none!important}
.apexcharts-tooltip-title{background:#E6FFFA!important;border-bottom:1px solid #5EEAD4!important}

@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{position:static;width:100%;height:auto;padding:12px 14px;border-right:0;border-bottom:4px solid var(--color-secondary)}
  .brand{padding:0 4px 12px;border-bottom:0}
  .brand-logo{width:38px;height:38px}
  .side-foot{display:none}
  .nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:0}
  .nav button{justify-content:center;min-height:44px;padding:9px 8px}
  .nav button.on::before{left:8px;right:8px;top:auto;bottom:-4px;width:auto;height:4px}
  .nav .idx{display:none}
  .main{padding:20px 16px 48px}
  .topbar{align-items:flex-start}
}
@media(max-width:820px){
  .g2,.g3,.g23,.g32{grid-template-columns:1fr}
}
@media(max-width:560px){
  .g4,.board{grid-template-columns:1fr}

/* ── 導覽 ── */
function buildNav(){var n=document.getElementById("nav");
 n.innerHTML=MODULES.map(function(m,i){return '<button type="button" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'}).join("");
 Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})})}
function show(i){killCharts();var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i)});
 RENDER[i](document.getElementById("screen"))}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?Math.min(+m[1],MODULES.length-1):0);try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
