<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>IQC 進料品質管控台 · QMS 品質管理系統</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --pur:#9333ea; --pur-2:#c084fc; --pur-d:#6b21a8; --pur-soft:#f5edff;
  --ink:#241832; --muted:#6d5f7d; --line:#eadcf6;
  --bg:#f6f2fb; --card:#ffffff;
  --green:#16a34a; --amber:#d97706; --red:#dc2626; --blue:#2563eb; --grey:#9a8bab;
  --shadow:0 1px 2px rgba(147,51,234,.06),0 10px 26px rgba(147,51,234,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;vertical-align:middle}
/* top nav */
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 22px}
.tbrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-width:0}
.brand{display:flex;gap:11px;align-items:center;flex:none}
.brand .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--pur),var(--pur-2));display:flex;align-items:center;justify-content:center;color:#fff;flex:none;box-shadow:0 6px 16px rgba(147,51,234,.3)}
.brand .logo .material-symbols-outlined{font-size:23px}
.brand b{font-size:15px;font-weight:900;letter-spacing:.3px;display:block;line-height:1.2}
.brand span{font-size:11px;color:var(--muted);font-weight:500}
.tbspacer{flex:1;min-width:0}
.tag{display:inline-flex;gap:6px;align-items:center;background:var(--pur-soft);color:var(--pur-d);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700;flex:none}
.tag .material-symbols-outlined{font-size:16px}
.navrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;min-width:0}
.nav{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--line);background:#fff;border-radius:11px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:var(--muted);flex:none;white-space:nowrap;min-width:0;transition:.16s}
.nav .material-symbols-outlined{font-size:19px;flex:none}
.nav:hover{background:var(--pur-soft);color:var(--pur-d);border-color:var(--pur-2)}
.nav.on{background:linear-gradient(135deg,var(--pur),var(--pur-d));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(147,51,234,.28)}
.nav b{font-weight:700}
.nav i{font-style:normal;font-size:10.5px;font-weight:700;background:rgba(147,51,234,.12);color:var(--pur-d);border-radius:999px;padding:1px 7px}
.nav.on i{background:rgba(255,255,255,.24);color:#fff}
/* main */
.main{padding:22px 26px 48px;max-width:100%;min-width:0}
.scrhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.scrhead h1{font-size:20px;font-weight:900;margin:0 0 3px;letter-spacing:.4px}
.scrhead .sub{font-size:12.5px;color:var(--muted)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:11.5px;font-weight:700;color:var(--muted)}
.pill .material-symbols-outlined{font-size:15px;color:var(--pur)}
.pill b{color:var(--ink)}
/* grid */
.grid{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:1.5fr 1fr}
.g32{grid-template-columns:1fr 1.5fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 2px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--pur)}
.card .cap{font-size:11.5px;color:var(--muted);margin-bottom:12px}
/* kpi */
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .lbl .material-symbols-outlined{font-size:17px;color:var(--pur)}
.kpi .val{font-size:26px;font-weight:900;letter-spacing:.3px;margin-top:6px;line-height:1}
.kpi .val small{font-size:12px;font-weight:700;color:var(--muted)}
.kpi .dv{font-size:11.5px;font-weight:700;margin-top:8px;display:inline-flex;align-items:center;gap:3px}
.dv.up{color:var(--green)} .dv.dn{color:var(--red)} .dv.fl{color:var(--muted)}
.dv .material-symbols-outlined{font-size:15px}
.bar{height:7px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:10px}
.bar>span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--pur),var(--pur-2))}
/* table */
.tscroll{overflow-x:auto;min-width:0}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:0}
th{text-align:left;font-size:10.5px;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.4px}
td{padding:9px 10px;border-bottom:1px solid #f4eefb;vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--pur-soft)}
.mono{font-variant-numeric:tabular-nums;font-weight:700}
.st{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px}
.st.ok{background:#e7f7ee;color:var(--green)}
.st.warn{background:#fdf1e0;color:var(--amber)}
.st.bad{background:#fce8e8;color:var(--red)}
.st.info{background:#e8effd;color:var(--blue)}
.st.pur{background:var(--pur-soft);color:var(--pur-d)}
.st .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.chartbox{position:relative;height:230px;min-width:0}
.chartbox.sm{height:190px}
/* kanban */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0}
.col{background:#faf6ff;border:1px solid var(--line);border-radius:14px;padding:11px;min-width:0}
.colh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.colh b{font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:6px}
.colh b .material-symbols-outlined{font-size:17px}
.colh .cnt{font-size:11px;font-weight:800;background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--muted)}
.tk{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:9px;box-shadow:0 1px 2px rgba(147,51,234,.05)}
.tk:last-child{margin-bottom:0}
.tk .lot{font-size:12.5px;font-weight:800}
.tk .met{font-size:11px;color:var(--muted);margin-top:3px}
.tk .foot{display:flex;align-items:center;justify-content:space-between;margin-top:9px;gap:6px}
.tk .who{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:4px}
.tk .who .av{width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,var(--pur),var(--pur-2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;flex:none}
.edge{border-left:3px solid var(--pur)}
.edge.g{border-left-color:var(--green)} .edge.a{border-left-color:var(--amber)} .edge.r{border-left-color:var(--red)}
/* plan cards */
.plan{border:1px solid var(--line);border-radius:13px;padding:13px 14px;background:#fff}
.plan h4{margin:0 0 6px;font-size:13px;font-weight:800;display:flex;align-items:center;gap:7px}
.plan .row{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:4px 0;border-bottom:1px dashed #f0e6fb}
.plan .row:last-child{border-bottom:none}
.plan .row span{color:var(--muted);flex:none}
.plan .row b{font-weight:700;text-align:right;min-width:0}
/* timeline */
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tlitem{position:relative;padding:0 0 16px}
.tlitem:last-child{padding-bottom:0}
.tlitem .dot{position:absolute;left:-22px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--pur);box-shadow:0 0 0 3px var(--pur-soft)}
.tlitem.done .dot{background:var(--green);border-color:var(--green)}
.tlitem.warn .dot{background:var(--amber);border-color:var(--amber)}
.tlitem .tt{font-size:12.5px;font-weight:800}
.tlitem .tm{font-size:11px;color:var(--muted);margin:2px 0 4px}
.tlitem .td{font-size:12px;color:var(--muted)}
/* matrix */
.mtx td,.mtx th{text-align:center;white-space:nowrap}
.mtx td:first-child,.mtx th:first-child{text-align:left}
.mcell{display:inline-block;min-width:34px;border-radius:7px;padding:3px 6px;font-size:11px;font-weight:800}
/* def bar list */
.deflist .dl{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.deflist .dl:last-child{margin-bottom:0}
.deflist .dn{font-size:12px;font-weight:700;width:78px;flex:none;min-width:0}
.deflist .db{flex:1;height:9px;border-radius:6px;background:var(--line);overflow:hidden;min-width:0}
.deflist .db>span{display:block;height:100%;border-radius:6px}
.deflist .dv2{font-size:11.5px;font-weight:800;width:38px;text-align:right;flex:none}
.note{font-size:11.5px;color:var(--muted);background:var(--pur-soft);border:1px solid var(--line);border-radius:11px;padding:10px 12px;display:flex;gap:8px;align-items:flex-start}
.note .material-symbols-outlined{font-size:17px;color:var(--pur);flex:none}
.foot{margin-top:26px;text-align:center;font-size:11px;color:var(--grey)}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .board{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){
  .main{padding:16px 14px 40px}
  .topbar{padding:9px 14px}
  .nav .txt{display:none}
  .nav{padding:9px 11px}
  .board{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="tbrow">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">verified</span></div>
      <div><b>IQC 進料品質管控台</b><span>QMS 品質管理系統 · 純 UI 展示</span></div>
    </div>
    <div class="tbspacer"></div>
    <span class="tag"><span class="material-symbols-outlined">calendar_today</span>2026-08-14 · 早班</span>
    <span class="tag"><span class="material-symbols-outlined">badge</span>品保部 · 陳映君</span>
  </div>
  <nav class="navrow" id="nav"></nav>
</header>
<main class="main">
  <div class="scrhead">
    <div><h1 id="scrTitle">—</h1><div class="sub" id="scrSub">—</div></div>
    <div class="pills" id="scrPills"></div>
  </div>
  <div id="screen"></div>
  <div class="foot">本頁為純 UI 系統展示（無後端），畫面與資料皆為擬真示範。</div>
</main>
<script>
var MODS=[
  {icon:"qr_code_scanner",name:"到貨收料",desc:"供應商到貨掃碼與待驗批建立"},
  {icon:"checklist",name:"檢驗計畫",desc:"檢驗項目、規格與抽樣標準設定"},
  {icon:"science",name:"抽樣檢驗",desc:"AQL 抽樣、量測登錄與缺陷分類"},
  {icon:"gavel",name:"判定放行",desc:"允收/退貨/特採判定與看板追蹤"},
  {icon:"factory",name:"供應商評鑑",desc:"來料合格率與供應商績效評分"},
  {icon:"inventory_2",name:"批次追溯",desc:"批號履歷、檢驗紀錄與稽核歸檔"}
];
var PILLS=[
  [["local_shipping","今日到貨","18 批"],["hourglass_top","待驗","7 批"],["timer","平均等驗","42 分"]],
  [["rule","作用中計畫","64 項"],["tune","AQL 一般II","主用"],["update","本月改版","5 版"]],
  [["biotech","今日抽驗","23 批"],["report","缺陷通報","11 件"],["insights","製程 Cpk","1.42"]],
  [["dashboard","待判定","5 批"],["done_all","今日放行","14 批"],["block","退貨","2 批"]],
  [["groups","合格供應商","38 家"],["star","A 級","12 家"],["trending_up","來料合格率","96.3%"]],
  [["history","可追溯批","2,140"],["fact_check","稽核紀錄","完整"],["schedule","歸檔時效","即時"]]
];
var charts=[];
function pillHTML(i){var a=PILLS[i]||[],h="";for(var k=0;k<a.length;k++){h+='<span class="pill"><span class="material-symbols-outlined">'+a[k][0]+'</span>'+a[k][1]+' <b>'+a[k][2]+'</b></span>';}return h;}
function mkChart(id,cfg){var el=document.getElementById(id);if(!el)return;charts.push(new Chart(el,cfg));}
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function kpi(icon,label,val,unit,dir,note,barpct){
  var di=dir==="up"?"arrow_upward":dir==="dn"?"arrow_downward":"remove";
  return '<div class="card kpi"><div class="lbl"><span class="material-symbols-outlined">'+icon+'</span>'+label+'</div>'+
    '<div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div>'+
    '<div class="dv '+dir+'"><span class="material-symbols-outlined">'+di+'</span>'+note+'</div>'+
    '<div class="bar"><span style="width:'+barpct+'%"></span></div></div>';
}

/* ---------- screens ---------- */
function s0(){
  var rows=[
    ["IN-260814-01","晶鑫O子","CAP-0603-104","貼片電容","20,000","早08:12","待抽樣","warn","一般II"],
    ["IN-260814-02","豐O精密","SCR-M3-08","不鏽鋼螺絲","12,500","早08:26","檢驗中","info","加嚴II"],
    ["IN-260814-03","O盛塑膠","HSG-A21","外殼上蓋","3,200","早08:40","待抽樣","warn","一般II"],
    ["IN-260814-04","O暘線材","WIRE-AWG24","鍍錫銅線","8,000","早08:55","檢驗中","info","一般II"],
    ["IN-260814-05","O昇金屬","PLT-Zn-15","鍍鋅鋼板","640","早09:10","待抽樣","warn","一般II"],
    ["IN-260814-06","晶鑫O子","RES-0402-10K","貼片電阻","50,000","早09:22","檢驗中","info","放寬III"],
    ["IN-260814-07","三合橡膠","ORING-14","O 型環","6,400","早09:38","待抽樣","warn","加嚴II"]
  ];
  var tr="";for(var i=0;i<rows.length;i++){var r=rows[i];
    tr+='<tr><td class="mono">'+r[0]+'</td><td>'+r[1]+'</td><td class="mono">'+r[2]+'</td><td>'+r[3]+'</td><td class="mono">'+r[4]+'</td><td class="mono">'+r[5]+'</td><td><span class="st '+r[7]+'"><span class="dot"></span>'+r[6]+'</span></td><td><span class="st pur">'+r[8]+'</span></td></tr>';}
  return ''+
  '<div class="grid g4" style="margin-bottom:14px">'+
    kpi("local_shipping","今日到貨批","18","批","up","較昨 +3",84)+
    kpi("hourglass_top","待驗批","7","批","dn","已清 11 批",39)+
    kpi("timer","平均等驗時間","42","分","up","目標 ≤60 分",70)+
    kpi("qr_code_2","掃碼建批率","100","%","fl","全數掃碼入列",100)+
  '</div>'+
  '<div class="grid g23">'+
    '<div class="card"><h3><span class="material-symbols-outlined">inbox</span>今日到貨待驗批</h3><div class="cap">掃碼收料後自動依料號帶出檢驗計畫，排入抽樣佇列</div><div class="tscroll"><table><thead><tr><th>收料單號</th><th>供應商</th><th>料號</th><th>品名</th><th>數量</th><th>到貨</th><th>狀態</th><th>抽樣</th></tr></thead><tbody>'+tr+'</tbody></table></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">schedule</span>近 8 小時到貨量</h3><div class="cap">單位：批 / 每小時</div><div class="chartbox sm"><canvas id="c0a"></canvas></div>'+
      '<div class="note" style="margin-top:12px"><span class="material-symbols-outlined">bolt</span>08:00–09:00 為到貨尖峰，建議加派收料人力並優先抽樣加嚴批。</div></div>'+
  '</div>';
}
function s1(){
  var plans=[
    ["CAP-0603-104","貼片電容","一般檢驗 II 級","AQL 0.65","容量 ±10% · 耐壓 50V · 外觀無破損","晶鑫O子"],
    ["SCR-M3-08","不鏽鋼螺絲","加嚴檢驗 II 級","AQL 0.40","牙徑 M3 · 硬度 HRC28~34 · 鹽霧 48h","豐O精密"],
    ["HSG-A21","外殼上蓋","一般檢驗 II 級","AQL 1.0","尺寸 120±0.2 · 色差 ΔE<1.5 · 無縮水","O盛塑膠"]
  ];
  var pc="";for(var i=0;i<plans.length;i++){var p=plans[i];
    pc+='<div class="plan"><h4><span class="material-symbols-outlined" style="color:var(--pur);font-size:18px">description</span>'+p[0]+' · '+p[1]+'</h4>'+
      '<div class="row"><span>檢驗水準</span><b>'+p[2]+'</b></div>'+
      '<div class="row"><span>允收品質</span><b>'+p[3]+'</b></div>'+
      '<div class="row"><span>關鍵規格</span><b>'+p[4]+'</b></div>'+
      '<div class="row"><span>適用供應商</span><b>'+p[5]+'</b></div></div>';}
  var lots=["≤ 90","91–150","151–280","281–500","501–1200","1201–3200"];
  var codes=["E","F","G","H","J","K"];
  var samp=["13","20","32","50","80","125"];
  var ac06=["0","0","0","1","1","2"],ac10=["0","0","1","2","3","5"];
  var mr="";
  for(var j=0;j<lots.length;j++){
    mr+='<tr><td class="mono">'+lots[j]+'</td><td><span class="mcell" style="background:var(--pur-soft);color:var(--pur-d)">'+codes[j]+'</span></td><td class="mono">'+samp[j]+'</td>'+
      '<td><span class="mcell" style="background:#e7f7ee;color:var(--green)">'+ac06[j]+'</span></td>'+
      '<td><span class="mcell" style="background:#fdf1e0;color:var(--amber)">'+ac10[j]+'</span></td></tr>';
  }
  return ''+
  '<div class="grid g3" style="margin-bottom:14px">'+
    kpi("checklist","作用中檢驗計畫","64","項","fl","涵蓋 5 大料類",100)+
    kpi("tune","預設抽樣水準","II","級","fl","一般檢驗 · 可切換",100)+
    kpi("published_with_changes","本月規格改版","5","版","up","皆已核准生效",100)+
  '</div>'+

function buildNav(){

  }

  nav.innerHTML=h;
  var btns=nav.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){
    btns[k].addEventListener("click",function(){show(+this.getAttribute("data-i"));try{window.scrollTo(0,0);}catch(e){}});
  }
}
function show(i){
  killCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++)btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);
  document.getElementById("scrTitle").textContent=MODS[i].name;
  document.getElementById("scrSub").textContent=MODS[i].desc;
  document.getElementById("scrPills").innerHTML=pillHTML(i);
  var box=document.getElementById("screen");
  box.innerHTML=RENDER[i]();
  void box.offsetHeight;
  if(CHARTS[i])CHARTS[i]();
}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
