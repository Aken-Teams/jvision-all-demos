<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IQC 進料品質管控台 · QMS 品質管理系統</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --green:#15803D;
  --amber:#B45309;
  --red:#DC2626;
  --grey:#64748B;
  --primary-soft:#EFF6FF;
  --accent-soft:#FFF7ED;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 22px rgba(15,23,42,.05);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{
  min-width:320px;
  background:var(--color-background);
  color:var(--color-foreground);
  font-family:"Fira Sans",sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,a{font:inherit}
button,[role=button],a{cursor:pointer}
button:focus-visible,a:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-variation-settings:"FILL" 0,"wght" 500,"GRAD" 0,"opsz" 24;
  vertical-align:middle;
}
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  padding:12px clamp(14px,2.4vw,34px);
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 rgba(15,23,42,.02);
  backdrop-filter:blur(12px);
}
.tbrow{display:flex;align-items:center;gap:12px;min-width:0}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{
  display:grid;
  place-items:center;
  width:40px;
  height:40px;
  flex:none;
  color:#fff;
  background:var(--color-primary);
  border-radius:6px;
  box-shadow:4px 4px 0 #BFDBFE;
}
.logo .material-symbols-outlined{font-size:23px}
.brand b{
  display:block;
  font-size:15px;
  font-weight:700;
  letter-spacing:.02em;
  line-height:1.25;
}
.brand span{display:block;color:var(--muted);font-size:11px}
.tbspacer{flex:1}
.tag,.pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:34px;
  padding:6px 11px;
  border:1px solid var(--line);
  border-radius:4px;
  background:#fff;
  color:var(--muted);
  font-size:11.5px;
  font-weight:500;
  white-space:nowrap;
}
.tag .material-symbols-outlined,.pill .material-symbols-outlined{
  color:var(--blue);
  font-size:16px;
}
.navrow{
  display:flex;
  gap:5px;
  margin-top:12px;
  overflow-x:auto;
  scrollbar-width:thin;
}
.nav{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:40px;
  padding:8px 12px;
  flex:none;
  border:1px solid transparent;
  border-radius:4px;
  background:transparent;
  color:var(--muted);
  font-size:12.5px;
  font-weight:500;
  transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .2s ease;
}
.nav:hover{color:var(--blue);background:var(--primary-soft);border-color:#BFDBFE}
.nav.on{
  color:#fff;
  background:var(--blue);
  border-color:var(--blue);
  box-shadow:0 2px 8px rgba(37,99,235,.2);
}
.nav .material-symbols-outlined{font-size:18px}
.nav i{
  padding:1px 6px;
  border-radius:3px;
  background:var(--color-muted);
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-style:normal;
}
.nav.on i{background:rgba(255,255,255,.2);color:#fff}
.main{width:100%;padding:24px clamp(14px,2.4vw,34px) 46px}
.scrhead{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:18px;
  margin-bottom:18px;
  padding-bottom:14px;
  border-bottom:2px solid var(--ink);
}
.scrhead h1{
  margin:0 0 3px;
  font-size:clamp(20px,2.2vw,27px);
  font-weight:700;
  letter-spacing:-.02em;
}
.scrhead .sub{color:var(--muted);font-size:12.5px}
.pills{display:flex;justify-content:flex-end;gap:7px;flex-wrap:wrap}
.pill b{color:var(--ink);font-family:"Fira Code",monospace}
.grid{display:grid;gap:12px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.g32{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
.card{
  min-width:0;
  padding:15px 16px;
  border:1px solid var(--line);
  border-radius:6px;
  background:var(--color-card);
  box-shadow:var(--shadow);
  transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;
  animation:reveal .36s ease both;
}
.card:hover{border-color:#CBD5E1;box-shadow:0 3px 12px rgba(15,23,42,.08)}
.card h3{
  display:flex;
  align-items:center;
  gap:7px;
  margin:0 0 2px;
  font-size:13.5px;
  font-weight:700;
}
.card h3 .material-symbols-outlined{color:var(--blue);font-size:18px}
.card .cap{margin-bottom:12px;color:var(--muted);font-size:11.5px}
.kpi{position:relative;overflow:hidden}
.kpi:before{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:3px;
  background:var(--blue);
  content:"";
}
.kpi .lbl{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--muted);
  font-size:11.5px;
  font-weight:500;
}
.kpi .lbl .material-symbols-outlined{color:var(--blue);font-size:17px}
.kpi .val{
  margin-top:7px;
  color:var(--ink);
  font-family:"Fira Code",monospace;
  font-size:25px;
  font-weight:700;
  line-height:1.1;
  font-variant-numeric:tabular-nums;
}
.kpi .val small{color:var(--muted);font-family:"Fira Sans",sans-serif;font-size:11px}
.kpi .dv{
  display:inline-flex;
  align-items:center;
  gap:3px;
  margin-top:8px;
  font-size:11px;
  font-weight:600;
}
.dv.up{color:var(--green)}
.dv.dn{color:var(--red)}
.dv.fl{color:var(--muted)}
.dv .material-symbols-outlined{font-size:15px}
.bar{height:4px;margin-top:10px;overflow:hidden;background:var(--color-muted);border-radius:1px}
.bar>span{display:block;height:100%;background:var(--blue)}
.tscroll{min-width:0;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{
  padding:8px 9px;
  border-top:1px solid var(--line);
  border-bottom:1px solid #CBD5E1;
  background:#F8FAFC;
  color:var(--muted);
  font-size:10.5px;
  font-weight:600;
  letter-spacing:.04em;
  text-align:left;
  white-space:nowrap;
}
td{padding:9px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:var(--primary-soft)}
tbody tr:last-child td{border-bottom:0}
td:nth-child(n+5){font-variant-numeric:tabular-nums}
.mono{
  font-family:"Fira Code",monospace;
  font-weight:500;
  font-variant-numeric:tabular-nums;
}
.st{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:3px;
  font-size:10.5px;
  font-weight:600;
}
.st.ok{color:#166534;background:#F0FDF4}
.st.warn{color:#92400E;background:#FFFBEB}
.st.bad{color:#B91C1C;background:#FEF2F2}
.st.info{color:#1D4ED8;background:#EFF6FF}
.st.pur{color:#1D4ED8;background:#EFF6FF}
.st .dot{width:6px;height:6px;background:currentColor;border-radius:50%}
.chartbox{position:relative;height:230px;min-width:0}
.chartbox.sm{height:190px}
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:10px;min-width:920px}
.col{min-width:0;padding:10px;background:#F8FAFC;border:1px solid var(--line);border-radius:5px}
.colh{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.colh b{display:flex;align-items:center;gap:6px;font-size:12px}
.colh b .material-symbols-outlined{font-size:17px}
.cnt{
  padding:1px 7px;
  border:1px solid var(--line);
  background:#fff;
  color:var(--muted);
  border-radius:3px;
  font-family:"Fira Code",monospace;
  font-size:10px;
}
.tk{
  margin-bottom:8px;
  padding:10px;
  background:#fff;
  border:1px solid var(--line);
  border-left:3px solid var(--blue);
  border-radius:4px;
}
.tk:last-child{margin-bottom:0}
.tk .lot{font-family:"Fira Code",monospace;font-size:11.5px;font-weight:600}
.tk .met{margin-top:4px;color:var(--muted);font-size:10.5px}
.tk .foot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:9px}
.tk .who{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:10px}
.av{
  display:grid;
  place-items:center;
  width:19px;
  height:19px;
  color:#fff;
  background:var(--blue);
  border-radius:3px;
  font-size:9px;
}
.edge.g{border-left-color:var(--green)}
.edge.a{border-left-color:var(--amber)}
.edge.r{border-left-color:var(--red)}
.plan{padding:12px 13px;border:1px solid var(--line);border-radius:5px;background:#fff}
.plan h4{display:flex;align-items:center;gap:7px;margin:0 0 7px;font-size:12.5px}
.plan .row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line);font-size:11.5px}
.plan .row:last-child{border-bottom:0}
.plan .row span{flex:none;color:var(--muted)}
.plan .row b{text-align:right}
.tl{position:relative;padding-left:25px}
.tl:before{position:absolute;top:5px;bottom:5px;left:8px;width:1px;background:#CBD5E1;content:""}
.tlitem{position:relative;padding-bottom:15px}
.tlitem:last-child{padding-bottom:0}
.tlitem .dot{
  position:absolute;
  top:2px;
  left:-22px;
  width:13px;
  height:13px;
  border:3px solid var(--blue);
  background:#fff;
  border-radius:50%;
}
.tlitem.done .dot{border-color:var(--green);background:var(--green)}
.tlitem.warn .dot{border-color:var(--amber);background:var(--amber)}
.tlitem .tt{font-size:12px;font-weight:700}
.tlitem .tm{margin:2px 0 4px;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px}
.tlitem .td{color:var(--muted);font-size:11.5px}
.mtx td,.mtx th{text-align:center}
.mtx td:first-child,.mtx th:first-child{text-align:left}
.mcell{display:inline-block;min-width:34px;padding:3px 6px;border-radius:3px;font-family:"Fira Code",monospace;font-size:10.5px;font-weight:600}
.deflist .dl{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.deflist .dl:last-child{margin-bottom:0}
.deflist .dn{width:78px;flex:none;font-size:11.5px;font-weight:600}
.deflist .db{height:6px;flex:1;overflow:hidden;background:var(--color-muted)}
.deflist .db>span{display:block;height:100%}
.deflist .dv2{width:38px;flex:none;text-align:right;font-family:"Fira Code",monospace;font-size:11px;font-weight:600}
.note{
  display:flex;
  align-items:flex-start;
  gap:7px;
  padding:9px 10px;
  border:1px solid #BFDBFE;
  border-left:3px solid var(--blue);
  border-radius:4px;
  background:var(--primary-soft);
  color:#334155;
  font-size:11px;
}
.note .material-symbols-outlined{flex:none;color:var(--blue);font-size:16px}
.foot{margin-top:25px;color:var(--grey);font-size:10.5px;text-align:center}
.screen-link{color:#1D4ED8;font-weight:600;text-decoration-thickness:1px;text-underline-offset:3px}
.screen-link:hover{color:#1E40AF}
@keyframes reveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:1024px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.g32{grid-template-columns:1fr}
}
@media(max-width:768px){
  .tbrow{flex-wrap:wrap}
  .tbspacer{display:none}
  .tag{flex:1;justify-content:center}
  .scrhead{align-items:flex-start;flex-direction:column}
  .pills{justify-content:flex-start}
  .g3,.g2{grid-template-columns:1fr}
}
@media(max-width:520px){
  .topbar{padding:10px 14px}
  .brand{width:100%}
  .tag{font-size:10.5px}
  .main{padding:18px 14px 38px}
  .g4{grid-template-columns:1fr}
  .nav{padding:8px 10px}
  .nav .txt{display:none}
  .card{padding:14px 13px}
  .pills{display:grid;width:100%;grid-template-columns:1fr}
  .pill{justify-content:space-between}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="tbrow">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">verified</span></div>
      <div><b>IQC 進料品質管控台</b><span>QMS 品質管理系統 · 純 UI 展示</span></div>
    </div>
    <div class="tbspacer"></div>
    <span class="tag"><span class="material-symbols-outlined">calendar_today</span>2026-08-14 · 早班</span>

  </div>

</header>
<main class="main">
  <div class="scrhead">
    <div><h1 id="scrTitle">—</h1><div class="sub" id="scrSub">—</div></div>
    <div class="pills" id="scrPills"></div>
  </div>

  <div class="foot">本頁為純 UI 系統展示（無後端），畫面與資料皆為擬真示範。</div>
</main>
<script>
var MODS=[
  {icon:"qr_code_scanner",name:"到貨收料",desc:"供應商到貨掃碼與待驗批建立"},
  {icon:"checklist",name:"檢驗計畫",desc:"檢驗項目、規格與抽樣標準設定"},
  {icon:"science",name:"抽樣檢驗",desc:"AQL 抽樣、量測登錄與缺陷分類"},
  {icon:"gavel",name:"判定放行",desc:"允收/退貨/特採判定與看板追蹤"},
  {icon:"factory",name:"供應商評鑑",desc:"來料合格率與供應商績效評分"},
  {icon:"inventory_2",name:"批次追溯",desc:"批號履歷、檢驗紀錄與稽核歸檔"}
];
var PILLS=[
  [["local_shipping","今日到貨","18 批"],["hourglass_top","待驗","7 批"],["timer","平均等驗","42 分"]],
  [["rule","作用中計畫","64 項"],["tune","AQL 一般II","主用"],["update","本月改版","5 版"]],
  [["biotech","今日抽驗","23 批"],["report","缺陷通報","11 件"],["insights","製程 Cpk","1.42"]],
  [["dashboard","待判定","5 批"],["done_all","今日放行","14 批"],["block","退貨","2 批"]],
  [["groups","合格供應商","38 家"],["star","A 級","12 家"],["trending_up","來料合格率","96.3%"]],
  [["history","可追溯批","2,140"],["fact_check","稽核紀錄","完整"],["schedule","歸檔時效","即時"]]
];
var charts=[];
function pillHTML(i){
  var a=PILLS[i]||[],h="";
  for(var k=0;k<a.length;k++)h+='<span class="pill"><span class="material-symbols-outlined">'+a[k][0]+'</span>'+a[k][1]+' <b>'+a[k][2]+'</b></span>';
  return h;
}
function mkChart(id,cfg){
  var el=document.getElementById(id);
  if(!el)return;
  charts.push(new Chart(el,cfg));
}
function killCharts(){
  for(var i=0;i<charts.length;i++)try{charts[i].destroy()}catch(e){}
  charts=[];
}
function kpi(icon,label,val,unit,dir,note,barpct){
  var di=dir==="up"?"arrow_upward":dir==="dn"?"arrow_downward":"remove";
  return '<div class="card kpi"><div class="lbl"><span class="material-symbols-outlined">'+icon+'</span>'+label+'</div>'+
  '<div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div>'+
  '<div class="dv '+dir+'"><span class="material-symbols-outlined">'+di+'</span>'+note+'</div>'+
  '<div class="bar"><span style="width:'+barpct+'%"></span></div></div>';
}
function s0(){
  var rows=[
    ["IN-260814-01","晶鑫O子","CAP-0603-104","貼片電容","20,000","早08:12","待抽樣","warn","一般II"],
    ["IN-260814-02","豐O精密","SCR-M3-08","不鏽鋼螺絲","12,500","早08:26","檢驗中","info","加嚴II"],
    ["IN-260814-03","O盛塑膠","HSG-A21","外殼上蓋","3,200","早08:40","待抽樣","warn","一般II"],
    ["IN-260814-04","O暘線材","WIRE-AWG24","鍍錫銅線","8,000","早08:55","檢驗中","info","一般II"],
    ["IN-260814-05","O昇金屬","PLT-Zn-15","鍍鋅鋼板","640","早09:10","待抽樣","warn","一般II"],
    ["IN-260814-06","晶鑫O子","RES-0402-10K","貼片電阻","50,000","早09:22","檢驗中","info","放寬III"],
    ["IN-260814-07","三合橡膠","ORING-14","O 型環","6,400","早09:38","待抽樣","warn","加嚴II"]
  ],tr="";
  for(var i=0;i<rows.length;i++){
    var r=rows[i];
    tr+='<tr><td class="mono">'+r[0]+'</td><td>'+r[1]+'</td><td class="mono">'+r[2]+'</td><td>'+r[3]+'</td><td class="mono">'+r[4]+'</td><td class="mono">'+r[5]+'</td><td><span class="st '+r[7]+'"><span class="dot"></span>'+r[6]+'</span></td><td><span class="st pur">'+r[8]+'</span></td></tr>';
  }
  return '<div class="grid g4" style="margin-bottom:12px">'+
    kpi("local_shipping","今日到貨批","18","批","up","較昨 +3",84)+
    kpi("hourglass_top","待驗批","7","批","dn","已清 11 批",39)+
    kpi("timer","平均等驗時間","42","分","up","目標 ≤60 分",70)+
    kpi("qr_code_2","掃碼建批率","100","%","fl","全數掃碼入列",100)+

  var btns=nav.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++)btns[k].addEventListener("click",function(){
    var i=+this.getAttribute("data-i");
    if(location.hash!=="#go="+i)location.hash="go="+i;
    else show(i);
    try{window.scrollTo(0,0)}catch(e){}
  });
}
function show(i){
  killCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    var on=+btns[b].getAttribute("data-i")===i;
    btns[b].classList.toggle("on",on);
    btns[b].setAttribute("aria-current",on?"page":"false");
  }
  document.getElementById("scrTitle").textContent=MODS[i].name;
  document.getElementById("scrSub").textContent=MODS[i].desc;
  document.getElementById("scrPills").innerHTML=pillHTML(i);
  var box=document.getElementById("screen");
  box.innerHTML=RENDER[i]();
  void box.offsetHeight;
  if(CHARTS[i])CHARTS[i]();
}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return}
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0)}catch(e){}
}
buildNav();
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
