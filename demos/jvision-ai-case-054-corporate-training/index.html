<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>企業內訓證照台 · Corporate Training & Certification</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--accent:#1d4ed8;--accent2:#60a5fa;--ink:#0f1b33;--bg:#eff3fb;--card:#fff;--line:#dce4f2;--mut:#64748b;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--slate:#334155}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.top{background:linear-gradient(100deg,#1e3a8a,#1d4ed8);color:#fff;display:flex;align-items:center;gap:16px;padding:11px 22px;position:sticky;top:0;z-index:20;flex-wrap:wrap;box-shadow:0 4px 16px rgba(29,78,216,.22)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#60a5fa,#93c5fd);display:grid;place-items:center;font-weight:800;color:#0f2a6b;flex:none;box-shadow:0 6px 16px rgba(96,165,250,.5)}
.brand b{font-size:15px;font-weight:800;display:block;font-family:"Noto Sans TC"}
.brand span{font-size:10px;color:#bfdbfe;letter-spacing:2px}
.nav{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap;min-width:0}
.nav button{border:0;background:rgba(255,255,255,.08);color:#dbeafe;font:inherit;font-weight:600;font-size:13px;padding:9px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:rgba(255,255,255,.16);color:#fff}
.nav button.on{background:#fff;color:var(--accent);box-shadow:0 4px 12px rgba(0,0,0,.18)}
.wrap{max-width:1280px;margin:0 auto;padding:22px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.live{background:#dbeafe;color:#1d4ed8;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.live .pulse{width:8px;height:8px;border-radius:50%;background:#1d4ed8;animation:bp 1.6s ease-in-out infinite}
@keyframes bp{0%,100%{opacity:1}50%{opacity:.3}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.kpis>*{min-width:0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-16px;top:-16px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,rgba(29,78,216,.12),transparent 70%)}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.28}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.3fr .9fr}
.g11{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.two>*{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.card h3 .r{margin-left:auto}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#dcfce7;color:#15803d}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#dbeafe;color:#1d4ed8}.t-mut{background:#e2e8f0;color:#475569}
.chart{height:250px}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#eef3fc}
table.data td b{font-family:Inter}
.scroll{overflow-x:auto}
.cert{display:flex;flex-direction:column;gap:9px}
.ci{display:grid;grid-template-columns:38px 1fr auto;gap:11px;align-items:center;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:10px 13px}
.ci.warn{border-left-color:#d97706;background:#fffbeb}
.ci.bad{border-left-color:#dc2626;background:#fef2f2}
.ci .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-family:"Noto Sans TC";flex:none;font-size:14px}
.ci .mid{min-width:0}
.ci .mid b{font-size:13px;font-family:"Noto Sans TC"}
.ci .mid small{color:var(--mut);font-size:11.5px;display:block}
.ci .rt{text-align:right;white-space:nowrap}
.ci .rt .dd{font-family:Inter;font-weight:800;font-size:13px}
.ci .rt small{display:block;font-size:10.5px;color:var(--mut);margin-top:2px}
.lines{display:flex;flex-direction:column;gap:11px}
.lr{display:grid;grid-template-columns:82px 1fr 56px;gap:11px;align-items:center}
.lr b{font-size:12.5px;font-family:"Noto Sans TC"}
.bar{height:13px;background:#eaf0fb;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.lr small{font-size:12.5px;font-weight:700;text-align:right;font-family:Inter}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
.plan{display:flex;flex-direction:column;gap:10px}
.pl{border:1px solid var(--line);border-radius:13px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.pl .cat{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;flex:none}
.pl .cat .material-symbols-outlined{font-size:22px;color:#fff}
.pl .mid b{font-family:"Noto Sans TC";font-size:13.5px}
.pl .mid small{color:var(--mut);font-size:11.5px;display:block;margin-top:2px}
.pl .prog{height:7px;background:#eaf0fb;border-radius:6px;overflow:hidden;margin-top:7px;max-width:260px}
.pl .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.pl .rt{text-align:right;white-space:nowrap}
.pl .rt b{font-family:Inter;font-size:15px}.pl .rt small{display:block;font-size:10.5px;color:var(--mut)}
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px}
.cc{border:1px solid var(--line);border-radius:14px;padding:14px;border-top:4px solid var(--accent)}
.cc .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:7px}
.cc b{font-family:"Noto Sans TC";font-size:13.5px}
.cc small{color:var(--mut);font-size:11.5px;display:block;line-height:1.7}
.cc .seat{height:7px;background:#eaf0fb;border-radius:6px;overflow:hidden;margin:9px 0 5px}
.cc .seat i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.cc .seat.full i{background:linear-gradient(90deg,#dc2626,#f87171)}
.enroll{width:100%;margin-top:8px;background:var(--accent);color:#fff;border:0;padding:9px;border-radius:9px;font:inherit;font-weight:800;font-size:12.5px;font-family:"Noto Sans TC";cursor:pointer}
.enroll.dis{background:#e2e8f0;color:#94a3b8;cursor:not-allowed}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.rp{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.rp .av{width:40px;height:40px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;color:#fff;font-weight:800;font-family:"Noto Sans TC"}
.rp b{font-size:12.5px;font-family:"Noto Sans TC";display:block}
.rp small{color:var(--mut);font-size:11px}
.mtx{width:100%;border-collapse:collapse;font-size:12.5px}
.mtx th,.mtx td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:center}
.mtx th{color:var(--mut);font-weight:700;font-size:11.5px}
.mtx td:first-child,.mtx th:first-child{text-align:left;font-family:"Noto Sans TC"}
.cell{display:inline-block;min-width:40px;padding:4px 8px;border-radius:8px;font-weight:800;font-size:11.5px;color:#fff;font-family:Inter}
.imp{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.ic2{border:1px solid var(--line);border-radius:13px;padding:13px;border-top:4px solid var(--accent)}
.ic2 b{font-family:"Noto Sans TC";font-size:13.5px}
.ic2 .big{font-family:Inter;font-weight:800;font-size:22px;color:var(--accent);margin-top:4px}
.ic2 small{color:var(--mut);font-size:11px;display:block}
.ev{display:flex;flex-direction:column;gap:9px}
.ei{display:flex;gap:11px;align-items:flex-start;border-left:3px solid var(--warn);background:#fffbeb;border-radius:0 10px 10px 0;padding:10px 12px}
.ei.bad{border-color:var(--bad);background:#fef2f2}.ei.info{border-color:var(--accent);background:#eff5ff}
.ei .material-symbols-outlined{font-size:19px;color:var(--warn);flex:none}
.ei.bad .material-symbols-outlined{color:var(--bad)}.ei.info .material-symbols-outlined{color:var(--accent)}
.ei b{font-size:12.5px;font-family:"Noto Sans TC"}
.ei small{display:block;color:var(--mut);font-size:11px;margin-top:1px}
.ei .tm{margin-left:auto;color:var(--mut);font-size:10.5px;white-space:nowrap;flex:none}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g11,.g3,.two{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:14px}.nav button span:not(.material-symbols-outlined){display:none}.nav button{padding:9px}.pl{grid-template-columns:auto 1fr}.pl .rt{grid-column:1/3;text-align:left}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo">訓</div><div><b>企業內訓證照台</b><span>CORPORATE TRAINING & CERT</span></div></div>
  <nav class="nav" id="nav"></nav>
</header>
<main class="wrap">
  <div class="vh"><div><h2 id="vt">訓練總覽</h2><p id="vd"></p></div><div class="live" id="live"><span class="pulse"></span>2026 年度 · 全公司 6 部門</div></div>
  <div id="view"></div>
</main>
<script>
const MOD=[["訓練總覽","dashboard","訓練總覽","年度訓練戰情、法定時數達成與近效期證照"],
["訓練計畫","school","訓練計畫","年度訓練計畫、課程排程與預算執行"],
["報名上課","how_to_reg","報名上課","課程報名、班別人數與當日簽到出席"],
["學習時數","schedule","學習時數","個人與部門學習時數累計與法定達成"],
["證照追蹤","workspace_premium","證照追蹤","法定/技能證照到期提醒與換證排程"],
["成效報表","assessment","成效報表","訓練成效、能力缺口與 TTQS 稽核報表"]];
const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span><span>'+m[0]+'</span>';b.onclick=()=>show(i);nav.appendChild(b);});

// 證照到期追蹤 [員工,部門,證照,到期日,剩餘天,狀態class,色]
const CERTS=[["張家豪","製造一課","堆高機操作","2026/09/02",20,"bad","#dc2626"],
["李佩珊","職安室","甲種職業安全衛生","2026/09/18",36,"bad","#dc2626"],
["王建宏","設備工程","固定式起重機","2026/10/10",58,"warn","#d97706"],
["陳美玲","品保部","ISO 9001 主導稽核員","2026/10/25",73,"warn","#d97706"],
["林志偉","電控課","乙級電匠","2026/12/08",117,"ok","#1d4ed8"],
["黃淑芬","行政部","急救人員 CPR+AED","2027/01/15",155,"ok","#1d4ed8"]];
function avColor(n){const c=['#1d4ed8','#2563eb','#3b82f6','#60a5fa','#0ea5e9','#6366f1'];return c[n%c.length];}
const DEPTH=[["製造一課",128,140],["設備工程",96,100],["品保部",84,80],["電控課",72,90],["職安室",58,60],["行政部",44,60]];
// 訓練計畫 [icon,色,課程,對象,場次,進度%,已辦/總,類型]
const PLAN=[["health_and_safety","#dc2626","一般安全衛生教育訓練","全體新進 · 在職","12 場",83,"10 / 12","法定必修"],
["local_fire_department","#ea580c","消防防護編組演練","各廠區","4 場",50,"2 / 4","法定必修"],
["forklift","#1d4ed8","堆高機操作人員複訓","製造 / 倉儲","3 場",67,"2 / 3","技能證照"],
["verified","#0891b2","ISO 9001 內部稽核員養成","品保 / 各課","2 場",50,"1 / 2","技能提升"],
["psychology","#7c3aed","中階主管領導力工作坊","課級以上主管","3 場",33,"1 / 3","管理發展"],
["computer","#0d9488","數位工具與資安意識","全體","6 場",50,"3 / 6","共通職能"]];
// 報名課程 [課程,日期,講師,報名,容量,類型,tag]
const COURSES=[["堆高機操作複訓 第3梯","09/05 09:00","外聘 · 勞安協會",26,30,"技能證照","t-info"],
["甲種職安衛在職教育","09/12 13:30","職安室 · 李技師",40,40,"法定必修","t-warn"],
["ISO 9001 內部稽核實務","09/20 09:00","品保部 · 陳經理",18,24,"技能提升","t-info"],
["主管領導力工作坊","09/26 09:00","外聘 · 顧問講師",15,20,"管理發展","t-ok"],
["資安意識與個資保護","10/03 14:00","資訊室 · 王工程師",52,60,"共通職能","t-info"],
["急救人員 CPR+AED 認證","10/09 09:00","外聘 · 紅十字會",30,30,"法定必修","t-warn"]];
// 當日簽到 [名,部門,狀態]
const ROSTER=[["張家豪","製造","in"],["李佩珊","職安","in"],["王建宏","設備","in"],["陳美玲","品保","in"],["林志偉","電控","late"],["黃淑芬","行政","in"],["吳宗翰","製造","in"],["劉雅婷","倉儲","absent"],["蔡明道","製造","in"],["周怡君","品保","in"],["鄭文彬","設備","in"],["許雅雯","行政","in"]];
// 個人時數 [名,部門,已訓h,應訓h,證照數]
const PERSON=[["張家豪","製造一課",22,24,3],["李佩珊","職安室",30,24,4],["王建宏","設備工程",18,24,3],["陳美玲","品保部",26,20,2],["林志偉","電控課",14,24,2],["黃淑芬","行政部",9,16,1],["吳宗翰","製造一課",20,24,2],["周怡君","品保部",23,20,3]];
// 成效 [課程,出席%,平均分,滿意度,判定,tag]
const EFFECT=[["一般安全衛生教育","96","88","4.6","優良","t-ok"],["堆高機操作複訓","100","91","4.7","優良","t-ok"],["ISO 9001 內部稽核","89","78","4.2","良好","t-info"],["主管領導力工作坊","93","—","4.8","優良","t-ok"],["資安意識與個資保護","82","74","3.9","待加強","t-warn"]];

const SCREENS=[
// v0 訓練總覽
()=>`<div class="kpis">
 <div class="kpi"><span class="material-symbols-outlined ic">school</span><div class="l">年度訓練時數</div><div class="v">4,820<small style="font-size:12px"> h</small></div><div class="d up">▲ 達成 82%</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">verified</span><div class="l">法定時數達成</div><div class="v">96<small style="font-size:12px">%</small></div><div class="d up">▲ 較去年 +27%</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">workspace_premium</span><div class="l">有效證照數</div><div class="v">318<small style="font-size:12px"> 張</small></div><div class="d" style="color:var(--warn)">近效期 14 張</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">event_busy</span><div class="l">60 天內到期</div><div class="v" style="color:var(--bad)">6<small style="font-size:12px"> 張</small></div><div class="d" style="color:var(--mut)">2 張需複訓換證</div></div>
</div>
<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">event_busy</span>證照到期追蹤<span class="tag t-bad r">近效期優先</span></h3><div class="cert">${CERTS.map((c,i)=>`<div class="ci ${c[5]}"><span class="av" style="background:${avColor(i)}">${c[0][0]}</span><div class="mid"><b>${c[0]} · ${c[2]}</b><small>${c[1]}</small></div><div class="rt"><span class="dd" style="color:${c[6]}">${c[3]}</span><small>剩 ${c[4]} 天</small></div></div>`).join('')}</div>
  <div class="legend"><span><i class="dot" style="background:#dc2626"></i>30 天內</span><span><i class="dot" style="background:#d97706"></i>60 天內</span><span><i class="dot" style="background:#1d4ed8"></i>正常</span></div></div>
 <div class="card"><h3><span class="material-symbols-outlined">bar_chart</span>近 6 週法定時數達成率</h3><div class="chart" id="c_trend" style="height:200px"></div>
  <h3 style="margin:16px 0 10px"><span class="material-symbols-outlined">groups</span>各部門時數達成</h3>
  <div class="lines">${DEPTH.map(d=>{const p=Math.min(100,Math.round(d[1]/d[2]*100));return `<div class="lr"><b>${d[0]}</b><div class="bar"><i style="width:${p}%${p<80?';background:#d97706':''}"></i></div><small style="color:${p>=90?'var(--ok)':p<80?'var(--warn)':'var(--accent)'}">${p}%</small></div>`;}).join('')}</div></div>
</div>`,
// v1 訓練計畫
()=>`<div class="kpis">
 <div class="kpi"><span class="material-symbols-outlined ic">event</span><div class="l">年度課程數</div><div class="v">48<small style="font-size:12px"> 門</small></div><div class="d" style="color:var(--mut)">法定 16 · 選修 32</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">groups</span><div class="l">計畫受訓人次</div><div class="v">2,340</div><div class="d up">▲ 覆蓋 6 部門</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">payments</span><div class="l">訓練預算執行</div><div class="v">61<small style="font-size:12px">%</small></div><div class="d" style="color:var(--mut)">NT$ 168 / 275 萬</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">pending_actions</span><div class="l">待核定場次</div><div class="v" style="color:var(--warn)">3</div><div class="d" style="color:var(--mut)">主任審核中</div></div>
</div>
