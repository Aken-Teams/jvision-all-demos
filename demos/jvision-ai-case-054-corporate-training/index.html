<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>企業內訓證照台 · Corporate Training & Certification</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Comic+Neue:wght@300;400;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
 --color-primary:#4F46E5;--color-on-primary:#FFFFFF;--color-secondary:#818CF8;
 --color-on-secondary:#0F172A;--color-accent:#EA580C;--color-on-accent:#000000;
 --color-background:#EEF2FF;--color-foreground:#1E1B4B;--color-card:#FFFFFF;
 --color-card-foreground:#1E1B4B;--color-muted:#EBEEF8;--color-muted-foreground:#475569;
 --color-border:#C7D2FE;--color-destructive:#DC2626;--color-on-destructive:#FFFFFF;
 --color-ring:#4F46E5;--blue:#4F46E5;--ink:#1E1B4B;--muted:#475569;--line:#C7D2FE;
 --ok:#166534;--warn:#9A3412;--bad:#B91C1C;--radius:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;background:var(--color-background);color:var(--ink);
 font-family:"Comic Neue","Noto Sans TC",sans-serif;font-size:15px;line-height:1.5;
}
button,a,[role=button]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
 outline:3px solid var(--color-ring);outline-offset:3px;
}
.material-symbols-outlined{font-size:20px;line-height:1;vertical-align:middle}
.top{
 position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:24px;
 min-height:72px;padding:12px max(20px,calc((100vw - 1320px)/2));
 color:var(--ink);background:rgba(255,255,255,.96);
 border-bottom:1px solid var(--line);box-shadow:0 8px 24px rgba(30,27,75,.07);
 backdrop-filter:blur(12px);
}
.brand{display:flex;align-items:center;gap:12px;min-width:max-content}
.logo{
 width:44px;height:44px;display:grid;place-items:center;border-radius:12px;
 color:#fff;background:var(--blue);font:700 22px/1 "Baloo 2",sans-serif;
 box-shadow:5px 5px 0 #C7D2FE;
}
.brand b,.vh h2,.card h3,.mid b,.cc b,.rp b,.ic2 b{
 font-family:"Baloo 2","Noto Sans TC",sans-serif;
}
.brand b{display:block;font-size:17px;line-height:1.1}
.brand small{display:block;margin-top:3px;color:var(--muted);font:700 10px/1 "Comic Neue";letter-spacing:1.7px}
.nav{display:flex;gap:6px;margin-left:auto;overflow-x:auto;padding:4px}
.nav button{
 display:flex;align-items:center;gap:7px;flex:none;border:1px solid transparent;
 border-radius:10px;padding:9px 11px;background:transparent;color:var(--muted);
 font:700 13px/1 "Comic Neue","Noto Sans TC",sans-serif;
 transition:background .22s ease,color .22s ease,border-color .22s ease,transform .22s ease;
}
.nav button:hover{color:var(--blue);background:var(--color-muted);transform:translateY(-1px)}
.nav button.on{color:#fff;background:var(--blue);border-color:var(--blue);box-shadow:0 5px 0 #C7D2FE}
.wrap{width:min(1320px,100%);margin:auto;padding:30px 24px 56px}
.vh{
 display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
 margin-bottom:20px;padding-bottom:18px;border-bottom:2px solid var(--ink);
}
.vh h2{margin:0;font-size:clamp(25px,3vw,36px);line-height:1.1;letter-spacing:-.02em}
.vh p{margin:6px 0 0;color:var(--muted)}
.live{
 display:inline-flex;align-items:center;gap:8px;white-space:nowrap;padding:8px 12px;
 border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--blue);
 font-weight:700;font-size:12px;
}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--blue);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.75)}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi,.card,.cc,.rp,.pl,.ci,.ic2{
 border:1px solid var(--line);background:var(--color-card);color:var(--color-card-foreground);
}
.kpi{
 position:relative;min-width:0;overflow:hidden;padding:18px;border-radius:var(--radius);
 box-shadow:4px 4px 0 rgba(129,140,248,.18);
 transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.kpi:hover,.cc:hover,.rp:hover,.ic2:hover{
 transform:translateY(-3px);border-color:var(--blue);box-shadow:6px 6px 0 #C7D2FE;
}
.kpi .l{color:var(--muted);font-size:12px;font-weight:700}
.kpi .v{margin-top:4px;font:700 28px/1.15 "Baloo 2";font-variant-numeric:tabular-nums}
.kpi .d{margin-top:3px;font-size:11px;font-weight:700}
.kpi .ic{position:absolute;right:14px;top:14px;color:var(--blue);font-size:27px}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.g2{grid-template-columns:minmax(0,1.3fr) minmax(0,.9fr)}
.card{
 min-width:0;padding:18px;border-radius:var(--radius);
 box-shadow:4px 4px 0 rgba(129,140,248,.16);
}
.card h3{
 display:flex;align-items:center;gap:8px;flex-wrap:wrap;
 margin:0 0 15px;font-size:16px;line-height:1.25;
}
.card h3>.material-symbols-outlined{color:var(--blue)}
.card h3 .r{margin-left:auto}
.tag{
 display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;
 padding:3px 9px;border:1px solid currentColor;border-radius:999px;font-size:10.5px;font-weight:700;
}
.t-ok{color:#166534;background:#DCFCE7}.t-warn{color:#9A3412;background:#FFEDD5}
.t-bad{color:#991B1B;background:#FEE2E2}.t-info{color:#3730A3;background:#E0E7FF}
.t-mut{color:#475569;background:#F1F5F9}
.chart{height:260px}
.cert,.plan,.lines,.ev{display:flex;flex-direction:column;gap:10px}
.ci{
 display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:12px;
 padding:11px 13px;border-left:5px solid var(--blue);border-radius:11px;
}
.ci.warn{border-left-color:#C2410C;background:#FFF7ED}
.ci.bad{border-left-color:var(--bad);background:#FEF2F2}
.av{
 display:grid;place-items:center;width:40px;height:40px;border-radius:10px;color:#fff;
 font:700 15px/1 "Baloo 2";flex:none;
}
.mid{min-width:0}.mid b{font-size:14px}.mid small,.cc small,.rp small,.ic2 small{
 display:block;color:var(--muted);font-size:11.5px;
}
.rt{text-align:right;white-space:nowrap}
.dd,.mono,td:nth-child(n+3){font-variant-numeric:tabular-nums}
.dd{font-family:"Comic Neue",monospace;font-weight:700}
.rt small{display:block;color:var(--muted);font-size:10.5px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;color:var(--muted);font-size:11.5px}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border:2px solid currentColor;border-radius:2px}
.lr{display:grid;grid-template-columns:84px 1fr 56px;align-items:center;gap:11px}
.lr b{font-size:12.5px}.lr small{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.bar,.prog,.seat{overflow:hidden;background:var(--color-muted);border-radius:999px}
.bar{height:12px}.bar i,.prog i,.seat i{display:block;height:100%;background:var(--blue);border-radius:inherit}
.pl{
 display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;
 padding:12px;border-radius:12px;
}
.cat{display:grid;place-items:center;width:44px;height:44px;border-radius:10px;color:#fff}
.prog{height:7px;max-width:280px;margin-top:7px}
.pl .rt b{font:700 15px "Comic Neue";font-variant-numeric:tabular-nums}
.courses{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.cc{padding:14px;border-top:4px solid var(--blue);border-radius:12px;transition:.22s ease}
.cc .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:7px}
.cc b{font-size:14px}.seat{height:7px;margin:10px 0 5px}.seat.full i{background:var(--bad)}
.enroll{
 width:100%;margin-top:9px;padding:10px;border:1px solid var(--blue);border-radius:9px;
 background:var(--blue);color:#fff;font:700 13px "Baloo 2";
 transition:transform .2s ease,box-shadow .2s ease,background .2s ease;
}
.enroll:hover{background:#3730A3;box-shadow:4px 4px 0 #C7D2FE;transform:translateY(-1px)}
.enroll.dis{color:#64748B;background:#E2E8F0;border-color:#CBD5E1;cursor:not-allowed;box-shadow:none}
.roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px}
.rp{padding:11px;text-align:center;border-radius:11px;transition:.22s ease}
.rp .av{margin:0 auto 7px}.rp b{display:block;font-size:13px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left}
table.data th{background:#E0E7FF;color:#312E81;font-size:11.5px;font-weight:700}
table.data tr:last-child td{border-bottom:0}
table.data tbody tr:hover,table.data tr:not(:first-child):hover{background:#F8FAFF}
table.data th:nth-child(n+3),table.data td:nth-child(n+3){text-align:right}
.imp{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.ic2{padding:15px;border-top:4px solid var(--blue);border-radius:12px;transition:.22s ease}
.ic2 .big{margin-top:4px;color:var(--blue);font:700 25px "Baloo 2";font-variant-numeric:tabular-nums}
.ei{
 display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-left:4px solid #C2410C;
 border-radius:0 9px 9px 0;background:#FFF7ED;
}
.ei.bad{border-color:var(--bad);background:#FEF2F2}.ei.info{border-color:var(--blue);background:#EEF2FF}
.ei>.material-symbols-outlined{color:#C2410C;flex:none}
.ei.bad>.material-symbols-outlined{color:var(--bad)}.ei.info>.material-symbols-outlined{color:var(--blue)}
.ei b{font-family:"Baloo 2";font-size:13px}.ei small{display:block;color:var(--muted);font-size:11px}
.ei .tm{margin-left:auto;color:var(--muted);font:700 10.5px "Comic Neue";white-space:nowrap}
.grid-item{animation:enter .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.97)}}
@media(max-width:960px){
 .top{align-items:flex-start;flex-direction:column;gap:8px}.nav{width:100%;margin:0}
 .kpis,.imp{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}
}
@media(max-width:560px){
 .wrap{padding:22px 14px 40px}.top{padding:11px 14px}.brand small{display:none}
 .nav button{padding:9px}.nav button span:last-child{display:none}
 .vh{align-items:flex-start;flex-direction:column}.kpis,.imp{grid-template-columns:1fr}
 .pl{grid-template-columns:auto 1fr}.pl .rt{grid-column:1/-1;text-align:left}
 .ci{grid-template-columns:40px minmax(0,1fr)}.ci .rt{grid-column:2;text-align:left}
}
@media(prefers-reduced-motion:reduce){
 html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header class="top">
 <div class="brand"><div class="logo" aria-hidden="true">訓</div><div><b>企業內訓證照台</b><small>CORPORATE TRAINING &amp; CERT</small></div></div>
 <nav class="nav" id="nav" aria-label="主要功能"></nav>
</header>
<main class="wrap">
 <div class="vh"><div><h2 id="vt">訓練總覽</h2><p id="vd"></p></div><div class="live"><span class="pulse" aria-hidden="true"></span>2026 年度 · 全公司 6 部門</div></div>
 <div id="view"></div>
</main>
<script>
const MOD=[
 ["訓練總覽","dashboard","訓練總覽","年度訓練戰情、法定時數達成與近效期證照"],
 ["訓練計畫","school","訓練計畫","年度訓練計畫、課程排程與預算執行"],
 ["報名上課","how_to_reg","報名上課","課程報名、班別人數與當日簽到出席"],
 ["學習時數","schedule","學習時數","個人與部門學習時數累計與法定達成"],
 ["證照追蹤","workspace_premium","證照追蹤","法定/技能證照到期提醒與換證排程"],
 ["成效報表","assessment","成效報表","訓練成效、能力缺口與 TTQS 稽核報表"]
];
const CERTS=[
 ["張家豪","製造一課","堆高機操作","2026/09/02",20,"bad","#B91C1C"],
 ["李佩珊","職安室","甲種職業安全衛生","2026/09/18",36,"bad","#B91C1C"],
 ["王建宏","設備工程","固定式起重機","2026/10/10",58,"warn","#9A3412"],
 ["陳美玲","品保部","ISO 9001 主導稽核員","2026/10/25",73,"warn","#9A3412"],
 ["林志偉","電控課","乙級電匠","2026/12/08",117,"ok","#4F46E5"],
 ["黃淑芬","行政部","急救人員 CPR+AED","2027/01/15",155,"ok","#4F46E5"]
];
const DEPTH=[["製造一課",128,140],["設備工程",96,100],["品保部",84,80],["電控課",72,90],["職安室",58,60],["行政部",44,60]];
const PLAN=[
 ["health_and_safety","#B91C1C","一般安全衛生教育訓練","全體新進 · 在職","12 場",83,"10 / 12","法定必修"],
 ["local_fire_department","#EA580C","消防防護編組演練","各廠區","4 場",50,"2 / 4","法定必修"],
 ["forklift","#4F46E5","堆高機操作人員複訓","製造 / 倉儲","3 場",67,"2 / 3","技能證照"],
 ["verified","#0891B2","ISO 9001 內部稽核員養成","品保 / 各課","2 場",50,"1 / 2","技能提升"],
 ["psychology","#7C3AED","中階主管領導力工作坊","課級以上主管","3 場",33,"1 / 3","管理發展"],
 ["computer","#0F766E","數位工具與資安意識","全體","6 場",50,"3 / 6","共通職能"]
];
const COURSES=[
 ["堆高機操作複訓 第3梯","09/05 09:00","外聘 · 勞安協會",26,30,"技能證照","t-info"],
 ["甲種職安衛在職教育","09/12 13:30","職安室 · 李技師",40,40,"法定必修","t-warn"],
 ["ISO 9001 內部稽核實務","09/20 09:00","品保部 · 陳經理",18,24,"技能提升","t-info"],
 ["主管領導力工作坊","09/26 09:00","外聘 · 顧問講師",15,20,"管理發展","t-ok"],
 ["資安意識與個資保護","10/03 14:00","資訊室 · 王工程師",52,60,"共通職能","t-info"],
 ["急救人員 CPR+AED 認證","10/09 09:00","外聘 · 紅十字會",30,30,"法定必修","t-warn"]
];
const ROSTER=[
 ["張家豪","製造","in"],["李佩珊","職安","in"],["王建宏","設備","in"],["陳美玲","品保","in"],
 ["林志偉","電控","late"],["黃淑芬","行政","in"],["吳宗翰","製造","in"],["劉雅婷","倉儲","absent"],
 ["蔡明道","製造","in"],["周怡君","品保","in"],["鄭文彬","設備","in"],["許雅雯","行政","in"]
];
const PERSON=[
 ["張家豪","製造一課",22,24,3],["李佩珊","職安室",30,24,4],["王建宏","設備工程",18,24,3],
 ["陳美玲","品保部",26,20,2],["林志偉","電控課",14,24,2],["黃淑芬","行政部",9,16,1],
 ["吳宗翰","製造一課",20,24,2],["周怡君","品保部",23,20,3]
];
const EFFECT=[
 ["一般安全衛生教育","96","88","4.6","優良","t-ok"],["堆高機操作複訓","100","91","4.7","優良","t-ok"],
 ["ISO 9001 內部稽核","89","78","4.2","良好","t-info"],["主管領導力工作坊","93","—","4.8","優良","t-ok"],
 ["資安意識與個資保護","82","74","3.9","待加強","t-warn"]
];
const nav=document.getElementById("nav"),view=document.getElementById("view"),vt=document.getElementById("vt"),vd=document.getElementById("vd");
const icon=n=>`<span class="material-symbols-outlined" aria-hidden="true">${n}</span>`;
const avColor=i=>["#4F46E5","#4338CA","#6366F1","#7C3AED","#0369A1","#0F766E"][i%6];
const kpi=(ic,l,v,d,c="")=>`<div class="kpi grid-item">${icon(ic)}<div class="l">${l}</div><div class="v">${v}</div><div class="d ${c}">${d}</div></div>`;
const card=(title,body,extra="")=>`<section class="card grid-item"><h3>${title}${extra}</h3>${body}</section>`;
const certList=mode=>`<div class="cert">${CERTS.map((c,i)=>`<div class="ci ${c[5]}"><span class="av" style="background:${avColor(i)}">${c[0][0]}</span><div class="mid"><b>${mode?c[2]:`${c[0]} · ${c[2]}`}</b><small>${mode?`${c[0]} · ${c[1]}`:c[1]}</small></div><div class="rt"><span class="dd" style="color:${c[6]}">${mode?`剩 ${c[4]} 天`:c[3]}</span><small>${mode?(c[4]<=30?"需複訓":c[4]<=60?"已提醒":"追蹤中"):`剩 ${c[4]} 天`}</small></div></div>`).join("")}</div>`;
const SCREENS=[
()=>`<div class="kpis">
 ${kpi("school","年度訓練時數",'4,820<small> h</small>',"▲ 達成 82%","up")}
 ${kpi("verified","法定時數達成",'96<small>%</small>',"▲ 較去年 +27%","up")}
 ${kpi("workspace_premium","有效證照數",'318<small> 張</small>',"近效期 14 張")}
 ${kpi("event_busy","60 天內到期",'<span style="color:var(--bad)">6</span><small> 張</small>',"2 張需複訓換證")}
 </div><div class="grid g2">
 ${card(`${icon("event_busy")}證照到期追蹤`,`${certList(false)}<div class="legend"><span style="color:#B91C1C"><i class="dot"></i>警示：30 天內</span><span style="color:#9A3412"><i class="dot"></i>注意：60 天內</span><span style="color:#4F46E5"><i class="dot"></i>正常</span></div>`,`<span class="tag t-bad r">近效期優先</span>`)}
 ${card(`${icon("bar_chart")}近 6 週法定時數達成率`,`<div class="chart" id="c_trend"></div><h3 style="margin:14px 0 10px">${icon("groups")}各部門時數達成</h3><div class="lines">${DEPTH.map(d=>{const p=Math.min(100,Math.round(d[1]/d[2]*100)),s=p<80?"#C2410C":"#4F46E5";return `<div class="lr"><b>${d[0]}</b><div class="bar"><i style="width:${p}%;background:${s}"></i></div><small style="color:${s}">${p<80?"注意 ":"達成 "}${p}%</small></div>`}).join("")}</div>`)}
 </div>`,
()=>`<div class="kpis">
 ${kpi("event","年度課程數",'48<small> 門</small>',"法定 16 · 選修 32")}
 ${kpi("groups","計畫受訓人次","2,340","▲ 覆蓋 6 部門","up")}
 ${kpi("payments","訓練預算執行",'61<small>%</small>',"NT$ 168 / 275 萬")}
 ${kpi("pending_actions","待核定場次",'<span style="color:var(--warn)">3</span>',"主任審核中")}
 </div><div class="grid g2">
 ${card(`${icon("checklist")}2026 年度訓練計畫執行`,`<div class="plan">${PLAN.map(p=>`<div class="pl"><span class="cat" style="background:${p[1]}">${icon(p[0])}</span><div class="mid"><b>${p[2]}</b><small>對象：${p[3]} ｜ ${p[7]}</small><div class="prog"><i style="width:${p[5]}%"></i></div></div><div class="rt"><b>${p[5]<40?"注意 ":"進度 "}${p[6]}</b><small>${p[4]} · ${p[5]}%</small></div></div>`).join("")}</div>`,`<span class="tag t-info r">RULE-01 法定優先</span>`)}
 ${card(`${icon("pie_chart")}訓練類別預算分布`,`<div class="chart" id="c_budget"></div><div class="ev"><div class="ei info">${icon("verified")}<div><b>法定必修保留 40% 預算</b><small>職安衛、消防、急救等依 RULE-01 優先排入並鎖定經費</small></div></div></div>`)}

MOD.forEach((m,i)=>{
 const b=document.createElement("button");
 b.type="button";b.dataset.i=i;b.className=i===0?"on":"";

 b.addEventListener("click",()=>{location.hash=`v${i}`});
 nav.appendChild(b);
});
const base={
 textStyle:{fontFamily:"Comic Neue",color:"#1E1B4B"},
 animationDuration:400,
 color:["#4F46E5","#818CF8","#EA580C","#0F766E"],
 tooltip:{backgroundColor:"#FFF",borderColor:"#C7D2FE",textStyle:{color:"#1E1B4B"}},
};
function chart(id,opt){
 const el=document.getElementById(id);if(!el)return;
 const c=echarts.init(el);c.setOption({...base,...opt});
 const resize=()=>c.resize();window.addEventListener("resize",resize,{passive:true});
}
function draw(i){
 if(i===0)chart("c_trend",{grid:{left:40,right:14,top:18,bottom:25},tooltip:{trigger:"axis"},xAxis:{type:"category",data:["第1週","第2週","第3週","第4週","第5週","第6週"]},yAxis:{type:"value",min:60,max:100,axisLabel:{formatter:"{value}%"}},series:[{name:"法定時數達成",type:"line",smooth:true,data:[69,76,82,88,92,96],areaStyle:{color:"rgba(79,70,229,.13)"},lineStyle:{color:"#4F46E5",width:3},itemStyle:{color:"#4F46E5"}},{name:"目標",type:"line",data:[100,100,100,100,100,100],symbol:"none",lineStyle:{color:"#64748B",type:"dashed"}}]});
 if(i===1)chart("c_budget",{tooltip:{trigger:"item",formatter:"{b}: {c} 萬 ({d}%)"},legend:{bottom:0},series:[{type:"pie",radius:["42%","69%"],center:["50%","44%"],data:[{value:110,name:"法定必修"},{value:68,name:"技能證照"},{value:45,name:"管理發展"},{value:52,name:"共通職能"}]}]});
 if(i===3)chart("c_hours",{grid:{left:45,right:14,top:35,bottom:35},tooltip:{trigger:"axis",axisPointer:{type:"shadow"}},legend:{top:0},xAxis:{type:"category",data:DEPTH.map(d=>d[0]),axisLabel:{rotate:20}},yAxis:{type:"value",name:"小時"},series:[{name:"實訓時數",type:"bar",data:DEPTH.map(d=>d[1]),itemStyle:{color:"#4F46E5",borderRadius:[4,4,0,0]}},{name:"應訓時數",type:"bar",data:DEPTH.map(d=>d[2]),itemStyle:{color:"#C7D2FE",borderRadius:[4,4,0,0]}}]});
 if(i===4){const d=CERTS.map(c=>[`${c[0]}·${c[2]}`,c[4],c[6]]);chart("c_cert",{grid:{left:125,right:25,top:12,bottom:28},tooltip:{trigger:"axis",formatter:p=>`${p[0].name}<br>剩 ${p[0].value} 天到期`},xAxis:{type:"value",name:"剩餘天數",max:180},yAxis:{type:"category",data:d.map(x=>x[0]).reverse()},series:[{type:"bar",data:d.map(x=>({value:x[1],itemStyle:{color:x[2],borderRadius:[0,5,5,0]}})).reverse(),markLine:{silent:true,symbol:"none",data:[{xAxis:30,label:{formatter:"30 天"}},{xAxis:60,label:{formatter:"60 天"}}]}}]})}
 if(i===5)chart("c_gap",{tooltip:{},legend:{bottom:0},radar:{indicator:[{name:"安全衛生",max:100},{name:"品質稽核",max:100},{name:"設備技能",max:100},{name:"數位/資安",max:100},{name:"管理領導",max:100}],radius:"62%"},series:[{type:"radar",data:[{value:[92,80,85,58,70],name:"現況能力",areaStyle:{opacity:.16}},{value:[95,90,88,85,80],name:"目標水準",areaStyle:{opacity:.08}}]}]});
}
function show(i){
 i=Math.max(0,Math.min(i,MOD.length-1));
 nav.querySelectorAll("button").forEach(b=>{const on=+b.dataset.i===i;b.classList.toggle("on",on);b.setAttribute("aria-current",on?"page":"false")});
 vt.textContent=MOD[i][2];vd.textContent=MOD[i][3];view.innerHTML=SCREENS[i]();draw(i);
}
function fromHash(){
 const m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
 show(m?+m[1]:0);
 try{window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}catch(e){window.scrollTo(0,0)}
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
