<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OQC 出貨品質管制平台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#c2410c; --accent2:#fb923c; --bg:#f6f5f3; --panel:#ffffff;
  --ink:#1c1917; --muted:#78716c; --line:#e7e3de; --soft:#faf7f4;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#0369a1;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",sans-serif; background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; line-height:1.5;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.app{display:flex;flex-direction:column;min-height:100vh;}
.topbar{
  display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--panel);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:11px;min-width:0;}
.logo{
  width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 4px 12px rgba(194,65,12,.28);
}
.logo .material-symbols-outlined{font-size:24px;}
.brand h1{font-size:16px;margin:0;font-weight:800;letter-spacing:.2px;white-space:nowrap;}
.brand p{font-size:11.5px;margin:0;color:var(--muted);white-space:nowrap;}
.topbar .spacer{flex:1;min-width:0;}
.topchip{
  display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:var(--soft);
  border:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap;
}
.topchip .material-symbols-outlined{font-size:16px;color:var(--accent);}
.nav{
  display:flex;gap:8px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);
  flex-wrap:wrap;position:sticky;top:65px;z-index:15;
}
.nav button{
  flex:none;white-space:nowrap;min-width:0;display:flex;align-items:center;gap:8px;cursor:pointer;
  padding:9px 15px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--muted);
  font-family:inherit;font-size:13px;font-weight:600;transition:all .15s;
}
.nav button .material-symbols-outlined{font-size:19px;}
.nav button .idx{
  font-size:11px;font-weight:800;width:19px;height:19px;border-radius:6px;display:grid;place-items:center;
  background:var(--soft);color:var(--muted);
}
.nav button:hover{border-color:var(--accent2);color:var(--accent);}
.nav button.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(194,65,12,.28);}
.nav button.active .idx{background:rgba(255,255,255,.25);color:#fff;}
.wrap{padding:20px;max-width:1440px;margin:0 auto;width:100%;}
.screen-head{margin-bottom:16px;}
.screen-head .kick{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:1px;text-transform:uppercase;}
.screen-head h2{margin:3px 0 4px;font-size:22px;font-weight:800;}
.screen-head p{margin:0;color:var(--muted);font-size:13px;}

.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start;}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(28,25,23,.04);}
.panel-h{display:flex;align-items:center;gap:9px;padding:14px 16px;border-bottom:1px solid var(--line);}
.panel-h .material-symbols-outlined{font-size:19px;color:var(--accent);}
.panel-h h3{margin:0;font-size:14px;font-weight:700;flex:1;min-width:0;}
.panel-h .tag{font-size:11px;font-weight:700;color:var(--muted);}
.panel-b{padding:16px;}

.listrow{
  display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s;
}
.listrow:hover{background:var(--soft);}
.listrow.sel{background:linear-gradient(90deg,rgba(194,65,12,.09),transparent);border-left:3px solid var(--accent);padding-left:13px;}
.listrow .av{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;}
.listrow .lmain{flex:1;min-width:0;}
.listrow .lmain b{font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.listrow .lmain span{font-size:11.5px;color:var(--muted);}
.listrow .lmeta{text-align:right;flex:none;}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;}
.b-ok{background:#dcfce7;color:#15803d;}
.b-warn{background:#fef3c7;color:#b45309;}
.b-bad{background:#fee2e2;color:#b91c1c;}
.b-info{background:#e0f2fe;color:#0369a1;}
.b-mut{background:#f1efec;color:#78716c;}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px;position:relative;overflow:hidden;}
.kpi::after{content:"";position:absolute;right:-14px;top:-14px;width:56px;height:56px;border-radius:50%;background:var(--soft);}
.kpi .material-symbols-outlined{font-size:20px;color:var(--accent);position:relative;}
.kpi .v{font-size:26px;font-weight:800;margin-top:8px;position:relative;}
.kpi .l{font-size:12px;color:var(--muted);position:relative;}
.kpi .d{font-size:11px;font-weight:700;margin-top:4px;position:relative;}
.up{color:var(--ok);} .down{color:var(--bad);}

table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;padding:10px 12px;background:var(--soft);color:var(--muted);font-weight:700;font-size:11.5px;white-space:nowrap;border-bottom:1px solid var(--line);}
td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
.mono{font-variant-numeric:tabular-nums;}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}

.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;}
.bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));}

.chk-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
.chk-item:last-child{border-bottom:none;}
.chk-box{width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;color:#fff;}
.chk-item .cmain{flex:1;min-width:0;}
.chk-item .cmain b{font-size:13px;display:block;}
.chk-item .cmain span{font-size:11px;color:var(--muted);}

.matrix{display:grid;grid-template-columns:80px repeat(3,1fr);gap:6px;min-width:340px;}
.matrix .mh{font-size:11px;font-weight:700;color:var(--muted);display:grid;place-items:center;padding:6px;}
.matrix .mc{border-radius:9px;padding:12px 8px;text-align:center;color:#fff;font-weight:800;}
.matrix .rl{display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--muted);}

.tl{position:relative;padding-left:26px;}
.tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line);}
.tl-item{position:relative;padding:0 0 20px 0;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot{position:absolute;left:-24px;top:2px;width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);background:var(--muted);}
.tl-dot.on{background:var(--accent);box-shadow:0 0 0 2px var(--accent2);}
.tl-item b{font-size:13px;} .tl-item .t{font-size:11px;color:var(--muted);}
.tl-item p{margin:4px 0 0;font-size:12px;color:var(--muted);}

.signcard{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--soft);}
.signcard .sig{font-family:"Noto Sans TC";font-style:italic;font-size:20px;font-weight:700;color:var(--accent);border-bottom:2px dashed var(--accent2);padding-bottom:6px;margin-top:8px;}

.pill-row{display:flex;gap:8px;flex-wrap:wrap;}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px;}
.legend span{display:flex;align-items:center;}

.mini-note{font-size:11.5px;color:var(--muted);display:flex;align-items:flex-start;gap:6px;margin-top:10px;}
.mini-note .material-symbols-outlined{font-size:15px;color:var(--accent);flex:none;}

.foot{text-align:center;padding:22px;color:var(--muted);font-size:11.5px;}

@media(max-width:820px){
  .split{grid-template-columns:1fr;}
  .kpis{grid-template-columns:1fr 1fr;}
  .grid2{grid-template-columns:1fr;}
  .grid3{grid-template-columns:1fr;}
}
@media(max-width:560px){
  .nav button .txt{display:none;}
  .nav button{padding:9px 12px;}
  .kpis{grid-template-columns:1fr 1fr;}
  .topchip.hidesm{display:none;}
}
/*splitfix*/.split>*{min-width:0}@media(max-width:860px){.split{grid-template-columns:1fr!important}}
</style></head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">verified_user</span></div>
      <div>
        <h1>OQC 出貨品質管制平台</h1>
        <p>Outgoing Quality Control · 從抽樣到出貨的品質閉環</p>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="topchip hidesm"><span class="material-symbols-outlined">factory</span>桃園一廠 · A 線</div>
    <div class="topchip"><span class="material-symbols-outlined">person</span>陳品保 · 品保部</div>
  </header>

  <nav class="nav" id="nav"></nav>

  <main class="wrap"><div id="screen"></div></main>

  <div class="foot">OQC 出貨品質管制平台 · 展示用途 · 所有資料皆為模擬</div>
</div>

<script>
"use strict";

var charts=[];
function clearCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function mk(id,opt){
  var el=document.getElementById(id); if(!el) return;
  opt.chart=opt.chart||{}; opt.chart.redrawOnParentResize=false; opt.chart.redrawOnWindowResize=false;
  opt.chart.animations={enabled:false}; opt.chart.toolbar={show:false}; opt.chart.fontFamily="Inter,'Noto Sans TC',sans-serif";
  try{var c=new ApexCharts(el,opt);c.render();charts.push(c);}catch(e){}
}
var AC="#c2410c", AC2="#fb923c";

var MODULES=[
  {icon:"assignment",name:"出貨檢驗計畫",sub:"依訂單與 AQL 產生抽樣計畫"},
  {icon:"checklist",name:"抽樣檢驗登錄",sub:"外觀/功能/包裝逐項登錄"},
  {icon:"gavel",name:"結果判定",sub:"允收/拒收與缺陷分級"},
  {icon:"verified",name:"放行簽核",sub:"品保放行與電子簽章"},
  {icon:"local_shipping",name:"出貨追溯",sub:"批號標籤比對與出貨紀錄"},
  {icon:"support_agent",name:"客訴回饋",sub:"出貨合格率與客訴率監控"}
];

function head(kick,title,desc){
  return '<div class="screen-head"><div class="kick">'+kick+'</div><h2>'+title+'</h2><p>'+desc+'</p></div>';
}
function avColor(s){var m={ok:"#16a34a",warn:"#d97706",bad:"#dc2626",info:"#0369a1"};return m[s]||AC;}
function kpi(icon,v,l,d){
  return '<div class="kpi"><span class="material-symbols-outlined">'+icon+'</span><div class="v">'+v+'</div><div class="l">'+l+'</div><div class="d '+(/↓/.test(d)?"down":"up")+'">'+d+'</div></div>';
}
function progRow(l,cur,max,txt){
  var pct=Math.round(cur/max*100);
  return '<div style="margin-bottom:13px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px"><span>'+l+'</span><b class="mono">'+(txt||(cur+" / "+max))+'</b></div><div class="bar"><i style="width:'+pct+'%"></i></div></div>';
}
function tli(on,t,tm,d){return '<div class="tl-item"><div class="tl-dot'+(on?" on":"")+'"></div><b>'+t+'</b> <span class="t">· '+tm+'</span><p>'+d+'</p></div>';}

/* SCREEN 0 — 出貨檢驗計畫 */
var PLANS=[
  {no:"OQC-2408-041",cust:"日盛電子",prod:"控制板 CB-220",lot:5000,aql:"1.0",n:200,due:"08/15",st:"ok",stx:"檢驗中"},
  {no:"OQC-2408-042",cust:"宏達精機",prod:"齒輪箱 GX-08",lot:1200,aql:"0.65",n:80,due:"08/15",st:"warn",stx:"待抽樣"},
  {no:"OQC-2408-043",cust:"友聯光電",prod:"面板模組 PM-13",lot:3200,aql:"1.5",n:125,due:"08/16",st:"info",stx:"已排入"},
  {no:"OQC-2408-044",cust:"台耀塑膠",prod:"外殼件 HS-51",lot:8000,aql:"2.5",n:315,due:"08/16",st:"warn",stx:"待抽樣"},
  {no:"OQC-2408-045",cust:"日盛電子",prod:"連接線 WC-77",lot:6000,aql:"1.0",n:200,due:"08/17",st:"info",stx:"已排入"}
];
function s0(){
  var rows=PLANS.map(function(p,i){
    return '<div class="listrow'+(i===0?' sel':'')+'"><div class="av" style="background:'+avColor(p.st)+'">'+p.cust.slice(0,1)+'</div>'
      +'<div class="lmain"><b>'+p.no+'</b><span>'+p.cust+' · '+p.prod+'</span></div>'
      +'<div class="lmeta"><span class="badge b-'+p.st+'">'+p.stx+'</span><div style="font-size:11px;color:var(--muted);margin-top:5px">交期 '+p.due+'</div></div></div>';
  }).join("");
  var sel=PLANS[0];
  var kp='<div class="kpis" style="margin-bottom:16px">'
    +kpi("inventory_2",sel.lot.toLocaleString(),"批量 (pcs)","AQL "+sel.aql+" 一般 II")
    +kpi("shuffle",sel.n,"抽樣數 n","允收 Ac=5 / 拒收 Re=6")
    +kpi("event",sel.due,"出貨交期","距今 1 天")
    +kpi("percent","36%","檢驗進度","已完成 72 / 200")+'</div>';
  var tbl='<div class="panel"><div class="panel-h"><span class="material-symbols-outlined">table_rows</span><h3>抽樣分配表</h3><span class="tag">MIL-STD-105E</span></div>'
    +'<div style="overflow-x:auto"><table><thead><tr><th>檢驗項目</th><th>檢驗方式</th><th>樣本數</th><th>Ac / Re</th><th>目前不良</th><th>狀態</th></tr></thead><tbody>'
    +[["外觀檢查","目視 / 標準色板",80,"5 / 6",1,"ok"],
      ["尺寸量測","卡尺 / CMM",40,"3 / 4",0,"ok"],
      ["功能測試","治具通電測試",50,"5 / 6",2,"warn"],
      ["包裝檢查","封箱 / 標籤核對",30,"3 / 4",0,"ok"]]
     .map(function(r){return '<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td class="mono">'+r[2]+'</td><td class="mono">'+r[3]+'</td><td class="mono">'+r[4]+'</td><td><span class="badge b-'+r[5]+'">'+(r[5]==="ok"?"合格":"觀察")+'</span></td></tr>';}).join("")
    +'</tbody></table></div></div>';
  var chart='<div class="panel" style="margin-top:16px"><div class="panel-h"><span class="material-symbols-outlined">stacked_bar_chart</span><h3>本週各線待檢批量</h3></div><div class="panel-b"><div style="overflow-x:auto"><div id="c0" style="min-height:230px;min-width:300px"></div></div></div></div>';
  var left='<div class="panel"><div class="panel-h"><span class="material-symbols-outlined">assignment</span><h3>出貨檢驗計畫</h3><span class="tag">5 筆</span></div>'+rows+'</div>';
  var right=kp+tbl+chart;
  return head("MODULE 01 · 出貨檢驗計畫","出貨檢驗計畫","選取一筆出貨批號，依 AQL 抽樣水準自動分配各檢驗項目樣本數與允收判定基準。")
    +'<div class="split">'+left+'<div style="min-width:0">'+right+'</div></div>';
}
function s0charts(){
  mk("c0",{chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"bar",height:230,stacked:true},
    plotOptions:{bar:{columnWidth:"46%",borderRadius:4}},
    colors:[AC,AC2,"#fed7aa"],
    series:[{name:"檢驗中",data:[3,2,1,2]},{name:"待抽樣",data:[2,3,2,1]},{name:"已排入",data:[1,1,3,2]}],
    xaxis:{categories:["A 線","B 線","C 線","D 線"]},
    yaxis:{title:{text:"批數"}},
    legend:{position:"top"},dataLabels:{enabled:false},grid:{borderColor:"#eee"}});
}

/* SCREEN 1 — 抽樣檢驗登錄 */
function s1(){
  var groups=[
    {t:"外觀檢查 (n=80)",items:[
      {n:"刮痕 / 壓傷",st:"ok",note:"0 / 80 不良"},
      {n:"色差 / 污漬",st:"ok",note:"1 / 80 不良 · 次要"},
      {n:"毛邊 / 缺料",st:"warn",note:"觀察中"}]},
    {t:"功能測試 (n=50)",items:[
      {n:"通電啟動",st:"ok",note:"50 / 50 通過"},
      {n:"訊號輸出",st:"bad",note:"2 / 50 異常 · 主要"},
      {n:"耐壓測試",st:"ok",note:"50 / 50 通過"}]},
    {t:"包裝檢查 (n=30)",items:[
      {n:"標籤批號",st:"ok",note:"30 / 30 一致"},
      {n:"防潮 / 緩衝",st:"ok",note:"合格"},
      {n:"箱嘜 / 數量",st:"warn",note:"1 箱數量待覆核"}]}
  ];
  function grp(g){
    var its=g.items.map(function(it){
      var ic=it.st==="ok"?"check":it.st==="bad"?"close":"priority_high";
      return '<div class="chk-item"><div class="chk-box" style="background:'+avColor(it.st)+'"><span class="material-symbols-outlined" style="font-size:17px">'+ic+'</span></div>'
        +'<div class="cmain"><b>'+it.n+'</b><span>'+it.note+'</span></div>'
        +'<span class="badge b-'+it.st+'">'+(it.st==="ok"?"合格":it.st==="bad"?"不良":"觀察")+'</span></div>';
    }).join("");
    return '<div class="panel"><div class="panel-h"><span class="material-symbols-outlined">fact_check</span><h3>'+g.t+'</h3></div><div class="panel-b">'+its+'</div></div>';
  }
  var left='<div class="panel"><div class="panel-h"><span class="material-symbols-outlined">checklist</span><h3>登錄進度</h3><span class="tag">OQC-2408-041</span></div><div class="panel-b">'
    +progRow("外觀檢查",80,80)+progRow("尺寸量測",40,40)+progRow("功能測試",42,50)+progRow("包裝檢查",30,30)
    +'<div class="mini-note"><span class="material-symbols-outlined">edit_note</span>檢驗員：王力宏 · 治具編號 JIG-A12</div></div></div>'
    +'<div class="panel" style="margin-top:16px"><div class="panel-h"><span class="material-symbols-outlined">radar</span><h3>缺陷分佈雷達</h3></div><div class="panel-b"><div id="c1" style="min-height:250px"></div></div></div>';
  var right='<div class="grid2">'+groups.map(grp).join("")+chkSummary()+'</div>';
  return head("MODULE 02 · 抽樣檢驗登錄","抽樣檢驗登錄","逐項登錄外觀、功能與包裝檢查結果，即時累計各項目不良數並比對雷達分佈。")
    +'<div class="split">'+left+'<div style="min-width:0">'+right+'</div></div>';
}
function chkSummary(){
  return '<div class="panel"><div class="panel-h"><span class="material-symbols-outlined">summarize</span><h3>登錄彙總</h3></div><div class="panel-b">'
    +'<div class="pill-row" style="margin-bottom:12px"><span class="badge b-ok">合格 6</span><span class="badge b-warn">觀察 2</span><span class="badge b-bad">不良 1</span></div>'

function show(i){
  clearCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){btns[k].classList.toggle("active",+btns[k].getAttribute("data-i")===i);}
  container.innerHTML=RENDER[i]();
  void container.offsetHeight;
  if(CHARTS[i])CHARTS[i]();
}

navEl.addEventListener("click",function(e){
  var b=e.target.closest("[data-i]"); if(!b)return; show(+b.getAttribute("data-i"));
});

show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();</script>
