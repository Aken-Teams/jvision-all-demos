<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>出貨品質檢驗管理</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#fff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000;
  --color-accent:#ea580c;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#1e293b;
  --color-card:#fff;
  --color-card-foreground:#1e293b;
  --color-muted:#e9eff8;
  --color-muted-foreground:#475569;
  --color-border:#e2e8f0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#1e293b;
  --muted:#475569;
  --line:#e2e8f0;
  --ok:#15803d;
  --warn:#a14405;
  --bad:#dc2626;
  --info:#075985;
  --shadow:7px 7px 0 #1e293b;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{scroll-behavior:auto}
body{
  background:
    linear-gradient(var(--color-border) 1px,transparent 1px),
    linear-gradient(90deg,var(--color-border) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Fira Sans",sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased
}
button,a,[role="button"],.listrow{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:500;
  font-style:normal;
  font-size:20px;
  line-height:1;
  vertical-align:middle
}
.app{min-height:100vh}
.topbar{
  position:sticky;
  top:0;
  z-index:30;
  display:flex;
  align-items:center;
  gap:16px;
  min-height:76px;
  padding:10px max(16px,calc((100vw - 1500px)/2));
  color:#fff;
  background:#111827;
  border-bottom:4px solid var(--color-accent)
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  display:grid;
  place-items:center;
  width:48px;
  height:48px;
  flex:none;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border:2px solid #fff;
  box-shadow:4px 4px 0 var(--color-accent)
}
.logo .material-symbols-outlined{font-size:27px}
.brand h1{
  margin:0;
  font-size:18px;
  font-weight:800;
  letter-spacing:.02em
}
.brand p{margin:1px 0 0;color:#cbd5e1;font-size:11px}
.spacer{flex:1}
.topchip{
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px 10px;
  color:#fff;
  background:#1e293b;
  border:1px solid #64748b;
  font-family:"Fira Code",monospace;
  font-size:11px;
  white-space:nowrap
}
.topchip .material-symbols-outlined{color:#93c5fd;font-size:17px}
.nav-shell{
  position:sticky;
  top:76px;
  z-index:25;
  background:var(--color-card);
  border-bottom:3px solid var(--ink)
}
.nav{
  display:flex;
  gap:0;
  max-width:1500px;
  margin:auto;
  padding:0;
  overflow-x:auto;
  scrollbar-width:thin
}
.nav button{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:50px;
  padding:8px 17px;
  color:var(--muted);
  background:#fff;
  border:0;
  border-right:1px solid var(--line);
  font:700 12px "Fira Sans",sans-serif;
  white-space:nowrap
}
.nav button:hover{background:var(--color-muted);color:var(--blue)}
.nav button.active{
  color:#fff;
  background:var(--blue);
  box-shadow:inset 0 -5px 0 var(--color-accent)
}
.nav .idx{
  display:grid;
  place-items:center;
  width:22px;
  height:22px;
  color:var(--ink);
  background:#fff;
  border:2px solid currentColor;
  font:700 10px "Fira Code",monospace
}
.nav button.active .idx{color:var(--ink)}
.wrap{width:100%;max-width:1500px;margin:auto;padding:26px 22px 42px}
.screen{animation:reveal .35s ease-out both}
.screen-head{
  position:relative;
  max-width:1040px;
  margin:0 0 22px;
  padding:20px 22px 20px 27px;
  background:#fff;
  border:3px solid var(--ink);
  box-shadow:var(--shadow)
}
.screen-head:before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:9px;
  background:var(--color-accent)
}
.screen-head .kick{
  color:var(--blue);
  font:700 11px "Fira Code",monospace;
  letter-spacing:.12em
}
.screen-head h2{
  margin:4px 0 3px;
  font-size:clamp(25px,3vw,38px);
  line-height:1.1;
  font-weight:800;
  letter-spacing:-.035em
}
.screen-head p{max-width:780px;margin:0;color:var(--muted);font-size:13px}
.split{
  display:grid;
  grid-template-columns:minmax(290px,.72fr) minmax(0,1.7fr);
  gap:18px;
  align-items:start
}
.split>*{min-width:0}
.panel{
  min-width:0;
  background:var(--color-card);
  border:2px solid var(--ink);
  box-shadow:4px 4px 0 #cbd5e1
}
.panel-h{
  display:flex;
  align-items:center;
  gap:9px;
  min-height:49px;
  padding:10px 13px;
  background:var(--color-muted);
  border-bottom:2px solid var(--ink)
}
.panel-h .material-symbols-outlined{color:var(--blue)}
.panel-h h3{
  flex:1;
  min-width:0;
  margin:0;
  font-size:13px;
  font-weight:800
}
.panel-h .tag{
  color:var(--muted);
  font:600 10px "Fira Code",monospace;
  white-space:nowrap
}
.panel-b{padding:15px}
.listrow{
  display:flex;
  gap:11px;
  min-height:66px;
  padding:12px 13px;
  border-bottom:1px solid var(--line);
  background:#fff
}
.listrow:last-child{border-bottom:0}
.listrow:hover{background:#eff6ff}
.listrow.sel{
  padding-left:9px;
  background:#dbeafe;
  border-left:6px solid var(--blue)
}
.av{
  display:grid;
  place-items:center;
  width:38px;
  height:38px;
  flex:none;
  color:#fff;
  border:2px solid var(--ink);
  font:800 12px "Fira Code",monospace
}
.lmain{flex:1;min-width:0}
.lmain b{
  display:block;
  overflow:hidden;
  font:700 12px "Fira Code",monospace;
  text-overflow:ellipsis;
  white-space:nowrap
}
.lmain span{color:var(--muted);font-size:11px}
.lmeta{flex:none;text-align:right}
.badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 7px;
  border:1px solid currentColor;
  font-size:10px;
  font-weight:800;
  white-space:nowrap
}
.badge:before{
  content:"";
  width:6px;
  height:6px;
  background:currentColor
}
.b-ok{color:#166534;background:#dcfce7}
.b-warn{color:#92400e;background:#fef3c7}
.b-bad{color:#991b1b;background:#fee2e2}
.b-info{color:#075985;background:#e0f2fe}
.b-mut{color:#475569;background:#f1f5f9}
.kpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px
}
.kpi{
  position:relative;
  min-height:130px;
  padding:14px;
  overflow:hidden;
  background:#fff;
  border:2px solid var(--ink)
}
.kpi:nth-child(2){transform:translateY(5px)}
.kpi:after{
  content:"";
  position:absolute;
  top:0;
  right:0;
  width:31px;
  height:31px;
  background:var(--color-accent);
  clip-path:polygon(100% 0,100% 100%,0 0)
}
.kpi .material-symbols-outlined{color:var(--blue);font-size:21px}
.kpi .v{
  margin-top:11px;
  color:#0f172a;
  font:800 25px "Fira Code",monospace;
  line-height:1.05
}
.kpi .l{margin-top:5px;color:var(--muted);font-size:11px}
.kpi .d{margin-top:5px;font-size:10px;font-weight:700}
.up{color:var(--ok)}
.down{color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
table{width:100%;max-width:100%;border-collapse:collapse;font-size:12px}
th{
  padding:10px 11px;
  color:#fff;
  background:#1e293b;
  border-right:1px solid #64748b;
  border-bottom:2px solid var(--ink);
  font-size:10px;
  font-weight:700;
  letter-spacing:.03em;
  text-align:left;
  white-space:nowrap
}
th:last-child{border-right:0}
td{
  padding:10px 11px;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  white-space:nowrap
}
td:last-child{border-right:0}
tbody tr:nth-child(even){background:#f8fafc}
tbody tr:hover{background:#eff6ff}
tbody tr:last-child td{border-bottom:0}
td.mono,.mono{
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums
}
td.mono:not(:first-child){text-align:right}
.bar{
  height:10px;
  overflow:hidden;
  background:#e2e8f0;
  border:1px solid var(--ink)
}
.bar>i{
  display:block;
  height:100%;
  background:repeating-linear-gradient(135deg,var(--blue) 0 8px,#60a5fa 8px 15px)
}
.chk-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px 0;
  border-bottom:1px solid var(--line)
}
.chk-item:last-child{border-bottom:0}
.chk-box{
  display:grid;
  place-items:center;
  width:27px;
  height:27px;
  flex:none;
  color:#fff;
  border:2px solid var(--ink)
}
.cmain{flex:1;min-width:0}
.cmain b{display:block;font-size:12px}
.cmain span{display:block;color:var(--muted);font-size:10px}
.matrix{
  display:grid;
  grid-template-columns:72px repeat(3,minmax(64px,1fr));
  gap:4px;
  min-width:330px
}
.mh,.rl{
  display:grid;
  place-items:center;
  min-height:30px;
  color:var(--muted);
  font:700 10px "Fira Code",monospace
}
.mc{
  padding:12px 8px;
  color:#fff;
  border:1px solid var(--ink);
  text-align:center;
  font:800 13px "Fira Code",monospace
}
.legend{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:10px;
  color:var(--muted);
  font-size:10px
}
.legend span{display:flex;align-items:center}
.dot{
  display:inline-block;
  width:9px;
  height:9px;
  margin-right:5px;
  border:1px solid var(--ink)
}
.tl{position:relative;padding-left:27px}
.tl:before{
  content:"";
  position:absolute;
  top:5px;
  bottom:5px;
  left:9px;
  width:3px;
  background:var(--ink)
}
.tl-item{position:relative;padding-bottom:19px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{
  position:absolute;
  top:2px;
  left:-25px;
  width:16px;
  height:16px;
  background:#94a3b8;
  border:3px solid #fff;
  box-shadow:0 0 0 2px var(--ink)
}
.tl-dot.on{background:var(--blue)}
.tl-item b{font-size:12px}
.tl-item .t{color:var(--muted);font:10px "Fira Code",monospace}
.tl-item p{margin:3px 0 0;color:var(--muted);font-size:11px}
.signcard{
  padding:14px;
  background:#fff;
  border:2px solid var(--ink);
  box-shadow:4px 4px 0 #bfdbfe
}
.signcard .sig{
  margin-top:9px;
  padding-bottom:5px;
  color:var(--blue);
  border-bottom:3px solid var(--color-accent);
  font-size:19px;
  font-weight:800;
  font-style:italic
}
.pill-row{display:flex;flex-wrap:wrap;gap:7px}
.mini-note{
  display:flex;
  align-items:flex-start;
  gap:7px;
  margin-top:10px;
  padding:9px;
  color:#334155;
  background:#fff7ed;
  border-left:5px solid var(--color-accent);
  font-size:10px
}
.mini-note .material-symbols-outlined{flex:none;color:var(--color-accent);font-size:16px}
.foot{
  padding:22px;
  color:#cbd5e1;
  background:#111827;
  border-top:4px solid var(--color-accent);
  font:10px "Fira Code",monospace;
  text-align:center
}
.mt{margin-top:16px}
.mb{margin-bottom:16px}
.scroll{overflow-x:auto}
@keyframes reveal{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:none}
}
@media(max-width:1024px){
  .split{grid-template-columns:minmax(260px,.8fr) minmax(0,1.5fr)}
  .kpis{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:820px){
  .topbar{position:relative;top:auto}
  .nav-shell{top:0}
  .split,.grid2,.grid3{grid-template-columns:1fr}
  .kpi:nth-child(2){transform:none}
}
@media(max-width:560px){
  .topbar{padding:10px 13px}
  .brand h1{font-size:15px}
  .brand p{white-space:normal}
  .topchip{display:none}
  .nav button{padding:8px 13px}
  .nav .txt{display:none}
  .wrap{padding:18px 12px 30px}
  .screen-head{padding:17px 14px 17px 21px;box-shadow:4px 4px 0 var(--ink)}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi{min-height:124px;padding:12px}
  .kpi .v{font-size:21px}
  .panel-b{padding:12px}
}
@media(max-width:390px){
  .kpis{grid-template-columns:1fr}
  .brand p{display:none}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important
  }
  .screen{animation:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined" aria-hidden="true">verified_user</span></div>
      <div>
        <h1>出貨品質檢驗管理</h1>
        <p>OUTGOING QUALITY CONTROL · 從抽樣到出貨的品質閉環</p>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="topchip"><span class="material-symbols-outlined" aria-hidden="true">factory</span>桃園一廠 · A 線</div>
    <div class="topchip"><span class="material-symbols-outlined" aria-hidden="true">person</span>陳品保 · 品保部</div>
  </header>
  <div class="nav-shell"><nav class="nav" id="nav" aria-label="功能模組"></nav></div>
  <main class="wrap"><div id="screen" class="screen"></div></main>
  <footer class="foot">出貨品質檢驗管理 · 展示用途 · 所有資料皆為模擬</footer>
</div>
<script>
"use strict";
var charts=[];
var AC="#2563eb",AC2="#ea580c";
function clearCharts(){
  charts.forEach(function(c){try{c.destroy()}catch(e){}});
  charts=[];
}
function mk(id,opt){
  var el=document.getElementById(id);
  if(!el||typeof ApexCharts==="undefined")return;
  opt.chart=opt.chart||{};
  opt.chart.redrawOnParentResize=false;
  opt.chart.redrawOnWindowResize=false;
  opt.chart.animations={enabled:false};
  opt.chart.toolbar={show:false};
  opt.chart.fontFamily="'Fira Sans',sans-serif";
  opt.theme={mode:"light"};
  opt.tooltip=opt.tooltip||{};
  opt.tooltip.theme="light";
  try{
    var c=new ApexCharts(el,opt);
    c.render();
    charts.push(c)
  }catch(e){}
}
var MODULES=[
  {icon:"assignment",name:"出貨檢驗計畫"},
  {icon:"checklist",name:"抽樣檢驗登錄"},
  {icon:"gavel",name:"結果判定"},
  {icon:"verified",name:"放行簽核"},
  {icon:"local_shipping",name:"出貨追溯"},
  {icon:"support_agent",name:"客訴回饋"}
];
function head(kick,title,desc){
  return '<div class="screen-head"><div class="kick">'+kick+'</div><h2>'+title+'</h2><p>'+desc+'</p></div>'
}
function avColor(s){
  return {ok:"#15803d",warn:"#a14405",bad:"#dc2626",info:"#075985"}[s]||AC
}
function statusIcon(s){
  return s==="ok"?"check":s==="bad"?"close":s==="warn"?"priority_high":"info"
}
function kpi(icon,v,l,d){
  return '<div class="kpi"><span class="material-symbols-outlined" aria-hidden="true">'+icon+'</span><div class="v">'+v+'</div><div class="l">'+l+'</div><div class="d '+(/↓/.test(d)?"down":"up")+'">'+d+'</div></div>'
}
function progRow(l,cur,max,txt){
  var pct=Math.round(cur/max*100);
  return '<div style="margin-bottom:13px"><div style="display:flex;justify-content:space-between;gap:12px;font-size:12px;margin-bottom:5px"><span>'+l+'</span><b class="mono">'+(txt||(cur+" / "+max))+'</b></div><div class="bar" role="progressbar" aria-label="'+l+'" aria-valuemin="0" aria-valuemax="'+max+'" aria-valuenow="'+cur+'"><i style="width:'+pct+'%"></i></div></div>'
}
function tli(on,t,tm,d){
  return '<div class="tl-item"><div class="tl-dot'+(on?" on":"")+'"></div><b>'+t+'</b> <span class="t">· '+tm+'</span><p>'+d+'</p></div>'
}
var PLANS=[
  {no:"OQC-2408-041",cust:"O盛電子",prod:"控制板 CB-220",lot:5000,aql:"1.0",n:200,due:"08/15",st:"ok",stx:"檢驗中"},
  {no:"OQC-2408-042",cust:"O達精機",prod:"齒輪箱 GX-08",lot:1200,aql:"0.65",n:80,due:"08/15",st:"warn",stx:"待抽樣"},
  {no:"OQC-2408-043",cust:"O聯光電",prod:"面板模組 PM-13",lot:3200,aql:"1.5",n:125,due:"08/16",st:"info",stx:"已排入"},
  {no:"OQC-2408-044",cust:"O耀塑膠",prod:"外殼件 HS-51",lot:8000,aql:"2.5",n:315,due:"08/16",st:"warn",stx:"待抽樣"},
  {no:"OQC-2408-045",cust:"O盛電子",prod:"連接線 WC-77",lot:6000,aql:"1.0",n:200,due:"08/17",st:"info",stx:"已排入"}
];
function s0(){
  var rows=PLANS.map(function(p,i){
    return '<div class="listrow'+(i===0?' sel':'')+'" tabindex="0"><div class="av" style="background:'+avColor(p.st)+'"><span class="material-symbols-outlined" aria-hidden="true">'+statusIcon(p.st)+'</span></div><div class="lmain"><b>'+p.no+'</b><span>'+p.cust+' · '+p.prod+'</span></div><div class="lmeta"><span class="badge b-'+p.st+'">'+p.stx+'</span><div class="mono" style="font-size:10px;color:var(--muted);margin-top:5px">交期 '+p.due+'</div></div></div>'
  }).join("");
  var sel=PLANS[0];
  var kp='<div class="kpis mb">'+
    kpi("inventory_2",sel.lot.toLocaleString(),"批量 (pcs)","AQL "+sel.aql+" 一般 II")+
    kpi("shuffle",sel.n,"抽樣數 n","允收 Ac=5 / 拒收 Re=6")+
    kpi("event",sel.due,"出貨交期","距今 1 天")+
    kpi("percent","36%","檢驗進度","已完成 72 / 200")+'</div>';
  var data=[
    ["外觀檢查","目視 / 標準色板",80,"5 / 6",1,"ok"],
    ["尺寸量測","卡尺 / CMM",40,"3 / 4",0,"ok"],
    ["功能測試","治具通電測試",50,"5 / 6",2,"warn"],
    ["包裝檢查","封箱 / 標籤核對",30,"3 / 4",0,"ok"]

  mk("c5b",{chart:{type:"bar",height:250},colors:[AC2],plotOptions:{bar:{columnWidth:"50%",borderRadius:0}},series:[{name:"客訴件數",data:[7,5,6,4,5,3,4,2]}],xaxis:{categories:wk},yaxis:{title:{text:"件"}},dataLabels:{enabled:true},legend:{show:false},grid:{borderColor:"#cbd5e1"}})
}
var RENDER=[s0,s1,s2,s3,s4,s5];
var CHARTS=[s0charts,s1charts,s2charts,null,null,s5charts];
var container=document.getElementById("screen");
var navEl=document.getElementById("nav");
navEl.innerHTML=MODULES.map(function(m,i){
  return '<button type="button" data-i="'+i+'" aria-label="'+m.name+'"><span class="idx">'+String(i+1).padStart(2,"0")+'</span><span class="material-symbols-outlined" aria-hidden="true">'+m.icon+'</span><span class="txt">'+m.name+'</span></button>'
}).join("");
function show(i){
  i=Math.max(0,Math.min(i,RENDER.length-1));
  clearCharts();
  document.querySelectorAll("[data-i]").forEach(function(btn){
    var active=Number(btn.getAttribute("data-i"))===i;
    btn.classList.toggle("active",active);
    btn.setAttribute("aria-current",active?"page":"false")
  });
  container.classList.remove("screen");
  container.innerHTML=RENDER[i]();
  void container.offsetHeight;
  container.classList.add("screen");
  if(CHARTS[i])CHARTS[i]()
}
navEl.addEventListener("click",function(e){
  var b=e.target.closest("[data-i]");
  if(!b)return;
  var i=Number(b.getAttribute("data-i"));
  if(location.hash==="#go="+i)show(i);
  else location.hash="go="+i
});
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  show(m?Math.min(Number(m[1]),5):0);
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
