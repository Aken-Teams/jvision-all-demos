<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>客戶信用管理 Credit Management</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#6d28d9; --accent2:#8b5cf6; --accent-soft:#ede9fe;
  --bg:#f5f4fb; --card:#ffffff; --ink:#1e1b2e; --muted:#6b6880;
  --line:#e8e5f2; --ok:#059669; --warn:#d97706; --bad:#dc2626;
  --sidebar:#1c1830; --sidebar2:#2a2342;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;
  line-height:1;letter-spacing:normal;vertical-align:middle;}
.app{display:flex;min-height:100vh;}
.sidebar{width:250px;flex-shrink:0;background:var(--sidebar);color:#e7e4f2;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08);}
.brand .logo{display:flex;align-items:center;gap:11px;}
.brand .logo .mk{width:38px;height:38px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;}
.brand .logo .mk .material-symbols-outlined{font-size:22px;}
.brand .tt{font-weight:800;font-size:15px;line-height:1.25;letter-spacing:.2px;}
.brand .st{font-size:11px;color:#9d98b8;margin-top:2px;}
.navlist{padding:14px 12px;display:flex;flex-direction:column;gap:4px;flex:1;}
.navbtn{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:11px;
  background:transparent;border:0;color:#c3bfda;cursor:pointer;font-family:inherit;font-size:13.5px;
  font-weight:600;text-align:left;width:100%;min-width:0;transition:background .15s,color .15s;}
.navbtn .material-symbols-outlined{font-size:21px;flex-shrink:0;}
.navbtn .nlab{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.navbtn:hover{background:rgba(255,255,255,.06);color:#fff;}
.navbtn.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  box-shadow:0 6px 16px -6px rgba(109,40,217,.7);}
.navbtn .idx{margin-left:auto;font-size:11px;opacity:.6;font-weight:700;}
.navbtn.active .idx{opacity:.85;}
.sidefoot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#8f8ab0;}
.sidefoot b{color:#cfc9e6;}
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:15px 26px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:5;}
.topbar .ptitle{font-weight:800;font-size:17px;min-width:0;}
.topbar .psub{font-size:12px;color:var(--muted);margin-top:2px;}
.topbar .spacer{flex:1;min-width:12px;}
.chipband{display:flex;gap:8px;flex-wrap:wrap;}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
  padding:6px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent);}
.chip .material-symbols-outlined{font-size:15px;}
.content{padding:24px 26px 42px;min-width:0;}
.grid{display:grid;gap:16px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:2fr 1fr;}
.g32{grid-template-columns:1.4fr 1fr;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;
  box-shadow:0 1px 3px rgba(30,27,46,.04);}
.card h3{margin:0 0 3px;font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
.card .csub{font-size:11.5px;color:var(--muted);margin:0 0 14px;}
.kpi{position:relative;overflow:hidden;}
.kpi .klab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px;}
.kpi .klab .material-symbols-outlined{font-size:18px;}
.kpi .kval{font-size:29px;font-weight:800;margin-top:9px;letter-spacing:-.5px;}
.kpi .kval small{font-size:14px;font-weight:700;color:var(--muted);margin-left:3px;}
.kpi .kfoot{font-size:11.5px;margin-top:7px;font-weight:600;display:flex;align-items:center;gap:5px;}
.kpi .kfoot .material-symbols-outlined{font-size:15px;}
.up{color:var(--ok);}.down{color:var(--bad);}.flat{color:var(--muted);}
.kpi .bar{position:absolute;left:0;top:0;width:5px;height:100%;background:linear-gradient(var(--accent),var(--accent2));}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px;}
th{text-align:left;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;
  letter-spacing:.4px;padding:9px 12px;border-bottom:2px solid var(--line);white-space:nowrap;}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:0;}
tbody tr:hover{background:#faf9fe;}
.tw{overflow-x:auto;border-radius:10px;}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;
  padding:3px 9px;border-radius:999px;white-space:nowrap;}
.b-ok{background:#dcfce7;color:#15803d;}
.b-warn{background:#fef3c7;color:#b45309;}
.b-bad{background:#fee2e2;color:#b91c1c;}
.b-info{background:#ede9fe;color:#6d28d9;}
.b-grey{background:#eef0f4;color:#4b5563;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:2px;}
.mono{font-variant-numeric:tabular-nums;font-weight:700;}
.progress{height:8px;border-radius:999px;background:#eee8f7;overflow:hidden;min-width:60px;}
.progress>span{display:block;height:100%;border-radius:999px;}
.rating{font-weight:800;font-size:13px;padding:2px 9px;border-radius:8px;display:inline-block;}
.avatar{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);
  display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0;}
.chartbox{overflow:hidden;min-width:0;}
.scorewrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
.scorering{width:150px;height:150px;flex-shrink:0;position:relative;}
.scoreinfo{min-width:0;flex:1;}
.scoreinfo .sbig{font-size:15px;font-weight:800;}
.scoreinfo .srow{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--line);}
.scoreinfo .srow span:first-child{color:var(--muted);}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0;}
.bcol{background:#f7f6fc;border:1px solid var(--line);border-radius:13px;padding:12px;min-width:0;}
.bcol .bh{font-size:12px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:6px;justify-content:space-between;}
.bcol .bh .cnt{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--muted);}
.bcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:9px;
  box-shadow:0 1px 2px rgba(30,27,46,.04);}
.bcard:last-child{margin-bottom:0;}
.bcard .bt{font-weight:700;font-size:12.5px;}
.bcard .bm{font-size:11px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:8px;}
.bcard .bamt{font-weight:800;color:var(--ink);}
.ltop{border-top:3px solid var(--accent);}
.timeline{position:relative;padding-left:26px;}
.timeline:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tev{position:relative;padding-bottom:18px;}
.tev:last-child{padding-bottom:0;}
.tev .tdot{position:absolute;left:-25px;top:2px;width:16px;height:16px;border-radius:50%;
  background:#fff;border:3px solid var(--accent);}
.tev.done .tdot{background:var(--accent);}
.tev .thd{font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.tev .tdt{font-size:11px;color:var(--muted);font-weight:600;}
.tev .tbody{font-size:12px;color:var(--muted);margin-top:4px;}
.alertitem{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;align-items:flex-start;}
.alertitem:last-child{margin-bottom:0;}
.alertitem .aic{width:34px;height:34px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.alertitem .aic .material-symbols-outlined{font-size:20px;}
.alertitem .abody{min-width:0;flex:1;}
.alertitem .at{font-weight:700;font-size:13px;}
.alertitem .ad{font-size:11.5px;color:var(--muted);margin-top:2px;}
.pill-input{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.pill-input .pi{background:#f2f0fa;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;min-width:0;}
.pill-input .pi b{display:block;font-size:10.5px;color:var(--muted);font-weight:700;margin-bottom:2px;}
.legendrow{display:flex;flex-wrap:wrap;gap:14px;font-size:11.5px;color:var(--muted);margin-top:10px;}
.legendrow span{display:inline-flex;align-items:center;gap:5px;}
.miniStat{display:flex;gap:14px;flex-wrap:wrap;margin-top:4px;}
.miniStat .ms{min-width:0;}
.miniStat .ms .v{font-size:20px;font-weight:800;}
.miniStat .ms .l{font-size:11px;color:var(--muted);}
.approve-row{display:flex;align-items:center;gap:8px;}
.stepper{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.stepper .sp{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--muted);}
.stepper .sp .n{width:20px;height:20px;border-radius:50%;background:#eee8f7;color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:11px;}
.stepper .sp.on .n{background:var(--accent);color:#fff;}
.stepper .sp.on{color:var(--ink);}
.stepper .arw{color:var(--line);}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr);}}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
  .board{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:860px){
  .app{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:relative;flex-direction:column;}
  .navlist{flex-direction:row;flex-wrap:wrap;padding:10px;}
  .navbtn{width:auto;flex:0 0 auto;}
  .navbtn .idx{display:none;}
  .sidefoot{display:none;}
}
@media(max-width:560px){
  .navbtn .nlab{display:none;}
  .navbtn{padding:10px;}
  .content{padding:16px 14px 34px;}
  .topbar{padding:13px 15px;}
  .board{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">
        <div class="mk"><span class="material-symbols-outlined">shield</span></div>
        <div>
          <div class="tt">客戶信用管理</div>
          <div class="st">Credit Management</div>
        </div>
      </div>
    </div>
    <nav class="navlist" id="nav"></nav>
    <div class="sidefoot">
      財務部 · 信用部 · 授信部<br/>
      <b>純 UI 展示</b>　資料為擬真示範
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div style="min-width:0">
        <div class="ptitle" id="ptitle">信用風險儀表板</div>
        <div class="psub" id="psub">全客戶信用暴險與逾期概況總覽</div>
      </div>
      <div class="spacer"></div>
      <div class="chipband">
        <span class="chip"><span class="material-symbols-outlined">calendar_month</span>2026-08-14</span>
        <span class="chip"><span class="material-symbols-outlined">sync</span>ERP · CRM 已同步</span>
      </div>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>
<script>
"use strict";
var MODS=[
  {icon:"monitoring",name:"信用風險儀表板",sub:"全客戶信用暴險與逾期概況總覽"},
  {icon:"fact_check",name:"新客戶徵信評分",sub:"財報與外部徵信計算信用評分與建議額度"},
  {icon:"gavel",name:"授信額度審批",sub:"額度申請分級簽核、覆核與生效管理"},
  {icon:"rule",name:"訂單額度檢核",sub:"接單即時比對可用額度並攔截超限訂單"},
  {icon:"warning",name:"逾期帳款預警",sub:"帳齡分析、逾期分級與催收任務追蹤"},
  {icon:"history",name:"定期覆核調整",sub:"週期性重新評分、額度調整與稽核軌跡"}
];
var charts=[];
function destroyCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function mk(id,opt){
  var el=document.getElementById(id);
  if(!el)return;
  opt.chart=opt.chart||{};
  opt.chart.redrawOnParentResize=false;
  opt.chart.redrawOnWindowResize=false;
  opt.chart.animations={enabled:false};
  opt.chart.fontFamily='Inter,"Noto Sans TC",sans-serif';
  opt.chart.toolbar={show:false};
  try{var c=new ApexCharts(el,opt);c.render();charts.push(c);}catch(e){}
}

/* ============ SCREEN 0 : DASHBOARD ============ */
function s0(){
  return ''+
  '<div class="grid g4">'+
    kpi("暴險客戶總額","$ 8.62","億","account_tree","已核授信額度使用 71%","flat","trending_up")+
    kpi("逾期帳款比率","4.3","%","warning","較上月 -1.2pp","up","trending_down")+
    kpi("呆帳率","0.68","%","gavel","控制於目標 1% 內","up","trending_down")+
    kpi("待審授信案","12","件","fact_check","3 件逾 SLA","down","priority_high")+
  '</div>'+
  '<div class="grid g23" style="margin-top:16px">'+
    '<div class="card"><h3><span class="material-symbols-outlined">insights</span>近 6 週逾期比率 vs 呆帳率</h3>'+
      '<p class="csub">逾期帳款比率持續下降，呆帳率維持低檔</p>'+
      '<div class="chartbox" id="c0a" style="height:280px"></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">shield</span>信用評等分布</h3>'+
      '<p class="csub">全體 316 家往來客戶</p>'+
      '<div class="chartbox" id="c0b" style="height:280px"></div></div>'+
  '</div>'+
  '<div class="grid g32" style="margin-top:16px">'+
    '<div class="card"><h3><span class="material-symbols-outlined">priority_high</span>高風險客戶關注清單</h3>'+
      '<p class="csub">依綜合風險分數由高至低排序</p>'+
      '<div class="tw"><table><thead><tr><th>客戶</th><th>評等</th><th>額度使用率</th><th>逾期金額</th><th>狀態</th></tr></thead><tbody>'+
        watchRow("宏達精密工業","C","W",118,"$ 4,820,000","b-bad","已凍結")+
        watchRow("台興電子","B-","warn",92,"$ 1,260,000","b-warn","催收中")+
        watchRow("永豐機械","B","warn",88,"$ 640,000","b-warn","觀察")+
        watchRow("鼎新塑膠","C+","W",96,"$ 2,110,000","b-bad","催收中")+
        watchRow("光洋科技","B-","warn",81,"$ 0","b-info","覆核中")+
      '</tbody></table></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">receipt_long</span>本週作業概況</h3>'+
      '<p class="csub">跨部門處理進度</p>'+
      alertItem("var(--accent)","fact_check","新客戶徵信 6 件","信用部本週完成 4 件、待補件 2 件")+
      alertItem("#d97706","rule","訂單超限攔截 9 筆","累計攔截金額 $ 3.4M，5 筆已例外放行")+
      alertItem("#dc2626","warning","新增逾期 3 家","合計逾期 $ 5.9M，已指派催收")+
      alertItem("#059669","task_alt","額度覆核 8 家","調升 3 家、調降 2 家、維持 3 家")+
    '</div>'+
  '</div>';
}
function kpi(l,v,u,ic,f,cls,fic){
  return '<div class="card kpi"><span class="bar"></span>'+
    '<div class="klab"><span class="material-symbols-outlined">'+ic+'</span>'+l+'</div>'+
    '<div class="kval">'+v+'<small>'+u+'</small></div>'+
    '<div class="kfoot '+cls+'"><span class="material-symbols-outlined">'+fic+'</span>'+f+'</div></div>';
}
function watchRow(n,rt,rc,use,amt,bc,st){
  var rcol=rc==="W"?"#dc2626":(rc==="warn"?"#d97706":"#059669");
  var bcol=use>=100?"#dc2626":(use>=85?"#d97706":"#8b5cf6");
  return '<tr><td><div class="approve-row"><span class="avatar">'+n.charAt(0)+'</span><b>'+n+'</b></div></td>'+
    '<td><span class="rating" style="background:'+rcol+'22;color:'+rcol+'">'+rt+'</span></td>'+
    '<td><div class="approve-row"><div class="progress" style="width:80px"><span style="width:'+Math.min(use,100)+'%;background:'+bcol+'"></span></div><span class="mono" style="font-size:11.5px">'+use+'%</span></div></td>'+
    '<td class="mono">'+amt+'</td>'+
    '<td><span class="badge '+bc+'">'+st+'</span></td></tr>';
}
function alertItem(col,ic,t,d){
  return '<div class="alertitem"><div class="aic" style="background:'+col+'1a;color:'+col+'"><span class="material-symbols-outlined">'+ic+'</span></div>'+
    '<div class="abody"><div class="at">'+t+'</div><div class="ad">'+d+'</div></div></div>';
}
function chart0(){
  mk("c0a",{
    series:[{name:"逾期帳款比率 %",data:[8.6,7.4,6.5,5.8,5.1,4.3]},
            {name:"呆帳率 %",data:[1.4,1.2,1.05,0.9,0.78,0.68]}],
    chart:{type:"area",height:280},
    colors:["#8b5cf6","#dc2626"],
    dataLabels:{enabled:false},
    stroke:{curve:"smooth",width:3},
    fill:{type:"gradient",gradient:{opacityFrom:.35,opacityTo:.02}},
    xaxis:{categories:["第1週","第2週","第3週","第4週","第5週","第6週"],labels:{style:{fontSize:"11px"}}},
    yaxis:{labels:{formatter:function(v){return v.toFixed(1);}}},
    grid:{borderColor:"#eee8f7"},
    legend:{position:"top",fontSize:"12px"},
    height:280
  });
  mk("c0b",{
    series:[64,102,88,42,20],
    chart:{type:"donut",height:280},
    labels:["AAA / AA","A","BBB / BB","B","C 以下"],
    colors:["#059669","#8b5cf6","#6d28d9","#d97706","#dc2626"],
    dataLabels:{enabled:false},
    legend:{position:"bottom",fontSize:"12px"},
    plotOptions:{pie:{donut:{size:"62%",labels:{show:true,total:{show:true,label:"往來客戶",fontSize:"12px",formatter:function(){return "316 家";}}}}}},
    height:280
  });
}

/* ============ SCREEN 1 : SCORING ============ */
function s1(){
  return ''+
  '<div class="pill-input">'+
    '<div class="pi"><b>受評客戶</b>新光金屬股份有限公司</div>'+
    '<div class="pi"><b>統一編號</b>28451930</div>'+
    '<div class="pi"><b>產業</b>金屬加工</div>'+
    '<div class="pi"><b>徵信來源</b>財報 · 聯徵 · 交易紀錄</div>'+
    '<div class="pi"><b>申請額度</b>$ 3,000,000</div>'+
  '</div>'+
  '<div class="grid g23">'+
    '<div class="card"><h3><span class="material-symbols-outlined">fact_check</span>綜合信用評分</h3>'+
      '<p class="csub">加權六大構面產出評分與建議授信額度</p>'+
      '<div class="scorewrap">'+

    '<div class="tbody">'+body+'</div></div>';
}
function rvRow(n,o,nw,oa,na,dir){
  var m={up:["b-ok","調升","arrow_upward"],down:["b-bad","調降","arrow_downward"],flat:["b-grey","維持","remove"]};
  var d=m[dir]||m.flat;
  return '<tr><td><b>'+n+'</b></td><td><span class="badge b-grey">'+o+'</span></td>'+
    '<td><span class="badge b-info">'+nw+'</span></td>'+
    '<td class="mono" style="color:var(--muted)">'+oa+'</td>'+
    '<td class="mono">'+na+'</td>'+
    '<td><span class="badge '+d[0]+'"><span class="material-symbols-outlined" style="font-size:13px">'+d[2]+'</span>'+d[1]+'</span></td></tr>';
}

/* ============ ROUTER ============ */
var SCREENS=[
  {r:s0,c:chart0},{r:s1,c:chart1},{r:s2,c:chart2},
  {r:s3,c:chart3},{r:s4,c:chart4},{r:s5,c:chart5}
];
function buildNav(){
  var nav=document.getElementById("nav");
  var h="";
  for(var i=0;i<MODS.length;i++){
    h+='<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span>'+
       '<span class="nlab">'+MODS[i].name+'</span><span class="idx">0'+(i+1)+'</span></button>';
  }
  nav.innerHTML=h;
  var btns=nav.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){
    btns[k].addEventListener("click",function(){show(+this.getAttribute("data-i"));});
  }
}
function show(i){
  destroyCharts();
  var sc=SCREENS[i];if(!sc)return;
  var view=document.getElementById("view");
  view.innerHTML=sc.r();
  document.getElementById("ptitle").textContent=MODS[i].name;
  document.getElementById("psub").textContent=MODS[i].sub;
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){
    if(+btns[k].getAttribute("data-i")===i)btns[k].classList.add("active");
    else btns[k].classList.remove("active");
  }
  void view.offsetHeight;
  if(sc.c)sc.c();
  try{window.scrollTo(0,0);}catch(e){}
}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
