<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>客戶信用管理 Credit Management</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;--color-on-primary:#fff;--color-secondary:#3b82f6;
  --color-on-secondary:#000;--color-accent:#059669;--color-on-accent:#000;
  --color-background:#f8fafc;--color-foreground:#0f172a;--color-card:#fff;
  --color-card-foreground:#0f172a;--color-muted:#f1f5fd;--color-muted-foreground:#475569;
  --color-border:#e4ecfc;--color-destructive:#dc2626;--color-on-destructive:#fff;
  --color-ring:#2563eb;--blue:#2563eb;--ink:#0f172a;--muted:#475569;--line:#e4ecfc;
  --ok:#047857;--warn:#a85b05;--bad:#b91c1c;--sidebar:#fff;--radius:8px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Crimson Pro","Noto Serif TC",Georgia,serif;font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased}
button{font:inherit}
button,a{cursor:pointer}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;vertical-align:middle}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:auto;z-index:20}
.brand{padding:24px 20px 20px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:12px}
.mk{width:38px;height:38px;display:grid;place-items:center;background:var(--blue);color:#fff;border-radius:6px}
.tt,.ptitle,.card h3,.kval,.sbig,.v{font-family:"Cormorant Garamond","Noto Serif TC",serif}
.tt{font-size:18px;font-weight:700;line-height:1}
.st{margin-top:4px;color:var(--muted);font-family:"Cinzel",serif;font-size:9px;letter-spacing:.08em}
.navlist{display:flex;flex:1;flex-direction:column;gap:3px;padding:14px 10px}
.navbtn{position:relative;width:100%;min-height:44px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--muted);display:flex;align-items:center;gap:11px;padding:9px 11px;text-align:left;font-size:14px;font-weight:600;transition:background .2s,border-color .2s,color .2s,transform .2s}
.navbtn:hover{background:var(--color-muted);border-color:var(--line);color:var(--ink);transform:translateX(2px)}
.navbtn.active{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}
.navbtn.active:before{content:"";position:absolute;left:-11px;width:3px;height:24px;background:var(--blue)}
.nlab{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idx{margin-left:auto;font-family:"Cinzel",serif;font-size:9px;letter-spacing:.08em;color:#64748b}
.sidefoot{padding:15px 20px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.sidefoot b{color:var(--ink)}
.main{min-width:0}
.topbar{position:sticky;top:0;z-index:10;min-height:72px;padding:14px 28px;background:rgba(248,250,252,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(10px);display:flex;align-items:center;gap:18px}
.ptitle{font-size:22px;font-weight:700;line-height:1.05}
.psub{margin-top:4px;color:var(--muted);font-size:13px}
.spacer{flex:1}
.chipband{display:flex;gap:7px;flex-wrap:wrap}
.chip,.badge{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip{padding:6px 9px;border:1px solid var(--line);border-radius:5px;background:#fff;color:#334155;font-size:12px}
.chip .material-symbols-outlined{font-size:16px;color:var(--blue)}
.content{max-width:1600px;padding:24px 28px 48px}
.grid{display:grid;gap:12px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g32{grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr)}
.mt{margin-top:12px}
.card{min-width:0;padding:16px;background:var(--color-card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 2px rgba(15,23,42,.035);transition:border-color .22s,box-shadow .22s,transform .22s}
.card:hover{border-color:#c7d7f6;box-shadow:0 5px 15px rgba(37,99,235,.06)}
.card h3{display:flex;align-items:center;gap:7px;margin:0;color:var(--ink);font-size:18px;font-weight:700}
.card h3 .material-symbols-outlined{color:var(--blue);font-size:19px}
.csub{margin:3px 0 13px;color:var(--muted);font-size:13px}
.kpi{position:relative;padding-left:18px;overflow:hidden}
.kpi:before{content:"";position:absolute;top:0;bottom:0;left:0;width:3px;background:var(--blue)}
.klab{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;font-weight:600}
.klab .material-symbols-outlined{font-size:18px}
.kval{margin-top:8px;font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kval small{margin-left:3px;color:var(--muted);font-size:14px}
.kfoot{display:flex;align-items:center;gap:4px;margin-top:8px;font-size:12px;font-weight:600}
.kfoot .material-symbols-outlined{font-size:15px}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:6px}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:13px}
th{padding:9px 10px;background:#f8fafc;border-bottom:1px solid #cad8f2;color:#334155;font-size:11px;font-weight:600;letter-spacing:.045em;text-align:left;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .18s}
tbody tr:hover{background:#f8fbff}
td:nth-child(n+2).mono,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
td.mono{text-align:right}
.badge{padding:3px 7px;border:1px solid transparent;border-radius:4px;font-size:11px;font-weight:700}
.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{background:#ecfdf5;border-color:#a7f3d0;color:#047857}
.b-warn{background:#fffbeb;border-color:#fde68a;color:#92400e}
.b-bad{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
.b-info{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}
.b-grey{background:#f1f5f9;border-color:#cbd5e1;color:#475569}
.rating{display:inline-block;padding:2px 7px;border-radius:4px;font-weight:700}
.approve-row{display:flex;align-items:center;gap:8px}
.avatar{display:inline-grid;place-items:center;flex:0 0 auto;width:28px;height:28px;border:1px solid #bfdbfe;border-radius:4px;background:#eff6ff;color:#1d4ed8;font-weight:700}
.progress{width:78px;height:6px;overflow:hidden;border-radius:2px;background:#e2e8f0}
.progress span{display:block;height:100%}
.chartbox{min-width:0;overflow:hidden}
.scorewrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.scorering{width:150px;height:150px}
.scoreinfo{flex:1;min-width:230px}
.sbig{font-size:18px;font-weight:700}
.srow{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.srow span:first-child{color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.bcol{min-width:0;padding:10px;background:#f8fafc;border:1px solid var(--line);border-radius:6px}
.bh{display:flex;justify-content:space-between;gap:8px;margin-bottom:9px;font-size:13px;font-weight:700}
.cnt{padding:1px 6px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--muted);font-family:ui-monospace,monospace}
.bcard{margin-bottom:7px;padding:9px;border:1px solid var(--line);border-radius:5px;background:#fff;transition:transform .2s,border-color .2s}
.bcard:hover{border-color:#93b4f3;transform:translateY(-2px)}
.bcard:last-child{margin-bottom:0}
.bt{font-size:13px;font-weight:700}
.bm{display:flex;justify-content:space-between;gap:8px;margin-top:4px;color:var(--muted);font-size:11px}
.bamt{color:var(--ink);font-weight:700}
.ltop{border-top:3px solid var(--blue)}
.timeline{position:relative;padding-left:24px}
.timeline:before{content:"";position:absolute;top:4px;bottom:4px;left:7px;width:1px;background:#bfdbfe}
.tev{position:relative;padding-bottom:16px}
.tev:last-child{padding-bottom:0}
.tdot{position:absolute;top:3px;left:-22px;width:12px;height:12px;border:3px solid var(--blue);border-radius:50%;background:#fff}
.tev.done .tdot{background:var(--blue)}
.thd{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;font-weight:700}
.tdt{color:var(--muted);font-family:ui-monospace,monospace;font-size:11px}
.tbody{margin-top:3px;color:var(--muted);font-size:12px}
.alertitem{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;padding:10px;border:1px solid var(--line);border-radius:6px;background:#fff}
.alertitem:last-child{margin-bottom:0}
.aic{display:grid;place-items:center;flex:0 0 auto;width:31px;height:31px;border-radius:4px}
.aic .material-symbols-outlined{font-size:18px}
.abody{min-width:0}
.at{font-size:13px;font-weight:700}
.ad{margin-top:2px;color:var(--muted);font-size:12px}
.pill-input{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.pi{padding:7px 10px;border:1px solid var(--line);border-radius:5px;background:#fff;font-size:13px}
.pi b{display:block;color:var(--muted);font-size:10px;letter-spacing:.04em}
.legendrow,.miniStat{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.legendrow{color:var(--muted);font-size:12px}
.legendrow span{display:inline-flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%}
.ms .v{font-size:23px;font-weight:700}
.ms .l{color:var(--muted);font-size:11px}
.stepper{display:flex;align-items:center;gap:4px}
.sp .n{display:grid;place-items:center;width:19px;height:19px;border:1px solid #cbd5e1;border-radius:50%;color:#64748b;font:10px ui-monospace,monospace}
.sp.on .n{border-color:var(--blue);background:var(--blue);color:#fff}
.arw{color:#94a3b8}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.grid>.card,.pill-input>.pi{animation:enter .4s cubic-bezier(.2,.8,.2,1) both}
.grid>.card:nth-child(2),.pill-input>.pi:nth-child(2){animation-delay:.06s}
.grid>.card:nth-child(3),.pill-input>.pi:nth-child(3){animation-delay:.12s}
.grid>.card:nth-child(4),.pill-input>.pi:nth-child(4){animation-delay:.18s}
.grid>.card:nth-child(5),.pill-input>.pi:nth-child(5){animation-delay:.24s}
@keyframes enter{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
 .app{display:block}.sidebar{position:relative;width:100%;height:auto;border-right:0;border-bottom:1px solid var(--line)}
 .brand{padding:14px 16px}.navlist{flex-direction:row;overflow-x:auto;padding:8px}.navbtn{width:auto;flex:0 0 auto}
 .navbtn.active:before{left:10px;right:10px;bottom:-9px;width:auto;height:3px}.idx,.sidefoot{display:none}
 .topbar{top:0;padding:12px 16px}.content{padding:18px 16px 36px}.g3,.g2,.g23,.g32{grid-template-columns:1fr}.board{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:560px){
 .nlab{display:none}.navbtn{padding:9px}.chipband{width:100%}.topbar{align-items:flex-start;flex-wrap:wrap}.spacer{display:none}
 .g4,.board{grid-template-columns:1fr}.ptitle{font-size:20px}.content{padding-inline:12px}.card{padding:13px}
}
@media(prefers-reduced-motion:reduce){
 html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="logo"><div class="mk"><span class="material-symbols-outlined" aria-hidden="true">shield</span></div><div><div class="tt">客戶信用管理</div><div class="st">Credit Management</div></div></div></div>
  <nav class="navlist" id="nav" aria-label="主要功能"></nav>
  <div class="sidefoot">財務部 · 信用部 · 授信部<br><b>純 UI 展示</b>　資料為擬真示範</div>
</aside>
<main class="main">
  <header class="topbar">
    <div><div class="ptitle" id="ptitle">信用風險儀表板</div><div class="psub" id="psub">全客戶信用暴險與逾期概況總覽</div></div>
    <div class="spacer"></div>
    <div class="chipband"><span class="chip"><span class="material-symbols-outlined" aria-hidden="true">calendar_month</span><span class="mono">2026-08-14</span></span><span class="chip"><span class="material-symbols-outlined" aria-hidden="true">sync</span>ERP · CRM 已同步</span></div>
  </header>
  <div class="content" id="view" aria-live="polite"></div>
</main>
</div>
<script>
"use strict";
var P="#2563eb",S="#3b82f6",A="#059669",W="#a85b05",D="#dc2626",M="#475569",L="#e4ecfc";
var MODS=[
 {icon:"monitoring",name:"信用風險儀表板",sub:"全客戶信用暴險與逾期概況總覽"},
 {icon:"fact_check",name:"新客戶徵信評分",sub:"財報與外部徵信計算信用評分與建議額度"},
 {icon:"gavel",name:"授信額度審批",sub:"額度申請分級簽核、覆核與生效管理"},
 {icon:"rule",name:"訂單額度檢核",sub:"接單即時比對可用額度並攔截超限訂單"},
 {icon:"warning",name:"逾期帳款預警",sub:"帳齡分析、逾期分級與催收任務追蹤"},
 {icon:"history",name:"定期覆核調整",sub:"週期性重新評分、額度調整與稽核軌跡"}
];
var charts=[];
function destroyCharts(){charts.forEach(function(c){try{c.destroy()}catch(e){}});charts=[]}
function mk(id,opt){
 var el=document.getElementById(id);if(!el)return;
 opt.chart=opt.chart||{};opt.chart.animations={enabled:false};opt.chart.toolbar={show:false};
 opt.chart.redrawOnParentResize=false;opt.chart.redrawOnWindowResize=false;
 opt.chart.fontFamily='"Crimson Pro",Georgia,serif';
 opt.grid=opt.grid||{};opt.grid.borderColor=L;
 opt.theme={mode:"light"};
 try{var c=new ApexCharts(el,opt);c.render();charts.push(c)}catch(e){}
}
function icon(n){return '<span class="material-symbols-outlined" aria-hidden="true">'+n+'</span>'}
function card(title,sub,body,ic){return '<section class="card"><h3>'+icon(ic)+title+'</h3>'+(sub?'<p class="csub">'+sub+'</p>':'')+body+'</section>'}
function kpi(l,v,u,ic,f,cls,fic){return '<section class="card kpi"><div class="klab">'+icon(ic)+l+'</div><div class="kval">'+v+'<small>'+u+'</small></div><div class="kfoot '+cls+'">'+icon(fic)+f+'</div></section>'}
function alertItem(col,ic,t,d){return '<div class="alertitem"><div class="aic" style="background:'+col+'14;color:'+col+'">'+icon(ic)+'</div><div class="abody"><div class="at">'+t+'</div><div class="ad">'+d+'</div></div></div>'}
function watchRow(n,rt,rc,use,amt,bc,st){
 var r=rc==="W"?D:rc==="warn"?W:A,b=use>=100?D:use>=85?W:P;
 return '<tr><td><div class="approve-row"><span class="avatar">'+n.charAt(0)+'</span><b>'+n+'</b></div></td><td><span class="rating" style="background:'+r+'14;color:'+r+'">'+rt+'</span></td><td><div class="approve-row"><div class="progress"><span style="width:'+Math.min(use,100)+'%;background:'+b+'"></span></div><span class="mono">'+use+'%</span></div></td><td class="mono">'+amt+'</td><td><span class="badge '+bc+'">'+st+'</span></td></tr>'
}
function scoreRow(n,w,s,note){
 var c=s>=80?A:s>=70?P:W;
 return '<tr><td><b>'+n+'</b></td><td class="mono">'+w+'</td><td><div class="approve-row"><div class="progress"><span style="width:'+s+'%;background:'+c+'"></span></div><span class="mono" style="color:'+c+'">'+s+'</span></div></td><td style="color:var(--muted)">'+note+'</td></tr>'
}
function apRow(no,cust,rt,amt,lv,cur,tot,bc,st){
 var x="";for(var i=1;i<=tot;i++)x+='<span class="sp '+(i<=cur?'on':'')+'"><span class="n">'+i+'</span></span>'+(i<tot?'<span class="arw" aria-hidden="true">→</span>':'');
 return '<tr><td class="mono">'+no+'</td><td><b>'+cust+'</b></td><td><span class="badge b-info">'+rt+'</span></td><td class="mono">'+amt+'</td><td>'+lv+'</td><td><div class="stepper" aria-label="已完成 '+cur+'／'+tot+' 階段">'+x+'</div></td><td><span class="badge '+bc+'">'+st+'</span></td></tr>'
}
function ocRow(no,cust,amt,avail,res){
 var m={pass:["b-ok","通過",A],over:["b-warn","趨近上限",W],block:["b-bad","超限攔截",D]},r=m[res];
 return '<tr><td class="mono">'+no+'</td><td><b>'+cust+'</b></td><td class="mono">'+amt+'</td><td class="mono" style="color:'+r[2]+'">'+avail+'</td><td><span class="badge '+r[0]+'">'+r[1]+'</span></td></tr>'
}
function bCard(t,a,n){return '<div class="bcard"><div class="bt">'+t+'</div><div class="bm"><span class="bamt">'+a+'</span><span>'+n+'</span></div></div>'}
function odRow(n,amt,days,owner,act){
 var g=days>=90?["b-bad","90 天以上"]:days>=61?["b-warn","61-90 天"]:["b-info","31-60 天"],c=days>=90?D:days>=61?W:P;
 return '<tr><td><div class="approve-row"><span class="avatar">'+n.charAt(0)+'</span><b>'+n+'</b></div></td><td class="mono">'+amt+'</td><td class="mono" style="color:'+c+'">'+days+' 天</td><td><span class="badge '+g[0]+'">'+g[1]+'</span></td><td>'+owner+'</td><td>'+act+'</td></tr>'
}
function tl(dt,t,cls,b){return '<div class="tev '+cls+'"><div class="tdot"></div><div class="thd"><span>'+t+'</span><span class="tdt">'+dt+'</span></div><div class="tbody">'+b+'</div></div>'}
function rvRow(n,o,nw,oa,na,dir){
 var m={up:["b-ok","調升","arrow_upward"],down:["b-bad","調降","arrow_downward"],flat:["b-grey","維持","remove"]},d=m[dir];
 return '<tr><td><b>'+n+'</b></td><td><span class="badge b-grey">'+o+'</span></td><td><span class="badge b-info">'+nw+'</span></td><td class="mono" style="color:var(--muted)">'+oa+'</td><td class="mono">'+na+'</td><td><span class="badge '+d[0]+'">'+icon(d[2])+d[1]+'</span></td></tr>'
}
function s0(){
 return '<div class="grid g4">'+
 kpi("暴險客戶總額","$ 8.62","億","account_tree","已核授信額度使用 71%","flat","trending_up")+
 kpi("逾期帳款比率","4.3","%","warning","較上月 -1.2pp","up","trending_down")+
 kpi("呆帳率","0.68","%","gavel","控制於目標 1% 內","up","trending_down")+
 kpi("待審授信案","12","件","fact_check","3 件逾 SLA","down","priority_high")+'</div>'+
 '<div class="grid g23 mt">'+card("近 6 週逾期比率 vs 呆帳率","逾期帳款比率持續下降，呆帳率維持低檔",'<div id="c0a" class="chartbox" style="height:280px"></div>',"insights")+
