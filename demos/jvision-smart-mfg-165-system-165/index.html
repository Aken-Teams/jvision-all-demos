<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>進口報關與貿易文件管理系統｜Jvision 系統 Demo</title>
<meta name="description" content="進口報關文件電子化、HS Code 與稅則管理、關稅試算、合規檢核與通關放行入庫" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{--accent:#1d4ed8;--accent2:#60a5fa;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--card:#ffffff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
a{color:inherit;text-decoration:none;}
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,#1d4ed8,#2563eb);color:#fff;box-shadow:0 2px 10px rgba(15,23,42,.12);}
.topbar-inner{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0;}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand .logo{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;}
.brand .logo .material-symbols-outlined{font-size:22px;}
.brand .t1{font-weight:800;font-size:15px;line-height:1.15;}
.brand .t2{font-size:11px;opacity:.85;}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0;}
nav.tabs button{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.10);color:#fff;border:1px solid rgba(255,255,255,.16);padding:7px 12px;border-radius:9px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;min-width:0;}
nav.tabs button .material-symbols-outlined{font-size:18px;}
nav.tabs button:hover{background:rgba(255,255,255,.22);}
nav.tabs button.on{background:#fff;color:var(--accent);border-color:#fff;}
main{max-width:1360px;margin:0 auto;padding:18px;}
.screen-head{display:flex;align-items:center;gap:12px;margin:2px 0 16px;flex-wrap:wrap;min-width:0;}
.screen-head .ic{width:42px;height:42px;border-radius:11px;background:#dbeafe;color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none;}
.screen-head .ic .material-symbols-outlined{font-size:24px;}
.screen-head h2{margin:0;font-size:19px;font-weight:800;}
.screen-head p{margin:2px 0 0;font-size:12.5px;color:var(--muted);}
.grid{display:grid;gap:14px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:2fr 1fr;}
.g32{grid-template-columns:1fr 2fr;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;}
.card h3{margin:0 0 12px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
.card h3 .sub{margin-left:auto;font-size:11px;font-weight:600;color:var(--muted);}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0;}
.kpi .lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--accent2);}
.kpi .val{font-size:27px;font-weight:900;margin-top:6px;line-height:1;}
.kpi .val small{font-size:13px;font-weight:700;color:var(--muted);margin-left:3px;}
.kpi .delta{font-size:11.5px;font-weight:700;margin-top:6px;}
.up{color:var(--ok);}.down{color:var(--bad);}
.chart{width:100%;overflow:hidden;min-width:0;}
.twrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px;}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{font-size:11px;color:var(--muted);font-weight:700;background:#f8fafc;position:sticky;top:0;}
tbody tr:hover{background:#f8fbff;}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;}
.tag .material-symbols-outlined{font-size:14px;}
.t-ok{background:#dcfce7;color:#15803d;}
.t-warn{background:#fef3c7;color:#b45309;}
.t-bad{background:#fee2e2;color:#b91c1c;}
.t-info{background:#dbeafe;color:#1d4ed8;}
.t-mut{background:#f1f5f9;color:#475569;}
.bar{height:7px;border-radius:99px;background:#e2e8f0;overflow:hidden;min-width:60px;}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#1d4ed8,#60a5fa);}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0;}
.col{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0;}
.col .ch{font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 2px;}
.col .ch .n{background:#fff;border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:11px;color:var(--muted);}
.tk{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;padding:9px 10px;margin-bottom:8px;}
.tk .id{font-size:10.5px;color:var(--muted);font-weight:700;}
.tk .nm{font-size:12.5px;font-weight:700;margin:2px 0 5px;}
.tk .mt{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.tl{position:relative;padding-left:26px;}
.tl:before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl .it{position:relative;padding:0 0 16px 0;}
.tl .it:last-child{padding-bottom:0;}
.tl .dot{position:absolute;left:-26px;top:1px;width:20px;height:20px;border-radius:99px;background:#fff;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;}
.tl .dot .material-symbols-outlined{font-size:13px;color:var(--accent);}
.tl .dot.done{background:var(--ok);border-color:var(--ok);}
.tl .dot.done .material-symbols-outlined{color:#fff;}
.tl .dot.cur{background:var(--accent);}
.tl .dot.cur .material-symbols-outlined{color:#fff;}
.tl .tt{font-size:13px;font-weight:800;}
.tl .dd{font-size:11.5px;color:var(--muted);margin-top:2px;}
.chk{display:flex;align-items:flex-start;gap:10px;padding:11px 4px;border-bottom:1px dashed var(--line);}
.chk:last-child{border-bottom:0;}
.chk .ci{width:24px;height:24px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;}
.chk .ci .material-symbols-outlined{font-size:16px;}
.ci-ok{background:#dcfce7;color:#15803d;}
.ci-warn{background:#fef3c7;color:#b45309;}
.ci-bad{background:#fee2e2;color:#b91c1c;}
.chk .cx{min-width:0;}
.chk .cn{font-size:13px;font-weight:700;}
.chk .cd{font-size:11.5px;color:var(--muted);margin-top:1px;}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;min-width:0;}
.fld{min-width:0;}
.fld label{font-size:11.5px;color:var(--muted);font-weight:700;display:block;margin-bottom:4px;}
.fld .in{background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13px;font-weight:700;}
.res{background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;border-radius:12px;padding:14px 16px;}
.res .rr{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.18);font-size:12.5px;}
.res .rr:last-child{border-bottom:0;}
.res .rr b{font-size:16px;}
.res .big{font-size:26px;font-weight:900;}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--accent);background:#dbeafe;border-radius:99px;padding:4px 10px;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.dotc{width:9px;height:9px;border-radius:99px;display:inline-block;}
.foot{max-width:1360px;margin:8px auto 24px;padding:0 18px;font-size:11px;color:var(--muted);text-align:center;}
@media(max-width:820px){
 .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
 .board{grid-template-columns:1fr 1fr;}
 .calc{grid-template-columns:1fr;}
}
@media(max-width:560px){
 nav.tabs button span.lbl{display:none;}
 nav.tabs button{padding:8px;}
 .board{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">local_shipping</span></div>
      <div>
        <div class="t1">進口報關與貿易文件管理系統</div>
        <div class="t2">Import Customs &amp; Trade Document Management</div>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main><div id="screen"></div></main>
<div class="foot">Jvision 系統 Demo · 純前端展示 · 資料為模擬示意</div>
<script>
var TABS=[
 {i:0,ic:"dashboard",label:"報關作業總覽"},
 {i:1,ic:"description",label:"貿易文件中心"},
 {i:2,ic:"rule",label:"HS Code 與稅則"},
 {i:3,ic:"request_quote",label:"關稅試算"},
 {i:4,ic:"fact_check",label:"合規檢核"},
 {i:5,ic:"inventory_2",label:"通關放行入庫"}
];
var charts=[];
function clearCharts(){for(var k=0;k<charts.length;k++){try{charts[k].destroy();}catch(e){}}charts=[];}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return c==="&"?"&amp;":c==="<"?"&lt;":"&gt;";});}
function elById(id){return document.getElementById(id);}
function makeChart(id,opt){var el=elById(id);if(!el)return;opt.chart=opt.chart||{};opt.chart.redrawOnParentResize=false;opt.chart.redrawOnWindowResize=false;opt.chart.animations={enabled:false};opt.chart.toolbar={show:false};opt.chart.fontFamily="Inter, Noto Sans TC, sans-serif";try{var c=new ApexCharts(el,opt);c.render();charts.push(c);}catch(e){}}

function headHtml(i){var t=TABS[i];return '<div class="screen-head"><div class="ic"><span class="material-symbols-outlined">'+t.ic+'</span></div><div><h2>'+t.label+'</h2><p>'+SUB[i]+'</p></div></div>';}
var SUB=[
 "本週進口報關案件進度、通關時效與稅費彙總看板",
 "商業發票、裝箱單、提單等貿易文件電子化歸檔與缺件追蹤",
 "貨品 HS Code 歸列、稅則稅率查核與歸列風險管理",
 "依完稅價格試算進口關稅、營業稅與推廣貿易服務費",
 "原產地證明、文件一致性與管制規定合規檢核清單",
 "海關放行後之提貨、運送追蹤與貨物入庫交接"
];

/* ---------- Screen 0: 報關作業總覽 ---------- */
function screen0(c){
 var kpis=[
  {ic:"inventory_2",lab:"在辦報關案件",val:"38",u:"件",d:"較上週 +5",cls:"up"},
  {ic:"schedule",lab:"平均通關天數",val:"2.4",u:"天",d:"↓ 0.6 天",cls:"up"},
  {ic:"task_alt",lab:"通關準時率",val:"94",u:"%",d:"↑ 6%",cls:"up"},
  {ic:"warning",lab:"文件錯誤率",val:"1.8",u:"%",d:"↓ 2.4%",cls:"up"}
 ];
 var kh="";for(var i=0;i<kpis.length;i++){var k=kpis[i];kh+='<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+k.ic+'</span>'+k.lab+'</div><div class="val">'+k.val+'<small>'+k.u+'</small></div><div class="delta '+k.cls+'">'+k.d+'</div></div>';}
 var rows=[
  ["IMP-2609-118","電子零組件","日本 JP","上海→基隆","報關申請","t-info","已放行","t-ok"],
  ["IMP-2609-121","工業馬達","德國 DE","漢堡→高雄","合規檢核","t-warn","待補件","t-warn"],
  ["IMP-2609-124","精密軸承","瑞士 CH","鹿特丹→基隆","文件備齊","t-info","進行中","t-info"],
  ["IMP-2609-127","化工原料","美國 US","洛杉磯→台中","報關申請","t-info","查驗中","t-warn"],
  ["IMP-2609-130","不鏽鋼捲","韓國 KR","釜山→高雄","通關放行","t-ok","已入庫","t-ok"]
 ];
 var tr="";for(var r=0;r<rows.length;r++){var x=rows[r];tr+='<tr><td><b>'+x[0]+'</b></td><td>'+x[1]+'</td><td>'+x[2]+'</td><td>'+x[3]+'</td><td><span class="tag '+x[5]+'">'+x[4]+'</span></td><td><span class="tag '+x[7]+'">'+x[6]+'</span></td></tr>';}
 c.innerHTML=headHtml(0)
  +'<div class="grid g4" style="margin-bottom:14px">'+kh+'</div>'
  +'<div class="grid g23">'
   +'<div class="card"><h3><span class="material-symbols-outlined">monitoring</span>近 6 週通關時效與案件量<span class="sub">週資料</span></h3><div class="chart" id="c0a"></div></div>'
   +'<div class="card"><h3><span class="material-symbols-outlined">account_tree</span>案件階段分布</h3><div class="chart" id="c0b"></div></div>'
  +'</div>'
  +'<div class="card" style="margin-top:14px"><h3><span class="material-symbols-outlined">list_alt</span>進行中報關案件<span class="sub">共 38 件 · 顯示 5 筆</span></h3><div class="twrap"><table><thead><tr><th>報單號</th><th>貨品</th><th>原產國</th><th>航程</th><th>作業階段</th><th>狀態</th></tr></thead><tbody>'+tr+'</tbody></table></div></div>';
 void c.offsetHeight;
 makeChart("c0a",{series:[
   {name:"案件量(件)",type:"column",data:[30,33,29,35,36,38]},
   {name:"通關天數(天)",type:"line",data:[3.4,3.1,2.9,2.7,2.5,2.4]}
  ],
  chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"line",height:300,stacked:false},
  stroke:{width:[0,3],curve:"smooth"},
  colors:["#60a5fa","#1d4ed8"],
  plotOptions:{bar:{columnWidth:"48%",borderRadius:4}},
  dataLabels:{enabled:false},
  xaxis:{categories:["W22","W23","W24","W25","W26","W27"]},
  yaxis:[{title:{text:"件"}},{opposite:true,title:{text:"天"},min:0,max:5}],
  grid:{borderColor:"#eef2f7"},
  legend:{position:"top"},
  tooltip:{shared:true,intersect:false}
 });
 makeChart("c0b",{series:[6,9,7,11,5],
  chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"donut",height:300},
  labels:["訂單建檔","文件備齊","報關申請","合規檢核","通關放行"],
  colors:["#1e3a8a","#1d4ed8","#3b82f6","#60a5fa","#93c5fd"],
  dataLabels:{enabled:true,formatter:function(v){return Math.round(v)+"%";}},
  legend:{position:"bottom",fontSize:"12px"},
  plotOptions:{pie:{donut:{size:"62%",labels:{show:true,total:{show:true,label:"在辦案件",formatter:function(){return "38 件";}}}}}}
 });
}

/* ---------- Screen 1: 貿易文件中心 ---------- */
function screen1(c){
 var cols=[
  {t:"待上傳",n:2,items:[
   {id:"DOC-441",nm:"IMP-2609-124 保險單",mt:["精密軸承","缺 1 份"]},
   {id:"DOC-448",nm:"IMP-2609-127 產地證明",mt:["化工原料","缺 1 份"]}
  ]},
  {t:"待審核",n:2,items:[
   {id:"DOC-436",nm:"IMP-2609-121 裝箱單",mt:["工業馬達","文件管理員"]},
   {id:"DOC-439",nm:"IMP-2609-121 提單 B/L",mt:["工業馬達","文件管理員"]}
  ]},
  {t:"已核可",n:2,items:[
   {id:"DOC-421",nm:"IMP-2609-118 商業發票",mt:["電子零組件","已歸檔"]},
   {id:"DOC-424",nm:"IMP-2609-118 裝箱單",mt:["電子零組件","已歸檔"]}
  ]},
  {t:"已歸檔",n:2,items:[
   {id:"DOC-410",nm:"IMP-2609-130 全套文件",mt:["不鏽鋼捲","5 份"]},
   {id:"DOC-405",nm:"IMP-2609-115 全套文件",nmm:"",mt:["鋁錠","5 份"]}
  ]}
 ];
 var board="";for(var i=0;i<cols.length;i++){var col=cols[i];var tk="";for(var j=0;j<col.items.length;j++){var it=col.items[j];var mt="";for(var m=0;m<it.mt.length;m++){mt+='<span>'+(m>0?'· ':'')+esc(it.mt[m])+'</span>';}tk+='<div class="tk"><div class="id">'+it.id+'</div><div class="nm">'+esc(it.nm)+'</div><div class="mt">'+mt+'</div></div>';}board+='<div class="col"><div class="ch"><span>'+col.t+'</span><span class="n">'+col.n+'</span></div>'+tk+'</div>';}
 var docs=[
  ["商業發票 Invoice","IMP-2609-121","PDF","文件管理員","09/12 10:22","已核可","t-ok"],
  ["裝箱單 Packing List","IMP-2609-121","PDF","文件管理員","09/12 10:25","審核中","t-warn"],
  ["海運提單 B/L","IMP-2609-121","PDF","關務專員","09/12 11:03","審核中","t-warn"],
  ["原產地證明 C/O","IMP-2609-127","JPG","供應商","—","缺件","t-bad"],
  ["保險單 Insurance","IMP-2609-124","PDF","供應商","—","缺件","t-bad"]
 ];
 var dr="";for(var d=0;d<docs.length;d++){var y=docs[d];dr+='<tr><td><b>'+y[0]+'</b></td><td>'+y[1]+'</td><td><span class="tag t-mut">'+y[2]+'</span></td><td>'+y[3]+'</td><td>'+y[4]+'</td><td><span class="tag '+y[6]+'">'+y[5]+'</span></td></tr>';}
 c.innerHTML=headHtml(1)
  +'<div class="grid g4" style="margin-bottom:14px">'
   +'<div class="kpi"><div class="lab"><span class="material-symbols-outlined">folder</span>本月文件總數</div><div class="val">312<small>份</small></div><div class="delta up">電子化率 96%</div></div>'
   +'<div class="kpi"><div class="lab"><span class="material-symbols-outlined">error</span>缺件案件</div><div class="val">4<small>件</small></div><div class="delta down">需供應商補件</div></div>'
   +'<div class="kpi"><div class="lab"><span class="material-symbols-outlined">pending_actions</span>待審核</div><div class="val">7<small>份</small></div><div class="delta">平均 3.2 小時</div></div>'
   +'<div class="kpi"><div class="lab"><span class="material-symbols-outlined">verified</span>文件齊全率</div><div class="val">92<small>%</small></div><div class="delta up">↑ 8%</div></div>'
  +'</div>'
  +'<div class="card" style="margin-bottom:14px"><h3><span class="material-symbols-outlined">view_kanban</span>文件審核流程看板</h3><div class="twrap"><div class="board">'+board+'</div></div></div>'
  +'<div class="card"><h3><span class="material-symbols-outlined">description</span>文件明細 — IMP-2609-121 工業馬達<span class="sub">完整度 3 / 5</span></h3><div class="twrap"><table><thead><tr><th>文件類型</th><th>報單號</th><th>格式</th><th>上傳者</th><th>時間</th><th>狀態</th></tr></thead><tbody>'+dr+'</tbody></table></div></div>';
 void c.offsetHeight;
}

/* ---------- Screen 2: HS Code 與稅則 ---------- */
function screen2(c){
 var rows=[
  ["8541.41.00","太陽能電池模組","日本 JP","0%","0%","N","低","t-ok"],
  ["8482.10.00","滾珠軸承","瑞士 CH","3.5%","5%","N","低","t-ok"],
