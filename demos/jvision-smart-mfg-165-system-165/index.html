<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>進口報關與貿易文件管理系統｜Jvision 系統 Demo</title>
<meta name="description" content="進口報關文件電子化、HS Code 與稅則管理、關稅試算、合規檢核與通關放行入庫" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap');

:root{
  --color-primary:#2563eb;
  --color-on-primary:#ffffff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000000;
  --color-accent:#ea580c;
  --color-on-accent:#000000;
  --color-background:#f8fafc;
  --color-foreground:#1e293b;
  --color-card:#ffffff;
  --color-card-foreground:#1e293b;
  --color-muted:#e9eff8;
  --color-muted-foreground:#475569;
  --color-border:#e2e8f0;
  --color-destructive:#dc2626;
  --color-on-destructive:#ffffff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#1e293b;
  --muted:#475569;
  --line:#e2e8f0;
  --accent:#2563eb;
  --accent2:#3b82f6;
  --bg:#f8fafc;
  --card:#ffffff;
  --ok:#15803d;
  --warn:#a54603;
  --bad:#b91c1c;
  --shadow-sm:0 1px 2px rgba(15,23,42,.05);
  --shadow-md:0 8px 24px rgba(15,23,42,.07);
  --radius:10px;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;background:var(--color-background);}
html,body{margin:0;padding:0;min-width:320px;}
body{
  min-height:100vh;
  font-family:"Fira Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--color-foreground);
  background:
    linear-gradient(90deg,rgba(37,99,235,.035) 1px,transparent 1px),
    linear-gradient(rgba(37,99,235,.035) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,a{font:inherit;}
a{color:inherit;text-decoration:none;}
button{cursor:pointer;}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px;}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  color:var(--color-foreground);
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--color-border);
  box-shadow:0 1px 0 rgba(15,23,42,.03);
  backdrop-filter:blur(14px);
}
.topbar-inner{
  width:min(100%,1440px);
  min-height:74px;
  margin:0 auto;
  padding:12px 28px;
  display:flex;
  align-items:center;
  gap:24px;
  min-width:0;
}
.brand{display:flex;align-items:center;gap:12px;min-width:250px;}
.brand .logo{
  width:42px;
  height:42px;
  border-radius:8px;
  display:grid;
  place-items:center;
  flex:none;
  color:var(--color-on-primary);
  background:var(--color-primary);
  box-shadow:4px 4px 0 #bfdbfe;
}
.brand .logo .material-symbols-outlined{font-size:23px;}
.brand .t1{font-size:15px;font-weight:700;line-height:1.25;letter-spacing:.01em;}
.brand .t2{margin-top:3px;font-family:"Fira Code",monospace;font-size:9.5px;color:var(--color-muted-foreground);letter-spacing:.025em;}
nav.tabs{
  display:flex;
  align-items:center;
  gap:4px;
  margin-left:auto;
  min-width:0;
  overflow-x:auto;
  scrollbar-width:none;
}
nav.tabs::-webkit-scrollbar{display:none;}
nav.tabs button{
  position:relative;
  display:flex;
  align-items:center;
  gap:7px;
  min-height:42px;
  padding:8px 11px;
  flex:none;
  border:1px solid transparent;
  border-radius:7px;
  color:var(--color-muted-foreground);
  background:transparent;
  font-size:12.5px;
  font-weight:600;
  white-space:nowrap;
  transition:color .2s ease,background-color .2s ease,border-color .2s ease,transform .2s ease;
}
nav.tabs button .material-symbols-outlined{font-size:19px;}
nav.tabs button:hover{color:var(--color-primary);background:#eff6ff;border-color:#bfdbfe;}
nav.tabs button.on{color:var(--color-on-primary);background:var(--color-primary);border-color:var(--color-primary);box-shadow:var(--shadow-sm);}
nav.tabs button.on:after{
  content:"";
  position:absolute;
  left:12px;
  right:12px;
  bottom:-13px;
  height:3px;
  background:var(--color-accent);
}
nav.tabs button:active{transform:translateY(1px);}

main{width:min(100%,1440px);margin:0 auto;padding:30px 28px 42px;}
#screen{min-width:0;}
.screen-head{
  position:relative;
  display:flex;
  align-items:center;
  gap:14px;
  min-width:0;
  margin:0 0 22px;
  padding:0 0 18px;
  border-bottom:1px solid var(--color-border);
}
.screen-head:after{content:"";position:absolute;left:0;bottom:-1px;width:72px;height:3px;background:var(--color-accent);}
.screen-head .ic{
  width:46px;
  height:46px;
  border:1px solid #bfdbfe;
  border-radius:8px;
  display:grid;
  place-items:center;
  flex:none;
  color:var(--color-primary);
  background:#eff6ff;
}
.screen-head .ic .material-symbols-outlined{font-size:24px;}
.screen-head h2{margin:0;font-size:22px;font-weight:700;line-height:1.2;letter-spacing:-.015em;}
.screen-head p{margin:5px 0 0;color:var(--color-muted-foreground);font-size:12.5px;line-height:1.55;}

.grid{display:grid;gap:16px;min-width:0;}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g23{grid-template-columns:minmax(0,2fr) minmax(290px,1fr);}
.g32{grid-template-columns:minmax(280px,1fr) minmax(0,2fr);}
.card,.kpi{
  min-width:0;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.card:hover,.kpi:hover{border-color:#bfdbfe;box-shadow:var(--shadow-md);transform:translateY(-2px);}
.card{padding:18px;}
.card h3{
  margin:0 0 16px;
  display:flex;
  align-items:center;
  gap:8px;
  min-height:22px;
  color:var(--color-foreground);
  font-size:14px;
  font-weight:700;
  line-height:1.4;
}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--color-primary);}
.card h3 .sub{margin-left:auto;color:var(--color-muted-foreground);font-family:"Fira Code",monospace;font-size:10px;font-weight:500;text-align:right;}
.kpi{position:relative;overflow:hidden;padding:17px 18px 16px;}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--color-primary);}
.kpi .lab{display:flex;align-items:center;gap:7px;color:var(--color-muted-foreground);font-size:12px;font-weight:500;}
.kpi .lab .material-symbols-outlined{font-size:18px;color:var(--color-primary);}
.kpi .val{margin-top:13px;color:var(--color-foreground);font-family:"Fira Code",monospace;font-size:29px;font-weight:700;line-height:1;letter-spacing:-.04em;}
.kpi .val small{margin-left:4px;color:var(--color-muted-foreground);font-family:"Fira Sans",sans-serif;font-size:12px;font-weight:600;letter-spacing:0;}
.kpi .delta{margin-top:10px;color:var(--color-muted-foreground);font-size:11px;font-weight:600;}
.up{color:var(--ok)!important;}.down{color:var(--bad)!important;}
.chart{width:100%;min-width:0;overflow:hidden;}

.twrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--color-border);border-radius:7px;}
table{width:100%;min-width:560px;border-collapse:collapse;color:var(--color-foreground);font-size:12px;}
th,td{padding:11px 12px;border-bottom:1px solid var(--color-border);text-align:left;white-space:nowrap;}
th{
  position:sticky;
  top:0;
  z-index:1;
  color:#334155;
  background:#f1f5f9;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.055em;
  text-transform:none;
}
td:first-child,td b{font-family:"Fira Code",monospace;font-weight:600;}
tbody tr{transition:background-color .18s ease;}
tbody tr:hover{background:#eff6ff;}
tbody tr:last-child td{border-bottom:0;}

.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  min-height:24px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:5px;
  font-size:10.5px;
  font-weight:700;
  line-height:1;
}
.tag .material-symbols-outlined{font-size:14px;}
.t-ok{color:#166534;background:#f0fdf4;}
.t-warn{color:#92400e;background:#fffbeb;}
.t-bad{color:#991b1b;background:#fef2f2;}
.t-info{color:#1d4ed8;background:#eff6ff;}
.t-mut{color:#475569;background:#f1f5f9;}
.bar{height:7px;min-width:60px;overflow:hidden;border-radius:2px;background:#e2e8f0;}
.bar>i{display:block;height:100%;background:var(--color-primary);}

.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;min-width:920px;}
.col{min-width:0;padding:11px;background:#f8fafc;border:1px solid var(--color-border);border-radius:8px;}
.col .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:2px 3px 9px;border-bottom:1px solid var(--color-border);font-size:12px;font-weight:700;}
.col .ch .n{min-width:25px;padding:2px 7px;border:1px solid #bfdbfe;border-radius:4px;color:var(--color-primary);background:#eff6ff;font-family:"Fira Code",monospace;font-size:10px;text-align:center;}
.tk{position:relative;margin-bottom:8px;padding:10px 10px 10px 13px;background:#fff;border:1px solid var(--color-border);border-radius:6px;box-shadow:var(--shadow-sm);transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;}
.tk:before{content:"";position:absolute;left:-1px;top:8px;bottom:8px;width:3px;background:var(--color-primary);}
.tk:hover{border-color:#93c5fd;box-shadow:0 5px 14px rgba(37,99,235,.09);transform:translateY(-1px);}
.tk:last-child{margin-bottom:0;}
.tk .id{color:var(--color-primary);font-family:"Fira Code",monospace;font-size:10px;font-weight:600;}
.tk .nm{margin:4px 0 6px;color:var(--color-foreground);font-size:12px;font-weight:600;line-height:1.45;}
.tk .mt{display:flex;align-items:center;gap:5px;flex-wrap:wrap;color:var(--color-muted-foreground);font-size:10.5px;}

.tl{position:relative;padding-left:29px;}
.tl:before{content:"";position:absolute;left:10px;top:6px;bottom:6px;width:1px;background:#cbd5e1;}
.tl .it{position:relative;padding:0 0 19px;}
.tl .it:last-child{padding-bottom:0;}
.tl .dot{position:absolute;left:-29px;top:0;width:21px;height:21px;border:2px solid var(--color-primary);border-radius:50%;display:grid;place-items:center;color:var(--color-primary);background:#fff;}
.tl .dot .material-symbols-outlined{font-size:12px;}
.tl .dot.done{color:#fff;background:var(--ok);border-color:var(--ok);}
.tl .dot.cur{color:#fff;background:var(--color-primary);box-shadow:0 0 0 4px #dbeafe;}
.tl .tt{font-size:12.5px;font-weight:700;}
.tl .dd{margin-top:3px;color:var(--color-muted-foreground);font-size:10.5px;line-height:1.5;}
.chk{display:flex;align-items:flex-start;gap:11px;padding:12px 3px;border-bottom:1px dashed #cbd5e1;}
.chk:last-child{border-bottom:0;}
.chk .ci{width:25px;height:25px;border:1px solid currentColor;border-radius:5px;display:grid;place-items:center;flex:none;}
.chk .ci .material-symbols-outlined{font-size:16px;}
.ci-ok{color:#166534;background:#f0fdf4;}
.ci-warn{color:#92400e;background:#fffbeb;}
.ci-bad{color:#991b1b;background:#fef2f2;}
.chk .cx{min-width:0;}
.chk .cn{font-size:12.5px;font-weight:700;line-height:1.4;}
.chk .cd{margin-top:3px;color:var(--color-muted-foreground);font-size:11px;line-height:1.5;}

.calc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px;min-width:0;}
.fld{min-width:0;}
.fld label{display:block;margin-bottom:5px;color:var(--color-muted-foreground);font-size:10.5px;font-weight:600;}
.fld .in{min-height:40px;padding:10px 11px;border:1px solid var(--color-border);border-radius:6px;color:var(--color-foreground);background:#f8fafc;font-family:"Fira Code",monospace;font-size:12px;font-weight:500;}
.res{padding:16px 17px;color:var(--color-on-primary);background:#1e3a8a;border-radius:8px;box-shadow:6px 6px 0 #bfdbfe;}
.res .rr{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.22);font-size:12px;}
.res .rr:last-child{border-bottom:0;}
.res .rr b{font-family:"Fira Code",monospace;font-size:14px;font-weight:600;text-align:right;}
.res .big{font-size:22px!important;color:#fed7aa;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid #bfdbfe;border-radius:5px;color:#1d4ed8;background:#eff6ff;font-size:10.5px;font-weight:600;}
.legend{display:flex;gap:15px;flex-wrap:wrap;margin-top:10px;color:var(--color-muted-foreground);font-size:10.5px;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.dotc{width:9px;height:9px;display:inline-block;border:1px solid currentColor;border-radius:2px;}
.foot{width:min(100%,1440px);margin:0 auto 26px;padding:0 28px;color:var(--color-muted-foreground);font-family:"Fira Code",monospace;font-size:9.5px;text-align:center;letter-spacing:.02em;}

@media(max-width:1100px){
  .topbar-inner{align-items:flex-start;flex-direction:column;gap:10px;padding-block:12px;}
  nav.tabs{width:100%;margin-left:0;}
  nav.tabs button.on:after{bottom:-11px;}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));}
  .g23,.g32{grid-template-columns:1fr;}
}
@media(max-width:768px){
  .topbar-inner{padding-inline:18px;}
  main{padding:24px 18px 34px;}
  .screen-head{align-items:flex-start;}
  .screen-head h2{font-size:20px;}
  .g3,.g2{grid-template-columns:1fr;}
  .calc{grid-template-columns:1fr;}
  .card{padding:15px;}
  .foot{padding-inline:18px;}
}
@media(max-width:520px){
  .topbar-inner{padding-inline:14px;}
  .brand{min-width:0;}
  .brand .t1{font-size:13px;}
  .brand .t2{font-size:8.5px;}
  nav.tabs button{min-width:43px;justify-content:center;padding:8px 11px;}
  nav.tabs button span.lbl{display:none;}
  main{padding:20px 14px 30px;}
  .g4{grid-template-columns:1fr;}
  .screen-head{gap:11px;}
  .screen-head .ic{width:41px;height:41px;}
  .screen-head h2{font-size:18px;}
  .screen-head p{font-size:11.5px;}
  .kpi .val{font-size:27px;}
  .res .rr{align-items:flex-start;flex-direction:column;gap:4px;}
  .res .rr b{text-align:left;}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
  .card:hover,.kpi:hover,.tk:hover{transform:none;}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">local_shipping</span></div>
      <div>
        <div class="t1">進口報關與貿易文件管理系統</div>
        <div class="t2">Import Customs &amp; Trade Document Management</div>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main><div id="screen"></div></main>
<div class="foot">Jvision 系統 Demo · 純前端展示 · 資料為模擬示意</div>
<script>
var TABS=[
 {i:0,ic:"dashboard",label:"報關作業總覽"},
 {i:1,ic:"description",label:"貿易文件中心"},
 {i:2,ic:"rule",label:"HS Code 與稅則"},
 {i:3,ic:"request_quote",label:"關稅試算"},
 {i:4,ic:"fact_check",label:"合規檢核"},
 {i:5,ic:"inventory_2",label:"通關放行入庫"}
];
var charts=[];
function clearCharts(){for(var k=0;k<charts.length;k++){try{charts[k].destroy();}catch(e){}}charts=[];}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return c==="&"?"&amp;":c==="<"?"&lt;":"&gt;";});}
function elById(id){return document.getElementById(id);}
function makeChart(id,opt){var el=elById(id);if(!el)return;opt.chart=opt.chart||{};opt.chart.redrawOnParentResize=false;opt.chart.redrawOnWindowResize=false;opt.chart.animations={enabled:false};opt.chart.toolbar={show:false};opt.chart.fontFamily="Fira Sans, sans-serif";try{var c=new ApexCharts(el,opt);c.render();charts.push(c);}catch(e){}}

function headHtml(i){var t=TABS[i];return '<div class="screen-head"><div class="ic"><span class="material-symbols-outlined">'+t.ic+'</span></div><div><h2>'+t.label+'</h2><p>'+SUB[i]+'</p></div></div>';}
var SUB=[
 "本週進口報關案件進度、通關時效與稅費彙總看板",
 "商業發票、裝箱單、提單等貿易文件電子化歸檔與缺件追蹤",
 "貨品 HS Code 歸列、稅則稅率查核與歸列風險管理",
 "依完稅價格試算進口關稅、營業稅與推廣貿易服務費",
 "原產地證明、文件一致性與管制規定合規檢核清單",
 "海關放行後之提貨、運送追蹤與貨物入庫交接"
];

/* ---------- Screen 0: 報關作業總覽 ---------- */
function screen0(c){
 var kpis=[
  {ic:"inventory_2",lab:"在辦報關案件",val:"38",u:"件",d:"較上週 +5",cls:"up"},
  {ic:"schedule",lab:"平均通關天數",val:"2.4",u:"天",d:"↓ 0.6 天",cls:"up"},
  {ic:"task_alt",lab:"通關準時率",val:"94",u:"%",d:"↑ 6%",cls:"up"},
  {ic:"warning",lab:"文件錯誤率",val:"1.8",u:"%",d:"↓ 2.4%",cls:"up"}
 ];
 var kh="";for(var i=0;i<kpis.length;i++){var k=kpis[i];kh+='<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+k.ic+'</span>'+k.lab+'</div><div class="val">'+k.val+'<small>'+k.u+'</small></div><div class="delta '+k.cls+'">'+k.d+'</div></div>';}
 var rows=[
  ["IMP-2609-118","電子零組件","日本 JP","上海→基隆","報關申請","t-info","已放行","t-ok"],
  ["IMP-2609-121","工業馬達","德國 DE","漢堡→高雄","合規檢核","t-warn","待補件","t-warn"],
  ["IMP-2609-124","精密軸承","瑞士 CH","鹿特丹→基隆","文件備齊","t-info","進行中","t-info"],
  ["IMP-2609-127","化工原料","美國 US","洛杉磯→台中","報關申請","t-info","查驗中","t-warn"],
  ["IMP-2609-130","不鏽鋼捲","韓國 KR","釜山→高雄","通關放行","t-ok","已入庫","t-ok"]
 ];
 var tr="";for(var r=0;r<rows.length;r++){var x=rows[r];tr+='<tr><td><b>'+x[0]+'</b></td><td>'+x[1]+'</td><td>'+x[2]+'</td><td>'+x[3]+'</td><td><span class="tag '+x[5]+'">'+x[4]+'</span></td><td><span class="tag '+x[7]+'">'+x[6]+'</span></td></tr>';}
 c.innerHTML=headHtml(0)
  +'<div class="grid g4" style="margin-bottom:14px">'+kh+'</div>'
  +'<div class="grid g23">'
   +'<div class="card"><h3><span class="material-symbols-outlined">monitoring</span>近 6 週通關時效與案件量<span class="sub">週資料</span></h3><div class="chart" id="c0a"></div></div>'

var SCREENS=[screen0,screen1,screen2,screen3,screen4,screen5];
function show(i){
 clearCharts();
 var tb=document.querySelectorAll("#tabs button");
 for(var b=0;b<tb.length;b++){tb[b].classList.toggle("on",+tb[b].getAttribute("data-i")===i);}
 var c=elById("screen");
 SCREENS[i](c);
}
(function initTabs(){
 var h="";for(var i=0;i<TABS.length;i++){h+='<button data-i="'+TABS[i].i+'"><span class="material-symbols-outlined">'+TABS[i].ic+'</span><span class="lbl">'+TABS[i].label+'</span></button>';}
 var tabs=elById("tabs");tabs.innerHTML=h;
 tabs.addEventListener("click",function(e){var t=e.target.closest("button");if(!t)return;var n=+t.getAttribute("data-i");location.hash="go="+n;});
})();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
