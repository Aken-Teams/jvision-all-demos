<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>工業設備連線閘道｜Jvision 系統 Demo</title>
<meta name="description" content="多協定設備連接、邊緣運算與雲端傳輸的工業物聯網閘道平台" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap');

:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --accent:#2563EB;
  --accent2:#3B82F6;
  --bg:#F8FAFC;
  --panel:#FFFFFF;
  --soft:#E9EFF8;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#0369A1;
  --shadow-sm:0 1px 2px rgba(15,23,42,.05);
  --shadow-md:0 8px 24px rgba(15,23,42,.07);
  --radius:8px;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--color-background)}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  background:
    linear-gradient(rgba(37,99,235,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(37,99,235,.025) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--color-foreground);
  font-family:"Fira Sans",system-ui,-apple-system,sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
::selection{background:#BFDBFE;color:#172554}

.material-symbols-outlined{
  display:inline-block;
  direction:ltr;
  font-family:"Material Symbols Outlined";
  font-style:normal;
  font-weight:normal;
  letter-spacing:normal;
  line-height:1;
  text-transform:none;
  vertical-align:middle;
  white-space:nowrap;
  word-wrap:normal;
}
.mi{font-size:18px}

header.top{
  position:sticky;
  top:0;
  z-index:50;
  color:#FFFFFF;
  background:#172554;
  border-bottom:3px solid var(--color-primary);
  box-shadow:0 4px 16px rgba(15,23,42,.16);
}
.top-inner{
  width:min(100%,1440px);
  min-height:64px;
  margin:0 auto;
  padding:10px 24px;
  display:flex;
  align-items:center;
  gap:18px;
  flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{
  width:40px;
  height:40px;
  flex:none;
  display:grid;
  place-items:center;
  color:#FFFFFF;
  background:var(--color-primary);
  border:1px solid rgba(255,255,255,.32);
  border-radius:6px;
  box-shadow:4px 4px 0 rgba(59,130,246,.25);
}
.brand .logo .mi{font-size:24px}
.brand .t1{font-size:17px;font-weight:700;letter-spacing:.025em;white-space:nowrap}
.brand .t2{margin-top:1px;color:#CBD5E1;font-size:11px;font-weight:500;letter-spacing:.04em;white-space:nowrap}
.top-status{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:8px;
  color:#E2E8F0;
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:500;
}
.pulse{
  width:9px;
  height:9px;
  flex:none;
  background:#4ADE80;
  border:2px solid #BBF7D0;
  border-radius:50%;
  box-shadow:0 0 0 3px rgba(74,222,128,.18);
  animation:pulse-status 2s ease-out infinite;
}
@keyframes pulse-status{
  0%,100%{box-shadow:0 0 0 3px rgba(74,222,128,.18)}
  50%{box-shadow:0 0 0 7px rgba(74,222,128,0)}
}

nav.tabs{
  position:sticky;
  top:64px;
  z-index:40;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--color-border);
  box-shadow:var(--shadow-sm);
  backdrop-filter:blur(12px);
}
.tabs-inner{
  width:min(100%,1440px);
  margin:0 auto;
  padding:7px 24px;
  display:flex;
  gap:4px;
  overflow-x:auto;
  scrollbar-width:thin;
}
.tabs button{
  min-height:42px;
  flex:1 0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:8px 13px;
  color:var(--color-muted-foreground);
  background:transparent;
  border:1px solid transparent;
  border-radius:5px;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  transition:color .2s ease,background-color .2s ease,border-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.tabs button .mi{font-size:19px}
.tabs button .idx{color:#64748B;font-family:"Fira Code",monospace;font-size:9px;font-weight:600}
.tabs button:hover{color:#1D4ED8;background:#EFF6FF;border-color:#BFDBFE;transform:translateY(-1px)}
.tabs button.active{color:#FFFFFF;background:var(--color-primary);border-color:var(--color-primary);box-shadow:0 3px 8px rgba(37,99,235,.25)}
.tabs button.active .idx{color:#DBEAFE}

:where(button,a,[tabindex]):focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.tabs button.active:focus-visible{outline-color:#EA580C}

main{width:min(100%,1440px);margin:0 auto;padding:24px 24px 64px}
#screen{animation:screen-enter .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes screen-enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.sh{
  position:relative;
  display:flex;
  align-items:center;
  gap:13px;
  margin-bottom:16px;
  padding:14px 16px;
  overflow:hidden;
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-left:4px solid var(--color-primary);
  border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
}
.sh::after{
  content:"";
  position:absolute;
  right:0;
  top:0;
  width:150px;
  height:100%;
  pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(37,99,235,.045));
}
.sh .ic{
  width:42px;
  height:42px;
  flex:none;
  display:grid;
  place-items:center;
  color:var(--color-primary);
  background:#EFF6FF;
  border:1px solid #BFDBFE;
  border-radius:6px;
}
.sh .ic .mi{font-size:24px}
.sh h2{margin:0;color:#0F172A;font-size:20px;font-weight:700;letter-spacing:-.015em;line-height:1.25}
.sh p{max-width:760px;margin:3px 0 0;color:var(--color-muted-foreground);font-size:12px}
.sh .badge{
  position:relative;
  z-index:1;
  margin-left:auto;
  padding:6px 10px;
  color:#1D4ED8;
  background:#EFF6FF;
  border:1px solid #BFDBFE;
  border-radius:4px;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:600;
  letter-spacing:.04em;
  white-space:nowrap;
}

.card{
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.card:hover{border-color:#CBD5E1;box-shadow:var(--shadow-md);transform:translateY(-2px)}
.pad{padding:16px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(300px,1fr)}
.g32{grid-template-columns:minmax(0,1.3fr) minmax(300px,1fr)}
.min0,.min0>*{min-width:0}

.kpi{position:relative;min-height:122px;padding:14px 15px;overflow:hidden;border-top:3px solid #CBD5E1}
.kpi:hover{border-top-color:var(--color-primary)}
.kpi .lab{display:flex;align-items:center;gap:6px;color:var(--color-muted-foreground);font-size:11px;font-weight:600;letter-spacing:.025em}
.kpi .val{margin-top:6px;color:#0F172A;font-family:"Fira Code",monospace;font-size:26px;font-weight:700;letter-spacing:-.04em;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .val small{margin-left:4px;color:#64748B;font-family:"Fira Sans",sans-serif;font-size:11px;font-weight:600;letter-spacing:0}
.kpi .sub{margin-top:6px;font-size:11px;font-weight:600}
.kpi .dot{position:absolute;right:-24px;bottom:-30px;width:84px;height:84px;background:#EFF6FF;border-radius:50%;opacity:.8}
.kpi .mi.big{position:absolute;right:14px;top:14px;color:var(--color-primary);font-size:22px}
.up{color:#166534}.down{color:#B91C1C}.wn{color:#92400E}

h3.blk{margin:0 0 12px;display:flex;align-items:center;gap:8px;color:#0F172A;font-size:13px;font-weight:700;letter-spacing:.01em}
h3.blk::after{content:"";height:1px;flex:1;background:var(--color-border)}
h3.blk .mi{color:var(--color-primary);font-size:19px}
.subtle{color:var(--color-muted-foreground);font-size:11px;line-height:1.55}
.chartbox{position:relative;height:250px}
.chartbox.sm{height:200px}
.chartbox.lg{height:290px}

.tbl{width:100%;min-width:620px;border-collapse:separate;border-spacing:0;color:var(--color-card-foreground);font-size:12px}
.tbl th{
  position:sticky;
  top:0;
  z-index:1;
  padding:9px 11px;
  color:#334155;
  background:#F1F5F9;
  border-top:1px solid var(--color-border);
  border-bottom:1px solid #CBD5E1;
  text-align:left;
  font-size:10px;
  font-weight:700;
  letter-spacing:.055em;
  text-transform:uppercase;
  white-space:nowrap;
}
.tbl th:first-child{border-left:1px solid var(--color-border)}
.tbl th:last-child{border-right:1px solid var(--color-border)}
.tbl td{padding:9px 11px;border-bottom:1px solid var(--color-border);vertical-align:middle}
.tbl tbody tr:nth-child(even) td{background:#FAFCFF}
.tbl tbody tr:hover td{background:#EFF6FF}
.tbl tbody td:nth-child(4),.tbl tbody td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.tbl tbody td:first-child{text-align:left}
.mono{font-family:"Fira Code",monospace;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:23px;
  padding:3px 8px;
  border:1px solid transparent;
  border-radius:4px;
  font-size:10.5px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
}
.t-ok{color:#166534;background:#F0FDF4;border-color:#BBF7D0}
.t-warn{color:#92400E;background:#FFFBEB;border-color:#FDE68A}
.t-bad{color:#B91C1C;background:#FEF2F2;border-color:#FECACA}
.t-info{color:#075985;background:#F0F9FF;border-color:#BAE6FD}
.t-mut{color:#475569;background:#F1F5F9;border-color:#CBD5E1}
.t-acc{color:#9A3412;background:#FFF7ED;border-color:#FED7AA}
.dotpill,.livedot{display:inline-block;width:8px;height:8px;flex:none;border-radius:50%;border:1px solid rgba(15,23,42,.22)}

.bar{height:7px;overflow:hidden;background:#E2E8F0;border-radius:2px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--color-primary),var(--color-secondary));border-radius:2px;transition:width .4s ease}

.proto-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.node{
  position:relative;
  min-width:0;
  padding:12px 12px 12px 16px;
  overflow:hidden;
  background:#FFFFFF;
  border:1px solid var(--color-border);
  border-radius:6px;
  transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.node:hover{border-color:#93C5FD;box-shadow:0 6px 16px rgba(37,99,235,.09);transform:translateY(-2px)}
.node .nh{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.node .pchip{padding:3px 7px;border-radius:3px;font-family:"Fira Code",monospace;font-size:9.5px;font-weight:700;letter-spacing:.035em}
.pc-opc{color:#3730A3;background:#EEF2FF;border:1px solid #C7D2FE}
.pc-mod{color:#166534;background:#F0FDF4;border:1px solid #BBF7D0}
.pc-secs{color:#86198F;background:#FDF4FF;border:1px solid #F5D0FE}
.node .nname{margin-top:8px;color:#0F172A;font-size:13px;font-weight:700}
.node .nmeta{margin-top:2px;overflow:hidden;color:#475569;font-family:"Fira Code",monospace;font-size:9.5px;text-overflow:ellipsis;white-space:nowrap}
.node .nstat{margin-top:9px;display:flex;justify-content:space-between;gap:8px;color:#475569;font-size:10.5px;font-weight:600}
.node .edge{position:absolute;inset:0 auto 0 0;width:4px}
.e-on{background:#16A34A}.e-off{background:#DC2626}.e-warn{background:#D97706}
.blink{animation:blink-status 1.6s ease-in-out infinite}
@keyframes blink-status{0%,100%{opacity:1}50%{opacity:.35}}

.pipe{display:flex;align-items:stretch;gap:0;padding-bottom:4px;overflow-x:auto}
.pstep{position:relative;min-width:150px;flex:1;margin-right:28px;padding:12px;background:#FFFFFF;border:1px solid var(--color-border);border-radius:6px}
.pstep:last-child{margin-right:0}
.pstep::after{content:"";position:absolute;right:-25px;top:50%;width:21px;height:2px;background:var(--color-secondary)}
.pstep::before{content:"";position:absolute;right:-25px;top:calc(50% - 4px);z-index:1;border-width:5px 0 5px 7px;border-style:solid;border-color:transparent transparent transparent var(--color-secondary)}
.pstep:last-child::after,.pstep:last-child::before{display:none}
.pstep .pn{color:#64748B;font-family:"Fira Code",monospace;font-size:9.5px;font-weight:600}
.pstep .pt{margin:4px 0;color:#0F172A;font-size:13px;font-weight:700}
.pstep .pv{color:var(--color-primary);font-family:"Fira Code",monospace;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.pstep .pd{margin-top:2px;color:#475569;font-size:10px}

.maprow{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed #CBD5E1}
.maprow:last-child{border-bottom:0}
.maprow .raw,.maprow .std{overflow:hidden;padding:6px 8px;border-radius:4px;font-family:"Fira Code",monospace;font-size:10.5px;font-weight:500;text-overflow:ellipsis;white-space:nowrap}
.maprow .raw{color:#334155;background:#F1F5F9;border:1px solid #CBD5E1}
.maprow .std{color:#1D4ED8;background:#EFF6FF;border:1px solid #BFDBFE}
.maprow .arr{color:var(--color-primary)}

.qcard{padding:11px;background:#FFFFFF;border:1px solid var(--color-border);border-left:3px solid var(--color-primary);border-radius:5px;transition:border-color .2s ease,box-shadow .2s ease}
.qcard:hover{border-color:#93C5FD;box-shadow:0 5px 14px rgba(37,99,235,.08)}
.qcard .qtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qcard .qname{overflow:hidden;color:#334155;font-size:11px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}
.qcard .qbig{margin-top:4px;color:#0F172A;font-family:"Fira Code",monospace;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}

.sys{display:flex;align-items:flex-start;gap:12px;padding:14px;background:#FFFFFF;border:1px solid var(--color-border);border-radius:6px;transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease}
.sys:hover{border-color:#93C5FD;box-shadow:0 7px 18px rgba(37,99,235,.09);transform:translateY(-2px)}
.sys .sic{width:42px;height:42px;flex:none;display:grid;place-items:center;color:#FFFFFF;border-radius:5px;box-shadow:3px 3px 0 #DBEAFE}
.sys .sname{color:#0F172A;font-size:14px;font-weight:700}
.sys .sdesc{margin-top:2px;color:#475569;font-size:11px}
.sys .schips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}

.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:#CBD5E1}
.tl .ev{position:relative;padding:0 0 15px 8px}
.tl .ev::before{content:"";position:absolute;left:-21px;top:3px;width:12px;height:12px;background:#FFFFFF;border:3px solid var(--color-primary);border-radius:50%}
.tl .ev.warn::before{border-color:#D97706}
.tl .ev.bad::before{border-color:#DC2626}
.tl .et{color:#0F172A;font-size:12px;font-weight:700}
.tl .em{color:#475569;font-size:10.5px}

.flowfoot{margin-top:20px;padding:15px;background:#F1F5F9;border:1px solid #CBD5E1;border-radius:var(--radius)}
.flowfoot .steps{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.flowfoot .fs{min-width:150px;flex:1;padding:10px;background:#FFFFFF;border:1px solid var(--color-border);border-radius:5px;transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease}
.flowfoot .fs:hover{border-color:#93C5FD;box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.flowfoot .fs .fi{color:var(--color-primary);font-family:"Fira Code",monospace;font-size:9.5px;font-weight:700}
.flowfoot .fs .ft{margin-top:3px;color:#0F172A;font-size:12px;font-weight:700}
.flowfoot .fs .fr{margin-top:1px;color:#475569;font-size:10px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;color:#475569;font-size:10.5px;font-weight:500}
.legend span{display:flex;align-items:center;gap:5px}

@media(max-width:1024px){
  .top-inner,.tabs-inner,main{padding-left:18px;padding-right:18px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.g32{grid-template-columns:minmax(0,1.45fr) minmax(280px,1fr)}
  .proto-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media(max-width:768px){
  .top-inner{min-height:58px;padding-top:9px;padding-bottom:9px}
  nav.tabs{top:58px}
  main{padding-top:18px;padding-bottom:48px}
  .g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .sh{align-items:flex-start}
  .sh .badge{margin-left:0}
  .chartbox.lg{height:260px}
  .card:hover,.node:hover,.sys:hover{transform:none}
}

@media(max-width:560px){
  body{font-size:13px;background-size:24px 24px}
  .top-inner,.tabs-inner,main{padding-left:12px;padding-right:12px}
  .brand .logo{width:36px;height:36px}
  .brand .t1{font-size:14px}
  .brand .t2,.top-status{display:none}
  .tabs-inner{gap:3px}
  .tabs button{min-width:44px;min-height:44px;padding:8px 10px}
  .tabs button .txt{display:none}
  .g4,.proto-grid{grid-template-columns:1fr}
  .sh{padding:12px;gap:10px;flex-wrap:wrap}
  .sh .ic{width:38px;height:38px}
  .sh h2{font-size:17px}
  .sh p{font-size:11px}
  .sh .badge{width:100%;padding:5px 8px;text-align:center}
  .kpi{min-height:112px}
  .pad{padding:13px}
  .maprow{grid-template-columns:1fr auto 1fr}
  .chartbox,.chartbox.lg{height:230px}
  .flowfoot .fs{min-width:100%}
}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  #screen,.pulse,.blink{animation:none!important}
  .card:hover,.node:hover,.sys:hover,.tabs button:hover,.flowfoot .fs:hover{transform:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined mi">router</span></div>
      <div class="min0">
        <div class="t1">工業設備連線閘道</div>
        <div class="t2">多協定設備連接 · 邊緣運算 · 雲端傳輸</div>

var RENDER=[v0,v1,v2,v3,v4,v5];
function show(i){
  i=Math.max(0,Math.min(i,RENDER.length-1));
  destroyCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++)btns[b].classList.toggle("active",+btns[b].getAttribute("data-i")===i);
  var container=document.getElementById("screen");
  container.innerHTML="";
  void container.offsetHeight;
  RENDER[i](container);
}
(function buildTabs(){
  var nav=document.getElementById("tabs");
  var inner=el("div","tabs-inner");
  TABS.forEach(function(t,i){
    var b=el("button");b.setAttribute("data-i",i);
    b.innerHTML='<span class="idx">v'+i+'</span><span class="material-symbols-outlined mi">'+t.icon+'</span><span class="txt">'+t.txt+'</span>';
    b.addEventListener("click",function(){show(i);try{history.replaceState(null,"","#v"+i);}catch(e){}window.scrollTo(0,0);});
    inner.appendChild(b);
  });
  nav.appendChild(inner);
})();
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
