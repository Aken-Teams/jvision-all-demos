<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IoT Gateway（工業物聯網閘道）｜Jvision 系統 Demo</title>
<meta name="description" content="多協定設備連接、邊緣運算與雲端傳輸的工業物聯網閘道平台" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#a16207;
  --accent2:#eab308;
  --bg:#f7f5ef;
  --panel:#ffffff;
  --ink:#1c1917;
  --muted:#78716c;
  --line:#e7e2d6;
  --soft:#f3efe4;
  --ok:#15803d;
  --warn:#b45309;
  --bad:#b91c1c;
  --info:#0369a1;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;vertical-align:middle}
.mi{font-size:18px}
/* header / nav */
header.top{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(120deg,#78500a 0%,#a16207 55%,#8a5406 100%);
  color:#fff;
  box-shadow:0 2px 14px rgba(76,52,4,.28);
}
.top-inner{max-width:1360px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .logo{
  width:38px;height:38px;border-radius:11px;flex:none;
  background:linear-gradient(135deg,var(--accent2),#fff6d6);
  display:flex;align-items:center;justify-content:center;color:#5c3d05;
  box-shadow:0 3px 8px rgba(0,0,0,.2);
}
.brand .logo .mi{font-size:24px}
.brand .t1{font-weight:900;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.brand .t2{font-size:11px;color:#fbe8b6;font-weight:600;white-space:nowrap}
.top-status{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:#fbe8b6}
.pulse{width:9px;height:9px;border-radius:50%;background:#86efac;box-shadow:0 0 0 0 rgba(134,239,172,.7);animation:pl 2s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(134,239,172,.6)}70%{box-shadow:0 0 0 9px rgba(134,239,172,0)}100%{box-shadow:0 0 0 0 rgba(134,239,172,0)}}
nav.tabs{background:#fffdf7;border-bottom:1px solid var(--line);position:sticky;top:62px;z-index:40}
.tabs-inner{max-width:1360px;margin:0 auto;padding:8px 16px;display:flex;gap:8px;flex-wrap:wrap}
.tabs button{
  flex:none;white-space:nowrap;cursor:pointer;
  display:flex;align-items:center;gap:7px;
  border:1px solid var(--line);background:#fff;color:var(--muted);
  padding:8px 13px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:700;
  transition:.15s;
}
.tabs button .mi{font-size:19px}
.tabs button:hover{border-color:var(--accent2);color:var(--accent)}
.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 10px rgba(161,98,7,.28)}
.tabs button .idx{font-size:10px;opacity:.65;font-weight:800}
main{max-width:1360px;margin:0 auto;padding:22px 20px 60px}
/* screen header */
.sh{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.sh .ic{width:46px;height:46px;border-radius:13px;flex:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center}
.sh .ic .mi{font-size:26px}
.sh h2{margin:0;font-size:20px;font-weight:900;letter-spacing:.3px}
.sh p{margin:3px 0 0;font-size:13px;color:var(--muted);max-width:640px}
.sh .badge{margin-left:auto;background:var(--soft);border:1px solid var(--line);color:var(--accent);font-weight:800;font-size:12px;padding:7px 12px;border-radius:999px;white-space:nowrap}
/* generic panels */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 10px rgba(80,60,20,.05)}
.pad{padding:16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.3fr 1fr}
.min0>*{min-width:0}
.min0{min-width:0}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
}
/* kpi */
.kpi{padding:15px 16px;position:relative;overflow:hidden}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:27px;font-weight:900;margin-top:7px;letter-spacing:.5px}
.kpi .val small{font-size:13px;font-weight:700;color:var(--muted);margin-left:3px}
.kpi .sub{font-size:11.5px;margin-top:5px;font-weight:700}
.kpi .dot{position:absolute;right:-16px;top:-16px;width:64px;height:64px;border-radius:50%;background:var(--soft);opacity:.7}
.kpi .mi.big{position:absolute;right:14px;top:16px;font-size:22px;color:var(--accent2)}
.up{color:var(--ok)}.down{color:var(--bad)}.wn{color:var(--warn)}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:620px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.4px;color:var(--muted);font-weight:800;text-transform:uppercase;padding:10px 12px;border-bottom:2px solid var(--line);background:var(--soft);position:sticky;top:0}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#fffdf5}
.mono{font-variant-numeric:tabular-nums;font-family:"Inter",monospace;font-weight:700}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:800;white-space:nowrap}
.t-ok{background:#dcfce7;color:#15803d}
.t-warn{background:#fef3c7;color:#b45309}
.t-bad{background:#fee2e2;color:#b91c1c}
.t-info{background:#e0f2fe;color:#0369a1}
.t-mut{background:#eee9dc;color:#78716c}
.t-acc{background:#fff2cf;color:#8a5406}
.dotpill{width:8px;height:8px;border-radius:50%;display:inline-block}
h3.blk{margin:0 0 12px;font-size:14px;font-weight:900;display:flex;align-items:center;gap:8px}
h3.blk .mi{color:var(--accent);font-size:20px}
.subtle{font-size:12px;color:var(--muted)}
.chartbox{position:relative;height:250px}
.chartbox.sm{height:200px}
.chartbox.lg{height:290px}
/* progress bar */
.bar{height:8px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
/* protocol node cards (screen0 signature) */
.proto-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:820px){.proto-grid{grid-template-columns:1fr}}
.node{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;position:relative;overflow:hidden;min-width:0}
.node .nh{display:flex;align-items:center;gap:9px}
.node .pchip{font-size:10.5px;font-weight:900;padding:3px 8px;border-radius:7px;letter-spacing:.4px}
.pc-opc{background:#e0e7ff;color:#3730a3}
.pc-mod{background:#dcfce7;color:#166534}
.pc-secs{background:#fae8ff;color:#86198f}
.node .nname{font-weight:900;font-size:14px;margin-top:9px}
.node .nmeta{font-size:11.5px;color:var(--muted);margin-top:2px}
.node .nstat{display:flex;justify-content:space-between;margin-top:11px;font-size:11.5px;font-weight:700}
.node .edge{position:absolute;left:0;top:0;bottom:0;width:5px}
.e-on{background:linear-gradient(180deg,var(--ok),#86efac)}
.e-off{background:linear-gradient(180deg,var(--bad),#fca5a5)}
.e-warn{background:linear-gradient(180deg,var(--warn),#fcd34d)}
.livedot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px}
.blink{animation:bk 1.6s infinite}
@keyframes bk{0%,100%{opacity:1}50%{opacity:.3}}
/* pipeline (screen2/3) */
.pipe{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding-bottom:4px}
.pstep{flex:1;min-width:150px;border:1px solid var(--line);border-radius:12px;padding:12px;margin-right:26px;position:relative;background:#fff}
.pstep:last-child{margin-right:0}
.pstep::after{content:"";position:absolute;right:-24px;top:50%;width:22px;height:2px;background:var(--accent2)}
.pstep:last-child::after{display:none}
.pstep .pn{font-size:11px;color:var(--muted);font-weight:800}
.pstep .pt{font-weight:900;font-size:14px;margin:5px 0}
.pstep .pv{font-size:20px;font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums}
.pstep .pd{font-size:11px;color:var(--muted);margin-top:3px}
/* mapping rows (screen3) */
.maprow{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.maprow:last-child{border-bottom:none}
.maprow .raw{font-family:monospace;font-size:12px;background:var(--soft);padding:6px 9px;border-radius:8px;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.maprow .std{font-family:monospace;font-size:12px;background:#fff5d6;color:#8a5406;padding:6px 9px;border-radius:8px;font-weight:800;overflow:hidden;text-overflow:ellipsis}
.maprow .arr{color:var(--accent2)}
/* queue cards (screen4) */
.qcard{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fff}
.qcard .qtop{display:flex;justify-content:space-between;align-items:center}
.qcard .qname{font-weight:900;font-size:13.5px}
.qcard .qbig{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;margin-top:6px}
/* integration cards (screen5) */
.sys{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fff;display:flex;gap:13px;align-items:flex-start}
.sys .sic{width:44px;height:44px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.sys .sname{font-weight:900;font-size:15px}
.sys .sdesc{font-size:12px;color:var(--muted);margin-top:3px}
.sys .schips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
/* timeline (screen1) */
.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:0 0 16px 8px}
.tl .ev::before{content:"";position:absolute;left:-21px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.tl .ev.warn::before{border-color:var(--warn)}
.tl .ev.bad::before{border-color:var(--bad)}
.tl .et{font-weight:800;font-size:13px}
.tl .em{font-size:11.5px;color:var(--muted)}
.flowfoot{margin-top:26px;background:linear-gradient(120deg,#fffdf7,#faf5e6);border:1px solid var(--line);border-radius:16px;padding:16px}
.flowfoot .steps{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.flowfoot .fs{flex:1;min-width:150px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px}
.flowfoot .fs .fi{font-size:10.5px;font-weight:900;color:var(--accent2)}
.flowfoot .fs .ft{font-weight:800;font-size:13px;margin-top:3px}
.flowfoot .fs .fr{font-size:11px;color:var(--muted);margin-top:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:8px}
.legend span{display:flex;align-items:center;gap:5px}
@media(max-width:560px){
  .tabs button .txt{display:none}
  .tabs button{padding:9px 11px}
  .brand .t2{display:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined mi">router</span></div>
      <div class="min0">
        <div class="t1">IoT Gateway 工業物聯網閘道</div>
        <div class="t2">多協定設備連接 · 邊緣運算 · 雲端傳輸</div>
      </div>
    </div>
    <div class="top-status"><span class="pulse"></span>閘道群組 GW-CLUSTER-A 運行中</div>
  </div>
</header>
<nav class="tabs" id="tabs"></nav>
<main><div id="screen"></div></main>

<script>
"use strict";
var TABS=[
  {icon:"device_hub",name:"設備連接管理",txt:"設備連接"},
  {icon:"sensors",name:"訊號點位監控",txt:"點位監控"},
  {icon:"developer_board",name:"邊緣運算前處理",txt:"邊緣運算"},
  {icon:"swap_horiz",name:"協定轉換標準化",txt:"協定轉換"},
  {icon:"cloud_upload",name:"雲端傳輸佇列",txt:"雲端傳輸"},
  {icon:"hub",name:"上層系統整合",txt:"系統整合"}
];
var SUB=[
  "OPC UA／Modbus／SECS-GEM 多協定設備註冊、連線狀態與覆蓋率監控。",
  "即時擷取設備標籤點位數值、訊號品質與更新頻率，異常門檻告警。",
  "在閘道邊緣端進行過濾去噪、聚合、單位換算與規則計算，降低上傳量。",
  "將異質協定原始標籤映射為統一資料模型與命名規範，語意一致化。",
  "MQTT／Kafka 佇列上傳吞吐、端到端延遲與斷線緩存重送監控。",
  "對接 MES／SCADA／Digital Twin 的訂閱、分發與資料契約管理。"
];
var charts={};
function destroyCharts(){for(var k in charts){if(charts[k]){try{charts[k].destroy();}catch(e){}charts[k]=null;}}charts={};}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return c==="&"?"&amp;":c==="<"?"&lt;":"&gt;";});}

/* ---- shared flow footer ---- */
function flowFooter(activeIdx){
  var stages=[
    {i:"v0",t:"設備訊號擷取",r:"設備工程師",s:0},
    {i:"v2",t:"邊緣運算前處理",r:"資訊工程師",s:2},
    {i:"v3",t:"協定轉換標準化",r:"資訊工程師",s:3},
    {i:"v4",t:"資料上傳雲端／平台",r:"資訊工程師",s:4},
    {i:"v5",t:"上層系統應用",r:"製造工程師",s:5}
  ];
  var h='<h3 class="blk"><span class="material-symbols-outlined mi">account_tree</span>作業流程五階段</h3>';
  h+='<div class="subtle">輸入：設備協定與位址 · 採集點位清單 · 上傳目標與主題 　→　 產出：上層系統應用紀錄；追蹤設備連網覆蓋率與數據傳輸延遲</div>';
  h+='<div class="steps">';
  stages.forEach(function(st){
    var on=st.s===activeIdx?'style="border-color:var(--accent);box-shadow:0 3px 10px rgba(161,98,7,.18)"':'';
    h+='<div class="fs" '+on+'><div class="fi">'+st.i+' · 對應畫面 '+st.s+'</div><div class="ft">'+st.t+'</div><div class="fr">'+st.r+'</div></div>';
  });
  h+='</div>';
  var f=el("div","flowfoot");f.innerHTML=h;return f;
}
function shead(i){
  var d=el("div","sh");
  d.innerHTML='<div class="ic"><span class="material-symbols-outlined mi">'+TABS[i].icon+'</span></div>'+
    '<div class="min0"><h2>'+TABS[i].name+'</h2><p>'+SUB[i]+'</p></div>'+
    '<div class="badge">模組 '+(i+1)+' / 6</div>';
  return d;
}

/* ================= SCREEN 0 : 設備連接管理 ================= */
function v0(c){
  c.appendChild(shead(0));
  var kpis=[
    {l:"已連接設備",v:"148",u:"台",s:"連網覆蓋率 92.5%",cls:"up",ic:"lan"},
    {l:"線上比例",v:"96.6",u:"%",s:"143 台在線 / 5 台離線",cls:"up",ic:"wifi"},
    {l:"平均連線延遲",v:"18",u:"ms",s:"較昨日 -3ms",cls:"up",ic:"speed"},
    {l:"協定種類",v:"3",u:"類",s:"OPC UA · Modbus · SECS-GEM",cls:"",ic:"cable"}
  ];
  var g=el("div","grid g4 min0");
  kpis.forEach(function(k){
    var e=el("div","card kpi");
    e.innerHTML='<span class="dot"></span><span class="material-symbols-outlined mi big">'+k.ic+'</span>'+
      '<div class="lab">'+k.l+'</div><div class="val">'+k.v+'<small>'+k.u+'</small></div>'+
      '<div class="sub '+k.cls+'">'+k.s+'</div>';
    g.appendChild(e);
  });
  c.appendChild(g);

  var row=el("div","grid g23 min0");row.style.marginTop="14px";
  // signature: protocol node cards
  var left=el("div","card pad min0");
  left.appendChild(el("h3","blk",'<span class="material-symbols-outlined mi">device_hub</span>閘道連接節點 · 即時狀態'));
  var nodes=[
    {p:"OPC UA",pc:"pc-opc",name:"CNC 加工中心 #1",meta:"opc.tcp://10.2.11.5:4840",dev:32,thr:"1.2k 點/秒",st:"on",e:"e-on",stat:"線上"},
    {p:"Modbus",pc:"pc-mod",name:"注塑機群 A 線",meta:"tcp 10.2.14.20:502",dev:24,thr:"780 點/秒",st:"on",e:"e-on",stat:"線上"},
    {p:"SECS-GEM",pc:"pc-secs",name:"半導體蝕刻機台",meta:"HSMS 10.2.9.8:5000",dev:18,thr:"2.1k 點/秒",st:"warn",e:"e-warn",stat:"延遲偏高"},
    {p:"OPC UA",pc:"pc-opc",name:"沖壓生產線 B",meta:"opc.tcp://10.2.11.9:4840",dev:28,thr:"960 點/秒",st:"on",e:"e-on",stat:"線上"},
    {p:"Modbus",pc:"pc-mod",name:"環境監測 (溫溼度)",meta:"rtu COM3 9600",dev:12,thr:"120 點/秒",st:"off",e:"e-off",stat:"離線"},
    {p:"SECS-GEM",pc:"pc-secs",name:"AOI 光學檢測站",meta:"HSMS 10.2.9.14:5000",dev:14,thr:"1.6k 點/秒",st:"on",e:"e-on",stat:"線上"}
  ];
  var ng=el("div","proto-grid");
  nodes.forEach(function(n){
    var stCls=n.st==="on"?"t-ok":n.st==="warn"?"t-warn":"t-bad";
    var dotC=n.st==="on"?"#15803d":n.st==="warn"?"#b45309":"#b91c1c";
    var e=el("div","node");
    e.innerHTML='<span class="edge '+n.e+'"></span>'+
      '<div class="nh"><span class="pchip '+n.pc+'">'+n.p+'</span>'+
      '<span class="tag '+stCls+'"><span class="livedot blink" style="background:'+dotC+'"></span>'+n.stat+'</span></div>'+
      '<div class="nname">'+n.name+'</div><div class="nmeta">'+n.meta+'</div>'+
      '<div class="nstat"><span>設備數 <b class="mono">'+n.dev+'</b></span><span>吞吐 <b class="mono">'+n.thr+'</b></span></div>';
    ng.appendChild(e);
  });
  left.appendChild(ng);
  row.appendChild(left);

  var right=el("div","card pad min0");

var RENDER=[v0,v1,v2,v3,v4,v5];
function show(i){
  i=Math.max(0,Math.min(i,RENDER.length-1));
  destroyCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++)btns[b].classList.toggle("active",+btns[b].getAttribute("data-i")===i);
  var container=document.getElementById("screen");
  container.innerHTML="";
  void container.offsetHeight;
  RENDER[i](container);
}
(function buildTabs(){
  var nav=document.getElementById("tabs");
  var inner=el("div","tabs-inner");
  TABS.forEach(function(t,i){
    var b=el("button");b.setAttribute("data-i",i);
    b.innerHTML='<span class="idx">v'+i+'</span><span class="material-symbols-outlined mi">'+t.icon+'</span><span class="txt">'+t.txt+'</span>';
    b.addEventListener("click",function(){show(i);try{history.replaceState(null,"","#v"+i);}catch(e){}window.scrollTo(0,0);});
    inner.appendChild(b);
  });
  nav.appendChild(inner);
})();
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
