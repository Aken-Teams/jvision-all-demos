<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>售後退換追蹤台｜Jvision 系統 Demo</title>
<meta name="description" content="退換貨申請、RMA 進度、到貨檢測到退款換貨與客服關懷的售後一體化管理（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --accent:#0891b2; --accent2:#22d3ee; --accent-d:#0e7490;
    --ink:#0c2b33; --body:#3b5c64; --muted:#77939b; --line:#dcecf0;
    --bg:#f2fbfc; --card:#ffffff; --soft:#e2f7fb;
    --green:#16a34a; --gr-bg:#dcfce7; --amber:#d97706; --am-bg:#fef3c7;
    --blue:#2563eb; --bl-bg:#dbeafe; --red:#dc2626; --rd-bg:#fee2e2;
    --violet:#7c3aed; --vi-bg:#ede9fe;
  }
  *{ box-sizing:border-box; } html,body{ margin:0; }
  body{ font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--body); -webkit-font-smoothing:antialiased; }
  .material-symbols-outlined{ font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; line-height:1; }
  /* ===== top nav ===== */
  .nav{ position:sticky; top:0; z-index:20; background:linear-gradient(120deg,var(--accent-d),var(--accent2)); color:#fff; box-shadow:0 4px 16px rgba(8,145,178,.24); }
  .nav-in{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:11px 22px; max-width:1520px; margin:0 auto; min-width:0; }
  .brand{ display:flex; align-items:center; gap:11px; }
  .brand .lg{ width:42px; height:42px; border-radius:13px; background:#fff; color:var(--accent); display:grid; place-content:center; box-shadow:0 4px 12px rgba(0,0,0,.16); }
  .brand .lg .material-symbols-outlined{ font-size:25px; }
  .brand b{ display:block; font-size:16px; font-weight:900; letter-spacing:.02em; }
  .brand small{ display:block; font-size:11px; color:#d5f4fa; }
  .tabs{ display:flex; align-items:center; gap:4px; flex-wrap:wrap; flex:1; min-width:0; }
  .tabs button{ display:inline-flex; align-items:center; gap:7px; border:0; background:rgba(255,255,255,.12); color:#fff; font:inherit; font-size:13px; font-weight:700; padding:8px 13px; border-radius:11px; cursor:pointer; transition:background .15s; white-space:nowrap; flex:none; }
  .tabs button .material-symbols-outlined{ font-size:19px; }
  .tabs button:hover{ background:rgba(255,255,255,.24); }
  .tabs button.on{ background:#fff; color:var(--accent-d); box-shadow:0 3px 10px rgba(0,0,0,.14); }
  .nav-r{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .npill{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:800; background:rgba(255,255,255,.18); border-radius:999px; padding:6px 12px; white-space:nowrap; }
  .npill .material-symbols-outlined{ font-size:16px; }
  .npill .dot{ width:8px; height:8px; border-radius:50%; background:#4ade80; animation:pulse 2s infinite; }
  @keyframes pulse{ 0%{ box-shadow:0 0 0 0 rgba(74,222,128,.6);} 70%{ box-shadow:0 0 0 8px rgba(74,222,128,0);} 100%{ box-shadow:0 0 0 0 rgba(74,222,128,0);} }
  .ava{ width:36px; height:36px; border-radius:50%; background:#fff; color:var(--accent-d); font-weight:900; display:grid; place-content:center; font-size:14px; }
  /* ===== layout ===== */
  .wrap{ max-width:1520px; margin:0 auto; padding:22px 22px 48px; min-width:0; }
  .phead{ display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap; margin-bottom:18px; }
  .phead h1{ margin:0; font-size:22px; font-weight:900; color:var(--ink); }
  .phead p{ margin:2px 0 0; font-size:13px; color:var(--muted); }
  .phead .sp{ margin-left:auto; display:flex; gap:9px; flex-wrap:wrap; }
  .btn{ display:inline-flex; align-items:center; gap:6px; height:38px; padding:0 15px; border-radius:11px; border:0; background:var(--accent); color:#fff; font:inherit; font-weight:800; font-size:13px; cursor:pointer; }
  .btn:hover{ background:var(--accent-d); }
  .btn.ghost{ background:#fff; color:var(--accent); border:1px solid var(--line); }
  .btn.ghost:hover{ background:var(--soft); }
  .btn .material-symbols-outlined{ font-size:18px; }
  h3.sec{ margin:0 0 12px; font-size:15px; font-weight:900; color:var(--ink); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  h3.sec .material-symbols-outlined{ color:var(--accent); font-size:20px; }
  h3.sec .tag{ margin-left:auto; font-size:11px; font-weight:800; color:var(--muted); }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px 20px; }
  .grid{ display:grid; gap:18px; } .grid>*{ min-width:0; }
  .g2{ grid-template-columns:1.5fr 1fr; } .g2b{ grid-template-columns:1.6fr 1fr; } .g2e{ grid-template-columns:1fr 1fr; }
  /* ===== KPI ===== */
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:18px; }
  .kpi{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:15px 17px; position:relative; overflow:hidden; }
  .kpi::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:linear-gradient(var(--accent),var(--accent2)); }
  .kpi .l{ font-size:12px; font-weight:800; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .kpi .l .material-symbols-outlined{ font-size:16px; color:var(--accent); }
  .kpi .v{ font-size:26px; font-weight:900; color:var(--ink); margin-top:6px; } .kpi .v small{ font-size:13px; color:var(--muted); font-weight:700; }
  .kpi .d{ font-size:12px; font-weight:800; margin-top:3px; } .kpi .d.up{ color:var(--green); } .kpi .d.dn{ color:var(--red); } .kpi .d.fl{ color:var(--accent); }
  /* ===== RMA board ===== */
  .board-wrap{ overflow-x:auto; padding-bottom:6px; }
  .board{ display:grid; grid-template-columns:repeat(6,minmax(212px,1fr)); gap:13px; }
  .bcol{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:12px; display:flex; flex-direction:column; gap:10px; min-width:0; }
  .bcol-h{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:900; color:var(--ink); padding:2px 2px 10px; border-bottom:2px solid var(--line); }
  .bcol-h .material-symbols-outlined{ font-size:19px; }
  .bcol-h .n{ margin-left:auto; font-size:12px; font-weight:900; color:#fff; border-radius:999px; padding:1px 10px; background:var(--accent); }
  .bcol.s0 .bcol-h{ border-color:#a5f3fc; } .bcol.s0 .bcol-h .material-symbols-outlined{ color:var(--accent); } .bcol.s0 .bcol-h .n{ background:var(--accent); }
  .bcol.s1 .bcol-h{ border-color:#93c5fd; } .bcol.s1 .bcol-h .material-symbols-outlined{ color:var(--blue); } .bcol.s1 .bcol-h .n{ background:var(--blue); }
  .bcol.s2 .bcol-h{ border-color:#fcd34d; } .bcol.s2 .bcol-h .material-symbols-outlined{ color:var(--amber); } .bcol.s2 .bcol-h .n{ background:var(--amber); }
  .bcol.s3 .bcol-h{ border-color:#86efac; } .bcol.s3 .bcol-h .material-symbols-outlined{ color:var(--green); } .bcol.s3 .bcol-h .n{ background:var(--green); }
  .bcol.s4 .bcol-h{ border-color:#ddd6fe; } .bcol.s4 .bcol-h .material-symbols-outlined{ color:var(--violet); } .bcol.s4 .bcol-h .n{ background:var(--violet); }
  .bcol.s5 .bcol-h{ border-color:#cbd5e1; } .bcol.s5 .bcol-h .material-symbols-outlined{ color:#64748b; } .bcol.s5 .bcol-h .n{ background:#64748b; }
  .gc{ border:1px solid var(--line); border-radius:14px; padding:11px 12px; background:#fff; border-left:5px solid var(--accent); }
  .gc.s1{ border-left-color:var(--blue); } .gc.s2{ border-left-color:var(--amber); } .gc.s3{ border-left-color:var(--green); } .gc.s4{ border-left-color:var(--violet); } .gc.s5{ border-left-color:#64748b; }
  .gc.rush{ background:#fff8f5; border-left-color:var(--red); animation:beat 1.9s ease-in-out infinite; }
  @keyframes beat{ 0%,100%{ box-shadow:0 0 0 0 rgba(220,38,38,0);} 50%{ box-shadow:0 0 0 4px rgba(220,38,38,.09);} }
  .gc-h{ display:flex; align-items:center; gap:7px; margin-bottom:7px; flex-wrap:wrap; }
  .gc-h .no{ font-size:13px; font-weight:900; color:var(--ink); }
  .gc-h .rush-b{ font-size:10px; font-weight:900; color:var(--red); background:var(--rd-bg); border-radius:6px; padding:1px 7px; }
  .gc-h .typ{ margin-left:auto; font-size:10px; font-weight:900; border-radius:6px; padding:1px 7px; }
  .typ.ret{ background:var(--bl-bg); color:#1d4ed8; } .typ.exc{ background:var(--vi-bg); color:#6d28d9; }
  .gc .who{ font-size:12px; color:var(--body); font-weight:700; margin-bottom:6px; display:flex; align-items:center; gap:5px; }
  .gc .who .material-symbols-outlined{ font-size:14px; color:var(--muted); }
  .gc .item{ font-size:12px; color:var(--ink); font-weight:700; display:flex; align-items:center; gap:6px; margin-bottom:7px; }
  .gc .item .em{ font-size:17px; }
  .gc .gl{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom:8px; }
  .gtag{ font-size:11px; font-weight:800; border-radius:8px; padding:2px 8px; background:var(--soft); color:var(--accent-d); display:inline-flex; align-items:center; gap:3px; }
  .gtag .material-symbols-outlined{ font-size:13px; }
  .gtag.money{ background:var(--am-bg); color:#b45309; } .gtag.warn{ background:var(--rd-bg); color:#b91c1c; }
  .gc-f{ display:flex; align-items:center; justify-content:space-between; font-size:11px; color:var(--muted); font-weight:700; border-top:1px dashed var(--line); padding-top:7px; }
  .gc-f .due.late{ color:var(--red); font-weight:900; }
  /* ===== reason bars mini ===== */
  .rlist{ display:flex; flex-direction:column; gap:9px; }
  .rrow{ display:flex; align-items:center; gap:10px; font-size:12px; }
  .rrow b{ width:96px; color:var(--ink); flex:none; font-weight:800; }
  .rrow .bar{ flex:1; height:9px; border-radius:999px; background:var(--line); overflow:hidden; } .rrow .bar span{ display:block; height:100%; border-radius:999px; }
  .rrow .val{ width:52px; text-align:right; font-weight:900; color:var(--body); flex:none; }
  /* ===== list rows ===== */
  .nlist{ display:flex; flex-direction:column; gap:9px; }
  .nrow{ display:flex; align-items:center; gap:11px; padding:11px 13px; border:1px solid var(--line); border-radius:14px; background:#fff; flex-wrap:wrap; }
  .nrow .av{ width:38px; height:38px; border-radius:11px; background:var(--soft); color:var(--accent-d); font-weight:900; display:grid; place-content:center; flex:none; font-size:14px; }
  .nrow .info{ flex:1; min-width:130px; } .nrow .info b{ color:var(--ink); font-size:13px; } .nrow .info small{ display:block; color:var(--muted); font-size:11px; }
  .nrow .ch{ font-size:11px; font-weight:800; border-radius:999px; padding:3px 9px; display:inline-flex; align-items:center; gap:4px; white-space:nowrap; }
  .nrow .ch .material-symbols-outlined{ font-size:14px; }
  .ch.line{ background:var(--gr-bg); color:#15803d; } .ch.sms{ background:var(--bl-bg); color:#1d4ed8; } .ch.mail{ background:var(--vi-bg); color:#6d28d9; } .ch.wait{ background:var(--am-bg); color:#b45309; } .ch.over{ background:var(--rd-bg); color:#b91c1c; }
  /* ===== apply screen (3col) ===== */
  .pos3{ display:grid; grid-template-columns:180px 1fr 350px; gap:16px; align-items:start; }
  .pos3>*{ min-width:0; }
  .catlist{ display:flex; flex-direction:column; gap:8px; }
  .catlist button{ text-align:left; border:1px solid var(--line); background:#fff; border-radius:12px; padding:12px 13px; font:inherit; font-weight:800; font-size:13px; color:var(--body); cursor:pointer; display:flex; align-items:center; gap:9px; }
  .catlist button .material-symbols-outlined{ color:var(--accent); font-size:20px; }
  .catlist button.on{ background:var(--accent); color:#fff; border-color:var(--accent); } .catlist button.on .material-symbols-outlined{ color:#fff; }
  .prods{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:13px; }
  .prod{ background:#fff; border:1px solid var(--line); border-radius:15px; overflow:hidden; cursor:pointer; transition:transform .12s,box-shadow .12s; }
  .prod:hover{ transform:translateY(-3px); box-shadow:0 12px 24px rgba(8,145,178,.12); }
  .prod .ph{ height:70px; display:grid; place-content:center; font-size:32px; background:linear-gradient(135deg,#e2f7fb,#c7eff5); }
  .prod .info{ padding:10px 12px; } .prod .info b{ display:block; font-size:14px; color:var(--ink); } .prod .info .pr{ color:var(--accent); font-weight:900; font-size:14px; margin-top:2px; }
  .prod .info .pr small{ color:var(--muted); font-size:11px; font-weight:700; }
  .ticket{ background:#fff; border:1px solid var(--line); border-radius:18px; padding:16px; position:sticky; top:86px; }
  .ticket-h{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; } .ticket-h b{ font-size:16px; color:var(--ink); } .ticket-h .tag{ font-size:12px; color:var(--muted); font-weight:700; }
  .ci{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px dashed var(--line); }
  .ci .em{ width:36px; height:36px; border-radius:10px; background:var(--soft); display:grid; place-content:center; font-size:19px; flex:none; }
  .ci .nm{ flex:1; min-width:0; } .ci .nm b{ font-size:13px; color:var(--ink); display:block; } .ci .nm small{ color:var(--accent-d); font-size:11px; font-weight:700; }
  .ci .amt{ font-weight:900; color:var(--ink); font-size:13px; white-space:nowrap; }
  .ticket-sum{ margin-top:13px; font-size:14px; } .ticket-sum .row{ display:flex; justify-content:space-between; padding:3px 0; color:var(--body); }
  .ticket-sum .total{ font-size:21px; font-weight:900; color:var(--ink); border-top:1px dashed var(--line); margin-top:8px; padding-top:11px; }
  .btn.block{ width:100%; justify-content:center; height:46px; font-size:15px; margin-top:12px; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip{ font-size:11px; font-weight:800; border:1px solid var(--line); background:var(--soft); color:var(--accent-d); border-radius:999px; padding:4px 10px; cursor:pointer; }
  .chip.on{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .seg{ display:flex; gap:6px; margin-bottom:10px; }
  .seg button{ flex:1; border:1px solid var(--line); background:#fff; color:var(--body); font:inherit; font-weight:800; font-size:12px; padding:8px; border-radius:10px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:5px; }
  .seg button .material-symbols-outlined{ font-size:17px; }
  .seg button.on{ background:var(--accent); color:#fff; border-color:var(--accent); }
  /* ===== inspection ===== */
  .insp{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:13px; }
  .icell{ border:2px solid var(--line); border-radius:14px; background:#fff; padding:13px 11px; display:flex; flex-direction:column; gap:5px; min-width:0; position:relative; }
  .icell .ph{ height:56px; border-radius:10px; background:linear-gradient(135deg,#e2f7fb,#c7eff5); display:grid; place-content:center; font-size:28px; margin-bottom:4px; }
  .icell .no{ font-size:12px; font-weight:900; color:var(--ink); }
  .icell .nm{ font-size:12px; color:var(--body); font-weight:700; }
  .icell .st2{ font-size:10px; font-weight:900; border-radius:999px; padding:2px 9px; align-self:flex-start; margin-top:2px; }
  .icell.pass{ border-color:#86efac; } .icell.pass .st2{ background:var(--gr-bg); color:#15803d; }
  .icell.fail{ border-color:#fecaca; } .icell.fail .st2{ background:var(--rd-bg); color:#b91c1c; }
  .icell.wait{ border-color:#fcd34d; } .icell.wait .st2{ background:var(--am-bg); color:#b45309; }
  /* ===== card card (refund) ===== */
  .mcard{ background:linear-gradient(120deg,var(--accent-d),var(--accent2)); color:#fff; border-radius:18px; padding:20px; position:relative; overflow:hidden; }
  .mcard::after{ content:"currency_exchange"; font-family:"Material Symbols Outlined"; position:absolute; right:-14px; bottom:-20px; font-size:130px; opacity:.14; }
  .mcard .lv{ font-size:12px; font-weight:800; letter-spacing:.1em; opacity:.9; }
  .mcard .nm{ font-size:26px; font-weight:900; margin:4px 0 2px; }
  .mcard .no{ font-size:12px; opacity:.85; letter-spacing:.08em; }
  .mcard .bal{ display:flex; gap:26px; margin-top:16px; flex-wrap:wrap; } .mcard .bal .b{ min-width:0; } .mcard .bal .b small{ font-size:11px; opacity:.85; display:block; } .mcard .bal .b b{ font-size:20px; font-weight:900; }
  .hist{ display:flex; align-items:center; gap:11px; padding:10px 0; border-bottom:1px solid var(--line); }
  .hist .ic{ width:36px; height:36px; border-radius:10px; background:var(--soft); color:var(--accent-d); display:grid; place-content:center; flex:none; } .hist .ic .material-symbols-outlined{ font-size:19px; }
  .hist .tx{ flex:1; min-width:0; } .hist .tx b{ font-size:13px; color:var(--ink); display:block; } .hist .tx small{ color:var(--muted); font-size:11px; }
  .hist .amt{ font-weight:900; font-size:14px; white-space:nowrap; } .hist .amt.pos{ color:var(--green); } .hist .amt.neg{ color:var(--red); }
  /* ===== report ===== */
  .chart-box{ position:relative; width:100%; height:290px; }
  .rank{ display:flex; align-items:center; gap:12px; padding:7px 0; }
  .rank .rk{ width:26px; height:26px; border-radius:8px; background:var(--soft); color:var(--accent-d); font-weight:900; display:grid; place-content:center; flex:none; }
  .rank b{ width:120px; color:var(--ink); flex:none; }
  .bar{ flex:1; height:9px; border-radius:999px; background:var(--line); overflow:hidden; } .bar span{ display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); }
  .rank .val{ font-weight:900; color:var(--ink); width:64px; text-align:right; flex:none; }
  .tbl-wrap{ overflow-x:auto; }
  table.data{ width:100%; border-collapse:collapse; font-size:13px; min-width:560px; }
  table.data th{ text-align:left; font-size:11px; font-weight:800; color:var(--muted); padding:9px 12px; border-bottom:2px solid var(--line); white-space:nowrap; }
  table.data td{ padding:10px 12px; border-bottom:1px solid var(--line); color:var(--body); white-space:nowrap; }
  table.data tr:hover td{ background:var(--soft); }
  .pill{ display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:800; border-radius:999px; padding:2px 9px; }
  .pill.g{ background:var(--gr-bg); color:#15803d; } .pill.a{ background:var(--am-bg); color:#b45309; } .pill.b{ background:var(--bl-bg); color:#1d4ed8; } .pill.v{ background:var(--vi-bg); color:#6d28d9; } .pill.r{ background:var(--rd-bg); color:#b91c1c; }
  /* ===== steps timeline ===== */
  .steps{ display:flex; flex-direction:column; gap:0; }
  .step{ display:flex; gap:12px; }
  .step .rail{ display:flex; flex-direction:column; align-items:center; flex:none; }
  .step .dot{ width:30px; height:30px; border-radius:50%; display:grid; place-content:center; font-size:16px; color:#fff; background:var(--accent); z-index:1; }
  .step.done .dot{ background:var(--green); } .step.now .dot{ background:var(--amber); animation:beat 1.6s infinite; } .step.wait .dot{ background:var(--line); color:var(--muted); }
  .step .line{ width:2px; flex:1; background:var(--line); min-height:14px; }
  .step:last-child .line{ display:none; }
  .step .body{ padding-bottom:16px; flex:1; min-width:0; }
  .step .body b{ font-size:13px; color:var(--ink); display:block; } .step .body small{ color:var(--muted); font-size:11px; }
  /* ===== RWD ===== */
  @media (max-width:1100px){
    .g2,.g2b,.g2e{ grid-template-columns:1fr; }
    .pos3{ grid-template-columns:1fr; } .ticket{ position:static; } .catlist{ flex-direction:row; overflow-x:auto; } .catlist button{ white-space:nowrap; }
  }
  @media (max-width:820px){
    .g2,.g2b,.g2e{ grid-template-columns:1fr; }
  }
  @media (max-width:640px){
    .wrap{ padding:16px 14px 40px; }
    .nav-in{ padding:10px 14px; gap:12px; }
  }

/* ===== charts (Chart.js) ===== */
let charts=[];
function killCharts(){ charts.forEach(c=>{try{c.destroy();}catch(e){}}); charts=[]; }
function draw(i){
  killCharts();
  if(!window.Chart) return;
  Chart.defaults.font.family='Inter,"Noto Sans TC",sans-serif';
  Chart.defaults.color="#77939b";
  if(i===0){
    const el=document.getElementById("cReasonMini");
    if(el) charts.push(new Chart(el,{ type:"doughnut", data:{
      labels:REASONS.map(r=>r[0]),
      datasets:[{ data:REASONS.map(r=>r[1]), backgroundColor:REASONS.map(r=>r[2]), borderColor:"#fff", borderWidth:2 }]
    }, options:{ cutout:"58%", responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:"right", labels:{ boxWidth:12, font:{size:11} } }, tooltip:{ callbacks:{ label:c=>` ${c.label}: ${c.parsed}%` } } } } }));
  }
  if(i===5){
    const t=document.getElementById("cTrend");
    if(t) charts.push(new Chart(t,{ type:"line", data:{
      labels:["W1","W2","W3","W4","W5","W6","W7","W8"],
      datasets:[
        { label:"整體退貨率 %", data:[6.4,6.1,5.8,5.5,5.2,5.0,4.9,4.8], borderColor:"#0891b2", backgroundColor:"rgba(8,145,178,.10)", borderWidth:3, fill:true, tension:.4, pointBackgroundColor:"#0891b2" },
        { label:"換貨率 %", data:[3.8,3.6,3.5,3.2,3.0,2.9,2.7,2.6], borderColor:"#22d3ee", backgroundColor:"transparent", borderWidth:2, borderDash:[5,4], tension:.4, pointBackgroundColor:"#22d3ee" }
      ]
    }, options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:"top", labels:{ boxWidth:12, font:{size:11} } } }, scales:{ y:{ beginAtZero:true, grid:{ color:"#eef6f8" } }, x:{ grid:{ display:false } } } } }));
    const r=document.getElementById("cReason");
    if(r) charts.push(new Chart(r,{ type:"doughnut", data:{
      labels:REASONS.map(x=>x[0]),
      datasets:[{ data:REASONS.map(x=>x[1]), backgroundColor:REASONS.map(x=>x[2]), borderColor:"#fff", borderWidth:2 }]
    }, options:{ cutout:"56%", responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:"right", labels:{ boxWidth:12, font:{size:11} } }, tooltip:{ callbacks:{ label:c=>` ${c.label}: ${c.parsed}%` } } } } }));
  }
}
/* ===== nav + render ===== */
let cat=0;
const tabsEl=document.getElementById("tabs"), view=document.getElementById("view"), vt=document.getElementById("vt"), vs=document.getElementById("vs"), vact=document.getElementById("vact");
tabsEl.innerHTML=TABS.map((t,i)=>`<button data-i="${i}" class="${i===0?"on":""}"><span class="material-symbols-outlined">${t[0]}</span><span>${t[1]}</span></button>`).join("");
function show(i){
  tabsEl.querySelectorAll("button[data-i]").forEach(b=>b.classList.toggle("on",b.dataset.i===String(i)));
  vt.textContent=TABS[i][1]; vs.textContent=TABS[i][2]; vact.innerHTML=ACT[i]||"";
  view.innerHTML=SCREENS[i](); draw(i);
}
tabsEl.addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(!b)return;show(+b.dataset.i);try{window.scrollTo(0,0);}catch(e){}});
view.addEventListener("click",e=>{const cb=e.target.closest("[data-cat]");if(cb){cat=+cb.dataset.cat;view.innerHTML=SCREENS[1]();draw(1);}});
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
