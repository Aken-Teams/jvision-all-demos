<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>售後退換追蹤台｜Jvision 系統 Demo</title>
<meta name="description" content="退換貨申請、RMA 進度、到貨檢測到退款換貨與客服關懷的售後一體化管理（純 UI 展示）。">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;500;600;700&family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#059669;--color-on-primary:#000;
  --color-secondary:#10b981;--color-on-secondary:#0f172a;
  --color-accent:#ea580c;--color-on-accent:#000;
  --color-background:#ecfdf5;--color-foreground:#064e3b;
  --color-card:#fff;--color-card-foreground:#064e3b;
  --color-muted:#e8f1f3;--color-muted-foreground:#475569;
  --color-border:#a7f3d0;--color-destructive:#dc2626;
  --color-on-destructive:#fff;--color-ring:#059669;
  --blue:#1d4ed8;--ink:#064e3b;--muted:#475569;--line:#a7f3d0;
  --green:#047857;--amber:#b45309;--red:#b91c1c;--violet:#6d28d9;
  --green-bg:#d1fae5;--amber-bg:#fef3c7;--red-bg:#fee2e2;
  --blue-bg:#dbeafe;--violet-bg:#ede9fe;
  --shadow:0 10px 24px rgba(6,78,59,.09);
  --shadow-lg:0 18px 45px rgba(6,78,59,.15)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  background:
    radial-gradient(circle at 8% 8%,rgba(16,185,129,.17),transparent 22rem),
    radial-gradient(circle at 94% 18%,rgba(234,88,12,.12),transparent 20rem),
    var(--color-background);
  color:var(--color-foreground);
  font-family:"Nunito Sans","Microsoft JhengHei",sans-serif;
  line-height:1.5;-webkit-font-smoothing:antialiased
}
button,[role=button],[data-cat]{cursor:pointer}
button,input,select,textarea{font:inherit}
button:focus-visible,[role=button]:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);outline-offset:3px
}
.material-symbols-outlined{font-variation-settings:"FILL" 0,"wght" 500,"GRAD" 0,"opsz" 24;line-height:1}
.mono,.no,td:first-child,.amt,.due,.kpi .v,.mcard .nm,.mcard .no{
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-variant-numeric:tabular-nums
}
.nav{
  position:sticky;top:0;z-index:30;
  background:rgba(255,255,255,.92);
  border-bottom:1px solid rgba(5,150,105,.24);
  box-shadow:0 8px 28px rgba(6,78,59,.08);
  backdrop-filter:blur(18px)
}
.nav::before{content:"";display:block;height:6px;background:linear-gradient(90deg,var(--color-primary) 0 68%,var(--color-accent) 68%)}
.nav-in{max-width:1540px;margin:auto;padding:10px 22px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:11px;flex:none}
.brand .lg{
  width:44px;height:44px;border-radius:13px;display:grid;place-items:center;
  color:#fff;background:var(--color-primary);
  box-shadow:5px 5px 0 #a7f3d0
}
.brand b{display:block;font:700 17px Rubik,"Nunito Sans",sans-serif;color:var(--ink)}
.brand small{display:block;color:var(--muted);font-size:11px}
.tabs{display:flex;align-items:center;gap:5px;flex:1;min-width:0;overflow-x:auto;padding:4px}
.tabs button{
  display:inline-flex;align-items:center;gap:6px;flex:none;
  padding:9px 11px;border:1px solid transparent;border-radius:11px;
  background:transparent;color:#315b50;font-size:13px;font-weight:700;
  transition:background .2s,color .2s,transform .2s,border-color .2s
}
.tabs button:hover{background:#d1fae5;color:var(--ink);transform:translateY(-1px)}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 6px 14px rgba(6,78,59,.2)}
.tabs .material-symbols-outlined{font-size:19px}
.nav-r{display:flex;gap:8px;align-items:center;flex:none}
.npill{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
  border-radius:999px;padding:6px 10px;background:#fff;color:var(--ink);
  font-size:11px;font-weight:800;white-space:nowrap
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--color-primary);box-shadow:0 0 0 4px #d1fae5}
.ava{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--color-accent);color:#fff;font-weight:900}
.wrap{max-width:1540px;margin:auto;padding:28px 22px 56px}
.phead{
  position:relative;overflow:hidden;display:flex;align-items:flex-end;gap:16px;
  margin-bottom:20px;padding:24px 26px;border-radius:22px;
  background:linear-gradient(125deg,#064e3b,#047857);
  color:#fff;box-shadow:var(--shadow-lg)
}
.phead::after{
  content:"";position:absolute;right:-42px;top:-70px;width:230px;height:230px;
  border:34px solid rgba(167,243,208,.18);border-radius:42%;transform:rotate(22deg)
}
.phead h1{position:relative;z-index:1;margin:0;font:700 clamp(25px,3vw,38px) Rubik,"Nunito Sans",sans-serif;letter-spacing:-.02em}
.phead p{position:relative;z-index:1;margin:4px 0 0;color:#d1fae5;font-size:13px}
.phead .sp{position:relative;z-index:1;margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}
.btn{
  min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:1px solid var(--color-accent);border-radius:12px;padding:0 16px;
  background:var(--color-accent);color:#fff;font-size:13px;font-weight:900;
  box-shadow:0 6px 15px rgba(234,88,12,.24);
  transition:transform .2s,box-shadow .2s,background .2s
}
.btn:hover{background:#c2410c;transform:translateY(-2px);box-shadow:0 10px 20px rgba(234,88,12,.28)}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line);box-shadow:none}
.btn.ghost:hover{background:#d1fae5;border-color:var(--color-primary)}
.btn.block{width:100%;min-height:47px;margin-top:12px}
.card,.bcol,.ticket,.kpi{
  background:var(--color-card);border:1px solid var(--color-border);
  box-shadow:var(--shadow)
}
.card{border-radius:20px;padding:19px}
.grid{display:grid;gap:18px}.grid>*{min-width:0}
.g2{grid-template-columns:1.45fr 1fr}.g2e{grid-template-columns:1fr 1fr}
h3.sec{
  margin:0 0 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  color:var(--ink);font:700 15px Rubik,"Nunito Sans",sans-serif
}
h3.sec>.material-symbols-outlined{width:31px;height:31px;border-radius:9px;display:grid;place-items:center;background:#d1fae5;color:var(--color-primary);font-size:19px}
h3.sec .tag{margin-left:auto;color:var(--muted);font:700 11px "Nunito Sans",sans-serif}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{position:relative;overflow:hidden;border-radius:17px;padding:17px 18px;transition:transform .22s,box-shadow .22s}
.kpi:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.kpi::after{content:"";position:absolute;width:72px;height:72px;right:-28px;bottom:-32px;border:16px solid #d1fae5;border-radius:22px;transform:rotate(25deg)}
.kpi:nth-child(4){border-color:#fdba74}.kpi:nth-child(4)::after{border-color:#ffedd5}
.kpi .l{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:800}
.kpi .l .material-symbols-outlined{font-size:18px;color:var(--color-primary)}
.kpi .v{margin-top:7px;color:var(--ink);font-size:27px;font-weight:900;letter-spacing:-.04em}
.kpi .d{font-size:12px;font-weight:900}.d.up{color:var(--green)}.d.dn{color:var(--red)}.d.fl{color:var(--blue)}
.board-wrap,.tbl-wrap{overflow-x:auto;padding:2px 2px 8px}
.board{min-width:1300px;display:grid;grid-template-columns:repeat(6,minmax(205px,1fr));gap:12px}
.bcol{border-radius:17px;padding:11px;display:flex;flex-direction:column;gap:9px}
.bcol-h{display:flex;align-items:center;gap:7px;padding:3px 3px 10px;border-bottom:3px solid var(--color-primary);color:var(--ink);font-weight:900;font-size:13px}
.bcol-h .material-symbols-outlined{font-size:19px}
.bcol-h .n{margin-left:auto;min-width:25px;text-align:center;background:var(--ink);color:#fff;border-radius:7px;padding:1px 7px}
.bcol.s1 .bcol-h{border-color:var(--blue)}.bcol.s2 .bcol-h{border-color:var(--amber)}
.bcol.s3 .bcol-h{border-color:var(--green)}.bcol.s4 .bcol-h{border-color:var(--violet)}.bcol.s5 .bcol-h{border-color:#64748b}
.gc{
  position:relative;border:1px solid #cdeee0;border-radius:13px;padding:11px;
  background:#fff;box-shadow:0 4px 10px rgba(6,78,59,.05);
  transition:transform .2s,border-color .2s,box-shadow .2s
}
.gc:hover{transform:translateY(-3px);border-color:var(--color-primary);box-shadow:0 10px 20px rgba(6,78,59,.12)}
.gc.rush{border:2px solid #fca5a5;background:#fff7f7}
.gc.rush::before{content:"!";position:absolute;right:-5px;top:-7px;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--red);color:#fff;font-weight:900}
.gc-h{display:flex;align-items:center;gap:6px;margin-bottom:6px}.gc-h .no{color:var(--ink);font-size:12px;font-weight:900}
.rush-b,.typ,.gtag,.pill,.st2,.ch{display:inline-flex;align-items:center;gap:4px;border-radius:7px;padding:2px 7px;font-size:10px;font-weight:900}
.rush-b{background:var(--red-bg);color:var(--red)}.typ{margin-left:auto}.typ.ret{background:var(--blue-bg);color:#1e40af}.typ.exc{background:var(--violet-bg);color:#5b21b6}
.who,.item{display:flex;align-items:center;gap:5px;font-size:12px;margin-bottom:6px}.who{color:var(--muted)}.who .material-symbols-outlined{font-size:14px}.item{color:var(--ink);font-weight:800}
.item-icon,.product-icon{display:grid;place-items:center;background:#d1fae5;color:var(--green)}
.item-icon{width:25px;height:25px;border-radius:7px}.item-icon .material-symbols-outlined{font-size:17px}
.gl{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:7px}.gtag{background:#d1fae5;color:#065f46}.gtag.money{background:var(--amber-bg);color:#92400e}.gtag.warn{background:var(--red-bg);color:var(--red)}
.gtag .material-symbols-outlined{font-size:13px}.gc-f{display:flex;justify-content:space-between;border-top:1px dashed var(--line);padding-top:7px;color:var(--muted);font-size:10px;font-weight:800}.due.late{color:var(--red)}
.nlist{display:flex;flex-direction:column;gap:9px}.nrow{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--line);border-radius:13px;background:#fff;flex-wrap:wrap}
.nrow .av{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:#d1fae5;color:var(--ink);font-weight:900}
.nrow .info{flex:1;min-width:140px}.nrow .info b{display:block;color:var(--ink);font-size:13px}.nrow .info small{display:block;color:var(--muted);font-size:11px}
.ch.line{background:var(--green-bg);color:#065f46}.ch.wait{background:var(--amber-bg);color:#92400e}.ch.over{background:var(--red-bg);color:var(--red)}
.pos3{display:grid;grid-template-columns:180px 1fr 350px;gap:16px;align-items:start}.pos3>*{min-width:0}
.catlist{display:flex;flex-direction:column;gap:8px}.catlist button,.seg button,.chip{
  border:1px solid var(--line);background:#fff;color:#315b50;font-weight:800;
  transition:background .2s,color .2s,transform .2s
}
.catlist button{display:flex;align-items:center;gap:8px;padding:11px;border-radius:11px;text-align:left;font-size:13px}
.catlist button:hover,.chip:hover,.seg button:hover{transform:translateY(-1px);background:#d1fae5}
.catlist button.on,.seg button.on,.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}
.prod{overflow:hidden;border:1px solid var(--line);border-radius:15px;background:#fff;transition:transform .2s,box-shadow .2s}
.prod:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.prod .ph{height:78px;display:grid;place-items:center;background:linear-gradient(135deg,#d1fae5,#a7f3d0)}
.product-icon{width:45px;height:45px;border-radius:14px;background:#fff;box-shadow:0 6px 14px rgba(6,78,59,.13)}
.product-icon .material-symbols-outlined{font-size:25px}
.prod .info{padding:10px}.prod .info b{display:block;color:var(--ink);font-size:13px}.prod .pr{color:var(--color-accent);font-weight:900}.prod small{color:var(--muted)}
.ticket{position:sticky;top:86px;border-radius:19px;padding:16px}.ticket-h{display:flex;justify-content:space-between;gap:8px;margin-bottom:11px}.ticket-h b{color:var(--ink)}.ticket-h .tag{color:var(--muted);font-size:11px}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:8px;border-radius:9px;font-size:11px}.seg .material-symbols-outlined{font-size:16px}
.ci,.hist{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px dashed var(--line)}
.ci .product-icon{width:35px;height:35px;flex:none}.ci .nm,.hist .tx{flex:1;min-width:0}.ci b,.hist b{display:block;color:var(--ink);font-size:12px}.ci small,.hist small{color:var(--muted);font-size:10px}.ci .amt{color:var(--ink);font-size:12px;font-weight:900}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.chip{padding:4px 9px;border-radius:999px;font-size:10px}
.ticket-sum{margin-top:12px}.ticket-sum .row{display:flex;justify-content:space-between;padding:3px 0;font-size:13px}.ticket-sum .total{margin-top:7px;padding-top:9px;border-top:1px dashed var(--line);color:var(--ink);font-size:19px;font-weight:900}
.insp{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}
.icell{position:relative;border:2px solid var(--line);border-radius:14px;padding:11px;background:#fff}
.icell .ph{height:58px;display:grid;place-items:center;border-radius:10px;background:#d1fae5}.icell .no{margin-top:7px;color:var(--ink);font-size:11px;font-weight:900}.icell .nm{font-size:12px}.icell.pass{border-color:#6ee7b7}.icell.fail{border-color:#fca5a5}.icell.wait{border-color:#fcd34d}.icell.pass .st2{background:var(--green-bg);color:#065f46}.icell.fail .st2{background:var(--red-bg);color:var(--red)}.icell.wait .st2{background:var(--amber-bg);color:#92400e}
.steps{display:flex;flex-direction:column}.step{display:flex;gap:11px}.rail{display:flex;flex-direction:column;align-items:center}.step .dot{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#cbd5e1;color:#334155}.step.done .dot{background:var(--green);color:#fff}.step.now .dot{background:var(--color-accent);color:#fff}.step .line{width:2px;flex:1;background:var(--line)}.step:last-child .line{display:none}.step .body{flex:1;padding-bottom:16px}.step .body b{display:block;color:var(--ink);font-size:13px}.step .body small{color:var(--muted)}
.mcard{position:relative;overflow:hidden;border-radius:22px;padding:22px;background:linear-gradient(135deg,#064e3b,#059669);color:#fff;box-shadow:var(--shadow-lg)}
.mcard::after{content:"";position:absolute;right:-45px;bottom:-65px;width:190px;height:190px;border:30px solid rgba(255,255,255,.14);border-radius:40%;transform:rotate(20deg)}
.mcard .lv{font-size:11px;font-weight:900;letter-spacing:.12em}.mcard .nm{font-size:32px;font-weight:900}.mcard .no{color:#d1fae5;font-size:11px}.bal{display:flex;gap:25px;margin-top:17px;flex-wrap:wrap}.bal small{display:block;color:#d1fae5;font-size:10px}.bal b{font-size:18px}.hist .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#d1fae5;color:var(--green)}.hist .amt{font-weight:900}.amt.pos{color:var(--green)}.amt.neg{color:var(--red)}
.chart-box{position:relative;width:100%;height:290px}.rank{display:flex;align-items:center;gap:10px;padding:8px 0}.rank .rk{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--ink);color:#fff;font-weight:900}.rank b{width:110px;color:var(--ink)}.bar{height:9px;flex:1;border-radius:99px;overflow:hidden;background:#dbe8e5}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--color-primary),#34d399)}.rank .val{width:58px;text-align:right;color:var(--ink);font-weight:900;font-variant-numeric:tabular-nums}
table.data{width:100%;min-width:680px;border-collapse:separate;border-spacing:0;font-size:12px}
table.data th{padding:10px;text-align:left;background:#d1fae5;color:#064e3b;border-block:1px solid var(--line);font-size:11px;white-space:nowrap}
table.data td{padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.data tbody tr:hover td{background:#f0fdf4}
table.data th:nth-child(5),table.data td:nth-child(5){text-align:right;font-variant-numeric:tabular-nums}
.pill.g{background:var(--green-bg);color:#065f46}.pill.a{background:var(--amber-bg);color:#92400e}.pill.b{background:var(--blue-bg);color:#1e40af}.pill.v{background:var(--violet-bg);color:#5b21b6}.pill.r{background:var(--red-bg);color:var(--red)}
.note{padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:#f0fdf4;color:#315b50;font-size:12px}
.grid-item{animation:rise .42s cubic-bezier(.2,.85,.32,1.25) both}
.grid-item:nth-child(2){animation-delay:.05s}.grid-item:nth-child(3){animation-delay:.1s}.grid-item:nth-child(4){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@media(max-width:1100px){.g2,.g2e{grid-template-columns:1fr}.pos3{grid-template-columns:1fr}.ticket{position:static}.catlist{flex-direction:row;overflow-x:auto}.catlist button{flex:none}.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:800px){.nav-in{align-items:flex-start;flex-wrap:wrap}.brand{order:1}.nav-r{order:2;margin-left:auto}.tabs{order:3;width:100%;flex-basis:100%}.phead{align-items:flex-start;flex-direction:column}.phead .sp{margin-left:0}.phead::after{opacity:.65}}
@media(max-width:560px){.wrap{padding:16px 13px 40px}.nav-in{padding:9px 13px}.brand small,.npill:first-child{display:none}.tabs button{min-width:42px;justify-content:center}.tabs button span:last-child{display:none}.phead{padding:19px}.kpis{grid-template-columns:1fr 1fr;gap:9px}.kpi{padding:13px}.kpi .v{font-size:21px}.card{padding:14px}.prods{grid-template-columns:repeat(2,minmax(0,1fr))}.phead .sp{display:grid;grid-template-columns:1fr 1fr;width:100%}.btn{padding:0 10px}.chart-box{height:245px}}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<nav class="nav" aria-label="主要導覽">
  <div class="nav-in">
    <div class="brand">
      <span class="lg" aria-hidden="true"><span class="material-symbols-outlined">assignment_return</span></span>
      <div><b>售後退換追蹤台</b><small>星選購物 · 退換貨作業中心</small></div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="nav-r">
      <span class="npill"><span class="dot" aria-hidden="true"></span>系統連線</span>
      <span class="npill"><span class="material-symbols-outlined" aria-hidden="true">notifications</span>待處理 9</span>
      <span class="ava" aria-label="客服帳號">客</span>
    </div>
  </div>
</nav>
<main class="wrap">
  <header class="phead">
    <div><h1 id="vt">退換總覽</h1><p id="vs">即時掌握退換件量、RMA 進度與退款狀態</p></div>
    <div class="sp" id="vact"></div>
  </header>
  <div id="view"></div>
</main>
<script>
const money=n=>"$"+n.toLocaleString("zh-TW");
const icon=n=>`<span class="product-icon" aria-hidden="true"><span class="material-symbols-outlined">${n}</span></span>`;
const TABS=[
["dashboard","退換總覽","即時掌握退換件量、RMA 進度與退款狀態"],

let charts=[];
function killCharts(){charts.forEach(c=>{try{c.destroy()}catch(_){}});charts=[]}
function doughnut(el){
 return new Chart(el,{type:"doughnut",data:{labels:REASONS.map(r=>r[0]),datasets:[{data:REASONS.map(r=>r[1]),backgroundColor:REASONS.map(r=>r[2]),borderColor:"#fff",borderWidth:3}]},options:{cutout:"60%",responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"right",labels:{boxWidth:12,color:"#315b50",font:{family:"Nunito Sans",size:11}}},tooltip:{callbacks:{label:c=>` ${c.label}: ${c.parsed}%`}}}}})
}
function draw(i){
 killCharts();if(!window.Chart)return;
 Chart.defaults.font.family='"Nunito Sans",sans-serif';Chart.defaults.color="#475569";
 if(i===0){const e=document.getElementById("cReasonMini");if(e)charts.push(doughnut(e))}
 if(i===5){
  const t=document.getElementById("cTrend");
  if(t)charts.push(new Chart(t,{type:"line",data:{labels:["W1","W2","W3","W4","W5","W6","W7","W8"],datasets:[
   {label:"整體退貨率 %",data:[6.4,6.1,5.8,5.5,5.2,5,4.9,4.8],borderColor:"#059669",backgroundColor:"rgba(5,150,105,.12)",borderWidth:3,fill:true,tension:.38,pointBackgroundColor:"#059669"},
   {label:"換貨率 %",data:[3.8,3.6,3.5,3.2,3,2.9,2.7,2.6],borderColor:"#ea580c",borderWidth:2,borderDash:[5,4],tension:.38,pointBackgroundColor:"#ea580c"}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"top",labels:{boxWidth:12}}},scales:{y:{beginAtZero:true,grid:{color:"#dcefe7"}},x:{grid:{display:false}}}}}));
  const r=document.getElementById("cReason");if(r)charts.push(doughnut(r))
 }
}
const tabsEl=document.getElementById("tabs"),view=document.getElementById("view"),vt=document.getElementById("vt"),vs=document.getElementById("vs"),vact=document.getElementById("vact");
tabsEl.innerHTML=TABS.map((t,i)=>`<button data-i="${i}" class="${i===0?"on":""}" aria-current="${i===0?"page":"false"}"><span class="material-symbols-outlined">${t[0]}</span><span>${t[1]}</span></button>`).join("");
function show(i){
 i=Math.max(0,Math.min(Number(i)||0,TABS.length-1));
 tabsEl.querySelectorAll("[data-i]").forEach(b=>{const on=b.dataset.i===String(i);b.classList.toggle("on",on);b.setAttribute("aria-current",on?"page":"false")});
 vt.textContent=TABS[i][1];vs.textContent=TABS[i][2];vact.innerHTML=ACT[i]||"";view.innerHTML=SCREENS[i]();draw(i)
}
tabsEl.addEventListener("click",e=>{const b=e.target.closest("[data-i]");if(!b)return;location.hash="v"+b.dataset.i});
view.addEventListener("click",e=>{const b=e.target.closest("[data-cat]");if(!b)return;cat=+b.dataset.cat;show(1)});
function fromHash(){const m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?+m[1]:0);window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}
window.addEventListener("hashchange",fromHash);
fromHash();
