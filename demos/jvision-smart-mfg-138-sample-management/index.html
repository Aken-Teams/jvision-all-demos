<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>樣品管理系統 Sample Management</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#7c3aed; --accent2:#a78bfa; --accent3:#c4b5fd;
  --bg:#0d0b1a; --bg2:#141126; --card:#1a1630; --card2:#221c3d;
  --ink:#eae7f6; --muted:#9a94b8; --dim:#6f6890;
  --line:#2c2647; --line2:#38315a;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --info:#a78bfa;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;
  line-height:1;letter-spacing:normal;vertical-align:middle;}
/* ===== TOP NAV ===== */
.topnav{background:linear-gradient(180deg,#161228,#100d20);border-bottom:1px solid var(--line2);
  position:sticky;top:0;z-index:20;box-shadow:0 4px 22px rgba(0,0,0,.45);}
.topnav .bar{display:flex;align-items:center;gap:18px;padding:12px 22px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:12px;min-width:0;}
.brand .mk{width:40px;height:40px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px -4px rgba(124,58,237,.7);}
.brand .mk .material-symbols-outlined{font-size:23px;color:#fff;}
.brand .tt{font-weight:800;font-size:16px;line-height:1.2;letter-spacing:.2px;}
.brand .st{font-size:10.5px;color:var(--dim);margin-top:2px;letter-spacing:.6px;text-transform:uppercase;}
.topnav .spacer{flex:1;min-width:8px;}
.livechips{display:flex;gap:8px;flex-wrap:wrap;}
.lchip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;
  padding:6px 11px;border-radius:999px;background:rgba(124,58,237,.14);color:var(--accent2);
  border:1px solid var(--line2);}
.lchip .material-symbols-outlined{font-size:15px;}
.lchip .live{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(52,211,153,.2);}
.navrow{display:flex;gap:5px;padding:0 16px 12px;flex-wrap:wrap;}
.navbtn{display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:11px;
  background:transparent;border:1px solid transparent;color:var(--muted);cursor:pointer;font-family:inherit;
  font-size:13px;font-weight:600;min-width:0;transition:all .15s;}
.navbtn .material-symbols-outlined{font-size:19px;flex-shrink:0;}
.navbtn .nlab{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.navbtn .nix{font-size:10px;opacity:.55;font-weight:700;}
.navbtn:hover{background:rgba(255,255,255,.05);color:var(--ink);}
.navbtn.active{background:linear-gradient(135deg,rgba(124,58,237,.32),rgba(167,139,250,.18));
  color:#fff;border-color:var(--accent);box-shadow:0 4px 14px -6px rgba(124,58,237,.8);}
/* ===== MAIN ===== */
.pagehead{padding:20px 26px 4px;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;}
.pagehead .ph-t{font-size:19px;font-weight:800;min-width:0;}
.pagehead .ph-s{font-size:12.5px;color:var(--muted);margin-top:3px;}
.pagehead .ph-tag{font-size:11px;font-weight:700;color:var(--accent2);background:rgba(124,58,237,.14);
  padding:5px 11px;border-radius:999px;border:1px solid var(--line2);}
.content{padding:16px 26px 46px;min-width:0;}
.grid{display:grid;gap:16px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:1.7fr 1fr;}
.g32{grid-template-columns:1.35fr 1fr;}
.mt{margin-top:16px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;
  box-shadow:0 2px 10px rgba(0,0,0,.28);}
.card h3{margin:0 0 3px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent2);}
.card .csub{font-size:11.5px;color:var(--muted);margin:0 0 14px;}
/* KPI */
.kpi{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--card),var(--card2));}
.kpi .klab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px;}
.kpi .klab .material-symbols-outlined{font-size:18px;color:var(--accent2);}
.kpi .kval{font-size:28px;font-weight:800;margin-top:10px;letter-spacing:-.5px;color:#fff;}
.kpi .kval small{font-size:13px;font-weight:700;color:var(--muted);margin-left:3px;}
.kpi .kfoot{font-size:11.5px;margin-top:8px;font-weight:600;display:flex;align-items:center;gap:5px;}
.kpi .kfoot .material-symbols-outlined{font-size:15px;}
.up{color:var(--ok);}.down{color:var(--bad);}.flat{color:var(--muted);}
.kpi .bar{position:absolute;left:0;top:0;width:5px;height:100%;background:linear-gradient(var(--accent),var(--accent2));}
/* tables */
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:540px;}
th{text-align:left;font-size:10.5px;color:var(--dim);font-weight:700;text-transform:uppercase;
  letter-spacing:.5px;padding:9px 12px;border-bottom:1px solid var(--line2);white-space:nowrap;}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--ink);}
tr:last-child td{border-bottom:0;}
tbody tr:hover{background:rgba(124,58,237,.07);}
.tw{overflow-x:auto;border-radius:10px;}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;
  padding:3px 9px;border-radius:999px;white-space:nowrap;}
.badge .material-symbols-outlined{font-size:13px;}
.b-ok{background:rgba(52,211,153,.16);color:#6ee7b7;}
.b-warn{background:rgba(251,191,36,.16);color:#fcd34d;}
.b-bad{background:rgba(248,113,113,.16);color:#fca5a5;}
.b-info{background:rgba(167,139,250,.18);color:#c4b5fd;}
.b-grey{background:rgba(154,148,184,.14);color:#b6b0d0;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:2px;}
.mono{font-variant-numeric:tabular-nums;font-weight:700;}
.progress{height:8px;border-radius:999px;background:var(--line2);overflow:hidden;min-width:60px;}
.progress>span{display:block;height:100%;border-radius:999px;}
.avatar{width:30px;height:30px;border-radius:9px;background:rgba(124,58,237,.2);color:var(--accent2);
  display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0;}
.approve-row{display:flex;align-items:center;gap:8px;}
.chartbox{overflow:hidden;min-width:0;}
/* board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0;}
.bcol{background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:12px;min-width:0;}
.bcol .bh{font-size:12px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:6px;justify-content:space-between;}
.bcol .bh .cnt{background:var(--card2);border:1px solid var(--line2);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--muted);}
.bcard{background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:10px 11px;margin-bottom:9px;}
.bcard:last-child{margin-bottom:0;}
.bcard .bt{font-weight:700;font-size:12.5px;}
.bcard .bm{font-size:11px;color:var(--muted);margin-top:5px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.bcard .bamt{font-weight:800;color:var(--accent2);}
.ltop{border-top:3px solid var(--accent);}
/* timeline */
.timeline{position:relative;padding-left:26px;}
.timeline:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line2);}
.tev{position:relative;padding-bottom:18px;}
.tev:last-child{padding-bottom:0;}
.tev .tdot{position:absolute;left:-25px;top:2px;width:16px;height:16px;border-radius:50%;
  background:var(--card);border:3px solid var(--accent);}
.tev.done .tdot{background:var(--accent);}
.tev .thd{font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.tev .tdt{font-size:11px;color:var(--dim);font-weight:600;}
.tev .tbody{font-size:12px;color:var(--muted);margin-top:4px;}
/* alert item */
.alertitem{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;align-items:flex-start;background:var(--bg2);}
.alertitem:last-child{margin-bottom:0;}
.alertitem .aic{width:34px;height:34px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.alertitem .aic .material-symbols-outlined{font-size:20px;}
.alertitem .abody{min-width:0;flex:1;}
.alertitem .at{font-weight:700;font-size:13px;}
.alertitem .ad{font-size:11.5px;color:var(--muted);margin-top:2px;}
/* pill input */
.pill-input{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.pill-input .pi{background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:8px 12px;font-size:12px;min-width:0;}
.pill-input .pi b{display:block;font-size:10px;color:var(--dim);font-weight:700;margin-bottom:3px;letter-spacing:.4px;}
/* legend / ministat */
.legendrow{display:flex;flex-wrap:wrap;gap:14px;font-size:11.5px;color:var(--muted);margin-top:10px;}
.legendrow span{display:inline-flex;align-items:center;gap:5px;}
.miniStat{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;}
.miniStat .ms{min-width:0;}
.miniStat .ms .v{font-size:20px;font-weight:800;color:#fff;}
.miniStat .ms .l{font-size:11px;color:var(--muted);}
/* signature: sample pipeline */
.pipe{display:flex;gap:0;flex-wrap:nowrap;min-width:0;overflow-x:auto;padding-bottom:4px;}
.pstage{flex:1 1 0;min-width:130px;position:relative;padding:0 7px;}
.pstage .pcap{background:var(--bg2);border:1px solid var(--line2);border-radius:13px;padding:13px 12px;height:100%;}
.pstage .pn{font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px;}
.pstage .pn .material-symbols-outlined{font-size:17px;color:var(--accent2);}
.pstage .pbig{font-size:26px;font-weight:800;color:#fff;margin-top:8px;letter-spacing:-.5px;}
.pstage .pmeta{font-size:11px;color:var(--muted);margin-top:4px;}
.pstage .pconv{font-size:11px;font-weight:700;margin-top:8px;display:inline-flex;align-items:center;gap:4px;color:var(--accent2);}
.pstage:not(:last-child) .pcap:after{content:"chevron_right";font-family:"Material Symbols Outlined";
  position:absolute;right:-10px;top:50%;transform:translateY(-50%);color:var(--line2);font-size:22px;z-index:2;}
/* track / route */
.track{display:flex;flex-direction:column;gap:0;}
.tk{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:16px;}
.tk:last-child{padding-bottom:0;}
.tk .tkdot{width:30px;height:30px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:var(--card2);border:1px solid var(--line2);z-index:2;}
.tk .tkdot .material-symbols-outlined{font-size:17px;color:var(--accent2);}
.tk.done .tkdot{background:var(--accent);border-color:var(--accent);}
.tk.done .tkdot .material-symbols-outlined{color:#fff;}
.tk:not(:last-child):before{content:"";position:absolute;left:14px;top:30px;bottom:0;width:2px;background:var(--line2);}
.tk .tkb{min-width:0;flex:1;padding-top:3px;}
.tk .tkt{font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.tk .tkm{font-size:11.5px;color:var(--muted);margin-top:3px;}
.tk .tkdt{font-size:11px;color:var(--dim);font-weight:600;}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr);}}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
  .board{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:560px){
  .navbtn .nlab{display:none;}
  .navbtn{padding:9px 11px;}
  .navbtn .nix{display:none;}
  .content{padding:14px 14px 36px;}
  .pagehead{padding:16px 15px 2px;}
  .board{grid-template-columns:1fr;}
  .topnav .bar{padding:11px 15px;}
  .navrow{padding:0 10px 10px;}
}
</style>
</head>
<body>
<header class="topnav">
  <div class="bar">
    <div class="brand">
      <div class="mk"><span class="material-symbols-outlined">science</span></div>
      <div>
        <div class="tt">樣品管理系統</div>
        <div class="st">Sample Management Terminal</div>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="livechips">
      <span class="lchip"><span class="live"></span>即時監控</span>
      <span class="lchip"><span class="material-symbols-outlined">calendar_month</span>2026-08-14</span>
      <span class="lchip"><span class="material-symbols-outlined">sync</span>CRM · RFQ · ERP 已同步</span>
    </div>
  </div>
  <nav class="navrow" id="nav"></nav>
</header>
<div class="pagehead">
  <div style="min-width:0">
    <div class="ph-t" id="ptitle">樣品需求申請</div>
    <div class="ph-s" id="psub">客戶樣品需求受理與審核派工</div>
  </div>
  <div class="spacer" style="flex:1"></div>
  <div class="ph-tag" id="ptag">MODULE 01 / 06</div>
</div>
<div class="content" id="view"></div>

<script>
"use strict";
var MODS=[
  {icon:"request_quote",name:"樣品需求申請",sub:"客戶樣品需求受理與審核派工"},
  {icon:"precision_manufacturing",name:"打樣製作進度",sub:"打樣工單排程與製作進度追蹤"},
  {icon:"science",name:"樣品檢驗確認",sub:"出樣前規格檢驗與 COA 附件"},
  {icon:"inventory_2",name:"寄送與到貨追蹤",sub:"物流託運、簽收與到貨確認"},
  {icon:"fact_check",name:"客戶驗證回饋",sub:"客戶承認測試結果與意見回覆"},
  {icon:"trending_up",name:"轉量產轉換",sub:"樣品轉量產訂單追蹤與成效"}
];
var charts=[];
function destroyCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
var AXCOL="#9a94b8",GRID="#2c2647";
function mk(id,opt){
  var el=document.getElementById(id);
  if(!el)return;
  opt.chart=opt.chart||{};
  opt.chart.redrawOnParentResize=false;
  opt.chart.redrawOnWindowResize=false;
  opt.chart.animations={enabled:false};
  opt.chart.fontFamily='Inter,"Noto Sans TC",sans-serif';
  opt.chart.toolbar={show:false};
  opt.chart.background="transparent";
  opt.theme=opt.theme||{mode:"dark"};
  try{var c=new ApexCharts(el,opt);c.render();charts.push(c);}catch(e){}
}
function kpi(l,v,u,ic,f,cls,fic){
  return '<div class="card kpi"><span class="bar"></span>'+
    '<div class="klab"><span class="material-symbols-outlined">'+ic+'</span>'+l+'</div>'+
    '<div class="kval">'+v+'<small>'+u+'</small></div>'+
    '<div class="kfoot '+cls+'"><span class="material-symbols-outlined">'+fic+'</span>'+f+'</div></div>';
}
function alertItem(col,ic,t,d){
  return '<div class="alertitem"><div class="aic" style="background:'+col+'26;color:'+col+'"><span class="material-symbols-outlined">'+ic+'</span></div>'+
    '<div class="abody"><div class="at">'+t+'</div><div class="ad">'+d+'</div></div></div>';
}
function tl(dt,title,cls,body){
  return '<div class="tev '+cls+'"><div class="tdot"></div>'+
    '<div class="thd"><span>'+title+'</span><span class="tdt">'+dt+'</span></div>'+
    '<div class="tbody">'+body+'</div></div>';
}
function tk(cls,ic,t,m,dt){
  return '<div class="tk '+cls+'"><div class="tkdot"><span class="material-symbols-outlined">'+ic+'</span></div>'+
    '<div class="tkb"><div class="tkt"><span>'+t+'</span><span class="tkdt">'+dt+'</span></div>'+
    '<div class="tkm">'+m+'</div></div></div>';
}
function bCard(t,sub,note){
  return '<div class="bcard"><div class="bt">'+t+'</div><div class="bm"><span>'+sub+'</span><span class="bamt">'+note+'</span></div></div>';
}

/* ============ SCREEN 0 : 樣品需求申請 ============ */
function s0(){
  return ''+
  '<div class="grid g4">'+
    kpi("待審需求單","14","件","request_quote","本月新增 62 件","flat","fact_check")+
    kpi("急件 / 逾期","5","件","warning","3 件超交樣期","down","priority_high")+
    kpi("平均審核時效","4.2","小時","history","目標 8 小時內","up","trending_down")+
    kpi("本月受理","62","件","groups","來自 28 家客戶","up","trending_up")+
  '</div>'+
  '<div class="grid g23 mt">'+
    '<div class="card"><h3><span class="material-symbols-outlined">checklist</span>樣品需求申請佇列</h3>'+
      '<p class="csub">依交樣期與優先級自動排序，審核後派工至打樣單位</p>'+
      '<div class="tw"><table><thead><tr><th>需求單號</th><th>客戶</th><th>樣品品名</th><th>數量</th><th>交樣期</th><th>優先</th><th>狀態</th></tr></thead><tbody>'+
        reqRow("SR-26081","宏群光電","車用連接器 CN-88","30 pcs","08-16","急","b-warn","審核中")+
        reqRow("SR-26080","台曜半導體","散熱模組 HS-204","10 pcs","08-15","急","b-bad","逾期")+
        reqRow("SR-26079","日盛精工","精密齒輪 G-52","50 pcs","08-22","中","b-info","待派工")+
        reqRow("SR-26078","昱鴻電子","軟板 FPC-7","100 pcs","08-25","中","b-ok","已派工")+
        reqRow("SR-26077","協晟工業","金屬外殼 MC-11","20 pcs","08-28","低","b-ok","已派工")+
        reqRow("SR-26076","立宏塑膠","注塑件 IP-33","40 pcs","08-30","低","b-grey","已受理")+
        reqRow("SR-26075","邦O材料","導熱膠 TG-9","5 kg","08-19","急","b-warn","審核中")+
      '</tbody></table></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">insights</span>需求來源分布</h3>'+
      '<p class="csub">本月 62 件依業務區域</p>'+
      '<div class="chartbox" id="c0a" style="height:260px"></div>'+
      '<div class="legendrow"><span><span class="dot" style="background:#7c3aed"></span>北區</span><span><span class="dot" style="background:#a78bfa"></span>中區</span><span><span class="dot" style="background:#c4b5fd"></span>南區</span><span><span class="dot" style="background:#34d399"></span>海外</span></div></div>'+
  '</div>'+
  '<div class="card mt"><h3><span class="material-symbols-outlined">rule</span>受理審核要點</h3>'+
    '<p class="csub">系統自動比對規格、產能與客戶信用</p>'+
    '<div class="grid g3">'+
      alertItem("#fbbf24","priority_high","急件優先派工","5 件標記急件，其中 2 件交樣期在 3 天內")+
      alertItem("#a78bfa","fact_check","規格檢核通過","11 件圖面與規格齊全，可直接派工")+
      alertItem("#f87171","warning","待補件 3 件","缺少 2D 圖面或材質需求，已通知業務")+
    '</div></div>';
}
function reqRow(no,cust,item,qty,due,pri,bc,st){
  var pm={"急":"b-bad","中":"b-warn","低":"b-grey"};
  return '<tr><td class="mono">'+no+'</td><td><b>'+cust+'</b></td><td>'+item+'</td>'+

      tl("2026-08-09","協晟工業 · MC-11 轉量產","done","鹽霧測試通過→簽承認書→量產下單 $0.92M")+

function pstage(ic,name,big,unit,meta,conv){
  var c=conv?'<div class="pconv"><span class="material-symbols-outlined" style="font-size:14px">south</span>轉化 '+conv+'</div>':'<div class="pconv" style="color:var(--dim)">流程起點</div>';
  return '<div class="pstage"><div class="pcap"><div class="pn"><span class="material-symbols-outlined">'+ic+'</span>'+name+'</div>'+
    '<div class="pbig">'+big+'<span style="font-size:13px;color:var(--muted);font-weight:700;margin-left:3px">'+unit+'</span></div>'+
    '<div class="pmeta">'+meta+'</div>'+c+'</div></div>';
}
function convItem(rk,cust,line,amt,st){
  var scls=st==="議價中"?"b-warn":(st==="首批下單"?"b-info":"b-ok");
  return '<div class="tk done"><div class="tkdot" style="font-weight:800;color:#fff">'+rk+'</div>'+
    '<div class="tkb"><div class="tkt"><span>'+cust+'</span><span class="tkdt"><span class="badge '+scls+'">'+st+'</span></span></div>'+
    '<div class="tkm">'+line+' · <b style="color:var(--accent2)">'+amt+'</b></div></div></div>';
}

/* ============ ROUTER ============ */
var SCREENS=[
  {r:s0,c:chart0},{r:s1,c:chart1},{r:s2,c:chart2},
  {r:s3,c:chart3},{r:s4,c:chart4},{r:s5,c:chart5}
];
function buildNav(){
  var nav=document.getElementById("nav");
  var h="";
  for(var i=0;i<MODS.length;i++){
    h+='<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span>'+
       '<span class="nlab">'+MODS[i].name+'</span><span class="nix">0'+(i+1)+'</span></button>';
  }
  nav.innerHTML=h;
  var btns=nav.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){
    btns[k].addEventListener("click",function(){show(+this.getAttribute("data-i"));});
  }
}
function show(i){
  destroyCharts();
  var sc=SCREENS[i];if(!sc)return;
  var view=document.getElementById("view");
  view.innerHTML=sc.r();
  document.getElementById("ptitle").textContent=MODS[i].name;
  document.getElementById("psub").textContent=MODS[i].sub;
  document.getElementById("ptag").textContent="MODULE 0"+(i+1)+" / 06";
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){
    if(+btns[k].getAttribute("data-i")===i)btns[k].classList.add("active");
    else btns[k].classList.remove("active");
  }
  void view.offsetHeight;
  if(sc.c)sc.c();
  try{window.scrollTo(0,0);}catch(e){}
}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
