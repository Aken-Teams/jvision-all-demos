<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>樣品管理系統 Sample Management</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Sans+TC:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#fff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#0f172a;
  --color-accent:#059669;
  --color-on-accent:#fff;
  --color-background:#f8fafc;
  --color-foreground:#0f172a;
  --color-card:#fff;
  --color-card-foreground:#0f172a;
  --color-muted:#f1f5fd;
  --color-muted-foreground:#475569;
  --color-border:#dbe5f5;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#0f172a;
  --muted:#475569;
  --line:#dbe5f5;
  --line2:#cbd8eb;
  --accent:#2563eb;
  --accent2:#1d4ed8;
  --accent3:#93c5fd;
  --bg:#f8fafc;
  --bg2:#f1f5fd;
  --card:#fff;
  --card2:#f8fafc;
  --dim:#64748b;
  --ok:#047857;
  --warn:#a16207;
  --bad:#b91c1c;
  --info:#1d4ed8;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(37,99,235,.055);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  overflow-x:hidden;
  background:
    linear-gradient(rgba(37,99,235,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(37,99,235,.025) 1px,transparent 1px),
    var(--bg);
  background-size:48px 48px;
  color:var(--ink);
  font-family:"Crimson Pro","Noto Sans TC",serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit}
button,[data-i]{cursor:pointer}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  letter-spacing:normal;
  vertical-align:middle;
}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
::selection{background:#bfdbfe;color:#0f172a}

/* Top navigation */
.topnav{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 rgba(15,23,42,.03);
  backdrop-filter:blur(12px);
}
.topnav .bar{
  display:flex;
  align-items:center;
  gap:24px;
  max-width:1500px;
  margin:0 auto;
  padding:17px 28px 13px;
  flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.brand .mk{
  width:42px;
  height:42px;
  display:flex;
  flex-shrink:0;
  align-items:center;
  justify-content:center;
  border-radius:4px;
  background:var(--color-primary);
  color:var(--color-on-primary);
  box-shadow:5px 5px 0 #bfdbfe;
}
.brand .mk .material-symbols-outlined{font-size:23px;color:inherit}
.brand .tt{
  font-family:"Cormorant Garamond","Noto Sans TC",serif;
  font-size:20px;
  font-weight:700;
  line-height:1.05;
  letter-spacing:.01em;
}
.brand .st{
  margin-top:3px;
  color:var(--dim);
  font-family:"Cinzel",serif;
  font-size:9px;
  font-weight:600;
  letter-spacing:.13em;
  text-transform:uppercase;
}
.topnav .spacer{flex:1;min-width:8px}
.livechips{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.lchip{
  display:inline-flex;
  min-height:32px;
  align-items:center;
  gap:7px;
  padding:5px 10px;
  border:1px solid var(--line);
  border-radius:4px;
  background:var(--color-card);
  color:var(--muted);
  font-family:"Noto Sans TC",sans-serif;
  font-size:11px;
  font-weight:600;
  white-space:nowrap;
}
.lchip .material-symbols-outlined{font-size:15px;color:var(--blue)}
.lchip .live{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--ok);
  box-shadow:0 0 0 3px #d1fae5;
}
.navrow{
  display:flex;
  max-width:1500px;
  margin:0 auto;
  gap:2px;
  padding:0 28px;
  overflow-x:auto;
  scrollbar-width:thin;
}
.navbtn{
  position:relative;
  display:flex;
  min-height:46px;
  min-width:0;
  align-items:center;
  gap:8px;
  padding:10px 14px 12px;
  border:0;
  border-bottom:3px solid transparent;
  border-radius:0;
  background:transparent;
  color:var(--muted);
  font-family:"Noto Sans TC",sans-serif;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  transition:color .2s ease,background-color .2s ease,border-color .2s ease;
}
.navbtn .material-symbols-outlined{font-size:18px;flex-shrink:0}
.navbtn .nlab{min-width:0;overflow:hidden;text-overflow:ellipsis}
.navbtn .nix{
  color:#64748b;
  font-family:"Cinzel",serif;
  font-size:9px;
  font-variant-numeric:tabular-nums;
  letter-spacing:.08em;
}
.navbtn:hover{background:#eff6ff;color:#1d4ed8}
.navbtn.active{border-bottom-color:var(--blue);background:#eff6ff;color:#1d4ed8}

/* Page frame */
.pagehead{
  display:flex;
  max-width:1500px;
  margin:0 auto;
  align-items:flex-end;
  gap:16px;
  padding:38px 28px 9px;
  flex-wrap:wrap;
}
.pagehead .ph-t{
  font-family:"Cormorant Garamond","Noto Sans TC",serif;
  font-size:clamp(27px,3vw,38px);
  font-weight:700;
  line-height:1.08;
  letter-spacing:-.025em;
}
.pagehead .ph-s{margin-top:7px;color:var(--muted);font-size:15px}
.pagehead .ph-tag{
  padding:6px 10px;
  border:1px solid #bfdbfe;
  border-radius:3px;
  background:#eff6ff;
  color:#1d4ed8;
  font-family:"Cinzel",serif;
  font-size:10px;
  font-weight:600;
  letter-spacing:.09em;
  white-space:nowrap;
}
.content{max-width:1500px;margin:0 auto;padding:20px 28px 58px;min-width:0}
.grid{display:grid;gap:18px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.g32{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.mt{margin-top:18px}
.card{
  min-width:0;
  padding:20px;
  border:1px solid var(--line);
  border-radius:6px;
  background:var(--card);
  box-shadow:var(--shadow);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.card:hover{border-color:#b7c9e6;box-shadow:0 2px 3px rgba(15,23,42,.04),0 12px 28px rgba(37,99,235,.075)}
.card h3{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0 0 4px;
  color:var(--ink);
  font-family:"Cormorant Garamond","Noto Sans TC",serif;
  font-size:18px;
  font-weight:700;
  line-height:1.25;
}
.card h3 .material-symbols-outlined{font-size:20px;color:var(--blue)}
.card .csub{margin:0 0 17px;color:var(--muted);font-size:13px}

/* KPI */
.kpi{position:relative;overflow:hidden;padding:20px 20px 18px;background:var(--card)}
.kpi .bar{position:absolute;top:0;left:0;width:100%;height:3px;background:var(--blue)}
.kpi .klab{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--muted);
  font-family:"Noto Sans TC",sans-serif;
  font-size:12px;
  font-weight:600;
}
.kpi .klab .material-symbols-outlined{font-size:18px;color:var(--blue)}
.kpi .kval{
  margin-top:14px;
  color:var(--ink);
  font-family:"Crimson Pro",serif;
  font-size:34px;
  font-weight:600;
  font-variant-numeric:tabular-nums lining-nums;
  letter-spacing:-.035em;
  line-height:1;
}
.kpi .kval small{margin-left:4px;color:var(--muted);font-size:13px;font-weight:600;letter-spacing:0}
.kpi .kfoot{display:flex;align-items:center;gap:5px;margin-top:12px;font-size:12px;font-weight:600}
.kpi .kfoot .material-symbols-outlined{font-size:15px}
.up{color:#047857}.down{color:#b91c1c}.flat{color:#475569}

/* Data tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:4px}
table{width:100%;min-width:540px;border-collapse:collapse;font-size:14px}
th{
  padding:10px 12px;
  border-bottom:1px solid var(--line2);
  background:var(--color-muted);
  color:#334155;
  font-family:"Noto Sans TC",sans-serif;
  font-size:11px;
  font-weight:700;
  letter-spacing:.04em;
  text-align:left;
  text-transform:uppercase;
  white-space:nowrap;
}
td{padding:12px;border-bottom:1px solid var(--line);color:var(--ink);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#f8fbff}
td:nth-last-child(1){white-space:nowrap}
.mono,
td.mono{
  font-family:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  font-variant-numeric:tabular-nums lining-nums;
  font-weight:600;
}
td.mono:has(+ td){white-space:nowrap}
.badge{
  display:inline-flex;
  min-height:24px;
  align-items:center;
  gap:5px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:3px;
  font-family:"Noto Sans TC",sans-serif;
  font-size:11px;
  font-weight:700;
  line-height:1.25;
  white-space:nowrap;
}
.badge .material-symbols-outlined{font-size:13px}
.b-ok{background:#ecfdf5;color:#047857}
.b-warn{background:#fffbeb;color:#92400e}
.b-bad{background:#fef2f2;color:#b91c1c}
.b-info{background:#eff6ff;color:#1d4ed8}
.b-grey{background:#f1f5f9;color:#475569}
.dot{display:inline-block;width:8px;height:8px;margin-right:2px;border-radius:50%;outline:1px solid rgba(15,23,42,.18)}
.progress{height:7px;min-width:60px;overflow:hidden;border-radius:2px;background:#dbe5f5}
.progress>span{display:block;height:100%;border-radius:2px}
.avatar{display:inline-flex;width:30px;height:30px;flex-shrink:0;align-items:center;justify-content:center;border:1px solid #bfdbfe;border-radius:4px;background:#eff6ff;color:#1d4ed8;font-size:12px;font-weight:700}
.approve-row{display:flex;align-items:center;gap:8px}
.chartbox{min-width:0;overflow:hidden}
.apexcharts-text,.apexcharts-legend-text{font-family:"Crimson Pro","Noto Sans TC",serif!important;fill:#475569!important;color:#475569!important}
.apexcharts-tooltip,.apexcharts-xaxistooltip{border:1px solid var(--line)!important;background:#fff!important;box-shadow:var(--shadow)!important;color:var(--ink)!important}
.apexcharts-tooltip-title{border-bottom:1px solid var(--line)!important;background:var(--color-muted)!important}

/* Kanban board */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;min-width:0}
.bcol{min-width:0;padding:12px;border:1px solid var(--line);border-radius:4px;background:var(--bg2)}
.bcol .bh{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:11px;color:#334155;font-family:"Noto Sans TC",sans-serif;font-size:12px;font-weight:700}
.bcol .bh .cnt{padding:1px 7px;border:1px solid var(--line2);border-radius:3px;background:#fff;color:var(--muted);font-family:ui-monospace,monospace;font-size:11px}
.bcard{margin-bottom:8px;padding:11px;border:1px solid var(--line);border-left:3px solid #93c5fd;border-radius:3px;background:#fff;transition:border-color .2s ease,transform .2s ease}
.bcard:hover{border-color:#93c5fd;transform:translateY(-1px)}
.bcard:last-child{margin-bottom:0}
.bcard .bt{font-size:13px;font-weight:600}
.bcard .bm{display:flex;justify-content:space-between;gap:8px;margin-top:7px;flex-wrap:wrap;color:var(--muted);font-size:11px}
.bcard .bamt{color:#1d4ed8;font-family:ui-monospace,monospace;font-weight:700}
.ltop{border-top:3px solid var(--blue)}

/* Timeline and tracking */
.timeline{position:relative;padding-left:28px}
.timeline:before{position:absolute;top:4px;bottom:4px;left:8px;width:1px;background:var(--line2);content:""}
.tev{position:relative;padding-bottom:19px}
.tev:last-child{padding-bottom:0}
.tev .tdot{position:absolute;top:2px;left:-26px;width:15px;height:15px;border:3px solid var(--blue);border-radius:50%;background:#fff}
.tev.done .tdot{background:var(--blue);box-shadow:inset 0 0 0 2px #fff}
.tev .thd{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;font-weight:600}
.tev .tdt,.tk .tkdt{color:#64748b;font-family:ui-monospace,monospace;font-size:11px;font-variant-numeric:tabular-nums;font-weight:600}
.tev .tbody{margin-top:4px;color:var(--muted);font-size:13px}
.track{display:flex;flex-direction:column}
.tk{position:relative;display:flex;align-items:flex-start;gap:12px;padding-bottom:17px}
.tk:last-child{padding-bottom:0}
.tk .tkdot{z-index:2;display:flex;width:30px;height:30px;flex-shrink:0;align-items:center;justify-content:center;border:1px solid var(--line2);border-radius:4px;background:#fff}
.tk .tkdot .material-symbols-outlined{font-size:17px;color:var(--blue)}
.tk.done .tkdot{border-color:var(--blue);background:var(--blue);color:#fff}
.tk.done .tkdot .material-symbols-outlined{color:#fff}
.tk:not(:last-child):before{position:absolute;top:30px;bottom:0;left:14px;width:1px;background:var(--line2);content:""}
.tk .tkb{min-width:0;flex:1;padding-top:3px}
.tk .tkt{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;font-weight:600}
.tk .tkm{margin-top:3px;color:var(--muted);font-size:12px}

/* Alerts, filters and legends */
.alertitem{display:flex;align-items:flex-start;gap:12px;margin-bottom:9px;padding:12px;border:1px solid var(--line);border-radius:4px;background:#fff}
.alertitem:last-child{margin-bottom:0}
.alertitem .aic{display:flex;width:34px;height:34px;flex-shrink:0;align-items:center;justify-content:center;border-radius:3px}
.alertitem .aic .material-symbols-outlined{font-size:20px}
.alertitem .abody{min-width:0;flex:1}
.alertitem .at{font-size:14px;font-weight:600}
.alertitem .ad{margin-top:3px;color:var(--muted);font-size:12px}
.pill-input{display:flex;gap:8px;margin-bottom:17px;flex-wrap:wrap}
.pill-input .pi{min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:4px;background:#fff;font-size:13px;box-shadow:0 1px 2px rgba(15,23,42,.03)}
.pill-input .pi b{display:block;margin-bottom:2px;color:#64748b;font-family:"Cinzel","Noto Sans TC",serif;font-size:9px;font-weight:600;letter-spacing:.06em}
.legendrow{display:flex;gap:15px;margin-top:12px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.legendrow span{display:inline-flex;align-items:center;gap:5px}
.miniStat{display:flex;gap:24px;margin-top:8px;flex-wrap:wrap}
.miniStat .ms{min-width:0}
.miniStat .ms .v{color:var(--ink);font-family:"Crimson Pro",serif;font-size:25px;font-variant-numeric:tabular-nums;font-weight:600}
.miniStat .ms .l{color:var(--muted);font-size:12px}

/* Conversion pipeline */
.pipe{display:flex;min-width:0;gap:8px;overflow-x:auto;padding:4px 1px 7px}
.pstage{position:relative;min-width:145px;flex:1 1 0}
.pstage .pcap{height:100%;padding:14px 13px;border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:4px;background:var(--bg2)}
.pstage .pn{display:flex;align-items:center;gap:6px;font-family:"Noto Sans TC",sans-serif;font-size:12px;font-weight:700}
.pstage .pn .material-symbols-outlined{font-size:17px;color:var(--blue)}
.pstage .pbig{margin-top:10px;color:var(--ink);font-family:"Crimson Pro",serif;font-size:30px;font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:-.03em}
.pstage .pmeta{margin-top:4px;color:var(--muted);font-size:12px}
.pstage .pconv{display:inline-flex;align-items:center;gap:4px;margin-top:9px;color:#047857;font-size:11px;font-weight:700}
.pstage:not(:last-child) .pcap:after{position:absolute;z-index:2;top:50%;right:-15px;padding:1px;background:var(--bg);color:#64748b;content:"chevron_right";font-family:"Material Symbols Outlined";font-size:18px;transform:translateY(-50%)}

@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .topnav .bar{gap:14px}
  .livechips{width:100%;justify-content:flex-start}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pagehead{padding-top:28px}
}
@media(max-width:560px){
  .topnav .bar{padding:12px 15px 9px}
  .brand .mk{width:38px;height:38px;box-shadow:3px 3px 0 #bfdbfe}
  .brand .tt{font-size:18px}
  .livechips{flex-wrap:nowrap;overflow-x:auto;padding:2px 0}
  .navrow{padding:0 8px}
  .navbtn{min-width:46px;justify-content:center;padding:10px 11px}
  .navbtn .nlab,.navbtn .nix{display:none}
  .pagehead{align-items:flex-start;padding:22px 15px 4px}
  .pagehead .ph-s{font-size:13px}
  .pagehead .ph-tag{margin-top:4px}
  .content{padding:15px 14px 40px}
  .grid{gap:12px}
  .mt{margin-top:12px}
  .card{padding:16px}
  .g4{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .kpi .kval{font-size:31px}
  table{font-size:13px}
  th,td{padding:10px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    scroll-behavior:auto!important;
    transition-duration:.01ms!important;
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
  }
  .bcard:hover{transform:none}
}
</style>
</head>
<body>
<header class="topnav">
  <div class="bar">
    <div class="brand">
      <div class="mk"><span class="material-symbols-outlined">science</span></div>
      <div>
        <div class="tt">樣品管理系統</div>
        <div class="st">Sample Management Terminal</div>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="livechips">
      <span class="lchip"><span class="live"></span>即時監控</span>
      <span class="lchip"><span class="material-symbols-outlined">calendar_month</span>2026-08-14</span>
      <span class="lchip"><span class="material-symbols-outlined">sync</span>CRM · RFQ · ERP 已同步</span>
    </div>
  </div>
  <nav class="navrow" id="nav"></nav>
</header>
<div class="pagehead">
  <div style="min-width:0">
    <div class="ph-t" id="ptitle">樣品需求申請</div>
    <div class="ph-s" id="psub">客戶樣品需求受理與審核派工</div>
  </div>
  <div class="spacer" style="flex:1"></div>
  <div class="ph-tag" id="ptag">MODULE 01 / 06</div>
</div>
<div class="content" id="view"></div>

<script>
"use strict";
var MODS=[
  {icon:"request_quote",name:"樣品需求申請",sub:"客戶樣品需求受理與審核派工"},
  {icon:"precision_manufacturing",name:"打樣製作進度",sub:"打樣工單排程與製作進度追蹤"},
  {icon:"science",name:"樣品檢驗確認",sub:"出樣前規格檢驗與 COA 附件"},
  {icon:"inventory_2",name:"寄送與到貨追蹤",sub:"物流託運、簽收與到貨確認"},
  {icon:"fact_check",name:"客戶驗證回饋",sub:"客戶承認測試結果與意見回覆"},
  {icon:"trending_up",name:"轉量產轉換",sub:"樣品轉量產訂單追蹤與成效"}
];
var charts=[];
function destroyCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
var AXCOL="#9a94b8",GRID="#2c2647";
function mk(id,opt){
  var el=document.getElementById(id);
  if(!el)return;
  opt.chart=opt.chart||{};
  opt.chart.redrawOnParentResize=false;
  opt.chart.redrawOnWindowResize=false;
  opt.chart.animations={enabled:false};
  opt.chart.fontFamily='Inter,"Noto Sans TC",sans-serif';
  opt.chart.toolbar={show:false};
  opt.chart.background="transparent";
  opt.theme=opt.theme||{mode:"dark"};
  try{var c=new ApexCharts(el,opt);c.render();charts.push(c);}catch(e){}
}
function kpi(l,v,u,ic,f,cls,fic){
  return '<div class="card kpi"><span class="bar"></span>'+
    '<div class="klab"><span class="material-symbols-outlined">'+ic+'</span>'+l+'</div>'+
    '<div class="kval">'+v+'<small>'+u+'</small></div>'+
    '<div class="kfoot '+cls+'"><span class="material-symbols-outlined">'+fic+'</span>'+f+'</div></div>';
}
function alertItem(col,ic,t,d){
  return '<div class="alertitem"><div class="aic" style="background:'+col+'26;color:'+col+'"><span class="material-symbols-outlined">'+ic+'</span></div>'+
    '<div class="abody"><div class="at">'+t+'</div><div class="ad">'+d+'</div></div></div>';
}
function tl(dt,title,cls,body){
  return '<div class="tev '+cls+'"><div class="tdot"></div>'+

function tk(cls,ic,t,m,dt){

    '<div class="tkb"><div class="tkt"><span>'+t+'</span><span class="tkdt">'+dt+'</span></div>'+

function pstage(ic,name,big,unit,meta,conv){

    '<div class="tkb"><div class="tkt"><span>'+cust+'</span><span class="tkdt"><span class="badge '+scls+'">'+st+'</span></span></div>'+
    '<div class="tkm">'+line+' · <b style="color:var(--accent2)">'+amt+'</b></div></div></div>';

/* ============ ROUTER ============ */
var SCREENS=[
  {r:s0,c:chart0},{r:s1,c:chart1},{r:s2,c:chart2},
  {r:s3,c:chart3},{r:s4,c:chart4},{r:s5,c:chart5}
];
function buildNav(){
  var nav=document.getElementById("nav");
  var h="";
  for(var i=0;i<MODS.length;i++){
    h+='<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span>'+
       '<span class="nlab">'+MODS[i].name+'</span><span class="nix">0'+(i+1)+'</span></button>';
  }
  nav.innerHTML=h;
  var btns=nav.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){
    btns[k].addEventListener("click",function(){show(+this.getAttribute("data-i"));});
  }
}
function show(i){
  destroyCharts();
  var sc=SCREENS[i];if(!sc)return;
  var view=document.getElementById("view");
  view.innerHTML=sc.r();
  document.getElementById("ptitle").textContent=MODS[i].name;
  document.getElementById("psub").textContent=MODS[i].sub;
  document.getElementById("ptag").textContent="MODULE 0"+(i+1)+" / 06";
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){
    if(+btns[k].getAttribute("data-i")===i)btns[k].classList.add("active");
    else btns[k].classList.remove("active");
  }
  void view.offsetHeight;
  if(sc.c)sc.c();
  try{window.scrollTo(0,0);}catch(e){}
}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
