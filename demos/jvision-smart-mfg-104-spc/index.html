<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cloud SPC Advanced Analytics（雲端SPC進階分析）｜Jvision 系統 Demo</title>
  <meta name="description" content="從異常到改善的品質閉環與追溯稽核" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --accent:#db2777; --accent2:#f472b6; --accent-soft:#fce7f3;
      --ink:#1f172b; --muted:#7c7089; --line:#efe6ee; --bg:#faf5f9; --card:#ffffff;
      --ok:#16a34a; --warn:#f59e0b; --bad:#dc2626; --info:#6366f1;
      --radius:16px; --shadow:0 10px 30px rgba(219,39,119,.08);
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{
      font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
      background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }
    .ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
    a{color:inherit;text-decoration:none;}

    /* ===== TOP NAV ===== */
    header.topbar{
      position:sticky; top:0; z-index:50;
      background:linear-gradient(120deg,#9d174d 0%, #db2777 55%, #f472b6 130%);
      color:#fff; box-shadow:0 6px 22px rgba(157,23,77,.25);
    }
    .topbar-inner{max-width:1360px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
    .brand{display:flex;align-items:center;gap:11px;min-width:0;}
    .brand .logo{
      width:40px;height:40px;border-radius:11px;flex:none;
      background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;
      backdrop-filter:blur(4px);
    }
    .brand .logo .ms{font-size:24px;color:#fff;}
    .brand .txt{min-width:0;}
    .brand .txt b{display:block;font-size:15px;font-weight:800;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .brand .txt span{display:block;font-size:11px;opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    nav.mainnav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0;}
    nav.mainnav button{
      display:inline-flex;align-items:center;gap:7px;cursor:pointer;
      background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);
      color:#fff;font-family:inherit;font-size:13px;font-weight:600;
      padding:8px 13px;border-radius:10px;transition:.15s;white-space:nowrap;
    }
    nav.mainnav button .ms{font-size:19px;}
    nav.mainnav button:hover{background:rgba(255,255,255,.22);}
    nav.mainnav button.on{background:#fff;color:var(--accent);border-color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.12);}

    main{max-width:1360px;margin:0 auto;padding:22px 20px 60px;}

    /* screen head */
    .screen-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
    .screen-head .h-ic{
      width:46px;height:46px;border-radius:13px;flex:none;
      background:var(--accent-soft);color:var(--accent);
      display:flex;align-items:center;justify-content:center;
    }
    .screen-head .h-ic .ms{font-size:26px;}
    .screen-head h1{margin:0;font-size:21px;font-weight:800;letter-spacing:.3px;}
    .screen-head p{margin:3px 0 0;color:var(--muted);font-size:13px;}
    .screen-head .badge{
      margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:999px;
      padding:6px 14px;font-size:12px;font-weight:700;color:var(--accent);
      display:inline-flex;align-items:center;gap:6px;
    }
    .screen-head .badge .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;}

    /* cards / grid */
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
    .card.pad{padding:18px;}
    .card-title{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:800;margin:0 0 14px;}
    .card-title .ms{font-size:20px;color:var(--accent);}
    .card-title small{margin-left:auto;font-weight:600;color:var(--muted);font-size:12px;}

    .grid{display:grid;gap:16px;min-width:0;}
    .g4{grid-template-columns:repeat(4,1fr);}
    .g3{grid-template-columns:repeat(3,1fr);}
    .g2{grid-template-columns:repeat(2,1fr);}
    .g-2-1{grid-template-columns:2fr 1fr;}
    .g-1-2{grid-template-columns:1fr 2fr;}
    .grid > *{min-width:0;}

    /* KPI */
    .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 15px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
    .kpi::after{content:"";position:absolute;right:-24px;top:-24px;width:82px;height:82px;border-radius:50%;background:var(--accent-soft);opacity:.6;}
    .kpi .kic{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;position:relative;z-index:1;}
    .kpi .kic .ms{font-size:21px;}
    .kpi .klabel{font-size:12px;color:var(--muted);margin:11px 0 4px;font-weight:600;position:relative;z-index:1;}
    .kpi .kval{font-size:27px;font-weight:900;letter-spacing:.5px;position:relative;z-index:1;}
    .kpi .kval small{font-size:13px;font-weight:700;color:var(--muted);margin-left:3px;}
    .kpi .ktrend{font-size:12px;font-weight:700;margin-top:6px;position:relative;z-index:1;display:inline-flex;align-items:center;gap:3px;}
    .kpi .ktrend .ms{font-size:15px;}
    .up{color:var(--ok);} .down{color:var(--bad);} .flat{color:var(--muted);}

    /* charts */
    .chart-wrap{position:relative;width:100%;overflow:hidden;}

    /* tables */
    .tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;}
    table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
    table.tbl th{text-align:left;font-weight:700;color:var(--muted);font-size:11.5px;letter-spacing:.4px;padding:10px 12px;border-bottom:2px solid var(--line);white-space:nowrap;text-transform:uppercase;}
    table.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
    table.tbl tr:last-child td{border-bottom:none;}
    table.tbl tbody tr:hover{background:var(--accent-soft);}
    .mono{font-variant-numeric:tabular-nums;font-weight:700;}

    /* chips */
    .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;line-height:1.6;}
    .chip .ms{font-size:14px;}
    .c-ok{background:#dcfce7;color:#15803d;}
    .c-warn{background:#fef3c7;color:#b45309;}
    .c-bad{background:#fee2e2;color:#b91c1c;}
    .c-info{background:#e0e7ff;color:#4338ca;}
    .c-pink{background:var(--accent-soft);color:var(--accent);}
    .c-gray{background:#eef0f3;color:#64748b;}

    /* progress bar */
    .pbar{height:8px;border-radius:999px;background:#f1e3ec;overflow:hidden;min-width:70px;}
    .pbar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));}

    /* pipeline (module v1) */
    .pipe{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;}
    .pipe .step{flex:1;min-width:150px;position:relative;padding:14px 16px;border:1px solid var(--line);background:#fff;}
    .pipe .step:first-child{border-radius:12px 0 0 12px;}
    .pipe .step:last-child{border-radius:0 12px 12px 0;}
    .pipe .step .n{width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;}
    .pipe .step h4{margin:0 0 3px;font-size:13.5px;font-weight:800;}
    .pipe .step p{margin:0;font-size:11.5px;color:var(--muted);}
    .pipe .step .stat{margin-top:8px;font-size:11px;font-weight:700;color:var(--ok);}

    /* board (v5) */
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;min-width:0;}
    .board > *{min-width:0;}
    .col{background:#f7eff5;border-radius:14px;padding:12px;border:1px solid var(--line);}
    .col > h4{margin:0 0 10px;font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:6px;}
    .col > h4 .cnt{margin-left:auto;background:#fff;border-radius:999px;padding:1px 9px;font-size:11px;color:var(--muted);}
    .tk{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:10px;box-shadow:0 3px 8px rgba(219,39,119,.05);}
    .tk:last-child{margin-bottom:0;}
    .tk .id{font-size:11px;font-weight:700;color:var(--accent);}
    .tk h5{margin:3px 0 6px;font-size:13px;font-weight:700;line-height:1.4;}
    .tk .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted);}
    .tk .av{width:22px;height:22px;border-radius:50%;background:var(--accent2);color:#fff;font-size:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;}

    /* timeline (v1 log) */
    .tl{position:relative;padding-left:22px;}
    .tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line);}
    .tl .ev{position:relative;padding:0 0 15px;}
    .tl .ev:last-child{padding-bottom:0;}
    .tl .ev::before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent-soft);}
    .tl .ev .t{font-size:11px;color:var(--muted);font-weight:600;}
    .tl .ev .d{font-size:12.5px;font-weight:600;margin-top:2px;}

    /* stat rows (v3) */
    .srow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line);}
    .srow:last-child{border-bottom:none;}
    .srow .snm{font-size:13px;font-weight:700;min-width:96px;}
    .srow .sval{margin-left:auto;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;}

    /* alerts (v4) */
    .alert{display:flex;gap:12px;padding:13px;border-radius:12px;border:1px solid var(--line);background:#fff;margin-bottom:11px;}
    .alert:last-child{margin-bottom:0;}
    .alert .aic{width:34px;height:34px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;}
    .alert .aic .ms{font-size:20px;}
    .alert.lv-h .aic{background:#fee2e2;color:var(--bad);}
    .alert.lv-m .aic{background:#fef3c7;color:var(--warn);}
    .alert.lv-l .aic{background:#e0e7ff;color:var(--info);}
    .alert .abody{min-width:0;flex:1;}
    .alert .abody h5{margin:0 0 2px;font-size:13px;font-weight:800;}
    .alert .abody p{margin:0;font-size:12px;color:var(--muted);line-height:1.5;}
    .alert .atime{font-size:11px;color:var(--muted);white-space:nowrap;font-weight:600;}

    .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px;}
    .legend span{display:inline-flex;align-items:center;gap:5px;}
    .legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}

    .footer-note{margin-top:26px;text-align:center;color:var(--muted);font-size:11.5px;}

    /* ===== RWD ===== */
    @media(max-width:820px){
      .g4,.g3,.g2,.g-2-1,.g-1-2{grid-template-columns:1fr;}
      .board{grid-template-columns:1fr 1fr;}
    }
    @media(max-width:560px){
      nav.mainnav button .lbl{display:none;}
      nav.mainnav button{padding:9px 11px;}
      .board{grid-template-columns:1fr;}
      main{padding:16px 14px 50px;}
      .topbar-inner{padding:10px 14px;}
      .screen-head .badge{margin-left:0;}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="logo"><span class="ms">science</span></div>
        <div class="txt">
          <b>Cloud SPC Advanced Analytics</b>
          <span>雲端SPC進階分析 ｜ 跨廠品質閉環平台</span>
        </div>
      </div>
      <nav class="mainnav" id="nav"></nav>
    </div>
  </header>
  <main>
    <div id="screen"></div>
    <div class="footer-note">Jvision 系統 Demo ｜ 純前端展示，資料為模擬 ｜ Cloud SPC Advanced Analytics（雲端SPC進階分析）</div>
  </main>

  <script>
  (function(){
    "use strict";

    var accent="#db2777", accent2="#f472b6", grid="#efe6ee", muted="#7c7089";

    var MODULES=[
      {ic:"dashboard",     nm:"跨廠品質戰情", sub:"多廠 Cpk 與異常概況總覽"},
      {ic:"account_tree",  nm:"數據上雲彙整", sub:"各廠量測數據上雲清洗對齊"},
      {ic:"monitoring",    nm:"多變量管制圖", sub:"X-bar/R 與 T² 多變量管制"},
      {ic:"science",       nm:"進階製程能力", sub:"Cp/Cpk/Ppk 與分布分析"},
      {ic:"insights",      nm:"跨廠比較預警", sub:"廠間一致性與異常預測"},
      {ic:"task_alt",      nm:"改善追蹤",     sub:"改善措施驗證與結案追蹤"}
    ];

    var charts={};
    function destroyChart(id){ if(charts[id]){ try{charts[id].destroy();}catch(e){} charts[id]=null; } }
    function mkChart(id,cfg){
      var el=document.getElementById(id);
      if(!el) return;
      destroyChart(id);
      charts[id]=new Chart(el.getContext("2d"),cfg);
    }
    Chart.defaults.font.family='"Inter","Noto Sans TC",sans-serif';
    Chart.defaults.color=muted;
    Chart.defaults.font.size=12;

    var screenEl=document.getElementById("screen");
    var navEl=document.getElementById("nav");

    // build nav
    var navHtml="";
    for(var i=0;i<MODULES.length;i++){
      navHtml+='<button data-i="'+i+'"><span class="ms">'+MODULES[i].ic+'</span><span class="lbl">'+MODULES[i].nm+'</span></button>';
    }
    navEl.innerHTML=navHtml;
    navEl.addEventListener("click",function(e){
      var b=e.target.closest("button[data-i]");
      if(!b) return;
      location.hash="v"+b.getAttribute("data-i");
    });

    function head(idx,badgeTxt){
      var m=MODULES[idx];
      return '<div class="screen-head">'
        +'<div class="h-ic"><span class="ms">'+m.ic+'</span></div>'
        +'<div><h1>'+m.nm+'</h1><p>'+m.sub+'</p></div>'
        +'<div class="badge"><span class="dot"></span>'+badgeTxt+'</div>'
        +'</div>';
    }

    function kpi(ic,label,val,unit,trend,dir){
      var tc=dir==="up"?"up":dir==="down"?"down":"flat";
      var ti=dir==="up"?"trending_up":dir==="down"?"trending_down":"trending_flat";
      return '<div class="kpi"><div class="kic"><span class="ms">'+ic+'</span></div>'
        +'<div class="klabel">'+label+'</div>'
        +'<div class="kval">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'
        +'<div class="ktrend '+tc+'"><span class="ms">'+ti+'</span>'+trend+'</div></div>';
    }

    // ============ SCREEN 0 : 跨廠品質戰情 ============
    function s0(){
      var kpis=[
        kpi("factory","納管廠區","6","廠","本季 +1 廠","up"),
        kpi("verified","平均 Cpk","1.42","","較上月 +0.11","up"),
        kpi("warning","開放異常","23","件","本週 -6 件","down"),
        kpi("insights","異常預測準確率","91.4","%","模型 R7 版","up")
      ];
      var rows=[
        ["台中一廠","注塑成型","1.58",96,"良好","c-ok"],
        ["台中二廠","CNC 加工","1.47",92,"良好","c-ok"],
        ["台南廠","SMT 貼裝","1.33",84,"觀察","c-warn"],
        ["高雄廠","沖壓","1.21",71,"觀察","c-warn"],
        ["昆山廠","注塑成型","0.98",58,"需改善","c-bad"],
        ["越南廠","組裝","1.39",88,"良好","c-ok"]
      ];
      var tb="";
      for(var i=0;i<rows.length;i++){var r=rows[i];
        tb+='<tr><td style="font-weight:700">'+r[0]+'</td><td>'+r[1]
          +'</td><td class="mono">'+r[2]+'</td>'
          +'<td><div style="display:flex;align-items:center;gap:8px"><div class="pbar" style="flex:1"><i style="width:'+r[3]+'%"></i></div><span class="mono" style="font-size:12px">'+r[3]+'</span></div></td>'
          +'<td><span class="chip '+r[5]+'">'+r[4]+'</span></td></tr>';
      }
      var html=head(0,"即時同步 · MES/QMS")
        +'<div class="grid g4" style="margin-bottom:16px">'+kpis.join("")+'</div>'
        +'<div class="grid g-2-1" style="margin-bottom:16px">'
          +'<div class="card pad"><div class="card-title"><span class="ms">show_chart</span>跨廠改善驗證率趨勢<small>近 6 週</small></div><div class="chart-wrap" style="height:280px"><canvas id="c0a"></canvas></div></div>'
          +'<div class="card pad"><div class="card-title"><span class="ms">donut_small</span>異常類型分布<small>當月</small></div><div class="chart-wrap" style="height:280px"><canvas id="c0b"></canvas></div></div>'
        +'</div>'
        +'<div class="card pad"><div class="card-title"><span class="ms">factory</span>各廠製程能力總覽<small>Cpk / 健康分數</small></div>'
          +'<div class="tbl-scroll"><table class="tbl"><thead><tr><th>廠區</th><th>主製程</th><th>Cpk</th><th>健康分數</th><th>狀態</th></tr></thead><tbody>'+tb+'</tbody></table></div></div>';
      screenEl.innerHTML=html;
      void screenEl.offsetHeight;
      mkChart("c0a",{type:"line",data:{labels:["第1週","第2週","第3週","第4週","第5週","第6週"],datasets:[
        {label:"改善驗證率 %",data:[60,66,73,79,86,92],borderColor:accent,backgroundColor:"rgba(219,39,119,.12)",fill:true,tension:.4,borderWidth:3,pointRadius:4,pointBackgroundColor:accent},
        {label:"跨廠 Cpk 達標率 %",data:[54,61,64,72,78,84],borderColor:accent2,backgroundColor:"rgba(244,114,182,.08)",fill:true,tension:.4,borderWidth:2,pointRadius:3,pointBackgroundColor:accent2}
      ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}},scales:{y:{beginAtZero:false,min:40,max:100,grid:{color:grid}},x:{grid:{display:false}}}}});
      mkChart("c0b",{type:"doughnut",data:{labels:["規格超差","製程漂移","量測異常","批次隔離","其他"],datasets:[{data:[34,26,18,14,8],backgroundColor:[accent,accent2,"#fbcfe8","#fda4af","#f9d7e6"],borderWidth:2,borderColor:"#fff"}]},options:{responsive:true,maintainAspectRatio:false,cutout:"58%",plugins:{legend:{position:"bottom"}}}});
    }

    // ============ SCREEN 1 : 數據上雲彙整 ============
    function s1(){
      var kpis=[
        kpi("cloud_upload","今日上雲筆數","1.28","M","6 廠同步","up"),
        kpi("rule","清洗通過率","98.7","%","+0.4pp","up"),
        kpi("schedule","平均延遲","2.4","秒","串流管線","flat"),
        kpi("report","對齊失敗","312","筆","已隔離重送","down")
      ];
      var steps=[
        ["1","邊緣採集","各廠量測儀器/PLC 原始訊號","6 廠 · 上線"],
        ["2","上雲傳輸","MQTT 串流至雲端資料湖","2.4s 延遲"],
        ["3","清洗校驗","去除離群、單位換算、補缺","98.7% 通過"],
        ["4","規格對齊","對齊產品規格上下限基準","已對齊"],
        ["5","建模就緒","形成跨廠可比對資料集","可分析"]
      ];
      var pipe="";
      for(var i=0;i<steps.length;i++){var s=steps[i];
        pipe+='<div class="step"><div class="n">'+s[0]+'</div><h4>'+s[1]+'</h4><p>'+s[2]+'</p><div class="stat"><span class="ms" style="font-size:14px">check_circle</span> '+s[3]+'</div></div>';
      }
      var src=[

        {label:"改善驗證率 %",data:[60,66,73,79,86,92],borderColor:accent,backgroundColor:"rgba(219,39,119,.14)",fill:true,tension:.4,borderWidth:3,pointRadius:4,pointBackgroundColor:accent},
        {label:"重複不良率 %",data:[5.6,4.7,3.8,3.0,2.4,1.9],borderColor:accent2,backgroundColor:"rgba(244,114,182,.06)",fill:false,tension:.4,borderWidth:2,pointRadius:3,pointBackgroundColor:accent2}
      ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}},scales:{y:{beginAtZero:true,grid:{color:grid}},x:{grid:{display:false}}}}});
    }

    var SCREENS=[s0,s1,s2,s3,s4,s5];

    function show(i){
      var n=SCREENS.length;
      if(i<0)i=0; if(i>n-1)i=n-1;
      // destroy all charts before switching
      for(var k in charts){ destroyChart(k); }
      var btns=navEl.querySelectorAll("[data-i]");
      for(var b=0;b<btns.length;b++){ btns[b].classList.toggle("on", +btns[b].getAttribute("data-i")===i); }
      SCREENS[i]();
    }

    function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
    window.addEventListener("hashchange",fromHash);fromHash();
  })();
  </script>
