<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cloud SPC Advanced Analytics（雲端SPC進階分析）｜Jvision 系統 Demo</title>
  <meta name="description" content="從異常到改善的品質閉環與追溯稽核" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --bg:#F8FAFC;
  --card:#FFFFFF;
  --accent:#2563EB;
  --accent2:#EA580C;
  --accent-soft:#DBEAFE;
  --ok:#15803D;
  --warn:#A94600;
  --bad:#DC2626;
  --info:#1D4ED8;
  --radius:0px;
  --shadow:6px 6px 0 #1E293B;
}

*{box-sizing:border-box;}
html{margin:0;padding:0;scroll-behavior:auto;}
body{
  margin:0;
  padding:0;
  min-width:320px;
  overflow-x:hidden;
  color:var(--ink);
  background-color:var(--color-background);
  background-image:
    linear-gradient(var(--line) 1px,transparent 1px),
    linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:32px 32px;
  font-family:"Fira Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit;}
button,a,[role="button"]{cursor:pointer;}
a{color:inherit;text-decoration:none;}
.ms{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:4px;
  box-shadow:0 0 0 2px var(--color-on-primary);
}
::selection{color:#fff;background:var(--blue);}

/* ===== STICKY PRODUCT BAR ===== */
header.topbar{
  position:sticky;
  top:0;
  z-index:50;
  color:#fff;
  background:#101827;
  border-bottom:4px solid var(--color-accent);
  box-shadow:none;
}
.topbar-inner{
  width:min(100%,1440px);
  min-height:78px;
  margin:0 auto;
  padding:0 24px;
  display:flex;
  align-items:stretch;
  gap:24px;
}
.brand{
  min-width:330px;
  display:flex;
  align-items:center;
  gap:14px;
  border-right:2px solid #475569;
  padding-right:24px;
}
.brand .logo{
  width:48px;
  height:48px;
  flex:none;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--blue);
  border:2px solid #fff;
  border-radius:0;
  box-shadow:4px 4px 0 var(--color-accent);
}
.brand .logo .ms{font-size:28px;}
.brand .txt{min-width:0;}
.brand .txt b{
  display:block;
  overflow:hidden;
  color:#fff;
  font-size:16px;
  font-weight:700;
  letter-spacing:.02em;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.brand .txt span{
  display:block;
  overflow:hidden;
  margin-top:2px;
  color:#CBD5E1;
  font-family:"Fira Code",monospace;
  font-size:11px;
  text-overflow:ellipsis;
  white-space:nowrap;
}
nav.mainnav{
  min-width:0;
  margin-left:auto;
  display:flex;
  align-items:stretch;
  gap:0;
  overflow-x:auto;
  scrollbar-width:thin;
}
nav.mainnav button{
  min-width:92px;
  min-height:48px;
  padding:10px 13px;
  display:inline-flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  border:0;
  border-left:1px solid #475569;
  border-radius:0;
  color:#E2E8F0;
  background:transparent;
  font-size:12px;
  font-weight:600;
  line-height:1.2;
  white-space:nowrap;
  transition:background-color .18s ease,color .18s ease,box-shadow .18s ease;
}
nav.mainnav button:last-child{border-right:1px solid #475569;}
nav.mainnav button .ms{font-size:21px;}
nav.mainnav button:hover{color:#fff;background:#26354B;}
nav.mainnav button.on{
  color:#000;
  background:var(--color-accent);
  box-shadow:inset 0 -5px 0 #fff;
}
nav.mainnav button.on .ms{font-variation-settings:"FILL" 1;}
nav.mainnav button:focus-visible{position:relative;z-index:2;outline-color:#fff;box-shadow:inset 0 0 0 3px var(--blue);}

main{
  width:min(calc(100% - 48px),1360px);
  margin:0 auto;
  padding:34px 0 72px;
}
#screen{min-height:calc(100vh - 180px);}

/* ===== ASYMMETRIC SCREEN HEADING ===== */
.screen-head{
  position:relative;
  min-height:138px;
  margin:0 0 26px;
  padding:24px 240px 24px 94px;
  display:flex;
  align-items:center;
  gap:18px;
  color:var(--ink);
  background:#fff;
  border:3px solid var(--ink);
  box-shadow:8px 8px 0 var(--blue);
}
.screen-head::before{
  content:"QUALITY / PROCESS / CONTROL";
  position:absolute;
  top:0;
  left:0;
  padding:4px 9px;
  color:#fff;
  background:var(--ink);
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:600;
  letter-spacing:.12em;
}
.screen-head .h-ic{
  position:absolute;
  left:22px;
  bottom:22px;
  width:54px;
  height:54px;
  display:grid;
  place-items:center;
  flex:none;
  color:#fff;
  background:var(--blue);
  border:2px solid var(--ink);
  border-radius:0;
}
.screen-head .h-ic .ms{font-size:30px;}
.screen-head h1{
  margin:12px 0 0;
  max-width:760px;
  font-size:clamp(27px,3vw,44px);
  font-weight:700;
  line-height:1.05;
  letter-spacing:-.035em;
}
.screen-head p{
  margin:9px 0 0;
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:12px;
  font-weight:500;
}
.screen-head .badge{
  position:absolute;
  top:0;
  right:0;
  max-width:220px;
  min-height:46px;
  margin:0;
  padding:10px 14px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:#fff;
  background:var(--ink);
  border:0;
  border-left:3px solid var(--ink);
  border-bottom:3px solid var(--ink);
  border-radius:0;
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:600;
}
.screen-head .badge .dot{
  width:10px;
  height:10px;
  display:inline-block;
  flex:none;
  background:#22C55E;
  border:2px solid #fff;
  border-radius:0;
}

/* ===== GRID / SURFACES ===== */
.grid{display:grid;gap:18px;min-width:0;}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(290px,1fr);}
.g-1-2{grid-template-columns:minmax(290px,1fr) minmax(0,2fr);}
.grid>*{min-width:0;}
.card{
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:2px solid var(--ink);
  border-radius:0;
  box-shadow:5px 5px 0 #CBD5E1;
}
.card.pad{padding:20px;}
.card-title{
  min-height:36px;
  margin:-20px -20px 18px;
  padding:10px 12px;
  display:flex;
  align-items:center;
  gap:9px;
  color:#fff;
  background:var(--ink);
  border-bottom:2px solid var(--ink);
  font-size:14px;
  font-weight:700;
  letter-spacing:.015em;
}
.card-title .ms{color:#93C5FD;font-size:21px;}
.card-title small{
  margin-left:auto;
  color:#CBD5E1;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:500;
  text-align:right;
}

/* ===== KPI BLOCKS ===== */
.kpi{
  position:relative;
  min-height:180px;
  overflow:hidden;
  padding:18px;
  color:var(--ink);
  background:#fff;
  border:2px solid var(--ink);
  border-radius:0;
  box-shadow:5px 5px 0 var(--ink);
}
.kpi:nth-child(2n){transform:translateY(7px);}
.kpi::before{
  content:"";
  position:absolute;
  top:0;
  right:0;
  width:44px;
  height:12px;
  background:var(--color-accent);
  border-left:2px solid var(--ink);
  border-bottom:2px solid var(--ink);
}
.kpi::after{display:none;}
.kpi .kic{
  position:relative;
  z-index:1;
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--blue);
  border:2px solid var(--ink);
  border-radius:0;
}
.kpi .kic .ms{font-size:21px;}
.kpi .klabel{
  position:relative;
  z-index:1;
  margin:14px 0 2px;
  color:var(--muted);
  font-size:12px;
  font-weight:600;
  letter-spacing:.04em;
  text-transform:uppercase;
}
.kpi .kval{
  position:relative;
  z-index:1;
  color:#0F172A;
  font-family:"Fira Code",monospace;
  font-size:clamp(25px,2.5vw,34px);
  font-weight:700;
  line-height:1.1;
  letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;
}
.kpi .kval small{margin-left:5px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:0;}
.kpi .ktrend{
  position:relative;
  z-index:1;
  margin-top:10px;
  padding:3px 6px;
  display:inline-flex;
  align-items:center;
  gap:4px;
  border:1px solid currentColor;
  font-size:11px;
  font-weight:700;
}
.kpi .ktrend .ms{font-size:15px;}
.up{color:var(--ok);}.down{color:var(--bad);}.flat{color:var(--muted);}

/* ===== CHARTS ===== */
.chart-wrap{position:relative;width:100%;overflow:hidden;}
canvas{max-width:100%;}
.legend{
  margin-top:14px;
  padding-top:10px;
  display:flex;
  flex-wrap:wrap;
  gap:8px 16px;
  color:var(--muted);
  border-top:1px solid var(--line);
  font-family:"Fira Code",monospace;
  font-size:11px;
}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:14px;height:8px;display:inline-block;border:1px solid var(--ink);border-radius:0;}

/* ===== DATA TABLES ===== */
.tbl-scroll{
  width:100%;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  border:1px solid var(--ink);
  border-radius:0;
}
table.tbl{
  width:100%;
  min-width:560px;
  border-collapse:collapse;
  color:var(--ink);
  background:#fff;
  font-size:13px;
}
table.tbl th{
  padding:11px 12px;
  color:#fff;
  background:var(--blue);
  border-right:1px solid #93C5FD;
  border-bottom:2px solid var(--ink);
  font-size:11px;
  font-weight:700;
  letter-spacing:.055em;
  line-height:1.25;
  text-align:left;
  text-transform:uppercase;
  white-space:nowrap;
}
table.tbl th:last-child{border-right:0;}
table.tbl td{
  padding:12px;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  white-space:nowrap;
}
table.tbl td:last-child{border-right:0;}
table.tbl tr:last-child td{border-bottom:0;}
table.tbl tbody tr:nth-child(even){background:#F8FAFC;}
table.tbl tbody tr:hover{background:#DBEAFE;}
.mono,
.tk .id,
.tl .ev .t,
.srow .sval{
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
table.tbl td.mono{text-align:right;font-weight:600;}

/* ===== STATUS CHIPS ===== */
.chip{
  min-height:26px;
  padding:3px 8px;
  display:inline-flex;
  align-items:center;
  gap:5px;
  border:1px solid currentColor;
  border-radius:0;
  font-size:11px;
  font-weight:700;
  line-height:1.45;
}
.chip .ms{font-size:14px;}
.c-ok{color:#116329;background:#DCFCE7;}
.c-warn{color:#7C2D12;background:#FFEDD5;}
.c-bad{color:#991B1B;background:#FEE2E2;}
.c-info{color:#1E40AF;background:#DBEAFE;}
.c-pink{color:#1E40AF;background:#DBEAFE;}
.c-gray{color:#334155;background:#E2E8F0;}

.pbar{
  min-width:70px;
  height:12px;
  overflow:hidden;
  background:#E2E8F0;
  border:1px solid var(--ink);
  border-radius:0;
}
.pbar>i{display:block;height:100%;background:var(--blue);border-radius:0;}

/* ===== INGESTION PIPELINE ===== */
.pipe{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;}
.pipe .step{
  position:relative;
  flex:1;
  min-width:150px;
  padding:18px 14px 14px;
  background:#fff;
  border:1px solid var(--ink);
  border-radius:0;
}
.pipe .step:nth-child(even){background:var(--color-muted);}
.pipe .step:first-child,.pipe .step:last-child{border-radius:0;}
.pipe .step .n{
  width:28px;
  height:28px;
  margin-bottom:12px;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--ink);
  border-radius:0;
  font-family:"Fira Code",monospace;
  font-size:12px;
  font-weight:700;
}
.pipe .step h4{margin:0 0 5px;font-size:14px;font-weight:700;}
.pipe .step p{margin:0;color:var(--muted);font-size:12px;line-height:1.5;}
.pipe .step .stat{margin-top:10px;color:var(--ok);font-size:11px;font-weight:700;}

/* ===== IMPROVEMENT BOARD ===== */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;min-width:0;}
.board>*{min-width:0;}
.col{
  padding:12px;
  background:var(--color-muted);
  border:2px solid var(--ink);
  border-radius:0;
}
.col:nth-child(even){transform:translateY(8px);}
.col>h4{margin:0 0 12px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;}
.col>h4 .cnt{
  margin-left:auto;
  min-width:26px;
  padding:2px 7px;
  color:#fff;
  background:var(--ink);
  border-radius:0;
  font-family:"Fira Code",monospace;
  font-size:11px;
  text-align:center;
}
.tk{
  margin-bottom:10px;
  padding:12px;
  background:#fff;
  border:1px solid var(--ink);
  border-radius:0;
  box-shadow:3px 3px 0 #94A3B8;
}
.tk:last-child{margin-bottom:0;}
.tk .id{color:var(--blue);font-size:11px;font-weight:700;}
.tk h5{margin:5px 0 9px;font-size:13px;font-weight:700;line-height:1.45;}
.tk .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:11px;}
.tk .av{
  width:25px;
  height:25px;
  display:inline-grid;
  place-items:center;
  color:#fff;
  background:var(--ink);
  border-radius:0;
  font-size:10px;
  font-weight:700;
}

/* ===== TIMELINE / STATS / ALERTS ===== */
.tl{position:relative;padding-left:28px;}
.tl::before{content:"";position:absolute;top:3px;bottom:3px;left:7px;width:3px;background:var(--ink);}
.tl .ev{position:relative;padding:0 0 18px;}
.tl .ev:last-child{padding-bottom:0;}
.tl .ev::before{
  content:"";
  position:absolute;
  top:3px;
  left:-27px;
  width:13px;
  height:13px;
  background:var(--color-accent);
  border:2px solid var(--ink);
  border-radius:0;
}
.tl .ev .t{color:var(--muted);font-size:11px;font-weight:600;}
.tl .ev .d{margin-top:3px;font-size:12px;font-weight:600;line-height:1.45;}
.srow{padding:11px 0;display:flex;align-items:center;gap:12px;border-bottom:1px dashed #94A3B8;}
.srow:last-child{border-bottom:0;}
.srow .snm{min-width:100px;color:var(--muted);font-size:12px;font-weight:600;}
.srow .sval{margin-left:auto;font-size:13px;font-weight:700;text-align:right;}
.alert{
  position:relative;
  margin-bottom:12px;
  padding:14px;
  display:flex;
  gap:13px;
  background:#fff;
  border:1px solid var(--ink);
  border-left-width:8px;
  border-radius:0;
}
.alert:last-child{margin-bottom:0;}
.alert.lv-h{border-left-color:var(--bad);}
.alert.lv-m{border-left-color:var(--color-accent);}
.alert.lv-l{border-left-color:var(--blue);}
.alert .aic{
  width:36px;
  height:36px;
  display:grid;
  place-items:center;
  flex:none;
  border:1px solid currentColor;
  border-radius:0;
}
.alert .aic .ms{font-size:20px;}
.alert.lv-h .aic{color:#991B1B;background:#FEE2E2;}
.alert.lv-m .aic{color:#7C2D12;background:#FFEDD5;}
.alert.lv-l .aic{color:#1E40AF;background:#DBEAFE;}
.alert .abody{min-width:0;flex:1;}
.alert .abody h5{margin:0 0 3px;font-size:13px;font-weight:700;}
.alert .abody p{margin:0;color:var(--muted);font-size:12px;line-height:1.55;}
.alert .atime{color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;font-weight:500;white-space:nowrap;}
.footer-note{
  margin-top:34px;
  padding:12px;
  color:#fff;
  background:var(--ink);
  border-left:12px solid var(--color-accent);
  font-family:"Fira Code",monospace;
  font-size:10px;
  text-align:left;
}

/* ===== RESPONSIVE ===== */
@media(max-width:1100px){
  .topbar-inner{padding:0 18px;gap:12px;}
  .brand{min-width:280px;padding-right:14px;}
  nav.mainnav button{min-width:76px;padding-inline:9px;}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));}
  .board{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media(max-width:820px){
  .topbar-inner{padding:0;display:block;}
  .brand{min-width:0;min-height:66px;padding:9px 16px;border-right:0;border-bottom:1px solid #475569;}
  nav.mainnav{width:100%;margin:0;}
  nav.mainnav button{min-width:110px;flex:1;}
  main{width:min(calc(100% - 28px),1360px);padding-top:24px;}
  .screen-head{padding:70px 18px 20px;align-items:flex-start;}
  .screen-head .h-ic{top:17px;bottom:auto;left:18px;width:42px;height:42px;}
  .screen-head .badge{max-width:calc(100% - 78px);min-height:42px;}
  .screen-head h1{margin-top:0;}
  .g3,.g2,.g-2-1,.g-1-2{grid-template-columns:1fr;}
  .board{grid-template-columns:1fr 1fr;}
}
@media(max-width:560px){
  .brand .logo{width:42px;height:42px;}
  .brand .txt b{font-size:14px;}
  .brand .txt span{font-size:9px;}
  nav.mainnav button{min-width:52px;min-height:52px;padding:8px 10px;}
  nav.mainnav button .lbl{display:none;}
  main{width:calc(100% - 20px);padding:18px 0 48px;}
  .screen-head{min-height:154px;margin-bottom:22px;padding-top:72px;box-shadow:5px 5px 0 var(--blue);}
  .screen-head h1{font-size:27px;}
  .screen-head p{font-size:11px;}
  .screen-head .badge{font-size:9px;}
  .g4{grid-template-columns:1fr;}
  .kpi:nth-child(2n),.col:nth-child(even){transform:none;}
  .card.pad{padding:16px;}
  .card-title{margin:-16px -16px 16px;padding:10px;align-items:flex-start;}
  .card-title small{max-width:42%;}
  .board{grid-template-columns:1fr;}
  .alert{align-items:flex-start;flex-wrap:wrap;}
  .alert .atime{width:100%;padding-left:49px;}
  .footer-note{line-height:1.6;}
}
@media(max-width:390px){
  .screen-head .badge{max-width:230px;}
  .kpi{min-height:168px;}
  table.tbl{font-size:12px;}

    var SCREENS=[s0,s1,s2,s3,s4,s5];

    function show(i){
      var n=SCREENS.length;
      if(i<0)i=0; if(i>n-1)i=n-1;
      // destroy all charts before switching
      for(var k in charts){ destroyChart(k); }
      var btns=navEl.querySelectorAll("[data-i]");
      for(var b=0;b<btns.length;b++){ btns[b].classList.toggle("on", +btns[b].getAttribute("data-i")===i); }
      SCREENS[i]();
    }

    function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
    window.addEventListener("hashchange",fromHash);fromHash();
