<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>工程估價與專案管理 · JVISION PMIS 終端</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#0369a1; --accent2:#38bdf8; --bg:#0a1420; --panel:#0f1e2e; --panel2:#132539;
  --line:#1e3a52; --txt:#e2eef7; --mut:#7d96ab; --good:#22c55e; --warn:#f59e0b; --bad:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:"Inter","Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;line-height:1;vertical-align:middle;font-size:20px}
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#0c1a29,#0a1420);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 0 16px rgba(56,189,248,.35)}
.brand b{font-size:15px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;color:var(--mut);font-size:11px;font-weight:500}
.tick{margin-left:auto;display:flex;gap:16px;align-items:center;min-width:0;flex-wrap:wrap}
.tickitem{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.tickitem span{font-size:10px;color:var(--mut);white-space:nowrap}
.tickitem b{font-size:13px;font-variant-numeric:tabular-nums}
.up{color:var(--good)}.dn{color:var(--bad)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(34,197,94,.5)}50%{opacity:.5;box-shadow:0 0 0 6px rgba(34,197,94,0)}}
.nav{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 14px;display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:56px;z-index:20}
.nav button{flex:none;white-space:nowrap;min-width:0;background:transparent;color:var(--mut);border:1px solid transparent;border-radius:9px;padding:8px 14px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.15s}
.nav button:hover{color:var(--txt);background:var(--panel2)}
.nav button.on{color:#fff;background:linear-gradient(135deg,var(--accent),#075985);border-color:var(--accent2);box-shadow:0 0 0 1px rgba(56,189,248,.25),0 6px 18px -8px rgba(3,105,161,.8)}
.nav button .idx{font-size:10px;opacity:.7}
.wrap{padding:18px;max-width:1360px;margin:0 auto}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.head h1{font-size:20px;font-weight:800;display:flex;align-items:center;gap:9px}
.head h1 .material-symbols-outlined{color:var(--accent2);font-size:24px}
.head p{color:var(--mut);font-size:12.5px;margin-top:3px;max-width:660px}
.pill{font-size:11px;padding:5px 11px;border-radius:20px;border:1px solid var(--line);color:var(--mut);background:var(--panel);white-space:nowrap}
.pill.g{color:var(--good);border-color:rgba(34,197,94,.35)}
.pill.a{color:var(--accent2);border-color:rgba(56,189,248,.35)}
.pill.w{color:var(--warn);border-color:rgba(245,158,11,.35)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
@media(max-width:820px){.g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card.pad0{padding:0;overflow:hidden}
.ctitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ctitle h3{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.ctitle h3 .material-symbols-outlined{color:var(--accent2);font-size:19px}
.ctitle .sub{font-size:11px;color:var(--mut)}
.kpi{background:linear-gradient(155deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:15px;position:relative;overflow:hidden;min-width:0}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:74px;height:74px;border-radius:50%;background:radial-gradient(circle,rgba(56,189,248,.16),transparent 70%)}
.kpi .lab{font-size:11.5px;color:var(--mut);display:flex;align-items:center;gap:6px}
.kpi .lab .material-symbols-outlined{font-size:16px;color:var(--accent2)}
.kpi .val{font-size:25px;font-weight:800;margin:7px 0 3px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.kpi .val small{font-size:12px;color:var(--mut);font-weight:600;margin-left:3px}
.kpi .delta{font-size:11px;font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px}
.tbl th{text-align:left;color:var(--mut);font-weight:600;font-size:11px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel)}
.tbl td{padding:10px 12px;border-bottom:1px solid rgba(30,58,82,.5);white-space:nowrap}
.tbl tr:hover td{background:var(--panel2)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tag{font-size:10.5px;padding:3px 9px;border-radius:20px;font-weight:600;display:inline-block;white-space:nowrap}
.tag.g{background:rgba(34,197,94,.14);color:#4ade80}
.tag.a{background:rgba(56,189,248,.14);color:var(--accent2)}
.tag.w{background:rgba(245,158,11,.14);color:#fbbf24}
.tag.r{background:rgba(239,68,68,.14);color:#f87171}
.tag.m{background:rgba(148,163,184,.14);color:#cbd5e1}
.bar{height:7px;border-radius:6px;background:var(--panel2);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.scroll{overflow-x:auto;border-radius:12px}
canvas{max-width:100%}
.chart-box{position:relative}
.rowline{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid rgba(30,58,82,.5)}
.rowline:last-child{border-bottom:0}
.rowline .ic{width:34px;height:34px;border-radius:9px;background:var(--panel2);display:grid;place-items:center;flex:none;color:var(--accent2)}
.rowline .gr{flex:1;min-width:0}
.rowline .t{font-size:13px;font-weight:600}
.rowline .d{font-size:11px;color:var(--mut);margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.board{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:12px;min-width:640px}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.col h4{font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;color:var(--txt)}
.col h4 .cnt{font-size:10.5px;color:var(--mut);background:var(--panel);padding:2px 8px;border-radius:20px}
.ticket{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:9px;padding:9px 10px;margin-bottom:8px}
.ticket .no{font-size:10px;color:var(--mut);font-variant-numeric:tabular-nums}
.ticket .tt{font-size:12px;font-weight:600;margin:3px 0 6px}
.ticket .mt{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:10.5px;color:var(--mut)}
.who{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;flex:none}
.gantt{min-width:680px;font-size:12px}
.grow{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(30,58,82,.5)}
.gname{font-weight:600;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gtrack{position:relative;height:22px;background:var(--panel2);border-radius:7px;overflow:hidden}
.gbar{position:absolute;top:3px;height:16px;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));display:flex;align-items:center;padding:0 7px;font-size:10px;color:#fff;font-weight:600;white-space:nowrap}
.gbar.done{background:linear-gradient(90deg,#166534,#22c55e)}
.gbar.late{background:linear-gradient(90deg,#991b1b,#ef4444)}
.gmark{position:absolute;top:0;bottom:0;width:2px;background:var(--accent2);opacity:.7}
.matrix{display:grid;grid-template-columns:64px repeat(4,1fr);gap:6px;min-width:520px}
.mcell{border-radius:9px;padding:10px 8px;text-align:center;font-size:11px;font-weight:600;position:relative;min-height:56px;display:grid;place-items:center}
.mhead{background:transparent;color:var(--mut);font-size:11px}
.mbadge{position:absolute;top:5px;right:6px;background:rgba(0,0,0,.35);border-radius:20px;font-size:10px;padding:1px 7px;color:#fff}
.ring{width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--accent2) calc(var(--v)*1%),var(--panel2) 0);display:grid;place-items:center;flex:none}
.ring .inner{width:72px;height:72px;border-radius:50%;background:var(--panel);display:grid;place-items:center;text-align:center}
.ring .inner b{font-size:19px;font-weight:800;display:block}
.ring .inner span{font-size:10px;color:var(--mut)}
.statrow{display:flex;gap:18px;flex-wrap:wrap}
.stat{min-width:0}
.stat b{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;display:block}
.stat span{font-size:11px;color:var(--mut)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:8px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
.doc{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px}
.docrow{display:flex;justify-content:space-between;font-size:12.5px;padding:7px 0;border-bottom:1px dashed rgba(30,58,82,.7)}
.docrow:last-child{border-bottom:0}
.docrow b{font-variant-numeric:tabular-nums}
.big{font-size:26px;font-weight:800;letter-spacing:-.5px}
.foot{color:var(--mut);font-size:11px;text-align:center;padding:24px 0 34px}
.foot b{color:var(--accent2)}
@media(max-width:560px){
  .nav button span.lbl{display:none}
  .tick .tickitem:nth-child(n+4){display:none}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">foundation</span></div>
    <div><b>JVISION PMIS</b><small>工程估價與專案管理終端</small></div>
  </div>
  <div class="tick">
    <div class="tickitem"><span>在建專案</span><b>18</b></div>
    <div class="tickitem"><span>本月估驗計價</span><b>NT$ 4.82億</b></div>
    <div class="tickitem"><span>整體達成率</span><b class="up">▲ 92.4%</b></div>
    <div class="tickitem"><span>逾期缺失</span><b class="dn">▼ 7</b></div>
    <div class="tickitem"><span class="live"><i class="dot"></i>即時連線</span></div>
  </div>
</div>
<div class="nav" id="nav"></div>
<div class="wrap"><div id="view"></div></div>
<div class="foot">JVISION 營建工程管理 · <b>估價 · 專案 · 進度 · 圖說 · 計價 · 維保</b> 單一整合平台 · 本頁為純前端展示，資料為模擬</div>

<script>
"use strict";
var charts=[];
function destroyCharts(){ for(var i=0;i<charts.length;i++){ try{charts[i].destroy();}catch(e){} } charts=[]; }
function mk(el,cfg){ var c=new Chart(el,cfg); charts.push(c); return c; }
var GRID="rgba(125,150,171,.16)", TXTC="#7d96ab", TICK="#9fb4c7";
Chart.defaults.color=TXTC; Chart.defaults.font.family="Inter, Noto Sans TC, sans-serif"; Chart.defaults.font.size=11;

var MOD=[
 {icon:"request_quote",name:"報價估價",sub:"工項單價分析與投標估價"},
 {icon:"account_tree",name:"專案轉檔",sub:"得標轉工程專案與 WBS 排程"},
 {icon:"monitoring",name:"進度品質",sub:"實獲值進度與品安巡檢"},
 {icon:"architecture",name:"圖說送審",sub:"圖說版次與監造審查流程"},
 {icon:"payments",name:"估驗請款",sub:"估驗計價、保留款與請款"},
 {icon:"verified",name:"驗收維保",sub:"竣工驗收與保固維護"}
];
function nt(n){ return "NT$ "+Number(n||0).toLocaleString("en-US"); }

function s_head(t,d,pills){
  var p=(pills||[]).map(function(x){return '<span class="pill '+(x.c||'')+'">'+x.t+'</span>';}).join("");
  return '<div class="head"><div><h1><span class="material-symbols-outlined">'+t.icon+'</span>'+t.name+'</h1><p>'+d+'</p></div><div style="display:flex;gap:8px;flex-wrap:wrap">'+p+'</div></div>';
}
function kpi(icon,lab,val,unit,delta,cls){
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+icon+'</span>'+lab+'</div><div class="val">'+val+'<small>'+(unit||"")+'</small></div><div class="delta '+(cls||'')+'">'+(delta||"")+'</div></div>';
}

/* ---------- Screen 0 : 報價估價 ---------- */
function screen0(){
  var items=[
   {c:"02100",n:"整地與假設工程",u:"式",q:1,up:1850000,pct:78,st:"已核價",sc:"g"},
   {c:"03210",n:"RC 結構工程 3000psi",u:"m³",q:2450,up:4650,pct:100,st:"已核價",sc:"g"},
   {c:"03310",n:"鋼筋 SD420W",u:"噸",q:386,up:32800,pct:100,st:"已核價",sc:"g"},
   {c:"04200",n:"1B 清水磚牆砌築",u:"m²",q:1820,up:2280,pct:64,st:"待複核",sc:"w"},
   {c:"07920",n:"矽利康防水填縫",u:"m",q:960,up:180,pct:40,st:"詢價中",sc:"a"},
   {c:"08110",n:"防火門 FD-90",u:"樘",q:48,up:18500,pct:100,st:"已核價",sc:"g"},
   {c:"09650",n:"PVC 塑膠地磚",u:"m²",q:3200,up:640,pct:52,st:"待複核",sc:"w"},
   {c:"15400",n:"給排水衛生設備",u:"式",q:1,up:5820000,pct:30,st:"詢價中",sc:"a"},
   {c:"16050",n:"電氣配線與配電盤",u:"式",q:1,up:7240000,pct:22,st:"詢價中",sc:"a"}
  ];
  var rows=items.map(function(x){
    return '<tr><td><span class="tag m">'+x.c+'</span></td><td>'+x.n+'</td><td>'+x.u+'</td><td class="num">'+x.q.toLocaleString()+'</td><td class="num">'+nt(x.up)+'</td><td class="num">'+nt(x.up*x.q)+'</td>'
     +'<td><div class="bar" title="'+x.pct+'%"><i style="width:'+x.pct+'%"></i></div></td>'
     +'<td><span class="tag '+x.sc+'">'+x.st+'</span></td></tr>';
  }).join("");
  var total=items.reduce(function(a,b){return a+b.up*b.q;},0);
  var html=s_head(MOD[0],"依 CSI 工項拆解數量、套用單價分析與利潤加成，即時產出投標估價與成本結構。",
    [{t:"標案：市立圖書館新建工程",c:"a"},{t:"截標倒數 3 天",c:"w"}]);
  html+='<div class="grid g4" style="margin-bottom:14px">'
   +kpi("summarize","估價工項數","286","項","已核 214 · 待價 72","")
   +kpi("payments","估價總價","4.86","億元","含利潤 12% / 管銷 8%","up")
   +kpi("percent","成本利潤率","18.4","%","高於底線 14%","up")
   +kpi("schedule","估價完成度","74","%","詢價中 26%","")
   +'</div>';
  html+='<div class="grid g23">'
   +'<div class="card pad0"><div class="ctitle" style="padding:16px 16px 0"><h3><span class="material-symbols-outlined">table_view</span>工項單價分析明細</h3><span class="sub">單位：新台幣</span></div>'
     +'<div class="scroll"><table class="tbl"><thead><tr><th>工項碼</th><th>項目名稱</th><th>單位</th><th class="num">數量</th><th class="num">單價</th><th class="num">複價</th><th>核價進度</th><th>狀態</th></tr></thead><tbody>'+rows
     +'<tr style="background:var(--panel2)"><td colspan="5" style="font-weight:700;color:var(--accent2)">工程直接費合計（部分工項）</td><td class="num" style="font-weight:800;color:var(--accent2)">'+nt(total)+'</td><td></td><td></td></tr>'
     +'</tbody></table></div></div>'
   +'<div class="grid" style="grid-template-columns:1fr;gap:14px">'
     +'<div class="card"><div class="ctitle"><h3><span class="material-symbols-outlined">donut_large</span>估價成本結構</h3></div><div class="chart-box" style="height:200px"><canvas id="c0a"></canvas></div>'
        +'<div class="legend"><span><i style="background:#0369a1"></i>材料46%</span><span><i style="background:#38bdf8"></i>人工24%</span><span><i style="background:#22c55e"></i>機具12%</span><span><i style="background:#f59e0b"></i>管銷10%</span><span><i style="background:#a78bfa"></i>利潤8%</span></div></div>'
     +'<div class="card"><div class="ctitle"><h3><span class="material-symbols-outlined">store</span>分包廠商比價</h3></div>'
        +vendor("O大營造","RC 結構包","NT$ 1,138萬","最低","g")
        +vendor("聯合鋼構","鋼筋加工","NT$ 1,266萬","次低","a")
        +vendor("永信水電","機電統包","NT$ 1,306萬","比價中","w")
        +'</div>'
   +'</div></div>';
  return html;
}
function vendor(n,s,p,tg,c){
  return '<div class="rowline"><div class="ic"><span class="material-symbols-outlined">store</span></div><div class="gr"><div class="t">'+n+'</div><div class="d">'+s+'</div></div><div style="text-align:right"><div style="font-weight:700;font-size:12.5px">'+p+'</div><span class="tag '+c+'">'+tg+'</span></div></div>';
}
function draw0(){
  mk(document.getElementById("c0a"),{type:"doughnut",
   data:{labels:["材料","人工","機具","管銷","利潤"],datasets:[{data:[46,24,12,10,8],backgroundColor:["#0369a1","#38bdf8","#22c55e","#f59e0b","#a78bfa"],borderColor:"#0f1e2e",borderWidth:2}]},
   options:{responsive:true,maintainAspectRatio:false,cutout:"62%",plugins:{legend:{display:false}}}});
}

/* ---------- Screen 1 : 專案轉檔 / WBS ---------- */
function screen1(){
  var tasks=[
   {n:"假設工程",s:2,w:10,cls:"done",lab:"100%"},
   {n:"基礎與地下室",s:8,w:22,cls:"done",lab:"100%"},
   {n:"地上層結構",s:26,w:30,cls:"",lab:"68%"},
   {n:"外牆與帷幕",s:44,w:20,cls:"",lab:"32%"},
   {n:"機電管線",s:40,w:34,cls:"late",lab:"落後"},
   {n:"內裝裝修",s:62,w:24,cls:"",lab:"排程中"},
   {n:"景觀與收尾",s:80,w:14,cls:"",lab:"待啟動"}
  ];
  var grows=tasks.map(function(t){
    return '<div class="grow"><div class="gname">'+t.n+'</div><div class="gtrack"><div class="gbar '+t.cls+'" style="left:'+t.s+'%;width:'+t.w+'%">'+t.lab+'</div></div></div>';
  }).join("");

/* ===================== nav / render ===================== */
var SCREENS=[screen0,screen1,screen2,screen3,screen4,screen5];
var container=document.getElementById("view");
function show(i){
  i=Math.max(0,Math.min(SCREENS.length-1,i|0));
  destroyCharts();
  var btns=document.querySelectorAll("#nav button");
  for(var b=0;b<btns.length;b++){ btns[b].classList.toggle("on", (+btns[b].getAttribute("data-i"))===i); }
  container.innerHTML=SCREENS[i]();
  void container.offsetHeight;
  if(i===0){ draw0(); }
  else if(i===2){ draw2(); }
  else if(i===3){ draw3(); }
  else if(i===4){ draw4(); }
  try{window.scrollTo(0,0);}catch(e){}
}
(function(){
  var nav=document.getElementById("nav");
  var h="";
  for(var i=0;i<MOD.length;i++){
    h+='<button data-i="'+i+'"><span class="idx">0'+(i+1)+'</span><span class="material-symbols-outlined">'+MOD[i].icon+'</span><span class="lbl">'+MOD[i].name+'</span></button>';
  }
  nav.innerHTML=h;
  var btns=nav.querySelectorAll("button");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){ show(+this.getAttribute("data-i")); });
  }
})();
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
