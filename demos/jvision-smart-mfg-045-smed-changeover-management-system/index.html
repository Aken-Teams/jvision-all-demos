<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>換線管理系統 SMED Changeover Management</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#fff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000;
  --color-accent:#ea580c;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#1e293b;
  --color-card:#fff;
  --color-card-foreground:#1e293b;
  --color-muted:#e9eff8;
  --color-muted-foreground:#475569;
  --color-border:#cbd5e1;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#1e293b;
  --muted:#475569;
  --line:#cbd5e1;
  --amber:#b45309;
  --red:#dc2626;
  --green:#15803d;
  --grid:#d7e0eb;
  --black:#0f172a;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{
  margin:0;
  background-color:var(--color-background);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--ink);
  font:400 14px/1.5 "Fira Sans",sans-serif;
  overflow-x:hidden
}
button,a,[data-i]{cursor:pointer}
button{font:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:500;
  font-style:normal;
  line-height:1;
  vertical-align:middle
}
.topbar{
  position:sticky;
  top:0;
  z-index:50;
  color:#fff;
  background:var(--black);
  border-bottom:4px solid var(--color-primary)
}
.topbar-inner{
  max-width:1480px;
  min-height:72px;
  margin:auto;
  padding:10px 20px;
  display:flex;
  align-items:center;
  gap:20px
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  width:44px;
  height:44px;
  display:grid;
  place-items:center;
  flex:none;
  color:#fff;
  background:var(--color-primary);
  border:2px solid #fff;
  box-shadow:5px 5px 0 var(--color-accent)
}
.logo .material-symbols-outlined{font-size:27px}
.brand-txt{display:flex;flex-direction:column;min-width:0}
.brand-txt b{
  font-size:16px;
  font-weight:700;
  letter-spacing:.04em;
  white-space:nowrap
}
.brand-txt span{
  color:#cbd5e1;
  font:500 11px/1.4 "Fira Code",monospace;
  letter-spacing:.02em;
  white-space:nowrap
}
.brand-meta{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:8px;
  color:#e2e8f0;
  font:500 11px "Fira Code",monospace
}
.chip{
  padding:6px 9px;
  background:#1e293b;
  border:1px solid #64748b;
  white-space:nowrap
}
.tabwrap{
  position:sticky;
  top:72px;
  z-index:45;
  background:#fff;
  border-bottom:2px solid var(--black)
}
.tabs{
  max-width:1480px;
  margin:auto;
  padding:0 20px;
  display:flex;
  overflow-x:auto;
  scrollbar-width:thin
}
.tabs button{
  min-height:48px;
  padding:8px 15px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  flex:none;
  color:var(--muted);
  background:#fff;
  border:0;
  border-right:1px solid var(--line);
  border-bottom:5px solid transparent;
  font-size:13px;
  font-weight:700
}
.tabs button:first-child{border-left:1px solid var(--line)}
.tabs button:hover{color:var(--black);background:var(--color-muted)}
.tabs button.on{
  color:#fff;
  background:var(--color-primary);
  border-bottom-color:var(--color-accent)
}
.tabs .material-symbols-outlined{font-size:19px}
main{max-width:1480px;margin:auto;padding:26px 20px 72px}
.scr-head{
  min-height:104px;
  margin-bottom:18px;
  padding:18px;
  display:flex;
  align-items:flex-start;
  gap:14px;
  flex-wrap:wrap;
  color:#fff;
  background:var(--black);
  border:2px solid var(--black);
  box-shadow:8px 8px 0 var(--color-primary)
}
.scr-head .ic{
  width:48px;
  height:48px;
  display:grid;
  place-items:center;
  flex:none;
  color:var(--black);
  background:var(--color-accent);
  border:2px solid #fff
}
.scr-head .ic .material-symbols-outlined{font-size:28px}
.scr-head h2{
  margin:0;
  color:#fff;
  font-size:clamp(20px,2.2vw,30px);
  line-height:1.15;
  font-weight:700;
  letter-spacing:-.03em
}
.scr-head p{margin:7px 0 0;color:#cbd5e1;font-size:12px}
.spacer{flex:1}
.btn{
  min-height:42px;
  padding:8px 13px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  color:var(--black);
  background:#fff;
  border:2px solid var(--black);
  border-radius:0;
  box-shadow:4px 4px 0 var(--black);
  font-weight:700;
  transition:background-color .18s,color .18s,transform .18s,box-shadow .18s
}
.scr-head .btn{border-color:#fff;box-shadow:4px 4px 0 var(--color-primary)}
.btn:hover{background:var(--color-muted);transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--black)}
.btn.primary{
  color:#fff;
  background:var(--color-accent);
  border-color:#fff
}
.btn.primary:hover{background:#c2410c}
.btn .material-symbols-outlined{font-size:19px}
.grid{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g-1-2{grid-template-columns:minmax(280px,1fr) minmax(0,2fr)}
.card,.kpi,.imp{
  min-width:0;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:2px solid var(--black);
  border-radius:0;
  box-shadow:5px 5px 0 #94a3b8
}
.card{padding:16px}
.card h3{
  margin:-16px -16px 16px;
  padding:10px 13px;
  display:flex;
  align-items:center;
  gap:8px;
  color:#fff;
  background:var(--black);
  border-bottom:2px solid var(--black);
  font-size:14px;
  font-weight:700;
  letter-spacing:.02em
}
.card h3 .material-symbols-outlined{color:#93c5fd;font-size:20px}
.kpi{
  min-height:132px;
  padding:14px;
  position:relative;
  overflow:hidden;
  border-top:7px solid var(--color-primary)
}
.kpi:nth-child(even){border-top-color:var(--color-accent)}
.kpi:after{
  content:"";
  width:36px;
  height:36px;
  position:absolute;
  right:0;
  bottom:0;
  background:
    linear-gradient(135deg,transparent 50%,var(--color-muted) 50%)
}
.kpi .lab{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:12px;
  font-weight:600
}
.kpi .lab .material-symbols-outlined{color:var(--color-primary);font-size:18px}
.kpi .val{
  margin-top:7px;
  color:var(--black);
  font:700 29px/1.1 "Fira Code",monospace;
  letter-spacing:-.05em
}
.kpi .val small{color:var(--muted);font:600 12px "Fira Sans",sans-serif}
.kpi .delta{margin-top:7px;font:700 11px "Fira Code",monospace}
.delta.up:before{content:"✓ "}
.delta.down:before{content:"! "}
.delta.up{color:#166534}
.delta.down{color:#b91c1c}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{
  width:100%;
  min-width:620px;
  border-collapse:collapse;
  font-size:12px
}
th,td{
  padding:10px 11px;
  text-align:left;
  white-space:nowrap;
  border:1px solid var(--line)
}
th{
  color:#fff;
  background:var(--black);
  font-size:11px;
  font-weight:700;
  letter-spacing:.04em
}
tbody tr:nth-child(even){background:#f1f5f9}
tbody tr:hover{background:#dbeafe}
td:first-child,td:nth-child(4),td:nth-child(5),td:nth-child(6),td:last-child{
  font-family:"Fira Code",monospace
}
td:nth-child(4),td:nth-child(5),td:nth-child(6){text-align:right;font-variant-numeric:tabular-nums}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:24px;
  padding:3px 8px;
  color:var(--black);
  background:#e2e8f0;
  border:1px solid currentColor;
  border-radius:0;
  font-size:11px;
  font-weight:700;
  white-space:nowrap
}
.tag:before{content:"■";font-size:7px}
.t-green{color:#14532d;background:#dcfce7}
.t-amber{color:#78350f;background:#fef3c7}
.t-red{color:#7f1d1d;background:#fee2e2}
.t-blue{color:#1e3a8a;background:#dbeafe}
.t-gray{color:#334155;background:#e2e8f0}
.dot{width:9px;height:9px;display:inline-block;border:1px solid var(--black)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.col{
  min-width:0;
  padding:10px;
  background:#e9eff8;
  border:2px solid var(--black)
}
.col:nth-child(2){transform:translateY(10px)}
.col:nth-child(3){transform:translateY(-4px)}
.col-h{
  margin:-10px -10px 10px;
  padding:9px 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:#fff;
  background:var(--black);
  font-weight:700
}
.cnt{
  min-width:25px;
  padding:1px 6px;
  color:var(--black);
  background:#fff;
  border:1px solid #fff;
  text-align:center;
  font-family:"Fira Code",monospace
}
.tk{
  margin-bottom:9px;
  padding:10px;
  background:#fff;
  border:2px solid var(--black);
  border-left:7px solid var(--color-primary);
  box-shadow:3px 3px 0 #94a3b8
}
.tk.warn{border-left-color:var(--amber)}
.tk.hot{border-left-color:var(--red)}
.tk-top,.tk-meta{
  display:flex;
  align-items:center;
  gap:7px 11px;
  color:var(--muted);
  font-size:11px
}
.tk-top{justify-content:space-between;font-family:"Fira Code",monospace}
.tk-title{margin:7px 0;font-weight:700;font-size:13px}
.tk-meta{flex-wrap:wrap}
.tk-meta b{color:var(--ink)}
.bar,.progress{
  height:8px;
  overflow:hidden;
  background:#d8e0eb;
  border:1px solid #64748b
}
.tk .bar{margin-top:9px}
.bar i,.progress i{height:100%;display:block;background:var(--color-primary)}
.step{
  padding:13px 0;
  display:flex;
  gap:12px;
  border-bottom:2px dashed var(--line)
}
.step:last-child{border-bottom:0}
.step .no{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  flex:none;
  color:#fff;
  background:var(--red);
  border:2px solid var(--black);
  font:700 14px "Fira Code",monospace
}
.step .no.ext{background:var(--blue)}
.step .body{min-width:0;flex:1}
.step .body .t{font-weight:700}
.step .body .d{margin-top:3px;color:var(--muted);font-size:12px}
.step .rt{min-width:66px;text-align:right;font-family:"Fira Code",monospace}
.mini{color:var(--muted);font-size:11px}
.stat-line{
  padding:9px 0;
  display:flex;
  justify-content:space-between;
  gap:15px;
  border-bottom:1px solid var(--line)
}
.stat-line:last-child{border-bottom:0}
.stat-line b{font-family:"Fira Code",monospace;text-align:right}
.splitbar{
  min-height:36px;
  display:flex;
  overflow:hidden;
  border:2px solid var(--black)
}
.splitbar>div{
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font:700 11px "Fira Code",monospace
}
.si{background:var(--red)}
.se{background:var(--blue)}
.legend{
  margin-top:11px;
  display:flex;
  flex-wrap:wrap;
  gap:9px 16px;
  color:var(--muted);
  font-size:11px
}
.legend span{display:flex;align-items:center;gap:6px}
.gantt-row{padding:7px 0;display:flex;align-items:center;gap:10px}
.gantt-row .lab{width:112px;flex:none;font-size:12px;font-weight:700}
.gantt-track{
  height:24px;
  min-width:0;
  flex:1;
  position:relative;
  overflow:hidden;
  background:#d8e0eb;
  border:1px solid #64748b
}
.gantt-seg{
  height:100%;
  position:absolute;
  top:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  border-right:2px solid var(--black);
  font:700 10px "Fira Code",monospace
}
.chartbox{height:270px;position:relative}
.chartbox.sm{height:220px}
.imp{padding:13px}
.imp .h,.imp .foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.imp .id{color:var(--muted);font:700 11px "Fira Code",monospace}
.imp .ttl{margin-top:9px;font-weight:700;font-size:14px}
.imp .desc{min-height:38px;margin:6px 0 11px;color:var(--muted);font-size:12px}
.imp .foot{margin-top:9px;color:var(--muted);font-size:11px}
.avatar{
  width:25px;
  height:25px;
  display:inline-grid;
  place-items:center;
  color:#fff;
  background:var(--color-primary);
  border:1px solid var(--black);
  font-weight:700
}
.progress{margin-top:8px}
.grid-item{animation:grid-in .4s cubic-bezier(.2,.85,.35,1.25) both}
.grid-item:nth-child(2){animation-delay:.06s}
.grid-item:nth-child(3){animation-delay:.12s}
.grid-item:nth-child(4){animation-delay:.18s}
@keyframes grid-in{
  from{opacity:0;transform:translateY(16px) scale(.92)}
  to{opacity:1;transform:none}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    animation-delay:0s!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important
  }
}
@media(max-width:1024px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand-meta .chip:first-child{display:none}
}
@media(max-width:768px){
  .topbar-inner{min-height:64px;padding:9px 14px}
  .tabwrap{top:64px}
  .tabs{padding:0 14px}
  main{padding:20px 14px 56px}
  .g2,.g3,.g-2-1,.g-1-2{grid-template-columns:1fr}
  .scr-head{box-shadow:5px 5px 0 var(--color-primary)}
  .brand-meta{display:none}
}
@media(max-width:520px){
  body{background-size:24px 24px}
  .brand-txt span{display:none}
  .tabs button{min-width:48px;padding:9px 13px}
  .tabs .lbl{display:none}
  .g4{grid-template-columns:1fr}
  .scr-head{padding:14px}
  .scr-head .btn{width:100%;margin-top:3px}
  .kpi{min-height:112px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined" aria-hidden="true">swap_horiz</span></div>
      <div class="brand-txt">
        <b>SMED 換線管理系統</b>
        <span>Changeover Management · MES 製造執行</span>
      </div>
    </div>
    <div class="brand-meta">
      <span class="chip">廠區：桃園二廠</span>
      <span class="chip">班別：早班 A</span>
      <span class="chip">2026-08-14</span>
    </div>
  </div>
</header>
<div class="tabwrap"><nav class="tabs" id="nav" aria-label="系統功能"></nav></div>
<main><div id="app"></div></main>
<script>
"use strict";
var charts=[];
function destroyCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy()}catch(e){}}charts=[]}
function el(id){return document.getElementById(id)}
function mk(cid,cfg){var c=el(cid);if(!c)return;var ch=new Chart(c.getContext("2d"),cfg);charts.push(ch)}
var MODULES=[
  {icon:"dashboard",short:"任務看板",name:"換線任務看板"},
  {icon:"list_alt",short:"標準程序",name:"換線標準程序"},
  {icon:"call_split",short:"內外拆分",name:"內外作業拆分"},
  {icon:"timer",short:"計時量測",name:"換線計時量測"},
  {icon:"monitoring",short:"績效分析",name:"換線績效分析"},
  {icon:"lightbulb",short:"改善追蹤",name:"改善追蹤"}
];
var GREEN="#15803d",GREEN2="#22c55e",AMBER="#b45309",RED="#dc2626",BLUE="#2563eb",GRID="#d7e0eb";
function head(i,sub,btns){
  var m=MODULES[i];
  return '<div class="scr-head grid-item"><div class="ic"><span class="material-symbols-outlined" aria-hidden="true">'+m.icon+'</span></div>'+
  '<div><h2>'+m.name+'</h2><p>'+sub+'</p></div><div class="spacer"></div>'+(btns||"")+'</div>'
}
function kpi(lab,ic,val,unit,delta,dir){
  return '<div class="kpi grid-item"><div class="lab"><span class="material-symbols-outlined" aria-hidden="true">'+ic+'</span>'+lab+'</div>'+
  '<div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div>'+
  (delta?'<div class="delta '+dir+'">'+delta+'</div>':'')+'</div>'
}
function s0(){
  var cols=[
    {name:"待換線",cnt:3,tks:[
      {t:"CNC-07 沖壓模具切換 A→B",line:"沖壓一線",info:"目標 <b>18</b> 分",own:"林建志",due:"09:30",p:"warn",prog:0,pr:"高"},
      {t:"射出機 IJ-12 換色料 白→藍",line:"射出二線",info:"目標 <b>12</b> 分",own:"陳彥廷",due:"10:15",p:"",prog:0,pr:"中"},
      {t:"貼標機 L3 規格換版",line:"包裝線",info:"目標 <b>8</b> 分",own:"王思穎",due:"11:00",p:"",prog:0,pr:"中"}
    ]},
    {name:"換線中",cnt:2,tks:[
      {t:"CNC-03 治具更換 C 型",line:"CNC 三線",info:"目標 <b>22</b> 分",own:"張家豪",due:"進行中",p:"hot",prog:64,pr:"高"},
      {t:"組裝線 A 產品切換 M2→M3",line:"組裝一線",info:"目標 <b>15</b> 分",own:"李宗翰",due:"進行中",p:"warn",prog:38,pr:"中"}
    ]},
    {name:"待驗證",cnt:2,tks:[
      {t:"焊接站 W-05 夾具切換",line:"焊接線",info:"目標 <b>10</b> 分",own:"周孟儒",due:"待首件確認",p:"",prog:92,pr:"中"},
      {t:"塗裝線 換噴嘴組",line:"塗裝線",info:"目標 <b>14</b> 分",own:"吳柏廷",due:"待首件確認",p:"",prog:88,pr:"低"}
    ]},
    {name:"已完成",cnt:3,tks:[
      {t:"沖壓二線 模具 D→E",line:"沖壓二線",info:"實際 <b>17</b> 分",own:"林建志",due:"達標",p:"",prog:100,pr:"—"},
      {t:"射出一線 換模 K1",line:"射出一線",info:"實際 <b>19</b> 分",own:"陳彥廷",due:"逾時",p:"warn",prog:100,pr:"—"},
      {t:"包裝線 換版 V9",line:"包裝線",info:"實際 <b>7</b> 分",own:"王思穎",due:"達標",p:"",prog:100,pr:"—"}
    ]}
  ],board="";
  for(var c=0;c<cols.length;c++){
    var o=cols[c],cards="";
    for(var k=0;k<o.tks.length;k++){
      var t=o.tks[k];

}
function d5(){
  mk("c5a",{type:"line",data:{labels:["3月","4月","5月","6月","7月","8月"],datasets:[
    {label:"累計縮短(分)",data:[1.1,2.6,3.9,5,6.1,6.8],borderColor:BLUE,backgroundColor:"rgba(37,99,235,.14)",fill:true,tension:0,pointRadius:4}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}},
    scales:{y:{grid:{color:GRID},beginAtZero:true,title:{display:true,text:"分"}},x:{grid:{display:false}}}}});
  mk("c5b",{type:"polarArea",data:{labels:["已完成","執行中","評估中","待啟動"],datasets:[
    {data:[14,3,1,1],backgroundColor:[GREEN,AMBER,BLUE,"#64748b"],borderWidth:2,borderColor:"#fff"}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}},scales:{r:{grid:{color:GRID}}}}})
}
var RENDER=[s0,s1,s2,s3,s4,s5],DRAW=[null,d1,d2,d3,d4,d5],cur=-1;
function show(i){
  i=Math.max(0,Math.min(i,RENDER.length-1));
  cur=i;destroyCharts();
  var container=el("app");
  container.innerHTML=RENDER[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    var active=+btns[b].getAttribute("data-i")===i;
    btns[b].classList.toggle("on",active);
    btns[b].setAttribute("aria-selected",active?"true":"false")
  }
  void container.offsetHeight;
  if(DRAW[i])DRAW[i]()
}
(function(){
  var nav=el("nav"),h="";
  for(var i=0;i<MODULES.length;i++){
    h+='<button type="button" role="tab" data-i="'+i+'" aria-label="'+MODULES[i].name+'"><span class="material-symbols-outlined" aria-hidden="true">'+
    MODULES[i].icon+'</span><span class="lbl">'+MODULES[i].short+"</span></button>"
  }
  nav.innerHTML=h;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){
      var i=+this.getAttribute("data-i");
      if(location.hash!=="#v"+i)location.hash="v"+i;else show(i);
      try{window.scrollTo(0,0)}catch(e){}
    })
  }
})();
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return}
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
