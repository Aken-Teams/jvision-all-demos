<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>換線管理系統 SMED Changeover Management</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#15803d; --accent2:#4ade80; --accent-d:#166534;
  --bg:#f1f5f3; --card:#ffffff; --ink:#0f2419; --muted:#5b6b62;
  --line:#e2e8e4; --soft:#ecfdf3; --amber:#d97706; --red:#dc2626; --blue:#2563eb;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.55;
  overflow-x:hidden;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.topbar{
  position:sticky; top:0; z-index:50;
  background:linear-gradient(100deg,var(--accent-d),var(--accent));
  color:#fff; box-shadow:0 2px 14px rgba(21,128,61,.25);
}
.topbar-inner{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand .logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;}
.brand .logo .material-symbols-outlined{font-size:24px;color:#fff;}
.brand-txt{display:flex;flex-direction:column;min-width:0;}
.brand-txt b{font-size:15px;font-weight:800;letter-spacing:.3px;white-space:nowrap;}
.brand-txt span{font-size:11px;opacity:.82;white-space:nowrap;}
.brand-meta{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:12px;opacity:.9;}
.brand-meta .chip{background:rgba(255,255,255,.15);padding:4px 10px;border-radius:999px;white-space:nowrap;}
.tabwrap{background:linear-gradient(180deg,var(--accent),rgba(21,101,52,.96));}
nav.tabs{max-width:1360px;margin:0 auto;padding:0 12px;display:flex;gap:6px;flex-wrap:wrap;}
nav.tabs button{
  flex:none;white-space:nowrap;cursor:pointer;border:none;background:transparent;
  color:rgba(255,255,255,.75);font-family:inherit;font-size:13px;font-weight:600;
  padding:11px 14px;border-bottom:3px solid transparent;display:flex;align-items:center;gap:6px;min-width:0;
}
nav.tabs button .material-symbols-outlined{font-size:19px;}
nav.tabs button:hover{color:#fff;}
nav.tabs button.on{color:#fff;border-bottom-color:var(--accent2);}
main{max-width:1360px;margin:0 auto;padding:20px 18px 60px;}
.scr-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.scr-head .ic{width:44px;height:44px;border-radius:12px;background:var(--soft);color:var(--accent-d);display:flex;align-items:center;justify-content:center;flex:none;}
.scr-head .ic .material-symbols-outlined{font-size:26px;}
.scr-head h2{margin:0;font-size:20px;font-weight:800;}
.scr-head p{margin:2px 0 0;color:var(--muted);font-size:13px;}
.scr-head .spacer{flex:1;min-width:0;}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:8px 13px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn .material-symbols-outlined{font-size:18px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;}
.card h3{margin:0 0 12px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:20px;color:var(--accent);}
.grid{display:grid;gap:14px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g-2-1{grid-template-columns:2fr 1fr;}
.g-1-2{grid-template-columns:1fr 2fr;}
@media(max-width:820px){.g4,.g3,.g2,.g-2-1,.g-1-2{grid-template-columns:1fr;}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;position:relative;overflow:hidden;min-width:0;}
.kpi .lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;position:relative;z-index:1;}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--accent);}
.kpi .val{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.5px;position:relative;z-index:1;}
.kpi .val small{font-size:13px;font-weight:600;color:var(--muted);}
.kpi .delta{font-size:12px;font-weight:700;margin-top:3px;position:relative;z-index:1;}
.kpi .delta.up{color:var(--accent-d);}
.kpi .delta.down{color:var(--red);}
.kpi::after{content:"";position:absolute;right:-14px;top:-14px;width:60px;height:60px;border-radius:50%;background:var(--soft);}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px;}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
th{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.4px;background:#f7faf8;}
tbody tr:hover{background:#fbfdfc;}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;}
.t-green{background:#dcfce7;color:#166534;}
.t-amber{background:#fef3c7;color:#92400e;}
.t-red{background:#fee2e2;color:#991b1b;}
.t-blue{background:#dbeafe;color:#1e40af;}
.t-gray{background:#eef2ef;color:#475569;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;min-width:0;}
.col{background:#eef4f0;border:1px solid var(--line);border-radius:14px;padding:11px;min-width:0;}
.col-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:700;font-size:13px;}
.col-h .cnt{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--muted);}
.tk{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
.tk.warn{border-left-color:var(--amber);}
.tk.hot{border-left-color:var(--red);}
.tk .tk-top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px;color:var(--muted);}
.tk .tk-title{font-weight:700;font-size:13.5px;margin:5px 0 6px;}
.tk .tk-meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--muted);}
.tk .tk-meta b{color:var(--ink);}
.tk .bar{height:5px;border-radius:3px;background:#eef2ef;margin-top:9px;overflow:hidden;}
.tk .bar>i{display:block;height:100%;background:var(--accent);}
.step{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line);}
.step:last-child{border-bottom:none;}
.step .no{width:30px;height:30px;flex:none;border-radius:9px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;}
.step .no.ext{background:var(--blue);}
.step .body{min-width:0;flex:1;}
.step .body .t{font-weight:700;font-size:13.5px;}
.step .body .d{color:var(--muted);font-size:12px;margin-top:2px;}
.step .rt{text-align:right;min-width:0;}
.splitbar{display:flex;height:34px;border-radius:9px;overflow:hidden;border:1px solid var(--line);}
.splitbar>div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;min-width:0;}
.si{background:var(--red);} .se{background:var(--blue);}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px;}
.legend span{display:flex;align-items:center;gap:6px;}
.gantt-row{display:flex;align-items:center;gap:10px;padding:7px 0;min-width:0;}
.gantt-row .lab{width:120px;flex:none;font-size:12.5px;font-weight:600;}
.gantt-track{flex:1;min-width:0;background:#eef2ef;border-radius:6px;height:22px;position:relative;overflow:hidden;}
.gantt-seg{position:absolute;top:0;height:100%;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10.5px;color:#fff;font-weight:700;}
.chartbox{position:relative;height:260px;min-width:0;}
.chartbox.sm{height:210px;}
.mini{font-size:12px;color:var(--muted);}
.stat-line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
.stat-line:last-child{border-bottom:none;}
.imp{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;}
.imp .h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
.imp .h .id{font-size:11px;color:var(--muted);font-weight:700;}
.imp .ttl{font-weight:700;font-size:14px;}
.imp .desc{font-size:12.5px;color:var(--muted);margin:6px 0 10px;}
.imp .foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);}
.avatar{width:24px;height:24px;border-radius:50%;background:var(--accent2);color:var(--accent-d);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;}
.progress{height:6px;background:#eef2ef;border-radius:4px;overflow:hidden;margin-top:8px;}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));}
@media(max-width:820px){.board{grid-template-columns:1fr;}}
@media(max-width:560px){
  .brand-txt span{display:none;}
  nav.tabs button .lbl{display:none;}
  nav.tabs button{padding:11px 12px;}
  .brand-meta{display:none;}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">swap_horiz</span></div>
      <div class="brand-txt">
        <b>SMED 換線管理系統</b>
        <span>Changeover Management · MES 製造執行</span>
      </div>
    </div>
    <div class="brand-meta">
      <span class="chip">廠區：桃園二廠</span>
      <span class="chip">班別：早班 A</span>
      <span class="chip">2026-08-14</span>
    </div>
  </div>
</header>
<div class="tabwrap"><nav class="tabs" id="nav"></nav></div>
<main><div id="app"></div></main>

<script>
"use strict";
var charts=[];
function destroyCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function el(id){return document.getElementById(id);}
function mk(cid,cfg){var c=el(cid);if(!c)return;var ch=new Chart(c.getContext("2d"),cfg);charts.push(ch);}

var MODULES=[
  {icon:"dashboard",short:"任務看板",name:"換線任務看板"},
  {icon:"list_alt",short:"標準程序",name:"換線標準程序"},
  {icon:"call_split",short:"內外拆分",name:"內外作業拆分"},
  {icon:"timer",short:"計時量測",name:"換線計時量測"},
  {icon:"monitoring",short:"績效分析",name:"換線績效分析"},
  {icon:"lightbulb",short:"改善追蹤",name:"改善追蹤"}
];

var GREEN="#15803d",GREEN2="#4ade80",AMBER="#d97706",RED="#dc2626",BLUE="#2563eb",GRID="#e6ede9";

function head(i,sub,btns){
  var m=MODULES[i];
  return '<div class="scr-head"><div class="ic"><span class="material-symbols-outlined">'+m.icon+'</span></div>'+
    '<div><h2>'+m.name+'</h2><p>'+sub+'</p></div><div class="spacer"></div>'+(btns||'')+'</div>';
}
function kpi(lab,ic,val,unit,delta,dir){
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+ic+'</span>'+lab+'</div>'+
    '<div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div>'+
    (delta?'<div class="delta '+dir+'">'+delta+'</div>':'')+'</div>';
}

/* ===== SCREEN 0 : KANBAN BOARD ===== */
function s0(){
  var cols=[
    {name:"待換線",cnt:3,tks:[
      {t:"CNC-07 沖壓模具切換 A→B",line:"沖壓一線",info:"目標 <b>18</b> 分",own:"林建志",due:"09:30",p:"warn",prog:0,pr:"高"},
      {t:"射出機 IJ-12 換色料 白→藍",line:"射出二線",info:"目標 <b>12</b> 分",own:"陳彥廷",due:"10:15",p:"",prog:0,pr:"中"},
      {t:"貼標機 L3 規格換版",line:"包裝線",info:"目標 <b>8</b> 分",own:"王思穎",due:"11:00",p:"",prog:0,pr:"中"}
    ]},
    {name:"換線中",cnt:2,tks:[
      {t:"CNC-03 治具更換 C 型",line:"CNC 三線",info:"目標 <b>22</b> 分",own:"張家豪",due:"進行中",p:"hot",prog:64,pr:"高"},
      {t:"組裝線 A 產品切換 M2→M3",line:"組裝一線",info:"目標 <b>15</b> 分",own:"李宗翰",due:"進行中",p:"warn",prog:38,pr:"中"}
    ]},
    {name:"待驗證",cnt:2,tks:[
      {t:"焊接站 W-05 夾具切換",line:"焊接線",info:"目標 <b>10</b> 分",own:"周孟儒",due:"待首件確認",p:"",prog:92,pr:"中"},
      {t:"塗裝線 換噴嘴組",line:"塗裝線",info:"目標 <b>14</b> 分",own:"吳柏廷",due:"待首件確認",p:"",prog:88,pr:"低"}
    ]},
    {name:"已完成",cnt:3,tks:[
      {t:"沖壓二線 模具 D→E",line:"沖壓二線",info:"實際 <b>17</b> 分",own:"林建志",due:"達標",p:"",prog:100,pr:"—"},
      {t:"射出一線 換模 K1",line:"射出一線",info:"實際 <b>19</b> 分",own:"陳彥廷",due:"逾時",p:"warn",prog:100,pr:"—"},
      {t:"包裝線 換版 V9",line:"包裝線",info:"實際 <b>7</b> 分",own:"王思穎",due:"達標",p:"",prog:100,pr:"—"}
    ]}
  ];
  var board='';
  for(var c=0;c<cols.length;c++){
    var o=cols[c],cards='';
    for(var k=0;k<o.tks.length;k++){
      var t=o.tks[k];
      var prtag=t.pr==="高"?'<span class="tag t-red">高</span>':t.pr==="中"?'<span class="tag t-amber">中</span>':t.pr==="低"?'<span class="tag t-blue">低</span>':'<span class="tag t-gray">—</span>';
      cards+='<div class="tk '+t.p+'"><div class="tk-top"><span>'+t.line+'</span>'+prtag+'</div>'+
        '<div class="tk-title">'+t.t+'</div>'+
        '<div class="tk-meta"><span>'+t.info+'</span><span>負責 <b>'+t.own+'</b></span><span>'+t.due+'</span></div>'+
        '<div class="bar"><i style="width:'+t.prog+'%"></i></div></div>';
    }
    board+='<div class="col"><div class="col-h"><span>'+o.name+'</span><span class="cnt">'+o.cnt+'</span></div>'+cards+'</div>';
  }
  return head(0,'各產線待換線任務即時看板 · 依優先度與截止時間排序',
      '<button class="btn primary"><span class="material-symbols-outlined">add</span>新增換線任務</button>')+
    '<div class="grid g4" style="margin-bottom:16px">'+
      kpi("進行中換線","autorenew","2","站",'即時',"up")+
      kpi("今日排定","event","10","場",'+3 vs 昨日',"up")+
      kpi("平均達標率","verified","86","%",'目標 90%',"down")+
      kpi("逾時風險","warning","1","場",'需關注',"down")+
    '</div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">view_kanban</span>換線任務看板</h3>'+
    '<div class="scroll"><div class="board" style="min-width:820px">'+board+'</div></div></div>';
}

/* ===== SCREEN 1 : SOP / STANDARD PROCEDURE ===== */
function s1(){
  var steps=[
    {no:1,ext:false,t:"停機並清空前一批殘料",d:"確認機台完全停止、清除模穴內殘料與廢邊",std:"3.0",act:"3.4"},
    {no:2,ext:true,t:"預備新治具與工具（外部）",d:"換線前於機外備妥新模具、對位塊與扳手組",std:"0.0",act:"0.0"},
    {no:3,ext:false,t:"拆卸舊模具與夾具",d:"鬆開固定螺栓、吊離舊模至暫存架",std:"4.5",act:"5.1"},
    {no:4,ext:false,t:"安裝新模具並對位",d:"吊入新模、以定位銷校正並鎖固扭力至規範",std:"5.0",act:"4.8"},
    {no:5,ext:true,t:"參數表調閱與載入（外部）",d:"換線前預先於 MES 準備成型參數配方",std:"0.0",act:"0.5"},
    {no:6,ext:false,t:"參數設定與試模",d:"載入配方、調整溫度壓力並試打三模",std:"3.0",act:"3.2"},
    {no:7,ext:false,t:"首件檢驗與確認",d:"量測首件關鍵尺寸、經品保簽核放行",std:"2.5",act:"2.8"}
  ];
  var rows='',stdSum=0,actSum=0;
  for(var i=0;i<steps.length;i++){
    var s=steps[i];stdSum+=parseFloat(s.std);actSum+=parseFloat(s.act);
    var typ=s.ext?'<span class="tag t-blue">外部作業</span>':'<span class="tag t-red">內部作業</span>';
    rows+='<div class="step"><div class="no '+(s.ext?'ext':'')+'">'+s.no+'</div>'+
      '<div class="body"><div class="t">'+s.t+'</div><div class="d">'+s.d+'</div><div style="margin-top:6px">'+typ+'</div></div>'+
      '<div class="rt"><div class="mini">標準</div><div style="font-weight:800">'+s.std+' 分</div>'+
      '<div class="mini" style="margin-top:4px">實際</div><div style="font-weight:700;color:'+(parseFloat(s.act)>parseFloat(s.std)?RED:GREEN)+'">'+s.act+' 分</div></div></div>';
  }
  return head(1,'CNC-07 沖壓模具切換 A→B · 標準作業程序（SOP-SMED-0271）',
      '<button class="btn"><span class="material-symbols-outlined">edit</span>編輯程序</button>')+
    '<div class="grid g-2-1">'+
      '<div class="card"><h3><span class="material-symbols-outlined">checklist</span>換線標準步驟卡</h3>'+rows+'</div>'+
      '<div class="grid" style="align-content:start">'+
        '<div class="card"><h3><span class="material-symbols-outlined">summarize</span>程序摘要</h3>'+
          '<div class="stat-line"><span>總步驟數</span><b>'+steps.length+' 步</b></div>'+
          '<div class="stat-line"><span>標準總工時</span><b>'+stdSum.toFixed(1)+' 分</b></div>'+
          '<div class="stat-line"><span>實際總工時</span><b style="color:'+RED+'">'+actSum.toFixed(1)+' 分</b></div>'+
          '<div class="stat-line"><span>目標換線時間</span><b>18.0 分</b></div>'+
          '<div class="stat-line"><span>版本 / 更新</span><b>v3 · 08-02</b></div>'+
        '</div>'+
        '<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>內外作業佔比</h3><div class="chartbox sm"><canvas id="c1a"></canvas></div></div>'+
      '</div>'+
    '</div>';
}
function d1(){
  mk("c1a",{type:"doughnut",data:{labels:["內部作業","外部作業"],datasets:[{data:[17.3,0.5],backgroundColor:[RED,BLUE],borderWidth:2,borderColor:"#fff"}]},
    options:{cutout:"62%",plugins:{legend:{position:"bottom"}},responsive:true,maintainAspectRatio:false}});
}

/* ===== SCREEN 2 : INTERNAL/EXTERNAL SPLIT ===== */
function s2(){
  var items=[

var RENDER=[s0,s1,s2,s3,s4,s5];
var DRAW=[null,d1,d2,d3,d4,d5];
var cur=-1;
function show(i){
  i=Math.max(0,Math.min(i,RENDER.length-1));
  cur=i;
  destroyCharts();
  var container=el("app");
  container.innerHTML=RENDER[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  void container.offsetHeight;
  if(DRAW[i])DRAW[i]();
}
(function(){
  var nav=el("nav"),h="";
  for(var i=0;i<MODULES.length;i++){
    h+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+MODULES[i].icon+'</span><span class="lbl">'+MODULES[i].short+'</span></button>';
  }
  nav.innerHTML=h;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){show(+this.getAttribute("data-i"));try{window.scrollTo(0,0);}catch(e){}});
  }
})();
if(cur===-1)show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
