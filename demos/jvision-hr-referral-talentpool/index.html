<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>內部推薦與人才庫管理 · HRIS 人力資源系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --accent:#0D9488;
  --accent2:#2DD4BF;
  --accent-soft:#CCFBF1;
  --accent-soft2:#99F6E4;
  --bg:#F0FDFA;
  --panel:#FFFFFF;
  --th:#CCFBF1;
  --hov:#ECFDF5;
  --track:#CDE7E5;
  --sidebar:#042F2E;
  --sidebar2:#134E4A;
  --side-edge:#2DD4BF;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#0369A1;
  --r:0px;
  --glow:rgba(13,148,136,.22);
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  background:
    linear-gradient(rgba(13,148,136,.065) 1px,transparent 1px),
    linear-gradient(90deg,rgba(13,148,136,.065) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--color-foreground);
  font-family:"Crimson Pro","Noto Serif TC",Georgia,serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
h1,h2,h3,h4,.brand-txt b,.nav button,.kpi .val,.stat .val,.tile .tv{
  margin:0;
  font-family:"Cormorant Garamond","Noto Serif TC",Georgia,serif;
  font-weight:700;
}
b,strong{font-weight:700}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
button,[data-i]{cursor:pointer}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
  box-shadow:0 0 0 2px #fff;
}
::selection{background:var(--color-secondary);color:#042F2E}

.app{display:flex;flex-direction:column;min-height:100vh}
.sidebar{
  width:100%;
  min-width:0;
  min-height:72px;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:30;
  display:flex;
  align-items:stretch;
  gap:24px;
  color:#F0FDFA;
  background:var(--sidebar);
  border:0;
  border-bottom:4px solid var(--color-secondary);
}
.brand{
  min-width:234px;
  padding:10px 20px 10px 0;
  display:flex;
  align-items:center;
  gap:12px;
  border-right:1px solid rgba(94,234,212,.6);
}
.brand-logo{
  width:46px;
  height:46px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#042F2E;
  background:var(--color-secondary);
  border:2px solid #F0FDFA;
  border-radius:0;
  box-shadow:5px 5px 0 var(--color-accent);
}
.brand-logo .material-symbols-outlined{font-size:25px}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-size:19px;line-height:1.05;letter-spacing:.02em}
.brand-txt span{
  display:block;
  margin-top:4px;
  color:#99F6E4;
  font-family:"Cinzel",serif;
  font-size:8px;
  letter-spacing:.12em;
  white-space:nowrap;
}
.nav{
  min-width:0;
  margin:0;
  display:flex;
  flex:1;
  align-items:stretch;
  gap:0;
  overflow-x:auto;
  scrollbar-width:thin;
  scrollbar-color:var(--color-secondary) var(--sidebar);
}
.nav button{
  position:relative;
  min-width:142px;
  padding:10px 16px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  color:#CCFBF1;
  background:transparent;
  border:0;
  border-left:1px solid rgba(94,234,212,.28);
  border-radius:0;
  font-size:15px;
  font-weight:700;
  text-align:left;
  white-space:nowrap;
  transition:background-color .18s ease,color .18s ease,box-shadow .18s ease;
}
.nav button:last-child{border-right:1px solid rgba(94,234,212,.28)}
.nav button:hover{color:#042F2E;background:var(--color-secondary)}
.nav button.on{
  color:#000;
  background:var(--color-accent);
  box-shadow:inset 0 -7px 0 #FDE68A;
}
.nav button.on::before{display:none}
.nav button .material-symbols-outlined{font-size:21px;flex:none}
.nav .idx{
  margin-left:auto;
  color:inherit;
  font-family:"Cinzel",serif;
  font-size:9px;
  font-weight:600;
  opacity:.75;
}
.side-foot{display:none}
.main{width:100%;max-width:1600px;margin:0 auto;padding:30px 34px 64px}
.topbar{
  position:relative;
  margin-bottom:22px;
  padding:0 0 20px 18px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:18px;
  flex-wrap:wrap;
  border-bottom:4px solid var(--ink);
}
.topbar::before{
  content:"";
  position:absolute;
  left:0;
  top:2px;
  bottom:20px;
  width:7px;
  background:var(--color-accent);
}
.topbar h1{
  display:flex;
  align-items:center;
  gap:10px;
  color:#042F2E;
  font-size:32px;
  line-height:1;
  letter-spacing:-.02em;
}
.topbar h1 .material-symbols-outlined{color:var(--color-primary);font-size:30px}
.topbar .sub{margin-top:7px;color:var(--muted);font-size:14px;font-weight:600}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{
  min-height:38px;
  padding:7px 11px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:#334155;
  background:#fff;
  border:2px solid var(--ink);
  border-radius:0;
  font-size:12px;
  font-weight:700;
  box-shadow:3px 3px 0 var(--color-border);
}
.chip .dot{
  width:9px;
  height:9px;
  background:var(--ok);
  border:2px solid #052E16;
  border-radius:50%;
  box-shadow:none;
  animation:pulse 2s steps(2,end) infinite;
}
.avatar{
  width:40px;
  height:40px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#000;
  background:var(--color-accent);
  border:2px solid var(--ink);
  border-radius:0;
  font-weight:800;
  box-shadow:3px 3px 0 var(--ink);
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.42}}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{
  min-width:0;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:2px solid var(--ink);
  border-radius:0;
  box-shadow:6px 6px 0 var(--color-border);
}
.card,.sec{padding:19px}
.sec{margin-bottom:16px}
.card:nth-child(even),.kpi:nth-child(even),.tile:nth-child(even){box-shadow:6px 6px 0 var(--color-secondary)}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{
  min-height:34px;
  margin-bottom:14px;
  padding-bottom:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  border-bottom:2px solid var(--line);
}
.card.pad0>.card-h{margin-bottom:0!important;padding:17px 17px 13px!important;background:#F8FFFE}
.card-h h3,.sec>h3{
  display:flex;
  align-items:center;
  gap:8px;
  color:#042F2E;
  font-size:19px;
  line-height:1.1;
}
.card-h h3 .material-symbols-outlined,.sec>h3 .material-symbols-outlined{color:var(--color-primary);font-size:21px}
.card-h .hint{
  max-width:100%;
  color:#334155;
  font-size:12px;
  font-weight:700;
  text-align:right;
}
.sec>h3{margin-bottom:13px}
.sec>p{margin:0 0 13px;color:var(--muted);font-size:14px;line-height:1.7}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0;font-size:14px}
.dl dt{color:var(--muted);font-size:12px;font-weight:700}
.dl dd{margin:0;line-height:1.7}

.kpi,.stat{
  position:relative;
  min-height:168px;
  padding:17px 18px 16px;
  overflow:hidden;
}
.kpi:nth-child(1){transform:translateY(5px)}
.kpi:nth-child(3){transform:translateY(-4px)}
.kpi::after{
  content:"";
  position:absolute;
  right:-19px;
  top:-19px;
  width:72px;
  height:72px;
  background:var(--accent-soft);
  border:2px solid var(--ink);
  border-radius:0;
  transform:rotate(12deg);
  opacity:1;
}
.kpi .ico{
  position:relative;
  z-index:1;
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#000;
  background:var(--color-secondary);
  border:2px solid var(--ink);
  border-radius:0;
}
.kpi .ico .material-symbols-outlined{font-size:22px}
.kpi .lbl,.stat .lbl{
  margin-top:12px;
  display:flex;
  align-items:center;
  gap:5px;
  color:var(--muted);
  font-size:13px;
  font-weight:700;
}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{color:var(--accent);font-size:16px}
.kpi .val,.stat .val{
  margin-top:1px;
  color:#042F2E;
  font-family:"Cormorant Garamond",serif;
  font-size:34px;
  font-variant-numeric:tabular-nums lining-nums;
  font-weight:700;
  letter-spacing:-.02em;
  line-height:1.05;
}
.kpi .val small,.stat .val small{margin-left:4px;color:var(--muted);font-family:"Crimson Pro",serif;font-size:14px;font-weight:600}
.kpi .delta,.stat .d{
  margin-top:7px;
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:2px 6px;
  border:1px solid currentColor;
  font-size:12px;
  font-weight:700;
}
.delta.up,.d.up{color:#166534;background:#DCFCE7}
.delta.down,.d.down{color:#991B1B;background:#FEE2E2}
.delta.flat,.d.flat{color:#334155;background:#F1F5F9}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:15px}

.card.pad0>div:last-child{max-width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums lining-nums}
th{
  padding:12px 14px;
  color:#042F2E;
  background:var(--th);
  border-right:1px solid var(--ink);
  border-bottom:2px solid var(--ink);
  font-family:"Crimson Pro","Noto Serif TC",serif;
  font-size:12px;
  font-weight:700;
  letter-spacing:.04em;
  text-align:left;
  white-space:nowrap;
}
th:last-child{border-right:0}
td{
  padding:12px 14px;
  color:#1E3A3A;
  background:#fff;
  border-right:1px solid #B6D8D4;
  border-bottom:1px solid #94CFC7;
  white-space:nowrap;
}
td:last-child{border-right:0}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--hov)}
tbody td:nth-child(n+5){text-align:right}
.mono,td:first-child{
  font-family:"Courier New",ui-monospace,SFMono-Regular,monospace;
  font-size:12px;
  font-variant-numeric:tabular-nums;
  font-weight:700;
  letter-spacing:0;
}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 7px;
  border:1px solid currentColor;
  border-radius:0;
  font-size:11px;
  font-weight:800;
  line-height:1.2;
  white-space:nowrap;
}
.t-ok{color:#166534;background:#DCFCE7}
.t-warn{color:#92400E;background:#FEF3C7}
.t-bad{color:#991B1B;background:#FEE2E2}
.t-info{color:#075985;background:#E0F2FE}
.t-gray{color:#334155;background:#F1F5F9}
.t-acc,.t-pink{color:#115E59;background:#CCFBF1}

.bar{height:10px;min-width:64px;overflow:hidden;background:var(--track);border:1px solid #5C8581;border-radius:0}
.bar>i{display:block;height:100%;background:var(--color-primary);border-radius:0}
.prog{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0}
.prog small{width:38px;flex:none;color:#334155;font-family:"Courier New",monospace;font-size:11px;font-weight:700;text-align:right}

.chk{
  min-height:44px;
  padding:9px 3px;
  display:flex;
  align-items:center;
  gap:10px;
  color:#1E3A3A;
  border-bottom:1px dashed #5C8581;
  font-size:13.5px;
}
.chk:last-child{border-bottom:0}
.chk .material-symbols-outlined{font-size:20px}
.chk .ok{color:#15803D}.chk .wait{color:#475569}.chk .bad{color:#B91C1C}.chk .warn{color:#B45309}
.chk .n{flex:1;min-width:0}
.chk small{color:#334155;font-size:12px;font-variant-numeric:tabular-nums;text-align:right}
.note{
  margin-top:14px;
  padding:12px;
  color:#334155;
  background:#F8FAFC;
  border:1px solid #94A3B8;
  border-left:6px solid var(--color-accent);
  font-size:12.5px;
  line-height:1.65;
}
.av,.mini-av{
  flex:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  color:#042F2E;
  background:var(--color-secondary);
  border:1px solid var(--ink);
  border-radius:0;
  font-weight:800;
}
.av{width:28px;height:28px;font-size:12px}
.mini-av{width:20px;height:20px;font-size:9px}
.who{display:inline-flex;align-items:center;gap:6px}

.tl{position:relative;padding-left:27px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:3px;background:var(--ink)}
.tl-item,.tl-i{position:relative;padding:0 0 18px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{
  position:absolute;
  left:-27px;
  top:2px;
  width:16px;
  height:16px;
  background:#fff;
  border:4px solid var(--accent);
  border-radius:0;
}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font-family:"Courier New",monospace;font-size:11px;font-weight:700}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:14px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:12px}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.col{padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--th);border:2px solid var(--ink);border-radius:0}
.col-h{padding:3px 3px 8px;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700;border-bottom:2px solid var(--ink)}
.col-h .cnt{padding:1px 8px;color:#042F2E;background:#fff;border:1px solid var(--ink);border-radius:0;font-family:"Courier New",monospace;font-size:11px}
.pcard{padding:12px;color:#1E3A3A;background:#fff;border:1px solid var(--ink);border-left:7px solid var(--accent);border-radius:0;box-shadow:3px 3px 0 #99F6E4}
.pcard b{font-size:14px}
.pcard .meta{margin-top:6px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px}
.pcard .who{margin-top:8px;color:var(--ink);font-size:11px}

.lane{display:flex;flex-direction:column;gap:12px}
.lane-row{min-width:0;padding:13px 14px;display:flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--ink);border-radius:0;box-shadow:4px 4px 0 var(--line)}
.lane-row .num{width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;color:#000;background:var(--color-accent);border:2px solid var(--ink);border-radius:0;font-family:"Courier New",monospace;font-weight:800}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:14px}
.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:12px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{width:24px;height:24px;z-index:1;display:flex;align-items:center;justify-content:center;color:#475569;background:#fff;border:2px solid #64748B;border-radius:0;font-family:"Courier New",monospace;font-size:11px}
.steps .ln{width:20px;height:3px;background:#94A3B8}
.steps .s.done{color:#fff;background:var(--accent);border-color:#042F2E}
.steps .s.cur{color:#042F2E;background:#CCFBF1;border-color:var(--accent);animation:pulse 1.6s steps(2,end) infinite}
.steps .ln.done{background:var(--accent)}

.rep-row{min-width:0;padding:12px 4px;display:flex;align-items:center;gap:13px;border-bottom:1px dashed #5C8581}
.rep-row:last-child{border-bottom:0}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:14px}
.rep-row .sku span{color:var(--muted);font-size:11px}
.gauge{width:112px;flex:none}
.gauge .track{height:10px;position:relative;overflow:hidden;background:var(--track);border:1px solid #5C8581;border-radius:0}
.gauge .track i{display:block;height:100%;background:var(--accent);border-radius:0}
.gauge small{display:block;margin-top:3px;color:var(--muted);font-family:"Courier New",monospace;font-size:10px;text-align:right}
.band{position:relative;min-width:150px;height:27px;background:var(--track);border:1px solid #5C8581;border-radius:0}
.band .rng{position:absolute;top:0;bottom:0;background:var(--accent-soft);border-radius:0}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
.band .me{position:absolute;top:2px;width:12px;height:21px;background:var(--accent);border:1px solid #042F2E;border-radius:0;box-shadow:none}
.tile{padding:17px;display:flex;flex-direction:column;gap:9px}
.tile .ti{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#000;background:var(--color-secondary);border:2px solid var(--ink);border-radius:0}
.tile .ti .material-symbols-outlined{font-size:21px}
.tile b{font-size:16px}
.tile p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.6}
.tile .tv{color:#042F2E;font-size:28px;font-variant-numeric:tabular-nums}
.apexcharts-text,.apexcharts-legend-text{font-family:"Crimson Pro",Georgia,serif!important}

#screen{animation:screen-in .36s ease-out both}
@keyframes screen-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sidebar{padding:0 16px;gap:14px}
  .brand{min-width:205px}
  .nav button{min-width:126px;padding-inline:12px}
}
@media(max-width:900px){
  .sidebar{position:static;min-height:auto;padding:10px 14px;flex-wrap:wrap;gap:8px}
  .brand{width:100%;min-width:0;padding:0 0 9px;border-right:0;border-bottom:1px solid rgba(94,234,212,.6)}
  .nav{width:100%;flex:none}
  .nav button{min-width:max-content;min-height:46px;flex:1}
  .main{padding:24px 18px 50px}
  .topbar{align-items:flex-start}
}
@media(max-width:820px){
  .g2,.g3,.g23,.g32{grid-template-columns:1fr}
  .topbar h1{font-size:28px}
}

function buildNav(){var n=document.getElementById("nav");
 n.innerHTML=MODULES.map(function(m,i){return '<button type="button" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'}).join("");
 Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})})}
function show(i){killCharts();var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i)});
 RENDER[i](document.getElementById("screen"))}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?Math.min(+m[1],MODULES.length-1):0);try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
