<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>教育訓練管理系統（LMS）｜Jvision 系統 Demo</title>
<meta name="description" content="智慧製造教育訓練管理系統：訓練需求規劃、排課、報名簽到、線上教材OJT、測驗考核與技能認證歸檔" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Comic+Neue:wght@300;400;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#99E7DC;
  --success:#15803D;
  --warning:#A64B00;
  --surface-soft:#F7FFFD;
  --shadow:0 9px 28px rgba(19,78,74,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-width:320px}
body{
  font-family:"Comic Neue","Noto Sans TC",system-ui,sans-serif;
  background:
    linear-gradient(rgba(13,148,136,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(13,148,136,.035) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
button,a,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
.wrap{display:flex;min-height:100vh}
.side{
  width:264px;
  flex:0 0 264px;
  background:#FFFFFF;
  color:var(--ink);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
  z-index:10;
}
.brand{padding:22px 20px 18px;border-bottom:1px solid var(--line)}
.brand .logo{display:flex;align-items:center;gap:12px}
.brand .logo .mk{
  width:40px;
  height:40px;
  border-radius:10px;
  background:var(--color-primary);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#FFFFFF;
  box-shadow:5px 5px 0 #99F6E4;
}
.brand .logo .mk .material-symbols-outlined{font-size:23px}
.brand h1{
  font-family:"Baloo 2","Comic Neue",sans-serif;
  font-size:17px;
  line-height:1.1;
  color:#0F4F4A;
  margin:0;
  font-weight:700;
  letter-spacing:.2px;
}
.brand p{margin:4px 0 0;font-size:11px;color:var(--muted);font-weight:700}
nav.mods{padding:14px 12px;display:flex;flex-direction:column;gap:5px;flex:1}
nav.mods .navlbl{
  font-family:"Baloo 2","Comic Neue",sans-serif;
  font-size:11px;
  letter-spacing:1.5px;
  color:#64748B;
  padding:6px 10px 5px;
  font-weight:700;
}
nav.mods button{
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  min-height:52px;
  text-align:left;
  background:transparent;
  border:1px solid transparent;
  color:#285F5B;
  padding:9px 11px;
  border-radius:9px;
  font-family:inherit;
  font-size:13px;
  font-weight:700;
  transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s ease,box-shadow .2s ease;
}
nav.mods button .ico{
  width:30px;
  height:30px;
  flex:0 0 30px;
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#E9FAF7;
  color:var(--color-primary);
}
nav.mods button .ico .material-symbols-outlined{font-size:19px}
nav.mods button small{display:block;font-size:10.5px;color:#64748B;font-weight:700;margin-top:2px}
nav.mods button:hover{
  background:#F0FDFA;
  border-color:#99E7DC;
  transform:translateX(2px);
}
nav.mods button.on{
  background:var(--color-primary);
  border-color:var(--color-primary);
  color:#FFFFFF;
  box-shadow:5px 5px 0 #99F6E4;
}
nav.mods button.on .ico{background:#FFFFFF;color:#08766D}
nav.mods button.on small{color:#D9FFFA}
.sidefoot{
  padding:14px 18px;
  border-top:1px solid var(--line);
  font-size:11px;
  color:#475569;
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:700;
}
.sidefoot .dot{
  width:9px;
  height:9px;
  border-radius:2px;
  background:#15803D;
  box-shadow:0 0 0 3px #DCFCE7;
}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{
  background:rgba(255,255,255,.95);
  border-bottom:1px solid var(--line);
  padding:16px 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  position:sticky;
  top:0;
  z-index:5;
  backdrop-filter:blur(10px);
}
.top .tt{min-width:0}
.top .tt h2{
  margin:0;
  font-family:"Baloo 2","Comic Neue",sans-serif;
  font-size:21px;
  line-height:1.15;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:9px;
  color:#0F4F4A;
}
.top .tt h2 .material-symbols-outlined{font-size:23px;color:var(--color-primary)}
.top .tt p{margin:4px 0 0;font-size:12px;color:var(--muted);font-weight:700}
.top .who{display:flex;align-items:center;gap:11px;flex:0 0 auto}
.chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  font-weight:700;
  padding:7px 11px;
  border-radius:7px;
  background:#FFF7E8;
  color:#874200;
  border:1px solid #F5C571;
}
.av{
  width:38px;
  height:38px;
  border-radius:9px;
  background:#134E4A;
  color:#FFFFFF;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Baloo 2",sans-serif;
  font-size:13px;
  font-weight:700;
}
.view{padding:24px 28px 44px;min-width:0}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.g32{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
.card{
  background:var(--color-card);
  color:var(--color-card-foreground);
  border:1px solid #99E7DC;
  border-radius:11px;
  padding:17px 18px;
  min-width:0;
  box-shadow:var(--shadow);
  animation:reveal .36s ease both;
  transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
}
.card:hover{transform:translateY(-2px);border-color:var(--color-primary);box-shadow:0 12px 30px rgba(19,78,74,.11)}
.card h3{
  margin:0 0 3px;
  font-family:"Baloo 2","Comic Neue",sans-serif;
  font-size:15px;
  line-height:1.35;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:7px;
  color:#0F4F4A;
}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--color-primary)}
.card .sub{font-size:11.5px;color:var(--muted);font-weight:700;margin:0 0 13px}
.kpi{position:relative;overflow:hidden;border-top:4px solid var(--color-primary)}
.kpi .lab{
  font-size:12px;
  color:var(--muted);
  font-weight:700;
  display:flex;
  align-items:center;
  gap:7px;
}
.kpi .lab .material-symbols-outlined{font-size:18px;color:var(--color-primary)}
.kpi .val{
  font-family:"Baloo 2","Comic Neue",sans-serif;
  font-variant-numeric:tabular-nums;
  font-size:30px;
  line-height:1;
  font-weight:700;
  margin:11px 0 6px;
  letter-spacing:-.4px;
  color:#0F4F4A;
}
.kpi .val small{font-size:13px;font-weight:700;color:var(--muted);margin-left:3px}
.kpi .dl{
  font-size:11px;
  line-height:1.3;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  gap:3px;
  padding:4px 7px;
  border-radius:5px;
  border:1px solid transparent;
}
.up{background:#E8F8EE;color:#126530;border-color:#A7E5BB}
.down{background:#FFF0F0;color:#B91C1C;border-color:#F5B7B7}
.flat{background:#EDF3F5;color:#475569;border-color:#CBD5E1}
.kpi .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--color-secondary)}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 11px;border-bottom:1px solid #D8EEEB;white-space:nowrap}
th{
  font-family:"Baloo 2","Comic Neue",sans-serif;
  font-size:11px;
  color:#385E5B;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.35px;
  background:#EAF9F6;
  border-top:1px solid #C4E9E4;
}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#F1FCFA}
td .nm{font-weight:700;color:#174E49}
td:nth-last-child(-n+4){font-variant-numeric:tabular-nums}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-size:11px;
  line-height:1.3;
  font-weight:700;
  padding:4px 8px;
  border-radius:5px;
  border:1px solid transparent;
}
.t-ok{background:#E8F8EE;color:#126530;border-color:#A7E5BB}
.t-warn{background:#FFF4DA;color:#874200;border-color:#E9BC68}
.t-bad{background:#FFF0F0;color:#B91C1C;border-color:#F5B7B7}
.t-info{background:#E9F3FF;color:#1D4E89;border-color:#B7D5F5}
.t-mut{background:#EDF3F5;color:#475569;border-color:#CBD5E1}
.t-acc{background:#FFF4DA;color:#874200;border-color:#E9BC68}
.prog{height:8px;border-radius:3px;background:#DCEBE9;overflow:hidden;min-width:70px}
.prog>i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--color-primary),var(--color-secondary))}
.chartbox{width:100%;overflow:hidden}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
.legend span{font-size:11.5px;color:var(--muted);font-weight:700;display:inline-flex;align-items:center;gap:6px}
.legend span i{width:11px;height:11px;border-radius:2px;display:inline-block;border:1px solid rgba(15,23,42,.16)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.col{background:#F4FBFA;border:1px solid var(--line);border-radius:9px;padding:11px 10px;min-width:0}
.col .ch{font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;padding:0 3px}
.col .ch .n{font-size:11px;font-weight:700;color:#FFFFFF;background:#475569;border-radius:4px;padding:2px 7px}
.tk{
  background:#FFFFFF;
  border:1px solid #B8DDD8;
  border-left:4px solid var(--color-primary);
  border-radius:8px;
  padding:10px 11px;
  margin-bottom:9px;
  box-shadow:0 3px 10px rgba(19,78,74,.05);
  transition:transform .2s ease,border-color .2s ease;
}
.tk:hover{transform:translateX(2px);border-color:var(--color-primary)}
.tk .tt2{font-size:12.5px;font-weight:700;margin-bottom:5px}
.tk .mt{font-size:11px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.tk .mt .material-symbols-outlined{font-size:15px}
.tl{position:relative;padding-left:23px}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:#A9DCD5}
.tl .it{position:relative;padding:0 0 17px 5px}
.tl .it:before{
  content:"";
  position:absolute;
  left:-20px;
  top:3px;
  width:12px;
  height:12px;
  border-radius:3px;
  background:#FFFFFF;
  border:3px solid var(--color-primary);
}
.tl .it.done:before{background:var(--color-primary);box-shadow:inset 0 0 0 2px #FFFFFF}
.tl .it .h{font-size:12.5px;font-weight:700}
.tl .it .d{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:2px}
.tl .it .tm{font-family:"Comic Neue",monospace;font-size:10.5px;color:#64748B;font-weight:700}
.skill{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #D8EEEB}
.skill:last-child{border-bottom:0}
.skill .snm{width:96px;flex:0 0 96px;font-size:12px;font-weight:700}
.matrix{width:100%;border-collapse:collapse;font-size:11.5px}
.matrix th,.matrix td{text-align:center;padding:8px 7px;border:1px solid #C6E5E1;white-space:nowrap}
.matrix td.lv{font-family:"Comic Neue",monospace;font-weight:700;color:#FFFFFF;border-radius:0}
.lv1{background:#A85600}
.lv2{background:#976500}
.lv3{background:#0A7168}
.matrix td.lv0{background:#E2E8F0;color:#475569}
.mini{display:flex;align-items:center;gap:12px}
.mini .ring{flex:0 0 auto}
.ins{
  display:flex;
  gap:10px;
  align-items:flex-start;
  padding:11px 13px;
  border-radius:8px;
  background:#FFF8E8;
  border:1px solid #E9BC68;
  color:#653500;
  font-size:12px;
  font-weight:700;
  line-height:1.55;
}
.ins .material-symbols-outlined{font-size:19px;color:var(--color-accent);flex:0 0 auto;margin-top:1px}
.split{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  font-size:11px;
  font-weight:700;
  padding:4px 9px;
  border-radius:5px;
  background:#EDF3F5;
  color:#475569;
  border:1px solid #CBD5E1;
}
.pill.on{background:var(--color-primary);color:#FFFFFF;border-color:var(--color-primary)}
.cert{
  border:1px solid #99E7DC;
  border-radius:10px;
  padding:15px;
  position:relative;
  overflow:hidden;
  background:linear-gradient(145deg,#FFFFFF,#F0FDFA);
  box-shadow:var(--shadow);
  transition:transform .22s ease,border-color .22s ease;
}
.cert:hover{transform:translateY(-2px);border-color:var(--color-primary)}
.cert:before{
  content:"";
  position:absolute;
  right:-22px;
  top:-22px;
  width:84px;
  height:84px;
  border:12px solid rgba(45,212,191,.16);
  transform:rotate(20deg);
}
.cert .seal{
  width:40px;
  height:40px;
  border-radius:8px;
  background:var(--color-primary);
  color:#FFFFFF;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:10px;
  box-shadow:4px 4px 0 #99F6E4;
}
.cert .seal .material-symbols-outlined{font-size:23px}
.cert .ct{font-family:"Baloo 2",sans-serif;font-size:14px;font-weight:700}
.cert .cm{font-size:11px;color:var(--muted);font-weight:700;margin-top:3px}
.attgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.attgrid .cell{
  aspect-ratio:1;
  border-radius:4px;
  border:1px solid rgba(15,23,42,.15);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:700;
  color:#FFFFFF;
}
.hd{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px}
.notice{background:#134E4A}
.mono,td:nth-child(3):last-child{font-family:"Comic Neue",ui-monospace,monospace;font-variant-numeric:tabular-nums}
@keyframes reveal{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}
@media(max-width:1180px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,1fr)}
  .attgrid{grid-template-columns:repeat(6,1fr)}
}
@media(max-width:960px){.g3{grid-template-columns:1fr 1fr}}
@media(max-width:860px){
  .wrap{flex-direction:column}
  .side{width:auto;flex:none;position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:15px 17px}
  nav.mods{flex-direction:row;flex-wrap:wrap;padding:9px 11px}
  nav.mods .navlbl{display:none}
  nav.mods button{width:auto;flex:1 1 30%;justify-content:flex-start}
  nav.mods button small{display:none}
  .sidefoot{display:none}
  .top{position:static}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .attgrid{grid-template-columns:repeat(7,1fr)}
}
@media(max-width:560px){
  .brand .logo .mk{width:36px;height:36px}
  nav.mods button{flex:1 1 29%;min-height:44px;justify-content:center;padding:7px}
  nav.mods button .txt{display:none}
  nav.mods button .ico{background:transparent}
  nav.mods button.on .ico{background:transparent;color:#FFFFFF}
  .view{padding:16px 13px 34px}
  .top{padding:13px 14px;align-items:flex-start}
  .top .tt h2{font-size:18px}
  .top .tt p{line-height:1.35}
  .chip{display:none}
  .card{padding:15px 14px}
  .attgrid{grid-template-columns:repeat(6,1fr)}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  .card,nav.mods button,.tk,.cert{transform:none!important}
}
</style>
</head>
<body>
<div class="wrap">
  <aside class="side">
    <div class="brand">
      <div class="logo">
        <div class="mk"><span class="material-symbols-outlined">school</span></div>
        <div><h1>LMS 訓練管理</h1><p>智慧製造 · 教育訓練平台</p></div>
      </div>
    </div>
    <nav class="mods" id="nav" aria-label="功能模組"><div class="navlbl">功能模組</div></nav>
    <div class="sidefoot"><span class="dot"></span> 系統正常 · 資料同步 2 分鐘前</div>
  </aside>
  <div class="main">
    <div class="top">
      <div class="tt">
        <h2 id="vt"><span class="material-symbols-outlined" id="vi">insights</span><span id="vtx">—</span></h2>
        <p id="vd">—</p>
      </div>
      <div class="who">
        <span class="chip"><span class="material-symbols-outlined" style="font-size:15px">calendar_month</span>2026 Q3 訓練季</span>
        <div class="av" aria-label="人力資源管理員">HR</div>
      </div>
    </div>
    <main class="view" id="view"></main>
  </div>
</div>
<script>
var MOD=[
 ["insights","訓練需求規劃","職能落差分析與年度訓練藍圖，優先鎖定關鍵班別。"],
 ["calendar_month","課程與教室排定","講師、教室與梯次的排課與衝突偵測，掌握成班門檻。"],
 ["groups","報名指派與簽到","員工報名、主管指派與開課現場即時出席掌握。"],
 ["description","線上教材與OJT","數位教材、影音課程與在崗訓練的學習進度追蹤。"],
 ["fact_check","測驗考核","線上測驗、實作評量與成績批改時效管理。"],
 ["verified","技能認證歸檔","技能證書核發、效期管理與稽核紀錄歸檔。"]
];
var CH={};
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function destroyAll(){for(var k in CH){if(CH[k]){try{CH[k].destroy();}catch(e){}}}CH={};}
function mk(id,opt){
 var el=document.getElementById(id);if(!el)return;

var nav=document.getElementById("nav");
MOD.forEach(function(m,idx){
 var b=document.createElement("button");
 b.type="button";
 b.setAttribute("data-i",idx);
 b.setAttribute("aria-label",m[1]+"："+m[2]);
 b.innerHTML="<span class='ico'><span class='material-symbols-outlined'>"+m[0]+"</span></span><span class='txt'>"+esc(m[1])+"<small>"+esc(m[2].slice(0,12))+"…</small></span>";
 b.addEventListener("click",function(){location.hash="v"+idx;});
 nav.appendChild(b);
});

function show(i){
 destroyAll();
 var btns=nav.querySelectorAll("button");
 btns.forEach(function(b){
  var active=+b.getAttribute("data-i")===i;
  b.classList.toggle("on",active);
  b.setAttribute("aria-current",active?"page":"false");
 });
 document.getElementById("vi").textContent=MOD[i][0];
 document.getElementById("vtx").textContent=MOD[i][1];
 document.getElementById("vd").textContent=MOD[i][2];
 var container=document.getElementById("view");
 container.innerHTML=SCREENS[i]();
 void container.offsetHeight;
 draw(i);
}
function fromHash(){
 var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
 if(!m){show(0);return;}
 var n=document.querySelectorAll("[data-i]").length||6;
 show(Math.min(+m[1],n-1));
 try{window.scrollTo(0,0);}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
