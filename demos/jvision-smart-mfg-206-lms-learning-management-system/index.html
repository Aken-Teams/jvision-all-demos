<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>教育訓練管理系統（LMS）｜Jvision 系統 Demo</title>
<meta name="description" content="智慧製造教育訓練管理系統：訓練需求規劃、排課、報名簽到、線上教材OJT、測驗考核與技能認證歸檔" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{--accent:#ea580c;--accent2:#fb923c;--ink:#1e293b;--muted:#64748b;--line:#e5e7eb;--bg:#f5f6f8;--side:#1f2530;--side2:#2a323f;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.wrap{display:flex;min-height:100vh;}
.side{width:246px;flex:0 0 246px;background:var(--side);color:#cbd5e1;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand{padding:20px 18px 14px;border-bottom:1px solid #333c4a;}
.brand .logo{display:flex;align-items:center;gap:10px;}
.brand .logo .mk{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;}
.brand .logo .mk .material-symbols-outlined{font-size:20px;}
.brand h1{font-size:15px;color:#fff;margin:0;font-weight:800;letter-spacing:.3px;}
.brand p{margin:3px 0 0;font-size:11px;color:#8b98a9;}
nav.mods{padding:12px 10px;display:flex;flex-direction:column;gap:3px;flex:1;}
nav.mods .navlbl{font-size:10px;letter-spacing:1px;color:#6b7688;padding:6px 10px 4px;font-weight:700;}
nav.mods button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;border:0;color:#c2cbd6;padding:10px 12px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;transition:background .12s;}
nav.mods button .ico{width:24px;flex:0 0 24px;display:flex;justify-content:center;}
nav.mods button .ico .material-symbols-outlined{font-size:20px;}
nav.mods button small{display:block;font-size:10.5px;color:#7d8a9b;font-weight:500;margin-top:1px;}
nav.mods button:hover{background:#2b3340;}
nav.mods button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px -6px rgba(234,88,12,.6);}
nav.mods button.on small{color:#ffe6d6;}
.sidefoot{padding:12px 16px;border-top:1px solid #333c4a;font-size:11px;color:#7d8a9b;display:flex;align-items:center;gap:8px;}
.sidefoot .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;}
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;justify-content:space-between;gap:14px;position:sticky;top:0;z-index:5;}
.top .tt{min-width:0;}
.top .tt h2{margin:0;font-size:17px;font-weight:800;display:flex;align-items:center;gap:9px;}
.top .tt h2 .material-symbols-outlined{font-size:21px;color:var(--accent);}
.top .tt p{margin:3px 0 0;font-size:12px;color:var(--muted);}
.top .who{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:999px;background:#fff4ec;color:var(--accent);border:1px solid #fdd9c2;}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#334155,#475569);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
.view{padding:22px 26px 40px;min-width:0;}
.grid{display:grid;gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:1.55fr 1fr;}
.g32{grid-template-columns:1fr 1.4fr;}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 17px;min-width:0;box-shadow:0 1px 2px rgba(16,24,40,.03);}
.card h3{margin:0 0 3px;font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:7px;}
.card h3 .material-symbols-outlined{font-size:18px;color:var(--accent);}
.card .sub{font-size:11.5px;color:var(--muted);margin:0 0 12px;}
.kpi{position:relative;overflow:hidden;}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--accent);}
.kpi .val{font-size:27px;font-weight:900;margin:8px 0 2px;letter-spacing:-.5px;}
.kpi .val small{font-size:13px;font-weight:700;color:var(--muted);margin-left:3px;}
.kpi .dl{font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:6px;}
.up{background:#e7f7ee;color:#15803d;}.down{background:#fdecec;color:#dc2626;}.flat{background:#eef2f6;color:#64748b;}
.kpi .bar{position:absolute;left:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid #eef1f5;white-space:nowrap;}
th{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;background:#fafbfc;}
tbody tr:hover{background:#fff8f3;}
td .nm{font-weight:700;}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;}
.t-ok{background:#e7f7ee;color:#15803d;}.t-warn{background:#fef4e6;color:#b45309;}.t-bad{background:#fdecec;color:#dc2626;}.t-info{background:#eaf1fd;color:#2563eb;}.t-mut{background:#eef2f6;color:#64748b;}.t-acc{background:#fff1e8;color:#c2410c;}
.prog{height:8px;border-radius:99px;background:#eef1f5;overflow:hidden;min-width:70px;}
.prog>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.chartbox{width:100%;overflow:hidden;}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;}
.legend span{font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;}
.legend span i{width:10px;height:10px;border-radius:3px;display:inline-block;}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.col{background:#f7f8fa;border:1px solid var(--line);border-radius:12px;padding:11px 10px;min-width:0;}
.col .ch{font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;padding:0 3px;}
.col .ch .n{font-size:11px;font-weight:700;color:#fff;background:var(--muted);border-radius:999px;padding:1px 8px;}
.tk{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:8px;box-shadow:0 1px 1px rgba(16,24,40,.03);}
.tk .tt2{font-size:12.5px;font-weight:700;margin-bottom:4px;}
.tk .mt{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.tk .mt .material-symbols-outlined{font-size:14px;}
.tl{position:relative;padding-left:22px;}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl .it{position:relative;padding:0 0 16px 4px;}
.tl .it:before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--accent);}
.tl .it.done:before{background:var(--accent);}
.tl .it .h{font-size:12.5px;font-weight:700;}
.tl .it .d{font-size:11.5px;color:var(--muted);margin-top:2px;}
.tl .it .tm{font-size:10.5px;color:#94a3b8;font-weight:600;}
.skill{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid #eef1f5;}
.skill:last-child{border-bottom:0;}
.skill .snm{width:96px;flex:0 0 96px;font-size:12px;font-weight:700;}
.matrix{width:100%;border-collapse:collapse;font-size:11.5px;}
.matrix th,.matrix td{text-align:center;padding:7px 6px;border:1px solid #eef1f5;white-space:nowrap;}
.matrix td.lv{font-weight:800;color:#fff;border-radius:0;}
.lv1{background:#fdba74;}.lv2{background:#fb923c;}.lv3{background:#ea580c;}.lv0{background:#e2e8f0;color:#94a3b8;}
.mini{display:flex;align-items:center;gap:12px;}
.mini .ring{flex:0 0 auto;}
.ins{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border-radius:10px;background:#fff7f1;border:1px solid #fde3cd;font-size:12px;line-height:1.5;}
.ins .material-symbols-outlined{font-size:18px;color:var(--accent);flex:0 0 auto;margin-top:1px;}
.split{display:flex;gap:8px;flex-wrap:wrap;}
.pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:#f1f4f8;color:#475569;}
.pill.on{background:var(--accent);color:#fff;}
.cert{border:1px solid var(--line);border-radius:12px;padding:13px;position:relative;overflow:hidden;background:linear-gradient(180deg,#fff,#fffaf6);}
.cert:before{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,#fde3cd,transparent 70%);}
.cert .seal{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:9px;}
.cert .seal .material-symbols-outlined{font-size:22px;}
.cert .ct{font-size:13px;font-weight:800;}
.cert .cm{font-size:11px;color:var(--muted);margin-top:3px;}
.attgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;}
.attgrid .cell{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;}
.hd{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;}
.notice{background:#1f2530;}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,1fr);}.board{grid-template-columns:repeat(2,1fr);}.attgrid{grid-template-columns:repeat(6,1fr);}}
@media(max-width:960px){.g3{grid-template-columns:1fr 1fr;}}
@media(max-width:860px){
  .wrap{flex-direction:column;}
  .side{width:auto;flex:none;position:static;height:auto;flex-direction:column;}
  .brand{border-bottom:1px solid #333c4a;}
  nav.mods{flex-direction:row;flex-wrap:wrap;padding:8px 10px;}
  nav.mods .navlbl{display:none;}
  nav.mods button{width:auto;flex:1 1 auto;justify-content:center;}
  nav.mods button small{display:none;}
  .sidefoot{display:none;}
  .top{position:static;}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
  .board{grid-template-columns:1fr;}
  .attgrid{grid-template-columns:repeat(7,1fr);}
}
@media(max-width:560px){
  nav.mods button .txt{display:none;}
  nav.mods button{padding:9px;}
  .view{padding:16px 13px 34px;}
  .top{padding:12px 14px;}
}
</style>
</head>
<body>
<div class="wrap">
  <aside class="side">
    <div class="brand">
      <div class="logo">
        <div class="mk"><span class="material-symbols-outlined">school</span></div>
        <div><h1>LMS 訓練管理</h1><p>智慧製造 · 教育訓練平台</p></div>
      </div>
    </div>
    <nav class="mods" id="nav"><div class="navlbl">功能模組</div></nav>
    <div class="sidefoot"><span class="dot"></span> 系統正常 · 資料同步 2 分鐘前</div>
  </aside>
  <div class="main">
    <div class="top">
      <div class="tt">
        <h2 id="vt"><span class="material-symbols-outlined" id="vi">insights</span><span id="vtx">—</span></h2>
        <p id="vd">—</p>
      </div>
      <div class="who">
        <span class="chip"><span class="material-symbols-outlined" style="font-size:15px">calendar_month</span>2026 Q3 訓練季</span>
        <div class="av">HR</div>
      </div>
    </div>
    <div class="view" id="view"></div>
  </div>
</div>
<script>
var MOD=[
 ["insights","訓練需求規劃","職能落差分析與年度訓練藍圖，優先鎖定關鍵班別。"],
 ["calendar_month","課程與教室排定","講師、教室與梯次的排課與衝突偵測，掌握成班門檻。"],
 ["groups","報名指派與簽到","員工報名、主管指派與開課現場即時出席掌握。"],
 ["description","線上教材與OJT","數位教材、影音課程與在崗訓練的學習進度追蹤。"],
 ["fact_check","測驗考核","線上測驗、實作評量與成績批改時效管理。"],
 ["verified","技能認證歸檔","技能證書核發、效期管理與稽核紀錄歸檔。"]
];
var CH={};
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function destroyAll(){for(var k in CH){if(CH[k]){try{CH[k].destroy();}catch(e){}}}CH={};}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;opt.chart=opt.chart||{};opt.chart.redrawOnParentResize=false;opt.chart.redrawOnWindowResize=false;opt.chart.animations={enabled:false};opt.chart.toolbar={show:false};opt.chart.fontFamily='Inter,"Noto Sans TC",sans-serif';var c=new ApexCharts(el,opt);c.render();CH[id]=c;}

/* ---------- SCREEN 0: 訓練需求規劃 ---------- */
function s0(){
 var need=[
  ["CNC 加工操作","製造二部",42,18,"t-bad","高"],
  ["ISO 品質稽核","品保部",26,9,"t-warn","高"],
  ["職安衛法規","全廠",180,120,"t-warn","中"],
  ["自動化設備維護","設備工程",22,15,"t-info","中"],
  ["精實生產 Lean","製造一部",34,28,"t-info","低"],
  ["新人共通訓練","全廠",56,40,"t-ok","中"]
 ];
 var rows=need.map(function(r){var pct=Math.round(r[3]/r[2]*100);return "<tr><td><div class='nm'>"+esc(r[0])+"</div></td><td>"+esc(r[1])+"</td><td>"+r[2]+" 人</td><td><div style='display:flex;align-items:center;gap:8px'><div class='prog' style='flex:1'><i style='width:"+pct+"%'></i></div><b style='font-size:11.5px'>"+pct+"%</b></div></td><td><span class='tag "+r[4]+"'>缺口 "+(r[2]-r[3])+" 人</span></td><td><span class='pill'>優先"+r[5]+"</span></td></tr>";}).join("");
 return ""+
 "<div class='grid g4'>"+
  kpi("group","應訓總人數","1,248","+96 vs 上季","up","factory")+
  kpi("insights","職能落差項","37","高風險 8 項","down","warning")+
  kpi("target","年度達成率","62%","目標 85%","flat","flag")+
  kpi("payments","訓練預算","¥ 480萬","已用 41%","up","savings")+
 "</div>"+
 "<div class='grid g23' style='margin-top:16px'>"+
  "<div class='card'><h3><span class='material-symbols-outlined'>account_tree</span>職能落差雷達（各部門）</h3><p class='sub'>依技能矩陣盤點，數值越高代表缺口越大</p><div class='chartbox'><div id='c0radar'></div></div></div>"+
  "<div class='card'><h3><span class='material-symbols-outlined'>insights</span>需求優先熱度</h3><p class='sub'>缺口人數 × 業務關鍵度</p><div class='chartbox'><div id='c0bar'></div></div></div>"+
 "</div>"+
 "<div class='card' style='margin-top:16px'><h3><span class='material-symbols-outlined'>fact_check</span>年度訓練需求清單</h3><p class='sub'>RULE-01：法規到期與高缺口班別優先排入下一梯次</p>"+
  "<div style='overflow-x:auto'><table><thead><tr><th>訓練項目</th><th>需求單位</th><th>應訓</th><th>已完訓進度</th><th>缺口</th><th>優先度</th></tr></thead><tbody>"+rows+"</tbody></table></div></div>"+
 "<div class='ins' style='margin-top:14px'><span class='material-symbols-outlined'>lightbulb</span><div><b>系統建議：</b>「CNC 加工操作」缺口 24 人且列高優先，建議於本季開設 2 梯次；「職安衛法規」有 60 人證照將於 60 天內到期，需優先排課避免違規停線。</div></div>";
}

/* ---------- SCREEN 1: 課程與教室排定 ---------- */
function s1(){
 var days=["週一","週二","週三","週四","週五"];
 var rooms=[
  ["A101 教室","CNC 加工操作 · 王承翰","09:00-12:00","週一","t-ok","進行中"],
  ["A101 教室","品質稽核實務 · 林郁婷","14:00-17:00","週一","t-warn","衝突"],
  ["B203 實作室","自動化維護 · 陳冠廷","09:00-16:00","週三","t-ok","已排定"],
  ["線上直播","職安衛法規 · 外聘講師","10:00-11:30","週四","t-info","待確認"],
  ["A102 教室","精實生產 · 黃思妤","13:00-16:00","週五","t-ok","已排定"]
 ];
 var rows=rooms.map(function(r){return "<tr><td><div class='nm'>"+esc(r[0])+"</div></td><td>"+esc(r[1])+"</td><td>"+r[2]+"</td><td>"+r[3]+"</td><td><span class='tag "+r[4]+"'>"+r[5]+"</span></td></tr>";}).join("");
 var cls=[
  ["CNC 加工操作 #12","24 / 24","滿班","t-ok",100],
  ["品質稽核實務 #08","18 / 20","可成班","t-ok",90],
  ["職安衛法規 #33","11 / 20","未達門檻","t-bad",55],
  ["自動化維護 #05","16 / 18","可成班","t-warn",89]
 ];
 var cards=cls.map(function(c){return "<div class='tk'><div class='tt2'>"+esc(c[0])+"</div><div class='mt'><span class='material-symbols-outlined'>groups</span>報名 "+c[1]+" <span class='tag "+c[3]+"' style='margin-left:auto'>"+c[2]+"</span></div><div class='prog' style='margin-top:7px'><i style='width:"+c[4]+"%'></i></div></div>";}).join("");
 return ""+
 "<div class='grid g4'>"+
  kpi("calendar_month","本週梯次","18","跨 6 間教室","up","event")+
  kpi("warning","排課衝突","2","教室/講師重疊","down","report")+
  kpi("meeting_room","教室使用率","78%","尖峰 週一","up","meeting_room")+
  kpi("groups","平均成班率","81%","門檻 15 人","up","target")+
 "</div>"+
 "<div class='grid g32' style='margin-top:16px'>"+
  "<div class='card'><h3><span class='material-symbols-outlined'>bolt</span>成班狀態</h3><p class='sub'>RULE-03：未達門檻班級由主任決定併班或延期</p>"+cards+"</div>"+
  "<div class='card'><h3><span class='material-symbols-outlined'>meeting_room</span>教室每日排課負載</h3><p class='sub'>各教室每日已排課時數（小時）</p><div class='chartbox'><div id='c1heat'></div></div></div>"+
 "</div>"+
