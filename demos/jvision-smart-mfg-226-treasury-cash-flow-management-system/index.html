<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>資金與現金流管理系統｜Jvision 系統 Demo</title>
<meta name="description" content="銀行帳戶集中、現金流預測、資金調撥與集團內拆借的財務即時掌握（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#0F172A;--color-on-primary:#FFFFFF;
  --color-secondary:#1E293B;--color-on-secondary:#FFFFFF;
  --color-accent:#22C55E;--color-on-accent:#0F172A;
  --color-background:#020617;--color-foreground:#F8FAFC;
  --color-card:#0E1223;--color-card-foreground:#F8FAFC;
  --color-muted:#1A1E2F;--color-muted-foreground:#94A3B8;
  --color-border:#334155;--color-destructive:#EF4444;
  --color-on-destructive:#000000;--color-ring:#FFFFFF;
  --blue:#38BDF8;--ink:#F8FAFC;--muted:#94A3B8;--line:#334155;
  --green:#22C55E;--amber:#FBBF24;--red:#F87171;
  --bg:#020617;--card:#0E1223;--body:#CBD5E1;--acc:#22C55E;--acc2:#4ADE80;--acc-d:#86EFAC;
  --mono:"Fira Code",ui-monospace,monospace;--sans:"Fira Sans","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{font-family:var(--sans);color:var(--body);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit}
button,[data-i]{cursor:pointer}
.material-symbols-outlined{font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24}
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:20;
  background:linear-gradient(180deg,#070B16 0%,#020617 100%);
  border-right:1px solid rgba(148,163,184,.2)
}
.brand{display:flex;align-items:center;gap:12px;padding:22px 18px;border-bottom:1px solid rgba(148,163,184,.16)}
.brand .lg{
  width:42px;height:42px;display:grid;place-items:center;flex:none;border-radius:10px;
  color:var(--color-on-accent);background:var(--acc);
  box-shadow:0 0 24px rgba(34,197,94,.24)
}
.brand b{display:block;color:var(--ink);font-size:15px;letter-spacing:.02em}
.brand small{display:block;margin-top:2px;color:var(--acc-d);font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.nav{flex:1;padding:14px 10px;overflow:auto}
.nav .t{padding:13px 10px 7px;color:#64748B;font:600 10px var(--mono);letter-spacing:.12em}
.nav button{
  width:100%;display:flex;align-items:center;gap:11px;margin:2px 0;padding:11px 12px;
  color:#AEBACB;text-align:left;border:1px solid transparent;border-radius:9px;background:transparent;
  transition:background-color .2s,border-color .2s,color .2s,transform .2s
}
.nav button .material-symbols-outlined{font-size:20px;color:#718096}
.nav button:hover{color:var(--ink);background:#11182A;border-color:#26334A}
.nav button.on{
  color:#fff;background:linear-gradient(90deg,rgba(34,197,94,.18),rgba(34,197,94,.04));
  border-color:rgba(74,222,128,.36);box-shadow:inset 3px 0 var(--acc)
}
.nav button.on .material-symbols-outlined{color:var(--acc2);filter:drop-shadow(0 0 7px rgba(34,197,94,.45))}
.side-f{padding:17px;border-top:1px solid rgba(148,163,184,.16)}
.quota{color:var(--muted);font-size:11px}
.quota b{display:block;margin-top:5px;color:var(--ink);font:600 18px var(--mono)}
.qbar{height:6px;margin-top:10px;overflow:hidden;border-radius:99px;background:#1E293B}
.qbar span{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#86EFAC);box-shadow:0 0 10px rgba(34,197,94,.6)}
.main{min-width:0}
.top{
  position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:16px;padding:14px 26px;
  background:rgba(2,6,23,.88);border-bottom:1px solid rgba(51,65,85,.8);
  backdrop-filter:blur(14px)
}
.top h1{margin:0;color:var(--ink);font-size:18px;font-weight:600;letter-spacing:.01em;text-shadow:0 0 10px rgba(248,250,252,.1)}
.top .sub{margin-top:3px;color:var(--muted);font-size:11px}
.top .r{display:flex;align-items:center;gap:12px;margin-left:auto}
.pill{
  display:inline-flex;align-items:center;gap:7px;padding:6px 10px;color:#BBF7D0;
  font:600 11px var(--mono);border:1px solid rgba(34,197,94,.3);border-radius:99px;background:rgba(34,197,94,.08)
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc);animation:pulse 1.8s ease-in-out infinite}
.ava{width:36px;height:36px;display:grid;place-items:center;border:1px solid #3B4B63;border-radius:9px;background:#172033;color:#F8FAFC;font-weight:700}
.body{padding:24px 26px 48px}
.vh{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:19px;flex-wrap:wrap}
.vh h2{margin:0;color:var(--ink);font-size:23px;font-weight:600;letter-spacing:-.02em}
.vh p{margin:5px 0 0;color:var(--muted);font-size:12px}
.btn{
  min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 15px;
  color:var(--color-on-accent);font-weight:700;font-size:12px;border:1px solid var(--acc2);
  border-radius:8px;background:var(--acc);box-shadow:0 0 18px rgba(34,197,94,.13);
  transition:background-color .2s,border-color .2s,box-shadow .2s,transform .2s
}
.btn:hover{background:#4ADE80;box-shadow:0 0 20px rgba(34,197,94,.28);transform:translateY(-1px)}
.btn.ghost{color:#DDE7F3;border-color:#40516B;background:#11182A;box-shadow:none}
.btn.ghost:hover{color:#fff;border-color:#64748B;background:#192337}
.btn.sm{min-height:34px;padding:0 11px}
.btn .material-symbols-outlined{font-size:18px}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--color-ring);outline-offset:3px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi,.card,.ac,.lc,.apr{
  border:1px solid var(--line);background:linear-gradient(145deg,rgba(18,24,43,.98),rgba(10,14,29,.98));
  box-shadow:0 12px 30px rgba(0,0,0,.18)
}
.kpi{position:relative;overflow:hidden;padding:16px 17px;border-radius:11px}
.kpi:before{content:"";position:absolute;inset:0 auto 0 0;width:2px;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.kpi .l{display:flex;align-items:center;gap:7px;color:#A9B6C8;font-size:11px;font-weight:600}
.kpi .l .material-symbols-outlined{color:var(--acc2);font-size:18px}
.kpi .v{margin-top:10px;color:var(--ink);font:600 24px var(--mono);letter-spacing:-.04em}
.kpi .v small{color:var(--muted);font:500 11px var(--sans);letter-spacing:0}
.kpi .d{margin-top:7px;color:#B5C0CF;font-size:11px;font-weight:500}
.up{color:#4ADE80!important}.dn{color:#FCA5A5!important}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g21{grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr)}
.g12{grid-template-columns:minmax(300px,1fr) minmax(0,1.55fr)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{min-width:0;padding:18px;border-radius:12px}
.card>h3{display:flex;align-items:center;gap:8px;margin:0 0 15px;color:var(--ink);font-size:14px;font-weight:600}
.card>h3 .material-symbols-outlined{color:var(--acc2);font-size:19px}
.card>h3 .grow{margin-left:auto;color:var(--acc-d);font:500 11px var(--mono)}
.chartbox{position:relative;width:100%;overflow:hidden}
.table-wrap{width:100%;overflow-x:auto;border:1px solid #29364C;border-radius:8px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{
  padding:10px 11px;color:#AEBBCE;background:#11182A;border-bottom:1px solid #40516B;
  font:600 10px var(--mono);letter-spacing:.04em;text-align:left;white-space:nowrap
}
.tbl td{padding:11px;border-bottom:1px solid #253147;color:#CAD5E3;white-space:nowrap}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:rgba(51,65,85,.22)}
.tbl td b{color:var(--ink);font-weight:600}
.tbl td:first-child,.tbl td:nth-child(2){font-variant-numeric:tabular-nums}
.num{text-align:right!important;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tag{
  display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border:1px solid;
  border-radius:5px;font-size:10px;font-weight:600;white-space:nowrap
}
.tag:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.t-ok{color:#86EFAC;background:rgba(34,197,94,.09);border-color:rgba(74,222,128,.32)}
.t-wait{color:#FDE68A;background:rgba(251,191,36,.09);border-color:rgba(251,191,36,.3)}
.t-hot{color:#FCA5A5;background:rgba(239,68,68,.1);border-color:rgba(248,113,113,.32)}
.t-info{color:#7DD3FC;background:rgba(56,189,248,.09);border-color:rgba(56,189,248,.3)}
.t-neu{color:#CBD5E1;background:rgba(148,163,184,.09);border-color:rgba(148,163,184,.26)}
.acct{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:11px}
.ac{padding:14px;border-radius:9px;transition:border-color .2s,transform .2s}
.ac:hover,.lc:hover{border-color:#52647E;transform:translateY(-2px)}
.ac .bk{display:flex;align-items:center;gap:8px;color:#DBE7F5;font-size:12px;font-weight:600}
.ac .lo{width:27px;height:27px;display:grid;place-items:center;flex:none;color:var(--acc2);border:1px solid rgba(34,197,94,.25);border-radius:6px;background:rgba(34,197,94,.08)}
.ac .lo .material-symbols-outlined{font-size:17px}
.ac .no{margin-top:4px;color:var(--muted);font:400 10px var(--mono)}
.ac .bal{margin-top:13px;color:var(--ink);font:600 21px var(--mono)}
.ac .cur{color:var(--muted);font:400 10px var(--sans)}
.ac .ft{display:flex;justify-content:space-between;margin-top:10px;padding-top:9px;color:var(--muted);font-size:10px;border-top:1px solid #263249}
.ac .ft b{color:#D8E1EC}
.steps{display:flex;margin-bottom:18px}
.stp{position:relative;flex:1;min-width:130px;padding:13px 15px;background:#0B1020;border:1px solid var(--line);border-right:0}
.stp:first-child{border-radius:9px 0 0 9px}.stp:last-child{border-right:1px solid var(--line);border-radius:0 9px 9px 0}
.stp .n{color:#718096;font:600 9px var(--mono);letter-spacing:.08em}
.stp .ti{margin-top:4px;color:#DDE6F2;font-size:13px;font-weight:600}
.stp small{color:var(--muted);font-size:10px}
.stp.act{background:linear-gradient(135deg,rgba(34,197,94,.16),rgba(34,197,94,.03));border-color:rgba(74,222,128,.5);box-shadow:inset 0 2px var(--acc)}
.stp.act .ti{color:#BBF7D0}
.bars{display:flex;flex-direction:column;gap:13px}
.bar-row{display:grid;grid-template-columns:95px 1fr 62px;align-items:center;gap:10px}
.bar-row .lb{overflow:hidden;color:#C7D2E1;font-size:11px;font-weight:500;text-overflow:ellipsis;white-space:nowrap}
.bar-tk{height:11px;overflow:hidden;border-radius:3px;background:#1B2639}
.bar-tk span{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#16A34A,#4ADE80);box-shadow:0 0 8px rgba(34,197,94,.28)}
.bar-row .vv{text-align:right;color:var(--ink);font:600 11px var(--mono)}
.ledger{display:flex;flex-direction:column}
.lg-i{display:flex;gap:12px;padding:12px 0;border-top:1px solid #263249}
.lg-i:first-child{border-top:0}
.lg-ic{width:32px;height:32px;display:grid;place-items:center;flex:none;border-radius:7px;color:#06101B}
.lg-ic .material-symbols-outlined{font-size:18px}
.lg-i .info{flex:1;min-width:0}
.lg-i .info b{color:var(--ink);font-size:12px;font-weight:600}
.lg-i .info small{display:block;margin-top:3px;color:var(--muted);font-size:11px}
.lg-i .when{color:var(--muted);font:500 10px var(--mono);white-space:nowrap}
.apr{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px;padding:13px;border-radius:9px}
.apr .info{flex:1;min-width:0}.apr .amt{margin:7px 0 4px;color:#BBF7D0;font:600 18px var(--mono)}
.apr .who{color:var(--muted);font-size:10px}.apr .chk{flex:none}
.approw{display:flex;align-items:center;gap:7px;margin-top:9px;color:var(--muted);font-size:10px;flex-wrap:wrap}
.approw .step2{display:inline-flex;align-items:center;gap:4px}.approw .ok2{color:#86EFAC}.approw .wt2{color:#FDE68A}
.lend{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:11px}
.lc{padding:15px;border-radius:9px;transition:border-color .2s,transform .2s}
.lc .pair{display:flex;align-items:center;gap:7px;color:var(--ink);font-size:12px;font-weight:600}
.lc .pair .material-symbols-outlined{color:var(--acc2);font-size:18px}
.lc .amt{margin:10px 0 7px;color:var(--ink);font:600 20px var(--mono)}
.lc .meta{display:flex;justify-content:space-between;margin-top:10px;padding-top:9px;color:var(--muted);font-size:10px;border-top:1px solid #263249}
.lc .meta b{color:#CBD5E1;font-family:var(--mono)}
.aud{color:var(--muted);font-size:10px}
.grid-item,.kpi,.card,.ac,.lc{animation:rise .4s cubic-bezier(.2,.75,.28,1.25) both}
.kpi:nth-child(2),.ac:nth-child(2),.lc:nth-child(2){animation-delay:.06s}
.kpi:nth-child(3),.ac:nth-child(3),.lc:nth-child(3){animation-delay:.12s}
.kpi:nth-child(4),.ac:nth-child(4),.lc:nth-child(4){animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.45;transform:scale(.72)}}
@media(max-width:1080px){.kpis{grid-template-columns:repeat(2,1fr)}.g21,.g12{grid-template-columns:1fr}}
@media(max-width:860px){
  .shell{grid-template-columns:1fr}.side{position:static;height:auto}.brand{padding:14px 16px}
  .nav{display:flex;gap:5px;padding:8px 12px;overflow-x:auto}.nav .t{display:none}
  .nav button{width:auto;flex:none;margin:0}.side-f{display:none}.g2,.g3{grid-template-columns:1fr}
}
@media(max-width:560px){
  .brand small{display:none}.nav button{padding:10px}.nav button span:not(.material-symbols-outlined){display:none}
  .top{padding:11px 14px}.top .sub{display:none}.pill{padding:6px 8px}.body{padding:18px 14px 34px}
  .vh h2{font-size:20px}.kpis{grid-template-columns:1fr}.kpi .v{font-size:22px}
  .steps{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stp,.stp:first-child,.stp:last-child{border:1px solid var(--line);border-radius:8px}
  .bar-row{grid-template-columns:78px 1fr 50px}.apr{flex-direction:column}.apr .chk,.apr .chk .btn{width:100%}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><span class="lg"><span class="material-symbols-outlined">account_balance</span></span><div><b>資金現金流</b><small>Treasury Cockpit</small></div></div>

<script>

["TR-2408-090","兆O USD 帳戶","O山子公司","320","已執行","t-ok","已放款"],
["TR-2408-089","第一備償專戶","O宏世華主帳戶","150","已執行","t-ok","已放款"],
["TR-2408-088","O宏世華主帳戶","O華信託薪資","260","排程 08/16","t-info","待執行"],
["TR-2408-087","台北富O營運","兆O USD 帳戶","510","退回","t-hot","逾額退回"],
["TR-2408-086","O山子公司","O宏世華主帳戶","95","已執行","t-ok","已放款"]
];
var LENDS=[
["母公司","華O精密","1,200","2.15%","2026/12/31","正常"],
["母公司","O宇科技","680","2.35%","2026/10/15","正常"],
["華O精密","母公司","450","1.95%","2026/09/30","即將到期"],
["母公司","O昇材料","920","2.60%","2027/03/20","正常"],
["O宇科技","華O精密","300","2.10%","2026/11/08","正常"],
["母公司","日新自動化","540","2.45%","2026/12/05","觀察"]
];
