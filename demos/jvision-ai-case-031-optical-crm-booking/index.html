<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>眼鏡處方會員站 · Optical CRM</title>
<meta name="description" content="驗光處方、配鏡訂單、鏡片庫存到會員回購與保固的門市一體化（純 UI 展示）。"/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
  :root{--accent:#6366f1;--accent2:#818cf8;--ink:#1e1b4b;--body:#3f3d63;--mut:#797896;--line:#e6e6f4;--bg:#f5f5fb;--card:#fff;--ok:#059669;--warn:#d97706;--bad:#e11d48;--soft:#eef0fe}
  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--body);-webkit-font-smoothing:antialiased}
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;font-size:20px;vertical-align:middle;line-height:1}
  .shell{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
  .shell>*{min-width:0}
  /* light sidebar */
  .side{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;min-width:0}
  .brand{padding:20px 18px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--line)}
  .brand .lg{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 8px 18px rgba(99,102,241,.35)}
  .brand b{color:var(--ink);font-size:15px;font-weight:900;display:block;font-family:"Noto Sans TC"}
  .brand span{color:var(--accent);font-size:10px;letter-spacing:1.3px}
  .nav{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:3px;min-width:0;overflow:auto}
  .nav .t{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding:8px 12px 6px}
  .nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;color:var(--body);font:inherit;font-weight:600;font-size:13.5px;padding:11px 12px;border-radius:11px;cursor:pointer;font-family:"Noto Sans TC"}
  .nav button .material-symbols-outlined{font-size:21px;color:#9d9cbb}
  .nav button:hover{background:var(--soft)}
  .nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
  .nav button.on .material-symbols-outlined{color:#fff}
  .nav .badge{margin-left:auto;font-size:11px;font-weight:800;background:#ffe4e6;color:#be123c;border-radius:999px;padding:1px 8px}
  .nav button.on .badge{background:rgba(255,255,255,.25);color:#fff}
  .side-f{padding:14px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}
  .doc{display:flex;align-items:center;gap:10px}.doc .av{width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--accent);font-weight:800;display:grid;place-items:center;flex:none}
  /* main */
  .main{min-width:0}
  .top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:16px}
  .top h1{margin:0;font-size:19px;font-weight:900;color:var(--ink);font-family:"Noto Sans TC"}
  .top .sub{font-size:12px;color:var(--mut)}
  .top .r{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--accent);background:var(--soft);border-radius:999px;padding:6px 12px}
  .pill.amber{background:#fef3c7;color:#92400e}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#4338ca;background:var(--soft);border-radius:999px;padding:6px 12px}
  .live i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:p 1.5s infinite}
  @keyframes p{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}
  .body{padding:22px 26px 46px}
  .vh{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
  .vh h2{margin:0;font-size:21px;font-weight:900;color:var(--ink);font-family:"Noto Sans TC"}
  .vh p{margin:3px 0 0;font-size:13px;color:var(--mut)}
  .btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px;border-radius:10px;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:800;font-size:13px;cursor:pointer;font-family:"Noto Sans TC"}
  .btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--line)}
  .btn .material-symbols-outlined{font-size:18px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 17px;position:relative;overflow:hidden}
  .kpi .l{font-size:12px;font-weight:700;color:var(--mut);display:flex;align-items:center;gap:6px}
  .kpi .l .material-symbols-outlined{font-size:18px;color:var(--accent)}
  .kpi .v{font-size:27px;font-weight:900;color:var(--ink);margin-top:7px}.kpi .v small{font-size:14px;color:var(--mut);font-weight:700}
  .kpi .d{font-size:12px;font-weight:800;color:var(--ok);margin-top:4px}
  .grid{display:grid;gap:18px}.grid>*{min-width:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;min-width:0}
  .card>h3{margin:0 0 14px;font-size:15px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:"Noto Sans TC"}
  .card>h3 .material-symbols-outlined{color:var(--accent);font-size:20px}
  .card>h3 .grow{margin-left:auto;font-size:12px;font-weight:700;color:var(--accent);cursor:pointer}
  .tag{font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px;white-space:nowrap}
  .g-ok{background:#d1fae5;color:#047857}.g-wait{background:#fef3c7;color:#b45309}.g-info{background:var(--soft);color:#4338ca}.g-bad{background:#ffe4e6;color:#be123c}.g-purple{background:#f3e8ff;color:#7e22ce}
  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--mut);font-weight:800;padding:11px 12px;border-bottom:2px solid var(--line);background:var(--bg);white-space:nowrap}
  .tbl td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}.tbl tr:hover td{background:var(--bg)}
  .scroll{overflow-x:auto}
  .bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .chart{width:100%;height:250px}
  /* member list */
  .mem{display:flex;align-items:center;gap:13px;padding:12px 0;border-top:1px solid var(--line)}.mem:first-of-type{border-top:0}
  .mem .av{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;flex:none;font-family:"Noto Sans TC"}
  .mem .info{flex:1;min-width:0}.mem .info b{color:var(--ink);font-size:14px}.mem .info small{display:block;color:var(--mut);font-size:12px}
  .mem .rt{text-align:right;flex:none}.mem .rt b{color:var(--accent);font-family:Inter;font-size:14px}.mem .rt small{display:block;color:var(--mut);font-size:11px}
  /* prescription card (signature) */
  .rx{background:linear-gradient(160deg,#fbfbff,#f0f1fe);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
  .rx-top{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .rx-top .av{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px;flex:none;font-family:"Noto Sans TC"}
  .rx-top b{font-size:17px;color:var(--ink)}.rx-top small{color:var(--mut);font-size:12px;display:block}
  .rxtbl{width:100%;border-collapse:collapse;font-size:14px;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
  .rxtbl th{background:var(--accent);color:#fff;font-weight:800;padding:9px 6px;font-size:12px}
  .rxtbl td{padding:11px 6px;text-align:center;border-bottom:1px solid var(--line);font-weight:700;color:var(--ink);font-family:Inter}
  .rxtbl td.eye{background:var(--soft);color:var(--accent);font-weight:900}
  .rxtbl tr:last-child td{border-bottom:0}
  .pd{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;margin-top:12px}
  .pd .b{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;text-align:center}
  .pd .b b{display:block;font-size:19px;color:var(--ink);font-weight:900;font-family:Inter}.pd .b span{font-size:11px;color:var(--mut)}
  /* order tracking (signature) */
  .ord{border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:12px}
  .ord-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:11px}
  .ord-h b{color:var(--ink);font-size:14px}.ord-h .no{font-family:Inter;font-weight:800;color:var(--accent);font-size:13px}
  .ord-h .amt{margin-left:auto;font-weight:900;color:var(--ink);font-family:Inter}
  .track{display:flex;align-items:center}
  .track .st{flex:1;text-align:center;position:relative;font-size:11px;color:var(--mut)}
  .track .st .dot{width:22px;height:22px;border-radius:50%;background:var(--line);color:#fff;display:grid;place-items:center;margin:0 auto 5px;font-size:13px;position:relative;z-index:1}
  .track .st.done .dot{background:var(--accent)}.track .st.cur .dot{background:var(--accent);box-shadow:0 0 0 4px var(--soft)}
  .track .st.done,.track .st.cur{color:var(--ink);font-weight:700}
  .track .st:not(:first-child):before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
  .track .st.done:before,.track .st.cur:before{background:var(--accent)}
  /* stock cards */
  .stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .sc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
  .sc b{color:var(--ink);font-size:14px}.sc small{font-size:11px;color:var(--mut)}
  .lowt{font-size:10px;font-weight:800;color:var(--bad);background:#ffe4e6;border-radius:6px;padding:2px 7px}
  /* recall */
  .rc{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.rc:first-of-type{border-top:0}
  .rc .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--soft);color:var(--accent)}
  .rc .info{flex:1;min-width:0}.rc .info b{color:var(--ink);font-size:13.5px}.rc .info small{display:block;color:var(--mut);font-size:12px}
  /* warranty timeline */
  .wl{position:relative;padding-left:26px}
  .wl:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}
  .wi{position:relative;padding:0 0 16px}.wi:last-child{padding-bottom:0}
  .wi .dot{position:absolute;left:-24px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
  .wi.warn .dot{background:var(--warn)}.wi.done .dot{background:var(--ok)}
  .wi b{color:var(--ink);font-size:13.5px}.wi small{display:block;color:var(--mut);font-size:12px;margin-top:1px}
  .wi .tm{font-size:11px;color:var(--accent);font-weight:700}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .fld{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--body)}.fld.full{grid-column:1/-1}
  .fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:9px;padding:10px 12px;font:inherit;font-size:13px;color:var(--ink);outline:none}
  .fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
  @media(max-width:860px){
    .shell{grid-template-columns:1fr}
    .side{position:static;height:auto;min-width:0}
    .nav{flex-direction:row;flex-wrap:wrap;overflow:visible}
    .nav button{width:auto;flex:none;white-space:nowrap}
    .nav .t,.side-f{display:none}
    .grid[style]{grid-template-columns:1fr !important}
    .form{grid-template-columns:1fr}
  }
  @media(max-width:640px){
    .top{flex-wrap:wrap;padding:12px 16px}.top .r{width:100%}
    .body{padding:16px 14px 32px}
    .kpis{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><span class="lg"><span class="material-symbols-outlined">visibility</span></span><div><b>眼鏡處方會員站</b><span>OPTICAL CRM</span></div></div>
    <nav class="nav" id="nav"><div class="t">功能模組</div></nav>
    <div class="side-f"><div class="doc"><span class="av">昕</span><div><b style="color:var(--ink)">昕晰眼鏡</b><div>信義門市 · 驗光師 3 位</div></div></div></div>
  </aside>
  <div class="main">
    <header class="top">
      <div><h1 id="vt">顧客會員</h1><div class="sub" id="vd">會員檔案、消費紀錄與偏好</div></div>
      <div class="r">
        <span class="live"><i></i>門市即時同步</span>
        <span class="pill"><span class="material-symbols-outlined" style="font-size:16px">groups</span>會員 3,482</span>
        <span class="pill amber">待取件 14</span>
      </div>
    </header>
    <div class="body" id="view"></div>
  </div>
</div>
<script>
const MOD=[
 ["groups","顧客會員","","會員檔案、消費紀錄與偏好"],
 ["visibility","驗光處方","","球面/散光/軸度與瞳距紀錄"],
 ["receipt_long","配鏡訂單","14","鏡框鏡片開單與製作追蹤"],
 ["inventory_2","鏡片庫存","2","鏡框鏡片庫存與訂片補貨"],
 ["notifications_active","會員回購","","回購週期與換鏡提醒推播"],
 ["verified_user","保固服務","3","保固登錄、維修與售後服務"]
];
const KPI=[
 ["visibility","處方調閱","1","分鐘","▼ 較 8 分"],
 ["campaign","回購回訪率","78","%","▲ +37%"],
 ["schedule","訂片逾時率","3.5","%","▼ 較 15%"],
 ["timer","取件等待","2","天","▼ 較 6 天"]
];
const MEMB=[
 ["王美玲","V3","VIP · 近視+老花 · 偏好無框","近效 2026/06","累消 $48,200"],
 ["陳建宏","V2","金卡 · 高度近視 · 抗藍光","近效 2026/07","累消 $31,600"],
 ["林淑芬","V3","VIP · 散光 · 漸進多焦","近效 2026/05","累消 $52,900"],
 ["黃志偉","V1","一般 · 隱形眼鏡月拋","近效 2026/07","累消 $12,400"],
 ["吳雅婷","V2","金卡 · 變色片 · 太陽眼鏡","近效 2026/04","累消 $27,800"],
 ["張家豪","V1","一般 · 兒童鏡 · 防藍光","近效 2026/06","累消 $8,900"],
 ["劉冠廷","V2","金卡 · 運動鏡 · 偏光","近效 2026/07","累消 $22,300"]
];
const RECENT=[
 ["王美玲","漸進多焦鏡片","2026/06/18","$18,800"],
 ["林淑芬","抗藍光鏡片","2026/06/15","$9,200"],
 ["劉冠廷","偏光太陽眼鏡","2026/06/12","$6,800"],
 ["吳雅婷","變色鏡片","2026/06/10","$11,400"]
];
const ORDERS=[
 ["OPT-24618","王美玲","漸進多焦 1.67 · 鈦金屬無框","$18,800",3,["接單","訂片","研磨","取件"]],
 ["OPT-24617","陳建宏","抗藍光 1.60 · 板材全框","$9,600",2,["接單","訂片","研磨","取件"]],
 ["OPT-24616","黃志偉","隱形眼鏡月拋 6 片","$3,200",1,["接單","訂片","備貨","取件"]],
 ["OPT-24615","張家豪","兒童防藍光 1.56 · 矽膠框","$4,800",4,["接單","訂片","研磨","取件"]]
];
const STOCK=[
 ["鏡片","1.67 非球面抗藍光",18,50,"g-bad"],
 ["鏡片","1.60 漸進多焦",34,40,"g-wait"],
 ["鏡片","1.56 變色片",62,50,"g-ok"],
 ["鏡框","鈦金屬無框系列",22,20,"g-ok"],
 ["鏡框","板材全框 復古款",9,25,"g-bad"],
 ["隱形","月拋透明 -3.00~-6.00",140,80,"g-ok"],
 ["隱形","日拋散光 軸度組",26,60,"g-wait"],
 ["配件","超音波清洗液",48,30,"g-ok"]
];
const REORDER=[
 ["1.67 非球面抗藍光","依視路","18 / 50","+80","已下單","g-info"],
 ["板材全框 復古款","精工鏡框","9 / 25","+40","待到料","g-wait"],
 ["日拋散光 軸度組","豪雅","26 / 60","+60","已到料","g-ok"]
];
const RECALL=[
 ["schedule","王美玲","漸進鏡配鏡滿 12 個月，建議回店複驗","2026/06/25","g-wait","待通知"],
 ["contact_phone","黃志偉","月拋隱形眼鏡預估用罄，回訂提醒","2026/06/20","g-ok","已通知"],
 ["visibility","陳建宏","度數變化達 0.75D，建議重新驗光","2026/06/22","g-wait","待通知"],
 ["cake","張家豪","會員生日禮 · 鏡片清潔保養招待","2026/06/28","g-info","已排程"],
 ["wb_sunny","吳雅婷","變色片保固將滿，換季配鏡優惠","2026/07/02","g-ok","已通知"]
];
const WARR=[
 ["OPT-24580 · 王美玲","漸進多焦鏡片 · 保固內免費研磨微調","done","保固中 · 至 2027/06","已完成"],
 ["OPT-24552 · 劉冠廷","偏光鏡片刮傷 · 保固換片受理","cur","處理中 · 鏡片訂購中","進行中"],
 ["OPT-24499 · 陳建宏","鏡框鉸鏈鬆動 · 到店免費調整","done","保固中 · 至 2026/12","已完成"],
 ["OPT-24470 · 吳雅婷","變色片褪色異常 · 原廠檢測","warn","待原廠回覆 · 已逾 3 日","待處理"]
];
const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[0]+'</span>'+m[1]+(m[2]?'<span class="badge">'+m[2]+'</span>':'');b.onclick=()=>show(i);nav.appendChild(b);});

const kpiRow=()=>`<div class="kpis">${KPI.map(k=>`<div class="kpi"><div class="l"><span class="material-symbols-outlined">${k[0]}</span>${k[1]}</div><div class="v">${k[2]}<small> ${k[3]}</small></div><div class="d">${k[4]}</div></div>`).join('')}</div>`;
const trackHtml=(steps,cur)=>`<div class="track">${steps.map((s,i)=>`<div class="st ${i<cur?'done':i==cur?'cur':''}"><div class="dot">${i<cur?'<span class="material-symbols-outlined" style="font-size:14px">check</span>':i+1}</div>${s}</div>`).join('')}</div>`;

const SCREENS=[
 // 0 顧客會員
 ()=>kpiRow()+`<div class="grid" style="grid-template-columns:1.25fr .95fr">

function draw(i){
 if(i==0){const el=document.getElementById('c_tier');if(el){echarts.init(el).setOption({tooltip:{trigger:'item'},legend:{bottom:0,textStyle:{fontSize:11}},series:[{type:'pie',radius:['45%','72%'],center:['50%','42%'],label:{fontSize:11},data:[{value:38,name:'VIP',itemStyle:{color:'#6366f1'}},{value:32,name:'金卡',itemStyle:{color:'#818cf8'}},{value:30,name:'一般',itemStyle:{color:'#c7d2fe'}}]}]});}}
 if(i==1){const el=document.getElementById('c_rx');if(el){echarts.init(el).setOption({grid:{left:44,right:14,top:20,bottom:28},tooltip:{trigger:'axis'},xAxis:{type:'category',data:['2020','2021','2022','2024','2026'],axisLabel:{fontSize:11}},yAxis:{type:'value',min:-4,max:-2.5,axisLabel:{fontSize:11}},series:[{type:'line',data:[-2.75,-3.00,-3.00,-3.25,-3.25],smooth:true,symbolSize:8,lineStyle:{width:3,color:'#6366f1'},itemStyle:{color:'#6366f1'},areaStyle:{color:'rgba(99,102,241,.12)'}}]});}}
 if(i==2){const el=document.getElementById('c_ord');if(el){echarts.init(el).setOption({tooltip:{trigger:'item'},legend:{bottom:0,textStyle:{fontSize:11}},series:[{type:'pie',radius:['42%','70%'],center:['50%','42%'],label:{fontSize:11},data:[{value:6,name:'接單',itemStyle:{color:'#c7d2fe'}},{value:9,name:'訂片',itemStyle:{color:'#818cf8'}},{value:11,name:'研磨',itemStyle:{color:'#6366f1'}},{value:14,name:'待取件',itemStyle:{color:'#4338ca'}}]}]});}}
 if(i==4){const el=document.getElementById('c_recall');if(el){echarts.init(el).setOption({grid:{left:40,right:14,top:16,bottom:26},tooltip:{trigger:'axis'},xAxis:{type:'category',data:['<6月','6-12月','1-2年','2年+'],axisLabel:{fontSize:11}},yAxis:{type:'value',axisLabel:{fontSize:11}},series:[{type:'bar',data:[420,880,1240,640],barWidth:'52%',itemStyle:{color:'#6366f1',borderRadius:[6,6,0,0]}}]});}}
}
function show(i){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));vt.textContent=MOD[i][1];vd.textContent=MOD[i][3];view.innerHTML=`<div class="vh"><div><h2>${MOD[i][1]}</h2><p>${MOD[i][3]}</p></div></div>`+SCREENS[i]();draw(i);}
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
