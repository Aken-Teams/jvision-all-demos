.grid-item:nth-child(2){animation-delay:.06s}.grid-item:nth-child(3){animation-delay:.12s}.grid-item:nth-child(4){animation-delay:.18s}

()=>`<div class="grid" style="grid-template-columns:1.2fr 1fr"><section class="card grid-item"><h3><span class="material-symbols-outlined">visibility</span>驗光處方卡 · 王美玲</h3><div class="rx"><div class="rx-top"><span class="avatar">王</span><div><b>王美玲 · <span class="code">A00218</span></b><small>女 · 62 歲 · VIP · 驗光師：李明遠 · 2026/06/18</small></div></div><div class="scroll"><table class="rxtbl"><thead><tr><th>眼別</th><th>球面 SPH</th><th>散光 CYL</th><th>軸度 AXIS</th><th>ADD</th><th>視力</th></tr></thead><tbody><tr><td class="eye">右 OD</td><td>-3.25</td><td>-0.75</td><td>175°</td><td>+2.00</td><td>1.0</td></tr><tr><td class="eye">左 OS</td><td>-3.50</td><td>-1.00</td><td>10°</td><td>+2.00</td><td>1.0</td></tr></tbody></table></div><div class="pd"><div><b>62 / 60</b><span>瞳距 PD (遠/近)</span></div><div><b>+2.00</b><span>閱讀加入度</span></div><div><b>18mm</b><span>鏡框高度</span></div><div><b>漸進</b><span>建議鏡片</span></div></div></div><div class="actions"><button class="btn"><span class="material-symbols-outlined">save</span>儲存處方並轉配鏡</button><button class="btn secondary">列印處方單</button></div></section><section class="card grid-item"><h3><span class="material-symbols-outlined">show_chart</span>度數變化趨勢（右眼球面）</h3><div class="chart" id="c_rx"></div><div class="note"><span class="material-symbols-outlined">info</span> 本次右眼球面較前次增加 <b>0.25D</b>、左眼 <b>0.25D</b>，變化在正常範圍內，建議一年後複驗。</div></section></div>`,

()=>`<div class="grid"><section class="card grid-item"><h3><span class="material-symbols-outlined">inventory_2</span>鏡框鏡片庫存 <span class="tag danger" style="margin-left:auto">安全量不足 2</span></h3><div class="stock-grid">${STOCK.map(s=>{const low=s[2]<s[3],pct=Math.min(100,Math.round(s[2]/(s[3]*1.4)*100));return `<article class="stock-card"><div class="stock-head"><b>${s[1]}</b>${low?'<span class="tag danger">訂片</span>':'<span class="tag ok">庫存正常</span>'}</div><div class="stock-type">${s[0]}</div><div class="bar"><i class="${low?"low":""}" style="width:${pct}%"></i></div><small class="numeric">現量 ${s[2]} · 安全量 ${s[3]}</small></article>`}).join("")}</div></section><section class="card grid-item"><h3><span class="material-symbols-outlined">local_shipping</span>訂片補貨追蹤（低於安全量自動轉訂）</h3><div class="scroll"><table><thead><tr><th>品項</th><th>供應商</th><th>現量 / 安全</th><th>建議補量</th><th>狀態</th></tr></thead><tbody>${REORDER.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td class="numeric">${r[2]}</td><td class="numeric" style="text-align:right">${r[3]}</td><td><span class="tag ${r[5]}">${r[4]}</span></td></tr>`).join("")}</tbody></table></div></section></div>`,
()=>`<div class="grid" style="grid-template-columns:1.25fr .9fr"><section class="card grid-item"><h3><span class="material-symbols-outlined">notifications_active</span>回購與回訪名單</h3>${RECALL.map(r=>`<div class="recall"><span class="recall-icon"><span class="material-symbols-outlined">${r[0]}</span></span><div class="member-info"><b>${r[1]}</b><small>${r[2]}</small></div><div class="recall-status"><time>${r[3]}</time><span class="tag ${r[4]}">${r[5]}</span></div></div>`).join("")}</section><div class="grid"><section class="card grid-item"><h3><span class="material-symbols-outlined">bar_chart</span>回購週期分佈</h3><div class="chart" id="c_recall"></div></section><section class="card grid-item" style="background:#F0FDF4"><h3><span class="material-symbols-outlined">campaign</span>自動推播</h3><div style="font-size:13px;line-height:1.8">系統依 <b>配鏡週期、隱形眼鏡用量與處方效期</b>，自動排定回購提醒並推播簡訊 / LINE。<br/>本週已發送 <b class="numeric">86</b> 則、回覆預約 <b class="numeric">54</b> 位。</div></section></div></div>`,
()=>`<div class="grid" style="grid-template-columns:1.15fr 1fr"><section class="card grid-item"><h3><span class="material-symbols-outlined">verified_user</span>保固與售後案件</h3><div class="timeline">${WARR.map(w=>`<div class="timeline-item ${w[2]}"><div class="timeline-dot"></div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b>${w[0]}</b><span class="tag ${w[2]==="done"?"ok":w[2]==="late"?"danger":"info"}">${w[4]}</span></div><small>${w[1]}</small><span class="time">${w[3]}</span></div>`).join("")}</div></section><section class="card grid-item"><h3><span class="material-symbols-outlined">assignment_add</span>保固登錄</h3><div class="form"><label class="field"><span>配鏡單號</span><input value="OPT-24618"/></label><label class="field"><span>會員</span><input value="王美玲 · A00218"/></label><label class="field"><span>保固品項</span><select><option>漸進多焦鏡片</option><option>鏡框</option><option>變色 / 偏光鏡片</option></select></label><label class="field"><span>保固期限</span><input value="2 年（至 2028/06/18）"/></label><label class="field full"><span>保固內容</span><textarea rows="2">鏡片刮傷 1 次免費換片、鏡框終身免費調整、度數半年內不適應可重新研磨。</textarea></label><label class="field full"><span>備註</span><textarea rows="2">會員為高度近視漸進鏡，配戴適應期較長，取件時已完成鼻墊與鏡腳微調。</textarea></label></div><div class="actions"><button class="btn"><span class="material-symbols-outlined">verified</span>建立保固卡</button><button class="btn secondary">受理維修</button></div></section></div>`
];
const chartText={color:"#475569",fontFamily:"Nunito Sans"};
function draw(i){
 if(i===0){const e=document.getElementById("c_tier");if(e)echarts.init(e).setOption({tooltip:{trigger:"item"},legend:{bottom:0,textStyle:chartText},series:[{type:"pie",radius:["46%","72%"],center:["50%","43%"],label:{color:"#334155"},data:[{value:38,name:"VIP",itemStyle:{color:"#047857"}},{value:32,name:"金卡",itemStyle:{color:"#10B981"}},{value:30,name:"一般",itemStyle:{color:"#A7F3D0"}}]}]})}
 if(i===1){const e=document.getElementById("c_rx");if(e)echarts.init(e).setOption({grid:{left:45,right:14,top:20,bottom:30},tooltip:{trigger:"axis"},xAxis:{type:"category",data:["2020","2021","2022","2024","2026"],axisLabel:chartText},yAxis:{type:"value",min:-4,max:-2.5,axisLabel:chartText},series:[{type:"line",data:[-2.75,-3,-3,-3.25,-3.25],smooth:true,symbolSize:8,lineStyle:{width:3,color:"#059669"},itemStyle:{color:"#EA580C"},areaStyle:{color:"rgba(16,185,129,.16)"}}]})}
 if(i===2){const e=document.getElementById("c_ord");if(e)echarts.init(e).setOption({tooltip:{trigger:"item"},legend:{bottom:0,textStyle:chartText},series:[{type:"pie",radius:["43%","70%"],center:["50%","42%"],label:{color:"#334155"},data:[{value:6,name:"接單",itemStyle:{color:"#A7F3D0"}},{value:9,name:"訂片",itemStyle:{color:"#34D399"}},{value:11,name:"研磨",itemStyle:{color:"#059669"}},{value:14,name:"待取件",itemStyle:{color:"#EA580C"}}]}]})}
 if(i===4){const e=document.getElementById("c_recall");if(e)echarts.init(e).setOption({grid:{left:45,right:14,top:16,bottom:30},tooltip:{trigger:"axis"},xAxis:{type:"category",data:["<6月","6-12月","1-2年","2年+"],axisLabel:chartText},yAxis:{type:"value",axisLabel:chartText},series:[{type:"bar",data:[420,880,1240,640],barWidth:"52%",itemStyle:{color:"#059669",borderRadius:[5,5,0,0]}}]})}
}
function show(i){
 nav.querySelectorAll("button").forEach(b=>{const on=+b.dataset.i===i;b.classList.toggle("on",on);b.setAttribute("aria-current",on?"page":"false")});
 vt.textContent=MOD[i][1];vd.textContent=MOD[i][3];
 view.innerHTML=`<div class="view-head"><div><h2>${MOD[i][1]}</h2><p>${MOD[i][3]}</p></div></div>${SCREENS[i]()}`;
 draw(i);
}
function fromHash(){
 const m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
 const i=m?Math.min(+m[1],MOD.length-1):0;
 show(i);
 try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
window.addEventListener("resize",()=>{document.querySelectorAll(".chart").forEach(el=>{const c=echarts.getInstanceByDom(el);if(c)c.resize()})});
fromHash();
</script>
