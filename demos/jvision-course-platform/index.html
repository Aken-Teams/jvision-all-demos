<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
  :root{
    --accent:#c2410c; --accent2:#fb923c; --accent-soft:#fff1e9;
    --ink:#1c1917; --muted:#78716c; --line:#ece7e2; --bg:#faf8f6; --card:#ffffff;
    --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Inter","Noto Sans TC",sans-serif; color:var(--ink);
    background:var(--bg); font-size:14px; line-height:1.5; overflow-x:hidden;
  }
  .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
  .app{display:flex;min-height:100vh;}
  /* ==== LEFT NAV (list pane) ==== */
  .sidebar{
    width:248px;flex:none;background:linear-gradient(180deg,#7c2d12,#9a3412);
    color:#fff;display:flex;flex-direction:column;padding:18px 14px;gap:4px;
    position:sticky;top:0;height:100vh;min-width:0;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;}
  .brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent2),#fdba74);display:flex;align-items:center;justify-content:center;color:#7c2d12;flex:none;}
  .brand .logo .material-symbols-outlined{font-size:24px;}
  .brand b{font-size:15px;font-weight:800;letter-spacing:.3px;display:block;}
  .brand span{font-size:11px;color:#fed7aa;}
  .nav{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .navbtn{
    display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;
    background:transparent;border:0;color:#fde4d3;cursor:pointer;text-align:left;
    font-family:inherit;font-size:13.5px;font-weight:500;width:100%;transition:.15s;min-width:0;
  }
  .navbtn .material-symbols-outlined{font-size:21px;flex:none;}
  .navbtn .nb-t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .navbtn:hover{background:rgba(255,255,255,.09);color:#fff;}
  .navbtn.active{background:#fff;color:var(--accent);font-weight:700;box-shadow:0 6px 16px rgba(0,0,0,.18);}
  .navbtn .nb-n{margin-left:auto;font-size:11px;font-weight:700;color:#fdba74;flex:none;}
  .navbtn.active .nb-n{color:var(--accent2);}
  .side-foot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid rgba(255,255,255,.14);}
  .side-foot .who{display:flex;align-items:center;gap:9px;}
  .side-foot .av{width:32px;height:32px;border-radius:50%;background:var(--accent2);display:flex;align-items:center;justify-content:center;color:#7c2d12;font-weight:700;flex:none;}
  .side-foot small{color:#fed7aa;font-size:11px;}
  .side-foot .nm{font-size:12.5px;font-weight:600;}
  /* ==== MAIN ==== */
  .main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    display:flex;align-items:center;gap:14px;padding:14px 22px;background:var(--card);
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap;
  }
  .topbar .tt{min-width:0;}
  .topbar .tt h1{font-size:17px;margin:0;font-weight:800;}
  .topbar .tt p{margin:2px 0 0;font-size:12px;color:var(--muted);}
  .topbar .sp{margin-left:auto;}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;}
  .pill .material-symbols-outlined{font-size:16px;}
  .content{padding:22px;min-width:0;}
  /* ==== generic building blocks ==== */
  .grid{display:grid;gap:16px;min-width:0;}
  .g4{grid-template-columns:repeat(4,1fr);}
  .g3{grid-template-columns:repeat(3,1fr);}
  .g2{grid-template-columns:repeat(2,1fr);}
  .split{grid-template-columns:340px 1fr;}
  .split2{grid-template-columns:1fr 1.4fr;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;}
  .card.pad0{padding:0;overflow:hidden;}
  .ch{display:flex;align-items:center;gap:9px;margin:0 0 14px;}
  .ch h3{margin:0;font-size:14.5px;font-weight:700;}
  .ch .material-symbols-outlined{font-size:19px;color:var(--accent);}
  .ch .sub{font-size:11.5px;color:var(--muted);font-weight:400;margin-left:2px;}
  .ch .rt{margin-left:auto;font-size:12px;color:var(--muted);}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0;position:relative;overflow:hidden;}
  .kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:64px;height:64px;border-radius:50%;background:var(--accent-soft);opacity:.7;}
  .kpi .kl{font-size:12px;color:var(--muted);font-weight:600;position:relative;}
  .kpi .kv{font-size:26px;font-weight:800;margin:6px 0 2px;position:relative;letter-spacing:-.5px;}
  .kpi .kd{font-size:11.5px;font-weight:700;position:relative;display:inline-flex;align-items:center;gap:3px;}
  .kpi .kd .material-symbols-outlined{font-size:15px;}
  .up{color:var(--ok);} .down{color:var(--bad);} .flat{color:var(--muted);}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
  th{font-size:11.5px;color:var(--muted);font-weight:700;background:#fcfaf9;}
  tbody tr:hover{background:var(--accent-soft);}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
  .tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;}
  .t-ok{background:#dcfce7;color:#166534;} .t-warn{background:#fef3c7;color:#92400e;}
  .t-bad{background:#fee2e2;color:#991b1b;} .t-info{background:#dbeafe;color:#1e40af;}
  .t-mut{background:#f1efec;color:#57534e;} .t-acc{background:var(--accent-soft);color:var(--accent);}
  .bar{height:8px;border-radius:999px;background:#f1efec;overflow:hidden;min-width:60px;}
  .bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
  .avatar{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex:none;}
  .rowlist{display:flex;flex-direction:column;}
  .rowitem{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);min-width:0;}
  .rowitem:last-child{border-bottom:0;}
  .muted{color:var(--muted);}
  .mini{font-size:11.5px;color:var(--muted);}
  /* list-detail pane (signature) */
  .lp{display:flex;flex-direction:column;gap:8px;max-height:560px;overflow:auto;padding-right:4px;min-width:0;}
  .litem{border:1px solid var(--line);border-radius:13px;padding:12px 13px;background:#fff;transition:.15s;min-width:0;}
  .litem.sel{border-color:var(--accent2);box-shadow:0 4px 14px rgba(194,65,12,.13);background:#fffaf6;}
  .litem .lt{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:7px;}
  .litem .lm{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:8px;}
  /* chapter tree */
  .chtree{display:flex;flex-direction:column;gap:0;}
  .chsec{border-left:2px solid var(--accent2);padding:0 0 4px 0;margin-left:8px;}
  .chsec .sec-h{display:flex;align-items:center;gap:9px;padding:9px 0 9px 14px;position:relative;font-weight:700;font-size:13px;}
  .chsec .sec-h::before{content:"";position:absolute;left:-7px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent2);}
  .chunit{display:flex;align-items:center;gap:10px;padding:8px 0 8px 26px;font-size:12.5px;border-top:1px dashed var(--line);min-width:0;}
  .chunit .du{margin-left:auto;color:var(--muted);font-size:11px;flex:none;}
  .chunit .material-symbols-outlined{font-size:17px;color:var(--accent);flex:none;}
  /* heat cells */
  .heat{display:grid;grid-template-columns:auto repeat(10,minmax(30px,1fr));gap:4px;min-width:560px;align-items:center;}
  .heat .hl{font-size:11px;color:var(--muted);white-space:nowrap;padding-right:4px;}
  .hc{height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:700;}
  /* funnel */
  .funnel{display:flex;flex-direction:column;gap:8px;}
  .fstep{display:flex;align-items:center;gap:12px;min-width:0;}
  .fbar{height:38px;border-radius:9px;display:flex;align-items:center;padding:0 12px;color:#fff;font-weight:700;font-size:13px;min-width:0;}
  .fmeta{font-size:12px;color:var(--muted);flex:none;width:104px;}
  .legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:10px;font-size:11.5px;color:var(--muted);}
  .legend b{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--ink);}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .cert{border:1px solid var(--line);border-radius:14px;padding:16px;background:linear-gradient(135deg,#fffaf6,#fff);position:relative;overflow:hidden;min-width:0;}
  .cert .seal{position:absolute;right:12px;top:12px;width:44px;height:44px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent);}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:600;font-size:12.5px;cursor:default;font-family:inherit;}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;}
  /* RWD */
  @media(max-width:1100px){ .split{grid-template-columns:300px 1fr;} }
  @media(max-width:860px){
    .app{flex-direction:column;}
    .sidebar{width:auto;height:auto;position:static;flex-direction:column;padding:12px;}
    .nav{flex-direction:row;flex-wrap:wrap;}
    .navbtn{width:auto;flex:none;}
    .side-foot{display:none;}
    .brand{padding:2px 6px 10px;}
  }
  @media(max-width:820px){
    .g4,.g3,.g2,.split,.split2{grid-template-columns:1fr;}
  }
  @media(max-width:560px){
    .navbtn .nb-t,.navbtn .nb-n{display:none;}
    .navbtn{padding:9px;}
    .content{padding:14px;}
  }
</style>
</head>

function kpi(l,v,d,dir){
  var cls=dir>0?"up":(dir<0?"down":"flat");
  var ic=dir>0?"trending_up":(dir<0?"trending_down":"trending_flat");
  return '<div class="kpi"><div class="kl">'+l+'</div><div class="kv">'+v+'</div>'+
    (d?'<div class="kd '+cls+'"><span class="material-symbols-outlined">'+ic+'</span>'+d+'</div>':'')+'</div>';

/* ================= SHOW ================= */
var RENDER=[s0,s1,s2,s3,s4,s5];
var INIT=[null,null,init2,init3,init4,init5];
function show(i){
  i=Math.max(0,Math.min(i,5));
  killCharts();
  var c=document.getElementById("screen");
  c.innerHTML=RENDER[i]();
  document.getElementById("tbT").textContent=MODS[i].n;
  document.getElementById("tbP").textContent=MODS[i].d;
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){btns[k].classList.toggle("active",+btns[k].getAttribute("data-i")===i);}
  void c.offsetHeight;
  if(INIT[i])INIT[i]();
}
/* build nav */
(function(){
  var nav=document.getElementById("nav");
  var h="";
  for(var i=0;i<MODS.length;i++){
    h+='<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].i+'</span><span class="nb-t">'+MODS[i].n+'</span><span class="nb-n">0'+i+'</span></button>';
  }
  nav.innerHTML=h;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){btns[j].addEventListener("click",function(){show(+this.getAttribute("data-i"));try{window.scrollTo(0,0);}catch(e){}});}
})();
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m)return;var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
