<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>產線模擬系統 DES · 離散事件模擬工作站</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --acc:#16a34a;--acc2:#4ade80;--acc-d:#0f7a34;
  --bg:#f2f6f3;--panel:#ffffff;--ink:#0f1c14;--mut:#5c6b61;
  --line:#e2ebe4;--soft:#eef5ef;--warn:#e2711d;--bad:#dc2626;--info:#2563eb;
  --sh:0 1px 2px rgba(15,40,22,.06),0 8px 24px rgba(15,40,22,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.mi{font-family:"Material Symbols Outlined";font-size:20px;line-height:1;vertical-align:middle}
.wrap{max-width:1360px;margin:0 auto;padding:0 16px 40px}
header.top{
  background:linear-gradient(115deg,#0f7a34,#16a34a 55%,#4ade80);
  color:#fff;padding:16px 0 14px;box-shadow:0 6px 18px rgba(15,80,40,.18)
}
.top-in{max-width:1360px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.16);
  display:flex;align-items:center;justify-content:center;flex:none;border:1px solid rgba(255,255,255,.3)
}
.logo .mi{font-size:26px}
.brand h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.3px}
.brand p{margin:2px 0 0;font-size:12px;opacity:.9}
.top-meta{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.chip{
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);
  border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;white-space:nowrap
}
nav{
  position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:9px 0;margin-bottom:18px;box-shadow:0 2px 10px rgba(15,40,22,.04)
}
.nav-in{max-width:1360px;margin:0 auto;padding:0 16px;display:flex;gap:8px;flex-wrap:wrap}
.nb{
  flex:none;white-space:nowrap;min-width:0;cursor:pointer;
  display:flex;align-items:center;gap:8px;border:1px solid var(--line);
  background:#fff;color:var(--mut);padding:8px 13px;border-radius:11px;
  font-family:inherit;font-size:13px;font-weight:600;transition:.16s
}
.nb .idx{
  width:20px;height:20px;border-radius:6px;background:var(--soft);color:var(--acc-d);
  font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none
}
.nb:hover{border-color:var(--acc2);color:var(--acc-d)}
.nb.on{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 4px 12px rgba(22,163,74,.28)}
.nb.on .idx{background:rgba(255,255,255,.24);color:#fff}
.sc-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.sc-ic{
  width:46px;height:46px;border-radius:13px;flex:none;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(22,163,74,.3)
}
.sc-ic .mi{font-size:26px}
.sc-head h2{margin:0;font-size:20px;font-weight:800}
.sc-head p{margin:3px 0 0;font-size:13px;color:var(--mut);max-width:640px}
.sc-tag{margin-left:auto;align-self:center;font-size:12px;font-weight:700;color:var(--acc-d);background:var(--soft);border:1px solid var(--line);padding:6px 12px;border-radius:999px;white-space:nowrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh)}
.pad{padding:16px}
.min0{min-width:0}
h3.blk{margin:0 0 12px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
h3.blk .mi{color:var(--acc);font-size:20px}
.muted{color:var(--mut)}
.sub{font-size:12px;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--sh);min-width:0}
.kpi .kl{font-size:12px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .kl .mi{font-size:17px;color:var(--acc)}
.kpi .kv{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:.5px}
.kpi .kv small{font-size:13px;font-weight:600;color:var(--mut)}
.kpi .kd{font-size:11px;margin-top:4px;font-weight:600}
.up{color:var(--acc)}.down{color:var(--bad)}.flat{color:var(--mut)}
.split{display:grid;grid-template-columns:340px 1fr;gap:16px}
.split.wide{grid-template-columns:380px 1fr}
.listcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.listhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.searchbar{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:13px;color:var(--mut)}
.searchbar .mi{font-size:18px}
.litem{
  background:var(--panel);border:1px solid var(--line);border-left:4px solid transparent;
  border-radius:12px;padding:11px 13px;cursor:pointer;transition:.15s;min-width:0
}
.litem:hover{border-color:var(--acc2);transform:translateX(2px)}
.litem.on{border-left-color:var(--acc);background:linear-gradient(90deg,var(--soft),#fff 60%);box-shadow:var(--sh)}
.litem .lt{font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.litem .lm{font-size:12px;color:var(--mut);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.detailcol{min-width:0;display:flex;flex-direction:column;gap:14px}
.bdg{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.bdg.g{background:#e6f6ec;color:var(--acc-d)}
.bdg.y{background:#fdf1e3;color:var(--warn)}
.bdg.r{background:#fdeaea;color:var(--bad)}
.bdg.b{background:#e8f0fe;color:var(--info)}
.bdg.gray{background:#eef1ef;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap;font-weight:700}
tbody td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--soft)}
.num{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.scroll{overflow-x:auto}
.meter{height:8px;border-radius:6px;background:var(--soft);overflow:hidden;min-width:60px}
.meter>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.meter.warn>i{background:linear-gradient(90deg,#e2711d,#f2a65a)}
.meter.bad>i{background:linear-gradient(90deg,#dc2626,#f87171)}
.chart{width:100%;height:300px}
.chart.sm{height:240px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.flowmap{display:flex;align-items:stretch;gap:10px;overflow-x:auto;padding:4px}
.fnode{flex:none;width:150px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;position:relative}
.fnode .fn-t{font-weight:700;font-size:13px}
.fnode .fn-s{font-size:11px;color:var(--mut);margin-top:2px}
.fnode .fn-b{margin-top:8px}
.farrow{flex:none;align-self:center;color:var(--acc);font-size:22px}
.matrix{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mcard{border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--panel);min-width:0}
.prow{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px dashed var(--line)}
.prow:last-child{border-bottom:0}
.runbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:14px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring .rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .rt b{font-size:22px;font-weight:800}
.ring .rt span{font-size:10px;color:var(--mut)}
.log{font-family:"Inter",monospace;font-size:12px;background:#0f1c14;color:#c9f2d6;border-radius:12px;padding:12px 14px;max-height:230px;overflow:auto;line-height:1.7}
.log .lg-t{color:#67d98a;font-weight:700}
.log .lg-w{color:#f2b46a}
.log .lg-i{color:#8fd0ff}
.repstrip{display:flex;gap:6px;flex-wrap:wrap}
.repdot{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.heatrow{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;margin-bottom:8px}
.heatcells{display:flex;gap:5px;overflow-x:auto}
.hc{flex:none;width:34px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#0f1c14}
.cmpwrap{overflow-x:auto}
.cmp{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
.cmp th,.cmp td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:center}
.cmp th:first-child,.cmp td:first-child{text-align:left;font-weight:700}
.cmp thead th{background:var(--soft);font-weight:800}
.cmp .best{background:#e6f6ec;color:var(--acc-d);font-weight:800;border-radius:8px}
.dec{display:flex;flex-direction:column;gap:10px}
.decrow{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);min-width:0}
.decrow .dic{width:38px;height:38px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--acc)}
.decrow .dbody{min-width:0;flex:1}
.decrow .dbody .dt{font-weight:700;font-size:14px}
.decrow .dbody .dd{font-size:12px;color:var(--mut);margin-top:2px}
.stepper{display:flex;gap:8px;flex-wrap:wrap}
.step{flex:1;min-width:120px;border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--panel)}
.step .sn{width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.step.now{border-color:var(--acc);box-shadow:0 4px 12px rgba(22,163,74,.18)}
.step.wait .sn{background:#cbd5cd}
.foot{margin-top:26px;padding:16px;text-align:center;color:var(--mut);font-size:12px;border-top:1px solid var(--line)}
@media(max-width:860px){
  .split,.split.wide{grid-template-columns:1fr}
  nav{position:static}
}
@media(max-width:820px){
  .kpis{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr}
  .matrix{grid-template-columns:1fr}
}
@media(max-width:560px){
  .nb .lbl{display:none}
  .nb{padding:8px 10px}
  .kpis{grid-template-columns:1fr 1fr}
  .sc-tag{display:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="logo"><span class="mi">precision_manufacturing</span></div>
      <div class="min0">
        <h1>產線模擬系統 · DES 工作站</h1>
        <p>Discrete Event Simulation — 建模、情境設定、瓶頸診斷到方案決策</p>
      </div>
    </div>
    <div class="top-meta">
      <span class="chip"><span class="mi" style="font-size:15px">factory</span> 廠區 A2 沖壓組裝線</span>
      <span class="chip"><span class="mi" style="font-size:15px">memory</span> 引擎 v4.2</span>
      <span class="chip"><span class="mi" style="font-size:15px">schedule</span> 2026-08-14</span>
    </div>
  </div>
</header>

<nav>
  <div class="nav-in" id="nav"></div>
</nav>

<div class="wrap">
  <div id="app"></div>
  <div class="foot">產線模擬系統（Discrete Event Simulation, DES）· 純前端 UI 展示 · 模擬數據僅供介面示意</div>
</div>

<script>
"use strict";
var NAV=[
  {ic:"account_tree",t:"產線建模"},
  {ic:"tune",t:"情境設定"},
  {ic:"play_circle",t:"模擬運算"},
  {ic:"linear_scale",t:"瓶頸分析"},
  {ic:"compare_arrows",t:"方案比較"},
  {ic:"verified",t:"決策採納"}
];
var HEADS=[
  {ic:"account_tree",t:"產線建模",d:"匯入站別、工序工時、緩衝與物流路徑，建立可執行的離散事件模型。",tag:"MODEL · v0"},
  {ic:"tune",t:"情境設定",d:"設定班次、換線、緩衝與 What-if 參數，定義多組待比較的模擬情境。",tag:"SCENARIO · v1"},
  {ic:"play_circle",t:"模擬運算",d:"啟動離散事件引擎批次運算，監控複本數、隨機種子與收斂進度。",tag:"RUN · v2"},
  {ic:"linear_scale",t:"瓶頸分析",d:"解讀站別稼動、等待時間與 WIP 熱點，定位限制產能的瓶頸站別。",tag:"ANALYZE · v3"},
  {ic:"compare_arrows",t:"方案比較",d:"並列比較各情境的產能、WIP、成本與交期達成，找出最佳配置。",tag:"COMPARE · v4"},
  {ic:"verified",t:"決策採納",d:"核定最佳方案，登錄實施項目與模擬預測驗證追蹤紀錄。",tag:"DECIDE · v5"}
];

var STATIONS=[
  {id:"ST-01",name:"上料備料",ct:22,util:71,wip:3,mc:2,type:"手動"},
  {id:"ST-02",name:"沖壓成型",ct:34,util:94,wip:9,mc:1,type:"設備"},
  {id:"ST-03",name:"去毛邊",ct:19,util:63,wip:2,mc:2,type:"手動"},
  {id:"ST-04",name:"焊接工作站",ct:41,util:97,wip:12,mc:1,type:"設備"},
  {id:"ST-05",name:"組裝線 A",ct:28,util:82,wip:5,mc:3,type:"手動"},
  {id:"ST-06",name:"視覺檢測",ct:24,util:76,wip:4,mc:1,type:"設備"},
  {id:"ST-07",name:"包裝入庫",ct:18,util:58,wip:2,mc:2,type:"手動"}
];

function el(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function utilBadge(v){var c=v>=92?"r":v>=82?"y":"g";return '<span class="bdg '+c+'">'+v+'%</span>';}
var CHARTS={};
function chart(id,opt){
  var dom=el(id);if(!dom)return;
  if(CHARTS[id]){try{CHARTS[id].dispose();}catch(e){}CHARTS[id]=null;}
  var c=echarts.init(dom);c.setOption(opt);CHARTS[id]=c;
}
function disposeAll(){for(var k in CHARTS){if(CHARTS[k]){try{CHARTS[k].dispose();}catch(e){}}}CHARTS={};}
var GREEN="#16a34a",GREEN2="#4ade80",AXIS="#5c6b61",SPLIT="#e2ebe4";

function screen0(){
  var sel=STATIONS[3];
  var rows=STATIONS.map(function(s,i){
    return '<div class="litem'+(i===3?' on':'')+'" data-st="'+i+'" onclick="pickStation('+i+')">'+
      '<div class="lt">'+esc(s.name)+' '+utilBadge(s.util)+'</div>'+
      '<div class="lm"><span>'+s.id+'</span><span>週期 '+s.ct+'s</span><span>WIP '+s.wip+'</span><span>'+s.type+'</span></div>'+
    '</div>';
  }).join("");
  return ''+
  '<div class="kpis">'+
    kpi("hub","站別總數","7","站","含 2 設備瓶頸候選","flat")+
    kpi("timer","線平衡率","78.4","%","目標 ≥ 85%","down")+
    kpi("conveyor_belt","理論節拍","41","s/pc","受 ST-04 限制","flat")+
    kpi("inventory_2","線上 WIP","37","件","建模基準值","flat")+
  '</div>'+
  '<div class="card pad" style="margin-bottom:16px">'+
    '<h3 class="blk"><span class="mi">lan</span>產線佈局流程圖</h3>'+
    '<div class="flowmap">'+flowMap()+'</div>'+
  '</div>'+
  '<div class="split wide">'+
    '<div class="listcol">'+
      '<div class="listhead"><h3 class="blk" style="margin:0"><span class="mi">view_list</span>站別清單</h3><span class="sub">7 站</span></div>'+
      '<div class="searchbar"><span class="mi">search</span>搜尋站別 / 工序…</div>'+
      rows+
    '</div>'+
    '<div class="detailcol" id="stDetail">'+stationDetail(sel)+'</div>'+
  '</div>';
}
function flowMap(){
  var h="";
  STATIONS.forEach(function(s,i){
    var c=s.util>=92?"r":s.util>=82?"y":"g";
    h+='<div class="fnode"><div class="fn-t">'+esc(s.name)+'</div><div class="fn-s">'+s.id+' · '+s.ct+'s</div><div class="fn-b"><span class="bdg '+c+'">稼動 '+s.util+'%</span></div></div>';
    if(i<STATIONS.length-1)h+='<div class="farrow"><span class="mi">east</span></div>';
  });
  return h;
}
function stationDetail(s){
  return ''+
  '<div class="card pad">'+
    '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">'+
      '<div class="sc-ic" style="width:42px;height:42px"><span class="mi">precision_manufacturing</span></div>'+
      '<div class="min0"><div style="font-size:17px;font-weight:800">'+esc(s.name)+'</div><div class="sub">'+s.id+' · '+s.type+'工站 · 平行機台 '+s.mc+'</div></div>'+
      '<div style="margin-left:auto">'+utilBadge(s.util)+'</div>'+
    '</div>'+
    '<div class="grid3" style="margin-top:14px">'+
      miniStat("週期時間",s.ct+"s")+miniStat("在製 WIP",s.wip+" 件")+miniStat("平行機台",s.mc+" 台")+
    '</div>'+
  '</div>'+
  '<div class="grid2">'+
    '<div class="card pad min0"><h3 class="blk"><span class="mi">schema</span>工序工時分佈</h3><div id="c0a" class="chart sm"></div></div>'+
    '<div class="card pad min0"><h3 class="blk"><span class="mi">route</span>物流路徑參數</h3>'+
      '<div class="scroll"><table><thead><tr><th>連線</th><th>運送方式</th><th class="num">距離(m)</th><th class="num">傳送(s)</th></tr></thead><tbody>'+
      [["ST-03→ST-04","輸送帶",6.2,8],["ST-04→ST-05","AGV",14.0,26],["ST-05→ST-06","輸送帶",4.8,6],["ST-06→ST-07","人工推車",9.5,18]].map(function(r){
        return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td class="num">'+r[2].toFixed(1)+'</td><td class="num">'+r[3]+'</td></tr>';
      }).join("")+
      '</tbody></table></div>'+
    '</div>'+
  '</div>';
}
function pickStation(i){
  var s=STATIONS[i];
  document.querySelectorAll("[data-st]").forEach(function(n){n.classList.toggle("on",+n.getAttribute("data-st")===i);});
  var d=el("stDetail");if(!d)return;
  d.innerHTML=stationDetail(s);
  void d.offsetHeight;
  drawStationChart(s);
}
function drawStationChart(s){
  var names=["上料","定位","加工","檢核","卸料"];
  var base=[s.ct*0.18,s.ct*0.14,s.ct*0.42,s.ct*0.14,s.ct*0.12];
  chart("c0a",{
    grid:{left:44,right:14,top:16,bottom:28},
    tooltip:{trigger:"axis"},
    xAxis:{type:"category",data:names,axisLabel:{color:AXIS},axisLine:{lineStyle:{color:SPLIT}}},
    yAxis:{type:"value",name:"秒",axisLabel:{color:AXIS},splitLine:{lineStyle:{color:SPLIT}}},

        [["08-11","採納 SC-F 為量產配置","廠長 / 廠務規劃","g","核定"],["08-12","啟動焊接併機採購","製造工程","b","執行中"],["08-13","建立預測驗證追蹤表","工業工程","g","核定"],["08-14","排定三班人力評估","生管","y","評估中"]].map(function(r){
          return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td><span class="bdg '+r[3]+'">'+r[4]+'</span></td></tr>';
        }).join("")+
        '</tbody></table></div>'+
      '</div>'+
    '</div>'+
  '</div>';
}
function drawDecision(){
  var weeks=["W1","W2","W3","W4","W5","W6"];
  chart("c5a",{
    grid:{left:48,right:16,top:30,bottom:30},
    tooltip:{trigger:"axis"},
    legend:{data:["模擬預測產出","實際量產產出"],textStyle:{color:AXIS},top:0},
    xAxis:{type:"category",data:weeks,axisLabel:{color:AXIS},axisLine:{lineStyle:{color:SPLIT}}},
    yAxis:{type:"value",name:"pcs/日",min:800,axisLabel:{color:AXIS},splitLine:{lineStyle:{color:SPLIT}}},
    series:[
      {name:"模擬預測產出",type:"line",data:[905,905,905,905,905,905],lineStyle:{type:"dashed",width:2,color:GREEN2},itemStyle:{color:GREEN2},symbol:"none"},
      {name:"實際量產產出",type:"line",data:[862,881,893,900,908,912],smooth:true,lineStyle:{width:3,color:GREEN},itemStyle:{color:GREEN},areaStyle:{color:"rgba(22,163,74,.12)"},symbolSize:7}
    ]
  });
}

function kpi(ic,l,v,u,d,dir){
  var ac=dir==="up"?"up":dir==="down"?"down":"flat";
  var arrow=dir==="up"?"north_east":dir==="down"?"south_east":"remove";
  return '<div class="kpi"><div class="kl"><span class="mi">'+ic+'</span>'+l+'</div>'+
    '<div class="kv">'+v+(u?' <small>'+u+'</small>':'')+'</div>'+
    '<div class="kd '+ac+'"><span class="mi" style="font-size:14px;vertical-align:-2px">'+arrow+'</span> '+d+'</div></div>';
}
function miniStat(l,v){return '<div class="mcard"><div class="sub">'+l+'</div><div style="font-size:20px;font-weight:800;margin-top:4px">'+v+'</div></div>';}

function buildNav(){
  el("nav").innerHTML=NAV.map(function(n,i){
    return '<button class="nb" data-i="'+i+'" onclick="show('+i+')"><span class="idx">'+i+'</span><span class="mi">'+n.ic+'</span><span class="lbl">'+n.t+'</span></button>';
  }).join("");
}
function show(i){
  disposeAll();
  document.querySelectorAll(".nb").forEach(function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i);});
  var h=HEADS[i];
  var head='<div class="sc-head"><div class="sc-ic"><span class="mi">'+h.ic+'</span></div>'+
    '<div class="min0"><h2>'+h.t+'</h2><p>'+h.d+'</p></div><span class="sc-tag">'+h.tag+'</span></div>';
  var body=[screen0,screen1,screen2,screen3,screen4,screen5][i]();
  var c=el("app");
  c.innerHTML=head+body;
  void c.offsetHeight;
  if(i===0)drawStationChart(STATIONS[3]);
  else if(i===1)drawScenRadar(SCEN[1]);
  else if(i===2)drawRunChart();
  else if(i===3)drawBottleneck();
  else if(i===4){drawCompare();drawCompareBar();}
  else if(i===5)drawDecision();
}
window.addEventListener("resize",function(){for(var k in CHARTS){if(CHARTS[k]){try{CHARTS[k].resize();}catch(e){}}}});
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
