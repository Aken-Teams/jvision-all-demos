<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>藥局申報管理 · Pharmacy Claim Console</title>
<meta name="description" content="健保調劑申報一站式作業：處方輸入、藥價維護、申報檢核、藥袋部分負擔、批次請款與藥品耗用分析（純 UI 展示）。"/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--accent:#1d4ed8;--accent2:#60a5fa;--ink:#0f1c33;--bg:#eef2fb;--card:#fff;--line:#e2e8f4;--mut:#64748b;--ok:#059669;--warn:#f59e0b;--bad:#e11d48;--dark:#0f2247;--dark2:#173163;--soft:#eaf1ff}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.shell{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
.shell>*{min-width:0}
/* dark sidebar */
.side{background:linear-gradient(185deg,var(--dark),#0a1730);color:#dbe4f5;padding:18px 14px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;overflow:auto}
.side .bd{display:flex;align-items:center;gap:11px;padding:4px 8px 16px}
.side .lg{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 8px 22px rgba(29,78,216,.5)}
.side .lg .material-symbols-outlined{font-size:25px}
.side .bd b{font-size:15px;font-weight:900;font-family:"Noto Sans TC";display:block;line-height:1.2;color:#fff}
.side .bd span{font-size:9.5px;color:var(--accent2);letter-spacing:1.4px;font-weight:800}
.nlabel{font-size:10px;font-weight:800;color:#7c93bd;letter-spacing:1px;padding:12px 10px 5px}
.side button{display:flex;align-items:center;gap:11px;background:transparent;border:0;color:#c3d1ea;font:inherit;font-weight:600;font-size:13.5px;padding:10px 12px;border-radius:11px;cursor:pointer;text-align:left;width:100%;font-family:"Noto Sans TC"}
.side button .ic{font-size:20px;color:#7f9bcf;flex:none}
.side button:hover{background:rgba(96,165,250,.12)}
.side button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(29,78,216,.4)}
.side button.on .ic{color:#fff}
.side button .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .foot{margin-top:auto;padding:12px 10px 2px;font-size:11px;color:#8ea3c8;border-top:1px solid rgba(255,255,255,.09);line-height:1.7}
.side .foot b{color:var(--accent2)}
/* main */
.main{padding:22px 26px 44px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.vh h2{margin:0;font-size:22px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:5px 0 0;color:var(--mut);font-size:13px}
.vhr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.live{background:#e0ecff;color:var(--accent);padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:p 1.5s infinite}
@keyframes p{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.6)}}
.chip{background:#fef3c7;color:#b45309;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 17px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent),var(--accent2))}
.kpi .l{font-size:12px;color:var(--mut);font-weight:700}
.kpi .v{font-size:25px;font-weight:900;margin-top:5px;font-family:Inter}
.kpi .d{font-size:11.5px;font-weight:700;margin-top:3px}
.up{color:var(--ok)}.dn{color:var(--bad)}.wn{color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:14.5px;font-family:"Noto Sans TC";font-weight:900;display:flex;align-items:center;gap:8px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.card h3 .sub{font-size:11px;color:var(--mut);font-weight:600;margin-left:auto}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid2>*,.grid2b>*,.grid3>*{min-width:0}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;color:var(--mut);font-weight:800;letter-spacing:.3px;text-transform:uppercase}
tbody tr:hover{background:var(--soft)}
td.num,th.num{text-align:right;font-family:Inter;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:800}
.t-ok{background:#dcfce7;color:#15803d}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#ffe4e6;color:#be123c}.t-info{background:#dbeafe;color:#1d4ed8}.t-mut{background:#eef2f7;color:#64748b}
.bar{height:8px;border-radius:6px;background:#eef2f9;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.chartbox{width:100%;height:280px}
.mut{color:var(--mut)}
.pill{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:800;background:var(--soft);color:var(--accent)}
/* prescription form (screen0) */
.rxwrap{display:grid;grid-template-columns:1fr 320px;gap:16px}
.rxwrap>*{min-width:0}
.field{margin-bottom:11px}
.field label{display:block;font-size:11px;font-weight:800;color:var(--mut);margin-bottom:4px}
.field .val{background:#f5f8ff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13px;font-weight:700}
.frow{display:flex;gap:10px}.frow>*{flex:1;min-width:0}
.rxsummary{background:linear-gradient(160deg,var(--dark),#12285a);color:#dbe4f5;border-radius:14px;padding:16px 17px}
.rxsummary .big{font-size:30px;font-weight:900;color:#fff;font-family:Inter}
.rxsummary .row{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.09)}
.rxsummary .row b{color:#fff}
.btnrow{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;border:0;border-radius:10px;padding:11px;font:inherit;font-weight:800;font-family:"Noto Sans TC";cursor:pointer}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn.gho{background:rgba(255,255,255,.1);color:#dbe4f5;border:1px solid rgba(255,255,255,.2)}
/* check list (screen2) */
.chkitem{display:flex;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);align-items:flex-start}
.chkitem:last-child{border-bottom:0}
.chkic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.chkic .material-symbols-outlined{font-size:20px}
.ic-ok{background:#dcfce7;color:#15803d}.ic-bad{background:#ffe4e6;color:#be123c}.ic-warn{background:#fef3c7;color:#b45309}
.chkbody{flex:1;min-width:0}
.chkbody b{font-size:13px;font-family:"Noto Sans TC"}
.chkbody p{margin:3px 0 0;font-size:12px;color:var(--mut)}
/* bag / label (screen3) */
.baglabel{border:2px dashed var(--accent);border-radius:12px;padding:15px 16px;background:#f8fbff;min-width:280px}
.baglabel .hd{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--dark);padding-bottom:8px;margin-bottom:10px;gap:8px}
.baglabel .hd b{font-size:16px;font-family:"Noto Sans TC";font-weight:900}
.baglabel .med{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px dotted var(--line);gap:10px}
.baglabel .med b{font-family:"Noto Sans TC"}
.baglabel .med span{color:var(--mut);white-space:nowrap}
.barcode{height:40px;background:repeating-linear-gradient(90deg,#0f2247 0 2px,#fff 2px 4px,#0f2247 4px 7px,#fff 7px 9px);border-radius:4px;margin-top:12px}
.copay{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.copay>*{min-width:0}
.copay .box{background:#f5f8ff;border:1px solid var(--line);border-radius:11px;padding:12px 14px}
.copay .box .l{font-size:11px;color:var(--mut);font-weight:700}
.copay .box .v{font-size:22px;font-weight:900;margin-top:3px;font-family:Inter}
/* batch timeline (screen4) */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tli{position:relative;padding:0 0 18px 4px}
.tli::before{content:"";position:absolute;left:-21px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid var(--card);box-shadow:0 0 0 2px var(--accent)}
.tli.done::before{background:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.tli.wait::before{background:#cbd5e1;box-shadow:0 0 0 2px #cbd5e1}
.tli b{font-size:13px;font-family:"Noto Sans TC"}
.tli p{margin:2px 0 0;font-size:12px;color:var(--mut)}
.tli .tm{font-size:11px;color:var(--accent);font-weight:800}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
@media(max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 14px}
  .side .bd{padding:0 8px 0 0;width:100%}
  .side .nlabel,.side .foot{display:none}
  .side button{width:auto;flex:none;white-space:nowrap;padding:9px 13px}
}
@media(max-width:820px){
  .kpis{grid-template-columns:1fr 1fr}
  .grid2,.grid2b,.grid3{grid-template-columns:1fr}
  .rxwrap{grid-template-columns:1fr}
}
@media(max-width:560px){
  .main{padding:16px 14px 40px}
  .side button .tx{display:none}
  .side button{padding:9px}
  .kpis{grid-template-columns:1fr 1fr}
  .copay{grid-template-columns:1fr}
}
@media(max-width:400px){.kpis{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="bd">
      <div class="lg"><span class="material-symbols-outlined">prescriptions</span></div>
      <div><b>藥局申報管理</b><span>PHARMACY CLAIM</span></div>
    </div>
    <div class="nlabel">調劑申報作業</div>
    <nav id="nav"></nav>
    <div class="foot">健保調劑申報 · <b>純 UI 展示</b><br/>資料為模擬示意，未串接後端。</div>
  </aside>
  <main class="main">
    <div id="view"></div>
  </main>
</div>
<script>
var NAV=[
  {ic:"prescriptions",t:"處方調劑輸入"},
  {ic:"price_change",t:"健保藥價維護"},
  {ic:"fact_check",t:"申報檢核"},
  {ic:"print",t:"藥袋與部分負擔"},
  {ic:"receipt_long",t:"歷史申報請款"},
  {ic:"monitoring",t:"藥品耗用分析"}
];
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});};
var nf=function(n){try{return Number(n).toLocaleString("en-US");}catch(e){return String(n);}};

/* ---------- fake data ---------- */
var RXLINES=[
  {code:"AC46745100",name:"Amoxicillin 250mg 膠囊",spec:"膠囊",qty:21,days:7,freq:"TID",price:1.8,co:38},
  {code:"BC24512100",name:"Acetaminophen 500mg 錠",spec:"錠",qty:15,days:5,freq:"TID PRN",price:0.9,co:14},
  {code:"AC58231200",name:"Loratadine 10mg 錠",spec:"錠",qty:7,days:7,freq:"QD",price:2.4,co:17},
  {code:"BC77120400",name:"Dextromethorphan 糖漿",spec:"mL",qty:120,days:6,freq:"TID",price:0.35,co:42}
];
var PRICE=[
  {code:"AC46745100",name:"Amoxicillin 250mg 膠囊",old:1.70,now:1.80,eff:"2026/08/01",st:"調升"},
  {code:"BC24512100",name:"Acetaminophen 500mg 錠",old:0.90,now:0.90,eff:"2026/07/01",st:"未異動"},
  {code:"AC58231200",name:"Loratadine 10mg 錠",old:2.60,now:2.40,eff:"2026/08/01",st:"調降"},
  {code:"BC77120400",name:"Dextromethorphan 糖漿",old:0.35,now:0.35,eff:"2026/05/01",st:"未異動"},
  {code:"AC91002700",name:"Metformin 500mg 錠",old:1.20,now:1.35,eff:"2026/08/01",st:"調升"},
  {code:"BC33440800",name:"Omeprazole 20mg 膠囊",old:3.10,now:2.85,eff:"2026/08/01",st:"調降"}
];
var CHECKS=[
  {st:"bad",t:"用法用量超過健保上限",d:"處方 #RX-20260813-018 Loratadine 每日 2 顆超過核價上限，需醫師註記或調整。",code:"E-217"},
  {st:"bad",t:"重複用藥交互作用警示",d:"同批含 Amoxicillin 與 Doxycycline，系統偵測潛在重複抗生素，請確認。",code:"W-108"},
  {st:"warn",t:"藥價檔版本落後",d:"3 筆藥品仍套用 2026/07 藥價，建議更新至 2026/08 版本再送。",code:"W-051"},
  {st:"warn",t:"部分負擔金額四捨五入差異",d:"處方 #RX-20260813-024 部分負擔計算與收費相差 1 元，請核對。",code:"W-090"},
  {st:"ok",t:"申報格式檢核通過",d:"XML 表頭、身分註記、就醫序號欄位皆符合健保署格式規範。",code:"P-000"},
  {st:"ok",t:"就醫類別與案類相符",d:"門診藥事服務案類 (AD) 與調劑點數一致，無案類錯置。",code:"P-000"}
];
var BATCH=[
  {id:"B-202607-01",period:"115年07月",cnt:1842,pts:486210,st:"已核付",rate:"98.4%",tag:"t-ok"},
  {id:"B-202606-01",period:"115年06月",cnt:1790,pts:471880,st:"已核付",rate:"97.9%",tag:"t-ok"},
  {id:"B-202606-02",period:"115年06月補",cnt:64,pts:15320,st:"部分退補",rate:"84.2%",tag:"t-warn"},
  {id:"B-202605-01",period:"115年05月",cnt:1731,pts:452640,st:"已核付",rate:"99.1%",tag:"t-ok"},
  {id:"B-202608-01",period:"115年08月",cnt:1108,pts:298540,st:"送件中",rate:"—",tag:"t-info"}
];
var USAGE=[
  {name:"Amoxicillin 250mg",qty:12840,cost:23112,share:14},
  {name:"Acetaminophen 500mg",qty:20450,cost:18405,share:11},
  {name:"Metformin 500mg",qty:9860,cost:13311,share:8},
  {name:"Omeprazole 20mg",qty:7120,cost:20292,share:12},
  {name:"Loratadine 10mg",qty:6540,cost:15696,share:9},
  {name:"其他藥品",qty:38220,cost:76410,share:46}
];

/* ---------- helpers ---------- */
function vhead(h,p,extra){
  return '<div class="vh"><div><h2>'+h+'</h2><p>'+p+'</p></div><div class="vhr">'+
    '<span class="live"><i></i>作業中</span><span class="chip">'+(extra||'2026/08/13')+'</span></div></div>';
}
function kpi(l,v,d,cls){
  return '<div class="kpi"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="d '+(cls||'')+'">'+d+'</div></div>';
}

/* ---------- screen renderers ---------- */
function s0(){
  var total=0,co=0;
  var rows=RXLINES.map(function(r){
    var sub=r.qty*r.price; total+=sub; co+=r.co;
    return '<tr><td><b>'+esc(r.name)+'</b><div class="mut" style="font-size:11px">'+esc(r.code)+'</div></td>'+
      '<td class="num">'+r.qty+' '+esc(r.spec)+'</td><td>'+esc(r.freq)+'</td><td class="num">'+r.days+' 天</td>'+
      '<td class="num">$'+r.price.toFixed(2)+'</td><td class="num">$'+sub.toFixed(1)+'</td></tr>';
  }).join("");
  var meds=RXLINES.length;
  return vhead("處方調劑輸入","依醫師處方箋登錄藥品、劑量與天數，即時產生調劑明細與點數")+
  '<div class="rxwrap">'+
    '<div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">badge</span>病患與處方資訊<span class="sub">RX-20260813-031</span></h3>'+
        '<div class="frow"><div class="field"><label>病患姓名</label><div class="val">陳○宏（男 / 48）</div></div>'+
        '<div class="field"><label>健保卡號</label><div class="val">A12●●●●892</div></div></div>'+
        '<div class="frow"><div class="field"><label>就醫序號</label><div class="val">IC-0038-2609</div></div>'+
        '<div class="field"><label>處方醫師</label><div class="val">林志明 內科</div></div>'+
        '<div class="field"><label>身分別</label><div class="val">一般 / 門診</div></div></div>'+
      '</div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">medication</span>調劑明細<span class="sub">共 '+meds+' 項藥品</span></h3>'+
        '<div style="overflow-x:auto"><table><thead><tr><th>藥品 / 健保碼</th><th class="num">數量</th><th>用法</th><th class="num">天數</th><th class="num">單價</th><th class="num">小計</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
      '</div>'+
    '</div>'+
    '<div>'+
      '<div class="rxsummary"><div style="font-size:12px;color:#a9c1ea;font-weight:800">本次調劑總藥費</div>'+
        '<div class="big">$'+total.toFixed(1)+'</div>'+
        '<div class="row"><span>藥品項數</span><b>'+meds+' 項</b></div>'+
        '<div class="row"><span>調劑服務費</span><b>$69</b></div>'+
        '<div class="row"><span>部分負擔（藥品）</span><b>$'+co+'</b></div>'+
        '<div class="row" style="border:0"><span>申報點數</span><b>'+nf(Math.round(total)+69)+' 點</b></div>'+
        '<div class="btnrow"><button class="btn pri">確認調劑</button><button class="btn gho">暫存</button></div>'+
      '</div>'+
      '<div class="card" style="margin-top:16px"><h3><span class="material-symbols-outlined">verified</span>調劑核對</h3>'+
        '<div class="chkitem"><div class="chkic ic-ok"><span class="material-symbols-outlined">check</span></div><div class="chkbody"><b>藥品與處方一致</b><p>4 項藥品皆比對通過</p></div></div>'+
        '<div class="chkitem"><div class="chkic ic-ok"><span class="material-symbols-outlined">check</span></div><div class="chkbody"><b>健保碼有效</b><p>無停用 / 過期健保碼</p></div></div>'+
        '<div class="chkitem"><div class="chkic ic-warn"><span class="material-symbols-outlined">priority_high</span></div><div class="chkbody"><b>待藥師覆核</b><p>抗生素需藥師簽章</p></div></div>'+
      '</div>'+
    '</div>'+
  '</div>';
}

function s1(){
  var rows=PRICE.map(function(p){
    var diff=(p.now-p.old);

function show(i){
  var nav=document.getElementById("nav").querySelectorAll("[data-i]");
  for(var k=0;k<nav.length;k++){nav[k].className=(+nav[k].getAttribute("data-i")===i)?"on":"";}
  disposeCharts();
  var c=document.getElementById("view");
  c.innerHTML=(RENDER[i]||RENDER[0])();
  void c.offsetHeight;
  initCharts(i);
}

(function buildNav(){
  var html=NAV.map(function(n,i){
    return '<button data-i="'+i+'"><span class="material-symbols-outlined ic">'+n.ic+'</span><span class="tx">'+n.t+'</span></button>';
  }).join("");
  var nav=document.getElementById("nav");
  nav.innerHTML=html;
  nav.addEventListener("click",function(e){
    var b=e.target.closest("[data-i]");if(!b)return;
    show(+b.getAttribute("data-i"));
    try{window.scrollTo(0,0);}catch(x){}
  });
})();
show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m)return;var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
