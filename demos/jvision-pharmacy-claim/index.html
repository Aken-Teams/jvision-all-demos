<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>藥局申報管理 · Pharmacy Claim Console</title>
<meta name="description" content="健保調劑申報一站式作業：處方輸入、藥價維護、申報檢核、藥袋部分負擔、批次請款與藥品耗用分析（純 UI 展示）。"/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#0891B2;--color-on-primary:#000;
  --color-secondary:#22D3EE;--color-on-secondary:#0F172A;
  --color-accent:#059669;--color-on-accent:#000;
  --color-background:#ECFEFF;--color-foreground:#164E63;
  --color-card:#FFF;--color-card-foreground:#164E63;
  --color-muted:#E8F1F6;--color-muted-foreground:#475569;
  --color-border:#A5F3FC;--color-destructive:#DC2626;
  --color-on-destructive:#FFF;--color-ring:#0891B2;
  --blue:#0891B2;--ink:#164E63;--muted:#475569;--line:#A5F3FC;
  --ok:#047857;--warn:#9A6700;--bad:#B91C1C;--mono:ui-monospace,SFMono-Regular,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Atkinson Hyperlegible","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit}
button,[data-i]{cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:auto}
.brand{display:flex;align-items:center;gap:12px;padding:2px 8px 22px;border-bottom:1px solid var(--line)}
.logo{width:42px;height:42px;display:grid;place-items:center;background:var(--color-primary);color:#001F27;border:1px solid #06758F}
.logo svg{width:23px;height:23px}
.brand b{display:block;font-size:17px;line-height:1.15}
.brand small{display:block;margin-top:4px;color:var(--muted);font-size:10px;letter-spacing:.12em}
.nlabel{padding:20px 10px 8px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.1em}
nav{display:grid;gap:4px}
.side button{width:100%;min-height:44px;display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid transparent;background:transparent;color:var(--muted);font-weight:700;text-align:left;transition:background .2s,border-color .2s,color .2s,transform .2s}
.side button svg{width:20px;height:20px;flex:none}
.side button:hover{background:var(--color-muted);border-color:var(--line);color:var(--ink);transform:translateX(2px)}
.side button.on{background:#CFFAFE;border-color:var(--color-primary);color:#083344;box-shadow:3px 3px 0 #67E8F9}
.foot{margin-top:auto;padding:18px 10px 2px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.55}
.foot b{color:var(--color-primary)}
.main{min-width:0;padding:28px clamp(16px,3vw,42px) 48px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:20px}
.vh h1{margin:0;font-size:clamp(24px,2.5vw,36px);line-height:1.05;letter-spacing:-.035em}
.vh p{max-width:720px;margin:8px 0 0;color:var(--muted);font-size:14px}
.vhr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge,.tag,.pill{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:4px 9px;border:1px solid;border-radius:3px;font-size:12px;font-weight:700;white-space:nowrap}
.live{color:#075985;background:#CFFAFE;border-color:#67E8F9}
.live::before{content:"";width:8px;height:8px;background:var(--color-primary);border:2px solid #fff;box-shadow:0 0 0 1px var(--color-primary)}
.date{color:#334155;background:#fff;border-color:var(--line);font-family:var(--mono)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{position:relative;min-height:126px;padding:16px;background:var(--color-card);border:1px solid var(--line);box-shadow:4px 4px 0 #CFFAFE;transition:transform .22s,box-shadow .22s}
.kpi:hover{transform:translateY(-3px);box-shadow:6px 7px 0 #A5F3FC}
.kpi::before{content:"";position:absolute;left:-1px;top:-1px;width:5px;height:45px;background:var(--color-primary)}
.kpi .l{color:var(--muted);font-size:12px;font-weight:700}
.kpi .v{margin-top:10px;color:#083344;font-size:clamp(22px,2vw,30px);font-weight:700;font-variant-numeric:tabular-nums}
.kpi .d{margin-top:5px;font-size:12px;font-weight:700}
.card{min-width:0;margin-bottom:16px;padding:18px;background:var(--color-card);border:1px solid var(--line);box-shadow:3px 3px 0 #CFFAFE}
.card h2{display:flex;align-items:center;gap:9px;margin:0 0 16px;font-size:16px}
.card h2 svg{width:20px;height:20px;color:var(--color-primary)}
.card h2 .sub{margin-left:auto;color:var(--muted);font-family:var(--mono);font-size:11px;font-weight:400}
.grid2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr);gap:16px}
.rxwrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px}
.overflow{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px;border-bottom:1px solid #D7EEF2;text-align:left;white-space:nowrap}
th{background:#F0FDFF;color:#334155;border-top:1px solid var(--line);font-size:11px;letter-spacing:.035em}
tbody tr{transition:background .2s}
tbody tr:hover{background:#ECFEFF}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.num,td code,.mono{font-family:var(--mono)}
td code{color:#475569;font-size:11px}
.mut{color:var(--muted)}
.up{color:var(--ok)}.dn{color:var(--bad)}.wn{color:var(--warn)}
.tag{min-height:24px;padding:2px 7px;border-radius:2px}
.t-ok{color:#065F46;background:#D1FAE5;border-color:#6EE7B7}
.t-warn{color:#713F12;background:#FEF3C7;border-color:#FCD34D}
.t-bad{color:#991B1B;background:#FEE2E2;border-color:#FCA5A5}
.t-info{color:#075985;background:#CFFAFE;border-color:#67E8F9}
.t-mut{color:#334155;background:#F1F5F9;border-color:#CBD5E1}
.pill{min-height:22px;padding:1px 6px;color:#075985;background:#ECFEFF;border-color:var(--line);font-family:var(--mono)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fields.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.field label{display:block;margin-bottom:5px;color:var(--muted);font-size:11px;font-weight:700}
.val{min-height:40px;padding:10px 11px;background:#F8FAFC;border:1px solid #CBD5E1;font-size:13px;font-weight:700}
.summary{padding:18px;background:#083344;color:#CFFAFE;border:1px solid #155E75;box-shadow:5px 5px 0 #67E8F9}
.summary .caption{font-size:12px;font-weight:700}
.summary .big{margin:5px 0 12px;color:#fff;font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.summary .row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #155E75;font-size:13px}
.summary .row b{color:#fff}
.btnrow{display:flex;gap:8px;margin-top:16px}
.btn{min-height:44px;flex:1;padding:9px 12px;border:1px solid;font-weight:700;transition:transform .2s,background .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px)}
.btn.pri{background:var(--color-accent);border-color:#047857;color:#001D14;box-shadow:3px 3px 0 #6EE7B7}
.btn.ghost{background:transparent;border-color:#67E8F9;color:#fff}
.chkitem{display:flex;gap:12px;padding:13px 3px;border-bottom:1px solid #D7EEF2}
.chkitem:last-child{border-bottom:0}
.chkic{width:34px;height:34px;display:grid;place-items:center;flex:none;border:1px solid}
.chkic svg{width:19px;height:19px}
.ic-ok{color:#065F46;background:#D1FAE5;border-color:#6EE7B7}
.ic-warn{color:#713F12;background:#FEF3C7;border-color:#FCD34D}
.ic-bad{color:#991B1B;background:#FEE2E2;border-color:#FCA5A5}
.chkbody{min-width:0;flex:1}
.chkbody b{font-size:13px}
.chkbody p{margin:4px 0 0;color:var(--muted);font-size:12px;line-height:1.45}
.chartbox{width:100%;height:280px}
.baglabel{min-width:620px;padding:17px;background:#FAFEFF;border:2px solid var(--color-primary)}
.baglabel .hd{display:flex;justify-content:space-between;gap:12px;padding-bottom:10px;margin-bottom:10px;border-bottom:3px solid #164E63}
.baglabel .med{display:flex;justify-content:space-between;gap:15px;padding:8px 0;border-bottom:1px dashed #94A3B8;font-size:13px}
.barcode{height:42px;margin-top:14px;background:repeating-linear-gradient(90deg,#083344 0 2px,#fff 2px 4px,#083344 4px 7px,#fff 7px 9px)}
.copay{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.copay .box{padding:12px;background:#F0FDFF;border:1px solid var(--line)}
.copay .l{color:var(--muted);font-size:11px}
.copay .v{margin-top:5px;font-size:23px;font-weight:700;font-variant-numeric:tabular-nums}
.tl{position:relative;padding-left:30px}
.tl::before{content:"";position:absolute;left:10px;top:5px;bottom:5px;width:2px;background:#CBD5E1}
.tli{position:relative;padding:0 0 20px}
.tli::before{content:"";position:absolute;left:-25px;top:3px;width:12px;height:12px;background:var(--color-primary);border:3px solid #fff;box-shadow:0 0 0 2px var(--color-primary)}
.tli.done::before{background:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.tli.wait::before{background:#64748B;box-shadow:0 0 0 2px #64748B}
.tli .tm{color:#075985;font-family:var(--mono);font-size:11px;font-weight:700}
.tli p{margin:3px 0 0;color:var(--muted);font-size:12px}
.bar{height:9px;background:#E2E8F0;border:1px solid #CBD5E1}
.bar i{display:block;height:100%;background:var(--color-primary)}
.legend{display:flex;gap:15px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.legend i{display:inline-block;width:11px;height:11px;margin-right:5px;border:1px solid currentColor}
#view>*{animation:enter .4s cubic-bezier(.2,.75,.3,1) both}
#view>.kpis{animation-delay:.04s}
#view>.grid2,#view>.rxwrap{animation-delay:.08s}
@keyframes enter{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
@media(max-width:980px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;padding:12px}
  .brand{padding:0 4px 12px}
  nav{display:flex;overflow-x:auto;padding:4px 0}
  .side button{width:auto;flex:none}
  .nlabel,.foot{display:none}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .grid2,.rxwrap{grid-template-columns:1fr}
}
@media(max-width:600px){
  .main{padding:20px 12px 40px}
  .vh{align-items:flex-start;flex-direction:column}
  .kpis{grid-template-columns:1fr}
  .fields,.fields.three,.copay{grid-template-columns:1fr}
  .side button span{display:none}
  .card{padding:14px}
  th,td{padding:9px 8px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
