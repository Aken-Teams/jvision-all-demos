<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>再生能源憑證與綠電採購 · ESG 永續管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000000;
  --color-secondary:#10b981;
  --color-on-secondary:#0f172a;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#ecfdf5;
  --color-foreground:#064e3b;
  --color-card:#ffffff;
  --color-card-foreground:#064e3b;
  --color-muted:#e8f1f3;
  --color-muted-foreground:#475569;
  --color-border:#a7f3d0;
  --color-destructive:#dc2626;
  --color-on-destructive:#ffffff;
  --color-ring:#059669;

  --blue:#059669;
  --ink:#064e3b;
  --muted:#475569;
  --line:#a7f3d0;
  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --accent-soft:#d1fae5;
  --accent-soft2:#ecfdf5;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --th:#f0fdf4;
  --hov:#ecfdf5;
  --track:#dbece7;
  --sidebar:#053f32;
  --sidebar2:#075b46;
  --side-edge:rgba(167,243,208,.22);
  --ok:#047857;
  --warn:#a16207;
  --bad:#dc2626;
  --info:#0369a1;
  --r:20px;
  --shadow:0 12px 32px rgba(6,78,59,.08),0 2px 8px rgba(6,78,59,.04);
  --shadow-hover:0 18px 40px rgba(6,78,59,.13),0 4px 12px rgba(6,78,59,.06);
  --glow:rgba(16,185,129,.24);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:"Fira Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 92% 4%,rgba(16,185,129,.14),transparent 25rem),
    radial-gradient(circle at 8% 92%,rgba(5,150,105,.09),transparent 30rem),
    var(--bg);
  color:var(--ink);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,a,[role="button"]{cursor:pointer}
h1,h2,h3,h4{margin:0;font-family:"Fira Sans",system-ui,sans-serif;color:var(--ink)}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px;border-radius:10px}
::selection{background:#a7f3d0;color:#064e3b}

.app{display:flex;min-height:100vh;position:relative}
.app::before{
  content:"";position:fixed;right:-110px;top:-130px;width:360px;height:360px;pointer-events:none;z-index:0;
  border-radius:42% 58% 63% 37% / 45% 39% 61% 55%;
  background:linear-gradient(145deg,rgba(167,243,208,.42),rgba(209,250,229,.08));
}
.sidebar{
  width:254px;flex:none;min-width:0;position:sticky;top:0;z-index:3;height:100vh;
  display:flex;flex-direction:column;padding:25px 17px 20px;color:#ecfdf5;
  background:linear-gradient(165deg,var(--sidebar) 0%,var(--sidebar2) 72%,#047857 100%);
  border-right:1px solid var(--side-edge);overflow:hidden;
}
.sidebar::after{
  content:"";position:absolute;left:-90px;bottom:-120px;width:280px;height:280px;pointer-events:none;
  border:1px solid rgba(167,243,208,.16);border-radius:63% 37% 44% 56% / 38% 62% 38% 62%;
  box-shadow:0 0 0 34px rgba(167,243,208,.04),0 0 0 68px rgba(167,243,208,.025);
}
.brand{display:flex;align-items:center;gap:12px;padding:2px 7px 24px;min-width:0;position:relative;z-index:1}
.brand-logo{
  width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;
  border-radius:15px 20px 14px 19px;background:#d1fae5;color:#065f46;
  border:1px solid rgba(255,255,255,.48);box-shadow:0 8px 22px rgba(0,0,0,.16);
}
.brand-logo .material-symbols-outlined{font-size:25px}
.brand-txt{min-width:0}
.brand-txt b{display:block;color:#fff;font-weight:700;font-size:16px;letter-spacing:.35px}
.brand-txt span{display:block;margin-top:2px;color:#a7f3d0;font-family:"Fira Code",monospace;font-size:9.5px;letter-spacing:1.35px}
.nav{display:flex;flex-direction:column;gap:6px;margin-top:5px;min-width:0;position:relative;z-index:1}
.nav button{
  min-width:0;min-height:46px;display:flex;align-items:center;gap:11px;padding:11px 12px;
  border:1px solid transparent;border-radius:13px 18px 13px 18px;background:transparent;color:#d1fae5;
  text-align:left;font-size:13.5px;font-weight:500;white-space:nowrap;
  transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .2s ease;
}
.nav button .material-symbols-outlined{font-size:20px;flex:none}
.nav button:hover{background:rgba(255,255,255,.1);border-color:rgba(167,243,208,.22);color:#fff;transform:translateX(2px)}
.nav button.on{background:#ecfdf5;color:#065f46;border-color:#a7f3d0;box-shadow:0 10px 24px rgba(0,0,0,.14);font-weight:700}
.nav .idx{margin-left:auto;color:inherit;opacity:.62;font-family:"Fira Code",monospace;font-size:10px;font-weight:600}
.side-foot{margin-top:auto;padding:15px 9px 3px;border-top:1px solid rgba(167,243,208,.2);color:#bbf7d0;font-size:10.5px;line-height:1.75;position:relative;z-index:1}
.side-foot b{color:#fff;font-family:"Fira Code",monospace}

.main{flex:1;min-width:0;position:relative;z-index:1;padding:28px 32px 64px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:0 auto 22px;max-width:1500px;flex-wrap:wrap}
.topbar h1{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:700;letter-spacing:-.25px}
.topbar h1 .material-symbols-outlined{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border-radius:13px 17px 12px 18px;background:#d1fae5;color:#047857;font-size:22px}
.topbar .sub{margin-top:5px;color:var(--muted);font-size:12.5px}
.top-right{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.86);box-shadow:0 4px 14px rgba(6,78,59,.04);color:#334155;font-size:11.5px;font-weight:600;backdrop-filter:blur(8px)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(4,120,87,.15);animation:pulse 2s ease-in-out infinite}
.avatar{width:37px;height:37px;flex:none;display:flex;align-items:center;justify-content:center;border:2px solid #fff;border-radius:50%;background:linear-gradient(135deg,#059669,#34d399);box-shadow:0 5px 15px var(--glow);color:#032e24;font-weight:700;font-size:12.5px}
#screen{max-width:1500px;margin:0 auto}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{
  min-width:0;background:rgba(255,255,255,.96);border:1px solid var(--line);box-shadow:var(--shadow);
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.card:hover,.sec:hover,.kpi:hover,.stat:hover,.tile:hover{border-color:#6ee7b7;box-shadow:var(--shadow-hover)}
.card,.sec{border-radius:22px 16px 24px 17px;padding:19px}
.sec{margin-bottom:16px}
.sec>h3,.card-h h3{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:700}
.sec>h3{margin-bottom:14px}
.sec>h3 .material-symbols-outlined,.card-h h3 .material-symbols-outlined{color:#047857;font-size:19px}
.sec>p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.8}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0;font-size:13px}
.dl dt{color:var(--muted);font-size:12px;font-weight:600}
.dl dd{margin:0;line-height:1.8}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{min-width:0}
.card-h .hint{color:var(--muted);font-size:11.5px}

.kpi,.stat{position:relative;overflow:hidden;border-radius:18px 24px 18px 22px;padding:17px 18px}
.kpi::before,.stat::before,.tile::before{content:"";position:absolute;width:78px;height:78px;right:-30px;top:-34px;border-radius:38% 62% 55% 45% / 52% 41% 59% 48%;background:rgba(167,243,208,.33);pointer-events:none}
.kpi::after{display:none}
.kpi .ico,.tile .ti{display:flex;align-items:center;justify-content:center;background:#d1fae5;color:#047857;border:1px solid #a7f3d0}
.kpi .ico{width:39px;height:39px;border-radius:13px 17px 12px 16px;position:relative;z-index:1}
.kpi .ico .material-symbols-outlined,.tile .ti .material-symbols-outlined{font-size:20px}
.kpi .lbl,.stat .lbl{display:flex;align-items:center;gap:5px;margin-top:11px;color:var(--muted);font-size:12px;font-weight:500}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{color:#047857;font-size:15px}
.kpi .val,.stat .val,.tile .tv{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums;color:#064e3b}
.kpi .val,.stat .val{margin-top:4px;font-size:25px;font-weight:700;letter-spacing:-.7px}
.kpi .val small,.stat .val small{margin-left:4px;color:var(--muted);font-family:"Fira Sans",sans-serif;font-size:12.5px;font-weight:600}
.kpi .delta,.stat .d{display:inline-flex;align-items:center;gap:3px;margin-top:6px;font-size:11.5px;font-weight:700}
.delta.up,.d.up{color:#047857}.delta.down,.d.down{color:#b91c1c}.delta.flat,.d.flat{color:#475569}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:14px}

.card.pad0 .card-h{padding:19px 19px 0!important}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;font-variant-numeric:tabular-nums}
th{padding:12px 14px;border-bottom:1px solid var(--line);background:#f0fdf4;color:#3f5e54;text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.35px;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid #d9eee6;color:#193f34;white-space:nowrap;transition:background-color .18s ease}
th:not(:first-child),td:not(:first-child){text-align:right}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#ecfdf5}
.mono{font-family:"Fira Code",monospace;font-weight:600;letter-spacing:.15px;font-variant-numeric:tabular-nums}
td b{font-weight:700;color:#064e3b}
.tag{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:4px 9px;border:1px solid transparent;border-radius:999px;font-size:10.5px;font-weight:700;line-height:1.25;white-space:nowrap}
.t-ok{background:#d1fae5;border-color:#6ee7b7;color:#065f46}
.t-warn{background:#fef3c7;border-color:#fcd34d;color:#854d0e}
.t-bad{background:#fee2e2;border-color:#fca5a5;color:#991b1b}
.t-info{background:#e0f2fe;border-color:#7dd3fc;color:#075985}
.t-gray{background:#edf2f2;border-color:#cbd5d1;color:#475569}
.t-acc,.t-pink{background:#ccfbf1;border-color:#5eead4;color:#115e59}

.bar{height:8px;min-width:56px;overflow:hidden;border-radius:999px;background:var(--track)}
.bar>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#059669,#34d399)}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{width:40px;flex:none;color:var(--muted);font-family:"Fira Code",monospace;font-size:10.5px;font-weight:600;text-align:right}

.tl{position:relative;padding-left:27px}
.tl::before{content:"";position:absolute;left:7px;top:5px;bottom:4px;width:2px;border-radius:2px;background:#a7f3d0}
.tl-item,.tl-i{position:relative;padding:0 0 18px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;left:-26px;top:3px;width:15px;height:15px;border:4px solid var(--accent);border-radius:50%;background:#fff}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font-family:"Fira Code",monospace;font-size:10.5px;font-weight:600}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:12.5px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:11.5px}
.chk{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:12.5px}
.chk:last-child{border-bottom:0}.chk .material-symbols-outlined{font-size:19px}.chk .ok{color:var(--ok)}.chk .wait{color:var(--muted)}.chk .bad{color:var(--bad)}.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}.chk small{color:var(--muted);font-size:11px}
.note{margin-top:13px;padding-top:12px;border-top:1px dashed var(--line);color:var(--muted);font-size:11.5px;line-height:1.7}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.col{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line);border-radius:18px 23px 17px 21px;background:#f0fdf4}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 7px;font-size:12.5px;font-weight:700}
.col-h .cnt{padding:2px 9px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);font-family:"Fira Code",monospace;font-size:10.5px}
.pcard{padding:12px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px 17px 12px 15px;background:#fff;box-shadow:0 5px 14px rgba(6,78,59,.05)}
.pcard b{font-size:12.5px}.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--muted);font-size:11px}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:8px;color:var(--ink);font-size:11px}
.mini-av,.av{display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:50%;background:#d1fae5;color:#065f46;font-weight:700}
.mini-av{width:19px;height:19px;font-size:9px}
.av{width:27px;height:27px;font-size:10.5px}
.who{display:inline-flex;align-items:center;gap:6px}

.lane{display:flex;flex-direction:column;gap:11px}
.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:13px 14px;border:1px solid var(--line);border-radius:14px 20px 14px 18px;background:#fff}
.lane-row .num{width:33px;height:33px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:11px 15px 10px 14px;background:#d1fae5;color:#065f46;font-family:"Fira Code",monospace;font-weight:700;font-size:12px}
.lane-row .body{flex:1;min-width:0}.lane-row .body b{font-size:13.5px}.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:11.5px}
.steps{display:flex;align-items:center;flex:none}.steps .s{width:24px;height:24px;z-index:1;display:flex;align-items:center;justify-content:center;border:2px solid #b7ccc5;border-radius:50%;background:#fff;color:#64748b;font-family:"Fira Code",monospace;font-size:10px}.steps .ln{width:20px;height:2px;background:#cfe4dc}.steps .s.done{border-color:#047857;background:#047857;color:#fff}.steps .s.cur{border-color:#047857;color:#047857;animation:pulse 1.6s ease-in-out infinite}.steps .ln.done{background:#047857}
.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 4px;border-bottom:1px dashed var(--line)}.rep-row:last-child{border-bottom:0}.rep-row .sku{flex:1;min-width:0}.rep-row .sku b{display:block;font-size:13px}.rep-row .sku span{color:var(--muted);font-size:11px}
.gauge{width:110px;flex:none}.gauge .track{height:8px;overflow:hidden;border-radius:999px;background:var(--track)}.gauge .track i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#059669,#34d399)}.gauge small{display:block;margin-top:3px;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;text-align:right}
.band{position:relative;min-width:150px;height:26px;border-radius:9px;background:var(--track)}.band .rng{position:absolute;top:0;bottom:0;border-radius:9px;background:#a7f3d0}.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:#475569}.band .me{position:absolute;top:3px;width:12px;height:20px;border-radius:5px;background:#047857;box-shadow:0 2px 7px var(--glow)}

.tile{position:relative;display:flex;flex-direction:column;gap:8px;overflow:hidden;padding:17px 18px;border-radius:19px 25px 18px 22px}
.tile .ti{width:39px;height:39px;border-radius:13px 17px 12px 16px;position:relative;z-index:1}
.tile b{font-size:13.5px;font-weight:700}.tile p{margin:0;color:var(--muted);font-size:11.5px;line-height:1.6}.tile .tv{font-size:21px;font-weight:700;letter-spacing:-.5px}

.grid.g4:first-child{display:flex;gap:0;overflow:hidden;padding:0;border:1px solid var(--line);border-radius:22px 16px 24px 17px;background:rgba(255,255,255,.96);box-shadow:var(--shadow)}
.grid.g4:first-child>.kpi,.grid.g4:first-child>.stat,.grid.g4:first-child>.tile{flex:1 1 0;min-width:0;padding:18px;background:transparent;border:0;border-right:1px solid var(--line);border-radius:0;box-shadow:none}
.grid.g4:first-child>.kpi:last-child,.grid.g4:first-child>.stat:last-child,.grid.g4:first-child>.tile:last-child{border-right:0}
.grid.g4:first-child>.tile .ti,.grid.g4:first-child>.kpi .ico{width:34px;height:34px;margin-bottom:2px}
.grid.g4:first-child>.tile{gap:5px}

@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.58;transform:scale(.92)}}
@keyframes riseIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
#screen>.grid,#screen>.card,#screen>.sec{animation:riseIn .4s cubic-bezier(.2,.8,.2,1) both}
#screen>*:nth-child(2){animation-delay:.06s}#screen>*:nth-child(3){animation-delay:.12s}

@media(min-width:1080px){
  #screen{display:grid;grid-template-columns:minmax(0,1fr) 278px;gap:16px;align-items:start}
  #screen>*{grid-column:1;margin-top:0!important}
  #screen>.grid.g4:first-child{grid-column:2;grid-row:1 / span 99;display:flex;flex-direction:column;gap:0;position:sticky;top:22px}
  #screen>.grid.g4:first-child>*{width:100%;border-right:0;border-bottom:1px solid var(--line)}
  #screen>.grid.g4:first-child>*:last-child{border-bottom:0}
}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:860px){
  .app{flex-direction:column}.app::before{display:none}
  .sidebar{width:100%;height:auto;position:static;flex-direction:row;align-items:center;flex-wrap:wrap;padding:12px 14px;gap:7px;border:0}
  .sidebar::after{display:none}.brand{padding:0 12px 0 4px}.brand-logo{width:39px;height:39px}.side-foot{display:none}
  .nav{flex:1;flex-direction:row;flex-wrap:wrap;gap:6px;margin-top:0}.nav button{min-height:42px;padding:9px 11px}.nav button:hover{transform:none}.nav .idx{display:none}
  .main{padding:21px 16px 48px}.topbar{margin-bottom:18px}
}
@media(max-width:820px){.g2,.g3,.g23,.g32{grid-template-columns:1fr}.grid.g4:first-child{flex-wrap:wrap}.grid.g4:first-child>.kpi,.grid.g4:first-child>.stat,.grid.g4:first-child>.tile{flex:1 1 46%;border-bottom:1px solid var(--line)}}
@media(max-width:560px){
  body{font-size:13px}.main{padding-inline:12px}.g4{grid-template-columns:1fr 1fr}.board{grid-template-columns:1fr}.nav button .txt{display:none}.nav button{min-width:42px;justify-content:center}.topbar h1{font-size:18px}.top-right{width:100%}.chip{flex:1;justify-content:center}.avatar{display:none}.card,.sec{padding:15px;border-radius:18px}.grid.g4:first-child>.kpi,.grid.g4:first-child>.stat,.grid.g4:first-child>.tile{padding:14px}.tile .tv,.kpi .val,.stat .val{font-size:19px}th,td{padding:10px 12px}}
