<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yield Analysis（良率分析）｜Jvision 系統 Demo</title>
  <meta name="description" content="良率即時看板、多站良率追蹤、不良模式排行與根因改善的品質閉環" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
  <style>
    :root{
      --accent:#db2777; --accent2:#f472b6; --accent-soft:#fce7f3;
      --ink:#1f2430; --muted:#6b7280; --line:#e9ebf0; --bg:#f4f5f8;
      --sidebar:#1b1420; --sidebar2:#2a1c27; --card:#ffffff;
      --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
      background:var(--bg); color:var(--ink); font-size:14px; line-height:1.55;
      -webkit-font-smoothing:antialiased;
    }
    .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
    .app{display:flex; min-height:100vh; align-items:stretch;}
    /* sidebar */
    .sidebar{
      width:250px; flex:0 0 250px; background:linear-gradient(180deg,var(--sidebar),var(--sidebar2));
      color:#f3e9ef; display:flex; flex-direction:column; padding:20px 14px; gap:6px; min-width:0;
    }
    .brand{display:flex; align-items:center; gap:11px; padding:6px 8px 16px;}
    .brand .logo{
      width:40px;height:40px;border-radius:11px;flex:0 0 40px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      display:flex;align-items:center;justify-content:center;color:#fff;
      box-shadow:0 6px 16px rgba(219,39,119,.4);
    }
    .brand .logo .material-symbols-outlined{font-size:24px}
    .brand h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.2px}
    .brand p{margin:2px 0 0;font-size:11px;color:#c9a9bd;font-weight:500}
    .nav{display:flex;flex-direction:column;gap:4px;margin-top:6px}
    .nav .lbl{font-size:10.5px;letter-spacing:1.2px;color:#9d7d8f;font-weight:700;padding:8px 10px 4px;text-transform:uppercase}
    .navbtn{
      display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;
      background:transparent;border:0;color:#e6d5df;cursor:pointer;text-align:left;
      font-family:inherit;font-size:13.5px;font-weight:600;width:100%;min-width:0;transition:background .12s,color .12s;
    }
    .navbtn .material-symbols-outlined{font-size:21px;flex:0 0 auto;color:#e6a9c9}
    .navbtn .nx{display:flex;flex-direction:column;min-width:0}
    .navbtn .nx small{font-weight:500;font-size:10.5px;color:#a9899b;line-height:1.2}
    .navbtn:hover{background:rgba(255,255,255,.06)}
    .navbtn.active{background:linear-gradient(135deg,var(--accent),#be185d);color:#fff;box-shadow:0 6px 16px rgba(219,39,119,.35)}
    .navbtn.active .material-symbols-outlined{color:#fff}
    .navbtn.active small{color:#f9d3e5}
    .side-foot{margin-top:auto;padding:12px 10px 2px;font-size:10.5px;color:#8f7183;border-top:1px solid rgba(255,255,255,.08)}
    /* main */
    .main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
    .topbar{
      background:#fff;border-bottom:1px solid var(--line);padding:14px 26px;
      display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:20;
    }
    .topbar .tt{min-width:0}
    .topbar .tt h2{margin:0;font-size:18px;font-weight:800}
    .topbar .tt p{margin:2px 0 0;font-size:12px;color:var(--muted)}
    .topbar .spacer{flex:1 1 auto}
    .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;background:var(--accent-soft);color:#be185d}
    .pill .material-symbols-outlined{font-size:16px}
    .who{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted)}
    .who .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
    .content{padding:22px 26px 40px;min-width:0}
    /* generic */
    .grid{display:grid;gap:16px;min-width:0}
    .g4{grid-template-columns:repeat(4,1fr)}
    .g3{grid-template-columns:repeat(3,1fr)}
    .g2{grid-template-columns:repeat(2,1fr)}
    .g32{grid-template-columns:2fr 1fr}
    .g23{grid-template-columns:1fr 2fr}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;box-shadow:0 1px 2px rgba(20,20,40,.03)}
    .card h3{margin:0 0 3px;font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px}
    .card h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
    .card .sub{font-size:11.5px;color:var(--muted);margin:0 0 14px}
    .kpi .top{display:flex;align-items:center;justify-content:space-between}
    .kpi .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent)}
    .kpi .ic .material-symbols-outlined{font-size:21px}
    .kpi .val{font-size:27px;font-weight:900;margin:10px 0 2px;letter-spacing:-.5px}
    .kpi .lab{font-size:12px;color:var(--muted);font-weight:600}
    .kpi .dl{font-size:11.5px;font-weight:700;margin-top:8px;display:inline-flex;align-items:center;gap:3px}
    .kpi .dl .material-symbols-outlined{font-size:15px}
    .up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--muted)}
    .chartbox{width:100%;overflow:hidden;min-width:0}
    table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
    th{text-align:left;font-size:11px;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:2px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.4px}
    td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
    tbody tr:hover{background:#fbf3f8}
    .tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
    .t-ok{background:#dcfce7;color:#15803d} .t-warn{background:#fef3c7;color:#b45309}
    .t-bad{background:#fee2e2;color:#b91c1c} .t-info{background:#dbeafe;color:#1d4ed8}
    .t-gray{background:#eef0f4;color:#4b5563}
    .bar-wrap{background:#eef0f4;border-radius:999px;height:8px;overflow:hidden;min-width:60px}
    .bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
    .mono{font-variant-numeric:tabular-nums;font-weight:700}
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;min-width:0}
    .col{background:#f8f9fb;border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
    .col .ch{font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .col .cnt{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11px;color:var(--muted)}
    .kb{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:10px;margin-bottom:9px}
    .kb .kt{font-size:12.5px;font-weight:700}
    .kb .km{font-size:11px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .timeline{position:relative;padding-left:26px}
    .timeline::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
    .tli{position:relative;padding:0 0 18px}
    .tli::before{content:"";position:absolute;left:-21px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent-soft)}
    .tli .tth{font-size:13px;font-weight:800}
    .tli .ttm{font-size:11.5px;color:var(--muted)}
    .tli .ttd{font-size:12px;margin-top:4px;background:#f8f9fb;border:1px solid var(--line);border-radius:9px;padding:8px 10px}
    .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
    .legend span{display:inline-flex;align-items:center;gap:5px}
    .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
    .flowstrip{display:flex;gap:0;flex-wrap:wrap;align-items:stretch;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;margin-bottom:16px}
    .fstep{flex:1 1 auto;min-width:120px;display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:10px}
    .fstep .fn{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
    .fstep.on{background:var(--accent-soft)} .fstep.on .fn{background:var(--accent);color:#fff}
    .fstep .fx{min-width:0}
    .fstep .fx b{font-size:12.5px;display:block}
    .fstep .fx small{font-size:10.5px;color:var(--muted)}
    .split{display:flex;align-items:center;color:#d0d3da;font-size:18px}
    .gauge-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
    .statline{display:flex;flex-direction:column;gap:10px}
    .statrow{display:flex;align-items:center;gap:10px;font-size:12.5px}
    .statrow .nm{flex:0 0 96px;font-weight:600;min-width:0}
    .statrow .vv{flex:0 0 52px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
    .note{background:var(--accent-soft);border:1px solid #f5c6dd;border-radius:12px;padding:12px 14px;font-size:12.5px;color:#9d174d;display:flex;gap:10px;align-items:flex-start}
    .note .material-symbols-outlined{font-size:19px;flex:0 0 auto}
    .chips{display:flex;gap:8px;flex-wrap:wrap}
    .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--muted)}
    .chip.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
    .mini-th{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
    .hbar{display:grid;grid-template-columns:120px 1fr 46px;gap:10px;align-items:center;font-size:12px;margin-bottom:9px;min-width:0}
    .hbar .hn{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .hbar .hv{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
    /* responsive */
    @media(max-width:1100px){ .g4{grid-template-columns:repeat(2,1fr)} .board{grid-template-columns:repeat(2,1fr)} }
    @media(max-width:820px){
      .g4,.g3,.g2,.g32,.g23{grid-template-columns:1fr}
      .board{grid-template-columns:1fr}
    }
    @media(max-width:860px){
      .app{flex-direction:column}
      .sidebar{width:auto;flex:0 0 auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px;gap:8px}
      .brand{padding:0 10px 0 2px;border:0}
      .nav{flex-direction:row;flex-wrap:wrap;gap:6px;margin:0}
      .nav .lbl{display:none}
      .navbtn{width:auto;padding:8px 12px}
      .navbtn .nx small{display:none}
      .side-foot{display:none}
    }
    @media(max-width:560px){
      .navbtn .nx b{display:none}
      .navbtn{padding:9px}
      .content{padding:16px 14px 34px}
      .topbar{padding:12px 14px}
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">insights</span></div>
        <div>
          <h1>Yield Analysis</h1>
          <p>良率分析平台</p>
        </div>
      </div>
      <nav class="nav" id="nav">
        <div class="lbl">分析模組</div>
      </nav>
      <div class="side-foot">
        Jvision QMS · Demo<br/>資料為模擬展示用途
      </div>
    </aside>
    <main class="main">
      <div class="topbar">
        <div class="tt">
          <h2 id="scr-title">良率即時看板</h2>
          <p id="scr-sub">整廠 FPY 與綜合良率即時彙整</p>
        </div>
        <div class="spacer"></div>
        <span class="pill"><span class="material-symbols-outlined">factory</span>Fab-A 電子組裝廠</span>
        <div class="who">
          <div class="av">陳</div>
          <div>陳詠晴<br/><span style="font-size:11px">製程工程部</span></div>
        </div>
      </div>
      <div class="content" id="screen"></div>
    </main>
  </div>

  <script>
  (function(){
    "use strict";
    var charts=[];
    function destroyCharts(){ for(var i=0;i<charts.length;i++){ try{charts[i].destroy();}catch(e){} } charts=[]; }
    function mkChart(id,opt){
      var el=document.getElementById(id);
      if(!el) return;
      opt.chart=opt.chart||{};
      opt.chart.redrawOnParentResize=false;
      opt.chart.redrawOnWindowResize=false;
      opt.chart.animations={enabled:false};
      opt.chart.fontFamily='Inter,"Noto Sans TC",sans-serif';
      opt.chart.toolbar={show:false};
      try{ var c=new ApexCharts(el,opt); c.render(); charts.push(c); }catch(e){}
    }
    var PINK="#db2777", PINK2="#f472b6", GRID="#eceef2";

    var MODULES=[
      {icon:"dashboard",name:"良率即時看板",sub:"整廠 FPY 與綜合良率即時彙整"},
      {icon:"account_tree",name:"多站良率追蹤",sub:"各製程站別良率與流失分解"},
      {icon:"insights",name:"不良模式排行",sub:"柏拉圖鎖定關鍵不良項目"},
      {icon:"monitoring",name:"SPC 製程管制",sub:"關鍵參數管制圖與趨勢監控"},
      {icon:"science",name:"根因分析",sub:"多維度交叉鎖定良率損失根因"},
      {icon:"task_alt",name:"改善追蹤",sub:"改善對策驗證與效益追蹤"}
    ];

    // build nav
    (function(){
      var nav=document.getElementById("nav");
      for(var i=0;i<MODULES.length;i++){
        var b=document.createElement("button");
        b.className="navbtn"; b.setAttribute("data-i",i);
        b.innerHTML='<span class="material-symbols-outlined">'+MODULES[i].icon+'</span>'+
          '<span class="nx"><b>'+MODULES[i].name+'</b><small>'+MODULES[i].sub+'</small></span>';
        b.addEventListener("click",(function(idx){return function(){ location.hash="v"+idx; };})(i));
        nav.appendChild(b);
      }
    })();

    function esc(s){return String(s).replace(/[&<>]/g,function(c){return c==="&"?"&amp;":c==="<"?"&lt;":"&gt;";});}

    // ---------- SCREEN 0: 良率即時看板 ----------
    function screen0(){
      var kpis=[
        {ic:"verified",lab:"整線綜合良率",val:"94.6%",dl:"+1.8%",cls:"up"},
        {ic:"task_alt",lab:"直通率 FPY",val:"91.2%",dl:"+2.4%",cls:"up"},
        {ic:"warning",lab:"今日不良台數",val:"318",dl:"-64",cls:"up"},
        {ic:"schedule",lab:"待處理異常",val:"7",dl:"+2",cls:"down"}
      ];
      var lines=[
        {n:"SMT-1 主板貼裝線",fpy:"92.4",yld:"95.1",st:"正常",cls:"t-ok"},
        {n:"SMT-2 副板貼裝線",fpy:"88.7",yld:"93.2",st:"注意",cls:"t-warn"},
        {n:"DIP 插件線",fpy:"90.1",yld:"94.6",st:"正常",cls:"t-ok"},
        {n:"FA 組裝線",fpy:"93.8",yld:"96.0",st:"正常",cls:"t-ok"},
        {n:"FT 功能測試線",fpy:"86.2",yld:"90.4",st:"異常",cls:"t-bad"}
      ];
      var h='';
      h+='<div class="grid g4">';
      for(var i=0;i<kpis.length;i++){var k=kpis[i];
        h+='<div class="card kpi"><div class="top"><div class="ic"><span class="material-symbols-outlined">'+k.ic+'</span></div>'+
          '<span class="dl '+k.cls+'"><span class="material-symbols-outlined">'+(k.cls==="up"?"trending_up":"trending_down")+'</span>'+k.dl+'</span></div>'+
          '<div class="val">'+k.val+'</div><div class="lab">'+k.lab+'</div></div>';
      }
      h+='</div>';
      h+='<div class="grid g32" style="margin-top:16px">';
      h+='<div class="card"><h3><span class="material-symbols-outlined">show_chart</span>近 14 日良率趨勢</h3><p class="sub">整線綜合良率 vs 直通率（FPY）</p><div class="chartbox" id="c0trend"></div>'+
        '<div class="legend"><span><i class="dot" style="background:'+PINK+'"></i>綜合良率</span><span><i class="dot" style="background:'+PINK2+'"></i>直通率 FPY</span><span><i class="dot" style="background:#94a3b8"></i>目標 93%</span></div></div>';
      h+='<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>不良類別佔比</h3><p class="sub">今日不良台數分佈</p><div class="chartbox" id="c0donut"></div></div>';
      h+='</div>';
      h+='<div class="card" style="margin-top:16px"><h3><span class="material-symbols-outlined">factory</span>各產線良率總覽</h3><p class="sub">即時同步 MES / AOI 數據</p>'+
        '<div style="overflow-x:auto"><table><thead><tr><th>產線</th><th>FPY %</th><th>綜合良率 %</th><th>良率達成</th><th>狀態</th></tr></thead><tbody>';
      for(var j=0;j<lines.length;j++){var l=lines[j];var pct=Math.round(parseFloat(l.yld));
        h+='<tr><td style="font-weight:700">'+l.n+'</td><td class="mono">'+l.fpy+'</td><td class="mono">'+l.yld+'</td>'+
          '<td><div style="display:flex;align-items:center;gap:8px"><div class="bar-wrap" style="width:110px"><div class="bar-fill" style="width:'+pct+'%"></div></div><span class="mono" style="font-size:11px">'+pct+'%</span></div></td>'+
          '<td><span class="tag '+l.cls+'">'+l.st+'</span></td></tr>';
      }
      h+='</tbody></table></div></div>';
      document.getElementById("screen").innerHTML=h;
      void document.getElementById("screen").offsetHeight;
      mkChart("c0trend",{
        chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"line",height:300},
        series:[
          {name:"綜合良率",data:[92.1,92.6,91.8,93.2,93.6,92.9,93.8,94.0,93.4,94.2,94.5,93.9,94.4,94.6]},
          {name:"直通率 FPY",data:[88.4,89.1,88.0,89.6,90.2,89.4,90.5,90.9,90.1,91.0,91.4,90.7,91.1,91.2]},
          {name:"目標",data:[93,93,93,93,93,93,93,93,93,93,93,93,93,93]}
        ],
        colors:[PINK,PINK2,"#94a3b8"],
        stroke:{width:[3,3,2],curve:"smooth",dashArray:[0,0,5]},
        xaxis:{categories:["D-13","D-12","D-11","D-10","D-9","D-8","D-7","D-6","D-5","D-4","D-3","D-2","D-1","今日"],labels:{style:{fontSize:"10px"}}},
        yaxis:{min:85,max:97,labels:{formatter:function(v){return v.toFixed(0)+"%";}}},
        grid:{borderColor:GRID},
        legend:{show:false},
        dataLabels:{enabled:false}
      });
      mkChart("c0donut",{
        chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"donut",height:300},
        series:[104,78,52,44,40],
        labels:["虛焊 / 冷焊","元件錯位","焊錫短路","功能不良","外觀刮傷"],
        colors:[PINK,PINK2,"#f9a8d4","#fbcfe8","#c4b5fd"],
        legend:{position:"bottom",fontSize:"11px"},
        dataLabels:{enabled:true,formatter:function(v){return v.toFixed(0)+"%";}},
        plotOptions:{pie:{donut:{size:"62%",labels:{show:true,total:{show:true,label:"總不良台",fontSize:"12px",formatter:function(){return "318";}}}}}}
      });
    }

    // ---------- SCREEN 1: 多站良率追蹤 ----------
    function screen1(){
      var stations=[

      h+='<div class="card" style="margin-top:16px"><h3><span class="material-symbols-outlined">view_kanban</span>改善案件看板</h3><p class="sub">依 CAPA 流程階段（待判定 → 原因分析 → 改善驗證 → 已關閉）</p>'+
        '<div style="overflow-x:auto"><div class="board">';
      for(var c=0;c<cols.length;c++){var col=cols[c];
        h+='<div class="col"><div class="ch"><span class="tag '+col.cls+'">'+col.t+'</span><span class="cnt">'+col.items.length+'</span></div>';
        for(var m=0;m<col.items.length;m++){var it=col.items[m];
          h+='<div class="kb"><div class="kt">'+esc(it.k)+'</div><div class="km"><span class="tag '+(it.m[0]==="高"?"t-bad":it.m[0]==="中"?"t-warn":"t-gray")+'" style="font-size:10px">'+it.m[0]+'優先</span><span>'+esc(it.m[1])+'</span></div></div>';
        }
        h+='</div>';
      }
      h+='</div></div></div>';
      h+='<div class="grid g23" style="margin-top:16px">';
      h+='<div class="card"><h3><span class="material-symbols-outlined">show_chart</span>改善前後良率</h3><p class="sub">CAPA 對策驗證成效</p><div class="chartbox" id="c5ba"></div>'+
        '<div class="legend"><span><i class="dot" style="background:#94a3b8"></i>改善前</span><span><i class="dot" style="background:'+PINK+'"></i>改善後</span></div></div>';
      h+='<div class="card"><h3><span class="material-symbols-outlined">task_alt</span>CAPA 改善追蹤</h3><p class="sub">RULE-03：無驗證證據不得關閉案件</p>'+
        '<div style="overflow-x:auto"><table><thead><tr><th>CAPA 單號</th><th>對策</th><th>負責人</th><th>前→後 FPY</th><th>狀態</th></tr></thead><tbody>';
      for(var r=0;r<rows.length;r++){var rw=rows[r];
        h+='<tr><td class="mono" style="font-weight:700">'+rw.id+'</td><td>'+esc(rw.it)+'</td><td>'+rw.own+'</td>'+
          '<td class="mono">'+rw.fpy0+' → <span style="color:#db2777">'+rw.fpy1+'</span></td>'+
          '<td><span class="tag '+rw.cls+'">'+rw.st+'</span></td></tr>';
      }
      h+='</tbody></table></div></div>';
      h+='</div>';
      document.getElementById("screen").innerHTML=h;
      void document.getElementById("screen").offsetHeight;
      mkChart("c5ba",{
        chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"bar",height:300},
        series:[
          {name:"改善前",data:[87.4,90.1,88.9,91.2]},
          {name:"改善後",data:[93.6,94.8,92.2,96.0]}
        ],
        colors:["#94a3b8",PINK],
        plotOptions:{bar:{borderRadius:4,columnWidth:"62%"}},
        xaxis:{categories:["CAPA-017","CAPA-012","CAPA-009","CAPA-044"],labels:{style:{fontSize:"10px"}}},
        yaxis:{min:82,max:100,labels:{formatter:function(v){return v.toFixed(0)+"%";}}},
        grid:{borderColor:GRID},
        dataLabels:{enabled:false},
        legend:{show:false},
        tooltip:{shared:true,intersect:false,y:{formatter:function(v){return v.toFixed(1)+"%";}}}
      });
    }

    var SCREENS=[screen0,screen1,screen2,screen3,screen4,screen5];

    function show(i){
      destroyCharts();
      var btns=document.querySelectorAll("[data-i]");
      for(var b=0;b<btns.length;b++){ btns[b].classList.toggle("active", +btns[b].getAttribute("data-i")===i); }
      document.getElementById("scr-title").textContent=MODULES[i].name;
      document.getElementById("scr-sub").textContent=MODULES[i].sub;
      SCREENS[i]();
    }

    window.__show=show;
    function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
    window.addEventListener("hashchange",fromHash);fromHash();
  })();
  </script>
