<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>生產良率追蹤分析｜Jvision 系統 Demo</title>
  <meta name="description" content="良率即時看板、多站良率追蹤、不良模式排行與根因改善的品質閉環" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
  <style>
    :root{
      --color-primary:#2563eb;
      --color-on-primary:#fff;
      --color-secondary:#3b82f6;
      --color-on-secondary:#000;
      --color-accent:#ea580c;
      --color-on-accent:#000;
      --color-background:#f8fafc;
      --color-foreground:#1e293b;
      --color-card:#fff;
      --color-card-foreground:#1e293b;
      --color-muted:#e9eff8;
      --color-muted-foreground:#475569;
      --color-border:#e2e8f0;
      --color-destructive:#dc2626;
      --color-on-destructive:#fff;
      --color-ring:#2563eb;
      --blue:#2563eb;
      --ink:#1e293b;
      --muted:#475569;
      --line:#e2e8f0;
      --bg:#f8fafc;
      --card:#fff;
      --ok:#15803d;
      --warn:#9a4a08;
      --bad:#dc2626;
      --info:#1d4ed8;
      --sidebar:#0f172a;
      --sidebar-muted:#cbd5e1;
      --shadow:0 8px 24px rgba(15,23,42,.06);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    html,body{margin:0;padding:0}
    body{
      min-width:320px;
      background:var(--color-background);
      color:var(--color-foreground);
      font-family:"Fira Sans",system-ui,sans-serif;
      font-size:14px;
      line-height:1.5;
      -webkit-font-smoothing:antialiased;
    }
    button{font:inherit}
    button,[role="button"],a,.chip{cursor:pointer}
    :focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
    .material-symbols-outlined{
      font-family:"Material Symbols Outlined";
      font-weight:normal;font-style:normal;line-height:1;
      vertical-align:middle;font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;
    }
    .app{display:flex;min-height:100vh}
    .sidebar{
      position:sticky;top:0;height:100vh;width:252px;flex:0 0 252px;
      display:flex;flex-direction:column;gap:12px;padding:20px 14px;
      overflow-y:auto;background:var(--sidebar);color:#f8fafc;
      border-right:1px solid #1e293b;
    }
    .brand{display:flex;align-items:center;gap:12px;padding:2px 8px 18px;border-bottom:1px solid #334155}
    .brand .logo{
      width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;
      border-radius:6px;background:var(--color-primary);color:#fff;
      box-shadow:0 5px 0 #1d4ed8;
    }
    .brand h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.01em}
    .brand p{margin:2px 0 0;color:#cbd5e1;font-size:11px}
    .nav{display:flex;flex-direction:column;gap:4px}
    .nav .lbl{
      padding:8px 10px 5px;color:#94a3b8;font-size:10px;font-weight:700;
      letter-spacing:.14em;text-transform:uppercase;
    }
    .navbtn{
      width:100%;min-width:0;display:flex;align-items:center;gap:11px;
      padding:10px;border:1px solid transparent;border-radius:5px;
      background:transparent;color:#e2e8f0;text-align:left;
      transition:background-color .2s,border-color .2s,color .2s,transform .2s;
    }
    .navbtn:hover{background:#1e293b;border-color:#334155;transform:translateX(2px)}
    .navbtn.active{
      background:#fff;color:#0f172a;border-color:#fff;
      box-shadow:inset 4px 0 var(--color-primary);
    }
    .navbtn .material-symbols-outlined{font-size:20px;color:#93c5fd}
    .navbtn.active .material-symbols-outlined{color:var(--color-primary)}
    .navbtn .nx{display:flex;min-width:0;flex-direction:column}
    .navbtn .nx b{font-size:13px;font-weight:600}
    .navbtn .nx small{color:#94a3b8;font-size:10px;line-height:1.35}
    .navbtn.active .nx small{color:#475569}
    .side-foot{
      margin-top:auto;padding:14px 10px 2px;border-top:1px solid #334155;
      color:#94a3b8;font-size:10px;
    }
    .main{min-width:0;flex:1;display:flex;flex-direction:column}
    .topbar{
      position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;
      min-height:72px;padding:12px 24px;background:rgba(255,255,255,.96);
      border-bottom:1px solid var(--line);backdrop-filter:blur(10px);
    }
    .topbar .tt{min-width:0}
    .topbar .tt h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.015em}
    .topbar .tt p{margin:2px 0 0;color:var(--muted);font-size:11px}
    .topbar .spacer{flex:1}
    .pill{
      display:inline-flex;align-items:center;gap:6px;padding:6px 10px;
      border:1px solid #bfdbfe;border-radius:4px;background:#eff6ff;
      color:#1e40af;font-size:11px;font-weight:600;
    }
    .pill .material-symbols-outlined{font-size:16px}
    .who{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:11px}
    .who .av{
      width:32px;height:32px;display:grid;place-items:center;border-radius:4px;
      background:var(--color-accent);color:#fff;font-weight:700;
    }
    .content{min-width:0;padding:20px 24px 40px}
    .grid{display:grid;gap:14px;min-width:0}
    .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .g32{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
    .g23{grid-template-columns:minmax(280px,1fr) minmax(0,2fr)}
    .card{
      min-width:0;padding:16px;background:var(--card);color:var(--ink);
      border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);
      transition:border-color .2s,box-shadow .2s,transform .2s;
    }
    .card:hover{border-color:#bfdbfe;box-shadow:0 12px 30px rgba(15,23,42,.09)}
    .card h3{display:flex;align-items:center;gap:8px;margin:0 0 3px;font-size:14px;font-weight:700}
    .card h3 .material-symbols-outlined{font-size:18px;color:var(--color-primary)}
    .card .sub{margin:0 0 12px;color:var(--muted);font-size:11px}
    .kpi{position:relative;overflow:hidden;border-top:3px solid var(--color-primary)}
    .kpi::after{
      content:"";position:absolute;right:-24px;bottom:-28px;width:82px;height:82px;
      border:12px solid #eff6ff;border-radius:50%;
    }
    .kpi .top{display:flex;align-items:center;justify-content:space-between}
    .kpi .ic{
      width:34px;height:34px;display:grid;place-items:center;border-radius:4px;
      background:#eff6ff;color:var(--color-primary);
    }
    .kpi .ic .material-symbols-outlined{font-size:19px}
    .kpi .val{
      position:relative;z-index:1;margin:9px 0 1px;font-family:"Fira Code",monospace;
      font-size:25px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums;
    }
    .kpi .lab{position:relative;z-index:1;color:var(--muted);font-size:11px;font-weight:600}
    .kpi .dl{
      position:relative;z-index:1;display:inline-flex;align-items:center;gap:3px;
      margin-top:7px;font-family:"Fira Code",monospace;font-size:10px;font-weight:600;
    }
    .kpi .dl .material-symbols-outlined{font-size:14px}
    .up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
    .chartbox{width:100%;min-width:0;overflow:hidden}
    table{width:100%;min-width:520px;border-collapse:collapse;font-size:12px}
    th{
      padding:9px 11px;background:#f1f5f9;border-bottom:2px solid #cbd5e1;
      color:#334155;font-size:10px;font-weight:700;letter-spacing:.05em;
      text-align:left;text-transform:uppercase;white-space:nowrap;
    }
    td{padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
    tbody tr{transition:background-color .18s}
    tbody tr:hover{background:#eff6ff}
    td:nth-child(n+2){font-variant-numeric:tabular-nums}
    .tag{
      display:inline-flex;align-items:center;gap:5px;padding:3px 8px;
      border:1px solid currentColor;border-radius:3px;font-size:10px;font-weight:700;
    }
    .tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
    .t-ok{background:#f0fdf4;color:#166534}
    .t-warn{background:#fff7ed;color:#9a3412}
    .t-bad{background:#fef2f2;color:#b91c1c}
    .t-info{background:#eff6ff;color:#1d4ed8}
    .t-gray{background:#f1f5f9;color:#475569}
    .bar-wrap{height:7px;min-width:60px;overflow:hidden;border-radius:2px;background:#e2e8f0}
    .bar-fill{height:100%;border-radius:2px;background:var(--color-primary)}
    .mono{
      font-family:"Fira Code",monospace;font-weight:600;
      font-variant-numeric:tabular-nums;text-align:right;
    }
    .board{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:12px;min-width:900px}
    .col{min-width:0;padding:10px;background:#f8fafc;border:1px solid var(--line);border-radius:5px}
    .col .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;font-size:11px;font-weight:700}
    .col .cnt{
      padding:1px 7px;border:1px solid var(--line);border-radius:3px;
      background:#fff;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;
    }
    .kb{
      margin-bottom:8px;padding:9px;background:#fff;border:1px solid var(--line);
      border-left:3px solid var(--color-primary);border-radius:4px;
      transition:transform .2s,box-shadow .2s;
    }
    .kb:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(15,23,42,.08)}
    .kb .kt{font-size:11px;font-weight:600}
    .kb .km{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px;color:var(--muted);font-size:10px}
    .timeline{position:relative;padding-left:25px}
    .timeline::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:#bfdbfe}
    .tli{position:relative;padding-bottom:16px}
    .tli::before{
      content:"";position:absolute;left:-22px;top:3px;width:11px;height:11px;
      border:3px solid #fff;border-radius:50%;background:var(--color-primary);
      box-shadow:0 0 0 1px var(--color-primary);
    }
    .tli .tth{font-size:12px;font-weight:700}
    .tli .ttm{color:var(--muted);font-family:"Fira Code",monospace;font-size:10px}
    .tli .ttd{margin-top:4px;padding:8px 9px;background:#f8fafc;border:1px solid var(--line);border-radius:4px;font-size:11px}
    .legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:7px;color:var(--muted);font-size:10px}
    .legend span{display:inline-flex;align-items:center;gap:5px}
    .dot{display:inline-block;width:9px;height:9px;border-radius:2px}
    .note{
      display:flex;align-items:flex-start;gap:10px;padding:12px 14px;
      background:#eff6ff;border:1px solid #93c5fd;border-left:4px solid var(--color-primary);
      border-radius:4px;color:#1e3a8a;font-size:12px;
    }
    .note .material-symbols-outlined{flex:0 0 auto;font-size:18px}
    .chips{display:flex;gap:7px;flex-wrap:wrap}
    .chip{
      padding:5px 11px;border:1px solid #cbd5e1;border-radius:3px;
      background:#fff;color:#334155;font-size:11px;font-weight:600;
      transition:background-color .2s,border-color .2s,color .2s,transform .2s;
    }
    .chip:hover{border-color:var(--color-primary);color:var(--color-primary);transform:translateY(-1px)}
    .chip.sel{background:var(--color-primary);border-color:var(--color-primary);color:#fff}
    .hbar{display:grid;grid-template-columns:120px minmax(80px,1fr) 46px;gap:10px;align-items:center;margin-bottom:9px;font-size:11px}
    .hbar .hn{min-width:0;overflow:hidden;font-weight:600;text-overflow:ellipsis;white-space:nowrap}
    .hbar .hv{text-align:right;font-family:"Fira Code",monospace;font-weight:600;font-variant-numeric:tabular-nums}
    @media(max-width:1100px){
      .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
      .g32,.g23{grid-template-columns:1fr}
    }
    @media(max-width:860px){
      .app{display:block}
      .sidebar{
        position:sticky;z-index:30;width:100%;height:auto;padding:10px 12px;
        flex-direction:row;align-items:center;overflow-x:auto;
      }
      .brand{flex:0 0 auto;padding:0 12px 0 0;border:0;border-right:1px solid #334155}
      .brand .logo{width:34px;height:34px;flex-basis:34px}
      .brand p,.nav .lbl,.navbtn .nx small,.side-foot{display:none}
      .nav{flex-direction:row;flex-wrap:nowrap}
      .navbtn{width:auto;min-width:max-content;padding:8px 10px}
      .navbtn:hover{transform:none}
      .topbar{top:55px}
    }
    @media(max-width:620px){
      .g4,.g3,.g2{grid-template-columns:1fr}
      .content{padding:14px 12px 30px}
      .topbar{padding:10px 12px}
      .topbar .pill{display:none}
      .who>div:last-child{display:none}
      .navbtn .nx b{display:none}
      .navbtn{padding:8px}
      .card{padding:13px}
      .hbar{grid-template-columns:105px minmax(70px,1fr) 42px}
    }
    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*::before,*::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
        scroll-behavior:auto!important;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">fact_check</span></div>
        <div><h1>Yield Analysis</h1><p>良率分析平台</p></div>
      </div>
      <nav class="nav" id="nav" aria-label="分析模組">
        <div class="lbl">分析模組</div>
      </nav>
      <div class="side-foot">Jvision QMS · Demo<br />資料為模擬展示用途</div>
    </aside>
    <main class="main">
      <div class="topbar">
        <div class="tt">
          <h2 id="scr-title">良率即時看板</h2>
          <p id="scr-sub">整廠 FPY 與綜合良率即時彙整</p>
        </div>
        <div class="spacer"></div>
        <span class="pill"><span class="material-symbols-outlined">factory</span>Fab-A 電子組裝廠</span>
        <div class="who">
          <div class="av">陳</div>
          <div>陳詠晴<br /><span style="font-size:10px">製程工程部</span></div>
        </div>
      </div>
      <div class="content" id="screen"></div>
    </main>
  </div>
  <script>
  (function(){
    "use strict";
    var charts=[];
    function destroyCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
    function mkChart(id,opt){
      var el=document.getElementById(id);if(!el)return;
      opt.chart=opt.chart||{};
      opt.chart.redrawOnParentResize=false;
      opt.chart.redrawOnWindowResize=false;
      opt.chart.animations={enabled:false};
      opt.chart.fontFamily='"Fira Sans",sans-serif';
      opt.chart.foreColor="#475569";
      opt.chart.toolbar={show:false};
      opt.tooltip=opt.tooltip||{};
      opt.tooltip.theme="light";
      try{var c=new ApexCharts(el,opt);c.render();charts.push(c);}catch(e){}
    }
    var BLUE="#2563eb",BLUE2="#3b82f6",ORANGE="#ea580c",GRID="#e2e8f0";
    var MODULES=[
      {icon:"dashboard",name:"良率即時看板",sub:"整廠 FPY 與綜合良率即時彙整"},
      {icon:"account_tree",name:"多站良率追蹤",sub:"各製程站別良率與流失分解"},
      {icon:"insights",name:"不良模式排行",sub:"柏拉圖鎖定關鍵不良項目"},
      {icon:"monitoring",name:"SPC 製程管制",sub:"關鍵參數管制圖與趨勢監控"},
      {icon:"science",name:"根因分析",sub:"多維度交叉鎖定良率損失根因"},
      {icon:"task_alt",name:"改善追蹤",sub:"改善對策驗證與效益追蹤"}
    ];
    (function(){
      var nav=document.getElementById("nav");
      for(var i=0;i<MODULES.length;i++){
        var b=document.createElement("button");
        b.className="navbtn";b.type="button";b.setAttribute("data-i",i);
        b.innerHTML='<span class="material-symbols-outlined">'+MODULES[i].icon+'</span><span class="nx"><b>'+MODULES[i].name+'</b><small>'+MODULES[i].sub+'</small></span>';
        b.addEventListener("click",(function(idx){return function(){location.hash="v"+idx;};})(i));
        nav.appendChild(b);
      }
    })();
    function esc(s){return String(s).replace(/[&<>]/g,function(c){return c==="&"?"&amp;":c==="<"?"&lt;":"&gt;";});}
    function screen0(){
      var kpis=[
        {ic:"verified",lab:"整線綜合良率",val:"94.6%",dl:"+1.8%",cls:"up"},
        {ic:"task_alt",lab:"直通率 FPY",val:"91.2%",dl:"+2.4%",cls:"up"},
        {ic:"warning",lab:"今日不良台數",val:"318",dl:"-64",cls:"up"},
        {ic:"schedule",lab:"待處理異常",val:"7",dl:"+2",cls:"down"}
      ];
      var lines=[
        {n:"SMT-1 主板貼裝線",fpy:"92.4",yld:"95.1",st:"正常",cls:"t-ok"},
        {n:"SMT-2 副板貼裝線",fpy:"88.7",yld:"93.2",st:"注意",cls:"t-warn"},
        {n:"DIP 插件線",fpy:"90.1",yld:"94.6",st:"正常",cls:"t-ok"},
        {n:"FA 組裝線",fpy:"93.8",yld:"96.0",st:"正常",cls:"t-ok"},
        {n:"FT 功能測試線",fpy:"86.2",yld:"90.4",st:"異常",cls:"t-bad"}
      ];
      var h='<div class="grid g4">';
      for(var i=0;i<kpis.length;i++){var k=kpis[i];
        h+='<div class="card kpi"><div class="top"><div class="ic"><span class="material-symbols-outlined">'+k.ic+'</span></div><span class="dl '+k.cls+'"><span class="material-symbols-outlined">'+(k.cls==="up"?"trending_up":"trending_down")+'</span>'+k.dl+'</span></div><div class="val">'+k.val+'</div><div class="lab">'+k.lab+'</div></div>';
      }
      h+='</div><div class="grid g32" style="margin-top:14px"><div class="card"><h3><span class="material-symbols-outlined">show_chart</span>近 14 日良率趨勢</h3><p class="sub">整線綜合良率 vs 直通率（FPY）</p><div class="chartbox" id="c0trend"></div><div class="legend"><span><i class="dot" style="background:'+BLUE+'"></i>綜合良率</span><span><i class="dot" style="background:'+ORANGE+'"></i>直通率 FPY</span><span><i class="dot" style="background:#64748b"></i>目標 93%</span></div></div>';
      h+='<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>不良類別佔比</h3><p class="sub">今日不良台數分佈</p><div class="chartbox" id="c0donut"></div></div></div>';
      h+='<div class="card" style="margin-top:14px"><h3><span class="material-symbols-outlined">factory</span>各產線良率總覽</h3><p class="sub">即時同步 MES / AOI 數據</p><div style="overflow-x:auto"><table><thead><tr><th>產線</th><th>FPY %</th><th>綜合良率 %</th><th>良率達成</th><th>狀態</th></tr></thead><tbody>';
      for(var j=0;j<lines.length;j++){var l=lines[j],pct=Math.round(parseFloat(l.yld));
        h+='<tr><td style="font-weight:700">'+l.n+'</td><td class="mono">'+l.fpy+'</td><td class="mono">'+l.yld+'</td><td><div style="display:flex;align-items:center;gap:8px"><div class="bar-wrap" style="width:110px"><div class="bar-fill" style="width:'+pct+'%"></div></div><span class="mono" style="font-size:10px">'+pct+'%</span></div></td><td><span class="tag '+l.cls+'">'+l.st+'</span></td></tr>';
      }
      h+='</tbody></table></div></div>';
      document.getElementById("screen").innerHTML=h;
      mkChart("c0trend",{chart:{type:"line",height:290},series:[

      h+='<div class="card"><h3><span class="material-symbols-outlined">task_alt</span>CAPA 改善追蹤</h3><p class="sub">RULE-03：無驗證證據不得關閉案件</p><div style="overflow-x:auto"><table><thead><tr><th>CAPA 單號</th><th>對策</th><th>負責人</th><th>前→後 FPY</th><th>狀態</th></tr></thead><tbody>';
      for(var r=0;r<rows.length;r++){var rw=rows[r];h+='<tr><td class="mono">'+rw.id+'</td><td>'+esc(rw.it)+'</td><td>'+rw.own+'</td><td class="mono">'+rw.fpy0+' → <span style="color:#1d4ed8">'+rw.fpy1+'</span></td><td><span class="tag '+rw.cls+'">'+rw.st+'</span></td></tr>';}
      h+='</tbody></table></div></div></div>';
      document.getElementById("screen").innerHTML=h;
      mkChart("c5ba",{chart:{type:"bar",height:290},series:[{name:"改善前",data:[87.4,90.1,88.9,91.2]},{name:"改善後",data:[93.6,94.8,92.2,96]}],colors:["#64748b",BLUE],plotOptions:{bar:{borderRadius:2,columnWidth:"60%"}},xaxis:{categories:["CAPA-017","CAPA-012","CAPA-009","CAPA-044"],labels:{style:{fontFamily:"Fira Code",fontSize:"9px"}}},yaxis:{min:82,max:100,labels:{formatter:function(v){return v.toFixed(0)+"%";}}},grid:{borderColor:GRID},dataLabels:{enabled:false},legend:{show:false},tooltip:{shared:true,intersect:false,y:{formatter:function(v){return v.toFixed(1)+"%";}}}});
    }
    var SCREENS=[screen0,screen1,screen2,screen3,screen4,screen5];
    function show(i){
      destroyCharts();
      var btns=document.querySelectorAll("[data-i]");
      for(var b=0;b<btns.length;b++){
        var active=+btns[b].getAttribute("data-i")===i;
        btns[b].classList.toggle("active",active);
        btns[b].setAttribute("aria-current",active?"page":"false");
      }
      document.getElementById("scr-title").textContent=MODULES[i].name;
      document.getElementById("scr-sub").textContent=MODULES[i].sub;
      SCREENS[i]();
    }
    window.__show=show;
    function fromHash(){
      var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
      if(!m){show(0);return;}
      var n=document.querySelectorAll("[data-i]").length||6;
      show(Math.min(+m[1],n-1));
      try{window.scrollTo(0,0);}catch(e){}
    }
    window.addEventListener("hashchange",fromHash);
    fromHash();
  })();
  </script>
