<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>生產補料電子看板系統｜Jvision 系統 Demo</title>
<meta name="description" content="電子看板訊號觸發、生產/補料看板視覺化與看板循環週期監控" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --ok:#166534;
  --ok-bg:#DCFCE7;
  --warn:#92400E;
  --warn-bg:#FEF3C7;
  --bad:#B91C1C;
  --bad-bg:#FEE2E2;
  --blue-bg:#DBEAFE;
  --shadow:6px 6px 0 #1E293B;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
html,body{margin:0;min-height:100%}
body{
  background-color:var(--color-background);
  background-image:
    linear-gradient(var(--line) 1px,transparent 1px),
    linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Fira Sans",system-ui,sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:4px solid var(--color-ring);
  outline-offset:3px;
}
.mi{
  font-family:"Material Symbols Outlined";
  font-weight:500;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
  font-feature-settings:"liga";
}
.topbar{
  position:sticky;
  top:0;
  z-index:30;
  color:#fff;
  background:var(--ink);
  border-bottom:4px solid var(--color-accent);
}
.topbar-in{
  max-width:1440px;
  min-height:72px;
  margin:auto;
  padding:10px 20px;
  display:flex;
  align-items:center;
  gap:18px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  width:46px;
  height:46px;
  display:grid;
  place-items:center;
  flex:none;
  color:var(--color-on-accent);
  background:var(--color-accent);
  border:2px solid #fff;
  font-size:27px;
}
.tt{min-width:0}
.t1{
  overflow:hidden;
  font-size:17px;
  font-weight:900;
  letter-spacing:.02em;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.t2{
  margin-top:1px;
  color:#CBD5E1;
  font-family:"Fira Code",monospace;
  font-size:11px;
}
.brand-spacer{flex:1}
.env{display:flex;align-items:center;gap:8px}
.pill{
  min-height:38px;
  padding:7px 11px;
  display:flex;
  align-items:center;
  gap:7px;
  color:#fff;
  background:#334155;
  border:2px solid #64748B;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
}
.dot{
  width:10px;
  height:10px;
  background:#4ADE80;
  border:2px solid #fff;
  animation:pulse 1.8s steps(2,end) infinite;
}
@keyframes pulse{50%{opacity:.35}}
.tabs{
  position:sticky;
  top:72px;
  z-index:20;
  background:#fff;
  border-bottom:3px solid var(--ink);
}
.tabs-in{
  max-width:1440px;
  margin:auto;
  padding:8px 20px;
  display:flex;
  gap:7px;
  overflow-x:auto;
  scrollbar-width:thin;
}
.tab{
  min-height:44px;
  padding:8px 13px;
  display:flex;
  align-items:center;
  gap:7px;
  flex:none;
  color:var(--muted);
  background:#fff;
  border:2px solid var(--ink);
  font-size:13px;
  font-weight:700;
}
.tab:hover{color:var(--blue);background:var(--blue-bg)}
.tab.on{
  color:#fff;
  background:var(--blue);
  box-shadow:4px 4px 0 var(--ink);
}
.tab .mi{font-size:20px}
main{max-width:1440px;margin:auto;padding:24px 20px 64px}
.screen-head{
  min-height:118px;
  margin-bottom:18px;
  padding:20px;
  display:grid;
  grid-template-columns:minmax(250px,1fr) auto;
  align-content:center;
  gap:7px 20px;
  color:#fff;
  background:var(--ink);
  border:3px solid var(--ink);
  box-shadow:var(--shadow);
}
.screen-head .h1{
  margin:0;
  font-size:clamp(25px,3vw,42px);
  font-weight:900;
  line-height:1.08;
  letter-spacing:-.04em;
}
.screen-head .sub{color:#CBD5E1;font-size:13px}
.screen-head>.tag{grid-column:2;grid-row:1/span 2;align-self:center}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g32{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
.min0>*{min-width:0}
.card{
  min-width:0;
  padding:16px;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:2px solid var(--ink);
  box-shadow:4px 4px 0 #94A3B8;
}
.card h3{margin:0;font-size:14px;font-weight:900}
.ch{
  min-height:30px;
  margin-bottom:13px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  border-bottom:2px solid var(--line);
  padding-bottom:9px;
}
.ch .mi{color:var(--blue)}
.kpi{
  position:relative;
  overflow:hidden;
  min-height:144px;
}
.kpi:before{
  content:"";
  position:absolute;
  top:0;
  right:0;
  width:42px;
  height:12px;
  background:var(--color-accent);
  border-left:2px solid var(--ink);
  border-bottom:2px solid var(--ink);
}
.kl{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:12.5px;
  font-weight:700;
}
.kl .mi{color:var(--blue)!important}
.kv{
  margin-top:7px;
  font-family:"Fira Code",monospace;
  font-size:30px;
  font-weight:700;
  line-height:1.2;
  letter-spacing:-.05em;
  font-variant-numeric:tabular-nums;
}
.kv small{
  color:var(--muted);
  font-family:"Fira Sans",sans-serif;
  font-size:13px;
  font-weight:700;
  letter-spacing:0;
}
.kd{
  margin-top:9px;
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-size:12px;
  font-weight:700;
}
.kd .mi{font-size:16px}
.muted{color:var(--muted)}
.up{color:var(--ok)}
.down{color:var(--bad)}
.tag,.chip{
  min-height:25px;
  padding:3px 8px;
  display:inline-flex;
  align-items:center;
  gap:5px;
  border:1px solid currentColor;
  font-size:11px;
  font-weight:800;
  line-height:1.25;
  white-space:nowrap;
}
.tag.on{color:var(--ok);background:var(--ok-bg)}
.tag.wa{color:var(--warn);background:var(--warn-bg)}
.tag.ba{color:var(--bad);background:var(--bad-bg)}
.tag.bl{color:#1E40AF;background:var(--blue-bg)}
.tag.gy{color:var(--muted);background:var(--color-muted)}
.chart{width:100%;height:300px}
.chart.sm{height:240px}
.scroll{overflow:auto}
table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  font-size:13px;
}
th,td{
  padding:10px;
  text-align:left;
  white-space:nowrap;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
th:first-child,td:first-child{border-left:1px solid var(--line)}
th{
  color:var(--ink);
  background:var(--color-muted);
  border-top:2px solid var(--ink);
  border-bottom:2px solid var(--ink);
  font-size:11.5px;
  font-weight:800;
  letter-spacing:.03em;
}
tbody tr:hover{background:#EFF6FF}
td.mono,td:has(.bar){text-align:right}
.mono{
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
  font-weight:600;
}
.bar{
  min-width:70px;
  height:9px;
  overflow:hidden;
  background:var(--color-muted);
  border:1px solid var(--ink);
}
.bar>i{display:block;height:100%;background:var(--color-accent)}
.board{
  min-width:880px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}
.col{
  min-width:0;
  padding:10px;
  background:var(--color-muted);
  border:2px solid var(--ink);
}
.col:nth-child(even){transform:translateY(10px)}
.col-h{
  margin-bottom:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:13px;
  font-weight:900;
}
.cnt{
  min-width:28px;
  padding:2px 7px;
  text-align:center;
  background:#fff;
  border:2px solid var(--ink);
  font-family:"Fira Code",monospace;
}
.kcard{
  margin-bottom:9px;
  padding:11px;
  background:#fff;
  border:2px solid var(--ink);
  border-left:7px solid var(--color-accent);
  box-shadow:3px 3px 0 #94A3B8;
}
.kcard.urgent{border-left-color:var(--bad)}
.kcard.done{border-left-color:var(--ok)}
.kt{display:flex;justify-content:space-between;gap:7px;font-family:"Fira Code",monospace;font-size:13px;font-weight:700}
.km{
  margin-top:6px;
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  color:var(--muted);
  font-size:11.5px;
}
.kf{margin-top:9px;display:flex;align-items:center;justify-content:space-between}
.ava{
  width:26px;
  height:26px;
  display:grid;
  place-items:center;
  flex:none;
  color:#fff;
  background:var(--blue);
  border:2px solid var(--ink);
  font-size:11px;
  font-weight:800;
}
.srow{
  min-width:0;
  margin-bottom:9px;
  padding:11px;
  display:flex;
  align-items:center;
  gap:12px;
  background:#fff;
  border:2px solid var(--ink);
}
.srow:hover{background:#EFF6FF}
.icn{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  flex:none;
  border:2px solid currentColor;
  font-size:22px;
}
.srow .body{min-width:0;flex:1}
.ttl{font-size:13.5px;font-weight:900}
.sub2{margin-top:2px;color:var(--muted);font-size:12px}
.stock .track{
  position:relative;
  height:14px;
  overflow:hidden;
  background:var(--color-muted);
  border:2px solid var(--ink);
}
.stock .track>i{display:block;height:100%}
.stock .mk{position:absolute;top:-4px;width:3px;height:20px;background:var(--bad)}
.pills{display:flex;flex-wrap:wrap;gap:7px}
.tl{position:relative;padding-left:28px}
.tl:before{
  content:"";
  position:absolute;
  top:4px;
  bottom:4px;
  left:9px;
  width:3px;
  background:var(--ink);
}
.tl-i{position:relative;padding:0 0 17px 7px}
.tl-i:before{
  content:"";
  position:absolute;
  top:3px;
  left:-23px;
  width:14px;
  height:14px;
  background:#fff;
  border:4px solid var(--color-accent);
}
.tl-i.ok:before{border-color:var(--ok)}
.tl-i.bad:before{border-color:var(--bad)}
.tl-t{color:var(--muted);font-family:"Fira Code",monospace;font-size:11.5px;font-weight:700}
.tl-b{margin-top:2px;font-size:13.5px;font-weight:800}
.tl-d{margin-top:2px;color:var(--muted);font-size:12.5px}
.stat-line{
  padding:8px 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  border-bottom:1px dashed var(--muted);
  font-size:13px;
}
.stat-line:last-child{border-bottom:0}
.grid-item{animation:enter .4s cubic-bezier(.2,.9,.3,1.3) both}
.grid-item:nth-child(2){animation-delay:.06s}
.grid-item:nth-child(3){animation-delay:.12s}
.grid-item:nth-child(4){animation-delay:.18s}
@keyframes enter{
  from{opacity:0;transform:translateY(16px) scale(.92)}
  to{opacity:1;transform:none}
}
@media(max-width:1024px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .g23,.g32{grid-template-columns:1fr}
}
@media(max-width:768px){
  .topbar-in{padding-inline:14px}
  .tabs{top:72px}
  .tabs-in{padding-inline:14px}
  main{padding:18px 14px 48px}
  .g2,.g3{grid-template-columns:1fr}
  .screen-head{grid-template-columns:1fr}
  .screen-head>.tag{grid-column:1;grid-row:auto;justify-self:start}
}
@media(max-width:560px){
  .env .pill:first-child{display:none}
  .brand .t2{display:none}
  .tab .lbl{display:none}
  .tab{padding-inline:12px}
  .g4{grid-template-columns:1fr}
  .screen-head{min-height:0;padding:17px}
  .screen-head .h1{font-size:28px}
  .srow{align-items:flex-start;flex-wrap:wrap}
  .srow>div:last-child{width:100%;display:flex;align-items:center;justify-content:space-between}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  .grid-item{opacity:1;transform:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo mi" aria-hidden="true">view_kanban</div>
      <div class="tt">
        <div class="t1">電子看板系統 e-Kanban</div>
        <div class="t2">Electronic Kanban System · MES 製造執行</div>
      </div>
    </div>
    <div class="brand-spacer"></div>
    <div class="env">
      <span class="pill"><span class="dot" aria-hidden="true"></span>即時同步</span>
      <span class="pill"><span class="mi" aria-hidden="true">factory</span>台中一廠</span>
    </div>
  </div>
</header>
<nav class="tabs" aria-label="系統功能"><div class="tabs-in" id="tabs"></div></nav>
<main><div id="view" aria-live="polite"></div></main>
<script>
"use strict";
var TABS=[
{i:0,ic:"sensors",lbl:"消耗訊號觸發"},
{i:1,ic:"view_kanban",lbl:"電子看板牆"},
{i:2,ic:"local_shipping",lbl:"補料指令派送"},
{i:3,ic:"cached",lbl:"看板循環監控"},
{i:4,ic:"tune",lbl:"看板數量最佳化"},
{i:5,ic:"fact_check",lbl:"循環稽核歸零"}
];
var view=document.getElementById("view"),tabsEl=document.getElementById("tabs"),charts=[];
tabsEl.innerHTML=TABS.map(function(t){
 return '<button type="button" class="tab" data-i="'+t.i+'" aria-label="'+t.lbl+'"><span class="mi" aria-hidden="true">'+t.ic+'</span><span class="lbl">'+t.lbl+'</span></button>';
}).join("");
function disposeCharts(){charts.forEach(function(c){try{c.dispose()}catch(e){}});charts=[]}
function mkChart(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts.push(c)}
function bgOf(c){return{on:"ok-bg",wa:"warn-bg",ba:"bad-bg",bl:"blue-bg",gy:"color-muted"}[c]||"color-muted"}
function fgOf(c){return{on:"ok",wa:"warn",ba:"bad",bl:"blue",gy:"muted"}[c]||"muted"}
function kpi(label,ic,val,unit,dir,dic,note){
 var d=(dir==="up"||dir==="down")
 ?'<div class="kd '+dir+'"><span class="mi" aria-hidden="true">'+dic+'</span>'+note+'</div>'
 :'<div class="kd muted"><span class="mi" aria-hidden="true">info</span>'+note+'</div>';
 return '<div class="card kpi grid-item"><div class="kl"><span class="mi" aria-hidden="true">'+ic+'</span>'+label+'</div><div class="kv">'+val+' <small>'+unit+'</small></div>'+d+'</div>';
}
function head(title,sub,tag,icon,text){
 return '<div class="screen-head grid-item"><h2 class="h1">'+title+'</h2><span class="sub">'+sub+'</span><span class="tag '+tag+'"><span class="mi" aria-hidden="true">'+icon+'</span>'+text+'</span></div>';
}
function s0(){
 var signals=[
 {mi:"bolt",cl:"ba",title:"料架 A-12 觸發補料",p:"BOLT-M6×30 螺栓",loc:"組裝線1 · 工位3",t:"09:41",pct:8,rop:20,st:"待補料"},
 {mi:"bolt",cl:"wa",title:"料架 C-04 觸發補料",p:"連接端子 CT-220",loc:"焊接區 · 工位7",t:"09:38",pct:22,rop:25,st:"已派工"},
 {mi:"bolt",cl:"bl",title:"料架 B-07 觸發補料",p:"外殼 SUS304-L",loc:"組裝線2 · 工位1",t:"09:30",pct:15,rop:18,st:"配送中"},
 {mi:"check",cl:"on",title:"料架 D-19 到料歸零",p:"墊圈 W-M6",loc:"組裝線1 · 工位5",t:"09:12",pct:96,rop:20,st:"已歸零"}
 ];
 var stocks=[
 {n:"BOLT-M6×30",cur:8,rop:20,max:120,u:"pcs"},
 {n:"CT-220 端子",cur:110,rop:100,max:400,u:"pcs"},
 {n:"SUS304-L 外殼",cur:34,rop:40,max:200,u:"pcs"},
 {n:"墊圈 W-M6",cur:290,rop:150,max:500,u:"pcs"},
 {n:"矽膠密封條",cur:62,rop:80,max:300,u:"m"}
 ];
 view.innerHTML=head("消耗訊號觸發","料架看板量觸底自動辨識，產生待補料電子看板訊號","on","sensors","觸發引擎在線")
 +'<div class="grid g4 min0" style="margin-bottom:14px">'+kpi("今日觸發訊號","sensors","38","張","up","arrow_upward","較昨日 +6")+kpi("待補料訊號","pending_actions","6","張","down","priority_high","即時待處理")+kpi("平均觸發反應","timer","3.2","分","up","arrow_downward","紙本時代 22 分")+kpi("觸底防呆攔截","shield","12","次","up","arrow_upward","本月避免停線")+'</div>'
 +'<div class="grid g23 min0"><section class="card grid-item"><div class="ch"><h3><span class="mi" aria-hidden="true">notifications_active</span> 即時觸發訊號流</h3><span class="tag gy">依時間排序</span></div>'

 RENDER[i]();
}
tabsEl.addEventListener("click",function(e){
 var t=e.target.closest("[data-i]");
 if(!t)return;
 var i=+t.getAttribute("data-i");
 show(i);
 if(location.hash!=="#v"+i){try{history.replaceState(null,"","#v"+i)}catch(err){}}
});
function fromHash(){
 var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
 if(!m){show(0);return}
 show(Math.min(+m[1],5));
 try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
window.addEventListener("resize",function(){charts.forEach(function(c){c.resize()})});
fromHash();
</script>
