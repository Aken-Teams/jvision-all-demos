<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DevOps/CI-CD 平台｜Jvision 系統 Demo</title>
<meta name="description" content="從程式碼提交、自動建置測試、安全掃描到部署上線與自動回滾的 CI/CD 全流程（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --red:#dc2626; --red-d:#b91c1c; --orange:#f97316; --ink:#0b1220; --sidebar:#111827; --sidebar2:#0b111e;
    --body:#374151; --muted:#6b7280; --line:#e5e7eb; --bg:#f4f5f7; --card:#ffffff;
    --green:#16a34a; --amber:#f59e0b; --sky:#0ea5e9; --violet:#7c3aed;
  }
  *{ box-sizing:border-box; } html,body{ margin:0; }
  body{ font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--body); -webkit-font-smoothing:antialiased; }
  .material-symbols-outlined{ font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; line-height:1; }
  .shell{ display:grid; grid-template-columns:246px 1fr; min-height:100vh; }
  /* sidebar */
  .side{ background:linear-gradient(180deg,var(--sidebar),var(--sidebar2)); color:#cbd5e1; display:flex; flex-direction:column; padding:18px 14px; position:sticky; top:0; height:100vh; gap:4px; min-width:0; }
  .brand{ display:flex; align-items:center; gap:11px; padding:4px 6px 16px; }
  .brand .logo{ width:42px; height:42px; border-radius:12px; background:linear-gradient(135deg,var(--red),var(--orange)); color:#fff; display:grid; place-content:center; flex:0 0 auto; box-shadow:0 6px 16px rgba(220,38,38,.4); }
  .brand .logo .material-symbols-outlined{ font-size:24px; }
  .brand b{ color:#fff; font-size:15px; font-weight:900; display:block; line-height:1.2; }
  .brand span{ font-size:11px; color:#94a3b8; }
  .navlab{ font-size:10px; font-weight:800; letter-spacing:.14em; color:#64748b; padding:12px 10px 6px; }
  .side nav{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .side nav button{ display:flex; align-items:center; gap:12px; width:100%; border:0; background:none; color:#cbd5e1; padding:11px 12px; border-radius:11px; font:inherit; font-size:13.5px; font-weight:700; cursor:pointer; text-align:left; min-width:0; }
  .side nav button .material-symbols-outlined{ font-size:21px; flex:0 0 auto; }
  .side nav button .tx{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .side nav button .no{ margin-left:auto; font-size:11px; color:#64748b; font-weight:800; flex:0 0 auto; }
  .side nav button:hover{ background:rgba(255,255,255,.06); color:#fff; }
  .side nav button.on{ background:linear-gradient(135deg,var(--red),var(--red-d)); color:#fff; box-shadow:0 6px 16px rgba(220,38,38,.32); }
  .side nav button.on .no{ color:#fecaca; }
  .side .foot{ margin-top:auto; padding:12px 10px 4px; border-top:1px solid rgba(255,255,255,.08); font-size:11px; color:#64748b; display:flex; align-items:center; gap:8px; }
  .side .foot .av{ width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,var(--orange),var(--red)); color:#fff; display:grid; place-content:center; font-weight:800; font-size:12px; flex:0 0 auto; }
  .side .foot b{ color:#e2e8f0; display:block; font-size:12px; }
  /* main */
  .main{ min-width:0; display:flex; flex-direction:column; }
  .top{ position:sticky; top:0; z-index:10; background:rgba(255,255,255,.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); padding:14px 26px; display:flex; align-items:center; gap:14px; min-width:0; }
  .top h1{ margin:0; font-size:18px; font-weight:900; color:var(--ink); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .top .sub{ font-size:12px; color:var(--muted); margin-top:2px; }
  .top .r{ margin-left:auto; display:flex; align-items:center; gap:12px; flex:0 0 auto; }
  .pill{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:800; color:var(--green); background:#dcfce7; border-radius:999px; padding:5px 11px; }
  .pill .dot{ width:7px; height:7px; border-radius:50%; background:var(--green); }
  .body{ padding:22px 26px 48px; min-width:0; }
  /* generic */
  .grid{ display:grid; gap:16px; min-width:0; }
  .g4{ grid-template-columns:repeat(4,1fr); }
  .g3{ grid-template-columns:repeat(3,1fr); }
  .g2{ grid-template-columns:repeat(2,1fr); }
  .g21{ grid-template-columns:1.6fr 1fr; }
  .g12{ grid-template-columns:1fr 1.6fr; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; min-width:0; }
  .card h3{ margin:0 0 3px; font-size:14.5px; font-weight:900; color:var(--ink); display:flex; align-items:center; gap:8px; }
  .card h3 .material-symbols-outlined{ font-size:19px; color:var(--red); }
  .card .cap{ font-size:11.5px; color:var(--muted); margin:0 0 14px; }
  .kpi .lab{ font-size:12px; color:var(--muted); font-weight:700; display:flex; align-items:center; gap:6px; }
  .kpi .lab .material-symbols-outlined{ font-size:18px; }
  .kpi .val{ font-size:29px; font-weight:900; color:var(--ink); margin-top:8px; line-height:1; letter-spacing:-.01em; }
  .kpi .val small{ font-size:14px; font-weight:800; color:var(--muted); }
  .kpi .delta{ font-size:11.5px; font-weight:800; margin-top:8px; display:inline-flex; align-items:center; gap:3px; }
  .up{ color:var(--green); } .down{ color:var(--red); }
  .kpi .bar{ margin-top:12px; height:6px; border-radius:99px; background:#eef1f5; overflow:hidden; }
  .kpi .bar i{ display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--red),var(--orange)); }
  .chartbox{ position:relative; overflow:hidden; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:560px; }
  th{ text-align:left; font-size:11px; font-weight:800; color:var(--muted); letter-spacing:.04em; padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td{ padding:11px 12px; border-bottom:1px solid #f1f2f4; color:var(--body); vertical-align:middle; }
  tr:last-child td{ border-bottom:0; }
  .tag{ display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:800; padding:3px 9px; border-radius:99px; white-space:nowrap; }
  .t-green{ background:#dcfce7; color:#15803d; } .t-red{ background:#fee2e2; color:#b91c1c; } .t-amber{ background:#fef3c7; color:#b45309; }
  .t-sky{ background:#e0f2fe; color:#0369a1; } .t-gray{ background:#eef1f5; color:#475569; } .t-violet{ background:#ede9fe; color:#6d28d9; }
  .mono{ font-family:"SFMono-Regular",Consolas,Menlo,monospace; font-size:11.5px; }
  .avat{ width:26px; height:26px; border-radius:50%; display:grid; place-content:center; font-size:11px; font-weight:800; color:#fff; flex:0 0 auto; }
  .who{ display:flex; align-items:center; gap:8px; }
  .scroll{ overflow-x:auto; }
  .sec-h{ display:flex; align-items:center; gap:10px; margin:0 0 4px; }
  .sec-h h2{ margin:0; font-size:17px; font-weight:900; color:var(--ink); }
  .sec-h .material-symbols-outlined{ color:var(--red); }
  .sec-sub{ font-size:12.5px; color:var(--muted); margin:2px 0 18px; }
  /* pipeline board */
  .pipe{ display:grid; grid-template-columns:repeat(5,1fr); gap:12px; min-width:0; }
  .stage{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; min-width:0; }
  .stage .sh{ display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:900; color:var(--ink); margin-bottom:10px; }
  .stage .sh .ic{ width:28px; height:28px; border-radius:9px; display:grid; place-content:center; color:#fff; flex:0 0 auto; }
  .stage .sh .ic .material-symbols-outlined{ font-size:17px; }
  .job{ border:1px solid var(--line); border-radius:10px; padding:9px 10px; margin-bottom:8px; font-size:11.5px; }
  .job:last-child{ margin-bottom:0; }
  .job b{ display:block; color:var(--ink); font-size:12px; font-weight:800; margin-bottom:3px; }
  .job .meta{ color:var(--muted); font-size:10.5px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  /* timeline */
  .tl{ position:relative; padding-left:26px; }
  .tl:before{ content:""; position:absolute; left:9px; top:4px; bottom:4px; width:2px; background:var(--line); }
  .tl .ev{ position:relative; padding:0 0 18px; }
  .tl .ev:last-child{ padding-bottom:0; }
  .tl .ev .dt{ position:absolute; left:-26px; top:1px; width:20px; height:20px; border-radius:50%; background:#fff; border:2px solid var(--red); display:grid; place-content:center; }
  .tl .ev .dt i{ width:7px; height:7px; border-radius:50%; background:var(--red); display:block; }
  .tl .ev .tm{ font-size:11px; color:var(--muted); font-weight:800; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .tl .ev .ti{ font-size:13px; font-weight:800; color:var(--ink); margin:2px 0; }
  .tl .ev .ds{ font-size:11.5px; color:var(--body); }
  /* list rows */
  .lrow{ display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid #f1f2f4; min-width:0; }
  .lrow:last-child{ border-bottom:0; }
  .lrow .nm{ font-size:12.5px; font-weight:800; color:var(--ink); min-width:0; }
  .lrow .sm{ font-size:11px; color:var(--muted); }
  .env{ display:flex; align-items:center; gap:8px; font-weight:800; font-size:12.5px; color:var(--ink); min-width:0; }
  .env .dot{ width:9px; height:9px; border-radius:50%; flex:0 0 auto; }
  .btn{ display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 13px; border-radius:9px; border:0; background:var(--red); color:#fff; font:inherit; font-weight:800; font-size:12.5px; cursor:pointer; }
  .btn.ghost{ background:#fff; color:var(--red); border:1px solid var(--line); }
  .btn .material-symbols-outlined{ font-size:17px; }
  .rb{ display:flex; gap:8px; flex-wrap:wrap; }
  .legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--muted); font-weight:700; margin-top:10px; }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .legend i{ width:10px; height:10px; border-radius:3px; display:inline-block; }
  /* responsive */
  @media(max-width:1100px){ .g4{ grid-template-columns:repeat(2,1fr); } .g21,.g12{ grid-template-columns:1fr; } .pipe{ grid-template-columns:repeat(2,1fr); } }
  @media(max-width:860px){
    .shell{ grid-template-columns:1fr; }
    .side{ position:static; height:auto; flex-direction:column; padding:12px 14px; }
    .side nav{ flex-direction:row; flex-wrap:wrap; }
    .side nav button{ width:auto; flex:1 1 auto; justify-content:center; }
    .side nav button .no{ display:none; }
    .navlab,.side .foot{ display:none; }
  }
  @media(max-width:820px){
    .g3,.g2,.g4{ grid-template-columns:1fr; }
    .pipe{ grid-template-columns:1fr; }
  }
  @media(max-width:560px){
    .side nav button .tx{ display:none; }
    .side nav button{ padding:10px; }
    .body{ padding:16px 14px 40px; }
    .top{ padding:12px 14px; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">account_tree</span></div>
      <div><b>DevOps CI/CD</b><span>發布交付平台</span></div>
    </div>
    <div class="navlab">交付管線</div>
    <nav id="nav"></nav>
    <div class="foot">
      <div class="av">DP</div>
      <div><b>DevOps 團隊</b>應用開發部</div>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <div style="min-width:0">
        <h1 id="scr-title">總覽</h1>
        <div class="sub" id="scr-sub">CI/CD 交付與部署健康度</div>
      </div>
      <div class="r">
        <span class="pill"><span class="dot"></span>管線運行中</span>
      </div>
    </header>
    <div class="body" id="view"></div>
  </main>
</div>
<script>
(function(){
  var NAV = [
    { ic:"account_tree", tx:"版本控管", no:"v0" },
    { ic:"build",        tx:"建置測試", no:"v1" },
    { ic:"shield",       tx:"安全掃描", no:"v2" },
    { ic:"engineering",  tx:"部署管線", no:"v3" },
    { ic:"gavel",        tx:"發布審核", no:"v4" },
    { ic:"monitoring",   tx:"監控回滾", no:"v5" }
  ];
  var TITLES = [
    ["版本控管","分支、提交與合併請求"],
    ["建置測試","自動化建置與單元測試 CI"],
    ["安全掃描","程式碼與相依套件弱點掃描"],
    ["部署管線","多環境持續部署 CD"],
    ["發布審核","上線變更審核與核准閘門"],
    ["監控回滾","部署後監控與異常自動回滾"]
  ];
  var pal = { red:"#dc2626", orange:"#f97316", green:"#16a34a", amber:"#f59e0b", sky:"#0ea5e9", violet:"#7c3aed", gray:"#94a3b8" };
  var av = ["#dc2626","#f97316","#0ea5e9","#7c3aed","#16a34a","#0891b2"];

  var charts = {};
  function destroyCharts(){ for(var k in charts){ try{ charts[k].destroy(); }catch(e){} } charts = {}; }
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function tag(cls,txt){ return '<span class="tag '+cls+'">'+esc(txt)+'</span>'; }
  function initname(s){ return String(s).slice(0,2); }
  function kpicards(kpis){
    var h = '<div class="grid g4">';
    for(var i=0;i<kpis.length;i++){ var k=kpis[i];
      h += '<div class="card kpi"><div class="lab"><span class="material-symbols-outlined">'+k.ic+'</span>'+k.lab+'</div>'
        +'<div class="val">'+k.val+'</div>'
        +'<div class="delta '+(k.up?'up':'down')+'"><span class="material-symbols-outlined" style="font-size:15px">'+(k.up?'trending_up':'trending_down')+'</span>'+esc(k.d)+'</div>'
        +'<div class="bar"><i style="width:'+k.p+'%"></i></div></div>';
    }
    return h + '</div>';
  }

  var view = document.getElementById("view");
  var navEl = document.getElementById("nav");

  var nb = "";
  for(var i=0;i<NAV.length;i++){
    nb += '<button data-i="'+i+'"><span class="material-symbols-outlined">'+NAV[i].ic+'</span><span class="tx">'+NAV[i].tx+'</span><span class="no">'+NAV[i].no+'</span></button>';
  }
  navEl.innerHTML = nb;
  navEl.addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("button[data-i]") : null;
    if(!b) return;
    location.hash = "v"+b.getAttribute("data-i");
  });

  /* ========== SCREEN 0 : 版本控管 ========== */
  function s0(){
    var kpis = [
      { lab:"活躍分支", ic:"account_tree", val:"37", d:"+5 本週", up:true, p:74 },
      { lab:"待審合併請求", ic:"rule", val:"12", d:"3 件逾時", up:false, p:48 },
      { lab:"今日提交數", ic:"history", val:"186", d:"+22%", up:true, p:82 },
      { lab:"平均審查時長", ic:"schedule", val:"3.4<small>h</small>", d:"-0.6h", up:true, p:66 }
    ];
    var h = kpicards(kpis);
    h += '<div class="grid g21" style="margin-top:16px">';
    var mrs = [
      { id:"!4821", ti:"支付服務逾時重試機制", au:"林承恩", br:"feat/pay-retry", ap:2, need:2, ci:"pass", st:"t-green", sn:"可合併" },
      { id:"!4815", ti:"訂單查詢 API 分頁優化", au:"黃詩涵", br:"perf/order-page", ap:1, need:2, ci:"pass", st:"t-amber", sn:"待審查" },
      { id:"!4808", ti:"會員資料加密欄位遷移", au:"陳柏宇", br:"feat/pii-crypto", ap:0, need:2, ci:"fail", st:"t-red", sn:"CI 失敗" },
      { id:"!4802", ti:"報表匯出格式修正", au:"吳孟樺", br:"fix/export-csv", ap:2, need:2, ci:"pass", st:"t-green", sn:"可合併" },
      { id:"!4797", ti:"登入頁 UI 改版", au:"張哲維", br:"feat/login-ui", ap:1, need:1, ci:"running", st:"t-sky", sn:"建置中" }
    ];
    var rows = "";
    for(var m=0;m<mrs.length;m++){ var r=mrs[m];
      var citag = r.ci==="pass"?tag("t-green","通過"):r.ci==="fail"?tag("t-red","失敗"):tag("t-sky","執行中");
      rows += '<tr><td class="mono" style="color:#b91c1c;font-weight:800">'+esc(r.id)+'</td>'
        +'<td><b style="color:#0b1220">'+esc(r.ti)+'</b><div class="mono" style="color:#6b7280">'+esc(r.br)+'</div></td>'
        +'<td><div class="who"><div class="avat" style="background:'+av[m%av.length]+'">'+esc(initname(r.au))+'</div>'+esc(r.au)+'</div></td>'
        +'<td>'+r.ap+' / '+r.need+'</td>'
        +'<td>'+citag+'</td>'
        +'<td>'+tag(r.st,r.sn)+'</td></tr>';
    }
    h += '<div class="card"><h3><span class="material-symbols-outlined">rule</span>合併請求佇列</h3><p class="cap">依審查狀態與 CI 結果排序，逾時項目優先處理</p>'
      +'<div class="scroll"><table><thead><tr><th>編號</th><th>標題 / 分支</th><th>作者</th><th>核准</th><th>CI</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
    h += '<div class="card"><h3><span class="material-symbols-outlined">history</span>近 7 日提交活動</h3><p class="cap">提交 vs 合併次數</p>'
      +'<div class="chartbox" style="height:230px"><canvas id="c0a"></canvas></div></div>';
    h += '</div>';
    view.innerHTML = h;
    void view.offsetHeight;
    var el = document.getElementById("c0a");
    if(el){ charts.c0a = new Chart(el, { type:"bar",
      data:{ labels:["週一","週二","週三","週四","週五","週六","週日"],
        datasets:[
          { label:"提交", data:[42,38,55,49,61,18,9], backgroundColor:pal.red, borderRadius:5, maxBarThickness:24 },
          { label:"合併", data:[6,5,9,7,11,3,2], backgroundColor:pal.orange, borderRadius:5, maxBarThickness:24 }
        ]},
      options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:"bottom", labels:{ boxWidth:12, font:{ size:11 } } } }, scales:{ x:{ grid:{ display:false } }, y:{ beginAtZero:true, grid:{ color:"#f0f1f3" } } } }
    }); }
  }

  /* ========== SCREEN 1 : 建置測試 ========== */
  function s1(){
    var kpis = [
      { lab:"今日建置", ic:"build", val:"64", d:"58 成功", up:true, p:90 },
      { lab:"建置成功率", ic:"task_alt", val:"91<small>%</small>", d:"+3%", up:true, p:91 },
      { lab:"測試覆蓋率", ic:"fact_check", val:"84<small>%</small>", d:"+1.5%", up:true, p:84 },
      { lab:"平均建置時長", ic:"schedule", val:"4<small>m</small>12<small>s</small>", d:"-38s", up:true, p:70 }
    ];
    var h = kpicards(kpis);
    h += '<div class="grid g2" style="margin-top:16px">';
    h += '<div class="card"><h3><span class="material-symbols-outlined">trending_up</span>近 12 次建置時長趨勢</h3><p class="cap">單元測試 + 整合測試（分鐘）</p>'
      +'<div class="chartbox" style="height:230px"><canvas id="c1a"></canvas></div></div>';
    h += '<div class="card"><h3><span class="material-symbols-outlined">fact_check</span>測試結果分布</h3><p class="cap">最近一次建置的 2,148 個測試案例</p>'
      +'<div class="chartbox" style="height:230px"><canvas id="c1b"></canvas></div>'
      +'<div class="legend"><span><i style="background:'+pal.green+'"></i>通過 1,986</span><span><i style="background:'+pal.red+'"></i>失敗 34</span><span><i style="background:'+pal.amber+'"></i>略過 128</span></div></div>';
    h += '</div>';
    var bs = [
      { id:"#8842", br:"main", trig:"合併 !4821", st:"成功", cls:"t-green", cov:"84.2%", dur:"3m58s", tests:"2148/2148" },
      { id:"#8841", br:"perf/order-page", trig:"推送提交", st:"成功", cls:"t-green", cov:"83.9%", dur:"4m21s", tests:"2140/2148" },
