<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>軟體開發與自動部署平台｜Jvision 系統 Demo</title>
<meta name="description" content="從程式碼提交、自動建置測試、安全掃描到部署上線與自動回滾的 CI/CD 全流程（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#fff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000;
  --color-accent:#ea580c;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#1e293b;
  --color-card:#fff;
  --color-card-foreground:#1e293b;
  --color-muted:#e9eff8;
  --color-muted-foreground:#475569;
  --color-border:#e2e8f0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#1e293b;
  --muted:#475569;
  --line:#e2e8f0;
  --green:#15803d;
  --amber:#a84300;
  --sky:#0369a1;
  --violet:#6d28d9;
  --red:#dc2626;
  --orange:#ea580c;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.05);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  background:var(--color-background);
  color:var(--color-foreground);
  font-family:"Work Sans","Microsoft JhengHei",sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,a{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;
  line-height:1;
}
.shell{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.side{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  gap:5px;
  height:100vh;
  padding:24px 18px;
  overflow:auto;
  background:#fff;
  border-right:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:12px;padding:0 4px 26px}
.logo{
  display:grid;
  flex:0 0 auto;
  place-items:center;
  width:44px;
  height:44px;
  color:#fff;
  background:var(--color-primary);
  border-radius:10px;
  box-shadow:5px 5px 0 #bfdbfe;
}
.logo .material-symbols-outlined{font-size:24px}
.brand b{
  display:block;
  color:var(--ink);
  font-family:"Outfit",sans-serif;
  font-size:15px;
  font-weight:700;
  line-height:1.15;
}
.brand span{color:var(--muted);font-size:11px}
.navlab{
  padding:0 10px 8px;
  color:var(--muted);
  font-size:10px;
  font-weight:700;
  letter-spacing:.15em;
  text-transform:uppercase;
}
.side nav{display:flex;flex-direction:column;gap:5px}
.side nav button{
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  min-height:44px;
  padding:10px 12px;
  color:var(--muted);
  text-align:left;
  background:transparent;
  border:1px solid transparent;
  border-radius:8px;
  transition:color .2s ease,background-color .2s ease,border-color .2s ease,transform .2s ease;
}
.side nav button:hover{
  color:var(--blue);
  background:#eff6ff;
  border-color:#bfdbfe;
  transform:translateX(2px);
}
.side nav button.on{
  color:#fff;
  background:var(--blue);
  border-color:var(--blue);
  box-shadow:4px 4px 0 #bfdbfe;
}
.side nav button .material-symbols-outlined{font-size:20px}
.side nav button .tx{overflow:hidden;font-weight:600;text-overflow:ellipsis;white-space:nowrap}
.side nav button .no{
  margin-left:auto;
  font-family:"SFMono-Regular",Consolas,monospace;
  font-size:10px;
  font-weight:700;
}
.side nav button.on .no{color:#dbeafe}
.side .foot{
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:auto;
  padding:18px 8px 2px;
  color:var(--muted);
  border-top:1px solid var(--line);
  font-size:11px;
}
.side .foot .av{
  display:grid;
  flex:0 0 auto;
  place-items:center;
  width:32px;
  height:32px;
  color:#fff;
  background:var(--ink);
  border-radius:8px;
  font-family:"Outfit",sans-serif;
  font-weight:700;
}
.side .foot b{display:block;color:var(--ink);font-size:12px}
.main{display:flex;min-width:0;flex-direction:column}
.top{
  position:sticky;
  top:0;
  z-index:15;
  display:flex;
  align-items:center;
  gap:16px;
  min-height:76px;
  padding:14px clamp(18px,3vw,40px);
  background:rgba(248,250,252,.94);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(12px);
}
.top h1{
  overflow:hidden;
  margin:0;
  color:var(--ink);
  font-family:"Outfit",sans-serif;
  font-size:clamp(20px,2vw,25px);
  font-weight:700;
  letter-spacing:-.02em;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.top .sub{margin-top:1px;color:var(--muted);font-size:12px}
.top .r{display:flex;align-items:center;gap:12px;margin-left:auto}
.pill{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:6px 11px;
  color:#166534;
  background:#f0fdf4;
  border:1px solid #bbf7d0;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
.pill .dot{width:7px;height:7px;background:#15803d;border-radius:50%;box-shadow:0 0 0 3px #dcfce7}
.body{min-width:0;padding:28px clamp(18px,3vw,40px) 56px}
.grid{display:grid;gap:16px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.card,.stage{
  min-width:0;
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:10px;
  box-shadow:var(--shadow);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.card{padding:20px}
.card:hover,.stage:hover{
  border-color:#bfdbfe;
  box-shadow:0 2px 3px rgba(15,23,42,.04),0 14px 30px rgba(37,99,235,.08);
  transform:translateY(-2px);
}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 4px;
  color:var(--ink);
  font-family:"Outfit",sans-serif;
  font-size:15px;
  font-weight:700;
}
.card h3 .material-symbols-outlined{color:var(--blue);font-size:19px}
.card .cap{margin:0 0 16px;color:var(--muted);font-size:11.5px}
.kpi{position:relative;overflow:hidden}
.kpi:before{
  position:absolute;
  top:0;
  right:0;
  left:0;
  height:3px;
  background:var(--blue);
  content:"";
}
.kpi .lab{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:12px;
  font-weight:600;
}
.kpi .lab .material-symbols-outlined{color:var(--blue);font-size:18px}
.kpi .val{
  margin-top:13px;
  color:var(--ink);
  font-family:"Outfit",sans-serif;
  font-size:32px;
  font-variant-numeric:tabular-nums;
  font-weight:700;
  letter-spacing:-.025em;
  line-height:1;
}
.kpi .val small{color:var(--muted);font-size:14px;font-weight:600}
.kpi .delta{
  display:inline-flex;
  align-items:center;
  gap:3px;
  margin-top:10px;
  font-size:11px;
  font-weight:700;
}
.up{color:#166534}
.down{color:#b91c1c}
.kpi .bar{height:4px;margin-top:15px;overflow:hidden;background:var(--color-muted);border-radius:99px}
.kpi .bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.chartbox{position:relative;overflow:hidden}
.scroll{overflow-x:auto;overscroll-behavior-inline:contain}
table{
  width:100%;
  min-width:590px;
  border-collapse:collapse;
  font-size:12px;
  font-variant-numeric:tabular-nums;
}
th{
  padding:10px 12px;
  color:var(--muted);
  text-align:left;
  background:#f8fafc;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.045em;
  white-space:nowrap;
}
td{
  padding:12px;
  color:#334155;
  vertical-align:middle;
  border-bottom:1px solid #edf2f7;
}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#f8fbff}
tr:last-child td{border-bottom:0}
td[style*="font-weight:800"],td .mono{font-variant-numeric:tabular-nums}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 8px;
  border:1px solid transparent;
  border-radius:999px;
  font-size:10.5px;
  font-weight:700;
  line-height:1.35;
  white-space:nowrap;
}
.tag:before{width:6px;height:6px;background:currentColor;border-radius:50%;content:""}
.t-green{color:#166534;background:#f0fdf4;border-color:#bbf7d0}
.t-red{color:#991b1b;background:#fef2f2;border-color:#fecaca}
.t-amber{color:#92400e;background:#fffbeb;border-color:#fde68a}
.t-sky{color:#075985;background:#f0f9ff;border-color:#bae6fd}
.t-gray{color:#475569;background:#f1f5f9;border-color:#cbd5e1}
.t-violet{color:#5b21b6;background:#f5f3ff;border-color:#ddd6fe}
.mono{font-family:"SFMono-Regular",Consolas,Menlo,monospace;font-size:11px;font-variant-numeric:tabular-nums}
.avat{
  display:grid;
  flex:0 0 auto;
  place-items:center;
  width:27px;
  height:27px;
  color:#fff;
  border-radius:7px;
  font-family:"Outfit",sans-serif;
  font-size:10px;
  font-weight:700;
}
.who{display:flex;align-items:center;gap:8px;white-space:nowrap}
.sec-h{display:flex;align-items:center;gap:10px;margin:0 0 4px}
.sec-h h2{margin:0;color:var(--ink);font-family:"Outfit",sans-serif;font-size:22px;font-weight:700}
.sec-h .material-symbols-outlined{color:var(--blue)}
.sec-sub{margin:2px 0 20px;color:var(--muted);font-size:12.5px}
.pipe{display:grid;grid-template-columns:repeat(5,minmax(172px,1fr));gap:12px;min-width:930px}
.stage{padding:15px}
.stage .sh{display:flex;align-items:center;gap:8px;margin-bottom:11px;color:var(--ink);font-size:12px;font-weight:700}
.stage .sh .ic{
  display:grid;
  flex:0 0 auto;
  place-items:center;
  width:30px;
  height:30px;
  color:#fff;
  border-radius:7px;
}
.stage .sh .ic .material-symbols-outlined{font-size:17px}
.job{margin-bottom:8px;padding:10px;background:#f8fafc;border:1px solid var(--line);border-radius:7px}
.job:last-child{margin-bottom:0}
.job b{display:block;margin-bottom:4px;color:var(--ink);font-size:11.5px;font-weight:700}
.job .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:10px}
.tl{position:relative;padding-left:27px}
.tl:before{position:absolute;top:5px;bottom:4px;left:9px;width:1px;background:#cbd5e1;content:""}
.tl .ev{position:relative;padding:0 0 19px}
.tl .ev:last-child{padding-bottom:0}
.tl .ev .dt{
  position:absolute;
  top:1px;
  left:-27px;
  display:grid;
  place-items:center;
  width:19px;
  height:19px;
  background:#fff;
  border:2px solid var(--blue);
  border-radius:50%;
}
.tl .ev .dt i{display:block;width:5px;height:5px;background:var(--blue);border-radius:50%}
.tl .ev .tm{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums}
.tl .ev .ti{margin:3px 0;color:var(--ink);font-size:12.5px;font-weight:700}
.tl .ev .ds{color:#475569;font-size:11px}
.lrow{display:flex;align-items:center;gap:10px;min-width:0;padding:11px 0;border-bottom:1px solid #edf2f7}
.lrow:last-child{border-bottom:0}
.lrow .nm{min-width:0;color:var(--ink);font-size:12px;font-weight:700}
.lrow .sm{color:var(--muted);font-size:10.5px}
.env{display:flex;align-items:center;gap:8px;min-width:0;color:var(--ink);font-size:12px;font-weight:700}
.env .dot{width:8px;height:8px;flex:0 0 auto;border-radius:50%;box-shadow:0 0 0 3px #e2e8f0}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  min-height:40px;
  padding:0 15px;
  color:#fff;
  background:var(--blue);
  border:1px solid var(--blue);
  border-radius:7px;
  font-size:12px;
  font-weight:700;
  transition:background-color .2s ease,border-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.btn:hover{background:#1d4ed8;border-color:#1d4ed8;box-shadow:3px 3px 0 #bfdbfe;transform:translateY(-1px)}
.btn.ghost{color:#b91c1c;background:#fff;border-color:#fecaca}
.btn.ghost:hover{background:#fef2f2;border-color:#f87171;box-shadow:3px 3px 0 #fecaca}
.btn .material-symbols-outlined{font-size:17px}
.rb{display:flex;gap:8px;flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:11px;font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px}
@keyframes enter{
  from{opacity:0;transform:translateY(14px) scale(.98)}
  to{opacity:1;transform:none}
}
#view>.grid>.card,#view>.card,#view>.scroll,#view>.sec-h,#view>.sec-sub{
  animation:enter .4s cubic-bezier(.2,.8,.2,1) both;
}
#view>.grid>.card:nth-child(2){animation-delay:.06s}
#view>.grid>.card:nth-child(3){animation-delay:.12s}
#view>.grid>.card:nth-child(4){animation-delay:.18s}
@media(max-width:1180px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g21,.g12{grid-template-columns:1fr}
}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;padding:14px 18px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding-bottom:12px}
  .side nav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
  .side nav button{justify-content:center;padding:9px 6px}
  .side nav button .no,.navlab,.side .foot{display:none}
}
@media(max-width:768px){
  .side nav{grid-template-columns:repeat(3,1fr)}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .top{min-height:68px}
  .body{padding-top:20px}
}
@media(max-width:480px){
  .side{padding:12px}
  .brand{padding-left:4px}
  .side nav button{min-height:42px}
  .side nav button .tx{font-size:11px}
  .top{padding:11px 14px}
  .top .sub{display:none}
  .pill{padding:6px 8px;font-size:10px}
  .body{padding:16px 14px 40px}
  .card{padding:16px}
  .kpi .val{font-size:29px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
    transition-duration:.01ms!important;
  }
  #view>.grid>.card,#view>.card,#view>.scroll,#view>.sec-h,#view>.sec-sub{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined" aria-hidden="true">account_tree</span></div>
      <div><b>軟體開發與<br />自動部署平台</b><span>Development Operations</span></div>
    </div>
    <div class="navlab">交付管線</div>
    <nav id="nav" aria-label="主要功能"></nav>
    <div class="foot">
      <div class="av">DP</div>
      <div><b>DevOps 團隊</b>應用開發部</div>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <div style="min-width:0">
        <h1 id="scr-title">總覽</h1>
        <div class="sub" id="scr-sub">CI/CD 交付與部署健康度</div>
      </div>
      <div class="r">
        <span class="pill"><span class="dot" aria-hidden="true"></span>管線運行中</span>
      </div>
    </header>
    <div class="body" id="view" aria-live="polite"></div>
  </main>
</div>
<script>
(function(){
  var NAV=[
    {ic:"account_tree",tx:"版本控管",no:"v0"},
    {ic:"build",tx:"建置測試",no:"v1"},
    {ic:"shield",tx:"安全掃描",no:"v2"},
    {ic:"engineering",tx:"部署管線",no:"v3"},
    {ic:"gavel",tx:"發布審核",no:"v4"},
    {ic:"monitoring",tx:"監控回滾",no:"v5"}
  ];
  var TITLES=[
    ["版本控管","分支、提交與合併請求"],
    ["建置測試","自動化建置與單元測試 CI"],
    ["安全掃描","程式碼與相依套件弱點掃描"],
    ["部署管線","多環境持續部署 CD"],
    ["發布審核","上線變更審核與核准閘門"],
    ["監控回滾","部署後監控與異常自動回滾"]
  ];
  var pal={red:"#dc2626",orange:"#ea580c",green:"#15803d",amber:"#a84300",sky:"#0369a1",violet:"#6d28d9",gray:"#64748b",blue:"#2563eb"};
  var av=["#2563eb","#ea580c","#0369a1","#6d28d9","#15803d","#0f766e"];
  var charts={};

  Chart.defaults.color="#475569";
  Chart.defaults.font.family='"Work Sans","Microsoft JhengHei",sans-serif';
  Chart.defaults.borderColor="#e2e8f0";

  function destroyCharts(){
    for(var k in charts){try{charts[k].destroy()}catch(e){}}
    charts={};
  }
  function esc(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function tag(cls,txt){
    return '<span class="tag '+cls+'">'+esc(txt)+'</span>';
  }
  function initname(s){return String(s).slice(0,2)}
  function kpicards(kpis){
    var h='<div class="grid g4">';
    for(var i=0;i<kpis.length;i++){
      var k=kpis[i];
      h+='<div class="card kpi"><div class="lab"><span class="material-symbols-outlined" aria-hidden="true">'+k.ic+'</span>'+k.lab+'</div>'+
      '<div class="val">'+k.val+'</div>'+
      '<div class="delta '+(k.up?"up":"down")+'"><span class="material-symbols-outlined" style="font-size:15px" aria-hidden="true">'+(k.up?"trending_up":"trending_down")+'</span>'+esc(k.d)+'</div>'+
      '<div class="bar" aria-hidden="true"><i style="width:'+k.p+'%"></i></div></div>';
    }
    return h+'</div>';
  }

  var view=document.getElementById("view");
  var navEl=document.getElementById("nav");
  var nb="";
  for(var i=0;i<NAV.length;i++){
    nb+='<button type="button" data-i="'+i+'" aria-label="'+NAV[i].tx+'"><span class="material-symbols-outlined" aria-hidden="true">'+NAV[i].ic+'</span><span class="tx">'+NAV[i].tx+'</span><span class="no">'+NAV[i].no+'</span></button>';
  }
  navEl.innerHTML=nb;
  navEl.addEventListener("click",function(e){
    var b=e.target.closest?e.target.closest("button[data-i]"):null;
    if(!b)return;
    location.hash="v"+b.getAttribute("data-i");
  });

  function s0(){

      var e=al[a];

    h+='</div></div></div>';
    var dp=[
      {ver:"v3.8.2",env:"Production",tm:"08/13 14:20",res:"自動回滾",cls:"t-red",mttr:"48s",by:"CD 管線"},
      {ver:"v3.8.1",env:"Production",tm:"08/11 02:15",res:"成功",cls:"t-green",mttr:"—",by:"林承恩"},

    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:11}}}},scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{position:"left",beginAtZero:true,ticks:{callback:function(v){return v+"%"}}},y1:{position:"right",beginAtZero:true,grid:{display:false}}}}});
  }

  var SCREENS=[s0,s1,s2,s3,s4,s5];

  function show(idx){
    destroyCharts();
    var btns=document.querySelectorAll("[data-i]");
    for(var b=0;b<btns.length;b++){
      var active=+btns[b].getAttribute("data-i")===idx;
      btns[b].classList.toggle("on",active);
      btns[b].setAttribute("aria-current",active?"page":"false");
    }
    var t=TITLES[idx]||["",""];
    document.getElementById("scr-title").textContent=t[0];
    document.getElementById("scr-sub").textContent=t[1];
    document.title=t[0]+"｜軟體開發與自動部署平台";
    (SCREENS[idx]||s0)();
  }

  function fromHash(){
    var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
    if(!m){show(0);return}
    var n=document.querySelectorAll("[data-i]").length||6;
    show(Math.min(+m[1],n-1));
    try{window.scrollTo(0,0)}catch(e){}
  }

  window.addEventListener("hashchange",fromHash);
  fromHash();
})();
</script>
