:root{

  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --ok:#15803D;
  --warn:#9A3412;
  --bad:#B91C1C;
  --info:#1D4ED8;
  --sidebar:#0F172A;
  --sidebar-muted:#CBD5E1;
  --shadow:0 8px 24px rgba(15,23,42,.06);

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Fira Sans",sans-serif;-webkit-font-smoothing:antialiased}
button,a,[role="button"]{cursor:pointer}
button{font:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.material-symbols-outlined{font-variation-settings:"FILL" 0,"wght" 500,"GRAD" 0,"opsz" 24;line-height:1;vertical-align:middle}
.mono,.id,.num,.val,.pv,time,td:nth-child(1){font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.shell{display:flex;min-height:100vh}
.side{position:sticky;top:0;width:248px;height:100vh;flex:none;display:flex;flex-direction:column;padding:22px 16px;background:var(--sidebar);color:#fff;border-right:1px solid #1E293B}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 24px;border-bottom:1px solid rgba(255,255,255,.12)}
.logo{width:40px;height:40px;display:grid;place-items:center;flex:none;background:var(--blue);border:1px solid #60A5FA;border-radius:6px;box-shadow:4px 4px 0 #172554}
.logo .material-symbols-outlined{font-size:22px}
.brand b{display:block;font-size:16px;letter-spacing:.03em}
.brand span:not(.material-symbols-outlined){display:block;margin-top:3px;color:var(--sidebar-muted);font-size:11px}
.nav{display:flex;flex-direction:column;gap:5px;margin-top:20px}
.nav button{width:100%;min-height:44px;display:flex;align-items:center;gap:11px;padding:10px 12px;color:var(--sidebar-muted);background:transparent;border:1px solid transparent;border-radius:5px;text-align:left;font-weight:600;transition:background .2s,color .2s,border-color .2s,transform .2s}
.nav button:hover{color:#fff;background:#1E293B;border-color:#334155;transform:translateX(2px)}
.nav button.on{color:#fff;background:var(--blue);border-color:#60A5FA;box-shadow:3px 3px 0 #172554}
.nav button .material-symbols-outlined{font-size:20px}
.side .foot{margin-top:auto;padding:16px 8px 0;border-top:1px solid rgba(255,255,255,.12);color:#94A3B8;font-size:11px;line-height:1.7}
.main{min-width:0;flex:1}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;min-height:76px;padding:13px 24px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.htitle{font-size:19px;font-weight:700;letter-spacing:-.02em}
.hsub{margin-top:3px;color:var(--muted);font-size:12px}
.spacer{flex:1}
.chipbar{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:4px;color:#1E40AF;font-size:11px;font-weight:600}
.chip .material-symbols-outlined{font-size:16px}
.wrap{padding:20px 24px 42px}
.grid{display:grid;gap:12px;min-width:0}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.card,.listpane,.dhead{min-width:0;background:var(--color-card);border:1px solid var(--line);border-radius:7px;box-shadow:var(--shadow)}
.card{padding:15px}
.card h3{display:flex;align-items:center;gap:7px;margin:0 0 4px;font-size:14px;font-weight:700}
.card h3 .material-symbols-outlined,.lp-h .material-symbols-outlined{color:var(--blue);font-size:19px}
.sub,.mini{color:var(--muted)}
.sub{margin-bottom:12px;font-size:11.5px}
.mini{font-size:11px}
.kpi{position:relative;overflow:hidden;border-top:3px solid var(--blue)}
.kpi .lab{color:var(--muted);font-size:11px;font-weight:600}
.kpi .val{margin-top:7px;font-size:25px;font-weight:700;letter-spacing:-.04em}
.kpi .val small{color:var(--muted);font:600 12px "Fira Sans",sans-serif}
.kpi .dl{display:flex;align-items:center;gap:4px;margin-top:7px;font-size:11px;font-weight:600}
.kpi .dl.up{color:var(--ok)}.kpi .dl.dn{color:var(--bad)}.kpi .dl.fl{color:var(--info)}
.kpi .ic{position:absolute;top:12px;right:12px;width:34px;height:34px;display:grid;place-items:center;color:var(--blue);background:#EFF6FF;border:1px solid #BFDBFE;border-radius:5px}
.split{display:grid;grid-template-columns:330px minmax(0,1fr);gap:12px;align-items:start}
.listpane{overflow:hidden}
.lp-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 14px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700}
.li{display:flex;flex-direction:column;gap:5px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:#fff;transition:background .2s,border-color .2s}
.li:hover{background:#F8FAFC}
.li.on{padding-left:10px;background:#EFF6FF;border-left:4px solid var(--blue)}
.li .r1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.li .id{font-size:12px;font-weight:700}
.li .cust{font-size:12px;font-weight:600}
.li .meta{display:flex;flex-wrap:wrap;gap:7px;color:var(--muted);font-size:10.5px}
.detail{display:flex;min-width:0;flex-direction:column;gap:12px}
.dhead{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:16px 18px;border-top:3px solid var(--blue);background:linear-gradient(120deg,#EFF6FF,#fff 48%)}
.dhead .big{font-size:18px;font-weight:700}
.dhead .desc{margin-top:4px;color:var(--muted);font-size:12px}
.spec{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.spec .s{padding:10px 12px;background:#F8FAFC;border:1px solid var(--line);border-radius:5px}
.spec .k{color:var(--muted);font-size:10px;font-weight:600}
.spec .v{margin-top:3px;font-size:13px;font-weight:700}
.two{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}
.two3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.overflow{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:12px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:#F1F5F9;color:#334155;font-size:10px;font-weight:700;letter-spacing:.04em;text-align:left}
tbody tr{transition:background .18s}
tbody tr:hover{background:#F8FAFC}
td.num{text-align:right;font-weight:600}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border:1px solid currentColor;border-radius:4px;font-size:10px;font-weight:700;line-height:1.3}
.tag:before{content:"";width:5px;height:5px;background:currentColor;border-radius:50%}
.t-ok{color:#166534;background:#F0FDF4}.t-warn{color:#9A3412;background:#FFF7ED}.t-bad{color:#B91C1C;background:#FEF2F2}.t-info{color:#1D4ED8;background:#EFF6FF}.t-mut{color:#475569;background:#F1F5F9}.t-acc{color:#9A3412;background:#FFF7ED}
.bar{height:7px;overflow:hidden;background:#E2E8F0;border-radius:2px}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:2px;transition:width .4s ease}
.sheet{padding:13px;background:#F8FAFC;border:1px dashed #94A3B8;border-radius:5px}
.impo{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.impo .cell{position:relative;aspect-ratio:1/1.35;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;overflow:hidden;color:#1E40AF;background:#DBEAFE;border:1px solid #93C5FD;border-radius:3px;font-size:10px;font-weight:600}
.impo .cell.rot{color:#9A3412;background:#FFEDD5;border-color:#FDBA74}
.impo .cell .n{position:absolute;top:4px;left:5px;font:500 8px "Fira Code",monospace}
.legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:9px;color:var(--muted);font-size:10.5px}
.legend span{display:flex;align-items:center;gap:5px}
.dotc{width:9px;height:9px;display:inline-block;border-radius:2px}
.chk{display:flex;flex-direction:column;gap:7px}
.chk .row{display:flex;align-items:center;gap:8px;padding:7px 8px;background:#F8FAFC;border:1px solid var(--line);font-size:11.5px}
.chk .row .material-symbols-outlined{font-size:18px}
.chk .row.ok .material-symbols-outlined{color:var(--ok)}.chk .row.warn .material-symbols-outlined{color:var(--warn)}
.chk .row .m{margin-left:auto;color:var(--muted);font-size:10px}
.aibox{padding:13px 15px;background:#EFF6FF;border:1px solid #93C5FD;border-left:4px solid var(--blue);border-radius:5px}
.aibox .ah{display:flex;align-items:center;gap:7px;color:#1E40AF;font-size:12px;font-weight:700}
.aibox ul{margin:8px 0 0;padding-left:19px;font-size:11.5px;line-height:1.7}
.gantt{min-width:680px}
.g-head{display:grid;grid-template-columns:145px repeat(10,1fr);color:var(--muted);font:600 10px "Fira Code",monospace}
.g-head div{padding:6px 3px;text-align:center;border-left:1px solid var(--line)}
.g-head div:first-child{text-align:left;border-left:0}
.g-row{display:grid;grid-template-columns:145px 1fr;align-items:center;min-height:45px;border-top:1px solid var(--line)}
.g-lab{display:flex;align-items:center;gap:6px;padding:6px 8px;font-size:11px;font-weight:600}
.g-lab .material-symbols-outlined{color:var(--blue);font-size:17px}
.g-track{position:relative;height:44px;background:repeating-linear-gradient(90deg,transparent,transparent calc(10% - 1px),var(--line) 10%)}
.gbar{position:absolute;top:9px;height:26px;display:flex;align-items:center;overflow:hidden;padding:0 7px;border:1px solid rgba(0,0,0,.12);border-radius:3px;color:#fff;font-size:9.5px;font-weight:600;white-space:nowrap;box-shadow:2px 2px 0 rgba(15,23,42,.15)}
.progwrap{display:flex;align-items:center;gap:7px}
.progwrap .bar{flex:1}.pv{width:34px;text-align:right;font-size:10px;font-weight:600}
.kanban{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;min-width:760px}
.kcol{display:flex;min-width:0;flex-direction:column;gap:7px;padding:8px;background:#F1F5F9;border:1px solid var(--line);border-radius:5px}
.kh{display:flex;align-items:center;justify-content:space-between;padding:2px 3px 7px;border-bottom:1px solid #CBD5E1;font-size:11px;font-weight:700}
.cnt{padding:1px 6px;background:#DBEAFE;border:1px solid #93C5FD;color:#1E40AF;border-radius:3px;font:600 9px "Fira Code",monospace}
.kcard{padding:8px 9px;background:#fff;border:1px solid #CBD5E1;border-radius:4px;box-shadow:0 2px 5px rgba(15,23,42,.04)}
.kt{font-size:11px;font-weight:700}.km{display:flex;justify-content:space-between;gap:6px;margin-top:4px;color:var(--muted);font:400 9.5px "Fira Code",monospace}.kbar{margin-top:7px}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;top:4px;bottom:4px;left:7px;width:2px;background:var(--line)}
.ev{position:relative;padding:0 0 16px 6px}.ev:last-child{padding-bottom:0}
.ev .dot{position:absolute;top:2px;left:-19px;width:14px;height:14px;background:var(--blue);border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px var(--blue)}
.ev.done .dot{background:var(--ok);box-shadow:0 0 0 2px var(--ok)}.ev.wait .dot{background:#fff;box-shadow:0 0 0 2px var(--warn)}
.et{font-size:11.5px;font-weight:700}.ed{margin-top:3px;color:var(--muted);font-size:10.5px;line-height:1.5}
.grid-item{animation:enter .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@media(max-width:1024px){.side{width:216px}.kpis{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:285px minmax(0,1fr)}.two3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){
  .shell{display:block}.side{position:relative;width:100%;height:auto;padding:12px}.brand{padding:0 4px 12px}.side .foot{display:none}
  .nav{flex-direction:row;overflow-x:auto;margin-top:11px;padding-bottom:3px}.nav button{width:auto;flex:none}.nav button:hover{transform:none}
  .topbar{top:0;min-height:68px;padding:11px 14px}.chipbar{display:none}.wrap{padding:14px 12px 34px}
  .split,.two{grid-template-columns:1fr}.spec{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:480px){
  .nav button{justify-content:center;min-width:44px;padding:10px}.nav .t{display:none}
  .kpis{grid-template-columns:1fr 1fr;gap:8px}.two3{grid-template-columns:1fr}.card{padding:12px}
  .kpi .val{font-size:20px}.impo{grid-template-columns:repeat(2,1fr)}.htitle{font-size:16px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .grid-item{opacity:1;transform:none}
}
</style>
