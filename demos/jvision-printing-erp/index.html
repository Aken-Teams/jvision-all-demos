<style>
:root{
  --accent:#9333ea; --accent2:#c084fc; --accent-soft:#f5edff;
  --ink:#1e1630; --ink2:#5b5270; --line:#ece7f4; --bg:#f6f3fb;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
  --card:#ffffff;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle;}
.shell{display:flex;min-height:100vh;}
.side{width:236px;flex:none;background:linear-gradient(180deg,#2a1547,#3b1d63);color:#efe6ff;display:flex;flex-direction:column;padding:18px 14px;gap:6px;min-width:0;}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;}
.brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 6px 18px rgba(147,51,234,.4);}
.brand .logo .material-symbols-outlined{font-size:22px;}
.brand b{font-weight:900;font-size:15px;letter-spacing:.5px;display:block;line-height:1.2;}
.brand span{font-size:11px;color:#c9b6e8;}
.nav{display:flex;flex-direction:column;gap:4px;}
.nav button{display:flex;align-items:center;gap:11px;padding:11px 12px;border:0;background:transparent;color:#d9c9f2;border-radius:11px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;text-align:left;white-space:nowrap;min-width:0;transition:.15s;}
.nav button .material-symbols-outlined{font-size:21px;flex:none;}
.nav button .t{min-width:0;overflow:hidden;text-overflow:ellipsis;}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff;}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(147,51,234,.45);}
.side .foot{margin-top:auto;font-size:11px;color:#b49ad6;padding:10px 8px;line-height:1.5;border-top:1px solid rgba(255,255,255,.1);}
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0;}
.topbar .htitle{font-weight:900;font-size:17px;min-width:0;}
.topbar .hsub{font-size:12px;color:var(--ink2);}
.topbar .spacer{flex:1;min-width:0;}
.chipbar{display:flex;gap:8px;flex-wrap:wrap;min-width:0;}
.chip{font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;gap:5px;white-space:nowrap;}
.chip .material-symbols-outlined{font-size:16px;}
.wrap{padding:20px 22px 40px;min-width:0;}
.grid{display:grid;gap:14px;min-width:0;}
.kpis{grid-template-columns:repeat(4,1fr);}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;box-shadow:0 1px 2px rgba(30,22,48,.03);}
.card h3{margin:0 0 3px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
.card .sub{font-size:11.5px;color:var(--ink2);margin-bottom:12px;}
.kpi{position:relative;overflow:hidden;}
.kpi .lab{font-size:12px;color:var(--ink2);font-weight:600;}
.kpi .val{font-size:26px;font-weight:900;margin-top:4px;letter-spacing:-.5px;}
.kpi .val small{font-size:13px;font-weight:700;color:var(--ink2);}
.kpi .dl{font-size:11.5px;margin-top:6px;font-weight:700;display:flex;align-items:center;gap:3px;}
.kpi .dl.up{color:var(--ok);} .kpi .dl.dn{color:var(--bad);} .kpi .dl.fl{color:var(--info);}
.kpi .ic{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);}
.kpi .ic .material-symbols-outlined{font-size:20px;}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px;}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{font-size:11px;color:var(--ink2);font-weight:700;text-transform:uppercase;letter-spacing:.4px;background:#faf8fe;position:sticky;top:0;}
tbody tr:hover{background:#fbf9ff;}
td.num{font-variant-numeric:tabular-nums;font-weight:600;}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;line-height:1.4;}
.t-ok{background:#e7f7ec;color:var(--ok);} .t-warn{background:#fdf2e2;color:var(--warn);}
.t-bad{background:#fdecec;color:var(--bad);} .t-info{background:#e8f0fe;color:var(--info);}
.t-mut{background:#f0edf6;color:var(--ink2);} .t-acc{background:var(--accent-soft);color:var(--accent);}
.overflow{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.bar{height:8px;border-radius:6px;background:#eee6f7;overflow:hidden;}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.split{display:grid;grid-template-columns:340px 1fr;gap:14px;min-width:0;align-items:start;}
.listpane{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0;}
.listpane .lp-h{padding:13px 15px;border-bottom:1px solid var(--line);font-weight:800;font-size:13.5px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.listpane .lp-h .material-symbols-outlined{font-size:18px;color:var(--accent);}
.li{padding:13px 15px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:5px;min-width:0;transition:.12s;}
.li:hover{background:#fbf9ff;}
.li.on{background:var(--accent-soft);border-left:3px solid var(--accent);padding-left:12px;}
.li .r1{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.li .id{font-weight:800;font-size:13px;}
.li .cust{font-size:12.5px;color:var(--ink);font-weight:600;}
.li .meta{font-size:11px;color:var(--ink2);display:flex;gap:10px;flex-wrap:wrap;}
.detail{display:flex;flex-direction:column;gap:14px;min-width:0;}
.dhead{background:linear-gradient(135deg,#faf5ff,#fff);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;min-width:0;}
.dhead .big{font-size:19px;font-weight:900;}
.dhead .desc{font-size:12.5px;color:var(--ink2);}
.spec{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.spec .s{background:#faf8fe;border:1px solid var(--line);border-radius:11px;padding:10px 12px;min-width:0;}
.spec .s .k{font-size:11px;color:var(--ink2);font-weight:600;}
.spec .s .v{font-size:14px;font-weight:800;margin-top:2px;}
.two{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;min-width:0;}
.two3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;min-width:0;}
.sheet{background:#faf8fe;border:2px dashed #d8c8ef;border-radius:12px;padding:14px;}
.impo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.impo .cell{aspect-ratio:1/1.35;border-radius:8px;background:linear-gradient(135deg,#ede1ff,#faf5ff);border:1px solid #dcc9f5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:700;color:var(--accent);position:relative;overflow:hidden;}
.impo .cell.rot{background:linear-gradient(135deg,#e6f7ff,#f0fbff);border-color:#bfe3f5;color:#0b7fb8;}
.impo .cell .material-symbols-outlined{font-size:20px;}
.impo .cell .n{position:absolute;top:4px;left:6px;font-size:9px;color:#a98fd0;}
.chk{display:flex;flex-direction:column;gap:9px;}
.chk .row{display:flex;align-items:center;gap:10px;font-size:12.5px;}
.chk .row .material-symbols-outlined{font-size:19px;flex:none;}
.chk .row.ok .material-symbols-outlined{color:var(--ok);}
.chk .row.warn .material-symbols-outlined{color:var(--warn);}
.chk .row .m{color:var(--ink2);font-size:11px;margin-left:auto;white-space:nowrap;}
.gantt{min-width:640px;}
.gantt .g-head{display:grid;grid-template-columns:120px repeat(10,1fr);gap:0;font-size:10.5px;color:var(--ink2);font-weight:700;}
.gantt .g-head div{padding:5px 3px;text-align:center;border-left:1px solid var(--line);}
.gantt .g-head div:first-child{text-align:left;border-left:0;}
.gantt .g-row{display:grid;grid-template-columns:120px 1fr;gap:0;align-items:center;border-top:1px solid var(--line);min-height:44px;}
.gantt .g-lab{font-size:12px;font-weight:700;padding:6px 8px;display:flex;align-items:center;gap:6px;min-width:0;}
.gantt .g-lab .material-symbols-outlined{font-size:17px;color:var(--accent);}
.gantt .g-track{position:relative;height:44px;background:repeating-linear-gradient(90deg,transparent,transparent calc(10% - 1px),var(--line) 10%);}
.gbar{position:absolute;top:9px;height:26px;border-radius:7px;display:flex;align-items:center;padding:0 8px;font-size:10.5px;font-weight:700;color:#fff;overflow:hidden;white-space:nowrap;box-shadow:0 2px 6px rgba(30,22,48,.14);}
.kanban{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;min-width:760px;}
.kcol{background:#faf8fe;border:1px solid var(--line);border-radius:13px;padding:10px;min-width:0;display:flex;flex-direction:column;gap:9px;}
.kcol .kh{font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:space-between;padding:2px 4px 6px;border-bottom:1px solid var(--line);}
.kcol .kh .cnt{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 8px;font-size:11px;}
.kcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px;box-shadow:0 1px 2px rgba(30,22,48,.05);}
.kcard .kt{font-weight:800;font-size:12px;}
.kcard .km{font-size:10.5px;color:var(--ink2);margin-top:3px;display:flex;justify-content:space-between;gap:6px;}
.kcard .kbar{margin-top:7px;}
.tl{position:relative;padding-left:22px;}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl .ev{position:relative;padding:0 0 16px 6px;}
.tl .ev:last-child{padding-bottom:0;}
.tl .ev .dot{position:absolute;left:-19px;top:2px;width:14px;height:14px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--accent);background:var(--accent);}
.tl .ev.done .dot{background:var(--ok);box-shadow:0 0 0 2px var(--ok);}
.tl .ev.wait .dot{background:#fff;box-shadow:0 0 0 2px var(--warn);}
.tl .ev .et{font-weight:800;font-size:12.5px;}
.tl .ev .ed{font-size:11.5px;color:var(--ink2);margin-top:2px;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin-top:8px;}
.legend span{display:flex;align-items:center;gap:5px;}
.dotc{width:10px;height:10px;border-radius:3px;display:inline-block;}
.mini{font-size:11.5px;color:var(--ink2);}
.progwrap{display:flex;align-items:center;gap:8px;}
.progwrap .pv{font-size:11px;font-weight:700;width:34px;text-align:right;}
.aibox{background:linear-gradient(135deg,#f3e9ff,#faf5ff);border:1px solid #e3d3f7;border-radius:14px;padding:14px 16px;}
.aibox .ah{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:var(--accent);}
.aibox ul{margin:9px 0 0;padding-left:20px;font-size:12.5px;line-height:1.7;color:var(--ink);}
@media(max-width:860px){
  .side{width:100%;flex-direction:column;padding:10px 12px;}
  .brand{padding:2px 4px 10px;}
  .side .foot{display:none;}
  .nav{flex-direction:row;flex-wrap:wrap;}
  .nav button{flex:none;}
  .shell{flex-direction:column;}
}
@media(max-width:820px){
  .kpis{grid-template-columns:1fr 1fr;}
  .split{grid-template-columns:1fr;}
  .two,.two3{grid-template-columns:1fr;}
  .spec{grid-template-columns:1fr 1fr;}
}
@media(max-width:560px){
  .nav button .t{display:none;}
  .nav button{padding:10px;}
  .kpis{grid-template-columns:1fr 1fr;}
  .spec{grid-template-columns:1fr 1fr;}
  .wrap{padding:14px 12px 34px;}
  .topbar{padding:12px 14px;}
}
</style>
</head>

  nav.querySelectorAll("[data-i]").forEach(function(b){b.addEventListener("click",function(){show(+b.getAttribute("data-i"));});});
})();

function show(i){
  document.querySelectorAll("[data-i]").forEach(function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i);});
  var h=HEAD[i];
  document.getElementById("ht").textContent=h.t;
  document.getElementById("hs").textContent=h.s;
  document.getElementById("chips").innerHTML=h.chips.map(function(c){return '<span class="chip"><span class="material-symbols-outlined">'+c[0]+'</span>'+c[1]+'</span>';}).join("");
  SCREENS[i]();
}
show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m)return;var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
</body>
</html>
