<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>供應商交期達成率管理系統（OTD）｜Jvision 系統 Demo</title>
  <meta name="description" content="供應商協同、詢比議價到交期風險控管" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
  <style>
    :root{
      --bg:#0a1220;--panel:#111c2e;--panel2:#16233a;--line:#22334f;
      --ink:#e7eefb;--muted:#8ea4c4;--faint:#5f759a;
      --acc:#0d9488;--acc2:#2dd4bf;--acc-soft:rgba(45,212,191,.14);
      --good:#34d399;--warn:#fbbf24;--bad:#f87171;--info:#38bdf8;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:'Inter','Noto Sans TC',system-ui,sans-serif;
      background:radial-gradient(1200px 600px at 80% -10%,#12233d 0,transparent 60%),var(--bg);
      color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;
    }
    .sym{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
    .topbar{
      position:sticky;top:0;z-index:20;background:rgba(9,16,28,.92);backdrop-filter:blur(8px);
      border-bottom:1px solid var(--line);
    }
    .topbar-in{max-width:1340px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:16px;min-width:0}
    .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:none}
    .logo{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;
      background:linear-gradient(135deg,var(--acc),var(--acc2));color:#03201d;box-shadow:0 6px 18px rgba(13,148,136,.4)}
    .logo .sym{font-size:22px}
    .brand h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.3px;white-space:nowrap}
    .brand p{font-size:11px;margin:1px 0 0;color:var(--muted);white-space:nowrap}
    .livedot{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex:none}
    .pulse{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulse 2s infinite}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.55)}70%{box-shadow:0 0 0 9px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
    .nav{background:var(--panel);border-bottom:1px solid var(--line)}
    .nav-in{max-width:1340px;margin:0 auto;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;min-width:0}
    .nav button{
      display:flex;align-items:center;gap:8px;border:1px solid transparent;background:transparent;
      color:var(--muted);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
      padding:8px 14px;border-radius:9px;white-space:nowrap;flex:none;min-width:0;transition:.15s;
    }
    .nav button .sym{font-size:19px}
    .nav button:hover{color:var(--ink);background:var(--panel2)}
    .nav button.on{color:#03201d;background:linear-gradient(135deg,var(--acc2),var(--acc));border-color:var(--acc2);box-shadow:0 4px 14px rgba(13,148,136,.35)}
    .wrap{max-width:1340px;margin:0 auto;padding:18px}
    .screen-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap;min-width:0}
    .screen-head .tt{min-width:0}
    .screen-head h2{margin:0;font-size:20px;font-weight:800;display:flex;align-items:center;gap:9px}
    .screen-head h2 .sym{font-size:22px;color:var(--acc2)}
    .screen-head p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
    .badge{margin-left:auto;font-size:11px;color:var(--acc2);background:var(--acc-soft);border:1px solid rgba(45,212,191,.3);
      padding:5px 11px;border-radius:999px;font-weight:700;white-space:nowrap;flex:none}
    .grid{display:grid;gap:14px;min-width:0}
    .g-kpi{grid-template-columns:repeat(4,1fr)}
    .g-2{grid-template-columns:1fr 1fr}
    .g-3{grid-template-columns:2fr 1fr}
    .g-32{grid-template-columns:1fr 1fr 1fr}
    .g-side{grid-template-columns:320px 1fr}
    .grid>*{min-width:0}
    @media(max-width:820px){
      .g-kpi{grid-template-columns:1fr 1fr}
      .g-2,.g-3,.g-32,.g-side{grid-template-columns:1fr}
    }
    @media(max-width:480px){.g-kpi{grid-template-columns:1fr 1fr}}
    .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
    .card.pad0{padding:0;overflow:hidden}
    .card h3{margin:0 0 12px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px}
    .card h3 .sym{font-size:18px;color:var(--acc2)}
    .card h3 .r{margin-left:auto;font-size:11px;color:var(--faint);font-weight:600}
    .kpi{position:relative;overflow:hidden}
    .kpi .lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
    .kpi .lbl .sym{font-size:16px}
    .kpi .val{font-size:28px;font-weight:900;letter-spacing:.5px;margin-top:8px;font-family:'Inter'}
    .kpi .val small{font-size:14px;font-weight:700;color:var(--muted);margin-left:3px}
    .kpi .sub{font-size:11.5px;margin-top:6px;display:flex;align-items:center;gap:5px}
    .up{color:var(--good)}.down{color:var(--bad)}.flat{color:var(--muted)}
    .kpi::after{content:"";position:absolute;right:-16px;top:-16px;width:70px;height:70px;border-radius:50%;background:var(--acc-soft)}
    .chart{width:100%;overflow:hidden}
    .tblwrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
    thead th{text-align:left;color:var(--faint);font-weight:700;font-size:11px;letter-spacing:.4px;
      padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel2)}
    tbody td{padding:10px 12px;border-bottom:1px solid rgba(34,51,79,.6);color:var(--ink)}
    tbody tr:hover{background:rgba(45,212,191,.05)}
    .mono{font-family:'Inter';font-variant-numeric:tabular-nums}
    .tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
    .t-good{color:var(--good);background:rgba(52,211,153,.13);border:1px solid rgba(52,211,153,.3)}
    .t-warn{color:var(--warn);background:rgba(251,191,36,.13);border:1px solid rgba(251,191,36,.3)}
    .t-bad{color:var(--bad);background:rgba(248,113,113,.13);border:1px solid rgba(248,113,113,.3)}
    .t-info{color:var(--info);background:rgba(56,189,248,.13);border:1px solid rgba(56,189,248,.3)}
    .t-mut{color:var(--muted);background:var(--panel2);border:1px solid var(--line)}
    .bar{height:7px;border-radius:6px;background:var(--panel2);overflow:hidden;min-width:60px}
    .bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
    .bar.warn>i{background:linear-gradient(90deg,#d97706,var(--warn))}
    .bar.bad>i{background:linear-gradient(90deg,#dc2626,var(--bad))}
    .stat-row{display:flex;flex-direction:column;gap:12px}
    .stat{display:flex;align-items:center;gap:12px;padding:11px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:11px}
    .stat .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--acc-soft);color:var(--acc2)}
    .stat .ic .sym{font-size:20px}
    .stat .tx{min-width:0}
    .stat .tx b{font-size:18px;font-weight:900}
    .stat .tx span{display:block;font-size:11px;color:var(--muted)}
    .field{display:flex;flex-direction:column;gap:5px}
    .field label{font-size:11px;color:var(--muted);font-weight:600}
    .field .in{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13px;color:var(--ink)}
    .field .in.acc{border-color:var(--acc);color:var(--acc2);font-weight:700}
    .tl{position:relative;padding-left:22px}
    .tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
    .tl .ev{position:relative;padding:0 0 16px 0}
    .tl .ev::before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--acc2);box-shadow:0 0 0 3px rgba(45,212,191,.18)}
    .tl .ev.done::before{background:var(--good);box-shadow:0 0 0 3px rgba(52,211,153,.18)}
    .tl .ev.wait::before{background:var(--faint);box-shadow:none}
    .tl .ev .tm{font-size:11px;color:var(--faint);font-weight:600}
    .tl .ev .hd{font-size:13px;font-weight:700;margin:2px 0}
    .tl .ev .ds{font-size:12px;color:var(--muted)}
    .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
    .legend span{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
    .dot{width:9px;height:9px;border-radius:2px;flex:none}
    .rowlist{display:flex;flex-direction:column;gap:9px}
    .lrow{display:flex;align-items:center;gap:11px;padding:11px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;min-width:0}
    .lrow .rk{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:900;font-size:13px;flex:none;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
    .lrow.top1 .rk{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#03201d;border:none}
    .lrow .nm{min-width:0;flex:1}
    .lrow .nm b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .lrow .nm span{font-size:11px;color:var(--faint)}
    .lrow .sc{text-align:right;flex:none}
    .lrow .sc b{font-size:16px;font-weight:900}
    .lrow .sc span{font-size:10.5px;color:var(--muted);display:block}
    .foot{margin-top:26px;text-align:center;font-size:11px;color:var(--faint);padding-bottom:24px}
    @media(max-width:560px){
      .nav button .lbl-t{display:none}
      .nav button{padding:9px 12px}
      .brand p{display:none}
      .livedot .lt{display:none}
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-in">
      <div class="brand">
        <div class="logo"><span class="sym">insights</span></div>
        <div>
          <h1>OTD 交期達成率控管中心</h1>
          <p>供應商交期達成率管理系統 · Control Room</p>
        </div>
      </div>
      <div class="livedot"><span class="pulse"></span><span class="lt">即時同步 · WMS / SRM / PO</span></div>
    </div>
  </div>
  <nav class="nav">
    <div class="nav-in" id="nav"></div>
  </nav>
  <main class="wrap"><div id="view"></div></main>
  <div class="foot">Jvision 系統 Demo · 供應商交期達成率管理系統（OTD）· 本頁為純前端展示，資料為模擬資料</div>

  <script>
  (function(){
    "use strict";
    var GRID="#22334f";

    var SCREENS=[
      {icon:"monitoring",label:"OTD 總覽儀表",title:"OTD 總覽儀表",desc:"整體準時到貨率、平均延遲天數與趨勢即時監控",badge:"達成率統計"},
      {icon:"calendar_month",label:"訂單交期設定",title:"訂單交期設定",desc:"維護 PO 承諾交期、標準前置與需求日基準",badge:"交期基準"},
      {icon:"receipt_long",label:"到貨數據蒐集",title:"到貨數據蒐集",desc:"收貨簽核並與 WMS 進料比對，逐筆計算遲交天數",badge:"進料比對"},
      {icon:"fact_check",label:"延遲原因分析",title:"延遲原因分析",desc:"遲交案件分類、柏拉圖聚焦與責任歸屬拆解",badge:"根因分析"},
      {icon:"trending_up",label:"供應商交期排名",title:"供應商交期排名",desc:"各供應商 OTD 達成率與趨勢排行榜",badge:"績效排名"},
      {icon:"task_alt",label:"溝通改善追蹤",title:"溝通改善追蹤",desc:"改善單指派、對策追蹤與結案稽核紀錄",badge:"改善追蹤"}
    ];

    var view=document.getElementById("view");
    var charts=[];
    function clearCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
    function mk(id,opt){
      var el=document.getElementById(id);if(!el)return;
      opt.chart=opt.chart||{};
      opt.chart.redrawOnParentResize=false;opt.chart.redrawOnWindowResize=false;
      opt.chart.animations={enabled:false};
      opt.chart.foreColor="#8ea4c4";
      opt.chart.toolbar={show:false};opt.chart.fontFamily="Inter,Noto Sans TC,sans-serif";
      try{var c=new ApexCharts(el,opt);c.render();charts.push(c);}catch(e){}
    }
    function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
    function head(s){var d=SCREENS[s];return '<div class="screen-head"><div class="tt"><h2><span class="sym">'+d.icon+'</span>'+esc(d.title)+'</h2><p>'+esc(d.desc)+'</p></div><span class="badge">'+esc(d.badge)+'</span></div>';}
    function tagFor(rate){if(rate>=95)return'<span class="tag t-good">達標</span>';if(rate>=88)return'<span class="tag t-warn">觀察</span>';return'<span class="tag t-bad">未達</span>';}
    function barCls(rate){return rate>=95?'':rate>=88?'warn':'bad';}

    var SUPP=[
      {id:"S-2201",name:"鴻昱精密五金",cat:"沖壓件",otd:96.4,delay:0.4,po:38,late:2,trend:[91,92,94,95,96,96.4]},
      {id:"S-2188",name:"泰豐電子材料",cat:"被動元件",otd:93.1,delay:0.9,po:52,late:5,trend:[88,89,90,92,93,93.1]},
      {id:"S-2140",name:"聯茂塑膠射出",cat:"外殼件",otd:90.7,delay:1.3,po:41,late:6,trend:[84,86,88,89,90,90.7]},
      {id:"S-2255",name:"欣揚金屬表面",cat:"表面處理",otd:87.5,delay:2.1,po:29,late:7,trend:[80,82,83,85,86,87.5]},
      {id:"S-2103",name:"永信線材工業",cat:"線材",otd:84.2,delay:2.8,po:34,late:9,trend:[78,79,80,82,83,84.2]},
      {id:"S-2299",name:"O茂封裝科技",cat:"封裝",otd:79.6,delay:4.2,po:26,late:11,trend:[70,72,74,76,78,79.6]}
    ];
    var REASONS=[
      {r:"上游缺料",n:38,own:"供應商",tag:"t-bad"},
      {r:"產能不足",n:27,own:"供應商",tag:"t-bad"},
      {r:"物流延誤",n:19,own:"第三方",tag:"t-warn"},
      {r:"品檢退回重工",n:14,own:"品保",tag:"t-warn"},
      {r:"需求變更",n:9,own:"採購",tag:"t-info"},
      {r:"文件/報關",n:6,own:"第三方",tag:"t-mut"}
    ];

    function ranklist(n){
      var h='';
      for(var i=0;i<Math.min(n,SUPP.length);i++){var s=SUPP[i];
        h+='<div class="lrow'+(i===0?' top1':'')+'"><div class="rk">'+(i+1)+'</div>'+
           '<div class="nm"><b>'+esc(s.name)+'</b><span>'+esc(s.id)+' · '+esc(s.cat)+'</span></div>'+
           '<div class="sc"><b>'+s.otd+'%</b><span>延遲 '+s.delay+' 天</span></div></div>';
      }
      return h;
    }

    /* ===== Screen 0 ===== */
    function v0(){
      var kpis=[
        {l:"整體 OTD 達成率",v:"90.2",u:"%",s:"+13.2%",c:"up",ic:"verified"},
        {l:"平均延遲天數",v:"1.7",u:"天",s:"-2.4 天",c:"up",ic:"schedule"},
        {l:"本月到貨 PO",v:"220",u:"張",s:"32 張遲交",c:"down",ic:"receipt_long"},
        {l:"高風險供應商",v:"3",u:"家",s:"需開改善單",c:"flat",ic:"warning"}
      ];
      var kh='';
      for(var i=0;i<kpis.length;i++){var k=kpis[i];
        kh+='<div class="card kpi"><div class="lbl"><span class="sym">'+k.ic+'</span>'+k.l+'</div>'+
            '<div class="val">'+k.v+'<small>'+k.u+'</small></div>'+
            '<div class="sub '+k.c+'"><span class="sym" style="font-size:15px">'+(k.c==="up"?"trending_up":k.c==="down"?"trending_down":"remove")+'</span>'+k.s+'</div></div>';
      }
      var html=head(0);
      html+='<div class="grid g-kpi" style="margin-bottom:14px">'+kh+'</div>';
      html+='<div class="grid g-3" style="margin-bottom:14px">'+
        '<div class="card"><h3><span class="sym">show_chart</span>準時到貨率週趨勢<span class="r">近 6 週 · 目標 90%</span></h3><div id="c0trend" class="chart"></div></div>'+
        '<div class="card"><h3><span class="sym">speed</span>目標達成率</h3><div id="c0gauge" class="chart"></div>'+
          '<div class="stat-row" style="margin-top:8px">'+
          '<div class="stat"><div class="ic"><span class="sym">check_circle</span></div><div class="tx"><b>188</b><span>準時到貨 PO</span></div></div>'+
          '<div class="stat"><div class="ic"><span class="sym">error</span></div><div class="tx"><b>32</b><span>遲交 PO</span></div></div>'+
          '</div></div>';
      html+='</div>';
      html+='<div class="grid g-2">'+
        '<div class="card"><h3><span class="sym">category</span>各料件類別 OTD</h3><div id="c0cat" class="chart"></div></div>'+
        '<div class="card"><h3><span class="sym">emoji_events</span>供應商即時排名<span class="r">依 OTD 達成率</span></h3><div class="rowlist">'+ranklist(4)+'</div></div>';
      html+='</div>';
      view.innerHTML=html;void view.offsetHeight;

      mk("c0trend",{
        chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"area",height:280},
        series:[{name:"準時到貨率",data:[77,80,82,85,87,90]}],
        colors:["#2dd4bf"],stroke:{curve:"smooth",width:3},
        fill:{type:"gradient",gradient:{shadeIntensity:1,opacityFrom:.4,opacityTo:.05}},
        dataLabels:{enabled:false},
        markers:{size:4,colors:["#0a1220"],strokeColors:"#2dd4bf",strokeWidth:2},
        xaxis:{categories:["第1週","第2週","第3週","第4週","第5週","第6週"],axisBorder:{color:GRID},axisTicks:{color:GRID}},
        yaxis:{min:70,max:100,labels:{formatter:function(v){return v.toFixed(0)+"%";}}},
        grid:{borderColor:GRID,strokeDashArray:4},
        annotations:{yaxis:[{y:90,borderColor:"#fbbf24",strokeDashArray:5,label:{text:"目標 90%",style:{background:"#fbbf24",color:"#111"}}}]},
        tooltip:{theme:"dark",y:{formatter:function(v){return v+"%";}}}
      });
      mk("c0gauge",{
        chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"radialBar",height:230},
        series:[90.2],colors:["#2dd4bf"],
        plotOptions:{radialBar:{hollow:{size:"58%"},track:{background:"#16233a"},
          dataLabels:{name:{color:"#8ea4c4",fontSize:"12px",offsetY:22},value:{color:"#e7eefb",fontSize:"30px",fontWeight:800,offsetY:-16,formatter:function(v){return v+"%";}}}}},
        fill:{type:"gradient",gradient:{shade:"dark",gradientToColors:["#0d9488"],stops:[0,100]}},
        labels:["整體 OTD"]
      });
      mk("c0cat",{
        chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"bar",height:280},
        series:[{name:"OTD %",data:[96,93,91,88,84,80]}],
        colors:["#0d9488"],
        plotOptions:{bar:{horizontal:true,borderRadius:5,barHeight:"58%",distributed:false,dataLabels:{position:"top"}}},
        dataLabels:{enabled:true,offsetX:26,style:{colors:["#8ea4c4"],fontSize:"11px"},formatter:function(v){return v+"%";}},
        xaxis:{max:100,categories:["沖壓件","被動元件","外殼件","表面處理","線材","封裝"],axisBorder:{color:GRID},axisTicks:{color:GRID}},
        grid:{borderColor:GRID,strokeDashArray:4},
        tooltip:{theme:"dark"}
      });
    }

    /* ===== Screen 1 ===== */

    var RENDER=[v0,v1,v2,v3,v4,v5];

    function buildNav(){
      var h='';
      for(var i=0;i<SCREENS.length;i++){
        h+='<button data-i="'+i+'"><span class="sym">'+SCREENS[i].icon+'</span><span class="lbl-t">'+esc(SCREENS[i].label)+'</span></button>';
      }
      var nav=document.getElementById("nav");nav.innerHTML=h;
      var btns=nav.querySelectorAll("[data-i]");
      for(var j=0;j<btns.length;j++){
        btns[j].addEventListener("click",function(){show(+this.getAttribute("data-i"));});
      }
    }
    function show(i){
      i=Math.max(0,Math.min(i,RENDER.length-1));
      clearCharts();
      var btns=document.querySelectorAll("[data-i]");
      for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
      RENDER[i]();
      try{window.scrollTo(0,0);}catch(e){}
    }
    buildNav();

    function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
    window.addEventListener("hashchange",fromHash);fromHash();
  })();
  </script>
