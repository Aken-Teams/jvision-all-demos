<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>供應商交期達成率管理系統（OTD）｜Jvision 系統 Demo</title>
  <meta name="description" content="供應商協同、詢比議價到交期風險控管">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
  <style>
    :root{
      --color-primary:#2563eb;--color-on-primary:#fff;--color-secondary:#3b82f6;
      --color-on-secondary:#000;--color-accent:#ea580c;--color-on-accent:#000;
      --color-background:#f8fafc;--color-foreground:#1e293b;--color-card:#fff;
      --color-card-foreground:#1e293b;--color-muted:#e9eff8;--color-muted-foreground:#475569;
      --color-border:#e2e8f0;--color-destructive:#dc2626;--color-on-destructive:#fff;
      --color-ring:#2563eb;--blue:#2563eb;--ink:#1e293b;--muted:#475569;--line:#e2e8f0;
      --good:#15803d;--warn:#a16207;--bad:#dc2626;--info:#0369a1;
      --shadow:0 8px 24px rgba(15,23,42,.07);--radius:12px
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;min-width:320px;background:var(--color-background);color:var(--ink);
      font-family:"Fira Sans",sans-serif;-webkit-font-smoothing:antialiased}
    button,input,select{font:inherit}
    button{cursor:pointer}
    :focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
    .sym{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;line-height:1;
      font-size:20px;vertical-align:middle}
    .shell{max-width:1440px;margin:auto;padding:0 28px}
    .topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);
      border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
    .topbar-in{height:72px;display:flex;align-items:center;gap:20px}
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .logo{width:42px;height:42px;display:grid;place-items:center;border-radius:10px;
      background:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.22)}
    .brand h1{font-size:16px;line-height:1.2;margin:0;font-weight:700}
    .brand p{font-size:11px;color:var(--muted);margin:3px 0 0;letter-spacing:.04em}
    .live{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);
      font-size:12px;white-space:nowrap}
    .live i{width:9px;height:9px;border-radius:50%;background:var(--good);position:relative}
    .live i:after{content:"";position:absolute;inset:-4px;border:1px solid var(--good);
      border-radius:50%;animation:pulse 2s infinite}
    @keyframes pulse{50%{transform:scale(1.65);opacity:0}}
    .nav{border-bottom:1px solid var(--line);background:#fff}
    .nav-in{display:flex;gap:3px;overflow-x:auto;padding-top:8px;padding-bottom:8px;
      scrollbar-width:thin}
    .nav button{border:0;border-radius:8px;background:transparent;color:var(--muted);
      display:flex;align-items:center;gap:8px;padding:10px 13px;white-space:nowrap;
      font-size:13px;font-weight:600;transition:background .2s,color .2s,transform .2s}
    .nav button:hover{background:var(--color-muted);color:var(--blue);transform:translateY(-1px)}
    .nav button.on{background:var(--blue);color:#fff}
    main{padding-top:30px!important;padding-bottom:34px!important}
    .screen-head{display:flex;align-items:flex-end;gap:20px;margin-bottom:20px}
    .screen-head h2{margin:0;display:flex;align-items:center;gap:10px;font-size:25px;
      letter-spacing:-.025em}
    .screen-head h2 .sym{color:var(--blue);font-size:27px}
    .screen-head p{margin:7px 0 0;color:var(--muted);font-size:13px}
    .badge{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;
      border-radius:999px;background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8;
      font-size:11px;font-weight:700;white-space:nowrap}
    .grid{display:grid;gap:16px}.g-kpi{grid-template-columns:repeat(4,1fr)}
    .g-2{grid-template-columns:1fr 1fr}.g-3{grid-template-columns:2fr 1fr}
    .g-side{grid-template-columns:320px 1fr}.grid>*{min-width:0}
    .card{background:var(--color-card);border:1px solid var(--line);border-radius:var(--radius);
      padding:18px;box-shadow:var(--shadow);transition:border-color .22s,box-shadow .22s,transform .22s}
    .card:hover{border-color:#bfdbfe;box-shadow:0 12px 28px rgba(15,23,42,.1)}
    .card.pad0{padding:0;overflow:hidden}
    .card h3{display:flex;align-items:center;gap:8px;margin:0 0 15px;font-size:14px}
    .card h3 .sym{color:var(--blue)}.card h3 .r{margin-left:auto;color:var(--muted);
      font-size:11px;font-weight:500}
    .kpi{position:relative;overflow:hidden;border-top:3px solid var(--blue)}
    .kpi:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;
      right:-38px;top:-44px;background:#eff6ff}
    .lbl{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}
    .val{margin-top:11px;font:700 30px/1 "Fira Code",monospace;letter-spacing:-.04em}
    .val small{font:600 13px "Fira Sans";color:var(--muted);margin-left:4px}
    .sub{display:flex;align-items:center;gap:5px;margin-top:9px;font-size:11.5px;font-weight:600}
    .up{color:var(--good)}.down{color:var(--bad)}.flat{color:var(--muted)}
    .chart{width:100%;overflow:hidden}.tblwrap{overflow:auto}
    table{width:100%;border-collapse:collapse;min-width:560px;font-size:12px}
    th{padding:11px 12px;text-align:left;background:#f1f5f9;color:#334155;
      border-bottom:1px solid #cbd5e1;font-size:11px;letter-spacing:.03em;white-space:nowrap}
    td{padding:11px 12px;border-bottom:1px solid var(--line)}
    tbody tr{transition:background .18s}tbody tr:hover{background:#f8fafc}
    td:nth-child(n+4){font-variant-numeric:tabular-nums}
    .mono{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
    .tag{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:5px;
      font-size:11px;font-weight:700;white-space:nowrap;border:1px solid}
    .tag:before{font-family:"Material Symbols Outlined";font-size:14px}
    .t-good{color:#166534;background:#f0fdf4;border-color:#bbf7d0}.t-good:before{content:"check_circle"}
    .t-warn{color:#854d0e;background:#fffbeb;border-color:#fde68a}.t-warn:before{content:"warning"}
    .t-bad{color:#991b1b;background:#fef2f2;border-color:#fecaca}.t-bad:before{content:"error"}
    .t-info{color:#075985;background:#f0f9ff;border-color:#bae6fd}.t-info:before{content:"info"}
    .t-mut{color:#475569;background:#f8fafc;border-color:#cbd5e1}.t-mut:before{content:"schedule"}
    .bar{height:8px;background:#e2e8f0;border-radius:2px;overflow:hidden;min-width:60px}
    .bar i{display:block;height:100%;background:var(--blue)}.bar.warn i{background:#ca8a04}
    .bar.bad i{background:var(--bad)}
    .stat-row,.rowlist{display:flex;flex-direction:column;gap:11px}
    .stat,.lrow{display:flex;align-items:center;gap:12px;padding:12px;background:#f8fafc;
      border:1px solid var(--line);border-radius:8px}
    .ic{width:38px;height:38px;display:grid;place-items:center;flex:none;border-radius:7px;
      background:#dbeafe;color:#1d4ed8}
    .tx{min-width:0}.tx b{font:700 18px "Fira Code"}.tx span{display:block;color:var(--muted);
      font-size:11px;margin-top:2px}
    .field{display:flex;flex-direction:column;gap:5px}.field label{color:var(--muted);
      font-size:11px;font-weight:600}.field .in{padding:10px 11px;border:1px solid var(--line);
      border-radius:7px;background:#f8fafc;font-size:12px}.field .in.acc{border-color:var(--blue);
      box-shadow:0 0 0 3px #dbeafe;color:#1d4ed8;font-weight:700}
    .rk{width:27px;height:27px;display:grid;place-items:center;border:1px solid var(--line);
      border-radius:5px;background:#fff;font:700 12px "Fira Code";color:var(--muted)}
    .top1 .rk{background:var(--blue);border-color:var(--blue);color:#fff}
    .nm{min-width:0;flex:1}.nm b{display:block;overflow:hidden;text-overflow:ellipsis;
      white-space:nowrap;font-size:12px}.nm span,.sc span{font-size:10.5px;color:var(--muted)}
    .sc{text-align:right}.sc b{display:block;font:700 15px "Fira Code"}
    .legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}.legend span{display:flex;
      align-items:center;gap:6px;color:var(--muted);font-size:11px}.dot{width:9px;height:9px}
    .tl{position:relative;padding-left:23px}.tl:before{content:"";position:absolute;left:7px;
      top:4px;bottom:5px;width:2px;background:#cbd5e1}.ev{position:relative;padding-bottom:17px}
    .ev:before{content:"";position:absolute;left:-21px;top:3px;width:10px;height:10px;
      border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px #dbeafe}
    .ev.done:before{background:var(--good);box-shadow:0 0 0 4px #dcfce7}
    .ev.wait:before{background:#64748b;box-shadow:0 0 0 4px #e2e8f0}
    .tm{font:500 10.5px "Fira Code";color:var(--muted)}.hd{font-size:12px;font-weight:700;
      margin:3px 0}.ds{font-size:11px;color:var(--muted)}
    .foot{text-align:center;padding:22px;color:#64748b;font-size:11px;border-top:1px solid var(--line)}
    .grid-item{animation:enter .4s both cubic-bezier(.2,.8,.2,1)}
    @keyframes enter{from{opacity:0;transform:translateY(14px) scale(.98)}}
    @media(max-width:900px){.g-kpi{grid-template-columns:1fr 1fr}.g-2,.g-3,.g-side{grid-template-columns:1fr}}
    @media(max-width:600px){.shell{padding-left:15px;padding-right:15px}.topbar-in{height:64px}
      .brand p,.live span,.nav .txt{display:none}.nav button{padding:10px 14px}.nav-in{justify-content:space-between}
      .screen-head{align-items:flex-start}.screen-head h2{font-size:21px}.badge{display:none}
      main{padding-top:22px!important}.card{padding:15px}.g-kpi{gap:10px}.val{font-size:25px}}
    @media(max-width:390px){.g-kpi{grid-template-columns:1fr}.brand h1{font-size:14px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{
      animation:none!important;transition:none!important}.grid-item{opacity:1;transform:none}}
  </style>
</head>
<body>
  <header class="topbar"><div class="shell topbar-in">
    <div class="brand"><div class="logo"><span class="sym">insights</span></div><div>
      <h1>OTD 交期達成率控管中心</h1><p>供應商交期達成率管理系統 · Control Room</p>
    </div></div>
    <div class="live"><i></i><span>即時同步 · WMS / SRM / PO</span></div>
  </div></header>
  <nav class="nav" aria-label="主要功能"><div class="shell nav-in" id="nav"></div></nav>
  <main class="shell"><div id="view" aria-live="polite"></div></main>
  <footer class="foot">Jvision 系統 Demo · 供應商交期達成率管理系統（OTD）· 本頁為純前端展示，資料為模擬資料</footer>
  <script>
  (function(){
    "use strict";
    var GRID="#e2e8f0",BLUE="#2563eb",INK="#1e293b",MUTED="#475569",
        GOOD="#15803d",WARN="#a16207",BAD="#dc2626",INFO="#0369a1";
    var SCREENS=[
      ["monitoring","OTD 總覽儀表","整體準時到貨率、平均延遲天數與趨勢即時監控","達成率統計"],
      ["calendar_month","訂單交期設定","維護 PO 承諾交期、標準前置與需求日基準","交期基準"],
      ["receipt_long","到貨數據蒐集","收貨簽核並與 WMS 進料比對，逐筆計算遲交天數","進料比對"],
      ["fact_check","延遲原因分析","遲交案件分類、柏拉圖聚焦與責任歸屬拆解","根因分析"],
      ["trending_up","供應商交期排名","各供應商 OTD 達成率與趨勢排行榜","績效排名"],
      ["task_alt","溝通改善追蹤","改善單指派、對策追蹤與結案稽核紀錄","改善追蹤"]
    ];
    var SUPP=[
      ["S-2201","O昱精密五金","沖壓件",96.4,.4,38,2,[91,92,94,95,96,96.4]],
      ["S-2188","O豐電子材料","被動元件",93.1,.9,52,5,[88,89,90,92,93,93.1]],
      ["S-2140","O茂塑膠射出","外殼件",90.7,1.3,41,6,[84,86,88,89,90,90.7]],
      ["S-2255","O揚金屬表面","表面處理",87.5,2.1,29,7,[80,82,83,85,86,87.5]],
      ["S-2103","O信線材工業","線材",84.2,2.8,34,9,[78,79,80,82,83,84.2]],
      ["S-2299","O茂封裝科技","封裝",79.6,4.2,26,11,[70,72,74,76,78,79.6]]
    ];
    var REASONS=[["上游缺料",38,"供應商","t-bad"],["產能不足",27,"供應商","t-bad"],
      ["物流延誤",19,"第三方","t-warn"],["品檢退回重工",14,"品保","t-warn"],
      ["需求變更",9,"採購","t-info"],["文件/報關",6,"第三方","t-mut"]];
    var view=document.getElementById("view"),charts=[];
    function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
    function clear(){charts.forEach(function(c){try{c.destroy()}catch(e){}});charts=[]}
    function mk(id,opt){
      var el=document.getElementById(id);if(!el)return;
      opt.chart=opt.chart||{};opt.chart.toolbar={show:false};opt.chart.animations={enabled:false};
      opt.chart.foreColor=MUTED;opt.chart.fontFamily="Fira Sans,sans-serif";
      opt.chart.redrawOnParentResize=false;opt.chart.redrawOnWindowResize=false;
      opt.grid=opt.grid||{};opt.grid.borderColor=GRID;
      opt.tooltip=opt.tooltip||{};opt.tooltip.theme="light";
      try{var c=new ApexCharts(el,opt);c.render();charts.push(c)}catch(e){}
    }
    function head(i){var s=SCREENS[i];return'<div class="screen-head"><div><h2><span class="sym">'+s[0]+
      '</span>'+s[1]+'</h2><p>'+s[2]+'</p></div><span class="badge"><span class="sym">verified</span>'+s[3]+'</span></div>'}
    function tag(rate){return'<span class="tag '+(rate>=95?"t-good":rate>=88?"t-warn":"t-bad")+'">'+
      (rate>=95?"達標":rate>=88?"觀察":"未達")+'</span>'}
    function ranks(n){
      return SUPP.slice(0,n).map(function(s,i){return'<div class="lrow '+(i===0?"top1":"")+
        '"><div class="rk">'+(i+1)+'</div><div class="nm"><b>'+s[1]+'</b><span>'+s[0]+' · '+s[2]+
        '</span></div><div class="sc"><b>'+s[3]+'%</b><span>延遲 '+s[4]+' 天</span></div></div>'}).join("")
    }
    function kpis(a){return'<div class="grid g-kpi" style="margin-bottom:16px">'+a.map(function(k,i){
      return'<div class="card kpi grid-item" style="animation-delay:'+(i*60)+'ms"><div class="lbl"><span class="sym">'+
      k[0]+'</span>'+k[1]+'</div><div class="val">'+k[2]+'<small>'+k[3]+'</small></div>'+
      (k[4]?'<div class="sub '+k[5]+'"><span class="sym">'+(k[5]==="up"?"trending_up":k[5]==="down"?"trending_down":"remove")+
      '</span>'+k[4]+'</div>':"")+'</div>'}).join("")+'</div>'}
    function render0(){
      view.innerHTML=head(0)+kpis([["verified","整體 OTD 達成率","90.2","%","+13.2%","up"],
        ["schedule","平均延遲天數","1.7","天","-2.4 天","up"],["receipt_long","本月到貨 PO","220","張","32 張遲交","down"],
        ["warning","高風險供應商","3","家","需開改善單","flat"]])+
        '<div class="grid g-3" style="margin-bottom:16px"><section class="card grid-item"><h3><span class="sym">show_chart</span>準時到貨率週趨勢<span class="r">近 6 週 · 目標 90%</span></h3><div id="trend" class="chart"></div></section>'+
        '<section class="card grid-item"><h3><span class="sym">speed</span>目標達成率</h3><div id="gauge"></div><div class="stat-row"><div class="stat"><div class="ic"><span class="sym">check_circle</span></div><div class="tx"><b>188</b><span>準時到貨 PO</span></div></div><div class="stat"><div class="ic"><span class="sym">error</span></div><div class="tx"><b>32</b><span>遲交 PO</span></div></div></div></section></div>'+
        '<div class="grid g-2"><section class="card grid-item"><h3><span class="sym">category</span>各料件類別 OTD</h3><div id="cat"></div></section><section class="card grid-item"><h3><span class="sym">emoji_events</span>供應商即時排名<span class="r">依 OTD 達成率</span></h3><div class="rowlist">'+ranks(4)+'</div></section></div>';
      mk("trend",{chart:{type:"area",height:280},series:[{name:"準時到貨率",data:[77,80,82,85,87,90]}],
        colors:[BLUE],stroke:{curve:"smooth",width:3},fill:{type:"gradient",gradient:{opacityFrom:.28,opacityTo:.03}},
        dataLabels:{enabled:false},markers:{size:4},xaxis:{categories:["第1週","第2週","第3週","第4週","第5週","第6週"]},
        yaxis:{min:70,max:100,labels:{formatter:function(v){return v.toFixed(0)+"%"}}},
        annotations:{yaxis:[{y:90,borderColor:WARN,label:{text:"目標 90%",style:{background:"#a16207",color:"#fff"}}}]}});
      mk("gauge",{chart:{type:"radialBar",height:220},series:[90.2],colors:[BLUE],
        plotOptions:{radialBar:{hollow:{size:"58%"},track:{background:"#e2e8f0"},dataLabels:{
          name:{color:MUTED,offsetY:20},value:{color:INK,fontSize:"28px",fontWeight:700,offsetY:-15,
          formatter:function(v){return v+"%"}}}}},labels:["整體 OTD"]});
      mk("cat",{chart:{type:"bar",height:280},series:[{name:"OTD %",data:[96,93,91,88,84,80]}],
        colors:[BLUE],plotOptions:{bar:{horizontal:true,borderRadius:3,barHeight:"55%"}},
        dataLabels:{enabled:true,offsetX:25,style:{colors:[MUTED]},formatter:function(v){return v+"%"}},
        xaxis:{max:100,categories:["沖壓件","被動元件","外殼件","表面處理","線材","封裝"]}});
    }
    function render1(){
      var rows=[["PO-24081201","O昱精密五金","沖壓支架 A12","5,000","7 天","08/22","08/21","充裕","t-good"],
        ["PO-24081188","O豐電子材料","MLCC 0402","120,000","12 天","08/25","08/26","逾需求日","t-bad"],
        ["PO-24081174","O茂塑膠射出","上蓋外殼 B","3,200","10 天","08/24","08/23","接近","t-warn"],
        ["PO-24081155","O揚金屬表面","陽極處理件","2,800","6 天","08/20","08/19","充裕","t-good"],
        ["PO-24081142","O信線材工業","鍍錫銅線","18,000","9 天","08/23","08/24","逾需求日","t-bad"],
        ["PO-24081120","O茂封裝科技","QFN 封裝載板","6,400","14 天","08/28","08/29","逾需求日","t-bad"]];
      var tr=rows.map(function(r){return"<tr>"+r.slice(0,7).map(function(x,i){return'<td class="'+(i===0||i>2?"mono":"")+'">'+x+"</td>"}).join("")+'<td><span class="tag '+r[8]+'">'+r[7]+"</span></td></tr>"}).join("");
