<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>智慧停車管理 · Jvision 純 UI 展示</title>
<meta name="description" content="車牌辨識、AI 空車位偵測導引、EV 地鎖、VIP 訪客車位與安全事件監控的智慧停車管理平台" />
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Josefin+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Josefin+Sans:wght@300;400;500;600;700&display=swap');

:root{
  --color-primary:#00FF41;
  --color-on-primary:#0F172A;
  --color-secondary:#008F11;
  --color-on-secondary:#000000;
  --color-accent:#FF3333;
  --color-on-accent:#000000;
  --color-background:#0D1117;
  --color-foreground:#E6EDF3;
  --color-card:#182424;
  --color-card-foreground:#E6EDF3;
  --color-muted:#25292F;
  --color-muted-foreground:#94A3B8;
  --color-border:#30363D;
  --color-destructive:#EF4444;
  --color-on-destructive:#000000;
  --color-ring:#00FF41;
  --blue:#38BDF8;
  --ink:#E6EDF3;
  --muted:#94A3B8;
  --line:#30363D;
  --accent:#00FF41;
  --accent2:#008F11;
  --accent-soft:#112C1B;
  --bg:#0D1117;
  --card:#182424;
  --green:#00FF41;
  --amber:#FBBF24;
  --red:#FF3333;
  --shadow:6px 6px 0 #050807;
}

*{box-sizing:border-box;}
html{color-scheme:dark;scroll-behavior:auto;}
html,body{margin:0;padding:0;min-height:100%;}
body{
  font-family:"Josefin Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  background-color:var(--color-background);
  background-image:
    linear-gradient(rgba(48,54,61,.34) 1px,transparent 1px),
    linear-gradient(90deg,rgba(48,54,61,.34) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--color-foreground);
  -webkit-font-smoothing:antialiased;
  line-height:1.55;
}
button{font:inherit;}
button,.nav button{cursor:pointer;}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}

.topbar{
  position:sticky;
  top:0;
  z-index:30;
  background:#0D1117;
  border-bottom:3px solid var(--color-primary);
}
.topbar::after{
  content:"OPERATIONS / PARKING CONTROL";
  position:absolute;
  right:18px;
  bottom:-24px;
  padding:3px 9px;
  border:1px solid var(--color-primary);
  background:var(--color-primary);
  color:var(--color-on-primary);
  font-family:"Cinzel",serif;
  font-size:9px;
  font-weight:700;
  letter-spacing:.13em;
}
.topbar-inner{
  max-width:1440px;
  margin:0 auto;
  padding:10px 18px;
  display:flex;
  align-items:center;
  gap:18px;
  flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:11px;min-width:0;}
.brand .logo{
  width:42px;
  height:42px;
  border:2px solid var(--color-primary);
  border-radius:0;
  background:var(--color-primary);
  color:var(--color-on-primary);
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  box-shadow:4px 4px 0 #000;
}
.brand .logo .material-symbols-outlined{font-size:25px;font-weight:700;}
.brand-txt{min-width:0;}
.brand-txt b{
  display:block;
  font-family:"Cinzel",serif;
  font-size:15px;
  font-weight:700;
  line-height:1.25;
  letter-spacing:.04em;
  white-space:nowrap;
}
.brand-txt span{
  display:block;
  margin-top:2px;
  color:var(--color-muted-foreground);
  font-size:11px;
  font-weight:600;
  letter-spacing:.06em;
  white-space:nowrap;
}
.nav{display:flex;gap:0;flex-wrap:wrap;margin-left:auto;min-width:0;border:1px solid var(--line);}
.nav button{
  min-width:0;
  min-height:44px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:8px 12px;
  border:0;
  border-right:1px solid var(--line);
  border-radius:0;
  background:#11181A;
  color:#CBD5E1;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
  transition:background-color .18s,color .18s,box-shadow .18s;
}
.nav button:last-child{border-right:0;}
.nav button .material-symbols-outlined{font-size:18px;}
.nav button:hover{background:var(--color-muted);color:#fff;box-shadow:inset 0 -3px 0 var(--color-primary);}
.nav button.on{
  background:var(--color-primary);
  color:var(--color-on-primary);
  box-shadow:inset 0 -4px 0 #000;
}

.wrap{max-width:1440px;margin:0 auto;padding:34px 18px 64px;}
.screen-head{
  position:relative;
  display:flex;
  align-items:flex-start;
  gap:14px;
  margin:0 0 18px;
  padding:16px 18px;
  border:2px solid var(--line);
  border-left:8px solid var(--color-primary);
  background:#101719;
  box-shadow:var(--shadow);
  flex-wrap:wrap;
}
.screen-head::before{
  content:"SYS.ONLINE";
  position:absolute;
  top:-10px;
  left:12px;
  padding:1px 7px;
  background:var(--color-primary);
  color:var(--color-on-primary);
  font:700 9px/1.6 "Josefin Sans",sans-serif;
  letter-spacing:.12em;
}
.screen-head .ico{
  width:48px;
  height:48px;
  border:2px solid var(--color-primary);
  border-radius:0;
  background:#08110B;
  color:var(--color-primary);
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
}
.screen-head .ico .material-symbols-outlined{font-size:27px;}
.screen-head h1{
  margin:0;
  font-family:"Cinzel",serif;
  font-size:clamp(20px,2vw,28px);
  font-weight:700;
  line-height:1.15;
  letter-spacing:.02em;
}
.screen-head p{max-width:760px;margin:5px 0 0;color:#AEBBC9;font-size:13px;font-weight:500;}
.row-flex{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}

.pill{
  min-height:24px;
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:0;
  font-size:11px;
  font-weight:700;
  line-height:1.35;
  letter-spacing:.025em;
  white-space:nowrap;
}
.pill .material-symbols-outlined{font-size:15px;}
.pill.g{background:#0B2D16;color:#68FF8D;}
.pill.a{background:#332807;color:#FFD866;}
.pill.r{background:#3A1010;color:#FF8585;}
.pill.b{background:#082B3D;color:#7DD3FC;}
.pill.p{background:#103119;color:#67FF8D;}

.grid{display:grid;gap:12px;}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g23{grid-template-columns:minmax(0,2fr) minmax(280px,1fr);}
.g32{grid-template-columns:minmax(280px,1fr) minmax(0,2fr);}
.card{
  position:relative;
  min-width:0;
  padding:15px;
  border:2px solid var(--line);
  border-radius:0;
  background:var(--color-card);
  color:var(--color-card-foreground);
  box-shadow:4px 4px 0 #050807;
}
.card::after{
  content:"";
  position:absolute;
  top:-2px;
  right:-2px;
  width:24px;
  height:5px;
  background:var(--color-primary);
}
.card h3{
  margin:0 0 13px;
  padding:0 0 9px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:8px;
  font-family:"Cinzel",serif;
  font-size:13px;
  font-weight:700;
  line-height:1.35;
  letter-spacing:.02em;
}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--color-primary);}
.kpi{min-height:124px;border-top:5px solid var(--color-primary);}
.kpi:nth-child(2n){background:#14201F;}
.kpi .label{color:#A8B5C3;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
.kpi .val{
  margin-top:4px;
  color:#F8FAFC;
  font-family:"Josefin Sans",ui-monospace,"SFMono-Regular",Consolas,monospace;
  font-size:clamp(27px,3vw,36px);
  font-weight:700;
  font-variant-numeric:tabular-nums lining-nums;
  line-height:1.05;
  letter-spacing:-.035em;
}
.kpi .val small{color:#B5C1CE;font-size:12px;font-weight:700;letter-spacing:.02em;}
.kpi .foot{margin-top:9px;color:#AEBBC9;font-size:12px;font-weight:500;display:flex;align-items:center;gap:4px;}
.kpi .foot .material-symbols-outlined{font-size:16px;}

.chart{width:100%;height:280px;overflow:hidden;}
.chart.sm{height:220px;}
.tbl-wrap,.board-wrap{overflow-x:auto;scrollbar-color:var(--color-primary) #11181A;}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;}
th,td{padding:10px 11px;border:1px solid var(--line);white-space:nowrap;}
th{
  background:#0B1113;
  color:#C5D0DB;
  font-size:10px;
  font-weight:700;
  letter-spacing:.09em;
  text-align:left;
  text-transform:uppercase;
}
td{color:#DFE7EE;}
tbody tr:nth-child(even){background:#14201F;}
tbody tr:hover{background:#1C3226;}
td:nth-last-child(2),th:nth-last-child(2){text-align:right;font-variant-numeric:tabular-nums;}
.mono,.plate{
  font-family:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace !important;
  font-weight:700;
  font-variant-numeric:tabular-nums slashed-zero;
  letter-spacing:.035em;
}

.board{display:grid;grid-template-columns:repeat(4,minmax(205px,1fr));gap:0;min-width:820px;border:1px solid var(--line);}
.col{min-width:0;padding:10px;border:1px solid var(--line);border-radius:0;background:#0F1718;}
.col:nth-child(even){background:#121D1D;}
.col-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:8px;border-bottom:3px solid var(--color-primary);font-size:12px;font-weight:700;}
.col-h .cnt{
  min-width:36px;
  padding:2px 7px;
  border:1px solid var(--color-primary);
  border-radius:0;
  background:#07100A;
  color:var(--color-primary);
  text-align:center;
  font-family:ui-monospace,monospace;
  font-size:11px;
  font-variant-numeric:tabular-nums;
}
.tk{margin-bottom:8px;padding:9px 10px;border:1px solid #3C484D;border-left:4px solid var(--color-primary);border-radius:0;background:var(--color-card);box-shadow:3px 3px 0 #050807;}
.tk:last-child{margin-bottom:0;}
.tk .plate{color:#F7FAFC;font-size:13px;}
.tk .meta{margin-top:4px;color:#AAB7C4;font-size:11px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.tk .bar{margin-top:8px;}
.pbar{height:7px;border:1px solid #445058;border-radius:0;background:#080D0E;overflow:hidden;}
.pbar span{display:block;height:100%;border-radius:0;background:var(--color-primary);}

.lot{display:grid;grid-template-columns:repeat(10,minmax(48px,1fr));gap:6px;min-width:640px;}
.spot{
  aspect-ratio:1/1.35;
  border-radius:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-family:ui-monospace,monospace;
  font-size:10px;
  font-weight:700;
  position:relative;
}
.spot::before{font-family:"Material Symbols Outlined";font-size:15px;margin-bottom:2px;}
.spot small{font-family:"Josefin Sans",sans-serif;font-size:9px;font-weight:700;opacity:1;}
.s-free{background:#0B2D16;color:#8BFFA7;border:1px dashed #57F17C;}
.s-free::before{content:"check_circle";}
.s-occ{background:#222D2C;color:#E6EDF3;border:1px solid #7B898D;}
.s-occ::before{content:"directions_car";}
.s-ev{background:#082B3D;color:#8AD8FF;border:1px solid #38BDF8;}
.s-ev::before{content:"ev_station";}
.s-vip{background:#332807;color:#FFE083;border:1px solid #FBBF24;}
.s-vip::before{content:"verified";}
.s-alarm{background:#3A1010;color:#FF9A9A;border:2px solid var(--color-accent);}
.s-alarm::before{content:"warning";}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;color:#B4C0CC;font-size:11px;font-weight:600;}
.legend i{width:12px;height:12px;border:1px solid currentColor;border-radius:0;display:inline-block;margin-right:5px;vertical-align:-1px;}

.tl{position:relative;padding-left:24px;}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl-item{position:relative;padding:0 0 16px 5px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item::before{
  content:"check";
  position:absolute;
  left:-23px;
  top:2px;
  width:16px;
  height:16px;
  border:1px solid var(--color-primary);
  border-radius:0;
  background:#0B1113;
  color:var(--color-primary);
  font:700 11px/15px "Material Symbols Outlined";
  text-align:center;
}
.tl-item.red::before{content:"priority_high";border-color:#FF6767;color:#FF8585;}
.tl-item.amber::before{content:"warning";border-color:#FBBF24;color:#FFD866;}
.tl-item .t{color:#9EACBA;font-family:ui-monospace,monospace;font-size:10px;font-weight:700;font-variant-numeric:tabular-nums;}
.tl-item .m{margin-top:2px;color:#F0F4F8;font-size:13px;font-weight:700;}
.tl-item .d{color:#AEBBC9;font-size:11px;}
.stat-line{display:flex;justify-content:space-between;gap:18px;padding:9px 0;border-bottom:1px dashed #465158;color:#C3CED8;font-size:12px;}
.stat-line:last-child{border-bottom:0;}
.stat-line b{text-align:right;color:#F4F7FA;font-family:ui-monospace,monospace;font-weight:700;font-variant-numeric:tabular-nums;}
.foot-note{margin-top:28px;padding-top:10px;border-top:1px solid var(--line);color:#9EACBA;text-align:center;font-size:11px;letter-spacing:.04em;}

button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
  box-shadow:0 0 0 2px #000;
}

@media (prefers-reduced-motion:no-preference){
  .screen-head,.card{animation:reveal .36s ease-out both;}
  .card:nth-child(2){animation-delay:.04s;}
  .card:nth-child(3){animation-delay:.08s;}
  .card:nth-child(4){animation-delay:.12s;}
  @keyframes reveal{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;scroll-behavior:auto !important;transition-duration:.01ms !important;}
}

@media(max-width:1024px){
  .topbar-inner{align-items:flex-start;}
  .nav{width:100%;margin-left:0;display:grid;grid-template-columns:repeat(6,1fr);}
  .nav button{border-bottom:0;}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));}
  .g23,.g32{grid-template-columns:minmax(0,3fr) minmax(250px,2fr);}
}
@media(max-width:768px){
  .wrap{padding:30px 12px 48px;}
  .topbar-inner{padding:9px 12px;}
  .topbar::after{right:12px;}
  .screen-head{padding:15px 13px;}
  .g3,.g2,.g23,.g32{grid-template-columns:1fr;}
  .board{min-width:800px;}
  .chart{height:250px;}
}
@media(max-width:560px){
  .brand .logo{width:38px;height:38px;}
  .brand-txt b{font-size:13px;}
  .brand-txt span{font-size:10px;}
  .nav{grid-template-columns:repeat(6,1fr);}
  .nav button{min-height:46px;padding:8px 5px;border-right:1px solid var(--line);}
  .nav button .txt{display:none;}
  .nav button .material-symbols-outlined{font-size:20px;}
  .g4{grid-template-columns:1fr 1fr;gap:8px;}
  .card{padding:12px;box-shadow:3px 3px 0 #050807;}
  .kpi{min-height:116px;}
  .kpi .val{font-size:26px;}
  .screen-head .row-flex{width:100%;margin-left:0 !important;}
  .lot{grid-template-columns:repeat(10,48px);}
  .stat-line{align-items:flex-start;}
}
@media(max-width:390px){
  .wrap{padding-left:9px;padding-right:9px;}
  .g4{grid-template-columns:1fr;}
  .kpi{min-height:0;}
  .screen-head h1{font-size:20px;}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">local_parking</span></div>
      <div class="brand-txt">
        <b>智慧停車管理</b>
        <span>Jvision Smart Parking · 純 UI 展示</span>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button data-i="0" onclick="show(0)"><span class="material-symbols-outlined">dashboard</span><span class="txt">車位總覽</span></button>
      <button data-i="1" onclick="show(1)"><span class="material-symbols-outlined">fact_check</span><span class="txt">車牌進出</span></button>
      <button data-i="2" onclick="show(2)"><span class="material-symbols-outlined">account_tree</span><span class="txt">導引偵測</span></button>
      <button data-i="3" onclick="show(3)"><span class="material-symbols-outlined">bolt</span><span class="txt">EV 地鎖</span></button>
      <button data-i="4" onclick="show(4)"><span class="material-symbols-outlined">verified</span><span class="txt">VIP 訪客</span></button>
      <button data-i="5" onclick="show(5)"><span class="material-symbols-outlined">shield</span><span class="txt">安全事件</span></button>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<script>
"use strict";
var app=document.getElementById("app");
var charts=[];
function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
function mkChart(id,opt){
  var el=document.getElementById(id);
  if(!el)return;
  var c=echarts.init(el);
  c.setOption(opt);
  charts.push(c);
}
var C={accent:"#00FF41",accent2:"#008F11",green:"#00FF41",amber:"#FBBF24",red:"#FF3333",blue:"#38BDF8",muted:"#94A3B8",line:"#30363D"};
function headHTML(icon,title,sub,pills){
  var p=pills?('<div class="row-flex" style="margin-left:auto">'+pills+'</div>'):'';
  return '<div class="screen-head"><div class="ico"><span class="material-symbols-outlined">'+icon+'</span></div>'+
    '<div style="min-width:0"><h1>'+title+'</h1><p>'+sub+'</p></div>'+p+'</div>';
}
function kpi(label,val,unit,foot,cls){
  return '<div class="card kpi"><div class="label">'+label+'</div><div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+
    '</div><div class="foot '+(cls||'')+'">'+foot+'</div></div>';
}

/* SCREEN 0 : 車位總覽看板 (KANBAN signature) */
function s0(){
  var kpis=kpi('全場即時佔用率','78','%','<span class="material-symbols-outlined" style="color:'+C.amber+'">trending_up</span> 尖峰時段')
    +kpi('可用車位','264','席','<span class="material-symbols-outlined" style="color:'+C.green+'">check_circle</span> 較上時段 +18')
    +kpi('今日進場車次','3,142','車','<span class="material-symbols-outlined" style="color:'+C.blue+'">login</span> 週轉率 4.2 次')
    +kpi('待處理事件','7','件','<span class="material-symbols-outlined" style="color:'+C.red+'">priority_high</span> 3 件高優先');
  function tk(plate,zone,pct,tag,tagcls){
    return '<div class="tk"><div class="plate">'+plate+'</div>'+
      '<div class="meta"><span>'+zone+'</span><span class="pill '+tagcls+'">'+tag+'</span></div>'+
      '<div class="bar"><div class="pbar"><span style="width:'+pct+'%"></span></div></div></div>';
  }
  var board='<div class="board-wrap"><div class="board">'+
    '<div class="col"><div class="col-h"><span>B1 一般區</span><span class="cnt">92%</span></div>'+
      tk('BMR-8821','B1-A 排','92','近滿','a')+tk('KLT-3390','B1-B 排','88','高佔','a')+tk('TPE-1145','B1-C 排','75','正常','g')+'</div>'+

var screens=[s0,s1,s2,s3,s4,s5];
function show(i){
  disposeCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i);}
  screens[i]();
  app.insertAdjacentHTML("beforeend",'<div class="foot-note">本頁為純 UI 系統展示（無後端），畫面與資料皆為擬真示範。</div>');
}
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
