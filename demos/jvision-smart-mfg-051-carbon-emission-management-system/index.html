<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>碳排放管理系統 Carbon Emission Management System</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000;
  --color-secondary:#10b981;
  --color-on-secondary:#0f172a;
  --color-accent:#059669;
  --color-on-accent:#000;
  --color-background:#ecfdf5;
  --color-foreground:#064e3b;
  --color-card:#fff;
  --color-card-foreground:#064e3b;
  --color-muted:#e8f1f3;
  --color-muted-foreground:#475569;
  --color-border:#a7f3d0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#059669;
  --blue:#047857;
  --ink:#064e3b;
  --muted:#475569;
  --line:#a7f3d0;
  --bg:#ecfdf5;
  --card:#fff;
  --soft:#dff9eb;
  --ok:#047857;
  --warn:#a16207;
  --bad:#b91c1c;
  --info:#1d4ed8;
  --gold:#fbbf24;
  --shadow:0 12px 32px rgba(6,78,59,.08);
  --shadow-hover:0 18px 42px rgba(6,78,59,.14);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  font-family:"Fira Sans",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 8% 4%,rgba(16,185,129,.16),transparent 25rem),
    radial-gradient(circle at 92% 22%,rgba(251,191,36,.12),transparent 23rem),
    linear-gradient(145deg,#f7fffb 0%,var(--bg) 48%,#f4fbf7 100%);
  line-height:1.5;
  -webkit-font-smoothing:antialiased
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.22;
  background-image:radial-gradient(rgba(5,150,105,.17) .6px,transparent .6px);
  background-size:18px 18px
}
button{font:inherit}
button,[data-row]{cursor:pointer}
button:focus-visible,[data-row]:focus-visible{
  outline:3px solid rgba(5,150,105,.3);
  outline-offset:3px
}
.material-symbols-outlined{
  font-variation-settings:"FILL" 0,"wght" 500,"GRAD" 0,"opsz" 24;
  vertical-align:middle
}
.app{position:relative;max-width:1440px;margin:auto;padding:18px 24px 56px}
.top{
  position:relative;
  display:flex;
  align-items:center;
  gap:15px;
  min-height:76px;
  padding:12px 15px
}
.logo{
  display:grid;
  place-items:center;
  width:50px;
  height:50px;
  flex:none;
  color:#fff;
  border:1px solid rgba(255,255,255,.55);
  border-radius:19px 13px 20px 12px;
  background:linear-gradient(145deg,var(--color-primary),var(--color-secondary));
  box-shadow:0 10px 24px rgba(5,150,105,.25)
}
.logo .material-symbols-outlined{font-size:29px}
.htxt{min-width:0}
.htxt h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.01em}
.htxt p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.hspacer{flex:1}
.hchip,.flag{
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:#065f46;
  background:rgba(255,255,255,.76);
  border:1px solid var(--line);
  border-radius:999px;
  font-size:12px;
  font-weight:600;
  padding:7px 12px;
  box-shadow:0 5px 16px rgba(6,78,59,.05)
}
.tabs{
  position:sticky;
  top:10px;
  z-index:20;
  display:flex;
  gap:6px;
  margin:5px 0 22px;
  padding:7px;
  overflow-x:auto;
  border:1px solid rgba(167,243,208,.92);
  border-radius:22px 15px 22px 15px;
  background:rgba(255,255,255,.88);
  box-shadow:var(--shadow);
  backdrop-filter:blur(14px)
}
.tabs button{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  flex:1 0 auto;
  min-height:44px;
  padding:9px 14px;
  color:var(--muted);
  white-space:nowrap;
  border:1px solid transparent;
  border-radius:15px 11px 15px 11px;
  background:transparent;
  font-size:13px;
  font-weight:600;
  transition:color .2s,background .2s,border-color .2s,transform .2s,box-shadow .2s
}
.tabs button:hover{
  color:#065f46;
  border-color:var(--line);
  background:var(--soft);
  transform:translateY(-1px)
}
.tabs button.on{
  color:#fff;
  border-color:#047857;
  background:linear-gradient(135deg,#047857,#10b981);
  box-shadow:0 8px 20px rgba(5,150,105,.22)
}
.tabs button .material-symbols-outlined{font-size:19px}
.screen{animation:reveal .42s cubic-bezier(.2,.8,.2,1)}
.scr-head{
  display:flex;
  align-items:flex-end;
  gap:14px;
  margin:0 3px 16px;
  flex-wrap:wrap
}
.scr-head h2{margin:0;font-size:21px;line-height:1.25}
.scr-head .sub{margin-top:4px;color:var(--muted);font-size:12.5px}
.scr-head .flag{margin-left:auto;color:#047857}
.card,.kpi{
  min-width:0;
  color:var(--color-card-foreground);
  border:1px solid rgba(167,243,208,.88);
  background:rgba(255,255,255,.94);
  box-shadow:var(--shadow);
  transition:transform .22s,box-shadow .22s,border-color .22s
}
.card:hover,.kpi:hover{
  border-color:#6ee7b7;
  box-shadow:var(--shadow-hover)
}
.card{border-radius:22px 16px 24px 17px}
.pad{padding:18px}
.kpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:13px;
  margin-bottom:15px
}
.kpi{
  position:relative;
  overflow:hidden;
  min-height:128px;
  padding:16px;
  border-radius:19px 13px 22px 15px
}
.kpi:after{
  content:"";
  position:absolute;
  right:-25px;
  bottom:-34px;
  width:92px;
  height:92px;
  border-radius:55% 45% 63% 37%;
  background:linear-gradient(145deg,rgba(16,185,129,.11),rgba(251,191,36,.1))
}
.kpi .lab{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:12px
}
.kpi .lab .material-symbols-outlined{color:var(--blue);font-size:18px}
.kpi .val{
  position:relative;
  z-index:1;
  margin-top:8px;
  font-family:"Fira Code",monospace;
  font-size:25px;
  font-weight:700;
  letter-spacing:-.04em;
  font-variant-numeric:tabular-nums
}
.kpi .val small{
  margin-left:4px;
  color:var(--muted);
  font-family:"Fira Sans",sans-serif;
  font-size:11.5px;
  font-weight:600;
  letter-spacing:0
}
.delta{position:relative;z-index:1;margin-top:4px;font-size:11.5px;font-weight:600}
.up{color:var(--bad)}
.down{color:var(--ok)}
.split{display:grid;grid-template-columns:350px 1fr;gap:15px;align-items:start}
.wide2{display:grid;grid-template-columns:1.15fr .85fr;gap:15px;align-items:start}
.wide3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;align-items:start}
.listcol{max-height:530px;overflow:auto}
.lrow{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 14px;
  border-top:1px solid rgba(167,243,208,.62);
  transition:background .2s,padding .2s,box-shadow .2s
}
.lrow:hover{background:#f0fdf6}
.lrow.sel{
  padding-left:11px;
  background:linear-gradient(90deg,#dff9eb,#f8fffb);
  box-shadow:inset 3px 0 #059669
}
.lrow .ic,.detail-hd .big{
  display:grid;
  place-items:center;
  flex:none;
  color:#047857;
  background:linear-gradient(145deg,#d1fae5,#ecfdf5);
  border:1px solid #a7f3d0
}
.lrow .ic{width:36px;height:36px;border-radius:13px 9px 14px 10px}
.lrow .ic .material-symbols-outlined{font-size:20px}
.lrow .mn{min-width:0;flex:1}
.lrow .mn b{display:block;overflow:hidden;font-size:13px;text-overflow:ellipsis;white-space:nowrap}
.lrow .mn span{color:var(--muted);font-family:"Fira Code",monospace;font-size:10.5px}
.lrow .rt{flex:none}
.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 9px;
  border:1px solid transparent;
  border-radius:999px;
  font-size:10.5px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap
}
.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{color:#065f46;background:#d1fae5;border-color:#a7f3d0}
.b-warn{color:#854d0e;background:#fef9c3;border-color:#fde68a}
.b-bad{color:#991b1b;background:#fee2e2;border-color:#fecaca}
.b-info{color:#1e40af;background:#dbeafe;border-color:#bfdbfe}
.b-mut{color:#475569;background:#f1f5f9;border-color:#cbd5e1}
.b-acc{color:#065f46;background:#ccfbf1;border-color:#99f6e4}
.sect-t{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 12px;
  font-size:13px;
  font-weight:700
}
.sect-t .material-symbols-outlined{color:var(--blue);font-size:19px}
.detail-hd{display:flex;align-items:center;gap:12px;margin-bottom:15px}
.detail-hd .big{width:48px;height:48px;border-radius:18px 12px 19px 13px}
.detail-hd .big .material-symbols-outlined{font-size:27px}
.detail-hd h3{margin:0;font-size:16px}
.detail-hd p{margin:3px 0 0;color:var(--muted);font-size:11.5px}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:13px 0}
.mini .m{
  padding:12px;
  border:1px solid var(--line);
  border-radius:15px 10px 16px 11px;
  background:linear-gradient(145deg,#f8fffb,#eefbf5)
}
.mini .l{color:var(--muted);font-size:11px}
.mini .v{
  margin-top:4px;
  font-family:"Fira Code",monospace;
  font-size:17px;
  font-weight:700;
  font-variant-numeric:tabular-nums
}
.check,.doc{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:35px;
  padding:7px 0;
  border-bottom:1px solid rgba(167,243,208,.6);
  font-size:12px
}
.note{
  display:flex;
  align-items:flex-start;
  gap:8px;
  margin-top:13px;
  padding:11px 13px;
  color:#334155;
  border:1px dashed #6ee7b7;
  border-radius:14px 10px 15px 11px;
  background:#f0fdf6;
  font-size:11.5px
}
.note .material-symbols-outlined{flex:none;color:#047857;font-size:18px}
.chartbox{position:relative;width:100%;height:270px;max-width:100%;overflow:hidden}
.chartbox.sm{height:215px}
.chartbox.lg{height:305px}
.scroll-x{overflow-x:auto}
table{
  width:100%;
  min-width:560px;
  border-collapse:separate;
  border-spacing:0;
  font-size:12px
}
th{
  padding:10px;
  color:#475569;
  background:#f0fdf6;
  border-block:1px solid var(--line);
  text-align:left;
  font-size:10.5px;
  font-weight:700;
  white-space:nowrap
}
th:first-child{border-left:1px solid var(--line);border-radius:11px 0 0 11px}
th:last-child{border-right:1px solid var(--line);border-radius:0 11px 11px 0}
td{padding:11px 10px;border-bottom:1px solid rgba(167,243,208,.65);vertical-align:middle}
tbody tr:hover{background:#f8fffb}
td.num,.num{
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
  font-weight:600
}
td:nth-child(n+2).num{text-align:right}
.bar-line{margin:11px 0}
.bar-line .top{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;font-size:12px}
.bar-line .top b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:9px;overflow:hidden;border-radius:99px;background:#dcebe4}
.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#047857,#10b981,#fbbf24)}
.board{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:12px}
.bcol{
  min-width:0;
  padding:11px;
  border:1px solid var(--line);
  border-radius:18px 12px 20px 13px;
  background:#f5fdf9
}
.bh{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
  padding:2px 2px 9px;
  border-bottom:1px dashed #6ee7b7;
  font-size:12.5px;
  font-weight:700
}
.cnt{
  min-width:23px;
  padding:2px 7px;
  color:#065f46;
  border:1px solid var(--line);
  border-radius:999px;
  background:#fff;
  text-align:center;
  font-family:"Fira Code",monospace;
  font-size:10px
}
.ticket{
  margin-bottom:9px;
  padding:11px;
  border:1px solid var(--line);
  border-left:3px solid #10b981;
  border-radius:13px 9px 14px 10px;
  background:#fff;
  box-shadow:0 5px 14px rgba(6,78,59,.05)
}
.ticket b{display:block;font-size:12px}
.ticket .meta{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  margin-top:6px;
  color:var(--muted);
  font-size:10.5px;
  flex-wrap:wrap
}
.tl{position:relative;padding-left:23px}
.tl:before{content:"";position:absolute;top:5px;bottom:5px;left:7px;width:2px;background:var(--line)}
.ti{position:relative;padding-bottom:17px}
.ti .dot{
  position:absolute;
  top:2px;
  left:-23px;
  width:15px;
  height:15px;
  border:3px solid #059669;
  border-radius:50%;
  background:#fff
}
.ti.done .dot{background:#059669;box-shadow:0 0 0 3px #d1fae5}
.ti .tt{font-size:12.5px;font-weight:700}
.ti .td{margin-top:2px;color:var(--muted);font-size:11px}
.ti .tm{margin-top:3px;color:#047857;font-family:"Fira Code",monospace;font-size:10.5px;font-weight:600}
.matrix{display:grid;grid-template-columns:auto repeat(4,1fr);gap:6px;min-width:520px;font-size:11px}
.mh{padding:6px;color:var(--muted);font-weight:700;text-align:center}
.ml{display:flex;align-items:center;padding:8px 6px;font-weight:600}
.cell{padding:10px 6px;border-radius:10px;text-align:center;font-weight:700}
.cell.ok{color:#064e3b;background:#a7f3d0}
.cell.warn{color:#713f12;background:#fde68a}
.cell.mut{color:#334155;background:#dbe3e8}
.legend{display:flex;gap:12px;margin-top:11px;flex-wrap:wrap}
.li{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px}
.li i{width:11px;height:11px;border-radius:4px}
.mb12{margin-bottom:12px}
@keyframes reveal{
  from{opacity:0;transform:translateY(12px) scale(.992)}
  to{opacity:1;transform:none}
}
@media(max-width:980px){
  .split,.wide2,.wide3,.two{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(220px,1fr))}
  .listcol{max-height:none}
}
@media(max-width:620px){
  .app{padding:10px 12px 38px}
  .top{padding:9px 3px}
  .logo{width:44px;height:44px}
  .htxt h1{font-size:16px}
  .htxt p{font-size:10.5px}
  .hchip{width:100%;justify-content:center}
  .tabs{top:5px;border-radius:16px}
  .tabs button{min-width:44px;padding:8px 11px}
  .tabs .txt{display:none}
  .kpis{gap:9px}
  .kpi{min-height:118px;padding:13px}
  .kpi .val{font-size:20px}
  .mini{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .pad{padding:14px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important
  }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo" aria-hidden="true"><span class="material-symbols-outlined">eco</span></div>
    <div class="htxt">
      <h1>碳排放管理系統</h1>
      <p>Carbon Emission Management System · 碳盤查 · 能源監控 · 減碳目標</p>
    </div>
    <div class="hspacer"></div>
    <div class="hchip"><span class="material-symbols-outlined" style="font-size:16px">verified</span>盤查年度 2026</div>
  </header>
  <nav class="tabs" id="nav" aria-label="主要功能"></nav>
  <main id="screen" class="screen"></main>
</div>
<script>
(function(){
"use strict";

var MODS=[
  {ic:"co2",nm:"碳盤查工作台"},
  {ic:"calculate",nm:"排放量計算"},
  {ic:"flag",nm:"減碳目標追蹤"},
  {ic:"database",nm:"排放係數庫"},
  {ic:"hub",nm:"供應商碳資料"},
  {ic:"description",nm:"永續報告產出"}
];
var SOURCES=[
  {id:"S1-01",nm:"天然氣鍋爐 BLR-2",sc:"範疇一",tag:"燃燒排放",st:"已核對",cls:"b-ok",unit:"m³",act:184200,ef:"NG-2.11",e:388.7,own:"廠務工程師 王承恩",up:"2026-08-12",docs:3,chg:"+2.1%"},
  {id:"S1-02",nm:"堆高機柴油 FL-A",sc:"範疇一",tag:"移動源",st:"待蒐集",cls:"b-warn",unit:"L",act:26800,ef:"DSL-2.61",e:70,own:"廠務工程師 王承恩",up:"2026-08-10",docs:1,chg:"—"},
  {id:"S2-01",nm:"外購電力 台電 A廠",sc:"範疇二",tag:"外購電力",st:"已核對",cls:"b-ok",unit:"kWh",act:4820000,ef:"GRID-0.494",e:2381.1,own:"能源管理師 林昀蓁",up:"2026-08-13",docs:4,chg:"-3.4%"},
  {id:"S2-02",nm:"外購蒸汽 汽電共生",sc:"範疇二",tag:"外購能源",st:"核對中",cls:"b-info",unit:"GJ",act:12400,ef:"STM-0.065",e:806,own:"能源管理師 林昀蓁",up:"2026-08-11",docs:2,chg:"+0.8%"},
  {id:"S3-01",nm:"上游原料 鋁錠採購",sc:"範疇三",tag:"採購商品",st:"待蒐集",cls:"b-warn",unit:"t",act:640,ef:"ALU-8.24",e:5273.6,own:"永續管理師 陳品妍",up:"2026-08-08",docs:0,chg:"未回覆"},
  {id:"S3-02",nm:"上游物流 委外運輸",sc:"範疇三",tag:"上游運輸",st:"核對中",cls:"b-info",unit:"t·km",act:1980000,ef:"TRK-0.107",e:211.9,own:"永續管理師 陳品妍",up:"2026-08-09",docs:2,chg:"+5.6%"},
  {id:"S3-03",nm:"員工通勤估算",sc:"範疇三",tag:"通勤",st:"查證確認",cls:"b-acc",unit:"人·km",act:3420000,ef:"CMT-0.081",e:277,own:"永續管理師 陳品妍",up:"2026-08-13",docs:2,chg:"+1.2%"},
  {id:"S3-04",nm:"廢棄物處理 焚化",sc:"範疇三",tag:"廢棄物",st:"待蒐集",cls:"b-warn",unit:"t",act:312,ef:"WST-0.94",e:293.3,own:"環安衛 郭子齊",up:"2026-08-07",docs:0,chg:"缺聯單"}
];

var nav=document.getElementById("nav"),screen=document.getElementById("screen"),charts=[],cur=-1;
nav.innerHTML=MODS.map(function(m,i){
  return '<button type="button" data-i="'+i+'" aria-label="'+m.nm+'"><span class="material-symbols-outlined">'+m.ic+'</span><span class="txt">'+m.nm+'</span></button>';
}).join("");

function badge(text,cls){return '<span class="badge '+cls+'">'+text+'</span>'}
function icon(name){return '<span class="material-symbols-outlined">'+name+'</span>'}
function head(title,sub,flag){
  return '<div class="scr-head"><div><h2>'+title+'</h2><div class="sub">'+sub+'</div></div><div class="flag">'+flag+'</div></div>';
}

    {label:"目標",data:[95,95,95,90,95,90],borderColor:"#a16207",backgroundColor:"rgba(251,191,36,.08)",pointBackgroundColor:"#a16207",borderWidth:1.5,borderDash:[5,4]}
  ]},options:baseOpts({plugins:{legend:{position:"bottom",labels:{font:{family:"Fira Sans",size:11},boxWidth:12,padding:12}}},scales:{r:{beginAtZero:true,max:100,grid:{color:"#d7e8df"},angleLines:{color:"#d7e8df"},pointLabels:{font:{family:"Fira Sans",size:10.5},color:"#334155"},ticks:{display:false,stepSize:25}}}})});
}

var renders=[scr0,scr1,scr2,scr3,scr4,scr5];
function show(i){
  i=Math.max(0,Math.min(+i||0,renders.length-1));
  if(i===cur)return;
  cur=i;
  killCharts();
  nav.querySelectorAll("button").forEach(function(b){
    var on=+b.dataset.i===i;
    b.classList.toggle("on",on);
    b.setAttribute("aria-current",on?"page":"false");
  });
  screen.classList.remove("screen");
  void screen.offsetWidth;
  screen.classList.add("screen");
  renders[i]();
}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  show(m?Math.min(+m[1],renders.length-1):0);
  try{window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}catch(e){}
}
nav.addEventListener("click",function(e){
  var b=e.target.closest("[data-i]");
  if(!b)return;
  var hash="#v"+b.dataset.i;
  if(location.hash===hash)show(+b.dataset.i);
  else location.hash=hash;
});
window.addEventListener("hashchange",fromHash);
fromHash();
})();
</script>
