<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>碳排放管理系統 Carbon Emission Management System</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#e11d48; --accent2:#fb7185; --ink:#1f2430; --muted:#6b7280;
  --line:#eceef2; --bg:#f5f6f8; --card:#ffffff; --soft:#fff1f3;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;line-height:1.5;}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;vertical-align:middle;}
.app{max-width:1360px;margin:0 auto;padding:0 16px 48px;}
header.top{display:flex;align-items:center;gap:14px;padding:16px 4px;flex-wrap:wrap;}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;color:#fff;flex:none;box-shadow:0 6px 16px rgba(225,29,72,.28);}
.logo .material-symbols-outlined{font-size:26px;}
.htxt{min-width:0;}
.htxt h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.2px;}
.htxt p{margin:2px 0 0;font-size:12.5px;color:var(--muted);}
.hspacer{flex:1;}
.hchip{display:flex;align-items:center;gap:6px;background:var(--soft);color:var(--accent);
  border:1px solid #fbd0da;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;flex:none;}
nav.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px;}
nav.tabs button{flex:none;white-space:nowrap;min-width:0;display:flex;align-items:center;gap:7px;
  background:var(--card);border:1px solid var(--line);color:var(--muted);
  padding:9px 14px;border-radius:11px;font-size:13px;font-weight:600;cursor:pointer;
  font-family:inherit;transition:.15s;}
nav.tabs button .material-symbols-outlined{font-size:19px;}
nav.tabs button:hover{border-color:var(--accent2);color:var(--accent);}
nav.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff;
  box-shadow:0 5px 14px rgba(225,29,72,.28);}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;}
.pad{padding:16px 18px;}
.scr-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.scr-head .st{min-width:0;}
.scr-head h2{margin:0;font-size:16px;font-weight:800;}
.scr-head .sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
.scr-head .flag{margin-left:auto;font-size:11.5px;color:var(--accent);background:var(--soft);
  border:1px solid #fbd0da;border-radius:8px;padding:5px 10px;font-weight:600;flex:none;}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;min-width:0;}
.kpi .lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--accent);}
.kpi .val{font-size:23px;font-weight:800;margin-top:5px;letter-spacing:.3px;}
.kpi .val small{font-size:12px;font-weight:600;color:var(--muted);margin-left:3px;}
.kpi .delta{font-size:11.5px;font-weight:600;margin-top:3px;}
.up{color:var(--bad);} .down{color:var(--ok);}

.split{display:grid;grid-template-columns:340px 1fr;gap:14px;align-items:start;}
.wide2{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;align-items:start;}
.wide3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}

.listcol{max-height:520px;overflow:auto;}
.lrow{display:flex;gap:10px;align-items:center;padding:11px 13px;border-bottom:1px solid var(--line);
  cursor:pointer;transition:.12s;}
.lrow:hover{background:var(--soft);}
.lrow.sel{background:var(--soft);border-left:3px solid var(--accent);padding-left:10px;}
.lrow .ic{width:34px;height:34px;border-radius:9px;background:#f1f3f7;display:flex;align-items:center;
  justify-content:center;flex:none;color:var(--accent);}
.lrow .ic .material-symbols-outlined{font-size:20px;}
.lrow .mn{min-width:0;flex:1;}
.lrow .mn b{font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lrow .mn span{font-size:11.5px;color:var(--muted);}
.lrow .rt{font-size:11px;font-weight:700;flex:none;}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;
  padding:3px 9px;border-radius:999px;white-space:nowrap;}
.b-ok{background:#e7f6ec;color:var(--ok);}
.b-warn{background:#fef3e2;color:var(--warn);}
.b-bad{background:#fdeaea;color:var(--bad);}
.b-info{background:#e8f0fe;color:var(--info);}
.b-mut{background:#f0f1f4;color:var(--muted);}
.b-acc{background:var(--soft);color:var(--accent);}

table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px;}
th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;padding:9px 10px;
  border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.num{font-variant-numeric:tabular-nums;font-weight:600;}

.chartbox{position:relative;height:260px;width:100%;}
.chartbox.sm{height:210px;}
.chartbox.lg{height:300px;}

.sect-t{font-size:13px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:7px;}
.sect-t .material-symbols-outlined{font-size:18px;color:var(--accent);}

.detail-hd{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.detail-hd .big{width:46px;height:46px;border-radius:12px;background:var(--soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;flex:none;}
.detail-hd .big .material-symbols-outlined{font-size:27px;}
.detail-hd h3{margin:0;font-size:15px;font-weight:800;}
.detail-hd p{margin:2px 0 0;font-size:12px;color:var(--muted);}

.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0;}
.mini .m{background:#fafbfc;border:1px solid var(--line);border-radius:11px;padding:11px;min-width:0;}
.mini .m .l{font-size:11px;color:var(--muted);}
.mini .m .v{font-size:18px;font-weight:800;margin-top:3px;}

.bar-line{margin:9px 0;}
.bar-line .top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;gap:8px;}
.bar-line .top b{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.track{height:9px;border-radius:99px;background:#eef0f4;overflow:hidden;}
.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));}

.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.bcol{background:#fafbfc;border:1px solid var(--line);border-radius:13px;padding:11px;min-width:0;}
.bcol .bh{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;
  margin-bottom:10px;padding-bottom:8px;border-bottom:1px dashed var(--line);}
.bcol .bh .cnt{background:#fff;border:1px solid var(--line);border-radius:99px;font-size:11px;
  padding:1px 8px;color:var(--muted);}
.ticket{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:10px;
  padding:10px;margin-bottom:9px;}
.ticket b{font-size:12.5px;display:block;}
.ticket .meta{font-size:11px;color:var(--muted);margin-top:5px;display:flex;justify-content:space-between;
  align-items:center;gap:6px;flex-wrap:wrap;}

.tl{position:relative;padding-left:22px;}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl .ti{position:relative;padding:0 0 16px 0;}
.tl .ti .dot{position:absolute;left:-22px;top:2px;width:14px;height:14px;border-radius:50%;
  background:#fff;border:3px solid var(--accent);}
.tl .ti.done .dot{background:var(--accent);}
.tl .ti .tt{font-size:13px;font-weight:700;}
.tl .ti .td{font-size:11.5px;color:var(--muted);margin-top:2px;}
.tl .ti .tm{font-size:11px;color:var(--accent);font-weight:600;margin-top:2px;}

.matrix{display:grid;grid-template-columns:auto repeat(4,1fr);gap:6px;font-size:11.5px;min-width:520px;}
.matrix .mh{font-weight:700;color:var(--muted);padding:6px;text-align:center;}
.matrix .ml{font-weight:600;padding:8px 6px;display:flex;align-items:center;}
.matrix .cell{border-radius:9px;padding:10px 6px;text-align:center;font-weight:700;color:#fff;}

.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
.legend .li{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);}
.legend .li i{width:11px;height:11px;border-radius:3px;display:inline-block;}

.note{font-size:11.5px;color:var(--muted);background:#fafbfc;border:1px dashed var(--line);
  border-radius:10px;padding:10px 12px;margin-top:12px;display:flex;gap:8px;}
.note .material-symbols-outlined{font-size:17px;color:var(--accent);flex:none;}

.scroll-x{overflow-x:auto;}
.mb12{margin-bottom:12px;}

@media(max-width:820px){
  .split,.wide2,.wide3,.two{grid-template-columns:1fr;}
  .kpis{grid-template-columns:repeat(2,1fr);}
  .board{grid-template-columns:repeat(2,1fr);}
  .listcol{max-height:none;}
}
@media(max-width:560px){
  nav.tabs button span.txt{display:none;}
  nav.tabs button{padding:9px 12px;}
  .kpis{grid-template-columns:1fr 1fr;}
  .board{grid-template-columns:1fr;}
  .htxt h1{font-size:16px;}
}
/*ovfix*/@media(max-width:820px){.two,.g2,.g3,.g11,[class*="grid"]{grid-template-columns:1fr !important}}.chartbox,.chart-box{overflow:hidden;max-width:100%}.card,.panel,.two>*,[class*="grid"]>*{min-width:0}</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo"><span class="material-symbols-outlined">eco</span></div>
    <div class="htxt">
      <h1>碳排放管理系統</h1>
      <p>Carbon Emission Management System · 碳盤查 · 能源監控 · 減碳目標</p>
    </div>
    <div class="hspacer"></div>
    <div class="hchip"><span class="material-symbols-outlined" style="font-size:16px;">verified</span>盤查年度 2026</div>
  </header>

  <nav class="tabs" id="nav"></nav>
  <div id="screen"></div>
</div>

<script>
(function(){
"use strict";

var MODS=[
  {i:0,ic:"co2",nm:"碳盤查工作台"},
  {i:1,ic:"calculate",nm:"排放量計算"},
  {i:2,ic:"flag",nm:"減碳目標追蹤"},
  {i:3,ic:"database",nm:"排放係數庫"},
  {i:4,ic:"hub",nm:"供應商碳資料"},
  {i:5,ic:"description",nm:"永續報告產出"}
];

var navEl=document.getElementById("nav");
var nhtml="";
for(var k=0;k<MODS.length;k++){
  nhtml+='<button data-i="'+MODS[k].i+'"><span class="material-symbols-outlined">'+MODS[k].ic+'</span><span class="txt">'+MODS[k].nm+'</span></button>';
}
navEl.innerHTML=nhtml;

var charts=[];
function killCharts(){for(var q=0;q<charts.length;q++){try{charts[q].destroy();}catch(e){}}charts=[];}
function gc(id){return document.getElementById(id);}

var RED="#e11d48",PINK="#fb7185",GRID="#eceef2";
function baseOpts(extra){
  var o={responsive:true,maintainAspectRatio:false,
    plugins:{legend:{labels:{font:{family:"Inter",size:11},color:"#4b5563",boxWidth:12,padding:12}}},
    scales:{}};
  if(extra){for(var kk in extra){o[kk]=extra[kk];}}
  return o;
}

/* ============ SCREEN 0 : 碳盤查工作台 (split list/detail) ============ */
var SOURCES=[
  {id:"S1-01",nm:"天然氣鍋爐 BLR-2",sc:"範疇一",tag:"燃燒排放",st:"已核對",cls:"b-ok",unit:"m³",act:184200,ef:"NG-2.11",e:388.7,own:"廠務工程師 王承恩",up:"2026-08-12",docs:3,chg:"+2.1%"},
  {id:"S1-02",nm:"堆高機柴油 FL-A",sc:"範疇一",tag:"移動源",st:"待蒐集",cls:"b-warn",unit:"L",act:26800,ef:"DSL-2.61",e:70.0,own:"廠務工程師 王承恩",up:"2026-08-10",docs:1,chg:"—"},
  {id:"S2-01",nm:"外購電力 台電 A廠",sc:"範疇二",tag:"外購電力",st:"已核對",cls:"b-ok",unit:"kWh",act:4820000,ef:"GRID-0.494",e:2381.1,own:"能源管理師 林昀蓁",up:"2026-08-13",docs:4,chg:"-3.4%"},
  {id:"S2-02",nm:"外購蒸汽 汽電共生",sc:"範疇二",tag:"外購能源",st:"核對中",cls:"b-info",unit:"GJ",act:12400,ef:"STM-0.065",e:806.0,own:"能源管理師 林昀蓁",up:"2026-08-11",docs:2,chg:"+0.8%"},
  {id:"S3-01",nm:"上游原料 鋁錠採購",sc:"範疇三",tag:"採購商品",st:"待蒐集",cls:"b-warn",unit:"t",act:640,ef:"ALU-8.24",e:5273.6,own:"永續管理師 陳品妍",up:"2026-08-08",docs:0,chg:"未回覆"},
  {id:"S3-02",nm:"上游物流 委外運輸",sc:"範疇三",tag:"上游運輸",st:"核對中",cls:"b-info",unit:"t·km",act:1980000,ef:"TRK-0.107",e:211.9,own:"永續管理師 陳品妍",up:"2026-08-09",docs:2,chg:"+5.6%"},
  {id:"S3-03",nm:"員工通勤估算",sc:"範疇三",tag:"通勤",st:"查證確認",cls:"b-acc",unit:"人·km",act:3420000,ef:"CMT-0.081",e:277.0,own:"永續管理師 陳品妍",up:"2026-08-13",docs:2,chg:"+1.2%"},
  {id:"S3-04",nm:"廢棄物處理 焚化",sc:"範疇三",tag:"廢棄物",st:"待蒐集",cls:"b-warn",unit:"t",act:312,ef:"WST-0.94",e:293.3,own:"環安衛 郭子齊",up:"2026-08-07",docs:0,chg:"缺聯單"}
];
function scr0(c){
  var rows="";
  for(var i=0;i<SOURCES.length;i++){
    var s=SOURCES[i];
    rows+='<div class="lrow'+(i===0?' sel':'')+'" data-row="'+i+'">'+
      '<div class="ic"><span class="material-symbols-outlined">'+
        (s.sc==="範疇一"?"local_fire_department":s.sc==="範疇二"?"bolt":"hub")+'</span></div>'+
      '<div class="mn"><b>'+s.nm+'</b><span>'+s.id+' · '+s.tag+'</span></div>'+
      '<div class="rt"><span class="badge '+s.cls+'">'+s.st+'</span></div></div>';
  }
  var done=SOURCES.filter(function(x){return x.st==="已核對"||x.st==="查證確認";}).length;
  c.innerHTML=
  '<div class="scr-head"><div class="st"><h2>碳盤查工作台</h2>'+
    '<div class="sub">範疇一/二/三排放源清冊 · 活動數據蒐集與核對狀態</div></div>'+
    '<div class="flag">階段 v0 · 排放源數據蒐集</div></div>'+
  '<div class="kpis">'+
    '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">list_alt</span>排放源總數</div><div class="val">'+SOURCES.length+'<small>源</small></div><div class="delta down">本年度清冊</div></div>'+
    '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">fact_check</span>已完成核對</div><div class="val">'+done+'<small>/'+SOURCES.length+'</small></div><div class="delta down">數據完整率 97%</div></div>'+
    '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">pending_actions</span>待蒐集</div><div class="val">3<small>源</small></div><div class="delta up">含 2 筆缺憑證</div></div>'+
    '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">co2</span>本期合計</div><div class="val">9,703<small>tCO₂e</small></div><div class="delta up">+2.4% MoM</div></div>'+
  '</div>'+
  '<div class="split">'+
    '<div class="card"><div class="pad" style="padding-bottom:6px;"><div class="sect-t"><span class="material-symbols-outlined">inventory_2</span>排放源清冊</div></div>'+
      '<div class="listcol" id="s0list">'+rows+'</div></div>'+
    '<div class="card pad" id="s0detail"></div>'+
  '</div>';
  renderDetail0(0);
  var list=gc("s0list");
  list.addEventListener("click",function(ev){
    var t=ev.target;while(t&&t!==list&&!t.getAttribute("data-row"))t=t.parentNode;
    if(!t||t===list)return;
    var idx=+t.getAttribute("data-row");
    var all=list.querySelectorAll(".lrow");
    for(var z=0;z<all.length;z++)all[z].classList.remove("sel");
    t.classList.add("sel");
    renderDetail0(idx);
  });
}
function renderDetail0(idx){
  var s=SOURCES[idx];var d=gc("s0detail");if(!d)return;
  var scCls=s.sc==="範疇一"?"b-bad":s.sc==="範疇二"?"b-info":"b-acc";
  d.innerHTML=
  '<div class="detail-hd"><div class="big"><span class="material-symbols-outlined">'+
    (s.sc==="範疇一"?"local_fire_department":s.sc==="範疇二"?"bolt":"hub")+'</span></div>'+
    '<div style="min-width:0;"><h3>'+s.nm+'</h3><p>'+s.id+' · 負責人 '+s.own+'</p></div>'+
    '<div style="margin-left:auto;text-align:right;flex:none;"><span class="badge '+scCls+'">'+s.sc+'</span><br>'+
    '<span class="badge '+s.cls+'" style="margin-top:6px;">'+s.st+'</span></div></div>'+
  '<div class="mini">'+
    '<div class="m"><div class="l">活動數據</div><div class="v">'+s.act.toLocaleString()+'<span style="font-size:12px;color:var(--muted);"> '+s.unit+'</span></div></div>'+
    '<div class="m"><div class="l">排放係數</div><div class="v" style="font-size:15px;">'+s.ef+'</div></div>'+
    '<div class="m"><div class="l">排放量</div><div class="v">'+s.e.toLocaleString()+'<span style="font-size:12px;color:var(--muted);"> tCO₂e</span></div></div>'+
  '</div>'+
  '<div class="two" style="margin-top:4px;">'+
    '<div style="min-width:0;"><div class="sect-t"><span class="material-symbols-outlined">fact_check</span>核對檢查項</div>'+
      chk("原始憑證上傳",s.docs>0)+chk("係數版本對應正確",true)+chk("與前月差異 < 20%",s.chg.indexOf("+5")<0&&s.chg!=="未回覆"&&s.chg!=="缺聯單")+chk("盤查邊界確認",s.sc!=="範疇三"||s.st==="查證確認")+'</div>'+
    '<div style="min-width:0;"><div class="sect-t"><span class="material-symbols-outlined">description</span>佐證文件（'+s.docs+'）</div>'+
      (s.docs>0?docList(s):'<div class="note"><span class="material-symbols-outlined">error</span>尚無原始憑證，依 RULE-01 此活動數據不得納入正式盤查。</div>')+'</div>'+
  '</div>'+
  '<div class="note"><span class="material-symbols-outlined">update</span>最後更新 '+s.up+' · 較前月變動 '+s.chg+' · 係數來源：GHG Protocol / 環境部係數資料庫</div>';
}
function chk(label,ok){
  return '<div style="display:flex;align-items:center;gap:8px;font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--line);">'+
    '<span class="material-symbols-outlined" style="font-size:19px;color:'+(ok?"#16a34a":"#dc2626")+';">'+(ok?"check_circle":"cancel")+'</span>'+label+'</div>';
}
function docList(s){

function versionMatrix(){

  var col={ok:"#16a34a",warn:"#d97706",mut:"#c7cbd2"};

  var h='<div class="matrix"><div class="mh"></div>';
  for(var j=0;j<cats.length;j++)h+='<div class="mh">'+cats[j]+'</div>';
  for(var i=0;i<scopes.length;i++){

      var v=data[i][k];

    }
  }
  h+='</div>';return h;
}

var RENDER=[scr0,scr1,scr2,scr3,scr4,scr5];
var cur=-1;
function show(i){
  i=Math.max(0,Math.min(i,RENDER.length-1));
  if(i===cur)return;
  cur=i;
  killCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);
  }
  var container=document.getElementById("screen");
  container.innerHTML="";
  RENDER[i](container);
  void container.offsetHeight;
}

navEl.addEventListener("click",function(ev){
  var t=ev.target;while(t&&t!==navEl&&!t.getAttribute("data-i"))t=t.parentNode;
  if(!t||t===navEl)return;
  show(+t.getAttribute("data-i"));
  try{window.scrollTo(0,0);}catch(e){}
});

show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
})();
</script>
