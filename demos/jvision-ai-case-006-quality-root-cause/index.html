<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>品質追因實驗室 · Quality Root-Cause Lab</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--accent:#7c3aed;--accent2:#a855f7;--ink:#1a1526;--bg:#f4f1fb;--card:#fff;--line:#e7e0f3;--mut:#6b6280;--ok:#16a34a;--warn:#f59e0b;--bad:#e11d48}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.top{background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:11px 22px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#fff;flex:none;box-shadow:0 8px 18px rgba(124,58,237,.35)}
.brand b{font-size:15px;font-weight:800;display:block;font-family:"Noto Sans TC"}
.brand span{font-size:10px;color:var(--accent);letter-spacing:2px}
.nav{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap;min-width:0}
.nav button{border:0;background:transparent;color:var(--mut);font:inherit;font-weight:600;font-size:13px;padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:#f4f1fb;color:var(--accent)}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.wrap{max-width:1280px;margin:0 auto;padding:22px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.live{background:#ede9fe;color:#6d28d9;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.32}
.up{color:var(--ok)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.3fr .9fr}
.g11{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-open{background:#ffe4e6;color:#be123c}.t-prog{background:#ede9fe;color:#6d28d9}.t-hold{background:#fef3c7;color:#b45309}.t-done{background:#dcfce7;color:#15803d}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#faf8fe}
.chart{height:230px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.two>*{min-width:0}
.qz{border:1px solid var(--line);border-radius:12px;padding:13px;background:#faf8fe}
.qz b{font-family:"Noto Sans TC";font-size:13.5px;display:block}
.qz small{color:var(--mut);font-size:11.5px}
.hold{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.hc{border:1px solid var(--line);border-radius:13px;padding:13px;border-top:4px solid var(--bad)}
.hc.rel{border-top-color:var(--ok)}
.hc b{font-family:Inter;font-weight:800;font-size:14px}
.hc small{color:var(--mut);font-size:11px;display:block;margin-top:3px}
.fish{width:100%;height:auto;display:block}
.why{display:flex;flex-direction:column;gap:9px}
.wr{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:#faf8fe;border-left:3px solid var(--accent)}
.wr .n{width:22px;height:22px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.wr b{font-size:12.5px;font-family:"Noto Sans TC"}
.wr small{display:block;color:var(--mut);font-size:11px}
.risk{display:flex;flex-direction:column;gap:11px}
.rz b{font-family:"Noto Sans TC";font-size:13px;display:flex;justify-content:space-between}
.rz .pb{height:8px;background:#f0eafb;border-radius:5px;overflow:hidden;margin-top:6px}
.rz .pb i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.capa{display:flex;flex-direction:column;gap:10px}
.cc{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.cc .bx{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
.cc b{font-size:12.5px;font-family:"Noto Sans TC";display:block}
.cc small{color:var(--mut);font-size:11px}
.cc .st{margin-left:auto}
.trace{position:relative;padding-left:22px}
.trace::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.ti{position:relative;padding:0 0 14px 4px}
.ti::before{content:"";position:absolute;left:-20px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.ti .tt{font-size:12.5px;font-family:"Noto Sans TC";font-weight:700}
.ti small{color:var(--mut);font-size:11px}
.scroll{overflow-x:auto}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g11,.two{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:14px}.nav button span:not(.material-symbols-outlined){display:none}.nav button{padding:9px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo">追</div><div><b>品質追因實驗室</b><span>ROOT-CAUSE LAB</span></div></div>
  <nav class="nav" id="nav"></nav>
</header>
<main class="wrap">
  <div class="vh"><div><h2 id="vt">品質戰情</h2><p id="vd"></p></div><div class="live">本月 NCR 28 · 關案 24</div></div>
  <div id="view"></div>
</main>
<script>
const MOD=[["品質戰情","monitoring","品質戰情","NCR、不良趨勢與追因效率全局視圖"],
["NCR 異常單","assignment_late","NCR 異常單","品質異常立案、分派與狀態追蹤"],
["批次隔離","block","批次隔離","不良批次隔離、放行與影響範圍控管"],
["根因分析","account_tree","根因分析","魚骨圖與 5-Why 結構化追因"],
["AI 風險因子","psychology","AI 風險因子","AI 排序高風險製程與參數因子"],
["改善驗證","verified","改善驗證 CAPA","改善措施、驗證與有效性追蹤"],
["批號追溯","travel_explore","批號追溯","正逆向批號追溯與影響擴散分析"]];
const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span><span>'+m[0]+'</span>';b.onclick=()=>show(i);nav.appendChild(b);});

const NCR=[["NCR-3312","電鍍層剝離","衝壓件 A","高","根因分析","t-prog","王品保"],["NCR-3311","尺寸超差 +0.08","齒輪 B","中","批次隔離","t-hold","陳品保"],["NCR-3310","焊點空洞","控制板 C","高","改善驗證","t-prog","黃品保"],["NCR-3308","表面刮傷","外殼 D","低","已關案","t-done","李品保"],["NCR-3307","漏鎖螺絲","模組 E","中","已關案","t-done","王品保"]];
const HOLD=[["LOT-A2208","衝壓件 A · 2,400 pcs","隔離中 · 待判定","",0],["LOT-B1904","齒輪 B · 1,200 pcs","隔離中 · 重工評估","",0],["LOT-C7781","控制板 C · 800 pcs","部分放行 640","rel",1],["LOT-D5520","外殼 D · 3,000 pcs","已放行","rel",1]];
const WHY=[["為何電鍍層剝離？","前處理除油不完全，附著力不足"],["為何除油不完全？","脫脂槽濃度低於標準下限"],["為何濃度偏低？","補液週期過長、未即時監控"],["為何未即時監控？","濃度靠人工每班量測，易遺漏"],["為何靠人工？","缺乏線上濃度感測與自動補液"]];
const RISK=[["前處理脫脂槽濃度",86],["電鍍電流密度",71],["槽液溫度",58],["掛具接觸電阻",44],["環境濕度",29]];
const CAPA=[["脫脂槽加裝線上濃度感測","done","已上線，異常自動補液"],["修訂補液 SOP 與監控頻率","done","改為每 2 小時量測"],["首件附著力測試強化","prog","導入膠帶剝離測試"],["效果驗證（連續 5 批）","prog","已驗證 3 批，剝離率 0%"]];
const TRACE=[["原料進料 RM-CU08","2026-08-05 · 佳金屬 · 批號 CU-2208"],["前處理脫脂","2026-08-08 · 脫脂線 2 · 濃度異常時段"],["電鍍加工 LOT-A2208","2026-08-09 · 電鍍線 A · 影響 2,400 pcs"],["入庫與出貨","2026-08-10 · 出貨 3 客戶 · 已發預警通知"],["客訴回饋","2026-08-11 · 客戶 B 反映剝離 · 觸發 NCR-3312"]];

const SCREENS=[
()=>`<div class="kpis">
 <div class="kpi"><span class="material-symbols-outlined ic">timer</span><div class="l">批號追溯時間</div><div class="v">15<small style="font-size:12px"> 分</small></div><div class="d up">▼ 較 3 天</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">event_available</span><div class="l">客訴平均關案</div><div class="v">9<small style="font-size:12px"> 天</small></div><div class="d up">▼ 較 21 天</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">replay</span><div class="l">重複不良率</div><div class="v">2.1<small style="font-size:12px">%</small></div><div class="d up">▼ 較 6.4%</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">verified</span><div class="l">改善驗證率</div><div class="v">98<small style="font-size:12px">%</small></div><div class="d up">▲ CAPA 有效</div></div>
</div>
<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">stacked_bar_chart</span>不良類型與趨勢</h3><div class="chart" id="c_tr"></div></div>
 <div class="card"><h3><span class="material-symbols-outlined">pending_actions</span>待處理 NCR</h3>${NCR.filter(n=>n[4]!='已關案').map(n=>`<div class="qz" style="margin-bottom:10px"><b>${n[0]} · ${n[1]}</b><small>${n[2]} · ${n[6]} · <span class="tag ${n[5]}">${n[4]}</span></small></div>`).join('')}</div>
</div>`,
()=>`<div class="card"><h3><span class="material-symbols-outlined">assignment_late</span>NCR 品質異常單 <span class="tag t-open" style="margin-left:auto">開立中 3</span></h3><div class="scroll"><table class="data"><tr><th>單號</th><th>異常</th><th>產品</th><th>等級</th><th>負責</th><th>狀態</th></tr>${NCR.map(n=>`<tr><td><b style="color:var(--accent)">${n[0]}</b></td><td>${n[1]}</td><td>${n[2]}</td><td><span class="tag ${n[3]=='高'?'t-open':n[3]=='中'?'t-hold':'t-prog'}">${n[3]}</span></td><td>${n[6]}</td><td><span class="tag ${n[5]}">${n[4]}</span></td></tr>`).join('')}</table></div></div>`,
()=>`<div class="card"><h3><span class="material-symbols-outlined">block</span>不良批次隔離</h3><div class="hold">${HOLD.map(h=>`<div class="hc ${h[3]}"><b>${h[0]}</b><small>${h[1]}</small><small style="margin-top:6px"><span class="tag ${h[4]?'t-done':'t-open'}">${h[2]}</span></small></div>`).join('')}</div><p style="font-size:11.5px;color:var(--mut);margin:13px 0 0">隔離批次自動鎖定出貨，放行需品保主管覆核。</p></div>`,
()=>`<div class="g11 grid"><div class="card"><h3><span class="material-symbols-outlined">account_tree</span>魚骨圖 · NCR-3312 電鍍層剝離</h3>${fishSVG()}</div><div class="card"><h3><span class="material-symbols-outlined">psychology_alt</span>5-Why 結構化追因</h3><div class="why">${WHY.map((w,i)=>`<div class="wr"><span class="n">${i+1}</span><div><b>${w[0]}</b><small>${w[1]}</small></div></div>`).join('')}<div class="qz" style="border-left:3px solid var(--ok);border-radius:0 10px 10px 0"><b style="color:var(--ok)">根本原因</b><small>缺乏線上濃度感測與自動補液，脫脂槽濃度失控導致附著力不足。</small></div></div></div></div>`,
()=>`<div class="grid g2"><div class="card"><h3><span class="material-symbols-outlined">psychology</span>AI 高風險製程因子（依關聯度排序）</h3><div class="risk">${RISK.map(r=>`<div class="rz"><b>${r[0]}<span style="color:var(--accent)">${r[1]}%</span></b><div class="pb"><i style="width:${r[1]}%"></i></div></div>`).join('')}</div><p style="font-size:11.5px;color:var(--mut);margin:14px 0 0">AI 分析近 6 個月不良與製程參數關聯，脫脂槽濃度為最高風險因子。</p></div><div class="card"><h3><span class="material-symbols-outlined">scatter_plot</span>參數 vs 不良率關聯</h3><div class="chart" style="height:270px" id="c_sc"></div></div></div>`,
()=>`<div class="card"><h3><span class="material-symbols-outlined">verified</span>改善措施 CAPA 與驗證</h3><div class="capa">${CAPA.map(c=>{const col=c[1]=='done'?'#16a34a':'#7c3aed';const ic=c[1]=='done'?'check':'sync';return `<div class="cc"><div class="bx" style="background:${col}"><span class="material-symbols-outlined" style="font-size:16px">${ic}</span></div><div><b>${c[0]}</b><small>${c[2]}</small></div><span class="st tag ${c[1]=='done'?'t-done':'t-prog'}">${c[1]=='done'?'已完成':'驗證中'}</span></div>`;}).join('')}</div></div>`,
()=>`<div class="card"><h3><span class="material-symbols-outlined">travel_explore</span>批號追溯 · LOT-A2208 影響擴散</h3><div class="trace">${TRACE.map(t=>`<div class="ti"><div class="tt">${t[0]}</div><small>${t[1]}</small></div>`).join('')}</div></div>`
];
function fishSVG(){return `<svg viewBox="0 0 460 230" class="fish"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#7c3aed"/></marker></defs>
<line x1="20" y1="115" x2="400" y2="115" stroke="#7c3aed" stroke-width="3" marker-end="url(#ah)"/>
<rect x="398" y="95" width="58" height="40" rx="8" fill="#7c3aed"/><text x="427" y="112" fill="#fff" font-size="10" text-anchor="middle">電鍍層</text><text x="427" y="126" fill="#fff" font-size="10" text-anchor="middle">剝離</text>
${[["人 Man",70,55,1],["機 Machine",160,55,1],["料 Material",250,55,1],["法 Method",70,175,0],["環 Environment",160,175,0],["量測 Measure",250,175,0]].map(b=>{const y2=b[3]?90:140;return `<line x1="${b[1]}" y1="${b[2]+ (b[3]?8:-8)}" x2="${b[1]+30}" y2="115" stroke="#c4b5fd" stroke-width="2"/><text x="${b[1]}" y="${b[2]}" fill="#6d28d9" font-size="11" font-weight="700" text-anchor="middle">${b[0]}</text>`;}).join('')}
<text x="70" y="72" fill="#6b6280" font-size="9" text-anchor="middle">量測遺漏</text>
<text x="160" y="72" fill="#6b6280" font-size="9" text-anchor="middle">無線上感測</text>
<text x="250" y="72" fill="#6b6280" font-size="9" text-anchor="middle">脫脂濃度低</text>
<text x="70" y="192" fill="#6b6280" font-size="9" text-anchor="middle">補液週期長</text>
<text x="160" y="192" fill="#6b6280" font-size="9" text-anchor="middle">槽溫波動</text>
<text x="250" y="192" fill="#6b6280" font-size="9" text-anchor="middle">人工判讀</text></svg>`;}
function draw(i){
 if(i==0){const c=echarts.init(document.getElementById('c_tr'));c.setOption({grid:{left:38,right:12,top:30,bottom:24},legend:{top:0,textStyle:{fontSize:11}},tooltip:{trigger:'axis'},xAxis:{type:'category',data:['3月','4月','5月','6月','7月','8月'],axisLabel:{fontSize:11}},yAxis:{type:'value',axisLabel:{fontSize:11}},series:[{name:'電鍍',type:'bar',stack:'x',data:[12,10,9,7,6,5],itemStyle:{color:'#7c3aed'}},{name:'尺寸',type:'bar',stack:'x',data:[8,9,7,6,6,5],itemStyle:{color:'#a855f7'}},{name:'外觀',type:'bar',stack:'x',data:[6,5,6,4,4,3],itemStyle:{color:'#c4b5fd'}},{name:'重複不良率%',type:'line',yAxisIndex:0,data:[6.4,5.5,4.8,3.6,2.9,2.1],lineStyle:{color:'#e11d48',width:3},itemStyle:{color:'#e11d48'}}]});}
 if(i==4){const c=echarts.init(document.getElementById('c_sc'));c.setOption({grid:{left:44,right:16,top:20,bottom:34},tooltip:{},xAxis:{type:'value',name:'脫脂濃度',nameTextStyle:{fontSize:10},axisLabel:{fontSize:10}},yAxis:{type:'value',name:'不良率%',nameTextStyle:{fontSize:10},axisLabel:{fontSize:10}},series:[{type:'scatter',symbolSize:11,data:[[92,0.4],[88,0.6],[80,1.2],[74,2.1],[68,3.4],[62,4.9],[58,6.1],[95,0.3]],itemStyle:{color:'#7c3aed'}},{type:'line',smooth:true,data:[[58,6.1],[95,0.3]],lineStyle:{color:'#e11d48',type:'dashed'},symbol:'none'}]});}
}
function show(i){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));vt.textContent=MOD[i][2];vd.textContent=MOD[i][3];view.innerHTML=SCREENS[i]();draw(i);}
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
<script src="/shared/jv-agent-bridge.js" defer></script>
</body>
</html>
