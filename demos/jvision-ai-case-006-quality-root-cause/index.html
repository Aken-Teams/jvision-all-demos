<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>產品不良原因分析平台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --ok:#15803D;
  --warn:#A14908;
  --bad:#DC2626;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.04);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--color-background);
  color:var(--ink);
  font-family:"Fira Sans",sans-serif;
  font-size:14px;
  line-height:1.5;
}
button,a{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid rgba(37,99,235,.35);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-size:20px;
  line-height:1;
  vertical-align:middle;
}
.top{
  position:sticky;
  top:0;
  z-index:30;
  display:flex;
  align-items:center;
  min-height:68px;
  padding:10px max(20px,calc((100vw - 1440px)/2));
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(12px);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:280px;
}
.logo{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  flex:none;
  color:var(--color-on-primary);
  background:var(--blue);
  border-radius:6px;
  box-shadow:4px 4px 0 #BFDBFE;
  font-family:"Fira Code",monospace;
  font-size:17px;
  font-weight:700;
}
.brand b{
  display:block;
  font-size:15px;
  font-weight:700;
  letter-spacing:.01em;
}
.brand small{
  display:block;
  margin-top:1px;
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:9px;
  letter-spacing:.14em;
}
.nav{
  display:flex;
  gap:2px;
  margin-left:auto;
  overflow-x:auto;
  scrollbar-width:thin;
}
.nav button{
  min-height:42px;
  display:flex;
  align-items:center;
  gap:7px;
  flex:none;
  padding:8px 11px;
  color:var(--muted);
  background:transparent;
  border:1px solid transparent;
  border-radius:5px;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .2s ease;
}
.nav button:hover{
  color:var(--blue);
  background:#EFF6FF;
  border-color:#BFDBFE;
}
.nav button.on{
  color:var(--color-on-primary);
  background:var(--blue);
  border-color:var(--blue);
}
.nav button:active{transform:translateY(1px)}
.wrap{
  width:min(1440px,100%);
  margin:auto;
  padding:22px 24px 40px;
}
.vh{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:17px;
  padding-bottom:14px;
  border-bottom:1px solid var(--line);
}
.vh h1{
  margin:0;
  font-size:clamp(21px,2vw,27px);
  line-height:1.2;
  font-weight:700;
  letter-spacing:-.025em;
}
.vh p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:13px;
}
.live{
  display:inline-flex;
  align-items:center;
  gap:7px;
  flex:none;
  padding:7px 11px;
  color:#1E3A8A;
  background:#DBEAFE;
  border:1px solid #93C5FD;
  border-radius:4px;
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:600;
}
.live::before{
  content:"";
  width:7px;
  height:7px;
  background:var(--blue);
  border-radius:50%;
}
.kpis{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:14px;
}
.kpi,.card{
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:7px;
  box-shadow:var(--shadow);
}
.kpi{
  position:relative;
  min-height:112px;
  padding:15px 16px;
  overflow:hidden;
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.kpi::after{
  content:"";
  position:absolute;
  right:0;
  bottom:0;
  left:0;
  height:3px;
  background:var(--blue);
  transform:scaleX(.3);
  transform-origin:left;
  transition:transform .22s ease;
}
.kpi:hover{
  border-color:#93C5FD;
  box-shadow:0 8px 22px rgba(37,99,235,.1);
  transform:translateY(-2px);
}
.kpi:hover::after{transform:scaleX(1)}
.kpi .l{
  color:var(--muted);
  font-size:11px;
  font-weight:600;
  letter-spacing:.04em;
}
.kpi .v{
  margin-top:5px;
  font-family:"Fira Code",monospace;
  font-size:25px;
  font-weight:700;
  letter-spacing:-.04em;
}
.kpi .v small{
  margin-left:2px;
  font-size:11px;
  font-weight:500;
}
.kpi .d{
  margin-top:2px;
  font-size:11px;
  font-weight:600;
}
.kpi .ic{
  position:absolute;
  top:14px;
  right:14px;
  color:var(--blue);
  opacity:.28;
  font-size:26px;
}
.up{color:var(--ok)}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .85fr}
.g11{grid-template-columns:1fr 1fr}
.card{padding:16px}
.card h2{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin:0 0 14px;
  padding-bottom:11px;
  border-bottom:1px solid var(--line);
  font-size:14px;
  line-height:1.3;
  font-weight:700;
}
.card h2 .material-symbols-outlined{color:var(--blue)}
.chart{height:238px}
.tag{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:23px;
  padding:2px 8px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:10px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
}
.t-open{color:#B91C1C;background:#FEF2F2}
.t-prog{color:#1D4ED8;background:#EFF6FF}
.t-hold{color:#92400E;background:#FFFBEB}
.t-done{color:#166534;background:#F0FDF4}
.scroll{
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:5px;
}
table.data{
  width:100%;
  min-width:680px;
  border-collapse:collapse;
  font-size:12px;
}
table.data th,table.data td{
  padding:10px 12px;
  border-bottom:1px solid var(--line);
  text-align:left;
  white-space:nowrap;
}
table.data th{
  color:#334155;
  background:#F1F5F9;
  font-size:10px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:none;
}
table.data tr:last-child td{border-bottom:0}
table.data tbody tr:hover{background:#F8FAFC}
table.data td:first-child{
  color:var(--blue);
  font-family:"Fira Code",monospace;
  font-weight:600;
}
table.data th:nth-child(4),table.data td:nth-child(4){text-align:center}
.qz{
  margin-bottom:8px;
  padding:11px 12px;
  background:#F8FAFC;
  border:1px solid var(--line);
  border-left:3px solid var(--blue);
  border-radius:4px;
  transition:background-color .2s ease,border-color .2s ease,transform .2s ease;
}
.qz:hover{
  background:#EFF6FF;
  border-color:#93C5FD;
  transform:translateX(2px);
}
.qz:last-child{margin-bottom:0}
.qz b{
  display:block;
  font-size:12px;
  font-weight:700;
}
.qz small{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
}
.qz b code{
  color:var(--blue);
  font-family:"Fira Code",monospace;
  font-size:11px;
}
.hold{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:10px;
}
.hc{
  position:relative;
  padding:13px;
  background:#FFF;
  border:1px solid var(--line);
  border-top:3px solid var(--bad);
  border-radius:5px;
  transition:box-shadow .2s ease,transform .2s ease;
}
.hc:hover{
  box-shadow:0 7px 18px rgba(15,23,42,.08);
  transform:translateY(-2px);
}
.hc.rel{border-top-color:var(--ok)}
.hc b{
  font-family:"Fira Code",monospace;
  font-size:12px;
  font-weight:700;
}
.hc small{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-size:11px;
}
.hc small:last-child{margin-top:8px}
.note{
  margin:13px 0 0;
  color:var(--muted);
  font-size:11px;
}
.fish{
  display:block;
  width:100%;
  height:auto;
}
.why{
  display:flex;
  flex-direction:column;
  gap:7px;
}
.wr{
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:9px 10px;
  background:#F8FAFC;
  border:1px solid var(--line);
  border-radius:4px;
}
.wr .n{
  width:24px;
  height:24px;
  display:grid;
  place-items:center;
  flex:none;
  color:var(--color-on-primary);
  background:var(--blue);
  border-radius:3px;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:700;
}
.wr b{
  display:block;
  font-size:12px;
  font-weight:700;
}
.wr small{
  display:block;
  margin-top:2px;
  color:var(--muted);
  font-size:11px;
}
.root-cause{
  border-left-color:var(--ok);
  background:#F0FDF4;
}
.root-cause b{color:#166534}
.risk{
  display:flex;
  flex-direction:column;
  gap:13px;
}
.rz b{
  display:flex;
  justify-content:space-between;
  gap:12px;
  font-size:12px;
  font-weight:600;
}
.rz b span{
  color:var(--blue);
  font-family:"Fira Code",monospace;
}
.rz .pb{
  height:8px;
  margin-top:6px;
  overflow:hidden;
  background:var(--color-muted);
  border-radius:2px;
}
.rz .pb i{
  display:block;
  height:100%;
  background:var(--blue);
  border-right:3px solid #1E3A8A;
}
.capa{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.cc{
  display:flex;
  align-items:center;
  gap:11px;
  min-height:64px;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:5px;
  transition:border-color .2s ease,background-color .2s ease;
}
.cc:hover{
  background:#F8FAFC;
  border-color:#93C5FD;
}
.cc .bx{
  width:30px;
  height:30px;
  display:grid;
  place-items:center;
  flex:none;
  color:#FFF;
  border-radius:4px;
}
.cc .bx.done{background:var(--ok)}
.cc .bx.prog{background:var(--blue)}
.cc b{
  display:block;
  font-size:12px;
  font-weight:700;
}
.cc small{
  display:block;
  margin-top:2px;
  color:var(--muted);
  font-size:11px;
}
.cc .st{margin-left:auto}
.trace{
  position:relative;
  padding-left:25px;
}
.trace::before{
  content:"";
  position:absolute;
  top:5px;
  bottom:7px;
  left:7px;
  width:2px;
  background:#BFDBFE;
}
.ti{
  position:relative;
  padding:0 0 18px 7px;
}
.ti:last-child{padding-bottom:0}
.ti::before{
  content:"";
  position:absolute;
  top:3px;
  left:-23px;
  width:12px;
  height:12px;
  background:#FFF;
  border:3px solid var(--blue);
  border-radius:50%;
}
.ti .tt{
  font-size:12px;
  font-weight:700;
}
.ti small{
  display:block;
  margin-top:2px;
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:10px;
}
.grid-item{
  animation:enter .4s cubic-bezier(.2,.8,.2,1) both;
}
.grid-item:nth-child(2){animation-delay:.06s}
.grid-item:nth-child(3){animation-delay:.12s}
.grid-item:nth-child(4){animation-delay:.18s}
@keyframes enter{
  from{opacity:0;transform:translateY(12px) scale(.98)}
  to{opacity:1;transform:none}
}
@media(max-width:1024px){
  .top{align-items:flex-start;flex-direction:column;padding:10px 18px}
  .brand{min-width:0}
  .nav{width:100%;margin-left:0}
  .g2{grid-template-columns:1.15fr .85fr}
}
@media(max-width:768px){
  .wrap{padding:18px 16px 32px}
  .vh{align-items:flex-start;flex-direction:column}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .g2,.g11{grid-template-columns:1fr}
}
@media(max-width:480px){
  .top{padding:9px 12px}
  .brand b{font-size:14px}
  .nav button{min-width:42px;justify-content:center;padding:9px}
  .nav button span:last-child{display:none}
  .wrap{padding:14px 12px 28px}
  .kpis{gap:8px}
  .kpi{min-height:105px;padding:13px 12px}
  .kpi .v{font-size:21px}
  .card{padding:13px}
  .live{width:100%;justify-content:center}
  .cc{align-items:flex-start;flex-wrap:wrap}
  .cc .st{margin-left:41px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  .grid-item{opacity:1;transform:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">QA</div>
    <div>
      <b>產品不良原因分析平台</b>
      <small>QUALITY ROOT-CAUSE LAB</small>
    </div>
  </div>
  <nav class="nav" id="nav" aria-label="主要功能"></nav>
</header>

<main class="wrap">
  <div class="vh">
    <div>
      <h1 id="vt">品質戰情</h1>
      <p id="vd"></p>
    </div>
    <div class="live">本月 NCR 28 · 關案 24</div>
  </div>
  <div id="view" aria-live="polite"></div>
</main>

<script>
const MOD=[
  ["品質戰情","monitoring","品質戰情","NCR、不良趨勢與追因效率全局視圖"],
  ["NCR 異常單","assignment_late","NCR 異常單","品質異常立案、分派與狀態追蹤"],
  ["批次隔離","block","批次隔離","不良批次隔離、放行與影響範圍控管"],
  ["根因分析","account_tree","根因分析","魚骨圖與 5-Why 結構化追因"],
  ["AI 風險因子","psychology","AI 風險因子","AI 排序高風險製程與參數因子"],
  ["改善驗證","verified","改善驗證 CAPA","改善措施、驗證與有效性追蹤"],
  ["批號追溯","travel_explore","批號追溯","正逆向批號追溯與影響擴散分析"]
];

const nav=document.getElementById("nav");
const view=document.getElementById("view");
const vt=document.getElementById("vt");
const vd=document.getElementById("vd");
let charts=[];

MOD.forEach((m,i)=>{
  const b=document.createElement("button");
  b.type="button";
  b.dataset.i=i;
  b.className=i===0?"on":"";
  b.setAttribute("aria-current",i===0?"page":"false");
  b.setAttribute("aria-label",m[0]);
  b.innerHTML='<span class="material-symbols-outlined" aria-hidden="true">'+m[1]+'</span><span>'+m[0]+'</span>';
  b.addEventListener("click",()=>{
    if(location.hash!=="#v"+i){location.hash="v"+i}
    else{show(i)}
  });
  nav.appendChild(b);
});

const NCR=[
  ["NCR-3312","電鍍層剝離","衝壓件 A","高","根因分析","t-prog","王品保"],
  ["NCR-3311","尺寸超差 +0.08","齒輪 B","中","批次隔離","t-hold","陳品保"],
  ["NCR-3310","焊點空洞","控制板 C","高","改善驗證","t-prog","黃品保"],
  ["NCR-3308","表面刮傷","外殼 D","低","已關案","t-done","李品保"],
  ["NCR-3307","漏鎖螺絲","模組 E","中","已關案","t-done","王品保"]
];
const HOLD=[
  ["LOT-A2208","衝壓件 A · 2,400 pcs","隔離中 · 待判定","",0],
  ["LOT-B1904","齒輪 B · 1,200 pcs","隔離中 · 重工評估","",0],
  ["LOT-C7781","控制板 C · 800 pcs","部分放行 640","rel",1],
  ["LOT-D5520","外殼 D · 3,000 pcs","已放行","rel",1]
];
const WHY=[
  ["為何電鍍層剝離？","前處理除油不完全，附著力不足"],
  ["為何除油不完全？","脫脂槽濃度低於標準下限"],
  ["為何濃度偏低？","補液週期過長、未即時監控"],
  ["為何未即時監控？","濃度靠人工每班量測，易遺漏"],
  ["為何靠人工？","缺乏線上濃度感測與自動補液"]
];
const RISK=[
  ["前處理脫脂槽濃度",86],
  ["電鍍電流密度",71],
  ["槽液溫度",58],
  ["掛具接觸電阻",44],
  ["環境濕度",29]
];
const CAPA=[
  ["脫脂槽加裝線上濃度感測","done","已上線，異常自動補液"],
  ["修訂補液 SOP 與監控頻率","done","改為每 2 小時量測"],
  ["首件附著力測試強化","prog","導入膠帶剝離測試"],
  ["效果驗證（連續 5 批）","prog","已驗證 3 批，剝離率 0%"]
];
const TRACE=[
  ["原料進料 RM-CU08","2026-08-05 · 佳金屬 · 批號 CU-2208"],
  ["前處理脫脂","2026-08-08 · 脫脂線 2 · 濃度異常時段"],
  ["電鍍加工 LOT-A2208","2026-08-09 · 電鍍線 A · 影響 2,400 pcs"],
  ["入庫與出貨","2026-08-10 · 出貨 3 客戶 · 已發預警通知"],
  ["客訴回饋","2026-08-11 · 客戶 B 反映剝離 · 觸發 NCR-3312"]
];

const SCREENS=[
()=>`<div class="kpis">
  <div class="kpi grid-item"><span class="material-symbols-outlined ic" aria-hidden="true">timer</span><div class="l">批號追溯時間</div><div class="v">15<small>分</small></div><div class="d up">▼ 較 3 天</div></div>
  <div class="kpi grid-item"><span class="material-symbols-outlined ic" aria-hidden="true">event_available</span><div class="l">客訴平均關案</div><div class="v">9<small>天</small></div><div class="d up">▼ 較 21 天</div></div>
  <div class="kpi grid-item"><span class="material-symbols-outlined ic" aria-hidden="true">replay</span><div class="l">重複不良率</div><div class="v">2.1<small>%</small></div><div class="d up">▼ 較 6.4%</div></div>
  <div class="kpi grid-item"><span class="material-symbols-outlined ic" aria-hidden="true">verified</span><div class="l">改善驗證率</div><div class="v">98<small>%</small></div><div class="d up">▲ CAPA 有效</div></div>
</div>
<div class="grid g2">
  <section class="card grid-item"><h2><span class="material-symbols-outlined" aria-hidden="true">stacked_bar_chart</span>不良類型與趨勢</h2><div class="chart" id="c_tr" role="img" aria-label="三月至八月不良類型與重複不良率趨勢圖"></div></section>
  <section class="card grid-item"><h2><span class="material-symbols-outlined" aria-hidden="true">pending_actions</span>待處理 NCR</h2>${NCR.filter(n=>n[4]!=="已關案").map(n=>`<div class="qz"><b><code>${n[0]}</code> · ${n[1]}</b><small>${n[2]} · ${n[6]} · <span class="tag ${n[5]}">${n[4]}</span></small></div>`).join("")}</section>
</div>`,

()=>`<section class="card grid-item"><h2><span class="material-symbols-outlined" aria-hidden="true">assignment_late</span>NCR 品質異常單 <span class="tag t-open" style="margin-left:auto">開立中 3</span></h2><div class="scroll"><table class="data"><thead><tr><th>單號</th><th>異常</th><th>產品</th><th>等級</th><th>負責</th><th>狀態</th></tr></thead><tbody>${NCR.map(n=>`<tr><td>${n[0]}</td><td>${n[1]}</td><td>${n[2]}</td><td><span class="tag ${n[3]==="高"?"t-open":n[3]==="中"?"t-hold":"t-prog"}">${n[3]}</span></td><td>${n[6]}</td><td><span class="tag ${n[5]}">${n[4]}</span></td></tr>`).join("")}</tbody></table></div></section>`,

()=>`<section class="card grid-item"><h2><span class="material-symbols-outlined" aria-hidden="true">block</span>不良批次隔離</h2><div class="hold">${HOLD.map(h=>`<div class="hc ${h[3]}"><b>${h[0]}</b><small>${h[1]}</small><small><span class="tag ${h[4]?"t-done":"t-open"}">${h[2]}</span></small></div>`).join("")}</div><p class="note">隔離批次自動鎖定出貨，放行需品保主管覆核。</p></section>`,

()=>`<div class="g11 grid"><section class="card grid-item"><h2><span class="material-symbols-outlined" aria-hidden="true">account_tree</span>魚骨圖 · NCR-3312 電鍍層剝離</h2>${fishSVG()}</section><section class="card grid-item"><h2><span class="material-symbols-outlined" aria-hidden="true">psychology_alt</span>5-Why 結構化追因</h2><div class="why">${WHY.map((w,i)=>`<div class="wr"><span class="n">${i+1}</span><div><b>${w[0]}</b><small>${w[1]}</small></div></div>`).join("")}<div class="qz root-cause"><b>根本原因</b><small>缺乏線上濃度感測與自動補液，脫脂槽濃度失控導致附著力不足。</small></div></div></section></div>`,

()=>`<div class="grid g2"><section class="card grid-item"><h2><span class="material-symbols-outlined" aria-hidden="true">psychology</span>AI 高風險製程因子（依關聯度排序）</h2><div class="risk">${RISK.map(r=>`<div class="rz"><b>${r[0]}<span>${r[1]}%</span></b><div class="pb" role="progressbar" aria-label="${r[0]}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${r[1]}"><i style="width:${r[1]}%"></i></div></div>`).join("")}</div><p class="note">AI 分析近 6 個月不良與製程參數關聯，脫脂槽濃度為最高風險因子。</p></section><section class="card grid-item"><h2><span class="material-symbols-outlined" aria-hidden="true">scatter_plot</span>參數 vs 不良率關聯</h2><div class="chart" style="height:270px" id="c_sc" role="img" aria-label="脫脂濃度與不良率關聯散佈圖"></div></section></div>`,

()=>`<section class="card grid-item"><h2><span class="material-symbols-outlined" aria-hidden="true">verified</span>改善措施 CAPA 與驗證</h2><div class="capa">${CAPA.map(c=>{const done=c[1]==="done";return `<div class="cc"><div class="bx ${done?"done":"prog"}"><span class="material-symbols-outlined" aria-hidden="true">${done?"check":"sync"}</span></div><div><b>${c[0]}</b><small>${c[2]}</small></div><span class="st tag ${done?"t-done":"t-prog"}">${done?"已完成":"驗證中"}</span></div>`}).join("")}</div></section>`,

()=>`<section class="card grid-item"><h2><span class="material-symbols-outlined" aria-hidden="true">travel_explore</span>批號追溯 · LOT-A2208 影響擴散</h2><div class="trace">${TRACE.map(t=>`<div class="ti"><div class="tt">${t[0]}</div><small>${t[1]}</small></div>`).join("")}</div></section>`
];

function fishSVG(){
  const branches=[
    ["人 Man",70,55,1,"量測遺漏"],
    ["機 Machine",160,55,1,"無線上感測"],
    ["料 Material",250,55,1,"脫脂濃度低"],
    ["法 Method",70,175,0,"補液週期長"],
    ["環 Environment",160,175,0,"槽溫波動"],
    ["量測 Measure",250,175,0,"人工判讀"]
  ];
  return `<svg viewBox="0 0 460 230" class="fish" role="img" aria-labelledby="fishTitle fishDesc"><title id="fishTitle">NCR-3312 電鍍層剝離魚骨圖</title><desc id="fishDesc">從人、機、料、法、環境與量測六個面向分析電鍍層剝離原因。</desc><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#2563EB"/></marker></defs>
  <line x1="20" y1="115" x2="400" y2="115" stroke="#2563EB" stroke-width="3" marker-end="url(#ah)"/>
  <rect x="398" y="95" width="58" height="40" rx="4" fill="#2563EB"/>
  <text x="427" y="112" fill="#FFFFFF" font-size="10" text-anchor="middle">電鍍層</text>
  <text x="427" y="126" fill="#FFFFFF" font-size="10" text-anchor="middle">剝離</text>
  ${branches.map(b=>`<line x1="${b[1]}" y1="${b[2]+(b[3]?8:-8)}" x2="${b[1]+30}" y2="115" stroke="#93C5FD" stroke-width="2"/><text x="${b[1]}" y="${b[2]}" fill="#1D4ED8" font-size="11" font-weight="700" text-anchor="middle">${b[0]}</text><text x="${b[1]}" y="${b[3]?72:192}" fill="#475569" font-size="9" text-anchor="middle">${b[4]}</text>`).join("")}
  </svg>`;
}

function chartTheme(){
  return {
    textStyle:{fontFamily:"Fira Sans",color:"#475569"},
    grid:{left:42,right:14,top:32,bottom:27},
    tooltip:{
      trigger:"axis",
      backgroundColor:"#FFFFFF",
      borderColor:"#CBD5E1",
      textStyle:{color:"#1E293B",fontSize:11}
    },
    legend:{top:0,textStyle:{fontSize:10,color:"#475569"}},
    xAxis:{
      axisLine:{lineStyle:{color:"#CBD5E1"}},
      axisTick:{show:false},
      axisLabel:{fontSize:10,color:"#475569"}
    },
    yAxis:{
      splitLine:{lineStyle:{color:"#E2E8F0",type:"dashed"}},
      axisLabel:{fontSize:10,color:"#475569"}
    }
  };
}

function draw(i){
  charts.forEach(c=>c.dispose());
  charts=[];
  if(i===0){
    const c=echarts.init(document.getElementById("c_tr"));
    const base=chartTheme();
    c.setOption({
      ...base,
      xAxis:{...base.xAxis,type:"category",data:["3月","4月","5月","6月","7月","8月"]},
      yAxis:{...base.yAxis,type:"value"},
      series:[
        {name:"電鍍",type:"bar",stack:"x",data:[12,10,9,7,6,5],itemStyle:{color:"#2563EB"}},
        {name:"尺寸",type:"bar",stack:"x",data:[8,9,7,6,6,5],itemStyle:{color:"#60A5FA"}},
        {name:"外觀",type:"bar",stack:"x",data:[6,5,6,4,4,3],itemStyle:{color:"#BFDBFE"}},
        {name:"重複不良率%",type:"line",data:[6.4,5.5,4.8,3.6,2.9,2.1],lineStyle:{color:"#DC2626",width:3},itemStyle:{color:"#DC2626"},symbol:"circle",symbolSize:7}
      ]
    });
    charts.push(c);
  }
  if(i===4){
    const c=echarts.init(document.getElementById("c_sc"));
    const base=chartTheme();
    c.setOption({
      ...base,
      grid:{left:46,right:18,top:20,bottom:38},
      legend:{show:false},
      xAxis:{...base.xAxis,type:"value",name:"脫脂濃度",nameTextStyle:{fontSize:10,color:"#475569"}},
      yAxis:{...base.yAxis,type:"value",name:"不良率%",nameTextStyle:{fontSize:10,color:"#475569"}},
      series:[
        {name:"觀測值",type:"scatter",symbolSize:11,data:[[92,.4],[88,.6],[80,1.2],[74,2.1],[68,3.4],[62,4.9],[58,6.1],[95,.3]],itemStyle:{color:"#2563EB",borderColor:"#1E3A8A",borderWidth:1}},
        {name:"趨勢",type:"line",data:[[58,6.1],[95,.3]],lineStyle:{color:"#DC2626",type:"dashed",width:2},symbol:"none"}
      ]
    });
    charts.push(c);
  }
}

function show(i){
  nav.querySelectorAll("button").forEach(b=>{
    const active=Number(b.dataset.i)===i;
    b.classList.toggle("on",active);
    b.setAttribute("aria-current",active?"page":"false");
  });
  vt.textContent=MOD[i][2];
  vd.textContent=MOD[i][3];
  view.innerHTML=SCREENS[i]();
  draw(i);
}

function fromHash(){
  const match=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  const count=document.querySelectorAll("[data-i]").length||7;
  const index=match?Math.min(Number(match[1]),count-1):0;
  show(index);
  try{window.scrollTo(0,0)}catch(error){}
}

window.addEventListener("hashchange",fromHash);
window.addEventListener("resize",()=>charts.forEach(c=>c.resize()));
fromHash();
</script>
