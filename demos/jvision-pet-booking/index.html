<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>寵物服務預約｜Jvision 系統 Demo</title>
<meta name="description" content="把日常作業收斂成可操作、可追蹤的營運中樞" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#334155; --accent2:#64748b; --bg:#f1f5f9; --panel:#ffffff;
  --line:#e2e8f0; --ink:#1e293b; --muted:#64748b; --soft:#94a3b8;
  --ok:#0d9488; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
  --chip:#f8fafc;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.layout{display:flex;min-height:100vh;align-items:stretch;}
/* sidebar */
.sidebar{
  width:236px;flex:none;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:20px 16px;gap:6px;position:sticky;top:0;height:100vh;min-width:0;
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 6px 16px;}
.brand .logo{
  width:42px;height:42px;border-radius:13px;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 6px 16px rgba(51,65,85,.28);
}
.brand .logo .material-symbols-outlined{font-size:24px}
.brand b{font-size:15px;font-weight:800;letter-spacing:.3px;display:block;color:var(--ink)}
.brand span{font-size:11px;color:var(--muted);letter-spacing:1.5px;font-weight:600}
.navlabel{font-size:10.5px;color:var(--soft);font-weight:700;letter-spacing:1.5px;padding:10px 8px 4px}
.nav{display:flex;flex-direction:column;gap:4px;min-width:0}
.navbtn{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;
  border:1px solid transparent;background:transparent;cursor:pointer;text-align:left;
  color:var(--muted);font-family:inherit;font-size:13.5px;font-weight:600;width:100%;min-width:0;transition:.15s;
}
.navbtn .material-symbols-outlined{font-size:21px;flex:none}
.navbtn .nb-t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navbtn:hover{background:var(--chip);color:var(--ink)}
.navbtn.on{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 6px 16px rgba(51,65,85,.22)}
.side-foot{margin-top:auto;padding:14px 8px 2px;border-top:1px solid var(--line);font-size:11px;color:var(--soft);line-height:1.7}
.side-foot b{color:var(--accent2)}
/* main */
.main{flex:1;min-width:0;padding:26px 30px 48px;max-width:100%}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.topbar h1{font-size:22px;font-weight:800;margin:0 0 4px;letter-spacing:.3px}
.topbar .sub{color:var(--muted);font-size:13px;margin:0}
.tb-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:12px;font-weight:600;color:var(--muted)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(13,148,136,.16);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.pill.acc{background:var(--accent);color:#fff;border-color:var(--accent)}
/* generic */
.grid{display:grid;gap:16px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:1.7fr 1fr}
.g32{grid-template-columns:1fr 1.5fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.card.pad0{padding:0;overflow:hidden}
.card h3{margin:0 0 3px;font-size:14.5px;font-weight:700}
.card .ch-sub{color:var(--muted);font-size:12px;margin:0 0 14px}
.ch-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.ch-head h3{margin:0}
.ch-head .ch-sub{margin:2px 0 0}
/* kpi */
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 17px;min-width:0;position:relative;overflow:hidden}
.kpi .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.kpi .ic .material-symbols-outlined{font-size:21px}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:600}
.kpi .val{font-size:26px;font-weight:800;letter-spacing:.5px;margin:3px 0 2px;line-height:1.1}
.kpi .val small{font-size:13px;font-weight:600;color:var(--muted)}
.kpi .delta{font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.kpi .delta .material-symbols-outlined{font-size:15px}
.up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--muted)}
.bl{background:#eef2f6;color:var(--accent)} .bg{background:#e6f6f3;color:var(--ok)}
.bo{background:#fdf1e3;color:var(--warn)} .bp{background:#eef2ff;color:var(--info)} .br{background:#fdecec;color:var(--bad)}
/* table */
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
thead th{text-align:left;font-size:11px;color:var(--soft);font-weight:700;letter-spacing:.6px;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--chip)}
tbody td{padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--chip)}
.tw{overflow-x:auto;border-radius:12px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.t-ok{background:#e6f6f3;color:#0f766e}.t-warn{background:#fdf1e3;color:#b45309}.t-bad{background:#fdecec;color:#b91c1c}
.t-info{background:#eef2ff;color:#1d4ed8}.t-mut{background:#eef2f6;color:#475569}
.av{width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.who{display:flex;align-items:center;gap:9px;min-width:0}
.who .nm{font-weight:700;font-size:13px}.who .sm{font-size:11px;color:var(--muted)}
.bar{height:7px;border-radius:6px;background:#e6eaf0;overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
/* board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;min-width:0}
.col{background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0;display:flex;flex-direction:column;gap:10px}
.col-h{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;padding:2px 4px}
.col-h .cnt{font-size:11px;font-weight:700;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.ticket{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;min-width:0;border-left:3px solid var(--accent2)}
.ticket.hi{border-left-color:var(--bad)}.ticket.md{border-left-color:var(--warn)}.ticket.lo{border-left-color:var(--ok)}
.ticket .tk-t{font-size:13px;font-weight:700;margin-bottom:3px}
.ticket .tk-m{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.ticket .tk-f{display:flex;align-items:center;justify-content:space-between;margin-top:9px;gap:8px}
/* schedule / calendar */
.sched{min-width:720px}
.sched-grid{display:grid;grid-template-columns:64px repeat(6,1fr);gap:0;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.sg-cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:52px;padding:4px;position:relative}
.sg-time{font-size:11px;color:var(--soft);font-weight:600;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 8px;text-align:right}
.sg-head{font-size:12px;font-weight:700;text-align:center;padding:9px 4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--chip)}
.sg-head small{display:block;font-size:10px;color:var(--muted);font-weight:600}
.ev{border-radius:8px;padding:5px 7px;font-size:11px;font-weight:700;line-height:1.3;margin-bottom:3px;color:#fff}
.ev small{display:block;font-weight:600;opacity:.9;font-size:10px}
.e-groom{background:#7c8aa5}.e-hotel{background:#334155}.e-course{background:#5b8a72}.e-daycare{background:#a06a4e}
/* profile */
.petcard{background:linear-gradient(135deg,#334155,#475569);color:#fff;border-radius:18px;padding:20px;min-width:0}
.petcard .pt-top{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.petcard .pt-ph{width:58px;height:58px;border-radius:16px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:none}
.petcard .pt-ph .material-symbols-outlined{font-size:32px}
.petcard .pt-nm{font-size:19px;font-weight:800}
.petcard .pt-sub{font-size:12px;opacity:.85}
.petcard .pt-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.petcard .ps{background:rgba(255,255,255,.1);border-radius:11px;padding:9px 10px;min-width:0}
.petcard .ps b{font-size:16px;font-weight:800;display:block}
.petcard .ps span{font-size:10.5px;opacity:.8}
.info-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13px}
.info-row:last-child{border-bottom:0}
.info-row .material-symbols-outlined{font-size:19px;color:var(--accent2);flex:none}
.info-row .k{color:var(--muted);width:44px;flex:none;font-size:12px}
.info-row .v{font-weight:600;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--ink)}
.chip.warn{background:#fdf1e3;border-color:#f4d9b0;color:#b45309}
/* timeline */
.tl{position:relative;padding-left:22px;min-width:0}
.tl:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 18px 8px}
.tl-item:last-child{padding-bottom:0}
.tl-item:before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:#fff;border:2.5px solid var(--accent2)}
.tl-item.done:before{background:var(--accent);border-color:var(--accent)}
.tl-item.now:before{background:var(--ok);border-color:var(--ok);box-shadow:0 0 0 4px rgba(13,148,136,.18)}
.tl-tm{font-size:11px;color:var(--soft);font-weight:700}
.tl-t{font-size:13.5px;font-weight:700;margin:1px 0 2px}
.tl-d{font-size:12px;color:var(--muted)}
/* rooms */
.rooms{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0}
.room{border:1px solid var(--line);border-radius:14px;padding:13px;min-width:0;background:#fff;position:relative}
.room.occ{background:linear-gradient(180deg,#f8fafc,#eef2f6);border-color:#cbd5e1}
.room.empty{border-style:dashed;background:var(--chip)}
.room .r-no{font-size:11px;font-weight:700;color:var(--soft);letter-spacing:1px}
.room .r-pet{font-size:15px;font-weight:800;margin:3px 0 1px;display:flex;align-items:center;gap:6px}
.room .r-pet .material-symbols-outlined{font-size:19px;color:var(--accent2)}
.room .r-sub{font-size:11.5px;color:var(--muted)}
.room .r-day{margin-top:9px;font-size:11px;font-weight:700;color:var(--accent);display:flex;align-items:center;justify-content:space-between}
.room .r-empty{color:var(--soft);font-size:13px;font-weight:600;padding:10px 0;text-align:center}
/* notify feed */
.feed{display:flex;flex-direction:column;gap:0;min-width:0}
.feed-item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.feed-item:last-child{border-bottom:0}
.feed-ic{width:38px;height:38px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center}
.feed-ic .material-symbols-outlined{font-size:20px}
.feed-b{min-width:0;flex:1}
.feed-b .ft{font-size:13.5px;font-weight:700}
.feed-b .fd{font-size:12px;color:var(--muted)}
.feed-b .fm{font-size:11px;color:var(--soft);margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* legend */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.mini{font-size:11px;color:var(--muted);font-weight:600}
.hl-num{font-weight:800;color:var(--accent)}
.progress-list{display:flex;flex-direction:column;gap:13px}
.pl-row{display:grid;grid-template-columns:96px 1fr 44px;gap:10px;align-items:center;min-width:0}
.pl-row .pl-n{font-size:12.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-row .pl-v{font-size:12px;font-weight:700;text-align:right}
.chartbox{min-width:0}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
/* responsive */
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.rooms{grid-template-columns:repeat(2,1fr)}.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
  .layout{flex-direction:column}
  .sidebar{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 14px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0 8px 0 0;margin-right:auto}
  .navlabel,.side-foot{display:none}
  .nav{flex-direction:row;flex-wrap:wrap;gap:6px;width:auto}
  .navbtn{width:auto;padding:8px 12px}
  .main{padding:20px 18px 40px}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .rooms,.board{grid-template-columns:1fr}
}
@media(max-width:560px){
  .navbtn .nb-t{display:none}
  .navbtn{padding:8px 10px}
  .topbar h1{font-size:19px}
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">pets</span></div>
      <div><b>毛日子</b><span>PET BOOKING</span></div>
    </div>
    <div class="navlabel">營運模組</div>
    <div class="nav" id="nav"></div>
    <div class="side-foot">門市：<b>信義旗艦店</b><br/>值班店長：陳沛妤<br/>版本 v3.4 · Demo</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="scr-title">預約排程</h1>
        <p class="sub" id="scr-sub">旅館、美容、課程檔期預約與衝突偵測</p>
      </div>
      <div class="tb-right">
        <span class="pill"><span class="dot"></span>即時同步</span>
        <span class="pill">2026/08/13 週四</span>
        <span class="pill acc"><span class="material-symbols-outlined" style="font-size:16px">store</span>信義旗艦店</span>
      </div>
    </div>
    <div id="screen"></div>
  </main>
</div>

<script>
/* ============ shared helpers ============ */
var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function initials(nm){nm=String(nm||"?");return nm.slice(0,2);}

var MODULES=[
  {icon:"event_available",name:"預約排程",desc:"旅館、美容、課程檔期預約與衝突偵測"},
  {icon:"pets",name:"毛孩檔案",desc:"寵物基本資料、健康註記與行為偏好"},
  {icon:"content_cut",name:"服務派工",desc:"美容師與照護人員的服務指派看板"},
  {icon:"hotel",name:"入住管理",desc:"旅館房位、住宿天數與退房結帳"},
  {icon:"notifications_active",name:"照護通知",desc:"餵食、散步、拍照回報與飼主通知"},
  {icon:"storefront",name:"營收分析",desc:"服務營收、加購商品與門市成效洞察"}
];

/* ============ nav ============ */
(function(){
  var nav=document.getElementById("nav"),h="";
  for(var i=0;i<MODULES.length;i++){
    h+='<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+MODULES[i].icon+'</span><span class="nb-t">'+MODULES[i].name+'</span></button>';
  }
  nav.innerHTML=h;
  nav.addEventListener("click",function(e){
    var b=e.target.closest("[data-i]");if(!b)return;
    show(+b.getAttribute("data-i"));
    try{location.hash="v"+b.getAttribute("data-i");}catch(x){}
  });
})();

/* ============ KPI helper ============ */
function kpi(cls,ic,lab,val,unit,delta,dir){
  var arrow=dir==="up"?"trending_up":dir==="down"?"trending_down":"trending_flat";
  return '<div class="kpi"><div class="ic '+cls+'"><span class="material-symbols-outlined">'+ic+'</span></div>'+
    '<div class="lab">'+lab+'</div><div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div>'+
    '<div class="delta '+dir+'"><span class="material-symbols-outlined">'+arrow+'</span>'+delta+'</div></div>';
}

/* ============ SCREEN 0 : 預約排程 (calendar signature) ============ */
function v0(){
  var kpis=kpi("bl","event","今日預約","38","筆","比昨日 +6","up")+
    kpi("bo","warning","檔期衝突","2","筆","需人工調整","down")+
    kpi("bg","how_to_reg","已報到","21","/38","報到率 55%","up")+
    kpi("bp","hourglass_top","待確認","5","筆","逾 2 小時未回","flat");

  var times=["10:00","11:00","13:00","14:00","15:00","16:00"];
  var days=[["週一","08/11"],["週二","08/12"],["週三","08/13"],["週四","08/14"],["週五","08/15"],["週六","08/16"]];
  var EV={
    "10:00|2":[{c:"e-hotel",t:"入住 · Money",s:"貴賓犬"}],
    "10:00|5":[{c:"e-course",t:"幼犬社會化",s:"6 隻 · 團體"}],
    "11:00|2":[{c:"e-groom",t:"洗澡美容 · 布丁",s:"柯基 · 王師傅"}],
    "11:00|3":[{c:"e-groom",t:"精緻剪毛 · 奶茶",s:"馬爾濟斯"}],
    "13:00|1":[{c:"e-daycare",t:"安親日托 · 黑豆",s:"米克斯"}],
    "13:00|4":[{c:"e-hotel",t:"入住 · 咪咪",s:"英短貓"}],
    "14:00|2":[{c:"e-groom",t:"SPA 護膚 · 麻糬",s:"比熊 · 林師傅"},{c:"e-course",t:"基礎服從",s:"1 對 1"}],
    "14:00|5":[{c:"e-groom",t:"指甲修剪 · 阿福",s:"臘腸"}],
    "15:00|3":[{c:"e-daycare",t:"安親日托 · 妹妹",s:"貴賓"}],
    "15:00|4":[{c:"e-course",t:"敏捷訓練",s:"4 隻"}],
    "16:00|2":[{c:"e-hotel",t:"退房結帳 · 可可",s:"柴犬"}],

function topRow(nm,cat,cnt,rev,pct){
  var cm={"美容":"t-info","住宿":"t-ok","日托":"t-warn","課程":"t-mut","商品":"t-mut"};
  return '<tr><td style="font-weight:600">'+esc(nm)+'</td><td><span class="tag '+(cm[cat]||"t-mut")+'">'+cat+'</span></td>'+
    '<td>'+cnt+'</td><td style="font-weight:700">$'+rev+'</td>'+
    '<td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="min-width:54px"><i style="width:'+(pct*3)+'%"></i></div><span class="mini">'+pct+'%</span></div></td></tr>';
}

/* ============ router ============ */
var RENDER=[v0,v1,v2,v3,v4,v5];
function show(i){
  i=Math.max(0,Math.min(i,RENDER.length-1));
  killCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  document.getElementById("scr-title").textContent=MODULES[i].name;
  document.getElementById("scr-sub").textContent=MODULES[i].desc;
  RENDER[i]();
}
show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
