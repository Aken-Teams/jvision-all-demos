<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>寵物服務預約｜Jvision 系統 Demo</title>
<meta name="description" content="把日常作業收斂成可操作、可追蹤的營運中樞" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000000;
  --color-secondary:#10b981;
  --color-on-secondary:#0f172a;
  --color-accent:#ea580c;
  --color-on-accent:#000000;
  --color-background:#ecfdf5;
  --color-foreground:#064e3b;
  --color-card:#ffffff;
  --color-card-foreground:#064e3b;
  --color-muted:#e8f1f3;
  --color-muted-foreground:#475569;
  --color-border:#a7f3d0;
  --color-destructive:#dc2626;
  --color-on-destructive:#ffffff;
  --color-ring:#059669;
  --blue:#059669;
  --ink:#064e3b;
  --muted:#475569;
  --line:#a7f3d0;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --soft:#526b67;
  --ok:#047857;
  --warn:#b45309;
  --bad:#b91c1c;
  --info:#075985;
  --chip:#f0fdfa;
  --shadow:8px 8px 0 #064e3b;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
html,body{margin:0;padding:0}
body{
  background:
    linear-gradient(rgba(5,150,105,.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(5,150,105,.07) 1px,transparent 1px),
    var(--bg);
  background-size:32px 32px;
  color:var(--ink);
  font:14px/1.55 "Inter",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,a,[role="button"]{cursor:pointer}
button{font:inherit}
button:focus-visible,[tabindex]:focus-visible{
  outline:4px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:500;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
.layout{display:flex;min-height:100vh}
.sidebar{
  width:252px;
  min-width:0;
  flex:none;
  position:sticky;
  top:0;
  height:100vh;
  z-index:10;
  display:flex;
  flex-direction:column;
  gap:14px;
  padding:22px 16px;
  background:#fff;
  border-right:3px solid var(--ink);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:3px 3px 20px;
  border-bottom:3px solid var(--ink);
}
.logo{
  width:48px;
  height:48px;
  flex:none;
  display:grid;
  place-items:center;
  color:#000;
  background:var(--color-secondary);
  border:3px solid var(--ink);
  box-shadow:4px 4px 0 var(--ink);
}
.logo .material-symbols-outlined{font-size:27px}
.brand b{
  display:block;
  font-size:18px;
  font-weight:900;
  letter-spacing:-.04em;
}
.brand span:not(.material-symbols-outlined){
  display:block;
  margin-top:1px;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  letter-spacing:.14em;
}
.navlabel{
  padding:3px 5px 0;
  color:var(--muted);
  font-size:10px;
  font-weight:900;
  letter-spacing:.15em;
  text-transform:uppercase;
}
.nav{display:flex;flex-direction:column;gap:7px}
.navbtn{
  width:100%;
  min-width:0;
  display:flex;
  align-items:center;
  gap:11px;
  padding:11px 12px;
  color:var(--ink);
  text-align:left;
  background:#fff;
  border:2px solid var(--ink);
  border-radius:0;
  font-size:13px;
  font-weight:800;
  box-shadow:3px 3px 0 transparent;
  transition:background-color .18s ease,color .18s ease,box-shadow .18s ease,transform .18s ease;
}
.navbtn:hover{background:var(--chip);box-shadow:3px 3px 0 var(--ink);transform:translate(-1px,-1px)}
.navbtn.on{
  color:#000;
  background:var(--color-secondary);
  box-shadow:4px 4px 0 var(--ink);
  transform:translate(-2px,-2px);
}
.navbtn .material-symbols-outlined{font-size:21px;flex:none}
.nb-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot{
  margin-top:auto;
  padding:14px 6px 0;
  border-top:3px solid var(--ink);
  color:var(--muted);
  font-size:11px;
  line-height:1.8;
}
.side-foot b{color:var(--ink)}
.main{flex:1;min-width:0;padding:32px clamp(18px,3vw,42px) 56px}
.topbar{
  position:relative;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
  margin-bottom:28px;
  padding:22px 24px;
  background:var(--color-card);
  border:3px solid var(--ink);
  box-shadow:var(--shadow);
}
.topbar:before{
  content:"01 / 03";
  position:absolute;
  left:-3px;
  top:-18px;
  padding:2px 9px;
  color:#000;
  background:var(--color-accent);
  border:3px solid var(--ink);
  font-size:10px;
  font-weight:900;
  letter-spacing:.12em;
}
.topbar h1{
  margin:0 0 4px;
  font-size:clamp(24px,3vw,38px);
  line-height:1;
  font-weight:900;
  letter-spacing:-.055em;
}
.topbar .sub{max-width:600px;margin:0;color:var(--muted);font-size:13px}
.tb-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.pill{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:7px 10px;
  color:var(--ink);
  background:#fff;
  border:2px solid var(--ink);
  border-radius:0;
  font-size:11px;
  font-weight:800;
}
.pill.acc{color:#000;background:var(--color-accent)}
.dot{
  width:9px;
  height:9px;
  background:var(--ok);
  border:2px solid var(--ink);
  animation:pulse 2.2s steps(2,end) infinite;
}
@keyframes pulse{50%{opacity:.25}}
.grid{display:grid;gap:18px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.75fr) minmax(280px,1fr)}
.g32{grid-template-columns:minmax(280px,1fr) minmax(0,1.45fr)}
.card,.kpi{
  min-width:0;
  background:var(--panel);
  border:3px solid var(--ink);
  border-radius:0;
  box-shadow:5px 5px 0 rgba(6,78,59,.18);
}
.card{padding:19px}
.card.pad0{padding:0;overflow:hidden}
.card h3{margin:0 0 3px;font-size:15px;font-weight:900;letter-spacing:-.025em}
.card .ch-sub{margin:0 0 14px;color:var(--muted);font-size:12px}
.ch-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:15px}
.ch-head h3{margin:0}
.ch-head .ch-sub{margin:2px 0 0}
.kpi{
  position:relative;
  overflow:hidden;
  padding:16px;
}
.kpi:nth-child(2n){transform:translateY(7px)}
.kpi:after{
  content:"";
  position:absolute;
  right:-20px;
  bottom:-28px;
  width:72px;
  height:72px;
  background:var(--color-border);
  border:3px solid var(--ink);
  transform:rotate(22deg);
}
.kpi .ic{
  width:39px;
  height:39px;
  display:grid;
  place-items:center;
  margin-bottom:13px;
  border:2px solid var(--ink);
}
.kpi .ic .material-symbols-outlined{font-size:21px}
.kpi .lab{color:var(--muted);font-size:11px;font-weight:800}
.kpi .val{
  position:relative;
  z-index:1;
  margin:3px 0;
  font-size:27px;
  line-height:1.12;
  font-weight:900;
  letter-spacing:-.045em;
  font-variant-numeric:tabular-nums;
}
.kpi .val small{color:var(--muted);font-size:12px;font-weight:700}
.delta{
  position:relative;
  z-index:1;
  display:inline-flex;
  align-items:center;
  gap:3px;
  font-size:11px;
  font-weight:800;
}
.delta .material-symbols-outlined{font-size:15px}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
.bl{color:#064e3b;background:#d1fae5}
.bg{color:#064e3b;background:#a7f3d0}
.bo{color:#7c2d12;background:#ffedd5}
.bp{color:#075985;background:#e0f2fe}
.br{color:#991b1b;background:#fee2e2}
.tw{max-width:100%;overflow-x:auto;border:2px solid var(--ink)}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:13px}
thead th{
  padding:11px 13px;
  color:var(--ink);
  background:var(--color-border);
  border-right:1px solid var(--ink);
  border-bottom:3px solid var(--ink);
  text-align:left;
  white-space:nowrap;
  font-size:10px;
  font-weight:900;
  letter-spacing:.08em;
}
thead th:last-child{border-right:0}
tbody td{
  padding:12px 13px;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  white-space:nowrap;
}
tbody td:last-child{border-right:0}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#ecfdf5}
tbody td:nth-child(n+3){font-variant-numeric:tabular-nums}
tbody td[style*="font-weight:700"]{text-align:right}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:0;
  white-space:nowrap;
  font-size:10px;
  font-weight:900;
}
.t-ok{color:#065f46;background:#d1fae5}
.t-warn{color:#92400e;background:#fef3c7}
.t-bad{color:#991b1b;background:#fee2e2}
.t-info{color:#075985;background:#e0f2fe}
.t-mut{color:#334155;background:#e2e8f0}
.av{
  width:30px;
  height:30px;
  flex:none;
  display:inline-grid;
  place-items:center;
  color:#000;
  background:var(--color-secondary);
  border:2px solid var(--ink);
  font-size:11px;
  font-weight:900;
}
.bar{height:10px;min-width:70px;overflow:hidden;background:#dce8e5;border:1px solid var(--ink)}
.bar>i{display:block;height:100%;background:var(--accent)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:680px}
.col{
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:11px;
  background:var(--chip);
  border:2px solid var(--ink);
}
.col:nth-child(even){background:#fff7ed}
.col-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding-bottom:8px;
  border-bottom:2px solid var(--ink);
  font-size:12px;
  font-weight:900;
}
.cnt{
  padding:1px 7px;
  color:#000;
  background:var(--color-secondary);
  border:1px solid var(--ink);
  font-size:10px;
}
.ticket{
  min-width:0;
  padding:11px;
  background:#fff;
  border:2px solid var(--ink);
  border-left-width:7px;
  box-shadow:3px 3px 0 rgba(6,78,59,.15);
}
.ticket.hi{border-left-color:var(--bad)}
.ticket.md{border-left-color:var(--warn)}
.ticket.lo{border-left-color:var(--ok)}
.tk-t{margin-bottom:4px;font-size:12px;font-weight:900}
.tk-m{display:flex;align-items:center;gap:5px;flex-wrap:wrap;color:var(--muted);font-size:11px}
.tk-f{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.sched{min-width:720px}
.sched-grid{display:grid;grid-template-columns:64px repeat(6,1fr);border-top:2px solid var(--ink);border-left:2px solid var(--ink)}
.sg-cell,.sg-time,.sg-head{border-right:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.sg-cell{position:relative;min-height:57px;padding:4px}
.sg-time{
  padding:7px 8px;
  color:var(--muted);
  text-align:right;
  font:700 10px ui-monospace,SFMono-Regular,Consolas,monospace;
}
.sg-head{padding:8px 4px;background:var(--color-border);text-align:center;font-size:11px;font-weight:900}
.sg-head small{display:block;color:var(--muted);font:700 9px ui-monospace,SFMono-Regular,Consolas,monospace}
.ev{
  margin-bottom:3px;
  padding:6px 7px;
  color:#fff;
  border:1px solid #000;
  font-size:10px;
  font-weight:900;
  line-height:1.3;
}
.ev small{display:block;font-size:9px;font-weight:600}
.e-groom{background:#047857}.e-hotel{background:#064e3b}
.e-course{background:#0369a1}.e-daycare{background:#9a3412}
.petcard{
  min-width:0;
  padding:20px;
  color:#fff;
  background:var(--ink);
  border:3px solid #000;
  box-shadow:7px 7px 0 var(--color-secondary);
}
.pt-top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.pt-ph{
  width:58px;
  height:58px;
  flex:none;
  display:grid;
  place-items:center;
  color:#000;
  background:var(--color-secondary);
  border:3px solid #000;
}
.pt-ph .material-symbols-outlined{font-size:31px}
.pt-nm{font-size:20px;font-weight:900}
.pt-sub{font-size:12px;color:#d1fae5}
.pt-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ps{min-width:0;padding:9px;background:#0b624c;border:1px solid #a7f3d0}
.ps b{display:block;font-size:17px;font-weight:900;font-variant-numeric:tabular-nums}
.ps span{font-size:10px;color:#d1fae5}
.info-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed #6ee7b7;font-size:12px}
.info-row:last-child{border-bottom:0}
.info-row .material-symbols-outlined{flex:none;color:var(--accent);font-size:19px}
.info-row .k{width:44px;flex:none;color:var(--muted);font-size:11px}
.info-row .v{min-width:0;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  padding:5px 10px;
  color:var(--ink);
  background:var(--chip);
  border:2px solid var(--ink);
  font-size:11px;
  font-weight:800;
}
.chip.warn{color:#7c2d12;background:#ffedd5}
.tl{position:relative;min-width:0;padding-left:24px}
.tl:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:3px;background:var(--ink)}
.tl-item{position:relative;padding:0 0 19px 9px}
.tl-item:last-child{padding-bottom:0}
.tl-item:before{
  content:"";
  position:absolute;
  left:-23px;
  top:3px;
  width:13px;
  height:13px;
  background:#fff;
  border:3px solid var(--ink);
}
.tl-item.done:before{background:var(--color-primary)}
.tl-item.now:before{background:var(--color-accent);box-shadow:0 0 0 4px #fed7aa}
.tl-tm{color:var(--muted);font:800 10px ui-monospace,SFMono-Regular,Consolas,monospace}
.tl-t{margin:1px 0 2px;font-size:13px;font-weight:900}
.tl-d{color:var(--muted);font-size:11px}
.rooms{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.room{position:relative;min-width:0;padding:13px;background:#fff;border:2px solid var(--ink)}
.room.occ{box-shadow:3px 3px 0 var(--color-border)}
.room.empty{background:var(--chip);border-style:dashed}
.r-no{color:var(--muted);font:900 10px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.08em}
.r-pet{display:flex;align-items:center;gap:6px;margin:4px 0 1px;font-size:15px;font-weight:900}
.r-pet .material-symbols-outlined{color:var(--accent);font-size:18px}
.r-sub{color:var(--muted);font-size:11px}
.r-day{display:flex;align-items:center;justify-content:space-between;margin-top:9px;color:var(--ok);font-size:10px;font-weight:900}
.r-empty{padding:10px 0;color:var(--muted);text-align:center;font-size:12px;font-weight:800}
.feed{display:flex;flex-direction:column}
.feed-item{display:flex;gap:12px;padding:13px 0;border-bottom:2px solid var(--line)}
.feed-item:last-child{border-bottom:0}
.feed-ic{width:38px;height:38px;flex:none;display:grid;place-items:center;border:2px solid var(--ink)}
.feed-ic .material-symbols-outlined{font-size:19px}
.feed-b{min-width:0;flex:1}
.ft{font-size:13px;font-weight:900}
.fd{color:var(--muted);font-size:11px}
.fm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px;color:var(--muted);font-size:10px}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:11px;color:var(--muted);font-size:10px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.legend i{display:inline-block;width:11px;height:11px;border:1px solid #000}
.mini{color:var(--muted);font-size:10px;font-weight:700}
.hl-num{color:var(--accent);font-weight:900}
.progress-list{display:flex;flex-direction:column;gap:14px}
.pl-row{display:grid;grid-template-columns:96px 1fr 42px;gap:10px;align-items:center}
.pl-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:800}
.pl-v{text-align:right;font:800 11px ui-monospace,SFMono-Regular,Consolas,monospace}
.chartbox{min-width:0}
.stack{display:flex;flex-direction:column;gap:18px}
code,.mono,.r-no,.sg-time,.sg-head small,.tl-tm{font-variant-numeric:tabular-nums}
.grid-item{animation:gridIn .4s cubic-bezier(.2,1.4,.5,1) both}
.grid-item:nth-child(2){animation-delay:.06s}
.grid-item:nth-child(3){animation-delay:.12s}
.grid-item:nth-child(4){animation-delay:.18s}
@keyframes gridIn{from{opacity:0;transform:translateY(16px) scale(.92)}}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .rooms{grid-template-columns:repeat(2,1fr)}
  .board{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:860px){
  .layout{flex-direction:column}
  .sidebar{
    width:auto;
    height:auto;
    position:static;
    flex-direction:row;
    flex-wrap:wrap;
    align-items:center;
    padding:12px 14px;
    border-right:0;
    border-bottom:3px solid var(--ink);
  }
  .brand{padding:0 14px 0 0;border:0;margin-right:auto}
  .logo{width:40px;height:40px;box-shadow:3px 3px 0 var(--ink)}
  .navlabel,.side-foot{display:none}
  .nav{width:auto;flex-direction:row;flex-wrap:wrap}
  .navbtn{width:auto;padding:8px 10px}
  .main{padding:25px 17px 42px}
  .topbar{padding:20px;margin-top:10px}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .rooms,.board{grid-template-columns:1fr}
  .kpi:nth-child(2n){transform:none}
}
@media(max-width:560px){
  .nb-t{display:none}
  .navbtn{padding:8px}
  .brand b{font-size:15px}
  .brand span:not(.material-symbols-outlined){display:none}
  .topbar{box-shadow:5px 5px 0 var(--ink)}
  .topbar h1{font-size:25px}
  .tb-right{justify-content:flex-start}
  .pill:nth-child(2){display:none}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
    transition-duration:.01ms!important;
  }
  .grid-item{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">pets</span></div>
      <div><b>毛日子</b><span>PET BOOKING</span></div>
    </div>
    <div class="navlabel">營運模組</div>
    <div class="nav" id="nav"></div>
    <div class="side-foot">門市：<b>信義旗艦店</b><br />值班店長：陳沛妤<br />版本 v3.4 · Demo</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="scr-title">預約排程</h1>
        <p class="sub" id="scr-sub">旅館、美容、課程檔期預約與衝突偵測</p>
      </div>

var RENDER=[v0,v1,v2,v3,v4,v5];
function show(i){
  i=Math.max(0,Math.min(i,RENDER.length-1));
  killCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    var on=+btns[b].getAttribute("data-i")===i;
    btns[b].classList.toggle("on",on);
    btns[b].setAttribute("aria-current",on?"page":"false")
  }
  document.getElementById("scr-title").textContent=MODULES[i].name;
  document.getElementById("scr-sub").textContent=MODULES[i].desc;
  RENDER[i]()
}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return}
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
