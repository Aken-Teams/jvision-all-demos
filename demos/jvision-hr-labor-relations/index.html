<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>勞資會議與員工申訴管理 · HRIS 人力資源系統</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#0369A1;
  --radius:10px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-width:320px;
  background:var(--color-background);
  color:var(--ink);
  font-family:"Crimson Pro",serif;
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased
}
button,input,select,textarea{font:inherit}
button,a{cursor:pointer}
button{color:inherit}
h1,h2,h3,h4,.brand-name,.nav button,.tag,.kpi .label,.table-note{
  font-family:"Cormorant Garamond",serif
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px
}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.sidebar{
  position:sticky;
  top:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  padding:20px 14px;
  background:#CCFBF1;
  border-right:1px solid var(--line)
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:4px 7px 20px;
  border-bottom:1px solid var(--line)
}
.brand-mark{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  flex:none;
  color:#fff;
  background:var(--color-primary);
  border:2px solid var(--ink);
  border-radius:8px
}
.brand-mark .material-symbols-outlined{font-size:23px}
.brand-name{
  display:block;
  font-size:19px;
  font-weight:700;
  line-height:1.1
}
.brand small{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-family:"Cinzel",serif;
  font-size:9px;
  letter-spacing:.09em
}
.nav{display:grid;gap:5px;margin-top:18px}
.nav button{
  width:100%;
  min-height:44px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 11px;
  border:1px solid transparent;
  border-radius:7px;
  background:transparent;
  text-align:left;
  font-size:16px;
  font-weight:700;
  transition:background-color .18s ease,border-color .18s ease,color .18s ease
}
.nav button:hover{background:#fff;border-color:var(--line)}
.nav button.on{
  color:#fff;
  background:var(--color-primary);
  border-color:var(--ink)
}
.nav button .material-symbols-outlined{font-size:20px}
.nav .idx{
  margin-left:auto;
  font-family:"Cinzel",serif;
  font-size:10px;
  font-variant-numeric:tabular-nums
}
.side-foot{
  margin-top:auto;
  padding:14px 7px 0;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:13px
}
.side-foot b{color:var(--ink)}
.main{min-width:0;padding:22px 26px 52px}
.topbar{
  position:sticky;
  z-index:10;
  top:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin:-22px -26px 18px;
  padding:17px 26px;
  background:rgba(240,253,250,.96);
  border-bottom:1px solid var(--line)
}
.heading{min-width:0}
.heading h1{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0;
  font-size:26px;
  line-height:1.05
}
.heading h1 .material-symbols-outlined{color:var(--color-primary)}
.heading .sub{margin-top:4px;color:var(--muted);font-size:14px}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{
  min-height:34px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 10px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:7px;
  color:var(--muted);
  font-size:13px
}
.status-mark{
  width:9px;
  height:9px;
  display:inline-block;
  background:var(--ok);
  border:2px solid #fff;
  outline:1px solid var(--ok);
  border-radius:50%
}
.avatar{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--color-primary);
  border:1px solid var(--ink);
  border-radius:7px;
  font-weight:700
}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g32{grid-template-columns:minmax(0,1.45fr) minmax(280px,.75fr)}
.card,.kpi{
  min-width:0;
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:var(--radius)
}
.card{padding:15px}
.card.pad0{padding:0;overflow:hidden}
.card-h{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  min-height:30px;
  margin-bottom:11px
}
.pad0 .card-h{padding:14px 14px 0}
.card-h h3{
  display:flex;
  align-items:center;
  gap:7px;
  margin:0;
  font-size:18px
}
.card-h h3 .material-symbols-outlined{color:var(--color-primary);font-size:19px}
.hint{color:var(--muted);font-size:12px}
.kpi{
  position:relative;
  min-height:136px;
  padding:14px 15px;
  border-top:4px solid var(--color-primary);
  overflow:hidden
}
.kpi .ico{
  position:absolute;
  top:13px;
  right:13px;
  width:33px;
  height:33px;
  display:grid;
  place-items:center;
  color:var(--color-primary);
  background:#CCFBF1;
  border:1px solid var(--line);
  border-radius:7px
}
.kpi .ico .material-symbols-outlined{font-size:19px}
.kpi .label{
  padding-right:38px;
  color:var(--muted);
  font-size:15px;
  font-weight:700
}
.kpi .value{
  margin-top:12px;
  font-family:"Cinzel",serif;
  font-size:29px;
  font-weight:600;
  font-variant-numeric:tabular-nums;
  line-height:1
}
.kpi .value small{
  margin-left:4px;
  color:var(--muted);
  font-family:"Crimson Pro",serif;
  font-size:14px
}
.delta{
  display:inline-flex;
  align-items:center;
  gap:3px;
  margin-top:10px;
  font-size:13px;
  font-weight:600
}
.delta .material-symbols-outlined{font-size:15px}
.delta.up{color:var(--ok)}
.delta.down{color:var(--bad)}
.delta.flat{color:var(--muted)}
.screen-block{margin-top:12px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{
  padding:9px 11px;
  color:var(--ink);
  background:var(--color-muted);
  border-bottom:2px solid var(--color-primary);
  font-size:12px;
  font-weight:700;
  letter-spacing:.02em;
  text-align:left;
  white-space:nowrap
}
td{
  padding:9px 11px;
  border-bottom:1px solid #BDEDE5;
  white-space:nowrap
}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#F0FDFA}
tbody tr:last-child td{border-bottom:0}
td:first-child,.mono{
  font-family:"Cinzel",serif;
  font-size:12px;
  font-variant-numeric:tabular-nums
}
td:has(.prog),td:has(.tag){vertical-align:middle}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:5px;
  font-size:12px;
  font-weight:700;
  white-space:nowrap
}
.tag::before{content:"";width:6px;height:6px;background:currentColor;border-radius:50%}
.t-ok{color:#166534;background:#F0FDF4}
.t-warn{color:#92400E;background:#FFFBEB}
.t-bad{color:#B91C1C;background:#FEF2F2}
.t-info{color:#075985;background:#F0F9FF}
.t-acc{color:#115E59;background:#F0FDFA}
.prog{min-width:115px;display:flex;align-items:center;gap:7px}
.bar{
  height:7px;
  flex:1;
  overflow:hidden;
  background:#D5E5E7;
  border-radius:2px
}
.bar i{display:block;height:100%;background:var(--color-primary)}
.prog small{
  width:34px;
  color:var(--muted);
  font-family:"Cinzel",serif;
  font-size:10px;
  text-align:right;
  font-variant-numeric:tabular-nums
}
.chk{
  display:grid;
  grid-template-columns:21px minmax(0,1fr) auto;
  align-items:center;
  gap:8px;
  padding:8px 1px;
  border-bottom:1px solid #BDEDE5;
  font-size:14px
}
.chk:last-of-type{border-bottom:0}
.chk .material-symbols-outlined{font-size:19px}
.chk .ok{color:var(--ok)}
.chk .warn{color:var(--warn)}
.chk .bad{color:var(--bad)}
.chk small{color:var(--muted);text-align:right}
.note{
  margin-top:11px;
  padding:10px 11px;
  color:#334155;
  background:#FFFBEB;
  border-left:4px solid var(--color-accent);
  font-size:13px;
  line-height:1.55
}
.tl{position:relative;padding-left:25px}
.tl::before{
  content:"";
  position:absolute;
  top:5px;
  bottom:5px;
  left:7px;
  width:2px;
  background:var(--line)
}
.tl-item{position:relative;padding-bottom:14px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{
  position:absolute;
  top:4px;
  left:-23px;
  width:13px;
  height:13px;
  background:#fff;
  border:3px solid var(--color-primary);
  border-radius:50%
}
.tl-dot.bad{border-color:var(--bad)}
.tl-dot.warn{border-color:var(--warn)}
.tl-dot.ok{border-color:var(--ok)}
.tl-time{
  color:var(--muted);
  font-family:"Cinzel",serif;
  font-size:11px;
  font-variant-numeric:tabular-nums
}
.tl-item b{display:block;margin:1px 0;font-size:14px}
.tl-item p{margin:0;color:var(--muted);font-size:13px}
.rule-copy{color:var(--muted);font-size:14px;line-height:1.8}
.rule-copy b{color:var(--ink)}
.apexcharts-tooltip,.apexcharts-menu{box-shadow:none!important}
.apexcharts-tooltip{border:1px solid var(--line)!important}
.reveal{animation:reveal .36s ease both}
@keyframes reveal{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:none}
}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g32{grid-template-columns:1fr}
}
@media(max-width:860px){
  .app{display:block}
  .sidebar{
    position:relative;
    width:100%;
    height:auto;
    padding:11px 13px
  }
  .brand{padding:0 0 10px}
  .brand-mark{width:38px;height:38px}
  .nav{
    display:flex;
    gap:6px;
    margin-top:10px;
    overflow-x:auto;
    padding-bottom:3px
  }
  .nav button{width:auto;flex:0 0 auto}
  .side-foot{display:none}
  .main{padding:18px 14px 42px}
  .topbar{
    position:relative;
    margin:-18px -14px 16px;
    padding:14px;
    align-items:flex-start
  }
}
@media(max-width:620px){
  .topbar{display:block}
  .top-actions{margin-top:12px}
  .heading h1{font-size:23px}
  .g4,.g2{grid-template-columns:1fr}
  .kpi{min-height:122px}
  .chip:nth-child(2){display:none}
  .nav .idx{display:none}
  .chk{grid-template-columns:21px minmax(0,1fr)}
  .chk small{grid-column:2;text-align:left}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important
  }
  .reveal{animation:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><span class="material-symbols-outlined">forum</span></div>
      <div><span class="brand-name">勞資溝通室</span><small>LABOR RELATIONS</small></div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
    <div class="side-foot">勞方代表：<b>7 人</b>（2025/10 改選）<br>資方代表：<b>7 人</b>｜任期至 2028/09</div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="heading">
        <h1><span class="material-symbols-outlined" id="th-ico" aria-hidden="true"></span><span id="th-title"></span></h1>
        <div class="sub" id="th-sub"></div>
      </div>
      <div class="top-actions">
        <span class="chip"><span class="status-mark" aria-hidden="true"></span>系統連線正常</span>
        <span class="chip"><span class="material-symbols-outlined" aria-hidden="true">calendar_today</span>2026/08/20</span>
        <div class="avatar" aria-label="資方使用者">資</div>
      </div>
    </header>
    <div id="screen" aria-live="polite"></div>
  </main>
</div>
<script>
var charts=[];
function killCharts(){
  for(var i=0;i<charts.length;i++){
    try{charts[i].destroy()}catch(e){}
  }
  charts=[];
}
function esc(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}
function kpis(items){
  return '<div class="grid g4">'+items.map(function(k){
    var icon=k.cls==="up"?"trending_up":k.cls==="down"?"trending_down":"trending_flat";
    return '<section class="kpi reveal">'+
      '<div class="ico"><span class="material-symbols-outlined" aria-hidden="true">'+k.ico+'</span></div>'+
      '<div class="label">'+esc(k.lbl)+'</div>'+
      '<div class="value">'+k.val+(k.u?'<small>'+k.u+'</small>':'')+'</div>'+
      '<div class="delta '+k.cls+'"><span class="material-symbols-outlined" aria-hidden="true">'+icon+'</span>'+esc(k.d)+'</div>'+
    '</section>';
  }).join("")+'</div>';
}
function tbl(headers,rows){
  return '<div class="table-wrap"><table><thead><tr>'+
    headers.map(function(x){return '<th scope="col">'+esc(x)+'</th>';}).join("")+
    '</tr></thead><tbody>'+
    rows.map(function(row){
      return '<tr>'+row.map(function(cell){return '<td>'+cell+'</td>';}).join("")+'</tr>';
    }).join("")+
    '</tbody></table></div>';
}
function pg(percent){
  return '<div class="prog" aria-label="進度 '+percent+'%"><div class="bar"><i style="width:'+percent+'%"></i></div><small>'+percent+'%</small></div>';
}
function card(title,icon,body,hint){
  return '<section class="card reveal"><div class="card-h"><h3><span class="material-symbols-outlined" aria-hidden="true">'+icon+'</span>'+title+'</h3>'+
    (hint?'<span class="hint">'+hint+'</span>':'')+'</div>'+body+'</section>';
}
function cardT(title,icon,body,hint){
  return '<section class="card pad0 reveal"><div class="card-h"><h3><span class="material-symbols-outlined" aria-hidden="true">'+icon+'</span>'+title+'</h3>'+
    (hint?'<span class="hint">'+hint+'</span>':'')+'</div>'+body+'</section>';
}
function timeline(items){
  return '<div class="tl">'+items.map(function(t){
    return '<div class="tl-item"><div class="tl-dot '+(t.k||"")+'"></div><div class="tl-time">'+esc(t.t)+'</div><b>'+esc(t.b)+'</b><p>'+esc(t.p)+'</p></div>';
  }).join("")+'</div>';
}
var CHART_BASE={
  redrawOnParentResize:true,
  redrawOnWindowResize:true,
  animations:{enabled:false},
  toolbar:{show:false},
  fontFamily:'"Crimson Pro",serif',
  foreColor:"#475569"
};
function pushChart(id,options){
  var node=document.getElementById(id);
  if(!node)return;
  var chart=new ApexCharts(node,options);
  chart.render();
  charts.push(chart);
}
function donut(id,labels,data){
  pushChart(id,{
    chart:Object.assign({},CHART_BASE,{type:"donut",height:265}),
    series:data,
    labels:labels,
    colors:["#0D9488","#D97706","#2DD4BF","#0369A1","#15803D","#64748B"],
    legend:{position:"bottom",fontSize:"12px"},
    dataLabels:{enabled:false},
    stroke:{width:2,colors:["#FFFFFF"]},
    plotOptions:{pie:{donut:{size:"66%"}}},
    tooltip:{theme:"light"}
  });
}
function bars(id,categories,data){
  pushChart(id,{
    chart:Object.assign({},CHART_BASE,{type:"bar",height:250}),
    series:[{name:"件數",data:data}],
    xaxis:{categories:categories,labels:{style:{colors:"#475569",fontSize:"11px"}}},
    yaxis:{min:0,labels:{style:{colors:"#475569",fontSize:"11px"}}},
    grid:{borderColor:"#BDEDE5",strokeDashArray:0},
    colors:["#0D9488"],
    dataLabels:{enabled:false},
    plotOptions:{bar:{borderRadius:0,columnWidth:"52%"}},
    tooltip:{theme:"light"}
  });
}
var MODULES=[
  {icon:"groups_3",name:"勞資會議",sub:"法定每 3 個月一次的會議排程與紀錄"},
  {icon:"how_to_vote",name:"代表與選舉",sub:"勞資雙方代表名冊、任期與改選"},
  {icon:"support_agent",name:"員工申訴",sub:"申訴案件受理、調查與結案追蹤"},
  {icon:"handshake",name:"議題追蹤",sub:"會議決議與申訴改善的落實進度"}
];
function checks(){
  return '<div class="chk"><span class="material-symbols-outlined ok">check_circle</span><span>每 3 個月至少 1 次</span><small>本年 3 次，符合</small></div>'+
  '<div class="chk"><span class="material-symbols-outlined ok">check_circle</span><span>勞資雙方代表人數相同</span><small>各 7 人</small></div>'+
  '<div class="chk"><span class="material-symbols-outlined ok">check_circle</span><span>勞方代表由勞工選舉產生</span><small>2025/10 改選</small></div>'+
  '<div class="chk"><span class="material-symbols-outlined ok">check_circle</span><span>會議紀錄保存並公告</span><small>公告欄 + 內網</small></div>'+
  '<div class="chk"><span class="material-symbols-outlined ok">check_circle</span><span>出席過半始得開會</span><small>最低 12/14</small></div>'+
  '<div class="chk"><span class="material-symbols-outlined warn">warning</span><span>主席由勞資輪流擔任</span><small>本年已輪替 2 次</small></div>'+
  '<div class="note">延長工時（勞基法 §32）與七休一例外（§36-IV）都需經勞資會議同意，這是勞檢必查項目。目前的同意決議有效期至 2027/02，屆時需重新提案。</div>';
}
function viewMeetings(c){
  c.innerHTML=kpis([
    {ico:"event",lbl:"本年度已召開",val:"3",u:"次",d:"法定每 3 個月 1 次",cls:"up"},
    {ico:"how_to_reg",lbl:"平均出席率",val:"92.9",u:"%",d:"法定過半始得開會",cls:"up"},
    {ico:"gavel",lbl:"本年度決議",val:"18",u:"案",d:"已落實 14 案",cls:"flat"},
    {ico:"pending",lbl:"待辦決議",val:"4",u:"案",d:"2 案逾期",cls:"down"}
  ])+
  '<div class="grid g32 screen-block">'+

function buildNav(){
  var nav=document.getElementById("nav");
  nav.innerHTML=MODULES.map(function(module,index){
    return '<button type="button" data-i="'+index+'" aria-label="'+esc(module.name)+'">'+
      '<span class="material-symbols-outlined" aria-hidden="true">'+module.icon+'</span>'+
      '<span>'+esc(module.name)+'</span><span class="idx">0'+(index+1)+'</span></button>';
  }).join("");
  Array.prototype.forEach.call(nav.querySelectorAll("[data-i]"),function(button){
    button.addEventListener("click",function(){
      location.hash="go="+button.getAttribute("data-i");
    });
  });
}
function show(index){
  killCharts();
  var module=MODULES[index];
  document.getElementById("th-ico").textContent=module.icon;
  document.getElementById("th-title").textContent=module.name;
  document.getElementById("th-sub").textContent=module.sub;
  Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(button){
    var active=Number(button.getAttribute("data-i"))===index;
    button.classList.toggle("on",active);
    button.setAttribute("aria-current",active?"page":"false");
  });
  RENDER[index](document.getElementById("screen"));
}
function fromHash(){
  var match=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  var index=match?Math.min(Number(match[1]),MODULES.length-1):0;
  show(index);
  try{window.scrollTo({top:0,behavior:"auto"});}catch(e){window.scrollTo(0,0);}
}
buildNav();
window.addEventListener("hashchange",fromHash);
fromHash();
