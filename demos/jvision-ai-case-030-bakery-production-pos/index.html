<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>烘焙門市生產管理台｜Jvision 系統 Demo</title>
<meta name="description" content="門市即時銷售與後廠生產排程、烤焙批次、半成品麵團與原料耗用的前店後廠一體化（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@300;400;500;600;700&family=Playfair+Display+SC:wght@400;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#1E3A8A;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#A16207;
  --color-on-accent:#FFFFFF;
  --color-background:#F8FAFC;
  --color-foreground:#1E40AF;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E40AF;
  --color-muted:#E9EEF5;
  --color-muted-foreground:#475569;
  --color-border:#BFDBFE;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#1E3A8A;
  --blue:#1E3A8A;
  --ink:#172554;
  --muted:#526176;
  --line:#BFDBFE;
  --success:#166534;
  --success-bg:#DCFCE7;
  --warning:#92400E;
  --warning-bg:#FEF3C7;
  --danger:#B91C1C;
  --danger-bg:#FEE2E2;
  --info-bg:#DBEAFE;
  --shadow:0 16px 38px rgba(30,58,138,.08);
  --shadow-soft:0 5px 18px rgba(30,58,138,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  background:
    radial-gradient(circle at 86% -8%,rgba(59,130,246,.13),transparent 27rem),
    var(--color-background);
  color:#334155;
  font-family:Karla,"Microsoft JhengHei",sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-variation-settings:"FILL" 0,"wght" 500,"GRAD" 0,"opsz" 24;
  line-height:1;
}
.app{min-height:100vh}
.nav{
  position:sticky;
  top:0;
  z-index:30;
  color:var(--color-on-primary);
  background:rgba(30,58,138,.97);
  border-bottom:1px solid rgba(255,255,255,.18);
  box-shadow:0 8px 24px rgba(15,23,42,.16);
  backdrop-filter:blur(16px);
}
.nav-in{
  max-width:1600px;
  margin:auto;
  padding:12px 24px;
  display:flex;
  align-items:center;
  gap:18px;
}
.brand{display:flex;align-items:center;gap:11px;min-width:230px}
.brand .lg{
  width:44px;
  height:44px;
  display:grid;
  place-items:center;
  flex:none;
  color:var(--color-primary);
  background:#fff;
  border-radius:12px;
  box-shadow:0 7px 18px rgba(15,23,42,.22);
}
.brand .lg span{font-size:25px}
.brand b{
  display:block;
  color:#fff;
  font-family:"Playfair Display SC","Microsoft JhengHei",serif;
  font-size:15px;
  letter-spacing:.035em;
}
.brand small{display:block;color:#DBEAFE;font-size:11px}
.tabs{
  display:flex;
  align-items:center;
  gap:4px;
  overflow-x:auto;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  min-height:42px;
  padding:9px 11px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  flex:none;
  color:#DBEAFE;
  background:transparent;
  border:1px solid transparent;
  border-radius:9px;
  font-weight:700;
  transition:background .2s,color .2s,border-color .2s,transform .2s;
}
.tabs button:hover{color:#fff;background:rgba(255,255,255,.11)}
.tabs button.on{
  color:var(--color-primary);
  background:#fff;
  border-color:#fff;
  box-shadow:0 4px 12px rgba(15,23,42,.15);
}
.tabs button .material-symbols-outlined{font-size:19px}
.nav-r{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.pill{
  min-height:34px;
  padding:6px 10px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:#fff;
  background:rgba(255,255,255,.11);
  border:1px solid rgba(255,255,255,.17);
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}
.dot{
  width:8px;
  height:8px;
  display:inline-block;
  flex:none;
  background:#4ADE80;
  border-radius:50%;
  box-shadow:0 0 0 3px rgba(74,222,128,.2);
}
.ava{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--color-accent);
  border:2px solid rgba(255,255,255,.55);
  border-radius:10px;
  font-family:"Playfair Display SC",serif;
  font-weight:700;
}
.main{max-width:1600px;margin:auto;padding:25px 24px 52px}
.head{
  min-height:76px;
  margin-bottom:18px;
  display:flex;
  align-items:center;
  gap:12px;
}
.head h1{
  margin:0;
  color:var(--ink);
  font-family:"Playfair Display SC","Microsoft JhengHei",serif;
  font-size:clamp(24px,3vw,32px);
  line-height:1.2;
  letter-spacing:.02em;
}
.head p{margin:5px 0 0;color:var(--muted);font-size:13px}
.spacer{flex:1}
.btn{
  min-height:42px;
  padding:0 16px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  color:var(--color-on-accent);
  background:var(--color-accent);
  border:1px solid var(--color-accent);
  border-radius:9px;
  box-shadow:0 5px 12px rgba(161,98,7,.18);
  font-weight:700;
  transition:transform .2s,box-shadow .2s,background .2s;
}
.btn:hover{background:#854D0E;box-shadow:0 8px 18px rgba(161,98,7,.24);transform:translateY(-1px)}
.btn.ghost{
  color:var(--color-primary);
  background:#fff;
  border-color:var(--line);
  box-shadow:none;
}
.btn.ghost:hover{background:#EFF6FF}
.btn .material-symbols-outlined{font-size:19px}
.grid{display:grid;gap:18px}
.grid>*{min-width:0}
.card,.kpi,.oven,.si,.sc{
  background:rgba(255,255,255,.96);
  border:1px solid var(--line);
  box-shadow:var(--shadow-soft);
}
.card{min-width:0;padding:20px;border-radius:14px}
h3.sec{
  margin:0 0 16px;
  display:flex;
  align-items:center;
  gap:9px;
  color:var(--ink);
  font-size:15px;
  font-weight:700;
}
h3.sec>.material-symbols-outlined{color:var(--color-accent);font-size:21px}
.tag{
  margin-left:auto;
  padding:4px 9px;
  color:#854D0E;
  background:var(--warning-bg);
  border:1px solid #FDE68A;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
}
.kpis{
  margin-bottom:18px;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
}
.kpi{
  min-height:128px;
  padding:17px;
  position:relative;
  overflow:hidden;
  border-radius:13px;
}
.kpi::after{
  content:"";
  width:70px;
  height:70px;
  position:absolute;
  right:-28px;
  top:-28px;
  background:rgba(59,130,246,.09);
  border-radius:50%;
}
.kpi .l{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:700}
.kpi .l span{color:var(--color-secondary);font-size:18px}
.kpi .v{
  margin-top:8px;
  color:var(--ink);
  font-family:"Playfair Display SC",Karla,sans-serif;
  font-size:28px;
  font-variant-numeric:tabular-nums;
  font-weight:700;
}
.kpi .v small{color:var(--muted);font-family:Karla,sans-serif;font-size:13px}
.kpi .d{margin-top:2px;font-size:12px;font-weight:700}
.up{color:var(--success)}
.down{color:var(--danger)}
.chart{width:100%;height:300px}
.board{max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.board-in{min-width:820px}
.tl-h,.lane{display:grid;grid-template-columns:125px 1fr}
.tl-h{border-bottom:1px solid var(--line)}
.tl-h .sp,.lane-h{background:#EFF6FF;border-right:1px solid var(--line)}
.tl-h .cols,.slots{display:grid;grid-template-columns:repeat(8,1fr)}
.tl-h .cols span{
  padding:9px 5px;
  color:var(--muted);
  border-right:1px solid #DBEAFE;
  text-align:center;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:11px;
  font-weight:700;
}
.lane{border-bottom:1px solid var(--line)}
.lane:last-child{border-bottom:0}
.lane-h{
  padding:13px 11px;
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--ink);
  font-size:12px;
  font-weight:700;
}
.lane-h span{color:var(--color-primary);font-size:19px}
.slot{min-height:64px;padding:5px;border-right:1px dashed #CBD5E1}
.batch{
  min-height:52px;
  padding:7px;
  color:#fff;
  border-radius:7px;
  box-shadow:0 3px 8px rgba(15,23,42,.15);
  font-size:11px;
  font-weight:700;
  line-height:1.25;
}
.batch small{display:block;margin-top:3px;font-size:10px;opacity:.92}
.b-mix{background:#854D0E}.b-proof{background:#A16207}.b-bake{background:#9A3412}
.b-cool{background:#0369A1}.b-done{background:#166534}
.lgd{margin-top:13px;display:flex;flex-wrap:wrap;gap:12px;color:#475569;font-size:12px}
.lgd span{display:inline-flex;align-items:center;gap:6px}
.lgd i{width:12px;height:12px;border-radius:3px}
.ovens{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}
.oven{padding:14px;border-radius:11px;border-top:3px solid var(--color-primary)}
.oven-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.oven-h b,.oven .prod{color:var(--ink)}
.oven .prod{margin:8px 0 3px;font-size:13px;font-weight:700}
.meta{color:var(--muted);font-size:11px}
.st,.chipm,.low,.ok{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 8px;
  border-radius:999px;
  font-size:10px;
  font-weight:700;
  white-space:nowrap;
}
.st::before,.chipm::before,.low::before,.ok::before{font-family:"Material Symbols Outlined";font-size:13px}
.s-bake,.c-red,.low{color:var(--danger);background:var(--danger-bg)}
.s-bake::before,.c-red::before,.low::before{content:"warning"}
.s-proof,.c-brown{color:var(--warning);background:var(--warning-bg)}
.s-proof::before,.c-brown::before{content:"schedule"}
.s-idle,.c-gray{color:#475569;background:#E2E8F0}
.s-idle::before,.c-gray::before{content:"pause_circle"}
.s-cool,.c-blue{color:#1D4ED8;background:var(--info-bg)}
.s-cool::before,.c-blue::before{content:"ac_unit"}
.c-green,.ok{color:var(--success);background:var(--success-bg)}
.c-green::before,.ok::before{content:"check_circle"}
.prog,.bar{height:8px;overflow:hidden;background:#E2E8F0;border-radius:999px}
.prog{margin:11px 0 5px}
.prog span,.bar span{display:block;height:100%;background:var(--color-primary);border-radius:inherit}
.prog.warm span{background:#9A3412}.prog.cool span{background:#0369A1}
.fs{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.sale-feed{display:flex;flex-direction:column}
.sale{
  min-height:62px;
  padding:10px 4px;
  display:flex;
  align-items:center;
  gap:11px;
  border-bottom:1px solid #E2E8F0;
}
.sale:last-child{border-bottom:0}
.em{
  width:39px;
  height:39px;
  display:grid;
  place-items:center;
  flex:none;
  color:var(--color-primary);
  background:#EFF6FF;
  border:1px solid var(--line);
  border-radius:9px;
}
.em span{font-size:20px}
.nm{min-width:0;flex:1}
.nm b{display:block;color:var(--ink);font-size:13px}
.nm small{display:block;color:var(--muted);font-size:11px}
.qty,.amt{white-space:nowrap;font-variant-numeric:tabular-nums}
.qty{color:#475569;font-weight:700}
.amt{min-width:68px;color:var(--color-accent);text-align:right;font-weight:700}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--success)}
.stat-list{display:flex;flex-direction:column;gap:12px}
.mini{padding:13px 14px;background:#F8FAFC;border:1px solid #DBEAFE;border-radius:9px}
.mini .l{color:var(--muted);font-size:12px;font-weight:700}
.mini .v{margin-top:2px;color:var(--ink);font-size:22px;font-variant-numeric:tabular-nums;font-weight:700}
.mini .v small{color:var(--color-primary);font-size:11px}
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.si{padding:14px;border-radius:10px}
.si b{color:var(--ink);font-size:13px}
.si .bar{margin:9px 0 7px}
.si small{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto}
.tbl{width:100%;min-width:560px;border-collapse:collapse;font-size:13px}
.tbl th{
  padding:11px 12px;
  color:#475569;
  background:#EFF6FF;
  border-bottom:1px solid var(--line);
  text-align:left;
  white-space:nowrap;
  font-size:11px;
  font-weight:700;
  letter-spacing:.03em;
}
.tbl td{padding:12px;border-bottom:1px solid #E2E8F0;color:#475569}
.tbl tbody tr:hover{background:#F8FAFC}
.tbl tr:last-child td{border-bottom:0}
.tbl td b{color:var(--ink)}
.tbl th:nth-last-child(-n+3),.tbl td:nth-last-child(-n+3){font-variant-numeric:tabular-nums}
.tbl td:first-child{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.semi{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:13px}
.sc{padding:15px;border-radius:11px}
.sc-h{margin-bottom:9px;display:flex;align-items:center;gap:9px}
.sc-h .ic{
  width:39px;height:39px;display:grid;place-items:center;flex:none;
  color:var(--color-primary);background:#EFF6FF;border-radius:9px;
}
.sc-h b{color:var(--ink);font-size:14px}.sc-h small{display:block;color:var(--muted);font-size:11px}
.sc-row{padding:4px 0;display:flex;justify-content:space-between;gap:10px;color:#475569;font-size:12px}
.sc-row b{color:var(--ink);text-align:right}
.stage-dots{margin-top:9px;display:flex;gap:5px}
.stage-dots i{height:6px;flex:1;background:#E2E8F0;border-radius:999px}
.stage-dots i.on{background:var(--color-accent)}
.rank{padding:9px 0;display:flex;align-items:center;gap:12px}
.rank .no{
  width:27px;height:27px;display:grid;place-items:center;flex:none;
  color:#fff;background:var(--color-primary);border-radius:7px;font-weight:700;
}
.rank b{width:125px;color:var(--ink);font-size:13px}
.rank>.bar{margin:0;flex:1}
.rank>span:last-child{min-width:62px;text-align:right;font-variant-numeric:tabular-nums}
.alert{padding:12px 0;display:flex;align-items:flex-start;gap:10px;border-bottom:1px solid #E2E8F0}
.alert:last-child{border-bottom:0}
.alert .ai{width:35px;height:35px;display:grid;place-items:center;flex:none;border-radius:8px}
.alert .ai span{font-size:19px}
.alert b{display:block;color:var(--ink);font-size:13px}
.alert small{display:block;color:var(--muted);font-size:11px}
.reveal{animation:reveal .36s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1180px){
  .nav-in{flex-wrap:wrap}
  .tabs{order:3;width:100%}
  .nav-r{margin-left:auto}
  .kpis{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:900px){
  .grid,.fs{grid-template-columns:1fr!important}
  .nav-r .pill:nth-child(2){display:none}
}
@media(max-width:640px){
  .nav-in,.main{padding-left:15px;padding-right:15px}
  .brand{min-width:0;flex:1}
  .brand small{display:none}
  .nav-r{margin-left:0}.nav-r .pill{display:none}
  .tabs button{min-width:44px;justify-content:center}
  .tabs .lb{display:none}
  .head{align-items:flex-start;flex-wrap:wrap}
  .head .spacer{display:none}
  .head>div:first-child{width:100%}
  .head .btn{flex:1}
  .kpis{grid-template-columns:1fr}
  .card{padding:16px}
  .rank b{width:95px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .reveal{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="app">
<nav class="nav" aria-label="主要導覽">
  <div class="nav-in">
    <div class="brand">
      <div class="lg" aria-hidden="true"><span class="material-symbols-outlined">bakery_dining</span></div>
      <div><b>麥香烘焙 · 前店後廠台</b><small>中央店 · 門市 + 後廠即時整合</small></div>
    </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="系統畫面"></div>
    <div class="nav-r">
      <span class="pill"><span class="dot" aria-hidden="true"></span>後廠營運中</span>
      <span class="pill">今日營收 $46,180</span>
      <span class="ava" aria-label="麥香烘焙帳號">麥</span>
    </div>
  </div>
</nav>
<main class="main">
  <div class="head">
    <div><h1 id="vt">營運總覽</h1><p id="vs">前店後廠即時戰情</p></div>
    <div class="spacer"></div>
    <button class="btn ghost" type="button"><span class="material-symbols-outlined" aria-hidden="true">refresh</span>刷新</button>
    <button class="btn" type="button"><span class="material-symbols-outlined" aria-hidden="true">print</span>列印日報</button>
  </div>
  <div id="view" class="reveal"></div>
</main>
</div>
<script>
var money=function(n){return "$"+n.toLocaleString("zh-TW")};
var NAV=[
["dashboard","營運總覽","前店後廠即時戰情"],
["storefront","門市銷售","門市即時銷售與熱銷補貨"],
["schedule","生產排程","後廠烤焙批次排程看板"],
["cookie","半成品追蹤","麵團 / 半成品批次調度"],
["grocery","原料庫存","原料存量、耗用與叫貨"],
["summarize","日結報表","損耗分析與門市後廠日結"]
];
var KPI=[
["storefront","今日門市營收","46,180","元","+12.4% vs 昨日","up"],
["oven_gen","後廠出爐批次","38","爐","已達 79% 排程","up"],
["percent","原料耗用率","62","%","低於預算 5.6%","up"],
["delete_sweep","報廢損耗","4.8","%","−63% vs 上月","up"]
];
var LANES=[
["打麵機",[[0,2,"b-mix","歐式麵團","批 D-01"],[3,2,"b-mix","吐司麵團","批 D-02"],[6,1,"b-mix","可頌麵團","批 D-03"]]],
["發酵室",[[1,2,"b-proof","歐式醒發","D-01"],[3,3,"b-proof","吐司醒發","D-02"],[6,2,"b-proof","可頌醒發","D-03"]]],
["1號烤爐",[[2,2,"b-bake","法國長棍","24 條"],[4,2,"b-bake","全麥吐司","30 條"],[6,2,"b-bake","丹麥酥","40 入"]]],
["2號烤爐",[[1,1,"b-bake","可頌","60 入"],[3,2,"b-bake","菠蘿麵包","50 入"],[5,3,"b-bake","蛋糕胚","18 模"]]],
