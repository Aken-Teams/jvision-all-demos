<style>

  .nav-in{ display:flex; align-items:center; gap:20px; flex-wrap:wrap; padding:11px 24px; }

  .brand b{ display:block; font-size:16px; font-weight:900; color:#fff; letter-spacing:.5px; }
  .brand small{ font-size:11px; color:#fde9cf; }
  .tabs{ display:flex; align-items:center; gap:4px; flex-wrap:wrap; min-width:0; }
  .tabs button{ display:inline-flex; align-items:center; gap:7px; border:0; background:rgba(255,255,255,.08); color:#fdead0; border-radius:11px; padding:9px 13px; font:inherit; font-size:13px; font-weight:800; cursor:pointer; transition:background .15s,color .15s; }
  .tabs button .material-symbols-outlined{ font-size:19px; }

  .nav-r{ margin-left:auto; display:flex; align-items:center; gap:12px; }
  .pill{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:800; color:#fff; background:rgba(255,255,255,.16); border-radius:999px; padding:6px 12px; }

  .head p{ margin:0; font-size:13px; color:var(--muted); }

  .btn{ display:inline-flex; align-items:center; gap:6px; height:40px; padding:0 16px; border-radius:12px; border:0; background:var(--brown); color:#fff; font:inherit; font-weight:800; font-size:14px; cursor:pointer; }
  .btn.ghost{ background:#fff; color:var(--brown); border:1px solid var(--line); }

  h3.sec .tag{ margin-left:auto; font-size:11px; font-weight:800; color:var(--brown2); background:var(--amberbg); border-radius:999px; padding:3px 10px; }
  .grid{ display:grid; gap:18px; } .grid>*{ min-width:0; }

  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:18px; }
  .kpi{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:15px 17px; position:relative; overflow:hidden; }
  .kpi::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--brown); }
  .kpi .l{ font-size:12px; font-weight:800; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .kpi .l .material-symbols-outlined{ font-size:16px; color:var(--brown2); }
  .kpi .v{ font-size:27px; font-weight:900; color:var(--ink); margin-top:7px; } .kpi .v small{ font-size:13px; color:var(--muted); font-weight:700; }
  .kpi .d{ font-size:12px; font-weight:800; margin-top:4px; } .up{ color:var(--green); } .down{ color:var(--red); }
  .chart{ width:100%; height:290px; }
  /* ===== production schedule board (signature) ===== */

  .board-in{ min-width:820px; }
  .lane{ display:grid; grid-template-columns:120px 1fr; gap:0; border-bottom:1px solid var(--line); }
  .lane:last-child{ border-bottom:0; }
  .lane-h{ padding:14px 12px; font-weight:900; color:var(--ink); font-size:13px; display:flex; align-items:center; gap:8px; border-right:1px solid var(--line); background:#fbf6ee; }

  .oven{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:15px; border-top:5px solid var(--brown); }
  .oven-h{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; } .oven-h b{ color:var(--ink); font-size:15px; }
  .st{ font-size:11px; font-weight:800; border-radius:999px; padding:3px 10px; }
  .s-bake{ background:var(--redbg); color:var(--red); } .s-proof{ background:var(--amberbg); color:var(--amber); } .s-idle{ background:#f1f5f9; color:#64748b; } .s-cool{ background:var(--bluebg); color:var(--blue); }
  .oven .prod{ font-size:14px; font-weight:800; color:var(--ink); margin:2px 0 4px; }
  .oven .meta{ font-size:12px; color:var(--muted); }

  .fs{ display:grid; grid-template-columns:1fr 330px; gap:18px; align-items:start; }
  .sale-feed{ display:flex; flex-direction:column; }
  .sale{ display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--line); }

  .sale .qty{ font-weight:800; color:var(--body); font-size:13px; white-space:nowrap; }
  .sale .amt{ font-weight:900; color:var(--brown); font-size:15px; white-space:nowrap; }
  .live{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:800; color:var(--green); }

  .stat-list{ display:flex; flex-direction:column; gap:12px; }
  .mini{ background:#fbf6ee; border:1px solid var(--line); border-radius:14px; padding:13px 15px; }
  .mini .l{ font-size:12px; font-weight:800; color:var(--muted); } .mini .v{ font-size:22px; font-weight:900; color:var(--ink); margin-top:3px; } .mini .v small{ font-size:12px; color:var(--brown2); font-weight:800; }
  /* stock bars */
  .stk{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
  .si{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; } .si b{ color:var(--ink); font-size:14px; }
  .bar{ height:9px; border-radius:999px; background:var(--line); overflow:hidden; margin:9px 0 7px; } .bar span{ display:block; height:100%; border-radius:999px; }
  .si small{ font-size:11px; color:var(--muted); } .low{ font-size:10px; font-weight:900; color:var(--red); background:var(--redbg); border-radius:6px; padding:2px 7px; }
  .ok{ font-size:10px; font-weight:900; color:var(--green); background:var(--greenbg); border-radius:6px; padding:2px 7px; }
  /* generic table */
  .tblwrap{ overflow-x:auto; }
  table.tbl{ width:100%; border-collapse:collapse; min-width:560px; font-size:13px; }
  table.tbl th{ text-align:left; font-size:11px; font-weight:900; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; padding:10px 12px; border-bottom:2px solid var(--line); white-space:nowrap; }
  table.tbl td{ padding:11px 12px; border-bottom:1px solid var(--line); color:var(--body); }
  table.tbl tr:last-child td{ border-bottom:0; }
  table.tbl td b{ color:var(--ink); }
  .chipm{ font-size:11px; font-weight:800; border-radius:999px; padding:2px 9px; }
  .c-brown{ background:var(--amberbg); color:var(--brown2); } .c-green{ background:var(--greenbg); color:var(--green); } .c-red{ background:var(--redbg); color:var(--red); } .c-blue{ background:var(--bluebg); color:var(--blue); } .c-gray{ background:#f1f5f9; color:#64748b; }
  /* semi list */
  .semi{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
  .sc{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:15px; }
  .sc-h{ display:flex; align-items:center; gap:10px; margin-bottom:8px; } .sc-h .ic{ width:40px; height:40px; border-radius:11px; background:#fbe4cf; color:var(--brown); display:grid; place-content:center; flex:none; } .sc-h .ic .material-symbols-outlined{ font-size:22px; }
  .sc-h b{ color:var(--ink); font-size:15px; } .sc-h small{ display:block; color:var(--muted); font-size:11px; }
  .sc-row{ display:flex; justify-content:space-between; font-size:12px; padding:4px 0; color:var(--body); } .sc-row b{ color:var(--ink); }
  .stage-dots{ display:flex; gap:5px; margin-top:9px; } .stage-dots i{ flex:1; height:6px; border-radius:999px; background:var(--line); } .stage-dots i.on{ background:var(--brown2); }
  /* rank list */
  .rank{ display:flex; align-items:center; gap:12px; padding:9px 0; }
  .rank .no{ width:26px; height:26px; border-radius:8px; background:var(--amberbg); color:var(--brown2); font-weight:900; display:grid; place-content:center; flex:none; font-size:13px; }
  .rank b{ width:120px; color:var(--ink); font-size:13px; }
  .alert{ display:flex; align-items:flex-start; gap:11px; padding:12px 0; border-bottom:1px solid var(--line); } .alert:last-child{ border-bottom:0; }
  .alert .ai{ width:34px; height:34px; border-radius:10px; display:grid; place-content:center; flex:none; } .alert .ai .material-symbols-outlined{ font-size:19px; }
  .alert b{ color:var(--ink); font-size:13px; display:block; } .alert small{ color:var(--muted); font-size:12px; }
  @media (max-width:900px){ .fs{ grid-template-columns:1fr; } }
  @media (max-width:560px){ .tabs button span.lb{ display:none; } .tabs button{ padding:9px 11px; } .brand small{ display:none; } }
</style>
</head>

/* ---- screens ---- */
function kpiRow(){
  return '<div class="kpis">'+KPI.map(function(k){
    return '<div class="kpi"><div class="l"><span class="material-symbols-outlined">'+k[0]+'</span>'+k[1]+'</div><div class="v">'+k[2]+' <small>'+k[3]+'</small></div><div class="d '+k[5]+'">'+k[4]+'</div></div>';
  }).join("")+'</div>';
}
function boardHTML(){
  var head='<div class="tl-h"><div class="sp"></div><div class="cols">'+SLOTS.map(function(s){return '<span>'+s+'</span>';}).join("")+'</div></div>';
  var lanes=LANES.map(function(l){
    var slots=[];
    for(var i=0;i<8;i++) slots[i]="";
    l[1].forEach(function(b){
      slots[b[0]]='<div class="batch '+b[2]+'" style="grid-column:span '+b[3]+';">'+b[3+1]+(b[5]?'<small>'+b[5]+'</small>':'')+'</div>';
    });
    var cells='';
    for(var j=0;j<8;j++){ cells+='<div class="slot">'+(slots[j]||'')+'</div>'; }
    return '<div class="lane"><div class="lane-h"><span class="material-symbols-outlined">conveyor_belt</span>'+l[0]+'</div><div class="slots">'+cells+'</div></div>';
  }).join("");
  return '<div class="board"><div class="board-in">'+head+lanes+'</div></div>'+
    '<div class="lgd"><span><i style="background:#a16207"></i>打麵</span><span><i style="background:#b45309"></i>醒發/發酵</span><span><i style="background:#c2410c"></i>烘烤</span><span><i style="background:#0e7490"></i>冷卻</span><span><i style="background:#15803d"></i>包裝完成</span></div>';
}
function ovensHTML(){

    return '<div class="oven"><div class="oven-h"><b>'+o[0]+'</b><span class="st '+o[3]+'">'+o[4]+'</span></div>'+

      '<div class="prog '+o[6]+'"><span style="width:'+o[5]+'%"></span></div>'+
      '<div class="meta" style="text-align:right;font-weight:800;color:var(--brown2)">'+o[5]+'%</div></div>';
  }).join("")+'</div>';
}
function saleFeed(){
  return SALES.map(function(s){
    return '<div class="sale"><span class="em">'+s[0]+'</span><div class="nm"><b>'+s[1]+'</b><small>'+s[2]+'</small></div><span class="qty">'+s[3]+'</span><span class="amt">'+money(s[4])+'</span></div>';
  }).join("");

function stockHTML(){
  return '<div class="stk">'+STOCK.map(function(s){
    var pct=Math.min(100,Math.round(s[1]/(s[2]*1.6)*100)); var low=s[1]<s[2];
    return '<div class="si"><div style="display:flex;justify-content:space-between;align-items:center;"><b>'+s[0]+'</b>'+(low?'<span class="low">叫貨</span>':'<span class="ok">充足</span>')+'</div>'+
      '<div class="bar"><span style="width:'+pct+'%;background:'+(low?'var(--red)':'var(--brown2)')+'"></span></div>'+
      '<small>庫存 '+s[1]+' '+s[3]+' · 安全量 '+s[2]+' '+s[3]+'</small></div>';
  }).join("")+'</div>';
}

/* ---- charts ---- */
var charts=[];
function initChart(id,opt){ var el=document.getElementById(id); if(!el||!window.echarts) return; var c=echarts.init(el); c.setOption(opt); charts.push(c); }
var axC="#a48a6e", splitC="#f0e6d6";
function draw(i){
  charts.forEach(function(c){ try{c.dispose();}catch(e){} }); charts=[];
  if(!window.echarts) return;
  if(i===0){
    initChart("cRev",{grid:{left:6,right:16,top:20,bottom:6,containLabel:true},tooltip:{trigger:"axis"},
      xAxis:{type:"category",data:["07","09","11","13","15","17","19"],axisLabel:{color:axC}},
      yAxis:{type:"value",splitLine:{lineStyle:{color:splitC}},axisLabel:{color:axC}},
      series:[{type:"bar",data:[3200,7800,9600,5200,6100,8400,5880],itemStyle:{color:"#92400e",borderRadius:[6,6,0,0]}}]});
  } else if(i===2){
    initChart("cLoad",{grid:{left:6,right:16,top:20,bottom:6,containLabel:true},tooltip:{trigger:"axis"},legend:{data:["已排","可用"],textStyle:{color:axC}},
      xAxis:{type:"category",data:["1號爐","2號爐","3號爐","發酵A","發酵B"],axisLabel:{color:axC}},
      yAxis:{type:"value",max:100,splitLine:{lineStyle:{color:splitC}},axisLabel:{color:axC,formatter:"{value}%"}},
      series:[{name:"已排",type:"bar",stack:"x",data:[85,72,40,63,41],itemStyle:{color:"#b45309",borderRadius:[0,0,0,0]}},
              {name:"可用",type:"bar",stack:"x",data:[15,28,60,37,59],itemStyle:{color:"#ece0d0"}}]});
  } else if(i===4){
    initChart("cUse",{tooltip:{trigger:"item"},legend:{bottom:0,textStyle:{fontSize:11,color:axC}},
      series:[{type:"pie",radius:["46%","72%"],center:["50%","44%"],itemStyle:{borderColor:"#fff",borderWidth:2},label:{show:false},
        data:[{name:"麵粉類",value:38,itemStyle:{color:"#92400e"}},{name:"乳製 / 蛋",value:26,itemStyle:{color:"#b45309"}},{name:"糖 / 內餡",value:20,itemStyle:{color:"#d97706"}},{name:"水果 / 其他",value:16,itemStyle:{color:"#f0d9b5"}}]}]});
  } else if(i===5){
    initChart("cDay",{grid:{left:6,right:16,top:24,bottom:6,containLabel:true},tooltip:{trigger:"axis"},legend:{data:["營收(千)","損耗率%"],textStyle:{color:axC}},
      xAxis:{type:"category",data:["週一","週二","週三","週四","週五","週六","週日"],axisLabel:{color:axC}},
      yAxis:[{type:"value",splitLine:{lineStyle:{color:splitC}},axisLabel:{color:axC}},{type:"value",max:12,axisLabel:{color:axC,formatter:"{value}%"},splitLine:{show:false}}],
      series:[{name:"營收(千)",type:"bar",data:[38,41,39,44,52,58,46],itemStyle:{color:"#92400e",borderRadius:[6,6,0,0]}},
              {name:"損耗率%",yAxisIndex:1,type:"line",smooth:true,data:[6.2,5.8,5.5,5.1,4.9,4.6,4.8],itemStyle:{color:"#c2410c"},lineStyle:{width:3}}]});
    initChart("cWaste",{tooltip:{trigger:"item"},legend:{bottom:0,textStyle:{fontSize:11,color:axC}},
      series:[{type:"pie",radius:["46%","72%"],center:["50%","44%"],itemStyle:{borderColor:"#fff",borderWidth:2},label:{show:false},
        data:[{name:"未售出報廢",value:42,itemStyle:{color:"#92400e"}},{name:"烤焙失敗",value:24,itemStyle:{color:"#b45309"}},{name:"過期原料",value:20,itemStyle:{color:"#d97706"}},{name:"作業耗損",value:14,itemStyle:{color:"#f0d9b5"}}]}]});

}

/* ---- nav / show ---- */
var tabs=document.getElementById("tabs"),view=document.getElementById("view"),vt=document.getElementById("vt"),vs=document.getElementById("vs");
tabs.innerHTML=NAV.map(function(m,i){ return '<button data-i="'+i+'" class="'+(i===0?"on":"")+'"><span class="material-symbols-outlined">'+m[0]+'</span><span class="lb">'+m[1]+'</span></button>'; }).join("");
function show(i){
  tabs.querySelectorAll("button[data-i]").forEach(function(b){ b.classList.toggle("on",b.dataset.i===String(i)); });
  vt.textContent=NAV[i][1]; vs.textContent=NAV[i][2];
  view.innerHTML=SCREENS[i]();
  draw(i);
}
tabs.addEventListener("click",function(e){ var b=e.target.closest("button[data-i]"); if(!b) return; show(+b.dataset.i); });
window.addEventListener("resize",function(){ charts.forEach(function(c){ c.resize(); }); });
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m)return;var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
