<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>配方管理系統（Recipe Management System）｜Jvision 系統 Demo</title>
  <meta name="description" content="配方版本控管、設備自動下載與異常配方攔截的製造現場平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root{
      --color-primary:#0D9488;
      --color-on-primary:#000000;
      --color-secondary:#2DD4BF;
      --color-on-secondary:#0F172A;
      --color-accent:#D97706;
      --color-on-accent:#000000;
      --color-background:#F0FDFA;
      --color-foreground:#134E4A;
      --color-card:#FFFFFF;
      --color-card-foreground:#134E4A;
      --color-muted:#E8F1F4;
      --color-muted-foreground:#475569;
      --color-border:#5EEAD4;
      --color-destructive:#DC2626;
      --color-on-destructive:#FFFFFF;
      --color-ring:#0D9488;

      --blue:#0D9488;
      --ink:#134E4A;
      --muted:#475569;
      --line:#99E9DE;

      --ok:#15803D;
      --warn:#A65305;
      --bad:#B91C1C;
      --info:#1D4ED8;
      --card:#FFFFFF;
      --bg:#F0FDFA;
      --shadow:0 1px 2px rgba(15,118,110,.07),0 12px 30px rgba(15,118,110,.07);
      --shadow-hover:0 2px 4px rgba(15,118,110,.08),0 18px 36px rgba(15,118,110,.12);
      --display:"Cormorant Garamond",serif;
      --body:"Crimson Pro","Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
      --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    html,body{margin:0;padding:0;min-height:100%}
    body{
      background:
        linear-gradient(rgba(13,148,136,.028) 1px,transparent 1px),
        linear-gradient(90deg,rgba(13,148,136,.028) 1px,transparent 1px),
        var(--color-background);
      background-size:32px 32px;
      color:var(--color-foreground);
      font-family:var(--body);
      font-size:16px;
      line-height:1.45;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    button,a{font:inherit}
    a{color:inherit;text-decoration:none}
    button{cursor:pointer}
    button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
      outline:3px solid var(--color-ring);
      outline-offset:3px;
    }
    ::selection{background:#99F6E4;color:#042F2E}
    .material-symbols-outlined{
      font-family:"Material Symbols Outlined";
      font-weight:normal;
      font-style:normal;
      font-size:20px;
      line-height:1;
      vertical-align:middle;
      font-variation-settings:"FILL" 0,"wght" 450,"GRAD" 0,"opsz" 24;
    }

    .topbar{
      position:sticky;
      top:0;
      z-index:30;
      border-bottom:1px solid rgba(13,148,136,.35);
      background:rgba(255,255,255,.94);
      box-shadow:0 4px 18px rgba(15,118,110,.07);
      backdrop-filter:blur(16px);
    }
    .topbar-inner{
      max-width:1440px;
      margin:0 auto;
      padding:13px 24px 11px;
      display:flex;
      align-items:center;
      gap:18px;
    }
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .brand .logo{
      width:42px;
      height:42px;
      display:grid;
      place-items:center;
      flex:none;
      color:#042F2E;
      background:var(--color-secondary);
      border:1px solid #0F766E;
      border-radius:4px;
      box-shadow:4px 4px 0 #134E4A;
    }
    .brand .logo .material-symbols-outlined{font-size:23px}
    .brand h1{
      margin:0;
      font-family:var(--display);
      font-size:20px;
      font-weight:700;
      line-height:1.05;
      letter-spacing:.01em;
    }
    .brand .sub{
      margin-top:3px;
      color:var(--color-muted-foreground);
      font-family:"Cinzel",serif;
      font-size:9px;
      font-weight:600;
      letter-spacing:.13em;
      text-transform:uppercase;
    }
    .topbar-right{
      margin-left:auto;
      display:flex;
      align-items:center;
      gap:9px;
      min-width:0;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 10px;
      border:1px solid #5EEAD4;
      border-radius:3px;
      background:#ECFDF5;
      color:#065F46;
      font-size:13px;
      font-weight:600;
      white-space:nowrap;
    }
    .avatar{
      width:36px;
      height:36px;
      display:grid;
      place-items:center;
      flex:none;
      border:1px solid #0F766E;
      border-radius:50%;
      background:#CCFBF1;
      color:#134E4A;
      font-family:var(--display);
      font-size:15px;
      font-weight:700;
    }

    nav.tabs{
      max-width:1440px;
      margin:0 auto;
      padding:0 24px;
      display:flex;
      overflow-x:auto;
      scrollbar-width:thin;
      scrollbar-color:#5EEAD4 transparent;
    }
    nav.tabs button{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      min-height:44px;
      padding:9px 17px 10px;
      border:0;
      border-bottom:3px solid transparent;
      background:transparent;
      color:#475569;
      font-size:14px;
      font-weight:600;
      white-space:nowrap;
      transition:color .22s ease,background .22s ease,border-color .22s ease;
    }
    nav.tabs button:hover{background:#F0FDFA;color:#0F766E}
    nav.tabs button.active{
      border-bottom-color:var(--color-primary);
      background:#ECFDF5;
      color:#115E59;
    }
    nav.tabs button.active:after{
      content:"";
      position:absolute;
      right:8px;
      top:8px;
      width:5px;
      height:5px;
      border-radius:50%;
      background:var(--color-accent);
    }
    nav.tabs button .material-symbols-outlined{font-size:19px}

    main{max-width:1440px;margin:0 auto;padding:26px 24px 72px}
    .screen-head{
      position:relative;
      display:flex;
      align-items:flex-end;
      gap:18px;
      margin:2px 0 22px;
      padding:0 0 17px 18px;
      border-bottom:1px solid var(--line);
    }
    .screen-head:before{
      content:"";
      position:absolute;
      left:0;
      top:3px;
      bottom:18px;
      width:4px;
      background:var(--color-primary);
    }
    .screen-head .st{min-width:0}
    .screen-head h2{
      margin:0;
      color:#0F3D3A;
      font-family:var(--display);
      font-size:clamp(27px,2.4vw,38px);
      font-weight:700;
      line-height:1;
      letter-spacing:-.015em;
    }
    .screen-head p{
      max-width:760px;
      margin:7px 0 0;
      color:var(--color-muted-foreground);
      font-size:15px;
    }
    .screen-head .tag{
      margin-left:auto;
      padding:6px 10px;
      border:1px solid #F2B866;
      border-radius:3px;
      background:#FFF7E6;
      color:#8A4706;
      font-family:"Cinzel",var(--body);
      font-size:10px;
      font-weight:600;
      letter-spacing:.08em;
      text-transform:uppercase;
      white-space:nowrap;
    }

    .grid{display:grid;gap:16px;min-width:0}
    .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .g23{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
    .g32{grid-template-columns:minmax(280px,1fr) minmax(0,2fr)}

    .card,.kpi,.eqcard,.rcard,.alert{
      transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease,background-color .22s ease;
    }
    .card{
      min-width:0;
      padding:19px;
      border:1px solid var(--line);
      border-radius:6px;
      background:var(--color-card);
      color:var(--color-card-foreground);
      box-shadow:var(--shadow);
    }
    .card:hover{border-color:#2DD4BF;box-shadow:var(--shadow-hover)}
    .card h3{
      margin:0 0 15px;
      display:flex;
      align-items:center;
      gap:8px;
      color:#134E4A;
      font-family:var(--display);
      font-size:19px;
      font-weight:700;
      line-height:1.15;
    }
    .card h3 .material-symbols-outlined{
      color:#0F766E;
      font-size:20px;
    }
    .card .sub{
      margin-left:auto;
      color:var(--color-muted-foreground);
      font-family:var(--body);
      font-size:13px;
      font-weight:400;
      text-align:right;
    }

    .kpi{
      position:relative;
      min-width:0;
      min-height:136px;
      padding:17px 18px 16px;
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:5px;
      background:#FFFFFF;
      box-shadow:var(--shadow);
    }
    .kpi:after{
      content:"";
      position:absolute;
      right:-28px;
      bottom:-42px;
      width:95px;
      height:95px;
      border:14px solid rgba(45,212,191,.13);
      border-radius:50%;
    }
    .kpi:hover{transform:translateY(-3px);border-color:#2DD4BF;box-shadow:var(--shadow-hover)}
    .kpi .lbl{
      position:relative;
      z-index:1;
      display:flex;
      align-items:center;
      gap:7px;
      color:#475569;
      font-size:13px;
      font-weight:600;
    }
    .kpi .lbl .material-symbols-outlined{color:#0F766E;font-size:18px}
    .kpi .val{
      position:relative;
      z-index:1;
      margin-top:9px;
      color:#0F3D3A;
      font-family:var(--display);
      font-size:34px;
      font-weight:700;
      font-variant-numeric:tabular-nums lining-nums;
      letter-spacing:-.02em;
      line-height:1;
    }
    .kpi .val small{
      color:#475569;
      font-family:var(--body);
      font-size:14px;
      font-weight:600;
      letter-spacing:0;
    }
    .kpi .delta{
      position:relative;
      z-index:1;
      display:inline-flex;
      align-items:center;
      gap:4px;
      margin-top:9px;
      font-size:12px;
      font-weight:600;
    }
    .up{color:#166534}.down{color:#B91C1C}.flat{color:#475569}
    .chart{width:100%;height:290px}
    .chart.sm{height:230px}

    .scroll{overflow-x:auto;overscroll-behavior-inline:contain}
    table{
      width:100%;
      border-collapse:collapse;
      color:#183F3C;
      font-size:14px;
      font-variant-numeric:tabular-nums;
    }
    th,td{
      padding:11px 13px;
      border-bottom:1px solid #B9EEE7;
      text-align:left;
      white-space:nowrap;
    }
    th{
      border-top:1px solid #99E9DE;
      background:#E6FAF7;
      color:#315C59;
      font-family:"Cinzel",var(--body);
      font-size:10px;
      font-weight:600;
      letter-spacing:.065em;
      text-transform:uppercase;
    }
    tbody tr{transition:background-color .18s ease}
    tbody tr:hover{background:#F0FDFA}
    td:nth-child(n+3){font-variant-numeric:tabular-nums}
    .mono{
      font-family:var(--mono);
      font-size:12px;
      font-weight:600;
      font-variant-numeric:tabular-nums;
    }
    .diff td:nth-child(2),.diff td:nth-child(3),
    .matrix td:not(:first-child){text-align:center}

    .badge{
      display:inline-flex;
      align-items:center;
      gap:5px;
      min-height:24px;
      padding:3px 8px;
      border:1px solid transparent;
      border-radius:3px;
      font-size:12px;
      font-weight:600;
      line-height:1.2;
      white-space:nowrap;
    }
    .badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
    .b-ok{border-color:#86D8A0;background:#ECFDF3;color:#166534}
    .b-warn{border-color:#F3C36D;background:#FFF8E7;color:#92400E}
    .b-bad{border-color:#F4A3A3;background:#FFF1F2;color:#B91C1C}
    .b-info{border-color:#93B4F4;background:#EFF6FF;color:#1E40AF}
    .b-mut{border-color:#CBD5E1;background:#F1F5F9;color:#475569}
    .b-acc{border-color:#79E1D3;background:#ECFDF5;color:#0F766E}

    .board{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:13px;
      min-width:760px;
    }
    .col{
      min-width:0;
      padding:12px;
      border:1px solid #99E9DE;
      border-radius:5px;
      background:#F5FFFD;
    }
    .col-head{
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom:11px;
      padding:2px 2px 9px;
      border-bottom:1px solid #B9EEE7;
      color:#134E4A;
      font-size:13px;
      font-weight:700;
    }
    .col-head .dot{width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 3px #fff}
    .col-head .cnt{
      margin-left:auto;
      min-width:25px;
      padding:2px 7px;
      border:1px solid #99E9DE;
      border-radius:3px;
      background:#fff;
      color:#475569;
      font-family:var(--mono);
      font-size:10px;
      text-align:center;
    }
    .rcard{
      margin-bottom:9px;
      padding:12px;
      border:1px solid #B9EEE7;
      border-radius:4px;
      background:#fff;
      box-shadow:0 2px 8px rgba(15,118,110,.06);
    }
    .rcard:last-child{margin-bottom:0}
    .rcard:hover{transform:translateY(-2px);border-color:#2DD4BF;box-shadow:0 8px 18px rgba(15,118,110,.11)}
    .rcard .rid{
      color:#0F766E;
      font-family:var(--mono);
      font-size:11px;
      font-weight:700;
      letter-spacing:.02em;
    }
    .rcard .rname{
      margin:4px 0 8px;
      color:#173F3C;
      font-size:14px;
      font-weight:600;
      white-space:normal;
    }
    .rcard .rmeta,.rcard .rfoot{
      display:flex;
      align-items:center;
      gap:6px;
      flex-wrap:wrap;
    }
    .rcard .rmeta{color:#475569;font-size:11px}
    .rcard .rfoot{margin-top:9px}
    .mini-ava{
      width:23px;
      height:23px;
      display:grid;
      place-items:center;
      flex:none;
      border:1px solid #5EEAD4;
      border-radius:50%;
      background:#CCFBF1;
      color:#115E59;
      font-size:10px;
      font-weight:700;
    }

    .tl{position:relative;padding-left:24px}
    .tl:before{
      content:"";
      position:absolute;
      left:7px;
      top:5px;
      bottom:5px;
      width:1px;
      background:#5EEAD4;
    }
    .tl-item{position:relative;padding:0 0 18px}
    .tl-item:last-child{padding-bottom:0}
    .tl-item .dot{
      position:absolute;
      left:-23px;
      top:3px;
      width:14px;
      height:14px;
      border:3px solid #fff;
      border-radius:50%;
      box-shadow:0 0 0 1px #5EEAD4;
    }
    .tl-item .tt{color:#134E4A;font-size:14px;font-weight:700}
    .tl-item .td{margin-top:2px;color:#475569;font-size:13px}
    .tl-item .tm{
      margin-top:3px;
      color:#526A78;
      font-family:var(--mono);
      font-size:11px;
      font-variant-numeric:tabular-nums;
    }

    .diff{font-family:var(--mono);font-size:12px}
    .diff td{white-space:nowrap}
    .d-old{background:#FFF1F2;color:#991B1B;text-decoration:line-through}
    .d-new{background:#ECFDF3;color:#166534;font-weight:700}
    .d-same{color:#475569}

    .matrix{min-width:640px;border-collapse:separate;border-spacing:0}
    .matrix th,.matrix td{text-align:center;border:0;border-right:1px solid #B9EEE7;border-bottom:1px solid #B9EEE7}
    .matrix th{border-top:1px solid #99E9DE}
    .matrix th:first-child,.matrix td:first-child{
      position:sticky;
      left:0;
      z-index:1;
      border-left:1px solid #B9EEE7;
      background:#E6FAF7;
      color:#134E4A;
      font-weight:700;
      text-align:left;
    }
    .perm{
      display:inline-flex;
      width:28px;
      height:28px;
      align-items:center;
      justify-content:center;
      border:1px solid transparent;
      border-radius:3px;
    }
    .p-full{border-color:#86D8A0;background:#ECFDF3;color:#166534}
    .p-read{border-color:#93B4F4;background:#EFF6FF;color:#1E40AF}
    .p-none{border-color:#CBD5E1;background:#F1F5F9;color:#64748B}

    .prog{
      height:8px;
      min-width:70px;
      overflow:hidden;
      border:1px solid #B9EEE7;
      border-radius:2px;
      background:#E2F3F1;
    }
    .prog>i{
      display:block;
      height:100%;
      background:linear-gradient(90deg,#2DD4BF,#0D9488);
    }

    .eqcard{
      min-width:0;
      padding:14px;
      border:1px solid #B9EEE7;
      border-radius:5px;
      background:#fff;
    }
    .eqcard:hover{transform:translateY(-2px);border-color:#2DD4BF;box-shadow:var(--shadow)}
    .eqcard .top{display:flex;align-items:center;gap:9px}
    .eqcard .top>.material-symbols-outlined{color:#0F766E}
    .eqcard .eqid{font-family:var(--mono);font-size:13px;font-weight:700}
    .eqcard .eqsub{color:#475569;font-size:12px}

    .alert{
      display:flex;
      gap:12px;
      align-items:flex-start;
      min-width:0;
      padding:13px;
      border:1px solid #F4A3A3;
      border-left:4px solid var(--bad);
      border-radius:5px;
      background:#FFFBFB;
    }
    .alert:hover{transform:translateX(3px);box-shadow:var(--shadow)}
    .alert.warn{border-color:#F3C36D;border-left-color:var(--warn);background:#FFFCF5}
    .alert.info{border-color:#93B4F4;border-left-color:var(--info);background:#F8FBFF}
    .alert .ico{
      width:35px;
      height:35px;
      display:grid;
      place-items:center;
      flex:none;
      border:1px solid #F4A3A3;
      border-radius:3px;
      background:#FFF1F2;
      color:#B91C1C;
    }
    .alert.warn .ico{border-color:#F3C36D;background:#FFF8E7;color:#92400E}
    .alert.info .ico{border-color:#93B4F4;background:#EFF6FF;color:#1E40AF}
    .alert .at{color:#173F3C;font-size:14px;font-weight:700}
    .alert .ad{margin-top:3px;color:#475569;font-size:13px;white-space:normal}
    .alert .amt{
      margin-top:5px;
      color:#526A78;
      font-family:var(--mono);
      font-size:11px;
      font-variant-numeric:tabular-nums;
    }

    .stack{display:flex;flex-direction:column;gap:12px}
    .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
    .chips{display:flex;gap:6px;flex-wrap:wrap}

    #view>.grid,#view>.card,#view>.screen-head{animation:enter .42s cubic-bezier(.2,.75,.25,1) both}
    #view>.grid:nth-child(2),#view>.card:nth-child(2){animation-delay:.06s}
    #view>.grid:nth-child(3),#view>.card:nth-child(3){animation-delay:.12s}
    .grid>.kpi,.grid>.card,.grid>.eqcard{animation:item-enter .4s cubic-bezier(.18,.89,.32,1.28) both}
    .grid>*:nth-child(2){animation-delay:.06s}
    .grid>*:nth-child(3){animation-delay:.12s}
    .grid>*:nth-child(4){animation-delay:.18s}
    .grid>*:nth-child(5){animation-delay:.24s}
    .grid>*:nth-child(6){animation-delay:.3s}
    @keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @keyframes item-enter{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}

    @media(max-width:1024px){
      .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
      .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
      .g23,.g32{grid-template-columns:1fr}
    }
    @media(max-width:768px){
      .topbar-inner{padding:11px 16px}
      nav.tabs{padding:0 10px}
      nav.tabs button{padding-inline:13px}
      main{padding:20px 16px 58px}
      .screen-head{align-items:flex-start}
      .card{padding:16px}
      .topbar-right .pill:nth-child(2){display:none}
    }
    @media(max-width:560px){
      .brand .sub{display:none}
      .brand h1{font-size:18px}
      .brand .logo{width:38px;height:38px}
      .topbar-right .pill{display:none}

        xAxis:{type:"category",data:["Etch E3","Impl I2","Litho L4","CMP C2","RTA T1","CVD D2"],axisLabel:{fontSize:11,color:"#475569"},axisLine:{lineStyle:{color:"#99E9DE"}}},
        yAxis:{type:"value",splitLine:{lineStyle:{color:"#D7F3EF"}},axisLabel:{fontSize:11,color:"#475569"}},
        series:[{type:"bar",data:[12,34,9,7,58,15],barWidth:"46%",itemStyle:{borderRadius:[2,2,0,0],color:function(p){return p.value>40?"#DC2626":"#0D9488";}}}]});
    }

    function s3(){
      var rows=cmpRows.map(function(r){
        var dev=(r.actual-r.recipe);
        var devStr=(dev>0?"+":"")+dev.toFixed(1);
        return '<tr><td>'+esc(r.p)+'</td><td class="mono" style="text-align:right">'+r.recipe+'</td><td class="mono" style="text-align:right">'+r.actual+'</td><td class="mono">'+esc(r.unit)+'</td>'+
          '<td class="mono" style="text-align:right;color:'+(r.ok?"#166534":"#B91C1C")+'">'+devStr+'</td>'+
          '<td class="mono" style="text-align:right">'+esc(r.tol)+'</td>'+
          '<td>'+(r.ok?'<span class="badge b-ok">符合</span>':'<span class="badge b-bad">超差</span>')+'</td></tr>';
      }).join("");
      var kp=[
        {lbl:"今日比對批次",ico:"fact_check",val:"156",unit:"批",delta:"+12",cls:"up"},
        {lbl:"版本一致率",ico:"verified",val:"98.6",unit:"%",delta:"+0.4pt",cls:"up"},
        {lbl:"參數超差項",ico:"report_problem",val:"3",unit:"項",delta:"CF4 流量",cls:"down"},
        {lbl:"平均偏移",ico:"straighten",val:"0.42",unit:"%",delta:"容差內",cls:"flat"}
      ].map(kpiCard).join("");
      return '<div class="grid g4" style="margin-bottom:16px">'+kp+'</div>'+
        '<div class="grid g23">'+
          '<div class="card"><h3><span class="material-symbols-outlined" aria-hidden="true">monitoring</span>RF 功率控制圖（實際 vs 配方目標）<span class="sub">ETCH-03 近 12 批</span></h3><div id="c3a" class="chart"></div></div>'+
          '<div class="card"><h3><span class="material-symbols-outlined" aria-hidden="true">radar</span>參數偏移雷達</h3><div id="c3b" class="chart"></div></div>'+
        '</div>'+
        '<div class="card" style="margin-top:16px"><h3><span class="material-symbols-outlined" aria-hidden="true">difference</span>參數逐項比對 · 批次 LOT-A72391 @ ETCH-03</h3>'+
          '<div class="scroll"><table><thead><tr><th>參數</th><th>配方目標</th><th>實際值</th><th>單位</th><th>偏移</th><th>容差</th><th>判定</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
    }
    function chart3(){
      var a=mk("c3a");
      if(a)a.setOption({tooltip:{trigger:"axis"},legend:{top:0,textStyle:{fontSize:11,color:"#475569"}},grid:{left:46,right:16,top:34,bottom:28},
        xAxis:{type:"category",data:["B1","B2","B3","B4","B5","B6","B7","B8","B9","B10","B11","B12"],axisLabel:{fontSize:10,color:"#475569"},axisLine:{lineStyle:{color:"#99E9DE"}}},
        yAxis:{type:"value",min:880,max:960,splitLine:{lineStyle:{color:"#D7F3EF"}},axisLabel:{fontSize:11,color:"#475569"}},
        series:[
          {name:"配方目標",type:"line",data:[920,920,920,920,920,920,920,920,920,920,920,920],lineStyle:{type:"dashed",color:"#475569"},symbol:"none"},
          {name:"上限 UCL",type:"line",data:[940,940,940,940,940,940,940,940,940,940,940,940],lineStyle:{type:"dotted",color:"#DC2626",width:1},symbol:"none"},
          {name:"實際值",type:"line",smooth:true,data:[918,922,915,921,919,924,916,918,912,925,918,918],itemStyle:{color:"#0D9488"},areaStyle:{color:"rgba(13,148,136,.10)"}}
        ]});
      var b=mk("c3b");
      if(b)b.setOption({tooltip:{},radar:{indicator:[
          {name:"壓力",max:2},{name:"RF功率",max:2},{name:"CF4",max:2},{name:"O2",max:2},{name:"溫度",max:2},{name:"時間",max:2}
        ],radius:"64%",axisName:{fontSize:11,color:"#475569"},splitLine:{lineStyle:{color:"#99E9DE"}},splitArea:{areaStyle:{color:["#FFFFFF","#F0FDFA"]}}},
        series:[{type:"radar",data:[
          {value:[0.4,0.2,1.8,0.0,0.3,0.0],name:"偏移量(%)",areaStyle:{color:"rgba(217,119,6,.18)"},lineStyle:{color:"#D97706"},itemStyle:{color:"#D97706"}}
        ]}]});
    }

    function s4(){
      var kp=[
        {lbl:"今日攔截事件",ico:"gpp_bad",val:"6",unit:"件",delta:"+2",cls:"down"},
        {lbl:"版本不符",ico:"sync_problem",val:"3",unit:"件",delta:"高優先",cls:"down"},
        {lbl:"越權變更",ico:"lock_open",val:"2",unit:"件",delta:"已封鎖",cls:"down"},
        {lbl:"已解除/複核",ico:"task_alt",val:"4",unit:"件",delta:"66.7%",cls:"up"}
      ].map(kpiCard).join("");
      var al=alerts.map(function(a){
        var cls=a.sev==="bad"?"":a.sev==="warn"?"warn":"info";
        return '<div class="alert '+cls+'"><div class="ico"><span class="material-symbols-outlined" aria-hidden="true">'+a.ico+'</span></div>'+
          '<div style="min-width:0"><div class="at">'+esc(a.t)+'</div><div class="ad">'+esc(a.d)+'</div><div class="amt">'+esc(a.m)+'</div></div></div>';
      }).join("");
      return '<div class="grid g4" style="margin-bottom:16px">'+kp+'</div>'+
        '<div class="grid g2">'+
          '<div class="card"><h3><span class="material-symbols-outlined" aria-hidden="true">notifications_active</span>攔截事件清單</h3><div class="stack">'+al+'</div></div>'+
          '<div class="stack">'+
            '<div class="card"><h3><span class="material-symbols-outlined" aria-hidden="true">pie_chart</span>攔截原因分佈</h3><div id="c4a" class="chart sm"></div></div>'+
            '<div class="card"><h3><span class="material-symbols-outlined" aria-hidden="true">show_chart</span>近 8 週配方錯誤事件數</h3><div id="c4b" class="chart sm"></div></div>'+
          '</div>'+
        '</div>';
    }
    function chart4(){
      var a=mk("c4a");
      if(a)a.setOption({tooltip:{trigger:"item"},legend:{bottom:0,textStyle:{fontSize:11,color:"#475569"}},
        series:[{type:"pie",radius:["40%","68%"],center:["50%","42%"],itemStyle:{borderColor:"#fff",borderWidth:3},label:{show:false},
          data:[{value:9,name:"版本不符"},{value:6,name:"越權變更"},{value:4,name:"參數超差"},{value:2,name:"下載失敗"}],
          color:["#DC2626","#D97706","#0D9488","#64748B"]}]});
      var b=mk("c4b");
      if(b)b.setOption({tooltip:{trigger:"axis"},grid:{left:38,right:16,top:20,bottom:28},
        xAxis:{type:"category",data:["W1","W2","W3","W4","W5","W6","W7","W8"],axisLabel:{fontSize:11,color:"#475569"},axisLine:{lineStyle:{color:"#99E9DE"}}},
        yAxis:{type:"value",splitLine:{lineStyle:{color:"#D7F3EF"}},axisLabel:{fontSize:11,color:"#475569"}},
        series:[{type:"line",smooth:true,data:[14,11,13,9,8,10,7,6],itemStyle:{color:"#DC2626"},areaStyle:{color:"rgba(220,38,38,.08)"},markLine:{silent:true,symbol:"none",data:[{yAxis:8,lineStyle:{color:"#15803D",type:"dashed"},label:{formatter:"目標≤8",fontSize:10,color:"#166534"}}]}}]});
    }

    function s5(){
      var head='<th>角色 \\ 功能</th>'+permCols.map(function(c){return '<th>'+esc(c)+'</th>';}).join("");
      var body=permRows.map(function(r){
        var cells=r.cells.map(function(c){
          if(c==="full")return '<td><span class="perm p-full" title="編輯" aria-label="編輯"><span class="material-symbols-outlined" style="font-size:16px">edit</span></span></td>';
          if(c==="read")return '<td><span class="perm p-read" title="唯讀" aria-label="唯讀"><span class="material-symbols-outlined" style="font-size:16px">visibility</span></span></td>';
          return '<td><span class="perm p-none" title="禁止" aria-label="禁止"><span class="material-symbols-outlined" style="font-size:16px">block</span></span></td>';
        }).join("");
        return '<tr><td>'+esc(r.role)+'</td>'+cells+'</tr>';
      }).join("");
      var tl=auditTl.map(function(t){
        return '<div class="tl-item"><span class="dot" style="background:'+t.c+'" aria-hidden="true"></span><div class="tt">'+esc(t.t)+'</div><div class="td">'+esc(t.d)+'</div><div class="tm">'+esc(t.m)+'</div></div>';
      }).join("");
      var kp=[
        {lbl:"系統帳號",ico:"group",val:"148",unit:"人",delta:"6 角色",cls:"flat"},
        {lbl:"今日稽核事件",ico:"history",val:"312",unit:"筆",delta:"+27",cls:"up"},
        {lbl:"越權嘗試",ico:"gpp_maybe",val:"2",unit:"次",delta:"已阻擋",cls:"down"},
        {lbl:"權限覆核率",ico:"fact_check",val:"100",unit:"%",delta:"季度達標",cls:"up"}
      ].map(kpiCard).join("");
      return '<div class="grid g4" style="margin-bottom:16px">'+kp+'</div>'+
        '<div class="grid g23">'+
          '<div class="card"><h3><span class="material-symbols-outlined" aria-hidden="true">grid_on</span>配方存取權限矩陣<span class="sub">編輯 / 唯讀 / 禁止</span></h3>'+
            '<div class="scroll"><table class="matrix"><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div>'+
            '<div class="row" style="margin-top:12px;font-size:12px;color:#475569"><span class="perm p-full" style="width:22px;height:22px"><span class="material-symbols-outlined" style="font-size:13px">edit</span></span>編輯'+
            '<span class="perm p-read" style="width:22px;height:22px"><span class="material-symbols-outlined" style="font-size:13px">visibility</span></span>唯讀'+
            '<span class="perm p-none" style="width:22px;height:22px"><span class="material-symbols-outlined" style="font-size:13px">block</span></span>禁止</div></div>'+
          '<div class="card"><h3><span class="material-symbols-outlined" aria-hidden="true">manage_search</span>操作稽核軌跡</h3><div class="tl">'+tl+'</div></div>'+
        '</div>';
    }

    var RENDER=[
      {html:s0,chart:chart0},
      {html:s1,chart:null},
      {html:s2,chart:chart2},
      {html:s3,chart:chart3},
      {html:s4,chart:chart4},
      {html:s5,chart:null}
    ];

    var view=document.getElementById("view");
    var tabsEl=document.getElementById("tabs");
    tabsEl.innerHTML=TABS.map(function(t,i){
      return '<button type="button" data-i="'+i+'" aria-label="'+esc(t.label)+'"><span class="material-symbols-outlined" aria-hidden="true">'+t.icon+'</span><span class="lbl-t">'+t.label+'</span></button>';
    }).join("");
    var btns=tabsEl.querySelectorAll("[data-i]");
    for(var i=0;i<btns.length;i++){
      (function(b){
        b.addEventListener("click",function(){
          var n=+b.getAttribute("data-i");
          if(location.hash!=="#v"+n){location.hash="v"+n;}else{show(n);}
        });
      })(btns[i]);
    }

    function show(i){
      disposeCharts();
      for(var k=0;k<btns.length;k++){
        var active=+btns[k].getAttribute("data-i")===i;
        btns[k].classList.toggle("active",active);
        btns[k].setAttribute("aria-current",active?"page":"false");
      }
      var h=HEADS[i];
      var r=RENDER[i];
      view.innerHTML='<div class="screen-head"><div class="st"><h2>'+esc(h.t)+'</h2><p>'+esc(h.d)+'</p></div><span class="tag">'+esc(h.tag)+'</span></div>'+r.html();
      void view.offsetHeight;
      if(r.chart)r.chart();
    }

    function resizeCharts(){
      for(var i=0;i<charts.length;i++){try{charts[i].resize();}catch(e){}}
    }
    window.addEventListener("resize",resizeCharts,{passive:true});

    window.__show=show;
    function fromHash(){
      var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
      if(!m){show(0);return;}
      var n=document.querySelectorAll("[data-i]").length||6;
      show(Math.min(+m[1],n-1));
      try{window.scrollTo(0,0);}catch(e){}
    }
    window.addEventListener("hashchange",fromHash);
    fromHash();
  })();
  </script>
</body>
</html>
