<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>配方管理系統（Recipe Management System）｜Jvision 系統 Demo</title>
  <meta name="description" content="配方版本控管、設備自動下載與異常配方攔截的製造現場平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root{
      --accent:#ea580c; --accent2:#fb923c; --accent-soft:#fff3ea;
      --ink:#1c1917; --muted:#78716c; --line:#eee3db; --bg:#f7f4f1; --card:#ffffff;
      --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
    .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;font-size:20px}
    a{color:inherit;text-decoration:none}

    /* top nav */
    .topbar{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#fffdfb,#fff);border-bottom:1px solid var(--line);box-shadow:0 1px 10px rgba(120,60,20,.04)}
    .topbar-inner{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}
    .brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;flex:none;box-shadow:0 4px 12px rgba(234,88,12,.28)}
    .brand .logo .material-symbols-outlined{font-size:22px}
    .brand h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.3px}
    .brand .sub{font-size:11px;color:var(--muted);font-weight:500}
    .topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
    .pill{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:6px 11px;border-radius:999px;white-space:nowrap}
    .avatar{width:34px;height:34px;border-radius:50%;background:#fde4d0;color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}

    nav.tabs{max-width:1360px;margin:0 auto;padding:8px 12px;display:flex;gap:8px;flex-wrap:wrap}
    nav.tabs button{flex:none;white-space:nowrap;min-width:0;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--muted);padding:8px 13px;border-radius:11px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
    nav.tabs button .material-symbols-outlined{font-size:19px}
    nav.tabs button:hover{border-color:var(--accent2);color:var(--accent)}
    nav.tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 5px 14px rgba(234,88,12,.28)}

    main{max-width:1360px;margin:0 auto;padding:16px 18px 60px}
    .screen-head{display:flex;align-items:flex-end;gap:12px;margin:6px 0 16px;flex-wrap:wrap}
    .screen-head .st{min-width:0}
    .screen-head h2{margin:0;font-size:20px;font-weight:800}
    .screen-head p{margin:3px 0 0;font-size:13px;color:var(--muted)}
    .screen-head .tag{margin-left:auto;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:6px 12px;border-radius:999px;white-space:nowrap}

    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
    .card h3{margin:0 0 12px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
    .card h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
    .card .sub{font-size:12px;color:var(--muted);font-weight:500;margin-left:auto}

    .grid{display:grid;gap:14px;min-width:0}
    .g4{grid-template-columns:repeat(4,1fr)}
    .g3{grid-template-columns:repeat(3,1fr)}
    .g2{grid-template-columns:repeat(2,1fr)}
    .g23{grid-template-columns:2fr 1fr}
    .g32{grid-template-columns:1fr 2fr}
    @media(max-width:820px){
      .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
    }

    .kpi{background:linear-gradient(160deg,#fff,#fffaf6);border:1px solid var(--line);border-radius:16px;padding:15px;min-width:0}
    .kpi .lbl{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
    .kpi .lbl .material-symbols-outlined{font-size:17px;color:var(--accent)}
    .kpi .val{font-size:26px;font-weight:900;margin-top:8px;letter-spacing:-.5px}
    .kpi .val small{font-size:13px;font-weight:700;color:var(--muted)}
    .kpi .delta{font-size:12px;font-weight:700;margin-top:5px;display:inline-flex;align-items:center;gap:3px}
    .up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--muted)}

    .chart{width:100%;height:290px}
    .chart.sm{height:230px}

    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
    th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;background:#fbf8f5}
    tbody tr:hover{background:#fffaf6}
    .mono{font-family:"Inter",monospace;font-weight:600;font-size:12px}

    .badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
    .b-ok{background:#e7f6ec;color:var(--ok)}
    .b-warn{background:#fef3e0;color:var(--warn)}
    .b-bad{background:#fdeaea;color:var(--bad)}
    .b-info{background:#e8f0fe;color:var(--info)}
    .b-mut{background:#f1ede9;color:var(--muted)}
    .b-acc{background:var(--accent-soft);color:var(--accent)}

    /* kanban */
    .board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;min-width:720px}
    .col{background:#fbf8f5;border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
    .col-head{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;margin-bottom:10px}
    .col-head .cnt{margin-left:auto;font-size:11px;font-weight:800;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted)}
    .col-head .dot{width:9px;height:9px;border-radius:50%}
    .rcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:9px;box-shadow:0 1px 4px rgba(120,60,20,.04)}
    .rcard:last-child{margin-bottom:0}
    .rcard .rid{font-size:11px;font-weight:800;color:var(--accent);font-family:monospace}
    .rcard .rname{font-size:13px;font-weight:700;margin:3px 0 6px;white-space:normal}
    .rcard .rmeta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);flex-wrap:wrap}
    .rcard .rfoot{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
    .mini-ava{width:22px;height:22px;border-radius:50%;background:#fde4d0;color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex:none}

    /* timeline */
    .tl{position:relative;padding-left:22px}
    .tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
    .tl-item{position:relative;padding:0 0 16px}
    .tl-item:last-child{padding-bottom:0}
    .tl-item .dot{position:absolute;left:-19px;top:2px;width:14px;height:14px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
    .tl-item .tt{font-size:13px;font-weight:700}
    .tl-item .td{font-size:12px;color:var(--muted);margin-top:2px}
    .tl-item .tm{font-size:11px;color:var(--muted);font-weight:600;font-family:monospace}

    /* diff */
    .diff{font-family:monospace;font-size:12.5px}
    .diff td{white-space:nowrap}
    .d-old{background:#fdeaea;color:var(--bad);text-decoration:line-through;opacity:.8}
    .d-new{background:#e7f6ec;color:var(--ok);font-weight:700}
    .d-same{color:var(--muted)}

    /* matrix */
    .matrix{min-width:640px;border-collapse:separate;border-spacing:0}
    .matrix th,.matrix td{text-align:center;border:1px solid var(--line)}
    .matrix th:first-child,.matrix td:first-child{text-align:left;font-weight:700;background:#fbf8f5;position:sticky;left:0}
    .perm{display:inline-flex;width:26px;height:26px;border-radius:8px;align-items:center;justify-content:center}
    .p-full{background:#e7f6ec;color:var(--ok)}
    .p-read{background:#e8f0fe;color:var(--info)}
    .p-none{background:#f4f0ec;color:#c4bab2}

    .prog{height:8px;border-radius:999px;background:#f0eae4;overflow:hidden;min-width:70px}
    .prog > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent2),var(--accent))}

    .eqcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;min-width:0}
    .eqcard .top{display:flex;align-items:center;gap:8px}
    .eqcard .top .material-symbols-outlined{color:var(--accent)}
    .eqcard .eqid{font-size:13px;font-weight:800}
    .eqcard .eqsub{font-size:11px;color:var(--muted)}

    .alert{display:flex;gap:11px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:12px;padding:12px;min-width:0}
    .alert.warn{border-left-color:var(--warn)}
    .alert.info{border-left-color:var(--info)}
    .alert .ico{width:34px;height:34px;border-radius:10px;background:#fdeaea;color:var(--bad);display:flex;align-items:center;justify-content:center;flex:none}
    .alert.warn .ico{background:#fef3e0;color:var(--warn)}
    .alert.info .ico{background:#e8f0fe;color:var(--info)}
    .alert .at{font-size:13px;font-weight:800}
    .alert .ad{font-size:12px;color:var(--muted);margin-top:3px;white-space:normal}
    .alert .amt{font-size:11px;color:var(--muted);font-family:monospace;margin-top:4px}

    .scroll{overflow-x:auto}
    .stack{display:flex;flex-direction:column;gap:12px}
    .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
    .chips{display:flex;gap:6px;flex-wrap:wrap}

    @media(max-width:560px){
      nav.tabs button .lbl-t{display:none}
      nav.tabs button{padding:9px 11px}
      .brand .sub{display:none}
    }
  </style>
</head>
