<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>經營情報與競爭分析系統</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;

  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#99DCD4;

  --green:#0D9488;
  --green2:#2DD4BF;
  --green-soft:#CCFBF1;
  --green-ink:#134E4A;
  --sub:#475569;
  --bg:#F0FDFA;
  --card:#FFFFFF;
  --amber:#D97706;
  --red:#DC2626;
  --slate:#475569;

  --font-display:"Cormorant Garamond","Noto Serif TC",serif;
  --font-body:"Crimson Pro","Noto Serif TC",serif;
  --font-label:"Cinzel","Noto Serif TC",serif;
  --font-mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --shadow-sm:0 1px 0 rgba(19,78,74,.08),0 4px 16px rgba(13,148,136,.05);
  --shadow-hover:0 2px 0 rgba(19,78,74,.1),0 12px 28px rgba(13,148,136,.11);
}

*{box-sizing:border-box;}
html{margin:0;padding:0;max-width:100%;overflow-x:hidden;scroll-behavior:smooth;}
body{
  margin:0;
  padding:0;
  max-width:100%;
  overflow-x:hidden;
  background:
    linear-gradient(rgba(13,148,136,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(13,148,136,.035) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--color-foreground);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit;}
a{color:inherit;text-decoration:none;}
button,a,[data-i]{-webkit-tap-highlight-color:transparent;}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
::selection{background:var(--color-secondary);color:#0F172A;}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  color:var(--color-foreground);
  background:rgba(255,255,255,.94);
  border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 rgba(19,78,74,.04);
  backdrop-filter:blur(16px);
}
.topbar::before{
  content:"";
  display:block;
  height:4px;
  background:linear-gradient(90deg,var(--color-primary) 0 72%,var(--color-accent) 72% 100%);
}
.topbar-inner{
  max-width:1440px;
  min-height:76px;
  margin:0 auto;
  padding:10px 24px;
  display:flex;
  align-items:center;
  gap:24px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:250px;}
.brand .logo{
  width:42px;
  height:42px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  color:#FFFFFF;
  background:var(--color-primary);
  border:1px solid #087B72;
  border-radius:4px;
  box-shadow:4px 4px 0 var(--color-secondary);
}
.brand .logo .material-symbols-outlined{font-size:24px;color:#FFFFFF;}
.brand .t{display:flex;min-width:0;flex-direction:column;line-height:1.2;}
.brand .t b{
  overflow:hidden;
  color:var(--color-foreground);
  font-family:var(--font-display);
  font-size:18px;
  font-weight:700;
  letter-spacing:.02em;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.brand .t span{
  margin-top:4px;
  color:var(--color-muted-foreground);
  font-family:var(--font-label);
  font-size:9px;
  font-weight:500;
  letter-spacing:.08em;
  text-transform:uppercase;
}
nav.nav{
  min-width:0;
  margin-left:auto;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:4px;
}
nav.nav button{
  min-height:42px;
  padding:9px 11px;
  display:flex;
  align-items:center;
  gap:6px;
  color:#315E5B;
  background:transparent;
  border:1px solid transparent;
  border-radius:4px;
  cursor:pointer;
  font-family:var(--font-body);
  font-size:14px;
  font-weight:600;
  line-height:1.2;
  transition:background-color .22s ease,border-color .22s ease,color .22s ease,transform .22s ease;
}
nav.nav button .material-symbols-outlined{font-size:18px;}
nav.nav button:hover{
  color:var(--color-foreground);
  background:var(--green-soft);
  border-color:var(--color-border);
  transform:translateY(-1px);
}
nav.nav button.on{
  color:#FFFFFF;
  background:var(--color-primary);
  border-color:#087B72;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.12);
}
nav.nav button.on .material-symbols-outlined{color:#FFFFFF;}

.wrap{max-width:1440px;margin:0 auto;padding:32px 24px 72px;}
#app{animation:screen-in .36s ease-out both;}
@keyframes screen-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.screen-head{
  min-height:80px;
  margin-bottom:24px;
  padding:4px 0 18px;
  display:flex;
  align-items:center;
  gap:15px;
  border-bottom:1px solid var(--line);
}
.screen-head .ic{
  width:48px;
  height:48px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  color:var(--color-primary);
  background:var(--green-soft);
  border:1px solid var(--color-border);
  border-radius:4px;
}
.screen-head .ic .material-symbols-outlined{font-size:27px;color:var(--color-primary);}
.screen-head h1{
  margin:0;
  color:var(--color-foreground);
  font-family:var(--font-display);
  font-size:clamp(25px,2.4vw,34px);
  font-weight:700;
  letter-spacing:-.015em;
  line-height:1.05;
}
.screen-head p{
  margin:6px 0 0;
  color:var(--color-muted-foreground);
  font-size:14px;
  font-weight:400;
}
.tag{
  min-height:32px;
  margin-left:auto;
  padding:6px 11px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:#71410B;
  background:#FFF4D6;
  border:1px solid #E8B85E;
  border-radius:999px;
  font-family:var(--font-label);
  font-size:10px;
  font-weight:600;
  letter-spacing:.035em;
  white-space:nowrap;
}

.grid{display:grid;gap:16px;}
.grid>*{min-width:0;}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr));}
.g-2{grid-template-columns:minmax(0,2fr) minmax(280px,1fr);}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr));}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr));}
.card,.kpi{
  min-width:0;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:6px;
  box-shadow:var(--shadow-sm);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.card:hover,.kpi:hover{
  border-color:var(--color-primary);
  box-shadow:var(--shadow-hover);
  transform:translateY(-2px);
}
.card{padding:20px;}
.card h3{
  min-height:28px;
  margin:0 0 16px;
  padding-bottom:12px;
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--color-foreground);
  border-bottom:1px solid var(--color-muted);
  font-family:var(--font-display);
  font-size:18px;
  font-weight:700;
  line-height:1.2;
}
.card h3 .material-symbols-outlined{font-size:20px;color:var(--color-primary);}
.card .sub{
  margin-left:auto;
  color:var(--color-muted-foreground);
  font-family:var(--font-body);
  font-size:13px;
  font-weight:400;
}
.kpi{position:relative;overflow:hidden;padding:18px 18px 16px;}
.kpi::before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:4px;
  background:var(--color-primary);
}
.kpi::after{
  content:"";
  position:absolute;
  top:0;
  right:0;
  width:42px;
  height:42px;
  background:linear-gradient(135deg,transparent 49%,rgba(45,212,191,.18) 50%);
  pointer-events:none;
}
.kpi .lab{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--color-muted-foreground);
  font-family:var(--font-label);
  font-size:10px;
  font-weight:600;
  letter-spacing:.04em;
}
.kpi .lab .material-symbols-outlined{font-size:18px;color:var(--color-primary);}
.kpi .val{
  margin-top:9px;
  color:var(--color-foreground);
  font-family:var(--font-display);
  font-size:34px;
  font-weight:700;
  font-variant-numeric:tabular-nums lining-nums;
  letter-spacing:-.02em;
  line-height:1;
}
.kpi .val small{
  color:var(--color-muted-foreground);
  font-family:var(--font-body);
  font-size:14px;
  font-weight:600;
  letter-spacing:0;
}
.kpi .dl{margin-top:10px;font-size:13px;font-weight:600;}
.up{color:#087B49;}
.down{color:#B91C1C;}
.flat{color:#475569;}

.chartbox{width:100%;overflow:hidden;}
.apexcharts-canvas text{fill:#475569!important;font-family:var(--font-body)!important;}
.apexcharts-gridline{stroke:#D8EBE8!important;}
.apexcharts-tooltip,.apexcharts-xaxistooltip{
  color:var(--color-foreground)!important;
  background:#FFFFFF!important;
  border:1px solid var(--line)!important;
  border-radius:4px!important;
  box-shadow:var(--shadow-hover)!important;
}
.apexcharts-legend-text{color:#475569!important;font-family:var(--font-body)!important;}
.apexcharts-series:nth-of-type(1) path{stroke:var(--color-primary);}

.tbl-wrap{
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:4px;
  scrollbar-color:var(--color-primary) var(--color-muted);
  scrollbar-width:thin;
}
table.tbl{width:100%;min-width:520px;border-collapse:collapse;font-size:14px;}
table.tbl th{
  padding:11px 12px;
  color:#315E5B;
  background:#E6F8F5;
  border-bottom:2px solid var(--color-primary);
  font-family:var(--font-label);
  font-size:10px;
  font-weight:600;
  letter-spacing:.04em;
  text-align:left;
  white-space:nowrap;
}
table.tbl td{
  padding:11px 12px;
  color:#234E4B;
  background:#FFFFFF;
  border-bottom:1px solid #DCEBE9;
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
table.tbl tbody tr:nth-child(even) td{background:#F8FCFB;}
table.tbl tbody tr:hover td{background:#ECFDF9;}
table.tbl tr:last-child td{border-bottom:0;}
table.tbl td:nth-last-child(n+1){vertical-align:middle;}
table.tbl td[style*="color:#64748b"],table.tbl td[style*="color:#475569"]{color:#475569!important;}
table.tbl td[style*="color:#15803d"]{color:#087B72!important;}

.pill{
  min-height:24px;
  padding:3px 9px;
  display:inline-flex;
  align-items:center;
  gap:5px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
  line-height:1.2;
  white-space:nowrap;
}
.p-g{color:#086A43;background:#E2F8EC;}
.p-a{color:#854D0E;background:#FFF5D8;}
.p-r{color:#A61B1B;background:#FEECEC;}
.p-b{color:#075F59;background:#DDF8F4;}
.p-s{color:#475569;background:#F1F5F9;}
.mbar{height:7px;min-width:56px;overflow:hidden;background:#D9E7E9;border-radius:999px;}
.mbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--color-primary),var(--color-secondary));border-radius:inherit;}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;}
.board .col{
  min-width:0;
  padding:12px;
  background:#F5FBFA;
  border:1px solid var(--line);
  border-radius:4px;
}
.board .col>.h{
  margin-bottom:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:var(--color-foreground);
  font-family:var(--font-label);
  font-size:11px;
  font-weight:600;
  letter-spacing:.035em;
}
.board .col>.h .n{
  min-width:25px;
  padding:2px 7px;
  color:#075F59;
  background:#FFFFFF;
  border:1px solid var(--line);
  border-radius:999px;
  font-family:var(--font-mono);
  font-size:11px;
  text-align:center;
}
.tik{
  margin-bottom:8px;
  padding:11px;
  background:#FFFFFF;
  border:1px solid var(--line);
  border-left:3px solid var(--color-primary);
  border-radius:3px;
  box-shadow:0 2px 8px rgba(19,78,74,.04);
}
.tik:last-child{margin-bottom:0;}
.tik .tt{margin-bottom:6px;color:#234E4B;font-size:14px;font-weight:600;}
.tik .mm{display:flex;align-items:center;justify-content:space-between;gap:7px;color:var(--color-muted-foreground);font-size:12px;}
.score{
  width:34px;
  height:30px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  color:#FFFFFF;
  border:2px solid rgba(255,255,255,.8);
  border-radius:3px;
  font-family:var(--font-mono);
  font-size:12px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}

.tl{position:relative;padding-left:22px;}
.tl::before{content:"";position:absolute;top:5px;bottom:5px;left:6px;width:1px;background:var(--color-primary);}
.tl .it{position:relative;padding:0 0 18px 12px;}
.tl .it:last-child{padding-bottom:0;}
.tl .it::before{
  content:"";
  position:absolute;
  top:4px;
  left:-21px;
  width:10px;
  height:10px;
  background:#FFFFFF;
  border:3px solid var(--color-primary);
  border-radius:50%;
  box-shadow:0 0 0 3px var(--green-soft);
}
.tl .it .tm{color:#475569;font-family:var(--font-mono);font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;}
.tl .it .tx{margin-top:3px;color:var(--color-foreground);font-size:14px;font-weight:600;}
.tl .it .ds{margin-top:3px;color:var(--color-muted-foreground);font-size:13px;line-height:1.5;}

.src{min-height:60px;padding:11px 0;display:flex;align-items:center;gap:11px;border-bottom:1px solid #DCEBE9;}
.src:last-child{border-bottom:0;}
.src .si{
  width:36px;
  height:36px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  color:var(--color-primary);
  background:var(--green-soft);
  border:1px solid var(--color-border);
  border-radius:4px;
}
.src .si .material-symbols-outlined{font-size:19px;color:var(--color-primary);}
.src .sm{flex:1;min-width:0;}
.src .sm b{display:block;color:#234E4B;font-size:14px;font-weight:600;line-height:1.35;}
.src .sm span{display:block;margin-top:3px;color:var(--color-muted-foreground);font-family:var(--font-mono);font-size:11px;font-variant-numeric:tabular-nums;}

.ins{
  padding:14px;
  color:var(--color-card-foreground);
  background:#F5FBFA;
  border:1px solid var(--line);
  border-left:4px solid var(--color-primary);
  border-radius:4px;
}
.ins.warn{background:#FFFAEB;border-left-color:var(--color-accent);}
.ins.risk{background:#FFF5F5;border-left-color:var(--color-destructive);}
.ins .ih{margin-bottom:6px;display:flex;align-items:center;gap:7px;color:var(--color-foreground);font-size:14px;font-weight:700;}
.ins .ih .material-symbols-outlined{font-size:19px;}
.ins p{margin:0;color:var(--color-muted-foreground);font-size:13px;line-height:1.65;}
.stack{display:flex;flex-direction:column;gap:12px;}
.legend{margin-top:10px;display:flex;flex-wrap:wrap;gap:14px;color:var(--color-muted-foreground);font-size:13px;}
.legend i{width:11px;height:11px;margin-right:5px;display:inline-block;border:1px solid rgba(19,78,74,.25);border-radius:2px;vertical-align:middle;}

.card div[style*="background:#f8fafc"]{background:#F5FBFA!important;color:#475569!important;border:1px solid var(--line);}
.card div[style*="background:#f0fdf4"]{background:#E8FAF4!important;color:#134E4A!important;border-color:#87D9CB!important;}
.card b[style*="color:#15803d"]{color:#087B72!important;font-family:var(--font-mono);}
.footer{
  max-width:1440px;
  margin:0 auto;
  padding:0 24px 32px;
  color:#475569;
  font-family:var(--font-label);
  font-size:10px;
  letter-spacing:.035em;
  text-align:right;
}

@media(max-width:1100px){
  .topbar-inner{align-items:flex-start;flex-direction:column;gap:10px;padding-bottom:12px;}
  .brand{min-width:0;}
  nav.nav{width:100%;margin-left:0;justify-content:flex-start;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin;}
  nav.nav button{flex:0 0 auto;}
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr));}
  .board{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media(max-width:820px){
  .wrap{padding:24px 18px 56px;}
  .g-2,.g-2e,.g-3{grid-template-columns:1fr;}
  .screen-head{align-items:flex-start;}
  .tag{margin-left:auto;}
}
@media(max-width:560px){
  .topbar-inner{padding:9px 14px 11px;}
  .brand .t b{font-size:16px;}
  .brand .t span{font-size:8px;}
  nav.nav button{min-height:44px;padding:9px 10px;}
  nav.nav button span.lbl{display:inline;}
  .wrap{padding:20px 14px 48px;}
  .screen-head{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;margin-bottom:18px;}
  .screen-head .ic{width:44px;height:44px;}
  .screen-head h1{font-size:25px;}
  .screen-head p{font-size:13px;}
  .screen-head .tag{grid-column:1/-1;margin:2px 0 0;width:max-content;}
  .g-kpi{grid-template-columns:1fr;gap:10px;}
  .card{padding:15px;}
  .card h3{font-size:17px;}
  .kpi{padding:16px;}
  .kpi .val{font-size:31px;}
  .board{grid-template-columns:1fr;}
  .footer{padding:0 14px 24px;text-align:left;}
}
@media(max-width:390px){
  .brand .logo{width:38px;height:38px;}
  .brand .t b{max-width:270px;font-size:15px;}
  .card .sub{display:block;margin-left:auto;font-size:11px;}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
    transition-duration:.01ms!important;
  }
  #app{animation:none;}
  .card:hover,.kpi:hover,nav.nav button:hover{transform:none;}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">insights</span></div>
      <div class="t"><b>經營情報與競爭分析系統</b><span>Business Intelligence &amp; Competitive Analysis</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</header>
<main class="wrap"><div id="app"></div></main>
<div class="footer">示範資料為虛構，僅供 UI 展示之用 · 經營企劃部 / 業務部 / 研發部</div>

<script>
"use strict";
var MODS=[
  {icon:"monitoring",name:"情報監控中心",desc:"產業新聞與競品動態即時看板"},
  {icon:"account_tree",name:"情報來源管理",desc:"來源設定與蒐集覆蓋率追蹤"},

var SCREENS=[s0,s1,s2,s3,s4,s5];
function show(i){
  clearCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  SCREENS[i]();
}
(function(){
  var nav=document.getElementById("nav");
  nav.innerHTML=MODS.map(function(m,i){return '<button data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="lbl">'+m.name+'</span></button>';}).join("");
  var bs=nav.querySelectorAll("[data-i]");
  for(var i=0;i<bs.length;i++){(function(el){el.addEventListener("click",function(){var n=+el.getAttribute("data-i");location.hash="v"+n;show(n);});})(bs[i]);}
})();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
