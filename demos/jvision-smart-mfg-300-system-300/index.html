<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>經營情報與競爭分析系統</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --green:#15803d; --green2:#4ade80; --green-soft:#dcfce7; --green-ink:#14532d;
  --ink:#0f172a; --sub:#475569; --line:#e2e8f0; --bg:#f1f5f9; --card:#ffffff;
  --amber:#d97706; --red:#dc2626; --blue:#2563eb; --slate:#64748b;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
a{color:inherit;text-decoration:none;}
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,#14532d,#15803d);color:#fff;border-bottom:3px solid var(--green2);}
.topbar-inner{max-width:1360px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand .logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.25);}
.brand .logo .material-symbols-outlined{font-size:24px;color:#fff;}
.brand .t{display:flex;flex-direction:column;min-width:0;}
.brand .t b{font-size:15px;font-weight:800;letter-spacing:.3px;white-space:nowrap;}
.brand .t span{font-size:11px;color:var(--green-soft);}
nav.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0;}
nav.nav button{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);color:#eafff0;border:1px solid rgba(255,255,255,.16);padding:8px 12px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;min-width:0;transition:.15s;}
nav.nav button .material-symbols-outlined{font-size:19px;}
nav.nav button:hover{background:rgba(255,255,255,.18);}
nav.nav button.on{background:#fff;color:var(--green-ink);border-color:#fff;}
.wrap{max-width:1360px;margin:0 auto;padding:20px 16px 60px;}
.screen-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.screen-head .ic{width:44px;height:44px;border-radius:12px;background:var(--green-soft);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.screen-head .ic .material-symbols-outlined{font-size:26px;color:var(--green);}
.screen-head h1{font-size:20px;margin:0;font-weight:800;}
.screen-head p{margin:2px 0 0;font-size:13px;color:var(--sub);}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--green-soft);color:var(--green-ink);}
.grid{display:grid;gap:14px;}
.g-kpi{grid-template-columns:repeat(4,1fr);}
.g-2{grid-template-columns:2fr 1fr;}
.g-2e{grid-template-columns:1fr 1fr;}
.g-3{grid-template-columns:repeat(3,1fr);}
@media(max-width:820px){
  .g-kpi{grid-template-columns:repeat(2,1fr);}
  .g-2,.g-2e,.g-3{grid-template-columns:1fr;}
}
.grid>*{min-width:0;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--green);}
.card .sub{font-size:12px;color:var(--sub);font-weight:500;margin-left:auto;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0;position:relative;overflow:hidden;}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--green2);}
.kpi .lab{font-size:12px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:6px;}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--green);}
.kpi .val{font-size:26px;font-weight:800;margin-top:6px;}
.kpi .val small{font-size:13px;font-weight:600;color:var(--sub);}
.kpi .dl{font-size:11px;margin-top:5px;font-weight:700;}
.up{color:var(--green);}.down{color:var(--red);}.flat{color:var(--slate);}
.chartbox{width:100%;overflow:hidden;}
.tbl-wrap{overflow-x:auto;border-radius:10px;}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
table.tbl th{text-align:left;padding:9px 10px;background:#f8fafc;color:var(--sub);font-weight:700;font-size:12px;border-bottom:1px solid var(--line);white-space:nowrap;}
table.tbl td{padding:9px 10px;border-bottom:1px solid #f1f5f9;white-space:nowrap;}
table.tbl tr:last-child td{border-bottom:none;}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;}
.p-g{background:var(--green-soft);color:var(--green-ink);}
.p-a{background:#fef3c7;color:#92400e;}
.p-r{background:#fee2e2;color:#991b1b;}
.p-b{background:#dbeafe;color:#1e40af;}
.p-s{background:#f1f5f9;color:#475569;}
.mbar{height:8px;border-radius:6px;background:#e2e8f0;overflow:hidden;min-width:56px;}
.mbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--green2));border-radius:6px;}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media(max-width:820px){.board{grid-template-columns:1fr 1fr;}}
@media(max-width:520px){.board{grid-template-columns:1fr;}}
.board .col{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0;}
.board .col > .h{font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;color:var(--green-ink);}
.board .col > .h .n{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;}
.tik{background:#fff;border:1px solid var(--line);border-left:3px solid var(--green2);border-radius:9px;padding:9px;margin-bottom:8px;}
.tik:last-child{margin-bottom:0;}
.tik .tt{font-size:12.5px;font-weight:700;margin-bottom:4px;}
.tik .mm{font-size:11px;color:var(--sub);display:flex;justify-content:space-between;gap:6px;align-items:center;flex-wrap:wrap;}
.tl{position:relative;padding-left:20px;}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl .it{position:relative;padding:0 0 16px 10px;}
.tl .it:last-child{padding-bottom:0;}
.tl .it::before{content:"";position:absolute;left:-18px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--green);border:2px solid #fff;box-shadow:0 0 0 2px var(--green-soft);}
.tl .it .tm{font-size:11px;color:var(--slate);font-weight:600;}
.tl .it .tx{font-size:13px;font-weight:600;margin-top:2px;}
.tl .it .ds{font-size:12px;color:var(--sub);margin-top:2px;}
.src{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f1f5f9;}
.src:last-child{border-bottom:none;}
.src .si{width:34px;height:34px;border-radius:9px;background:var(--green-soft);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.src .si .material-symbols-outlined{font-size:19px;color:var(--green);}
.src .sm{flex:1;min-width:0;}
.src .sm b{font-size:13px;display:block;}
.src .sm span{font-size:11px;color:var(--sub);}
.ins{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;border-left:4px solid var(--green);}
.ins.warn{border-left-color:var(--amber);}
.ins.risk{border-left-color:var(--red);}
.ins .ih{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.ins .ih .material-symbols-outlined{font-size:18px;}
.ins p{margin:0;font-size:12px;color:var(--sub);line-height:1.55;}
.score{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;font-weight:800;font-size:13px;color:#fff;}
.stack{display:flex;flex-direction:column;gap:14px;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:8px;}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:middle;}
.footer{max-width:1360px;margin:0 auto;padding:0 16px 30px;color:var(--slate);font-size:12px;}
@media(max-width:560px){
  nav.nav button span.lbl{display:none;}
  nav.nav button{padding:8px 10px;}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">insights</span></div>
      <div class="t"><b>經營情報與競爭分析系統</b><span>Business Intelligence &amp; Competitive Analysis</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</header>
<main class="wrap"><div id="app"></div></main>
<div class="footer">示範資料為虛構，僅供 UI 展示之用 · 經營企劃部 / 業務部 / 研發部</div>

<script>
"use strict";
var MODS=[
  {icon:"monitoring",name:"情報監控中心",desc:"產業新聞與競品動態即時看板"},
  {icon:"account_tree",name:"情報來源管理",desc:"來源設定與蒐集覆蓋率追蹤"},
  {icon:"insights",name:"市場占有分析",desc:"市占率與價格情報多維比較"},
  {icon:"groups",name:"競品戰情板",desc:"競爭對手動態與威脅評分"},
  {icon:"shield",name:"客供信用追蹤",desc:"客戶供應商信用與風險預警"},
  {icon:"description",name:"策略摘要推播",desc:"情報摘要與決策會議引用"}
];
var app=document.getElementById("app");
var charts=[];
function clearCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var baseChart={redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:"Inter,Noto Sans TC,sans-serif"};opt.chart=Object.assign(baseChart,opt.chart||{});var c=new ApexCharts(el,opt);c.render();charts.push(c);}
function head(i,tag){return '<div class="screen-head"><div class="ic"><span class="material-symbols-outlined">'+MODS[i].icon+'</span></div><div><h1>'+MODS[i].name+'</h1><p>'+MODS[i].desc+'</p></div><span class="tag" style="margin-left:auto"><span class="material-symbols-outlined" style="font-size:15px">bolt</span>'+tag+'</span></div>';}

/* Screen 0: 情報監控中心 */
function s0(){
  var kpis=[
    {l:"今日情報流入",v:"148",u:"則",dl:"+22 較昨日",c:"up",ic:"inbox"},
    {l:"高關注事件",v:"9",u:"件",dl:"3 件待處理",c:"down",ic:"priority_high"},
    {l:"競品動態",v:"27",u:"則",dl:"+6 本週",c:"up",ic:"groups"},
    {l:"平均反應時效",v:"5.4",u:"小時",dl:"改善 1.2h",c:"up",ic:"schedule"}
  ];
  var feed=[
    {t:"09:42",x:"競品 A 宣布華中新產線投產，產能 +18%",lv:"高",p:"p-r",src:"產業新聞"},
    {t:"08:55",x:"原物料 PP 報價週漲 3.2%，影響成本結構",lv:"中",p:"p-a",src:"價格情報"},
    {t:"08:10",x:"競品 C 於招標案報價低於市場均價 12%",lv:"高",p:"p-r",src:"標案監控"},
    {t:"昨日",x:"通路商 D 上調庫存水位，需求端回溫訊號",lv:"中",p:"p-a",src:"通路回報"},
    {t:"昨日",x:"競品 B 官網更新產品規格，主打節能機種",lv:"低",p:"p-s",src:"官網監控"}
  ];
  var html=head(0,"即時看板")+
    '<div class="grid g-kpi">'+kpis.map(function(k){return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+k.ic+'</span>'+k.l+'</div><div class="val">'+k.v+' <small>'+k.u+'</small></div><div class="dl '+k.c+'">'+esc(k.dl)+'</div></div>';}).join("")+'</div>'+
    '<div class="grid g-2" style="margin-top:14px">'+
      '<div class="card"><h3><span class="material-symbols-outlined">show_chart</span>情報流入量與威脅指數（近14日）</h3><div class="chartbox"><div id="c0a"></div></div><div class="legend"><span><i style="background:#15803d"></i>情報流入量</span><span><i style="background:#f59e0b"></i>威脅指數</span></div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>情報來源分布</h3><div class="chartbox"><div id="c0b"></div></div></div>'+
    '</div>'+
    '<div class="card" style="margin-top:14px"><h3><span class="material-symbols-outlined">notifications_active</span>即時情報動態<span class="sub">依關注度排序</span></h3>'+
      feed.map(function(f){return '<div class="src"><div class="si"><span class="material-symbols-outlined">article</span></div><div class="sm"><b>'+esc(f.x)+'</b><span>'+f.t+' · '+f.src+'</span></div><span class="pill '+f.p+'">關注 '+f.lv+'</span></div>';}).join("")+
    '</div>';
  app.innerHTML=html; void app.offsetHeight;
  mk("c0a",{chart:{type:"line",height:280},stroke:{width:[0,3],curve:"smooth"},series:[
    {name:"情報流入量",type:"column",data:[92,110,88,134,120,148,131,142,118,155,140,148,160,148]},
    {name:"威脅指數",type:"line",data:[41,44,38,52,49,58,55,60,53,64,61,66,70,63]}],
    colors:["#15803d","#f59e0b"],fill:{opacity:[0.85,1]},
    xaxis:{categories:["D1","D2","D3","D4","D5","D6","D7","D8","D9","D10","D11","D12","D13","今日"],labels:{style:{fontSize:"10px"}}},
    yaxis:[{title:{text:"則"}},{opposite:true,max:100,title:{text:"指數"}}],dataLabels:{enabled:false},legend:{show:false},grid:{borderColor:"#eef2f6"}});
  mk("c0b",{chart:{type:"donut",height:280},series:[38,26,18,12,6],labels:["產業新聞","競品官網","標案監控","價格情報","通路回報"],colors:["#15803d","#4ade80","#f59e0b","#2563eb","#94a3b8"],legend:{position:"bottom",fontSize:"12px"},dataLabels:{enabled:true,formatter:function(v){return Math.round(v)+"%";}},plotOptions:{pie:{donut:{size:"62%"}}}});
}

/* Screen 1: 情報來源管理 (flow v1) */
function s1(){
  var srcs=[
    {n:"產業新聞聚合",tp:"RSS / 爬蟲",freq:"每小時",cov:94,st:"啟用",p:"p-g",last:"12 分鐘前"},
    {n:"競品官網監控",tp:"網頁差異偵測",freq:"每 4 小時",cov:88,st:"啟用",p:"p-g",last:"38 分鐘前"},
    {n:"政府標案公告",tp:"API 介接",freq:"每日",cov:76,st:"啟用",p:"p-g",last:"2 小時前"},
    {n:"原物料報價",tp:"CSV 匯入",freq:"每日",cov:81,st:"啟用",p:"p-g",last:"3 小時前"},
    {n:"社群輿情",tp:"關鍵字監聽",freq:"即時",cov:63,st:"校準中",p:"p-a",last:"18 分鐘前"},
    {n:"展會情報",tp:"人工回報",freq:"不定期",cov:45,st:"待補齊",p:"p-r",last:"5 天前"}
  ];
  var kw=[
    {k:"競品 A / 華中產線",hit:42,tr:"up"},{k:"PP 報價",hit:31,tr:"up"},
    {k:"節能機種",hit:24,tr:"flat"},{k:"招標 / 標案",hit:19,tr:"up"},{k:"通路庫存",hit:14,tr:"down"}
  ];
  var html=head(1,"流程 · 情報來源設定")+
    '<div class="grid g-3">'+
      '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">hub</span>啟用來源</div><div class="val">4 <small>/ 6 個</small></div><div class="dl up">2 個待調整</div></div>'+
      '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">donut_large</span>整體覆蓋率</div><div class="val">78 <small>%</small></div><div class="dl up">+9% 較上月</div></div>'+
      '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">key</span>監控關鍵字</div><div class="val">128 <small>組</small></div><div class="dl flat">12 組本週新增</div></div>'+
    '</div>'+
    '<div class="grid g-2" style="margin-top:14px">'+
      '<div class="card"><h3><span class="material-symbols-outlined">account_tree</span>情報來源清單<span class="sub">蒐集覆蓋率</span></h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>來源</th><th>方式</th><th>頻率</th><th>覆蓋率</th><th>狀態</th><th>最後蒐集</th></tr></thead><tbody>'+
        srcs.map(function(s){return '<tr><td><b>'+s.n+'</b></td><td>'+s.tp+'</td><td>'+s.freq+'</td><td><div style="display:flex;align-items:center;gap:8px"><div class="mbar" style="width:70px"><i style="width:'+s.cov+'%"></i></div><span style="font-size:11px;font-weight:700">'+s.cov+'%</span></div></td><td><span class="pill '+s.p+'">'+s.st+'</span></td><td style="color:#64748b">'+s.last+'</td></tr>';}).join("")+
      '</tbody></table></div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">key</span>熱門監控關鍵字</h3>'+
        kw.map(function(w){var ar=w.tr==="up"?'<span class="material-symbols-outlined up" style="font-size:16px">trending_up</span>':w.tr==="down"?'<span class="material-symbols-outlined down" style="font-size:16px">trending_down</span>':'<span class="material-symbols-outlined flat" style="font-size:16px">trending_flat</span>';return '<div class="src"><div class="sm"><b>'+esc(w.k)+'</b><span>本週命中 '+w.hit+' 則</span></div>'+ar+'</div>';}).join("")+
        '<div style="margin-top:10px;padding:10px;background:#f8fafc;border-radius:10px;font-size:12px;color:#475569"><b style="color:#15803d">RULE-01</b> 涉及現金流且金額超過 50 萬元之情報優先處理。</div>'+
      '</div>'+
    '</div>'+
    '<div class="card" style="margin-top:14px"><h3><span class="material-symbols-outlined">bar_chart</span>各來源近 7 日蒐集則數</h3><div class="chartbox"><div id="c1a"></div></div></div>';
  app.innerHTML=html; void app.offsetHeight;
  mk("c1a",{chart:{type:"bar",height:270,stacked:false},plotOptions:{bar:{borderRadius:4,columnWidth:"55%"}},series:[
    {name:"產業新聞",data:[42,38,51,44,48,55,49]},
    {name:"競品官網",data:[12,15,10,18,14,16,13]},
    {name:"標案公告",data:[6,4,8,5,7,6,9]}],
    colors:["#15803d","#4ade80","#f59e0b"],dataLabels:{enabled:false},
    xaxis:{categories:["一","二","三","四","五","六","日"]},yaxis:{title:{text:"則"}},
    legend:{position:"top"},grid:{borderColor:"#eef2f6"},tooltip:{shared:true,intersect:false}});
}

/* Screen 2: 市場占有分析 (flow v2) */
function s2(){
  var share=[
    {n:"本公司",v:28.4,d:"+2.1",c:"up"},
    {n:"競品 A",v:24.7,d:"+3.4",c:"up"},
    {n:"競品 B",v:18.2,d:"-1.1",c:"down"},
    {n:"競品 C",v:14.6,d:"+0.8",c:"up"},
    {n:"其他",v:14.1,d:"-5.2",c:"down"}
  ];
  var price=[
    {seg:"入門機種",us:12800,a:13500,b:12200,c:11900},
    {seg:"主力機種",us:24600,a:25800,b:23900,c:22400},
    {seg:"高階機種",us:41200,a:39800,b:42500,c:38900},

var SCREENS=[s0,s1,s2,s3,s4,s5];
function show(i){
  clearCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}

}
(function(){
  var nav=document.getElementById("nav");
  nav.innerHTML=MODS.map(function(m,i){return '<button data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="lbl">'+m.name+'</span></button>';}).join("");
  var bs=nav.querySelectorAll("[data-i]");
  for(var i=0;i<bs.length;i++){(function(el){el.addEventListener("click",function(){var n=+el.getAttribute("data-i");location.hash="v"+n;show(n);});})(bs[i]);}
})();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
