<style>
:root{
  --bg:#0b1020;--panel:#111834;--panel2:#161f42;--line:#243056;
  --ink:#e6e9f5;--muted:#94a0c4;--dim:#6b78a3;
  --accent:#4f46e5;--accent2:#818cf8;--accent3:#22d3ee;
  --ok:#34d399;--warn:#fbbf24;--bad:#f87171;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:radial-gradient(1200px 600px at 80% -10%,#1b2450 0%,transparent 60%),var(--bg);
  color:var(--ink);min-height:100vh;overflow-x:hidden;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.nav{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:12px 20px;background:rgba(9,13,28,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand .logo{
  width:38px;height:38px;border-radius:10px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 18px rgba(79,70,229,.45);
}
.brand .logo .material-symbols-outlined{font-size:22px;}
.brand b{font-size:15px;letter-spacing:.3px;white-space:nowrap;}
.brand span{font-size:11px;color:var(--dim);display:block;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0;}
.tab{
  display:flex;align-items:center;gap:6px;min-width:0;
  padding:8px 12px;border-radius:9px;border:1px solid transparent;
  background:transparent;color:var(--muted);font-size:13px;cursor:pointer;
  font-family:inherit;transition:.15s;white-space:nowrap;
}
.tab .material-symbols-outlined{font-size:18px;}
.tab:hover{color:var(--ink);background:var(--panel2);}
.tab.on{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;box-shadow:0 4px 14px rgba(79,70,229,.4);}
.wrap{padding:22px 20px 60px;max-width:1400px;margin:0 auto;}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
.head h1{font-size:22px;margin:0 0 4px;font-weight:800;}
.head p{margin:0;color:var(--muted);font-size:13px;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--accent2);}
.pill .material-symbols-outlined{font-size:15px;}
.grid{display:grid;gap:14px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:2fr 1fr;}
.g32{grid-template-columns:1fr 1.6fr;}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent2);}
.sub{font-size:11px;color:var(--dim);font-weight:400;margin-left:auto;}
.kpi{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:15px;position:relative;overflow:hidden;min-width:0;}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--accent),var(--accent2));}
.kpi .lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.kpi .lab .material-symbols-outlined{font-size:16px;color:var(--accent2);}
.kpi .val{font-size:26px;font-weight:800;margin-top:8px;letter-spacing:.4px;}
.kpi .val small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px;}
.kpi .delta{font-size:11px;margin-top:5px;font-weight:600;}
.up{color:var(--ok);}.down{color:var(--bad);}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px;}
.tbl th{text-align:left;color:var(--dim);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:11.5px;}
.tbl td{padding:10px;border-bottom:1px solid rgba(36,48,86,.5);color:var(--ink);}
.tbl tr:hover td{background:rgba(79,70,229,.07);}
.tbl b{font-weight:700;}
.scroll{overflow-x:auto;}
.bdg{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;}
.b-ok{background:rgba(52,211,153,.15);color:var(--ok);}
.b-warn{background:rgba(251,191,36,.16);color:var(--warn);}
.b-bad{background:rgba(248,113,113,.16);color:var(--bad);}
.b-ind{background:rgba(129,140,248,.16);color:var(--accent2);}
.b-cy{background:rgba(34,211,238,.14);color:var(--accent3);}
.bar{height:7px;border-radius:4px;background:var(--panel2);overflow:hidden;min-width:60px;}
.bar > i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.chartbox{overflow:hidden;min-width:0;}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0;}
.mini{font-size:11px;color:var(--dim);}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.rank{width:22px;height:22px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--accent2);}
.rank.g{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px;}
.legend span{display:flex;align-items:center;gap:5px;}
.note{background:rgba(79,70,229,.1);border:1px solid rgba(129,140,248,.3);border-radius:10px;padding:11px;font-size:12px;color:var(--accent2);display:flex;gap:8px;align-items:flex-start;}
.note .material-symbols-outlined{font-size:18px;flex:0 0 auto;}
.tl{position:relative;padding-left:22px;}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tli{position:relative;padding:0 0 16px 6px;}
.tli::before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);box-shadow:0 0 0 2px var(--accent2);}
.tli .tt{font-weight:700;font-size:13px;}
.tli .td{font-size:11.5px;color:var(--muted);margin-top:3px;}
.tli .tm{font-size:10.5px;color:var(--dim);margin-top:3px;}
.step-flow{display:flex;gap:8px;flex-wrap:wrap;}
.step{flex:1;min-width:120px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;}
.step .sn{font-size:10px;color:var(--dim);font-weight:700;}
.step .st{font-size:12.5px;font-weight:700;margin-top:3px;}
.step .sr{font-size:10.5px;color:var(--accent2);margin-top:4px;}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
  .step-flow{flex-direction:column;}
}
@media(max-width:560px){
  .tab .tt{display:none;}
  .tab{padding:8px;}
  .brand span{display:none;}
}
</style>
</head>

  opt.chart.redrawOnWindowResize=false;
  opt.chart.animations={enabled:false};
  opt.chart.foreColor="#94a0c4";

  opt.chart.fontFamily='Inter,"Noto Sans TC",sans-serif';

function kpi(ic,lab,val,unit,dir,delta){
  var d=dir?('<div class="delta '+(dir==="up"?"up":"down")+'"><span class="material-symbols-outlined" style="font-size:13px;vertical-align:-2px">'+(dir==="up"?"trending_up":"trending_down")+'</span> '+delta+'</div>'):(delta?'<div class="delta" style="color:var(--dim)">'+delta+'</div>':'');
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+ic+'</span>'+lab+'</div>'+
  '<div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'+d+'</div>';
}
function step(n,t,r){return '<div class="step"><div class="sn">STEP '+n+'</div><div class="st">'+t+'</div><div class="sr">'+r+'</div></div>';}

function show(i){
  var tabs=document.querySelectorAll("[data-i]");
  for(var t=0;t<tabs.length;t++){tabs[t].classList.toggle("on",+tabs[t].getAttribute("data-i")===i);}
  clearCharts();
  var container=document.getElementById("app");
  container.innerHTML=SCR[i]();
  void container.offsetHeight;
  CH[i]();
}
var tabsEl=document.getElementById("tabs");
tabsEl.addEventListener("click",function(e){
  var b=e.target.closest("[data-i]");
  if(!b)return;
  location.hash="v"+b.getAttribute("data-i");
});

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
