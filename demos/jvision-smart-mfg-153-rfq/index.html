<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>詢比議價管理系統（RFQ）｜控制台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap');

:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;

  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;

  --bg:var(--color-background);
  --panel:var(--color-card);
  --panel2:#F1F5F9;
  --dim:#64748B;
  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --accent3:#0369A1;
  --ok:#15803D;
  --warn:#9A3412;
  --bad:var(--color-destructive);
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.05);
  --shadow-hover:0 2px 4px rgba(15,23,42,.06),0 12px 30px rgba(15,23,42,.08);
  color-scheme:light;
}

*{box-sizing:border-box;}
html{margin:0;padding:0;scroll-behavior:smooth;background:var(--bg);}
body{
  margin:0;
  padding:0;
  min-height:100vh;
  overflow-x:hidden;
  background:
    linear-gradient(rgba(37,99,235,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(37,99,235,.025) 1px,transparent 1px),
    var(--bg);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Fira Sans","Noto Sans TC",system-ui,sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit;}
button,[data-i]{cursor:pointer;}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
  font-feature-settings:"liga";
}

.nav{
  position:sticky;
  top:0;
  z-index:50;
  display:flex;
  align-items:center;
  gap:18px;
  min-height:64px;
  padding:10px clamp(16px,2.5vw,36px);
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 rgba(15,23,42,.03);
  backdrop-filter:blur(12px);
}
.brand{display:flex;align-items:center;gap:11px;min-width:236px;}
.brand .logo{
  width:40px;
  height:40px;
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  background:var(--blue);
  color:var(--color-on-primary);
  box-shadow:3px 3px 0 #BFDBFE;
}
.brand .logo .material-symbols-outlined{font-size:22px;}
.brand b{display:block;font-size:15px;font-weight:700;letter-spacing:.01em;white-space:nowrap;}
.brand span{display:block;color:var(--dim);font-size:10.5px;letter-spacing:.045em;}
.tabs{
  display:flex;
  align-items:center;
  gap:2px;
  min-width:0;
  margin-left:auto;
  padding:3px;
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:8px;
  background:#F8FAFC;
  scrollbar-width:thin;
}
.tab{
  min-width:0;
  display:flex;
  align-items:center;
  gap:6px;
  padding:7px 10px;
  border:1px solid transparent;
  border-radius:5px;
  background:transparent;
  color:var(--muted);
  font-family:inherit;
  font-size:12px;
  font-weight:500;
  white-space:nowrap;
  transition:color .2s ease,background-color .2s ease,border-color .2s ease,box-shadow .2s ease;
}
.tab .material-symbols-outlined{font-size:17px;}
.tab:hover{border-color:#CBD5E1;background:#FFFFFF;color:var(--ink);}
.tab.on{
  border-color:var(--blue);
  background:var(--blue);
  color:var(--color-on-primary);
  box-shadow:0 2px 6px rgba(37,99,235,.2);
}
.tab:focus-visible,
button:focus-visible,
a:focus-visible,
[tabindex]:focus-visible{
  outline:3px solid rgba(37,99,235,.32);
  outline-offset:2px;
  box-shadow:0 0 0 1px var(--color-ring);
}

.wrap{width:100%;max-width:1480px;margin:0 auto;padding:24px clamp(16px,2.5vw,36px) 64px;}
#app{animation:screen-in .35s ease both;}
.head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:18px;
  margin-bottom:16px;
  padding-bottom:14px;
  border-bottom:1px solid var(--line);
}
.head h1{
  margin:0 0 4px;
  color:#0F172A;
  font-size:clamp(20px,2vw,27px);
  font-weight:700;
  letter-spacing:-.025em;
  line-height:1.2;
}
.head p{max-width:760px;margin:0;color:var(--muted);font-size:12.5px;}
.pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:30px;
  padding:5px 10px;
  border:1px solid #BFDBFE;
  border-radius:5px;
  background:#EFF6FF;
  color:#1D4ED8;
  font-size:11.5px;
  font-weight:600;
  white-space:nowrap;
}
.pill .material-symbols-outlined{font-size:16px;}

.grid{display:grid;gap:12px;min-width:0;}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g23{grid-template-columns:minmax(0,2fr) minmax(280px,1fr);}
.g32{grid-template-columns:minmax(300px,1fr) minmax(0,1.6fr);}
.card,.kpi{
  min-width:0;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--panel);
  box-shadow:var(--shadow);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.card:hover,.kpi:hover{border-color:#CBD5E1;box-shadow:var(--shadow-hover);transform:translateY(-1px);}
.card{padding:15px;}
.card h3{
  display:flex;
  align-items:center;
  gap:7px;
  margin:0 0 12px;
  color:#0F172A;
  font-size:13px;
  font-weight:700;
  letter-spacing:.005em;
}
.card h3 .material-symbols-outlined{color:var(--blue);font-size:18px;}
.sub{margin-left:auto;color:var(--dim);font-size:10.5px;font-weight:400;text-align:right;}
.kpi{position:relative;overflow:hidden;padding:13px 14px 13px 17px;}
.kpi::before{content:"";position:absolute;top:0;bottom:0;left:0;width:3px;background:var(--blue);}
.kpi .lab{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11.5px;font-weight:500;}
.kpi .lab .material-symbols-outlined{color:var(--blue);font-size:16px;}
.kpi .val{
  margin-top:6px;
  color:#0F172A;
  font-family:"Fira Code",monospace;
  font-size:clamp(21px,2vw,27px);
  font-weight:700;
  font-variant-numeric:tabular-nums lining-nums;
  letter-spacing:-.045em;
  line-height:1.25;
}
.kpi .val small{margin-left:4px;color:var(--muted);font-family:"Fira Sans",sans-serif;font-size:12px;font-weight:600;letter-spacing:0;}
.kpi .delta{margin-top:4px;color:var(--muted);font-size:10.5px;font-weight:600;}
.up{color:#166534!important;}
.down{color:#9F1239!important;}

.scroll{max-width:100%;overflow-x:auto;overscroll-behavior-inline:contain;scrollbar-color:#CBD5E1 transparent;}
.tbl{width:100%;min-width:560px;border-collapse:separate;border-spacing:0;color:var(--ink);font-size:11.5px;}
.tbl th{
  position:relative;
  padding:8px 9px;
  border-top:1px solid var(--line);
  border-bottom:1px solid #CBD5E1;
  background:#F1F5F9;
  color:#334155;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.025em;
  text-align:left;
  white-space:nowrap;
}
.tbl th:first-child{border-left:1px solid var(--line);border-radius:5px 0 0 0;}
.tbl th:last-child{border-right:1px solid var(--line);border-radius:0 5px 0 0;}
.tbl td{
  padding:8px 9px;
  border-bottom:1px solid var(--line);
  background:#FFFFFF;
  color:#334155;
  vertical-align:middle;
  transition:background-color .18s ease;
}
.tbl tbody tr:hover td{background:#F8FAFC;}
.tbl tbody tr:focus-within td{background:#EFF6FF;}
.tbl b{color:#0F172A;font-weight:600;}
.tbl td:first-child,
.tbl td:nth-child(2),
.tbl td:nth-child(4),
.tbl td:nth-child(5),
.tbl td:nth-child(6),
.tbl td:nth-child(7),
.tbl td:nth-child(8){font-variant-numeric:tabular-nums;}
.tbl td:first-child,
.tbl td:nth-child(2){font-family:"Fira Code","Fira Sans",monospace;font-size:11px;}
.tbl td:nth-child(4),
.tbl td:nth-child(5),
.tbl td:nth-child(6),
.tbl td:nth-child(7){text-align:right;}

.bdg{
  display:inline-flex;
  align-items:center;
  gap:4px;
  min-height:21px;
  padding:2px 7px;
  border:1px solid currentColor;
  border-radius:4px;
  font-size:10px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
}
.b-ok{background:#F0FDF4;color:#166534;}
.b-warn{background:#FFF7ED;color:#9A3412;}
.b-bad{background:#FEF2F2;color:#B91C1C;}
.b-ind{background:#EEF2FF;color:#3730A3;}
.b-cy{background:#F0F9FF;color:#075985;}
.bar{height:6px;min-width:60px;overflow:hidden;border-radius:2px;background:#E2E8F0;}
.bar>i{display:block;height:100%;border-radius:2px;background:var(--blue);}
.chartbox{min-width:0;overflow:hidden;}
.row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0;}
.mini{color:var(--dim);font-size:10.5px;}
.dot{display:inline-block;width:8px;height:8px;border:1px solid rgba(15,23,42,.22);border-radius:2px;}
.rank{
  width:23px;
  height:23px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:1px solid #CBD5E1;
  border-radius:4px;
  background:#F8FAFC;
  color:#334155;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:700;
}
.rank.g{border-color:var(--blue);background:var(--blue);color:#FFFFFF;}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:10.5px;}
.legend span{display:flex;align-items:center;gap:5px;}
.note{
  display:flex;
  align-items:flex-start;
  gap:8px;
  padding:10px 11px;
  border:1px solid #BFDBFE;
  border-left:3px solid var(--blue);
  border-radius:5px;
  background:#EFF6FF;
  color:#1E3A8A;
  font-size:11.5px;
}
.note .material-symbols-outlined{flex:0 0 auto;font-size:17px;}

.tl{position:relative;padding-left:22px;}
.tl::before{content:"";position:absolute;top:4px;bottom:4px;left:7px;width:1px;background:#CBD5E1;}
.tli{position:relative;padding:0 0 15px 6px;}
.tli::before{
  content:"";
  position:absolute;
  top:3px;
  left:-19px;
  width:10px;
  height:10px;
  border:2px solid #FFFFFF;
  border-radius:2px;
  background:var(--blue);
  box-shadow:0 0 0 1px var(--blue);
}
.tli .tt{color:#0F172A;font-size:12px;font-weight:700;}
.tli .td{margin-top:3px;color:var(--muted);font-size:11px;}
.tli .tm{margin-top:3px;color:var(--dim);font-family:"Fira Code","Fira Sans",monospace;font-size:9.5px;font-variant-numeric:tabular-nums;}
.step-flow{display:flex;gap:8px;flex-wrap:wrap;counter-reset:flow;}
.step{position:relative;flex:1;min-width:130px;padding:10px;border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:5px;background:#F8FAFC;}
.step:not(:last-child)::after{content:"";position:absolute;top:50%;right:-9px;width:9px;border-top:1px solid #94A3B8;}
.step .sn{color:#1D4ED8;font-family:"Fira Code",monospace;font-size:9.5px;font-weight:700;letter-spacing:.05em;}
.step .st{margin-top:3px;color:#0F172A;font-size:12px;font-weight:700;}
.step .sr{margin-top:4px;color:var(--muted);font-size:10px;}

.apexcharts-canvas,.apexcharts-svg{max-width:100%!important;}
.apexcharts-text,
.apexcharts-legend-text,
.apexcharts-xaxis-label,
.apexcharts-yaxis-label{font-family:"Fira Sans","Noto Sans TC",sans-serif!important;fill:#475569!important;color:#475569!important;}
.apexcharts-gridline{stroke:#E2E8F0!important;}
.apexcharts-tooltip,
.apexcharts-xaxistooltip,
.apexcharts-yaxistooltip{
  border:1px solid #CBD5E1!important;
  background:#FFFFFF!important;
  color:#1E293B!important;
  box-shadow:var(--shadow)!important;
}
.apexcharts-tooltip-title{border-bottom:1px solid var(--line)!important;background:#F1F5F9!important;color:#0F172A!important;}
.apexcharts-tooltip-text{color:#1E293B!important;}

@keyframes screen-in{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}

@media(max-width:1100px){
  .nav{align-items:flex-start;flex-direction:column;gap:8px;}
  .tabs{width:100%;margin-left:0;}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));}
  .g23,.g32{grid-template-columns:1fr;}
}
@media(max-width:820px){
  .wrap{padding-top:18px;}
  .head{align-items:flex-start;flex-direction:column;gap:10px;}
  .g3,.g2{grid-template-columns:1fr;}
  .step-flow{flex-direction:column;}
  .step:not(:last-child)::after{display:none;}
}
@media(max-width:560px){
  .nav{padding:9px 12px;}
  .brand{min-width:0;}
  .brand .logo{width:36px;height:36px;}
  .brand span{display:none;}
  .tab{min-width:42px;min-height:42px;justify-content:center;padding:8px;}
  .tab .tt{display:none;}
  .wrap{padding-right:12px;padding-left:12px;}
  .g4{grid-template-columns:1fr;}
  .card{padding:12px;}
  .kpi{padding:12px 13px 12px 16px;}
  .head h1{font-size:21px;}
  .pill{white-space:normal;}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
    transition-duration:.01ms!important;
  }
  #app{animation:none;}
  .card:hover,.kpi:hover{transform:none;}
}
</style>
</head>
<body>
<div class="nav">

function kpi(ic,lab,val,unit,dir,delta){
  var d=dir?('<div class="delta '+(dir==="up"?"up":"down")+'"><span class="material-symbols-outlined" style="font-size:13px;vertical-align:-2px">'+(dir==="up"?"trending_up":"trending_down")+'</span> '+delta+'</div>'):(delta?'<div class="delta" style="color:var(--dim)">'+delta+'</div>':'');
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+ic+'</span>'+lab+'</div>'+
  '<div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'+d+'</div>';
}
function step(n,t,r){return '<div class="step"><div class="sn">STEP '+n+'</div><div class="st">'+t+'</div><div class="sr">'+r+'</div></div>';}

    dataLabels:{enabled:false},
    grid:{borderColor:GRID},
    tooltip:{theme:"dark"}
  });
}

var SCR=[scr0,scr1,scr2,scr3,scr4,scr5];
var CH=[charts0,charts1,charts2,charts3,charts4,charts5];

function show(i){
  var tabs=document.querySelectorAll("[data-i]");
  for(var t=0;t<tabs.length;t++){tabs[t].classList.toggle("on",+tabs[t].getAttribute("data-i")===i);}
  clearCharts();
  var container=document.getElementById("app");
  container.innerHTML=SCR[i]();
  void container.offsetHeight;
  CH[i]();
}
var tabsEl=document.getElementById("tabs");
tabsEl.addEventListener("click",function(e){
  var b=e.target.closest("[data-i]");
  if(!b)return;
  location.hash="v"+b.getAttribute("data-i");
});

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
</body>
</html>
