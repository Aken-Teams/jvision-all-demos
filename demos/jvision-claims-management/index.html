<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>保險理賠管理｜Jvision 系統 Demo</title>
  <meta name="description" content="受理、文件、風險、理算、覆核到撥付的理賠案件審查終端" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
:root{
  color-scheme:dark;
  --color-primary:#F59E0B;
  --color-on-primary:#0F172A;
  --color-secondary:#FBBF24;
  --color-on-secondary:#0F172A;
  --color-accent:#8B5CF6;
  --color-on-accent:#000000;
  --color-background:#0F172A;
  --color-foreground:#F8FAFC;
  --color-card:#222735;
  --color-card-foreground:#F8FAFC;
  --color-muted:#272F42;
  --color-muted-foreground:#CBD5E1;
  --color-border:#475569;
  --color-destructive:#EF4444;
  --color-on-destructive:#000000;
  --color-ring:#F59E0B;

  --blue:#F59E0B;
  --ink:#F8FAFC;
  --muted:#CBD5E1;
  --line:#475569;

  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --accent-soft:rgba(245,158,11,.12);
  --bg:var(--color-background);
  --panel:var(--color-card);
  --panel2:#19202E;
  --txt:var(--color-foreground);
  --mut:var(--color-muted-foreground);
  --dim:#AEBBCB;
  --ok:#4ADE80;
  --warn:#FBBF24;
  --bad:#FB7185;
  --info:#60A5FA;
  --violet:#C4B5FD;
  --shadow:0 12px 30px rgba(2,6,23,.22);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  background:
    linear-gradient(rgba(51,65,85,.16) 1px,transparent 1px),
    linear-gradient(90deg,rgba(51,65,85,.16) 1px,transparent 1px),
    var(--bg);
  background-size:32px 32px;
  color:var(--txt);
  font-family:"IBM Plex Sans","Noto Sans TC",system-ui,-apple-system,sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
::selection{background:var(--color-primary);color:var(--color-on-primary)}

.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-size:1.15em;
  font-style:normal;
  font-weight:normal;
  line-height:1;
  vertical-align:middle;
}

:where(button,a,[tabindex]):focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:30;
  display:flex;
  align-items:center;
  gap:20px;
  min-height:68px;
  padding:12px clamp(16px,3vw,40px);
  background:rgba(15,23,42,.94);
  border-bottom:1px solid var(--line);
  box-shadow:0 8px 24px rgba(2,6,23,.18);
  backdrop-filter:blur(14px);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{
  display:grid;
  flex:none;
  width:42px;
  height:42px;
  place-items:center;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border:1px solid var(--color-secondary);
  border-radius:8px;
  box-shadow:4px 4px 0 rgba(139,92,246,.38);
}
.brand b{
  display:block;
  overflow:hidden;
  font-size:15px;
  font-weight:700;
  letter-spacing:.02em;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.brand small{display:block;color:var(--mut);font-size:11px;font-weight:500;letter-spacing:.02em}
.topbar .live{
  display:flex;
  align-items:center;
  gap:8px;
  margin-left:auto;
  color:var(--mut);
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
}
.dot{
  width:9px;
  height:9px;
  background:var(--ok);
  border:2px solid var(--panel);
  border-radius:50%;
  box-shadow:0 0 0 2px rgba(74,222,128,.38);
  animation:pulse 2.2s ease-out infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 2px rgba(74,222,128,.36)}
  50%{box-shadow:0 0 0 7px rgba(74,222,128,0)}
}

.nav{
  position:sticky;
  top:68px;
  z-index:20;
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:10px clamp(16px,3vw,40px);
  background:#151C2A;
  border-bottom:1px solid var(--line);
  scrollbar-width:thin;
}
.nav button{
  position:relative;
  display:flex;
  flex:none;
  align-items:center;
  gap:8px;
  min-height:42px;
  padding:9px 13px;
  color:var(--mut);
  background:transparent;
  border:1px solid transparent;
  border-radius:6px;
  font-size:13px;
  font-weight:600;
  white-space:nowrap;
  transition:color .2s ease,background-color .2s ease,border-color .2s ease,transform .2s ease;
}
.nav button .material-symbols-outlined{color:var(--color-secondary);font-size:19px}
.nav button:hover{color:var(--txt);background:var(--color-muted);border-color:var(--line);transform:translateY(-1px)}
.nav button.on{
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-color:var(--color-secondary);
  box-shadow:3px 3px 0 rgba(139,92,246,.42);
}
.nav button.on .material-symbols-outlined{color:var(--color-on-primary)}
.nav .num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;font-weight:700;opacity:.78}

main{width:min(100%,1440px);margin:0 auto;padding:26px clamp(16px,3vw,40px) 64px}
#screen{animation:screen-in .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes screen-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.screen-head{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
  padding-bottom:16px;
  border-bottom:1px solid var(--line);
  flex-wrap:wrap;
}
.screen-head h1{margin:0;color:var(--txt);font-size:clamp(21px,2.3vw,28px);font-weight:700;letter-spacing:-.025em}
.screen-head h1 .material-symbols-outlined{margin-right:6px;color:var(--color-primary)!important;font-size:1em}
.screen-head .sub{color:var(--mut);font-size:13px;font-weight:500}
.tag{
  margin-left:auto;
  padding:4px 9px;
  color:var(--color-on-primary);
  background:var(--color-secondary);
  border:1px solid var(--color-primary);
  border-radius:4px;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.grid{display:grid;gap:12px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(300px,1fr)}
.g32{grid-template-columns:minmax(300px,1fr) minmax(0,2fr)}
.grid>*{min-width:0}

.card{
  min-width:0;
  padding:16px;
  color:var(--color-card-foreground);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:8px;
  box-shadow:var(--shadow);
  transition:border-color .22s ease,transform .22s ease,box-shadow .22s ease;
}
.card:hover{border-color:#64748B;transform:translateY(-2px);box-shadow:0 16px 34px rgba(2,6,23,.28)}
.card h3{margin:0 0 3px;font-size:14px;font-weight:700;letter-spacing:.005em}
.card .ch{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:13px;padding-bottom:10px;border-bottom:1px solid rgba(71,85,105,.62)}
.card .ch p{margin:0;color:var(--dim);font-size:12px;font-weight:500}

.kpi{position:relative;overflow:hidden;border-top:3px solid var(--color-primary)}
.kpi::after{position:absolute;right:-18px;bottom:-24px;width:78px;height:78px;content:"";border:1px solid rgba(245,158,11,.2);transform:rotate(45deg)}
.kpi .ic{
  display:grid;
  width:36px;
  height:36px;
  margin-bottom:14px;
  place-items:center;
  color:var(--color-secondary);
  background:var(--accent-soft);
  border:1px solid rgba(245,158,11,.28);
  border-radius:6px;
}
.kpi .val{font-size:clamp(24px,2.2vw,30px);font-weight:700;letter-spacing:-.035em;line-height:1.05}
.kpi .lab{margin-top:7px;color:var(--mut);font-size:12px;font-weight:600}
.kpi .delta{display:inline-flex;align-items:center;gap:4px;margin-top:9px;font-size:11px;font-weight:700}
.up{color:var(--ok)}
.down{color:var(--bad)}
.neu{color:var(--info)}

.chart{width:100%;height:300px}
.chart.sm{height:230px}
.scroll{overflow-x:auto;overscroll-behavior-inline:contain}

.tbl{width:100%;min-width:560px;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{
  padding:9px 11px;
  color:#D5DDE8;
  background:#19202E;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  font-size:10px;
  font-weight:700;
  letter-spacing:.07em;
  text-align:left;
  text-transform:uppercase;
  white-space:nowrap;
}
.tbl th:first-child{border-left:1px solid var(--line);border-radius:5px 0 0 0}
.tbl th:last-child{border-right:1px solid var(--line);border-radius:0 5px 0 0}
.tbl td{padding:11px;color:var(--txt);border-bottom:1px solid rgba(71,85,105,.52);font-weight:500;vertical-align:middle}
.tbl tbody tr{transition:background-color .18s ease}
.tbl tbody tr:hover td{background:rgba(245,158,11,.065)}
.tbl td:nth-child(4).mono,.tbl td:nth-last-child(2).mono{text-align:right}
.mono,.kid,.tm,.at{
  font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
  font-variant-numeric:tabular-nums lining-nums;
  font-feature-settings:"tnum" 1,"lnum" 1;
}

.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:4px;
  font-size:10px;
  font-weight:700;
  line-height:1.4;
  white-space:nowrap;
}
.pill::before{width:6px;height:6px;content:"";background:currentColor;border-radius:1px}
.pill.ok{color:#86EFAC;background:rgba(34,197,94,.11)}
.pill.warn{color:#FCD34D;background:rgba(245,158,11,.11)}
.pill.bad{color:#FDA4AF;background:rgba(239,68,68,.11)}
.pill.info{color:#93C5FD;background:rgba(59,130,246,.11)}
.pill.violet{color:#DDD6FE;background:rgba(139,92,246,.13)}
.pill.dim{color:#D5DDE8;background:rgba(148,163,184,.09)}
.bar{height:7px;min-width:60px;overflow:hidden;background:#111827;border:1px solid var(--line);border-radius:2px}
.bar>span{display:block;height:100%;background:var(--color-primary);border-radius:1px}

.board{display:grid;grid-template-columns:repeat(4,minmax(170px,1fr));gap:12px;min-width:0}
.board>.col{min-width:0;padding:10px;background:#19202E;border:1px solid var(--line);border-radius:6px}
.col-head{display:flex;align-items:center;justify-content:space-between;padding:0 2px 10px;color:var(--mut);font-size:12px;font-weight:700}
.col-head .cnt{min-width:24px;padding:1px 7px;color:var(--color-on-primary);background:var(--color-primary);border-radius:3px;font-family:"IBM Plex Mono",monospace;font-size:10px;text-align:center}
.kbc{margin-bottom:9px;padding:11px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--color-primary);border-radius:5px;transition:border-color .2s ease,transform .2s ease}
.kbc:hover{border-color:var(--color-primary);transform:translateX(2px)}
.kbc:last-child{margin-bottom:0}
.kbc .kid{color:var(--dim);font-size:10px;font-weight:600}
.kbc .knm{margin:4px 0 8px;font-size:12px;font-weight:700}
.kbc .kmeta{display:flex;align-items:center;justify-content:space-between;gap:6px;color:var(--mut);font-size:10px;font-weight:600}
.av{display:grid;width:22px;height:22px;place-items:center;color:var(--color-on-primary);background:var(--color-secondary);border:1px solid var(--color-primary);border-radius:4px;font-size:10px;font-weight:700}

.doc-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid rgba(71,85,105,.52)}
.doc-row:last-child{border-bottom:0}
.doc-row .dic{display:grid;flex:none;width:34px;height:34px;place-items:center;background:#19202E;border:1px solid var(--line);border-radius:5px}
.doc-row .dnm{flex:1;min-width:0;font-size:13px;font-weight:600}
.doc-row .dnm small{display:block;color:var(--dim);font-size:10px;font-weight:500}

.tl{position:relative;padding-left:28px}
.tl::before{position:absolute;top:4px;bottom:4px;left:8px;width:2px;content:"";background:var(--color-primary)}
.tl-item{position:relative;padding:0 0 20px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{position:absolute;top:3px;left:-25px;width:10px;height:10px;content:"";background:var(--color-secondary);border:2px solid var(--panel);outline:2px solid var(--color-primary);border-radius:2px}
.tl-item .tt{font-size:13px;font-weight:700}
.tl-item .td{margin-top:3px;color:var(--mut);font-size:12px;font-weight:400}
.tl-item .tm{color:var(--dim);font-size:10px;font-weight:500}

.aud{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid rgba(71,85,105,.52);font-size:12px}
.aud:last-child{border-bottom:0}
.aud .at{color:var(--dim);font-size:10px;font-weight:500;white-space:nowrap}
.aud .ax{flex:1;min-width:0}
.aud .ax b{color:var(--color-secondary);font-weight:700}
.aud .ax span{color:var(--mut);font-weight:400}

.srow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(71,85,105,.52)}
.srow:last-child{border-bottom:0}
.srow .snm{flex:1;min-width:0;font-size:13px;font-weight:600}
.srow .snm small{display:block;color:var(--dim);font-size:10px;font-weight:500}
.srow .sval{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.flow-note{
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:16px;
  padding:10px 13px;
  color:#E2E8F0;
  background:rgba(139,92,246,.1);
  border:1px solid rgba(196,181,253,.55);
  border-left:4px solid var(--color-accent);
  border-radius:5px;
  font-size:12px;
  font-weight:500;
}
.flow-note .material-symbols-outlined{color:var(--violet);font-size:18px}

@media(max-width:1024px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.g32{grid-template-columns:1fr}
}
@media(max-width:768px){
  .topbar{min-height:62px}
  .nav{top:62px}
  .g3,.g2{grid-template-columns:1fr}
  .card{padding:14px}
  .screen-head{align-items:flex-start}
  .tag{margin-left:0}
}
@media(max-width:560px){
  body{font-size:13px}
  .topbar{padding-inline:14px}
  .brand .logo{width:38px;height:38px}
  .brand b{font-size:13px}
  .brand small{font-size:10px}
  .topbar .live{font-size:0}
  .topbar .live::after{content:"已同步";font-size:10px}
  .nav{padding-inline:14px}
  .nav button{min-width:44px;justify-content:center;padding:9px 11px}
  .nav button .txt{display:none}
  main{padding:20px 14px 48px}
  .g4{grid-template-columns:1fr}
  .screen-head{display:grid;grid-template-columns:1fr auto;gap:4px 10px}
  .screen-head h1{grid-column:1/-1}
  .screen-head .sub{font-size:11px}
  .kpi .val{font-size:27px}
  .chart{height:260px}
  .chart.sm{height:220px}
  .flow-note{align-items:flex-start}
}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  #screen,.dot{animation:none!important}
  .card:hover,.nav button:hover,.kbc:hover{transform:none}
}
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">verified_user</span></div>
      <div><b>ClaimGuard 理賠案件終端</b><small>保險理賠管理 · Claims Ops Console</small></div>
    </div>
    <div class="live"><span class="dot"></span>即時案件流 · 已同步</div>
  </div>
  <div class="nav" id="nav"></div>
  <main><div id="screen"></div></main>

  <script>
  "use strict";
  var NAV=[
    {i:0,ic:"assignment_add",t:"報案受理"},
    {i:1,ic:"document_scanner",t:"文件檢核"},
    {i:2,ic:"policy_alert",t:"詐欺風險"},
    {i:3,ic:"calculate",t:"理算準備金"},
    {i:4,ic:"approval",t:"分層覆核"},
    {i:5,ic:"account_balance_wallet",t:"撥付追溯"}
  ];
  var charts=[];
  function disposeCharts(){for(var k=0;k<charts.length;k++){try{charts[k].dispose();}catch(e){}}charts=[];}
  function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el,null,{renderer:"canvas"});c.setOption(opt);charts.push(c);return c;}
  var AX={axisLine:{lineStyle:{color:"rgba(255,255,255,.18)"}},axisLabel:{color:"#a49fb0",fontSize:11},splitLine:{lineStyle:{color:"rgba(255,255,255,.06)"}}};
  var esc=function(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});};

  function head(icon,title,sub,tag){
    return '<div class="screen-head"><h1><span class="material-symbols-outlined" style="color:var(--accent2)">'+icon+'</span> '+title+'</h1><span class="sub">'+sub+'</span><span class="tag">'+tag+'</span></div>';
  }
  function fnote(txt){return '<div class="flow-note"><span class="material-symbols-outlined">conversion_path</span>'+txt+'</div>';}

  /* ---------- SCREEN 0 : 報案受理 ---------- */
  function s0(c){
    var kpis=[
      {ic:"call_received",val:"128",lab:"今日新報案",d:"+14",cls:"up"},
      {ic:"pending_actions",val:"342",lab:"受理中案件",d:"待建檔 27",cls:"neu"},
      {ic:"schedule",val:"6.4 分",lab:"平均建檔耗時",d:"-1.2 分",cls:"up"},
      {ic:"error",val:"9",lab:"保單勾稽失敗",d:"+3",cls:"down"}
    ];
    var rows=[
      {no:"CLM-24-081207",name:"林佩君",pol:"AH-77120934",type:"實支實付醫療",ch:"官網",amt:48200,st:"已建檔",p:"ok"},
      {no:"CLM-24-081206",name:"陳彥廷",pol:"CAR-55210088",type:"車體損失",ch:"APP",amt:132000,st:"保單勾稽中",p:"warn"},
      {no:"CLM-24-081205",name:"黃詩涵",pol:"LIFE-30119042",type:"身故給付",ch:"分行臨櫃",amt:2000000,st:"待補文件",p:"info"},
      {no:"CLM-24-081204",name:"吳承恩",pol:"AH-66450127",type:"住院日額",ch:"客服專線",amt:36000,st:"已建檔",p:"ok"},
      {no:"CLM-24-081203",name:"張雅婷",pol:"FIRE-90233015",type:"住宅火災",ch:"業務員",amt:580000,st:"勾稽失敗",p:"bad"},
      {no:"CLM-24-081202",name:"劉俊傑",pol:"TRV-11908844",type:"旅平延誤",ch:"APP",amt:9000,st:"已建檔",p:"ok"},
      {no:"CLM-24-081201",name:"蔡宜芳",pol:"AH-77339021",type:"癌症一次金",ch:"官網",amt:750000,st:"保單勾稽中",p:"warn"}
    ];
    var kh=kpis.map(function(k){return '<div class="card kpi"><div class="ic"><span class="material-symbols-outlined">'+k.ic+'</span></div><div class="val mono">'+k.val+'</div><div class="lab">'+k.lab+'</div><div class="delta '+k.cls+'">'+k.d+'</div></div>';}).join("");

  var RENDER=[s0,s1,s2,s3,s4,s5];
  var cur=-1;
  function show(i){
    i=Math.max(0,Math.min(i,RENDER.length-1));
    disposeCharts();
    var nav=document.getElementById("nav");
    var btns=nav.querySelectorAll("button");
    for(var b=0;b<btns.length;b++){btns[b].className=(+btns[b].getAttribute("data-i")===i)?"on":"";}
    var c=document.getElementById("screen");
    RENDER[i](c);
    cur=i;
  }
  (function buildNav(){
    var nav=document.getElementById("nav");
    nav.innerHTML=NAV.map(function(n){return '<button data-i="'+n.i+'"><span class="material-symbols-outlined">'+n.ic+'</span><span class="txt">'+n.t+'</span><span class="num">'+String(n.i+1).padStart(2,"0")+'</span></button>';}).join("");
    var btns=nav.querySelectorAll("button");
    for(var k=0;k<btns.length;k++){(function(bt){bt.addEventListener("click",function(){show(+bt.getAttribute("data-i"));try{window.scrollTo(0,0);}catch(e){}});})(btns[k]);}
  })();
  window.addEventListener("resize",function(){for(var k=0;k<charts.length;k++){try{charts[k].resize();}catch(e){}}});
  show(0);
  function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
