<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>保險理賠管理｜Jvision 系統 Demo</title>
  <meta name="description" content="受理、文件、風險、理算、覆核到撥付的理賠案件審查終端" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root{
      --accent:#be185d; --accent2:#fb7185; --accent-soft:rgba(190,24,93,.16);
      --bg:#0c0a12; --panel:#15121d; --panel2:#1c1826; --line:rgba(255,255,255,.08);
      --txt:#f5f3f7; --mut:#a49fb0; --dim:#6f6a7d;
      --ok:#34d399; --warn:#fbbf24; --bad:#fb7185; --info:#60a5fa; --violet:#a78bfa;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
      background:radial-gradient(1200px 700px at 80% -10%,rgba(190,24,93,.14),transparent 60%),var(--bg);
      color:var(--txt); min-height:100vh; -webkit-font-smoothing:antialiased;
    }
    .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;font-size:1.15em}
    /* top nav */
    .topbar{
      position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;
      padding:12px 20px;background:rgba(12,10,18,.86);backdrop-filter:blur(12px);
      border-bottom:1px solid var(--line);
    }
    .brand{display:flex;align-items:center;gap:11px;min-width:0}
    .brand .logo{
      width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;
      background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 18px rgba(190,24,93,.4)
    }
    .brand b{font-weight:900;font-size:15px;letter-spacing:.3px;white-space:nowrap}
    .brand small{display:block;color:var(--mut);font-size:11px;font-weight:600}
    .topbar .live{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12px;font-weight:600;white-space:nowrap}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulse 2s infinite}
    @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.55)}70%{box-shadow:0 0 0 9px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
    /* nav tabs */
    .nav{display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
    .nav button{
      flex:none;white-space:nowrap;display:flex;align-items:center;gap:8px;cursor:pointer;
      border:1px solid var(--line);background:var(--panel2);color:var(--mut);
      padding:9px 14px;border-radius:11px;font-family:inherit;font-size:13px;font-weight:700;transition:.18s;min-width:0
    }
    .nav button .material-symbols-outlined{font-size:18px;color:var(--accent2)}
    .nav button:hover{color:var(--txt);border-color:rgba(251,113,133,.4)}
    .nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(190,24,93,.4)}
    .nav button.on .material-symbols-outlined{color:#fff}
    .nav .num{font-size:11px;opacity:.7;font-weight:800}
    main{padding:22px 20px 60px;max-width:1360px;margin:0 auto}
    .screen-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:18px;flex-wrap:wrap}
    .screen-head h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.4px}
    .screen-head .sub{color:var(--mut);font-size:13px;font-weight:600}
    .tag{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent2);border:1px solid rgba(251,113,133,.28)}
    /* grids */
    .grid{display:grid;gap:14px;min-width:0}
    .g4{grid-template-columns:repeat(4,1fr)}
    .g3{grid-template-columns:repeat(3,1fr)}
    .g2{grid-template-columns:repeat(2,1fr)}
    .g23{grid-template-columns:2fr 1fr}
    .g32{grid-template-columns:1fr 2fr}
    .grid>*{min-width:0}
    @media(max-width:820px){.g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}}
    .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
    .card h3{margin:0 0 3px;font-size:14px;font-weight:800}
    .card .ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
    .card .ch p{margin:0;color:var(--dim);font-size:12px;font-weight:600}
    /* KPI */
    .kpi{position:relative;overflow:hidden}
    .kpi .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent2);margin-bottom:12px}
    .kpi .val{font-size:28px;font-weight:900;letter-spacing:.5px;line-height:1}
    .kpi .lab{color:var(--mut);font-size:12px;font-weight:700;margin-top:6px}
    .kpi .delta{font-size:12px;font-weight:800;margin-top:8px;display:inline-flex;align-items:center;gap:3px}
    .up{color:var(--ok)} .down{color:var(--bad)} .neu{color:var(--info)}
    /* chart */
    .chart{width:100%;height:300px}
    .chart.sm{height:230px}
    /* table */
    .tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
    .tbl th{text-align:left;color:var(--dim);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:9px 12px;border-bottom:1px solid var(--line)}
    .tbl td{padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.05);color:var(--txt);font-weight:600}
    .tbl tr:hover td{background:rgba(190,24,93,.06)}
    .mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
    .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px}
    .pill.ok{background:rgba(52,211,153,.15);color:var(--ok)}
    .pill.warn{background:rgba(251,191,36,.15);color:var(--warn)}
    .pill.bad{background:rgba(251,113,133,.15);color:var(--bad)}
    .pill.info{background:rgba(96,165,250,.15);color:var(--info)}
    .pill.violet{background:rgba(167,139,250,.15);color:var(--violet)}
    .pill.dim{background:rgba(255,255,255,.07);color:var(--mut)}
    .bar{height:7px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;min-width:60px}
    .bar>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
    /* board / kanban */
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0}
    @media(max-width:820px){.board{grid-template-columns:1fr}}
    .board>.col{min-width:0}
    .col-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px;font-size:12px;font-weight:800;color:var(--mut)}
    .col-head .cnt{background:rgba(255,255,255,.08);border-radius:99px;padding:1px 8px;font-size:11px}
    .kbc{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:10px;border-left:3px solid var(--accent2)}
    .kbc .kid{font-size:11px;color:var(--dim);font-weight:800;font-variant-numeric:tabular-nums}
    .kbc .knm{font-size:13px;font-weight:800;margin:3px 0 6px}
    .kbc .kmeta{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;color:var(--mut);font-weight:700}
    .av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2))}
    /* checklist board */
    .doc-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid rgba(255,255,255,.05)}
    .doc-row .dic{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.05)}
    .doc-row .dnm{font-size:13px;font-weight:700;flex:1;min-width:0}
    .doc-row .dnm small{display:block;color:var(--dim);font-size:11px;font-weight:600}
    /* timeline */
    .tl{position:relative;padding-left:26px}
    .tl:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:linear-gradient(var(--accent),var(--accent2))}
    .tl-item{position:relative;padding:0 0 20px}
    .tl-item:last-child{padding-bottom:0}
    .tl-item:before{content:"";position:absolute;left:-22px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 3px rgba(251,113,133,.2)}
    .tl-item .tt{font-size:13px;font-weight:800}
    .tl-item .td{font-size:12px;color:var(--mut);font-weight:600;margin-top:2px}
    .tl-item .tm{font-size:11px;color:var(--dim);font-weight:700;font-variant-numeric:tabular-nums}
    /* audit list */
    .aud{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px}
    .aud .at{color:var(--dim);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
    .aud .ax{flex:1;min-width:0}
    .aud .ax b{font-weight:800}
    .aud .ax span{color:var(--mut);font-weight:600}
    /* matrix / stat rows */
    .srow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)}
    .srow:last-child{border-bottom:none}
    .srow .snm{flex:1;min-width:0;font-size:13px;font-weight:700}
    .srow .snm small{display:block;color:var(--dim);font-size:11px;font-weight:600}
    .srow .sval{font-size:14px;font-weight:900;font-variant-numeric:tabular-nums}
    .flow-note{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);font-weight:600;background:var(--accent-soft);border:1px solid rgba(251,113,133,.22);padding:9px 13px;border-radius:11px;margin-bottom:16px}
    .flow-note .material-symbols-outlined{color:var(--accent2);font-size:18px}
    .scroll{overflow-x:auto}
    @media(max-width:560px){.nav button .txt{display:none}.nav button{padding:9px 11px}}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">verified_user</span></div>
      <div><b>ClaimGuard 理賠案件終端</b><small>保險理賠管理 · Claims Ops Console</small></div>
    </div>
    <div class="live"><span class="dot"></span>即時案件流 · 已同步</div>
  </div>
  <div class="nav" id="nav"></div>
  <main><div id="screen"></div></main>

  <script>
  "use strict";
  var NAV=[
    {i:0,ic:"assignment_add",t:"報案受理"},
    {i:1,ic:"document_scanner",t:"文件檢核"},
    {i:2,ic:"policy_alert",t:"詐欺風險"},
    {i:3,ic:"calculate",t:"理算準備金"},
    {i:4,ic:"approval",t:"分層覆核"},
    {i:5,ic:"account_balance_wallet",t:"撥付追溯"}
  ];
  var charts=[];
  function disposeCharts(){for(var k=0;k<charts.length;k++){try{charts[k].dispose();}catch(e){}}charts=[];}
  function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el,null,{renderer:"canvas"});c.setOption(opt);charts.push(c);return c;}
  var AX={axisLine:{lineStyle:{color:"rgba(255,255,255,.18)"}},axisLabel:{color:"#a49fb0",fontSize:11},splitLine:{lineStyle:{color:"rgba(255,255,255,.06)"}}};
  var esc=function(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});};

  function head(icon,title,sub,tag){
    return '<div class="screen-head"><h1><span class="material-symbols-outlined" style="color:var(--accent2)">'+icon+'</span> '+title+'</h1><span class="sub">'+sub+'</span><span class="tag">'+tag+'</span></div>';
  }
  function fnote(txt){return '<div class="flow-note"><span class="material-symbols-outlined">conversion_path</span>'+txt+'</div>';}

  /* ---------- SCREEN 0 : 報案受理 ---------- */
  function s0(c){
    var kpis=[
      {ic:"call_received",val:"128",lab:"今日新報案",d:"+14",cls:"up"},
      {ic:"pending_actions",val:"342",lab:"受理中案件",d:"待建檔 27",cls:"neu"},
      {ic:"schedule",val:"6.4 分",lab:"平均建檔耗時",d:"-1.2 分",cls:"up"},
      {ic:"error",val:"9",lab:"保單勾稽失敗",d:"+3",cls:"down"}
    ];
    var rows=[
      {no:"CLM-24-081207",name:"林佩君",pol:"AH-77120934",type:"實支實付醫療",ch:"官網",amt:48200,st:"已建檔",p:"ok"},
      {no:"CLM-24-081206",name:"陳彥廷",pol:"CAR-55210088",type:"車體損失",ch:"APP",amt:132000,st:"保單勾稽中",p:"warn"},
      {no:"CLM-24-081205",name:"黃詩涵",pol:"LIFE-30119042",type:"身故給付",ch:"分行臨櫃",amt:2000000,st:"待補文件",p:"info"},
      {no:"CLM-24-081204",name:"吳承恩",pol:"AH-66450127",type:"住院日額",ch:"客服專線",amt:36000,st:"已建檔",p:"ok"},
      {no:"CLM-24-081203",name:"張雅婷",pol:"FIRE-90233015",type:"住宅火災",ch:"業務員",amt:580000,st:"勾稽失敗",p:"bad"},
      {no:"CLM-24-081202",name:"劉俊傑",pol:"TRV-11908844",type:"旅平延誤",ch:"APP",amt:9000,st:"已建檔",p:"ok"},
      {no:"CLM-24-081201",name:"蔡宜芳",pol:"AH-77339021",type:"癌症一次金",ch:"官網",amt:750000,st:"保單勾稽中",p:"warn"}
    ];
    var kh=kpis.map(function(k){return '<div class="card kpi"><div class="ic"><span class="material-symbols-outlined">'+k.ic+'</span></div><div class="val mono">'+k.val+'</div><div class="lab">'+k.lab+'</div><div class="delta '+k.cls+'">'+k.d+'</div></div>';}).join("");
    var tr=rows.map(function(r){return '<tr><td class="mono">'+r.no+'</td><td>'+esc(r.name)+'</td><td class="mono">'+r.pol+'</td><td>'+r.type+'</td><td><span class="pill dim">'+r.ch+'</span></td><td class="mono">NT$ '+r.amt.toLocaleString()+'</td><td><span class="pill '+r.p+'">'+r.st+'</span></td></tr>';}).join("");
    c.innerHTML=head("assignment_add","理賠報案受理","出險登錄 · 保單勾稽 · 案件建檔","v0")
      +fnote("流程階段 1／5 · 報案受理建檔 → 由客服專員登錄事故並勾稽有效保單")
      +'<div class="grid g4" style="margin-bottom:14px">'+kh+'</div>'
      +'<div class="grid g23">'
        +'<div class="card"><div class="ch"><div><h3>今日受理案件明細</h3><p>依報案時間排序 · 即時更新</p></div><span class="pill ok">7 筆</span></div><div class="scroll"><table class="tbl"><thead><tr><th>案號</th><th>被保人</th><th>保單號</th><th>險種</th><th>來源</th><th>初估金額</th><th>狀態</th></tr></thead><tbody>'+tr+'</tbody></table></div></div>'
        +'<div class="card"><div class="ch"><div><h3>報案來源分布</h3><p>近 7 日 · 件數</p></div></div><div id="c0a" class="chart sm"></div></div>'
      +'</div>'
      +'<div class="grid g2" style="margin-top:14px">'
        +'<div class="card"><div class="ch"><div><h3>各險種報案量趨勢</h3><p>近 6 週</p></div></div><div id="c0b" class="chart"></div></div>'
        +'<div class="card"><div class="ch"><div><h3>受理完成率</h3><p>建檔 SLA 達成</p></div></div><div id="c0c" class="chart"></div></div>'
      +'</div>';
    void c.offsetHeight;
    mk("c0a",{tooltip:{trigger:"item"},legend:{textStyle:{color:"#a49fb0"},bottom:0,itemWidth:9},series:[{type:"pie",radius:["45%","72%"],center:["50%","44%"],label:{color:"#f5f3f7",fontSize:11},data:[{value:52,name:"APP"},{value:38,name:"官網"},{value:22,name:"客服專線"},{value:11,name:"分行臨櫃"},{value:5,name:"業務員"}],color:["#be185d","#fb7185","#a78bfa","#60a5fa","#34d399"]}]});
    mk("c0b",{tooltip:{trigger:"axis"},legend:{textStyle:{color:"#a49fb0"},top:0,itemWidth:12},grid:{left:8,right:14,top:34,bottom:6,containLabel:true},xAxis:Object.assign({type:"category",data:["W1","W2","W3","W4","W5","W6"]},AX),yAxis:Object.assign({type:"value"},AX),series:[
      {name:"醫療",type:"line",smooth:true,data:[210,224,198,240,255,268],color:"#fb7185",areaStyle:{opacity:.12}},
      {name:"車險",type:"line",smooth:true,data:[160,155,172,168,180,176],color:"#60a5fa",areaStyle:{opacity:.12}},
      {name:"壽險",type:"line",smooth:true,data:[44,50,47,55,58,61],color:"#a78bfa",areaStyle:{opacity:.12}}
    ]});
    mk("c0c",{tooltip:{},series:[{type:"gauge",startAngle:210,endAngle:-30,min:0,max:100,progress:{show:true,width:16,itemStyle:{color:"#be185d"}},axisLine:{lineStyle:{width:16,color:[[1,"rgba(255,255,255,.08)"]]}},axisLabel:{color:"#a49fb0",fontSize:10,distance:-42},axisTick:{show:false},splitLine:{distance:-16,length:12,lineStyle:{color:"rgba(255,255,255,.2)"}},pointer:{width:5,itemStyle:{color:"#fb7185"}},detail:{valueAnimation:true,formatter:"{value}%",color:"#f5f3f7",fontSize:26,offsetCenter:[0,"58%"]},data:[{value:92}]}]});
  }

  /* ---------- SCREEN 1 : 文件檢核 ---------- */
  function s1(c){
    var docs=[
      {n:"理賠申請書",s:"已收",ic:"description",p:"ok"},
      {n:"診斷證明書",s:"已收",ic:"medical_information",p:"ok"},
      {n:"醫療費用收據正本",s:"缺件",ic:"receipt_long",p:"bad"},
      {n:"保險金申請人身分證",s:"已收",ic:"badge",p:"ok"},
      {n:"存摺封面影本",s:"待補",ic:"account_balance",p:"warn"},
      {n:"事故證明／報案聯單",s:"審核中",ic:"gavel",p:"info"}
    ];
    var cases=[
      {no:"CLM-24-081205",nm:"黃詩涵",miss:2,total:6,days:3,st:"待補件",p:"warn"},
      {no:"CLM-24-081203",nm:"張雅婷",miss:3,total:7,days:5,st:"逾期未補",p:"bad"},
      {no:"CLM-24-081198",nm:"周育誠",miss:0,total:5,days:0,st:"文件齊備",p:"ok"},
      {no:"CLM-24-081190",nm:"許雅雯",miss:1,total:6,days:1,st:"待補件",p:"warn"},
      {no:"CLM-24-081185",nm:"鄭凱文",miss:0,total:8,days:0,st:"文件齊備",p:"ok"}
    ];
    var dh=docs.map(function(d){return '<div class="doc-row"><div class="dic"><span class="material-symbols-outlined" style="color:var(--accent2)">'+d.ic+'</span></div><div class="dnm">'+d.n+'<small>電子調閱 · OCR 辨識</small></div><span class="pill '+d.p+'">'+d.s+'</span></div>';}).join("");
    var ch=cases.map(function(x){var pct=Math.round((x.total-x.miss)/x.total*100);return '<tr><td class="mono">'+x.no+'</td><td>'+esc(x.nm)+'</td><td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><span style="width:'+pct+'%"></span></div><span class="mono" style="font-size:11px;color:var(--mut)">'+(x.total-x.miss)+'/'+x.total+'</span></div></td><td class="mono">'+x.miss+' 件</td><td class="mono">'+x.days+' 天</td><td><span class="pill '+x.p+'">'+x.st+'</span></td></tr>';}).join("");
    c.innerHTML=head("document_scanner","文件審查與缺件追蹤","單據調閱 · 缺件清單 · 補件通知","v1")
      +fnote("流程階段 2／5 · 文件檢核補件 → 由理賠審核員比對缺件清單並通知補齊")

  var RENDER=[s0,s1,s2,s3,s4,s5];
  var cur=-1;
  function show(i){
    i=Math.max(0,Math.min(i,RENDER.length-1));
    disposeCharts();
    var nav=document.getElementById("nav");
    var btns=nav.querySelectorAll("button");
    for(var b=0;b<btns.length;b++){btns[b].className=(+btns[b].getAttribute("data-i")===i)?"on":"";}
    var c=document.getElementById("screen");
    RENDER[i](c);
    cur=i;
  }
  (function buildNav(){
    var nav=document.getElementById("nav");
    nav.innerHTML=NAV.map(function(n){return '<button data-i="'+n.i+'"><span class="material-symbols-outlined">'+n.ic+'</span><span class="txt">'+n.t+'</span><span class="num">'+String(n.i+1).padStart(2,"0")+'</span></button>';}).join("");
    var btns=nav.querySelectorAll("button");
    for(var k=0;k<btns.length;k++){(function(bt){bt.addEventListener("click",function(){show(+bt.getAttribute("data-i"));try{window.scrollTo(0,0);}catch(e){}});})(btns[k]);}
  })();
  window.addEventListener("resize",function(){for(var k=0;k<charts.length;k++){try{charts[k].resize();}catch(e){}}});
  show(0);
  function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
