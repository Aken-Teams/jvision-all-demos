<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>無塵室環境監控 · 控制中心</title>
<meta name="description" content="Cleanroom Environmental Monitoring 無塵室環境監控 純 UI 展示"/>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#4f46e5;--accent2:#818cf8;
  --bg:#0b1020;--panel:#141a2e;--panel2:#1b2340;--line:#2a3355;
  --txt:#e7eaf6;--muted:#9aa3c7;--dim:#6b74a0;
  --ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--info:#38bdf8;
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html,body{background:var(--bg);color:var(--txt);font-family:"Inter","Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}

.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(90deg,#0d1226,#141a2e);border-bottom:1px solid var(--line);padding:0 16px}
.topbar-in{display:flex;align-items:center;gap:14px;height:60px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.3px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.livechip{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);background:var(--panel2);padding:6px 11px;border-radius:20px;border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(34,197,94,.18)}

.nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;background:#0d1226;border-bottom:1px solid var(--line);position:sticky;top:60px;z-index:40}
.navbtn{display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s}
.navbtn:hover{color:var(--txt);background:var(--panel)}
.navbtn.active{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:var(--accent2);box-shadow:0 4px 16px rgba(79,70,229,.35)}
.navbtn .ms{font-size:20px}

.wrap{max-width:1360px;margin:0 auto;padding:22px 16px 60px}
.scr-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.scr-head h1{font-size:22px;font-weight:800}
.scr-head p{color:var(--muted);font-size:13px}
.tag{font-size:11px;font-weight:700;color:var(--accent2);background:rgba(129,140,248,.12);border:1px solid rgba(129,140,248,.3);padding:4px 10px;border-radius:20px}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
@media(max-width:820px){.g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card h3 .ms{font-size:19px;color:var(--accent2)}
.card .sub{font-size:12px;color:var(--dim);font-weight:500}

.kpi{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;padding:16px;position:relative;overflow:hidden}
.kpi .lab{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
.kpi .lab .ms{font-size:18px}
.kpi .val{font-size:28px;font-weight:800;margin-top:8px;letter-spacing:.5px}
.kpi .val small{font-size:14px;color:var(--muted);font-weight:600}
.kpi .delta{font-size:12px;font-weight:600;margin-top:6px}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--dim);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
tbody tr:hover{background:var(--panel2)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px}
.p-ok{color:var(--ok);background:rgba(34,197,94,.13)}
.p-warn{color:var(--warn);background:rgba(245,158,11,.14)}
.p-bad{color:var(--bad);background:rgba(239,68,68,.14)}
.p-info{color:var(--info);background:rgba(56,189,248,.13)}
.p-mut{color:var(--muted);background:rgba(154,163,199,.12)}

.chartbox{overflow:hidden}
.overx{overflow-x:auto}

.gauge{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px;position:relative;overflow:hidden}
.gauge .rmno{font-size:11.5px;color:var(--dim);font-weight:600}
.gauge .rmnm{font-size:14.5px;font-weight:700;margin:2px 0 10px}
.metric{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-top:1px dashed var(--line)}
.metric:first-of-type{border-top:0}
.metric .mk{font-size:12px;color:var(--muted)}
.metric .mv{font-size:14px;font-weight:700}
.stbadge{position:absolute;right:12px;top:12px}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:flex;align-items:center;gap:6px}
.lg{width:10px;height:10px;border-radius:3px}

.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tli{position:relative;padding:0 0 16px 12px}
.tli::before{content:"";position:absolute;left:-20px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 4px rgba(129,140,248,.15)}
.tli.b::before{background:var(--bad);box-shadow:0 0 0 4px rgba(239,68,68,.15)}
.tli.w::before{background:var(--warn);box-shadow:0 0 0 4px rgba(245,158,11,.15)}
.tli .tt{font-size:11px;color:var(--dim)}
.tli .th{font-size:13.5px;font-weight:700;margin:2px 0}
.tli .td{font-size:12.5px;color:var(--muted)}

.kan{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:820px){.kan{grid-template-columns:1fr}}
.kcol{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px}
.kcol h4{font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;margin-bottom:10px;color:var(--muted)}
.kcol h4 b{color:var(--txt)}
.kcard{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:10px;padding:10px;margin-bottom:9px}
.kcard .kt{font-size:13px;font-weight:700}
.kcard .km{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:8px}
.kcard.hi{border-left-color:var(--bad)}
.kcard.md{border-left-color:var(--warn)}

.miniflow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.miniflow .step{flex:1;min-width:120px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px;text-align:center}
.miniflow .step .ms{font-size:22px;color:var(--accent2)}
.miniflow .step .n{font-size:12.5px;font-weight:700;margin-top:5px}
.miniflow .step .r{font-size:11px;color:var(--dim);margin-top:2px}

.checkrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.checkrow:last-child{border-bottom:0}
.checkrow .ms{font-size:18px}

@media(max-width:560px){.navbtn span.t{display:none}.navbtn{padding:9px 11px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <span class="logo"><span class="ms">science</span></span>
      <div>無塵室環境監控 CleanEnv<small>Cleanroom Environmental Monitoring · 控制中心</small></div>
    </div>
    <div class="livechip"><span class="dot"></span> 12 個潔淨室 · 即時連線</div>
  </div>
</header>

<nav class="nav" id="nav"></nav>
<main class="wrap"><div id="app"></div></main>

<script>
"use strict";
var apxColors=["#818cf8","#38bdf8","#22c55e","#f59e0b","#ef4444","#a78bfa"];
var axisStyle={colors:"#9aa3c7"};
var gridColor="#2a3355";
var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function mount(id,opts){var el=document.getElementById(id);if(!el)return;var c=new ApexCharts(el,opts);c.render();charts.push(c);}
function base(extra){
  var o={chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},background:"transparent",toolbar:{show:false},animations:{enabled:false},redrawOnParentResize:false,redrawOnWindowResize:false,fontFamily:"Inter, Noto Sans TC, sans-serif"},
    theme:{mode:"dark"},colors:apxColors,grid:{borderColor:gridColor,strokeDashArray:3},
    dataLabels:{enabled:false},legend:{labels:{colors:"#9aa3c7"}},tooltip:{theme:"dark"}};
  for(var k in extra){o[k]=extra[k];}
  return o;
}

/* ============ DATA ============ */
var rooms=[
  {id:"CR-A1",nm:"黃光微影 A1",iso:5,temp:22.1,rh:44,dp:14.8,pm:2100,st:"ok"},
  {id:"CR-A2",nm:"黃光微影 A2",iso:5,temp:22.4,rh:46,dp:13.2,pm:2380,st:"ok"},
  {id:"CR-B1",nm:"蝕刻區 B1",iso:6,temp:23.0,rh:52,dp:9.1,pm:9800,st:"warn"},
  {id:"CR-B2",nm:"擴散爐 B2",iso:6,temp:22.7,rh:41,dp:15.5,pm:6400,st:"ok"},
  {id:"CR-C1",nm:"量測站 C1",iso:7,temp:23.6,rh:58,dp:6.4,pm:31000,st:"bad"},
  {id:"CR-C2",nm:"封裝區 C2",iso:7,temp:22.9,rh:49,dp:11.0,pm:18500,st:"ok"},
  {id:"CR-D1",nm:"更衣緩衝 D1",iso:8,temp:23.2,rh:55,dp:8.0,pm:74000,st:"warn"},
  {id:"CR-D2",nm:"物料傳遞 D2",iso:8,temp:23.1,rh:50,dp:12.3,pm:52000,st:"ok"}
];
var isoLimit={5:3520,6:35200,7:352000,8:3520000};
function stPill(s){if(s==="ok")return '<span class="pill p-ok"><span class="ms" style="font-size:14px">check_circle</span>正常</span>';if(s==="warn")return '<span class="pill p-warn"><span class="ms" style="font-size:14px">warning</span>警戒</span>';return '<span class="pill p-bad"><span class="ms" style="font-size:14px">error</span>超標</span>';}

var sensors=[
  {id:"T-A1-01",room:"CR-A1",type:"溫度",unit:"°C",val:22.1,cal:"2026-09-12",drift:0.2,st:"ok"},
  {id:"H-A1-01",room:"CR-A1",type:"濕度",unit:"%RH",val:44,cal:"2026-09-12",drift:0.5,st:"ok"},
  {id:"P-B1-02",room:"CR-B1",type:"壓差",unit:"Pa",val:9.1,cal:"2026-08-20",drift:1.4,st:"warn"},
  {id:"PC-C1-01",room:"CR-C1",type:"微粒計數",unit:"pcs",val:31000,cal:"2026-07-30",drift:3.1,st:"bad"},
  {id:"T-C1-01",room:"CR-C1",type:"溫度",unit:"°C",val:23.6,cal:"2026-08-05",drift:0.9,st:"warn"},
  {id:"P-D1-01",room:"CR-D1",type:"壓差",unit:"Pa",val:8.0,cal:"2026-09-01",drift:0.7,st:"warn"},
  {id:"H-D2-01",room:"CR-D2",type:"濕度",unit:"%RH",val:50,cal:"2026-09-18",drift:0.3,st:"ok"},
  {id:"PC-B2-01",room:"CR-B2",type:"微粒計數",unit:"pcs",val:6400,cal:"2026-08-28",drift:1.0,st:"ok"}
];

var alarms=[
  {tm:"14:52",room:"CR-C1 量測站",param:"微粒 (≥0.5µm)",val:"31,000 pcs/m³",lim:"25,000",lv:"critical",own:"陳彥廷",st:"未確認"},
  {tm:"14:31",room:"CR-B1 蝕刻區",param:"壓差",val:"9.1 Pa",lim:"≥10 Pa",lv:"major",own:"林佳蓉",st:"處理中"},
  {tm:"13:58",room:"CR-D1 更衣緩衝",param:"壓差",val:"8.0 Pa",lim:"≥10 Pa",lv:"major",own:"王志豪",st:"處理中"},
  {tm:"12:20",room:"CR-C1 量測站",param:"溫度",val:"23.6 °C",lim:"≤23.0",lv:"minor",own:"陳彥廷",st:"已確認"},
  {tm:"09:44",room:"CR-A2 黃光",param:"濕度",val:"46 %RH",lim:"≤45",lv:"minor",own:"林佳蓉",st:"已關閉"},
  {tm:"08:10",room:"CR-D1 更衣緩衝",param:"微粒 (≥0.5µm)",val:"74,000 pcs/m³",lim:"≤50,000",lv:"major",own:"王志豪",st:"已關閉"}
];
function lvPill(l){if(l==="critical")return '<span class="pill p-bad">嚴重</span>';if(l==="major")return '<span class="pill p-warn">重大</span>';return '<span class="pill p-info">輕微</span>';}

var workorders={
  todo:[{t:"CR-C1 微粒超標排查",r:"陳彥廷",p:"hi",due:"今日 16:00"},{t:"CR-D1 更衣室氣密檢查",r:"王志豪",p:"md",due:"今日 18:00"}],
  doing:[{t:"CR-B1 送風機頻率調校",r:"林佳蓉",p:"md",due:"進行中 60%"}],
  review:[{t:"CR-A2 濕度調節閥更換",r:"設備二課",p:"md",due:"待品保複驗"}],
  done:[{t:"CR-D1 HEPA 濾網更換",r:"設備一課",p:"md",due:"14:05 完成"},{t:"CR-C2 壓差感測校正",r:"陳彥廷",p:"md",due:"11:20 完成"}]
};
function priTag(p){if(p==="hi")return "hi";if(p==="md")return "md";return "";}

var reports=[
  {id:"RPT-2608-014",nm:"8月第2週 潔淨度合規週報",std:"ISO 14644-1",cov:"全廠 12 室",rate:96.8,st:"已核定",by:"品保部 · 黃"},
  {id:"RPT-2608-013",nm:"CR-C1 微粒偏差矯正報告",std:"GMP Annex 1",cov:"CR-C1",rate:88.0,st:"待核定",by:"品保部 · 黃"},
  {id:"RPT-2608-012",nm:"壓差級聯稽核報告",std:"ISO 14644-4",cov:"B/C/D 區",rate:92.5,st:"已核定",by:"品保部 · 蔡"},
  {id:"RPT-2608-011",nm:"7月 環境合規月報",std:"ISO 14644-1",cov:"全廠 12 室",rate:95.1,st:"已歸檔",by:"品保部 · 黃"}
];

/* ============ SCREENS ============ */
function s0(){
  var kroms=rooms.map(function(r){
    return '<div class="gauge"><div class="stbadge">'+stPill(r.st)+'</div>'+
      '<div class="rmno">'+r.id+' · ISO Class '+r.iso+'</div>'+
      '<div class="rmnm">'+r.nm+'</div>'+
      '<div class="metric"><span class="mk">溫度</span><span class="mv">'+r.temp.toFixed(1)+' °C</span></div>'+
      '<div class="metric"><span class="mk">濕度</span><span class="mv">'+r.rh+' %RH</span></div>'+
      '<div class="metric"><span class="mk">壓差</span><span class="mv">'+r.dp.toFixed(1)+' Pa</span></div>'+
      '<div class="metric"><span class="mk">微粒 ≥0.5µm</span><span class="mv">'+r.pm.toLocaleString()+'</span></div>'+
    '</div>';
  }).join("");
  var okN=rooms.filter(function(r){return r.st==="ok";}).length;
  var warnN=rooms.filter(function(r){return r.st==="warn";}).length;
  var badN=rooms.filter(function(r){return r.st==="bad";}).length;
  return head("環境即時監控","環境即時監控 · 各潔淨室溫濕度、壓差、微粒即時儀表看板","v0")+
  '<div class="grid g4" style="margin-bottom:14px">'+
    kpi("dashboard","監控中潔淨室","12","室","+2 本月","up","var(--accent2)")+
    kpi("check_circle","正常區域",okN+" 室","","合規率 96.8%","up","var(--ok)")+
    kpi("warning","警戒中",warnN+" 室","","逼近門檻","flat","var(--warn)")+
    kpi("error","超標中",badN+" 室","","需即刻處置","down","var(--bad)")+
  '</div>'+
  '<div class="grid g32">'+
    '<div class="card chartbox"><h3><span class="ms">monitoring</span>全廠微粒濃度趨勢（近 12 小時 · ×10³ pcs/m³）</h3><div id="c0a"></div></div>'+
    '<div class="card chartbox"><h3><span class="ms">shield</span>分區壓差級聯（Pa）</h3><div id="c0b"></div><div class="legend"><span><i class="lg" style="background:#818cf8"></i>實際壓差</span><span><i class="lg" style="background:#ef4444"></i>下限 10Pa</span></div></div>'+
  '</div>'+
  '<div class="card" style="margin-top:14px"><h3><span class="ms">grid_view</span>潔淨室即時儀表牆</h3><div class="grid g4">'+kroms+'</div></div>';
}
function c0(){
  mount("c0a",base({
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"area",height:280,background:"transparent"},
    series:[{name:"CR-C1",data:[18,20,22,25,28,30,29,31,30,31,33,31]},{name:"CR-B1",data:[8,9,9,10,11,10,12,11,10,9,10,9.8]},{name:"CR-A1",data:[2,2.1,2,2.3,2.2,2.1,2,2.1,2.2,2,2.1,2.1]}],
    xaxis:{categories:["04","05","06","07","08","09","10","11","12","13","14","15"],labels:{style:axisStyle},axisBorder:{color:gridColor},axisTicks:{color:gridColor}},
    yaxis:{labels:{style:axisStyle}},
    stroke:{curve:"smooth",width:2},fill:{type:"gradient",gradient:{opacityFrom:.35,opacityTo:.05}}
  }));
  mount("c0b",base({
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"bar",height:280,background:"transparent"},
    plotOptions:{bar:{horizontal:true,barHeight:"55%",borderRadius:4}},
    series:[{name:"壓差 Pa",data:[14.8,9.1,15.5,6.4,8.0,12.3]},{name:"下限",data:[10,10,10,10,10,10]}],
    colors:["#818cf8","#ef4444"],
    xaxis:{categories:["A1","B1","B2","C1","D1","D2"],labels:{style:axisStyle},axisBorder:{color:gridColor},axisTicks:{color:gridColor}},
    yaxis:{labels:{style:axisStyle}},
    tooltip:{shared:false,intersect:true}
  }));
}

function s1(){
  var rows=sensors.map(function(s){
    var cp=s.st==="ok"?"p-ok":(s.st==="warn"?"p-warn":"p-bad");
    var cl=s.st==="ok"?"正常":(s.st==="warn"?"待校正":"異常");
    return '<tr><td><b>'+s.id+'</b></td><td>'+s.room+'</td><td>'+s.type+'</td><td>'+s.val.toLocaleString()+' '+s.unit+'</td><td>'+s.cal+'</td><td>'+s.drift.toFixed(1)+'%</td><td><span class="pill '+cp+'">'+cl+'</span></td></tr>';
  }).join("");
  return head("感測點位管理","感測點位管理 · 溫濕度、壓差、微粒計數器點位與校正週期","v1")+
  '<div class="grid g4" style="margin-bottom:14px">'+
    kpi("thermostat","佈署感測點","328","","跨 12 室","flat","var(--accent2)")+
    kpi("sensors","線上率","99.4","%","2 點離線","up","var(--ok)")+
    kpi("event_repeat","本月待校正","17","","7 日內到期","flat","var(--warn)")+
    kpi("trending_up","漂移超標","1","","PC-C1-01","down","var(--bad)")+
  '</div>'+

function head(t,sub,v){return '<div class="scr-head"><h1>'+t+'</h1><span class="tag">'+v+'</span><p>'+sub+'</p></div>';}
function kpi(ic,lab,val,unit,delta,dir,barc){
  return '<div class="kpi"><span class="bar" style="background:'+barc+'"></span>'+
    '<div class="lab"><span class="ms">'+ic+'</span>'+lab+'</div>'+
    '<div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div>'+
    '<div class="delta '+dir+'">'+delta+'</div></div>';
}
function stepEl(ic,n,r){return '<div class="step"><span class="ms">'+ic+'</span><div class="n">'+n+'</div><div class="r">'+r+'</div></div>';}
function chk(ic,col,t,d){return '<div class="checkrow"><span class="ms" style="color:'+col+'">'+ic+'</span><div><div style="font-weight:600">'+t+'</div><div class="sub">'+d+'</div></div></div>';}

  {ic:"gavel",nm:"合規報表",fn:s5,cf:c5}
];
(function buildNav(){
  var html="";
  for(var i=0;i<screens.length;i++){
    html+='<button class="navbtn" data-i="'+i+'"><span class="ms">'+screens[i].ic+'</span><span class="t">'+screens[i].nm+'</span></button>';
  }
  document.getElementById("nav").innerHTML=html;
  var btns=document.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){show(+this.getAttribute("data-i"));});
  }
})();

function show(i){
  killCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("active",+btns[b].getAttribute("data-i")===i);}
  var container=document.getElementById("app");
  container.innerHTML=screens[i].fn();
  void container.offsetHeight;
  if(screens[i].cf)screens[i].cf();
}

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
