:root{

*{box-sizing:border-box;min-width:0}
html{background:var(--color-background);color:var(--ink);font-family:"Fira Sans",sans-serif;scroll-behavior:auto}
body{margin:0;overflow-x:hidden;background-color:var(--color-background);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px}

.ms{font-family:"Material Symbols Outlined";font-weight:600;font-style:normal;line-height:1;vertical-align:middle}
.topbar{position:sticky;top:0;z-index:50;border-bottom:3px solid var(--ink);background:var(--color-card)}
.topbar-in{min-height:72px;display:flex;align-items:center;gap:18px;padding:10px clamp(14px,3vw,38px)}
.brand{display:flex;align-items:center;gap:13px;font-size:18px;font-weight:800;letter-spacing:-.03em}

.livechip{margin-left:auto;display:flex;align-items:center;gap:8px;border:2px solid var(--ink);background:#fff;padding:8px 12px;color:var(--ink);font:600 12px "Fira Code",monospace;white-space:nowrap}
.dot{width:11px;height:11px;border:2px solid var(--ink);background:#22c55e}
.nav{position:sticky;top:72px;z-index:40;display:flex;gap:0;overflow-x:auto;border-bottom:3px solid var(--ink);background:var(--color-muted);padding-left:clamp(8px,2vw,28px);scrollbar-width:thin}
.navbtn{min-height:48px;display:flex;align-items:center;gap:8px;border:0;border-left:2px solid var(--ink);border-radius:0;background:transparent;padding:9px 15px;color:var(--ink);font-size:13px;font-weight:700;white-space:nowrap}
.navbtn:last-child{border-right:2px solid var(--ink)}
.navbtn:hover{background:#d7e4f7}
.navbtn.active{background:var(--color-primary);color:#fff}
.navbtn .ms{font-size:20px}
.wrap{max-width:1440px;margin:auto;padding:28px clamp(12px,2.5vw,34px) 72px}
.scr-head{position:relative;display:grid;grid-template-columns:auto auto 1fr;align-items:end;gap:9px 12px;margin:0 0 22px;padding:21px 24px;border:3px solid var(--ink);background:var(--color-card);box-shadow:var(--shadow)}

.scr-head h1{margin:0;font-size:clamp(25px,3vw,40px);font-weight:800;line-height:.95;letter-spacing:-.055em}
.scr-head p{grid-column:1/-1;margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
.tag{align-self:center;border:2px solid var(--ink);background:var(--color-accent);padding:4px 8px;color:#000;font:700 11px "Fira Code",monospace}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.card,.kpi,.gauge,.kcol,.kcard,.miniflow .step{border:2px solid var(--ink);border-radius:0;background:var(--color-card)}
.card{padding:16px}
.card h3{display:flex;align-items:center;gap:8px;margin:0 0 14px;padding-bottom:10px;border-bottom:2px solid var(--ink);font-size:14px;font-weight:800}
.card h3 .ms{font-size:20px;color:var(--color-primary)}
.card .sub,.sub{color:var(--muted);font-size:12px}
.kpi{position:relative;overflow:hidden;min-height:144px;padding:17px 16px 15px 21px;box-shadow:4px 4px 0 var(--ink)}
.kpi:nth-child(even){transform:translateY(5px)}
.kpi .bar{position:absolute;inset:0 auto 0 0;width:7px;border-right:2px solid var(--ink)}
.kpi .lab{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase}
.kpi .lab .ms{font-size:20px;color:var(--ink)}
.kpi .val{margin-top:13px;font:700 clamp(25px,2.6vw,35px)/1 "Fira Code",monospace;letter-spacing:-.06em}
.kpi .val small{color:var(--muted);font-size:14px;letter-spacing:0}
.kpi .delta{margin-top:9px;font-size:12px;font-weight:700}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
.chartbox{overflow:hidden}
.overx{overflow-x:auto;border:2px solid var(--ink)}
table{width:100%;border-collapse:collapse;background:#fff;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:11px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th:last-child,td:last-child{border-right:0}
th{background:var(--ink);color:#fff;font:700 11px "Fira Code",monospace;letter-spacing:.035em}
tbody tr:nth-child(even){background:#f1f5f9}
tbody tr:hover{background:#dbeafe}
td:nth-child(n+4){font-variant-numeric:tabular-nums}
td b,.rmno,.tt,.tag{font-family:"Fira Code",monospace}
.pill{display:inline-flex;align-items:center;gap:5px;border:1.5px solid currentColor;padding:3px 7px;background:#fff;font-size:11px;font-weight:800;line-height:1.25}
.p-ok{color:#066536;background:#dcfce7}
.p-warn{color:#884000;background:#ffedd5}
.p-bad{color:#b21414;background:#fee2e2}
.p-info{color:#075985;background:#e0f2fe}
.p-mut{color:#475569;background:#e2e8f0}
.gauge{position:relative;overflow:hidden;padding:15px;box-shadow:3px 3px 0 var(--ink)}
.gauge:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--color-primary)}
.gauge .rmno{color:var(--muted);font-size:10.5px;font-weight:600}
.gauge .rmnm{margin:4px 0 12px;font-size:15px;font-weight:800}
.stbadge{position:absolute;right:10px;top:10px}
.metric{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 0;border-top:1px dashed #94a3b8}
.metric .mk{color:var(--muted);font-size:12px}
.metric .mv{font:700 13px "Fira Code",monospace;text-align:right}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:12px}
.legend span{display:flex;align-items:center;gap:6px}
.lg{width:11px;height:11px;border:1px solid var(--ink)}
.tl{position:relative;padding-left:23px}

.tli{position:relative;padding:0 0 18px 13px}

.tli.b:before{background:var(--bad)}
.tli.w:before{background:#f59e0b}
.tli .tt{color:var(--muted);font-size:10px}
.tli .th{margin:3px 0;font-size:13px;font-weight:800}
.tli .td{color:var(--muted);font-size:12px;line-height:1.45}
.kan{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kcol{padding:11px;background:var(--color-muted)}
.kcol h4{display:flex;justify-content:space-between;margin:0 0 10px;font-size:12px;color:var(--muted)}
.kcol h4 b{display:grid;place-items:center;min-width:23px;height:23px;border:2px solid var(--ink);background:#fff;color:var(--ink);font-family:"Fira Code",monospace}
.kcard{margin-bottom:9px;padding:10px;border-left:7px solid var(--color-primary);background:#fff}
.kcard.hi{border-left-color:var(--bad)}
.kcard.md{border-left-color:#d97706}
.kcard .kt{font-size:13px;font-weight:800}
.kcard .km{display:flex;justify-content:space-between;gap:8px;margin-top:6px;color:var(--muted);font:500 10.5px "Fira Code",monospace}
.miniflow{display:flex;gap:0;flex-wrap:wrap;margin-top:6px}
.miniflow .step{position:relative;flex:1;min-width:130px;padding:13px;text-align:center;border-right:0}
.miniflow .step:last-child{border-right:2px solid var(--ink);background:#ffedd5}
.miniflow .step .ms{font-size:23px;color:var(--color-primary)}
.miniflow .step .n{margin-top:5px;font-size:12px;font-weight:800}
.miniflow .step .r{margin-top:2px;color:var(--muted);font-size:10px}
.checkrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.checkrow:last-child{border-bottom:0}
.checkrow .ms{font-size:20px}
@media(max-width:1024px){.g4{grid-template-columns:repeat(2,1fr)}.g23,.g32{grid-template-columns:1fr}.kan{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.topbar-in{min-height:66px}.brand{font-size:15px}.brand .logo{width:40px;height:40px}.livechip{padding:7px}.nav{top:66px}.g3,.g2{grid-template-columns:1fr}.scr-head{grid-template-columns:auto 1fr;padding:18px}.scr-head p{grid-column:1/-1}.kpi:nth-child(even){transform:none}}
@media(max-width:560px){.wrap{padding-inline:10px}.livechip{margin-left:0;width:100%;justify-content:center}.topbar-in{flex-wrap:wrap}.nav{position:relative;top:auto;padding-left:0}.navbtn{flex:1;justify-content:center;padding:9px 10px}.navbtn .t{display:none}.g4,.kan{grid-template-columns:1fr}.scr-head h1{font-size:26px}.kpi{min-height:126px}.miniflow .step{flex-basis:100%;border-right:2px solid var(--ink);border-bottom:0}.brand small{font-size:9px}}
@media(prefers-reduced-motion:no-preference){
  .card,.kpi,.gauge{animation:reveal .35s ease-out both}
  .card:nth-child(2),.kpi:nth-child(2){animation-delay:.04s}
  .card:nth-child(3),.kpi:nth-child(3){animation-delay:.08s}
  .navbtn{transition:background-color .18s,color .18s}
  tbody tr{transition:background-color .15s}
  @keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
