<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>出勤差勤管理｜Jvision 系統 Demo</title>
<meta name="description" content="雲端打卡、外勤回報、異常判斷、請假簽核、智慧排班與工時計薪互動展示" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#16a34a; --accent2:#4ade80; --accent-dk:#15803d;
  --bg:#f1f5f4; --panel:#ffffff; --ink:#0f2419; --muted:#5b7268;
  --line:#e2ece7; --soft:#effaf3; --warn:#f59e0b; --danger:#ef4444; --info:#0ea5e9;
  --shadow:0 1px 2px rgba(16,60,40,.04),0 10px 30px rgba(16,60,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:radial-gradient(1200px 600px at 100% -10%,#dff5e6 0,transparent 55%),var(--bg);
  color:var(--ink); -webkit-font-smoothing:antialiased; min-height:100vh;
}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;vertical-align:middle;font-size:20px}
.wrap{max-width:1360px;margin:0 auto;padding:18px 20px 60px;min-width:0}

/* top bar */
.top{display:flex;align-items:center;gap:14px;margin-bottom:16px;min-width:0}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;box-shadow:0 8px 20px rgba(22,163,74,.32);flex:none}
.logo .material-symbols-outlined{font-size:26px}
.brand h1{font-size:18px;margin:0;font-weight:900;letter-spacing:.2px}
.brand p{margin:1px 0 0;font-size:12px;color:var(--muted);font-weight:600}
.top .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:700;color:var(--muted);box-shadow:var(--shadow)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(22,163,74,.16);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* nav */
nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;min-width:0}
nav button{flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-family:inherit;font-weight:700;font-size:13px;padding:10px 14px;border-radius:12px;cursor:pointer;transition:.16s;box-shadow:var(--shadow)}
nav button .material-symbols-outlined{font-size:19px}
nav button:hover{color:var(--accent-dk);border-color:var(--accent2);transform:translateY(-1px)}
nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent-dk));color:#fff;border-color:transparent;box-shadow:0 8px 18px rgba(22,163,74,.3)}
.nb{font-size:11px;font-weight:900;opacity:.7;background:rgba(0,0,0,.06);border-radius:6px;padding:1px 6px}
nav button.on .nb{background:rgba(255,255,255,.22);opacity:1}

/* screen head */
.shead{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px;min-width:0;flex-wrap:wrap}
.shead h2{margin:0;font-size:21px;font-weight:900;letter-spacing:.3px}
.shead .sub{font-size:13px;color:var(--muted);font-weight:600}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--accent-dk);border:1px solid var(--line)}

/* generic panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0}
.pad{padding:16px}
.ph{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;margin-bottom:2px}
.ph .material-symbols-outlined{font-size:19px;color:var(--accent)}
.psub{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:12px}

/* split layout signature */
.split{display:grid;grid-template-columns:340px 1fr;gap:16px;min-width:0}
.split.wide{grid-template-columns:380px 1fr}
@media(max-width:820px){.split,.split.wide{grid-template-columns:1fr}}

/* left list */
.list{display:flex;flex-direction:column;gap:8px}
.litem{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:default;transition:.16s;min-width:0}
.litem:hover{border-color:var(--accent2);background:var(--soft)}
.litem.sel{border-color:var(--accent);background:var(--soft);box-shadow:inset 3px 0 0 var(--accent)}
.av{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#dcfce7,#bbf7d0);color:var(--accent-dk);display:grid;place-items:center;font-weight:900;font-size:14px;flex:none}
.litem .nm{font-weight:800;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.litem .mt{font-size:11.5px;color:var(--muted);font-weight:600}
.litem .rgt{margin-left:auto;text-align:right;flex:none}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:440px){.kpis{grid-template-columns:1fr}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px;box-shadow:var(--shadow);min-width:0;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:64px;height:64px;border-radius:50%;background:var(--soft)}
.kpi .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;margin-bottom:9px;position:relative;z-index:1}
.kpi .lb{font-size:12px;color:var(--muted);font-weight:700;position:relative;z-index:1}
.kpi .vl{font-size:24px;font-weight:900;letter-spacing:.4px;margin-top:2px;position:relative;z-index:1}
.kpi .dl{font-size:11.5px;font-weight:800;margin-top:4px;position:relative;z-index:1}
.up{color:var(--accent-dk)} .dn{color:var(--danger)}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
.tbl th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:800;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:var(--soft)}
.mono{font-variant-numeric:tabular-nums;font-weight:700}

/* badges */
.bg{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-ok{background:#dcfce7;color:#15803d}
.b-warn{background:#fef3c7;color:#b45309}
.b-dan{background:#fee2e2;color:#b91c1c}
.b-info{background:#e0f2fe;color:#0369a1}
.b-mut{background:#eef2f0;color:#556}

/* progress */
.bar{height:8px;border-radius:6px;background:#eef2f0;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}

.chart{width:100%;height:280px;min-width:0}
.chart.sm{height:220px}

/* two-col content grids */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;min-width:0}
@media(max-width:820px){.g2{grid-template-columns:1fr}}
.g3{display:grid;grid-template-columns:2fr 1fr;gap:16px;min-width:0}
@media(max-width:820px){.g3{grid-template-columns:1fr}}

/* exception board */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;min-width:0}
@media(max-width:820px){.board{grid-template-columns:1fr}}
.col{background:#f7fbf9;border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.colh{display:flex;align-items:center;gap:8px;font-weight:900;font-size:13.5px;margin-bottom:10px}
.colh .cnt{margin-left:auto;font-size:12px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-weight:800}
.card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(16,60,40,.04)}
.card:last-child{margin-bottom:0}
.card .ct{font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px}
.card .cm{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:5px;display:flex;gap:8px;flex-wrap:wrap}
.stripe{border-left:4px solid var(--line)}
.s-dan{border-left-color:var(--danger)} .s-warn{border-left-color:var(--warn)} .s-info{border-left-color:var(--info)}

/* leave approval timeline */
.flowrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.step{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:6px 11px;border-radius:10px;border:1px solid var(--line);background:#fff}
.step.done{background:#dcfce7;color:#15803d;border-color:#bbf7d0}
.step.now{background:linear-gradient(135deg,var(--accent),var(--accent-dk));color:#fff;border-color:transparent}
.step.wait{color:var(--muted)}
.arrow{color:var(--muted);font-size:16px}

/* schedule calendar */
.cal{width:100%;border-collapse:separate;border-spacing:6px;min-width:640px}
.cal th{font-size:11.5px;color:var(--muted);font-weight:800;padding:4px}
.cell{background:#f7fbf9;border:1px solid var(--line);border-radius:10px;padding:7px;height:76px;vertical-align:top;min-width:0}
.cell .d{font-size:11px;font-weight:800;color:var(--muted)}
.shift{font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 5px;margin-top:3px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-d{background:#dcfce7;color:#15803d} .sh-n{background:#e0e7ff;color:#3730a3} .sh-e{background:#fef3c7;color:#92400e} .sh-o{background:#f1f5f9;color:#64748b}

/* stat strip */
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0}
@media(max-width:820px){.strip{grid-template-columns:repeat(2,1fr)}}
@media(max-width:440px){.strip{grid-template-columns:1fr}}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;min-width:0}
.stat .l{font-size:11.5px;color:var(--muted);font-weight:700}
.stat .v{font-size:20px;font-weight:900;margin-top:3px}

/* field report list */
.visit{display:flex;gap:11px;padding:11px 0;border-bottom:1px dashed var(--line);min-width:0}
.visit:last-child{border-bottom:none}
.vt{width:52px;flex:none;text-align:center;font-weight:900;font-size:13px;color:var(--accent-dk)}
.vt small{display:block;font-size:10px;color:var(--muted);font-weight:700}
.vbody{min-width:0;flex:1}
.vbody .vn{font-weight:800;font-size:13.5px}
.vbody .vd{font-size:12px;color:var(--muted);font-weight:600;margin-top:3px}

.rowline{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);min-width:0}
.rowline:last-child{border-bottom:none}
.rowline .rl{flex:1;min-width:0;font-size:13px;font-weight:700}
.rowline .rr{font-weight:900;font-variant-numeric:tabular-nums}

.foot{margin-top:26px;text-align:center;font-size:12px;color:var(--muted);font-weight:600}
.hidesm{display:inline}
@media(max-width:560px){
  nav button .nb{display:none}
  .navtx{display:none}
  nav button{padding:10px 12px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">schedule</span></div>
      <div>
        <h1>出勤差勤管理</h1>
        <p>Jvision HRIS · 雲端打卡與工時計薪平台</p>
      </div>
    </div>
    <div class="spacer"></div>
    <span class="pill"><span class="dot"></span>系統上線中 · 386 位員工</span>
  </div>

  <nav id="nav"></nav>
  <div id="screen"></div>

  <div class="foot">本頁為純 UI 系統展示（無後端），畫面與資料皆為擬真示範，與專案詳細頁的功能模組、運作流程一致。</div>
</div>

<script>
"use strict";
var MODS=[
  {i:"fingerprint",t:"雲端打卡",s:"GPS 與人臉定位上下班打卡"},
  {i:"add_location_alt",t:"外勤回報",s:"外勤軌跡與現場拜訪簽到回報"},
  {i:"rule",t:"異常判斷",s:"遲到早退缺卡自動偵測與分級"},
  {i:"fact_check",t:"請假簽核",s:"假別申請與多關卡電子簽核流"},
  {i:"calendar_month",t:"智慧排班",s:"班表編排、換班與工時上限控管"},
  {i:"timer",t:"工時計薪",s:"加班費、時數彙整與薪資結算"}
];
var chart=null;
function disposeChart(){ if(chart){ try{chart.dispose();}catch(e){} chart=null; } }
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

/* ---------- shared builders ---------- */
function shead(idx,tag){
  var m=MODS[idx];
  return '<div class="shead"><h2>'+esc(m.t)+'</h2><span class="sub">'+esc(m.s)+'</span><span class="tag" style="margin-left:auto"><span class="material-symbols-outlined" style="font-size:15px">bolt</span>'+esc(tag)+'</span></div>';
}
function kpi(color,ic,lb,vl,dl,dir){
  return '<div class="kpi"><div class="ic" style="background:'+color+'"><span class="material-symbols-outlined">'+ic+'</span></div>'+
    '<div class="lb">'+esc(lb)+'</div><div class="vl">'+esc(vl)+'</div>'+
    (dl?'<div class="dl '+(dir||'up')+'"><span class="material-symbols-outlined" style="font-size:14px">'+(dir==='dn'?'trending_down':'trending_up')+'</span> '+esc(dl)+'</div>':'')+'</div>';
}

/* ================= SCREEN 0 : 雲端打卡 ================= */
function s0(){
  var roster=[
    {n:"林詩涵",dep:"客服中心",in:"08:57",out:"—",st:"上班中",mode:"人臉",b:"b-ok",loc:"總部 3F"},
    {n:"陳柏宇",dep:"業務一部",in:"09:14",out:"—",st:"遲到 14 分",mode:"GPS",b:"b-warn",loc:"新莊據點"},
    {n:"黃美玲",dep:"財會部",in:"08:41",out:"—",st:"上班中",mode:"人臉",b:"b-ok",loc:"總部 5F"},
    {n:"張家豪",dep:"物流部",in:"—",out:"—",st:"未打卡",mode:"—",b:"b-dan",loc:"—"},
    {n:"吳雅婷",dep:"行銷部",in:"08:52",out:"—",st:"上班中",mode:"人臉",b:"b-ok",loc:"總部 4F"},
    {n:"劉建宏",dep:"業務二部",in:"08:30",out:"—",st:"外勤簽到",mode:"GPS",b:"b-info",loc:"桃園客戶"}
  ];
  var li=roster.map(function(r,ix){
    return '<div class="litem'+(ix===0?' sel':'')+'"><div class="av">'+esc(r.n.charAt(0))+'</div>'+
      '<div style="min-width:0"><div class="nm">'+esc(r.n)+'</div><div class="mt">'+esc(r.dep)+' · '+esc(r.loc)+'</div></div>'+
      '<div class="rgt"><span class="bg '+r.b+'">'+esc(r.st)+'</span><div class="mt" style="margin-top:4px">'+esc(r.in)+'</div></div></div>';
  }).join("");

  var left='<div class="panel pad"><div class="ph"><span class="material-symbols-outlined">groups</span>今日打卡名單</div>'+
    '<div class="psub">2026/08/13（四）· 已到 342 / 386 人</div><div class="list">'+li+'</div></div>';

  var detail='<div class="panel pad">'+
    '<div class="ph"><span class="material-symbols-outlined">badge</span>林詩涵 · 客服中心專員</div>'+
    '<div class="psub">員工編號 A1207 · 常日班 08:30–17:30</div>'+
    '<div class="strip" style="margin-bottom:14px">'+
      '<div class="stat"><div class="l">上班打卡</div><div class="v" style="color:var(--accent-dk)">08:57</div></div>'+
      '<div class="stat"><div class="l">驗證方式</div><div class="v">人臉</div></div>'+
      '<div class="stat"><div class="l">定位</div><div class="v" style="font-size:16px">總部 3F</div></div>'+
      '<div class="stat"><div class="l">本月出勤</div><div class="v">21 日</div></div>'+
    '</div>'+
    '<div class="ph" style="font-size:13px"><span class="material-symbols-outlined">timeline</span>本週打卡時間軸</div>'+
    '<div id="c0" class="chart sm"></div></div>';

  var right='<div class="g2" style="margin-top:16px">'+
    '<div class="panel pad"><div class="ph"><span class="material-symbols-outlined">devices</span>打卡管道分布</div><div class="psub">今日 342 筆打卡來源</div><div id="c0b" class="chart sm"></div></div>'+
    '<div class="panel pad"><div class="ph"><span class="material-symbols-outlined">verified_user</span>驗證即時狀態</div><div class="psub">臉部辨識與 GPS 圍籬</div>'+
      strip4([["人臉辨識成功","98.6%"],["GPS 圍籬命中","96.2%"],["異常拒絕","5 筆"],["平均打卡耗時","1.8 秒"]])+
    '</div></div>';

  return shead(0,'v0 · 上下班打卡與外勤回報')+
    '<div class="split wide">'+left+detail+'</div>'+right;
}
function strip4(arr){
  return '<div class="strip">'+arr.map(function(a){return '<div class="stat"><div class="l">'+esc(a[0])+'</div><div class="v">'+esc(a[1])+'</div></div>';}).join("")+'</div>';
}
function c0(){
  chart=echarts.init(document.getElementById("c0"));
  chart.setOption({
    grid:{left:36,right:14,top:16,bottom:24},
    tooltip:{trigger:"axis"},
    xAxis:{type:"category",data:["一","二","三","四","五"],axisLine:{lineStyle:{color:"#cbd5cf"}}},
    yAxis:{type:"value",min:8,max:10,axisLabel:{formatter:"{value}:00"},splitLine:{lineStyle:{color:"#eef2f0"}}},
    series:[{name:"上班打卡(時)",type:"line",smooth:true,symbolSize:8,data:[8.9,8.75,8.83,8.95,8.7],lineStyle:{width:3,color:"#16a34a"},itemStyle:{color:"#16a34a"},areaStyle:{color:"rgba(22,163,74,.12)"}}]
  });
}
function c0b(){
  var c=echarts.init(document.getElementById("c0b"));
  c.setOption({
    tooltip:{trigger:"item"},
    legend:{bottom:0,textStyle:{fontSize:11}},
    series:[{type:"pie",radius:["45%","72%"],center:["50%","44%"],avoidLabelOverlap:true,itemStyle:{borderColor:"#fff",borderWidth:2},label:{show:false},
      data:[{value:206,name:"人臉打卡",itemStyle:{color:"#16a34a"}},{value:98,name:"GPS 定位",itemStyle:{color:"#4ade80"}},{value:26,name:"外勤簽到",itemStyle:{color:"#0ea5e9"}},{value:12,name:"補打卡",itemStyle:{color:"#f59e0b"}}]}]
  });
}

/* ================= SCREEN 1 : 外勤回報 ================= */
function s1(){
  var reps=[
    {n:"劉建宏",dep:"業務二部",cnt:5,km:42,st:"回報中",b:"b-info"},
    {n:"周志明",dep:"技術服務",cnt:4,km:31,st:"已完成",b:"b-ok"},
    {n:"許雅琪",dep:"業務一部",cnt:3,km:18,st:"回報中",b:"b-info"},
    {n:"鄭文彬",dep:"客戶維運",cnt:6,km:55,st:"逾時未回",b:"b-warn"},
    {n:"蔡佩珊",dep:"業務三部",cnt:2,km:12,st:"已完成",b:"b-ok"}
  ];
  var li=reps.map(function(r,ix){
    return '<div class="litem'+(ix===0?' sel':'')+'"><div class="av">'+esc(r.n.charAt(0))+'</div>'+
      '<div style="min-width:0"><div class="nm">'+esc(r.n)+'</div><div class="mt">'+esc(r.dep)+'</div></div>'+

/* ---------- render controller ---------- */
var SCREENS=[s0,s1,s2,s3,s4,s5];
var CHARTS=[
  [c0,c0b],[c1],[c2,c2b],[c3],[c4,c4b],[c5,c5b]
];
function buildNav(cur){
  document.getElementById("nav").innerHTML=MODS.map(function(m,i){
    return '<button data-i="'+i+'" class="'+(i===cur?'on':'')+'"><span class="material-symbols-outlined">'+m.i+'</span><span class="navtx">'+esc(m.t)+'</span><span class="nb">'+i+'</span></button>';
  }).join("");
  Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){
    b.addEventListener("click",function(){ show(+b.getAttribute("data-i")); try{location.hash="v"+b.getAttribute("data-i");}catch(e){} });
  });
}
function show(i){
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  disposeChart();
  buildNav(i);
  var container=document.getElementById("screen");
  container.innerHTML=SCREENS[i]();
  void container.offsetHeight;
  var fns=CHARTS[i]||[];
  // primary chart uses shared 'chart' var (disposed on nav); extras are local
  fns.forEach(function(fn,ix){ try{ fn(); }catch(e){} });
}
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
