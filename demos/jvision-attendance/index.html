<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>出勤差勤管理｜Jvision 系統 Demo</title>
<meta name="description" content="雲端打卡、外勤回報、異常判斷、請假簽核、智慧排班與工時計薪互動展示" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --accent-dk:#0F766E;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --soft:#CCFBF1;
  --warn:#D97706;
  --danger:var(--color-destructive);
  --info:#0369A1;
  --shadow:8px 8px 0 #134E4A;
  --shadow-sm:4px 4px 0 #134E4A;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  color:var(--ink);
  background:
    linear-gradient(rgba(19,78,74,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(19,78,74,.08) 1px,transparent 1px),
    var(--bg);
  background-size:32px 32px;
  font-family:"Crimson Pro","Noto Serif TC","PMingLiU",serif;
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,[data-i]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:4px solid var(--color-ring);
  outline-offset:4px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  letter-spacing:normal;
  vertical-align:middle;
  font-size:21px;
}
.wrap{width:min(1420px,100%);margin:auto;padding:20px 22px 72px;min-width:0}
.top{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:stretch;
  gap:18px;
  margin-bottom:18px;
}
.brand{
  min-width:0;
  display:flex;
  align-items:center;
  gap:16px;
  padding:16px 18px;
  border:3px solid var(--ink);
  background:var(--panel);
  box-shadow:var(--shadow);
}
.logo{
  width:58px;
  height:58px;
  flex:none;
  display:grid;
  place-items:center;
  color:#000;
  background:var(--color-secondary);
  border:3px solid var(--ink);
}
.logo .material-symbols-outlined{font-size:32px}
.brand h1{
  margin:0;
  font-family:"Cinzel","Noto Serif TC",serif;
  font-size:clamp(20px,3vw,32px);
  font-weight:600;
  line-height:1;
  letter-spacing:.04em;
}
.brand p{margin:7px 0 0;color:var(--muted);font-weight:600}
.spacer{display:none}
.pill{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  min-width:235px;
  padding:14px 18px;
  color:#000;
  background:var(--color-accent);
  border:3px solid var(--ink);
  box-shadow:var(--shadow);
  font-weight:700;
}
.pill .dot{
  width:12px;
  height:12px;
  border:2px solid #000;
  background:#fff;
  animation:pulse 2.2s steps(2,end) infinite;
}
@keyframes pulse{50%{background:#000}}
nav{
  position:sticky;
  top:0;
  z-index:20;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:0;
  margin:0 0 28px;
  border:3px solid var(--ink);
  background:var(--panel);
  box-shadow:var(--shadow);
}
nav button{
  min-height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:10px;
  border:0;
  border-right:2px solid var(--ink);
  border-radius:0;
  color:var(--ink);
  background:var(--panel);
  font-weight:700;
  transition:background-color .18s,color .18s;
}
nav button:last-child{border-right:0}
nav button:hover{background:var(--soft)}
nav button.on{color:#000;background:var(--color-secondary)}
nav button.on::before{content:"ACTIVE";font-family:"Cinzel",serif;font-size:8px;letter-spacing:.08em}
.nb{
  min-width:23px;
  padding:1px 5px;
  color:#fff;
  background:var(--ink);
  border:1px solid var(--ink);
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:10px;
  text-align:center;
}
.shead{
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  align-items:end;
  gap:14px;
  margin:0 0 18px;
  padding:0 0 12px;
  border-bottom:5px solid var(--ink);
}
.shead h2{
  margin:0;
  font-family:"Cormorant Garamond","Noto Serif TC",serif;
  font-size:clamp(30px,4vw,48px);
  font-weight:700;
  line-height:.9;
}
.shead .sub{color:var(--muted);font-weight:600}
.tag{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:7px 10px;
  color:#000;
  background:var(--color-secondary);
  border:2px solid var(--ink);
  font-weight:700;
  font-size:13px;
}
.panel,.kpi,.stat{
  min-width:0;
  color:var(--color-card-foreground);
  background:var(--panel);
  border:3px solid var(--ink);
  border-radius:0;
  box-shadow:var(--shadow-sm);
}
.pad{padding:18px}
.ph{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:3px;
  font-size:17px;
  font-weight:700;
}
.ph .material-symbols-outlined{color:var(--accent-dk)}
.psub{margin-bottom:14px;color:var(--muted);font-weight:600}
.split{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px}
.split.wide{grid-template-columns:380px minmax(0,1fr)}
.list{display:flex;flex-direction:column;gap:9px}
.litem{
  min-width:0;
  display:flex;
  align-items:center;
  gap:11px;
  padding:11px;
  background:#fff;
  border:2px solid var(--ink);
  transition:background-color .18s,transform .18s;
}
.litem:hover{background:var(--soft);transform:translate(-2px,-2px)}
.litem.sel{background:#CCFBF1;border-left:9px solid var(--color-primary)}
.av{
  width:40px;
  height:40px;
  flex:none;
  display:grid;
  place-items:center;
  color:#000;
  background:var(--color-secondary);
  border:2px solid var(--ink);
  font-weight:700;
}
.litem .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.litem .mt{color:var(--muted);font-size:13px;font-weight:600}
.litem .rgt{margin-left:auto;text-align:right;flex:none}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{position:relative;overflow:hidden;padding:15px}
.kpi:nth-child(even){transform:translateY(8px)}
.kpi::after{
  content:"";
  position:absolute;
  right:-20px;
  top:-20px;
  width:70px;
  height:70px;
  background:var(--color-secondary);
  border:3px solid var(--ink);
  transform:rotate(18deg);
}
.kpi .ic{
  position:relative;
  z-index:1;
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  margin-bottom:10px;
  color:#000!important;
  border:2px solid var(--ink);
}
.kpi .lb{position:relative;z-index:1;color:var(--muted);font-weight:600}
.kpi .vl{
  position:relative;
  z-index:1;
  margin-top:2px;
  font-family:"Cormorant Garamond","Noto Serif TC",serif;
  font-size:30px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.kpi .dl{position:relative;z-index:1;margin-top:4px;font-weight:700}
.up{color:#0F766E}.dn{color:#B91C1C}
.tbl{width:100%;min-width:520px;border-collapse:collapse;font-size:14px}
.tbl th,.cal th{
  padding:10px;
  color:#fff;
  background:var(--ink);
  border:2px solid var(--ink);
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
}
.tbl td{padding:11px 10px;border:2px solid var(--ink);vertical-align:middle}
.tbl tbody tr:nth-child(even){background:#F0FDFA}
.tbl tbody tr:hover{background:var(--soft)}
.tbl td:last-child,.tbl th:last-child{text-align:right}
.mono,.vt,.rr,.tbl td:nth-child(2),.tbl td:last-child{
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-variant-numeric:tabular-nums;
}
.bg{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 8px;
  border:2px solid currentColor;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
}
.bg::before{font-family:"Material Symbols Outlined";font-size:14px}
.b-ok{color:#0F766E;background:#CCFBF1}.b-ok::before{content:"check_circle"}
.b-warn{color:#92400E;background:#FEF3C7}.b-warn::before{content:"warning"}
.b-dan{color:#B91C1C;background:#FEE2E2}.b-dan::before{content:"error"}
.b-info{color:#075985;background:#E0F2FE}.b-info::before{content:"info"}
.b-mut{color:#475569;background:#F1F5F9}.b-mut::before{content:"schedule"}
.bar{height:10px;background:#fff;border:2px solid var(--ink);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--color-primary)}
.chart{width:100%;height:280px;min-width:0}
.chart.sm{height:220px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.g3{display:grid;grid-template-columns:2fr 1fr;gap:18px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.col{
  min-width:0;
  padding:12px;
  background:var(--color-muted);
  border:3px solid var(--ink);
}
.col:nth-child(2){transform:translateY(8px)}
.colh{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:700}
.colh .cnt{
  margin-left:auto;
  padding:2px 8px;
  color:#fff;
  background:var(--ink);
  border:2px solid var(--ink);
  font-family:ui-monospace,monospace;
}
.card{margin-bottom:9px;padding:11px;background:#fff;border:2px solid var(--ink)}
.card:last-child{margin-bottom:0}
.card .ct{display:flex;align-items:center;gap:6px;font-weight:700}
.card .cm{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px;color:var(--muted);font-size:13px;font-weight:600}
.stripe{border-left-width:9px}
.s-dan{border-left-color:var(--danger)}.s-warn{border-left-color:var(--warn)}.s-info{border-left-color:var(--info)}
.flowrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.step{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:7px 10px;
  background:#fff;
  border:2px solid var(--ink);
  font-weight:700;
}
.step.done{color:#0F766E;background:#CCFBF1}
.step.now{color:#000;background:var(--color-accent);border-width:3px}
.step.wait{color:var(--muted)}
.arrow{color:var(--ink)}
.cal{width:100%;min-width:640px;border-collapse:collapse}
.cal th{text-align:center}
.cell{
  min-width:0;
  height:78px;
  padding:7px;
  vertical-align:top;
  background:#fff;
  border:2px solid var(--ink);
}
.cell .d{color:var(--muted);font-size:11px;font-weight:700}
.shift{
  display:block;
  overflow:hidden;
  margin-top:3px;
  padding:3px 6px;
  border:1px solid currentColor;
  font-size:11px;
  font-weight:700;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.sh-d{color:#0F766E;background:#CCFBF1}
.sh-n{color:#3730A3;background:#E0E7FF}
.sh-e{color:#92400E;background:#FEF3C7}
.sh-o{color:#475569;background:#F1F5F9}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{padding:12px;box-shadow:none}
.stat:nth-child(2n){background:var(--soft)}
.stat .l{color:var(--muted);font-weight:600}
.stat .v{
  margin-top:3px;
  font-family:"Cormorant Garamond","Noto Serif TC",serif;
  font-size:24px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.visit{display:flex;gap:11px;padding:11px 0;border-bottom:2px dashed var(--ink)}
.visit:last-child{border-bottom:0}
.vt{width:58px;flex:none;color:var(--accent-dk);font-weight:700;text-align:center}
.vt small{display:block;color:var(--muted);font-family:"Crimson Pro",serif;font-size:11px}
.vbody{min-width:0;flex:1}
.vbody .vn{font-weight:700}
.vbody .vd{margin-top:3px;color:var(--muted);font-size:14px;font-weight:600}
.rowline{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:2px solid var(--ink)}
.rowline:last-child{border-bottom:0}
.rowline .rl{min-width:0;flex:1;font-weight:600}
.rowline .rr{font-weight:700;text-align:right}
.foot{
  margin-top:34px;
  padding:14px;
  color:#fff;
  background:var(--ink);
  border:3px solid var(--ink);
  font-weight:600;
  text-align:center;
}
#screen>*>.panel,#screen>.panel,#screen>.kpis,#screen>.split,#screen>.g2,#screen>.g3{
  animation:reveal .35s ease-out both;
}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:1024px){
  nav{grid-template-columns:repeat(3,1fr)}
  nav button:nth-child(3){border-right:0}
  nav button:nth-child(-n+3){border-bottom:2px solid var(--ink)}
  .split,.split.wide{grid-template-columns:320px minmax(0,1fr)}
}
@media(max-width:820px){
  .wrap{padding:14px 14px 54px}
  .top{grid-template-columns:1fr}
  .pill{min-width:0}
  nav{position:relative;grid-template-columns:repeat(2,1fr)}
  nav button:nth-child(n){border-right:2px solid var(--ink);border-bottom:2px solid var(--ink)}
  nav button:nth-child(2n){border-right:0}
  nav button:nth-last-child(-n+2){border-bottom:0}
  .shead{grid-template-columns:1fr}
  .shead .tag{justify-self:start;margin-left:0!important}
  .split,.split.wide,.g2,.g3{grid-template-columns:1fr}
  .kpis,.strip{grid-template-columns:repeat(2,1fr)}
  .kpi:nth-child(even),.col:nth-child(2){transform:none}
  .board{grid-template-columns:1fr}
}
@media(max-width:560px){
  .brand{align-items:flex-start;padding:13px}
  .logo{width:48px;height:48px}
  .brand p{font-size:13px}
  nav button{justify-content:flex-start;min-height:52px}
  nav button.on::before,.nb{display:none}
  .kpis,.strip{grid-template-columns:1fr}
  .pad{padding:14px}
  .shead h2{font-size:36px}
  .pill{font-size:14px}
}
@media(max-width:390px){
  .navtx{font-size:14px}
  nav button{padding:8px 7px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  .pill .dot{animation:none}
  #screen>*>.panel,#screen>.panel,#screen>.kpis,#screen>.split,#screen>.g2,#screen>.g3{
    animation:none;
  }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">schedule</span></div>
      <div>
        <h1>出勤差勤管理</h1>
        <p>Jvision HRIS · 雲端打卡與工時計薪平台</p>
      </div>
    </div>
    <div class="spacer"></div>
    <span class="pill"><span class="dot"></span>系統上線中 · 386 位員工</span>
  </div>

  <nav id="nav" aria-label="系統功能"></nav>
  <main id="screen"></main>

  <div class="foot">本頁為純 UI 系統展示（無後端），畫面與資料皆為擬真示範，與專案詳細頁的功能模組、運作流程一致。</div>
</div>

<script>
"use strict";
var MODS=[
  {i:"fingerprint",t:"雲端打卡",s:"GPS 與人臉定位上下班打卡"},
  {i:"add_location_alt",t:"外勤回報",s:"外勤軌跡與現場拜訪簽到回報"},
  {i:"rule",t:"異常判斷",s:"遲到早退缺卡自動偵測與分級"},
  {i:"fact_check",t:"請假簽核",s:"假別申請與多關卡電子簽核流"},
  {i:"calendar_month",t:"智慧排班",s:"班表編排、換班與工時上限控管"},
  {i:"timer",t:"工時計薪",s:"加班費、時數彙整與薪資結算"}
];
var chart=null;
var extraCharts=[];
function disposeChart(){
  if(chart){try{chart.dispose();}catch(e){}chart=null;}
  extraCharts.forEach(function(c){try{c.dispose();}catch(e){}});
  extraCharts=[];
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function shead(idx,tag){
  var m=MODS[idx];
  return '<div class="shead"><h2>'+esc(m.t)+'</h2><span class="sub">'+esc(m.s)+'</span><span class="tag" style="margin-left:auto"><span class="material-symbols-outlined" style="font-size:15px">bolt</span>'+esc(tag)+'</span></div>';
}
function kpi(color,ic,lb,vl,dl,dir){
  return '<div class="kpi"><div class="ic" style="background:'+color+'"><span class="material-symbols-outlined">'+ic+'</span></div>'+
    '<div class="lb">'+esc(lb)+'</div><div class="vl">'+esc(vl)+'</div>'+
    (dl?'<div class="dl '+(dir||'up')+'"><span class="material-symbols-outlined" style="font-size:14px">'+(dir==="dn"?"trending_down":"trending_up")+'</span> '+esc(dl)+'</div>':"")+'</div>';
}
function strip4(arr){
  return '<div class="strip">'+arr.map(function(a){return '<div class="stat"><div class="l">'+esc(a[0])+'</div><div class="v">'+esc(a[1])+'</div></div>';}).join("")+'</div>';
}
function keepChart(c,primary){if(primary){chart=c;}else{extraCharts.push(c);}return c;}
function axisColor(){return "#134E4A";}
function gridColor(){return "#D4E7E5";}

function s0(){
  var roster=[
    {n:"林詩涵",dep:"客服中心",in:"08:57",out:"—",st:"上班中",mode:"人臉",b:"b-ok",loc:"總部 3F"},
    {n:"陳柏宇",dep:"業務一部",in:"09:14",out:"—",st:"遲到 14 分",mode:"GPS",b:"b-warn",loc:"新莊據點"},
    {n:"黃美玲",dep:"財會部",in:"08:41",out:"—",st:"上班中",mode:"人臉",b:"b-ok",loc:"總部 5F"},
    {n:"張家豪",dep:"物流部",in:"—",out:"—",st:"未打卡",mode:"—",b:"b-dan",loc:"—"},
    {n:"吳雅婷",dep:"行銷部",in:"08:52",out:"—",st:"上班中",mode:"人臉",b:"b-ok",loc:"總部 4F"},
    {n:"劉建宏",dep:"業務二部",in:"08:30",out:"—",st:"外勤簽到",mode:"GPS",b:"b-info",loc:"桃園客戶"}
  ];
  var li=roster.map(function(r,ix){
    return '<div class="litem'+(ix===0?' sel':'')+'"><div class="av">'+esc(r.n.charAt(0))+'</div>'+
      '<div style="min-width:0"><div class="nm">'+esc(r.n)+'</div><div class="mt">'+esc(r.dep)+' · '+esc(r.loc)+'</div></div>'+

var SCREENS=[s0,s1,s2,s3,s4,s5];
var CHARTS=[[c0,c0b],[c1],[c2,c2b],[c3],[c4,c4b],[c5,c5b]];
function buildNav(cur){
  document.getElementById("nav").innerHTML=MODS.map(function(m,i){
    return '<button type="button" data-i="'+i+'" class="'+(i===cur?'on':'')+'" aria-current="'+(i===cur?'page':'false')+'">'+
      '<span class="material-symbols-outlined" aria-hidden="true">'+m.i+'</span><span class="navtx">'+esc(m.t)+'</span><span class="nb">'+i+'</span></button>';
  }).join("");
  Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){
    b.addEventListener("click",function(){
      var n=+b.getAttribute("data-i");
      show(n);
      try{location.hash="v"+n;}catch(e){}
    });
  });
}
function show(i){
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  disposeChart();
  buildNav(i);
  var container=document.getElementById("screen");
  container.innerHTML=SCREENS[i]();
  container.setAttribute("aria-label",MODS[i].t);
  void container.offsetHeight;
  (CHARTS[i]||[]).forEach(function(fn){try{fn();}catch(e){}});
}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return;}
  show(Math.min(+m[1],5));
  try{window.scrollTo(0,0);}catch(e){}
}
window.addEventListener("hashchange",fromHash);
window.addEventListener("resize",function(){
  if(chart){try{chart.resize();}catch(e){}}
  extraCharts.forEach(function(c){try{c.resize();}catch(e){}});
});
fromHash();
