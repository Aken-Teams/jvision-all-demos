<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MSL 濕敏度管理系統｜控制中心</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#334155;
  --color-on-primary:#fff;
  --color-secondary:#475569;
  --color-on-secondary:#fff;
  --color-accent:#059669;
  --color-on-accent:#fff;
  --color-background:#f8fafc;
  --color-foreground:#0f172a;
  --color-card:#fff;
  --color-card-foreground:#0f172a;
  --color-muted:#f2f3f4;
  --color-muted-foreground:#475569;
  --color-border:#e6e8ea;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#334155;
  --blue:#334155;
  --ink:#0f172a;
  --muted:#475569;
  --line:#e6e8ea;
  --ok:#047857;
  --warn:#b45309;
  --bad:#dc2626;
  --info:#0369a1;
  --radius:12px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  background:var(--color-background);
  color:var(--color-foreground);
  font-family:"Open Sans",sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,a,[data-i]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid rgba(51,65,85,.34);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  font-size:20px;
  line-height:1;
  letter-spacing:normal;
  text-transform:none;
  display:inline-block;
  white-space:nowrap;
  word-wrap:normal;
  direction:ltr;
  -webkit-font-feature-settings:"liga";
  -webkit-font-smoothing:antialiased;
}
.msy{min-height:100vh}
.topbar{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(248,250,252,.96);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(10px);
}
.topbar-in{
  max-width:1440px;
  min-height:68px;
  margin:auto;
  padding:10px 24px;
  display:flex;
  align-items:center;
  gap:18px;
}
.brand{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:240px;
}
.logo{
  width:40px;
  height:40px;
  flex:0 0 40px;
  display:grid;
  place-items:center;
  border-radius:10px;
  color:#fff;
  background:var(--color-primary);
}
.logo .material-symbols-outlined{font-size:22px}
.brand b{
  display:block;
  font:600 14px/1.3 "Poppins","Open Sans",sans-serif;
  color:var(--ink);
  letter-spacing:.01em;
}
.brand span{
  display:block;
  margin-top:2px;
  color:var(--muted);
  font-size:10px;
  letter-spacing:.04em;
}
.navbtns{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:4px;
}
.nb{
  min-height:40px;
  padding:8px 10px;
  display:flex;
  align-items:center;
  gap:6px;
  border:1px solid transparent;
  border-radius:9px;
  color:var(--muted);
  background:transparent;
  font-size:12px;
  font-weight:700;
  transition:color .15s ease,background-color .15s ease,border-color .15s ease;
}
.nb .material-symbols-outlined{font-size:18px}
.nb:hover{
  color:var(--ink);
  background:var(--color-muted);
}
.nb.on{
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-color:var(--color-primary);
}
.live{
  min-height:36px;
  padding:7px 10px;
  display:flex;
  align-items:center;
  gap:7px;
  border-left:1px solid var(--line);
  color:var(--muted);
  font-size:11px;
  white-space:nowrap;
}
.status-dot{
  width:9px;
  height:9px;
  border:2px solid #a7f3d0;
  border-radius:50%;
  background:var(--color-accent);
}
.wrap{
  width:min(100%,1440px);
  margin:auto;
  padding:28px 24px 64px;
}
.scr-head{
  margin-bottom:20px;
  padding:24px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  border:1px solid var(--line);
  border-left:5px solid var(--color-accent);
  border-radius:var(--radius);
  background:var(--color-card);
}
.scr-title{
  display:flex;
  align-items:flex-start;
  gap:12px;
}
.scr-icon{
  width:42px;
  height:42px;
  flex:0 0 42px;
  display:grid;
  place-items:center;
  border-radius:10px;
  color:var(--color-on-primary);
  background:var(--color-primary);
}
.scr-head h1{
  margin:0 0 5px;
  color:var(--ink);
  font:600 clamp(20px,2.2vw,27px)/1.2 "Poppins","Open Sans",sans-serif;
}
.scr-head p{margin:0;color:var(--muted);font-size:13px}
.chip,.bd{
  display:inline-flex;
  align-items:center;
  gap:5px;
  white-space:nowrap;
}
.chip{
  min-height:34px;
  padding:6px 11px;
  border:1px solid #a7f3d0;
  border-radius:999px;
  color:#065f46;
  background:#ecfdf5;
  font-size:11px;
  font-weight:700;
}
.chip .material-symbols-outlined{font-size:16px}
.grid{display:grid;gap:14px;min-width:0}
.g-kpi4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-23{grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr)}
.g-32{grid-template-columns:minmax(300px,1fr) minmax(0,1.6fr)}
.g-cab{grid-template-columns:repeat(4,minmax(0,1fr))}
.card,.kpi,.ec,.cab{
  min-width:0;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:var(--color-card);
  transition:border-color .15s ease,background-color .15s ease,transform .15s ease;
}
.card:hover,.kpi:hover,.ec:hover,.cab:hover{
  border-color:#cbd5e1;
  background:#fff;
}
.card{padding:18px}
.card.pad0{padding:0;overflow:hidden}
.card h3{
  margin:0 0 3px;
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--ink);
  font:600 14px/1.4 "Poppins","Open Sans",sans-serif;
}
.card h3 .material-symbols-outlined{color:var(--color-accent);font-size:19px}
.sub{margin-bottom:13px;color:var(--muted);font-size:11px}
.kpi{
  min-height:128px;
  padding:17px;
  position:relative;
  overflow:hidden;
}
.kpi:before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:3px;
  background:var(--color-accent);
}
.kpi .lab{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:11px;
  font-weight:700;
}
.kpi .lab .material-symbols-outlined{
  width:28px;
  height:28px;
  display:grid;
  place-items:center;
  border-radius:7px;
  color:var(--color-primary);
  background:var(--color-muted);
  font-size:17px;
}
.kpi .val{
  margin:8px 0 3px;
  color:var(--ink);
  font:600 27px/1.2 "Poppins","Open Sans",sans-serif;
  font-variant-numeric:tabular-nums;
}
.kpi .val small{
  margin-left:3px;
  color:var(--muted);
  font:600 12px "Open Sans",sans-serif;
}
.delta{
  display:inline-flex;
  align-items:center;
  gap:3px;
  font-size:11px;
  font-weight:700;
}
.up{color:var(--ok)}
.down{color:var(--bad)}
.flat{color:var(--muted)}
.tw{overflow-x:auto;overscroll-behavior-inline:contain}
table{
  width:100%;
  min-width:560px;
  border-collapse:collapse;
  color:var(--ink);
  font-size:12px;
}
th,td{
  padding:11px 13px;
  border-bottom:1px solid var(--line);
  text-align:left;
  white-space:nowrap;
}
th{
  position:sticky;
  top:0;
  z-index:1;
  color:#334155;
  background:#f1f5f9;
  font-size:10px;
  font-weight:700;
  letter-spacing:.05em;
  text-transform:uppercase;
}
tbody tr{transition:background-color .15s ease}
tbody tr:hover{background:#f0fdf4}
tbody tr:last-child td{border-bottom:0}
td b{font-weight:700}
td:nth-child(n+3).num,th.num{text-align:right}
.mono{
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
  font-variant-numeric:tabular-nums;
  letter-spacing:0;
}
.bd{
  min-height:24px;
  padding:3px 8px;
  border:1px solid transparent;
  border-radius:999px;
  font-size:10px;
  font-weight:700;
  line-height:1.3;
}
.bd .material-symbols-outlined{font-size:13px}
.bd-ok{color:#065f46;background:#ecfdf5;border-color:#a7f3d0}
.bd-warn{color:#92400e;background:#fffbeb;border-color:#fde68a}
.bd-bad{color:#991b1b;background:#fef2f2;border-color:#fecaca}
.bd-info{color:#075985;background:#f0f9ff;border-color:#bae6fd}
.bd-mut{color:#475569;background:#f1f5f9;border-color:#cbd5e1}
.bd-acc{color:#065f46;background:#ecfdf5;border-color:#a7f3d0}
.bar{
  height:7px;
  min-width:72px;
  overflow:hidden;
  border-radius:999px;
  background:#e2e8f0;
}
.bar i{display:block;height:100%;border-radius:inherit}
.chartbox{min-width:0;overflow:hidden}
.expo{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}
.ec{padding:15px}
.ec .top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
}
.ec .pn{font-weight:700;font-size:13px}
.ec .pd{margin-top:2px;color:var(--muted);font-size:10px}
.ec .ring{margin-top:14px}
.ec .big{
  color:var(--ink);
  font:600 25px/1.2 "Poppins","Open Sans",sans-serif;
  font-variant-numeric:tabular-nums;
}
.ec .big small{color:var(--muted);font:600 11px "Open Sans",sans-serif}
.cab{padding:14px}
.cab .cn{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--ink);
  font-weight:700;
  font-size:12px;
}
.cab .rd{
  margin-top:12px;
  display:flex;
  justify-content:space-between;
  gap:10px;
}
.cab .rv{
  color:var(--ink);
  font:600 19px/1.2 "Poppins","Open Sans",sans-serif;
  font-variant-numeric:tabular-nums;
}
.cab .rl{margin-top:2px;color:var(--muted);font-size:10px}
.tl{position:relative;padding-left:23px}
.tl:before{
  content:"";
  position:absolute;
  left:6px;
  top:4px;
  bottom:8px;
  width:2px;
  background:#cbd5e1;
}
.tl .it{position:relative;padding:0 0 17px 8px}
.tl .it:last-child{padding-bottom:0}
.tl .it:before{
  content:"";
  position:absolute;
  left:-21px;
  top:4px;
  width:10px;
  height:10px;
  border:2px solid #fff;
  border-radius:50%;
  background:var(--color-primary);
  outline:1px solid var(--color-primary);
}
.tl .it.g:before{background:var(--ok);outline-color:var(--ok)}
.tl .it.r:before{background:var(--bad);outline-color:var(--bad)}
.tl .tt{color:var(--ink);font-size:12px;font-weight:700}
.tl .td{margin-top:3px;color:var(--muted);font-size:11px}
.oven{display:flex;flex-direction:column;gap:11px}
.ovrow{
  display:grid;
  grid-template-columns:140px minmax(0,1fr);
  align-items:center;
  gap:12px;
}
.ovrow .on{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--ink);
  font-size:11px;
  font-weight:700;
}
.ovtrack{
  position:relative;
  height:36px;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:8px;
  background:#f1f5f9;
}
.ovseg{
  position:absolute;
  top:4px;
  bottom:4px;
  padding:0 8px;
  display:flex;
  align-items:center;
  overflow:hidden;
  border-radius:5px;
  color:#fff;
  font-size:10px;
  font-weight:700;
  white-space:nowrap;
}
.legend{
  margin-top:12px;
  display:flex;
  flex-wrap:wrap;
  gap:13px;
  color:var(--muted);
  font-size:10px;
}
.legend i{
  width:10px;
  height:10px;
  margin-right:5px;
  display:inline-block;
  border-radius:2px;
  vertical-align:-1px;
}
.flow-note{
  margin-top:16px;
  padding:13px 15px;
  display:flex;
  align-items:flex-start;
  gap:10px;
  border:1px solid #a7f3d0;
  border-radius:10px;
  color:#334155;
  background:#f0fdf4;
  font-size:12px;
}
.flow-note .material-symbols-outlined{
  flex:none;
  color:var(--color-accent);
  font-size:18px;
}
.flow-note b{color:#065f46}
.grid-item{animation:enter .4s both cubic-bezier(.2,.85,.35,1.2);animation-delay:var(--delay,0ms)}
@keyframes enter{
  from{opacity:0;transform:translateY(12px) scale(.97)}
  to{opacity:1;transform:none}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{
    animation-duration:.01ms!important;
    animation-delay:0ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}
@media(max-width:1120px){
  .topbar-in{flex-wrap:wrap}
  .navbtns{order:3;width:100%;overflow-x:auto;padding-bottom:2px}
  .nb{flex:1;justify-content:center}
  .live{margin-left:auto}
  .g-kpi4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-cab{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:820px){
  .wrap{padding:20px 16px 48px}
  .topbar-in{padding-inline:16px}
  .g-2,.g-23,.g-32,.expo{grid-template-columns:1fr}
  .scr-head{align-items:flex-start;padding:19px}
}
@media(max-width:560px){
  .topbar-in{gap:10px}
  .brand{min-width:0}
  .brand span,.live .lbl,.nb .lbl{display:none}
  .live{border:0;padding-inline:4px}
  .navbtns{gap:5px}
  .nb{min-width:44px;padding:9px}
  .g-kpi4,.g-cab{grid-template-columns:1fr}
  .scr-head{display:block}
  .chip{margin-top:14px}
  .ovrow{grid-template-columns:1fr}
  .card{padding:15px}
}
</style>
</head>
<body>
<div class="msy">
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo" aria-hidden="true"><span class="material-symbols-outlined">water_drop</span></div>
      <div><b>MSL 濕敏度管理中心</b><span>Moisture Sensitivity Level · Control Room</span></div>
    </div>
    <nav class="navbtns" id="nav" aria-label="系統功能"></nav>
    <div class="live"><span class="status-dot" aria-hidden="true"></span><span class="lbl">產線連線中 · IoT 同步</span></div>
  </div>
</header>
<main class="wrap" id="app"></main>
</div>
<script>
(function(){
"use strict";
var A=window.ApexCharts,charts=[];
var C={primary:"#334155",accent:"#059669",accent2:"#10b981",muted:"#475569",line:"#e6e8ea",ok:"#047857",warn:"#b45309",bad:"#dc2626",info:"#0369a1",card:"#ffffff"};

function killCharts(){
  charts.forEach(function(c){try{c.destroy()}catch(e){}});
  charts=[];
}
function mk(id,opt){
  var el=document.getElementById(id);
  if(!el||!A)return;
  opt.chart=Object.assign({
    redrawOnParentResize:false,
    redrawOnWindowResize:false,
    animations:{enabled:false},
    foreColor:C.muted,
    fontFamily:"Open Sans, sans-serif",
    toolbar:{show:false}
  },opt.chart||{});
  opt.grid=Object.assign({borderColor:C.line,strokeDashArray:3},opt.grid||{});
  opt.tooltip=Object.assign({theme:"light"},opt.tooltip||{});
  try{var chart=new A(el,opt);chart.render();charts.push(chart)}catch(e){}
}
var NAV=[
  {i:0,icon:"inventory_2",t:"料件建檔"},
  {i:1,icon:"history",t:"開封計時"},
  {i:2,icon:"warning",t:"超時預警"},
  {i:3,icon:"thermostat",t:"烘烤排程"},
  {i:4,icon:"monitoring",t:"乾燥櫃 IoT"},
  {i:5,icon:"verified",t:"上線核可"}
];
var navEl=document.getElementById("nav");
navEl.innerHTML=NAV.map(function(n){
  return '<button type="button" class="nb" data-i="'+n.i+'" aria-label="'+n.t+'"><span class="material-symbols-outlined" aria-hidden="true">'+n.icon+'</span><span class="lbl">'+n.t+'</span></button>';
}).join("");
navEl.addEventListener("click",function(e){
  var b=e.target.closest("[data-i]");
  if(b)location.hash="v"+b.getAttribute("data-i");
});
function setNav(i){
  navEl.querySelectorAll("[data-i]").forEach(function(b){
    var on=+b.getAttribute("data-i")===i;
    b.classList.toggle("on",on);
    b.setAttribute("aria-current",on?"page":"false");
  });
}
function head(icon,title,sub,chip){
  return '<div class="scr-head grid-item"><div class="scr-title"><span class="scr-icon material-symbols-outlined" aria-hidden="true">'+icon+'</span><div><h1>'+title+'</h1><p>'+sub+'</p></div></div><span class="chip"><span class="material-symbols-outlined" aria-hidden="true">bolt</span>'+chip+'</span></div>';
}
function kpi(icon,lab,val,delta,dir){
  var unit="",vv=String(val),m=String(val).match(/^([\d,.]+)(.*)$/);
  if(m){vv=m[1];unit=m[2]}
  var arrow=dir==="up"?"trending_up":dir==="down"?"trending_down":"remove";
  return '<div class="kpi grid-item"><div class="lab"><span class="material-symbols-outlined" aria-hidden="true">'+icon+'</span>'+lab+'</div><div class="val">'+vv+(unit?'<small>'+unit+'</small>':"")+'</div><div class="delta '+dir+'"><span class="material-symbols-outlined" aria-hidden="true" style="font-size:14px">'+arrow+'</span>'+delta+'</div></div>';
}
function tlItem(cls,tt,td){
  return '<div class="it '+cls+'"><div class="tt">'+tt+'</div><div class="td">'+td+'</div></div>';
}
function flowNote(txt){
  return '<div class="flow-note grid-item"><span class="material-symbols-outlined" aria-hidden="true">account_tree</span><div>'+txt+'</div></div>';
}
function stagger(){
  document.querySelectorAll(".grid-item,.card,.ec,.cab").forEach(function(el,i){
    el.classList.add("grid-item");
    el.style.setProperty("--delay",Math.min(i,10)*55+"ms");
  });
}
function s0(){
  var rows=[
    ["CAP-0402-X7R","貼片電容 0402","MSL 1","無限制","卷帶","18,400","MuRata","ok"],
    ["IC-BGA-256","BGA 封裝主控 IC","MSL 4","72 hr","托盤","1,260","NXP","warn"],
    ["QFN-48-PMIC","電源管理 QFN-48","MSL 3","168 hr","卷帶","5,880","TI","ok"],
    ["LED-2835-WW","白光 LED 2835","MSL 3","168 hr","卷帶","42,000","Nichia","ok"],
    ["BGA-576-SoC","SoC BGA-576","MSL 5","48 hr","托盤","320","Qualcomm","bad"],
    ["CON-USB-C","USB-C 連接器","MSL 2","1 年","托盤","7,150","Fortech","ok"],
    ["SDRAM-96FBGA","DDR4 SDRAM 96FBGA","MSL 4","72 hr","托盤","980","Micron","warn"],
    ["XTAL-SMD-32k","石英振盪器 SMD","MSL 2","1 年","卷帶","12,300","Epson","ok"]
  ];
  var level={"MSL 1":"bd-ok","MSL 2":"bd-info","MSL 3":"bd-acc","MSL 4":"bd-warn","MSL 5":"bd-bad"};
