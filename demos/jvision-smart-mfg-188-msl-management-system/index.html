<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MSL 濕敏度管理系統｜控制中心</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
  :root{
    --accent:#7c3aed; --accent2:#a78bfa; --bg:#0b0b14; --panel:#15151f; --panel2:#1c1c2b;
    --line:#2a2a3d; --txt:#e7e7f2; --mut:#9a9ab5; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --info:#38bdf8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter','Noto Sans TC',sans-serif;background:var(--bg);color:var(--txt);
    -webkit-font-smoothing:antialiased;min-height:100vh;
  }
  .msy{background:radial-gradient(1200px 500px at 80% -10%,rgba(124,58,237,.18),transparent 60%),var(--bg);min-height:100vh;}
  .material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
  .topbar{
    position:sticky;top:0;z-index:50;background:rgba(13,13,22,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .topbar-in{max-width:1400px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;flex:none;}
  .brand .logo .material-symbols-outlined{font-size:20px;}
  .brand b{font-size:15px;letter-spacing:.3px;white-space:nowrap;}
  .brand span{display:block;font-size:11px;color:var(--mut);white-space:nowrap;}
  .navbtns{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0;}
  .nb{
    display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:9px;border:1px solid transparent;
    background:transparent;color:var(--mut);cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;transition:.15s;min-width:0;
  }
  .nb .material-symbols-outlined{font-size:18px;}
  .nb:hover{color:var(--txt);background:var(--panel);}
  .nb.on{color:#fff;background:linear-gradient(135deg,var(--accent),#6d28d9);border-color:var(--accent2);box-shadow:0 4px 14px rgba(124,58,237,.35);}
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);flex:none;}
  .live{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut);padding:6px 10px;border:1px solid var(--line);border-radius:20px;}
  .wrap{max-width:1400px;margin:0 auto;padding:22px 18px 60px;}
  .scr-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
  .scr-head h1{font-size:22px;margin:0 0 4px;font-weight:800;font-family:'Noto Sans TC';}
  .scr-head p{margin:0;color:var(--mut);font-size:13px;}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 11px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:var(--accent2);font-weight:600;}
  .chip .material-symbols-outlined{font-size:15px;}
  .grid{display:grid;gap:14px;min-width:0;}
  .g-kpi4{grid-template-columns:repeat(4,1fr);}
  .g-2{grid-template-columns:1fr 1fr;}
  .g-3{grid-template-columns:repeat(3,1fr);}
  .g-23{grid-template-columns:1.6fr 1fr;}
  .g-32{grid-template-columns:1fr 1.6fr;}
  .g-cab{grid-template-columns:repeat(4,1fr);}
  @media(max-width:820px){
    .g-kpi4,.g-2,.g-3,.g-23,.g-32,.g-cab{grid-template-columns:1fr;}
  }
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;}
  .card.pad0{padding:0;overflow:hidden;}
  .card h3{margin:0 0 3px;font-size:14px;font-weight:700;font-family:'Noto Sans TC';display:flex;align-items:center;gap:8px;}
  .card h3 .material-symbols-outlined{font-size:18px;color:var(--accent2);}
  .card .sub{font-size:11px;color:var(--mut);margin-bottom:12px;}
  .kpi{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:15px 16px;position:relative;overflow:hidden;min-width:0;}
  .kpi::after{content:"";position:absolute;right:-20px;top:-20px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.22),transparent 70%);}
  .kpi .lab{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px;}
  .kpi .lab .material-symbols-outlined{font-size:16px;color:var(--accent2);}
  .kpi .val{font-size:27px;font-weight:800;margin:6px 0 2px;letter-spacing:.5px;}
  .kpi .val small{font-size:13px;color:var(--mut);font-weight:600;margin-left:3px;}
  .kpi .delta{font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:3px;}
  .up{color:var(--ok);} .down{color:var(--bad);} .flat{color:var(--mut);}
  .tw{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px;}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
  th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;background:var(--panel2);position:sticky;top:0;}
  tbody tr:hover{background:rgba(124,58,237,.07);}
  td b{font-weight:700;}
  .mono{font-family:'Inter';font-variant-numeric:tabular-nums;letter-spacing:.3px;}
  .bd{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;line-height:1.6;}
  .bd .material-symbols-outlined{font-size:13px;}
  .bd-ok{background:rgba(34,197,94,.14);color:#4ade80;}
  .bd-warn{background:rgba(245,158,11,.15);color:#fbbf24;}
  .bd-bad{background:rgba(239,68,68,.15);color:#f87171;}
  .bd-info{background:rgba(56,189,248,.15);color:#7dd3fc;}
  .bd-mut{background:rgba(154,154,181,.14);color:var(--mut);}
  .bd-acc{background:rgba(124,58,237,.18);color:var(--accent2);}
  .bar{height:7px;border-radius:6px;background:var(--panel2);overflow:hidden;min-width:70px;}
  .bar > i{display:block;height:100%;border-radius:6px;}
  .chartbox{overflow:hidden;min-width:0;}
  .expo{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;min-width:0;}
  @media(max-width:820px){.expo{grid-template-columns:1fr;}}
  .ec{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0;position:relative;}
  .ec .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .ec .pn{font-weight:700;font-size:13.5px;}
  .ec .pd{font-size:11px;color:var(--mut);margin-top:2px;}
  .ec .ring{display:flex;align-items:center;gap:12px;margin-top:12px;}
  .ec .big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;}
  .ec .big small{font-size:12px;color:var(--mut);font-weight:600;}
  .cab{border-radius:14px;padding:14px;border:1px solid var(--line);background:linear-gradient(160deg,var(--panel2),var(--panel));min-width:0;}
  .cab .cn{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;}
  .cab .rd{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;}
  .cab .rd .rv{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;}
  .cab .rd .rl{font-size:10px;color:var(--mut);}
  .tl{position:relative;padding-left:22px;}
  .tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line);}
  .tl .it{position:relative;padding:0 0 16px 8px;}
  .tl .it::before{content:"";position:absolute;left:-20px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);box-shadow:0 0 0 2px var(--accent);}
  .tl .it.g::before{background:var(--ok);box-shadow:0 0 0 2px var(--ok);}
  .tl .it.r::before{background:var(--bad);box-shadow:0 0 0 2px var(--bad);}
  .tl .it .tt{font-size:13px;font-weight:700;}
  .tl .it .td{font-size:12px;color:var(--mut);margin-top:3px;}
  .oven{display:flex;flex-direction:column;gap:10px;}
  .ovrow{display:grid;grid-template-columns:130px 1fr;gap:12px;align-items:center;min-width:0;}
  @media(max-width:560px){.ovrow{grid-template-columns:1fr;}}
  .ovrow .on{font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:6px;}
  .ovtrack{position:relative;height:34px;background:var(--panel2);border-radius:8px;overflow:hidden;min-width:0;}
  .ovseg{position:absolute;top:4px;bottom:4px;border-radius:6px;display:flex;align-items:center;padding:0 8px;font-size:10.5px;font-weight:700;color:#fff;overflow:hidden;white-space:nowrap;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:10px;}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px;}
  .flow-note{background:var(--panel);border:1px dashed var(--accent);border-radius:12px;padding:12px 15px;font-size:12.5px;color:var(--mut);display:flex;gap:10px;align-items:flex-start;margin-top:18px;}
  .flow-note .material-symbols-outlined{color:var(--accent2);font-size:19px;flex:none;}
  .flow-note b{color:var(--txt);}
  @media(max-width:560px){
    .nb .lbl{display:none;}
    .nb{padding:8px 9px;}
    .live .lbl{display:none;}
    .brand span{display:none;}
  }
</style>
</head>
<body>
<div class="msy">
  <header class="topbar">
    <div class="topbar-in">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">water_drop</span></div>
        <div><b>MSL 濕敏度管理中心</b><span>Moisture Sensitivity Level · Control Room</span></div>
      </div>
      <nav class="navbtns" id="nav"></nav>
      <div class="live"><span class="status-dot"></span><span class="lbl">產線連線中 · IoT 同步</span></div>
    </div>
  </header>
  <main class="wrap" id="app"></main>
</div>

<script>
(function(){
  "use strict";
  var A = window.ApexCharts;
  var charts = [];
  function killCharts(){ for(var i=0;i<charts.length;i++){ try{charts[i].destroy();}catch(e){} } charts=[]; }
  function mk(id, opt){
    var el = document.getElementById(id);
    if(!el) return;
    var baseChart = { redrawOnParentResize:false, redrawOnWindowResize:false, animations:{enabled:false}, foreColor:"#9a9ab5", toolbar:{show:false} };
    opt.chart = Object.assign({}, baseChart, opt.chart||{});
    opt.grid = Object.assign({ borderColor:"#2a2a3d" }, opt.grid||{});
    opt.tooltip = Object.assign({ theme:"dark" }, opt.tooltip||{});
    try{ var c=new A(el,opt); c.render(); charts.push(c); }catch(e){}
  }

  var NAV = [
    {i:0, icon:"inventory_2", t:"料件建檔"},
    {i:1, icon:"history",     t:"開封計時"},
    {i:2, icon:"warning",     t:"超時預警"},
    {i:3, icon:"thermostat",  t:"烘烤排程"},
    {i:4, icon:"monitoring",  t:"乾燥櫃 IoT"},
    {i:5, icon:"verified",    t:"上線核可"}
  ];

  var navEl = document.getElementById("nav");
  navEl.innerHTML = NAV.map(function(n){
    return '<button class="nb" data-i="'+n.i+'"><span class="material-symbols-outlined">'+n.icon+'</span><span class="lbl">'+n.t+'</span></button>';
  }).join("");
  navEl.addEventListener("click", function(e){
    var b = e.target.closest("[data-i]");
    if(!b) return;
    location.hash = "v"+b.getAttribute("data-i");
  });

  function setNav(i){
    var bs = navEl.querySelectorAll("[data-i]");
    for(var k=0;k<bs.length;k++){ bs[k].classList.toggle("on", +bs[k].getAttribute("data-i")===i); }
  }

  function head(icon,title,sub,chipTxt){
    return '<div class="scr-head"><div><h1><span class="material-symbols-outlined" style="color:var(--accent2);font-size:24px;vertical-align:-3px;margin-right:6px;">'+icon+'</span>'+title+'</h1><p>'+sub+'</p></div><span class="chip"><span class="material-symbols-outlined">bolt</span>'+chipTxt+'</span></div>';
  }

  // ---------- SCREEN 0 : 料件建檔 ----------
  function s0(){
    var rows = [
      {pn:"CAP-0402-X7R", nm:"貼片電容 0402", lv:"MSL 1", fl:"無限制", pkg:"卷帶", qty:"18,400", vend:"MuRata", st:"ok"},
      {pn:"IC-BGA-256",  nm:"BGA 封裝主控 IC", lv:"MSL 4", fl:"72 hr", pkg:"托盤", qty:"1,260", vend:"NXP", st:"warn"},
      {pn:"QFN-48-PMIC", nm:"電源管理 QFN-48", lv:"MSL 3", fl:"168 hr", pkg:"卷帶", qty:"5,880", vend:"TI", st:"ok"},
      {pn:"LED-2835-WW", nm:"白光 LED 2835", lv:"MSL 3", fl:"168 hr", pkg:"卷帶", qty:"42,000", vend:"Nichia", st:"ok"},
      {pn:"BGA-576-SoC", nm:"SoC BGA-576", lv:"MSL 5", fl:"48 hr", pkg:"托盤", qty:"320", vend:"Qualcomm", st:"bad"},
      {pn:"CON-USB-C",   nm:"USB-C 連接器", lv:"MSL 2", fl:"1 年", pkg:"托盤", qty:"7,150", vend:"Fortech", st:"ok"},
      {pn:"SDRAM-96FBGA",nm:"DDR4 SDRAM 96FBGA", lv:"MSL 4", fl:"72 hr", pkg:"托盤", qty:"980", vend:"Micron", st:"warn"},
      {pn:"XTAL-SMD-32k",nm:"石英振盪器 SMD", lv:"MSL 2", fl:"1 年", pkg:"卷帶", qty:"12,300", vend:"Epson", st:"ok"}
    ];
    var lvColor = {"MSL 1":"bd-ok","MSL 2":"bd-info","MSL 3":"bd-acc","MSL 4":"bd-warn","MSL 5":"bd-bad","MSL 6":"bd-bad"};
    var trows = rows.map(function(r){
      var sb = r.st==="ok"?'<span class="bd bd-ok"><span class="material-symbols-outlined">check_circle</span>正常</span>'
             : r.st==="warn"?'<span class="bd bd-warn"><span class="material-symbols-outlined">schedule</span>近上限</span>'
             : '<span class="bd bd-bad"><span class="material-symbols-outlined">priority_high</span>需管控</span>';
      return '<tr><td><b class="mono">'+r.pn+'</b></td><td>'+r.nm+'</td><td><span class="bd '+(lvColor[r.lv]||"bd-mut")+'">'+r.lv+'</span></td><td class="mono">'+r.fl+'</td><td>'+r.pkg+'</td><td class="mono">'+r.qty+'</td><td>'+r.vend+'</td><td>'+sb+'</td></tr>';
    }).join("");

    document.getElementById("app").innerHTML =
      head("inventory_2","MSL 料件建檔","料件濕敏等級、樓面壽命（Floor Life）與包裝規格主檔","IPC/JEDEC J-STD-020")+
      '<div class="grid g-kpi4" style="margin-bottom:14px;">'+
        kpi("category","建檔料號","1,284","+37 本月","up")+
        kpi("shield","MSL 4~6 高敏料","286 項","佔 22.3%","flat")+
        kpi("inventory","乾燥櫃庫存卷數","3,910","+128","up")+
        kpi("event_upcoming","樓面壽命 ≤72hr","41 項","需優先週轉","down")+
      '</div>'+
      '<div class="grid g-32">'+
        '<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>MSL 等級分布</h3><div class="sub">依 JEDEC 濕敏等級統計建檔料號占比</div><div class="chartbox" id="c0a" style="height:280px;"></div></div>'+
        '<div class="card pad0"><div style="padding:16px 16px 4px;"><h3><span class="material-symbols-outlined">table_rows</span>料件主檔清單</h3><div class="sub">濕敏等級 · 樓面壽命 · 包裝型式</div></div>'+
          '<div class="tw"><table><thead><tr><th>料號</th><th>品名</th><th>MSL</th><th>樓面壽命</th><th>包裝</th><th>庫存</th><th>供應商</th><th>狀態</th></tr></thead><tbody>'+trows+'</tbody></table></div></div>'+
      '</div>'+
      flowNote("本畫面對應主檔建立，是暴露計時的來源；開封後進入 <b>開封計時</b> 階段。");

    void document.getElementById("app").offsetHeight;
    mk("c0a", {
      chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"donut", height:280},
      series:[642,214,142,168,88,30],
      labels:["MSL 1","MSL 2","MSL 3","MSL 4","MSL 5","MSL 6"],
      colors:["#22c55e","#38bdf8","#a78bfa","#f59e0b","#f97316","#ef4444"],
      stroke:{width:2, colors:["#15151f"]},
      dataLabels:{enabled:false},
      legend:{position:"bottom"},
      plotOptions:{pie:{donut:{size:"66%", labels:{show:true, total:{show:true, label:"建檔料號", color:"#9a9ab5", formatter:function(){return "1,284";}}}}}}
    });
  }

  // ---------- SCREEN 1 : 開封計時 ----------
  function s1(){
    var cards = [
      {pn:"IC-BGA-256", lot:"L2408A", lv:"MSL 4", cap:72, used:58, op:"陳志明", loc:"SMT-01"},
      {pn:"BGA-576-SoC", lot:"L2409C", lv:"MSL 5", cap:48, used:44, op:"王怡君", loc:"SMT-03"},
      {pn:"QFN-48-PMIC", lot:"L2407F", lv:"MSL 3", cap:168, used:36, op:"林大維", loc:"SMT-02"},
      {pn:"SDRAM-96FBGA", lot:"L2408B", lv:"MSL 4", cap:72, used:21, op:"陳志明", loc:"SMT-01"},
      {pn:"LED-2835-WW", lot:"L2409A", lv:"MSL 3", cap:168, used:12, op:"張家豪", loc:"SMT-04"},
      {pn:"CON-USB-C", lot:"L2406D", lv:"MSL 2", cap:8760, used:640, op:"王怡君", loc:"SMT-03"}
    ];
    var cardHtml = cards.map(function(c){
      var pct = Math.round(c.used/c.cap*100);
      var rem = c.cap - c.used;
      var col = pct>=90?"var(--bad)":pct>=70?"var(--warn)":"var(--accent2)";
      var remTxt = rem>=1000 ? (Math.round(rem/24))+" 天" : rem+" hr";
      return '<div class="ec"><div class="top"><div><div class="pn mono">'+c.pn+'</div><div class="pd">批號 '+c.lot+' · '+c.loc+' · '+c.op+'</div></div><span class="bd '+(pct>=90?"bd-bad":pct>=70?"bd-warn":"bd-acc")+'">'+c.lv+'</span></div>'+
        '<div class="ring"><div class="big" style="color:'+col+'">'+remTxt+'<small> 可用</small></div></div>'+
        '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin:10px 0 5px;"><span>已暴露 '+c.used+' hr</span><span>上限 '+c.cap+' hr</span></div>'+
        '<div class="bar"><i style="width:'+Math.min(pct,100)+'%;background:'+col+';"></i></div></div>';
    }).join("");

    document.getElementById("app").innerHTML =
      head("history","開封暴露計時","包裝開封 / 領用掃碼登記後，依 MSL 等級啟動暴露時間累計倒數","即時倒數")+
      '<div class="grid g-kpi4" style="margin-bottom:14px;">'+
        kpi("lock_open","今日開封登記","28 筆","+6 較昨","up")+
        kpi("timer","累計計時中","64 卷","線上暴露","flat")+
        kpi("hourglass_bottom","剩餘 ≤10% 料件","9 卷","需即刻上線","down")+
        kpi("done_all","已回櫃再密封","19 卷","週轉正常","up")+
      '</div>'+
      '<div class="card" style="margin-bottom:14px;"><h3><span class="material-symbols-outlined">dashboard</span>暴露計時看板</h3><div class="sub">卡片顯示各批料件剩餘可用暴露時間，超過 90% 標紅</div><div class="expo" style="margin-top:12px;">'+cardHtml+'</div></div>'+
      '<div class="grid g-23">'+
        '<div class="card"><h3><span class="material-symbols-outlined">show_chart</span>近 12 小時開封登記量</h3><div class="sub">每小時開封 / 回櫃筆數趨勢</div><div class="chartbox" id="c1a" style="height:260px;"></div></div>'+

          '<div class="tl" style="margin-top:12px;">'+

      flowNote("此為流程終點：<b>上線核可放行紀錄</b>，並回饋 MSL 超時事件數與烘烤達成率供改善。");

    void document.getElementById("app").offsetHeight;
    mk("c5a", {
      chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"bar", height:300, stacked:true},
      series:[{name:"核可",data:[210,198,224,236,240,251]},{name:"複核",data:[14,12,10,9,8,7]},{name:"退回",data:[5,4,3,3,2,1]}],
      xaxis:{categories:["W31","W32","W33","W34","W35","W36"], axisBorder:{color:"#2a2a3d"}, axisTicks:{color:"#2a2a3d"}},
      colors:["#22c55e","#38bdf8","#ef4444"],
      plotOptions:{bar:{columnWidth:"55%", borderRadius:3}},
      dataLabels:{enabled:false},
      legend:{position:"top", horizontalAlign:"right"},
      tooltip:{shared:true,intersect:false, intersect:false}

    mk("c5b", {

      legend:{position:"top", horizontalAlign:"right"}
    });
  }

  // ---------- helpers ----------
  function kpi(icon,lab,val,delta,dir){
    var unit = "";
    var vv = String(val);
    var m = vv.match(/^([\d,\.]+)(.*)$/);
    if(m){ vv = m[1]; unit = m[2]; }
    var dcls = dir==="up"?"up":dir==="down"?"down":"flat";
    var arrow = dir==="up"?"trending_up":dir==="down"?"trending_down":"remove";
    return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+icon+'</span>'+lab+'</div>'+
      '<div class="val">'+vv+(unit?'<small>'+unit+'</small>':'')+'</div>'+
      '<div class="delta '+dcls+'"><span class="material-symbols-outlined" style="font-size:14px">'+arrow+'</span>'+delta+'</div></div>';
  }
  function tlItem(cls,tt,td){
    return '<div class="it '+cls+'"><div class="tt">'+tt+'</div><div class="td">'+td+'</div></div>';
  }
  function flowNote(txt){
    return '<div class="flow-note"><span class="material-symbols-outlined">account_tree</span><div>'+txt+'</div></div>';
  }

  var SCR = [s0,s1,s2,s3,s4,s5];
  function show(i){
    killCharts();
    if(i<0){ i=0; }
    if(i>SCR.length-1){ i=SCR.length-1; }
    setNav(i);
    SCR[i]();
  }
  window.__show = show;

  function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
})();
</script>
