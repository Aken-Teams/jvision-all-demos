<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>原物料價格趨勢分析系統｜Jvision 系統 Demo</title>
  <meta name="description" content="國際行情匯入、價格趨勢與預警、成本影響測算到採購時機建議" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
  <style>
:root {
  color-scheme: light;
  --color-primary: #2563EB;
  --color-on-primary: #FFFFFF;
  --color-secondary: #3B82F6;
  --color-on-secondary: #000000;
  --color-accent: #EA580C;
  --color-on-accent: #000000;
  --color-background: #F8FAFC;
  --color-foreground: #1E293B;
  --color-card: #FFFFFF;
  --color-card-foreground: #1E293B;
  --color-muted: #E9EFF8;
  --color-muted-foreground: #475569;
  --color-border: #E2E8F0;
  --color-destructive: #DC2626;
  --color-on-destructive: #FFFFFF;
  --color-ring: #2563EB;

  /* External interface aliases — do not rename. */
  --blue: var(--color-primary);
  --ink: var(--color-foreground);
  --muted: var(--color-muted-foreground);
  --line: var(--color-border);

  --accent: var(--color-primary);
  --accent2: var(--color-secondary);
  --bg: var(--color-background);
  --card: var(--color-card);
  --soft: #EFF6FF;
  --up: #B91C1C;
  --down: #15803D;
  --warn: #A3440B;
  --ok: #0F766E;
  --shadow-xs: 0 1px 2px rgba(15, 23, 42, .05);
  --shadow-sm: 0 8px 20px rgba(30, 41, 59, .06);
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
}

* { box-sizing: border-box; }

html {
  min-width: 320px;
  scroll-behavior: smooth;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background:
    linear-gradient(rgba(37, 99, 235, .025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(37, 99, 235, .025) 1px, transparent 1px),
    var(--color-background);
  background-size: 32px 32px;
  color: var(--color-foreground);
  font-family: "Fira Sans", sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button,
input,
select,
textarea { font: inherit; }

button,
[data-i] { cursor: pointer; }

button:focus-visible,
a:focus-visible,
[tabindex]:focus-visible {
  outline: 3px solid var(--color-ring);
  outline-offset: 3px;
}

::selection {
  background: #BFDBFE;
  color: #172554;
}

.material-symbols-outlined {
  font-family: "Material Symbols Outlined";
  font-style: normal;
  font-weight: normal;
  line-height: 1;
  vertical-align: middle;
}

.layout {
  display: flex;
  align-items: stretch;
  min-height: 100vh;
}

.sidebar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  flex: 0 0 272px;
  flex-direction: column;
  width: 272px;
  height: 100vh;
  padding: 24px 18px 18px;
  overflow-y: auto;
  background: rgba(255, 255, 255, .97);
  border-right: 1px solid var(--color-border);
  box-shadow: 6px 0 24px rgba(30, 41, 59, .025);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 64px;
  margin-bottom: 20px;
  padding: 0 6px 18px;
  border-bottom: 1px solid var(--color-border);
}

.brand .logo {
  position: relative;
  display: flex;
  flex: 0 0 42px;
  align-items: center;
  justify-content: center;
  width: 42px;
  height: 42px;
  overflow: hidden;
  background: var(--color-primary);
  border-radius: var(--radius-sm);
  color: var(--color-on-primary);
  box-shadow: 5px 5px 0 #DBEAFE;
}

.brand .logo::after {
  position: absolute;
  right: -8px;
  bottom: -8px;
  width: 22px;
  height: 22px;
  background: var(--color-accent);
  content: "";
  transform: rotate(45deg);
}

.brand .logo .material-symbols-outlined {
  position: relative;
  z-index: 1;
  font-size: 23px;
}

.brand .btxt { min-width: 0; }

.brand .btxt b {
  display: block;
  color: #0F172A;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -.01em;
  line-height: 1.35;
}

.brand .btxt span {
  display: block;
  margin-top: 2px;
  color: var(--color-muted-foreground);
  font-family: "Fira Code", monospace;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: .04em;
  text-transform: uppercase;
}

nav {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 0;
}

.navbtn {
  position: relative;
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  min-width: 0;
  min-height: 46px;
  padding: 10px 11px;
  overflow: hidden;
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--radius-md);
  color: #475569;
  font-size: 13px;
  font-weight: 600;
  text-align: left;
  transition: background-color 200ms ease, border-color 200ms ease, color 200ms ease, transform 200ms ease;
}

.navbtn .material-symbols-outlined {
  flex: 0 0 auto;
  color: #64748B;
  font-size: 20px;
  transition: color 200ms ease;
}

.navbtn .nlab {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.navbtn .nidx {
  flex: 0 0 auto;
  margin-left: auto;
  color: #64748B;
  font-family: "Fira Code", monospace;
  font-size: 10px;
  font-weight: 600;
}

.navbtn:hover {
  background: #EFF6FF;
  border-color: #BFDBFE;
  color: #1D4ED8;
  transform: translateX(2px);
}

.navbtn:hover .material-symbols-outlined { color: var(--color-primary); }

.navbtn.on {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: var(--color-on-primary);
  box-shadow: 4px 4px 0 #BFDBFE;
}

.navbtn.on::before {
  position: absolute;
  top: 9px;
  bottom: 9px;
  left: 0;
  width: 3px;
  background: var(--color-accent);
  content: "";
}

.navbtn.on .material-symbols-outlined,
.navbtn.on .nidx { color: #FFFFFF; }

.sfoot {
  margin-top: auto;
  padding: 18px 6px 0;
  border-top: 1px solid var(--color-border);
  color: var(--color-muted-foreground);
  font-family: "Fira Code", monospace;
  font-size: 9.5px;
  line-height: 1.75;
}

.main {
  flex: 1 1 auto;
  width: calc(100% - 272px);
  min-width: 0;
  padding: 30px clamp(20px, 3vw, 44px) 56px;
}

.topbar {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  max-width: 1600px;
  margin: 0 auto 22px;
  padding: 0 0 18px;
  border-bottom: 1px solid var(--color-border);
}

.topbar::after {
  position: absolute;
  bottom: -1px;
  left: 0;
  width: 64px;
  height: 3px;
  background: var(--color-primary);
  content: "";
}

.topbar .ttl { min-width: 0; }

.topbar h1 {
  margin: 0 0 4px;
  color: #0F172A;
  font-size: clamp(22px, 2.2vw, 30px);
  font-weight: 700;
  letter-spacing: -.035em;
  line-height: 1.2;
}

.topbar .sub {
  margin: 0;
  color: var(--color-muted-foreground);
  font-size: 13px;
}

.pill {
  display: inline-flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 7px;
  min-height: 34px;
  padding: 6px 11px;
  background: #FFF7ED;
  border: 1px solid #FDBA74;
  border-radius: var(--radius-sm);
  color: #9A3412;
  font-family: "Fira Code", monospace;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .01em;
  box-shadow: 3px 3px 0 #FFEDD5;
}

.pill .material-symbols-outlined {
  color: var(--color-accent);
  font-size: 17px;
}

#screen {
  max-width: 1600px;
  margin: 0 auto;
}

.grid {
  display: grid;
  gap: 14px;
  min-width: 0;
}

.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g21 { grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); }
.g12 { grid-template-columns: minmax(300px, 1fr) minmax(0, 1.6fr); }

.card {
  position: relative;
  min-width: 0;
  padding: 17px;
  overflow: hidden;
  background: var(--color-card);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  color: var(--color-card-foreground);
  box-shadow: var(--shadow-xs);
  transition: border-color 220ms ease, box-shadow 220ms ease, transform 220ms ease;
}

.card:hover {
  border-color: #CBD5E1;
  box-shadow: var(--shadow-sm);
  transform: translateY(-2px);
}

.card h3 {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 3px;
  color: #0F172A;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -.01em;
}

.card h3 .material-symbols-outlined {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  background: #EFF6FF;
  border: 1px solid #DBEAFE;
  border-radius: var(--radius-sm);
  color: var(--color-primary);
  font-size: 17px;
}

.card .chint {
  margin: 2px 0 14px 36px;
  color: var(--color-muted-foreground);
  font-size: 11.5px;
  line-height: 1.55;
}

.kpi {
  min-height: 144px;
  padding: 16px;
  border-top: 3px solid var(--color-primary);
}

.kpi::after {
  position: absolute;
  top: 0;
  right: 0;
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, transparent 49%, #EFF6FF 50%);
  content: "";
}

.kpi .klab {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--color-muted-foreground);
  font-size: 11.5px;
  font-weight: 600;
}

.kpi .klab .material-symbols-outlined {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  background: #EFF6FF;
  border-radius: var(--radius-sm);
  color: var(--color-primary);
  font-size: 17px;
}

.kpi .kval {
  margin: 10px 0 6px;
  color: #0F172A;
  font-family: "Fira Code", monospace;
  font-size: clamp(25px, 2.2vw, 31px);
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  letter-spacing: -.06em;
  line-height: 1.15;
}

.kpi .kval small {
  margin-left: 5px;
  color: var(--color-muted-foreground);
  font-family: "Fira Sans", sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0;
}

.delta {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  min-height: 23px;
  padding: 2px 7px;
  border: 1px solid currentColor;
  border-radius: var(--radius-sm);
  font-family: "Fira Code", monospace;
  font-size: 10.5px;
  font-variant-numeric: tabular-nums;
  font-weight: 600;
}

.delta .material-symbols-outlined { font-size: 14px; }
.delta.up { background: #FEF2F2; color: #B91C1C; }
.delta.down { background: #F0FDF4; color: #166534; }
.delta.flat { background: #F1F5F9; color: #475569; }

.chart {
  width: 100%;
  min-width: 0;
  overflow: hidden;
}

.apexcharts-text,
.apexcharts-legend-text {
  font-family: "Fira Sans", sans-serif !important;
  fill: #475569;
}

.apexcharts-tooltip,
.apexcharts-xaxistooltip {
  border-color: var(--color-border) !important;
  border-radius: var(--radius-sm) !important;
  box-shadow: var(--shadow-sm) !important;
  font-family: "Fira Sans", sans-serif !important;
}

.apexcharts-tooltip-title {
  background: #F8FAFC !important;
  border-color: var(--color-border) !important;
  font-family: "Fira Code", monospace !important;
}

table {
  width: 100%;
  min-width: 520px;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 12.5px;
}

thead th {
  padding: 10px 11px;
  background: #F1F5F9;
  border-top: 1px solid var(--color-border);
  border-bottom: 1px solid #CBD5E1;
  color: #334155;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .055em;
  text-align: left;
  text-transform: uppercase;
  white-space: nowrap;
}

thead th:first-child { border-left: 1px solid var(--color-border); }
thead th:last-child { border-right: 1px solid var(--color-border); }

tbody td {
  padding: 10px 11px;
  background: #FFFFFF;
  border-bottom: 1px solid #EDF1F6;
  color: #334155;
  white-space: nowrap;
  transition: background-color 180ms ease;
}

tbody tr:nth-child(even) td { background: #FBFDFF; }
tbody tr:hover td { background: #EFF6FF; }

tbody td:nth-child(n+2):not(:last-child),
.tnum {
  font-variant-numeric: tabular-nums;
}

.tnum {
  color: #0F172A;
  font-family: "Fira Code", monospace;
  font-weight: 600;
  text-align: right;
}

.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 22px;
  padding: 2px 7px;
  border: 1px solid currentColor;
  border-radius: var(--radius-sm);
  font-size: 10.5px;
  font-weight: 600;
  line-height: 1.2;
}

.tag .material-symbols-outlined { font-size: 13px; }
.t-up { background: #FEF2F2; color: #B91C1C; }
.t-down { background: #F0FDF4; color: #166534; }
.t-warn { background: #FFF7ED; color: #9A3412; }
.t-ok { background: #F0FDFA; color: #0F766E; }
.t-info { background: #EEF2FF; color: #4338CA; }
.t-gray { background: #F1F5F9; color: #475569; }

.bar-wrap {
  min-width: 64px;
  height: 8px;
  overflow: hidden;
  background: #E2E8F0;
  border-radius: 2px;
}

.bar-in {
  height: 100%;
  background: var(--color-primary);
  border-radius: 2px;
  box-shadow: inset -2px 0 0 rgba(255, 255, 255, .75);
}

.stack {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.alert-row {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  min-width: 0;
  padding: 11px;
  background: #FFFFFF;
  border: 1px solid var(--color-border);
  border-left-width: 4px;
  border-radius: var(--radius-sm);
  transition: background-color 200ms ease, border-color 200ms ease, transform 200ms ease;
}

.alert-row:hover {
  background: #F8FAFC;
  border-color: #CBD5E1;
  transform: translateX(2px);
}

.alert-row .aic {
  display: flex;
  flex: 0 0 34px;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border: 1px solid currentColor;
  border-radius: var(--radius-sm);
}

.alert-row .aic .material-symbols-outlined { font-size: 18px; }
.alert-row .abody { flex: 1; min-width: 0; }
.alert-row .abody b { color: #0F172A; font-size: 12.5px; font-weight: 700; }

.alert-row .abody p {
  margin: 4px 0 0;
  color: var(--color-muted-foreground);
  font-size: 11.5px;
  line-height: 1.55;
}

.sev-h { border-left-color: #B91C1C; }
.sev-h .aic { background: #FEF2F2; color: #B91C1C; }
.sev-m { border-left-color: #C2410C; }
.sev-m .aic { background: #FFF7ED; color: #9A3412; }
.sev-l { border-left-color: #0F766E; }
.sev-l .aic { background: #F0FDFA; color: #0F766E; }

.tl {
  position: relative;
  padding-left: 28px;
}

.tl::before {
  position: absolute;
  top: 5px;
  bottom: 5px;
  left: 8px;
  width: 1px;
  background: #CBD5E1;
  content: "";
}

.tl-item {
  position: relative;
  padding: 0 0 17px 4px;
}

.tl-item:last-child { padding-bottom: 0; }

.tl-item::before {
  position: absolute;
  top: 3px;
  left: -25px;
  width: 10px;
  height: 10px;
  background: #FFFFFF;
  border: 3px solid var(--color-primary);
  border-radius: 50%;
  content: "";
  box-shadow: 0 0 0 3px #DBEAFE;
}

.tl-item .tlt { color: #0F172A; font-size: 12.5px; font-weight: 700; }

.tl-item .tmeta {
  margin: 2px 0 4px;
  color: var(--color-primary);
  font-family: "Fira Code", monospace;
  font-size: 10px;
  font-weight: 500;
}

.tl-item .tdesc { color: var(--color-muted-foreground); font-size: 11.5px; line-height: 1.55; }

.segrow {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--color-border);
}

.seg {
  min-height: 31px;
  padding: 6px 11px;
  background: #FFFFFF;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  color: #475569;
  font-family: "Fira Code", monospace;
  font-size: 10.5px;
  font-weight: 600;
}

.seg.on {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: var(--color-on-primary);
  box-shadow: 3px 3px 0 #BFDBFE;
}

.mini {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.mini b {
  color: #0F172A;
  font-family: "Fira Code", monospace;
  font-size: 18px;
  font-variant-numeric: tabular-nums;
  font-weight: 700;
}

.mini span { color: var(--color-muted-foreground); font-size: 10.5px; }

.board {
  display: grid;
  grid-template-columns: repeat(4, minmax(160px, 1fr));
  gap: 10px;
  min-width: 720px;
}

.bcol {
  min-width: 0;
  padding: 10px;
  background: #F8FAFC;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
}

.bcol .bhead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 9px;
  color: #0F172A;
  font-size: 11.5px;
  font-weight: 700;
}

.bcol .bhead .cnt {
  padding: 1px 7px;
  background: #E2E8F0;
  border-radius: var(--radius-sm);
  color: #334155;
  font-family: "Fira Code", monospace;
  font-size: 10px;
}

.bcard {
  margin-bottom: 7px;
  padding: 9px;
  background: #FFFFFF;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-xs);
}

.bcard:last-child { margin-bottom: 0; }
.bcard b { display: block; color: #0F172A; font-size: 11.5px; font-weight: 700; }

.bcard .bm {
  display: flex;
  justify-content: space-between;
  gap: 6px;
  margin-top: 4px;
  color: var(--color-muted-foreground);
  font-family: "Fira Code", monospace;
  font-size: 9.5px;
}

.costbar {
  display: flex;
  min-width: 260px;
  height: 28px;
  overflow: hidden;
  border: 2px solid #FFFFFF;
  border-radius: var(--radius-sm);
  box-shadow: 0 0 0 1px var(--color-border);
}

.costbar span {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  overflow: hidden;
  color: #FFFFFF;
  font-family: "Fira Code", monospace;
  font-size: 9px;
  font-weight: 600;
  text-shadow: 0 1px 2px rgba(0, 0, 0, .35);
  white-space: nowrap;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 12px;
  color: #475569;
  font-size: 11px;
}

.legend i {
  display: inline-block;
  width: 10px;
  height: 10px;
  margin-right: 5px;
  border: 1px solid rgba(15, 23, 42, .18);
  border-radius: 2px;
  vertical-align: middle;
}

.gauge-note {
  margin-top: 6px;
  color: var(--color-muted-foreground);
  font-size: 11px;
  text-align: center;
}

.rec {
  display: flex;
  align-items: center;
  gap: 11px;
  min-width: 0;
  padding: 11px;
  background: #FFFFFF;
  border: 1px solid var(--color-border);

    function buildNav(){
      var nav=document.getElementById("nav");var h="";
      for(var i=0;i<MODS.length;i++){h+='<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span><span class="nlab">'+MODS[i].name+'</span><span class="nidx">0'+(i+1)+'</span></button>';}

      var btns=nav.querySelectorAll("[data-i]");
      for(var j=0;j<btns.length;j++){(function(b){b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i");});})(btns[j]);}

    function show(i){
      destroyCharts();
      var m=MODS[i];
      document.getElementById("scr-title").textContent=m.name;
      document.getElementById("scr-sub").textContent=m.sub;
      document.getElementById("scr-pill").textContent=m.pill;
      var btns=document.querySelectorAll("[data-i]");
      for(var k=0;k<btns.length;k++){btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i);}
      var cont=document.getElementById("screen");
      cont.innerHTML=SCREENS[i].r();
      void cont.offsetHeight;
      SCREENS[i].c();
    }

    buildNav();

    function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
