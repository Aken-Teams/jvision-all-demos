<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>原物料價格趨勢分析系統｜Jvision 系統 Demo</title>
  <meta name="description" content="國際行情匯入、價格趨勢與預警、成本影響測算到採購時機建議" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
  <style>
    :root{
      --accent:#0369a1; --accent2:#38bdf8; --ink:#0f172a; --muted:#64748b;
      --line:#e2e8f0; --bg:#f1f5f9; --card:#ffffff; --soft:#f0f9ff;
      --up:#dc2626; --down:#16a34a; --warn:#d97706; --ok:#0891b2;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
    .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
    .layout{display:flex;min-height:100vh;align-items:stretch;}
    .sidebar{width:248px;flex:0 0 248px;background:#ffffff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;}
    .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:14px;}
    .brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 38px;}
    .brand .logo .material-symbols-outlined{font-size:22px;}
    .brand .btxt{min-width:0;}
    .brand .btxt b{display:block;font-size:14px;font-weight:800;letter-spacing:.2px;line-height:1.3;}
    .brand .btxt span{font-size:11px;color:var(--muted);}
    nav{display:flex;flex-direction:column;gap:4px;min-width:0;}
    .navbtn{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;border:none;background:transparent;color:#475569;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;text-align:left;width:100%;min-width:0;transition:background .15s,color .15s;}
    .navbtn .material-symbols-outlined{font-size:21px;flex:0 0 auto;color:#94a3b8;}
    .navbtn .nlab{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .navbtn .nidx{margin-left:auto;font-size:11px;color:#cbd5e1;font-weight:700;flex:0 0 auto;}
    .navbtn:hover{background:var(--soft);color:var(--accent);}
    .navbtn.on{background:var(--accent);color:#fff;}
    .navbtn.on .material-symbols-outlined,.navbtn.on .nidx{color:#e0f2fe;}
    .sfoot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.6;}
    .main{flex:1 1 auto;min-width:0;padding:24px 28px 48px;}
    .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
    .topbar .ttl{min-width:0;}
    .topbar h1{margin:0 0 4px;font-size:22px;font-weight:800;letter-spacing:.2px;}
    .topbar .sub{margin:0;color:var(--muted);font-size:13px;}
    .pill{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--accent);border:1px solid #bae6fd;border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700;}
    .pill .material-symbols-outlined{font-size:16px;}
    .grid{display:grid;gap:16px;min-width:0;}
    .g4{grid-template-columns:repeat(4,1fr);}
    .g3{grid-template-columns:repeat(3,1fr);}
    .g2{grid-template-columns:repeat(2,1fr);}
    .g21{grid-template-columns:1.6fr 1fr;}
    .g12{grid-template-columns:1fr 1.6fr;}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0;box-shadow:0 1px 2px rgba(15,23,42,.03);}
    .card h3{margin:0 0 3px;font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px;}
    .card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
    .card .chint{margin:0 0 14px;font-size:12px;color:var(--muted);}
    .kpi .klab{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px;}
    .kpi .klab .material-symbols-outlined{font-size:18px;color:var(--accent2);}
    .kpi .kval{font-size:27px;font-weight:900;letter-spacing:-.5px;margin:9px 0 5px;}
    .kpi .kval small{font-size:14px;font-weight:700;color:var(--muted);margin-left:3px;}
    .delta{font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:999px;}
    .delta .material-symbols-outlined{font-size:15px;}
    .delta.up{color:var(--up);background:#fef2f2;}
    .delta.down{color:var(--down);background:#f0fdf4;}
    .delta.flat{color:var(--muted);background:#f1f5f9;}
    .chart{width:100%;overflow:hidden;min-width:0;}
    table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
    thead th{text-align:left;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:9px 12px;border-bottom:2px solid var(--line);white-space:nowrap;}
    tbody td{padding:11px 12px;border-bottom:1px solid #f1f5f9;white-space:nowrap;}
    tbody tr:hover{background:var(--soft);}
    .tnum{font-variant-numeric:tabular-nums;font-weight:700;}
    .tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:6px;}
    .tag .material-symbols-outlined{font-size:14px;}
    .t-up{background:#fef2f2;color:var(--up);}
    .t-down{background:#f0fdf4;color:var(--down);}
    .t-warn{background:#fffbeb;color:var(--warn);}
    .t-ok{background:#ecfeff;color:var(--ok);}
    .t-info{background:#eef2ff;color:#4f46e5;}
    .t-gray{background:#f1f5f9;color:#475569;}
    .bar-wrap{background:#eef2f6;border-radius:999px;height:8px;overflow:hidden;min-width:64px;}
    .bar-in{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
    .stack{display:flex;flex-direction:column;gap:12px;}
    .alert-row{display:flex;gap:12px;align-items:flex-start;padding:13px;border-radius:11px;border:1px solid var(--line);background:#fff;min-width:0;}
    .alert-row .aic{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 36px;}
    .alert-row .aic .material-symbols-outlined{font-size:20px;}
    .alert-row .abody{min-width:0;flex:1;}
    .alert-row .abody b{font-size:13.5px;font-weight:800;}
    .alert-row .abody p{margin:3px 0 0;font-size:12px;color:var(--muted);}
    .sev-h{border-left:4px solid var(--up);} .sev-h .aic{background:#fef2f2;color:var(--up);}
    .sev-m{border-left:4px solid var(--warn);} .sev-m .aic{background:#fffbeb;color:var(--warn);}
    .sev-l{border-left:4px solid var(--ok);} .sev-l .aic{background:#ecfeff;color:var(--ok);}
    .tl{position:relative;padding-left:26px;}
    .tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line);}
    .tl-item{position:relative;padding:0 0 18px 4px;}
    .tl-item:last-child{padding-bottom:0;}
    .tl-item::before{content:"";position:absolute;left:-22px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent2);}
    .tl-item .tlt{font-size:13px;font-weight:800;}
    .tl-item .tmeta{font-size:11.5px;color:var(--muted);margin:2px 0 4px;}
    .tl-item .tdesc{font-size:12.5px;color:#475569;}
    .segrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
    .seg{font-size:12px;font-weight:700;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;color:#475569;}
    .seg.on{background:var(--accent);color:#fff;border-color:var(--accent);}
    .mini{display:flex;flex-direction:column;gap:2px;}
    .mini b{font-size:19px;font-weight:900;}
    .mini span{font-size:11px;color:var(--muted);}
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:720px;}
    .bcol{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0;}
    .bcol .bhead{font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
    .bcol .bhead .cnt{background:#e2e8f0;color:#475569;border-radius:999px;font-size:11px;padding:1px 8px;}
    .bcard{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:9px;box-shadow:0 1px 2px rgba(15,23,42,.04);}
    .bcard:last-child{margin-bottom:0;}
    .bcard b{font-size:12.5px;font-weight:800;display:block;}
    .bcard .bm{font-size:11px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:6px;}
    .costbar{display:flex;height:26px;border-radius:7px;overflow:hidden;min-width:260px;}
    .costbar span{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;min-width:0;overflow:hidden;white-space:nowrap;}
    .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12px;color:#475569;}
    .legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle;}
    .gauge-note{font-size:12px;color:var(--muted);text-align:center;margin-top:6px;}
    .rec{display:flex;gap:12px;padding:14px;border-radius:12px;border:1px solid var(--line);background:#fff;align-items:center;min-width:0;}
    .rec .ric{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:0 0 44px;color:#fff;}
    .rec .ric .material-symbols-outlined{font-size:24px;}
    .rec .rb{min-width:0;flex:1;}
    .rec .rb .rtag{font-size:11px;font-weight:800;letter-spacing:.3px;}
    .rec .rb b{font-size:15px;font-weight:900;display:block;margin:2px 0;}
    .rec .rb p{margin:0;font-size:12px;color:var(--muted);}
    .buy{background:linear-gradient(135deg,#16a34a,#4ade80);} .rbuy{color:var(--down);}
    .hold{background:linear-gradient(135deg,#d97706,#fbbf24);} .rhold{color:var(--warn);}
    .wait{background:linear-gradient(135deg,#0369a1,#38bdf8);} .rwait{color:var(--accent);}
    .stepline{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
    .step{flex:1 1 120px;min-width:0;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:11px;}
    .step .sn{font-size:10px;font-weight:800;color:var(--accent2);}
    .step b{display:block;font-size:12.5px;font-weight:800;margin:3px 0;}
    .step span{font-size:11px;color:var(--muted);}
    .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle;}
    @media(max-width:1180px){.g4{grid-template-columns:repeat(2,1fr);}}
    @media(max-width:860px){
      .layout{display:block;}
      .sidebar{position:static;width:auto;height:auto;flex:none;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:none;border-bottom:1px solid var(--line);padding:12px 14px;gap:8px;}
      .brand{border-bottom:none;margin:0;padding:0 12px 0 0;}
      nav{flex-direction:row;flex-wrap:wrap;gap:6px;}
      .navbtn{width:auto;padding:8px 12px;}
      .navbtn .nidx{display:none;}
      .sfoot{display:none;}
      .main{padding:18px 16px 40px;}
    }
    @media(max-width:820px){
      .g4,.g3,.g2,.g21,.g12{grid-template-columns:1fr;}
    }
    @media(max-width:560px){
      .navbtn .nlab{display:none;}
      .navbtn{padding:9px;}
      .topbar h1{font-size:19px;}
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">trending_up</span></div>
        <div class="btxt"><b>原物料價格趨勢</b><span>Material Price Intelligence</span></div>
      </div>
      <nav id="nav"></nav>
      <div class="sfoot">
        Jvision Demo · 純前端展示<br/>資料為模擬示意<br/>v159 · 採購供應鏈
      </div>
    </aside>
    <main class="main">
      <div class="topbar">
        <div class="ttl">
          <h1 id="scr-title">—</h1>
          <p class="sub" id="scr-sub">—</p>
        </div>
        <div class="pill"><span class="material-symbols-outlined">bolt</span><span id="scr-pill">即時</span></div>
      </div>
      <div id="screen"></div>
    </main>
  </div>

  <script>
  (function(){
    var charts=[];
    function destroyCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
    function mk(id,opt){
      var el=document.getElementById(id);
      if(!el)return;
      opt.chart=opt.chart||{};
      opt.chart.redrawOnParentResize=false;
      opt.chart.redrawOnWindowResize=false;
      opt.chart.animations={enabled:false};
      opt.chart.fontFamily='Inter,"Noto Sans TC",sans-serif';
      opt.chart.toolbar={show:false};
      try{var c=new ApexCharts(el,opt);c.render();charts.push(c);}catch(e){}
    }
    var A="#0369a1",B="#38bdf8",UP="#dc2626",DN="#16a34a",WN="#d97706";

    var MODS=[
      {icon:"monitoring",name:"行情資料匯入",sub:"國際現貨與期貨行情即時匯入與校驗",pill:"每日 06:00 匯入"},
      {icon:"trending_up",name:"價格趨勢分析",sub:"多品項走勢、移動平均與波動率分析",pill:"12 個月視窗"},
      {icon:"warning",name:"價格預警",sub:"突破區間與異常波動門檻自動告警",pill:"即時監控"},
      {icon:"request_quote",name:"成本影響測算",sub:"價格連動 BOM 成本模型即時試算",pill:"BOM 連動"},
      {icon:"insights",name:"採購時機建議",sub:"趨勢預測與最佳採購時點建議",pill:"AI 建議"},
      {icon:"fact_check",name:"決策執行追蹤",sub:"採購決策紀錄與預測準確度稽核",pill:"稽核追蹤"}
    ];

    function up(v){return v>=0?'<span class="delta up"><span class="material-symbols-outlined">north_east</span>'+v.toFixed(1)+'%</span>':'<span class="delta down"><span class="material-symbols-outlined">south_east</span>'+Math.abs(v).toFixed(1)+'%</span>';}
    function esc(s){return String(s);}

    // ---------- SCREEN 0 : 行情資料匯入 ----------
    function s0(){
      var feeds=[
        {m:"銅 (LME Copper)",p:"9,428",u:"USD/噸",d:1.8,src:"LME",st:"ok",t:"06:02"},
        {m:"鋁 (LME Aluminium)",p:"2,356",u:"USD/噸",d:-0.6,src:"LME",st:"ok",t:"06:02"},
        {m:"熱軋鋼卷",p:"18,650",u:"CNY/噸",d:2.4,src:"上期所",st:"ok",t:"06:05"},
        {m:"聚丙烯 PP",p:"7,820",u:"CNY/噸",d:0.4,src:"大商所",st:"ok",t:"06:05"},
        {m:"天然橡膠",p:"1,742",u:"USD/噸",d:-1.2,src:"SICOM",st:"ok",t:"06:07"},
        {m:"原油 Brent",p:"82.6",u:"USD/桶",d:0.9,src:"ICE",st:"delay",t:"05:41"},
        {m:"錫 (LME Tin)",p:"31,120",u:"USD/噸",d:3.1,src:"LME",st:"ok",t:"06:02"},
        {m:"鎳 (LME Nickel)",p:"16,480",u:"USD/噸",d:-0.3,src:"LME",st:"miss",t:"—"}
      ];
      var rows="";
      for(var i=0;i<feeds.length;i++){var f=feeds[i];
        var stt=f.st==="ok"?'<span class="tag t-ok"><span class="material-symbols-outlined">check_circle</span>已入庫</span>':f.st==="delay"?'<span class="tag t-warn"><span class="material-symbols-outlined">schedule</span>延遲</span>':'<span class="tag t-up"><span class="material-symbols-outlined">error</span>缺漏補抓</span>';
        rows+='<tr><td><b>'+f.m+'</b></td><td class="tnum">'+f.p+'</td><td>'+f.u+'</td><td>'+(f.d>=0?up(f.d):up(f.d))+'</td><td><span class="tag t-gray">'+f.src+'</span></td><td>'+f.t+'</td><td>'+stt+'</td></tr>';
      }
      return ''+
      '<div class="grid g4">'+
        kpi("inventory_2","已匯入品項","42","項",5.0,"down")+
        kpi("check_circle","校驗通過率","96.4","%",2.1,"up")+
        kpi("schedule","延遲來源","2","源",0,"flat")+
        kpi("update","最後同步","06:07","",0,"flat")+
      '</div>'+
      '<div class="grid g21" style="margin-top:16px;">'+
        '<div class="card"><h3><span class="material-symbols-outlined">table_rows</span>今日行情匯入明細</h3><p class="chint">來源：LME / 上期所 / 大商所 / ICE / SICOM — 每日 06:00 排程匯入並校驗缺漏</p><div style="overflow-x:auto"><table><thead><tr><th>原物料</th><th>最新報價</th><th>單位</th><th>日變動</th><th>來源</th><th>時間</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
        '<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>來源匯入狀態</h3><p class="chint">各行情來源今日資料完整度</p><div id="c0a" class="chart"></div></div>'+
      '</div>'+
      '<div class="grid g2" style="margin-top:16px;">'+
        '<div class="card"><h3><span class="material-symbols-outlined">schedule</span>匯入時序</h3><p class="chint">今日排程與人工補抓紀錄</p>'+
        '<div class="tl">'+
          tl("06:00 排程啟動","系統排程 · 自動","啟動每日行情匯入，掃描 5 個來源共 42 項原物料。")+
          tl("06:05 上期所/大商所入庫","資料管道 · 自動","熱軋鋼卷、PP 等 14 項國內期貨報價校驗通過。")+
          tl("06:07 原油來源延遲","監控 · 告警","ICE Brent 回應延遲，採前一交易日收盤價暫代。")+
          tl("06:12 鎳報價缺漏補抓","採購專員 · 人工","LME Nickel 缺漏，手動觸發重抓並標記待覆核。")+
        '</div></div>'+
        '<div class="card"><h3><span class="material-symbols-outlined">data_check</span>資料品質檢核</h3><p class="chint">匯入後自動校驗規則</p>'+
        qc("欄位完整性","41 / 42 品項欄位齊備",97,"t-ok")+
        qc("重複值檢查","無重複交易日報價",100,"t-ok")+
        qc("跳點偵測","2 筆日變動 >5% 已標記覆核",92,"t-warn")+
        qc("來源時效","1 源逾時採替代來源",83,"t-warn")+
        '</div>'+
      '</div>';
    }

    // ---------- SCREEN 1 : 價格趨勢分析 ----------
    function s1(){
      return ''+
      '<div class="segrow"><span class="seg on">銅 LME</span><span class="seg">鋁</span><span class="seg">熱軋鋼卷</span><span class="seg">原油 Brent</span></div>'+
      '<div class="grid g4">'+
        kpi("payments","現價 USD/噸","9,428","",1.8,"up")+
        kpi("show_chart","30 日均線","9,182","",2.7,"up")+
        kpi("waves","年化波動率","24.6","%",3.4,"up")+
        kpi("expand","52 週區間位置","78","%",0,"flat")+
      '</div>'+

      mk("c5a",{chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"line",height:320},series:[{name:"預測準確度 %",data:[74,76,79,80,81,82.5]},{name:"成本波動率 %",data:[9.2,8.6,7.8,7.1,6.6,6.1]}],colors:[A,UP],xaxis:{categories:mo},yaxis:[{labels:{formatter:function(v){return v+"%";}}},{opposite:true,labels:{formatter:function(v){return v+"%";}}}],stroke:{width:3,curve:"smooth"},markers:{size:4},grid:{borderColor:"#eef2f6"},legend:{position:"top"},dataLabels:{enabled:false},tooltip:{shared:true,intersect:false}});
      mk("c5b",{chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"donut",height:300},series:[3,1,1],labels:["採納且命中","採納偏差","未採納"],colors:[DN,WN,"#94a3b8"],stroke:{width:2},legend:{position:"bottom"},dataLabels:{enabled:true,formatter:function(v){return v.toFixed(0)+"%";}},plotOptions:{pie:{donut:{size:"62%"}}}});
    }

    var SCREENS=[
      {r:s0,c:charts0},
      {r:s1,c:charts1},
      {r:s2,c:charts2},
      {r:s3,c:charts3},
      {r:s4,c:charts4},
      {r:s5,c:charts5}
    ];

    function buildNav(){
      var nav=document.getElementById("nav");var h="";
      for(var i=0;i<MODS.length;i++){h+='<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span><span class="nlab">'+MODS[i].name+'</span><span class="nidx">0'+(i+1)+'</span></button>';}
      nav.innerHTML=h;
      var btns=nav.querySelectorAll("[data-i]");
      for(var j=0;j<btns.length;j++){(function(b){b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i");});})(btns[j]);}
    }

    function show(i){
      destroyCharts();
      var m=MODS[i];
      document.getElementById("scr-title").textContent=m.name;
      document.getElementById("scr-sub").textContent=m.sub;
      document.getElementById("scr-pill").textContent=m.pill;
      var btns=document.querySelectorAll("[data-i]");
      for(var k=0;k<btns.length;k++){btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i);}
      var cont=document.getElementById("screen");
      cont.innerHTML=SCREENS[i].r();
      void cont.offsetHeight;
      SCREENS[i].c();
    }

    buildNav();
    window.show=show;

    function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
    window.addEventListener("hashchange",fromHash);fromHash();
  })();
  </script>
