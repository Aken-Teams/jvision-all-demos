<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>新供應商評鑑導入系統｜Jvision 系統 Demo</title>
  <meta name="description" content="新供應商資格申請、文件審查、樣品認證(PPAP/首件)、導入核准與試量產監控的單一平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --accent:#a16207; --accent2:#eab308; --accent-soft:#fef9c3;
      --ink:#1c1917; --muted:#78716c; --line:#e7e5e4; --bg:#faf9f7; --card:#ffffff;
      --ok:#15803d; --okbg:#dcfce7; --warn:#b45309; --warnbg:#fef3c7; --bad:#b91c1c; --badbg:#fee2e2;
      --info:#1d4ed8; --infobg:#dbeafe;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5;}
    .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
    a{color:inherit;text-decoration:none;}
    /* top bar */
    header.top{position:sticky;top:0;z-index:50;background:linear-gradient(90deg,#78450a,#a16207);color:#fff;box-shadow:0 2px 10px rgba(120,69,10,.28);}
    .top-inner{max-width:1360px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
    .brand{display:flex;align-items:center;gap:10px;min-width:0;}
    .brand .logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.3);}
    .brand .logo .material-symbols-outlined{font-size:24px;color:#fde68a;}
    .brand .t1{font-weight:800;font-size:16px;letter-spacing:.5px;white-space:nowrap;}
    .brand .t2{font-size:11px;color:#fde68a;opacity:.9;white-space:nowrap;}
    nav.mainnav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto;min-width:0;}
    nav.mainnav button{display:flex;align-items:center;gap:7px;background:transparent;border:1px solid transparent;color:#fef9c3;font-family:inherit;font-size:13px;font-weight:600;padding:8px 12px;border-radius:9px;cursor:pointer;transition:.15s;white-space:nowrap;min-width:0;}
    nav.mainnav button .material-symbols-outlined{font-size:19px;}
    nav.mainnav button:hover{background:rgba(255,255,255,.12);color:#fff;}
    nav.mainnav button.active{background:#fff;color:#a16207;box-shadow:0 2px 8px rgba(0,0,0,.15);}
    main{max-width:1360px;margin:0 auto;padding:22px 20px 60px;}
    .screen-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
    .screen-head .ic{width:46px;height:46px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
    .screen-head .ic .material-symbols-outlined{font-size:26px;}
    .screen-head h1{margin:0;font-size:20px;font-weight:800;}
    .screen-head p{margin:2px 0 0;color:var(--muted);font-size:13px;}
    .badge{margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;}
    .badge .dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);}
    /* grids */
    .grid{display:grid;gap:16px;}
    .g4{grid-template-columns:repeat(4,1fr);}
    .g3{grid-template-columns:repeat(3,1fr);}
    .g2{grid-template-columns:repeat(2,1fr);}
    .g-2-1{grid-template-columns:2fr 1fr;}
    .g-1-2{grid-template-columns:1fr 2fr;}
    @media(max-width:820px){
      .g4,.g3,.g2,.g-2-1,.g-1-2{grid-template-columns:1fr;}
    }
    .grid>*{min-width:0;}
    /* cards */
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;}
    .card h3{margin:0 0 12px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;}
    .card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
    .card .sub{font-size:12px;color:var(--muted);font-weight:500;margin-left:auto;}
    /* kpi */
    .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0;position:relative;overflow:hidden;}
    .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent2);}
    .kpi .lbl{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;}
    .kpi .lbl .material-symbols-outlined{font-size:17px;color:var(--accent);}
    .kpi .val{font-size:27px;font-weight:900;margin-top:6px;letter-spacing:-.5px;}
    .kpi .val small{font-size:13px;font-weight:700;color:var(--muted);margin-left:2px;}
    .kpi .delta{font-size:12px;font-weight:700;margin-top:3px;display:flex;align-items:center;gap:3px;}
    .kpi .delta .material-symbols-outlined{font-size:15px;}
    .up{color:var(--ok);} .down{color:var(--bad);}
    /* chart wrap */
    .chart-wrap{position:relative;width:100%;overflow:hidden;}
    /* table */
    .twrap{overflow-x:auto;border-radius:10px;}
    table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
    th{text-align:left;font-size:11px;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:2px solid var(--line);white-space:nowrap;background:#fbfaf8;}
    td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
    tr:last-child td{border-bottom:none;}
    tbody tr:hover{background:var(--accent-soft);}
    .mono{font-variant-numeric:tabular-nums;font-weight:700;}
    /* pill */
    .pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;}
    .pill .material-symbols-outlined{font-size:14px;}
    .p-ok{background:var(--okbg);color:var(--ok);}
    .p-warn{background:var(--warnbg);color:var(--warn);}
    .p-bad{background:var(--badbg);color:var(--bad);}
    .p-info{background:var(--infobg);color:var(--info);}
    .p-mut{background:#f1f0ee;color:var(--muted);}
    /* progress */
    .bar{height:8px;border-radius:6px;background:#f1f0ee;overflow:hidden;min-width:60px;}
    .bar>span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
    /* board */
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
    @media(max-width:820px){.board{grid-template-columns:1fr;}}
    .board>*{min-width:0;}
    .col{background:#fbfaf8;border:1px solid var(--line);border-radius:12px;padding:10px;}
    .col .ch{font-size:12px;font-weight:800;padding:4px 6px 10px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);margin-bottom:10px;}
    .col .ch .cnt{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 8px;font-size:11px;color:var(--muted);}
    .tk{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:9px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
    .tk .tk-t{font-size:13px;font-weight:700;}
    .tk .tk-m{font-size:11px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
    .tk .tk-m .material-symbols-outlined{font-size:14px;}
    /* timeline */
    .tl{position:relative;padding-left:22px;}
    .tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line);}
    .tl-item{position:relative;padding:0 0 16px;}
    .tl-item:last-child{padding-bottom:0;}
    .tl-item .node{position:absolute;left:-22px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--accent2);}
    .tl-item.done .node{background:var(--accent2);}
    .tl-item .tt{font-size:13px;font-weight:700;}
    .tl-item .tm{font-size:11px;color:var(--muted);margin-top:2px;}
    /* stepflow */
    .steps{display:flex;gap:0;flex-wrap:wrap;}
    .step{flex:1 1 130px;min-width:0;background:#fbfaf8;border:1px solid var(--line);border-radius:12px;padding:12px;margin:4px;position:relative;}
    .step .n{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-bottom:8px;}
    .step.cur .n{background:var(--accent2);color:#78450a;}
    .step .st{font-size:13px;font-weight:700;}
    .step .sd{font-size:11px;color:var(--muted);margin-top:3px;}
    /* gauge row */
    .gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
    @media(max-width:820px){.gauges{grid-template-columns:1fr;}}
    .gauges>*{min-width:0;}
    /* misc */
    .rowflex{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0;}
    .tag{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:6px;}
    .avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
    .divi{height:1px;background:var(--line);margin:12px 0;}
    .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px;}
    .legend span{display:inline-flex;align-items:center;gap:5px;}
    .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
    .scorering{display:flex;align-items:center;gap:14px;}
    .bigscore{font-size:34px;font-weight:900;letter-spacing:-1px;}
    .foot{margin-top:34px;text-align:center;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:18px;}
    @media(max-width:560px){
      nav.mainnav button .lbl{display:none;}
      nav.mainnav button{padding:8px 10px;}
      .brand .t2{display:none;}
    }
    .doclist{list-style:none;margin:0;padding:0;}
    .doclist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;}
    .doclist li:last-child{border-bottom:none;}
    .doclist .di{width:32px;height:32px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
    .doclist .dn{font-weight:700;}
    .doclist .dm{font-size:11px;color:var(--muted);}
    .doclist .ds{margin-left:auto;}
    .approve-row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:#fbfaf8;}
    .approve-row .ar-av{flex:0 0 auto;}
    .approve-row .ar-body{min-width:0;flex:1;}
    .approve-row .ar-name{font-size:13px;font-weight:700;}
    .approve-row .ar-role{font-size:11px;color:var(--muted);}
    .approve-row .ar-status{margin-left:auto;flex:0 0 auto;}
    .metric-line{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
    .metric-line:last-child{border-bottom:none;}
    .metric-line .ml-l{color:var(--muted);min-width:130px;}
    .metric-line .ml-b{flex:1;min-width:60px;}
    .metric-line .ml-v{font-weight:800;font-variant-numeric:tabular-nums;min-width:56px;text-align:right;}
  </style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">verified</span></div>
        <div>
          <div class="t1">新供應商評鑑導入系統</div>
          <div class="t2">Supplier Qualification &amp; Onboarding Platform</div>
        </div>
      </div>
      <nav class="mainnav" id="nav"></nav>
    </div>
  </header>
  <main id="app"></main>

  <script>
  (function(){
    "use strict";

    var NAV = [
      {icon:"groups",       label:"資格申請"},
      {icon:"fact_check",   label:"文件審查"},
      {icon:"science",      label:"樣品認證"},
      {icon:"gavel",        label:"導入核准"},
      {icon:"monitoring",   label:"試量產"},
      {icon:"insights",     label:"績效分析"}
    ];

    var charts = {};
    function destroyCharts(){
      for(var k in charts){ if(charts[k]){ try{charts[k].destroy();}catch(e){} charts[k]=null; } }
      charts = {};
    }

    function esc(s){ return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); }

    function head(icon,title,desc,badge){
      return '<div class="screen-head"><div class="ic"><span class="material-symbols-outlined">'+icon+'</span></div>'+
        '<div style="min-width:0"><h1>'+title+'</h1><p>'+desc+'</p></div>'+
        '<div class="badge"><span class="dot"></span>'+badge+'</div></div>';
    }

    function kpi(o){
      var d = o.delta ? '<div class="delta '+(o.dir||'up')+'"><span class="material-symbols-outlined">'+(o.dir==='down'?'trending_down':'trending_up')+'</span>'+o.delta+'</div>' : '';
      return '<div class="kpi"><div class="lbl"><span class="material-symbols-outlined">'+o.icon+'</span>'+o.lbl+'</div>'+
        '<div class="val">'+o.val+(o.unit?'<small>'+o.unit+'</small>':'')+'</div>'+d+'</div>';
    }

    function pill(text,cls,icon){
      return '<span class="pill '+cls+'">'+(icon?'<span class="material-symbols-outlined">'+icon+'</span>':'')+text+'</span>';
    }

    function barCell(pct){
      return '<div class="rowflex" style="gap:8px"><div class="bar" style="flex:1"><span style="width:'+pct+'%"></span></div><span class="mono" style="font-size:12px;min-width:38px">'+pct+'%</span></div>';
    }

    var container;

    // ---------- SCREEN 0: 資格申請收件 ----------
    function s0(){
      var rows = [
        {id:"NSA-2408-017", name:"鴻昱精密工業", cat:"CNC 金屬件", region:"台中", date:"08/12", part:"外殼支架 x3", status:["收件完成","p-ok","task_alt"]},
        {id:"NSA-2408-016", name:"O豐橡塑膠", cat:"射出成型件", region:"桃園", date:"08/12", part:"防塵墊圈 x2", status:["問卷待補","p-warn","edit_note"]},
        {id:"NSA-2408-015", name:"永盛電子材料", cat:"被動元件", region:"新竹", date:"08/11", part:"貼片電容 x5", status:["收件完成","p-ok","task_alt"]},
        {id:"NSA-2408-014", name:"晉德精工", cat:"沖壓件", region:"台南", date:"08/10", part:"端子彈片 x1", status:["資料退回","p-bad","undo"]},
        {id:"NSA-2408-013", name:"利宏表面處理", cat:"電鍍/陽極", region:"高雄", date:"08/09", part:"陽極處理 x4", status:["收件完成","p-ok","task_alt"]},
        {id:"NSA-2408-012", name:"O慶線材", cat:"線束加工", region:"彰化", date:"08/08", part:"連接線束 x2", status:["問卷待補","p-warn","edit_note"]}
      ];
      var tr = rows.map(function(r){
        return '<tr><td class="mono">'+r.id+'</td>'+
          '<td><div class="rowflex" style="gap:8px"><div class="avatar">'+esc(r.name.slice(0,1))+'</div><b>'+esc(r.name)+'</b></div></td>'+
          '<td>'+esc(r.cat)+'</td><td>'+r.region+'</td><td>'+esc(r.part)+'</td><td class="mono">'+r.date+'</td>'+
          '<td>'+pill(r.status[0],r.status[1],r.status[2])+'</td></tr>';
      }).join('');

      var steps = [
        {n:1,t:"資格問卷",d:"線上填寫產能/認證",cur:true},
        {n:2,t:"基本建檔",d:"統編、聯絡窗口"},
        {n:3,t:"導入品項",d:"綁定料號範圍"},
        {n:4,t:"收件確認",d:"轉交文件審查"}
      ];
      var stepsHtml = steps.map(function(s){
        return '<div class="step '+(s.cur?'cur':'')+'"><div class="n">'+s.n+'</div><div class="st">'+s.t+'</div><div class="sd">'+s.d+'</div></div>';
      }).join('');

      container.innerHTML =
        head("groups","供應商資格申請收件","新供應商填寫資格問卷、建檔並綁定導入品項範圍","採購專員 · 本月 17 件") +
        '<div class="grid g4" style="margin-bottom:16px">'+
          kpi({icon:"inbox",lbl:"本月申請件數",val:"17",unit:"件",delta:"+5 件",dir:"up"})+
          kpi({icon:"task_alt",lbl:"問卷完成率",val:"82",unit:"%",delta:"+9%",dir:"up"})+
          kpi({icon:"pending_actions",lbl:"待補資料",val:"4",unit:"件",delta:"-2 件",dir:"up"})+
          kpi({icon:"schedule",lbl:"平均收件工時",val:"1.8",unit:"天",delta:"-0.6 天",dir:"up"})+
        '</div>'+
        '<div class="card" style="margin-bottom:16px"><h3><span class="material-symbols-outlined">conveyor_belt</span>收件作業流程</h3>'+
          '<div class="steps">'+stepsHtml+'</div></div>'+
        '<div class="grid g-2-1">'+
          '<div class="card"><h3><span class="material-symbols-outlined">assignment_ind</span>近期資格申請案<span class="sub">依收件時間排序</span></h3>'+
            '<div class="twrap"><table><thead><tr><th>申請編號</th><th>供應商</th><th>類別</th><th>地區</th><th>導入品項</th><th>申請日</th><th>狀態</th></tr></thead><tbody>'+tr+'</tbody></table></div></div>'+
          '<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>申請類別分布</h3>'+
            '<div class="chart-wrap" style="height:220px"><canvas id="c0a"></canvas></div>'+
            '<div class="legend"><span><i style="background:#a16207"></i>金屬加工</span><span><i style="background:#eab308"></i>塑膠成型</span><span><i style="background:#ca8a04"></i>電子元件</span><span><i style="background:#fde68a"></i>表面處理</span></div></div>'+
        '</div>';

      void container.offsetHeight;
      var ctx = document.getElementById("c0a");
      if(ctx){
        charts.c0a = new Chart(ctx,{
          type:"doughnut",
          data:{labels:["金屬加工","塑膠成型","電子元件","表面處理"],
            datasets:[{data:[6,4,5,2],backgroundColor:["#a16207","#eab308","#ca8a04","#fde68a"],borderWidth:2,borderColor:"#fff"}]},
          options:{maintainAspectRatio:false,responsive:true,cutout:"62%",plugins:{legend:{display:false}}}
        });
      }
    }

    // ---------- SCREEN 1: 文件審查 ----------
    function s1(){
      var docs = [
        {n:"ISO 9001 品質認證",m:"效期至 2026/09",st:["合格","p-ok","verified"],ic:"workspace_premium"},
        {n:"IATF 16949 證書",m:"效期至 2027/03",st:["合格","p-ok","verified"],ic:"workspace_premium"},
        {n:"財務信用報告",m:"聯徵 D&B 等級 B+",st:["合格","p-ok","verified"],ic:"account_balance"},
        {n:"RoHS / REACH 聲明",m:"缺 SVHC 附件",st:["待補件","p-warn","hourglass_top"],ic:"eco"},
        {n:"製程能力 Cpk 報告",m:"Cpk 1.42 達標",st:["合格","p-ok","verified"],ic:"analytics"},
        {n:"營業登記/工廠登記",m:"統編驗證通過",st:["合格","p-ok","verified"],ic:"description"},
        {n:"保密協議 NDA",m:"用印待回簽",st:["待簽署","p-info","draw"],ic:"gavel"},
        {n:"社會責任稽核 RBA",m:"分數 68 未達 75",st:["不合格","p-bad","block"],ic:"diversity_3"}
      ];
      var lis = docs.map(function(d){
        return '<li><div class="di"><span class="material-symbols-outlined">'+d.ic+'</span></div>'+
          '<div style="min-width:0"><div class="dn">'+esc(d.n)+'</div><div class="dm">'+esc(d.m)+'</div></div>'+
          '<div class="ds">'+pill(d.st[0],d.st[1],d.st[2])+'</div></li>';
      }).join('');

      container.innerHTML =

        var idx = +this.getAttribute("data-i");
        location.hash = "v"+idx;
      });
    }

    function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
    window.addEventListener("hashchange",fromHash);fromHash();
  })();
  </script>
</body>
</html>
