<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>新供應商評鑑導入系統｜Jvision 系統 Demo</title>
  <meta name="description" content="新供應商資格申請、文件審查、樣品認證(PPAP/首件)、導入核准與試量產監控的單一平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --color-primary:#2563eb;
      --color-on-primary:#fff;
      --color-secondary:#3b82f6;
      --color-on-secondary:#000;
      --color-accent:#ea580c;
      --color-on-accent:#000;
      --color-background:#f8fafc;
      --color-foreground:#1e293b;
      --color-card:#fff;
      --color-card-foreground:#1e293b;
      --color-muted:#e9eff8;
      --color-muted-foreground:#475569;
      --color-border:#e2e8f0;
      --color-destructive:#dc2626;
      --color-on-destructive:#fff;
      --color-ring:#2563eb;
      --blue:#2563eb;
      --ink:#1e293b;
      --muted:#475569;
      --line:#e2e8f0;
      --ok:#166534;
      --ok-bg:#dcfce7;
      --warn:#92400e;
      --warn-bg:#fef3c7;
      --bad:#b91c1c;
      --bad-bg:#fee2e2;
      --info:#1d4ed8;
      --info-bg:#dbeafe;
      --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.045);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Fira Sans",sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
    button,a{font:inherit}
    button{cursor:pointer}
    button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid rgba(37,99,235,.28);outline-offset:3px}
    .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;line-height:1;vertical-align:middle}
    .top{position:sticky;top:0;z-index:50;color:#fff;background:rgba(15,23,42,.96);border-bottom:1px solid rgba(255,255,255,.12);box-shadow:0 4px 20px rgba(15,23,42,.12);backdrop-filter:blur(16px)}
    .top-inner{max-width:1440px;margin:auto;padding:12px 28px;display:flex;align-items:center;gap:28px}
    .brand{display:flex;align-items:center;gap:12px;min-width:max-content}
    .logo{width:40px;height:40px;display:grid;place-items:center;background:var(--blue);border-radius:8px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
    .logo .material-symbols-outlined{font-size:23px}
    .t1{font-size:15px;font-weight:700;letter-spacing:.02em}
    .t2{margin-top:1px;color:#cbd5e1;font:400 10px/1.4 "Fira Code",monospace;letter-spacing:.02em}
    .mainnav{margin-left:auto;display:flex;align-items:center;gap:4px}
    .mainnav button{min-height:42px;padding:8px 11px;display:flex;align-items:center;gap:7px;color:#cbd5e1;background:transparent;border:1px solid transparent;border-radius:7px;font-size:12px;font-weight:600;transition:background-color .2s,color .2s,border-color .2s}
    .mainnav button .material-symbols-outlined{font-size:18px}
    .mainnav button:hover{color:#fff;background:rgba(255,255,255,.08)}
    .mainnav button.active{color:#fff;background:var(--blue);border-color:#60a5fa}
    main{max-width:1440px;margin:auto;padding:30px 28px 56px}
    .screen-head{position:relative;margin-bottom:22px;padding:25px 27px;display:flex;align-items:center;gap:16px;background:linear-gradient(110deg,#fff 0%,#fff 66%,#eff6ff 100%);border:1px solid var(--line);border-left:4px solid var(--blue);box-shadow:var(--shadow)}
    .screen-head .ic{width:48px;height:48px;display:grid;place-items:center;flex:0 0 auto;color:var(--blue);background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px}
    .screen-head .ic .material-symbols-outlined{font-size:25px}
    .screen-head h1{margin:0;font-size:23px;line-height:1.25;font-weight:700;letter-spacing:-.02em}
    .screen-head p{margin:5px 0 0;color:var(--muted);font-size:13px}
    .badge{margin-left:auto;min-height:34px;padding:7px 12px;display:flex;align-items:center;gap:8px;color:#334155;background:#fff;border:1px solid #cbd5e1;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
    .badge .dot{width:8px;height:8px;background:var(--color-accent);border-radius:50%;box-shadow:0 0 0 3px #ffedd5}
    .grid{display:grid;gap:16px}
    .grid>*{min-width:0}
    .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .g-2-1{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
    .g-1-2{grid-template-columns:minmax(280px,1fr) minmax(0,2fr)}
    .card,.kpi{background:var(--color-card);border:1px solid var(--line);box-shadow:var(--shadow);transition:border-color .22s,box-shadow .22s,transform .22s}
    .card:hover,.kpi:hover{border-color:#bfdbfe;box-shadow:0 1px 2px rgba(15,23,42,.05),0 12px 28px rgba(37,99,235,.07)}
    .card{padding:18px;border-radius:10px}
    .card h3{margin:0 0 14px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
    .card h3 .material-symbols-outlined{color:var(--blue);font-size:19px}
    .sub{margin-left:auto;color:var(--muted);font:500 11px "Fira Code",monospace}
    .kpi{position:relative;overflow:hidden;padding:17px 18px 16px;border-radius:9px}
    .kpi:after{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--blue)}
    .kpi .lbl{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:600}
    .kpi .lbl .material-symbols-outlined{color:var(--blue);font-size:18px}
    .kpi .val{margin-top:8px;font:700 27px/1.15 "Fira Code",monospace;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
    .kpi .val small{margin-left:4px;color:var(--muted);font:500 12px "Fira Sans",sans-serif}
    .delta{margin-top:6px;display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600}
    .delta .material-symbols-outlined{font-size:15px}
    .up{color:var(--ok)}
    .down{color:var(--bad)}
    .chart-wrap{position:relative;width:100%;overflow:hidden}
    .twrap{overflow-x:auto;border:1px solid var(--line);border-radius:7px}
    table{width:100%;min-width:540px;border-collapse:collapse;font-size:12px}
    th{padding:10px 12px;text-align:left;color:#334155;background:#f1f5f9;border-bottom:1px solid #cbd5e1;font:600 11px "Fira Code",monospace;letter-spacing:.02em;white-space:nowrap}
    td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
    tbody tr:last-child td{border-bottom:0}
    tbody tr{transition:background-color .18s}
    tbody tr:hover{background:#eff6ff}
    th:nth-last-child(n+2),td.mono{font-variant-numeric:tabular-nums}
    td.mono,.mono{font-family:"Fira Code",monospace;font-weight:600}
    td:nth-child(n+3){font-variant-numeric:tabular-nums}
    .pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border:1px solid transparent;border-radius:999px;font-size:10px;font-weight:700;line-height:1.25;white-space:nowrap}
    .pill .material-symbols-outlined{font-size:14px}
    .p-ok{color:var(--ok);background:var(--ok-bg);border-color:#bbf7d0}
    .p-warn{color:var(--warn);background:var(--warn-bg);border-color:#fde68a}
    .p-bad{color:var(--bad);background:var(--bad-bg);border-color:#fecaca}
    .p-info{color:var(--info);background:var(--info-bg);border-color:#bfdbfe}
    .p-mut{color:#475569;background:#f1f5f9;border-color:#cbd5e1}
    .bar{height:7px;min-width:60px;overflow:hidden;background:#e2e8f0;border-radius:2px}
    .bar>span{display:block;height:100%;background:var(--blue);border-radius:2px}
    .board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
    .col{padding:11px;background:#f8fafc;border:1px solid var(--line);border-radius:8px}
    .ch{margin-bottom:10px;padding:3px 3px 10px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700}
    .cnt{margin-left:auto;padding:1px 7px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;font:600 10px "Fira Code",monospace}
    .tk{margin-bottom:8px;padding:11px;background:#fff;border:1px solid var(--line);border-radius:7px;box-shadow:0 1px 2px rgba(15,23,42,.04);transition:transform .2s,border-color .2s}
    .tk:last-child{margin-bottom:0}
    .tk:hover{transform:translateY(-2px);border-color:#93c5fd}
    .tk-t{font-size:12px;font-weight:700}
    .tk-m{margin-top:5px;display:flex;align-items:center;gap:5px;color:var(--muted);font:400 10px "Fira Code",monospace}
    .tk-m .material-symbols-outlined{font-size:14px}
    .tl{position:relative;padding-left:24px}
    .tl:before{content:"";position:absolute;left:7px;top:5px;bottom:5px;width:2px;background:#cbd5e1}
    .tl-item{position:relative;padding-bottom:17px}
    .tl-item:last-child{padding-bottom:0}
    .node{position:absolute;left:-24px;top:2px;width:16px;height:16px;background:#fff;border:3px solid #94a3b8;border-radius:50%}
    .tl-item.done .node{background:var(--blue);border-color:var(--blue);box-shadow:0 0 0 3px #dbeafe}
    .tt{font-size:12px;font-weight:700}
    .tm{margin-top:3px;color:var(--muted);font:400 10px "Fira Code",monospace}
    .steps{display:flex;gap:8px}
    .step{position:relative;flex:1;padding:13px;background:#f8fafc;border:1px solid var(--line);border-radius:8px}
    .step .n{width:25px;height:25px;display:grid;place-items:center;margin-bottom:8px;color:#fff;background:#64748b;border-radius:5px;font:700 11px "Fira Code",monospace}
    .step.cur{background:#eff6ff;border-color:#93c5fd}
    .step.cur .n{background:var(--blue)}
    .st{font-size:12px;font-weight:700}
    .sd{margin-top:3px;color:var(--muted);font-size:10px}
    .rowflex{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
    .avatar{width:29px;height:29px;display:grid;place-items:center;flex:0 0 auto;color:#fff;background:#334155;border-radius:6px;font:700 11px "Fira Code",monospace}
    .divi{height:1px;margin:13px 0;background:var(--line)}
    .legend{margin-top:9px;display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:10px}
    .legend span{display:inline-flex;align-items:center;gap:5px}
    .legend i{width:10px;height:4px;display:inline-block;border-radius:1px}
    .scorering{display:flex;align-items:center;gap:15px}
    .bigscore{font:700 34px "Fira Code",monospace;letter-spacing:-.05em}
    .doclist{margin:0;padding:0;list-style:none}
    .doclist li{padding:10px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
    .doclist li:last-child{border-bottom:0}
    .di{width:32px;height:32px;display:grid;place-items:center;flex:0 0 auto;color:var(--blue);background:#eff6ff;border-radius:6px}
    .di .material-symbols-outlined{font-size:18px}
    .dn{font-size:12px;font-weight:700}
    .dm{color:var(--muted);font:400 10px "Fira Code",monospace}
    .ds{margin-left:auto}
    .approve-row{margin-bottom:9px;padding:11px;display:flex;align-items:center;gap:11px;background:#f8fafc;border:1px solid var(--line);border-radius:7px}
    .ar-body{min-width:0;flex:1}
    .ar-name{font-size:12px;font-weight:700}
    .ar-role{color:var(--muted);font-size:10px}
    .ar-status{margin-left:auto;flex:0 0 auto}
    .metric-line{padding:9px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);font-size:12px}
    .metric-line:last-child{border-bottom:0}
    .ml-l{min-width:130px;color:var(--muted)}
    .ml-b{flex:1;min-width:60px}
    .ml-v{min-width:45px;text-align:right;font:700 11px "Fira Code",monospace;font-variant-numeric:tabular-nums}
    .foot{margin-top:38px;padding-top:18px;text-align:center;color:var(--muted);border-top:1px solid var(--line);font:400 10px "Fira Code",monospace}
    @media(max-width:1100px){
      .top-inner{align-items:flex-start;flex-direction:column;gap:10px}
      .mainnav{width:100%;margin-left:0;overflow-x:auto}
      .mainnav button{flex:1;justify-content:center}
      .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media(max-width:768px){
      main{padding:20px 16px 44px}
      .top-inner{padding:11px 16px}
      .screen-head{padding:19px;align-items:flex-start}
      .badge{width:100%;margin:2px 0 0 64px}
      .g3,.g2,.g-2-1,.g-1-2{grid-template-columns:1fr}
      .board{grid-template-columns:repeat(2,minmax(0,1fr))}
      .steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media(max-width:480px){
      .t2{display:none}
      .mainnav button{min-width:46px;padding:9px}
      .mainnav .lbl{display:none}
      .screen-head{padding:17px}
      .screen-head h1{font-size:19px}
      .screen-head .ic{width:42px;height:42px}
      .badge{margin-left:0}
      .g4,.board,.steps{grid-template-columns:1fr}
      .kpi{padding:15px 16px}
      .card{padding:15px}
      .scorering{align-items:flex-start;flex-direction:column}
      .approve-row{align-items:flex-start}
      .ml-l{min-width:105px}
    }
    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*:before,*:after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
      .tk:hover{transform:none}
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">verified</span></div>
        <div>
          <div class="t1">新供應商評鑑導入系統</div>
          <div class="t2">Supplier Qualification &amp; Onboarding Platform</div>
        </div>
      </div>
      <nav class="mainnav" id="nav" aria-label="主要功能"></nav>
    </div>
  </header>
  <main id="app"></main>
  <script>
  (function(){
    "use strict";
    var NAV=[
      {icon:"groups",label:"資格申請"},
      {icon:"fact_check",label:"文件審查"},
      {icon:"science",label:"樣品認證"},
      {icon:"gavel",label:"導入核准"},
      {icon:"monitoring",label:"試量產"},
      {icon:"insights",label:"績效分析"}
    ];
    var charts={},container;
    var C={
      blue:"#2563eb",secondary:"#3b82f6",accent:"#ea580c",
      pale:"#bfdbfe",light:"#dbeafe",ink:"#1e293b",muted:"#64748b",
      line:"#e2e8f0",bad:"#dc2626",ok:"#16a34a"
    };
    Chart.defaults.font.family='"Fira Sans",sans-serif';
    Chart.defaults.color=C.muted;
    function destroyCharts(){
      for(var k in charts){
        if(charts[k]){
          try{charts[k].destroy()}catch(e){}
          charts[k]=null;
        }
      }
      charts={};
    }
    function esc(s){
      return String(s).replace(/[&<>]/g,function(c){
        return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];
      });
    }
    function head(icon,title,desc,badge){
      return '<div class="screen-head"><div class="ic"><span class="material-symbols-outlined">'+icon+'</span></div>'+
        '<div style="min-width:0"><h1>'+title+'</h1><p>'+desc+'</p></div>'+
        '<div class="badge"><span class="dot"></span>'+badge+'</div></div>';
    }
    function kpi(o){
      var d=o.delta?'<div class="delta '+(o.dir||"up")+'"><span class="material-symbols-outlined">'+
        (o.dir==="down"?"trending_down":"trending_up")+'</span>'+o.delta+'</div>':"";
      return '<div class="kpi"><div class="lbl"><span class="material-symbols-outlined">'+o.icon+
        '</span>'+o.lbl+'</div><div class="val">'+o.val+(o.unit?'<small>'+o.unit+'</small>':"")+
        '</div>'+d+'</div>';
    }
    function pill(text,cls,icon){
      return '<span class="pill '+cls+'">'+(icon?'<span class="material-symbols-outlined">'+icon+
        '</span>':"")+text+'</span>';
    }
    function barCell(pct){
      return '<div class="rowflex" style="gap:8px"><div class="bar" style="flex:1"><span style="width:'+
        pct+'%"></span></div><span class="mono" style="font-size:11px;min-width:38px;text-align:right">'+
        pct+'%</span></div>';
    }
    function chartBase(){
      return {
        maintainAspectRatio:false,
        responsive:true,
        animation:window.matchMedia("(prefers-reduced-motion: reduce)").matches?false:{duration:350}
      };
    }

    function s0(){
      var rows=[
        {id:"NSA-2408-017",name:"鴻昱精密工業",cat:"CNC 金屬件",region:"台中",date:"08/12",part:"外殼支架 x3",status:["收件完成","p-ok","task_alt"]},
        {id:"NSA-2408-016",name:"O豐橡塑膠",cat:"射出成型件",region:"桃園",date:"08/12",part:"防塵墊圈 x2",status:["問卷待補","p-warn","edit_note"]},
        {id:"NSA-2408-015",name:"永盛電子材料",cat:"被動元件",region:"新竹",date:"08/11",part:"貼片電容 x5",status:["收件完成","p-ok","task_alt"]},
        {id:"NSA-2408-014",name:"晉德精工",cat:"沖壓件",region:"台南",date:"08/10",part:"端子彈片 x1",status:["資料退回","p-bad","undo"]},
        {id:"NSA-2408-013",name:"利宏表面處理",cat:"電鍍/陽極",region:"高雄",date:"08/09",part:"陽極處理 x4",status:["收件完成","p-ok","task_alt"]},
        {id:"NSA-2408-012",name:"O慶線材",cat:"線束加工",region:"彰化",date:"08/08",part:"連接線束 x2",status:["問卷待補","p-warn","edit_note"]}
      ];
      var tr=rows.map(function(r){
        return '<tr><td class="mono">'+r.id+'</td><td><div class="rowflex" style="gap:8px"><div class="avatar">'+
          esc(r.name.slice(0,1))+'</div><b>'+esc(r.name)+'</b></div></td><td>'+esc(r.cat)+'</td><td>'+
          r.region+'</td><td>'+esc(r.part)+'</td><td class="mono">'+r.date+'</td><td>'+
          pill(r.status[0],r.status[1],r.status[2])+'</td></tr>';
      }).join("");
      var steps=[
        {n:1,t:"資格問卷",d:"線上填寫產能/認證",cur:true},
        {n:2,t:"基本建檔",d:"統編、聯絡窗口"},
        {n:3,t:"導入品項",d:"綁定料號範圍"},
        {n:4,t:"收件確認",d:"轉交文件審查"}
      ].map(function(s){
        return '<div class="step '+(s.cur?"cur":"")+'"><div class="n">'+s.n+'</div><div class="st">'+
          s.t+'</div><div class="sd">'+s.d+'</div></div>';
      }).join("");
      container.innerHTML=
        head("groups","供應商資格申請收件","新供應商填寫資格問卷、建檔並綁定導入品項範圍","採購專員 · 本月 17 件")+
        '<div class="grid g4" style="margin-bottom:16px">'+
        kpi({icon:"inbox",lbl:"本月申請件數",val:"17",unit:"件",delta:"+5 件"})+
        kpi({icon:"task_alt",lbl:"問卷完成率",val:"82",unit:"%",delta:"+9%"})+
        kpi({icon:"pending_actions",lbl:"待補資料",val:"4",unit:"件",delta:"-2 件"})+
        kpi({icon:"schedule",lbl:"平均收件工時",val:"1.8",unit:"天",delta:"-0.6 天"})+
        '</div><div class="card" style="margin-bottom:16px"><h3><span class="material-symbols-outlined">conveyor_belt</span>收件作業流程</h3><div class="steps">'+

            {type:"bar",label:"導入週期(天)",data:[45,42,39,36,35,33],backgroundColor:C.blue,borderRadius:3,yAxisID:"y"},
            {type:"line",label:"首次通過率(%)",data:[73,77,80,83,86,88],borderColor:C.accent,backgroundColor:C.accent,borderWidth:2.5,tension:.3,pointRadius:3,yAxisID:"y1"}
          ]},
          options:Object.assign(chartBase(),{
            plugins:{legend:{display:false}},
            scales:{
              y:{position:"left",min:0,max:60,grid:{color:C.line},title:{display:true,text:"天",font:{size:10}}},
              y1:{position:"right",min:60,max:100,grid:{display:false},title:{display:true,text:"%",font:{size:10}}},
              x:{grid:{display:false}}
            }
          })
        });
      }
    }

    var SCREENS=[s0,s1,s2,s3,s4,s5];
    function show(i){
      i=Math.max(0,Math.min(i,SCREENS.length-1));
      destroyCharts();
      var btns=document.querySelectorAll("[data-i]");
      for(var b=0;b<btns.length;b++){
        var active=+btns[b].getAttribute("data-i")===i;
        btns[b].classList.toggle("active",active);
        btns[b].setAttribute("aria-current",active?"page":"false");
      }
      container=document.getElementById("view");
      if(container){SCREENS[i]()}
    }
    var navEl=document.getElementById("nav");
    navEl.innerHTML=NAV.map(function(n,i){
      return '<button type="button" data-i="'+i+'" aria-label="'+n.label+'"><span class="material-symbols-outlined">'+
        n.icon+'</span><span class="lbl">'+n.label+'</span></button>';
    }).join("");
    document.getElementById("app").innerHTML='<div id="view"></div><div class="foot">新供應商評鑑導入系統 · Demo 展示介面 · 資料為模擬資料，僅供畫面示意</div>';
    var navbtns=navEl.querySelectorAll("[data-i]");
    for(var i=0;i<navbtns.length;i++){
      navbtns[i].addEventListener("click",function(){
        location.hash="v"+this.getAttribute("data-i");
      });
    }
    function fromHash(){
      var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
      if(!m){show(0);return}
      var n=document.querySelectorAll("[data-i]").length||6;
      show(Math.min(+m[1],n-1));
      try{window.scrollTo(0,0)}catch(e){}
    }
    window.addEventListener("hashchange",fromHash);
    fromHash();
  })();
  </script>
</body>
</html>
