<style>
:root{
  --accent:#15803d; --accent2:#4ade80; --accent-soft:#dcfce7; --accent-deep:#14532d;
  --bg:#f1f5f3; --card:#ffffff; --ink:#0f2419; --muted:#64766c; --line:#e2e8e4;
  --warn:#d97706; --danger:#dc2626; --info:#0369a1;
  --shadow:0 1px 2px rgba(20,83,45,.06),0 8px 24px rgba(20,83,45,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
.material-symbols-outlined,.mi{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;font-size:20px}
/* top nav */
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(120deg,#14532d,#166534 55%,#15803d);color:#fff;box-shadow:0 2px 14px rgba(20,83,45,.28)}
.topbar-in{max-width:1360px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent2),#22c55e);display:flex;align-items:center;justify-content:center;color:#0b3d1f;box-shadow:0 4px 12px rgba(74,222,128,.35);flex:none}
.brand .logo .mi{font-size:24px}
.brand h1{font-size:16px;margin:0;font-weight:900;letter-spacing:.3px;white-space:nowrap}
.brand p{margin:0;font-size:11px;opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-spacer{flex:1;min-width:8px}
.usr{display:flex;align-items:center;gap:9px;min-width:0}
.usr .av{width:34px;height:34px;border-radius:50%;background:var(--accent2);color:#0b3d1f;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.usr .un{font-size:12px;line-height:1.25;min-width:0}
.usr .un b{display:block;font-weight:700;white-space:nowrap}
.usr .un span{opacity:.8;white-space:nowrap}
/* nav */
.nav{background:#0f3f24;border-top:1px solid rgba(255,255,255,.08)}
.nav-in{max-width:1360px;margin:0 auto;padding:8px 12px;display:flex;gap:7px;flex-wrap:wrap;min-width:0}
.nav button{flex:none;white-space:nowrap;display:flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#d6f5e3;padding:8px 13px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.16s}
.nav button:hover{background:rgba(255,255,255,.14)}
.nav button.on{background:var(--accent2);color:#0b3d1f;border-color:var(--accent2);box-shadow:0 4px 12px rgba(74,222,128,.32)}
.nav button .mi{font-size:19px}
/* layout */
.wrap{max-width:1360px;margin:0 auto;padding:20px 18px 48px}
.scr-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px;min-width:0}
.scr-head .t{min-width:0}
.scr-head h2{margin:0;font-size:22px;font-weight:900;display:flex;align-items:center;gap:9px}
.scr-head h2 .mi{color:var(--accent);font-size:26px}
.scr-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.scr-head .sp{flex:1;min-width:8px}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);color:var(--accent-deep);font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px}
.pill .mi{font-size:16px}
/* grids */
.grid,.g2,.g3,.g4,.g23,.split{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.split{grid-template-columns:1.4fr 1fr}
.grid>*,.g2>*,.g3>*,.g4>*,.g23>*,.split>*{min-width:0}
@media(max-width:820px){.g4,.g3,.g2,.g23,.split{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px;min-width:0}
.card h3{margin:0 0 12px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:7px}
.card h3 .mi{color:var(--accent);font-size:19px}
.card .sub{color:var(--muted);font-size:12px;font-weight:500;margin-left:auto}
/* kpi */
.kpi{position:relative;overflow:hidden}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .lab .mi{font-size:18px;color:var(--accent)}
.kpi .val{font-size:29px;font-weight:900;margin-top:7px;letter-spacing:-.5px}
.kpi .val small{font-size:14px;font-weight:700;color:var(--muted);margin-left:3px}
.kpi .dt{margin-top:6px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.kpi .dt.up{color:var(--accent)}.kpi .dt.down{color:var(--danger)}.kpi .dt.warn{color:var(--warn)}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:74px;height:74px;border-radius:50%;background:var(--accent-soft);opacity:.7}
.kpi .lab,.kpi .val,.kpi .dt{position:relative;z-index:1}
.chart-box{position:relative;width:100%}
canvas{max-width:100%}
/* table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th{text-align:left;font-size:11px;letter-spacing:.4px;color:var(--muted);font-weight:700;text-transform:uppercase;padding:9px 11px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:10px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#f6faf7}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.tag .mi{font-size:14px}
.t-green{background:var(--accent-soft);color:var(--accent-deep)}
.t-amber{background:#fef3c7;color:#92400e}
.t-red{background:#fee2e2;color:#991b1b}
.t-blue{background:#e0f2fe;color:#075985}
.t-grey{background:#eef2f0;color:#556}
.bar{height:7px;border-radius:99px;background:#eef2f0;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.mono{font-variant-numeric:tabular-nums}
/* chat */
.chat{display:flex;flex-direction:column;gap:13px}
.msg{max-width:88%;padding:11px 14px;border-radius:14px;font-size:13.5px;line-height:1.55}
.msg.u{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:#f4f8f5;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.a .who{font-size:11px;font-weight:800;color:var(--accent-deep);display:flex;align-items:center;gap:5px;margin-bottom:6px}
.cite{margin-top:9px;display:flex;flex-direction:column;gap:6px}
.cite a{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:11.5px;color:var(--ink);text-decoration:none}
.cite a .mi{color:var(--accent);font-size:16px;flex:none}
.cite a .rel{margin-left:auto;font-weight:800;color:var(--accent);font-size:11px;flex:none}
.qa-side .qi{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.qa-side .qi:last-child{border-bottom:none}
.qa-side .qi .mi{color:var(--accent);font-size:18px;flex:none}
.qa-side .qi b{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.ask-bar{display:flex;gap:8px;margin-top:12px}
.ask-bar input{flex:1;min-width:0;border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-family:inherit;font-size:13px;background:#f8fbf9}
.ask-bar button{flex:none;border:none;background:var(--accent);color:#fff;border-radius:11px;padding:0 16px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:5px}
/* knowledge graph */
.graph-wrap{overflow-x:auto}
.graph{position:relative;width:100%;min-width:560px;height:360px;background:radial-gradient(circle at 50% 45%,#f3faf5,#eef4f0);border-radius:14px;border:1px solid var(--line)}
.node{position:absolute;transform:translate(-50%,-50%);border-radius:12px;padding:8px 12px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:0 4px 12px rgba(20,83,45,.14);white-space:nowrap;z-index:2}
.node .mi{font-size:16px}
.node.center{background:var(--accent);color:#fff;font-size:14px;padding:12px 16px;box-shadow:0 6px 20px rgba(21,128,61,.4)}
.node.doc{background:#fff;border:1.5px solid var(--accent2);color:var(--accent-deep)}
.node.ent{background:var(--accent-soft);color:var(--accent-deep);border:1px solid var(--accent2)}
.edge{position:absolute;height:2px;background:linear-gradient(90deg,rgba(21,128,61,.5),rgba(74,222,128,.2));transform-origin:0 0;z-index:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
/* review list */
.rev{display:flex;align-items:flex-start;gap:12px;padding:13px;border:1px solid var(--line);border-radius:13px;margin-bottom:11px;background:#fff}
.rev:last-child{margin-bottom:0}
.rev .cf{flex:none;width:52px;text-align:center}
.rev .cf .n{font-size:20px;font-weight:900;line-height:1}
.rev .cf .l{font-size:10px;color:var(--muted);font-weight:700}
.rev .bd{flex:1;min-width:0}
.rev .bd .q{font-size:13.5px;font-weight:700;margin-bottom:4px}
.rev .bd .a{font-size:12.5px;color:var(--muted);line-height:1.5}
.rev .bd .mt{margin-top:8px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.rev .act{flex:none;display:flex;flex-direction:column;gap:6px}
.rev .act button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 11px;font-size:11.5px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap}
.rev .act button.ok{background:var(--accent);color:#fff;border-color:var(--accent)}
.rev .act button .mi{font-size:15px}
@media(max-width:560px){.rev{flex-wrap:wrap}.rev .act{flex-direction:row;width:100%}}
/* timeline / audit */
.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:0 0 16px 6px}
.tl .ev:last-child{padding-bottom:0}
.tl .ev::before{content:"";position:absolute;left:-20px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.tl .ev.warn::before{border-color:var(--warn)}
.tl .ev.red::before{border-color:var(--danger)}
.tl .ev .h{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tl .ev .h .tm{font-size:11px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.tl .ev .d{font-size:12px;color:var(--muted);margin-top:3px}
/* gap heat */
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;min-width:0}
.heat .cell{border-radius:10px;padding:11px;color:#fff;min-width:0}
.heat .cell .k{font-size:12px;font-weight:700;line-height:1.3}
.heat .cell .v{font-size:19px;font-weight:900;margin-top:4px}
.heat .cell .s{font-size:10px;opacity:.9}
.progress-row{display:flex;align-items:center;gap:10px;margin-bottom:11px;font-size:12.5px}
.progress-row:last-child{margin-bottom:0}
.progress-row .nm{width:120px;flex:none;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.progress-row .bar{flex:1;min-width:0}
.progress-row .pc{width:44px;flex:none;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
@media(max-width:560px){.progress-row .nm{width:88px}}
.foot{max-width:1360px;margin:0 auto;padding:16px 18px 34px;color:var(--muted);font-size:11.5px;text-align:center}
.foot b{color:var(--accent-deep)}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent2);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.55)}70%{box-shadow:0 0 0 9px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.stat-inline{display:flex;gap:18px;flex-wrap:wrap;margin-top:2px}
.stat-inline .si{font-size:12px;color:var(--muted)}
.stat-inline .si b{display:block;font-size:18px;color:var(--ink);font-weight:900}
@media(max-width:560px){.hide-sm{display:none!important}}
</style>
</head>
