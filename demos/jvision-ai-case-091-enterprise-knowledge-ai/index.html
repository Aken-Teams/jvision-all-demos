<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>企業知識問答腦｜Enterprise Knowledge AI</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#14B8A6;
  --color-on-secondary:#0F172A;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#99F6E4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#99F6E4;
  --soft:#CCFBF1;
  --warning:#B45309;
  --danger:#B91C1C;
  --info:#0369A1;
  --radius:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  background:var(--color-background);
  color:var(--ink);
  font-family:"Plus Jakarta Sans","Noto Sans TC",system-ui,sans-serif;
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,a{font:inherit}
button,a{cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.mi,.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  font-size:20px;
  line-height:1;
  vertical-align:middle;
}
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  background:var(--color-card);
  border-bottom:1px solid var(--line);
}
.topbar-in{
  max-width:1400px;
  min-height:72px;
  margin:auto;
  padding:12px 24px;
  display:flex;
  align-items:center;
  gap:16px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  width:42px;
  height:42px;
  flex:none;
  display:grid;
  place-items:center;
  border:2px solid var(--ink);
  border-radius:12px;
  background:var(--color-secondary);
  color:var(--color-on-secondary);
}
.logo .mi{font-size:25px}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.02em}
.brand p{
  margin:2px 0 0;
  color:var(--muted);
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.topbar-spacer{flex:1}
.usr{display:flex;align-items:center;gap:9px}
.av{
  width:36px;
  height:36px;
  flex:none;
  display:grid;
  place-items:center;
  border:1px solid var(--ink);
  border-radius:50%;
  background:var(--soft);
  font-weight:700;
}
.un{font-size:12px;line-height:1.35}
.un b{display:block}
.un span{color:var(--muted)}
.nav{
  background:var(--ink);
  border-top:1px solid var(--ink);
}
.nav-in{
  max-width:1400px;
  margin:auto;
  padding:8px 24px;
  display:flex;
  gap:6px;
  overflow-x:auto;
  scrollbar-width:thin;
}
.nav button{
  min-height:42px;
  padding:8px 13px;
  flex:none;
  display:flex;
  align-items:center;
  gap:7px;
  border:1px solid #5EEAD4;
  border-radius:10px;
  background:transparent;
  color:#F0FDFA;
  font-size:13px;
  font-weight:600;
  white-space:nowrap;
  transition:background-color .18s ease,color .18s ease,border-color .18s ease;
}
.nav button:hover{background:#115E59}
.nav button.on{
  background:var(--color-secondary);
  border-color:var(--color-secondary);
  color:var(--color-on-secondary);
}
.nav button:focus-visible{outline-color:#FFF7ED}
.wrap{max-width:1400px;margin:auto;padding:26px 24px 52px}
.scr-head{
  margin-bottom:20px;
  padding-bottom:16px;
  display:flex;
  align-items:flex-end;
  gap:16px;
  border-bottom:2px solid var(--ink);
}
.scr-head .t{min-width:0}
.scr-head h2{
  margin:0;
  display:flex;
  align-items:center;
  gap:9px;
  font-size:clamp(21px,2vw,28px);
  line-height:1.2;
  letter-spacing:-.035em;
}
.scr-head h2 .mi{color:var(--color-primary);font-size:28px}
.scr-head p{margin:6px 0 0;color:var(--muted);font-size:13px}
.scr-head .sp{flex:1}
.pill{
  min-height:32px;
  padding:6px 10px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:1px solid var(--color-primary);
  border-radius:999px;
  background:var(--soft);
  color:#115E59;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
}
.pill .mi{font-size:16px}
.live{
  width:8px;
  height:8px;
  display:inline-block;
  border:2px solid var(--ink);
  border-radius:50%;
  background:var(--color-secondary);
  animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{50%{opacity:.35}}
.grid,.g2,.g3,.g4,.g23,.split{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.split{grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr)}
.grid>*,.g2>*,.g3>*,.g4>*,.g23>*,.split>*{min-width:0}
.card{
  min-width:0;
  padding:17px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:var(--color-card);
  color:var(--color-card-foreground);
}
.card h3{
  margin:0 0 13px;
  display:flex;
  align-items:center;
  gap:7px;
  font-size:15px;
  line-height:1.35;
}
.card h3 .mi{color:var(--color-primary);font-size:19px}
.card .sub{margin-left:auto;color:var(--muted);font-size:11px;font-weight:500}
.kpi{
  position:relative;
  overflow:hidden;
  border-top:4px solid var(--color-primary);
}
.kpi::after{
  content:"";
  position:absolute;
  top:14px;
  right:14px;
  width:30px;
  height:30px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--soft);
}
.kpi .lab{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--muted);
  font-size:12px;
  font-weight:600;
}
.kpi .lab .mi{color:var(--color-primary);font-size:18px}
.kpi .val{
  position:relative;
  z-index:1;
  margin-top:8px;
  color:#0F3D3A;
  font-size:29px;
  font-weight:700;
  letter-spacing:-.045em;
  font-variant-numeric:tabular-nums;
}
.kpi .val small{margin-left:4px;color:var(--muted);font-size:13px;font-weight:600}
.kpi .dt{
  position:relative;
  z-index:1;
  margin-top:6px;
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-size:11px;
  font-weight:700;
}
.kpi .dt.up{color:#047857}
.kpi .dt.down{color:var(--danger)}
.kpi .dt.warn{color:var(--warning)}
.chart-box{position:relative;width:100%}
canvas{max-width:100%}
.tbl-wrap{overflow-x:auto}
table{
  width:100%;
  min-width:540px;
  border-collapse:collapse;
  font-size:13px;
}
th{
  padding:10px 11px;
  border-top:1px solid var(--line);
  border-bottom:2px solid var(--ink);
  background:var(--soft);
  color:#334155;
  text-align:left;
  font-size:11px;
  font-weight:700;
  letter-spacing:.04em;
  white-space:nowrap;
}
td{
  padding:11px;
  border-bottom:1px solid var(--line);
  vertical-align:middle;
}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#F0FDFA}
tbody tr:last-child td{border-bottom:0}
td:nth-child(n+2){font-variant-numeric:tabular-nums}
.tag{
  min-height:26px;
  padding:4px 9px;
  display:inline-flex;
  align-items:center;
  gap:4px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  line-height:1;
  white-space:nowrap;
}
.tag .mi{font-size:14px}
.t-green{background:#D1FAE5;color:#065F46}
.t-amber{background:#FEF3C7;color:#78350F}
.t-red{background:#FEE2E2;color:#991B1B}
.t-blue{background:#E0F2FE;color:#075985}
.t-grey{background:#F1F5F9;color:#334155}
.bar{
  height:8px;
  overflow:hidden;
  border:1px solid #CBD5E1;
  border-radius:99px;
  background:#F1F5F9;
}
.bar>i{
  height:100%;
  display:block;
  border-radius:99px;
  background:var(--color-primary);
}
.mono,.tm{
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-variant-numeric:tabular-nums;
}
.chat{display:flex;flex-direction:column;gap:13px}
.msg{
  max-width:88%;
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:14px;
  font-size:13.5px;
}
.msg.u{
  align-self:flex-end;
  border-color:var(--ink);
  border-bottom-right-radius:3px;
  background:var(--color-primary);
  color:#001F1D;
  font-weight:600;
}
.msg.a{align-self:flex-start;border-bottom-left-radius:3px;background:#F8FAFC}
.msg.a .who{
  margin-bottom:6px;
  display:flex;
  align-items:center;
  gap:5px;
  color:#115E59;
  font-size:11px;
  font-weight:700;
}
.cite{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.cite a{
  min-height:40px;
  padding:7px 10px;
  display:flex;
  align-items:center;
  gap:8px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#FFF;
  color:var(--ink);
  font-size:11.5px;
  text-decoration:none;
  transition:background-color .18s ease,border-color .18s ease;
}
.cite a:hover{border-color:var(--color-primary);background:var(--soft)}
.cite a .mi{flex:none;color:var(--color-primary);font-size:16px}
.cite a .rel{margin-left:auto;color:#0F766E;font-weight:700}
.qa-side .qi{
  min-height:43px;
  padding:9px 0;
  display:flex;
  align-items:center;
  gap:9px;
  border-bottom:1px solid var(--line);
  font-size:12.5px;
}
.qa-side .qi:last-child{border-bottom:0}
.qa-side .qi .mi{flex:none;color:var(--color-accent);font-size:18px}
.qa-side .qi b{
  margin-left:auto;
  color:var(--muted);
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
}
.ask-bar{margin-top:13px;display:flex;gap:8px}
.ask-bar input{
  min-width:0;
  min-height:44px;
  flex:1;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#FFF;
  color:var(--ink);
}
.ask-bar button{
  min-height:44px;
  padding:0 17px;
  display:flex;
  align-items:center;
  gap:5px;
  border:2px solid #7C2D12;
  border-radius:10px;
  background:var(--color-accent);
  color:#1C0A00;
  font-weight:700;
  transition:background-color .18s ease,opacity .18s ease;
}
.ask-bar button:hover{background:#C2410C;color:#FFF}
.graph-wrap{overflow-x:auto}
.graph{
  position:relative;
  width:100%;
  min-width:560px;
  height:360px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#F0FDFA;
}
.node{
  position:absolute;
  z-index:2;
  padding:8px 11px;
  display:flex;
  align-items:center;
  gap:6px;
  transform:translate(-50%,-50%);
  border-radius:9px;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
}
.node .mi{font-size:16px}
.node.center{
  padding:12px 15px;
  border:2px solid var(--ink);
  background:var(--color-primary);
  color:#001F1D;
  font-size:14px;
}
.node.doc{border:2px solid var(--color-primary);background:#FFF;color:#115E59}
.node.ent{border:1px solid var(--color-primary);background:var(--soft);color:#115E59}
.edge{
  position:absolute;
  z-index:1;
  height:2px;
  background:var(--color-primary);
  opacity:.46;
  transform-origin:0 0;
}
.legend{margin-top:12px;display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;display:inline-block;border-radius:3px}
.rev{
  margin-bottom:10px;
  padding:13px;
  display:flex;
  align-items:flex-start;
  gap:12px;
  border:1px solid var(--line);
  border-left:4px solid var(--color-accent);
  border-radius:11px;
  background:#FFF;
}
.rev:last-child{margin-bottom:0}
.rev .cf{width:54px;flex:none;text-align:center}
.rev .cf .n{
  font-size:20px;
  font-weight:700;
  line-height:1;
  font-variant-numeric:tabular-nums;
}
.rev .cf .l{margin-top:4px;color:var(--muted);font-size:10px;font-weight:700}
.rev .bd{min-width:0;flex:1}
.rev .bd .q{margin-bottom:4px;font-size:13.5px;font-weight:700}
.rev .bd .a{color:var(--muted);font-size:12.5px}
.rev .bd .mt{margin-top:8px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.rev .act{flex:none;display:flex;flex-direction:column;gap:6px}
.rev .act button{
  min-height:34px;
  padding:6px 10px;
  display:flex;
  align-items:center;
  gap:4px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#FFF;
  color:var(--ink);
  font-size:11.5px;
  font-weight:700;
  white-space:nowrap;
  transition:background-color .18s ease,border-color .18s ease;
}
.rev .act button:hover{border-color:var(--color-primary);background:var(--soft)}
.rev .act button.ok{border-color:var(--ink);background:var(--color-primary);color:#001F1D}
.rev .act button .mi{font-size:15px}
.tl{position:relative;padding-left:25px}
.tl::before{
  content:"";
  position:absolute;
  top:4px;
  bottom:4px;
  left:8px;
  width:2px;
  background:var(--line);
}
.tl .ev{position:relative;padding:0 0 17px 7px}
.tl .ev:last-child{padding-bottom:0}
.tl .ev::before{
  content:"✓";
  position:absolute;
  top:1px;
  left:-23px;
  width:16px;
  height:16px;
  display:grid;
  place-items:center;
  border:2px solid var(--color-primary);
  border-radius:50%;
  background:#FFF;
  color:#115E59;
  font-size:9px;
  font-weight:700;
}
.tl .ev.warn::before{content:"!";border-color:var(--warning);color:var(--warning)}
.tl .ev.red::before{content:"×";border-color:var(--danger);color:var(--danger)}
.tl .ev .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:700}
.tl .ev .h .tm{color:var(--muted);font-size:11px;font-weight:600}
.tl .ev .d{margin-top:3px;color:var(--muted);font-size:12px}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.heat .cell{
  min-width:0;
  min-height:100px;
  padding:11px;
  border:2px solid rgba(0,0,0,.35);
  border-radius:10px;
  color:#FFF;
}
.heat .cell .k{font-size:12px;font-weight:700}
.heat .cell .v{
  margin-top:4px;
  font-size:20px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.heat .cell .s{font-size:10px}
.progress-row{margin-bottom:11px;display:flex;align-items:center;gap:10px;font-size:12.5px}
.progress-row:last-child{margin-bottom:0}
.progress-row .nm{
  width:120px;
  flex:none;
  overflow:hidden;
  font-weight:600;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.progress-row .bar{min-width:0;flex:1}
.progress-row .pc{
  width:46px;
  flex:none;
  color:#334155;
  text-align:right;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-weight:700;
}
.stat-inline{margin-top:2px;display:flex;gap:18px;flex-wrap:wrap}
.stat-inline .si{color:var(--muted);font-size:12px}
.stat-inline .si b{
  display:block;
  color:var(--ink);
  font-size:18px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.foot{
  max-width:1400px;
  margin:auto;
  padding:18px 24px 34px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:11.5px;
  text-align:center;
}
.foot b{color:#115E59}
#app>.g4,#app>.g23,#app>.split,#app>.card{
  animation:enter .42s cubic-bezier(.2,.8,.2,1) both;
}
#app>.g4{animation-delay:.04s}
#app>.g23,#app>.split{animation-delay:.08s}
@keyframes enter{
  from{opacity:0;transform:translateY(12px) scale(.985)}
  to{opacity:1;transform:none}
}
@media(max-width:1024px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.split{grid-template-columns:1fr}
}
@media(max-width:768px){
  .topbar-in,.nav-in,.wrap,.foot{padding-left:16px;padding-right:16px}
  .topbar-in{min-height:64px}
  .scr-head{align-items:flex-start;flex-direction:column}
  .scr-head .sp{display:none}
  .g2,.g3{grid-template-columns:1fr}
  .msg{max-width:96%}
}
@media(max-width:560px){
  .hide-sm{display:none!important}
  .g4{grid-template-columns:1fr}
  .wrap{padding-top:18px}
  .card{padding:14px}
  .rev{flex-wrap:wrap}
  .rev .act{width:100%;flex-direction:row;flex-wrap:wrap}
  .ask-bar{align-items:stretch;flex-direction:column}
  .ask-bar button{justify-content:center}
  .progress-row .nm{width:88px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo"><span class="mi" aria-hidden="true">psychology</span></div>
      <div style="min-width:0">
        <h1>企業知識問答腦</h1>
        <p>Enterprise Knowledge AI ｜ RAG 知識檢索平台</p>
      </div>
    </div>
    <div class="topbar-spacer"></div>
    <div class="usr">
      <span class="pill hide-sm"><span class="live" aria-hidden="true"></span>索引即時同步</span>
      <div class="av">林</div>
      <div class="un"><b>林知微</b><span>知識管理員</span></div>
    </div>
  </div>
  <nav class="nav" aria-label="主要功能"><div class="nav-in" id="nav"></div></nav>
</header>
<main class="wrap" id="app"></main>
<footer class="foot">企業知識問答腦　·　純 UI 展示（無後端），資料皆為擬真示範　·　單一網域 <b>/demos/jvision-ai-case-091-enterprise-knowledge-ai/</b></footer>
<script>
"use strict";
var C={accent:"#0D9488",accent2:"#14B8A6",soft:"#CCFBF1",warn:"#B45309",danger:"#B91C1C",info:"#0369A1",muted:"#475569",line:"#99F6E4"};
var NAV=[
  {icon:"upload_file",name:"知識匯入"},
  {icon:"quiz",name:"智慧問答"},
  {icon:"hub",name:"知識圖譜"},
  {icon:"rate_review",name:"答案審核"},
  {icon:"troubleshoot",name:"知識缺口"},
  {icon:"verified_user",name:"權限稽核"}
];

var SCREENS=[S0,S1,S2,S3,S4,S5];
var DRAW=[drawS0,null,null,drawS3,drawS4,null];
function show(i){
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  destroyChart();
  var app=document.getElementById("app");
  app.innerHTML=SCREENS[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    var active=+btns[b].getAttribute("data-i")===i;
    btns[b].classList.toggle("on",active);
    btns[b].setAttribute("aria-current",active?"page":"false")
  }
  void app.offsetHeight;
  if(DRAW[i])DRAW[i]()
}
(function(){
  var nav=document.getElementById("nav");
  nav.innerHTML=NAV.map(function(n,i){
    return '<button type="button" data-i="'+i+'" onclick="location.hash=\'v'+i+'\'"><span class="mi" aria-hidden="true">'+n.icon+'</span><span class="lbl hide-sm">'+esc(n.name)+'</span></button>'
  }).join("")
})();
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return}
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
