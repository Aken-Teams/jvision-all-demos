<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>身分與存取管理系統（IAM）· 控制台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --bg:#0b0e1a;--panel:#141a2e;--panel2:#1b2340;--line:#2a3355;
  --ink:#e8ecf7;--mut:#93a0c4;--dim:#6b779e;
  --acc:#4f46e5;--acc2:#818cf8;--acc3:#c7d2fe;
  --ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--info:#38bdf8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Inter","Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:14px;min-height:100vh}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
h1,h2,h3,h4{margin:0}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:#2a3355;border-radius:8px}

.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(90deg,#0e1224,#141a2e);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;color:#fff;flex:none;box-shadow:0 0 18px rgba(79,70,229,.5)}
.logo .ms{font-size:22px}
.brand .t1{font-weight:800;font-size:15px;letter-spacing:.3px;white-space:nowrap}
.brand .t2{font-size:11px;color:var(--dim);white-space:nowrap}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:6px;min-width:0}
.nav button{display:flex;align-items:center;gap:6px;background:transparent;color:var(--mut);border:1px solid transparent;padding:8px 12px;border-radius:9px;font-size:13px;font-weight:600;white-space:nowrap;flex:none;transition:.15s}
.nav button .ms{font-size:18px}
.nav button:hover{color:var(--ink);background:var(--panel2)}
.nav button.on{color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:var(--acc2);box-shadow:0 4px 14px rgba(79,70,229,.35)}
.spacer{flex:1;min-width:0}
.tools{display:flex;align-items:center;gap:12px;min-width:0}
.livedot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.chip{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);background:var(--panel2);border:1px solid var(--line);padding:5px 10px;border-radius:20px;white-space:nowrap}
.who{display:flex;align-items:center;gap:8px;white-space:nowrap}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#a78bfa);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex:none}

.wrap{padding:18px;max-width:1400px;margin:0 auto}
.scr-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.scr-head h2{font-size:19px;font-weight:800;display:flex;align-items:center;gap:9px}
.scr-head h2 .ms{color:var(--acc2);font-size:24px}
.scr-head .sub{font-size:12.5px;color:var(--dim);margin-top:4px}
.seg{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
.seg span{padding:6px 12px;border-radius:7px;font-size:12px;color:var(--mut);font-weight:600}
.seg span.on{background:var(--acc);color:#fff}

.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g-2-1{grid-template-columns:2fr 1fr}
.g-1-2{grid-template-columns:1fr 2fr}
.g-3-2{grid-template-columns:3fr 2fr}
@media(max-width:820px){
  .g-kpi{grid-template-columns:1fr 1fr}
  .g2,.g3,.g-2-1,.g-1-2,.g-3-2{grid-template-columns:1fr}
}
.grid>*{min-width:0}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px}
.card-h h3 .ms{font-size:18px;color:var(--acc2)}
.card-h .mini{font-size:11.5px;color:var(--dim)}

.kpi{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:15px;position:relative;overflow:hidden;min-width:0}
.kpi .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.kpi .ic .ms{font-size:21px}
.kpi .lab{font-size:12px;color:var(--mut);font-weight:600}
.kpi .val{font-size:27px;font-weight:800;margin-top:2px;letter-spacing:.5px}
.kpi .val small{font-size:13px;color:var(--dim);font-weight:600;margin-left:3px}
.kpi .delta{font-size:11.5px;margin-top:6px;display:flex;align-items:center;gap:4px;font-weight:600}
.kpi .delta .ms{font-size:15px}
.up{color:var(--ok)}.down{color:var(--bad)}
.kb-a{background:rgba(79,70,229,.16);color:var(--acc2)}
.kb-g{background:rgba(34,197,94,.15);color:var(--ok)}
.kb-w{background:rgba(245,158,11,.15);color:var(--warn)}
.kb-r{background:rgba(239,68,68,.15);color:var(--bad)}
.kb-b{background:rgba(56,189,248,.15);color:var(--info)}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--dim);font-weight:600;font-size:11.5px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.4px}
td{padding:10px 12px;border-bottom:1px solid rgba(42,51,85,.55);color:var(--ink);white-space:nowrap}
tbody tr:hover{background:var(--panel2)}
tbody tr:last-child td{border-bottom:none}
.ovx{overflow-x:auto}

.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600}
.badge .ms{font-size:14px}
.b-ok{background:rgba(34,197,94,.14);color:#4ade80}
.b-warn{background:rgba(245,158,11,.14);color:#fbbf24}
.b-bad{background:rgba(239,68,68,.14);color:#f87171}
.b-info{background:rgba(56,189,248,.14);color:#38bdf8}
.b-acc{background:rgba(129,140,248,.16);color:var(--acc2)}

.mono{font-family:"Inter",monospace;font-variant-numeric:tabular-nums;letter-spacing:.3px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}

.uav{display:inline-flex;align-items:center;gap:9px}
.uav .a{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.uav .nm{font-weight:600}
.uav .em{font-size:11px;color:var(--dim)}

.bar{height:7px;border-radius:6px;background:var(--panel2);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.bar.g>i{background:linear-gradient(90deg,#16a34a,#4ade80)}

.chartbox{width:100%;overflow:hidden}

.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 16px 14px}
.tl-item:last-child{padding-bottom:0}
.tl-item .node{position:absolute;left:-19px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--panel);border:2px solid var(--acc2)}
.tl-item .node.ok{border-color:var(--ok);background:rgba(34,197,94,.2)}
.tl-item .node.bad{border-color:var(--bad);background:rgba(239,68,68,.2)}
.tl-item .tm{font-size:11px;color:var(--dim);font-family:monospace}
.tl-item .tt{font-weight:600;font-size:13px;margin-top:2px}
.tl-item .td2{font-size:12px;color:var(--mut);margin-top:2px}

.pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:820px){.pipe{grid-template-columns:1fr 1fr}}
.pcol{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.pcol-h{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:9px;padding:0 2px}
.pcol-h .n{background:var(--panel);color:var(--acc2);border-radius:20px;padding:1px 8px;font-size:11px}
.pcard{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc2);border-radius:9px;padding:9px 10px;margin-bottom:8px}
.pcard:last-child{margin-bottom:0}
.pcard.j{border-left-color:var(--info)}
.pcard.m{border-left-color:var(--warn)}
.pcard.l{border-left-color:var(--bad)}
.pcard .pn{font-weight:600;font-size:12.5px}
.pcard .pmeta{font-size:11px;color:var(--dim);margin-top:3px;display:flex;justify-content:space-between;gap:6px}

.matrix{border-collapse:separate;border-spacing:3px}
.matrix th{padding:6px;text-align:center;font-size:10.5px}
.matrix td{padding:0;text-align:center;border:none}
.mcell{width:34px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.m-self{background:var(--panel2);color:var(--dim)}
.m-ok{background:rgba(34,197,94,.14);color:#4ade80}
.m-conf{background:rgba(239,68,68,.18);color:#f87171}
.m-warn{background:rgba(245,158,11,.16);color:#fbbf24}
.rn{color:var(--mut);font-size:11.5px;font-weight:600;text-align:right;padding-right:8px;white-space:nowrap}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:820px){.tiles{grid-template-columns:1fr 1fr}}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px;min-width:0}
.tile .th{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.tile .ti{width:34px;height:34px;border-radius:9px;background:var(--panel);display:flex;align-items:center;justify-content:center;flex:none}
.tile .ti .ms{font-size:19px;color:var(--acc2)}
.tile .tn{font-weight:700;font-size:13px}
.tile .ts{font-size:11px;color:var(--dim)}
.tile .row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin-top:6px;gap:6px}
.tile .row b{color:var(--ink);font-weight:600}

.statline{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.statline b{color:var(--ink);font-size:15px;font-weight:800}

.certrow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid rgba(42,51,85,.55);min-width:640px}
.certrow:last-child{border-bottom:none}
.certrow:hover{background:var(--panel2)}
.actbtn{background:var(--panel2);border:1px solid var(--line);color:var(--mut);border-radius:7px;padding:5px 9px;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.actbtn .ms{font-size:15px}
.actbtn.rev{color:#4ade80;border-color:rgba(34,197,94,.35)}
.actbtn.rmv{color:#f87171;border-color:rgba(239,68,68,.35)}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:5px}

.filterbar{display:flex;gap:8px;flex-wrap:wrap}
.fbtn{background:var(--panel2);border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.fbtn.on{background:var(--acc);color:#fff;border-color:var(--acc2)}
.fbtn .ms{font-size:15px}

.riskring{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ringtxt .big{font-size:30px;font-weight:800}
.ringtxt .sm{font-size:11.5px;color:var(--dim)}

.note{font-size:11.5px;color:var(--dim);margin-top:10px;display:flex;align-items:center;gap:6px}
.note .ms{font-size:15px;color:var(--acc2)}

@media(max-width:560px){
  .nav button .txt{display:none}
  .nav button{padding:8px 10px}
  .chip.hide-sm{display:none}
  .brand .t2{display:none}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <div class="logo"><span class="ms">shield_person</span></div>
    <div>
      <div class="t1">IAM 身分存取控制台</div>
      <div class="t2">Identity &amp; Access Management</div>
    </div>
  </div>
  <div class="nav" id="nav"></div>
  <div class="spacer"></div>
  <div class="tools">
    <div class="chip hide-sm"><span class="livedot"></span>即時同步</div>
    <div class="chip hide-sm"><span class="ms" style="font-size:15px">dns</span>SIEM · PAM 已連線</div>
    <div class="who"><div class="av">陳</div></div>
  </div>
</div>

<div class="wrap"><div id="view"></div></div>

<script>
"use strict";
var view=document.getElementById("view");
var chartRegistry=[];
function destroyCharts(){for(var i=0;i<chartRegistry.length;i++){try{chartRegistry[i].destroy();}catch(e){}}chartRegistry=[];}
function getEl(id){return document.getElementById(id);}
function mk(id,opts){var el=getEl(id);if(!el)return;try{if(opts&&opts.type&&opts.chart&&!opts.chart.type){opts.chart.type=opts.type;}var c=new ApexCharts(el,opts);c.render();chartRegistry.push(c);}catch(e){}}

var AXIS="#93a0c4", GRID="#2a3355", ACC="#4f46e5", ACC2="#818cf8";
function baseChart(h){return{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},height:h,foreColor:AXIS,fontFamily:"Inter, Noto Sans TC, sans-serif"};}

var SCREENS=[
  {icon:"dashboard",label:"總覽儀表板",fn:screen0,draw:null},
  {icon:"account_tree",label:"帳號生命週期",fn:screen1,draw:null},
  {icon:"rule",label:"角色權限治理",fn:screen2,draw:null},
  {icon:"verified",label:"SSO 與 MFA",fn:screen3,draw:null},
  {icon:"fact_check",label:"權限審查",fn:screen4,draw:null},
  {icon:"history",label:"存取日誌稽核",fn:screen5,draw:null}
];

(function(){
  var nav=document.getElementById("nav"),html="";
  for(var i=0;i<SCREENS.length;i++){
    html+='<button data-i="'+i+'" onclick="show('+i+')"><span class="ms">'+SCREENS[i].icon+'</span><span class="txt">'+SCREENS[i].label+'</span></button>';
  }
  nav.innerHTML=html;
})();

function setActive(i){
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i);}
}

function show(i){
  destroyCharts();
  setActive(i);
  view.innerHTML=SCREENS[i].fn();
  void view.offsetHeight;
  if(SCREENS[i].draw)SCREENS[i].draw();
}

function bar(pct,cls){return '<div class="bar '+(cls||'')+'"><i style="width:'+pct+'%"></i></div>';}

/* ============ SCREEN 0 : Dashboard ============ */
function screen0(){
  var kpis=[
    {ic:"badge",kb:"kb-a",lab:"總帳號數",val:"3,842",u:"個",d:"+64 本月",cls:"up",di:"trending_up"},
    {ic:"verified_user",kb:"kb-g",lab:"MFA 導入率",val:"94.2",u:"%",d:"+6.1%",cls:"up",di:"trending_up"},
    {ic:"person_off",kb:"kb-r",lab:"待回收離職帳號",val:"7",u:"個",d:"平均 3.2 小時",cls:"down",di:"schedule"},
    {ic:"fact_check",kb:"kb-w",lab:"逾期權限審查",val:"12",u:"項",d:"本季 -18",cls:"up",di:"trending_down"}
  ];
  var k="";
  for(var i=0;i<kpis.length;i++){var x=kpis[i];
    k+='<div class="kpi"><div class="ic '+x.kb+'"><span class="ms">'+x.ic+'</span></div>'
      +'<div class="lab">'+x.lab+'</div><div class="val">'+x.val+'<small>'+x.u+'</small></div>'
      +'<div class="delta '+x.cls+'"><span class="ms">'+x.di+'</span>'+x.d+'</div></div>';
  }
  var alerts=[
    {ic:"warning",b:"b-bad",t:"高權限帳號異地登入",d:"admin.sys 由越南 IP 登入，已自動要求 MFA 再驗證",tm:"08:42"},
    {ic:"person_off",b:"b-warn",t:"離職帳號尚未停用",d:"李國偉（研發部）離職單已核，帳號待回收 2.4 小時",tm:"08:15"},
    {ic:"rule",b:"b-info",t:"職責分工衝突偵測",d:"王雅琪同時具「請購核准」與「付款執行」角色",tm:"07:50"},
    {ic:"vpn_key",b:"b-acc",t:"特權密碼將到期",d:"3 組 PAM 特權帳密將於 48 小時內輪替",tm:"07:20"}
  ];
  var a="";
  for(var j=0;j<alerts.length;j++){var y=alerts[j];
    a+='<div style="display:flex;gap:11px;padding:11px 0;border-bottom:1px solid rgba(42,51,85,.55)">'
      +'<span class="badge '+y.b+'" style="height:24px"><span class="ms">'+y.ic+'</span></span>'
      +'<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13px">'+y.t+'</div>'
      +'<div style="font-size:12px;color:var(--mut);margin-top:2px">'+y.d+'</div></div>'
      +'<div style="font-size:11px;color:var(--dim);font-family:monospace">'+y.tm+'</div></div>';
  }
  return ''
  +'<div class="scr-head"><div><h2><span class="ms">dashboard</span>身分總覽儀表板</h2>'
  +'<div class="sub">全公司帳號、驗證與存取風險即時態勢 · 資料截至 08:45</div></div>'
  +'<div class="seg"><span class="on">今日</span><span>本週</span><span>本月</span></div></div>'
  +'<div class="grid g-kpi">'+k+'</div>'
  +'<div class="grid g-2-1" style="margin-top:14px">'
    +'<div class="card"><div class="card-h"><h3><span class="ms">monitoring</span>登入趨勢與 MFA 挑戰</h3><div class="mini">近 12 小時</div></div><div class="chartbox" id="c0_area"></div></div>'
    +'<div class="card"><div class="card-h"><h3><span class="ms">donut_small</span>存取風險分佈</h3></div>'
      +'<div class="riskring"><div class="chartbox" id="c0_risk" style="width:150px;flex:none"></div>'
      +'<div class="ringtxt"><div class="big" style="color:var(--warn)">中度</div><div class="sm">綜合風險評分 62 / 100</div>'
      +'<div class="legend" style="margin-top:10px;flex-direction:column;gap:6px">'
      +'<span><i class="dot" style="background:#22c55e"></i>低風險 71%</span>'
      +'<span><i class="dot" style="background:#f59e0b"></i>中風險 22%</span>'
      +'<span><i class="dot" style="background:#ef4444"></i>高風險 7%</span></div></div></div></div>'
  +'</div>'
  +'<div class="grid g-1-2" style="margin-top:14px">'
    +'<div class="card"><div class="card-h"><h3><span class="ms">notifications_active</span>即時風險告警</h3><span class="badge b-bad">4 待處理</span></div>'+a+'</div>'
    +'<div class="card"><div class="card-h"><h3><span class="ms">groups</span>各部門帳號與 MFA 覆蓋</h3><div class="mini">前 6 大部門</div></div><div class="chartbox" id="c0_dept"></div></div>'
  +'</div>';
}
function draw0(){
  mk("c0_area",{chart:baseChart(260),series:[
      {name:"登入次數",data:[120,98,140,210,320,410,380,290,240,260,300,270]},
      {name:"MFA 挑戰",data:[80,70,96,150,230,290,270,200,160,180,210,190]}
    ],
