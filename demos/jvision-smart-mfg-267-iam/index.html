<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>身分與存取管理系統（IAM）· 控制台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Josefin+Sans:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#00FF41;
  --color-on-primary:#0F172A;
  --color-secondary:#0D0D0D;
  --color-on-secondary:#FFFFFF;
  --color-accent:#FF3333;
  --color-on-accent:#000000;
  --color-background:#000000;
  --color-foreground:#E0E0E0;
  --color-card:#0C130E;
  --color-card-foreground:#E0E0E0;
  --color-muted:#181818;
  --color-muted-foreground:#A8B3C4;
  --color-border:#353535;
  --color-destructive:#EF4444;
  --color-on-destructive:#000000;
  --color-ring:#00FF41;
  --blue:#00FF41;
  --ink:#E0E0E0;
  --muted:#A8B3C4;
  --line:#353535;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --panel2:var(--color-muted);
  --mut:var(--color-muted-foreground);
  --dim:#9AA8BB;
  --acc:var(--color-primary);
  --acc2:#79FF9B;
  --acc3:#C5FFD4;
  --ok:#00FF41;
  --warn:#FFD43B;
  --bad:#FF5C5C;
  --info:#56D7FF;
}
*{box-sizing:border-box}
html{color-scheme:dark;scrollbar-color:var(--color-primary) var(--color-muted)}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  overflow-x:hidden;
  background-color:var(--bg);
  background-image:linear-gradient(rgba(0,255,65,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,65,.045) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Josefin Sans","Noto Sans TC",system-ui,sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--color-primary);color:var(--color-on-primary)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--color-muted)}
::-webkit-scrollbar-thumb{background:var(--color-primary);border:2px solid #000;border-radius:0}
h1,h2,h3,h4{margin:0;font-family:"Cinzel","Noto Sans TC",serif;line-height:1.2}
button{font:inherit;cursor:pointer}
button,[onclick],.fbtn,.actbtn,.seg span{cursor:pointer}
button:focus-visible,[onclick]:focus-visible,.fbtn:focus-visible,.actbtn:focus-visible,.seg span:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.mono,.tm,td.mono{
  font-family:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  font-variant-numeric:tabular-nums lining-nums;
  letter-spacing:.02em;
}

.topbar{
  position:sticky;
  inset:0 0 auto;
  z-index:30;
  display:flex;
  align-items:center;
  gap:16px;
  min-height:68px;
  padding:10px 18px;
  background:#050805;
  border-bottom:3px solid var(--color-primary);
  box-shadow:0 6px 0 rgba(0,255,65,.12);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{
  width:42px;height:42px;flex:none;
  display:grid;place-items:center;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border:2px solid var(--color-primary);
  border-radius:0;
  box-shadow:5px 5px 0 #174723;
}
.logo .ms{font-size:26px}
.brand .t1{font-family:"Cinzel","Noto Sans TC",serif;font-size:15px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.brand .t2{font-family:ui-monospace,monospace;font-size:10px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.nav{display:flex;gap:0;flex-wrap:wrap;min-width:0;margin-left:8px;border:1px solid var(--line)}
.nav button{
  min-height:42px;
  display:flex;align-items:center;gap:7px;
  padding:8px 11px;
  color:var(--muted);
  background:#070907;
  border:0;border-right:1px solid var(--line);border-radius:0;
  font-size:12px;font-weight:700;white-space:nowrap;
  transition:background-color .18s,color .18s,box-shadow .18s;
}
.nav button:last-child{border-right:0}
.nav button .ms{font-size:18px}
.nav button:hover{color:#fff;background:#1B231D;box-shadow:inset 0 -3px var(--color-primary)}
.nav button.on{color:var(--color-on-primary);background:var(--color-primary);box-shadow:none}
.spacer{flex:1;min-width:0}
.tools{display:flex;align-items:center;gap:8px;min-width:0}
.chip{
  min-height:34px;display:flex;align-items:center;gap:7px;
  padding:5px 9px;
  color:#CFD8E6;background:#090D0A;
  border:1px solid var(--line);border-radius:0;
  font-family:ui-monospace,monospace;font-size:10px;font-weight:700;white-space:nowrap;text-transform:uppercase;
}
.livedot{width:9px;height:9px;display:inline-block;flex:none;background:var(--ok);border:2px solid #000;outline:1px solid var(--ok);animation:pulse 2s steps(2,end) infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(0,255,65,.45)}50%{opacity:.55;box-shadow:0 0 0 6px rgba(0,255,65,0)}}
.who{display:flex;align-items:center;gap:8px;white-space:nowrap}
.av{width:34px;height:34px;display:grid;place-items:center;flex:none;color:var(--color-on-accent);background:var(--color-accent);border:2px solid #FF8A8A;border-radius:0;font-weight:700}

.wrap{width:min(100%,1480px);margin:0 auto;padding:24px clamp(14px,2.4vw,34px) 48px}
.scr-head{
  position:relative;
  display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
  margin-bottom:18px;padding:18px 18px 17px 22px;
  background:#050805;border:1px solid var(--line);border-left:7px solid var(--color-primary);
}
.scr-head:after{content:"SECURITY OPERATIONS // IAM";position:absolute;right:12px;top:-9px;padding:1px 7px;color:#000;background:var(--color-primary);font-family:ui-monospace,monospace;font-size:9px;font-weight:800;letter-spacing:.08em}
.scr-head h2{display:flex;align-items:center;gap:10px;font-size:clamp(18px,2.2vw,27px);font-weight:700;letter-spacing:.02em}
.scr-head h2 .ms{color:var(--color-primary);font-size:28px}
.scr-head .sub{max-width:780px;margin-top:6px;color:var(--muted);font-size:12.5px}
.seg{display:flex;gap:0;padding:0;background:#000;border:1px solid var(--line);border-radius:0}
.seg span{min-height:34px;display:grid;place-items:center;padding:6px 12px;color:var(--muted);border-right:1px solid var(--line);border-radius:0;font-size:11px;font-weight:700;transition:background-color .18s,color .18s}
.seg span:last-child{border-right:0}
.seg span:hover{color:#fff;background:#202020}
.seg span.on{color:var(--color-on-primary);background:var(--color-primary)}

.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(300px,1fr)}
.g-1-2{grid-template-columns:minmax(300px,1fr) minmax(0,2fr)}
.g-3-2{grid-template-columns:minmax(0,3fr) minmax(300px,2fr)}
.grid>*{min-width:0}
.card,.kpi,.tile,.pcol{
  border-radius:0;
  box-shadow:6px 6px 0 #111;
}
.card{
  min-width:0;padding:16px;
  color:var(--color-card-foreground);background:var(--panel);
  border:1px solid var(--line);border-top:3px solid var(--color-primary);
}
.card:nth-child(even){border-top-color:#5AFF7F}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:-4px 0 14px;padding-bottom:10px;border-bottom:1px dashed #47604D}
.card-h h3{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;letter-spacing:.025em}
.card-h h3 .ms{color:var(--color-primary);font-size:19px}
.card-h .mini{color:var(--muted);font-family:ui-monospace,monospace;font-size:10.5px;text-transform:uppercase}

.kpi{
  position:relative;overflow:hidden;min-width:0;
  padding:16px 16px 14px;
  background:#070B08;border:1px solid var(--line);border-left:5px solid var(--color-primary);
}
.kpi:after{content:"";position:absolute;right:-18px;top:-18px;width:52px;height:52px;border:1px solid rgba(0,255,65,.3);transform:rotate(45deg)}
.kpi .ic{width:36px;height:36px;display:grid;place-items:center;margin-bottom:14px;border:1px solid currentColor;border-radius:0;background:transparent}
.kpi .ic .ms{font-size:21px}
.kpi .lab{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.kpi .val{margin-top:3px;font-family:"Cinzel",ui-monospace,monospace;font-size:clamp(25px,3vw,34px);font-weight:700;line-height:1.15;letter-spacing:.02em;font-variant-numeric:tabular-nums lining-nums}
.kpi .val small{margin-left:4px;color:var(--muted);font-family:"Josefin Sans","Noto Sans TC",sans-serif;font-size:12px;font-weight:700}
.kpi .delta{display:flex;align-items:center;gap:4px;margin-top:7px;font-size:11px;font-weight:700}
.kpi .delta .ms{font-size:15px}
.up{color:#79FF9B}.down{color:#FF8181}
.kb-a,.kb-g{color:var(--color-primary)}
.kb-w{color:var(--warn)}
.kb-r{color:#FF7373}
.kb-b{color:var(--info)}

.ovx{overflow-x:auto;overscroll-behavior-inline:contain}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th{
  padding:10px 12px;text-align:left;
  color:#D5DEEA;background:#111;
  border:1px solid #454545;
  font-family:"Josefin Sans","Noto Sans TC",sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;
}
td{padding:11px 12px;color:var(--ink);border:1px solid #2F3931;white-space:nowrap}
tbody tr:nth-child(even){background:rgba(255,255,255,.025)}
tbody tr:hover{background:#172019}
td:nth-child(n+2){font-variant-numeric:tabular-nums}
td[style*="min-width:130px"]{text-align:right}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border:1px solid currentColor;border-radius:0;font-size:10.5px;font-weight:700;line-height:1.35;white-space:nowrap}
.badge .ms{font-size:14px}
.b-ok{color:#79FF9B;background:#092D13}
.b-warn{color:#FFE06B;background:#352B04}
.b-bad{color:#FF8B8B;background:#3A0A0A}
.b-info{color:#7DE4FF;background:#082A34}
.b-acc{color:#A4FFB9;background:#103017}
.dot{width:9px;height:9px;display:inline-block;flex:none;border:1px solid #fff;border-radius:0}

.uav{display:inline-flex;align-items:center;gap:9px}
.uav .a{width:29px;height:29px;display:grid;place-items:center;flex:none;color:#fff;border:1px solid #fff;border-radius:0;font-size:11px;font-weight:700}
.uav .nm{font-weight:700}
.uav .em{color:var(--muted);font-family:ui-monospace,monospace;font-size:10.5px}
.bar{height:9px;min-width:64px;overflow:hidden;background:#242424;border:1px solid #4A4A4A;border-radius:0}
.bar>i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--color-primary) 0 8px,#005E18 8px 10px);border-radius:0}
.bar.g>i{background:var(--color-primary)}
.chartbox{width:100%;overflow:hidden}
.apexcharts-canvas text{font-family:"Josefin Sans","Noto Sans TC",sans-serif!important}
.apexcharts-gridline{stroke:#304034}
.apexcharts-tooltip,.apexcharts-xaxistooltip{color:#fff!important;background:#090D0A!important;border:1px solid var(--color-primary)!important;border-radius:0!important;box-shadow:4px 4px 0 #16331D!important}
.apexcharts-tooltip-title{background:#111!important;border-bottom:1px solid #454545!important}

.tl{position:relative;padding-left:23px}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:repeating-linear-gradient(var(--color-primary) 0 6px,transparent 6px 10px)}
.tl-item{position:relative;padding:0 0 18px 14px}
.tl-item:last-child{padding-bottom:0}
.tl-item .node{position:absolute;left:-20px;top:2px;width:15px;height:15px;background:#000;border:2px solid var(--warn);border-radius:0}
.tl-item .node.ok{background:var(--ok);border-color:var(--ok)}
.tl-item .node.bad{background:var(--bad);border-color:var(--bad)}
.tl-item .tm{color:var(--muted);font-size:10px}
.tl-item .tt{margin-top:2px;font-weight:700;font-size:13px}
.tl-item .td2{margin-top:2px;color:var(--muted);font-size:11.5px}

.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
.pcol{min-width:0;padding:10px;background:#080B09;border:1px solid var(--line)}
.pcol:nth-child(even){transform:translateY(10px)}
.pcol-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;padding:2px 2px 9px;border-bottom:2px solid var(--color-primary);font-size:12px;font-weight:700}
.pcol-h .n{padding:1px 7px;color:#000;background:var(--color-primary);border-radius:0;font-family:ui-monospace,monospace;font-size:10px}
.pcard{margin-bottom:8px;padding:9px 10px;background:#111713;border:1px solid var(--line);border-left:4px solid var(--color-primary);border-radius:0}
.pcard:last-child{margin-bottom:0}
.pcard.j{border-left-color:var(--info)}
.pcard.m{border-left-color:var(--warn)}
.pcard.l{border-left-color:var(--bad)}
.pcard .pn{font-size:12px;font-weight:700}
.pcard .pmeta{display:flex;justify-content:space-between;gap:6px;margin-top:4px;color:var(--muted);font-size:10.5px}

.matrix{border-collapse:separate;border-spacing:3px}
.matrix th{padding:6px;text-align:center;font-size:9.5px}
.matrix td{padding:0;text-align:center;border:0;background:transparent}
.mcell{width:35px;height:31px;display:grid;place-items:center;border:1px solid currentColor;border-radius:0;font-family:ui-monospace,monospace;font-size:13px;font-weight:800}
.m-self{color:#B7C0CE;background:#222}
.m-ok{color:#79FF9B;background:#092D13}
.m-conf{color:#FF8B8B;background:#3A0A0A}
.m-warn{color:#FFE06B;background:#352B04}
.rn{padding-right:8px;color:var(--muted);font-size:11px;font-weight:700;text-align:right;white-space:nowrap}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
.tile{min-width:0;padding:13px;background:#090D0A;border:1px solid var(--line);border-bottom:4px solid #294C31}
.tile .th{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.tile .ti{width:35px;height:35px;display:grid;place-items:center;flex:none;background:var(--color-primary);border-radius:0;color:#000}
.tile .ti .ms{font-size:20px}
.tile .tn{font-size:12.5px;font-weight:700}
.tile .ts{color:var(--muted);font-family:ui-monospace,monospace;font-size:10px}
.tile .row{display:flex;justify-content:space-between;align-items:center;gap:7px;margin-top:7px;color:var(--muted);font-size:11px}
.tile .row b{color:var(--ink);font-family:ui-monospace,monospace;font-weight:700;font-variant-numeric:tabular-nums}
.statline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:11.5px}
.statline b{color:var(--ink);font-family:"Cinzel",monospace;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.certrow{display:flex;align-items:center;gap:10px;min-width:640px;padding:11px 6px;border-bottom:1px solid #344137}
.certrow:last-child{border-bottom:0}
.certrow:hover{background:#172019}
.actbtn{min-height:32px;display:inline-flex;align-items:center;gap:4px;padding:5px 9px;color:var(--muted);background:#101510;border:1px solid var(--line);border-radius:0;font-size:10.5px;font-weight:700;transition:background-color .18s,color .18s,border-color .18s}
.actbtn:hover{color:#000;background:var(--color-primary);border-color:var(--color-primary)}
.actbtn .ms{font-size:15px}
.actbtn.rev{color:#79FF9B;border-color:#288E40}
.actbtn.rmv{color:#FF8B8B;border-color:#A93636}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:10.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.filterbar{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{min-height:32px;display:inline-flex;align-items:center;gap:5px;padding:6px 10px;color:var(--muted);background:#111;border:1px solid var(--line);border-radius:0;font-size:10.5px;font-weight:700;transition:background-color .18s,color .18s}
.fbtn:hover{color:#fff;background:#222}
.fbtn.on{color:#000;background:var(--color-primary);border-color:var(--color-primary)}
.fbtn .ms{font-size:15px}
.riskring{display:flex;align-items:center;justify-content:center;gap:15px;flex-wrap:wrap}
.ringtxt .big{font-family:"Cinzel",serif;font-size:29px;font-weight:700}
.ringtxt .sm{color:var(--muted);font-size:11px}
.note{display:flex;align-items:flex-start;gap:7px;margin-top:12px;padding:9px 10px;color:#C8D1DE;background:#0A150D;border-left:3px solid var(--color-primary);font-family:ui-monospace,monospace;font-size:10.5px}
.note .ms{color:var(--color-primary);font-size:15px}

#view>.scr-head,#view>.grid,#view>.card{animation:stagger-in .4s cubic-bezier(.2,.85,.3,1.2) both}
#view>.grid:nth-child(2),#view>.card:nth-child(2){animation-delay:.06s}
#view>.grid:nth-child(3),#view>.card:nth-child(3){animation-delay:.12s}
#view>.grid:nth-child(4),#view>.card:nth-child(4){animation-delay:.18s}
@keyframes stagger-in{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}

@media(max-width:1100px){
  .topbar{align-items:flex-start}
  .nav{order:3;width:100%;margin-left:0;overflow-x:auto;flex-wrap:nowrap}
  .nav button{flex:1;justify-content:center}
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-2-1,.g-1-2,.g-3-2{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:768px){
  .wrap{padding:18px 12px 40px}
  .scr-head{align-items:flex-start;padding:16px 13px 14px 16px}
  .scr-head:after{display:none}
  .g2,.g3{grid-template-columns:1fr}
  .pipe{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pcol:nth-child(even){transform:none}
  .card,.kpi{box-shadow:4px 4px 0 #111}
}
@media(max-width:560px){
  body{background-size:24px 24px}
  .topbar{gap:10px;padding:9px 10px}
  .brand .t2,.chip.hide-sm{display:none}
  .brand .t1{font-size:13px}
  .logo{width:37px;height:37px;box-shadow:3px 3px 0 #174723}
  .tools{margin-left:auto}
  .nav button{min-width:46px;padding:8px 10px}
  .nav button .txt{display:none}
  .g-kpi{grid-template-columns:1fr 1fr;gap:9px}
  .kpi{padding:13px 11px}
  .kpi .val{font-size:24px}
  .kpi .ic{width:31px;height:31px;margin-bottom:10px}
  .tiles,.pipe{grid-template-columns:1fr}
  .scr-head h2{font-size:18px}
  .card{padding:13px}
}
@media(max-width:390px){
  .g-kpi{grid-template-columns:1fr}
  .seg{width:100%}
  .seg span{flex:1}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  #view>.scr-head,#view>.grid,#view>.card{opacity:1;transform:none;animation:none}
  .livedot{animation:none;opacity:1}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <div class="logo"><span class="ms">shield_person</span></div>
    <div>
      <div class="t1">IAM 身分存取控制台</div>
      <div class="t2">Identity &amp; Access Management</div>
    </div>
  </div>
  <div class="nav" id="nav"></div>
  <div class="spacer"></div>
  <div class="tools">
    <div class="chip hide-sm"><span class="livedot"></span>即時同步</div>
    <div class="chip hide-sm"><span class="ms" style="font-size:15px">dns</span>SIEM · PAM 已連線</div>
    <div class="who"><div class="av">陳</div></div>
  </div>
