<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>跨廠調撥管理系統 Inter-Plant Transfer Management</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

:root{
  --color-primary:#334155;
  --color-on-primary:#FFFFFF;
  --color-secondary:#475569;
  --color-on-secondary:#FFFFFF;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#0F172A;
  --color-card:#FFFFFF;
  --color-card-foreground:#0F172A;
  --color-muted:#F2F3F4;
  --color-muted-foreground:#475569;
  --color-border:#E6E8EA;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#334155;
  --blue:#334155;
  --ink:#0F172A;
  --muted:#475569;
  --line:#E6E8EA;
  --accent:#059669;
  --accent2:#334155;
  --bg:#F8FAFC;
  --panel:#FFFFFF;
  --sidebar:#0F172A;
  --sidebar2:#0F172A;
  --ok:#047857;
  --bad:#DC2626;
}

*{box-sizing:border-box;}
html{background:var(--color-background);scroll-behavior:auto;}
html,body{margin:0;padding:0;}
body{
  min-width:320px;
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--color-background);
  color:var(--color-foreground);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  font-variant-numeric:tabular-nums lining-nums;
}
button,input,select,textarea{font:inherit;}
button,a,[role="button"]{cursor:pointer;}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
::selection{background:var(--color-accent);color:#000;}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}

.app{display:flex;min-height:100vh;align-items:stretch;}
.sidebar{
  width:276px;
  flex:0 0 276px;
  height:100vh;
  position:sticky;
  top:0;
  z-index:30;
  display:flex;
  flex-direction:column;
  color:#FFFFFF;
  background:var(--sidebar);
  border-right:4px solid var(--color-accent);
}
.brand{
  min-height:112px;
  padding:24px 20px;
  display:flex;
  align-items:center;
  border-bottom:2px solid #FFFFFF;
}
.brand .logo{display:flex;align-items:center;gap:14px;min-width:0;}
.brand .logo .badge{
  width:46px;
  height:46px;
  flex:0 0 46px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#000000;
  background:var(--color-accent);
  border:2px solid #FFFFFF;
  border-radius:0;
}
.brand .logo .badge .material-symbols-outlined{font-size:27px;font-weight:700;}
.brand h1{margin:0;font-size:16px;line-height:1.25;font-weight:700;letter-spacing:.02em;}
.brand p{margin:5px 0 0;color:#CBD5E1;font-size:10px;line-height:1.3;font-weight:600;letter-spacing:.08em;text-transform:uppercase;}
.nav{padding:18px 14px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;}
.nav .cap{
  padding:3px 7px 10px;
  color:#CBD5E1;
  font-size:10px;
  font-weight:700;
  letter-spacing:.18em;
  text-transform:uppercase;
}
.navbtn{
  width:100%;
  min-height:48px;
  min-width:0;
  padding:11px 10px;
  display:flex;
  align-items:center;
  gap:11px;
  border:1px solid #64748B;
  border-radius:0;
  background:transparent;
  color:#E2E8F0;
  text-align:left;
  font-size:13px;
  font-weight:600;
  transition:background-color 160ms ease,color 160ms ease,border-color 160ms ease,transform 160ms ease;
}
.navbtn .material-symbols-outlined{flex:0 0 auto;color:#94A3B8;font-size:21px;transition:color 160ms ease;}
.navbtn .idx{margin-left:auto;color:#94A3B8;font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:10px;font-weight:700;letter-spacing:.08em;}
.navbtn:hover{background:#1E293B;color:#FFFFFF;border-color:#FFFFFF;transform:translateX(3px);}
.navbtn:hover .material-symbols-outlined{color:#FFFFFF;}
.navbtn.on{
  position:relative;
  background:var(--color-accent);
  border-color:#FFFFFF;
  color:#000000;
}
.navbtn.on::after{content:"";position:absolute;right:-15px;top:15px;width:14px;height:16px;background:var(--color-accent);clip-path:polygon(0 0,100% 50%,0 100%);}
.navbtn.on .material-symbols-outlined,.navbtn.on .idx{color:#000000;}
.navbtn:focus-visible{outline-color:#FFFFFF;outline-offset:2px;}
.sidefoot{
  margin-top:auto;
  padding:18px 20px 22px;
  border-top:2px solid #FFFFFF;
  color:#CBD5E1;
  font-size:11px;
  line-height:1.7;
}
.sidefoot b{color:#6EE7B7;font-weight:700;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  min-height:112px;
  padding:20px 30px;
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  background:rgba(248,250,252,.97);
  border-bottom:2px solid var(--color-primary);
}
.topbar::before{content:"OPS / TRANSFER";align-self:flex-start;padding:4px 7px;background:var(--color-primary);color:#FFFFFF;font-size:9px;font-weight:700;letter-spacing:.16em;}
.topbar .tt{min-width:220px;}
.topbar .tt h2{margin:0;font-size:clamp(20px,2vw,29px);line-height:1.05;font-weight:700;letter-spacing:-.04em;}
.topbar .tt p{margin:6px 0 0;color:var(--color-muted-foreground);font-size:12px;font-weight:500;}
.topbar .spacer{flex:1;}
.pill{
  min-height:38px;
  padding:8px 11px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:var(--color-foreground);
  background:#FFFFFF;
  border:1px solid var(--color-primary);
  border-radius:0;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
.pill .material-symbols-outlined{font-size:17px;color:var(--color-accent);}
.content{width:100%;max-width:1600px;padding:30px 30px 48px;}
.grid{display:grid;gap:18px;}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
.g23{grid-template-columns:minmax(0,2fr) minmax(280px,1fr);}
.g32{grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr);}

.card{
  min-width:0;
  position:relative;
  padding:20px;
  overflow:hidden;
  background:var(--color-card);
  color:var(--color-card-foreground);
  border:2px solid var(--color-primary);
  border-radius:0;
}
.card::after{content:"";position:absolute;right:-1px;top:-1px;width:20px;height:20px;background:var(--color-background);border-left:2px solid var(--color-primary);border-bottom:2px solid var(--color-primary);}
.card h3{margin:0 28px 4px 0;display:flex;align-items:center;gap:9px;font-size:14px;line-height:1.3;font-weight:700;letter-spacing:-.01em;}
.card h3 .material-symbols-outlined{font-size:20px;color:var(--color-accent);}
.card .sub{max-width:68ch;margin:0 0 17px;color:var(--color-muted-foreground);font-size:11px;font-weight:500;}
.grid>.card:nth-child(even){border-top-width:5px;}
.grid>.card:nth-child(3n){border-left-color:var(--color-accent);}
.kpi{min-height:150px;padding:20px 18px 18px 22px;}
.kpi::after{width:17px;height:17px;background:var(--color-primary);border:0;}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--color-accent);}
.kpi .lbl{display:flex;align-items:center;gap:8px;color:var(--color-muted-foreground);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
.kpi .lbl .material-symbols-outlined{font-size:19px;color:var(--color-primary);}
.kpi .val{margin-top:13px;color:var(--color-foreground);font-size:clamp(27px,2.4vw,36px);line-height:1;font-weight:700;letter-spacing:-.055em;font-variant-numeric:tabular-nums lining-nums;}
.kpi .foot{margin-top:12px;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;}
.up{color:#047857;}.down{color:#B91C1C;}.flat{color:var(--color-muted-foreground);}
.chartwrap{position:relative;overflow:hidden;}

 table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--color-primary);font-size:12px;font-variant-numeric:tabular-nums lining-nums;}
th,td{padding:11px 12px;border-right:1px solid var(--color-border);border-bottom:1px solid var(--color-border);text-align:left;white-space:nowrap;vertical-align:middle;}
th:last-child,td:last-child{border-right:0;}
tbody tr:last-child td{border-bottom:0;}
th{color:#FFFFFF;background:var(--color-primary);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
td{color:var(--color-foreground);background:#FFFFFF;}
tbody tr:nth-child(even) td{background:var(--color-muted);}
tbody tr:hover td{background:#D1FAE5;}
td:nth-child(4),td:nth-child(5){font-variant-numeric:tabular-nums lining-nums;}
.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-weight:700;letter-spacing:-.02em;}
.tag{
  min-height:25px;
  padding:3px 8px;
  display:inline-flex;
  align-items:center;
  gap:5px;
  border:1px solid currentColor;
  border-radius:0;
  font-size:10px;
  line-height:1.3;
  font-weight:700;
  white-space:nowrap;
}
.tag::before{content:"■";font-size:7px;line-height:1;}
.t-ok{background:#D1FAE5;color:#065F46;}
.t-warn{background:#FEF3C7;color:#92400E;}
.t-bad{background:#FEE2E2;color:#991B1B;}
.t-info{background:#E0F2FE;color:#075985;}
.t-mut{background:#F1F5F9;color:#475569;}
.dot{width:9px;height:9px;display:inline-block;margin-right:2px;border:1px solid currentColor;border-radius:0;}
.progress{height:12px;min-width:82px;overflow:hidden;background:#E2E8F0;border:1px solid var(--color-primary);border-radius:0;}
.progress>span{display:block;height:100%;background:var(--color-accent);border-right:2px solid var(--color-primary);border-radius:0;}
.rowsplit{display:flex;align-items:center;gap:7px;}
.alert{
  padding:13px 14px;
  display:flex;
  align-items:flex-start;
  gap:11px;
  background:#ECFDF5;
  border:2px solid var(--color-accent);
  border-radius:0;
}
.alert .material-symbols-outlined{flex:0 0 auto;color:#047857;font-size:21px;}
.alert .h{color:var(--color-foreground);font-size:12px;font-weight:700;}
.alert .d{margin-top:3px;color:var(--color-muted-foreground);font-size:11px;line-height:1.55;}
.chip{
  min-height:40px;
  padding:8px 10px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:var(--color-foreground);
  background:var(--color-muted);
  border:1px solid var(--color-primary);
  border-radius:0;
  font-size:11px;
  font-weight:600;
}
.chip .material-symbols-outlined{font-size:17px;color:var(--color-accent);}
hr.sep{margin:18px 0;border:0;border-top:2px solid var(--color-primary);}
.sech{margin:2px 0 13px;display:flex;align-items:center;gap:8px;color:var(--color-primary);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
.sech .material-symbols-outlined{font-size:19px;color:var(--color-accent);}
.statline{display:flex;align-items:baseline;gap:9px;}
.statline b{font-size:22px;font-weight:700;letter-spacing:-.04em;}
.statline span{color:var(--color-muted-foreground);font-size:11px;line-height:1.45;}

.tl{position:relative;padding-left:29px;}
.tl::before{content:"";position:absolute;left:9px;top:5px;bottom:5px;width:3px;background:var(--color-border);border-left:1px solid var(--color-primary);}
.tl .ev{position:relative;padding:0 0 20px 10px;}
.tl .ev:last-child{padding-bottom:0;}
.tl .ev .mk{position:absolute;left:-27px;top:1px;width:19px;height:19px;background:#FFFFFF;border:3px solid var(--color-primary);border-radius:0;}
.tl .ev.done .mk{background:var(--color-accent);}
.tl .ev.now .mk{background:#FFFFFF;border:5px solid var(--color-accent);}
.tl .ev .tm{color:var(--color-muted-foreground);font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:10px;font-weight:700;}
.tl .ev .hd{margin:2px 0;color:var(--color-foreground);font-size:12px;font-weight:700;}
.tl .ev .tx{color:var(--color-muted-foreground);font-size:11px;line-height:1.5;}

.route{padding:24px 20px;overflow-x:auto;color:#FFFFFF;background:var(--color-primary);border:2px solid #0F172A;border-radius:0;}
.routeline{min-width:650px;display:flex;align-items:stretch;gap:0;}
.stop{flex:1;min-width:0;position:relative;padding-top:39px;text-align:center;}
.stop::before{content:"";position:absolute;top:16px;left:0;right:0;height:5px;background:#64748B;border-top:1px solid #FFFFFF;border-bottom:1px solid #FFFFFF;}
.stop:first-child::before{left:50%;}
.stop:last-child::before{right:50%;}
.stop.pass::before{background:var(--color-accent);}
.stop .pin{position:absolute;top:4px;left:50%;width:29px;height:29px;display:flex;align-items:center;justify-content:center;transform:translateX(-50%);background:var(--color-primary);border:3px solid #94A3B8;border-radius:0;}
.stop.pass .pin{background:var(--color-accent);border-color:#FFFFFF;}
.stop.here .pin{background:#FFFFFF;border:5px solid var(--color-accent);}
.stop .pin .material-symbols-outlined{color:#FFFFFF;font-size:15px;}
.stop.here .pin .material-symbols-outlined{color:#0F172A;}
.stop .nm{margin-top:7px;color:#FFFFFF;font-size:11px;font-weight:700;}
.stop .sm{margin-top:3px;color:#CBD5E1;font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:9px;}
.legend{margin-top:19px;display:flex;gap:17px;flex-wrap:wrap;color:#E2E8F0;font-size:10px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}

#screen>.grid,#screen>.card{animation:screen-reveal 360ms ease-out both;}
#screen>.grid:nth-child(2),#screen>.card:nth-child(2){animation-delay:50ms;}
#screen>.grid:nth-child(3),#screen>.card:nth-child(3){animation-delay:90ms;}
@keyframes screen-reveal{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

@media(max-width:1100px){
  .sidebar{width:236px;flex-basis:236px;}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));}
  .content{padding:24px;}
}
@media(max-width:860px){
  .app{display:block;}
  .sidebar{width:100%;height:auto;position:relative;top:auto;border-right:0;border-bottom:4px solid var(--color-accent);}
  .brand{min-height:auto;padding:15px 17px;border-bottom:1px solid #64748B;}
  .brand .logo .badge{width:39px;height:39px;flex-basis:39px;}
  .nav{padding:10px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;overflow:visible;}
  .nav .cap{display:none;}
  .navbtn{min-height:44px;padding:9px;}
  .navbtn.on::after{display:none;}
  .navbtn:hover{transform:none;}
  .navbtn .idx{display:none;}
  .sidefoot{display:none;}
  .topbar{min-height:auto;position:relative;padding:18px 20px;}
  .topbar::before{display:none;}
  .g23,.g32{grid-template-columns:1fr;}
}
@media(max-width:640px){
  .nav{grid-template-columns:repeat(6,minmax(44px,1fr));overflow-x:auto;}
  .navbtn{justify-content:center;}
  .navbtn .lb{display:none;}
  .navbtn .material-symbols-outlined{font-size:22px;}
  .topbar{gap:9px;}
  .topbar .tt{width:100%;min-width:0;}
  .topbar .spacer{display:none;}
  .pill{flex:1;justify-content:center;min-width:140px;}
  .content{padding:18px 14px 34px;}
  .g2,.g4{grid-template-columns:1fr;}
  .grid{gap:13px;}
  .card{padding:16px;}
  .kpi{min-height:132px;}
  .kpi .val{font-size:30px;}
  th,td{padding:10px;font-size:11px;}
  .route{padding:19px 13px;}
}
@media(max-width:390px){
  .topbar{padding:16px 14px;}
  .pill{width:100%;flex-basis:100%;}
  .content{padding-left:10px;padding-right:10px;}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important;}
  #screen>.grid,#screen>.card{animation:none!important;opacity:1!important;transform:none!important;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">
        <div class="badge"><span class="material-symbols-outlined">swap_horiz</span></div>
        <div style="min-width:0">
          <h1>跨廠調撥管理</h1>
          <p>Inter-Plant Transfer MS</p>
        </div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <div class="cap">作業模組</div>
    </nav>
    <div class="sidefoot">
      作業廠區：<b>桃園 · 台南 · 越南</b><br/>
      版本 v3.2 · 資料為模擬展示
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="tt">
        <h2 id="scrTitle">調撥申請</h2>
        <p id="scrDesc">跨廠調撥需求建立與品項數量填報</p>
      </div>
      <div class="spacer"></div>
      <span class="pill"><span class="material-symbols-outlined">calendar_today</span>2026-08-14</span>
      <span class="pill"><span class="material-symbols-outlined">person</span>倉管 · 林佩君</span>
    </div>
    <div class="content" id="screen"></div>
  </div>
</div>
<script>
"use strict";
var MODS=[
  {icon:"request_quote",name:"調撥申請",desc:"跨廠調撥需求建立與品項數量填報"},
  {icon:"fact_check",name:"審核核准",desc:"調撥單分級審核與庫存可撥檢核"},
  {icon:"local_shipping",name:"出貨發運",desc:"撿料備貨、裝車與出廠發運確認"},
  {icon:"monitoring",name:"在途追蹤",desc:"跨廠運送即時定位與到廠時效追蹤"},
  {icon:"inventory_2",name:"到貨驗收",desc:"到廠點收、差異登錄與入庫確認"},
  {icon:"account_tree",name:"帳務過帳",desc:"跨廠庫存移轉過帳與對帳稽核"}
];
var charts={};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function el(id){return document.getElementById(id);}
function destroyAll(){for(var k in charts){if(charts[k]){try{charts[k].destroy();}catch(e){}charts[k]=null;}}}

(function(){
  var nav=el("nav");
  var html="";
  for(var i=0;i<MODS.length;i++){
    html+='<button class="navbtn" data-i="'+i+'" onclick="show('+i+')">'+
      '<span class="material-symbols-outlined">'+MODS[i].icon+'</span>'+
      '<span class="lb">'+esc(MODS[i].name)+'</span>'+
      '<span class="idx">0'+(i+1)+'</span></button>';
  }
  nav.insertAdjacentHTML("beforeend",html);
})();

var ACC="#059669",ACC2="#334155";
function baseOpts(extra){
  var o={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{family:"Inter",size:11},color:"#475569"}}},
    scales:{x:{grid:{display:false},ticks:{font:{family:"Inter",size:10},color:"#475569"}},y:{grid:{color:"#e6e8ea"},ticks:{font:{family:"Inter",size:10},color:"#475569"}}}};
  if(extra)for(var k in extra)o[k]=extra[k];
  return o;
}

function kpi(icon,lbl,val,foot,dir){
  var cls=dir==="up"?"up":(dir==="down"?"down":"flat");
  var ic=dir==="up"?"trending_up":(dir==="down"?"trending_down":"trending_flat");
  return '<div class="card kpi"><span class="bar"></span>'+
    '<div class="lbl"><span class="material-symbols-outlined">'+icon+'</span>'+esc(lbl)+'</div>'+
    '<div class="val">'+esc(val)+'</div>'+
    '<div class="foot '+cls+'"><span class="material-symbols-outlined" style="font-size:16px">'+ic+'</span>'+esc(foot)+'</div></div>';
}
function formRow(icon,lbl,val){

var SCR=[
  {r:s0,i:s0init},{r:s1,i:s1init},{r:s2,i:s2init},{r:s3,i:s3init},{r:s4,i:s4init},{r:s5,i:s5init}
];
function show(i){
  var n=SCR.length;
  if(i<0)i=0;if(i>n-1)i=n-1;
  destroyAll();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  el("scrTitle").textContent=MODS[i].name;
  el("scrDesc").textContent=MODS[i].desc;
  var container=el("screen");
  container.innerHTML=SCR[i].r();
  void container.offsetHeight;
  if(SCR[i].i)SCR[i].i();
  try{window.scrollTo(0,0);}catch(e){}
}
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
