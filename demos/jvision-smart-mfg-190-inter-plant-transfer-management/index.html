<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>跨廠調撥管理系統 Inter-Plant Transfer Management</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#b45309;
  --accent2:#f59e0b;
  --bg:#f5f1ea;
  --panel:#ffffff;
  --ink:#1c1917;
  --muted:#78716c;
  --line:#e7e2d9;
  --sidebar:#231a12;
  --sidebar2:#2f2417;
  --ok:#15803d;
  --bad:#b91c1c;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.app{display:flex;min-height:100vh;}
.sidebar{width:250px;flex-shrink:0;background:linear-gradient(180deg,var(--sidebar),var(--sidebar2));color:#f5efe6;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.brand{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.09);}
.brand .logo{display:flex;align-items:center;gap:10px;}
.brand .logo .badge{width:38px;height:38px;border-radius:11px;flex-shrink:0;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;}
.brand .logo .badge .material-symbols-outlined{font-size:22px;}
.brand h1{font-size:15px;margin:0;font-weight:900;letter-spacing:.3px;}
.brand p{margin:3px 0 0;font-size:11px;color:#c9bda8;font-weight:500;}
.nav{padding:14px 12px;display:flex;flex-direction:column;gap:5px;overflow-y:auto;}
.nav .cap{font-size:10px;letter-spacing:1.4px;color:#9a8b73;padding:6px 10px 4px;font-weight:700;}
.navbtn{display:flex;align-items:center;gap:12px;min-width:0;background:transparent;border:0;cursor:pointer;color:#d7cbb8;text-align:left;padding:11px 12px;border-radius:10px;font-size:13.5px;font-weight:600;font-family:inherit;width:100%;transition:.15s;}
.navbtn .material-symbols-outlined{font-size:21px;color:#a68a5f;transition:.15s;flex-shrink:0;}
.navbtn .idx{margin-left:auto;font-size:11px;color:#7c6f5b;font-weight:700;}
.navbtn:hover{background:rgba(255,255,255,.05);color:#fff;}
.navbtn.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(180,83,9,.35);}
.navbtn.on .material-symbols-outlined,.navbtn.on .idx{color:#fff;}
.sidefoot{margin-top:auto;padding:16px 18px;border-top:1px solid rgba(255,255,255,.09);font-size:11px;color:#a99a82;}
.sidefoot b{color:#f0c98a;}
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 26px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:20;}
.topbar .tt{min-width:0;}
.topbar .tt h2{margin:0;font-size:18px;font-weight:800;}
.topbar .tt p{margin:3px 0 0;font-size:12.5px;color:var(--muted);}
.topbar .spacer{flex:1;}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fef3e2;color:var(--accent);border:1px solid #f3d9b0;padding:7px 13px;border-radius:999px;font-size:12px;font-weight:700;}
.pill .material-symbols-outlined{font-size:16px;}
.content{padding:24px 26px 40px;}
.grid{display:grid;gap:16px;}
.g2{grid-template-columns:repeat(2,1fr);}
.g4{grid-template-columns:repeat(4,1fr);}
.g23{grid-template-columns:2fr 1fr;}
.g32{grid-template-columns:1.4fr 1fr;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;}
.card h3{margin:0 0 3px;font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
.card .sub{font-size:12px;color:var(--muted);margin:0 0 14px;}
.kpi{position:relative;overflow:hidden;}
.kpi .lbl{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px;}
.kpi .lbl .material-symbols-outlined{font-size:18px;}
.kpi .val{font-size:27px;font-weight:800;margin-top:9px;letter-spacing:-.5px;}
.kpi .foot{font-size:11.5px;margin-top:7px;font-weight:600;display:flex;align-items:center;gap:4px;}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent);}
.up{color:var(--ok);}.down{color:var(--bad);}.flat{color:var(--muted);}
.chartwrap{position:relative;overflow:hidden;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{font-size:11px;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;font-weight:700;background:#faf7f1;}
tbody tr:hover{background:#fdfaf4;}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;}
.t-ok{background:#dcfce7;color:#15803d;}
.t-warn{background:#fef3e2;color:#b45309;}
.t-bad{background:#fee2e2;color:#b91c1c;}
.t-info{background:#e0f2fe;color:#0369a1;}
.t-mut{background:#f1ede5;color:#78716c;}
.mono{font-family:"Inter",monospace;font-weight:600;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:2px;}
.progress{height:8px;background:#efe9df;border-radius:999px;overflow:hidden;min-width:70px;}
.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px;}
.rowsplit{display:flex;align-items:center;gap:8px;}
.alert{display:flex;gap:11px;align-items:flex-start;background:#fffbf3;border:1px solid #f3d9b0;border-radius:12px;padding:12px 14px;}
.alert .material-symbols-outlined{color:var(--accent);font-size:20px;flex-shrink:0;}
.alert .h{font-size:13px;font-weight:800;}
.alert .d{font-size:12px;color:var(--muted);margin-top:2px;}
.chip{display:inline-flex;align-items:center;gap:5px;background:#faf7f1;border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:12px;font-weight:600;}
.chip .material-symbols-outlined{font-size:16px;color:var(--accent);}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0;}
.sech{font-size:13px;font-weight:800;margin:2px 0 12px;display:flex;align-items:center;gap:8px;color:#57493a;}
.sech .material-symbols-outlined{font-size:19px;color:var(--accent);}
.statline{display:flex;gap:8px;align-items:baseline;}
.statline b{font-size:20px;font-weight:800;}
.statline span{font-size:11.5px;color:var(--muted);}
/* timeline */
.tl{position:relative;padding-left:26px;}
.tl:before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line);}
.tl .ev{position:relative;padding:0 0 18px 8px;}
.tl .ev:last-child{padding-bottom:0;}
.tl .ev .mk{position:absolute;left:-22px;top:1px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--accent);}
.tl .ev.done .mk{background:var(--accent);}
.tl .ev.now .mk{border-color:var(--accent2);box-shadow:0 0 0 4px #fef3e2;}
.tl .ev .tm{font-size:11px;color:var(--muted);font-weight:700;}
.tl .ev .hd{font-size:13px;font-weight:700;margin:2px 0 2px;}
.tl .ev .tx{font-size:12px;color:var(--muted);}
/* signature: route map */
.route{background:linear-gradient(135deg,#231a12,#3a2c1a);border-radius:16px;padding:20px;color:#f5efe6;overflow-x:auto;}
.routeline{display:flex;align-items:stretch;gap:0;min-width:620px;}
.stop{flex:1;position:relative;text-align:center;padding-top:34px;min-width:0;}
.stop:before{content:"";position:absolute;top:15px;left:0;right:0;height:4px;background:rgba(255,255,255,.15);}
.stop:first-child:before{left:50%;}
.stop:last-child:before{right:50%;}
.stop.pass:before{background:linear-gradient(90deg,var(--accent),var(--accent2));}
.stop .pin{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:24px;height:24px;border-radius:50%;background:#3a2c1a;border:3px solid #6b5433;display:flex;align-items:center;justify-content:center;}
.stop.pass .pin{background:var(--accent);border-color:var(--accent2);}
.stop.here .pin{background:var(--accent2);border-color:#fff;box-shadow:0 0 0 5px rgba(245,158,11,.25);}
.stop .pin .material-symbols-outlined{font-size:14px;color:#fff;}
.stop .nm{font-size:12px;font-weight:700;margin-top:6px;}
.stop .sm{font-size:10.5px;color:#c9bda8;margin-top:2px;}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:#c9bda8;margin-top:16px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
@media(max-width:860px){
  .app{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:static;flex-direction:column;}
  .nav{flex-direction:row;flex-wrap:wrap;overflow:visible;padding:10px;}
  .nav .cap{display:none;}
  .navbtn{width:auto;flex:0 0 auto;}
  .navbtn .idx{display:none;}
  .sidefoot{display:none;}
  .brand{border-bottom:0;}
}
@media(max-width:820px){
  .g2,.g4,.g23,.g32{grid-template-columns:1fr;}
}
@media(max-width:560px){
  .navbtn span.lb{display:none;}
  .navbtn{padding:11px;}
  .content{padding:18px 14px 34px;}
  .topbar{padding:14px 16px;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">
        <div class="badge"><span class="material-symbols-outlined">swap_horiz</span></div>
        <div style="min-width:0">
          <h1>跨廠調撥管理</h1>
          <p>Inter-Plant Transfer MS</p>
        </div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <div class="cap">作業模組</div>
    </nav>
    <div class="sidefoot">
      作業廠區：<b>桃園 · 台南 · 越南</b><br/>
      版本 v3.2 · 資料為模擬展示
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="tt">
        <h2 id="scrTitle">調撥申請</h2>
        <p id="scrDesc">跨廠調撥需求建立與品項數量填報</p>
      </div>
      <div class="spacer"></div>
      <span class="pill"><span class="material-symbols-outlined">calendar_today</span>2026-08-14</span>
      <span class="pill"><span class="material-symbols-outlined">person</span>倉管 · 林佩君</span>
    </div>
    <div class="content" id="screen"></div>
  </div>
</div>
<script>
"use strict";
var MODS=[
  {icon:"request_quote",name:"調撥申請",desc:"跨廠調撥需求建立與品項數量填報"},
  {icon:"fact_check",name:"審核核准",desc:"調撥單分級審核與庫存可撥檢核"},
  {icon:"local_shipping",name:"出貨發運",desc:"撿料備貨、裝車與出廠發運確認"},
  {icon:"monitoring",name:"在途追蹤",desc:"跨廠運送即時定位與到廠時效追蹤"},
  {icon:"inventory_2",name:"到貨驗收",desc:"到廠點收、差異登錄與入庫確認"},
  {icon:"account_tree",name:"帳務過帳",desc:"跨廠庫存移轉過帳與對帳稽核"}
];
var charts={};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function el(id){return document.getElementById(id);}
function destroyAll(){for(var k in charts){if(charts[k]){try{charts[k].destroy();}catch(e){}charts[k]=null;}}}

(function(){
  var nav=el("nav");
  var html="";
  for(var i=0;i<MODS.length;i++){
    html+='<button class="navbtn" data-i="'+i+'" onclick="show('+i+')">'+
      '<span class="material-symbols-outlined">'+MODS[i].icon+'</span>'+
      '<span class="lb">'+esc(MODS[i].name)+'</span>'+
      '<span class="idx">0'+(i+1)+'</span></button>';
  }
  nav.insertAdjacentHTML("beforeend",html);
})();

var ACC="#b45309",ACC2="#f59e0b";
function baseOpts(extra){
  var o={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{family:"Inter",size:11},color:"#57493a"}}},
    scales:{x:{grid:{display:false},ticks:{font:{size:10},color:"#78716c"}},y:{grid:{color:"#eee6d8"},ticks:{font:{size:10},color:"#78716c"}}}};
  if(extra)for(var k in extra)o[k]=extra[k];
  return o;
}

function kpi(icon,lbl,val,foot,dir){
  var cls=dir==="up"?"up":(dir==="down"?"down":"flat");
  var ic=dir==="up"?"trending_up":(dir==="down"?"trending_down":"trending_flat");
  return '<div class="card kpi"><span class="bar"></span>'+
    '<div class="lbl"><span class="material-symbols-outlined">'+icon+'</span>'+esc(lbl)+'</div>'+
    '<div class="val">'+esc(val)+'</div>'+
    '<div class="foot '+cls+'"><span class="material-symbols-outlined" style="font-size:16px">'+ic+'</span>'+esc(foot)+'</div></div>';
}
function formRow(icon,lbl,val){
  return '<div style="margin-bottom:11px"><div style="font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:5px">'+esc(lbl)+'</div>'+
    '<div class="chip" style="width:100%;justify-content:flex-start"><span class="material-symbols-outlined">'+icon+'</span>'+esc(val)+'</div></div>';
}

/* ===== SCREEN 0 : 調撥申請 ===== */
function s0(){
  var reqs=[
    {no:"TR-26081",from:"桃園廠",to:"台南廠",item:"鋁擠型 A6063-T5",qty:"1,200 支",need:"08-18",pri:"急件",st:"草稿"},
    {no:"TR-26082",from:"桃園廠",to:"越南廠",item:"銅箔基板 CCL-370",qty:"640 片",need:"08-22",pri:"一般",st:"待送審"},
    {no:"TR-26083",from:"台南廠",to:"桃園廠",item:"精密軸承 6204-2RS",qty:"3,000 顆",need:"08-19",pri:"急件",st:"待送審"},
    {no:"TR-26084",from:"台南廠",to:"越南廠",item:"環氧樹脂 EP-128",qty:"48 桶",need:"08-25",pri:"一般",st:"草稿"},
    {no:"TR-26085",from:"越南廠",to:"桃園廠",item:"連接器 USB-C 24P",qty:"12,000 個",need:"08-21",pri:"一般",st:"待送審"}
  ];
  var rows="";
  for(var i=0;i<reqs.length;i++){var r=reqs[i];
    var pt=r.pri==="急件"?"t-bad":"t-mut";
    var st=r.st==="待送審"?"t-info":"t-mut";
    rows+='<tr><td class="mono">'+esc(r.no)+'</td><td>'+esc(r.from)+' <span style="color:var(--accent)">→</span> '+esc(r.to)+
      '</td><td>'+esc(r.item)+'</td><td>'+esc(r.qty)+'</td><td>'+esc(r.need)+
      '</td><td><span class="tag '+pt+'">'+esc(r.pri)+'</span></td><td><span class="tag '+st+'">'+esc(r.st)+'</span></td></tr>';
  }
  return '<div class="grid g4" style="margin-bottom:16px">'+
    kpi("edit_note","本月申請單","86","+14 vs 上月","up")+
    kpi("bolt","急件占比","23%","4 張待處理","flat")+
    kpi("category","調撥品項數","1,240","涵蓋 7 大類","flat")+
    kpi("schedule","平均送審耗時","3.4 hr","目標 ≤ 4 hr","up")+
  '</div>'+
  '<div class="grid g32">'+
    '<div class="card"><h3><span class="material-symbols-outlined">list_alt</span>近期調撥申請單</h3>'+
      '<p class="sub">依需求到廠日排序，急件優先處理</p>'+
      '<div style="overflow-x:auto"><table><thead><tr><th>單號</th><th>調出/調入</th><th>品項</th><th>數量</th><th>需求到廠</th><th>優先</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '</div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">assignment_add</span>新增調撥單</h3>'+
      '<p class="sub">快速填報跨廠調撥需求</p>'+
      formRow("factory","調出廠","桃園廠")+
      formRow("warehouse","調入廠","台南廠")+
      formRow("inventory_2","品項","鋁擠型 A6063-T5")+
      formRow("tag","數量","1,200 支")+
      formRow("event","需求到廠日","2026-08-18")+
      '<div class="alert" style="margin-top:14px"><span class="material-symbols-outlined">check_circle</span><div><div class="h">庫存可撥檢核通過</div><div class="d">調出廠現有可用量 1,860 支，滿足本次調撥需求。</div></div></div>'+
    '</div>'+
  '</div>'+
  '<div class="grid g2" style="margin-top:16px">'+
    '<div class="card"><h3><span class="material-symbols-outlined">insights</span>各廠調撥申請量</h3><p class="sub">近 6 週申請單提交趨勢</p><div class="chartwrap" style="height:230px"><canvas id="c0a"></canvas></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>調撥品類分佈</h3><p class="sub">本月調撥品項占比</p><div class="chartwrap" style="height:230px"><canvas id="c0b"></canvas></div></div>'+
  '</div>';
}
function s0init(){
  charts.c0a=new Chart(el("c0a"),{type:"bar",data:{labels:["W28","W29","W30","W31","W32","W33"],
    datasets:[{label:"桃園廠",data:[12,15,11,18,14,20],backgroundColor:ACC},
      {label:"台南廠",data:[8,10,13,9,12,11],backgroundColor:ACC2},
      {label:"越南廠",data:[5,7,6,9,8,10],backgroundColor:"#d4a35a"}]},
    options:baseOpts({scales:{x:{stacked:true,grid:{display:false},ticks:{font:{size:10}}},y:{stacked:true,grid:{color:"#eee6d8"},ticks:{font:{size:10}}}}})});
  charts.c0b=new Chart(el("c0b"),{type:"doughnut",data:{labels:["原物料","半成品","成品","備品耗材","治具工具"],
    datasets:[{data:[38,24,18,12,8],backgroundColor:[ACC,ACC2,"#d4a35a","#8c6d3f","#c9bda8"],borderWidth:2,borderColor:"#fff"}]},
    options:baseOpts({cutout:"58%",scales:{x:{display:false},y:{display:false}},plugins:{legend:{position:"right",labels:{font:{size:11},color:"#57493a",boxWidth:12}}}})});
}

/* ===== SCREEN 1 : 審核核准 ===== */
function s1(){
  var q=[
    {no:"TR-26082",lv:"廠級核准",item:"銅箔基板 CCL-370",amt:"NT$ 512,000",avail:"充足",risk:"低",wait:"1.2h"},
    {no:"TR-26083",lv:"廠級核准",item:"精密軸承 6204-2RS",amt:"NT$ 96,000",avail:"充足",risk:"低",wait:"0.6h"},
    {no:"TR-26085",lv:"經理核准",item:"連接器 USB-C 24P",amt:"NT$ 288,000",avail:"偏低",risk:"中",wait:"2.8h"},
    {no:"TR-26079",lv:"經理核准",item:"稀土磁石 N52",amt:"NT$ 1,340,000",avail:"不足",risk:"高",wait:"5.1h"}
  ];
  var rows="";
  for(var i=0;i<q.length;i++){var r=q[i];
    var av=r.avail==="充足"?"t-ok":(r.avail==="偏低"?"t-warn":"t-bad");
    var rk=r.risk==="低"?"t-ok":(r.risk==="中"?"t-warn":"t-bad");
    rows+='<tr><td class="mono">'+esc(r.no)+'</td><td><span class="tag t-info">'+esc(r.lv)+'</span></td><td>'+esc(r.item)+
      '</td><td>'+esc(r.amt)+'</td><td><span class="tag '+av+'">'+esc(r.avail)+'</span></td><td><span class="tag '+rk+'">'+esc(r.risk)+
      '</span></td><td>'+esc(r.wait)+'</td><td><span class="tag t-ok">核准</span> <span class="tag t-mut">退回</span></td></tr>';
  }

  {r:s0,i:s0init},{r:s1,i:s1init},{r:s2,i:s2init},{r:s3,i:s3init},{r:s4,i:s4init},{r:s5,i:s5init}
];
function show(i){
  var n=SCR.length;
  if(i<0)i=0;if(i>n-1)i=n-1;
  destroyAll();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  el("scrTitle").textContent=MODS[i].name;
  el("scrDesc").textContent=MODS[i].desc;
  var container=el("screen");
  container.innerHTML=SCR[i].r();
  void container.offsetHeight;
  if(SCR[i].i)SCR[i].i();
  try{window.scrollTo(0,0);}catch(e){}
}
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
