<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>產品零組件來源追溯系統｜Jvision 系統 Demo</title>
  <meta name="description" content="零件掃碼綁定到影響範圍分析的製造系譜追溯全流程" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root{
      --color-primary:#2563eb;
      --color-on-primary:#fff;
      --color-secondary:#3b82f6;
      --color-on-secondary:#000;
      --color-accent:#ea580c;
      --color-on-accent:#000;
      --color-background:#f8fafc;
      --color-foreground:#1e293b;
      --color-card:#fff;
      --color-card-foreground:#1e293b;
      --color-muted:#e9eff8;
      --color-muted-foreground:#475569;
      --color-border:#e2e8f0;
      --color-destructive:#dc2626;
      --color-on-destructive:#fff;
      --color-ring:#2563eb;
      --blue:#2563eb;
      --ink:#1e293b;
      --muted:#475569;
      --line:#e2e8f0;
      --bg:var(--color-background);
      --card:var(--color-card);
      --soft:#eff6ff;
      --ok:#15803d;
      --warn:#b45309;
      --bad:#dc2626;
      --radius:8px;
      --shadow:0 8px 24px rgba(15,23,42,.06);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    html,body{max-width:100%;overflow-x:hidden}
    body{
      font-family:"Fira Sans","Noto Sans TC",system-ui,sans-serif;
      background:
        linear-gradient(rgba(37,99,235,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(37,99,235,.025) 1px,transparent 1px),
        var(--bg);
      background-size:32px 32px;
      color:var(--ink);
      line-height:1.55;
      -webkit-font-smoothing:antialiased;
    }
    button,a,[role="button"]{cursor:pointer}
    button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
      outline:3px solid var(--color-ring);
      outline-offset:3px;
    }
    .material-symbols-outlined{
      font-family:"Material Symbols Outlined";
      font-weight:normal;
      font-style:normal;
      line-height:1;
      letter-spacing:normal;
      text-transform:none;
      display:inline-block;
      white-space:nowrap;
      direction:ltr;
      vertical-align:middle;
    }
    .topbar{
      position:sticky;
      top:0;
      z-index:40;
      background:rgba(255,255,255,.96);
      border-bottom:1px solid var(--line);
      box-shadow:0 4px 18px rgba(15,23,42,.07);
      backdrop-filter:blur(14px);
    }
    .topbar-in{
      max-width:1360px;
      min-height:72px;
      margin:0 auto;
      padding:12px 20px;
      display:flex;
      align-items:center;
      gap:18px;
      flex-wrap:wrap;
    }
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .brand .logo{
      width:42px;
      height:42px;
      border-radius:6px;
      background:var(--color-primary);
      display:grid;
      place-items:center;
      box-shadow:4px 4px 0 #bfdbfe;
      flex:none;
    }
    .brand .logo .material-symbols-outlined{font-size:24px;color:#fff}
    .brand h1{font-size:17px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
    .brand p{font-size:11px;color:var(--muted);font-family:"Fira Code",monospace}
    .topmeta{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .chip{
      background:#fff;
      border:1px solid var(--line);
      color:var(--muted);
      min-height:34px;
      padding:6px 10px;
      border-radius:5px;
      font-size:12px;
      font-weight:500;
      display:inline-flex;
      align-items:center;
      gap:6px;
      white-space:nowrap;
    }
    .chip .material-symbols-outlined{font-size:16px;color:var(--blue)}
    nav.tabs{background:#fff;border-top:1px solid #f1f5f9}
    nav.tabs .tabs-in{
      max-width:1360px;
      margin:0 auto;
      padding:0 20px;
      display:flex;
      overflow-x:auto;
      scrollbar-width:thin;
    }
    nav.tabs button{
      flex:none;
      min-height:48px;
      white-space:nowrap;
      border:0;
      border-bottom:3px solid transparent;
      background:transparent;
      color:#475569;
      padding:10px 15px 8px;
      font-family:inherit;
      font-size:13px;
      font-weight:600;
      display:flex;
      align-items:center;
      gap:7px;
      transition:color .2s ease,background .2s ease,border-color .2s ease;
    }
    nav.tabs button .material-symbols-outlined{font-size:19px}
    nav.tabs button:hover{background:#eff6ff;color:#1d4ed8}
    nav.tabs button.on{color:#1d4ed8;border-bottom-color:var(--blue);background:#eff6ff}
    main{max-width:1360px;margin:0 auto;padding:26px 20px 64px}
    #view{animation:view-in .35s ease both}
    @keyframes view-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .screen-head{
      display:flex;
      align-items:flex-start;
      gap:14px;
      margin-bottom:20px;
      padding-bottom:18px;
      border-bottom:1px solid var(--line);
      flex-wrap:wrap;
    }
    .screen-head .ic{
      width:44px;
      height:44px;
      border-radius:6px;
      background:#eff6ff;
      border:1px solid #bfdbfe;
      display:grid;
      place-items:center;
      flex:none;
    }
    .screen-head .ic .material-symbols-outlined{font-size:24px;color:var(--blue)}
    .screen-head h2{font-size:22px;font-weight:700;letter-spacing:-.02em}
    .screen-head p{font-size:13px;color:var(--muted);margin-top:2px}
    .screen-head .tag{
      margin-left:auto;
      align-self:center;
      font-size:11px;
      color:#1e40af;
      background:#dbeafe;
      border:1px solid #93c5fd;
      padding:6px 10px;
      border-radius:4px;
      font-family:"Fira Code",monospace;
      font-weight:600;
      white-space:nowrap;
    }
    .grid{display:grid;gap:14px}
    .g-kpi{grid-template-columns:repeat(4,1fr)}
    .g-2{grid-template-columns:1.5fr 1fr}
    .g-2e{grid-template-columns:1fr 1fr}
    .g-3{grid-template-columns:repeat(3,1fr)}
    .g-tree{grid-template-columns:1.15fr .85fr}
    .g-imp{grid-template-columns:.9fr 1.1fr}
    .card,.kpi{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      min-width:0;
      transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;
    }
    .card:hover,.kpi:hover{border-color:#bfdbfe;box-shadow:0 10px 28px rgba(37,99,235,.09)}
    .card{padding:17px}
    .card.pad0{padding:0;overflow:hidden}
    .card-h{display:flex;align-items:center;gap:8px;margin-bottom:13px;flex-wrap:wrap}
    .card-h h3{font-size:15px;font-weight:700}
    .card-h .material-symbols-outlined{font-size:19px;color:var(--blue)}
    .card-h .sub{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
    .kpi{padding:16px 16px 15px;border-top:3px solid var(--blue)}
    .kpi .lab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px}
    .kpi .lab .material-symbols-outlined{font-size:18px;color:var(--blue)}
    .kpi .val{
      font-family:"Fira Code",monospace;
      font-size:27px;
      line-height:1.25;
      font-weight:700;
      margin-top:9px;
      letter-spacing:-.04em;
      font-variant-numeric:tabular-nums;
    }
    .kpi .val small{font-family:"Fira Sans",sans-serif;font-size:13px;font-weight:600;color:var(--muted);margin-left:4px}
    .kpi .dt{font-size:11px;margin-top:7px;font-weight:600;display:flex;align-items:center;gap:4px}
    .kpi .dt.up{color:var(--ok)}.kpi .dt.down{color:var(--bad)}.kpi .dt.flat{color:var(--muted)}
    table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
    thead th{
      text-align:left;
      font-size:11px;
      color:#334155;
      font-weight:700;
      padding:11px 12px;
      border-bottom:2px solid #cbd5e1;
      background:#f1f5f9;
      white-space:nowrap;
      letter-spacing:.04em;
    }
    tbody td{padding:11px 12px;border-bottom:1px solid #edf2f7;white-space:nowrap}
    tbody tr:nth-child(even){background:#fbfdff}
    tbody tr:hover{background:#eff6ff}
    td:nth-child(n+5){font-variant-numeric:tabular-nums}
    .mono{
      font-family:"Fira Code",monospace;
      font-weight:500;
      letter-spacing:0;
      font-variant-numeric:tabular-nums;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      gap:5px;
      padding:4px 8px;
      border-radius:4px;
      border:1px solid transparent;
      font-size:11px;
      line-height:1.2;
      font-weight:700;
      white-space:nowrap;
    }
    .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
    .b-ok{background:#ecfdf3;color:#166534;border-color:#bbf7d0}
    .b-warn{background:#fffbeb;color:#92400e;border-color:#fde68a}
    .b-bad{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
    .b-info{background:#eff6ff;color:#1e40af;border-color:#bfdbfe}
    .b-mut{background:#f1f5f9;color:#475569;border-color:#cbd5e1}
    .chart{width:100%;height:280px}.chart.sm{height:230px}
    .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .scanrow{
      display:flex;
      align-items:center;
      gap:12px;
      padding:12px;
      border:1px solid var(--line);
      border-radius:6px;
      background:#fff;
      margin-bottom:9px;
      min-width:0;
      transition:border-color .2s ease,background .2s ease;
    }
    .scanrow:hover{border-color:#93c5fd;background:#f8fbff}
    .scanrow .qic{
      width:40px;height:40px;border-radius:5px;background:#eff6ff;border:1px solid #bfdbfe;
      display:grid;place-items:center;flex:none;
    }
    .scanrow .qic .material-symbols-outlined{font-size:23px;color:var(--blue)}
    .scanrow .info{min-width:0;flex:1}
    .scanrow .info .t{font-weight:700;font-size:14px}
    .scanrow .info .s{font-size:12px;color:var(--muted)}
    .scanrow .rt{text-align:right;flex:none}
    .scanrow .rt .n{font:11px "Fira Code",monospace;color:var(--muted)}
    .prog{height:8px;background:#dbe4f0;border-radius:2px;overflow:hidden;margin-top:6px}
    .prog>span{display:block;height:100%;background:var(--blue)}
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .col{background:#f8fafc;border:1px solid var(--line);border-radius:6px;padding:10px;min-width:0}
    .col>.ch{font-size:12px;font-weight:700;color:#334155;display:flex;align-items:center;justify-content:space-between;padding:4px 4px 9px}
    .col>.ch b{background:#fff;border:1px solid #bfdbfe;border-radius:4px;padding:1px 7px;font:600 11px "Fira Code";color:#1d4ed8}
    .tk{background:#fff;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:5px;padding:9px 10px;margin-bottom:8px}
    .tk .k{font:600 13px "Fira Code",monospace}
    .tk .m{font-size:11px;color:var(--muted);margin-top:3px;white-space:normal}
    .tk .f{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
    .tree{font-size:13px;padding:4px 0}
    .tnode{
      display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:5px;
      margin:4px 0;border:1px solid var(--line);background:#fff;min-width:0;
    }
    .tnode .tc{width:30px;height:30px;border-radius:4px;display:grid;place-items:center;flex:none}
    .tnode .tc .material-symbols-outlined{font-size:18px}
    .tnode .tt{min-width:0;flex:1}
    .tnode .tt b{font-size:13px}.tnode .tt span{font-size:11px;color:var(--muted);display:block}
    .lv1{margin-left:0}.lv2{margin-left:26px}.lv3{margin-left:52px}
    .tnode.root{border-color:#60a5fa;background:#eff6ff}
    .tnode.root .tc{background:var(--blue)}.tnode.root .tc .material-symbols-outlined{color:#fff}
    .tnode.sub .tc{background:#dbeafe}.tnode.sub .tc .material-symbols-outlined{color:#1d4ed8}
    .tnode.leaf .tc{background:#f1f5f9}.tnode.leaf .tc .material-symbols-outlined{color:#475569}
    .tnode.flag{border-color:#f59e0b;background:#fffbeb}
    .spread{border:1px solid var(--line);border-radius:6px;overflow:hidden}
    .spread .sh{background:#fef2f2;padding:11px 14px;display:flex;align-items:center;gap:9px;border-bottom:1px solid #fecaca}
    .spread .sh .material-symbols-outlined{color:var(--bad)}
    .spread .row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid #edf2f7;min-width:0}
    .spread .row:last-child{border-bottom:none}
    .spread .row .lv{font:700 10px "Fira Code";padding:3px 7px;border-radius:3px;background:#dbeafe;color:#1e40af;flex:none}
    .spread .row .x{min-width:0;flex:1}
    .spread .row .x b{font-size:13px}.spread .row .x span{font-size:11px;color:var(--muted);display:block}
    .tl{position:relative;padding-left:26px}
    .tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
    .tli{position:relative;padding:0 0 16px}
    .tli::before{content:"";position:absolute;left:-21px;top:3px;width:12px;height:12px;border-radius:2px;background:#fff;border:3px solid var(--blue)}
    .tli.done::before{background:var(--ok);border-color:var(--ok)}
    .tli.now::before{background:#f59e0b;border-color:#92400e}
    .tli .tt{font-weight:700;font-size:13px}
    .tli .tm{font:11px "Fira Code",monospace;color:var(--muted)}
    .tli .td{font-size:12px;color:#475569;margin-top:3px}
    .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
    .legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:middle}
    .mini{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
    .mini .m{flex:1;min-width:120px;background:#f8fafc;border:1px solid var(--line);border-radius:5px;padding:11px 13px}
    .mini .m .l{font-size:11px;color:var(--muted);font-weight:600}
    .mini .m .v{font:700 19px "Fira Code",monospace;margin-top:2px}
    @media(max-width:1024px){
      .topmeta .chip:nth-child(2){display:none}
      .g-2,.g-tree,.g-imp{grid-template-columns:1fr}
    }
    @media(max-width:820px){
      .g-kpi{grid-template-columns:1fr 1fr}
      .g-2e,.g-3{grid-template-columns:1fr}
      .board{grid-template-columns:1fr 1fr}
      main{padding:22px 16px 54px}
      .topbar-in,nav.tabs .tabs-in{padding-left:16px;padding-right:16px}
    }
    @media(max-width:560px){
      .topbar-in{gap:10px;min-height:auto}
      .topmeta{width:100%;margin-left:0}
      .topmeta .chip{flex:1}
      .topmeta .chip:nth-child(2),.topmeta .chip:nth-child(3){display:none}
      .brand h1{font-size:15px}
      .brand p{font-size:10px}
      nav.tabs button{min-width:48px;justify-content:center;padding:10px 14px}
      .hide-sm{display:none}
      .g-kpi,.board{grid-template-columns:1fr}
      .screen-head .tag{margin-left:58px}
      .screen-head h2{font-size:20px}
      .card{padding:14px}
      .scanrow{align-items:flex-start}
      .scanrow .rt{max-width:85px}
      .lv2{margin-left:14px}.lv3{margin-left:28px}
    }
    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*::before,*::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
        scroll-behavior:auto!important;
      }
      #view{animation:none}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">account_tree</span></div>
        <div>
          <h1>產品零組件來源追溯系統</h1>
          <p>Genealogy Tracking System · MES 追溯模組</p>
        </div>
      </div>
      <div class="topmeta">
        <span class="chip"><span class="material-symbols-outlined">factory</span>第二廠 · 組裝線</span>
        <span class="chip"><span class="material-symbols-outlined">badge</span>品保工程師 陳彥廷</span>
        <span class="chip"><span class="material-symbols-outlined">schedule</span>2026-08-14 09:42</span>
      </div>
    </div>
    <nav class="tabs" aria-label="追溯系統功能">
      <div class="tabs-in" id="tabs"></div>
    </nav>
  </header>
  <main><div id="view"></div></main>

  <script>
  (function(){
    "use strict";
    var MODS=[
      {icon:"qr_code_scanner",name:"零件掃碼綁定",desc:"序號 / 批號掃碼登錄與供應商來源綁定"},
      {icon:"account_tree",name:"組裝關聯建立",desc:"父子件多階層 BOM 組裝關聯建檔"},
      {icon:"hub",name:"系譜樹查詢",desc:"成品向下展開、零件向上追溯樹狀系譜"},
      {icon:"manage_search",name:"異常批次查詢",desc:"依批號 / 供應商 / 日期定位受影響零件"},
      {icon:"share",name:"影響範圍分析",desc:"受牽連成品、客戶與出貨的擴散範圍評估"},
      {icon:"fact_check",name:"召回與稽核",desc:"召回清單產生、追溯履歷與稽核佐證"}
    ];
    var view=document.getElementById("view");
    var chart=null;
    function el(id){return document.getElementById(id)}
    function head(i,tag){
      return '<div class="screen-head"><div class="ic"><span class="material-symbols-outlined">'+MODS[i].icon+'</span></div><div><h2>'+MODS[i].name+'</h2><p>'+MODS[i].desc+'</p></div><span class="tag">'+tag+'</span></div>'
    }
    function kpi(lab,ic,val,unit,dir,dt){
      var cls=dir==="up"?"up":dir==="down"?"down":"flat";
      var arw=dir==="up"?"trending_up":dir==="down"?"trending_down":"trending_flat";
      return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+ic+'</span>'+lab+'</div><div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div><div class="dt '+cls+'"><span class="material-symbols-outlined" style="font-size:15px">'+arw+'</span>'+dt+'</div></div>'
    }
    function initChart(id,opt){
      var dom=el(id);if(!dom)return;
      if(chart){try{chart.dispose()}catch(e){}chart=null}
      chart=echarts.init(dom);
      chart.setOption(opt);
    }
    var AXBASE={
      grid:{left:8,right:14,top:28,bottom:8,containLabel:true},
      tooltip:{trigger:"axis",backgroundColor:"#1e293b",borderWidth:0,textStyle:{color:"#fff",fontSize:12}},
      textStyle:{fontFamily:"Fira Sans"}
    };

    function v0(){
      var feed=[
        {t:"RM-鋁擠型 6063-T5",s:"批 LOT-AL-260814-07 · 立群金屬",n:"09:41:22",st:"b-ok",stx:"已綁定"},
        {t:"PCBA-主控板 v3.2",s:"序 SN-PCBA-88213 · 邦O電子",n:"09:40:58",st:"b-ok",stx:"已綁定"},
        {t:"軸承 6204-ZZ",s:"批 LOT-BR-260813-31 · NSK 台灣",n:"09:39:11",st:"b-warn",stx:"待複驗"},
        {t:"密封圈 NBR-24",s:"批 LOT-SE-260814-02 · 泓瀚橡膠",n:"09:37:45",st:"b-ok",stx:"已綁定"},
        {t:"步進馬達 42BYG",s:"序 SN-MT-40021 · 東方馬達",n:"09:36:03",st:"b-bad",stx:"來源不符"}
      ];
      var rows=feed.map(function(f){
        return '<div class="scanrow"><div class="qic"><span class="material-symbols-outlined">qr_code_2</span></div><div class="info"><div class="t">'+f.t+'</div><div class="s">'+f.s+'</div></div><div class="rt"><span class="badge '+f.st+'">'+f.stx+'</span><div class="n" style="margin-top:5px">'+f.n+'</div></div></div>'

      for(var b=0;b<btns.length;b++){
        var active=+btns[b].getAttribute("data-i")===i;
        btns[b].classList.toggle("on",active);
        btns[b].setAttribute("aria-current",active?"page":"false");
      }
      SCREENS[i]();
    }
    for(var b=0;b<btns.length;b++){
      btns[b].addEventListener("click",function(){
        var i=+this.getAttribute("data-i");
        if(location.hash!=="#v"+i)location.hash="v"+i;
        else show(i);
        try{window.scrollTo(0,0)}catch(e){}
      });
    }
    window.addEventListener("resize",function(){if(chart)chart.resize()});
    function fromHash(){
      var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
      if(!m){show(0);return}
      var n=document.querySelectorAll("[data-i]").length||6;
      show(Math.min(+m[1],n-1));
      try{window.scrollTo(0,0)}catch(e){}
    }
    window.addEventListener("hashchange",fromHash);
    fromHash();
  })();
  </script>
</body>
</html>
