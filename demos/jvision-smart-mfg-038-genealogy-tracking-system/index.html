<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>系譜追溯系統（Genealogy Tracking System）｜Jvision 系統 Demo</title>
  <meta name="description" content="零件掃碼綁定到影響範圍分析的製造系譜追溯全流程" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root{
      --accent:#0369a1;--accent2:#38bdf8;--ink:#0f172a;--muted:#64748b;
      --line:#e2e8f0;--bg:#f1f5f9;--card:#ffffff;--soft:#f0f9ff;
      --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--radius:16px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{max-width:100%;overflow-x:hidden}
    body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
    .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;vertical-align:middle}
    /* top nav */
    .topbar{position:sticky;top:0;z-index:40;background:linear-gradient(100deg,#075985,#0369a1 55%,#0284c7);color:#fff;box-shadow:0 6px 18px rgba(3,105,161,.25)}
    .topbar-in{max-width:1360px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
    .brand{display:flex;align-items:center;gap:11px;min-width:0}
    .brand .logo{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;border:1px solid rgba(255,255,255,.28)}
    .brand .logo .material-symbols-outlined{font-size:24px;color:#e0f2fe}
    .brand h1{font-size:16px;font-weight:800;letter-spacing:.2px;white-space:nowrap}
    .brand p{font-size:11px;color:#bae6fd;font-weight:500}
    .topmeta{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);color:#e0f2fe;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;white-space:nowrap}
    .chip .material-symbols-outlined{font-size:16px}
    nav.tabs{background:#082f49;border-top:1px solid rgba(255,255,255,.08)}
    nav.tabs .tabs-in{max-width:1360px;margin:0 auto;padding:8px 12px;display:flex;gap:8px;flex-wrap:wrap}
    nav.tabs button{flex:none;white-space:nowrap;min-width:0;cursor:pointer;border:1px solid transparent;background:rgba(255,255,255,.06);color:#cbd5e1;padding:8px 14px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;transition:.15s}
    nav.tabs button .material-symbols-outlined{font-size:18px}
    nav.tabs button:hover{background:rgba(255,255,255,.12);color:#fff}
    nav.tabs button.on{background:linear-gradient(120deg,#38bdf8,#0ea5e9);color:#04263a;border-color:#7dd3fc;box-shadow:0 4px 12px rgba(56,189,248,.35)}
    main{max-width:1360px;margin:0 auto;padding:22px 18px 60px}
    .screen-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap}
    .screen-head .ic{width:46px;height:46px;border-radius:13px;background:var(--soft);border:1px solid #bae6fd;display:grid;place-items:center;flex:none}
    .screen-head .ic .material-symbols-outlined{font-size:26px;color:var(--accent)}
    .screen-head h2{font-size:21px;font-weight:800}
    .screen-head p{font-size:13px;color:var(--muted);margin-top:2px}
    .screen-head .tag{margin-left:auto;align-self:center;font-size:12px;color:var(--accent);background:var(--soft);border:1px solid #bae6fd;padding:6px 12px;border-radius:999px;font-weight:700;white-space:nowrap}
    /* grids */
    .grid{display:grid;gap:14px}
    .g-kpi{grid-template-columns:repeat(4,1fr)}
    .g-2{grid-template-columns:1.5fr 1fr}
    .g-2e{grid-template-columns:1fr 1fr}
    .g-3{grid-template-columns:repeat(3,1fr)}
    .g-tree{grid-template-columns:1.15fr .85fr}
    .g-imp{grid-template-columns:.9fr 1.1fr}
    @media(max-width:820px){
      .g-kpi{grid-template-columns:1fr 1fr}
      .g-2,.g-2e,.g-3,.g-tree,.g-imp{grid-template-columns:1fr}
    }
    @media(max-width:520px){ .g-kpi{grid-template-columns:1fr} }
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
    .card.pad0{padding:0;overflow:hidden}
    .card-h{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
    .card-h h3{font-size:15px;font-weight:800}
    .card-h .material-symbols-outlined{font-size:19px;color:var(--accent)}
    .card-h .sub{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
    /* kpi */
    .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;min-width:0;position:relative;overflow:hidden}
    .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,#38bdf8,#0369a1)}
    .kpi .lab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
    .kpi .lab .material-symbols-outlined{font-size:17px;color:var(--accent)}
    .kpi .val{font-size:27px;font-weight:900;margin-top:6px;letter-spacing:-.5px}
    .kpi .val small{font-size:13px;font-weight:700;color:var(--muted);margin-left:3px}
    .kpi .dt{font-size:11px;margin-top:5px;font-weight:600;display:flex;align-items:center;gap:3px}
    .kpi .dt.up{color:var(--ok)} .kpi .dt.down{color:var(--bad)} .kpi .dt.flat{color:var(--muted)}
    /* table */
    table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
    thead th{text-align:left;font-size:11px;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:2px solid var(--line);background:#f8fafc;white-space:nowrap;letter-spacing:.3px}
    tbody td{padding:10px 12px;border-bottom:1px solid #eef2f7;white-space:nowrap}
    tbody tr:hover{background:#f8fbff}
    .mono{font-family:"Inter",monospace;font-weight:600;letter-spacing:.3px}
    .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
    .b-ok{background:#dcfce7;color:#15803d} .b-warn{background:#fef3c7;color:#b45309}
    .b-bad{background:#fee2e2;color:#b91c1c} .b-info{background:#e0f2fe;color:#0369a1}
    .b-mut{background:#e2e8f0;color:#475569}
    .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}
    .chart{width:100%;height:280px}
    .chart.sm{height:230px}
    .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
    /* module 0: scan feed cards */
    .scanrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:var(--card);margin-bottom:10px;min-width:0}
    .scanrow .qic{width:42px;height:42px;border-radius:11px;background:var(--soft);border:1px solid #bae6fd;display:grid;place-items:center;flex:none}
    .scanrow .qic .material-symbols-outlined{font-size:24px;color:var(--accent)}
    .scanrow .info{min-width:0;flex:1}
    .scanrow .info .t{font-weight:800;font-size:14px}
    .scanrow .info .s{font-size:12px;color:var(--muted)}
    .scanrow .rt{text-align:right;flex:none}
    .scanrow .rt .n{font-size:12px;color:var(--muted)}
    .prog{height:9px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:6px}
    .prog>span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#38bdf8,#0369a1)}
    /* module 1: assembly board */
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    @media(max-width:820px){.board{grid-template-columns:1fr 1fr}}
    @media(max-width:520px){.board{grid-template-columns:1fr}}
    .col{background:#f8fafc;border:1px solid var(--line);border-radius:13px;padding:10px;min-width:0}
    .col>.ch{font-size:12px;font-weight:800;color:#334155;display:flex;align-items:center;justify-content:space-between;padding:4px 4px 8px}
    .col>.ch b{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--accent)}
    .tk{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;padding:9px 10px;margin-bottom:8px}
    .tk .k{font-weight:800;font-size:13px}
    .tk .m{font-size:11px;color:var(--muted);margin-top:3px;white-space:normal}
    .tk .f{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
    /* module 2: genealogy tree */
    .tree{font-size:13px;padding:4px 0}
    .tnode{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;margin:4px 0;border:1px solid var(--line);background:#fff;min-width:0}
    .tnode .tc{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
    .tnode .tc .material-symbols-outlined{font-size:18px}
    .tnode .tt{min-width:0;flex:1}
    .tnode .tt b{font-size:13px} .tnode .tt span{font-size:11px;color:var(--muted);display:block}
    .lv1{margin-left:0}.lv2{margin-left:26px}.lv3{margin-left:52px}
    .tnode.root{border-color:#0369a1;background:var(--soft)}
    .tnode.root .tc{background:#0369a1} .tnode.root .tc .material-symbols-outlined{color:#fff}
    .tnode.sub .tc{background:#e0f2fe} .tnode.sub .tc .material-symbols-outlined{color:#0369a1}
    .tnode.leaf .tc{background:#f1f5f9} .tnode.leaf .tc .material-symbols-outlined{color:#64748b}
    .tnode.flag{border-color:#f59e0b;background:#fffbeb}
    /* module 4: impact spread list */
    .spread{border:1px solid var(--line);border-radius:12px;overflow:hidden}
    .spread .sh{background:#fef2f2;padding:11px 14px;display:flex;align-items:center;gap:9px;border-bottom:1px solid #fecaca}
    .spread .sh .material-symbols-outlined{color:var(--bad)}
    .spread .row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid #eef2f7;min-width:0}
    .spread .row:last-child{border-bottom:none}
    .spread .row .lv{font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;background:#e0f2fe;color:#0369a1;flex:none}
    .spread .row .x{min-width:0;flex:1}
    .spread .row .x b{font-size:13px}.spread .row .x span{font-size:11px;color:var(--muted);display:block}
    /* module 5: recall / audit timeline */
    .tl{position:relative;padding-left:26px}
    .tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
    .tli{position:relative;padding:0 0 16px 0}
    .tli::before{content:"";position:absolute;left:-21px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
    .tli.done::before{background:var(--ok);border-color:var(--ok)}
    .tli.now::before{background:var(--warn);border-color:var(--warn)}
    .tli .tt{font-weight:800;font-size:13px}
    .tli .tm{font-size:12px;color:var(--muted)}
    .tli .td{font-size:12px;color:#475569;margin-top:3px}
    .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
    .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
    .mini{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
    .mini .m{flex:1;min-width:120px;background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:11px 13px}
    .mini .m .l{font-size:11px;color:var(--muted);font-weight:600}
    .mini .m .v{font-size:19px;font-weight:900;margin-top:2px}
    .foot{margin-top:26px;text-align:center;font-size:12px;color:#94a3b8}
    @media(max-width:560px){ .hide-sm{display:none} nav.tabs button{padding:8px 11px} }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">account_tree</span></div>
        <div>
          <h1>系譜追溯系統</h1>
          <p>Genealogy Tracking System · MES 追溯模組</p>
        </div>
      </div>
      <div class="topmeta">
        <span class="chip"><span class="material-symbols-outlined">factory</span>第二廠 · 組裝線</span>
        <span class="chip"><span class="material-symbols-outlined">badge</span>品保工程師 陳彥廷</span>
        <span class="chip"><span class="material-symbols-outlined">schedule</span>2026-08-14 09:42</span>
      </div>
    </div>
    <nav class="tabs">
      <div class="tabs-in" id="tabs"></div>
    </nav>
  </header>
  <main><div id="view"></div></main>

  <script>
  (function(){
    "use strict";
    var MODS=[
      {icon:"qr_code_scanner",name:"零件掃碼綁定",desc:"序號 / 批號掃碼登錄與供應商來源綁定"},
      {icon:"account_tree",name:"組裝關聯建立",desc:"父子件多階層 BOM 組裝關聯建檔"},
      {icon:"hub",name:"系譜樹查詢",desc:"成品向下展開、零件向上追溯樹狀系譜"},
      {icon:"manage_search",name:"異常批次查詢",desc:"依批號 / 供應商 / 日期定位受影響零件"},
      {icon:"share",name:"影響範圍分析",desc:"受牽連成品、客戶與出貨的擴散範圍評估"},
      {icon:"fact_check",name:"召回與稽核",desc:"召回清單產生、追溯履歷與稽核佐證"}
    ];
    var view=document.getElementById("view");
    var chart=null;

    // ---------- helpers ----------
    function el(id){return document.getElementById(id);}
    function head(i,tag){
      return '<div class="screen-head">'+
        '<div class="ic"><span class="material-symbols-outlined">'+MODS[i].icon+'</span></div>'+
        '<div><h2>'+MODS[i].name+'</h2><p>'+MODS[i].desc+'</p></div>'+
        '<span class="tag">'+tag+'</span></div>';
    }
    function kpi(lab,ic,val,unit,dir,dt){
      var cls=dir==="up"?"up":dir==="down"?"down":"flat";
      var arw=dir==="up"?"trending_up":dir==="down"?"trending_down":"trending_flat";
      return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+ic+'</span>'+lab+'</div>'+
        '<div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'+
        '<div class="dt '+cls+'"><span class="material-symbols-outlined" style="font-size:15px">'+arw+'</span>'+dt+'</div></div>';
    }
    function initChart(id,opt){
      var dom=el(id); if(!dom) return;
      if(chart){try{chart.dispose();}catch(e){} chart=null;}
      chart=echarts.init(dom);
      chart.setOption(opt);
    }
    var AXBASE={grid:{left:8,right:14,top:28,bottom:8,containLabel:true},
      tooltip:{trigger:"axis",backgroundColor:"#0f172a",borderWidth:0,textStyle:{color:"#fff",fontSize:12}},
      textStyle:{fontFamily:"Inter,Noto Sans TC"}};

    // ============================================================
    // SCREEN 0 — 零件掃碼綁定 (scan feed + progress + supplier chart)
    // ============================================================
    function v0(){
      var feed=[
        {t:"RM-鋁擠型 6063-T5",s:"批 LOT-AL-260814-07 · 立群金屬",n:"09:41:22",st:"b-ok",stx:"已綁定"},
        {t:"PCBA-主控板 v3.2",s:"序 SN-PCBA-88213 · 華邦電子",n:"09:40:58",st:"b-ok",stx:"已綁定"},
        {t:"軸承 6204-ZZ",s:"批 LOT-BR-260813-31 · NSK 台灣",n:"09:39:11",st:"b-warn",stx:"待複驗"},
        {t:"密封圈 NBR-24",s:"批 LOT-SE-260814-02 · 泓瀚橡膠",n:"09:37:45",st:"b-ok",stx:"已綁定"},
        {t:"步進馬達 42BYG",s:"序 SN-MT-40021 · 東方馬達",n:"09:36:03",st:"b-bad",stx:"來源不符"}
      ];
      var rows=feed.map(function(f){
        return '<div class="scanrow"><div class="qic"><span class="material-symbols-outlined">qr_code_2</span></div>'+
          '<div class="info"><div class="t">'+f.t+'</div><div class="s">'+f.s+'</div></div>'+
          '<div class="rt"><span class="badge '+f.st+'">'+f.stx+'</span><div class="n" style="margin-top:5px">'+f.n+'</div></div></div>';
      }).join("");
      var h=head(0,"進料掃碼作業站");
      h+='<div class="grid g-kpi" style="margin-bottom:14px">'+
        kpi("今日掃碼綁定","qr_code_scanner","1,284","筆","up","較昨日 +8.6%")+
        kpi("綁定成功率","task_alt","98.7","%","up","+0.4pt")+
        kpi("待複驗零件","pending_actions","23","筆","down","-5 筆")+
        kpi("來源異常","report","4","筆","flat","即時攔截")+'</div>';
      h+='<div class="grid g-2">'+
        '<div class="card"><div class="card-h"><span class="material-symbols-outlined">bolt</span><h3>即時掃碼綁定紀錄</h3><span class="sub">每筆自動綁定供應商與進料批</span></div>'+rows+'</div>'+
        '<div class="card"><div class="card-h"><span class="material-symbols-outlined">donut_large</span><h3>供應商進料佔比（今日）</h3></div><div id="c0a" class="chart sm"></div>'+
        '<div class="prog" style="margin-top:6px"><span style="width:98.7%"></span></div>'+
        '<div style="font-size:12px;color:var(--muted);margin-top:6px">綁定完整率 98.7%，4 筆來源不符已凍結入庫。</div></div>'+
        '</div>';
      view.innerHTML=h;
      void view.offsetHeight;
      initChart("c0a",{
        tooltip:{trigger:"item",backgroundColor:"#0f172a",borderWidth:0,textStyle:{color:"#fff"}},
        legend:{bottom:0,itemWidth:10,itemHeight:10,textStyle:{fontSize:11}},
        series:[{type:"pie",radius:["45%","70%"],center:["50%","44%"],avoidLabelOverlap:true,
          itemStyle:{borderColor:"#fff",borderWidth:2},label:{show:false},
          data:[
            {value:412,name:"立群金屬",itemStyle:{color:"#0369a1"}},
            {value:326,name:"華邦電子",itemStyle:{color:"#38bdf8"}},
            {value:248,name:"NSK 台灣",itemStyle:{color:"#0ea5e9"}},
            {value:186,name:"東方馬達",itemStyle:{color:"#7dd3fc"}},
            {value:112,name:"其他",itemStyle:{color:"#cbd5e1"}}
          ]}]
      });
    }

    // ============================================================
    // SCREEN 1 — 組裝關聯建立 (kanban board + station chart)
    // ============================================================
    function v1(){
      var cols=[
        {ch:"待組裝",n:3,items:[
          {k:"WO-26-0812",m:"變頻控制箱 CB-300 × 40",f:'<span class="badge b-info">階層 3</span><span class="badge b-mut">40 件</span>'},
          {k:"WO-26-0819",m:"泵浦模組 PM-120 × 25",f:'<span class="badge b-info">階層 2</span><span class="badge b-mut">25 件</span>'}
        ]},
        {ch:"組裝中",n:2,items:[
          {k:"WO-26-0806",m:"主控機箱 MC-500 × 18",f:'<span class="badge b-warn">綁定中</span><span class="badge b-mut">站 3/5</span>'},
          {k:"WO-26-0808",m:"驅動單元 DU-88 × 60",f:'<span class="badge b-warn">綁定中</span><span class="badge b-mut">站 2/4</span>'}
        ]},
        {ch:"待覆核",n:2,items:[
          {k:"WO-26-0801",m:"感測模組 SM-24 × 120",f:'<span class="badge b-info">關聯 348</span><span class="badge b-mut">品保覆核</span>'}
        ]},
        {ch:"已建檔",n:5,items:[
          {k:"WO-26-0788",m:"電源背板 PB-40 × 80",f:'<span class="badge b-ok">系譜完成</span>'},
          {k:"WO-26-0790",m:"散熱模組 HS-12 × 200",f:'<span class="badge b-ok">系譜完成</span>'}
        ]}
      ];
      var board=cols.map(function(c){
        var tks=c.items.map(function(t){
