<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>運輸管理 TMS｜Jvision 系統 Demo</title>
<meta name="description" content="派車、追蹤、簽收到成本油耗的車隊管理（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Josefin+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --color-primary:#00FF41;
  --color-on-primary:#0F172A;
  --color-secondary:#008F11;
  --color-on-secondary:#000000;
  --color-accent:#FF3333;
  --color-on-accent:#000000;
  --color-background:#0D1117;
  --color-foreground:#E6EDF3;
  --color-card:#182424;
  --color-card-foreground:#E6EDF3;
  --color-muted:#25292F;
  --color-muted-foreground:#A9B5C4;
  --color-border:#46515C;
  --color-destructive:#EF4444;
  --color-on-destructive:#000000;
  --color-ring:#00FF41;
  --blue:#00FF41;
  --ink:#E6EDF3;
  --muted:#A9B5C4;
  --line:#46515C;
  --sky:#00FF41;
  --sky-d:#008F11;
  --cyan:#00FF41;
  --body:#CFD8E3;
  --bg:#0D1117;
  --green:#00FF41;
  --amber:#FFD60A;
  --red:#FF4D4D;
}

*{box-sizing:border-box}
html{color-scheme:dark;scroll-behavior:auto}
html,body{margin:0;min-height:100%}
body{
  font-family:"Josefin Sans","Microsoft JhengHei",sans-serif;
  background-color:var(--color-background);
  background-image:
    linear-gradient(rgba(70,81,92,.22) 1px,transparent 1px),
    linear-gradient(90deg,rgba(70,81,92,.22) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--body);
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,a,[role="button"]{cursor:pointer}
button,input,select,textarea{font:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
::selection{background:var(--color-primary);color:var(--color-on-primary)}
.material-symbols-outlined{
  font-variation-settings:'FILL' 0,'wght' 600,'GRAD' 0,'opsz' 24;
  line-height:1;
}

.top{
  position:sticky;
  top:0;
  z-index:1100;
  color:var(--color-foreground);
  background:#090C10;
  border-bottom:3px solid var(--color-primary);
  box-shadow:8px 8px 0 rgba(0,255,65,.12);
}
.top .bar{
  min-height:66px;
  padding:0 28px;
  display:flex;
  align-items:center;
  gap:22px;
  border-bottom:1px solid var(--color-border);
}
.brand{display:flex;align-items:center;gap:13px;min-width:max-content}
.brand .lg{
  width:44px;
  height:44px;
  display:grid;
  place-content:center;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border:2px solid var(--color-primary);
  border-radius:0;
  box-shadow:5px 5px 0 var(--color-secondary);
}
.brand b{
  display:block;
  color:#FFF;
  font-family:"Cinzel","Microsoft JhengHei",serif;
  font-size:16px;
  font-weight:700;
  letter-spacing:.04em;
}
.brand small{
  display:block;
  margin-top:2px;
  color:var(--color-primary);
  font-size:10px;
  font-weight:700;
  letter-spacing:.18em;
}
.live{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:6px 10px;
  color:var(--color-primary);
  background:#111820;
  border:1px solid var(--color-primary);
  border-radius:0;
  font-family:"Josefin Sans",sans-serif;
  font-size:12px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
}
.live::before{content:"LIVE";color:#FFF;font-size:9px;letter-spacing:.12em}
.live .dot{
  width:9px;
  height:9px;
  background:var(--color-primary);
  border:2px solid #07130B;
  outline:1px solid var(--color-primary);
  border-radius:0;
  animation:pulse 1.8s steps(2,end) infinite;
}
@keyframes pulse{50%{opacity:.35}}
.top .r{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:16px;
  color:var(--color-muted-foreground);
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:12px;
  font-variant-numeric:tabular-nums;
}
.ava{
  width:38px;
  height:38px;
  display:grid;
  place-content:center;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border:1px solid var(--color-primary);
  border-radius:0;
  font-weight:900;
}
.tabs{
  display:flex;
  gap:0;
  padding:0 20px;
  overflow-x:auto;
  scrollbar-color:var(--color-primary) #090C10;
  scrollbar-width:thin;
}
.tabs button{
  min-height:48px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:11px 16px;
  white-space:nowrap;
  color:var(--color-muted-foreground);
  background:transparent;
  border:0;
  border-right:1px solid var(--color-border);
  border-bottom:4px solid transparent;
  border-radius:0;
  font-size:13px;
  font-weight:700;
  letter-spacing:.035em;
  transition:background-color 160ms linear,color 160ms linear;
}
.tabs button:first-child{border-left:1px solid var(--color-border)}
.tabs button .material-symbols-outlined{font-size:19px}
.tabs button:hover{color:#FFF;background:var(--color-muted)}
.tabs button.on{
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-bottom-color:#FFF;
}
.tabs button.on .material-symbols-outlined{color:var(--color-on-primary)}

.body{width:min(100%,1440px);margin:0 auto;padding:28px 30px 56px}
.vh{
  position:relative;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:18px;
  margin-bottom:22px;
  padding:20px 22px 18px;
  background:#0A0E13;
  border:1px solid var(--color-border);
  border-left:8px solid var(--color-primary);
  flex-wrap:wrap;
}
.vh::after{
  content:"OPS / CONTROL";
  position:absolute;
  right:18px;
  bottom:-10px;
  padding:2px 7px;
  color:var(--color-on-primary);
  background:var(--color-primary);
  font:700 9px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:.12em;
}
.vh h2{
  margin:0;
  color:var(--color-foreground);
  font-family:"Cinzel","Microsoft JhengHei",serif;
  font-size:clamp(22px,2.3vw,34px);
  line-height:1.1;
  font-weight:700;
  letter-spacing:.025em;
}
.vh p{margin:7px 0 0;color:var(--color-muted-foreground);font-size:14px;font-weight:500}
.btn{
  min-height:42px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:0 16px;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border:2px solid var(--color-primary);
  border-radius:0;
  box-shadow:5px 5px 0 var(--color-secondary);
  font-size:13px;
  font-weight:700;
  transition:transform 160ms linear,box-shadow 160ms linear,background-color 160ms linear;
}
.btn:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--color-secondary);background:#4AFF70}
.btn:active{transform:translate(5px,5px);box-shadow:none}
.btn.ghost{
  color:var(--color-primary);
  background:#0D1516;
  border:1px solid var(--color-primary);
  box-shadow:3px 3px 0 #064E18;
}
.btn.ghost:hover{color:var(--color-on-primary);background:var(--color-primary)}
.btn .material-symbols-outlined{font-size:18px}

.kpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:0;
  margin-bottom:24px;
  border:1px solid var(--color-border);
  border-top:5px solid var(--color-primary);
  background:#090C10;
}
.kpi{
  position:relative;
  min-width:0;
  padding:20px 20px 18px;
  background:var(--color-card);
  border:0;
  border-right:1px solid var(--color-border);
  border-radius:0;
}
.kpi:last-child{border-right:0}
.kpi:nth-child(even){background:#111C1C}
.kpi .l{
  min-height:22px;
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--color-muted-foreground);
  font-size:12px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
}
.kpi .l .material-symbols-outlined{color:var(--color-primary);font-size:19px}
.kpi .v{
  margin-top:11px;
  color:var(--color-foreground);
  font-family:"Cinzel",ui-monospace,monospace;
  font-size:clamp(28px,3vw,42px);
  font-weight:700;
  line-height:1;
  font-variant-numeric:tabular-nums lining-nums;
  text-align:right;
}
.kpi .v small{margin-left:4px;color:var(--color-muted-foreground);font-family:"Josefin Sans",sans-serif;font-size:12px}
.kpi .d{
  margin-top:10px;
  color:var(--color-primary);
  font-size:12px;
  font-weight:700;
  text-align:right;
}
.kpi .d::before{content:"TREND ";color:#FFF;font-size:9px;letter-spacing:.08em}

.grid{display:grid;gap:22px}.grid>*{min-width:0}
.card{
  position:relative;
  min-width:0;
  padding:20px 22px;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:0;
  box-shadow:8px 8px 0 #070A0D;
}
.card::after{
  content:"";
  position:absolute;
  top:-1px;
  right:-1px;
  width:34px;
  height:7px;
  background:var(--color-primary);
}
.card>h3,.card>div>h3{
  margin:0 0 16px;
  display:flex;
  align-items:center;
  gap:9px;
  color:var(--color-foreground);
  font-family:"Cinzel","Microsoft JhengHei",serif;
  font-size:15px;
  font-weight:700;
  letter-spacing:.025em;
}
.card>h3 .material-symbols-outlined,.card>div>h3 .material-symbols-outlined{color:var(--color-primary);font-size:21px}
.card>h3 .grow{
  min-height:32px;
  margin-left:auto;
  display:inline-flex;
  align-items:center;
  padding:0 8px;
  color:var(--color-primary);
  border:1px solid transparent;
  font-family:"Josefin Sans",sans-serif;
  font-size:12px;
  font-weight:700;
  transition:border-color 160ms linear,background-color 160ms linear;
}
.card>h3 .grow:hover{background:#0D1117;border-color:var(--color-primary)}

.map{
  position:relative;
  height:420px;
  overflow:hidden;
  background:#10191B;
  background-image:linear-gradient(#31403F 1px,transparent 1px),linear-gradient(90deg,#31403F 1px,transparent 1px);
  background-size:44px 44px;
  border:2px solid var(--color-border);
  border-radius:0;
}
.road{position:absolute;background:#263435;box-shadow:0 0 0 1px var(--color-border)}
.map svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pin{position:absolute;z-index:2;display:flex;flex-direction:column;align-items:center;gap:3px;transform:translate(-50%,-50%)}
.pin .mk{
  width:36px;
  height:36px;
  display:grid;
  place-content:center;
  color:#000;
  border:2px solid #000;
  border-radius:0;
  box-shadow:4px 4px 0 rgba(0,0,0,.75);
}
.pin .lb{
  padding:2px 6px;
  color:var(--color-foreground);
  background:#080C0E;
  border:1px solid var(--color-border);
  border-radius:0;
  font:700 10px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;
  white-space:nowrap;
}
.m-run{background:var(--color-primary)}
.m-load{background:var(--amber)}
.m-idle{background:#A9B5C4}
.m-late{background:var(--color-accent)}
.lmap{height:420px;overflow:hidden;border:2px solid var(--color-border);border-radius:0;z-index:0;background:#141C1F}
.leaflet-tile-pane{filter:grayscale(1) invert(.88) hue-rotate(85deg) brightness(.74) contrast(1.18)}
.leaflet-control-zoom a{
  color:var(--color-primary)!important;
  background:#0D1117!important;
  border-color:var(--color-border)!important;
  border-radius:0!important;
}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{
  color:var(--color-foreground);
  background:#101719;
  border-radius:0;
}
.leaflet-popup-content-wrapper{border:1px solid var(--color-primary);box-shadow:5px 5px 0 rgba(0,0,0,.7)}
.map-legend{
  position:absolute;
  left:14px;
  bottom:14px;
  z-index:1000;
  display:flex;
  gap:14px;
  padding:9px 12px;
  color:var(--color-foreground);
  background:rgba(9,12,16,.96);
  border:1px solid var(--color-primary);
  border-radius:0;
  font-size:11px;
  font-weight:700;
  box-shadow:4px 4px 0 rgba(0,0,0,.65);
}
.map-legend span{display:inline-flex;align-items:center;gap:6px}
.map-legend i{width:10px;height:10px;display:inline-block;border:1px solid #FFF;border-radius:0}
.map-legend span:nth-child(1) i{background:var(--color-primary)!important}
.map-legend span:nth-child(2) i{background:var(--amber)!important}
.map-legend span:nth-child(3) i{background:#A9B5C4!important}
.map-legend span:nth-child(4) i{background:var(--color-accent)!important}

.veh,.ord{
  min-height:61px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 4px;
  border-top:1px solid var(--color-border);
  transition:background-color 160ms linear;
}
.veh:first-of-type,.ord:first-of-type{border-top:0}
.veh:hover,.ord:hover{background:#101919}
.veh .ic{
  width:40px;
  height:40px;
  flex:none;
  display:grid;
  place-content:center;
  color:#000;
  border:2px solid #050707;
  border-radius:0;
}
.veh .info{min-width:0;flex:1}
.veh .info b{
  color:var(--color-foreground);
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:13px;
  font-variant-numeric:tabular-nums;
}
.veh .info small,.ord .rt small{display:block;margin-top:3px;color:var(--color-muted-foreground);font-size:12px}
.vst,.tag{
  display:inline-flex;
  align-items:center;
  min-height:25px;
  padding:3px 9px;
  border:1px solid currentColor;
  border-radius:0;
  font-size:11px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
}
.vst::before,.tag::before{content:"■";margin-right:6px;font-size:7px}
.v-run{color:#00FF41;background:#082B13}
.v-load{color:#FFE45E;background:#3A3000}
.v-idle{color:#D5DEE8;background:#30363D}
.v-late{color:#FF8A8A;background:#3D0B0B}
.ord .no{
  width:82px;
  flex:none;
  color:var(--color-primary);
  font:700 12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;
  font-variant-numeric:tabular-nums;
}
.ord .rt{min-width:0;flex:1}
.ord .rt b{color:var(--color-foreground);font-size:13px}

.tbl{
  width:100%;
  border-collapse:collapse;
  color:var(--color-card-foreground);
  font-size:13px;
  font-variant-numeric:tabular-nums lining-nums;
}
.tbl th{
  padding:12px 14px;
  color:#C8D3DF;
  background:#0B1015;
  border:1px solid var(--color-border);
  border-bottom:3px solid var(--color-primary);
  font-size:11px;
  font-weight:700;
  letter-spacing:.09em;
  text-align:left;
  text-transform:uppercase;
  white-space:nowrap;
}
.tbl td{
  padding:13px 14px;
  border:1px solid var(--color-border);
  white-space:nowrap;
}
.tbl tbody tr:nth-child(even) td{background:#111B1B}
.tbl tbody tr:hover td{background:#20302E}
.tbl td:first-child{
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-variant-numeric:tabular-nums;
}
.tbl th:last-child,.tbl td:last-child{text-align:right}
.g-ok{color:#67FF8D;background:#073715}
.g-run{color:#67FF8D;background:#073715}
.chart{width:100%;height:270px;filter:saturate(1.25) contrast(1.08)}
.card small{color:var(--color-muted-foreground)}

@media (max-width:1024px){
  .body{padding:24px 20px 48px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(2){border-right:0}
  .kpi:nth-child(-n+2){border-bottom:1px solid var(--color-border)}
  .grid{grid-template-columns:1fr!important}
}
@media (max-width:768px){
  .top .bar{padding:0 16px;gap:12px}
  .brand small{display:none}
  .live{margin-left:auto}
  .live::before{display:none}
  .top .r{margin-left:0}
  .top .r .clk{display:none}
  .tabs{padding:0}
  .tabs button{min-height:50px;padding:11px 14px}
  .body{padding:18px 14px 40px}
  .vh{padding:17px 16px;margin-bottom:20px}
  .card{padding:17px 15px;box-shadow:5px 5px 0 #070A0D}
  .map,.lmap{height:340px}
  .map-legend{right:10px;left:10px;gap:8px;justify-content:space-between;overflow-x:auto}
}
@media (max-width:480px){
  .top .bar{min-height:60px}
  .brand .lg{width:38px;height:38px;box-shadow:3px 3px 0 var(--color-secondary)}
  .brand b{font-size:14px}
  .ava{display:none}
  .live{padding:5px 7px;font-size:10px}
  .tabs button{flex:0 0 auto;font-size:12px}
  .kpis{grid-template-columns:1fr}
  .kpi,.kpi:nth-child(2){border-right:0;border-bottom:1px solid var(--color-border)}
  .kpi:last-child{border-bottom:0}
  .kpi .v{font-size:32px}
  .vh h2{font-size:23px}
  .card>h3,.card>div>h3{align-items:flex-start;font-size:13px}
  .veh,.ord{align-items:flex-start;flex-wrap:wrap}
  .veh .info{min-width:calc(100% - 54px)}
  .veh .vst{margin-left:52px}
  .ord .no{width:72px}
  .ord .rt{min-width:calc(100% - 88px)}
  .ord .btn{width:100%;margin-left:84px}
  .map,.lmap{height:300px}
}

@media (prefers-reduced-motion:no-preference){
  .kpi,.card,.veh,.ord{animation:ops-in 420ms cubic-bezier(.2,.9,.25,1.3) both}
  .kpi:nth-child(2),.veh:nth-of-type(2),.ord:nth-of-type(2){animation-delay:60ms}
  .kpi:nth-child(3),.veh:nth-of-type(3),.ord:nth-of-type(3){animation-delay:120ms}
  .kpi:nth-child(4),.veh:nth-of-type(4),.ord:nth-of-type(4){animation-delay:180ms}
  .veh:nth-of-type(n+5),.ord:nth-of-type(n+5){animation-delay:240ms}
  @keyframes ops-in{
    from{opacity:0;transform:translateY(16px) scale(.96)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>
<body>
<header class="top">
  <div class="bar"><div class="brand"><span class="lg"><span class="material-symbols-outlined">local_shipping</span></span><div><b>運輸管理 TMS</b><small>FLEET DISPATCH CONTROL</small></div></div>
    <span class="live"><span class="dot"></span>18 車在途</span>
    <div class="r"><span class="clk"><span class="material-symbols-outlined" style="font-size:18px;vertical-align:-4px;">schedule</span> 2026-07-23 09:20</span><span class="ava">調</span></div></div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main class="body" id="view"></main>
<script>
const MODS=[["route","路線調度"],["local_shipping","任務派車"],["my_location","即時追蹤"],["assignment_turned_in","簽收回單"],["local_gas_station","成本油耗"],["ac_unit","冷鏈溫控"]];
const NAMES=["路線調度","任務派車","即時追蹤","簽收回單","成本油耗","冷鏈溫控"];
const DESC=["訂單排程與路線規劃","車輛駕駛指派與路線優化","車隊 GPS 即時位置與狀態","電子簽收與回單管理","油耗與配送成本分析","冷藏車廂溫度監控"];
const KPI=[["派車規劃工時","1","小時/日","−更快"],["準時配送率","99","%","+16%"],["空車率","9.4","%","−更低"],["簽收時效","2","小時","−更即時"]];
const VEH=[["TC-01","王大明","北區 · 12 件","run",25.05,121.55],["TC-02","陳建國","中區 · 8 件","run",24.15,120.68],["TC-03","林志豪","南區 · 冷鏈","load",23.00,120.20],["TC-04","黃俊傑","北區 · 15 件","late",25.01,121.46],["TC-05","張家維","桃園 · 6 件","run",24.99,121.31],["TC-06","李文彬","新竹 · 待命","idle",24.80,120.97],["TC-07","吳志明","台中 · 冷鏈","run",24.14,120.70],["TC-08","劉建宏","高雄 · 10 件","load",22.63,120.30]];
const ORDERS=[["#SO-8801","台北→桃園","一般 · 12 件 · 08:30 前","已派 TC-01"],["#SO-8802","台中→彰化","冷鏈 · 6 件 · 10:00 前","已派 TC-07"],["#SO-8803","台北→新竹","一般 · 20 件 · 12:00 前","待派車"],["#SO-8804","高雄→台南","一般 · 8 件 · 09:00 前","已派 TC-08"],["#SO-8805","桃園→中壢","急件 · 3 件 · 08:00 前","待派車"],["#SO-8806","新竹→竹北","一般 · 15 件 · 14:00 前","待派車"]];
const POD=[["#SO-8790","王大明","台北 內湖","已簽收","08:42"],["#SO-8791","陳建國","台中 西屯","已簽收","09:05"],["#SO-8792","林志豪","台南 東區","異常 · 缺件","09:18"],["#SO-8793","黃俊傑","新北 板橋","已簽收","09:30"],["#SO-8794","張家維","桃園 龜山","已簽收","09:44"],["#SO-8795","吳志明","台中 南屯","配送中","—"]];
const COLD=[["TC-03","南區冷鏈","2.4","−18~5","run"],["TC-07","台中冷鏈","4.1","−18~5","run"],["TC-11","北區冷鏈","6.8","−18~5","warn"]];
const vic=s=>s==="run"?"m-run":s==="load"?"m-load":s==="late"?"m-late":"m-idle";
const vsc=s=>s==="run"?"v-run":s==="load"?"v-load":s==="late"?"v-late":"v-idle";
const vtx=s=>s==="run"?"在途":s==="load"?"裝卸貨":s==="late"?"延遲":"待命";
const kpiRow=()=>`<div class="kpis">${KPI.map(k=>`<div class="kpi"><div class="l"><span class="material-symbols-outlined">monitoring</span>${k[0]}</div><div class="v">${k[1]}<small>${k[2]}</small></div><div class="d">${k[3]}</div></div>`).join("")}</div>`;
function mapHtml(){ return `<div style="position:relative;"><div id="lmap" class="lmap"></div><div class="map-legend"><span><i style="background:#0284c7;"></i>在途</span><span><i style="background:#f59e0b;"></i>裝卸</span><span><i style="background:#94a3b8;"></i>待命</span><span><i style="background:#dc2626;"></i>延遲</span></div></div>`; }
let lmap=null;
function initMap(){
  if(!window.L){const el=document.getElementById("lmap");if(el)el.innerHTML='<div style="padding:40px;text-align:center;color:#7488a0;">地圖載入中…</div>';return;}
  if(lmap){lmap.remove();lmap=null;}
  lmap=L.map("lmap",{zoomControl:true,attributionControl:false,scrollWheelZoom:false}).setView([23.9,120.85],7);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",{maxZoom:18,subdomains:"abcd"}).addTo(lmap);
  const col=s=>s==="run"?"#0284c7":s==="load"?"#f59e0b":s==="late"?"#dc2626":"#94a3b8";
  VEH.forEach(v=>{ const icon=L.divIcon({className:"",iconSize:[30,30],iconAnchor:[15,15],html:`<div style="background:${col(v[3])};width:30px;height:30px;border-radius:10px 10px 10px 3px;display:grid;place-content:center;color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.35);"><span class="material-symbols-outlined" style="font-size:18px;">local_shipping</span></div>`}); L.marker([v[4],v[5]],{icon}).addTo(lmap).bindPopup(`<b>${v[0]}</b> · ${v[1]}<br/>${v[2]} · ${vtx(v[3])}`); });
  L.polyline([[25.05,121.55],[24.99,121.31],[24.80,120.97],[24.15,120.68]],{color:"#0284c7",weight:3,dashArray:"7 7",opacity:.7}).addTo(lmap);
  L.polyline([[22.63,120.30],[23.00,120.20],[24.14,120.70]],{color:"#f59e0b",weight:3,dashArray:"7 7",opacity:.7}).addTo(lmap);
  requestAnimationFrame(()=>{try{lmap.invalidateSize();}catch(e){}});
}
const vehList=(n)=>VEH.slice(0,n||8).map(v=>`<div class="veh"><span class="ic ${vic(v[3])}"><span class="material-symbols-outlined">local_shipping</span></span><div class="info"><b>${v[0]} · ${v[1]}</b><small>${v[2]}</small></div><span class="vst ${vsc(v[3])}">${vtx(v[3])}</span></div>`).join("");
const SCREENS={
 0:()=>kpiRow()+`<div class="grid" style="grid-template-columns:1.6fr 1fr;"><div class="card"><h3><span class="material-symbols-outlined">route</span>今日路線地圖<span class="grow">全螢幕 ›</span></h3>${mapHtml()}</div><div class="card"><h3><span class="material-symbols-outlined">list_alt</span>路線與車輛</h3>${vehList(8)}</div></div>`,
 1:()=>`<div class="grid" style="grid-template-columns:1fr 1.4fr;"><div class="card"><h3><span class="material-symbols-outlined">inbox</span>待派訂單</h3>${ORDERS.map(o=>`<div class="ord"><span class="no">${o[0]}</span><div class="rt"><b>${o[1]}</b><small>${o[2]}</small></div><button class="btn ghost" style="height:30px;padding:0 10px;">${o[3].startsWith("待")?"派車":o[3]}</button></div>`).join("")}</div><div class="card"><h3><span class="material-symbols-outlined">local_shipping</span>車隊可用狀態</h3>${vehList(8)}</div></div>`,
 2:()=>`<div class="card"><h3><span class="material-symbols-outlined">my_location</span>車隊即時位置</h3>${mapHtml()}</div><div class="card" style="margin-top:18px;"><h3><span class="material-symbols-outlined">list</span>即時車況</h3><div style="overflow-x:auto;"><table class="tbl"><thead><tr><th>車號</th><th>駕駛</th><th>路線</th><th>狀態</th><th>ETA</th></tr></thead><tbody>${VEH.map(v=>`<tr><td style="font-weight:800;color:var(--ink);">${v[0]}</td><td>${v[1]}</td><td>${v[2]}</td><td><span class="vst ${vsc(v[3])}">${vtx(v[3])}</span></td><td>${v[3]==="idle"?"—":"+"+(15+v[4]%40)+" 分"}</td></tr>`).join("")}</tbody></table></div></div>`,
 3:()=>`<div class="card" style="padding:0;"><div style="padding:16px 20px 0;"><h3><span class="material-symbols-outlined">assignment_turned_in</span>電子簽收回單</h3></div><div style="overflow-x:auto;"><table class="tbl"><thead><tr><th>單號</th><th>駕駛</th><th>送達地</th><th>狀態</th><th>時間</th></tr></thead><tbody>${POD.map(p=>`<tr><td style="font-weight:800;color:var(--ink);">${p[0]}</td><td>${p[1]}</td><td>${p[2]}</td><td><span class="tag ${p[3].includes("異常")?"":"g-ok"}" style="${p[3].includes("異常")?"background:#fee2e2;color:#991b1b;":""}">${p[3]}</span></td><td>${p[4]}</td></tr>`).join("")}</tbody></table></div></div>`,
 4:()=>kpiRow()+`<div class="grid" style="grid-template-columns:1.5fr 1fr;"><div class="card"><h3><span class="material-symbols-outlined">local_gas_station</span>近 6 週油耗趨勢 (L/100km)</h3><div id="cF" class="chart"></div></div><div class="card"><h3><span class="material-symbols-outlined">pie_chart</span>配送成本結構</h3><div id="cC" class="chart"></div></div></div>`,
 5:()=>`<div class="grid" style="grid-template-columns:1fr 1fr;">${COLD.map((c,i)=>`<div class="card"><h3><span class="material-symbols-outlined" style="color:${c[4]==="warn"?"#dc2626":"var(--sky)"}">ac_unit</span>${c[0]} ${c[1]} · 現溫 ${c[2]}°C ${c[4]==="warn"?'<span class="tag" style="background:#fee2e2;color:#991b1b;margin-left:auto;">超溫</span>':'<span class="tag g-ok" style="margin-left:auto;">正常</span>'}</h3><div id="cT${i}" class="chart" style="height:200px;"></div><small style="color:var(--muted);">設定範圍 ${c[3]}°C</small></div>`).join("")}</div>`
};
let charts=[];
function draw(i){charts.forEach(c=>{try{c.dispose();}catch(e){}});charts=[];if(!window.echarts)return;
 const line=(id,data,color,band)=>{const el=document.getElementById(id);if(!el)return;const c=echarts.init(el);const o={grid:{left:8,right:16,top:18,bottom:8,containLabel:true},tooltip:{trigger:"axis"},xAxis:{type:"category",boundaryGap:false,data:band?["06","08","10","12","14","16"]:["W1","W2","W3","W4","W5","W6"],axisLabel:{color:"#7488a0"}},yAxis:{type:"value",splitLine:{lineStyle:{color:"#e6eef6"}},axisLabel:{color:"#7488a0"}},series:[{type:"line",smooth:true,data,symbolSize:6,itemStyle:{color},lineStyle:{color,width:3},areaStyle:{color:color+"22"}}]};c.setOption(o);charts.push(c);};
 if(i===4){line("cF",[34,33,31,30,29,28],"#0284c7");const el=document.getElementById("cC");if(el){const c=echarts.init(el);c.setOption({tooltip:{trigger:"item"},legend:{bottom:0,textStyle:{fontSize:11}},series:[{type:"pie",radius:["46%","72%"],center:["50%","44%"],itemStyle:{borderColor:"#fff",borderWidth:2},label:{show:false},data:[{name:"油料",value:42,itemStyle:{color:"#0284c7"}},{name:"人力",value:33,itemStyle:{color:"#f59e0b"}},{name:"維修",value:15,itemStyle:{color:"#0891b2"}},{name:"過路費",value:10,itemStyle:{color:"#94a3b8"}}]}]});charts.push(c);}}
 if(i===5){[[2.4,"#0284c7"],[4.1,"#0284c7"],[6.8,"#dc2626"]].forEach((v,idx)=>line("cT"+idx,[v[0]-1.5,v[0]-0.8,v[0],v[0]+0.6,v[0]+0.2,v[0]],v[1],true));}
}
const view=document.getElementById("view"),tabs=document.getElementById("tabs");
tabs.innerHTML=MODS.map((m,i)=>`<button data-i="${i}" class="${i===0?"on":""}"><span class="material-symbols-outlined">${m[0]}</span>${m[1]}</button>`).join("");
function show(i){tabs.querySelectorAll("button").forEach(b=>b.classList.toggle("on",+b.dataset.i===i));view.innerHTML=`<div class="vh"><div><h2>${NAMES[i]}</h2><p>${DESC[i]}</p></div>${i===1?'<button class="btn"><span class="material-symbols-outlined">bolt</span>智慧排程</button>':''}</div>`+SCREENS[i]();draw(i);if(i===0||i===2){initMap();}else if(lmap){lmap.remove();lmap=null;}}
tabs.addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(b)show(+b.dataset.i);});
window.addEventListener("resize",()=>charts.forEach(c=>c.resize()));
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
</body>
</html>
