<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>批號效期管理系統（Lot &amp; Shelf-Life Management）</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#16a34a;--accent2:#4ade80;--accent-d:#15803d;
  --bg:#f2f7f3;--panel:#ffffff;--ink:#0f2417;--muted:#5c6f63;
  --line:#e2ebe4;--soft:#eef5ef;
  --warn:#f59e0b;--danger:#dc2626;--info:#2563eb;--ok:#16a34a;
  --shadow:0 1px 2px rgba(16,42,23,.05),0 8px 24px rgba(16,42,23,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;vertical-align:middle;font-size:20px}
.app{max-width:1400px;margin:0 auto;padding:0 18px 60px}

/* header */
.topbar{display:flex;align-items:center;gap:14px;padding:16px 4px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:var(--shadow);flex:0 0 auto}
.logo .material-symbols-outlined{font-size:24px}
.brand h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.2px}
.brand p{font-size:12px;margin:0;color:var(--muted)}
.topmeta{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted);box-shadow:var(--shadow)}
.chip .material-symbols-outlined{font-size:16px;color:var(--accent)}

/* nav */
.nav{display:flex;gap:8px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:var(--shadow);margin-bottom:18px}
.nav button{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--muted);font-family:inherit;font-size:13.5px;font-weight:600;padding:9px 14px;border-radius:11px;cursor:pointer;min-width:0;transition:.15s}
.nav button .material-symbols-outlined{font-size:19px}
.nav button:hover{background:var(--soft);color:var(--ink)}
.nav button.active{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;box-shadow:0 4px 12px rgba(22,163,74,.28)}
.nav button.active .material-symbols-outlined{color:#fff}

/* screen scaffolding */
.screen-head{margin-bottom:16px}
.screen-head h2{font-size:19px;margin:0 0 4px;font-weight:800;display:flex;align-items:center;gap:9px}
.screen-head h2 .material-symbols-outlined{font-size:22px;color:var(--accent)}
.screen-head p{margin:0;color:var(--muted);font-size:13px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px}
.card-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-bottom:12px}
.card-h .material-symbols-outlined{font-size:19px;color:var(--accent)}
.card-h .sub{margin-left:auto;font-size:12px;font-weight:500;color:var(--muted)}

/* grids */
.grid{display:grid;gap:14px;min-width:0}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.split{grid-template-columns:340px 1fr}
.split-wide{grid-template-columns:1fr 1.35fr}
.grid>*{min-width:0}
@media(max-width:820px){
  .g2,.g3,.g4,.split,.split-wide{grid-template-columns:1fr}
}

/* KPI */
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 15px;box-shadow:var(--shadow);min-width:0}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .lab .material-symbols-outlined{font-size:17px}
.kpi .val{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.kpi .val small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px}
.kpi .delta{font-size:11.5px;font-weight:700;margin-top:4px;display:inline-flex;align-items:center;gap:3px}
.kpi .delta .material-symbols-outlined{font-size:15px}
.up{color:var(--ok)}.down{color:var(--danger)}.flat{color:var(--muted)}
.kpi.bar-l{border-left:4px solid var(--accent)}

/* table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:700;color:var(--muted);font-size:11.5px;letter-spacing:.3px;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--soft)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:#f7fbf8}
.mono{font-family:"Inter",monospace;font-weight:600;letter-spacing:.2px}

/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-ok{background:#dcfce7;color:#15803d}
.b-warn{background:#fef3c7;color:#b45309}
.b-danger{background:#fee2e2;color:#b91c1c}
.b-info{background:#dbeafe;color:#1d4ed8}
.b-mute{background:#eef2f0;color:#556}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}

/* progress */
.prog{height:8px;border-radius:999px;background:var(--soft);overflow:hidden}
.prog > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2))}

/* list pane (signature split) */
.listpane{border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.listpane .lp-h{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px;background:var(--soft)}
.listpane .lp-h .material-symbols-outlined{font-size:18px;color:var(--accent)}
.lp-item{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:5px;transition:.12s}
.lp-item:hover{background:#f7fbf8}
.lp-item.sel{background:linear-gradient(90deg,rgba(22,163,74,.08),transparent);border-left:3px solid var(--accent)}
.lp-item .r1{display:flex;align-items:center;gap:8px}
.lp-item .r1 .lot{font-weight:700;font-size:13px}
.lp-item .r1 .badge{margin-left:auto}
.lp-item .r2{font-size:11.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.detailpane{display:flex;flex-direction:column;gap:14px;min-width:0}
.dp-hero{background:linear-gradient(135deg,#0f2417,#1c3b28);color:#fff;border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.dp-hero .r1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dp-hero .r1 .lot{font-size:20px;font-weight:800}
.dp-hero .meta{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
@media(max-width:560px){.dp-hero .meta{grid-template-columns:1fr 1fr}}
.dp-hero .meta > div{min-width:0}
.dp-hero .meta .k{font-size:11px;color:#9fd8b6;font-weight:600}
.dp-hero .meta .v{font-size:15px;font-weight:800;margin-top:2px}

/* attribute rows */
.attrs{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
@media(max-width:560px){.attrs{grid-template-columns:1fr}}
.attr{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;border-bottom:1px dashed var(--line);padding-bottom:7px}
.attr .k{color:var(--muted);font-weight:600}
.attr .v{font-weight:700;text-align:right}

/* timeline */
.tl{position:relative;padding-left:24px}
.tl:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 16px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-20px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.tl-item.done .tl-dot{background:var(--accent);border-color:var(--accent)}
.tl-item.warn .tl-dot{border-color:var(--warn)}
.tl-t{font-weight:700;font-size:13px}
.tl-s{font-size:12px;color:var(--muted)}
.tl-time{font-size:11px;color:var(--muted);font-weight:600}

/* board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:820px){.board{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.board{grid-template-columns:1fr}}
.col{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
.col-h{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px;padding:2px 4px 10px}
.col-h .cnt{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11px}
.tile{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:9px;box-shadow:0 1px 2px rgba(16,42,23,.04)}
.tile:last-child{margin-bottom:0}
.tile .tt{font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:6px}
.tile .td{font-size:11.5px;color:var(--muted);margin-top:4px}
.tile .tf{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}

/* chart wrap */
.chartwrap{position:relative;width:100%;overflow:hidden}
.h220{height:220px}.h240{height:240px}.h260{height:260px}.h280{height:280px}

/* trace tree */
.tree{display:flex;flex-direction:column;gap:0}
.tnode{display:flex;gap:10px;align-items:flex-start;padding:9px 0}
.tnode .ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:#fff}
.tnode .ico .material-symbols-outlined{font-size:19px}
.tnode .body{min-width:0;flex:1}
.tnode .body .tn-t{font-weight:700;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tnode .body .tn-s{font-size:11.5px;color:var(--muted)}
.tconn{margin-left:16px;border-left:2px dashed var(--line);padding-left:20px}

/* legend / footer */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.foot{margin-top:24px;text-align:center;color:var(--muted);font-size:11.5px}

.hscroll{overflow-x:auto}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--muted)}
.split-note{font-size:11.5px;color:var(--muted);margin-top:8px;display:flex;gap:6px;align-items:center}
.split-note .material-symbols-outlined{font-size:15px;color:var(--accent);flex:0 0 auto}

@media(max-width:560px){
  .nav button span.txt{display:none}
  .nav button{padding:9px 12px}
  .chip .txt{display:none}
}
</style>
</head>

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function pill(txt,cls){return '<span class="badge '+cls+'">'+esc(txt)+'</span>';}
function leftBadge(d){
  if(d<0)return pill("逾期 "+(-d)+" 天","b-danger");
  if(d<=7)return pill("剩 "+d+" 天","b-danger");
  if(d<=30)return pill("剩 "+d+" 天","b-warn");
  if(d<=90)return pill("剩 "+d+" 天","b-info");
  return pill("剩 "+d+" 天","b-ok");
}
var charts={};
function killCharts(){for(var k in charts){try{charts[k].destroy();}catch(e){}}charts={};}
function mkChart(id,cfg){var cv=document.getElementById(id);if(!cv)return;charts[id]=new Chart(cv.getContext("2d"),cfg);}

/* ---------- controller ---------- */
var RENDER=[scr0,scr1,scr2,scr3,scr4,scr5];
function show(i){
  var nav=document.getElementById("nav");
  var btns=nav.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("active",+btns[b].getAttribute("data-i")===i);}
  killCharts();
  var c=document.getElementById("screen");
  c.innerHTML=RENDER[i]();
  void c.offsetHeight;
  initCharts(i);
}

(function buildNav(){
  var nav=document.getElementById("nav");
  nav.innerHTML=NAV.map(function(n){
    return '<button data-i="'+n.i+'"><span class="material-symbols-outlined">'+n.ic+'</span><span class="txt">'+n.t+'</span></button>';
  }).join("");
  var btns=nav.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){(function(bt){bt.addEventListener("click",function(){location.hash="v"+bt.getAttribute("data-i");});})(btns[k]);}
})();

window.show=show;
})();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
