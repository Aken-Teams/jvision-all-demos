<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>批號效期管理系統（Lot &amp; Shelf-Life Management）</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
--color-primary:#334155;--color-on-primary:#fff;--color-secondary:#475569;
--color-on-secondary:#fff;--color-accent:#059669;--color-on-accent:#000;
--color-background:#f8fafc;--color-foreground:#0f172a;--color-card:#fff;
--color-card-foreground:#0f172a;--color-muted:#f2f3f4;
--color-muted-foreground:#475569;--color-border:#e6e8ea;
--color-destructive:#dc2626;--color-on-destructive:#fff;--color-ring:#334155;
--blue:#334155;--ink:#0f172a;--muted:#475569;--line:#e6e8ea;
--warning:#b45309;--info:#2563eb;--success:#047857;
--shadow:0 1px 2px rgba(15,23,42,.05),0 5px 14px rgba(15,23,42,.04)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--ink);font:400 14px/1.55 "Open Sans",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit}
button,[role=button]{cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.app{width:min(1440px,100%);margin:auto;padding:0 22px 48px}
.topbar{min-height:74px;display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:40px;height:40px;display:grid;place-items:center;background:var(--color-primary);color:#fff;border-radius:8px;flex:none}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.brand h1,.screen-head h2,.card-title{font-family:"Poppins","Open Sans",sans-serif}
.brand h1{font-size:16px;line-height:1.3;margin:0;font-weight:600}
.brand p{font-size:11px;margin:2px 0 0;color:var(--muted)}
.meta{display:flex;gap:7px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.chip,.badge,.tag{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-weight:700}
.chip{padding:5px 9px;border:1px solid var(--line);background:#fff;border-radius:6px;font-size:11px;color:var(--muted)}
.chip .icon{width:14px;height:14px;color:var(--color-accent)}
.nav{position:sticky;top:0;z-index:10;display:flex;gap:2px;padding:9px 0;margin-bottom:20px;background:rgba(248,250,252,.96);border-bottom:1px solid var(--line);overflow-x:auto;backdrop-filter:blur(8px)}
.nav button{min-height:40px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);padding:7px 12px;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;white-space:nowrap;transition:color .2s,background .2s,border-color .2s}
.nav button:hover{background:#eef2f5;color:var(--ink)}
.nav button.active{color:var(--color-accent);border-color:var(--color-accent);background:#ecfdf5}
.nav .icon{width:17px;height:17px}
.screen{animation:enter .35s ease-out}
.screen-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:0 0 14px;padding-bottom:13px;border-bottom:1px solid var(--line)}
.screen-head h2{font-size:21px;line-height:1.25;margin:0;font-weight:600;letter-spacing:-.02em}
.screen-head p{max-width:760px;margin:3px 0 0;color:var(--muted);font-size:12px}
.eyebrow{color:var(--color-accent);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.primary{border:1px solid var(--color-accent);border-radius:6px;background:var(--color-accent);color:#fff;padding:9px 13px;font-weight:700;white-space:nowrap;transition:background .2s,transform .2s}
.primary:hover{background:#047857;transform:translateY(-1px)}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.main-grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:12px}
.card,.kpi,.panel{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.card{padding:15px}.kpi{padding:13px 14px;border-top:3px solid var(--color-primary)}
.kpi-label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;font-weight:700}
.kpi-label .icon{width:15px;height:15px}
.kpi-value{font:600 25px/1.2 "Poppins",sans-serif;letter-spacing:-.03em;margin:6px 0 3px;font-variant-numeric:tabular-nums}
.kpi-value small{font:600 11px "Open Sans";color:var(--muted);margin-left:3px}
.delta{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:700}.good{color:var(--success)}.risk{color:#b91c1c}.neutral{color:var(--muted)}
.card-title{display:flex;align-items:center;gap:7px;margin:0 0 12px;font-size:13px;font-weight:600}
.card-title .icon{width:17px;height:17px;color:var(--color-accent)}
.sub{margin-left:auto;color:var(--muted);font:500 10px "Open Sans"}
.list{overflow:hidden}.list-head{padding:12px 14px;background:var(--color-primary);color:#fff;font-weight:700;font-size:12px}
.list-item{padding:11px 13px;border-top:1px solid var(--line);transition:background .2s,border-color .2s}
.list-item:hover{background:#f8fafc}.list-item.selected{background:#ecfdf5;border-left:3px solid var(--color-accent)}
.row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.between{justify-content:space-between}
.small{font-size:11px;color:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums}
.badge{padding:3px 7px;border-radius:4px;font-size:10px;border:1px solid currentColor}
.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ok{color:#047857;background:#ecfdf5}.warn{color:#92400e;background:#fffbeb}.danger{color:#b91c1c;background:#fef2f2}.info{color:#1d4ed8;background:#eff6ff}.mute{color:#475569;background:#f1f5f9}
.hero{background:var(--color-primary);color:#fff;padding:17px;border-radius:8px}
.hero .lot{font:600 19px "Poppins",sans-serif}.hero-data{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:14px}
.hero-data span{display:block;color:#cbd5e1;font-size:10px}.hero-data strong{font-size:12px;font-variant-numeric:tabular-nums}
.stack{display:grid;gap:12px}.attrs{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
.attr{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:11px}
.attr span{color:var(--muted)}.attr strong{text-align:right}
.note{margin-top:11px;padding:9px 10px;background:#f1f5f9;border-left:3px solid var(--color-accent);font-size:11px;color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.column{padding:9px;background:#f8fafc;border:1px solid var(--line);border-radius:7px}
.column-title{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;margin-bottom:8px}
.count{margin-left:auto;padding:1px 6px;border:1px solid var(--line);background:#fff;border-radius:3px}
.tile{padding:9px;margin-top:7px;background:#fff;border:1px solid var(--line);border-radius:6px;transition:transform .2s,border-color .2s}
.tile:hover{transform:translateY(-1px);border-color:#94a3b8}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.chart{height:255px;position:relative}.chart.short{height:220px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:11px;background:#fff}
th{padding:9px;text-align:left;white-space:nowrap;background:#f1f5f9;color:#334155;border-bottom:1px solid #cbd5e1;font-size:10px;letter-spacing:.03em}
td{padding:9px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:#f8fafc}tbody tr:last-child td{border-bottom:0}
td:nth-last-child(-n+5){font-variant-numeric:tabular-nums}
.num{text-align:right;font-variant-numeric:tabular-nums}
.timeline{border-left:2px solid var(--line);margin-left:7px;padding-left:16px}
.event{position:relative;padding:0 0 13px}.event:last-child{padding-bottom:0}
.event:before{content:"";position:absolute;left:-22px;top:4px;width:8px;height:8px;border-radius:50%;background:#fff;border:2px solid var(--color-accent)}
.event.done:before{background:var(--color-accent)}.event.wait:before{border-color:var(--warning)}
.event strong{font-size:11px}.event p{margin:1px 0;color:var(--muted);font-size:10px}
.tree-node{display:grid;grid-template-columns:32px 1fr;gap:10px;padding:9px 0;position:relative}
.tree-node:not(:last-child):after{content:"";position:absolute;left:15px;top:40px;bottom:-4px;border-left:1px dashed #94a3b8}
.tree-icon{width:32px;height:32px;border-radius:6px;background:var(--color-primary);color:#fff;display:grid;place-items:center}
.tree-icon .icon{width:16px;height:16px}.tree-node p{margin:2px 0;color:var(--muted);font-size:10px}
.rule{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--line);font-size:11px}
.rule:last-child{border-bottom:0}.tag{padding:2px 6px;border-radius:3px;background:#f1f5f9;color:#334155;font-size:9px}
.footer{text-align:center;color:var(--muted);font-size:10px;margin-top:25px;padding-top:16px;border-top:1px solid var(--line)}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1024px){.g4{grid-template-columns:repeat(2,1fr)}.main-grid,.g2{grid-template-columns:1fr}.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.app{padding:0 12px 34px}.topbar{align-items:flex-start;padding:12px 0}.meta{width:100%;justify-content:flex-start}.chip:nth-child(2){display:none}.nav button{padding:7px 10px}.nav .label{display:none}.screen-head{align-items:flex-start}.screen-head .primary{display:none}.g4,.board,.attrs{grid-template-columns:1fr}.hero-data{grid-template-columns:1fr 1fr}.kpi-value{font-size:22px}.card{padding:12px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important;transform:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
<symbol id="box" viewBox="0 0 24 24"><path d="m4 7 8-4 8 4-8 4-8-4Zm0 0v10l8 4 8-4V7M12 11v10"/></symbol>
<symbol id="alert" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 9v4m0 3h.01"/></symbol>
<symbol id="rule" viewBox="0 0 24 24"><path d="M4 6h10M4 12h7M4 18h10m3-8 2 2 3-4m-5 8 2 2 3-4"/></symbol>
<symbol id="shield" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.4 8 8 9 4.6-1 8-4 8-9V6l-8-3Z"/><path d="m9 12 2 2 4-5"/></symbol>
<symbol id="tree" viewBox="0 0 24 24"><path d="M6 4v12m0-8h7m0 0v8m0-4h5m0 0v5"/><circle cx="6" cy="19" r="2"/><circle cx="13" cy="19" r="2"/><circle cx="18" cy="19" r="2"/></symbol>
<symbol id="chart" viewBox="0 0 24 24"><path d="M4 20V10m6 10V4m6 16v-7m5 7H2"/></symbol>
<symbol id="warehouse" viewBox="0 0 24 24"><path d="m3 9 9-6 9 6v11H3V9Zm4 11v-7h10v7M7 9h.01M12 9h.01M17 9h.01"/></symbol>
<symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="truck" viewBox="0 0 24 24"><path d="M3 6h11v11H3V6Zm11 4h4l3 3v4h-7v-7Z"/><circle cx="7" cy="19" r="2"/><circle cx="18" cy="19" r="2"/></symbol>
</svg>
<div class="app">
<header class="topbar">
<div class="brand"><div class="logo"><svg class="icon"><use href="#box"/></svg></div><div><h1>批號效期管理系統</h1><p>Lot &amp; Shelf-Life Management ・ WMS 倉儲管理系統</p></div></div>
<div class="meta">
<span class="chip"><svg class="icon"><use href="#warehouse"/></svg>中央倉 WH-01</span>
<span class="chip"><svg class="icon"><use href="#rule"/></svg>FEFO 規則生效</span>
<span class="chip"><svg class="icon"><use href="#clock"/></svg>2026/08/14</span>
</div>
</header>
<nav class="nav" id="nav" aria-label="主要功能"></nav>
<main id="screen"></main>
<footer class="footer">批號效期管理系統（Lot &amp; Shelf-Life Management）・ 純前端展示頁 ・ 資料為模擬示意</footer>
</div>
<script>
"use strict";
(function(){
const icons=["box","alert","rule","shield","tree","chart"];
const navs=["批號入庫登記","效期到期預警","FEFO 出庫排序","隔離報廢處置","批號追溯譜系","效期損耗分析"];
const desc=[
"收貨掃碼綁定批號、製造日與有效期限，系統自動計算剩餘效期並歸位對應儲區",
"近效期料件依剩餘天數自動分級，推播待辦給負責人並提示優先消化或處置",
"依先到期先出規則自動排定揀貨批號順序，避免舊批壓庫並確保先出將到期料件",
"過期或臨界料件轉入隔離區封存，依規則提報報廢或退貨，審批後鎖定不得出庫",
"串接上下游批號流向形成正逆向追溯譜系，收貨到出貨全鏈路可稽核",
"彙整效期報廢率、批號追溯完整率與近效期趨勢，供品保部確認改善成果"];
const lots=[
["LOT-24A118","MAT-3021 乳酸菌原料","480 kg","2026/11/12","90","A-02-14","待上架","warn"],
["LOT-24A117","MAT-1188 明膠膠囊","1,200 box","2028/03/02","566","C-05-08","已上架","ok"],
["LOT-24A116","MAT-2044 魚油濃縮液","320 L","2026/09/01","18","A-01-03","待驗收","danger"],
["LOT-24A115","MAT-5510 維生素 C 粉","750 kg","2027/04/20","249","B-03-11","已上架","ok"],
["LOT-24A114","MAT-3021 乳酸菌原料","200 kg","2026/08/28","14","A-02-09","已上架","danger"],
["LOT-24A113","MAT-7702 鋁箔複合膜","5,400 m","2029/05/30","1,020","D-08-02","已上架","ok"]];
let charts={};
const icon=n=>`<svg class="icon" aria-hidden="true"><use href="#${n}"/></svg>`;
const badge=(t,c)=>`<span class="badge ${c}">${t}</span>`;
const remain=n=>badge(n<0?`逾期 ${-n} 天`:`剩 ${n} 天`,n<=18?"danger":n<=30?"warn":n<=90?"info":"ok");
const kpi=(i,l,v,u,d,c)=>`<div class="kpi"><div class="kpi-label">${icon(i)}${l}</div><div class="kpi-value">${v}<small>${u}</small></div><div class="delta ${c}">${d}</div></div>`;
const head=i=>`<header class="screen-head"><div><div class="eyebrow">Warehouse operations / 0${i+1}</div><h2>${navs[i]}</h2><p>${desc[i]}</p></div><button class="primary" type="button">建立作業</button></header>`;
const wrap=(i,k,b)=>`<section class="screen">${head(i)}<div class="grid g4" style="margin-bottom:12px">${k}</div>${b}</section>`;
const card=(t,c,s="")=>`<section class="card"><h3 class="card-title">${t}<span class="sub">${s}</span></h3>${c}</section>`;
const chart=id=>`<div class="chart"><canvas id="${id}"></canvas></div>`;
const note=t=>`<div class="note">${t}</div>`;
const nav=document.getElementById("nav");
nav.innerHTML=navs.map((n,i)=>`<button type="button" data-i="${i}">${icon(icons[i])}<span class="label">${n}</span></button>`).join("");
nav.addEventListener("click",e=>{const b=e.target.closest("[data-i]");if(b)location.hash="v"+b.dataset.i});

function screen0(){
const list=lots.map((r,i)=>`<div class="list-item ${i?"":"selected"}"><div class="row between"><strong class="mono">${r[0]}</strong>${badge(r[6],r[7])}</div><div class="small">${r[1]} ・ <span class="mono">${r[2]}</span></div><div class="row small">效期 <span class="mono">${r[3]}</span> ${remain(+r[4])}</div></div>`).join("");
const attrs=[["料號 / 品名","MAT-3021 乳酸菌原料"],["供應商","O合生技"],["收貨數量","480 kg"],["製造日期","2026/05/12"],["有效期限","2026/11/12"],["剩餘效期","90 天"],["儲存條件","2~8°C 冷藏"],["建議儲區","A-02-14"],["驗收人員","陳建宏"],["批號分級","A 級"]].map(a=>`<div class="attr"><span>${a[0]}</span><strong>${a[1]}</strong></div>`).join("");
const events=[["done","收貨過磅","進貨單 PO-26-0412 ・ 480 kg ・ 08:12"],["done","掃碼綁定批號","LOT-24A118 綁定製造日/效期 ・ 08:20"],["wait","品保抽樣驗收","待 QA 放行後方可上架 ・ 進行中"],["","智慧上架 A-02-14","冷藏區容量 82% ・ 待執行"]].map(e=>`<div class="event ${e[0]}"><strong>${e[1]}</strong><p>${e[2]}</p></div>`).join("");
return wrap(0,kpi("box","本日收貨批號","6","批","+2 ・ 增加","good")+kpi("rule","掃碼綁定率","100","%","已全綁","neutral")+kpi("warehouse","冷鏈料件","3","批","需監控","neutral")+kpi("alert","近效期入庫","2","批","7 日內 ・ 風險","risk"),`<div class="main-grid"><section class="panel list"><div class="list-head">今日收貨批號 ・ 6 筆</div>${list}</section><div class="stack"><div class="hero"><div class="row"><strong class="lot mono">LOT-24A118</strong>${badge("A 級","ok")}${badge("待上架","warn")}</div><div class="hero-data"><div><span>品名</span><strong>乳酸菌原料</strong></div><div><span>有效期限</span><strong>2026/11/12</strong></div><div><span>剩餘效期</span><strong>90 天</strong></div><div><span>儲存條件</span><strong>2~8°C 冷藏</strong></div></div></div>${card(icon("check")+"驗收與綁定明細",`<div class="attrs">${attrs}</div>${note("系統依有效期限自動套用 FEFO 分級，剩餘效期 < 30 天者標記近效期，出庫時優先排序。")}`)}${card(icon("rule")+"入庫作業進度",`<div class="timeline">${events}</div>`)}</div></div>`);
}
function screen1(){
const data=[["已過期","#dc2626",[["LOT-23F077","魚油濃縮液","-3","A-01-05","轉隔離"],["LOT-23F012","乳酸菌原料","-11","A-02-01","待報廢"]]],["7 日內到期","#ef4444",[["LOT-24A114","乳酸菌原料","14","A-02-09","優先出庫"],["LOT-24A116","魚油濃縮液","18","A-01-03","優先出庫"]]],["30 日內到期","#b45309",[["LOT-24A088","膠原蛋白粉","26","B-04-06","排程消化"],["LOT-24A091","薑黃萃取物","29","B-04-10","排程消化"]]],["90 日內到期","#2563eb",[["LOT-24A118","乳酸菌原料","90","A-02-14","正常監控"],["LOT-24A102","綜合維他命","74","B-03-02","正常監控"]]]];
const board=data.map(c=>`<div class="column"><div class="column-title" style="color:${c[1]}"><span class="dot"></span><span style="color:var(--ink)">${c[0]}</span><span class="count">${c[2].length}</span></div>${c[2].map(x=>`<div class="tile"><strong class="mono">${x[0]}</strong><div class="small">${x[1]} ・ 儲區 <span class="mono">${x[3]}</span></div><div class="row">${remain(+x[2])}${badge(x[4],"mute")}</div></div>`).join("")}</div>`).join("");

const renders=[screen0,screen1,screen2,screen3,screen4,screen5];
function destroy(){Object.values(charts).forEach(c=>c.destroy());charts={}}
const common={responsive:true,maintainAspectRatio:false,animation:{duration:350},plugins:{legend:{labels:{color:"#475569",font:{family:"Open Sans",size:10},boxWidth:10}}},scales:{x:{grid:{display:false},ticks:{color:"#475569",font:{size:10}}},y:{beginAtZero:true,grid:{color:"#e6e8ea"},ticks:{color:"#475569",font:{size:10}}}}};
function make(id,type,labels,data,colors,extra={}){
const e=document.getElementById(id);if(!e)return;
charts[id]=new Chart(e,{type,data:{labels,datasets:data.map((d,i)=>({label:d.label,data:d.data,borderColor:Array.isArray(colors)?colors[i]:colors,backgroundColor:Array.isArray(colors)?colors[i]:colors,borderWidth:2,borderRadius:4,tension:.35,fill:d.fill||false}))},options:Object.assign({},common,extra)});
}
function init(i){
if(i===1)make("c1","bar",["已過期","7日內","30日內","90日內","安全"],[{label:"批號數",data:[2,2,2,2,14]}],["#334155"]);
if(i===2)make("c2","bar",["24A114","24A116","24A102","24A118","24A115"],[{label:"剩餘天數",data:[14,18,74,90,249]}],"#059669",{indexAxis:"y",responsive:true,maintainAspectRatio:false});
if(i===3)make("c3","doughnut",["逾效期","冷鏈中斷","外觀異常","客訴退回"],[{label:"占比",data:[46,24,18,12]}],["#334155"],{responsive:true,maintainAspectRatio:false,cutout:"62%",plugins:{legend:{position:"right"}}});
if(i===4)make("c4","line",["3月","4月","5月","6月","7月","8月"],[{label:"追溯完整率 %",data:[91,93,94,96,97,98],fill:true}],"#059669");
if(i===5){
make("c5a","line",["3月","4月","5月","6月","7月","8月"],[{label:"報廢率 %",data:[3.1,2.8,2.4,2,1.7,1.5]},{label:"追溯完整率 %",data:[91,93,94,96,97,98]}],["#dc2626","#059669"]);
make("c5b","pie",["逾效期報廢","品質不符","冷鏈中斷","呆滯報廢"],[{label:"占比",data:[52,20,16,12]}],["#334155"],{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"right"}}});
make("c5c","bar",["益生菌","魚油","維生素","膠原","包材"],[{label:"近效期庫存 kg",data:[210,180,120,95,40]}],"#059669");
}}
function show(i){
destroy();
document.querySelectorAll("[data-i]").forEach(b=>{const active=+b.dataset.i===i;b.classList.toggle("active",active);b.setAttribute("aria-current",active?"page":"false")});
document.getElementById("screen").innerHTML=renders[i]();
requestAnimationFrame(()=>init(i));
}
function fromHash(){const m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(Math.min(m?+m[1]:0,5));try{scrollTo(0,0)}catch(e){}}
addEventListener("hashchange",fromHash);
fromHash();
})();
</script>
