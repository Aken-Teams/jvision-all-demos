<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>招募管理系統（ATS）</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#db2777;--accent2:#f472b6;--ink:#1f2937;--sub:#6b7280;
  --bg:#fbf5f8;--card:#ffffff;--line:#f0d9e6;--soft:#fce7f1;
  --ok:#10b981;--warn:#f59e0b;--bad:#ef4444;--info:#6366f1;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.topbar{
  position:sticky;top:0;z-index:50;background:linear-gradient(90deg,#9d174d,#db2777);
  color:#fff;box-shadow:0 2px 14px rgba(219,39,119,.25);
}
.topbar-inner{max-width:1360px;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;min-width:0;}
.brand .logo{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;}
.brand .logo .material-symbols-outlined{font-size:22px;}
.nav{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0;}
.nav button{
  display:flex;align-items:center;gap:6px;background:transparent;border:0;color:rgba(255,255,255,.82);
  padding:8px 12px;border-radius:9px;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s;
}
.nav button .material-symbols-outlined{font-size:19px;}
.nav button:hover{background:rgba(255,255,255,.12);color:#fff;}
.nav button.on{background:#fff;color:var(--accent);box-shadow:0 3px 10px rgba(0,0,0,.14);}
.topmeta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:rgba(255,255,255,.85);white-space:nowrap;}
.topmeta .av{width:30px;height:30px;border-radius:50%;background:var(--accent2);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;}
main{max-width:1360px;margin:0 auto;padding:22px 18px 60px;}
.screen-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
.screen-head h1{margin:0;font-size:22px;font-weight:800;display:flex;align-items:center;gap:9px;min-width:0;}
.screen-head h1 .material-symbols-outlined{color:var(--accent);font-size:26px;}
.screen-head p{margin:4px 0 0;color:var(--sub);font-size:13px;}
.pill{background:var(--soft);color:var(--accent);font-weight:700;font-size:12px;padding:5px 11px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;}
.pill .material-symbols-outlined{font-size:16px;}
.grid{display:grid;gap:16px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:2fr 1fr;}
.g32{grid-template-columns:1.4fr 1fr;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 17px;min-width:0;box-shadow:0 1px 3px rgba(157,23,77,.04);}
.card h3{margin:0 0 12px;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:7px;}
.card h3 .material-symbols-outlined{color:var(--accent);font-size:19px;}
.card h3 .sm{margin-left:auto;font-size:12px;color:var(--sub);font-weight:500;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;min-width:0;position:relative;overflow:hidden;}
.kpi::after{content:"";position:absolute;right:-14px;top:-14px;width:64px;height:64px;border-radius:50%;background:var(--soft);opacity:.6;}
.kpi .kl{font-size:12.5px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:6px;position:relative;z-index:1;}
.kpi .kl .material-symbols-outlined{font-size:18px;color:var(--accent);}
.kpi .kv{font-size:28px;font-weight:800;margin-top:8px;position:relative;z-index:1;}
.kpi .kv small{font-size:14px;color:var(--sub);font-weight:600;margin-left:3px;}
.kpi .kd{font-size:12px;margin-top:5px;font-weight:600;position:relative;z-index:1;}
.up{color:var(--ok);}.down{color:var(--bad);}.flat{color:var(--sub);}
.chartbox{position:relative;width:100%;overflow:hidden;}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
th{text-align:left;color:var(--sub);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap;}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:0;}
tr:hover td{background:#fdf2f8;}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.t-ok{background:#dcfce7;color:#15803d;}
.t-warn{background:#fef3c7;color:#b45309;}
.t-bad{background:#fee2e2;color:#b91c1c;}
.t-info{background:#e0e7ff;color:#4338ca;}
.t-pink{background:var(--soft);color:var(--accent);}
.t-gray{background:#f3f4f6;color:#4b5563;}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:700;font-size:12px;display:inline-flex;align-items:center;justify-content:center;margin-right:8px;flex-shrink:0;}
.who{display:flex;align-items:center;min-width:0;}
.who b{font-weight:600;}
.bar{height:7px;border-radius:5px;background:var(--soft);overflow:hidden;min-width:60px;}
.bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.score{font-weight:800;font-size:15px;}
.funnel{display:flex;flex-direction:column;gap:9px;}
.fstep{display:flex;align-items:center;gap:12px;}
.fstep .flabel{width:88px;font-size:12px;font-weight:600;color:var(--sub);flex-shrink:0;text-align:right;}
.fbar{flex:1;height:34px;border-radius:8px;background:linear-gradient(90deg,var(--accent),var(--accent2));display:flex;align-items:center;padding:0 12px;color:#fff;font-weight:700;font-size:13px;min-width:0;box-shadow:0 2px 6px rgba(219,39,119,.2);overflow:hidden;}
.fstep .fpct{width:46px;font-weight:800;font-size:13px;color:var(--accent);flex-shrink:0;}
.tl{position:relative;padding-left:22px;}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tli{position:relative;padding:0 0 16px 8px;}
.tli:last-child{padding-bottom:0;}
.tli::before{content:"";position:absolute;left:-20px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--accent);}
.tli.done::before{background:var(--accent);}
.tli .th{font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.tli .td{font-size:12px;color:var(--sub);margin-top:3px;}
.tli .tt2{font-size:11px;color:var(--accent);font-weight:600;}
.cal{display:grid;grid-template-columns:66px repeat(5,1fr);gap:6px;min-width:560px;}
.cal .ch{font-size:11.5px;font-weight:700;color:var(--sub);text-align:center;padding:6px 2px;}
.cal .tm{font-size:11px;color:var(--sub);text-align:right;padding:6px 6px 0 0;}
.slot{min-height:48px;border:1px dashed var(--line);border-radius:8px;background:#fff;padding:4px 6px;font-size:10.5px;min-width:0;overflow:hidden;}
.slot.busy{border-style:solid;background:linear-gradient(135deg,var(--soft),#fff);border-color:var(--accent2);}
.slot .sn{font-weight:700;color:var(--accent);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.slot .sr{color:var(--sub);}
.checks{display:flex;flex-direction:column;gap:9px;}
.chk{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;}
.chk .ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.chk .ic .material-symbols-outlined{font-size:20px;}
.chk.on .ic{background:#dcfce7;color:var(--ok);}
.chk.wait .ic{background:#fef3c7;color:var(--warn);}
.chk.no .ic{background:#fee2e2;color:var(--bad);}
.chk .cx{flex:1;min-width:0;}
.chk .cx b{font-size:13px;font-weight:700;}
.chk .cx small{display:block;font-size:11.5px;color:var(--sub);margin-top:2px;}
.offer{border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.offer .ohd{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;padding:14px 17px;}
.offer .ohd .on{font-size:16px;font-weight:800;}
.offer .ohd .os{font-size:12px;opacity:.9;margin-top:2px;}
.offer .ob{padding:15px 17px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;min-width:0;}
.offer .of{min-width:0;}
.offer .of .fl{font-size:11.5px;color:var(--sub);}
.offer .of .fv{font-size:15px;font-weight:700;margin-top:2px;}
.mini{display:flex;flex-direction:column;gap:12px;}
.mrow{display:flex;align-items:center;gap:10px;font-size:12.5px;flex-wrap:wrap;}
.mrow .ml{width:130px;color:var(--ink);font-weight:600;flex-shrink:0;}
.mrow .mb{flex:1;min-width:80px;}
.mrow .mv{width:150px;flex-shrink:0;text-align:right;font-weight:700;font-size:12px;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:10px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
.foot{margin-top:26px;text-align:center;color:#c084a8;font-size:12px;}
@media(max-width:1024px){
  .g4{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
  .offer .ob{grid-template-columns:1fr;}
}
@media(max-width:560px){
  .nav button span.lbl{display:none;}
  .nav button{padding:8px 10px;}
  .topmeta{display:none;}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><span class="logo material-symbols-outlined">interests</span><span>ATS 招募管理</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="topmeta"><span>招募專員 · 陳雅婷</span><span class="av">陳</span></div>
  </div>
</header>
<main><div id="screen"></div>
<div class="foot">招募管理系統（ATS, Applicant Tracking System）· 純前端展示雛型 · 資料為模擬示意</div>
</main>
<script>
"use strict";
var MODS=[
  {icon:"dashboard",name:"招募儀表板"},
  {icon:"request_quote",name:"職缺刊登"},
  {icon:"fact_check",name:"履歷篩選"},
  {icon:"calendar_month",name:"面試排程"},
  {icon:"verified",name:"錄取核薪"},
  {icon:"task_alt",name:"報到轉任"}
];
var CH=null;
function clearCharts(){ if(CH){ for(var i=0;i<CH.length;i++){ try{CH[i].destroy();}catch(e){} } } CH=[]; }
function el(id){ return document.getElementById(id); }

/* SCREEN 0 : 招募儀表板 */
function s0(){
  return ''
  +'<div class="screen-head"><div><h1><span class="material-symbols-outlined">dashboard</span>招募儀表板</h1>'
  +'<p>2026 第一季 · 產線大量招募進度總覽</p></div><span class="pill"><span class="material-symbols-outlined">bolt</span>即時更新於 08:42</span></div>'
  +'<div class="grid g4" style="margin-bottom:16px">'
  + kpi("work","開放職缺","18","件","+4 本週","up")
  + kpi("group","進行中候選人","342","人","+58 本週","up")
  + kpi("event_available","平均到位天數","26","天","較上季 -21","up")
  + kpi("percent","履歷轉面試率","31","%","+6.2pt","up")
  +'</div>'
  +'<div class="grid g23" style="margin-bottom:16px">'
  +'<div class="card"><h3><span class="material-symbols-outlined">show_chart</span>各週到位天數趨勢<span class="sm">目標 &le; 28 天</span></h3>'
  +'<div class="chartbox" style="height:260px"><canvas id="c0line"></canvas></div></div>'
  +'<div class="card"><h3><span class="material-symbols-outlined">filter_alt</span>招募轉換漏斗</h3>'+funnelHtml()+'</div>'
  +'</div>'
  +'<div class="grid g2">'
  +'<div class="card"><h3><span class="material-symbols-outlined">source</span>各刊登平台履歷來源</h3>'
  +'<div class="chartbox" style="height:230px"><canvas id="c0src"></canvas></div></div>'
  +'<div class="card"><h3><span class="material-symbols-outlined">priority_high</span>需關注職缺</h3>'+attnHtml()+'</div>'
  +'</div>';
}
function funnelHtml(){
  var f=[["刊登職缺",100,"18 職缺"],["收到履歷",100,"1,240 份"],["通過初篩",58,"720 人"],["安排面試",31,"384 人"],["面試通過",14,"178 人"],["發出錄取",6,"76 份"]];
  var h='<div class="funnel">';
  for(var i=0;i<f.length;i++){
    h+='<div class="fstep"><div class="flabel">'+f[i][0]+'</div><div class="fbar" style="width:'+f[i][1]+'%">'+f[i][2]+'</div><div class="fpct">'+f[i][1]+'%</div></div>';
  }
  return h+'</div>';
}
function attnHtml(){
  var r=[["產線作業員（夜班）","缺 12 人","逾期 5 天","t-bad"],["品保檢驗員","到位天數 41 天","偏慢","t-warn"],["設備維修技師","履歷不足 · 僅 8 份","不足","t-warn"],["倉儲理貨員","面試待安排 18 人","待排","t-info"]];
  var h='<div class="checks">';
  for(var i=0;i<r.length;i++){
    h+='<div class="chk '+(r[i][3]=="t-bad"?"no":"wait")+'"><div class="ic '+(r[i][3]=="t-bad"?"no":"wait")+'"><span class="material-symbols-outlined">'+(r[i][3]=="t-bad"?"error":"schedule")+'</span></div>'
    +'<div class="cx"><b>'+r[i][0]+'</b><small>'+r[i][1]+'</small></div><span class="tag '+r[i][3]+'">'+r[i][2]+'</span></div>';
  }
  return h+'</div>';
}
function d0(){
  var a=new Chart(el("c0line"),{type:"line",data:{labels:["W1","W2","W3","W4","W5","W6"],datasets:[
    {label:"到位天數",data:[47,42,38,33,29,26],borderColor:"#db2777",backgroundColor:"rgba(219,39,119,.12)",fill:true,tension:.35,borderWidth:3,pointRadius:4,pointBackgroundColor:"#db2777"},
    {label:"目標",data:[28,28,28,28,28,28],borderColor:"#f472b6",borderDash:[6,5],borderWidth:2,pointRadius:0,fill:false}
  ]},options:baseOpt({legend:true})});
  var b=new Chart(el("c0src"),{type:"doughnut",data:{labels:["104人力銀行","1111人力銀行","官網投遞","員工推薦","校園徵才"],datasets:[{data:[512,286,214,158,70],backgroundColor:["#db2777","#f472b6","#f9a8d4","#6366f1","#a5b4fc"],borderWidth:2,borderColor:"#fff"}]},options:baseOpt({legend:true,cutout:"58%"})});
  CH.push(a,b);
}

/* SCREEN 1 : 職缺刊登 */
function s1(){
  return ''
  +'<div class="screen-head"><div><h1><span class="material-symbols-outlined">request_quote</span>職缺申請與刊登</h1>'
  +'<p>用人需求申請 → 薪資核定 → 多平台同步刊登</p></div><span class="pill"><span class="material-symbols-outlined">sync</span>3 平台已連線</span></div>'
  +'<div class="grid g4" style="margin-bottom:16px">'
  + kpi("post_add","本月新申請","24","件","已核定 20","flat")
  + kpi("public","刊登中職缺","18","件","跨 3 平台","flat")
  + kpi("visibility","職缺總曝光","48.2","k","近 7 日","up")
  + kpi("pending_actions","待主管核薪","4","件","逾期 1 件","warn")
  +'</div>'
  +'<div class="grid g32" style="margin-bottom:16px">'
  +'<div class="card"><h3><span class="material-symbols-outlined">list_alt</span>職缺申請清單<span class="sm">依申請日排序</span></h3>'+reqTable()+'</div>'
  +'<div class="card"><h3><span class="material-symbols-outlined">query_stats</span>各平台每日曝光</h3>'
  +'<div class="chartbox" style="height:210px"><canvas id="c1bar"></canvas></div>'
  +'<div class="legend"><span><i class="dot" style="background:#db2777"></i>104</span><span><i class="dot" style="background:#f472b6"></i>1111</span><span><i class="dot" style="background:#6366f1"></i>官網</span></div></div>'
  +'</div>'
  +'<div class="card"><h3><span class="material-symbols-outlined">tune</span>職務說明與薪資帶設定</h3>'+bandHtml()+'</div>';
}
function reqTable(){
  var r=[
    ["產線作業員(夜班)","製造一部","12","已刊登","t-ok"],
    ["品保檢驗員","品保處","3","已刊登","t-ok"],
    ["設備維修技師","設備工程","2","待核薪","t-warn"],
    ["倉儲理貨員","物流中心","5","已刊登","t-ok"],
    ["製程工程師","製程處","1","審核中","t-info"],
    ["生管排程員","生產管理","2","待核薪","t-warn"]
  ];
  var h='<div class="tbl-wrap"><table><thead><tr><th>職缺</th><th>用人部門</th><th>需求</th><th>狀態</th></tr></thead><tbody>';
  for(var i=0;i<r.length;i++){
    h+='<tr><td><b>'+r[i][0]+'</b></td><td>'+r[i][1]+'</td><td><span class="tag t-pink">'+r[i][2]+' 人</span></td><td><span class="tag '+r[i][4]+'">'+r[i][3]+'</span></td></tr>';
  }
  return h+'</tbody></table></div>';
}
function bandHtml(){
  var r=[["產線作業員(夜班)","32,000","38,000",82],["品保檢驗員","34,000","42,000",64],["設備維修技師","40,000","52,000",48],["製程工程師","46,000","62,000",30]];
  var h='<div class="mini">';
  for(var i=0;i<r.length;i++){
    h+='<div class="mrow"><div class="ml">'+r[i][0]+'</div><div class="mb"><div class="bar"><i style="width:'+r[i][3]+'%"></i></div></div>'
    +'<div class="mv">$'+r[i][1]+' ~ $'+r[i][2]+'</div></div>';
  }
  return h+'</div><div class="legend"><span><span class="material-symbols-outlined" style="font-size:16px;color:var(--accent)">info</span>薪資帶依市場行情與內部薪等核定，進度條為投遞落點示意</span></div>';
}
function d1(){
  var a=new Chart(el("c1bar"),{type:"bar",data:{labels:["一","二","三","四","五","六","日"],datasets:[
    {label:"104",data:[820,910,760,1020,1180,640,520],backgroundColor:"#db2777"},
    {label:"1111",data:[420,510,460,540,610,380,300],backgroundColor:"#f472b6"},
    {label:"官網",data:[210,260,240,300,340,180,150],backgroundColor:"#6366f1"}
  ]},options:baseOpt({stacked:true})});
  CH.push(a);
}

/* SCREEN 2 : 履歷篩選 */
function s2(){
  return ''
  +'<div class="screen-head"><div><h1><span class="material-symbols-outlined">fact_check</span>履歷篩選比對</h1>'
  +'<p>關鍵字比對 · 自動評分 · 候選人分流</p></div><span class="pill"><span class="material-symbols-outlined">smart_toy</span>AI 初篩已處理 1,240 份</span></div>'

/* helpers */
function kpi(icon,label,val,unit,delta,dir){
  var cls=dir=="up"?"up":((dir=="down"||dir=="warn")?"down":"flat");
  var arrow=dir=="up"?"arrow_upward":((dir=="down"||dir=="warn")?"arrow_downward":"remove");
  return '<div class="kpi"><div class="kl"><span class="material-symbols-outlined">'+icon+'</span>'+label+'</div>'
  +'<div class="kv">'+val+'<small>'+unit+'</small></div>'
  +'<div class="kd '+cls+'"><span class="material-symbols-outlined" style="font-size:15px">'+arrow+'</span>'+delta+'</div></div>';
}
function baseOpt(o){
  o=o||{};
  var opt={responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:!!o.legend,position:"bottom",labels:{boxWidth:12,font:{family:"Noto Sans TC",size:11}}}}};
  if(o.cutout){opt.cutout=o.cutout;}
  else{
    opt.scales={
      x:{stacked:!!o.stacked,grid:{display:false},ticks:{font:{size:11}}},
      y:{stacked:!!o.stacked,beginAtZero:true,grid:{color:"#f3e0eb"},ticks:{font:{size:11}}}
    };
  }
  return opt;
}
function radarOpt(){
  return {responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:true,position:"bottom",labels:{boxWidth:12,font:{family:"Noto Sans TC",size:11}}}},
    scales:{r:{beginAtZero:true,max:100,ticks:{display:false,stepSize:20},pointLabels:{font:{family:"Noto Sans TC",size:11}},grid:{color:"#f0d9e6"},angleLines:{color:"#f0d9e6"}}}};
}

var SCR=[s0,s1,s2,s3,s4,s5];
var DRAW=[d0,d1,d2,d3,d4,d5];
function show(i){
  i=Math.max(0,Math.min(i,SCR.length-1));
  clearCharts();
  var box=el("screen");
  box.innerHTML=SCR[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){ btns[b].classList.toggle("on",(+btns[b].getAttribute("data-i"))===i); }
  void box.offsetHeight;
  if(typeof Chart!=="undefined"){ try{ DRAW[i](); }catch(e){} }
}
(function(){
  var nav=el("nav"),h="";
  for(var i=0;i<MODS.length;i++){
    h+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span><span class="lbl">'+MODS[i].name+'</span></button>';
  }
  nav.innerHTML=h;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){ var n=+this.getAttribute("data-i"); location.hash="v"+n; });
  }
})();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
