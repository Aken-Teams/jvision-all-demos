<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>招募管理系統（ATS）</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --bg:#F0FDFA;
  --card:#FFFFFF;
  --soft:#CCFBF1;
  --ok:#047857;
  --warn:#B45309;
  --bad:#B91C1C;
  --info:#1D4ED8;
  --serif:"Crimson Pro","Noto Serif TC","Songti TC",serif;
  --display:"Cormorant Garamond","Noto Serif TC","Songti TC",serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  background:var(--color-background);
  color:var(--color-foreground);
  font-family:var(--serif);
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,canvas{font:inherit}
button{cursor:pointer}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:500;
  font-style:normal;
  font-size:1.25em;
  line-height:1;
  vertical-align:middle;
}
.topbar{
  position:sticky;
  top:0;
  z-index:50;
  color:#fff;
  background:#115E59;
  border-bottom:3px solid var(--color-secondary);
}
.topbar-inner{
  width:min(1440px,100%);
  min-height:68px;
  margin:auto;
  padding:0 24px;
  display:flex;
  align-items:center;
  gap:22px;
}
.brand{
  display:flex;
  align-items:center;
  gap:11px;
  flex:0 0 auto;
  font-family:var(--display);
  font-size:20px;
  font-weight:700;
  letter-spacing:.02em;
  white-space:nowrap;
}
.logo{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border:2px solid var(--color-secondary);
  border-radius:8px;
  color:#042F2E;
  background:var(--color-secondary);
}
.nav{
  display:flex;
  align-items:center;
  gap:3px;
  min-width:0;
  flex:1;
  overflow-x:auto;
  scrollbar-width:thin;
}
.nav button{
  min-height:44px;
  padding:9px 12px;
  display:flex;
  align-items:center;
  gap:7px;
  flex:0 0 auto;
  border:1px solid transparent;
  border-radius:7px;
  background:transparent;
  color:#CCFBF1;
  font-size:14px;
  font-weight:600;
  transition:background-color .18s ease,color .18s ease,border-color .18s ease;
}
.nav button:hover{background:#0F766E;color:#fff}
.nav button.on{
  border-color:var(--color-secondary);
  background:var(--color-secondary);
  color:#042F2E;
}
.topmeta{
  display:flex;
  align-items:center;
  gap:10px;
  flex:0 0 auto;
  color:#ECFEFF;
  font-size:14px;
  white-space:nowrap;
}
.av,.avatar{
  display:inline-grid;
  place-items:center;
  flex:0 0 auto;
  border:2px solid #0F766E;
  border-radius:8px;
  background:#CCFBF1;
  color:#115E59;
  font-family:var(--display);
  font-weight:700;
}
.av{width:34px;height:34px}
main{
  width:min(1440px,100%);
  margin:auto;
  padding:28px 24px 64px;
}
#screen{min-height:680px}
.screen-head{
  margin-bottom:20px;
  padding:20px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  flex-wrap:wrap;
  border:1px solid #2DD4BF;
  border-left:7px solid var(--color-primary);
  border-radius:10px;
  background:var(--color-card);
}
.screen-head h1{
  margin:0;
  display:flex;
  align-items:center;
  gap:10px;
  color:#134E4A;
  font-family:var(--display);
  font-size:clamp(26px,3vw,34px);
  line-height:1.08;
  font-weight:700;
}
.screen-head h1 .material-symbols-outlined{color:var(--color-primary)}
.screen-head p{margin:5px 0 0;color:var(--muted);font-size:15px}
.pill,.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  width:max-content;
  border-radius:999px;
  white-space:nowrap;
  font-weight:600;
}
.pill{
  min-height:36px;
  padding:6px 12px;
  border:1px solid #0D9488;
  background:#CCFBF1;
  color:#115E59;
  font-size:13px;
}
.grid{display:grid;gap:16px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(300px,1fr)}
.g32{grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr)}
.card,.kpi{
  min-width:0;
  border:1px solid var(--color-border);
  border-radius:10px;
  background:var(--color-card);
}
.card{padding:18px}
.card h3{
  margin:0 0 14px;
  padding-bottom:10px;
  display:flex;
  align-items:center;
  gap:8px;
  border-bottom:1px solid var(--color-muted);
  color:#134E4A;
  font-family:var(--display);
  font-size:18px;
  line-height:1.2;
}
.card h3 .material-symbols-outlined{color:var(--color-primary)}
.card h3 .sm{
  margin-left:auto;
  color:var(--muted);
  font-family:var(--serif);
  font-size:13px;
  font-weight:400;
}
.kpi{
  position:relative;
  min-height:146px;
  padding:17px;
  overflow:hidden;
  transition:border-color .18s ease,background-color .18s ease,transform .18s ease;
}
.kpi:hover{border-color:#0D9488;background:#F8FFFE;transform:translateY(-2px)}
.kpi::before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:5px;
  background:var(--color-primary);
}
.kl{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:14px;
  font-weight:600;
}
.kl .material-symbols-outlined{color:var(--color-primary)}
.kv{
  margin-top:8px;
  color:#0F3D3A;
  font-family:var(--display);
  font-size:36px;
  line-height:1;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.kv small{
  margin-left:4px;
  color:var(--muted);
  font-family:var(--serif);
  font-size:15px;
  font-weight:600;
}
.kd{
  margin-top:11px;
  display:flex;
  align-items:center;
  gap:4px;
  font-size:13px;
  font-weight:600;
}
.up{color:#047857}
.down{color:#B45309}
.flat{color:#475569}
.chartbox{position:relative;width:100%;overflow:hidden}
.tbl-wrap{overflow-x:auto}
table{
  width:100%;
  min-width:540px;
  border-collapse:collapse;
  font-size:14px;
  font-variant-numeric:tabular-nums;
}
th{
  padding:9px 11px;
  border-bottom:2px solid #0D9488;
  background:#E6FFFA;
  color:#134E4A;
  text-align:left;
  white-space:nowrap;
  font-size:12px;
  font-weight:700;
  letter-spacing:.03em;
}
td{
  padding:11px;
  border-bottom:1px solid var(--color-muted);
  vertical-align:middle;
}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#F0FDFA}
tbody tr:last-child td{border-bottom:0}
th:nth-child(n+3),td:nth-child(n+3){font-variant-numeric:tabular-nums}
td:has(.score),td:has(.tag){white-space:nowrap}
.tag{
  min-height:25px;
  padding:3px 9px;
  border:1px solid currentColor;
  font-size:12px;
}
.t-ok{background:#D1FAE5;color:#065F46}
.t-warn{background:#FEF3C7;color:#92400E}
.t-bad{background:#FEE2E2;color:#991B1B}
.t-info{background:#DBEAFE;color:#1E40AF}
.t-pink{background:#CCFBF1;color:#115E59}
.t-gray{background:#E8F1F4;color:#334155}
.avatar{
  width:32px;
  height:32px;
  margin-right:8px;
  border-width:1px;
  font-size:13px;
}
.who{display:flex;align-items:center;min-width:0}
.who b{font-weight:600}
.bar{
  height:8px;
  min-width:60px;
  overflow:hidden;
  border-radius:999px;
  background:#DDE7EA;
}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--color-primary)}
.score{
  color:#0F766E!important;
  font-family:var(--mono);
  font-size:15px;
  font-weight:700;
}
.funnel{display:flex;flex-direction:column;gap:10px}
.fstep{display:flex;align-items:center;gap:11px}
.flabel{
  width:86px;
  flex:0 0 auto;
  color:var(--muted);
  text-align:right;
  font-size:13px;
  font-weight:600;
}
.fbar{
  min-width:0;
  height:35px;
  padding:0 11px;
  display:flex;
  align-items:center;
  overflow:hidden;
  border-radius:6px;
  background:var(--color-primary);
  color:#fff;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
}
.fpct{
  width:46px;
  flex:0 0 auto;
  color:#0F766E;
  font-family:var(--mono);
  font-size:13px;
  font-weight:700;
}
.tl{position:relative;padding-left:25px}
.tl::before{
  content:"";
  position:absolute;
  top:5px;
  bottom:5px;
  left:7px;
  width:2px;
  background:#5EEAD4;
}
.tli{position:relative;padding:0 0 18px 9px}
.tli:last-child{padding-bottom:0}
.tli::before{
  content:"";
  position:absolute;
  top:3px;
  left:-23px;
  width:12px;
  height:12px;
  border:3px solid var(--color-primary);
  border-radius:50%;
  background:#fff;
}
.tli.done::before{background:var(--color-primary)}
.th{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700}
.td{margin-top:3px;color:var(--muted);font-size:13px}
.tt2{color:#0F766E;font-family:var(--mono);font-size:12px;font-weight:600}
.cal{
  min-width:600px;
  display:grid;
  grid-template-columns:68px repeat(5,1fr);
  gap:6px;
}
.ch{
  padding:7px 2px;
  color:#134E4A;
  text-align:center;
  font-size:12px;
  font-weight:700;
}
.tm{
  padding:7px 7px 0 0;
  color:var(--muted);
  text-align:right;
  font-family:var(--mono);
  font-size:12px;
}
.slot{
  min-height:54px;
  padding:6px 7px;
  overflow:hidden;
  border:1px dashed #5EEAD4;
  border-radius:7px;
  background:#fff;
  font-size:12px;
}
.slot.busy{border-style:solid;border-color:#0D9488;background:#CCFBF1}
.sn{overflow:hidden;color:#115E59;font-weight:700;text-overflow:ellipsis;white-space:nowrap}
.sr{color:#475569;font-size:11px}
.checks{display:flex;flex-direction:column;gap:9px}
.chk{
  min-height:56px;
  padding:10px 12px;
  display:flex;
  align-items:center;
  gap:11px;
  border:1px solid var(--color-muted);
  border-radius:8px;
  background:#fff;
}
.ic{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  flex:0 0 auto;
  border-radius:7px;
}
.chk.on .ic{background:#D1FAE5;color:#065F46}
.chk.wait .ic{background:#FEF3C7;color:#92400E}
.chk.no .ic{background:#FEE2E2;color:#991B1B}
.cx{min-width:0;flex:1}
.cx b{font-size:14px}
.cx small{display:block;margin-top:2px;color:var(--muted);font-size:12px}
.offer{border:0;border-radius:0;overflow:hidden}
.ohd{
  padding:17px 19px;
  border-bottom:4px solid var(--color-secondary);
  background:#115E59;
  color:#fff;
}
.on{font-family:var(--display);font-size:21px;font-weight:700}
.os{margin-top:3px;color:#CCFBF1;font-size:13px}
.ob{
  padding:18px;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}
.of{min-width:0}
.fl{color:var(--muted);font-size:12px}
.fv{margin-top:3px;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.mini{display:flex;flex-direction:column;gap:14px}
.mrow{display:flex;align-items:center;gap:11px;flex-wrap:wrap;font-size:14px}
.ml{width:145px;flex:0 0 auto;font-weight:600}
.mb{min-width:80px;flex:1}
.mv{
  width:165px;
  flex:0 0 auto;
  text-align:right;
  font-family:var(--mono);
  font-size:12px;
  font-weight:700;
}
.legend{
  margin-top:12px;
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  color:var(--muted);
  font-size:13px;
}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;display:inline-block;border-radius:2px}
.foot{
  margin-top:30px;
  padding-top:18px;
  border-top:1px solid var(--color-border);
  color:#475569;
  text-align:center;
  font-size:13px;
}
button:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.topbar button:focus-visible{outline-color:#FBBF24}
.grid>*{
  animation:grid-in .4s cubic-bezier(.2,.8,.25,1.25) both;
}
.grid>*:nth-child(2){animation-delay:.06s}
.grid>*:nth-child(3){animation-delay:.12s}
.grid>*:nth-child(4){animation-delay:.18s}
.grid>*:nth-child(5){animation-delay:.24s}
.grid>*:nth-child(6){animation-delay:.30s}
@keyframes grid-in{
  from{opacity:0;transform:translateY(16px) scale(.96)}
  to{opacity:1;transform:none}
}
@media(max-width:1100px){
  .topbar-inner{gap:12px}
  .topmeta{display:none}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:820px){
  .topbar-inner{padding:8px 16px;align-items:flex-start;flex-wrap:wrap}
  .brand{min-height:42px}
  .nav{order:3;width:100%;flex-basis:100%}
  main{padding:20px 16px 52px}
  .g3,.g2,.g23,.g32{grid-template-columns:1fr}
}
@media(max-width:560px){
  .brand{font-size:18px}
  .nav button{min-width:44px;justify-content:center;padding:9px}
  .nav .lbl{display:none}
  .screen-head{padding:17px}
  .screen-head h1{font-size:27px}
  .g4{grid-template-columns:1fr}
  .card{padding:15px}
  .ob{grid-template-columns:1fr}
  .mrow{align-items:flex-start}
  .ml,.mv{width:100%;text-align:left}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-delay:0ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  .grid>*{opacity:1;transform:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><span class="logo material-symbols-outlined" aria-hidden="true">interests</span><span>ATS 招募管理</span></div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
    <div class="topmeta"><span>招募專員 · 陳雅婷</span><span class="av" aria-hidden="true">陳</span></div>
  </div>
</header>
<main>
  <div id="screen"></div>
  <div class="foot">招募管理系統（ATS, Applicant Tracking System）· 純前端展示雛型 · 資料為模擬示意</div>
</main>
<script>
"use strict";
var MODS=[
  {icon:"dashboard",name:"招募儀表板"},
  {icon:"request_quote",name:"職缺刊登"},
  {icon:"fact_check",name:"履歷篩選"},
  {icon:"calendar_month",name:"面試排程"},
  {icon:"verified",name:"錄取核薪"},
  {icon:"task_alt",name:"報到轉任"}
];
var CH=[];
function clearCharts(){
  for(var i=0;i<CH.length;i++){try{CH[i].destroy()}catch(e){}}
  CH=[];
}
function el(id){return document.getElementById(id)}
function icon(name){return '<span class="material-symbols-outlined" aria-hidden="true">'+name+'</span>'}

function s0(){
  return '<div class="screen-head"><div><h1>'+icon("dashboard")+'招募儀表板</h1><p>2026 第一季 · 產線大量招募進度總覽</p></div><span class="pill">'+icon("bolt")+'即時更新於 08:42</span></div>'
  +'<div class="grid g4" style="margin-bottom:16px">'
  +kpi("work","開放職缺","18","件","+4 本週","up")
  +kpi("group","進行中候選人","342","人","+58 本週","up")
  +kpi("event_available","平均到位天數","26","天","較上季 -21","up")
  +kpi("percent","履歷轉面試率","31","%","+6.2pt","up")+'</div>'
  +'<div class="grid g23" style="margin-bottom:16px"><div class="card"><h3>'+icon("show_chart")+'各週到位天數趨勢<span class="sm">目標 &le; 28 天</span></h3><div class="chartbox" style="height:260px"><canvas id="c0line" aria-label="各週到位天數趨勢圖"></canvas></div></div>'
  +'<div class="card"><h3>'+icon("filter_alt")+'招募轉換漏斗</h3>'+funnelHtml()+'</div></div>'
  +'<div class="grid g2"><div class="card"><h3>'+icon("source")+'各刊登平台履歷來源</h3><div class="chartbox" style="height:230px"><canvas id="c0src" aria-label="履歷來源圖"></canvas></div></div>'
  +'<div class="card"><h3>'+icon("priority_high")+'需關注職缺</h3>'+attnHtml()+'</div></div>';
}
function funnelHtml(){
  var f=[["刊登職缺",100,"18 職缺"],["收到履歷",100,"1,240 份"],["通過初篩",58,"720 人"],["安排面試",31,"384 人"],["面試通過",14,"178 人"],["發出錄取",6,"76 份"]],h='<div class="funnel">';
  for(var i=0;i<f.length;i++)h+='<div class="fstep"><div class="flabel">'+f[i][0]+'</div><div class="fbar" style="width:'+f[i][1]+'%">'+f[i][2]+'</div><div class="fpct">'+f[i][1]+'%</div></div>';
  return h+'</div>';
}
function attnHtml(){
  var r=[["產線作業員（夜班）","缺 12 人","逾期 5 天","t-bad"],["品保檢驗員","到位天數 41 天","偏慢","t-warn"],["設備維修技師","履歷不足 · 僅 8 份","不足","t-warn"],["倉儲理貨員","面試待安排 18 人","待排","t-info"]],h='<div class="checks">';
  for(var i=0;i<r.length;i++){
    var danger=r[i][3]==="t-bad";
    h+='<div class="chk '+(danger?"no":"wait")+'"><div class="ic">'+icon(danger?"error":"schedule")+'</div><div class="cx"><b>'+r[i][0]+'</b><small>'+r[i][1]+'</small></div><span class="tag '+r[i][3]+'">'+r[i][2]+'</span></div>';
  }
  return h+'</div>';
}
function d0(){

function kpi(iconName,label,val,unit,delta,dir){
  var cls=dir==="up"?"up":((dir==="down"||dir==="warn")?"down":"flat");
  var mark=dir==="up"?"trending_up":((dir==="down"||dir==="warn")?"warning":"horizontal_rule");
  return '<div class="kpi"><div class="kl">'+icon(iconName)+label+'</div><div class="kv">'+val+'<small>'+unit+'</small></div><div class="kd '+cls+'">'+icon(mark)+delta+'</div></div>';
}
function baseOpt(o){
  o=o||{};
  var opt={
    responsive:true,
    maintainAspectRatio:false,
    animation:window.matchMedia("(prefers-reduced-motion: reduce)").matches?false:{duration:400},
    plugins:{
      legend:{
        display:!!o.legend,
        position:"bottom",
        labels:{boxWidth:12,color:"#475569",font:{family:"Crimson Pro",size:12}}
      },
      tooltip:{
        backgroundColor:"#134E4A",
        titleColor:"#FFFFFF",
        bodyColor:"#FFFFFF",
        padding:10,
        cornerRadius:6
      }
    }
  };
  if(o.cutout)opt.cutout=o.cutout;
  else opt.scales={
    x:{stacked:!!o.stacked,grid:{display:false},ticks:{color:"#475569",font:{family:"Crimson Pro",size:12}}},
    y:{stacked:!!o.stacked,beginAtZero:true,grid:{color:"#DDE7EA"},ticks:{color:"#475569",font:{family:"Crimson Pro",size:12}}}
  };
  return opt;
}
function radarOpt(){
  return {
    responsive:true,
    maintainAspectRatio:false,
    animation:window.matchMedia("(prefers-reduced-motion: reduce)").matches?false:{duration:400},
    plugins:{legend:{display:true,position:"bottom",labels:{boxWidth:12,color:"#475569",font:{family:"Crimson Pro",size:12}}}},
    scales:{r:{beginAtZero:true,max:100,ticks:{display:false,stepSize:20},pointLabels:{color:"#334155",font:{family:"Crimson Pro",size:12}},grid:{color:"#B8E8E2"},angleLines:{color:"#B8E8E2"}}}
  };
}

var SCR=[s0,s1,s2,s3,s4,s5];
var DRAW=[d0,d1,d2,d3,d4,d5];
function show(i){
  i=Math.max(0,Math.min(i,SCR.length-1));
  clearCharts();
  var box=el("screen");
  box.innerHTML=SCR[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    var active=+btns[b].getAttribute("data-i")===i;
    btns[b].classList.toggle("on",active);
    btns[b].setAttribute("aria-current",active?"page":"false");
  }
  if(typeof Chart!=="undefined"){try{DRAW[i]()}catch(e){}}
}
(function(){
  var nav=el("nav"),h="";
  for(var i=0;i<MODS.length;i++){
    h+='<button type="button" data-i="'+i+'" aria-label="'+MODS[i].name+'">'+icon(MODS[i].icon)+'<span class="lbl">'+MODS[i].name+'</span></button>';
  }
  nav.innerHTML=h;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){location.hash="v"+this.getAttribute("data-i")});
  }
})();
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return}
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
