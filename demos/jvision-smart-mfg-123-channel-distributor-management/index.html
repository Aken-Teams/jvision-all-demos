<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>通路/經銷商管理 Channel & Distributor Management</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#4f46e5; --accent2:#818cf8; --accent-soft:#eef2ff;
  --bg:#f5f6fb; --panel:#ffffff; --ink:#1e2233; --muted:#6b7280;
  --line:#e6e8f0; --ok:#16a34a; --warn:#d97706; --danger:#dc2626; --info:#2563eb;
  --radius:14px; --shadow:0 1px 3px rgba(30,34,51,.06),0 8px 24px rgba(79,70,229,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;font-size:20px}
a{color:inherit;text-decoration:none}
.min0{min-width:0}

.topbar{position:sticky;top:0;z-index:40;background:linear-gradient(100deg,#4f46e5,#6366f1 60%,#818cf8);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 18px rgba(79,70,229,.18)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:0 0 auto}
.brand .logo .material-symbols-outlined{font-size:24px}
.brand h1{font-size:16px;margin:0;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{font-size:11.5px;margin:0;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .spacer{flex:1}
.topbar .env{font-size:11px;background:rgba(255,255,255,.16);padding:5px 11px;border-radius:20px;white-space:nowrap;display:flex;align-items:center;gap:6px}

.shell{display:flex;min-height:calc(100vh - 65px)}
.sidenav{width:230px;flex:0 0 230px;background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.sidenav .grp{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em;padding:12px 12px 6px}
.navbtn{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;border:0;background:transparent;color:var(--ink);cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;text-align:left;width:100%;transition:.15s}
.navbtn .material-symbols-outlined{font-size:21px;color:var(--muted);flex:0 0 auto}
.navbtn small{display:block;font-weight:400;font-size:11px;color:var(--muted);margin-top:1px}
.navbtn:hover{background:var(--accent-soft)}
.navbtn.active{background:var(--accent);color:#fff}
.navbtn.active .material-symbols-outlined,.navbtn.active small{color:#fff;opacity:.9}
.navtxt{min-width:0;overflow:hidden}
.navtxt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.main{flex:1;min-width:0;padding:22px}
.screenhead{margin-bottom:18px}
.screenhead .eyebrow{color:var(--accent);font-weight:700;font-size:12px;letter-spacing:.05em}
.screenhead h2{margin:4px 0 4px;font-size:22px;font-weight:800}
.screenhead p{margin:0;color:var(--muted);font-size:13.5px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:16px}
.cardhead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cardhead h3{margin:0;font-size:14.5px;font-weight:700}
.cardhead .material-symbols-outlined{color:var(--accent);font-size:20px}
.cardhead .sub{font-size:11.5px;color:var(--muted);margin-left:auto;font-weight:500}

.kpigrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow);min-width:0}
.kpi .top{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;font-weight:600}
.kpi .top .material-symbols-outlined{font-size:18px;color:var(--accent)}
.kpi .val{font-size:26px;font-weight:800;margin:8px 0 2px;letter-spacing:-.01em}
.kpi .val span{font-size:13px;color:var(--muted);font-weight:600}
.kpi .delta{font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:2px}
.kpi .delta.up{color:var(--ok)} .kpi .delta.down{color:var(--danger)}
.kpi .delta .material-symbols-outlined{font-size:15px}

.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

.chartwrap{position:relative;height:260px;width:100%;overflow:hidden}
.chartwrap.sm{height:210px}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;color:var(--muted);font-weight:700;background:#fafbff}
tbody tr:hover{background:var(--accent-soft)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.b-ok{background:#dcfce7;color:#15803d}
.b-warn{background:#fef3c7;color:#b45309}
.b-danger{background:#fee2e2;color:#b91c1c}
.b-info{background:#dbeafe;color:#1d4ed8}
.b-mut{background:#eef2ff;color:#4338ca}
.tier{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;font-weight:800;font-size:12px;color:#fff}
.tier.A{background:#4f46e5} .tier.B{background:#818cf8} .tier.C{background:#a5b4fc}

.bar{height:8px;border-radius:6px;background:#eef2ff;overflow:hidden;min-width:60px}
.bar > i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#4f46e5,#818cf8)}

.split{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.listpane{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.searchbar{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line);color:var(--muted)}
.searchbar input{border:0;outline:0;font-family:inherit;font-size:13px;flex:1;min-width:0;background:transparent;color:var(--ink)}
.listitem{display:flex;gap:11px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:.12s}
.listitem:hover{background:var(--accent-soft)}
.listitem.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.listitem .av{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:14px;flex:0 0 auto}
.listitem .meta{min-width:0;flex:1}
.listitem .meta b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.listitem .meta small{color:var(--muted);font-size:11.5px}

.detailpane{display:flex;flex-direction:column;gap:16px;min-width:0}
.profileTop{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.profileTop .bigav{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#4f46e5,#818cf8);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;flex:0 0 auto}
.profileTop h3{margin:0;font-size:18px}
.profileTop .sub{color:var(--muted);font-size:12.5px}
.factgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.fact{background:#fafbff;border:1px solid var(--line);border-radius:11px;padding:11px 13px;min-width:0}
.fact .k{font-size:11px;color:var(--muted);font-weight:600}
.fact .v{font-size:16px;font-weight:800;margin-top:2px}

.timeline{position:relative;padding-left:26px}
.timeline:before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl{position:relative;padding:0 0 18px 6px}
.tl:last-child{padding-bottom:0}
.tl .dot{position:absolute;left:-21px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--accent2)}
.tl.done .dot{background:var(--accent);border-color:var(--accent)}
.tl.now .dot{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tl .tt{font-weight:700;font-size:13.5px}
.tl .td{font-size:12px;color:var(--muted);margin-top:1px}
.tl .tm{font-size:11px;color:var(--accent);font-weight:700}

.ticket{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:11px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.ticket b{font-size:12.5px}
.ticket .row{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.ticket .row .material-symbols-outlined{font-size:16px}

.alertrow{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-bottom:1px solid var(--line)}
.alertrow:last-child{border-bottom:0}
.alertrow .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto}
.alertrow .ic.hi{background:#fee2e2;color:#dc2626}
.alertrow .ic.md{background:#fef3c7;color:#d97706}
.alertrow .ic.lo{background:#dbeafe;color:#2563eb}
.alertrow .body{min-width:0;flex:1}
.alertrow .body b{font-size:13.5px}
.alertrow .body p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.alertrow .body .tags{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;background:#f1f2f8;color:var(--muted)}

.region{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.region:last-child{border-bottom:0}
.region .name{width:64px;flex:0 0 auto;font-size:12.5px;font-weight:600}
.region .track{flex:1;height:22px;background:#f1f2f8;border-radius:8px;overflow:hidden;position:relative;min-width:0}
.region .track > i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#4f46e5,#818cf8)}
.region .pct{width:56px;flex:0 0 auto;text-align:right;font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums}

.lb{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
.lb:last-child{border-bottom:0}
.lb .rk{width:26px;height:26px;border-radius:8px;background:#eef2ff;color:var(--accent);font-weight:800;display:grid;place-items:center;font-size:13px;flex:0 0 auto}
.lb .rk.g{background:#fef3c7;color:#b45309}
.lb .nm{flex:1;min-width:0;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .sc{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}

.note{background:var(--accent-soft);border:1px solid #e0e2f7;border-radius:12px;padding:12px 14px;font-size:12.5px;color:#3730a3;display:flex;gap:10px;align-items:flex-start}
.note .material-symbols-outlined{color:var(--accent);font-size:20px;flex:0 0 auto}

.approvebtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{border:0;border-radius:9px;padding:7px 14px;font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}

@media(max-width:1100px){ .split{grid-template-columns:300px 1fr} }
@media(max-width:960px){
  .kpigrid{grid-template-columns:repeat(2,1fr)}
  .factgrid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:860px){
  .shell{flex-direction:column}
  .sidenav{width:100%;flex:0 0 auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px;gap:8px}
  .sidenav .grp{display:none}
  .navbtn{width:auto;flex:0 0 auto}
  .navbtn small{display:none}
  .main{padding:16px}
}
@media(max-width:820px){
  .grid2,.grid2b,.grid3{grid-template-columns:1fr}
  .split{grid-template-columns:1fr}
}
@media(max-width:560px){
  .kpigrid{grid-template-columns:1fr 1fr}
  .navtxt{display:none}
  .navbtn{padding:10px}
  .brand p{display:none}
  .topbar .env{display:none}
}
@media(max-width:390px){
  .factgrid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">account_tree</span></div>
    <div class="min0">
      <h1>通路 / 經銷商管理平台</h1>
      <p>Channel &amp; Distributor Management · 純 UI 展示</p>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="env"><span class="material-symbols-outlined" style="font-size:15px">verified</span>DEMO 擬真資料</div>
</div>

<div class="shell">
  <nav class="sidenav" id="nav">
    <div class="grp">通路作業</div>
    <button class="navbtn" data-i="0"><span class="material-symbols-outlined">groups</span><span class="navtxt"><b>經銷商主檔</b><small>分級與資格審核</small></span></button>
    <button class="navbtn" data-i="1"><span class="material-symbols-outlined">gavel</span><span class="navtxt"><b>合作條件合約</b><small>返點政策與效期</small></span></button>
    <button class="navbtn" data-i="2"><span class="material-symbols-outlined">request_quote</span><span class="navtxt"><b>通路價格政策</b><small>報價授權與折讓</small></span></button>
    <button class="navbtn" data-i="3"><span class="material-symbols-outlined">inventory_2</span><span class="navtxt"><b>庫存銷售回報</b><small>進銷存與周轉</small></span></button>
    <button class="navbtn" data-i="4"><span class="material-symbols-outlined">shield</span><span class="navtxt"><b>竄貨稽核</b><small>跨區流向偵測</small></span></button>
    <button class="navbtn" data-i="5"><span class="material-symbols-outlined">trending_up</span><span class="navtxt"><b>業績與獎勵</b><small>達成率與返點</small></span></button>
  </nav>
  <main class="main"><div id="view"></div></main>
</div>

<script>
"use strict";
var chartRegistry={};
function destroyCharts(){for(var k in chartRegistry){try{chartRegistry[k].destroy();}catch(e){}}chartRegistry={};}
function mkChart(id,cfg){var el=document.getElementById(id);if(!el)return;chartRegistry[id]=new Chart(el.getContext("2d"),cfg);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
var INDIGO="#4f46e5",INDIGO2="#818cf8",INDIGO3="#a5b4fc",GRID="#eef0f7";
Chart.defaults.font.family='"Inter","Noto Sans TC",sans-serif';
Chart.defaults.color="#6b7280";
Chart.defaults.font.size=12;

var DEALERS=[
  {code:"D-2041",name:"北辰通路 北區旗艦",tier:"A",region:"北區",owner:"陳映辰",statusTxt:"合作中",ytd:1820,target:2000,turn:6.4,credit:"良好",since:"2019",contact:"02-2745-1188",overdue:0},
  {code:"D-2088",name:"中盟經銷 中區",tier:"A",region:"中區",owner:"林柏宇",statusTxt:"合作中",ytd:1540,target:1600,turn:5.8,credit:"良好",since:"2020",contact:"04-2312-6600",overdue:1},
  {code:"D-3120",name:"南方電通 高雄站",tier:"B",region:"南區",owner:"黃詩涵",statusTxt:"合作中",ytd:980,target:1200,turn:4.1,credit:"觀察",since:"2021",contact:"07-556-2020",overdue:2},
  {code:"D-3355",name:"東岸科技 花蓮",tier:"C",region:"東區",owner:"吳承翰",statusTxt:"審核中",ytd:0,target:400,turn:0,credit:"待評",since:"2026",contact:"03-833-7788",overdue:0},
  {code:"D-3402",name:"竹科數位 新竹",tier:"B",region:"北區",owner:"許雅婷",statusTxt:"合作中",ytd:1120,target:1300,turn:5.2,credit:"良好",since:"2022",contact:"03-577-9090",overdue:0},
  {code:"D-3560",name:"海線倉儲 沙鹿",tier:"C",region:"中區",owner:"張哲維",statusTxt:"暫停",ytd:210,target:600,turn:2.3,credit:"警示",since:"2023",contact:"04-2662-1414",overdue:4},
  {code:"D-3611",name:"屏東通商 里港",tier:"B",region:"南區",owner:"鄭子芸",statusTxt:"合作中",ytd:760,target:900,turn:4.9,credit:"良好",since:"2022",contact:"08-772-3535",overdue:0}
];
function statusBadge(s){return s==="合作中"?"b-ok":s==="審核中"?"b-info":s==="暫停"?"b-danger":"b-warn";}

/* ---------- SCREEN 0 : 經銷商主檔 (split workspace signature) ---------- */
function screen0(){
  var items=DEALERS.map(function(d,i){
    return '<div class="listitem'+(i===0?' sel':'')+'" data-d="'+i+'" onclick="selDealer('+i+')">'+
      '<div class="av">'+esc(d.tier)+'</div>'+
      '<div class="meta"><b>'+esc(d.name)+'</b>'+
      '<small>'+esc(d.code)+' · '+esc(d.region)+' · <span class="badge '+statusBadge(d.statusTxt)+'" style="padding:1px 7px">'+esc(d.statusTxt)+'</span></small></div></div>';
  }).join("");
  var html=''+
  '<div class="screenhead"><div class="eyebrow">MODULE 01 · 經銷商主檔與分級</div>'+
  '<h2>經銷商主檔與分級管理</h2><p>左側清單挑選經銷商，右側檢視 360° 檔案、授權區域與資格審核狀態。</p></div>'+
  '<div class="split">'+
    '<div class="listpane">'+
      '<div class="searchbar"><span class="material-symbols-outlined" style="font-size:19px">search</span>'+
      '<input placeholder="搜尋經銷商 / 代碼 / 區域"/></div>'+
      '<div id="dealerlist">'+items+'</div>'+
    '</div>'+
    '<div class="detailpane" id="dealerdetail"></div>'+
  '</div>';
  document.getElementById("view").innerHTML=html;
  selDealer(0);
}
function selDealer(i){
  var d=DEALERS[i];if(!d)return;
  var nodes=document.querySelectorAll("#dealerlist .listitem");
  for(var k=0;k<nodes.length;k++){nodes[k].classList.toggle("sel",String(k)===String(i));}
  var pct=d.target?Math.round(d.ytd/d.target*100):0;
  var checks=[
    {k:"營業登記文件",ok:d.statusTxt!=="審核中"},
    {k:"授權區域切結書",ok:d.statusTxt!=="審核中"},
    {k:"信用額度核定",ok:d.credit==="良好"},
    {k:"合作合約簽署",ok:d.statusTxt==="合作中"||d.statusTxt==="暫停"}
  ];
  var chk=checks.map(function(c){
    return '<div style="display:flex;align-items:center;gap:8px;font-size:12.5px;padding:7px 0;border-bottom:1px dashed var(--line)">'+
    '<span class="material-symbols-outlined" style="font-size:19px;color:'+(c.ok?'var(--ok)':'var(--muted)')+'">'+(c.ok?'task_alt':'radio_button_unchecked')+'</span>'+esc(c.k)+'</div>';
  }).join("");
  var html=''+
  '<div class="card pad">'+
    '<div class="profileTop">'+
      '<div class="bigav">'+esc(d.tier)+'</div>'+
      '<div class="min0" style="flex:1"><h3>'+esc(d.name)+'</h3>'+
      '<div class="sub">'+esc(d.code)+' · 授權區域 '+esc(d.region)+' · 合作起 '+esc(d.since)+' 年</div></div>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap"><span class="badge '+statusBadge(d.statusTxt)+'">'+esc(d.statusTxt)+'</span>'+
      '<span class="badge b-mut">'+esc(d.tier)+' 級經銷</span></div>'+
    '</div>'+
    '<div class="factgrid" style="margin-top:16px">'+
      '<div class="fact"><div class="k">YTD 進貨額</div><div class="v">'+d.ytd+'<span style="font-size:12px;color:var(--muted)"> 萬</span></div></div>'+

/* ---------- controller ---------- */
var SCREENS=[screen0,screen1,screen2,screen3,screen4,screen5];
function show(i){
  destroyCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){btns[k].classList.toggle("active",String(btns[k].getAttribute("data-i"))===String(i));}
  var fn=SCREENS[i]||SCREENS[0];
  fn();
}
var navEl=document.getElementById("nav");
navEl.addEventListener("click",function(e){
  var b=e.target.closest?e.target.closest("[data-i]"):null;
  if(!b)return;
  var i=+b.getAttribute("data-i");
  if(location.hash!=="#v"+i){location.hash="v"+i;}else{show(i);}
});
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
