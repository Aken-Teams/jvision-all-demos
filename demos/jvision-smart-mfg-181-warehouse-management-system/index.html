<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>庫存與儲位管理 WMS｜Jvision 系統 Demo</title>
  <meta name="description" content="收貨到出貨的倉內作業與庫存精準管理" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root{
      --color-primary:#334155;
      --color-on-primary:#fff;
      --color-secondary:#475569;
      --color-on-secondary:#fff;
      --color-accent:#059669;
      --color-on-accent:#000;
      --color-background:#f8fafc;
      --color-foreground:#0f172a;
      --color-card:#fff;
      --color-card-foreground:#0f172a;
      --color-muted:#f2f3f4;
      --color-muted-foreground:#475569;
      --color-border:#e6e8ea;
      --color-destructive:#dc2626;
      --color-on-destructive:#fff;
      --color-ring:#334155;

      --blue:#334155;
      --ink:#0f172a;
      --muted:#475569;
      --line:#e6e8ea;

      --bg:var(--color-background);
      --card:var(--color-card);
      --sb:#172033;
      --sb2:#243044;
      --sbtext:#dbe3ec;
      --ok:#047857;
      --warn:#b45309;
      --bad:#b91c1c;
      --info:#1d4ed8;
      --accent:#059669;
      --accent2:#10b981;
      --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    html,body{margin:0;min-height:100%}
    body{
      background:var(--bg);
      color:var(--ink);
      font-family:"Open Sans",system-ui,sans-serif;
      font-size:14px;
      line-height:1.55;
      -webkit-font-smoothing:antialiased;
    }
    button{font:inherit}
    button,[role="button"]{cursor:pointer}
    button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
      outline:3px solid rgba(51,65,85,.35);
      outline-offset:3px;
    }
    .material-symbols-outlined{
      font-family:"Material Symbols Outlined";
      font-weight:normal;
      font-style:normal;
      line-height:1;
      vertical-align:middle;
      font-feature-settings:"liga";
    }

    .shell{display:flex;min-height:100vh;width:100%}
    .sidebar{
      position:sticky;
      top:0;
      width:264px;
      height:100vh;
      flex:0 0 264px;
      display:flex;
      flex-direction:column;
      padding:24px 16px;
      overflow:auto;
      background:var(--sb);
      color:var(--sbtext);
      border-right:1px solid #253147;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      padding:0 8px 24px;
      border-bottom:1px solid rgba(255,255,255,.1);
    }
    .brand .logo{
      width:42px;
      height:42px;
      flex:0 0 42px;
      display:grid;
      place-items:center;
      color:#fff;
      background:var(--accent);
      border-radius:8px;
    }
    .brand .logo .material-symbols-outlined{font-size:24px}
    .brand b{
      display:block;
      color:#fff;
      font-family:"Poppins","Open Sans",sans-serif;
      font-size:15px;
      font-weight:600;
      letter-spacing:.01em;
    }
    .brand span:not(.material-symbols-outlined){
      display:block;
      margin-top:2px;
      color:#aebac9;
      font-size:10px;
      letter-spacing:.04em;
    }
    .nav{
      display:flex;
      flex-direction:column;
      gap:5px;
      margin-top:22px;
    }
    .nav button{
      display:flex;
      align-items:center;
      gap:12px;
      width:100%;
      min-height:46px;
      padding:11px 12px;
      overflow:hidden;
      color:#cbd5e1;
      text-align:left;
      background:transparent;
      border:1px solid transparent;
      border-radius:7px;
      transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .2s ease;
    }
    .nav button .material-symbols-outlined{
      flex:0 0 auto;
      color:#94a3b8;
      font-size:21px;
      transition:color .2s ease;
    }
    .nav button .nt{
      min-width:0;
      overflow:hidden;
      font-size:13px;
      font-weight:600;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .nav button:hover{
      color:#fff;
      background:var(--sb2);
      border-color:#3a485d;
      transform:translateX(2px);
    }
    .nav button.on{
      color:#fff;
      background:#334155;
      border-color:#64748b;
      box-shadow:inset 3px 0 0 var(--accent);
    }
    .nav button.on .material-symbols-outlined{color:#6ee7b7}
    .sb-foot{
      margin-top:auto;
      padding:18px 10px 0;
      color:#94a3b8;
      font-size:11px;
      line-height:1.75;
      border-top:1px solid rgba(255,255,255,.1);
    }
    .sb-foot b{color:#e2e8f0;font-weight:700}

    .main{
      flex:1 1 auto;
      min-width:0;
      max-width:1600px;
      padding:30px clamp(18px,3vw,44px) 52px;
    }
    .topbar{
      position:sticky;
      z-index:20;
      top:0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      min-height:92px;
      margin:-30px calc(clamp(18px,3vw,44px) * -1) 24px;
      padding:22px clamp(18px,3vw,44px);
      background:rgba(248,250,252,.94);
      border-bottom:1px solid var(--line);
      backdrop-filter:blur(12px);
    }
    .topbar h1{
      margin:0 0 3px;
      color:var(--ink);
      font-family:"Poppins","Open Sans",sans-serif;
      font-size:clamp(20px,2vw,27px);
      font-weight:600;
      letter-spacing:-.025em;
    }
    .topbar .sub{color:var(--muted);font-size:12.5px}
    .crumbs{
      display:flex;
      align-items:center;
      gap:5px;
      margin-bottom:5px;
      color:#64748b;
      font-size:11px;
      font-weight:600;
    }
    .crumbs .material-symbols-outlined{font-size:14px}
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      min-height:38px;
      padding:8px 13px;
      color:#334155;
      font-size:11.5px;
      font-weight:700;
      white-space:nowrap;
      background:#fff;
      border:1px solid var(--line);
      border-radius:999px;
    }
    .pill .dot{
      position:relative;
      width:9px;
      height:9px;
      border-radius:50%;
      background:var(--accent);
    }
    .pill .dot::after{
      position:absolute;
      inset:-4px;
      content:"";
      border:1px solid rgba(5,150,105,.25);
      border-radius:50%;
    }

    .grid{display:grid;gap:16px;min-width:0}
    .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .g23{grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr)}
    .g32{grid-template-columns:minmax(300px,1fr) minmax(0,1.5fr)}
    .card{
      min-width:0;
      padding:19px;
      overflow:hidden;
      color:var(--color-card-foreground);
      background:var(--card);
      border:1px solid var(--line);
      border-radius:10px;
      box-shadow:0 1px 2px rgba(15,23,42,.035);
      transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
    }
    .card:hover{
      border-color:#cbd5e1;
      box-shadow:0 5px 14px rgba(15,23,42,.06);
      transform:translateY(-1px);
    }
    .card h3{
      display:flex;
      align-items:center;
      gap:8px;
      margin:0 0 3px;
      font-family:"Poppins","Open Sans",sans-serif;
      font-size:13.5px;
      font-weight:600;
      letter-spacing:-.01em;
    }
    .card h3 .material-symbols-outlined{color:var(--accent);font-size:19px}
    .card .ch-sub{margin-bottom:14px;color:var(--muted);font-size:11.5px}

    .kpi{position:relative;padding:18px}
    .kpi::after{
      position:absolute;
      top:0;
      right:0;
      width:42px;
      height:3px;
      content:"";
      background:var(--accent);
    }
    .kpi .lab{
      display:flex;
      align-items:center;
      gap:9px;
      color:var(--muted);
      font-size:11.5px;
      font-weight:600;
    }
    .kpi .lab .ic{
      display:grid;
      width:32px;
      height:32px;
      place-items:center;
      color:#047857;
      background:#ecfdf5;
      border:1px solid #d1fae5;
      border-radius:7px;
    }
    .kpi .lab .ic .material-symbols-outlined{font-size:18px}
    .kpi .val{
      margin-top:12px;
      color:var(--ink);
      font-family:"Poppins",sans-serif;
      font-size:27px;
      font-weight:600;
      font-variant-numeric:tabular-nums;
      letter-spacing:-.04em;
    }
    .kpi .val small{
      margin-left:4px;
      color:var(--muted);
      font-family:"Open Sans",sans-serif;
      font-size:12px;
      font-weight:600;
      letter-spacing:0;
    }
    .kpi .delta{
      display:inline-flex;
      align-items:center;
      gap:4px;
      margin-top:5px;
      font-size:11px;
      font-weight:700;
    }
    .kpi .delta .material-symbols-outlined{font-size:15px}
    .up{color:#047857}
    .down{color:#b91c1c}
    .flat{color:#475569}

    .chart{width:100%;height:280px;min-width:0;overflow:hidden}
    .chart.sm{height:220px}
    .ovf{
      overflow-x:auto;
      border:1px solid var(--line);
      border-radius:8px;
      scrollbar-color:#cbd5e1 transparent;
    }
    table{
      width:100%;
      min-width:520px;
      border-collapse:collapse;
      font-size:12px;
    }
    th,td{
      padding:11px 12px;
      text-align:left;
      white-space:nowrap;
      border-bottom:1px solid var(--line);
    }
    th{
      color:#475569;
      font-size:10.5px;
      font-weight:700;
      letter-spacing:.045em;
      text-transform:uppercase;
      background:#f8fafc;
    }
    td{color:#334155}
    td b{color:#0f172a;font-weight:700}
    tbody tr:last-child td{border-bottom:0}
    tbody tr{transition:background-color .18s ease}
    tbody tr:hover{background:#f8fafc}
    td.numeric{
      text-align:right;
      font-variant-numeric:tabular-nums;
    }
    td.code,.mono{
      font-family:var(--mono);
      font-size:.96em;
      font-variant-numeric:tabular-nums;
    }

    .tag{
      display:inline-flex;
      align-items:center;
      gap:5px;
      padding:4px 8px;
      border:1px solid transparent;
      border-radius:5px;
      font-size:10.5px;
      font-weight:700;
      line-height:1.2;
    }
    .tag::before{
      width:6px;
      height:6px;
      flex:0 0 6px;
      content:"";
      border-radius:50%;
      background:currentColor;
    }
    .t-ok{color:#047857;background:#ecfdf5;border-color:#a7f3d0}
    .t-warn{color:#92400e;background:#fffbeb;border-color:#fde68a}
    .t-bad{color:#b91c1c;background:#fef2f2;border-color:#fecaca}
    .t-info{color:#1d4ed8;background:#eff6ff;border-color:#bfdbfe}
    .t-mut{color:#475569;background:#f8fafc;border-color:#cbd5e1}

    .bar{
      height:7px;
      min-width:70px;
      overflow:hidden;
      background:#e8edf2;
      border-radius:2px;
    }
    .bar>i{
      display:block;
      height:100%;
      background:var(--accent);
      border-radius:2px;
    }
    .stat-strip{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:12px;
    }
    .stat-strip .s,.minik .m{
      min-width:0;
      padding:14px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:8px;
    }
    .stat-strip .s .l,.minik .m .l{
      color:var(--muted);
      font-size:11px;
      font-weight:600;
    }
    .stat-strip .s .v,.minik .m .v{
      margin-top:4px;
      color:var(--ink);
      font-family:"Poppins",sans-serif;
      font-size:21px;
      font-weight:600;
      font-variant-numeric:tabular-nums;
    }
    .minik{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}

    .board{
      display:grid;
      grid-template-columns:repeat(4,minmax(190px,1fr));
      gap:12px;
      min-width:820px;
    }
    .col{
      min-width:0;
      padding:11px;
      background:#f8fafc;
      border:1px solid var(--line);
      border-radius:8px;
    }
    .col .hd{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:10px;
      color:#334155;
      font-size:11.5px;
      font-weight:700;
    }
    .col .hd .cnt{
      min-width:25px;
      padding:2px 8px;
      color:var(--muted);
      text-align:center;
      background:#fff;
      border:1px solid var(--line);
      border-radius:999px;
    }
    .ticket{
      margin-bottom:8px;
      padding:11px;
      background:#fff;
      border:1px solid var(--line);
      border-left:3px solid var(--accent);
      border-radius:6px;
      transition:border-color .2s ease,transform .2s ease;
    }
    .ticket:hover{border-color:#94a3b8;transform:translateY(-1px)}
    .ticket .tt{font-size:12px;font-weight:700}
    .ticket .mt{
      display:flex;
      justify-content:space-between;
      gap:8px;
      margin-top:5px;
      color:var(--muted);
      font-size:10.5px;
      font-variant-numeric:tabular-nums;
    }

    .tl{position:relative;padding-left:28px}
    .tl::before{
      position:absolute;
      top:4px;
      bottom:4px;
      left:9px;
      width:2px;
      content:"";
      background:var(--line);
    }
    .tl .ev{position:relative;padding:0 0 18px 5px}
    .tl .ev::before{
      position:absolute;
      top:3px;
      left:-24px;
      width:11px;
      height:11px;
      content:"";
      background:#fff;
      border:3px solid #94a3b8;
      border-radius:50%;
    }
    .tl .ev.done::before{background:var(--accent);border-color:var(--accent)}
    .tl .ev .tm{
      color:var(--muted);
      font-family:var(--mono);
      font-size:10.5px;
      font-weight:700;
    }
    .tl .ev .ti{margin:2px 0;color:var(--ink);font-size:12.5px;font-weight:700}
    .tl .ev .ds{color:var(--muted);font-size:11px}

    .heat{
      display:grid;
      grid-template-columns:repeat(10,minmax(30px,1fr));
      gap:6px;
      min-width:420px;
    }
    .heat .cell{
      display:grid;
      min-width:0;
      aspect-ratio:1;
      place-items:center;
      color:#fff;
      font-family:var(--mono);
      font-size:9px;
      font-weight:700;
      border:1px solid rgba(15,23,42,.12);
      border-radius:4px;
    }
    .legend{
      display:flex;
      align-items:center;
      gap:7px;
      margin-top:12px;
      color:var(--muted);
      font-size:10.5px;
      flex-wrap:wrap;
    }
    .legend .sw{
      display:inline-block;
      width:13px;
      height:13px;
      margin-left:5px;
      border:1px solid rgba(15,23,42,.12);
      border-radius:3px;
    }

    .prow{
      display:flex;
      align-items:center;
      gap:12px;
      padding:10px 0;
      border-bottom:1px solid var(--line);
    }
    .prow:last-child{border-bottom:0}
    .prow .nm{
      flex:0 0 116px;
      min-width:0;
      overflow:hidden;
      font-size:11.5px;
      font-weight:700;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .prow .bar{flex:1 1 auto}
    .prow .pc{
      flex:0 0 44px;
      color:#334155;
      font-family:var(--mono);
      font-size:11px;
      font-weight:700;
      text-align:right;
    }

    .alist .al{
      display:flex;
      align-items:flex-start;
      gap:11px;
      margin-bottom:8px;
      padding:11px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:7px;
    }
    .alist .al:last-child{margin-bottom:0}
    .alist .al .ai{
      display:grid;
      width:34px;
      height:34px;
      flex:0 0 34px;
      place-items:center;
      border:1px solid currentColor;
      border-radius:6px;
    }
    .alist .al .ai .material-symbols-outlined{font-size:18px}
    .alist .al .at{color:var(--ink);font-size:12px;font-weight:700}
    .alist .al .ad{margin-top:2px;color:var(--muted);font-size:11px}
    .ai.bad{color:#b91c1c;background:#fef2f2}
    .ai.warn{color:#92400e;background:#fffbeb}
    .ai.info{color:#1d4ed8;background:#eff6ff}
    .ai.ok{color:#047857;background:#ecfdf5}

    .split{display:grid;grid-template-columns:310px minmax(0,1fr);gap:16px}
    .pda{
      padding:13px;
      color:#e2e8f0;
      background:#1e293b;
      border:1px solid #334155;
      border-radius:14px;
    }
    .pda .scr{
      min-height:230px;
      padding:14px;
      background:#0f172a;
      border:1px solid #334155;
      border-radius:8px;
    }
    .pda .scan{
      padding:16px;
      color:#6ee7b7;
      text-align:center;
      background:#13251f;
      border:1px dashed #34d399;
      border-radius:6px;
    }
    .pda .scan .material-symbols-outlined{font-size:38px}
    .pda .row{
      display:flex;
      justify-content:space-between;
      gap:12px;
      padding:7px 0;
      font-size:11px;
      border-bottom:1px solid #26354a;
    }
    .pda .row span:first-child{color:#aebac9}
    .pda .row b{
      color:#fff;
      font-family:var(--mono);
      font-variant-numeric:tabular-nums;
    }

    .note{
      display:flex;
      align-items:flex-start;
      gap:9px;
      padding:11px 13px;
      color:#713f12;
      font-size:11.5px;
      background:#fffbeb;
      border:1px solid #fde68a;
      border-left:4px solid #d97706;
      border-radius:6px;
    }
    .note .material-symbols-outlined{
      flex:0 0 auto;
      color:#b45309;
      font-size:18px;
    }

    #view>.grid,#view>.card,#view>.split,#view>.stat-strip{
      animation:reveal .4s cubic-bezier(.2,.85,.35,1.15) both;
    }
    #view>:nth-child(2){animation-delay:.06s}
    #view>:nth-child(3){animation-delay:.12s}
    @keyframes reveal{
      from{opacity:0;transform:translateY(12px) scale(.985)}
      to{opacity:1;transform:none}
    }

    @media(max-width:1100px){
      .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
      .g23,.g32{grid-template-columns:1fr}
    }
    @media(max-width:860px){
      .shell{display:block}
      .sidebar{
        position:sticky;
        z-index:30;
        top:0;
        width:100%;
        height:auto;
        padding:10px 12px;
        overflow-x:auto;
        flex-direction:row;
        align-items:center;
        border-right:0;
        border-bottom:1px solid #334155;
      }
      .brand{
        flex:0 0 auto;
        padding:0 14px 0 2px;
        border:0;
      }
      .brand .logo{width:38px;height:38px;flex-basis:38px}
      .nav{flex:0 0 auto;flex-direction:row;margin:0;gap:5px}
      .nav button{width:auto;min-height:40px;padding:8px 10px}
      .nav button:hover{transform:none}
      .sb-foot{display:none}
      .main{padding:22px 16px 36px}
      .topbar{
        position:relative;
        top:auto;
        min-height:0;
        margin:-22px -16px 20px;
        padding:18px 16px;
        backdrop-filter:none;
      }
      .stat-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media(max-width:680px){
      .g4,.g3,.g2,.g23,.g32,.split{grid-template-columns:1fr}
      .topbar{align-items:flex-start;flex-direction:column}
      .pill{align-self:flex-start}
      .chart{height:250px}
      .chart.sm{height:210px}
      .heat{grid-template-columns:repeat(6,minmax(38px,1fr))}
      .minik{grid-template-columns:1fr}
    }
    @media(max-width:480px){
      .nav button .nt{display:none}
      .nav button{padding:9px}
      .brand b{font-size:13px}
      .brand span:not(.material-symbols-outlined){display:none}
      .card{padding:15px}
      .stat-strip{grid-template-columns:1fr 1fr}
      .stat-strip .s{padding:12px}

    var RENDER=[v0,v1,v2,v3,v4,v5];

    function buildNav(){
      var nav=document.getElementById("nav");
      var html="";
      for(var i=0;i<SCREENS.length;i++){
        html+='<button type="button" data-i="'+i+'"><span class="material-symbols-outlined" aria-hidden="true">'+SCREENS[i].icon+'</span><span class="nt">'+SCREENS[i].name+'</span></button>';
      }
      nav.innerHTML=html;
      var buttons=nav.querySelectorAll("[data-i]");
      for(var j=0;j<buttons.length;j++){
        buttons[j].addEventListener("click",function(){
          location.hash="v"+this.getAttribute("data-i");
        });
      }
    }

    function decorateTables(container){
      var cells=container.querySelectorAll("tbody td");
      for(var i=0;i<cells.length;i++){
        var text=cells[i].textContent.trim();
        if(/^[+\-]?\d[\d,.]*(?:%|h|天| 單)?$/.test(text)||/^\d+\/\d+$/.test(text)){
          cells[i].classList.add("numeric");
        }
        if(/^(?:ASN|INV|SO|SCR|BRG|MTR|WIRE|OIL|PLT|KAB|[A-E][區区]-)[A-Z0-9區区-]+/.test(text)){
          cells[i].classList.add("code");
        }
      }
    }

    function show(i){
      disposeAll();
      var container=document.getElementById("view");
      var screen=SCREENS[i];

      document.getElementById("scrTitle").textContent=screen.title;
      document.getElementById("scrSub").textContent=screen.sub;
      document.getElementById("crumbs").innerHTML='<span class="material-symbols-outlined" aria-hidden="true">home</span> WMS 倉儲管理 <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span> '+screen.name;

      var buttons=document.querySelectorAll("[data-i]");
      for(var b=0;b<buttons.length;b++){
        var selected=(+buttons[b].getAttribute("data-i"))===i;
        buttons[b].classList.toggle("on",selected);
        buttons[b].setAttribute("aria-current",selected?"page":"false");
      }

      container.innerHTML=RENDER[i]();
      decorateTables(container);
      void container.offsetHeight;
      DRAW[i]();
    }

    buildNav();

    function fromHash(){
      var match=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
      if(!match){
        show(0);
        return;
      }
      var count=document.querySelectorAll("[data-i]").length||6;
      show(Math.min(+match[1],count-1));
      try{window.scrollTo(0,0)}catch(e){}
    }

    window.addEventListener("hashchange",fromHash);
    fromHash();
  })();
