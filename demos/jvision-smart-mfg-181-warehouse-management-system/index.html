<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>庫存與儲位管理 WMS｜Jvision 系統 Demo</title>
  <meta name="description" content="收貨到出貨的倉內作業與庫存精準管理" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root{
      --accent:#dc2626; --accent2:#f97316;
      --ink:#1c1917; --muted:#78716c; --line:#e7e5e4;
      --bg:#f5f5f4; --card:#ffffff;
      --sb:#1c1917; --sb2:#292524; --sbtext:#d6d3d1;
      --ok:#16a34a; --warn:#f97316; --bad:#dc2626; --info:#2563eb;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
      background:var(--bg); color:var(--ink); font-size:14px; line-height:1.55;
      -webkit-font-smoothing:antialiased;
    }
    .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;-webkit-font-feature-settings:'liga';}
    .shell{display:flex;min-height:100vh;width:100%;max-width:100%}
    /* Sidebar */
    .sidebar{
      width:250px;flex:0 0 250px;background:var(--sb);color:var(--sbtext);
      display:flex;flex-direction:column;padding:18px 14px;min-width:0;
    }
    .brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px}
    .brand .logo{
      width:40px;height:40px;border-radius:11px;flex:0 0 40px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      display:flex;align-items:center;justify-content:center;color:#fff;
    }
    .brand .logo .material-symbols-outlined{font-size:24px}
    .brand b{color:#fff;font-size:15px;font-weight:800;display:block;letter-spacing:.3px}
    .brand span{font-size:11px;color:#a8a29e}
    .nav{display:flex;flex-direction:column;gap:4px;margin-top:6px}
    .nav button{
      display:flex;align-items:center;gap:12px;width:100%;text-align:left;
      background:transparent;border:0;color:var(--sbtext);cursor:pointer;
      padding:11px 12px;border-radius:10px;font-family:inherit;font-size:13.5px;font-weight:600;
      transition:.15s;min-width:0;
    }
    .nav button .material-symbols-outlined{font-size:21px;flex:0 0 auto;color:#a8a29e}
    .nav button .nt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .nav button:hover{background:var(--sb2);color:#fff}
    .nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
    .nav button.on .material-symbols-outlined{color:#fff}
    .sb-foot{margin-top:auto;padding:14px 10px 4px;font-size:11px;color:#78716c;border-top:1px solid #3f3c39}
    .sb-foot b{color:#e7e5e4;font-weight:700}
    /* Main */
    .main{flex:1 1 auto;min-width:0;padding:22px 26px 40px;max-width:100%}
    .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
    .topbar h1{font-size:20px;margin:0 0 3px;font-weight:800;letter-spacing:.3px}
    .topbar .sub{color:var(--muted);font-size:12.5px}
    .crumbs{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-bottom:6px}
    .crumbs .material-symbols-outlined{font-size:14px}
    .pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:12px;font-weight:700;color:#44403c}
    .pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
    /* generic */
    .grid{display:grid;gap:14px;min-width:0}
    .g4{grid-template-columns:repeat(4,1fr)}
    .g3{grid-template-columns:repeat(3,1fr)}
    .g2{grid-template-columns:repeat(2,1fr)}
    .g23{grid-template-columns:1.6fr 1fr}
    .g32{grid-template-columns:1fr 1.5fr}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
    .card h3{margin:0 0 3px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
    .card h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
    .card .ch-sub{color:var(--muted);font-size:11.5px;margin-bottom:12px}
    .kpi .lab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px}
    .kpi .lab .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:#fef2f2;color:var(--accent)}
    .kpi .lab .ic .material-symbols-outlined{font-size:18px}
    .kpi .val{font-size:27px;font-weight:900;margin-top:10px;letter-spacing:-.5px;font-family:"Inter"}
    .kpi .val small{font-size:13px;font-weight:700;color:var(--muted);margin-left:3px}
    .kpi .delta{font-size:11.5px;font-weight:700;margin-top:5px;display:inline-flex;align-items:center;gap:3px}
    .kpi .delta .material-symbols-outlined{font-size:15px}
    .up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--muted)}
    .chart{width:100%;height:280px;overflow:hidden;min-width:0}
    .chart.sm{height:220px}
    table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
    th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
    th{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;background:#fafaf9}
    tbody tr:hover{background:#fafaf9}
    td b{font-weight:700}
    .tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
    .t-ok{background:#dcfce7;color:#15803d}
    .t-warn{background:#ffedd5;color:#c2410c}
    .t-bad{background:#fee2e2;color:#b91c1c}
    .t-info{background:#dbeafe;color:#1d4ed8}
    .t-mut{background:#f5f5f4;color:#57534e}
    .bar{height:7px;border-radius:99px;background:#f0efee;overflow:hidden;min-width:70px}
    .bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
    .ovf{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
    .ovf table{border:0}
    .ovf th{border-top:0}
    .sec-title{font-size:13px;font-weight:800;margin:2px 0 4px;display:flex;align-items:center;gap:8px}
    .sec-title .material-symbols-outlined{font-size:18px;color:var(--accent)}
    /* board / kanban */
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0}
    .col{background:#faf9f8;border:1px solid var(--line);border-radius:12px;padding:11px;min-width:0}
    .col .hd{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:800;margin-bottom:9px}
    .col .hd .cnt{background:#fff;border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-size:11px;color:var(--muted)}
    .ticket{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;border-left:3px solid var(--accent)}
    .ticket .tt{font-size:12.5px;font-weight:700}
    .ticket .mt{font-size:11px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
    /* timeline */
    .tl{position:relative;padding-left:26px}
    .tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
    .tl .ev{position:relative;padding:0 0 16px 4px}
    .tl .ev::before{content:"";position:absolute;left:-21px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
    .tl .ev.done::before{background:var(--accent);border-color:var(--accent)}
    .tl .ev .tm{font-size:11px;color:var(--muted);font-weight:700}
    .tl .ev .ti{font-size:13px;font-weight:700;margin:1px 0}
    .tl .ev .ds{font-size:11.5px;color:var(--muted)}
    /* heatmap grid (signature) */
    .heat{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;min-width:0}
    .heat .cell{aspect-ratio:1/1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;color:#fff;cursor:default;min-width:0}
    .legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-top:11px;flex-wrap:wrap}
    .legend .sw{width:14px;height:14px;border-radius:4px;display:inline-block}
    /* progress rows */
    .prow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
    .prow:last-child{border-bottom:0}
    .prow .nm{flex:0 0 108px;font-size:12px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis}
    .prow .bar{flex:1 1 auto}
    .prow .pc{flex:0 0 44px;text-align:right;font-size:12px;font-weight:800}
    /* alert list */
    .alist .al{display:flex;gap:11px;padding:11px;border:1px solid var(--line);border-radius:11px;margin-bottom:9px;align-items:flex-start}
    .alist .al .ai{width:34px;height:34px;flex:0 0 34px;border-radius:9px;display:flex;align-items:center;justify-content:center}
    .alist .al .ai .material-symbols-outlined{font-size:19px}
    .alist .al .at{font-size:12.5px;font-weight:700}
    .alist .al .ad{font-size:11.5px;color:var(--muted);margin-top:2px}
    .ai.bad{background:#fee2e2;color:#b91c1c}.ai.warn{background:#ffedd5;color:#c2410c}.ai.info{background:#dbeafe;color:#1d4ed8}.ai.ok{background:#dcfce7;color:#15803d}
    /* pda mock (signature for barcode) */
    .split{display:grid;grid-template-columns:300px 1fr;gap:14px;min-width:0}
    .pda{background:var(--sb);border-radius:20px;padding:14px;color:#e7e5e4}
    .pda .scr{background:#0c0a09;border-radius:12px;padding:14px;min-height:230px}
    .pda .scan{border:2px dashed #f97316;border-radius:10px;padding:16px;text-align:center;color:#fdba74}
    .pda .scan .material-symbols-outlined{font-size:40px}
    .pda .row{display:flex;justify-content:space-between;font-size:11.5px;padding:6px 0;border-bottom:1px solid #292524}
    .pda .row span:first-child{color:#a8a29e}
    .pda .row b{color:#fff}
    .minik{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
    .minik .m{background:#faf9f8;border:1px solid var(--line);border-radius:11px;padding:11px}
    .minik .m .v{font-size:20px;font-weight:900}
    .minik .m .l{font-size:11px;color:var(--muted);font-weight:600}
    .stat-strip{display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
    .stat-strip .s{flex:1 1 120px;background:#faf9f8;border:1px solid var(--line);border-radius:11px;padding:11px 13px;min-width:0}
    .stat-strip .s .l{font-size:11px;color:var(--muted);font-weight:600}
    .stat-strip .s .v{font-size:18px;font-weight:900;margin-top:2px}
    .note{background:#fff7ed;border:1px solid #fed7aa;border-radius:11px;padding:11px 13px;font-size:12px;color:#9a3412;display:flex;gap:9px;align-items:flex-start}
    .note .material-symbols-outlined{font-size:18px;color:var(--accent2);flex:0 0 auto}
    @media(max-width:860px){
      .shell{flex-direction:column}
      .sidebar{width:100%;flex:none;flex-direction:row;align-items:center;padding:10px 12px;overflow-x:auto}
      .brand{padding:0 12px 0 4px;flex:0 0 auto}
      .nav{flex-direction:row;flex-wrap:wrap;margin-top:0;gap:6px}
      .nav button{width:auto;padding:9px 12px}
      .sb-foot{display:none}
    }
    @media(max-width:820px){
      .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
      .board{grid-template-columns:1fr 1fr}
      .split{grid-template-columns:1fr}
      .heat{grid-template-columns:repeat(6,1fr)}
      .main{padding:18px 15px 34px}
    }
    @media(max-width:560px){
      .nav button .nt{display:none}
      .nav button{padding:9px}
      .board{grid-template-columns:1fr}
      .minik{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">warehouse</span></div>
        <div><b>庫存與儲位 WMS</b><span>Warehouse Mgmt System</span></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sb-foot">倉別 <b>WH-南科一廠</b><br/>資料同步 ERP · MES · TMS<br/>2026-08-14 08:20 更新</div>
    </aside>
    <main class="main">
      <div class="topbar">
        <div>
          <div class="crumbs" id="crumbs"></div>
          <h1 id="scrTitle">—</h1>
          <div class="sub" id="scrSub">—</div>
        </div>
        <div class="pill"><span class="dot"></span> 即時連線 · 作業中 42 人</div>
      </div>
      <div id="view"></div>
    </main>
  </div>

  <script>
  (function(){
    "use strict";
    var charts = {};
    function disposeAll(){
      for(var k in charts){ if(charts[k]){ try{charts[k].dispose();}catch(e){} charts[k]=null; } }
      charts = {};
    }
    function mk(id, opt){
      var el = document.getElementById(id);
      if(!el) return;
      if(charts[id]){ try{charts[id].dispose();}catch(e){} }
      var c = echarts.init(el);
      c.setOption(opt);
      charts[id] = c;
    }
    window.addEventListener("resize", function(){
      for(var k in charts){ if(charts[k]){ try{charts[k].resize();}catch(e){} } }
    });
    var PALETTE = ["#dc2626","#f97316","#f59e0b","#2563eb","#16a34a","#7c3aed"];

    var SCREENS = [
      {icon:"fact_check", name:"收貨驗收上架", title:"收貨驗收與智慧上架", sub:"到貨點收、品質檢驗與儲位上架建議"},
      {icon:"account_tree", name:"儲位與庫容", title:"儲位規劃與庫容視覺化", sub:"貨架區庫容熱力、動線與呆滯料分析"},
      {icon:"inventory_2", name:"即時庫存盤點", title:"即時庫存與循環盤點", sub:"帳實比對、批號到期與差異調整"},
      {icon:"receipt_long", name:"訂單分配揀貨", title:"訂單分配與揀貨派工", sub:"波次分配、揀貨任務看板與進度"},
      {icon:"task_alt", name:"覆核出貨交接", title:"出貨覆核與承運交接", sub:"覆核裝箱、承運商交接與準時率"},
      {icon:"trending_up", name:"補貨安全庫存", title:"安全庫存與自動補貨", sub:"庫存水位監控與補貨建議清單"}
    ];

    /* ---------- render helpers ---------- */
    function h(html){ return html; }
    function tag(cls,txt){ return '<span class="tag '+cls+'">'+txt+'</span>'; }

    /* ============ SCREEN 0 : 收貨驗收上架 ============ */
    function v0(){
      var kpis=[
        {ic:"local_shipping",lab:"今日到貨單",val:"18",u:"單",d:"+3",cls:"up"},
        {ic:"inventory",lab:"待驗收品項",val:"126",u:"項",d:"-12",cls:"up"},
        {ic:"fact_check",lab:"驗收合格率",val:"98.4",u:"%",d:"+0.6",cls:"up"},
        {ic:"schedule",lab:"平均上架時效",val:"11",u:"分",d:"-4",cls:"up"}
      ];
      var rows=[
        ["ASN-24081","裕隆機械","滾珠螺桿 32mm","80/80",tag("t-ok","已驗收"),"A區-03-02","D8"],
        ["ASN-24082","台達零件","伺服馬達 400W","24/24",tag("t-ok","已驗收"),"B區-01-05","建議"],
        ["ASN-24083","協易金屬","不鏽鋼板 SUS304","46/50",tag("t-warn","短收 4"),"待指派","—"],
        ["ASN-24084","華新電線","控制線材 2.0","200/200",tag("t-info","品檢中"),"C區-04-01","建議"],
        ["ASN-24085","勤誠精密","軸承 6204","0/120",tag("t-mut","待點收"),"—","—"],
        ["ASN-24086","三星化工","切削油 20L","30/30",tag("t-bad","不合格 2"),"退貨區","—"]
      ];
      var trows="";
      for(var i=0;i<rows.length;i++){var r=rows[i];
        trows+='<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td><td>'+r[4]+'</td><td>'+r[5]+'</td><td>'+r[6]+'</td></tr>';
      }
      return h(''+
        kpiGrid(kpis)+
        '<div class="grid g23" style="margin-top:14px">'+
          '<div class="card"><h3><span class="material-symbols-outlined">inventory_2</span>到貨驗收清單</h3><div class="ch-sub">依到貨通知（ASN）點收與品檢</div>'+
            '<div class="ovf"><table><thead><tr><th>ASN</th><th>供應商</th><th>品項</th><th>點收/應收</th><th>狀態</th><th>建議儲位</th><th>上架</th></tr></thead><tbody>'+trows+'</tbody></table></div></div>'+
          '<div class="card"><h3><span class="material-symbols-outlined">bar_chart</span>本週到貨與驗收</h3><div class="ch-sub">到貨量 vs 合格量（件）</div><div id="c0a" class="chart sm"></div></div>'+
        '</div>'+
        '<div class="grid g2" style="margin-top:14px">'+
          '<div class="card"><h3><span class="material-symbols-outlined">bolt</span>智慧上架建議</h3><div class="ch-sub">依儲位策略（動銷、庫容、就近）排序</div>'+
            '<div class="alist">'+
              alertRow("ok","place","伺服馬達 400W → B區-01-05","高動銷品，配置至靠近出貨口 A 動線儲位")+
              alertRow("info","place","控制線材 2.0 → C區-04-01","同料號既有庫存，建議併儲以利揀貨")+
              alertRow("warn","warning","不鏽鋼板 SUS304 短收 4 片","建議先上架 46 片，短收數量已回報採購")+
            '</div></div>'+
          '<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>今日收貨處理進度</h3><div class="ch-sub">各階段單數占比</div><div id="c0b" class="chart sm"></div></div>'+
        '</div>'
      );
    }
    function draw0(){
      mk("c0a",{grid:{left:38,right:12,top:24,bottom:24},tooltip:{trigger:"axis"},legend:{data:["到貨","合格"],right:0,top:0,textStyle:{fontSize:10}},
        xAxis:{type:"category",data:["一","二","三","四","五","六"],axisLine:{lineStyle:{color:"#d6d3d1"}},axisLabel:{color:"#78716c"}},
        yAxis:{type:"value",splitLine:{lineStyle:{color:"#f0efee"}},axisLabel:{color:"#78716c"}},
        series:[
          {name:"到貨",type:"bar",data:[320,410,380,520,470,180],itemStyle:{color:"#fca5a5",borderRadius:[4,4,0,0]},barWidth:11},
          {name:"合格",type:"bar",data:[314,404,372,516,462,178],itemStyle:{color:"#dc2626",borderRadius:[4,4,0,0]},barWidth:11}
        ]});
      mk("c0b",{tooltip:{trigger:"item"},legend:{bottom:0,textStyle:{fontSize:10}},
        series:[{type:"pie",radius:["45%","70%"],center:["50%","44%"],label:{show:false},
          data:[{value:8,name:"已上架",itemStyle:{color:"#16a34a"}},{value:4,name:"品檢中",itemStyle:{color:"#2563eb"}},{value:4,name:"待點收",itemStyle:{color:"#f59e0b"}},{value:2,name:"異常",itemStyle:{color:"#dc2626"}}]}]});
    }

    /* ============ SCREEN 1 : 儲位與庫容 (heatmap signature) ============ */
    function v1(){
      // build heatmap cells
      var zones=["A","B","C","D","E"];
      var cells="";
      var seed=7;
      function rnd(){ seed=(seed*9301+49297)%233280; return seed/233280; }
      for(var z=0;z<zones.length;z++){
        for(var c=1;c<=10;c++){
          var u=Math.round(rnd()*100);
          var col = u>90?"#b91c1c": u>75?"#dc2626": u>55?"#f97316": u>30?"#f59e0b": "#22c55e";
          cells+='<div class="cell" style="background:'+col+'" title="'+zones[z]+'-'+(c<10?'0'+c:c)+' 使用率 '+u+'%">'+u+'</div>';
        }
      }
      var strip=[

              alertRow("bad","priority_high","滾珠螺桿 32mm · 可用 2 天","明日出貨已占用大部分安全庫存，建議急補")+
              alertRow("bad","priority_high","不鏽鋼板 SUS304 · 可用 3 天","短收未補齊，缺口 474 片")+
              alertRow("warn","schedule","伺服馬達 400W · 可用 6 天","採購前置期 5 天，建議今日下單")+
              alertRow("info","event","切削油 20L · 批號 12 天到期","建議優先出貨，避免報廢")+
            '</div></div>'+
        '</div>'
      );
    }
    function draw5(){
      mk("c5a",{grid:{left:44,right:14,top:24,bottom:24},tooltip:{trigger:"axis"},legend:{data:["現有量","安全庫存"],top:0,textStyle:{fontSize:10}},
        xAxis:{type:"category",data:["07","08","09","10","11","12","13","14"],axisLine:{lineStyle:{color:"#d6d3d1"}},axisLabel:{color:"#78716c"}},
        yAxis:{type:"value",splitLine:{lineStyle:{color:"#f0efee"}},axisLabel:{color:"#78716c"}},
        series:[
          {name:"現有量",type:"line",smooth:true,data:[1980,1820,1710,1560,1490,1360,1250,1196],areaStyle:{color:"rgba(220,38,38,.14)"},lineStyle:{color:"#dc2626",width:3},itemStyle:{color:"#dc2626"},symbolSize:6},
          {name:"安全庫存",type:"line",data:[1500,1500,1500,1500,1500,1500,1500,1500],lineStyle:{color:"#f97316",width:2,type:"dashed"},itemStyle:{color:"#f97316"},symbol:"none"}
        ]});
    }

    /* ---------- shared UI builders ---------- */
    function kpiGrid(kpis){
      var s='<div class="grid g4">';
      for(var i=0;i<kpis.length;i++){var k=kpis[i];
        var arrow = k.cls==="up"?"trending_up":(k.cls==="down"?"trending_down":"trending_flat");
        s+='<div class="card kpi"><div class="lab"><span class="ic"><span class="material-symbols-outlined">'+k.ic+'</span></span>'+k.lab+'</div>'+
           '<div class="val">'+k.val+'<small>'+k.u+'</small></div>'+
           '<div class="delta '+k.cls+'"><span class="material-symbols-outlined">'+arrow+'</span>'+k.d+' 較昨日</div></div>';
      }
      return s+'</div>';
    }
    function alertRow(cls,ic,tt,ad){
      return '<div class="al"><span class="ai '+cls+'"><span class="material-symbols-outlined">'+ic+'</span></span><div><div class="at">'+tt+'</div><div class="ad">'+ad+'</div></div></div>';
    }
    function tlEv(cls,tm,ti,ds){
      return '<div class="ev '+cls+'"><div class="tm">'+tm+'</div><div class="ti">'+ti+'</div><div class="ds">'+ds+'</div></div>';
    }

    var RENDER=[v0,v1,v2,v3,v4,v5];
    var DRAW=[draw0,draw1,draw2,draw3,draw4,draw5];

    function buildNav(){
      var nav=document.getElementById("nav");
      var s="";
      for(var i=0;i<SCREENS.length;i++){
        s+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+SCREENS[i].icon+'</span><span class="nt">'+SCREENS[i].name+'</span></button>';
      }
      nav.innerHTML=s;
      var btns=nav.querySelectorAll("[data-i]");
      for(var j=0;j<btns.length;j++){
        btns[j].addEventListener("click",function(){ location.hash="v"+this.getAttribute("data-i"); });
      }
    }

    function show(i){
      disposeAll();
      var container=document.getElementById("view");
      var sc=SCREENS[i];
      document.getElementById("scrTitle").textContent=sc.title;
      document.getElementById("scrSub").textContent=sc.sub;
      document.getElementById("crumbs").innerHTML='<span class="material-symbols-outlined">home</span> WMS 倉儲管理 <span class="material-symbols-outlined">chevron_right</span> '+sc.name;
      var btns=document.querySelectorAll("[data-i]");
      for(var b=0;b<btns.length;b++){ btns[b].classList.toggle("on", (+btns[b].getAttribute("data-i"))===i); }
      container.innerHTML=RENDER[i]();
      void container.offsetHeight;
      DRAW[i]();
    }

    buildNav();

    function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
  })();
  </script>
