<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>製程參數監控系統 Process Parameter Monitoring System</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#0f172a;
  --color-on-primary:#fff;
  --color-secondary:#1e293b;
  --color-on-secondary:#fff;
  --color-accent:#16a34a;
  --color-on-accent:#020617;
  --color-background:#020617;
  --color-foreground:#f8fafc;
  --color-card:#0e1223;
  --color-card-foreground:#f8fafc;
  --color-muted:#1a1e2f;
  --color-muted-foreground:#a7b4c7;
  --color-border:#334155;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#fff;
  --blue:#38bdf8;
  --ink:#f8fafc;
  --muted:#a7b4c7;
  --line:#334155;
  --accent:#16a34a;
  --accent2:#4ade80;
  --accent-d:#22c55e;
  --bg:#020617;
  --panel:#0e1223;
  --soft:#151a2b;
  --danger:#ef4444;
  --warn:#fbbf24;
  --ok:#4ade80;
  --info:#38bdf8;
  --shadow:0 18px 45px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html{color-scheme:dark;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fira Sans",sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit}
button,.sitem{cursor:pointer}
button:focus-visible,.sitem:focus-visible{outline:2px solid var(--color-ring);outline-offset:3px}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:20px;line-height:1;vertical-align:middle}
.app{min-height:100vh;display:flex;flex-direction:column;background:
radial-gradient(circle at 85% -10%,rgba(22,163,74,.12),transparent 27rem),
linear-gradient(180deg,#050918 0,#020617 36rem)}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:11px clamp(14px,2vw,28px);background:rgba(2,6,23,.94);border-bottom:1px solid rgba(51,65,85,.85);box-shadow:0 10px 30px rgba(0,0,0,.22);backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:40px;height:40px;display:grid;place-items:center;flex:none;color:var(--accent2);background:#07160e;border:1px solid rgba(74,222,128,.35);border-radius:9px;box-shadow:inset 0 0 18px rgba(22,163,74,.08),0 0 16px rgba(22,163,74,.1)}
.logo .material-symbols-outlined{font-size:24px}
.brand h1{margin:0;font-size:16px;font-weight:700;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 10px rgba(248,250,252,.12)}
.brand p{margin:1px 0 0;color:var(--muted);font:500 10.5px/1.4 "Fira Code",monospace;white-space:nowrap}
.top-meta{margin-left:auto;display:flex;align-items:center;gap:9px;flex:none}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;color:#dbe4f0;background:#11182a;border:1px solid var(--line);border-radius:7px;font-size:11px;font-weight:600;white-space:nowrap}
.live-dot{width:8px;height:8px;display:inline-block;flex:none;border-radius:50%;background:var(--ok);box-shadow:0 0 10px rgba(74,222,128,.75)}
nav{position:sticky;top:63px;z-index:20;display:flex;gap:6px;padding:8px clamp(12px,2vw,26px);overflow-x:auto;background:rgba(8,12,29,.96);border-bottom:1px solid var(--line);scrollbar-width:thin}
nav button{min-height:38px;display:flex;align-items:center;gap:7px;flex:none;padding:7px 11px;color:#b8c4d4;background:transparent;border:1px solid transparent;border-radius:7px;font-size:12px;font-weight:600;transition:background-color .18s,color .18s,border-color .18s,box-shadow .18s}
nav button:hover{color:#fff;background:#161c2e;border-color:#3e4c63}
nav button.active{color:#fff;background:#132519;border-color:#278c49;box-shadow:inset 0 -2px 0 var(--accent2),0 0 18px rgba(22,163,74,.1)}
nav button .idx{color:#75859d;font:600 10px "Fira Code",monospace}
nav button.active .idx{color:#86efac}
main{width:100%;max-width:1440px;margin:0 auto;padding:18px clamp(12px,2vw,28px) 8px}
.scr-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:13px;border-bottom:1px solid rgba(51,65,85,.7)}
.scr-head .ic{width:40px;height:40px;display:grid;place-items:center;flex:none;color:#86efac;background:#102419;border:1px solid #246b3d;border-radius:8px}
.scr-head h2{margin:0;font-size:19px;line-height:1.25;font-weight:700;letter-spacing:.01em;text-shadow:0 0 10px rgba(248,250,252,.1)}
.scr-head p{margin:3px 0 0;color:var(--muted);font-size:11.5px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{position:relative;min-width:0;padding:13px 14px;background:linear-gradient(145deg,#101527,#0b1020);border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 25px rgba(0,0,0,.16);overflow:hidden}
.kpi:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--accent)}
.kpi.warn:before{background:var(--warn)}
.kpi.danger:before{background:var(--danger)}
.kpi.info:before{background:var(--info)}
.kpi .lab{display:flex;align-items:center;gap:6px;color:#aebbcf;font-size:11.5px}
.kpi .val{margin-top:5px;color:#fff;font:700 25px/1.2 "Fira Code",monospace;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.kpi .val small{color:var(--muted);font:600 11px "Fira Sans",sans-serif}
.kpi .sub{margin-top:5px;color:#acb9cb;font-size:10.5px;font-weight:500}
.up{color:#86efac!important}.down{color:#fca5a5!important}
.split{display:grid;grid-template-columns:330px minmax(0,1fr);gap:12px;align-items:start}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.grid3{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.panel{min-width:0;background:linear-gradient(155deg,#101426,#0b1020);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);overflow:hidden}
.panel-h{min-height:45px;display:flex;align-items:center;gap:8px;padding:10px 13px;color:#edf4fc;background:rgba(26,30,47,.58);border-bottom:1px solid var(--line);font-size:12.5px;font-weight:600}
.panel-h .material-symbols-outlined{color:#6ee7a0;font-size:19px}
.panel-h .tag{margin-left:auto;color:#9dacbf;font:500 10.5px "Fira Code",monospace}
.panel-b{padding:13px}
.slist{display:flex;flex-direction:column;max-height:560px;overflow-y:auto}
.sitem{min-height:56px;display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid rgba(51,65,85,.62);transition:background-color .18s,box-shadow .18s}
.sitem:hover{background:#151b2d}
.sitem.sel{background:#102219;box-shadow:inset 3px 0 var(--accent2)}
.sitem .dot{width:9px;height:9px;flex:none;border-radius:50%;box-shadow:0 0 8px currentColor}
.sitem .nm{min-width:0;font-size:12.5px;font-weight:600}
.sitem .nm small{display:block;color:var(--muted);font-size:10.5px;font-weight:400}
.sitem .rd{margin-left:auto;text-align:right;flex:none}
.sitem .rd b{font:700 14px "Fira Code",monospace;font-variant-numeric:tabular-nums}
.sitem .rd span{display:block;color:var(--muted);font-size:10px}
.stat{max-width:100%;display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border:1px solid currentColor;border-radius:5px;font-size:10.5px;font-weight:600;white-space:nowrap}
.s-ok{color:#86efac;background:#0d2c1b}
.s-warn{color:#fde68a;background:#35290c}
.s-bad{color:#fca5a5;background:#39151a}
.s-off{color:#bdc8d7;background:#252c3c}
.chart-wrap{position:relative;width:100%}
.h300{height:300px}.h260{height:260px}.h220{height:220px}.h200{height:200px}
.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.gauge{min-width:0;padding:10px;text-align:center;background:#0b1020;border:1px solid var(--line);border-radius:8px}
.gauge .gw{position:relative;height:105px}
.gauge .gv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.gauge .gv b{font:700 18px "Fira Code",monospace}
.gauge .gv span{color:var(--muted);font-size:9.5px}
.gauge .gl{margin-top:4px;color:#cad4e2;font-size:11px;font-weight:600}
.scroll,.panel-b>div[style*="overflow-x"]{max-width:100%;overflow-x:auto}
.tbl{width:100%;min-width:640px;border-collapse:collapse;font-size:11.5px}
.tbl th{padding:9px 10px;text-align:left;color:#c2cede;background:#151b2d;border-bottom:1px solid #46546a;font-weight:600;white-space:nowrap}
.tbl td{padding:9px 10px;color:#e7edf5;border-bottom:1px solid rgba(51,65,85,.6);white-space:nowrap}
.tbl tbody tr:hover td{background:#141a2b}
.tbl th:nth-child(n+4),.tbl td:nth-child(n+4){font-variant-numeric:tabular-nums}
.tbl td.mono,.mono{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.tbl td:nth-child(4),.tbl td:nth-child(5),.tbl td:nth-child(6),.tbl td:nth-child(7){text-align:right}
.barcell{min-width:150px;display:flex;align-items:center;gap:8px}
.barbg{height:6px;flex:1;overflow:hidden;background:#283247;border-radius:3px}
.barbg i{display:block;height:100%;border-radius:3px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.col{min-width:0;padding:9px;background:#090e1c;border:1px solid var(--line);border-radius:8px}
.col-h{display:flex;align-items:center;gap:7px;margin-bottom:9px;padding:2px;color:#dfe7f1;font-size:12px;font-weight:700}
.col-h .cnt{margin-left:auto;padding:1px 7px;color:#b9c5d5;background:#1b2234;border:1px solid var(--line);border-radius:5px;font:600 10px "Fira Code",monospace}
.card{min-width:0;margin-bottom:8px;padding:10px;background:#111729;border:1px solid #344158;border-left:3px solid var(--accent);border-radius:6px}
.card.p-c{border-left-color:var(--danger)}.card.p-h{border-left-color:var(--warn)}.card.p-m{border-left-color:var(--info)}.card.p-l{border-left-color:#94a3b8}
.card .ct{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;font-weight:600}
.card .cm{display:flex;align-items:center;gap:5px;margin-top:5px;color:#aebacd;font-size:10.5px}
.card .cm .material-symbols-outlined{font-size:14px}
.chip{display:inline-block;padding:2px 6px;border:1px solid currentColor;border-radius:4px;font-size:10px;font-weight:700}
.tl{position:relative;padding-left:25px}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:1px;background:#46556d}
.tl-item{position:relative;padding-bottom:17px}
.tl-item:before{content:"";position:absolute;left:-22px;top:3px;width:10px;height:10px;background:var(--accent);border:2px solid #0e1223;border-radius:50%;box-shadow:0 0 0 2px #4ade80}
.tl-item.done:before{background:#64748b;box-shadow:0 0 0 2px #94a3b8}
.tl-item .th{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600}
.tl-item .tb{margin-top:3px;color:#aebacd;font-size:11px}
.spec-rows{display:flex;flex-direction:column;gap:8px}
.spec{min-width:0;display:flex;align-items:center;gap:11px;padding:9px 10px;background:#0a0f1e;border:1px solid var(--line);border-radius:7px}
.spec .snm{width:104px;flex:none;font-size:11.5px;font-weight:600}
.spec .track{position:relative;min-width:100px;height:24px;flex:1;background:linear-gradient(90deg,#3a171d 0 12%,#123521 12% 88%,#3a171d 88%);border:1px solid #37445a;border-radius:4px}
.spec .track .mk{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;box-shadow:0 0 8px currentColor}
.spec .track .lsl,.spec .track .usl{position:absolute;top:0;bottom:0;width:1px;background:#fca5a5}
.spec .track .lsl{left:12%}.spec .track .usl{right:12%}
.spec .rv{width:116px;flex:none;text-align:right;font:400 11px "Fira Code",monospace}
.spec .rv b{font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:9px;color:#aebacd;font-size:10.5px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;display:inline-block;border:1px solid rgba(255,255,255,.2);border-radius:2px}
.note{display:flex;align-items:flex-start;gap:8px;margin-top:13px;padding:10px 12px;color:#c9f7d7;background:#0c2417;border:1px solid #246b3d;border-radius:7px;font-size:11px}
.note .material-symbols-outlined{flex:none;color:#86efac;font-size:18px}
.foot{margin-top:auto;padding:18px 12px 14px;color:#8796ab;text-align:center;font:400 10px "Fira Code",monospace}
@media(max-width:1024px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .split{grid-template-columns:300px minmax(0,1fr)}
}
@media(max-width:768px){
  .split,.grid2,.grid3{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .gauges{grid-template-columns:repeat(3,1fr)}
  .top{padding-inline:12px}
  .brand p{display:none}
}
@media(max-width:560px){
  nav button .txt{display:none}
  nav button{min-width:42px;justify-content:center;padding:7px 9px}
  .top-meta .hideS{display:none}
  .kpi .val{font-size:22px}
  .panel-b{padding:10px}
  .scr-head h2{font-size:17px}
}
@media(max-width:390px){
  .gauges{grid-template-columns:1fr}
  .kpis{gap:8px}
  .kpi{padding:11px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">precision_manufacturing</span></div>
    <div><h1>製程參數監控系統</h1><p>Process Parameter Monitoring System · SCADA / MES / SPC</p></div>
  </div>
  <div class="top-meta">
    <span class="pill hideS"><span class="material-symbols-outlined" style="font-size:16px">factory</span>Fab-A 二廠</span>
    <span class="pill"><span class="live-dot"></span>即時採集中</span>
  </div>
</header>
<nav id="nav" aria-label="系統功能"></nav>
<main id="view"></main>
<div class="foot">製程參數監控系統 Demo · 純前端假資料展示 · © 2026 JVision Smart MFG</div>
</div>
<script>
"use strict";
var view=document.getElementById("view"),chartRef=null,gaugeStore=[];
var C={accent:"#22c55e",accent2:"#4ade80",accentD:"#16a34a",danger:"#ef4444",warn:"#fbbf24",info:"#38bdf8",muted:"#94a3b8",grid:"#29364b",ink:"#f8fafc"};
var MODULES=[
{ic:"sensors",nm:"參數即時採集",sub:"SCADA/PLC 訊號即時擷取"},
{ic:"rule",nm:"規格上下限比對",sub:"USL/LSL 與管制界比對"},
{ic:"notification_important",nm:"異常參數告警",sub:"超規即時告警與分級"},
{ic:"engineering",nm:"現場處置追蹤",sub:"告警派工與處置回報"},
{ic:"monitoring",nm:"SPC 趨勢分析",sub:"管制圖與 Cpk 製程能力"},
{ic:"inventory_2",nm:"參數歸檔稽核",sub:"批次參數留存與追溯"}];
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}
function elc(id){return document.getElementById(id)}
function destroyChart(){if(chartRef){try{chartRef.destroy()}catch(e){}chartRef=null}}
var SENSORS=[
{id:"S-CVD01",nm:"CVD 反應爐 #1",loc:"沉積站 A",p:"溫度",unit:"℃",val:452.8,usl:460,lsl:440,st:"ok",series:[449,451,450,453,452,454,453,452.8]},
{id:"S-ETCH2",nm:"乾式蝕刻 #2",loc:"蝕刻站 B",p:"腔壓",unit:"mTorr",val:78.9,usl:80,lsl:60,st:"warn",series:[70,72,74,76,77,79,78,78.9]},
{id:"S-CMP03",nm:"化學研磨 #3",loc:"平坦化站",p:"研磨壓力",unit:"psi",val:6.4,usl:7,lsl:5.5,st:"ok",series:[6.1,6.2,6.3,6.2,6.4,6.5,6.3,6.4]},
{id:"S-DIFF4",nm:"擴散爐 #4",loc:"熱處理站",p:"溫度",unit:"℃",val:1051,usl:1040,lsl:1000,st:"bad",series:[1015,1020,1028,1035,1042,1048,1050,1051]},
{id:"S-PVD05",nm:"濺鍍機 #5",loc:"金屬層站",p:"功率",unit:"kW",val:11.6,usl:13,lsl:9,st:"ok",series:[11.2,11.4,11.5,11.3,11.6,11.7,11.5,11.6]},
{id:"S-WET06",nm:"濕式清洗 #6",loc:"清洗站 C",p:"流量",unit:"L/min",val:23.1,usl:28,lsl:20,st:"ok",series:[22.4,22.8,23,22.9,23.2,23.1,23,23.1]},
{id:"S-IMP07",nm:"離子植入 #7",loc:"摻雜站",p:"束流",unit:"mA",val:1.94,usl:2.1,lsl:1.8,st:"warn",series:[1.85,1.88,1.9,1.92,1.95,1.96,1.93,1.94]},
{id:"S-LITH8",nm:"曝光機 #8",loc:"微影站",p:"對準誤差",unit:"nm",val:3.2,usl:5,lsl:0,st:"ok",series:[3.5,3.4,3.3,3.6,3.2,3.1,3.3,3.2]}];
var selSensor=0;
function stTag(st){var m={ok:["s-ok","check_circle","正常"],warn:["s-warn","warning","接近上限"],bad:["s-bad","error","超規"],off:["s-off","power_off","離線"]},x=m[st]||m.off;return'<span class="stat '+x[0]+'"><span class="material-symbols-outlined" style="font-size:13px">'+x[1]+"</span>"+x[2]+"</span>"}
function stDot(st){return{ok:C.accent,warn:C.warn,bad:C.danger,off:"#94a3b8"}[st]||"#94a3b8"}
function clampPct(v,lo,hi){if(hi<=lo)return 50;return Math.max(2,Math.min(100,(v-lo)/(hi-lo)*100))}
function makeGauge(id,pct,col){gaugeStore.push(new Chart(elc(id),{type:"doughnut",data:{datasets:[{data:[pct,Math.max(0,100-pct)],backgroundColor:[col,"#263247"],borderWidth:0}]},options:{cutout:"72%",circumference:220,rotation:250,responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{enabled:false}},animation:false}}))}
function bindSensors(){view.querySelectorAll("[data-sen]").forEach(function(x){x.addEventListener("click",function(){selSensor=+x.dataset.sen;render(0)});x.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();x.click()}})})}
function screen0(){
var okc=SENSORS.filter(s=>s.st==="ok").length,warnc=SENSORS.filter(s=>s.st==="warn").length,badc=SENSORS.filter(s=>s.st==="bad").length,h=headHtml(0);
h+='<div class="kpis">'+kpi("採集點位","info","sensors",SENSORS.length,"個","採樣頻率 200ms")+kpi("正常參數","","check_circle",okc,"個","佔比 "+Math.round(okc/SENSORS.length*100)+"%")+kpi("接近上限","warn","warning",warnc,"個","需留意趨勢")+kpi("超規告警","danger","error",badc,"個","已觸發告警")+"</div><div class=split>";
h+='<div class=panel><div class=panel-h><span class=material-symbols-outlined>list_alt</span>採集點位清單<span class=tag>Fab-A</span></div><div class=slist>';

h+='<div class=kpis>'+kpi("歸檔批次","","inventory_2",BATCHES.length,"批","近 48 小時")+kpi("留存參數筆數","info","database",totalP.toLocaleString(),"筆","可完整追溯")+kpi("含超規批次","warn","gpp_maybe",BATCHES.filter(b=>b.ex>0).length,"批",totalEx+" 筆超規值")+kpi("異常凍結","danger","lock",BATCHES.filter(b=>b.st==="異常凍結").length,"批","待品保放行")+'</div><div class=grid3><div class=panel><div class=panel-h><span class=material-symbols-outlined>folder_managed</span>批次參數歸檔清單（可追溯稽核）</div><div class=panel-b><div style="overflow-x:auto"><table class=tbl><thead><tr><th>批號</th><th>產品</th><th>產線</th><th>片數</th><th>參數筆數</th><th>超規</th><th>Cpk</th><th>狀態</th><th>歸檔時間</th></tr></thead><tbody>';
BATCHES.forEach(function(b){h+='<tr><td class=mono>'+esc(b.batch)+"</td><td>"+esc(b.prod)+"</td><td>"+esc(b.line)+'</td><td class=mono>'+b.qty+'</td><td><div class=barcell><span class=mono>'+b.params+'</span><div class=barbg><i style="width:'+Math.round(b.params/660*100)+"%;background:"+C.accent+'"></i></div></div></td><td class=mono style="color:'+(b.ex>0?C.danger:C.muted)+'">'+b.ex+'</td><td><span class="stat '+cpkClass(b.cpk)+'">'+b.cpk.toFixed(2)+" · "+cpkTxt(b.cpk)+"</span></td><td>"+archTag(b.st)+'</td><td style="color:var(--muted)" class=mono>'+esc(b.time)+"</td></tr>"});
h+='</tbody></table></div></div></div><div class=panel><div class=panel-h><span class=material-symbols-outlined>pie_chart</span>歸檔狀態分布</div><div class=panel-b><div class="chart-wrap h220"><canvas id=c5pie></canvas></div><div class="chart-wrap h200" style="margin-top:12px"><canvas id=c5line></canvas></div><div style="font-size:11px;color:var(--muted);text-align:center;margin-top:4px">近 7 日歸檔批次數</div></div></div></div><div class=note><span class=material-symbols-outlined>verified_user</span><div>稽核追溯：每一批次留存完整參數時序（採樣、規格、超規標記、處置紀錄），品保可依批號一鍵回放；異常凍結批次須經品保覆核放行始能出貨，符合 IATF / SPC 稽核要求。</div></div>';
view.innerHTML=h;var sc={"合格歸檔":0,"待覆核":0,"異常凍結":0};BATCHES.forEach(b=>sc[b.st]++);
chartRef=new Chart(elc("c5pie"),{type:"pie",data:{labels:["合格歸檔","待覆核","異常凍結"],datasets:[{data:[sc["合格歸檔"],sc["待覆核"],sc["異常凍結"]],backgroundColor:[C.accent,C.warn,C.danger],borderWidth:2,borderColor:"#0e1223"}]},options:pieOpts()});
gaugeStore.push(new Chart(elc("c5line"),{type:"line",data:{labels:["7/8","7/9","7/10","7/11","7/12","7/13","7/14"],datasets:[{label:"歸檔批次",data:[6,7,5,8,7,9,8],borderColor:C.accent2,backgroundColor:"rgba(34,197,94,.1)",fill:true,tension:.35,pointRadius:2,borderWidth:2}]},options:baseOpts({legend:false})}))}
function headHtml(i){var m=MODULES[i];return'<div class=scr-head><div class=ic><span class=material-symbols-outlined>'+m.ic+"</span></div><div><h2>"+esc(m.nm)+"</h2><p>"+esc(m.sub)+"　·　畫面 "+(i+1)+" / 6</p></div></div>"}
function kpi(lab,cls,ic,val,unit,sub,dir){var d=dir==="up"?"up":dir==="down"?"down":"";return'<div class="kpi '+(cls||"")+'"><div class=lab><span class=material-symbols-outlined style="font-size:16px">'+ic+"</span>"+esc(lab)+'</div><div class=val>'+val+(unit?" <small>"+esc(unit)+"</small>":"")+"</div>"+(sub?'<div class="sub '+d+'">'+esc(sub)+"</div>":"")+"</div>"}
function baseOpts(o){o=o||{};return{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:o.legend?{position:"top",labels:{color:"#c5d0df",font:{family:"Fira Sans",size:10},boxWidth:12,usePointStyle:true}}:{display:false},tooltip:{mode:"index",intersect:false,backgroundColor:"#172033",titleColor:"#fff",bodyColor:"#dce5f0",borderColor:"#475569",borderWidth:1}},interaction:{mode:"index",intersect:false},scales:{x:{grid:{display:false},ticks:{color:C.muted,font:{family:"Fira Code",size:9}}},y:{grid:{color:C.grid},ticks:{color:C.muted,font:{family:"Fira Code",size:9}}}}}}
function barOpts(){return{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{color:C.muted,font:{family:"Fira Code",size:9}}},y:{beginAtZero:true,grid:{color:C.grid},ticks:{color:C.muted,font:{family:"Fira Code",size:9}}}}}}
function pieOpts(){return{cutout:"58%",responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{position:"bottom",labels:{color:"#c5d0df",font:{size:10},boxWidth:11}}}}}
var SCREENS=[screen0,screen1,screen2,screen3,screen4,screen5];
function render(i){destroyChart();gaugeStore.forEach(function(g){try{g.destroy()}catch(e){}});gaugeStore=[];document.querySelectorAll("#nav button").forEach(function(b){var active=+b.dataset.i===i;b.classList.toggle("active",active);b.setAttribute("aria-current",active?"page":"false")});SCREENS[i]()}
function show(i){render(i);try{window.scrollTo(0,0)}catch(e){}}
(function(){var nv=document.getElementById("nav"),html="";MODULES.forEach(function(m,i){html+='<button type=button data-i="'+i+'"><span class=material-symbols-outlined style="font-size:18px">'+m.ic+'</span><span class=idx>'+String(i+1).padStart(2,"0")+'</span><span class=txt>'+esc(m.nm)+"</span></button>"});nv.innerHTML=html;nv.querySelectorAll("[data-i]").forEach(function(b){b.addEventListener("click",function(){location.hash="v"+b.dataset.i})})})();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/),n=document.querySelectorAll("[data-i]").length||6;show(m?Math.min(+m[1],n-1):0)}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
