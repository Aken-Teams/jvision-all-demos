<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>製程參數監控系統 Process Parameter Monitoring System</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --accent:#16a34a; --accent2:#4ade80; --accent-d:#15803d;
    --bg:#f1f5f4; --panel:#ffffff; --ink:#0f2417; --muted:#5b7268;
    --line:#e2ebe6; --soft:#f6faf8;
    --danger:#dc2626; --warn:#f59e0b; --ok:#16a34a; --info:#0ea5e9;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;font-size:20px}
  .app{display:flex;min-height:100vh;flex-direction:column}
  .top{display:flex;align-items:center;gap:14px;background:linear-gradient(100deg,#0f3d24,#15803d 60%,#16a34a);color:#fff;padding:12px 20px;position:sticky;top:0;z-index:30}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.15);display:grid;place-items:center;flex:none;border:1px solid rgba(255,255,255,.25)}
  .logo .material-symbols-outlined{font-size:24px}
  .brand h1{font-size:16px;margin:0;font-weight:800;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand p{margin:0;font-size:11px;opacity:.8;white-space:nowrap}
  .top-meta{margin-left:auto;display:flex;gap:16px;align-items:center;flex:none}
  .top-meta .pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
  .live-dot{width:9px;height:9px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 0 rgba(74,222,128,.7);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.7)}70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
  nav{display:flex;flex-wrap:wrap;gap:8px;background:var(--panel);padding:10px 18px;border-bottom:1px solid var(--line);position:sticky;top:62px;z-index:20}
  nav button{flex:none;white-space:nowrap;min-width:0;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--soft);color:var(--muted);padding:8px 14px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;transition:.15s}
  nav button:hover{border-color:var(--accent2);color:var(--accent-d)}
  nav button.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 12px rgba(22,163,74,.28)}
  nav button .idx{font-size:11px;opacity:.7;font-weight:700}
  main{padding:18px;max-width:1360px;margin:0 auto;width:100%}
  .scr-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
  .scr-head .ic{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;display:grid;place-items:center;flex:none}
  .scr-head h2{margin:0;font-size:19px;font-weight:800}
  .scr-head p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;position:relative;overflow:hidden;min-width:0}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
  .kpi .lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .kpi .val{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
  .kpi .val small{font-size:13px;font-weight:600;color:var(--muted)}
  .kpi .sub{font-size:11.5px;margin-top:4px;font-weight:600}
  .kpi.warn::before{background:var(--warn)} .kpi.danger::before{background:var(--danger)} .kpi.info::before{background:var(--info)}
  .up{color:var(--ok)} .down{color:var(--danger)}
  .split{display:grid;grid-template-columns:340px 1fr;gap:14px;align-items:start}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;min-width:0}
  .panel-h{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:13.5px}
  .panel-h .material-symbols-outlined{font-size:20px;color:var(--accent-d)}
  .panel-h .tag{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted)}
  .panel-b{padding:14px 16px}
  .slist{display:flex;flex-direction:column;max-height:560px;overflow-y:auto}
  .sitem{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:.12s}
  .sitem:hover{background:var(--soft)}
  .sitem.sel{background:#ecfdf3;box-shadow:inset 3px 0 0 var(--accent)}
  .sitem .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .sitem .nm{font-weight:700;font-size:13px;min-width:0}
  .sitem .nm small{display:block;font-weight:500;color:var(--muted);font-size:11px}
  .sitem .rd{margin-left:auto;text-align:right;flex:none}
  .sitem .rd b{font-size:15px;font-weight:800}
  .sitem .rd span{display:block;font-size:10.5px;color:var(--muted)}
  .stat{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
  .s-ok{background:#dcfce7;color:#15803d} .s-warn{background:#fef3c7;color:#b45309} .s-bad{background:#fee2e2;color:#b91c1c} .s-off{background:#e5e7eb;color:#6b7280}
  .chart-wrap{position:relative;width:100%}
  .chart-wrap.h260{height:260px} .chart-wrap.h300{height:300px} .chart-wrap.h220{height:220px} .chart-wrap.h200{height:200px}
  .gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
  .gauge{text-align:center;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
  .gauge .gw{position:relative;height:110px}
  .gauge .gv{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:none}
  .gauge .gv b{font-size:19px;font-weight:800}
  .gauge .gv span{font-size:10.5px;color:var(--muted)}
  .gauge .gl{font-size:12px;font-weight:700;margin-top:6px}
  .tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px}
  .tbl th{text-align:left;padding:10px 12px;background:var(--soft);color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl tr:hover td{background:var(--soft)}
  .barcell{display:flex;align-items:center;gap:8px;min-width:150px}
  .barbg{flex:1;height:7px;background:#e5efe9;border-radius:4px;overflow:hidden}
  .barbg i{display:block;height:100%;border-radius:4px}
  .mono{font-variant-numeric:tabular-nums;font-weight:700}
  .board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .col{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
  .col-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;margin-bottom:10px;padding:2px 4px}
  .col-h .cnt{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11px}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:9px;border-left:4px solid var(--accent)}
  .card.p-c{border-left-color:var(--danger)} .card.p-h{border-left-color:var(--warn)} .card.p-m{border-left-color:var(--info)} .card.p-l{border-left-color:var(--muted)}
  .card .ct{font-weight:700;font-size:12.5px;display:flex;justify-content:space-between;gap:6px}
  .card .cm{font-size:11px;color:var(--muted);margin-top:5px;display:flex;align-items:center;gap:5px}
  .card .cm .material-symbols-outlined{font-size:14px}
  .chip{display:inline-block;padding:1px 8px;border-radius:6px;font-size:10.5px;font-weight:700}
  .tl{position:relative;padding-left:26px}
  .tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .tl-item{position:relative;padding:0 0 18px 0}
  .tl-item::before{content:"";position:absolute;left:-22px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent2)}
  .tl-item.done::before{background:var(--muted);box-shadow:0 0 0 2px #cbd5cf}
  .tl-item .th{font-weight:700;font-size:13px;display:flex;gap:8px;align-items:center}
  .tl-item .tb{font-size:12px;color:#374151;margin-top:3px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
  .grid3{display:grid;grid-template-columns:2fr 1fr;gap:14px}
  .spec-rows{display:flex;flex-direction:column;gap:10px}
  .spec{display:flex;align-items:center;gap:12px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
  .spec .snm{width:110px;font-weight:700;font-size:12.5px;flex:none}
  .spec .track{flex:1;height:26px;background:linear-gradient(90deg,#fde2e2 0 12%,#dcfce7 12% 88%,#fde2e2 88% 100%);border-radius:6px;position:relative;min-width:100px}
  .spec .track .mk{position:absolute;top:-3px;bottom:-3px;width:3px;border-radius:2px}
  .spec .track .lsl,.spec .track .usl{position:absolute;top:0;bottom:0;width:2px;background:#b91c1c}
  .spec .track .lsl{left:12%} .spec .track .usl{right:12%}
  .spec .rv{width:118px;text-align:right;font-size:12px;flex:none}
  .spec .rv b{font-size:15px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .note{background:#ecfdf3;border:1px solid #bbf7d0;border-radius:10px;padding:11px 13px;font-size:12px;color:#166534;display:flex;gap:8px;align-items:flex-start;margin-top:14px}
  .note .material-symbols-outlined{font-size:18px;flex:none}
  .foot{text-align:center;color:var(--muted);font-size:11px;padding:20px 0 8px}
  @media(max-width:820px){
    .kpis{grid-template-columns:1fr 1fr}
    .split{grid-template-columns:1fr}
    .grid2,.grid3{grid-template-columns:1fr}
    .board{grid-template-columns:1fr}
    .gauges{grid-template-columns:1fr 1fr 1fr}
  }
  @media(max-width:560px){
    nav button .txt{display:none}
    .top-meta .pill.hideS{display:none}
  }
  @media(max-width:390px){ .gauges{grid-template-columns:1fr} }
/*rwdfix*/.card{min-width:0}[class*="grid"]>*,[class*="g2"]>*{min-width:0}.scroll{min-width:0;max-width:100%;overflow-x:auto}
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">precision_manufacturing</span></div>
      <div>
        <h1>製程參數監控系統</h1>
        <p>Process Parameter Monitoring System · SCADA / MES / SPC</p>
      </div>
    </div>
    <div class="top-meta">
      <span class="pill hideS"><span class="material-symbols-outlined" style="font-size:16px">factory</span>Fab-A 二廠</span>
      <span class="pill"><span class="live-dot"></span>即時採集中</span>
    </div>
  </header>
  <nav id="nav"></nav>
  <main id="view"></main>
  <div class="foot">製程參數監控系統 Demo · 純前端假資料展示 · © 2026 JVision Smart MFG</div>
</div>

<script>
"use strict";
var view=document.getElementById("view");
var chartRef=null;
var gaugeStore=[];

var C={accent:"#16a34a",accent2:"#4ade80",accentD:"#15803d",danger:"#dc2626",warn:"#f59e0b",info:"#0ea5e9",muted:"#94a3b8",grid:"#e2ebe6",ink:"#0f2417"};

var MODULES=[
  {ic:"sensors",nm:"參數即時採集",sub:"SCADA/PLC 訊號即時擷取"},
  {ic:"rule",nm:"規格上下限比對",sub:"USL/LSL 與管制界比對"},
  {ic:"notification_important",nm:"異常參數告警",sub:"超規即時告警與分級"},
  {ic:"engineering",nm:"現場處置追蹤",sub:"告警派工與處置回報"},
  {ic:"monitoring",nm:"SPC 趨勢分析",sub:"管制圖與 Cpk 製程能力"},
  {ic:"inventory_2",nm:"參數歸檔稽核",sub:"批次參數留存與追溯"}
];

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function elc(id){return document.getElementById(id);}
function destroyChart(){ if(chartRef){try{chartRef.destroy();}catch(e){} chartRef=null;} }

/* SCREEN 0 : 參數即時採集 */
var SENSORS=[
  {id:"S-CVD01",nm:"CVD 反應爐 #1",loc:"沉積站 A",p:"溫度",unit:"℃",val:452.8,usl:460,lsl:440,st:"ok",series:[449,451,450,453,452,454,453,452.8]},
  {id:"S-ETCH2",nm:"乾式蝕刻 #2",loc:"蝕刻站 B",p:"腔壓",unit:"mTorr",val:78.9,usl:80,lsl:60,st:"warn",series:[70,72,74,76,77,79,78,78.9]},
  {id:"S-CMP03",nm:"化學研磨 #3",loc:"平坦化站",p:"研磨壓力",unit:"psi",val:6.4,usl:7.0,lsl:5.5,st:"ok",series:[6.1,6.2,6.3,6.2,6.4,6.5,6.3,6.4]},
  {id:"S-DIFF4",nm:"擴散爐 #4",loc:"熱處理站",p:"溫度",unit:"℃",val:1051,usl:1040,lsl:1000,st:"bad",series:[1015,1020,1028,1035,1042,1048,1050,1051]},
  {id:"S-PVD05",nm:"濺鍍機 #5",loc:"金屬層站",p:"功率",unit:"kW",val:11.6,usl:13,lsl:9,st:"ok",series:[11.2,11.4,11.5,11.3,11.6,11.7,11.5,11.6]},
  {id:"S-WET06",nm:"濕式清洗 #6",loc:"清洗站 C",p:"流量",unit:"L/min",val:23.1,usl:28,lsl:20,st:"ok",series:[22.4,22.8,23.0,22.9,23.2,23.1,23.0,23.1]},
  {id:"S-IMP07",nm:"離子植入 #7",loc:"摻雜站",p:"束流",unit:"mA",val:1.94,usl:2.1,lsl:1.8,st:"warn",series:[1.85,1.88,1.9,1.92,1.95,1.96,1.93,1.94]},
  {id:"S-LITH8",nm:"曝光機 #8",loc:"微影站",p:"對準誤差",unit:"nm",val:3.2,usl:5.0,lsl:0,st:"ok",series:[3.5,3.4,3.3,3.6,3.2,3.1,3.3,3.2]}
];
var selSensor=0;
function stTag(st){var m={ok:["s-ok","正常"],warn:["s-warn","接近上限"],bad:["s-bad","超規"],off:["s-off","離線"]};var x=m[st]||m.off;return '<span class="stat '+x[0]+'">'+x[1]+'</span>';}
function stDot(st){return {ok:C.accent,warn:C.warn,bad:C.danger,off:"#cbd5e1"}[st]||"#cbd5e1";}
function clampPct(v,lo,hi){ if(hi<=lo)return 50; var p=(v-lo)/(hi-lo)*100; return Math.max(2,Math.min(100,p)); }
function makeGauge(id,pct,col){
  var g=new Chart(elc(id),{type:"doughnut",data:{datasets:[{data:[pct,Math.max(0,100-pct)],backgroundColor:[col,"#e5efe9"],borderWidth:0}]},
    options:{cutout:"72%",circumference:220,rotation:250,responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{enabled:false}},animation:false}});
  gaugeStore.push(g);
}
function bindSensors(){
  view.querySelectorAll("[data-sen]").forEach(function(el){
    el.addEventListener("click",function(){ selSensor=+el.getAttribute("data-sen"); render(0); });
  });
}
function screen0(){
  var okc=SENSORS.filter(function(s){return s.st==="ok";}).length;
  var warnc=SENSORS.filter(function(s){return s.st==="warn";}).length;
  var badc=SENSORS.filter(function(s){return s.st==="bad";}).length;
  var h=headHtml(0);
  h+='<div class="kpis">';
  h+=kpi("採集點位","info","sensors",SENSORS.length,"個","採樣頻率 200ms");
  h+=kpi("正常參數","","check_circle",okc,"個","佔比 "+Math.round(okc/SENSORS.length*100)+"%");
  h+=kpi("接近上限","warn","warning",warnc,"個","需留意趨勢");
  h+=kpi("超規告警","danger","error",badc,"個","已觸發告警");
  h+='</div>';
  h+='<div class="split">';
  h+='<div class="panel"><div class="panel-h"><span class="material-symbols-outlined">list_alt</span>採集點位清單<span class="tag">Fab-A</span></div><div class="slist">';
  SENSORS.forEach(function(s,i){
    h+='<div class="sitem'+(i===selSensor?" sel":"")+'" data-sen="'+i+'">'
      +'<span class="dot" style="background:'+stDot(s.st)+'"></span>'
      +'<div class="nm">'+esc(s.nm)+'<small>'+esc(s.loc)+' · '+esc(s.p)+'</small></div>'
      +'<div class="rd"><b>'+s.val+'</b><span>'+esc(s.unit)+'</span></div></div>';
  });
  h+='</div></div>';
  var s=SENSORS[selSensor];
  h+='<div>';
  h+='<div class="panel"><div class="panel-h"><span class="material-symbols-outlined">'+(s.st==="bad"?"error":"show_chart")+'</span>'+esc(s.nm)+' · '+esc(s.p)+' 即時趨勢 '+stTag(s.st)+'<span class="tag">'+esc(s.id)+'</span></div>'
    +'<div class="panel-b"><div class="chart-wrap h300"><canvas id="c0line"></canvas></div>'
    +'<div class="legend"><span><i style="background:'+C.accent+'"></i>量測值</span><span><i style="background:'+C.danger+'"></i>USL 上限 '+s.usl+' '+esc(s.unit)+'</span><span><i style="background:'+C.info+'"></i>LSL 下限 '+s.lsl+' '+esc(s.unit)+'</span></div>'
    +'</div></div>';
  var lastN=s.series.slice(-6);
  var avg=lastN.reduce(function(a,b){return a+b;},0)/lastN.length;
  var rng=Math.max.apply(null,lastN)-Math.min.apply(null,lastN);
  h+='<div class="gauges">';
  h+='<div class="gauge"><div class="gw"><div class="chart-wrap" style="height:110px"><canvas id="c0g1"></canvas></div><div class="gv"><b>'+s.val+'</b><span>'+esc(s.unit)+'</span></div></div><div class="gl">目前量測值</div></div>';
  h+='<div class="gauge"><div class="gw"><div class="chart-wrap" style="height:110px"><canvas id="c0g2"></canvas></div><div class="gv"><b>'+avg.toFixed(1)+'</b><span>近6筆均值</span></div></div><div class="gl">移動平均</div></div>';
  h+='<div class="gauge"><div class="gw"><div class="chart-wrap" style="height:110px"><canvas id="c0g3"></canvas></div><div class="gv"><b>'+rng.toFixed(1)+'</b><span>全距 R</span></div></div><div class="gl">波動全距</div></div>';
  h+='</div>';
  h+='</div></div>';
  view.innerHTML=h;
  void view.offsetHeight;
  bindSensors();
  var lbl=["-7","-6","-5","-4","-3","-2","-1","現在"];
  chartRef=new Chart(elc("c0line"),{type:"line",data:{labels:lbl,datasets:[
    {label:"量測值",data:s.series,borderColor:C.accent,backgroundColor:"rgba(22,163,74,.12)",fill:true,tension:.35,pointRadius:3,pointBackgroundColor:C.accentD,borderWidth:2.5},
    {label:"USL",data:s.series.map(function(){return s.usl;}),borderColor:C.danger,borderDash:[6,4],pointRadius:0,borderWidth:1.5,fill:false},
    {label:"LSL",data:s.series.map(function(){return s.lsl;}),borderColor:C.info,borderDash:[6,4],pointRadius:0,borderWidth:1.5,fill:false}

  {batch:"LOT-A26-0713-04",prod:"晶圓 W25",line:"微影線",qty:25,params:658,ex:0,cpk:1.22,st:"合格歸檔",time:"07-13 13:10"}
];
function archTag(st){var m={"合格歸檔":"s-ok","待覆核":"s-warn","異常凍結":"s-bad"};return '<span class="stat '+(m[st]||"s-off")+'">'+st+'</span>';}
function screen5(){
  var h=headHtml(5);
  var totalP=BATCHES.reduce(function(a,b){return a+b.params;},0);
  var totalEx=BATCHES.reduce(function(a,b){return a+b.ex;},0);
  h+='<div class="kpis">';
  h+=kpi("歸檔批次","","inventory_2",BATCHES.length,"批","近 48 小時");
  h+=kpi("留存參數筆數","info","database",totalP.toLocaleString(),"筆","可完整追溯");
  h+=kpi("含超規批次","warn","gpp_maybe",BATCHES.filter(function(b){return b.ex>0;}).length,"批",totalEx+" 筆超規值");
  h+=kpi("異常凍結","danger","lock",BATCHES.filter(function(b){return b.st==="異常凍結";}).length,"批","待品保放行");
  h+='</div>';
  h+='<div class="grid3">';
  h+='<div class="panel"><div class="panel-h"><span class="material-symbols-outlined">folder_managed</span>批次參數歸檔清單（可追溯稽核）</div><div class="panel-b"><div style="overflow-x:auto"><table class="tbl">'
    +'<thead><tr><th>批號</th><th>產品</th><th>產線</th><th>片數</th><th>參數筆數</th><th>超規</th><th>Cpk</th><th>狀態</th><th>歸檔時間</th></tr></thead><tbody>';
  BATCHES.forEach(function(b){
    h+='<tr><td class="mono">'+esc(b.batch)+'</td><td>'+esc(b.prod)+'</td><td>'+esc(b.line)+'</td><td class="mono">'+b.qty+'</td>'
      +'<td><div class="barcell"><span class="mono">'+b.params+'</span><div class="barbg"><i style="width:'+Math.round(b.params/660*100)+'%;background:'+C.accent+'"></i></div></div></td>'
      +'<td class="mono" style="color:'+(b.ex>0?C.danger:C.muted)+'">'+b.ex+'</td>'
      +'<td><span class="stat '+cpkClass(b.cpk)+'">'+b.cpk.toFixed(2)+'</span></td>'
      +'<td>'+archTag(b.st)+'</td><td style="color:var(--muted)" class="mono">'+esc(b.time)+'</td></tr>';
  });
  h+='</tbody></table></div></div></div>';
  h+='<div class="panel"><div class="panel-h"><span class="material-symbols-outlined">pie_chart</span>歸檔狀態分布</div><div class="panel-b"><div class="chart-wrap h220"><canvas id="c5pie"></canvas></div>'
    +'<div class="chart-wrap h200" style="margin-top:12px"><canvas id="c5line"></canvas></div>'
    +'<div style="font-size:11px;color:var(--muted);text-align:center;margin-top:4px">近 7 日歸檔批次數</div></div></div>';
  h+='</div>';
  h+='<div class="note"><span class="material-symbols-outlined">verified_user</span><div>稽核追溯：每一批次留存完整參數時序（採樣、規格、超規標記、處置紀錄），品保可依批號一鍵回放；異常凍結批次須經品保覆核放行始能出貨，符合 IATF / SPC 稽核要求。</div></div>';
  view.innerHTML=h;
  void view.offsetHeight;
  destroyChart();
  var sc={"合格歸檔":0,"待覆核":0,"異常凍結":0};
  BATCHES.forEach(function(b){sc[b.st]++;});
  chartRef=new Chart(elc("c5pie"),{type:"pie",data:{labels:["合格歸檔","待覆核","異常凍結"],datasets:[{data:[sc["合格歸檔"],sc["待覆核"],sc["異常凍結"]],backgroundColor:[C.accent,C.warn,C.danger],borderWidth:2,borderColor:"#fff"}]},
    options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{position:"bottom",labels:{font:{size:11},boxWidth:12}}}}});
  var ln=new Chart(elc("c5line"),{type:"line",data:{labels:["7/8","7/9","7/10","7/11","7/12","7/13","7/14"],datasets:[{label:"歸檔批次",data:[6,7,5,8,7,9,8],borderColor:C.accentD,backgroundColor:"rgba(22,163,74,.12)",fill:true,tension:.35,pointRadius:2,borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{beginAtZero:true,grid:{color:C.grid},ticks:{font:{size:10}}}}}});
  gaugeStore.push(ln);
}

/* helpers */
function headHtml(i){
  var m=MODULES[i];
  return '<div class="scr-head"><div class="ic"><span class="material-symbols-outlined">'+m.ic+'</span></div><div><h2>'+esc(m.nm)+'</h2><p>'+esc(m.sub)+'　·　畫面 '+(i+1)+' / 6</p></div></div>';
}
function kpi(lab,cls,ic,val,unit,sub,dir){
  var d=dir==="up"?"up":(dir==="down"?"down":"");
  return '<div class="kpi '+(cls||"")+'"><div class="lab"><span class="material-symbols-outlined" style="font-size:16px">'+ic+'</span>'+esc(lab)+'</div>'
    +'<div class="val">'+val+(unit?' <small>'+esc(unit)+'</small>':'')+'</div>'
    +(sub?'<div class="sub '+d+'">'+esc(sub)+'</div>':'')+'</div>';
}
function baseOpts(o){
  o=o||{};
  return {responsive:true,maintainAspectRatio:false,animation:false,
    plugins:{legend:o.legend?{position:"top",labels:{font:{size:11},boxWidth:12,usePointStyle:true}}:{display:false},
      tooltip:{mode:"index",intersect:false}},
    interaction:{mode:"index",intersect:false},
    scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{grid:{color:C.grid},ticks:{font:{size:10}}}}};
}

var SCREENS=[screen0,screen1,screen2,screen3,screen4,screen5];
function render(i){
  destroyChart();
  gaugeStore.forEach(function(g){try{g.destroy();}catch(e){}});
  gaugeStore=[];
  var nv=document.getElementById("nav");
  nv.querySelectorAll("button").forEach(function(b){ b.classList.toggle("active",+b.getAttribute("data-i")===i); });
  SCREENS[i]();
}
function show(i){ render(i); try{window.scrollTo(0,0);}catch(e){} }

(function(){
  var nv=document.getElementById("nav");
  var html="";
  MODULES.forEach(function(m,i){
    html+='<button data-i="'+i+'"><span class="material-symbols-outlined" style="font-size:18px">'+m.ic+'</span><span class="idx">'+(i+1)+'</span><span class="txt">'+esc(m.nm)+'</span></button>';
  });
  nv.innerHTML=html;
  nv.querySelectorAll("[data-i]").forEach(function(b){ b.addEventListener("click",function(){ show(+b.getAttribute("data-i")); }); });
  show(0);
})();

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
