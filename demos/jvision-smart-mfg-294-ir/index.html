<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>投資人關係管理系統（IR）</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#b45309;--accent2:#f59e0b;--bg:#faf7f2;--card:#ffffff;
  --ink:#2b2118;--muted:#8a7a68;--line:#eadfd2;--soft:#fbf4ea;
  --green:#15803d;--red:#b91c1c;--blue:#1d4ed8;--amber:#d97706;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;line-height:1.5;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.app{display:flex;min-height:100vh;}
.side{
  width:250px;flex:0 0 250px;background:#fff;border-right:1px solid var(--line);
  padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:10px;}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 38px;}
.brand .logo .material-symbols-outlined{font-size:22px;}
.brand b{font-size:15px;display:block;}
.brand span{font-size:11px;color:var(--muted);}
nav{display:flex;flex-direction:column;gap:4px;}
.nav-btn{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;border:none;
  background:transparent;color:var(--ink);font-family:inherit;font-size:13.5px;cursor:pointer;text-align:left;width:100%;transition:.15s;min-width:0;
}
.nav-btn .material-symbols-outlined{font-size:20px;color:var(--muted);flex:0 0 auto;}
.nav-btn small{display:block;font-size:10.5px;color:var(--muted);font-weight:400;}
.nav-btn:hover{background:var(--soft);}
.nav-btn.on{background:linear-gradient(135deg,rgba(180,83,9,.12),rgba(245,158,11,.10));color:var(--accent);font-weight:600;}
.nav-btn.on .material-symbols-outlined{color:var(--accent);}
.nav-btn.on small{color:var(--accent);opacity:.75;}
.side-foot{margin-top:auto;padding:12px 10px 2px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);}
.main{flex:1;min-width:0;padding:26px 30px 60px;}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.head h1{font-size:21px;margin:0 0 4px;}
.head p{margin:0;color:var(--muted);font-size:13px;}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--line);color:var(--accent);font-size:12px;padding:6px 12px;border-radius:20px;font-weight:600;}
.grid{display:grid;gap:16px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:2fr 1fr;}
.g32{grid-template-columns:1.4fr 1fr;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0;}
.card h3{margin:0 0 3px;font-size:14.5px;}
.card .sub{color:var(--muted);font-size:11.5px;margin:0 0 14px;}
.kpi{position:relative;overflow:hidden;}
.kpi .lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--accent);}
.kpi .val{font-size:26px;font-weight:700;margin:8px 0 2px;letter-spacing:-.5px;}
.kpi .dt{font-size:11.5px;font-weight:600;}
.up{color:var(--green);}.down{color:var(--red);}
.chart{width:100%;overflow:hidden;min-width:0;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
tbody tr:hover{background:var(--soft);}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;white-space:nowrap;}
.t-g{background:#e7f6ec;color:var(--green);}
.t-r{background:#fdeaea;color:var(--red);}
.t-a{background:#fdf3e2;color:var(--amber);}
.t-b{background:#e8eefc;color:var(--blue);}
.t-n{background:#f0ece6;color:var(--muted);}
.bars{display:flex;flex-direction:column;gap:11px;}
.barrow{display:flex;align-items:center;gap:10px;font-size:12px;}
.barrow .nm{width:120px;flex:0 0 120px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;}
.bartrack{flex:1;height:9px;background:var(--soft);border-radius:6px;overflow:hidden;min-width:0;}
.barfill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.barrow .vl{width:44px;flex:0 0 44px;text-align:right;font-weight:600;}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;min-width:0;}
.col{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:11px;min-width:0;}
.col h4{margin:0 0 10px;font-size:12.5px;display:flex;align-items:center;justify-content:space-between;}
.col h4 span{background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:20px;font-size:10.5px;padding:1px 8px;font-weight:600;}
.tk{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;padding:9px 10px;margin-bottom:8px;font-size:12px;}
.tk .tt{font-weight:600;margin-bottom:4px;}
.tk .mm{color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;}
.tl{list-style:none;margin:0;padding:0;position:relative;}
.tl:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl li{position:relative;padding:0 0 16px 30px;}
.tl li .dot{position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--accent2);}
.tl li.done .dot{background:var(--accent);border-color:var(--accent);}
.tl li .tt{font-weight:600;font-size:13px;}
.tl li .mt{font-size:11.5px;color:var(--muted);}
.tl li .tm{font-size:10.5px;color:var(--accent);font-weight:600;}
.qa{border:1px solid var(--line);border-radius:11px;padding:13px 14px;margin-bottom:11px;background:#fff;}
.qa .q{font-weight:600;font-size:13px;display:flex;gap:8px;align-items:flex-start;}
.qa .q .material-symbols-outlined{color:var(--accent);font-size:19px;flex:0 0 auto;}
.qa .a{color:var(--muted);font-size:12px;margin:8px 0 8px 27px;line-height:1.6;}
.qa .meta{margin-left:27px;display:flex;gap:8px;flex-wrap:wrap;}
.senti{display:flex;flex-direction:column;gap:9px;}
.senti .row{display:flex;align-items:center;gap:10px;font-size:12px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;}
.senti .src{width:72px;flex:0 0 72px;font-weight:600;}
.senti .txt{flex:1;min-width:0;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.stat-strip{display:flex;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;flex-wrap:wrap;}
.stat-strip .s{flex:1;min-width:120px;padding:14px 16px;border-right:1px solid var(--line);}
.stat-strip .s:last-child{border-right:none;}
.stat-strip .s .l{font-size:11.5px;color:var(--muted);}
.stat-strip .s .v{font-size:20px;font-weight:700;margin-top:3px;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px;}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle;}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.chip{font-size:11.5px;padding:5px 12px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--muted);font-weight:500;}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.mtxt{color:var(--muted);}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr);}.board{grid-template-columns:repeat(2,1fr);}}
@media(max-width:860px){
  .app{flex-direction:column;}
  .side{width:auto;flex:none;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px;gap:8px;border-right:none;border-bottom:1px solid var(--line);}
  .brand{border-bottom:none;padding:0 8px 0 4px;margin:0;border-right:1px solid var(--line);}
  nav{flex-direction:row;flex-wrap:wrap;gap:6px;}
  .nav-btn{width:auto;padding:8px 12px;}
  .nav-btn small{display:none;}
  .side-foot{display:none;}
  .main{padding:20px 16px 50px;}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
  .board{grid-template-columns:1fr;}
}
@media(max-width:560px){
  .nav-btn .txt{display:none;}
  .nav-btn{padding:9px 11px;}
  .head h1{font-size:18px;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">trending_up</span></div>
      <div><b>IR 關係管理</b><span>投資人關係管理系統</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">狀態：示範資料<br/>資料期間：2026 Q2</div>
  </aside>
  <main class="main">
    <div class="head">
      <div>
        <h1 id="scr-title">—</h1>
        <p id="scr-sub">—</p>
      </div>
      <span class="pill"><span class="material-symbols-outlined" style="font-size:16px">verified</span> 台灣證交所上市</span>
    </div>
    <div id="view"></div>
  </main>
</div>
<script>
var MODS=[
  {icon:"monitoring",name:"IR 儀表板",sub:"股價與法人動向總覽",title:"IR 儀表板",desc:"股價、法人動向與 IR 關鍵指標即時總覽"},
  {icon:"calendar_month",name:"法說會排程",sub:"財報發布與會議行程",title:"法說會與財報排程",desc:"財報發布與法人會議行程管理，確保揭露時程"},
  {icon:"groups",name:"法人溝通紀錄",sub:"會議與接觸追蹤",title:"法人溝通紀錄",desc:"一對一會議與法人接觸紀錄，逐案追蹤後續事項"},
  {icon:"fact_check",name:"投資人問答庫",sub:"口徑統一資料庫",title:"投資人問答庫",desc:"常見投資人問題與統一回覆口徑資料庫"},
  {icon:"insights",name:"輿情股價監控",sub:"媒體與市場情緒",title:"輿情與股價監控",desc:"媒體輿情、市場情緒與股價異動即時追蹤"},
  {icon:"gavel",name:"重大訊息公告",sub:"重訊揭露與稽核",title:"重大訊息公告",desc:"重大訊息揭露排程、合規稽核與檢討"}
];
var view=document.getElementById("view");
var navEl=document.getElementById("nav");
var charts=[];
MODS.forEach(function(m,i){
  var b=document.createElement("button");
  b.className="nav-btn";b.setAttribute("data-i",i);
  b.innerHTML='<span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'<small>'+m.sub+'</small></span>';
  b.addEventListener("click",function(){location.hash="v"+i;});
  navEl.appendChild(b);
});
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;try{var c=new ApexCharts(el,opt);c.render();charts.push(c);}catch(e){}}
function base(extra){
  var o={chart:{fontFamily:'Inter,"Noto Sans TC",sans-serif',toolbar:{show:false},redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false}},
    grid:{borderColor:"#eadfd2",strokeDashArray:4},dataLabels:{enabled:false},
    colors:["#b45309","#f59e0b","#1d4ed8","#15803d"]};
  for(var k in extra){o[k]=extra[k];}
  return o;
}

/* ===== SCREEN 0 : IR 儀表板 ===== */
function s0(){
  return '<div class="grid g4" style="margin-bottom:16px">'+
    kpi("payments","股價 (TWD)","286.5","up","▲ 2.8% 今日")+
    kpi("groups","本季法人接觸","148","up","▲ 22 場 vs 前季")+
    kpi("sentiment_satisfied","法人溝通滿意度","4.4 / 5","up","▲ 0.3")+
    kpi("gavel","重訊即時揭露率","98.6%","up","▲ 1.4%")+
    '</div>'+
    '<div class="grid g23" style="margin-bottom:16px">'+
      '<div class="card"><h3>股價與大盤相對走勢</h3><p class="sub">近 6 個月，本公司 vs 加權指數（基準 100）</p><div class="chart" id="c0a"></div></div>'+
      '<div class="card"><h3>法人持股結構</h3><p class="sub">股權分布（%）</p><div class="chart" id="c0b"></div>'+
        '<div class="legend"><span><i style="background:#b45309"></i>外資</span><span><i style="background:#f59e0b"></i>投信</span><span><i style="background:#1d4ed8"></i>自營商</span><span><i style="background:#15803d"></i>散戶</span></div></div>'+
    '</div>'+
    '<div class="grid g2">'+
      '<div class="card"><h3>本季 IR 待辦重點</h3><p class="sub">依優先度排序</p>'+tk3()+'</div>'+
      '<div class="card"><h3>法人分析師評等分布</h3><p class="sub">追蹤本公司之券商（共 18 家）</p><div class="chart" id="c0c"></div></div>'+
    '</div>';
}
function tk3(){
  var d=[
    {t:"Q2 法說會簡報定稿",m:"IR 部 · 8/22 前",g:"t-r",lab:"高"},
    {t:"外資一對一會議 6 場預約",m:"發言人室 · 進行中",g:"t-a",lab:"中"},
    {t:"重大訊息：庫藏股執行公告",m:"財務部 · 已排程",g:"t-b",lab:"排程"},
    {t:"投資人問答庫口徑更新",m:"IR 部 · 已完成",g:"t-g",lab:"完成"}
  ],h='<div>';
  d.forEach(function(x){h+='<div class="tk"><div class="tt">'+x.t+'</div><div class="mm"><span>'+x.m+'</span><span class="tag '+x.g+'">'+x.lab+'</span></div></div>';});
  return h+'</div>';
}
function s0charts(){
  mk("c0a",base({
    chart:{type:"line",height:280,toolbar:{show:false},redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false}},
    stroke:{width:[3,2],curve:"smooth",dashArray:[0,5]},
    series:[{name:"本公司",data:[100,104,98,112,118,124]},{name:"加權指數",data:[100,102,101,105,108,110]}],
    xaxis:{categories:["3月","4月","5月","6月","7月","8月"]},
    yaxis:{labels:{formatter:function(v){return Math.round(v);}}},
    tooltip:{shared:true,intersect:false},legend:{show:true}
  }));
  mk("c0b",base({
    chart:{type:"donut",height:250,redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false}},
    series:[42,18,6,34],labels:["外資","投信","自營商","散戶"],
    legend:{show:false},plotOptions:{pie:{donut:{size:"64%"}}}
  }));
  mk("c0c",base({
    chart:{type:"bar",height:250,redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false}},
    plotOptions:{bar:{horizontal:true,borderRadius:5,barHeight:"55%",distributed:true}},
    series:[{name:"券商數",data:[9,6,3]}],
    xaxis:{categories:["買進 Buy","中立 Hold","賣出 Sell"]},
    colors:["#15803d","#f59e0b","#b91c1c"],legend:{show:false}
  }));
}

/* ===== SCREEN 1 : 法說會與財報排程 ===== */
function s1(){
  return '<div class="stat-strip" style="margin-bottom:16px">'+
      strip("下場法說會","8/28 · Q2")+strip("已排定會議","12 場")+strip("待確認議程","3 場")+strip("平均籌備天數","14 天")+
    '</div>'+
    '<div class="grid g32" style="margin-bottom:16px">'+
      '<div class="card"><h3>近期發布與會議排程</h3><p class="sub">財報、法說會與券商論壇</p>'+
        '<div style="overflow-x:auto">'+schedTable()+'</div></div>'+
      '<div class="card"><h3>籌備進度時間軸</h3><p class="sub">Q2 法說會準備</p>'+prepTl()+'</div>'+
    '</div>'+
    '<div class="card"><h3>各季 IR 活動量</h3><p class="sub">法人會議、電話會議與券商論壇場次</p><div class="chart" id="c1a"></div></div>';
}
function schedTable(){
  var r=[
    ["08/12","Q2 財報公告","財報發布","財務部","t-g","已完成"],
    ["08/28","2026 Q2 法人說明會","法說會","IR 部","t-a","籌備中"],
    ["09/05","外資券商產業論壇","券商論壇","發言人室","t-b","已確認"],
    ["09/18","北美 NDR 路演","一對一路演","IR 部","t-b","已確認"],
    ["10/03","投信季度拜訪","法人拜訪","IR 部","t-n","待確認"],
    ["11/10","Q3 財報公告","財報發布","財務部","t-n","待確認"]
  ],h='<table><thead><tr><th>日期</th><th>活動</th><th>類型</th><th>主辦</th><th>狀態</th></tr></thead><tbody>';
  r.forEach(function(x){h+='<tr><td><b>'+x[0]+'</b></td><td>'+x[1]+'</td><td>'+x[2]+'</td><td>'+x[3]+'</td><td><span class="tag '+x[4]+'">'+x[5]+'</span></td></tr>';});
  return h+'</tbody></table>';
}
function prepTl(){
  var d=[
    {t:"財報數據彙整",m:"財務部完成",tm:"8/12",done:1},
    {t:"簡報初稿撰寫",m:"IR 部進行中",tm:"8/20",done:1},
    {t:"問答口徑審核",m:"發言人室待審",tm:"8/24",done:0},
    {t:"法遵與重訊確認",m:"待處理",tm:"8/26",done:0},
    {t:"法說會正式舉行",m:"—",tm:"8/28",done:0}
  ],h='<ul class="tl">';
  d.forEach(function(x){h+='<li class="'+(x.done?"done":"")+'"><span class="dot"></span><div class="tt">'+x.t+'</div><div class="mt">'+x.m+'</div><div class="tm">'+x.tm+'</div></li>';});
  return h+'</ul>';
}
function s1charts(){
  mk("c1a",base({
    chart:{type:"bar",height:290,stacked:true,redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false}},
    plotOptions:{bar:{borderRadius:5,columnWidth:"52%"}},
    series:[{name:"法人會議",data:[32,38,41,45]},{name:"電話會議",data:[18,22,20,26]},{name:"券商論壇",data:[4,6,5,7]}],
    xaxis:{categories:["Q3'25","Q4'25","Q1'26","Q2'26"]},
    tooltip:{shared:true,intersect:false},legend:{show:true,position:"top"}
  }));
}

/* ===== SCREEN 2 : 法人溝通紀錄 ===== */
function s2(){
  return '<div class="chip-row"><span class="chip on">全部</span><span class="chip">外資</span><span class="chip">投信</span><span class="chip">自營</span><span class="chip">待追蹤</span></div>'+
    '<div class="grid g23" style="margin-bottom:16px">'+
      '<div class="card"><h3>法人溝通紀錄</h3><p class="sub">近期一對一與法人會議登錄</p>'+
        '<div style="overflow-x:auto">'+meetTable()+'</div></div>'+
      '<div class="card"><h3>本季接觸機構類型</h3><p class="sub">依機構性質</p><div class="chart" id="c2a"></div></div>'+
    '</div>'+
    '<div class="grid g2">'+

/* ===== helpers ===== */
function kpi(icon,lab,val,dir,dt){
  var cls=dir==="up"?"up":dir==="down"?"down":"mtxt";
  return '<div class="card kpi"><div class="lab"><span class="material-symbols-outlined">'+icon+'</span>'+lab+'</div><div class="val">'+val+'</div><div class="dt '+cls+'">'+(dt||"")+'</div></div>';
}
function strip(l,v){return '<div class="s"><div class="l">'+l+'</div><div class="v">'+v+'</div></div>';}

var RENDER=[
  {html:s0,ch:s0charts},{html:s1,ch:s1charts},{html:s2,ch:s2charts},
  {html:s3,ch:s3charts},{html:s4,ch:s4charts},{html:s5,ch:s5charts}
];
function show(i){
  killCharts();
  var m=MODS[i]||MODS[0];
  document.getElementById("scr-title").textContent=m.title;
  document.getElementById("scr-sub").textContent=m.desc;
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  view.innerHTML=RENDER[i].html();
  void view.offsetHeight;
  RENDER[i].ch();
}
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
