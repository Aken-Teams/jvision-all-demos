<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>投資人關係管理系統（IR）</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0F766E;
  --ink:#134E4A;
  --muted:#475569;
  --line:#99E6DA;
  --green:#15803D;
  --red:#B91C1C;
  --amber:#A14F03;
  --navy:#0F172A;
  --soft:#E8F7F5;
  --shadow:0 1px 0 rgba(15,118,110,.09),0 10px 28px rgba(15,118,110,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:
    linear-gradient(rgba(13,148,136,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(13,148,136,.035) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Crimson Pro","Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,.chip{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.app{display:flex;min-height:100vh}
.side{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  flex:0 0 264px;
  flex-direction:column;
  width:264px;
  height:100vh;
  padding:24px 16px 18px;
  overflow-y:auto;
  background:rgba(255,255,255,.97);
  border-right:1px solid var(--line);
  box-shadow:8px 0 30px rgba(19,78,74,.04);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  margin:0 4px 22px;
  padding:0 4px 20px;
  border-bottom:1px solid var(--line);
}
.logo{
  display:grid;
  flex:0 0 42px;
  width:42px;
  height:42px;
  place-items:center;
  color:var(--color-on-primary);
  background:var(--color-secondary);
  border:1px solid var(--color-primary);
  border-radius:4px;
  box-shadow:4px 4px 0 rgba(13,148,136,.18);
}
.logo svg{width:22px;height:22px}
.brand b{
  display:block;
  color:var(--navy);
  font-family:"Cinzel","Noto Serif TC",serif;
  font-size:13px;
  font-weight:600;
  letter-spacing:.055em;
}
.brand span{display:block;color:var(--muted);font-size:12px}
nav{display:flex;flex-direction:column;gap:4px}
.nav-btn{
  position:relative;
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  min-height:48px;
  padding:9px 12px;
  overflow:hidden;
  color:var(--ink);
  text-align:left;
  background:transparent;
  border:1px solid transparent;
  border-radius:4px;
  transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s ease;
}
.nav-btn svg{
  flex:0 0 19px;
  width:19px;
  height:19px;
  color:var(--muted);
  transition:color .2s ease;
}
.nav-btn .txt{min-width:0;font-size:14px;font-weight:600;line-height:1.25}
.nav-btn small{
  display:block;
  margin-top:3px;
  overflow:hidden;
  color:var(--muted);
  font-size:11.5px;
  font-weight:400;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.nav-btn:hover{
  color:var(--navy);
  background:var(--soft);
  border-color:var(--line);
  transform:translateX(2px);
}
.nav-btn.on{
  color:#064E3B;
  background:#CCFBF1;
  border-color:var(--color-primary);
  box-shadow:inset 3px 0 0 var(--color-primary);
}
.nav-btn.on svg,.nav-btn.on small{color:#0F766E}
.side-foot{
  margin-top:auto;
  padding:16px 8px 2px;
  color:var(--muted);
  border-top:1px solid var(--line);
  font-size:12px;
  line-height:1.7;
}
.main{flex:1;min-width:0;padding:32px clamp(20px,3vw,46px) 64px}
.head{
  position:sticky;
  top:0;
  z-index:15;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
  margin:-32px calc(clamp(20px,3vw,46px) * -1) 24px;
  padding:26px clamp(20px,3vw,46px) 18px;
  background:rgba(240,253,250,.94);
  border-bottom:1px solid rgba(94,234,212,.7);
  backdrop-filter:blur(12px);
}
.head h1{
  margin:0 0 3px;
  color:var(--navy);
  font-family:"Cormorant Garamond","Noto Serif TC",serif;
  font-size:clamp(27px,2.5vw,36px);
  font-weight:700;
  letter-spacing:-.025em;
  line-height:1.05;
}
.head p{margin:5px 0 0;color:var(--muted);font-size:14px}
.pill{
  display:inline-flex;
  flex:0 0 auto;
  align-items:center;
  gap:7px;
  min-height:36px;
  padding:7px 12px;
  color:#065F56;
  background:#CCFBF1;
  border:1px solid var(--color-primary);
  border-radius:3px;
  font-size:12px;
  font-weight:600;
}
.pill svg{width:16px;height:16px}
.grid{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g32{grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr)}
.card{
  min-width:0;
  padding:18px;
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:5px;
  box-shadow:var(--shadow);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.card:hover{
  border-color:var(--color-primary);
  box-shadow:0 1px 0 rgba(15,118,110,.12),0 14px 32px rgba(15,118,110,.09);
  transform:translateY(-2px);
}
.card h3{
  margin:0 0 2px;
  color:var(--navy);
  font-family:"Cormorant Garamond","Noto Serif TC",serif;
  font-size:19px;
  font-weight:700;
  letter-spacing:-.01em;
}
.card .sub{margin:0 0 14px;color:var(--muted);font-size:12.5px}
.kpi{
  position:relative;
  min-height:142px;
  overflow:hidden;
  border-top:3px solid var(--color-primary);
}
.kpi:after{
  position:absolute;
  right:-25px;
  bottom:-42px;
  width:105px;
  height:105px;
  content:"";
  background:rgba(45,212,191,.1);
  border:1px solid rgba(13,148,136,.12);
  border-radius:50%;
}
.kpi .lab{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:12.5px;
  font-weight:600;
}
.kpi .lab svg{width:17px;height:17px;color:var(--color-primary)}
.kpi .val{
  position:relative;
  z-index:1;
  margin:10px 0 3px;
  color:var(--navy);
  font-family:"Cinzel","Crimson Pro",serif;
  font-size:29px;
  font-variant-numeric:tabular-nums;
  font-weight:600;
  letter-spacing:-.035em;
  line-height:1.15;
}
.kpi .dt{position:relative;z-index:1;font-size:12px;font-weight:600}
.up{color:#166534}
.down{color:#991B1B}
.mtxt{color:var(--muted)}
.chart{width:100%;min-width:0;overflow:hidden}
.table-wrap{width:100%;overflow-x:auto}
table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  font-size:13px;
}
th,td{
  padding:10px 11px;
  text-align:left;
  white-space:nowrap;
  border-bottom:1px solid var(--line);
}
th{
  color:#334155;
  background:#ECFDF9;
  border-top:1px solid var(--line);
  font-family:"Crimson Pro","Noto Serif TC",serif;
  font-size:11.5px;
  font-weight:600;
  letter-spacing:.045em;
}
th:first-child{border-left:1px solid var(--line)}
th:last-child{border-right:1px solid var(--line)}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#F0FDFA}
td:first-child,td b{
  font-variant-numeric:tabular-nums;
}
td:first-child{
  color:#334155;
  font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  font-size:12px;
}
td:last-child{text-align:right}
th:last-child{text-align:right}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:24px;
  padding:2px 9px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:11px;
  font-weight:600;
  line-height:1.2;
  white-space:nowrap;
}
.tag:before{
  display:inline-block;
  width:6px;
  height:6px;
  content:"";
  background:currentColor;
  border-radius:50%;
}
.t-g{color:#166534;background:#F0FDF4}
.t-r{color:#991B1B;background:#FEF2F2}
.t-a{color:#92400E;background:#FFFBEB}
.t-b{color:#115E59;background:#F0FDFA}
.t-n{color:#475569;background:#F8FAFC}
.bars{display:flex;flex-direction:column;gap:12px}
.barrow{display:flex;align-items:center;gap:10px;font-size:12.5px}
.barrow .nm{
  flex:0 0 126px;
  width:126px;
  min-width:0;
  overflow:hidden;
  color:#334155;
  font-weight:600;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.bartrack{
  flex:1;
  min-width:0;
  height:10px;
  overflow:hidden;
  background:var(--color-muted);
  border:1px solid #CFE8E5;
  border-radius:2px;
}
.barfill{
  height:100%;
  background:linear-gradient(90deg,var(--color-primary),var(--color-secondary));
  border-radius:1px;
}
.barrow .vl{
  flex:0 0 48px;
  width:48px;
  color:var(--navy);
  font-family:"SFMono-Regular",Consolas,monospace;
  font-variant-numeric:tabular-nums;
  font-weight:700;
  text-align:right;
}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.col{
  min-width:0;
  padding:11px;
  background:#F8FFFE;
  border:1px solid var(--line);
  border-radius:4px;
}
.col h4{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:0 0 10px;
  color:var(--navy);
  font-size:13px;
}
.col h4 span{
  min-width:24px;
  padding:1px 7px;
  color:#0F766E;
  text-align:center;
  background:#CCFBF1;
  border:1px solid var(--line);
  border-radius:999px;
  font-family:"SFMono-Regular",Consolas,monospace;
  font-size:10.5px;
}
.tk{
  margin-bottom:8px;
  padding:9px 10px;
  background:#FFF;
  border:1px solid var(--line);
  border-left:3px solid var(--color-primary);
  border-radius:3px;
  box-shadow:0 2px 8px rgba(15,118,110,.04);
}
.tk:last-child{margin-bottom:0}
.tk .tt{margin-bottom:4px;color:var(--navy);font-size:12.5px;font-weight:600}
.tk .mm{
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  gap:6px;
  color:var(--muted);
  font-size:11px;
}
.tl{position:relative;margin:0;padding:0;list-style:none}
.tl:before{
  position:absolute;
  top:4px;
  bottom:4px;
  left:8px;
  width:1px;
  content:"";
  background:var(--line);
}
.tl li{position:relative;padding:0 0 17px 30px}
.tl li:last-child{padding-bottom:0}
.tl li .dot{
  position:absolute;
  top:2px;
  left:2px;
  width:14px;
  height:14px;
  background:#FFF;
  border:3px solid var(--color-accent);
  border-radius:50%;
}
.tl li.done .dot{
  background:var(--color-primary);
  border-color:var(--color-primary);
}
.tl li.done .dot:after{
  position:absolute;
  top:1px;
  left:3px;
  width:3px;
  height:5px;
  content:"";
  border-right:1px solid #FFF;
  border-bottom:1px solid #FFF;
  transform:rotate(45deg);
}
.tl li .tt{color:var(--navy);font-size:13px;font-weight:600}
.tl li .mt{color:var(--muted);font-size:11.5px}
.tl li .tm{
  color:#0F766E;
  font-family:"SFMono-Regular",Consolas,monospace;
  font-size:10.5px;
  font-weight:600;
}
.qa{
  margin-bottom:10px;
  padding:13px 14px;
  background:#FFF;
  border:1px solid var(--line);
  border-left:3px solid var(--color-primary);
  border-radius:3px;
}
.qa:last-child{margin-bottom:0}
.qa .q{display:flex;align-items:flex-start;gap:9px;color:var(--navy);font-size:13px;font-weight:600}
.qa .q svg{flex:0 0 18px;width:18px;height:18px;color:var(--color-primary)}
.qa .a{margin:8px 0 9px 27px;color:#475569;font-size:12.5px;line-height:1.65}
.qa .meta{display:flex;flex-wrap:wrap;gap:7px;margin-left:27px}
.senti{display:flex;flex-direction:column;gap:8px}
.senti .row{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
  padding:9px 10px;
  background:#F8FFFE;
  border:1px solid var(--line);
  border-radius:3px;
  font-size:12px;
}
.senti .src{flex:0 0 74px;width:74px;color:var(--navy);font-weight:600}
.senti .txt{
  flex:1;
  min-width:0;
  overflow:hidden;
  color:var(--muted);
  text-overflow:ellipsis;
  white-space:nowrap;
}
.stat-strip{
  display:flex;
  flex-wrap:wrap;
  overflow:hidden;
  background:#FFF;
  border:1px solid var(--line);
  border-radius:5px;
  box-shadow:var(--shadow);
}
.stat-strip .s{
  flex:1;
  min-width:150px;
  padding:15px 18px;
  border-right:1px solid var(--line);
  border-top:3px solid transparent;
}
.stat-strip .s:first-child{border-top-color:var(--color-accent)}
.stat-strip .s:last-child{border-right:0}
.stat-strip .s .l{color:var(--muted);font-size:12px;font-weight:600}
.stat-strip .s .v{
  margin-top:3px;
  color:var(--navy);
  font-family:"Cinzel","Crimson Pro",serif;
  font-size:22px;
  font-variant-numeric:tabular-nums;
  font-weight:600;
}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;color:var(--muted);font-size:11.5px}
.legend i{
  display:inline-block;
  width:9px;
  height:9px;
  margin-right:5px;
  vertical-align:middle;
  border:1px solid rgba(15,23,42,.15);
  border-radius:1px;
}
.chip-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.chip{
  min-height:36px;
  padding:6px 13px;
  color:#334155;
  background:#FFF;
  border:1px solid var(--line);
  border-radius:3px;
  font-size:12px;
  font-weight:600;
  transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s ease;
}
.chip:hover{color:#064E3B;background:#CCFBF1;border-color:var(--color-primary);transform:translateY(-1px)}
.chip.on{color:var(--color-on-primary);background:var(--color-secondary);border-color:var(--color-primary)}
.reveal{animation:reveal .36s ease-out both}
@keyframes reveal{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:860px){
  .app{display:block}
  .side{
    position:sticky;
    top:0;
    width:100%;
    height:auto;
    padding:10px 12px;
    overflow-x:auto;
    overflow-y:hidden;
    border-right:0;
    border-bottom:1px solid var(--line);
    box-shadow:0 7px 20px rgba(15,118,110,.07);
  }
  .brand{
    display:none;
  }
  nav{flex-direction:row;width:max-content;gap:6px}
  .nav-btn{width:auto;min-height:44px;padding:8px 11px}
  .nav-btn small{display:none}
  .nav-btn.on{box-shadow:inset 0 -3px 0 var(--color-primary)}
  .nav-btn:hover{transform:translateY(-1px)}
  .side-foot{display:none}
  .main{padding:22px 16px 48px}
  .head{
    position:static;
    margin:-22px -16px 20px;
    padding:20px 16px 16px;
    backdrop-filter:none;
  }
}
@media(max-width:820px){
  .g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
}
@media(max-width:560px){
  .nav-btn{min-width:44px;justify-content:center}
  .nav-btn .txt{display:none}
  .head{align-items:flex-start}
  .head h1{font-size:27px}
  .head p{font-size:12.5px}
  .pill{padding:6px 9px}
  .g4{grid-template-columns:1fr}
  .card{padding:15px}
  .kpi{min-height:126px}
  .barrow{align-items:flex-start;flex-wrap:wrap}
  .barrow .nm{flex:1 0 calc(100% - 60px);width:auto}
  .bartrack{order:3;flex-basis:100%}
  .senti .row{align-items:flex-start;flex-wrap:wrap}
  .senti .txt{order:3;flex-basis:100%;white-space:normal}
  .stat-strip .s{min-width:50%;border-bottom:1px solid var(--line)}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
    transition-duration:.01ms!important;
  }
  .reveal{animation:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 18V11M10 18V6M16 18v-4M3 20h18M4 9l6-5 6 7 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter"/></svg>
      </div>
      <div><b>IR 關係管理</b><span>投資人關係管理系統</span></div>
    </div>
    <nav id="nav" aria-label="系統功能"></nav>
    <div class="side-foot">狀態：示範資料<br/>資料期間：2026 Q2</div>
  </aside>
  <main class="main">
    <div class="head">
      <div>
        <h1 id="scr-title">—</h1>
        <p id="scr-sub">—</p>
      </div>
      <span class="pill">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m8.5 12 2.2 2.2L15.8 9M12 3l2.2 1.4 2.6-.1 1.1 2.4 2.2 1.4-.5 2.6 1.1 2.3-1.8 1.9-.5 2.6-2.6.4-1.8 1.9-2-1.3-2.6.4-1.2-2.3-2.4-1 .1-2.7L3.6 12l1.2-2.3-.1-2.6 2.4-1 1.2-2.3 2.6.4L12 3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        台灣證交所上市
      </span>
    </div>
    <div id="view" aria-live="polite"></div>
  </main>
</div>
<script>
var ICONS={

function kpi(icon,lab,val,dir,dt){
var cls=dir==="up"?"up":dir==="down"?"down":"mtxt";
return '<div class="card kpi"><div class="lab">'+ICONS[icon]+lab+'</div><div class="val">'+val+'</div><div class="dt '+cls+'">'+(dt||"")+"</div></div>"
}
function strip(l,v){return '<div class="s"><div class="l">'+l+'</div><div class="v">'+v+"</div></div>"}
var RENDER=[
{html:s0,ch:s0charts},{html:s1,ch:s1charts},{html:s2,ch:s2charts},
{html:s3,ch:s3charts},{html:s4,ch:s4charts},{html:s5,ch:s5charts}
];
function show(i){
killCharts();
var m=MODS[i]||MODS[0];
document.getElementById("scr-title").textContent=m.title;
document.getElementById("scr-sub").textContent=m.desc;
var btns=document.querySelectorAll("[data-i]");
for(var b=0;b<btns.length;b++){
var active=+btns[b].getAttribute("data-i")===i;
btns[b].classList.toggle("on",active);
btns[b].setAttribute("aria-current",active?"page":"false")
}
view.innerHTML=RENDER[i].html();
view.classList.remove("reveal");
void view.offsetHeight;
view.classList.add("reveal");
RENDER[i].ch()
}
function fromHash(){
var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
if(!m){show(0);return}
var n=document.querySelectorAll("[data-i]").length||6;
show(Math.min(+m[1],n-1));
try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
