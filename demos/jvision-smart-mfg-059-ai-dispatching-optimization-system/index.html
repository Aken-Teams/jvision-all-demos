<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI派工優化系統｜Dispatching Optimization</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#7C3AED;
  --color-on-primary:#FFFFFF;
  --color-secondary:#6366F1;
  --color-on-secondary:#000000;
  --color-accent:#EC4899;
  --color-on-accent:#000000;
  --color-background:#FAF5FF;
  --color-foreground:#0F172A;
  --color-card:#FFFFFF;
  --color-card-foreground:#0F172A;
  --color-muted:#F7F3FD;
  --color-muted-foreground:#475569;
  --color-border:#EFE7FC;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#7C3AED;

  --blue:#7C3AED;
  --ink:#0F172A;
  --muted:#475569;
  --line:#EFE7FC;

  --accent:#7C3AED;
  --accent2:#6366F1;
  --accent-soft:#F1E8FF;
  --bg:#FAF5FF;
  --panel:#FFFFFF;
  --mut:#475569;
  --ok:#15803D;
  --warn:#B91C1C;
  --info:#4338CA;
  --shadow:0 10px 30px rgba(76,29,149,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  background:
    linear-gradient(90deg,rgba(124,58,237,.025) 1px,transparent 1px),
    linear-gradient(rgba(124,58,237,.025) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Fira Sans",sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button,input,select,textarea{font:inherit}
button,a{touch-action:manipulation}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
  border-radius:4px;
}
.material-symbols-outlined{
  font-variation-settings:"FILL" 0,"wght" 500,"GRAD" 0,"opsz" 24;
  vertical-align:middle;
}
.topbar{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--line);
  box-shadow:0 4px 20px rgba(76,29,149,.06);
  backdrop-filter:blur(14px);
}
.topwrap{
  width:min(100%,1440px);
  margin:auto;
  padding:10px 24px;
  display:flex;
  align-items:center;
  gap:20px;
}
.brand{
  min-width:230px;
  display:flex;
  align-items:center;
  gap:11px;
}
.brand .logo{
  width:40px;
  height:40px;
  flex:none;
  display:grid;
  place-items:center;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-radius:8px;
  box-shadow:4px 4px 0 #DDD6FE;
}
.brand .logo .material-symbols-outlined{font-size:23px}
.brand b{
  display:block;
  font-size:15px;
  font-weight:700;
  letter-spacing:.02em;
  white-space:nowrap;
}
.brand span:not(.material-symbols-outlined){
  display:block;
  margin-top:2px;
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:10px;
}
.tabs{
  min-width:0;
  flex:1;
  display:flex;
  align-items:center;
  gap:4px;
}
.tabs button{
  min-height:40px;
  padding:8px 10px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  white-space:nowrap;
  color:var(--muted);
  background:transparent;
  border:1px solid transparent;
  border-radius:6px;
  font-size:12px;
  font-weight:600;
  transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s ease;
}
.tabs button .material-symbols-outlined{font-size:18px}
.tabs button:hover{
  color:var(--color-primary);
  background:var(--color-muted);
  border-color:var(--line);
  transform:translateY(-1px);
}
.tabs button.active{
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-color:var(--color-primary);
  box-shadow:3px 3px 0 #DDD6FE;
}
.topmeta{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:11px;
  white-space:nowrap;
}
.dot{
  width:9px;
  height:9px;
  border:2px solid #BBF7D0;
  border-radius:50%;
  background:var(--ok);
}
main{
  width:min(100%,1440px);
  margin:auto;
  padding:26px 24px 64px;
}
.scr-head{
  margin-bottom:18px;
  padding:20px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  background:linear-gradient(120deg,#FFFFFF 0%,#F7F3FD 70%,#FCE7F3 100%);
  border:1px solid var(--line);
  border-left:5px solid var(--color-primary);
  box-shadow:var(--shadow);
  animation:reveal .35s ease-out both;
}
.scr-head h1{
  margin:0 0 5px;
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--ink);
  font-size:24px;
  line-height:1.2;
  font-weight:700;
  letter-spacing:-.02em;
}
.scr-head h1 .material-symbols-outlined{
  color:var(--color-primary);
  font-size:28px;
}
.scr-head p{
  max-width:760px;
  margin:0;
  color:var(--muted);
  font-size:13px;
  line-height:1.65;
}
.pill{
  min-height:30px;
  padding:5px 10px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:#5B21B6;
  background:#EDE9FE;
  border:1px solid #DDD6FE;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
.pill .material-symbols-outlined{font-size:16px}
.grid{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g32{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.card{
  min-width:0;
  padding:17px;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:8px;
  box-shadow:var(--shadow);
  animation:reveal .35s ease-out both;
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.card:hover{
  border-color:#D8B4FE;
  box-shadow:0 14px 34px rgba(76,29,149,.1);
  transform:translateY(-2px);
}
.card h3{
  margin:0 0 13px;
  display:flex;
  align-items:center;
  gap:8px;
  font-size:14px;
  line-height:1.4;
  font-weight:700;
}
.card h3 .material-symbols-outlined{
  color:var(--color-primary);
  font-size:19px;
}
.sub{color:var(--muted);font-size:12px;font-weight:500}
.kpi{
  min-height:130px;
  position:relative;
  overflow:hidden;
  border-top:3px solid var(--color-primary);
}
.kpi:after{
  content:"";
  position:absolute;
  right:-32px;
  bottom:-38px;
  width:100px;
  height:100px;
  border:16px solid #F3E8FF;
  border-radius:50%;
}
.kpi .lab{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--muted);
  font-size:12px;
  font-weight:600;
}
.kpi .val{
  margin-top:8px;
  font-family:"Fira Code",monospace;
  font-size:28px;
  line-height:1.15;
  font-weight:700;
  letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;
}
.kpi .val small{
  color:var(--muted);
  font-family:"Fira Sans",sans-serif;
  font-size:12px;
  font-weight:600;
}
.kpi .delta{
  margin-top:7px;
  display:inline-flex;
  align-items:center;
  gap:3px;
  font-size:11px;
  font-weight:700;
}
.kpi .delta.up{color:var(--ok)}
.kpi .delta.down{color:var(--warn)}
.kpi .ic{
  width:34px;
  height:34px;
  position:absolute;
  top:14px;
  right:14px;
  z-index:1;
  display:grid;
  place-items:center;
  color:var(--color-primary);
  background:#F3E8FF;
  border:1px solid #E9D5FF;
  border-radius:6px;
}
.kpi .ic .material-symbols-outlined{font-size:19px}
.tbl-wrap{
  width:100%;
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:6px;
}
table{
  width:100%;
  min-width:520px;
  border-collapse:collapse;
  font-size:12px;
}
th{
  padding:10px;
  color:#334155;
  background:var(--color-muted);
  border-bottom:1px solid #DDD6FE;
  text-align:left;
  white-space:nowrap;
  font-size:10px;
  font-weight:700;
  letter-spacing:.07em;
  text-transform:uppercase;
}
td{
  padding:10px;
  border-bottom:1px solid var(--line);
  vertical-align:middle;
}
td:nth-child(n+3){font-variant-numeric:tabular-nums}
th:nth-child(n+3),td:nth-child(n+3){text-align:right}
th:last-child,td:last-child{text-align:left}
tr:last-child td{border-bottom:0}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#FAF5FF}
.tag{
  min-height:24px;
  padding:3px 8px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:10px;
  line-height:1.2;
  font-weight:700;
  white-space:nowrap;
}
.tag:before{
  content:"";
  width:5px;
  height:5px;
  flex:none;
  border-radius:50%;
  background:currentColor;
}
.t-ok{color:#166534;background:#F0FDF4}
.t-warn{color:#991B1B;background:#FEF2F2}
.t-info{color:#3730A3;background:#EEF2FF}
.t-amber{color:#86198F;background:#FDF4FF}
.t-gray{color:#475569;background:#F8FAFC}
.mono{
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
  font-weight:600;
}
.bar{
  min-width:60px;
  height:7px;
  overflow:hidden;
  background:#EDE9FE;
  border-radius:2px;
}
.bar>i{
  height:100%;
  display:block;
  background:linear-gradient(90deg,var(--color-secondary),var(--color-primary));
  border-radius:2px;
}
.chart{width:100%;height:300px;min-width:0}
.gantt{overflow-x:auto}
.gantt-inner{min-width:760px}
.gantt-head{
  display:grid;
  grid-template-columns:120px repeat(10,1fr);
  background:var(--color-muted);
  border:1px solid var(--line);
  border-bottom-color:#DDD6FE;
}
.gantt-head div{
  padding:8px 4px;
  color:var(--muted);
  border-left:1px solid var(--line);
  text-align:center;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:700;
}
.gantt-head div:first-child{text-align:left;border-left:0}
.gantt-row{
  display:grid;
  grid-template-columns:120px 1fr;
  align-items:center;
  border:1px solid var(--line);
  border-top:0;
}
.gantt-row .mc{
  padding:8px 6px;
  display:flex;
  align-items:center;
  gap:6px;
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:700;
}
.gantt-row .mc .material-symbols-outlined{
  color:var(--color-primary);
  font-size:16px;
}
.track{
  height:36px;
  position:relative;
  background:repeating-linear-gradient(90deg,#FFFFFF 0,#FFFFFF calc(10% - 1px),#EDE9FE calc(10% - 1px),#EDE9FE 10%);
}
.blk{
  height:24px;
  padding:0 4px;
  position:absolute;
  top:6px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#FFFFFF;
  border:1px solid rgba(15,23,42,.15);
  border-radius:3px;
  box-shadow:2px 2px 0 rgba(15,23,42,.14);
  font-family:"Fira Code",monospace;
  font-size:9px;
  font-weight:700;
  white-space:nowrap;
}
.legend{
  margin-top:12px;
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  color:var(--muted);
  font-size:11px;
}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{
  width:11px;
  height:11px;
  display:inline-block;
  border:1px solid rgba(15,23,42,.2);
  border-radius:2px;
}
.wrow{
  margin-bottom:15px;
  display:flex;
  align-items:center;
  gap:12px;
}
.wrow .wl{width:70px;flex:none;font-size:12px;font-weight:700}
.wrow .wt{
  width:52px;
  flex:none;
  color:var(--color-primary);
  text-align:right;
  font-family:"Fira Code",monospace;
  font-size:13px;
  font-weight:700;
}
.wbar{
  min-width:0;
  height:9px;
  flex:1;
  overflow:hidden;
  background:#EDE9FE;
  border-radius:2px;
}
.wbar>i{height:100%;display:block}
.tl{position:relative;padding-left:27px}
.tl:before{
  content:"";
  width:1px;
  position:absolute;
  top:4px;
  bottom:4px;
  left:9px;
  background:#C4B5FD;
}
.tl-item{position:relative;padding-bottom:17px}
.tl-item:last-child{padding-bottom:0}
.tl-item .node{
  width:12px;
  height:12px;
  position:absolute;
  top:3px;
  left:-23px;
  border:3px solid #FFFFFF;
  border-radius:2px;
}
.tl-item .tm{
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:700;
}
.tl-item .tt{margin:3px 0;font-size:13px;font-weight:700}
.tl-item .td{color:var(--muted);font-size:12px;line-height:1.55}
.stat-row{display:flex;flex-wrap:wrap;gap:10px}
.stat-chip{
  min-width:120px;
  padding:11px 12px;
  flex:1;
  background:var(--color-muted);
  border:1px solid var(--line);
  border-radius:6px;
}
.stat-chip .l{color:var(--muted);font-size:10px;font-weight:600}
.stat-chip .v{
  margin-top:4px;
  font-family:"Fira Code",monospace;
  font-size:19px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.note{
  padding:11px 12px;
  display:flex;
  align-items:flex-start;
  gap:9px;
  color:#581C87;
  background:#FAE8FF;
  border:1px solid #F0ABFC;
  border-left:4px solid var(--color-accent);
  border-radius:4px;
  font-size:12px;
  line-height:1.55;
}
.note .material-symbols-outlined{
  flex:none;
  color:#A21CAF;
  font-size:18px;
}
.foot{
  margin-top:28px;
  padding-top:16px;
  color:var(--muted);
  border-top:1px solid var(--line);
  text-align:center;
  font-family:"Fira Code",monospace;
  font-size:10px;
}
@keyframes reveal{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}
@media(max-width:1180px){
  .topwrap{flex-wrap:wrap}
  .brand{min-width:auto}
  .tabs{order:3;width:100%;overflow-x:auto;padding-bottom:2px}
  .tabs button{flex:1}
}
@media(max-width:820px){
  .g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.g23,.g32{grid-template-columns:1fr}
  main{padding:20px 16px 50px}
  .topwrap{padding:9px 16px}
  .scr-head{align-items:flex-start;flex-direction:column}
}
@media(max-width:560px){
  body{background-size:24px 24px}
  .topmeta{display:none}
  .brand{width:100%}
  .tabs button{min-width:42px;padding:8px}
  .tabs button .lbl{display:none}
  .g4,.g3{grid-template-columns:1fr}
  .scr-head{padding:16px}
  .scr-head h1{font-size:20px}
  .pill{white-space:normal}
  .card{padding:14px}
  .kpi{min-height:116px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  .card,.scr-head{animation:none;transform:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topwrap">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">precision_manufacturing</span></div>
      <div><b>AI 派工優化系統</b><span>Dispatching Optimization · MES</span></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="系統功能"></nav>
    <div class="topmeta"><span class="dot"></span>優化引擎運行中 · 廠區 A</div>
  </div>
</header>
<main id="app"></main>
<script>
(function(){
"use strict";

var MODULES=[
  {icon:"dashboard",name:"現況總覽"},
  {icon:"tune",name:"優化引擎"},
  {icon:"recommend",name:"派工看板"},
  {icon:"compare_arrows",name:"策略模擬"},
  {icon:"bolt",name:"即時重派"},
  {icon:"insights",name:"效益回饋"}
];

var charts=[];
function disposeAll(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
function mk(id){var el=document.getElementById(id);if(!el)return null;var c=echarts.init(el);charts.push(c);return c;}

function s0(){
  var kpis=[
    {l:"待派工單",v:"48",u:"張",d:"今日新增 6",up:false,ic:"receipt_long"},
    {l:"可用機台",v:"22",u:"/26",d:"可用率 85%",up:true,ic:"conveyor_belt"},
    {l:"物料到位率",v:"91",u:"%",d:"+4%",up:true,ic:"inventory_2"},
    {l:"平均等待時間",v:"37",u:"分",d:"-12 分",up:true,ic:"timer"}
  ];
  var machines=[
    {n:"CNC-01",z:"加工一課",load:88,wo:5,st:"高負載",c:"t-warn"},
    {n:"CNC-04",z:"加工一課",load:72,wo:4,st:"正常",c:"t-ok"},
    {n:"LATHE-02",z:"車削課",load:64,wo:3,st:"正常",c:"t-ok"},
    {n:"MILL-07",z:"銑床課",load:95,wo:6,st:"瓶頸",c:"t-warn"},
    {n:"GRIND-03",z:"研磨課",load:41,wo:2,st:"低載",c:"t-info"},
    {n:"WELD-05",z:"焊接課",load:58,wo:3,st:"正常",c:"t-ok"}
  ];
  var mrows=machines.map(function(m){
    return '<tr><td class="mono">'+m.n+'</td><td class="sub">'+m.z+'</td>'+
      '<td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i style="width:'+m.load+'%"></i></div><span class="mono" style="width:38px">'+m.load+'%</span></div></td>'+
      '<td class="mono">'+m.wo+'</td><td><span class="tag '+m.c+'">'+m.st+'</span></td></tr>';
  }).join("");
  return ''+
  head("dashboard","現況數據總覽","彙整待派工單佇列、機台負載與物料到位狀態，作為優化引擎的即時輸入。","現況數據輸入")+
  '<div class="grid g4" style="margin-bottom:14px">'+kpis.map(kpiCard).join("")+'</div>'+
  '<div class="grid g23">'+
    '<div class="card"><h3><span class="material-symbols-outlined">conveyor_belt</span>機台負載現況</h3>'+
      '<div class="tbl-wrap"><table><thead><tr><th>機台</th><th>產線</th><th>負載率</th><th>在製</th><th>狀態</th></tr></thead><tbody>'+mrows+'</tbody></table></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>待派工單交期分布</h3><div id="c0a" class="chart" style="height:260px"></div></div>'+

}

function head(ic,t,d,stage){
  return '<div class="scr-head"><div><h1><span class="material-symbols-outlined">'+ic+"</span>"+t+"</h1><p>"+d+"</p></div>"+
    '<div class="pill"><span class="material-symbols-outlined">conversion_path</span>流程階段：'+stage+"</div></div>";
}
function kpiCard(k){
  return '<div class="card kpi"><div class="ic"><span class="material-symbols-outlined">'+k.ic+"</span></div>"+
    '<div class="lab">'+k.l+'</div><div class="val">'+k.v+" <small>"+k.u+"</small></div>"+
    '<div class="delta '+(k.up?"up":"down")+'"><span class="material-symbols-outlined" style="font-size:15px">'+(k.up?"trending_up":"priority_high")+"</span>"+k.d+"</div></div>";
}
function weightRow(l,c,v){
  return '<div class="wrow"><div class="wl">'+l+'</div><div class="wbar"><i style="width:'+v+"%;background:"+c+'"></i></div><div class="wt">'+v+"%</div></div>";
}
function metaTd(v,u){return '<td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i style="width:'+Math.min(v,100)+'%"></i></div><span class="mono" style="width:44px">'+v+u+"</span></div></td>";}
function fbRow(w,a,b,c,d){return '<tr><td class="mono">'+w+'</td><td class="mono">'+a+'</td><td class="mono">'+b+'</td><td class="mono">'+c+'</td><td><span class="tag t-ok">'+d+"</span></td></tr>";}

var RENDER=[s0,s1,s2,s3,s4,s5];
var CHARTS=[s0charts,s1charts,s2charts,s3charts,s4charts,s5charts];
var container=document.getElementById("app");
var tabsEl=document.getElementById("tabs");

tabsEl.innerHTML=MODULES.map(function(m,i){
  return '<button type="button" data-i="'+i+'" aria-label="'+m.name+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="lbl">'+m.name+"</span></button>";
}).join("");

function show(i){
  disposeAll();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    var active=+btns[b].getAttribute("data-i")===i;
    btns[b].classList.toggle("active",active);
    btns[b].setAttribute("aria-current",active?"page":"false");
  }
  container.innerHTML=RENDER[i]()+'<div class="foot">AI 派工優化系統 · 純前端展示原型 · 資料為模擬示意</div>';
  void container.offsetHeight;
  CHARTS[i]();
}
tabsEl.addEventListener("click",function(e){
  var t=e.target.closest("[data-i]");
  if(!t)return;
  try{location.hash="go="+t.getAttribute("data-i");}catch(err){show(+t.getAttribute("data-i"));}
});
window.addEventListener("resize",function(){
  for(var i=0;i<charts.length;i++){try{charts[i].resize();}catch(e){}}
});
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return;}
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0);}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
})();
</script>
