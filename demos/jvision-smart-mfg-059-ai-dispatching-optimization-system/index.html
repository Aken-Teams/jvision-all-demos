<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI派工優化系統｜Dispatching Optimization</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#b45309; --accent2:#f59e0b; --accent-soft:#fef3c7;
  --bg:#f8f7f4; --panel:#ffffff; --ink:#1c1917; --mut:#78716c; --line:#eee7de;
  --ok:#16a34a; --warn:#dc2626; --info:#2563eb;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",sans-serif; background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;vertical-align:middle;}
a{color:inherit;text-decoration:none;}

header.topbar{
  position:sticky;top:0;z-index:50;background:var(--panel);border-bottom:1px solid var(--line);
  box-shadow:0 1px 12px rgba(120,80,10,.05);
}
.topwrap{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand .logo{
  width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 4px 12px rgba(180,83,9,.28);
}
.brand .logo .material-symbols-outlined{font-size:22px;}
.brand b{font-size:15px;font-weight:800;letter-spacing:.3px;white-space:nowrap;}
.brand span{display:block;font-size:11px;color:var(--mut);font-weight:500;}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0;}
nav.tabs button{
  flex:none;white-space:nowrap;min-width:0;cursor:pointer;border:1px solid var(--line);
  background:#fff;color:var(--mut);border-radius:9px;padding:8px 12px;font-family:inherit;
  font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;transition:.15s;
}
nav.tabs button .material-symbols-outlined{font-size:18px;}
nav.tabs button:hover{border-color:var(--accent2);color:var(--accent);}
nav.tabs button.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;
  box-shadow:0 4px 12px rgba(180,83,9,.3);
}
.topmeta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);white-space:nowrap;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(22,163,74,.15);}

main{max-width:1360px;margin:0 auto;padding:22px 18px 60px;}
.scr-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
.scr-head h1{font-size:21px;margin:0 0 4px;font-weight:800;display:flex;align-items:center;gap:9px;}
.scr-head h1 .material-symbols-outlined{color:var(--accent);font-size:26px;}
.scr-head p{margin:0;color:var(--mut);font-size:13px;max-width:640px;}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);
  padding:5px 11px;border-radius:20px;font-size:12px;font-weight:700;}
.pill .material-symbols-outlined{font-size:16px;}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
.sub{font-size:12px;color:var(--mut);font-weight:500;}

.grid{display:grid;gap:14px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:1.6fr 1fr;}
.g32{grid-template-columns:1fr 1.6fr;}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
}

.kpi{position:relative;overflow:hidden;}
.kpi .lab{font-size:12.5px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:6px;}
.kpi .val{font-size:27px;font-weight:800;margin-top:6px;letter-spacing:.3px;}
.kpi .val small{font-size:13px;font-weight:600;color:var(--mut);}
.kpi .delta{font-size:12px;font-weight:700;margin-top:4px;display:inline-flex;align-items:center;gap:3px;}
.kpi .delta.up{color:var(--ok);}.kpi .delta.down{color:var(--warn);}
.kpi .ic{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);}
.kpi .ic .material-symbols-outlined{font-size:20px;}

.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
th{text-align:left;font-size:11.5px;letter-spacing:.4px;color:var(--mut);font-weight:700;padding:9px 10px;
  border-bottom:2px solid var(--line);white-space:nowrap;text-transform:uppercase;}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#fbfaf7;}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;}
.t-ok{background:#dcfce7;color:#15803d;}
.t-warn{background:#fee2e2;color:#b91c1c;}
.t-info{background:#dbeafe;color:#1d4ed8;}
.t-amber{background:var(--accent-soft);color:var(--accent);}
.t-gray{background:#f1f0ec;color:#57534e;}
.mono{font-family:"Inter";font-variant-numeric:tabular-nums;font-weight:600;}

.bar{height:7px;border-radius:6px;background:#f1efe9;overflow:hidden;min-width:60px;}
.bar > i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent2),var(--accent));}

.chart{width:100%;height:300px;min-width:0;}

.gantt{overflow-x:auto;}
.gantt-inner{min-width:760px;}
.gantt-head{display:grid;grid-template-columns:120px repeat(10,1fr);border-bottom:2px solid var(--line);}
.gantt-head div{font-size:11px;color:var(--mut);font-weight:700;padding:6px 4px;text-align:center;}
.gantt-head div:first-child{text-align:left;}
.gantt-row{display:grid;grid-template-columns:120px 1fr;align-items:center;border-bottom:1px solid var(--line);}
.gantt-row .mc{font-size:12.5px;font-weight:700;padding:8px 6px;display:flex;align-items:center;gap:6px;}
.gantt-row .mc .material-symbols-outlined{font-size:17px;color:var(--accent);}
.track{position:relative;height:34px;background:repeating-linear-gradient(90deg,#faf9f6 0,#faf9f6 calc(10% - 1px),#efece5 calc(10% - 1px),#efece5 10%);}
.blk{position:absolute;top:5px;height:24px;border-radius:6px;color:#fff;font-size:10.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;padding:0 4px;overflow:hidden;white-space:nowrap;
  box-shadow:0 2px 5px rgba(0,0,0,.12);cursor:default;}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--mut);}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}

.wrow{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.wrow .wl{width:70px;font-size:13px;font-weight:700;flex:none;}
.wrow .wt{width:52px;text-align:right;font-weight:800;font-size:14px;color:var(--accent);flex:none;}
.wbar{flex:1;height:9px;border-radius:6px;background:#f1efe9;overflow:hidden;min-width:0;}
.wbar>i{display:block;height:100%;}

.tl{position:relative;padding-left:26px;}
.tl:before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl-item{position:relative;padding:0 0 16px 0;}
.tl-item:last-child{padding-bottom:0;}
.tl-item .node{position:absolute;left:-22px;top:2px;width:14px;height:14px;border-radius:50%;border:3px solid #fff;background:var(--accent);}
.tl-item .tm{font-size:11.5px;color:var(--mut);font-weight:700;font-variant-numeric:tabular-nums;}
.tl-item .tt{font-size:13.5px;font-weight:700;margin:2px 0;}
.tl-item .td{font-size:12.5px;color:var(--mut);}

.stat-row{display:flex;gap:10px;flex-wrap:wrap;}
.stat-chip{flex:1;min-width:120px;background:#fbfaf7;border:1px solid var(--line);border-radius:11px;padding:11px 13px;}
.stat-chip .l{font-size:11.5px;color:var(--mut);font-weight:600;}
.stat-chip .v{font-size:19px;font-weight:800;margin-top:3px;}

.foot{margin-top:26px;text-align:center;color:var(--mut);font-size:11.5px;}
.note{background:var(--accent-soft);border-radius:11px;padding:11px 13px;font-size:12.5px;color:#92400e;
  display:flex;gap:9px;align-items:flex-start;}
.note .material-symbols-outlined{font-size:19px;flex:none;color:var(--accent);}

@media(max-width:560px){
  nav.tabs button .lbl{display:none;}
  nav.tabs button{padding:8px 10px;}
  .topmeta{display:none;}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topwrap">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">precision_manufacturing</span></div>
      <div><b>AI 派工優化系統</b><span>Dispatching Optimization · MES</span></div>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div class="topmeta"><span class="dot"></span>優化引擎運行中 · 廠區 A</div>
  </div>
</header>
<main id="app"></main>
<script>
(function(){
"use strict";

var MODULES=[
  {icon:"dashboard",name:"現況總覽"},
  {icon:"tune",name:"優化引擎"},
  {icon:"recommend",name:"派工看板"},
  {icon:"compare_arrows",name:"策略模擬"},
  {icon:"bolt",name:"即時重派"},
  {icon:"insights",name:"效益回饋"}
];

var charts=[];
function disposeAll(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
function mk(id){var el=document.getElementById(id);if(!el)return null;var c=echarts.init(el);charts.push(c);return c;}

/* ===== SCREEN 0 : 現況數據總覽 ===== */
function s0(){
  var kpis=[
    {l:"待派工單",v:"48",u:"張",d:"今日新增 6",up:false,ic:"receipt_long"},
    {l:"可用機台",v:"22",u:"/26",d:"可用率 85%",up:true,ic:"conveyor_belt"},
    {l:"物料到位率",v:"91",u:"%",d:"+4%",up:true,ic:"inventory_2"},
    {l:"平均等待時間",v:"37",u:"分",d:"-12 分",up:true,ic:"timer"}
  ];
  var machines=[
    {n:"CNC-01",z:"加工一課",load:88,wo:5,st:"高負載",c:"t-warn"},
    {n:"CNC-04",z:"加工一課",load:72,wo:4,st:"正常",c:"t-ok"},
    {n:"LATHE-02",z:"車削課",load:64,wo:3,st:"正常",c:"t-ok"},
    {n:"MILL-07",z:"銑床課",load:95,wo:6,st:"瓶頸",c:"t-warn"},
    {n:"GRIND-03",z:"研磨課",load:41,wo:2,st:"低載",c:"t-info"},
    {n:"WELD-05",z:"焊接課",load:58,wo:3,st:"正常",c:"t-ok"}
  ];
  var mrows=machines.map(function(m){
    return '<tr><td class="mono">'+m.n+'</td><td class="sub">'+m.z+'</td>'+
      '<td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i style="width:'+m.load+'%"></i></div><span class="mono" style="width:38px">'+m.load+'%</span></div></td>'+
      '<td class="mono">'+m.wo+'</td><td><span class="tag '+m.c+'">'+m.st+'</span></td></tr>';
  }).join("");
  return ''+
  head("dashboard","現況數據總覽","彙整待派工單佇列、機台負載與物料到位狀態，作為優化引擎的即時輸入。","現況數據輸入")+
  '<div class="grid g4" style="margin-bottom:14px">'+kpis.map(kpiCard).join("")+'</div>'+
  '<div class="grid g23">'+
    '<div class="card"><h3><span class="material-symbols-outlined">conveyor_belt</span>機台負載現況</h3>'+
      '<div class="tbl-wrap"><table><thead><tr><th>機台</th><th>產線</th><th>負載率</th><th>在製</th><th>狀態</th></tr></thead><tbody>'+mrows+'</tbody></table></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>待派工單交期分布</h3><div id="c0a" class="chart" style="height:260px"></div></div>'+
  '</div>'+
  '<div class="grid g2" style="margin-top:14px">'+
    '<div class="card"><h3><span class="material-symbols-outlined">inventory_2</span>物料到位追蹤</h3>'+
      '<div class="stat-row">'+
      '<div class="stat-chip"><div class="l">已齊料</div><div class="v" style="color:var(--ok)">31</div></div>'+
      '<div class="stat-chip"><div class="l">部分缺料</div><div class="v" style="color:var(--accent)">12</div></div>'+
      '<div class="stat-chip"><div class="l">待進料</div><div class="v" style="color:var(--warn)">5</div></div>'+
      '</div>'+
      '<div class="note" style="margin-top:12px"><span class="material-symbols-outlined">error</span>MILL-07 對應 3 張工單缺料，建議延後派工並優先補料。</div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">schedule</span>今日投入產能利用</h3><div id="c0b" class="chart" style="height:230px"></div></div>'+
  '</div>';
}
function s0charts(){
  var a=mk("c0a");
  if(a)a.setOption({tooltip:{trigger:'item'},legend:{bottom:0,textStyle:{fontSize:11}},
    series:[{type:'pie',radius:['46%','72%'],center:['50%','44%'],avoidLabelOverlap:true,
      itemStyle:{borderRadius:5,borderColor:'#fff',borderWidth:2},label:{show:false},
      data:[{value:8,name:'今日交期',itemStyle:{color:'#dc2626'}},{value:14,name:'2日內',itemStyle:{color:'#f59e0b'}},
        {value:15,name:'本週',itemStyle:{color:'#b45309'}},{value:11,name:'次週',itemStyle:{color:'#2563eb'}}]}]});
  var b=mk("c0b");
  if(b)b.setOption({tooltip:{trigger:'axis'},grid:{left:38,right:14,top:20,bottom:26},
    xAxis:{type:'category',data:['08','10','12','14','16','18'],axisLine:{lineStyle:{color:'#ddd'}},axisLabel:{color:'#78716c'}},
    yAxis:{type:'value',max:100,axisLabel:{formatter:'{value}%',color:'#78716c'},splitLine:{lineStyle:{color:'#f0ede7'}}},
    series:[{name:'利用率',type:'line',smooth:true,data:[62,74,81,88,84,79],areaStyle:{color:'rgba(245,158,11,.18)'},
      lineStyle:{color:'#b45309',width:3},itemStyle:{color:'#b45309'}}]});
}

/* ===== SCREEN 1 : 多目標優化引擎 ===== */
function s1(){
  return ''+
  head("tune","多目標優化引擎","調校交期、效率、成本三目標權重並執行求解，觀察目標函數收斂與帕累托前緣。","AI 派工模型運算")+
  '<div class="grid g32">'+
    '<div class="card"><h3><span class="material-symbols-outlined">tune</span>目標權重設定</h3>'+
      weightRow("交期達成","#dc2626",45)+
      weightRow("設備效率","#b45309",35)+
      weightRow("生產成本","#2563eb",20)+
      '<div class="note" style="margin-top:6px"><span class="material-symbols-outlined">psychology</span>目前配置偏重交期，引擎將優先安排急件工單，稍犧牲換模成本。</div>'+
      '<div class="stat-row" style="margin-top:14px">'+
      '<div class="stat-chip"><div class="l">求解迭代</div><div class="v">1,240</div></div>'+
      '<div class="stat-chip"><div class="l">收斂耗時</div><div class="v">2.4<small style="font-size:12px"> 秒</small></div></div>'+
      '<div class="stat-chip"><div class="l">候選解</div><div class="v">18</div></div>'+
      '</div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">trending_down</span>目標函數收斂曲線</h3><div id="c1a" class="chart" style="height:300px"></div></div>'+
  '</div>'+
  '<div class="grid g2" style="margin-top:14px">'+
    '<div class="card"><h3><span class="material-symbols-outlined">radar</span>三目標達成雷達</h3><div id="c1b" class="chart" style="height:290px"></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">scatter_plot</span>帕累托前緣（交期 vs 成本）</h3><div id="c1c" class="chart" style="height:290px"></div></div>'+
  '</div>';
}
function s1charts(){
  var a=mk("c1a");
  if(a){var it=[];for(var i=1;i<=20;i++)it.push(i);
    a.setOption({tooltip:{trigger:'axis'},legend:{top:0,textStyle:{fontSize:11}},grid:{left:44,right:16,top:34,bottom:28},
      xAxis:{type:'category',data:it,name:'迭代',axisLabel:{color:'#78716c'},axisLine:{lineStyle:{color:'#ddd'}}},
      yAxis:{type:'value',axisLabel:{color:'#78716c'},splitLine:{lineStyle:{color:'#f0ede7'}}},
      series:[
        {name:'總懲罰值',type:'line',smooth:true,data:[980,720,540,430,360,310,278,255,240,228,220,214,209,205,202,200,199,198,197,197],lineStyle:{color:'#b45309',width:3},itemStyle:{color:'#b45309'},showSymbol:false},
        {name:'交期違約',type:'line',smooth:true,data:[420,300,210,150,110,86,70,58,50,44,40,37,35,33,32,31,30,30,29,29],lineStyle:{color:'#dc2626',width:2},itemStyle:{color:'#dc2626'},showSymbol:false}
      ]});}
  var b=mk("c1b");
  if(b)b.setOption({tooltip:{},legend:{bottom:0,textStyle:{fontSize:11}},
    radar:{indicator:[{name:'交期達成',max:100},{name:'設備效率',max:100},{name:'成本控制',max:100},{name:'換模減少',max:100},{name:'負載均衡',max:100}],
      radius:'62%',splitLine:{lineStyle:{color:'#eee7de'}},axisName:{color:'#57534e',fontSize:11}},
    series:[{type:'radar',data:[
      {value:[95,88,72,70,84],name:'優化後',areaStyle:{color:'rgba(180,83,9,.22)'},lineStyle:{color:'#b45309'},itemStyle:{color:'#b45309'}},
      {value:[78,74,80,55,66],name:'規則式',areaStyle:{color:'rgba(37,99,235,.12)'},lineStyle:{color:'#2563eb'},itemStyle:{color:'#2563eb'}}
    ]}]});
  var c=mk("c1c");
  if(c)c.setOption({tooltip:{formatter:function(p){return '交期達成 '+p.value[0]+'%<br/>成本指數 '+p.value[1];}},grid:{left:44,right:18,top:20,bottom:36},
    xAxis:{name:'交期達成%',type:'value',min:60,max:100,axisLabel:{color:'#78716c'},splitLine:{lineStyle:{color:'#f0ede7'}}},
    yAxis:{name:'成本指數',type:'value',min:70,max:120,axisLabel:{color:'#78716c'},splitLine:{lineStyle:{color:'#f0ede7'}}},
    series:[
      {type:'scatter',symbolSize:14,data:[[95,112],[92,104],[88,98],[84,92],[80,88],[76,84],[72,82]],itemStyle:{color:'#f59e0b'}},
      {type:'line',smooth:true,data:[[95,112],[92,104],[88,98],[84,92],[80,88],[76,84],[72,82]],lineStyle:{color:'#b45309',type:'dashed'},showSymbol:false,tooltip:{show:false}},
      {type:'scatter',symbolSize:18,data:[[92,104]],itemStyle:{color:'#dc2626',borderColor:'#fff',borderWidth:2},label:{show:true,formatter:'採用解',position:'top',color:'#dc2626',fontWeight:700,fontSize:11}}
    ]});
}

/* ===== SCREEN 2 : 派工建議看板 (signature gantt) ===== */
function s2(){
  var machines=["CNC-01","CNC-04","MILL-07","LATHE-02","GRIND-03"];
  var colors={A:'#b45309',B:'#f59e0b',C:'#2563eb',D:'#16a34a',E:'#dc2626'};
  var plan=[

/* ===== helpers ===== */
function head(ic,t,d,stage){
  return '<div class="scr-head"><div><h1><span class="material-symbols-outlined">'+ic+'</span>'+t+'</h1><p>'+d+'</p></div>'+
    '<div class="pill"><span class="material-symbols-outlined">conversion_path</span>流程階段：'+stage+'</div></div>';
}
function kpiCard(k){
  return '<div class="card kpi"><div class="ic"><span class="material-symbols-outlined">'+k.ic+'</span></div>'+
    '<div class="lab">'+k.l+'</div><div class="val">'+k.v+' <small>'+k.u+'</small></div>'+
    '<div class="delta '+(k.up?'up':'down')+'"><span class="material-symbols-outlined" style="font-size:15px">trending_up</span>'+k.d+'</div></div>';
}
function weightRow(l,c,v){
  return '<div class="wrow"><div class="wl">'+l+'</div><div class="wbar"><i style="width:'+v+'%;background:'+c+'"></i></div><div class="wt">'+v+'%</div></div>';
}
function metaTd(v,u){return '<td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i style="width:'+Math.min(v,100)+'%"></i></div><span class="mono" style="width:44px">'+v+u+'</span></div></td>';}
function fbRow(w,a,b,c,d){return '<tr><td class="mono">'+w+'</td><td class="mono">'+a+'</td><td class="mono">'+b+'</td><td class="mono">'+c+'</td><td><span class="tag t-ok">'+d+'</span></td></tr>';}

/* ===== router ===== */
var RENDER=[s0,s1,s2,s3,s4,s5];
var CHARTS=[s0charts,s1charts,s2charts,s3charts,s4charts,s5charts];
var container=document.getElementById("app");

var tabsEl=document.getElementById("tabs");
tabsEl.innerHTML=MODULES.map(function(m,i){
  return '<button data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="lbl">'+m.name+'</span></button>';
}).join("");

function show(i){
  disposeAll();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("active",+btns[b].getAttribute("data-i")===i);}
  container.innerHTML=RENDER[i]()+'<div class="foot">AI 派工優化系統 · 純前端展示原型 · 資料為模擬示意</div>';
  void container.offsetHeight;
  CHARTS[i]();
}

tabsEl.addEventListener("click",function(e){
  var t=e.target.closest("[data-i]");if(!t)return;show(+t.getAttribute("data-i"));
  try{location.hash="go="+t.getAttribute("data-i");}catch(err){}
});
window.addEventListener("resize",function(){for(var i=0;i<charts.length;i++){try{charts[i].resize();}catch(e){}}});

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);
show(0);
fromHash();
})();
