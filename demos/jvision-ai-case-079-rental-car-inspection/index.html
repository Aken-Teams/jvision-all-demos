<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#0D1117"/>
<title>租車車況檢查台 · Rental Car Inspection Station</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Josefin+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --color-primary:#00FF41;
  --color-on-primary:#0F172A;
  --color-secondary:#008F11;
  --color-on-secondary:#000000;
  --color-accent:#FF3333;
  --color-on-accent:#000000;
  --color-background:#0D1117;
  --color-foreground:#E6EDF3;
  --color-card:#182424;
  --color-card-foreground:#E6EDF3;
  --color-muted:#25292F;
  --color-muted-foreground:#A8B3C5;
  --color-border:#30363D;
  --color-destructive:#EF4444;
  --color-on-destructive:#000000;
  --color-ring:#00FF41;
  --blue:#00FF41;
  --ink:#E6EDF3;
  --muted:#A8B3C5;
  --line:#30363D;
  --bg:#0D1117;
  --panel:#141D1D;
  --panel2:#182424;
  --ok:#39FF70;
  --warn:#FFC857;
  --bad:#FF5B5B;
  --info:#52C7FF;
  --shadow:0 18px 46px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html{color-scheme:dark;scroll-behavior:smooth}
body{
  margin:0;
  min-width:320px;
  font-family:"Josefin Sans","Noto Sans TC",system-ui,sans-serif;
  color:var(--ink);
  background:
    linear-gradient(rgba(0,255,65,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,65,.025) 1px,transparent 1px),
    radial-gradient(circle at 86% -8%,rgba(0,255,65,.1),transparent 30rem),
    var(--bg);
  background-size:32px 32px,32px 32px,auto,auto;
  line-height:1.5;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:2000;
  opacity:.12;
  background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.018) 3px 4px);
}
button{font:inherit}
button,.nav button{cursor:pointer}
.material-symbols-outlined{
  font-size:20px;
  line-height:1;
  vertical-align:middle;
  font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;
}
.top{
  position:sticky;
  top:0;
  z-index:1000;
  display:flex;
  align-items:center;
  gap:22px;
  min-height:68px;
  padding:10px clamp(14px,3vw,34px);
  background:rgba(13,17,23,.9);
  border-bottom:1px solid rgba(0,255,65,.28);
  box-shadow:0 12px 30px rgba(0,0,0,.25);
  backdrop-filter:blur(16px);
}
.top::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-1px;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--color-primary),transparent);
  animation:scan-x 5s linear infinite;
}
.brand{display:flex;align-items:center;gap:12px;flex:none;min-width:0}
.logo{
  position:relative;
  display:grid;
  place-items:center;
  width:42px;
  height:42px;
  flex:none;
  color:var(--color-primary);
  background:rgba(0,255,65,.06);
  border:1px solid rgba(0,255,65,.7);
  border-radius:4px;
  font-family:"Cinzel",serif;
  font-weight:700;
  box-shadow:inset 0 0 18px rgba(0,255,65,.08),0 0 16px rgba(0,255,65,.12);
}
.logo::before,.logo::after{
  content:"";
  position:absolute;
  width:7px;
  height:7px;
  border-color:var(--color-primary);
}
.logo::before{left:-4px;top:-4px;border-left:1px solid;border-top:1px solid}
.logo::after{right:-4px;bottom:-4px;border-right:1px solid;border-bottom:1px solid}
.brand b{
  display:block;
  color:var(--ink);
  font-size:15px;
  font-weight:700;
  line-height:1.2;
  letter-spacing:.08em;
}
.brand span{
  display:block;
  margin-top:3px;
  color:var(--color-primary);
  font-family:"Cinzel",serif;
  font-size:9px;
  letter-spacing:.15em;
}
.nav{
  display:flex;
  gap:5px;
  margin-left:auto;
  min-width:0;
  overflow-x:auto;
  scrollbar-width:thin;
  scrollbar-color:var(--color-secondary) transparent;
}
.nav button{
  position:relative;
  display:flex;
  align-items:center;
  gap:6px;
  flex:none;
  min-height:42px;
  padding:9px 11px;
  color:#B9C4D1;
  background:transparent;
  border:1px solid transparent;
  border-radius:3px;
  font-size:13px;
  font-weight:600;
  white-space:nowrap;
  transition:color .2s,background .2s,border-color .2s,box-shadow .2s,transform .2s;
}
.nav button:hover{
  color:var(--ink);
  background:rgba(0,255,65,.06);
  border-color:rgba(0,255,65,.24);
}
.nav button.on{
  color:var(--color-primary);
  background:rgba(0,255,65,.09);
  border-color:rgba(0,255,65,.5);
  box-shadow:inset 0 -2px var(--color-primary),0 0 16px rgba(0,255,65,.08);
}
.nav button:focus-visible,button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--color-ring);
  outline-offset:3px;
  box-shadow:0 0 0 5px rgba(0,255,65,.16);
}
.wrap{width:min(100%,1380px);margin:0 auto;padding:24px clamp(14px,2.5vw,30px) 42px}
.vh{
  position:relative;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;
  margin-bottom:18px;
  padding:4px 0 14px 17px;
  border-bottom:1px solid var(--line);
}
.vh::before{
  content:"";
  position:absolute;
  left:0;
  top:4px;
  bottom:14px;
  width:2px;
  background:var(--color-primary);
  box-shadow:0 0 12px var(--color-primary);
}
.vh h2{
  margin:0;
  color:var(--ink);
  font-size:clamp(21px,2vw,28px);
  font-weight:700;
  letter-spacing:.04em;
}
.vh h2::before{
  content:"SYS / ";
  color:var(--color-primary);
  font-family:"Cinzel",serif;
  font-size:.45em;
  letter-spacing:.14em;
  vertical-align:middle;
}
.vh p{margin:3px 0 0;color:var(--muted);font-size:13px}
.siren{
  display:flex;
  align-items:center;
  gap:8px;
  flex:none;
  min-height:34px;
  padding:6px 12px;
  color:#FFD2D2;
  background:rgba(255,51,51,.08);
  border:1px solid rgba(255,91,91,.42);
  border-radius:3px;
  font-size:12px;
  font-weight:700;
  letter-spacing:.02em;
}
.siren::before{content:"ALERT";color:var(--bad);font-family:"Cinzel",serif;font-size:9px;letter-spacing:.14em}
.siren i{
  width:8px;
  height:8px;
  flex:none;
  background:var(--bad);
  border-radius:50%;
  box-shadow:0 0 10px var(--bad);
  animation:blink 1.5s ease-in-out infinite;
}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:15px}
.kpi{
  position:relative;
  min-height:126px;
  padding:17px 17px 15px;
  overflow:hidden;
  background:linear-gradient(145deg,rgba(24,36,36,.96),rgba(17,26,27,.96));
  border:1px solid var(--line);
  border-radius:5px;
  box-shadow:var(--shadow);
  transition:border-color .2s,transform .2s,box-shadow .2s;
}
.kpi:hover{transform:translateY(-2px);border-color:rgba(0,255,65,.5);box-shadow:0 18px 40px rgba(0,0,0,.34),0 0 18px rgba(0,255,65,.06)}
.kpi::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(90deg,var(--color-primary) 0 24px,transparent 24px) top left/100% 1px no-repeat,
             linear-gradient(var(--color-primary) 0 18px,transparent 18px) top left/1px 100% no-repeat;
  opacity:.7;
}
.kpi::after{
  content:"";
  position:absolute;
  right:10px;
  bottom:9px;
  width:36px;
  height:3px;
  background:repeating-linear-gradient(90deg,var(--color-secondary) 0 4px,transparent 4px 7px);
}
.kpi .l{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.kpi .v{
  margin-top:4px;
  color:var(--ink);
  font-family:"Cinzel",serif;
  font-size:27px;
  font-weight:600;
  line-height:1.2;
  font-variant-numeric:tabular-nums;
}
.kpi .d{margin-top:6px;font-size:11px;font-weight:700}
.kpi .ic{position:absolute;right:14px;top:14px;color:var(--color-primary);opacity:.48;font-size:25px}
.up{color:var(--ok)}.down{color:var(--bad)}
.grid{display:grid;gap:15px}.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.35fr) minmax(310px,.9fr)}
.g11{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.6fr) minmax(310px,1fr)}
.card{
  position:relative;
  padding:16px;
  overflow:hidden;
  color:var(--color-card-foreground);
  background:linear-gradient(145deg,rgba(24,36,36,.97),rgba(18,27,28,.97));
  border:1px solid var(--line);
  border-radius:5px;
  box-shadow:var(--shadow);
}
.card::after{
  content:"";
  position:absolute;
  right:-1px;
  top:-1px;
  width:22px;
  height:22px;
  pointer-events:none;
  border-top:1px solid rgba(0,255,65,.65);
  border-right:1px solid rgba(0,255,65,.65);
}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin:0 0 13px;
  padding-bottom:10px;
  color:var(--ink);
  border-bottom:1px solid rgba(48,54,61,.88);
  font-size:13px;
  font-weight:700;
  letter-spacing:.03em;
}
.card h3 .material-symbols-outlined{color:var(--color-primary);filter:drop-shadow(0 0 5px rgba(0,255,65,.34))}
.tag{
  display:inline-flex;
  align-items:center;
  min-height:22px;
  padding:2px 8px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:10px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
}
.t-r{color:#FF9999;background:rgba(239,68,68,.12)}
.t-a{color:#FFD778;background:rgba(255,200,87,.1)}
.t-b{color:#8EDBFF;background:rgba(82,199,255,.1)}
.t-g{color:#72FF94;background:rgba(0,255,65,.09)}
.t-m{color:#C0CAD6;background:rgba(168,179,197,.08)}
.scroll{overflow-x:auto;border:1px solid rgba(48,54,61,.8);border-radius:3px}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{
  color:#C5CFDA;
  background:#111A1C;
  font-size:11px;
  font-weight:700;
  letter-spacing:.06em;
  white-space:nowrap;
}
table.data tr:last-child td{border-bottom:0}
table.data tbody tr{transition:background .2s}
table.data tr:hover td{background:rgba(0,255,65,.035)}
table.data td:nth-child(n+2).mono{text-align:right}
.chart{position:relative;height:230px}
.mono,.amt,.v,.brow span:last-child,table.data td:nth-child(2),table.data td:nth-child(3){
  font-family:"Josefin Sans",ui-monospace,SFMono-Regular,Consolas,monospace;
  font-variant-numeric:tabular-nums;
}
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.zc{
  position:relative;
  padding:12px;
  background:rgba(13,17,23,.42);
  border:1px solid var(--line);
  border-left:3px solid;
  border-radius:3px;
  transition:background .2s,border-color .2s,transform .2s;
}
.zc:hover{transform:translateY(-1px);background:rgba(0,255,65,.035)}
.zc.g{border-left-color:var(--ok)}.zc.a{border-left-color:var(--warn)}.zc.r{border-left-color:var(--bad)}
.zc b{display:block;font-size:13px}.zc small{display:block;margin-top:5px;color:var(--muted);font-size:11px}
.zc .stt{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;font-weight:700}
.dot{display:inline-block;width:8px;height:8px;border:2px solid currentColor;border-radius:50%}
.dot.g{color:var(--ok);background:var(--ok)}.dot.a{color:var(--warn);background:var(--warn)}
.dot.r{color:var(--bad);background:var(--bad);box-shadow:0 0 8px var(--bad);animation:blink 1.5s infinite}
.chk,.dlist,.est,.mlist,.bill{display:flex;flex-direction:column;gap:8px}
.ci,.dli,.ei,.mi{
  position:relative;
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:10px 11px;
  background:rgba(13,17,23,.38);
  border:1px solid var(--line);
  border-radius:3px;
}
.ci{border-left:3px solid}.ci.pass{border-left-color:var(--ok)}.ci.fail{border-left-color:var(--bad)}.ci.na{border-left-color:var(--muted)}
.ci .bx{
  display:grid;
  place-items:center;
  width:24px;
  height:24px;
  flex:none;
  color:#071008;
  border-radius:2px;
}
.ci b,.dli b,.ei b,.mi b{font-size:12.5px}
.ci small,.mi small{display:block;margin-top:2px;color:var(--muted);font-size:11px}
.ci .rt,.mi .rt{margin-left:auto;flex:none}
.carwrap{display:flex;justify-content:center;padding:8px 0 12px}
.carbody{position:relative;width:100%;max-width:310px;filter:drop-shadow(0 0 18px rgba(0,255,65,.08))}
.carbody svg{display:block;width:100%;height:auto}
.dmg{
  position:absolute;
  display:grid;
  place-items:center;
  width:25px;
  height:25px;
  color:#070B0C;
  border:2px solid #E6EDF3;
  border-radius:50%;
  font-family:"Josefin Sans",monospace;
  font-size:11px;
  font-weight:700;
  transform:translate(-50%,-50%);
  animation:pulse 1.8s infinite;
}
.dmg.sev{background:var(--bad)}.dmg.mid{background:var(--warn)}.dmg.low{background:var(--info)}
.dli{align-items:center;font-size:12px}
.dli .n{
  display:grid;
  place-items:center;
  width:21px;
  height:21px;
  flex:none;
  color:#071008;
  border:1px solid #E6EDF3;
  border-radius:50%;
  font-size:10px;
  font-weight:800;
}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:11px}
.hg{
  overflow:hidden;
  background:rgba(13,17,23,.42);
  border:1px solid var(--line);
  border-radius:3px;
  transition:transform .2s,border-color .2s;
}
.hg:hover{transform:translateY(-2px);border-color:rgba(0,255,65,.45)}
.hg .ph{
  position:relative;
  display:grid;
  place-items:center;
  height:112px;
  color:#fff;
  background-image:linear-gradient(135deg,rgba(0,0,0,.12),rgba(0,0,0,.5))!important;
}
.hg .ph::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(transparent 48%,rgba(255,255,255,.13) 50%,transparent 52%);
  background-size:100% 8px;
  opacity:.3;
}
.hg .ph .material-symbols-outlined{font-size:45px;opacity:.88}
.hg .ph .badge,.hg .ph .conf{
  position:absolute;
  z-index:1;
  padding:3px 7px;
  color:#fff;
  background:rgba(7,11,12,.8);
  border:1px solid rgba(255,255,255,.3);
  border-radius:2px;
  font-size:10px;
  font-weight:700;
}
.hg .ph .badge{left:8px;top:8px}.hg .ph .conf{right:8px;bottom:8px;color:#8CFFA7}
.hg .ph .box{position:absolute;z-index:2;border:2px solid var(--color-primary);box-shadow:0 0 10px rgba(0,255,65,.55)}
.hg .bd{padding:10px 12px}.hg b{display:block;font-size:12.5px}.hg small{display:block;margin-top:4px;color:var(--muted);font-size:11px}
.ei .ct{display:flex;align-items:center;justify-content:space-between;gap:9px}
.ei .amt{color:var(--color-primary)!important;font-size:15px;font-weight:700}
.ei .br{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-top:6px}
.ei .br span{color:var(--muted);font-size:11px}
.tl{position:relative;padding-left:23px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:1px;background:linear-gradient(var(--color-primary),var(--line))}
.ti{position:relative;padding:0 0 16px 5px}
.ti::before{
  content:"";
  position:absolute;
  left:-22px;
  top:3px;
  width:11px;
  height:11px;
  background:#0D1117;
  border:2px solid var(--color-primary);
  border-radius:50%;
  box-shadow:0 0 8px rgba(0,255,65,.5);
}
.ti .tt{font-size:12.5px;font-weight:700}.ti small{color:var(--muted);font-size:11px}
.pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:30px;
  padding:4px 9px;
  color:#C7D1DC;
  background:rgba(13,17,23,.42);
  border:1px solid var(--line);
  border-radius:3px;
  font-size:11px;
  font-weight:700;
}
.brow{
  display:flex;
  justify-content:space-between;
  gap:14px;
  padding:7px 2px;
  border-bottom:1px dashed var(--line);
  font-size:12.5px;
}
.brow span:last-child{text-align:right}
.brow.tot{margin-top:4px;padding-top:10px;border-top:2px solid var(--color-primary);border-bottom:0;font-size:15px;font-weight:800}
.brow .lab{color:var(--muted)}.brow.tot .lab{color:var(--ink)}
#map{width:100%;height:420px;border:1px solid var(--line);border-radius:3px;z-index:1;filter:saturate(.65) brightness(.8) contrast(1.12)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{color:var(--ink);background:#182424}
.leaflet-popup-content{font-family:"Josefin Sans",sans-serif;font-size:12px}
.mi{align-items:center}.mi .av{
  display:grid;
  place-items:center;
  width:31px;
  height:31px;
  flex:none;
  color:var(--color-primary);
  background:rgba(0,255,65,.08);
  border:1px solid rgba(0,255,65,.35);
  border-radius:3px;
}
.mi b{display:block}.legrow{display:flex;gap:13px;flex-wrap:wrap;margin-top:10px}
.legrow span{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px}
.legrow i{display:inline-block;width:10px;height:10px;border:2px solid currentColor;border-radius:50%}
.grid-item,.kpi,.card,.zc,.hg{animation:enter .42s both cubic-bezier(.2,.85,.25,1.25)}
.kpi:nth-child(2),.zc:nth-child(2),.hg:nth-child(2){animation-delay:.05s}
.kpi:nth-child(3),.zc:nth-child(3),.hg:nth-child(3){animation-delay:.1s}
.kpi:nth-child(4),.zc:nth-child(4),.hg:nth-child(4){animation-delay:.15s}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px rgba(230,237,243,.85)}50%{box-shadow:0 0 0 7px rgba(230,237,243,0)}}
@keyframes scan-x{from{transform:translateX(-70%)}to{transform:translateX(70%)}}
@media(max-width:1024px){
  .top{align-items:flex-start;flex-wrap:wrap;gap:8px 18px}
  .nav{width:100%;margin-left:0;padding-bottom:2px}
  .g2,.g21{grid-template-columns:minmax(0,1.2fr) minmax(290px,.8fr)}
}
@media(max-width:768px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.g11,.g21{grid-template-columns:1fr}
  .vh{align-items:flex-start;flex-direction:column}
  .siren{align-self:stretch}
  #map{height:360px}
}
@media(max-width:480px){
  .wrap{padding:18px 12px 32px}
  .top{padding:9px 12px}
  .brand b{font-size:14px}
  .nav button{min-width:43px;justify-content:center;padding:9px}
  .nav button span:not(.material-symbols-outlined){display:none}
  .kpis{grid-template-columns:1fr}
  .kpi{min-height:110px}
  .card{padding:13px}
  .hgrid{grid-template-columns:1fr}
  #map{height:320px;min-width:330px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}

  <div class="tl">${STL.map(t=>`<div class="ti"><div class="tt">${t[0]}</div><small>${t[1]}</small></div>`).join("")}</div>
  <h3 style="margin-top:6px"><span class="material-symbols-outlined" aria-hidden="true">pie_chart</span>本月結案方式</h3>
  <div class="chart" id="c_st" style="height:170px"><canvas id="cv_st"></canvas></div>
 </div>
</div>`
];

let charts={};
function destroyCharts(){
  Object.keys(charts).forEach(k=>{try{charts[k].destroy()}catch(e){}});
  charts={};
}
const gridClr="rgba(168,179,197,.16)";
const tickClr="#A8B3C5";
const labelClr="#D5DEE8";
const chartFont={family:"Josefin Sans",size:11};
const chartLegend={color:labelClr,boxWidth:12,font:chartFont};

function draw(i){
  if(i===0){
    const e=document.getElementById("cv_tr");
    if(e&&window.Chart)charts.tr=new Chart(e,{
      type:"bar",
      data:{
        labels:["第1週","第2週","第3週","第4週","第5週","第6週"],
        datasets:[
          {type:"bar",label:"損傷件數",data:[9,11,8,10,7,6],backgroundColor:"rgba(0,255,65,.68)",borderColor:"#00FF41",borderWidth:1,borderRadius:2,yAxisID:"y"},
          {type:"line",label:"損賠金額(萬)",data:[7.2,8.5,6.8,9.1,8.0,10.9],borderColor:"#FFC857",backgroundColor:"#FFC857",pointBackgroundColor:"#0D1117",pointBorderColor:"#FFC857",pointRadius:3,tension:.35,yAxisID:"y1"}
        ]
      },
      options:{
        maintainAspectRatio:false,responsive:true,
        plugins:{legend:{labels:chartLegend}},
        scales:{
          y:{grid:{color:gridClr},ticks:{color:tickClr,font:{size:10}}},
          y1:{position:"right",grid:{display:false},ticks:{color:tickClr,font:{size:10}}},
          x:{grid:{display:false},ticks:{color:tickClr,font:{size:10}}}
        }
      }
    });
  }
  if(i===2){
    const e=document.getElementById("cv_dt");
    if(e&&window.Chart)charts.dt=new Chart(e,{
      type:"doughnut",
      data:{labels:["刮傷","凹陷","破漆","玻璃","內裝"],datasets:[{data:[38,24,18,11,9],backgroundColor:["#00FF41","#52C7FF","#FFC857","#FF5B5B","#738091"],borderWidth:2,borderColor:"#182424"}]},
      options:{maintainAspectRatio:false,responsive:true,cutout:"60%",plugins:{legend:{position:"right",labels:chartLegend}}}
    });
  }
  if(i===3){
    const e=document.getElementById("cv_es");
    if(e&&window.Chart)charts.es=new Chart(e,{
      type:"bar",
      data:{labels:["保桿","車門","葉子板","引擎蓋","後視鏡","玻璃"],datasets:[{label:"平均維修成本",data:[6800,3400,2900,1600,1200,4500],backgroundColor:"rgba(0,255,65,.68)",borderColor:"#00FF41",borderWidth:1,borderRadius:2}]},
      options:{
        indexAxis:"y",maintainAspectRatio:false,responsive:true,
        plugins:{legend:{display:false}},
        scales:{
          x:{grid:{color:gridClr},ticks:{color:tickClr,font:{size:10}}},
          y:{grid:{display:false},ticks:{color:tickClr,font:{size:11}}}
        }
      }
    });
  }
  if(i===5){
    const e=document.getElementById("cv_st");
    if(e&&window.Chart)charts.st=new Chart(e,{
      type:"pie",
      data:{labels:["押金扣抵","保險理賠","客戶自付","爭議協商"],datasets:[{data:[42,31,19,8],backgroundColor:["#00FF41","#52C7FF","#FFC857","#FF5B5B"],borderWidth:2,borderColor:"#182424"}]},
      options:{maintainAspectRatio:false,responsive:true,plugins:{legend:{position:"right",labels:chartLegend}}}
    });
  }
}

let map=null;
function initMap(){
  const el=document.getElementById("map");
  if(!el||map||!window.L)return;
  map=L.map("map",{scrollWheelZoom:false}).setView([23.9,120.9],7);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{
    attribution:"&copy; OpenStreetMap &copy; CARTO",
    maxZoom:19
  }).addTo(map);
  MAPPTS.forEach(p=>{
    const col=p[3]==="r"?"#FF5B5B":p[3]==="a"?"#FFC857":"#39FF70";
    const label=p[3]==="r"?"進廠維修多":p[3]==="a"?"待驗車輛":"車況正常";
    const mk=L.circleMarker([p[1],p[2]],{
      radius:9,color:"#E6EDF3",weight:2,fillColor:col,fillOpacity:.92
    }).addTo(map);
    mk.bindPopup("<b>"+p[0]+"</b><br>"+label+"<br>"+p[4]);
  });
  requestAnimationFrame(()=>{if(map)map.invalidateSize()});
}
function destroyMap(){
  if(map){try{map.remove()}catch(e){}map=null}
}
function show(i){
  nav.querySelectorAll("button").forEach(b=>{
    const active=+b.dataset.i===i;
    b.classList.toggle("on",active);
    b.setAttribute("aria-current",active?"page":"false");
  });
  vt.textContent=MOD[i][2];
  vd.textContent=MOD[i][3];
  alertEl.textContent=MOD[i][4];
  destroyCharts();
  destroyMap();
  view.innerHTML=SCREENS[i]();
  void view.offsetHeight;
  draw(i);
  if(i===4)initMap();
}
function fromHash(){
  const m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  const n=document.querySelectorAll("[data-i]").length||6;
  show(m?Math.min(+m[1],n-1):0);
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
</body>
</html>
