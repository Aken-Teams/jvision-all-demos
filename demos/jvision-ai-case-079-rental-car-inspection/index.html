<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>租車車況檢查台 · Rental Car Inspection Station</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--accent:#0d9488;--accent2:#2dd4bf;--ink:#0f172a;--bg:#f1f5f9;--panel:#ffffff;--panel2:#f8fafc;--line:#e2e8f0;--mut:#64748b;--ok:#16a34a;--warn:#f59e0b;--bad:#dc2626;--info:#0891b2}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.top{background:linear-gradient(90deg,#0f766e,#0d9488);color:#fff;display:flex;align-items:center;gap:16px;padding:10px 20px;position:sticky;top:0;z-index:1000;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0;flex:none}
.logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-weight:900;color:#fff;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.brand b{font-size:15px;font-weight:800;display:block;font-family:"Noto Sans TC";line-height:1.2}
.brand span{font-size:10px;color:var(--accent2);letter-spacing:2px}
.nav{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap;min-width:0}
.nav button{border:0;background:rgba(255,255,255,.08);color:rgba(255,255,255,.85);font:inherit;font-weight:600;font-size:13px;padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:rgba(255,255,255,.2);color:#fff}
.nav button.on{background:#fff;color:var(--accent)}
.wrap{max-width:1300px;margin:0 auto;padding:20px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:20px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.siren{background:rgba(13,148,136,.1);color:#0f766e;border:1px solid rgba(13,148,136,.35);padding:6px 13px;border-radius:8px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:7px}
.siren i{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;animation:bl 1.2s infinite}
@keyframes bl{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(13,148,136,.5)}50%{opacity:.45;box-shadow:0 0 0 6px rgba(13,148,136,0)}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 15px;position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.kpi .l{font-size:11.5px;color:var(--mut);font-weight:600}
.kpi .v{font-size:24px;font-weight:800;margin-top:3px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.28}
.up{color:var(--ok)}.down{color:var(--bad)}
.grid{display:grid;gap:15px}.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .9fr}
.g11{grid-template-columns:1fr 1fr}
.g21{grid-template-columns:1.6fr 1fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.card h3{margin:0 0 12px;font-size:13.5px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap;color:var(--ink);font-weight:800}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;white-space:nowrap}
.t-r{background:rgba(220,38,38,.12);color:#b91c1c}.t-a{background:rgba(245,158,11,.16);color:#b45309}.t-b{background:rgba(8,145,178,.14);color:#0e7490}.t-g{background:rgba(22,163,74,.14);color:#15803d}.t-m{background:#f1f5f9;color:var(--mut)}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:var(--panel2)}
table.data tr:hover td{background:var(--panel2)}
.chart{position:relative;height:230px}
.scroll{overflow-x:auto}
.mono{font-family:Inter;font-weight:700}
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}
.zc{border-radius:12px;padding:13px;border:1px solid var(--line);background:var(--panel2)}
.zc.g{border-left:4px solid var(--ok)}.zc.a{border-left:4px solid var(--warn)}.zc.r{border-left:4px solid var(--bad)}
.zc b{font-family:"Noto Sans TC";font-size:14px;display:block}
.zc .stt{font-size:11px;font-weight:800;margin-top:6px;display:flex;align-items:center;gap:5px}
.zc small{color:var(--mut);font-size:11px;display:block;margin-top:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.g{background:var(--ok)}.dot.a{background:var(--warn)}.dot.r{background:var(--bad);animation:bl 1.2s infinite}
.chk{display:flex;flex-direction:column;gap:8px}
.ci{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--panel2);border-left:3px solid var(--line)}
.ci.pass{border-color:var(--ok)}.ci.fail{border-color:var(--bad)}.ci.na{border-color:var(--mut)}
.ci .bx{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;flex:none;color:#fff}
.ci b{font-size:12.5px;font-family:"Noto Sans TC"}
.ci small{display:block;color:var(--mut);font-size:11px;margin-top:1px}
.ci .rt{margin-left:auto;flex:none}
.carwrap{display:flex;justify-content:center;padding:6px 0}
.carbody{position:relative;width:100%;max-width:300px}
.carbody svg{width:100%;height:auto;display:block}
.dmg{position:absolute;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;font-family:Inter;box-shadow:0 0 0 3px rgba(255,255,255,.9);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(255,255,255,.9)}50%{box-shadow:0 0 0 5px rgba(255,255,255,.55)}}
.dmg.sev{background:var(--bad)}.dmg.mid{background:var(--warn)}.dmg.low{background:var(--info)}
.dlist{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.dli{display:flex;gap:9px;align-items:center;padding:8px 10px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-size:12px}
.dli .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;flex:none}
.dli b{font-family:"Noto Sans TC"}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:13px}
.hg{background:var(--panel2);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.hg .ph{height:110px;display:grid;place-items:center;color:#fff;position:relative}
.hg .ph .material-symbols-outlined{font-size:44px;opacity:.9}
.hg .ph .badge{position:absolute;left:8px;top:8px;font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;background:rgba(0,0,0,.42);color:#fff}
.hg .ph .box{position:absolute;border:2px dashed #fff;border-radius:4px}
.hg .ph .conf{position:absolute;right:8px;bottom:8px;font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px;background:rgba(0,0,0,.5);color:#5eead4}
.hg .bd{padding:11px 13px}
.hg b{font-family:"Noto Sans TC";font-size:12.5px;display:block}
.hg small{color:var(--mut);font-size:11px;display:block;margin-top:4px}
.est{display:flex;flex-direction:column;gap:9px}
.ei{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:var(--panel2)}
.ei .ct{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ei b{font-family:"Noto Sans TC";font-size:12.5px}
.ei .amt{font-family:Inter;font-weight:900;font-size:15px}
.ei .br{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;align-items:center}
.ei .br span{font-size:11px;color:var(--mut)}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.ti{position:relative;padding:0 0 15px 4px}
.ti::before{content:"";position:absolute;left:-20px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid var(--panel)}
.ti .tt{font-size:12.5px;font-family:"Noto Sans TC";font-weight:700}
.ti small{color:var(--mut);font-size:11px}
.pill{display:inline-flex;gap:5px;align-items:center;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:var(--mut)}
.bill{display:flex;flex-direction:column;gap:7px}
.brow{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 2px;border-bottom:1px dashed var(--line)}
.brow.tot{border-bottom:0;border-top:2px solid var(--line);margin-top:4px;padding-top:9px;font-weight:900;font-size:15px}
.brow .lab{color:var(--mut)}
.brow.tot .lab{color:var(--ink)}
#map{height:420px;width:100%;border-radius:12px;z-index:1}
.leaflet-popup-content{font-family:"Noto Sans TC",Inter;font-size:12px}
.mlist{display:flex;flex-direction:column;gap:8px}
.mi{display:flex;gap:10px;align-items:center;padding:9px 11px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.mi .av{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:13px;color:#fff;flex:none}
.mi b{font-size:12.5px;font-family:"Noto Sans TC";display:block}
.mi small{color:var(--mut);font-size:11px}
.mi .rt{margin-left:auto;text-align:right;flex:none}
.legrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
.legrow span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mut)}
.legrow i{width:11px;height:11px;border-radius:50%;display:inline-block}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g11,.g21{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:14px}.nav button span:not(.material-symbols-outlined){display:none}.nav button{padding:9px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo">車</div><div><b>租車車況檢查台</b><span>RENTAL CAR INSPECTION</span></div></div>
  <nav class="nav" id="nav"></nav>
</header>
<main class="wrap">
  <div class="vh"><div><h2 id="vt"></h2><p id="vd"></p></div><div class="siren"><i></i><span id="alert"></span></div></div>
  <div id="view"></div>
</main>
<script>
const MOD=[
["檢查總覽","dashboard","檢查總覽","門市檢查量、爭議件與待估價金額全局視圖","本日 3 件損傷待估價"],
["取還車檢查","checklist_rtl","取還車檢查","車體 360° 損傷標記與交還車檢核表","AB-1234 還車新增 3 處損傷"],
["損傷辨識","image_search","損傷辨識","取還車照片比對與 AI 損傷分類定損","AI 定損 6 件待人工複核"],
["維修估價","request_quote","維修估價","鈑金烤漆工料明細與維修報價核准","2 張報價單待店長核准"],
["車隊車況","directions_car","車隊車況","各門市據點分布與車輛可租狀態地圖","5 台進廠維修 · 2 台待驗"],
["費用結算","receipt_long","費用結算","損賠計費、押金扣抵與爭議處理","1 筆損賠爭議協商中"]];

const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd'),alertEl=document.getElementById('alert');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span><span>'+m[0]+'</span>';b.onclick=()=>show(i);nav.appendChild(b);});

const STORES=[["台北信義門市","g","可租 18 · 進廠 2"],["桃園機場門市","a","可租 9 · 待驗 3"],["台中七期門市","g","可租 14 · 進廠 1"],["台南安平門市","a","可租 6 · 待驗 2"],["高雄左營門市","r","可租 4 · 進廠 5"],["新竹科學園門市","g","可租 11 · 進廠 0"]];
const TODAY=[["09:10","取車","AB-1234 Aurion Altis","台北信義 · 王小明","已建檔","t-g"],["10:25","還車","BC-5678 Nordis Kicks","桃園機場 · 李佳玲","發現損傷","t-r"],["11:40","取車","CD-9012 Haruna CR-V","台中七期 · 陳建宏","已建檔","t-g"],["13:05","還車","DE-3456 Mazda3","台南安平 · 林郁婷","估價中","t-a"],["14:30","還車","EF-7890 Aurion RAV4","高雄左營 · 黃志豪","爭議協商","t-a"]];

const CHK=[["外觀車身鈑件","右後保桿新增刮痕 12cm","fail","不符"],["輪胎與鋼圈","四輪胎紋正常、無損傷","pass","符合"],["車內座椅與內裝","駕駛座椅套有污漬","fail","不符"],["燈具與後視鏡","全數作動正常","pass","符合"],["里程與油量","還車 24,860 km · 油量 3/4","pass","符合"],["隨車配件","三角警示牌、備胎齊全","pass","符合"]];
const DMG=[["1","sev","右後保桿","撞擊凹陷 · 破漆",72,68],["2","mid","左前車門","刮痕 12cm",26,48],["3","low","引擎蓋","輕微刮痕",50,20]];

const PHOTOS=[
["#dc2626","新增損傷","右後保桿凹陷",96,"還車 vs 取車比對 · 撞擊凹陷","sev",{l:52,t:52,w:30,h:24}],
["#f59e0b","新增損傷","左前車門刮痕",88,"AI 框選線性刮痕 12cm","mid",{l:18,t:38,w:38,h:14}],
["#0891b2","新增損傷","引擎蓋輕刮",72,"信心偏低 · 建議人工複核","low",{l:34,t:26,w:28,h:16}],
["#16a34a","既有損傷","左後葉子板",99,"取車已建檔 · 不列入損賠","ok",null]];

const EST=[["ES-24081","右後保桿 · 鈑金+烤漆",6800,"BC-5678 Nordis Kicks","嚴重","t-r","待核准"],["ES-24082","左前車門 · 局部烤漆",3200,"BC-5678 Nordis Kicks","中度","t-a","待核准"],["ES-24080","引擎蓋 · 拋光美容",900,"BC-5678 Nordis Kicks","輕微","t-b","已核准"]];
const ESITEM=[["工資 · 鈑金整平",2200],["材料 · 原廠烤漆",1800],["工資 · 烤漆施工",1600],["零件 · 保桿扣具",600],["美容 · 拋光除刮",600]];

const MAPPTS=[["台北信義門市",25.033,121.565,"g","可租 18 · 進廠 2"],["桃園機場門市",25.079,121.234,"a","可租 9 · 待驗 3"],["新竹科學園門市",24.774,121.017,"g","可租 11 · 進廠 0"],["台中七期門市",24.152,120.643,"g","可租 14 · 進廠 1"],["台南安平門市",22.998,120.160,"a","可租 6 · 待驗 2"],["高雄左營門市",22.679,120.307,"r","可租 4 · 進廠 5"]];
const FLEET=[["AB-1234","Aurion Altis","可租","t-g","台北信義"],["BC-5678","Nordis Kicks","待驗","t-a","桃園機場"],["EF-7890","Aurion RAV4","進廠維修","t-r","高雄左營"],["CD-9012","Haruna CR-V","可租","t-g","台中七期"],["GH-2468","Mazda CX-5","進廠維修","t-r","高雄左營"]];

const BILL=[["維修估價 · 右後保桿",6800],["維修估價 · 左前車門",3200],["行政處理費",800],["保險理賠折抵",-4500]];
const STL=[["11:20 還車定損完成","BC-5678 檢出 3 處新增損傷，AI 定損信心 88%"],["11:35 產生維修報價","鈑烤工料合計 NT$10,800，行政費 800"],["13:10 保險理賠核定","乙式車體險理賠 NT$4,500 折抵"],["13:40 損賠通知客戶","自負額 NT$6,300，客戶對保桿金額有異議"],["待辦 · 爭議協商","提供取還車比對照片與維修廠估價單佐證"]];

function dmgColor(s){return s=='sev'?'var(--bad)':s=='mid'?'var(--warn)':s=='low'?'var(--info)':'var(--ok)';}
function nt(n){return 'NT$'+Number(n||0).toLocaleString();}

const SCREENS=[
()=>`<div class="kpis">
 <div class="kpi"><span class="material-symbols-outlined ic">fact_check</span><div class="l">本日取還車檢查</div><div class="v">42<small style="font-size:12px"> 件</small></div><div class="d up">▲ 較昨 36 件</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">report</span><div class="l">檢出新增損傷</div><div class="v" style="color:var(--bad)">7</div><div class="d" style="color:var(--mut)">3 嚴重 · 2 中 · 2 輕</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">request_quote</span><div class="l">待估價金額</div><div class="v">10.9<small style="font-size:12px"> 萬</small></div><div class="d" style="color:var(--mut)">6 張報價單</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">verified</span><div class="l">AI 定損採用率</div><div class="v">91<small style="font-size:12px">%</small></div><div class="d up">▲ 較 74%</div></div>
</div>
<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">grid_view</span>各門市車況看板</h3><div class="zones">${STORES.map(z=>`<div class="zc ${z[1]}"><b>${z[0]}</b><div class="stt"><span class="dot ${z[1]}"></span>${z[1]=='r'?'需調度':z[1]=='a'?'注意':'正常'}</div><small>${z[2]}</small></div>`).join('')}</div><h3 style="margin-top:16px"><span class="material-symbols-outlined">show_chart</span>近 6 週損傷件數與損賠金額</h3><div class="chart" id="c_tr" style="height:210px"><canvas id="cv_tr"></canvas></div></div>
 <div class="card"><h3><span class="material-symbols-outlined">event_available</span>今日取還車紀錄</h3><div class="scroll"><table class="data"><tr><th>時間</th><th>類型</th><th>車輛</th><th>狀態</th></tr>${TODAY.map(t=>`<tr><td class="mono">${t[0]}</td><td><span class="tag ${t[1]=='取車'?'t-b':'t-m'}">${t[1]}</span></td><td><b style="font-family:Noto Sans TC">${t[2]}</b><br><small style="color:var(--mut)">${t[3]}</small></td><td><span class="tag ${t[5]}">${t[4]}</span></td></tr>`).join('')}</table></div></div>

let charts={};
function destroyCharts(){Object.keys(charts).forEach(k=>{try{charts[k].destroy();}catch(e){}});charts={};}
const gridClr='#e2e8f0',tickClr='#64748b';
function draw(i){
 if(i==0){var e=document.getElementById('cv_tr');if(e&&window.Chart){charts.tr=new Chart(e,{type:'bar',data:{labels:['第1週','第2週','第3週','第4週','第5週','第6週'],datasets:[{type:'bar',label:'損傷件數',data:[9,11,8,10,7,6],backgroundColor:'#0d9488',borderRadius:4,yAxisID:'y'},{type:'line',label:'損賠金額(萬)',data:[7.2,8.5,6.8,9.1,8.0,10.9],borderColor:'#f59e0b',backgroundColor:'#f59e0b',tension:.35,yAxisID:'y1'}]},options:{maintainAspectRatio:false,responsive:true,plugins:{legend:{labels:{boxWidth:12,font:{size:11}}}},scales:{y:{grid:{color:gridClr},ticks:{color:tickClr,font:{size:10}}},y1:{position:'right',grid:{display:false},ticks:{color:tickClr,font:{size:10}}},x:{grid:{display:false},ticks:{color:tickClr,font:{size:10}}}}}});}}
 if(i==2){var e2=document.getElementById('cv_dt');if(e2&&window.Chart){charts.dt=new Chart(e2,{type:'doughnut',data:{labels:['刮傷','凹陷','破漆','玻璃','內裝'],datasets:[{data:[38,24,18,11,9],backgroundColor:['#0d9488','#2dd4bf','#f59e0b','#0891b2','#94a3b8'],borderWidth:2,borderColor:'#fff'}]},options:{maintainAspectRatio:false,responsive:true,cutout:'58%',plugins:{legend:{position:'right',labels:{boxWidth:12,font:{size:11}}}}}});}}
 if(i==3){var e3=document.getElementById('cv_es');if(e3&&window.Chart){charts.es=new Chart(e3,{type:'bar',data:{labels:['保桿','車門','葉子板','引擎蓋','後視鏡','玻璃'],datasets:[{label:'平均維修成本',data:[6800,3400,2900,1600,1200,4500],backgroundColor:'#0d9488',borderRadius:4}]},options:{indexAxis:'y',maintainAspectRatio:false,responsive:true,plugins:{legend:{display:false}},scales:{x:{grid:{color:gridClr},ticks:{color:tickClr,font:{size:10}}},y:{grid:{display:false},ticks:{color:tickClr,font:{size:11}}}}}});}}
 if(i==5){var e5=document.getElementById('cv_st');if(e5&&window.Chart){charts.st=new Chart(e5,{type:'pie',data:{labels:['押金扣抵','保險理賠','客戶自付','爭議協商'],datasets:[{data:[42,31,19,8],backgroundColor:['#0d9488','#2dd4bf','#f59e0b','#dc2626'],borderWidth:2,borderColor:'#fff'}]},options:{maintainAspectRatio:false,responsive:true,plugins:{legend:{position:'right',labels:{boxWidth:12,font:{size:11}}}}}});}}
}

let map=null;
function initMap(){
 var el=document.getElementById('map');if(!el||map||!window.L)return;
 map=L.map('map',{scrollWheelZoom:false}).setView([23.9,120.9],7);
 L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap &copy; CARTO',maxZoom:19}).addTo(map);
 MAPPTS.forEach(function(p){
  var col=p[3]=='r'?'#dc2626':p[3]=='a'?'#f59e0b':'#16a34a';
  var mk=L.circleMarker([p[1],p[2]],{radius:9,color:'#fff',weight:2,fillColor:col,fillOpacity:.9}).addTo(map);
  mk.bindPopup('<b>'+p[0]+'</b><br>'+p[4]);
 });
 requestAnimationFrame(function(){if(map)map.invalidateSize();});
}
function destroyMap(){if(map){try{map.remove();}catch(e){}map=null;}}

function show(i){
 nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));
 vt.textContent=MOD[i][2];vd.textContent=MOD[i][3];alertEl.textContent=MOD[i][4];
 destroyCharts();destroyMap();
 view.innerHTML=SCREENS[i]();
 void view.offsetHeight;
 draw(i);
 if(i==4)initMap();
}
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
