<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Customer Complaint Management（客訴管理）｜Jvision 系統 Demo</title>
<meta name="description" content="多渠道客服、SLA 到客訴補償的服務管理" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#16a34a;--accent2:#4ade80;--accent-dk:#0f7a37;
  --bg:#f1f5f2;--panel:#ffffff;--ink:#132018;--muted:#5b6b61;--line:#e2ebe4;
  --soft:#eaf6ee;--warn:#f59e0b;--danger:#dc2626;--info:#0ea5e9;
  --shadow:0 1px 3px rgba(16,40,24,.06),0 8px 24px rgba(16,40,24,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;font-size:20px}
a{color:inherit;text-decoration:none}
.topbar{position:sticky;top:0;z-index:40;background:linear-gradient(90deg,#0f7a37,#16a34a);color:#fff;box-shadow:0 2px 12px rgba(15,122,55,.28)}
.topbar-inner{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;min-width:0}
.brand .logo{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:none}
.brand small{display:block;font-weight:500;font-size:11px;opacity:.85}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0}
.nav button{flex:none;white-space:nowrap;min-width:0;display:flex;align-items:center;gap:6px;border:0;cursor:pointer;background:rgba(255,255,255,.12);color:#eafff0;padding:8px 12px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:600;transition:.15s}
.nav button:hover{background:rgba(255,255,255,.24)}
.nav button.on{background:#fff;color:var(--accent-dk)}
.nav button .material-symbols-outlined{font-size:19px}
.wrap{max-width:1360px;margin:0 auto;padding:20px 18px 60px}
.screen-head{display:flex;align-items:flex-start;gap:14px;margin:2px 0 18px;flex-wrap:wrap}
.screen-head .ic{width:44px;height:44px;border-radius:12px;background:var(--soft);color:var(--accent-dk);display:flex;align-items:center;justify-content:center;flex:none}
.screen-head h1{margin:0;font-size:20px;font-weight:800}
.screen-head p{margin:3px 0 0;color:var(--muted);font-size:13px}
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--soft);color:var(--accent-dk);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}
.card.p{padding:16px}
.grid{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
@media(max-width:820px){.g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--shadow);min-width:0}
.kpi .lab{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12.5px;font-weight:600}
.kpi .lab .material-symbols-outlined{font-size:18px;color:var(--accent)}
.kpi .val{font-size:26px;font-weight:900;margin-top:8px;letter-spacing:-.5px}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:3px}
.kpi .up{color:var(--accent-dk);font-weight:700}
.kpi .dn{color:var(--danger);font-weight:700}
.sec-t{font-size:14px;font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:7px}
.sec-t .material-symbols-outlined{font-size:19px;color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th{text-align:left;color:var(--muted);font-weight:700;font-size:11.5px;padding:9px 12px;border-bottom:2px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.4px}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f6fbf7}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.c-red{background:#fdecec;color:#c1272d}
.c-amb{background:#fef3e2;color:#b26a00}
.c-grn{background:#e7f7ec;color:#0f7a37}
.c-blu{background:#e5f4fd;color:#0369a1}
.c-gry{background:#eef1ef;color:#5b6b61}
.c-vio{background:#f0eafb;color:#6d28d9}
.chan{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.chan .material-symbols-outlined{font-size:16px}
.ovf{overflow-x:auto;border-radius:12px}
.matrix{display:grid;grid-template-columns:70px repeat(5,1fr);gap:6px;min-width:520px}
.matrix .mh{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:6px 2px;display:flex;align-items:center;justify-content:center}
.matrix .yl{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px}
.mcell{border-radius:9px;min-height:58px;padding:6px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;font-weight:800;font-size:12px}
.mcell small{font-weight:600;opacity:.9;font-size:10.5px}
.mcell b{font-size:19px}
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;min-width:900px}
.col{background:#f4f8f5;border:1px solid var(--line);border-radius:13px;padding:10px;min-width:0}
.col-h{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:13px;margin-bottom:9px;padding:0 2px}
.col-h .cnt{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11.5px;color:var(--muted)}
.tk{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(16,40,24,.05)}
.tk:last-child{margin-bottom:0}
.tk .id{font-size:11px;font-weight:800;color:var(--accent-dk)}
.tk .ti{font-size:13px;font-weight:700;margin:4px 0 7px}
.tk .mt{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.tk .who{display:inline-flex;align-items:center;gap:5px}
.av{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.bar{height:6px;border-radius:99px;background:#e6ede8;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .it{position:relative;padding:0 0 16px}
.tl .it:last-child{padding-bottom:0}
.tl .dot{position:absolute;left:-22px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-sizing:border-box}
.tl .it.done .dot{background:var(--accent)}
.tl .it.now .dot{border-color:var(--warn);background:var(--warn)}
.tl h4{margin:0;font-size:13.5px;font-weight:800}
.tl p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.tl .st{font-size:11px;font-weight:700;margin-left:8px}
.reply{border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:12px;background:#fff}
.reply:last-child{margin-bottom:0}
.reply .rh{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.reply .rb{margin-top:9px;font-size:12.5px;color:#33443a;background:#f7faf8;border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.sla{height:8px;border-radius:99px;background:#eef1ef;overflow:hidden;margin-top:9px}
.sla>i{display:block;height:100%}
.mini{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dotc{width:10px;height:10px;border-radius:3px;display:inline-block}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.foot{max-width:1360px;margin:0 auto;padding:14px 18px 30px;color:var(--muted);font-size:12px;text-align:center}
@media(max-width:560px){.nav button span.tx{display:none}.nav button{padding:8px 10px}}
</style>
</head>

<div class="topbar">

<script>
(function(){
"use strict";
var MODS=[
  {i:"inbox",n:"客訴受理登錄",d:"多渠道客訴案件登錄與立案"},
  {i:"linear_scale",n:"嚴重度分級",d:"依影響評估分級與優先排序"},

];
var view=document.getElementById("view");
var charts=[];
function clearCharts(){for(var k=0;k<charts.length;k++){try{charts[k].destroy();}catch(e){}}charts=[];}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function head(idx){var m=MODS[idx];return '<div class="screen-head"><div class="ic"><span class="material-symbols-outlined">'+m.i+'</span></div><div style="min-width:0"><h1>'+m.n+'</h1><p>'+m.d+'</p></div><div style="margin-left:auto"><span class="tag"><span class="material-symbols-outlined">bolt</span>模組 '+(idx+1)+' / 6</span></div></div>';}
function kpiRow(kpi){var kp="";for(var j=0;j<kpi.length;j++){var k=kpi[j];kp+='<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+k.ic+'</span>'+k.l+'</div><div class="val">'+k.v+'</div><div class="sub '+(k.cls||"")+'">'+k.s+'</div></div>';}return kp;}

/* SCREEN 0 : 客訴受理登錄 */
function s0(){
  var kpi=[
    {l:"今日新進客訴",v:"18",s:"較昨日 +4",ic:"call_received",cls:"dn"},
    {l:"待受理立案",v:"7",s:"平均等待 12 分",ic:"pending_actions",cls:""},
    {l:"多渠道覆蓋",v:"5",s:"電話/Email/官網/經銷/LINE",ic:"share",cls:"up"},
    {l:"本月累計客訴",v:"286",s:"回覆時效達成 91%",ic:"summarize",cls:"up"}
  ];

    {id:"CC-24081",ch:"電話",ci:"call",cust:"O達精密工業",prod:"HX-220 軸承座",batch:"LOT-A2409",iss:"表面刮傷",time:"09:12",st:["待受理","c-amb"]},
    {id:"CC-24080",ch:"Email",ci:"mail",cust:"O信電子",prod:"PCB-40 連接器",batch:"LOT-B1173",iss:"尺寸超差",time:"08:47",st:["已立案","c-grn"]},
    {id:"CC-24079",ch:"官網表單",ci:"public",cust:"O昇動力",prod:"DM-15 齒輪組",batch:"LOT-C0921",iss:"異音",time:"08:31",st:["待受理","c-amb"]},
    {id:"CC-24078",ch:"經銷商",ci:"storefront",cust:"O鼎貿易",prod:"HX-220 軸承座",batch:"LOT-A2401",iss:"包裝破損",time:"08:05",st:["已立案","c-grn"]},
    {id:"CC-24077",ch:"LINE",ci:"chat",cust:"O澤機械",prod:"VL-88 閥體",batch:"LOT-D3350",iss:"洩漏",time:"昨 17:40",st:["補件中","c-blu"]},
    {id:"CC-24076",ch:"電話",ci:"call",cust:"O達精密工業",prod:"HX-220 軸承座",batch:"LOT-A2409",iss:"批號不符",time:"昨 16:22",st:["已立案","c-grn"]},
    {id:"CC-24075",ch:"Email",ci:"mail",cust:"O昇科技",prod:"SM-07 感測器",batch:"LOT-E7712",iss:"功能失效",time:"昨 15:03",st:["已立案","c-grn"]}
  ];
  var chanChart='<div class="card p"><div class="sec-t"><span class="material-symbols-outlined">donut_small</span>渠道來源分佈（本月）</div><div id="c0a"></div><div class="legend"><span><i class="dotc" style="background:#16a34a"></i>電話 38%</span><span><i class="dotc" style="background:#4ade80"></i>Email 27%</span><span><i class="dotc" style="background:#0ea5e9"></i>官網 16%</span><span><i class="dotc" style="background:#f59e0b"></i>經銷 12%</span><span><i class="dotc" style="background:#94a3b8"></i>LINE 7%</span></div></div>';
  var tr="";
  for(var i=0;i<rows.length;i++){var r=rows[i];
    tr+='<tr><td><b>'+r.id+'</b></td><td><span class="chan"><span class="material-symbols-outlined">'+r.ci+'</span>'+r.ch+'</span></td><td>'+esc(r.cust)+'</td><td>'+esc(r.prod)+'</td><td><span class="c-gry chip">'+r.batch+'</span></td><td>'+esc(r.iss)+'</td><td>'+r.time+'</td><td><span class="chip '+r.st[1]+'">'+r.st[0]+'</span></td></tr>';

function initS0(){

  c.render();charts.push(c);
}

/* SCREEN 1 : 嚴重度分級（矩陣） */
function s1(){
  var kpi=[
    {l:"S1 最高優先",v:"3",s:"涉及已出貨批號",ic:"priority_high",cls:"dn"},
    {l:"S2 高",v:"9",s:"影響功能待隔離",ic:"warning",cls:""},
    {l:"待分派",v:"12",s:"平均分派 <1 小時",ic:"assignment_ind",cls:""},
    {l:"分級一致率",v:"96%",s:"規則自動建議",ic:"verified",cls:"up"}
  ];
  var imp=["極輕微","輕微","中等","嚴重","重大"];
  var lik=["幾乎不會","偶爾","可能","經常","頻繁"];
  function color(score){if(score>=17)return"#c1272d";if(score>=12)return"#e0762a";if(score>=7)return"#f2b705";if(score>=4)return"#7cbf4e";return"#3f9e56";}
  var counts={"4-4":3,"3-4":4,"4-3":5,"2-3":6,"3-3":8,"2-2":7,"1-2":9,"3-2":4,"1-1":11,"2-4":2,"4-2":1};
  var mh='<div class="mh"></div>';
  for(var c=0;c<5;c++){mh+='<div class="mh">'+imp[c]+'<br><small style="color:#93a29a">影響 '+(c+1)+'</small></div>';}
  var cells="";
  for(var rr=4;rr>=0;rr--){
    cells+='<div class="mh"><span class="yl">'+lik[rr]+'</span></div>';
    for(var cc=0;cc<5;cc++){
      var score=(rr+1)*(cc+1);
      var key=(rr+1)+"-"+(cc+1);
      var num=counts[key]||0;
      cells+='<div class="mcell" style="background:'+color(score)+'"><small>RPN '+score+'</small><b>'+(num?num:"·")+'</b></div>';
    }
  }
  var matrix='<div class="card p"><div class="sec-t"><span class="material-symbols-outlined">grid_on</span>嚴重度分級矩陣（影響 × 可能性）</div><div class="ovf"><div class="matrix">'+mh+cells+'</div></div><div class="legend"><span><i class="dotc" style="background:#3f9e56"></i>S4 低</span><span><i class="dotc" style="background:#f2b705"></i>S3 中</span><span><i class="dotc" style="background:#e0762a"></i>S2 高</span><span><i class="dotc" style="background:#c1272d"></i>S1 最高</span></div></div>';
  var rules=[
    {r:"RULE-01",t:"涉及已出貨批號的客訴列為最高優先",b:"期限與未完成狀態",cls:"c-red"},
    {r:"RULE-02",t:"規格超差且影響功能者必須先隔離批次",b:"異常類型與影響範圍",cls:"c-amb"},
    {r:"RULE-03",t:"改善措施沒有驗證證據不得關閉案件",b:"核准狀態與操作紀錄",cls:"c-blu"}
  ];
  var rl="";for(var i=0;i<rules.length;i++){var x=rules[i];rl+='<div style="border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:10px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:5px"><span class="chip '+x.cls+'">'+x.r+'</span></div><div style="font-size:13px;font-weight:700">'+x.t+'</div><div class="mini" style="margin-top:5px"><span class="material-symbols-outlined" style="font-size:15px">fact_check</span>依據：'+x.b+'</div></div>';}
  var rcard='<div class="card p"><div class="sec-t"><span class="material-symbols-outlined">gavel</span>分級決策規則</div>'+rl+'</div>';
  return head(1)+'<div class="grid g4" style="margin-bottom:14px">'+kpiRow(kpi)+'</div><div class="grid g32">'+matrix+rcard+'</div>';
}
function initS1(){}

function buildNav(){

  nav.innerHTML=h;

  for(var j=0;j<btns.length;j++){btns[j].addEventListener("click",function(){show(+this.getAttribute("data-i"));});}
}
function show(i){
  clearCharts();
  view.innerHTML=RENDER[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){btns[k].className=(+btns[k].getAttribute("data-i")===i)?"on":"";}
  void view.offsetHeight;
  INIT[i]();
}
