<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
--color-primary:#2563EB;--color-on-primary:#FFF;--color-secondary:#3B82F6;
--color-on-secondary:#000;--color-accent:#EA580C;--color-on-accent:#000;
--color-background:#F8FAFC;--color-foreground:#1E293B;--color-card:#FFF;
--color-card-foreground:#1E293B;--color-muted:#E9EFF8;
--color-muted-foreground:#475569;--color-border:#E2E8F0;
--color-destructive:#DC2626;--color-on-destructive:#FFF;--color-ring:#2563EB;
--blue:#2563EB;--ink:#1E293B;--muted:#475569;--line:#E2E8F0;
--warn:#B45309;--success:#166534;--violet:#6D28D9;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background-color:var(--color-background);color:var(--ink);font-family:"Fira Sans",sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:40px 40px}
button,a{font:inherit}
button{cursor:pointer}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-size:20px;font-weight:500;line-height:1;vertical-align:middle}
.topbar{position:sticky;top:0;z-index:50;background:var(--color-primary);color:var(--color-on-primary);border-bottom:4px solid var(--ink)}
.topbar-inner{max-width:1440px;margin:auto;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:18px;padding:12px 20px}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.logo{width:42px;height:42px;display:grid;place-items:center;color:var(--ink);background:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.brand small{display:block;margin-top:1px;font-family:"Fira Code",monospace;font-size:10px;font-weight:500;letter-spacing:.02em;opacity:.9}
.nav{display:flex;justify-content:flex-end;gap:6px;overflow-x:auto;padding:3px 4px 7px}
.nav button{flex:0 0 auto;display:flex;align-items:center;gap:7px;min-height:40px;padding:8px 11px;border:2px solid rgba(255,255,255,.7);border-radius:0;background:transparent;color:#fff;font-size:12px;font-weight:700}
.nav button:hover{background:#fff;color:var(--ink);border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.nav button.on{background:var(--color-accent);color:var(--color-on-accent);border-color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid #FBBF24;outline-offset:3px}
.wrap{max-width:1440px;margin:auto;padding:24px 20px 64px}
.screen-head{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:14px;margin:0 0 20px;padding:18px;background:#fff;border:3px solid var(--ink);box-shadow:8px 8px 0 var(--color-primary)}
.screen-head:after{content:"ACTIVE WORKSPACE";position:absolute;right:14px;bottom:-9px;padding:1px 7px;background:var(--ink);color:#fff;font:600 9px "Fira Code",monospace;letter-spacing:.08em}
.screen-head .ic{width:48px;height:48px;display:grid;place-items:center;background:var(--color-accent);color:var(--color-on-accent);border:3px solid var(--ink)}
.screen-head .ic .material-symbols-outlined{font-size:27px}
.screen-head h1{margin:0;font-size:clamp(22px,3vw,34px);line-height:1.08;font-weight:800;letter-spacing:-.045em}
.screen-head p{margin:6px 0 0;color:var(--muted);font-size:13px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:7px 10px;background:var(--color-muted);border:2px solid var(--ink);font:700 11px "Fira Code",monospace;white-space:nowrap}
.grid{display:grid;gap:14px;min-width:0}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g23{grid-template-columns:2fr 1fr}.g32{grid-template-columns:1.4fr 1fr}
.card,.kpi{min-width:0;background:var(--color-card);color:var(--color-card-foreground);border:2px solid var(--ink);border-radius:0;box-shadow:5px 5px 0 rgba(30,41,59,.18)}
.card.p{padding:16px}
.kpi{position:relative;padding:15px;overflow:hidden}
.kpi:after{content:"";position:absolute;right:-14px;bottom:-14px;width:46px;height:46px;background:var(--color-muted);border:2px solid var(--ink);transform:rotate(45deg)}
.kpi:nth-child(2n){border-top-color:var(--color-primary)}
.kpi:nth-child(3n){border-top-color:var(--color-accent)}
.kpi .lab{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:700}
.kpi .lab .material-symbols-outlined{color:var(--blue);font-size:18px}
.kpi .val{position:relative;z-index:1;margin-top:7px;font:700 28px "Fira Code",monospace;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.kpi .sub{position:relative;z-index:1;margin-top:4px;color:var(--muted);font-size:11px}.up{color:var(--success)!important;font-weight:700}.dn{color:var(--color-destructive)!important;font-weight:700}
.sec-t{display:flex;align-items:center;gap:8px;margin:0 0 12px;padding-bottom:9px;border-bottom:2px solid var(--ink);font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.sec-t .material-symbols-outlined{color:var(--blue)}
.ovf{overflow:auto}
table{width:100%;min-width:570px;border-collapse:collapse;font-size:12px}
th{padding:10px 11px;background:var(--ink);color:#fff;border:1px solid #64748B;text-align:left;font:600 11px "Fira Code",monospace;letter-spacing:.03em;white-space:nowrap}
td{padding:10px 11px;border:1px solid var(--line);vertical-align:middle}
tbody tr:nth-child(even){background:#F1F5F9}
tbody tr:hover{background:#DBEAFE}
td:first-child,.id,.mono{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
td:nth-last-child(2){font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border:1px solid currentColor;border-radius:0;font-size:11px;font-weight:700;white-space:nowrap}
.chip:before{content:"";width:6px;height:6px;background:currentColor;border:1px solid currentColor}
.c-red{background:#FEE2E2;color:#991B1B}.c-amb{background:#FEF3C7;color:#92400E}.c-grn{background:#DCFCE7;color:#166534}.c-blu{background:#DBEAFE;color:#1E40AF}.c-gry{background:#E2E8F0;color:#334155}.c-vio{background:#EDE9FE;color:#5B21B6}
.chan,.mini{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:12px;font-weight:600}.chan .material-symbols-outlined{font-size:16px}
.matrix{display:grid;grid-template-columns:72px repeat(5,1fr);gap:5px;min-width:540px}
.mh{display:flex;align-items:center;justify-content:center;padding:5px;text-align:center;color:var(--muted);font:600 10px "Fira Code",monospace}.yl{writing-mode:vertical-rl;transform:rotate(180deg)}
.mcell{min-height:64px;padding:7px;border:2px solid var(--ink);display:flex;flex-direction:column;justify-content:space-between;color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.65);font-family:"Fira Code",monospace}
.mcell small{font-size:10px;font-weight:600}.mcell b{font-size:19px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;color:var(--muted);font-size:11px}.legend span{display:inline-flex;align-items:center;gap:5px}.dotc{width:11px;height:11px;display:inline-block;border:2px solid var(--ink)}
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:10px;min-width:900px}
.col{padding:10px;background:var(--color-muted);border:2px dashed var(--ink)}
.col-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;font-size:13px;font-weight:800}.cnt{padding:1px 8px;background:#fff;border:2px solid var(--ink);font:600 11px "Fira Code",monospace}
.tk{margin-bottom:9px;padding:11px;background:#fff;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--color-primary)}.tk:last-child{margin-bottom:0}
.tk .id{color:#1D4ED8;font-size:11px;font-weight:700}.tk .ti{margin:5px 0 8px;font-size:13px;font-weight:700}
.tk .mt{display:flex;align-items:center;justify-content:space-between;gap:5px;color:var(--muted);font-size:10.5px}.who{display:inline-flex;align-items:center;gap:5px}
.av{width:24px;height:24px;display:grid;place-items:center;background:var(--ink);color:#fff;border:1px solid var(--ink);font-size:10px;font-weight:800}
.bar,.sla{height:8px;margin-top:8px;background:#CBD5E1;border:1px solid var(--ink);overflow:hidden}.bar>i,.sla>i{display:block;height:100%;background:var(--color-primary)}
.tl{position:relative;padding-left:27px}.tl:before{content:"";position:absolute;left:9px;top:5px;bottom:5px;width:3px;background:var(--ink)}
.tl .it{position:relative;padding-bottom:17px}.tl .it:last-child{padding-bottom:0}.tl .dot{position:absolute;left:-25px;top:1px;width:18px;height:18px;background:#fff;border:3px solid var(--blue)}.tl .done .dot{background:var(--blue)}.tl .now .dot{background:var(--color-accent);border-color:var(--ink)}
.tl h4{margin:0;font-size:13px}.tl p{margin:4px 0 0;color:var(--muted);font-size:12px}.tl .st{margin-left:7px}
.reply{margin-bottom:11px;padding:12px;background:#fff;border:2px solid var(--ink)}.reply:last-child{margin:0}.rh{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.rb{margin-top:9px;padding:9px 10px;background:var(--color-muted);border-left:5px solid var(--blue);font-size:12px}
.pill-row{display:flex;flex-wrap:wrap;gap:7px}.foot{max-width:1440px;margin:auto;padding:14px 20px 28px;color:var(--muted);font:500 11px "Fira Code",monospace;text-align:center}
.rule{margin-bottom:9px;padding:11px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--color-muted)}
.rule:last-child{margin-bottom:0}
@media(prefers-reduced-motion:no-preference){
.nav button,.card,.kpi,.tk{transition:transform .18s ease,box-shadow .18s ease,background-color .18s ease,color .18s ease}
.nav button:hover,.tk:hover{transform:translate(-2px,-2px)}
.grid-item,.kpi,.card{animation:enter .4s backwards cubic-bezier(.2,.9,.3,1.25)}
.grid-item:nth-child(2),.kpi:nth-child(2){animation-delay:.06s}.grid-item:nth-child(3),.kpi:nth-child(3){animation-delay:.12s}.grid-item:nth-child(4),.kpi:nth-child(4){animation-delay:.18s}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media(max-width:1024px){.g4{grid-template-columns:repeat(2,1fr)}.g23,.g32{grid-template-columns:1fr}.topbar-inner{grid-template-columns:1fr}.nav{justify-content:flex-start}}
@media(max-width:768px){.wrap{padding:18px 14px 48px}.topbar-inner{padding:10px 14px}.screen-head{grid-template-columns:auto 1fr}.screen-head>div:last-child{grid-column:1/-1;margin-left:0!important}.g2,.g3{grid-template-columns:1fr}}
@media(max-width:480px){.g4{grid-template-columns:1fr}.nav button{padding:8px}.nav .tx{display:none}.screen-head{padding:14px;box-shadow:5px 5px 0 var(--blue)}.screen-head h1{font-size:23px}.brand small{display:none}.kpi .val{font-size:25px}}
</style>
</head>
<body>
<header class="topbar">
<div class="topbar-inner">
<div class="brand"><span class="logo"><span class="material-symbols-outlined">support_agent</span></span><span>客訴管理平台<small>Customer Complaint Management</small></span></div>
<nav class="nav" id="nav" aria-label="客訴管理模組"></nav>
</div>
</header>
<main class="wrap"><div id="view" aria-live="polite"></div></main>
<footer class="foot">Jvision 系統 Demo · 純前端展示資料（模擬）· 品質管理 / 客服服務台</footer>
<script>
(function(){
"use strict";
var MODS=[
{i:"inbox",n:"客訴受理登錄",d:"多渠道客訴案件登錄與立案"},
{i:"linear_scale",n:"嚴重度分級",d:"依影響評估分級與優先排序"},
{i:"hub",n:"調查分派看板",d:"調查任務指派與進度追蹤"},
{i:"biotech",n:"根因分析 8D",d:"8D／CAPA 根因與矯正措施"},
{i:"mark_email_read",n:"客戶回覆",d:"回覆內容審核與時效控管"},
{i:"insights",n:"成效追蹤結案",d:"重複客訴率與時效成效分析"}
];
var view=document.getElementById("view"),charts=[];
var reduced=window.matchMedia("(prefers-reduced-motion: reduce)");
function clearCharts(){charts.forEach(function(c){try{c.destroy()}catch(e){}});charts=[]}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function head(i){var m=MODS[i];return'<section class="screen-head"><div class="ic"><span class="material-symbols-outlined">'+m.i+'</span></div><div><h1>'+m.n+'</h1><p>'+m.d+'</p></div><div style="margin-left:auto"><span class="tag"><span class="material-symbols-outlined">bolt</span>模組 '+(i+1)+' / 6</span></div></section>'}
function kpis(a){return a.map(function(k){return'<article class="kpi grid-item"><div class="lab"><span class="material-symbols-outlined">'+k.ic+'</span>'+k.l+'</div><div class="val">'+k.v+'</div><div class="sub '+(k.cls||"")+'">'+k.s+'</div></article>'}).join("")}
function chartBase(type,height){return{chart:{type:type,height:height,animations:{enabled:!reduced.matches},toolbar:{show:false},redrawOnParentResize:false,redrawOnWindowResize:false},dataLabels:{enabled:false},legend:{show:false},grid:{borderColor:"#E2E8F0"},tooltip:{theme:"light"}}}
function s0(){
var k=[{l:"今日新進客訴",v:"18",s:"較昨日 +4",ic:"call_received",cls:"dn"},{l:"待受理立案",v:"7",s:"平均等待 12 分",ic:"pending_actions"},{l:"多渠道覆蓋",v:"5",s:"電話/Email/官網/經銷/LINE",ic:"share",cls:"up"},{l:"本月累計客訴",v:"286",s:"回覆時效達成 91%",ic:"summarize",cls:"up"}];
var r=[
["CC-24081","電話","call","O達精密工業","HX-220 軸承座","LOT-A2409","表面刮傷","09:12","待受理","c-amb"],
["CC-24080","Email","mail","O信電子","PCB-40 連接器","LOT-B1173","尺寸超差","08:47","已立案","c-grn"],
["CC-24079","官網表單","public","O昇動力","DM-15 齒輪組","LOT-C0921","異音","08:31","待受理","c-amb"],
["CC-24078","經銷商","storefront","O鼎貿易","HX-220 軸承座","LOT-A2401","包裝破損","08:05","已立案","c-grn"],
["CC-24077","LINE","chat","O澤機械","VL-88 閥體","LOT-D3350","洩漏","昨 17:40","補件中","c-blu"],
["CC-24076","電話","call","O達精密工業","HX-220 軸承座","LOT-A2409","批號不符","昨 16:22","已立案","c-grn"],
["CC-24075","Email","mail","O昇科技","SM-07 感測器","LOT-E7712","功能失效","昨 15:03","已立案","c-grn"]];
var tr=r.map(function(x){return"<tr><td><b>"+x[0]+'</b></td><td><span class="chan"><span class="material-symbols-outlined">'+x[2]+"</span>"+x[1]+"</span></td><td>"+esc(x[3])+"</td><td>"+esc(x[4])+'</td><td><span class="chip c-gry">'+x[5]+"</span></td><td>"+esc(x[6])+"</td><td>"+x[7]+'</td><td><span class="chip '+x[9]+'">'+x[8]+"</span></td></tr>"}).join("");
var tbl='<section class="card"><div class="p"><h2 class="sec-t"><span class="material-symbols-outlined">list_alt</span>今日進線客訴案件</h2></div><div class="ovf"><table><thead><tr><th>案件編號</th><th>渠道</th><th>客戶</th><th>產品</th><th>批號</th><th>問題</th><th>進線時間</th><th>狀態</th></tr></thead><tbody>'+tr+"</tbody></table></div></section>";
var pie='<section class="card p"><h2 class="sec-t"><span class="material-symbols-outlined">donut_small</span>渠道來源分佈（本月）</h2><div id="c0a"></div><div class="legend"><span><i class="dotc" style="background:#2563EB"></i>電話 38%</span><span><i class="dotc" style="background:#60A5FA"></i>Email 27%</span><span><i class="dotc" style="background:#EA580C"></i>官網 16%</span><span><i class="dotc" style="background:#FBBF24"></i>經銷 12%</span><span><i class="dotc" style="background:#64748B"></i>LINE 7%</span></div></section>';
return head(0)+'<div class="grid g4" style="margin-bottom:14px">'+kpis(k)+'</div><div class="grid g23">'+tbl+pie+"</div>"}
function init0(){var e=document.getElementById("c0a");if(!e)return;var o=chartBase("donut",230);o.series=[38,27,16,12,7];o.labels=["電話","Email","官網","經銷","LINE"];o.colors=["#2563EB","#60A5FA","#EA580C","#FBBF24","#64748B"];o.stroke={width:2,colors:["#1E293B"]};o.plotOptions={pie:{donut:{size:"62%",labels:{show:true,total:{show:true,label:"總客訴",formatter:function(){return"286 件"}}}}}};var c=new ApexCharts(e,o);c.render();charts.push(c)}
function s1(){
var k=[{l:"S1 最高優先",v:"3",s:"涉及已出貨批號",ic:"priority_high",cls:"dn"},{l:"S2 高",v:"9",s:"影響功能待隔離",ic:"warning"},{l:"待分派",v:"12",s:"平均分派 <1 小時",ic:"assignment_ind"},{l:"分級一致率",v:"96%",s:"規則自動建議",ic:"verified",cls:"up"}];
var imp=["極輕微","輕微","中等","嚴重","重大"],lik=["幾乎不會","偶爾","可能","經常","頻繁"],counts={"4-4":3,"3-4":4,"4-3":5,"2-3":6,"3-3":8,"2-2":7,"1-2":9,"3-2":4,"1-1":11,"2-4":2,"4-2":1};
function col(n){return n>=17?"#991B1B":n>=12?"#C2410C":n>=7?"#A16207":n>=4?"#3F6212":"#166534"}
var m='<div class="mh"></div>'+imp.map(function(x,i){return'<div class="mh">'+x+"<br>影響 "+(i+1)+"</div>"}).join("");
for(var a=4;a>=0;a--){m+='<div class="mh"><span class="yl">'+lik[a]+"</span></div>";for(var b=0;b<5;b++){var n=(a+1)*(b+1),v=counts[(a+1)+"-"+(b+1)]||0;m+='<div class="mcell" style="background:'+col(n)+'"><small>RPN '+n+"</small><b>"+(v||"·")+"</b></div>"}}
var matrix='<section class="card p"><h2 class="sec-t"><span class="material-symbols-outlined">grid_on</span>嚴重度分級矩陣（影響 × 可能性）</h2><div class="ovf"><div class="matrix">'+m+'</div></div><div class="legend"><span><i class="dotc" style="background:#166534"></i>S4 低</span><span><i class="dotc" style="background:#A16207"></i>S3 中</span><span><i class="dotc" style="background:#C2410C"></i>S2 高</span><span><i class="dotc" style="background:#991B1B"></i>S1 最高</span></div></section>';
var rules=[["RULE-01","涉及已出貨批號的客訴列為最高優先","期限與未完成狀態","c-red"],["RULE-02","規格超差且影響功能者必須先隔離批次","異常類型與影響範圍","c-amb"],["RULE-03","改善措施沒有驗證證據不得關閉案件","核准狀態與操作紀錄","c-blu"]];
var rc='<section class="card p"><h2 class="sec-t"><span class="material-symbols-outlined">gavel</span>分級決策規則</h2>'+rules.map(function(x){return'<div class="rule"><span class="chip '+x[3]+'">'+x[0]+'</span><div style="margin-top:7px;font-size:13px;font-weight:700">'+x[1]+'</div><div class="mini" style="margin-top:5px"><span class="material-symbols-outlined">fact_check</span>依據：'+x[2]+"</div></div>"}).join("")+"</section>";
