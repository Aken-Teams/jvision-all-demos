<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>跨廠/跨事業群經營分析系統｜Jvision 系統 Demo</title>
  <meta name="description" content="把分散數據變成可下鑽、可決策的經營洞察" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
  <style>
    :root{
      --bg:#07120f;--panel:#0e1f1b;--panel2:#12292312;--card:#0f231e;--line:#1c3a33;
      --teal:#0d9488;--teal2:#2dd4bf;--txt:#e6f3ef;--mut:#8fb3ab;--dim:#6b8f88;
      --amber:#fbbf24;--rose:#fb7185;--sky:#38bdf8;--vio:#c084fc;
    }
    *{box-sizing:border-box;min-width:0}
    html,body{margin:0;padding:0}
    body{
      background:radial-gradient(1200px 600px at 80% -10%,#0d3b33 0%,transparent 60%),var(--bg);
      color:var(--txt);font-family:Inter,"Noto Sans TC",sans-serif;font-size:14px;line-height:1.55;
      -webkit-font-smoothing:antialiased;overflow-x:hidden;
    }
    .ms{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;line-height:1;vertical-align:middle}
    /* top nav */
    header.top{
      position:sticky;top:0;z-index:40;background:rgba(7,18,15,.92);backdrop-filter:blur(8px);
      border-bottom:1px solid var(--line);
    }
    .topin{display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}
    .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--teal),var(--teal2));
      display:grid;place-items:center;color:#04140f;box-shadow:0 0 18px rgba(45,212,191,.4)}
    .logo .ms{font-size:20px}
    .btitle{font-weight:800;font-size:15px;letter-spacing:.2px;white-space:nowrap}
    .bsub{font-size:11px;color:var(--dim);white-space:nowrap}
    .live{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--teal2);
      border:1px solid var(--line);padding:5px 11px;border-radius:20px;background:var(--card)}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--teal2);box-shadow:0 0 10px var(--teal2)}
    nav.tabs{display:flex;gap:6px;padding:0 12px 10px;flex-wrap:wrap}
    nav.tabs button{
      display:flex;align-items:center;gap:8px;background:var(--card);color:var(--mut);
      border:1px solid var(--line);border-radius:10px;padding:8px 13px;cursor:pointer;
      font-family:inherit;font-size:13px;font-weight:600;transition:.15s;white-space:nowrap
    }
    nav.tabs button .ms{font-size:18px}
    nav.tabs button:hover{color:var(--txt);border-color:var(--teal)}
    nav.tabs button.on{background:linear-gradient(135deg,rgba(13,148,136,.28),rgba(45,212,191,.14));
      color:var(--teal2);border-color:var(--teal);box-shadow:0 0 0 1px rgba(45,212,191,.15) inset}
    main{padding:18px}
    .scr-head{display:flex;align-items:flex-end;gap:12px;margin:0 0 16px;flex-wrap:wrap}
    .scr-head .ttl{font-size:20px;font-weight:800}
    .scr-head .sub{font-size:12.5px;color:var(--mut)}
    .chip{font-size:11px;color:var(--teal2);border:1px solid var(--line);background:var(--card);
      padding:3px 10px;border-radius:20px;margin-left:auto;white-space:nowrap}
    /* grids */
    .grid{display:grid;gap:14px}
    .g4{grid-template-columns:repeat(4,1fr)}
    .g3{grid-template-columns:repeat(3,1fr)}
    .g2{grid-template-columns:repeat(2,1fr)}
    .g21{grid-template-columns:2fr 1fr}
    .g12{grid-template-columns:1fr 2fr}
    @media(max-width:820px){.g4,.g3,.g2,.g21,.g12{grid-template-columns:1fr}}
    .card{background:linear-gradient(180deg,var(--card),#0c1e19);border:1px solid var(--line);
      border-radius:14px;padding:15px}
    .card.pad0{padding:0;overflow:hidden}
    .ch{display:flex;align-items:center;gap:8px;margin-bottom:12px}
    .ch .ms{font-size:18px;color:var(--teal2)}
    .ch h3{margin:0;font-size:14px;font-weight:700}
    .ch .r{margin-left:auto;font-size:11px;color:var(--dim)}
    /* kpi */
    .kpi{background:linear-gradient(180deg,var(--card),#0c1e19);border:1px solid var(--line);
      border-radius:14px;padding:15px;position:relative;overflow:hidden}
    .kpi::after{content:"";position:absolute;right:-20px;top:-20px;width:90px;height:90px;border-radius:50%;
      background:radial-gradient(circle,rgba(45,212,191,.16),transparent 70%)}
    .kpi .kl{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
    .kpi .kl .ms{font-size:16px;color:var(--teal2)}
    .kpi .kv{font-size:27px;font-weight:800;margin-top:8px;letter-spacing:.5px}
    .kpi .kv small{font-size:13px;font-weight:600;color:var(--mut)}
    .kpi .kd{font-size:11.5px;margin-top:5px;display:flex;align-items:center;gap:4px}
    .up{color:var(--teal2)}.down{color:var(--rose)}
    /* table */
    table{width:100%;border-collapse:collapse;font-size:12.5px}
    th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
    th{font-size:11px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.4px;
      background:rgba(255,255,255,.02);position:sticky;top:0}
    tbody tr:hover{background:rgba(45,212,191,.05)}
    td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
    .bar{height:7px;border-radius:5px;background:#0a1a16;overflow:hidden;min-width:70px}
    .bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--teal),var(--teal2))}
    .tag{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;display:inline-block}
    .t-ok{background:rgba(45,212,191,.14);color:var(--teal2)}
    .t-warn{background:rgba(251,191,36,.14);color:var(--amber)}
    .t-bad{background:rgba(251,113,133,.14);color:var(--rose)}
    .t-info{background:rgba(56,189,248,.14);color:var(--sky)}
    /* board */
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    @media(max-width:820px){.board{grid-template-columns:1fr}}
    .col{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:120px}
    .col>.cth{font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:space-between;
      padding:4px 6px 10px;color:var(--mut);border-bottom:1px dashed var(--line);margin-bottom:8px}
    .cnt{font-size:11px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1px 8px}
    .ti{background:linear-gradient(180deg,var(--card),#0c1e19);border:1px solid var(--line);border-radius:10px;
      padding:9px 10px;margin-bottom:8px;border-left:3px solid var(--teal)}
    .ti .tt{font-size:12.5px;font-weight:700}
    .ti .tm{font-size:11px;color:var(--dim);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
    .chart{width:100%;overflow:hidden}
    /* timeline */
    .tl{position:relative;padding-left:22px}
    .tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
    .tlr{position:relative;padding:0 0 16px 8px}
    .tlr::before{content:"";position:absolute;left:-20px;top:3px;width:11px;height:11px;border-radius:50%;
      background:var(--teal2);box-shadow:0 0 0 3px rgba(45,212,191,.18)}
    .tlr .tw{font-size:11px;color:var(--dim)}
    .tlr .th2{font-size:13px;font-weight:700;margin:2px 0}
    .tlr .td{font-size:12px;color:var(--mut)}
    /* misc */
    .lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:4px}
    .lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
    .mini{display:flex;flex-direction:column;gap:9px}
    .mrow{display:flex;align-items:center;gap:10px}
    .mrow .mn{font-size:12px;width:74px;flex-shrink:0;color:var(--mut)}
    .mrow .mv{font-size:12px;font-weight:700;width:52px;text-align:right;flex-shrink:0}
    .gauge{display:flex;flex-direction:column;align-items:center;padding:6px}
    .pill{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:8px;padding:5px 9px;background:var(--card)}
    .flt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
    .ins{display:flex;gap:11px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);
      border-left:3px solid var(--teal2);border-radius:11px;padding:12px;margin-bottom:10px}
    .ins .ms{color:var(--teal2);font-size:20px;flex-shrink:0}
    .ins .it{font-size:13px;font-weight:700}
    .ins .id{font-size:12px;color:var(--mut);margin-top:2px}
    .footn{color:var(--dim);font-size:11px;text-align:center;padding:22px 0 8px}
    @media(max-width:560px){nav.tabs button .lbl{display:none}nav.tabs button{padding:9px 12px}}
  </style>
</head>
<body>
  <header class="top">
    <div class="topin">
      <div class="brand">
        <div class="logo"><span class="ms">insights</span></div>
        <div>
          <div class="btitle">跨廠/跨事業群經營分析系統</div>
          <div class="bsub">Cross-Plant Business Intelligence · 總經理室決策平台</div>
        </div>
      </div>
      <div class="live"><span class="dot"></span>資料同步 MES · ERP · APS｜今日 08:14</div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main><div id="app"></div></main>
  <div class="footn">Jvision 系統 Demo · 純前端展示 · 全部為模擬資料</div>

  <script>
  (function(){
    "use strict";
    var TABS=[
      {ic:"dashboard",label:"集團總覽"},
      {ic:"factory",label:"跨廠產能"},
      {ic:"account_tree",label:"事業群損益"},
      {ic:"insights",label:"產品線獲利"},
      {ic:"rule",label:"指標治理"},
      {ic:"receipt_long",label:"資源調度"}
    ];
    var app=document.getElementById("app");
    var tabsEl=document.getElementById("tabs");
    var charts=[];
    function clearCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
    function el(id){return document.getElementById(id);}
    var AX={colors:["#8fb3ab"],style:{colors:"#8fb3ab",fontSize:"11px",fontFamily:"Inter"}};
    function baseGrid(){return{borderColor:"#1c3a33",strokeDashArray:3};}
    function noResize(o){o.chart=o.chart||{};o.chart.redrawOnParentResize=false;o.chart.redrawOnWindowResize=false;o.chart.animations={enabled:false};o.chart.toolbar={show:false};o.chart.background="transparent";o.theme={mode:"dark"};o.tooltip=o.tooltip||{};o.tooltip.theme="dark";return o;}
    function mk(id,opt){var n=el(id);if(!n)return;var c=new ApexCharts(n,noResize(opt));c.render();charts.push(c);}

    /* ---------- data ---------- */
    var PLANTS=[
      {p:"台中一廠",bg:"精密機械",rev:2840,gm:23.4,util:91,oee:84,cash:"良好",s:"ok"},
      {p:"台南二廠",bg:"精密機械",rev:2180,gm:19.1,util:78,oee:71,cash:"偏緊",s:"warn"},
      {p:"高雄三廠",bg:"車用電子",rev:3120,gm:27.8,util:94,oee:88,cash:"良好",s:"ok"},
      {p:"桃園四廠",bg:"車用電子",rev:1560,gm:14.6,util:63,oee:59,cash:"吃緊",s:"bad"},
      {p:"竹北五廠",bg:"半導體封測",rev:3980,gm:31.2,util:96,oee:90,cash:"良好",s:"ok"},
      {p:"嘉義六廠",bg:"半導體封測",rev:1240,gm:16.9,util:71,oee:66,cash:"偏緊",s:"warn"}
    ];
    function tagOf(s){return s==="ok"?'<span class="tag t-ok">正常</span>':s==="warn"?'<span class="tag t-warn">關注</span>':'<span class="tag t-bad">預警</span>';}

    /* ============ SCREEN 0 : 集團總覽 ============ */
    function s0(){
      var kp=[
        {ic:"payments",l:"集團月營收",v:"149.2",u:"億",d:"+6.3% MoM",up:1},
        {ic:"trending_up",l:"合併毛利率",v:"24.8",u:"%",d:"+1.4pt vs 目標",up:1},
        {ic:"factory",l:"平均產能利用率",v:"82.2",u:"%",d:"-2.1pt 落後廠拖累",up:0},
        {ic:"warning",l:"待決策議題",v:"7",u:"件",d:"3 件現金流相關",up:0}
      ];
      var h='<div class="scr-head"><div><div class="ttl">集團經營總覽</div><div class="sub">6 廠 · 3 事業群 · 統一口徑即時彙總</div></div><span class="chip">口徑 v2.4 · 資料延遲 12 分</span></div>';
      h+='<div class="grid g4">';
      kp.forEach(function(k){h+='<div class="kpi"><div class="kl"><span class="ms">'+k.ic+'</span>'+k.l+'</div><div class="kv">'+k.v+' <small>'+k.u+'</small></div><div class="kd '+(k.up?"up":"down")+'"><span class="ms" style="font-size:15px">'+(k.up?"arrow_upward":"arrow_downward")+'</span>'+k.d+'</div></div>';});
      h+='</div>';
      h+='<div class="grid g21" style="margin-top:14px">';
      h+='<div class="card"><div class="ch"><span class="ms">show_chart</span><h3>集團營收與毛利率趨勢</h3><span class="r">近 6 個月</span></div><div id="c0a" class="chart"></div></div>';
      h+='<div class="card"><div class="ch"><span class="ms">donut_small</span><h3>事業群營收占比</h3></div><div id="c0b" class="chart"></div></div>';
      h+='</div>';
      h+='<div class="grid g12" style="margin-top:14px">';
      h+='<div class="card"><div class="ch"><span class="ms">warning</span><h3>需關注廠區</h3></div><div class="mini">';
      PLANTS.filter(function(x){return x.s!=="ok";}).forEach(function(x){h+='<div class="mrow"><span class="mn" style="width:auto">'+x.p+'</span><div class="bar" style="flex:1"><i style="width:'+x.util+'%;background:'+(x.s==="bad"?"linear-gradient(90deg,#fb7185,#fbbf24)":"linear-gradient(90deg,#fbbf24,#2dd4bf)")+'"></i></div><span class="mv">'+x.util+'%</span>'+tagOf(x.s)+'</div>';});
      h+='</div></div>';
      h+='<div class="card pad0"><div class="ch" style="padding:15px 15px 0"><span class="ms">table_rows</span><h3>各廠即時經營指標</h3></div><div style="overflow-x:auto"><table><thead><tr><th>廠區</th><th>事業群</th><th style="text-align:right">月營收(百萬)</th><th style="text-align:right">毛利率</th><th style="text-align:right">利用率</th><th>現金</th><th>狀態</th></tr></thead><tbody>';
      PLANTS.forEach(function(x){h+='<tr><td>'+x.p+'</td><td style="color:var(--mut)">'+x.bg+'</td><td class="num">'+x.rev+'</td><td class="num">'+x.gm+'%</td><td class="num">'+x.util+'%</td><td style="color:var(--mut)">'+x.cash+'</td><td>'+tagOf(x.s)+'</td></tr>';});
      h+='</tbody></table></div></div>';
      h+='</div>';
      app.innerHTML=h;
      void app.offsetHeight;
      mk("c0a",{chart:{type:"line",height:280},series:[{name:"營收(億)",type:"column",data:[128,131,135,139,143,149]},{name:"毛利率%",type:"line",data:[22.1,22.8,23.3,23.9,24.2,24.8]}],stroke:{width:[0,3],curve:"smooth"},colors:["#0d9488","#2dd4bf"],fill:{opacity:[.85,1]},plotOptions:{bar:{columnWidth:"48%",borderRadius:4}},dataLabels:{enabled:false},grid:baseGrid(),xaxis:{categories:["3月","4月","5月","6月","7月","8月"],labels:{style:AX.style},axisBorder:{color:"#1c3a33"}},yaxis:[{labels:{style:AX.style}},{opposite:true,min:18,max:30,labels:{style:AX.style,formatter:function(v){return v.toFixed(0)+"%";}}}],legend:{labels:{colors:"#8fb3ab"}}});
      mk("c0b",{chart:{type:"donut",height:280},series:[38,32,30],labels:["半導體封測","車用電子","精密機械"],colors:["#0d9488","#2dd4bf","#38bdf8"],stroke:{width:0},dataLabels:{style:{fontSize:"11px"},dropShadow:{enabled:false}},legend:{position:"bottom",labels:{colors:"#8fb3ab"}},plotOptions:{pie:{donut:{size:"62%",labels:{show:true,total:{show:true,label:"合併營收",color:"#8fb3ab",formatter:function(){return"149.2億";}}}}}}});
    }

    /* ============ SCREEN 1 : 跨廠產能比較 ============ */
    function s1(){
      var h='<div class="scr-head"><div><div class="ttl">跨廠產能利用率比較</div><div class="sub">統一口徑並排對比 · 鎖定落後廠與閒置產能</div></div><span class="chip">單位：小時 / 標準機時</span></div>';
      h+='<div class="flt"><span class="pill">全部事業群</span><span class="pill">近 30 日</span><span class="pill">日班+夜班</span></div>';
      h+='<div class="grid g2">';
      h+='<div class="card"><div class="ch"><span class="ms">bar_chart</span><h3>各廠產能利用率 vs 稼動率(OEE)</h3></div><div id="c1a" class="chart"></div></div>';
      h+='<div class="card"><div class="ch"><span class="ms">radar</span><h3>五維產能體質雷達</h3></div><div id="c1b" class="chart"></div><div class="lgd"><span><i style="background:#2dd4bf"></i>竹北五廠</span><span><i style="background:#fb7185"></i>桃園四廠</span></div></div>';
      h+='</div>';
      h+='<div class="grid g12" style="margin-top:14px">';
      h+='<div class="card"><div class="ch"><span class="ms">speed</span><h3>集團平均利用率</h3></div><div id="c1c" class="chart"></div></div>';
      h+='<div class="card pad0"><div class="ch" style="padding:15px 15px 0"><span class="ms">insert_chart</span><h3>產能明細與閒置分析</h3></div><div style="overflow-x:auto"><table><thead><tr><th>廠區</th><th style="text-align:right">可用機時</th><th style="text-align:right">實際產出機時</th><th style="text-align:right">利用率</th><th style="text-align:right">閒置機時</th><th>瓶頸工序</th></tr></thead><tbody>';
      var cap=[
        {p:"台中一廠",av:7200,ac:6552,u:91,bo:"CNC 精加工"},
        {p:"台南二廠",av:7200,ac:5616,u:78,bo:"熱處理"},
        {p:"高雄三廠",av:8400,ac:7896,u:94,bo:"SMT 貼片"},
        {p:"桃園四廠",av:7200,ac:4536,u:63,bo:"測試站"},
        {p:"竹北五廠",av:8400,ac:8064,u:96,bo:"封裝"},
        {p:"嘉義六廠",av:7200,ac:5112,u:71,bo:"打線"}
      ];
      cap.forEach(function(x){var idle=x.av-x.ac;var cls=x.u>=90?"t-ok":x.u>=75?"t-warn":"t-bad";h+='<tr><td>'+x.p+'</td><td class="num">'+x.av.toLocaleString()+'</td><td class="num">'+x.ac.toLocaleString()+'</td><td class="num"><span class="tag '+cls+'">'+x.u+'%</span></td><td class="num" style="color:var(--rose)">'+idle.toLocaleString()+'</td><td style="color:var(--mut)">'+x.bo+'</td></tr>';});
      h+='</tbody></table></div></div>';
      h+='</div>';
      app.innerHTML=h;
      void app.offsetHeight;
      var pn=PLANTS.map(function(x){return x.p;});
