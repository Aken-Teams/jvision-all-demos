<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>跨廠/跨事業群經營分析系統｜Jvision 系統 Demo</title>
  <meta name="description" content="把分散數據變成可下鑽、可決策的經營洞察" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
  <style>
    :root{
      --color-primary:#0D9488;
      --color-on-primary:#000000;
      --color-secondary:#2DD4BF;
      --color-on-secondary:#0F172A;
      --color-accent:#D97706;
      --color-on-accent:#000000;
      --color-background:#F0FDFA;
      --color-foreground:#134E4A;
      --color-card:#FFFFFF;
      --color-card-foreground:#134E4A;
      --color-muted:#E8F1F4;
      --color-muted-foreground:#475569;
      --color-border:#5EEAD4;
      --color-destructive:#DC2626;
      --color-on-destructive:#FFFFFF;
      --color-ring:#0D9488;
      --blue:#0D9488;
      --ink:#134E4A;
      --muted:#475569;
      --line:#5EEAD4;
      --amber:#D97706;
      --green:#087F5B;
      --red:#B91C1C;
      --sky:#0369A1;
      --shadow:0 12px 32px rgba(19,78,74,.08);
      --shadow-hover:0 18px 42px rgba(19,78,74,.13);
      --display:"Cormorant Garamond","Crimson Pro",serif;
      --body:"Crimson Pro","Noto Serif TC",serif;
      --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
    }
    *{box-sizing:border-box;min-width:0}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      color:var(--color-foreground);
      background:
        linear-gradient(rgba(13,148,136,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(13,148,136,.035) 1px,transparent 1px),
        var(--color-background);
      background-size:40px 40px;
      font-family:var(--body);
      font-size:16px;
      line-height:1.55;
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }
    button,input,select{font:inherit}
    button,a{cursor:pointer}
    button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
      outline:3px solid var(--color-ring);
      outline-offset:3px;
    }
    .ms{
      font-family:"Material Symbols Outlined";
      font-weight:400;
      font-style:normal;
      font-size:20px;
      line-height:1;
      vertical-align:middle;
    }
    .top{
      position:sticky;
      top:0;
      z-index:50;
      border-bottom:1px solid rgba(13,148,136,.24);
      background:rgba(240,253,250,.94);
      backdrop-filter:blur(16px);
    }
    .topin{
      max-width:1440px;
      margin:auto;
      padding:15px clamp(16px,3vw,40px) 12px;
      display:flex;
      align-items:center;
      gap:18px;
    }
    .brand{display:flex;align-items:center;gap:13px}
    .logo{
      width:44px;
      height:44px;
      flex:0 0 44px;
      display:grid;
      place-items:center;
      color:#062E2B;
      background:var(--color-secondary);
      border:1px solid var(--color-primary);
      border-radius:3px;
      box-shadow:5px 5px 0 rgba(13,148,136,.16);
    }
    .logo .ms{font-size:25px}
    .btitle{
      font-family:var(--display);
      font-size:20px;
      font-weight:700;
      letter-spacing:.02em;
      line-height:1.1;
    }
    .bsub{
      margin-top:3px;
      color:var(--color-muted-foreground);
      font-size:12px;
      letter-spacing:.06em;
    }
    .live{
      margin-left:auto;
      display:flex;
      align-items:center;
      gap:8px;
      padding:7px 11px;
      border:1px solid rgba(13,148,136,.3);
      background:#fff;
      color:#315D59;
      font-family:var(--mono);
      font-size:11px;
      border-radius:2px;
      white-space:nowrap;
    }
    .dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--green);
      box-shadow:0 0 0 3px rgba(8,127,91,.14);
    }
    .tabs{
      max-width:1440px;
      margin:auto;
      padding:0 clamp(16px,3vw,40px) 13px;
      display:flex;
      gap:5px;
      overflow-x:auto;
      scrollbar-width:thin;
    }
    .tabs button{
      min-height:42px;
      display:flex;
      align-items:center;
      gap:8px;
      padding:8px 14px;
      color:#3F615E;
      background:transparent;
      border:1px solid transparent;
      border-radius:2px;
      font-weight:600;
      white-space:nowrap;
      transition:background-color .22s ease,color .22s ease,border-color .22s ease,transform .22s ease;
    }
    .tabs button:hover{
      color:var(--color-primary);
      background:#fff;
      border-color:rgba(13,148,136,.28);
      transform:translateY(-1px);
    }
    .tabs button.on{
      color:#063D38;
      background:#fff;
      border-color:var(--color-primary);
      box-shadow:inset 0 -3px 0 var(--color-primary);
    }
    main{
      width:min(1440px,100%);
      margin:auto;
      padding:clamp(22px,3vw,42px) clamp(16px,3vw,40px);
    }
    .scr-head{
      display:flex;
      align-items:flex-end;
      gap:18px;
      margin-bottom:24px;
      padding-bottom:17px;
      border-bottom:1px solid rgba(13,148,136,.28);
    }
    .ttl{
      font-family:var(--display);
      font-size:clamp(28px,3vw,42px);
      font-weight:700;
      line-height:1;
      letter-spacing:-.025em;
    }
    .sub{
      margin-top:7px;
      color:var(--color-muted-foreground);
      font-size:14px;
    }
    .chip{
      margin-left:auto;
      padding:5px 10px;
      color:#205C57;
      border:1px solid rgba(13,148,136,.35);
      background:#fff;
      border-radius:999px;
      font-family:var(--mono);
      font-size:11px;
      white-space:nowrap;
    }
    .grid{display:grid;gap:16px}
    .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .g21{grid-template-columns:minmax(0,2fr) minmax(300px,1fr)}
    .g12{grid-template-columns:minmax(280px,1fr) minmax(0,2fr)}
    .card,.kpi{
      position:relative;
      border:1px solid rgba(13,148,136,.25);
      border-radius:4px;
      background:var(--color-card);
      box-shadow:var(--shadow);
      transition:transform .23s ease,box-shadow .23s ease,border-color .23s ease;
    }
    .card:hover,.kpi:hover{
      transform:translateY(-3px);
      border-color:rgba(13,148,136,.58);
      box-shadow:var(--shadow-hover);
    }
    .card{padding:18px}
    .card.pad0{padding:0;overflow:hidden}
    .kpi{
      min-height:145px;
      padding:18px;
      overflow:hidden;
    }
    .kpi:before{
      content:"";
      position:absolute;
      top:0;
      left:0;
      width:54px;
      height:3px;
      background:var(--color-primary);
    }
    .kpi:after{
      content:"";
      position:absolute;
      right:-32px;
      bottom:-34px;
      width:100px;
      height:100px;
      border:1px solid rgba(13,148,136,.12);
      transform:rotate(45deg);
    }
    .kl{
      display:flex;
      align-items:center;
      gap:7px;
      color:var(--color-muted-foreground);
      font-size:13px;
      font-weight:600;
    }
    .kl .ms{color:var(--color-primary)}
    .kv{
      position:relative;
      z-index:1;
      margin-top:12px;
      font-family:var(--display);
      font-size:34px;
      font-weight:700;
      font-variant-numeric:tabular-nums;
      letter-spacing:-.02em;
      line-height:1;
    }
    .kv small{color:var(--color-muted-foreground);font-family:var(--body);font-size:13px}
    .kd{
      margin-top:10px;
      display:flex;
      align-items:center;
      gap:4px;
      font-size:12px;
      font-weight:600;
    }
    .up{color:#087451}
    .down{color:var(--red)}
    .ch{
      min-height:30px;
      margin-bottom:14px;
      display:flex;
      align-items:center;
      gap:8px;
    }
    .ch .ms{color:var(--color-primary)}
    .ch h3{
      margin:0;
      font-family:var(--display);
      font-size:19px;
      font-weight:700;
    }
    .ch .r{
      margin-left:auto;
      color:var(--color-muted-foreground);
      font-family:var(--mono);
      font-size:11px;
    }
    .chart{width:100%;min-height:260px;overflow:hidden}
    .table-wrap{overflow-x:auto}
    table{
      width:100%;
      border-collapse:collapse;
      font-size:14px;
    }
    th,td{
      padding:12px 14px;
      border-bottom:1px solid rgba(13,148,136,.18);
      text-align:left;
      white-space:nowrap;
    }
    th{
      color:#315D59;
      background:#E7F9F5;
      font-size:12px;
      font-weight:600;
      letter-spacing:.035em;
    }
    tbody tr{transition:background-color .2s ease}
    tbody tr:hover{background:#F3FCFA}
    td.num{
      text-align:right;
      font-family:var(--mono);
      font-size:12px;
      font-weight:600;
      font-variant-numeric:tabular-nums;
    }
    td.code,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
    .tag{
      display:inline-flex;
      align-items:center;
      gap:5px;
      padding:3px 8px;
      border:1px solid currentColor;
      border-radius:999px;
      font-size:11px;
      font-weight:600;
      line-height:1.2;
    }
    .tag:before{font-size:10px}
    .t-ok{color:#076C4D;background:#E8F8F1}.t-ok:before{content:"✓"}
    .t-warn{color:#8A4D00;background:#FFF5DD}.t-warn:before{content:"!"}
    .t-bad{color:#A11414;background:#FDECEC}.t-bad:before{content:"×"}
    .t-info{color:#075985;background:#E8F6FC}.t-info:before{content:"i"}
    .bar{
      height:8px;
      min-width:76px;
      border:1px solid rgba(13,148,136,.18);
      background:#E5F1EF;
      border-radius:999px;
      overflow:hidden;
    }
    .bar>i{
      display:block;
      height:100%;
      background:var(--color-primary);
      border-radius:inherit;
    }
    .mini{display:flex;flex-direction:column;gap:12px}
    .mrow{display:flex;align-items:center;gap:10px}
    .mn{width:76px;flex:0 0 auto;color:var(--color-muted-foreground);font-size:13px}
    .mv{
      width:52px;
      flex:0 0 auto;
      text-align:right;
      font-family:var(--mono);
      font-size:12px;
      font-weight:600;
    }
    .flt{display:flex;gap:8px;flex-wrap:wrap;margin:-8px 0 16px}
    .pill{
      padding:6px 10px;
      border:1px solid rgba(13,148,136,.32);
      color:#315D59;
      background:#fff;
      border-radius:2px;
      font-size:12px;
    }
    .ins{
      display:flex;
      align-items:flex-start;
      gap:12px;
      margin-bottom:16px;
      padding:15px;
      color:#163F3C;
      background:#FFF8E8;
      border:1px solid rgba(217,119,6,.35);
      border-left:4px solid var(--color-accent);
      border-radius:3px;
    }
    .ins .ms{flex:0 0 auto;color:#9A5500}
    .it{font-weight:600}
    .id{margin-top:3px;color:#52605F;font-size:13px}
    .ti{
      margin-bottom:9px;
      padding:11px;
      border:1px solid rgba(13,148,136,.23);
      border-left:3px solid var(--color-primary);
      background:#F8FEFC;
      border-radius:2px;
    }
    .tt{font-weight:600;font-size:13px}
    .tm{margin-top:3px;color:var(--color-muted-foreground);font-size:12px}
    .tl{position:relative;padding-left:22px}
    .tl:before{
      content:"";
      position:absolute;
      left:6px;
      top:4px;
      bottom:4px;
      width:1px;
      background:rgba(13,148,136,.35);
    }
    .tlr{position:relative;padding:0 0 19px 9px}
    .tlr:before{
      content:"";
      position:absolute;
      left:-20px;
      top:4px;
      width:9px;
      height:9px;
      border:2px solid #fff;
      border-radius:50%;
      background:var(--color-primary);
      box-shadow:0 0 0 2px var(--color-primary);
    }
    .tw{color:var(--color-muted-foreground);font-family:var(--mono);font-size:11px}
    .th2{margin:3px 0;font-weight:600}
    .td{color:var(--color-muted-foreground);font-size:13px}
    .lgd{
      display:flex;
      flex-wrap:wrap;
      gap:14px;
      margin-top:5px;
      color:var(--color-muted-foreground);
      font-size:12px;
    }
    .lgd i{
      width:10px;
      height:10px;
      margin-right:5px;
      display:inline-block;
      border-radius:1px;
      vertical-align:middle;
    }
    .footn{
      padding:8px 16px 28px;
      color:#526B68;
      text-align:center;
      font-family:var(--mono);
      font-size:11px;
    }
    .grid-item{animation:enter .42s cubic-bezier(.2,.8,.25,1) both}
    .grid-item:nth-child(2){animation-delay:.06s}
    .grid-item:nth-child(3){animation-delay:.12s}
    .grid-item:nth-child(4){animation-delay:.18s}
    @keyframes enter{
      from{opacity:0;transform:translateY(16px) scale(.96)}
      to{opacity:1;transform:none}
    }
    @media(max-width:1024px){
      .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
      .g21,.g12{grid-template-columns:1fr}
    }
    @media(max-width:768px){
      .topin{align-items:flex-start}
      .live{display:none}
      .g3,.g2{grid-template-columns:1fr}
      .scr-head{align-items:flex-start;flex-direction:column}
      .chip{margin-left:0}
    }
    @media(max-width:480px){
      body{font-size:15px}
      .topin{padding:12px 14px 10px}
      .logo{width:38px;height:38px;flex-basis:38px}
      .btitle{font-size:17px}
      .bsub{font-size:10px}
      .tabs{padding:0 14px 10px}
      .tabs button{min-width:43px;justify-content:center;padding:9px 11px}
      .tabs .lbl{display:none}
      main{padding:22px 14px}
      .g4{grid-template-columns:1fr}
      .ttl{font-size:30px}
      .card,.kpi{padding:15px}
      th,td{padding:11px 12px}
    }
    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*:before,*:after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
      }
      .grid-item{opacity:1;transform:none}
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="topin">
      <div class="brand">
        <div class="logo" aria-hidden="true"><span class="ms">insights</span></div>
        <div>
          <div class="btitle">跨廠/跨事業群經營分析系統</div>
          <div class="bsub">Cross-Plant Business Intelligence · 總經理室決策平台</div>
        </div>
      </div>
      <div class="live"><span class="dot"></span>資料同步 MES · ERP · APS｜今日 08:14</div>
    </div>
    <nav class="tabs" id="tabs" aria-label="主要畫面"></nav>
  </header>

  <main><div id="app"></div></main>
  <div class="footn">Jvision 系統 Demo · 純前端展示 · 全部為模擬資料</div>

  <script>
  (function(){
    "use strict";

    var TABS=[
      {ic:"dashboard",label:"集團總覽"},
      {ic:"factory",label:"跨廠產能"},
      {ic:"account_tree",label:"事業群損益"},
      {ic:"insights",label:"產品線獲利"},
      {ic:"rule",label:"指標治理"},
      {ic:"receipt_long",label:"資源調度"}
    ];
    var PLANTS=[
      {p:"台中一廠",bg:"精密機械",rev:2840,gm:23.4,util:91,oee:84,cash:"良好",s:"ok"},
      {p:"台南二廠",bg:"精密機械",rev:2180,gm:19.1,util:78,oee:71,cash:"偏緊",s:"warn"},
      {p:"高雄三廠",bg:"車用電子",rev:3120,gm:27.8,util:94,oee:88,cash:"良好",s:"ok"},
      {p:"桃園四廠",bg:"車用電子",rev:1560,gm:14.6,util:63,oee:59,cash:"吃緊",s:"bad"},
      {p:"竹北五廠",bg:"半導體封測",rev:3980,gm:31.2,util:96,oee:90,cash:"良好",s:"ok"},
      {p:"嘉義六廠",bg:"半導體封測",rev:1240,gm:16.9,util:71,oee:66,cash:"偏緊",s:"warn"}
    ];
    var app=document.getElementById("app");
    var tabsEl=document.getElementById("tabs");
    var charts=[];
    var axisStyle={colors:"#475569",fontSize:"12px",fontFamily:"Crimson Pro"};

    function el(id){return document.getElementById(id)}
    function clearCharts(){
      charts.forEach(function(c){try{c.destroy()}catch(e){}});
      charts=[];
    }
    function grid(){return{borderColor:"#CDE8E3",strokeDashArray:3}}
    function chart(id,opt){
      var node=el(id);
      if(!node||typeof ApexCharts==="undefined")return;
      opt.chart=opt.chart||{};
      opt.chart.redrawOnParentResize=false;
      opt.chart.redrawOnWindowResize=false;
      opt.chart.animations={enabled:false};
      opt.chart.toolbar={show:false};
      opt.chart.background="transparent";
      opt.theme={mode:"light"};
      opt.tooltip=opt.tooltip||{};
      opt.tooltip.theme="light";
      var c=new ApexCharts(node,opt);
      c.render();
      charts.push(c);
    }
    function tag(s,label){
      return '<span class="tag t-'+s+'">'+(label||(s==="ok"?"正常":s==="warn"?"關注":"預警"))+'</span>';
    }
    function head(title,sub,chip){
      return '<div class="scr-head"><div><div class="ttl">'+title+'</div><div class="sub">'+sub+'</div></div><span class="chip">'+chip+'</span></div>';
    }
    function kpis(items){
      var h='<div class="grid g'+items.length+'">';
      items.forEach(function(k){
        h+='<article class="kpi grid-item"><div class="kl"><span class="ms" aria-hidden="true">'+k.ic+'</span>'+k.l+'</div><div class="kv"'+(k.small?' style="font-size:22px"':'')+'>'+k.v+' <small>'+k.u+'</small></div>'+(k.d?'<div class="kd '+(k.up===false?"down":"up")+'"><span class="ms" aria-hidden="true">'+(k.up===false?"trending_down":"trending_up")+'</span>'+k.d+'</div>':'')+'</article>';
      });
      return h+'</div>';
    }
    function card(title,icon,body,extra){
      return '<section class="card grid-item '+(extra||'')+'"><div class="ch"><span class="ms" aria-hidden="true">'+icon+'</span><h3>'+title+'</h3></div>'+body+'</section>';
    }
    function activateGrid(){
      app.querySelectorAll(".card,.kpi").forEach(function(n){n.classList.add("grid-item")});
    }

    function s0(){
      var h=head("集團經營總覽","6 廠 · 3 事業群 · 統一口徑即時彙總","口徑 v2.4 · 資料延遲 12 分");
      h+=kpis([
        {ic:"payments",l:"集團月營收",v:"149.2",u:"億",d:"+6.3% MoM"},
        {ic:"trending_up",l:"合併毛利率",v:"24.8",u:"%",d:"+1.4pt vs 目標"},
        {ic:"factory",l:"平均產能利用率",v:"82.2",u:"%",d:"-2.1pt 落後廠拖累",up:false},
        {ic:"warning",l:"待決策議題",v:"7",u:"件",d:"3 件現金流相關",up:false}
      ]);
      h+='<div class="grid g21" style="margin-top:16px">';
      h+=card("集團營收與毛利率趨勢","show_chart",'<div id="c0a" class="chart"></div>');
      h+=card("事業群營收占比","donut_small",'<div id="c0b" class="chart"></div>');
      h+='</div><div class="grid g12" style="margin-top:16px">';
      var mini='<div class="mini">';
      PLANTS.filter(function(x){return x.s!=="ok"}).forEach(function(x){
        mini+='<div class="mrow"><span class="mn" style="width:auto">'+x.p+'</span><div class="bar" style="flex:1"><i style="width:'+x.util+'%"></i></div><span class="mv">'+x.util+'%</span>'+tag(x.s)+'</div>';
      });

      chart("c5a",{chart:{type:"bar",height:300},series:[{name:"調度前",data:[91,78,94,63,96,71]},{name:"調度後",data:[91,84,90,78,96,80]}],colors:["#64748B","#0D9488"],plotOptions:{bar:{columnWidth:"60%",borderRadius:2}},dataLabels:{enabled:false},grid:grid(),xaxis:{categories:PLANTS.map(function(x){return x.p}),labels:{style:axisStyle,rotate:-30}},yaxis:{max:100,labels:{style:axisStyle,formatter:function(v){return v+"%"}}},legend:{labels:{colors:"#475569"}}});
    }

    var screens=[s0,s1,s2,s3,s4,s5];

    function show(index){
      clearCharts();
      var i=Math.max(0,Math.min(index,screens.length-1));
      tabsEl.querySelectorAll("[data-i]").forEach(function(btn){
        var active=Number(btn.getAttribute("data-i"))===i;
        btn.classList.toggle("on",active);
        btn.setAttribute("aria-selected",active?"true":"false");
        btn.tabIndex=active?0:-1;
      });
      screens[i]();
      activateGrid();
    }

    function fromHash(){
      var match=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
      show(match?Number(match[1]):0);
      try{window.scrollTo({top:0,behavior:"auto"})}catch(e){window.scrollTo(0,0)}
    }

    (function buildTabs(){
      var html="";
      TABS.forEach(function(tab,i){
        html+='<button type="button" role="tab" data-i="'+i+'" aria-label="'+tab.label+'"><span class="ms" aria-hidden="true">'+tab.ic+'</span><span class="lbl">'+tab.label+'</span></button>';
      });
      tabsEl.innerHTML=html;
      tabsEl.querySelectorAll("[data-i]").forEach(function(btn){
        btn.addEventListener("click",function(){location.hash="v"+btn.getAttribute("data-i")});
        btn.addEventListener("keydown",function(e){
          if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight")return;
          e.preventDefault();
          var current=Number(btn.getAttribute("data-i"));
          var next=(current+(e.key==="ArrowRight"?1:-1)+TABS.length)%TABS.length;
          location.hash="v"+next;
          tabsEl.querySelector('[data-i="'+next+'"]').focus();
        });
      });
    })();

    window.__show=show;
    window.addEventListener("hashchange",fromHash);
    fromHash();
  })();
  </script>
</body>
