<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>健康自主管理平台 · 診所照護系統｜Jvision 系統 Demo</title>
<meta name="description" content="預約報到、電子病歷、診療醫囑、健保申報到回診追蹤的診所照護全流程（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
  :root{
    --amber:#a16207; --amber-d:#78500a; --gold:#eab308; --gold-l:#fde68a;
    --ink:#3b2c05; --body:#4b3f24; --muted:#8a7a52; --line:#ece3cf; --bg:#faf7ee;
    --card:#ffffff; --green:#15803d; --red:#dc2626; --blue:#2563eb; --purple:#7c3aed;
  }
  *{ box-sizing:border-box; } html,body{ margin:0; }
  body{ font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--body); -webkit-font-smoothing:antialiased; }
  .material-symbols-outlined{ font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; line-height:1; }
  /* top nav */
  .nav{ position:sticky; top:0; z-index:20; background:linear-gradient(120deg,#78500a,#a16207); color:#fff; padding:0 22px; display:flex; align-items:center; gap:18px; box-shadow:0 2px 14px rgba(120,80,10,.25); min-height:60px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:11px; padding:11px 0; min-width:0; }
  .brand .logo{ width:40px; height:40px; border-radius:12px; background:linear-gradient(135deg,var(--gold),#fbbf24); color:#5a3d05; display:grid; place-content:center; box-shadow:0 3px 8px rgba(0,0,0,.2); flex:none; }
  .brand .logo .material-symbols-outlined{ font-size:24px; }
  .brand b{ font-size:17px; font-weight:900; letter-spacing:.5px; display:block; }
  .brand span{ font-size:11px; color:#fde9b8; font-weight:600; }
  .tabs{ display:flex; gap:4px; flex-wrap:wrap; margin-left:6px; min-width:0; }
  .tabs button{ display:inline-flex; align-items:center; gap:7px; border:0; background:rgba(255,255,255,.08); color:#fbe9bf; font:inherit; font-size:13px; font-weight:700; padding:9px 14px; border-radius:10px; cursor:pointer; white-space:nowrap; flex:none; }
  .tabs button .material-symbols-outlined{ font-size:19px; }
  .tabs button:hover{ background:rgba(255,255,255,.18); color:#fff; }
  .tabs button.on{ background:#fff; color:var(--amber-d); box-shadow:0 3px 10px rgba(0,0,0,.18); }
  .nav .right{ margin-left:auto; display:flex; align-items:center; gap:14px; }
  .live{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:800; color:#fff; background:rgba(255,255,255,.14); border-radius:999px; padding:5px 12px; white-space:nowrap; }
  .live .dot{ width:8px; height:8px; border-radius:50%; background:#4ade80; animation:pulse 2s infinite; }
  @keyframes pulse{ 50%{ opacity:.3; transform:scale(.7); } }
  .ava{ width:34px; height:34px; border-radius:50%; background:var(--gold); color:#5a3d05; font-weight:900; display:grid; place-content:center; font-size:13px; flex:none; }
  /* body */
  .wrap{ max-width:1280px; margin:0 auto; padding:24px 22px 50px; min-width:0; }
  .vh{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:18px; flex-wrap:wrap; }
  .vh h2{ margin:0; font-size:22px; font-weight:900; color:var(--ink); display:flex; align-items:center; gap:9px; }
  .vh h2 .material-symbols-outlined{ color:var(--amber); font-size:26px; }
  .vh p{ margin:4px 0 0 35px; font-size:13px; color:var(--muted); }
  .btn{ display:inline-flex; align-items:center; gap:6px; height:38px; padding:0 16px; border-radius:10px; border:0; background:var(--amber); color:#fff; font:inherit; font-weight:800; font-size:13px; cursor:pointer; }
  .btn.ghost{ background:#fff; color:var(--amber); border:1px solid var(--line); }
  .btn .material-symbols-outlined{ font-size:18px; }
  /* kpis */
  .kpis{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px; }
  .kpi{ background:var(--card); border:1px solid var(--line); border-radius:15px; padding:15px 17px; border-left:5px solid var(--amber); min-width:0; }
  .kpi.g{ border-left-color:var(--gold); } .kpi.gr{ border-left-color:var(--green); } .kpi.rd{ border-left-color:var(--red); }
  .kpi .l{ font-size:12px; font-weight:700; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .kpi .l .material-symbols-outlined{ font-size:18px; color:var(--amber); }
  .kpi .v{ font-size:27px; font-weight:900; color:var(--ink); margin-top:6px; line-height:1.1; }
  .kpi .v small{ font-size:13px; color:var(--muted); font-weight:700; }
  .kpi .d{ font-size:12px; font-weight:800; color:var(--green); margin-top:5px; display:flex; align-items:center; gap:3px; }
  .kpi .d.dn{ color:var(--red); }
  /* grid & cards */
  .grid{ display:grid; gap:18px; min-width:0; } .grid>*{ min-width:0; }
  .g2{ grid-template-columns:2fr 1fr; } .g11{ grid-template-columns:1fr 1fr; } .g12{ grid-template-columns:1fr 2fr; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px 20px; min-width:0; }
  .card>h3{ margin:0 0 14px; font-size:15px; font-weight:800; color:var(--ink); display:flex; align-items:center; gap:8px; }
  .card>h3 .material-symbols-outlined{ color:var(--amber); font-size:20px; }
  .card>h3 .grow{ margin-left:auto; font-size:12px; font-weight:700; color:var(--amber); }
  .chart{ width:100%; }
  /* table */
  .scroll{ overflow-x:auto; }
  .tbl{ width:100%; border-collapse:collapse; font-size:13px; }
  .tbl th{ text-align:left; font-size:11px; color:var(--muted); font-weight:800; padding:11px 12px; border-bottom:2px solid var(--line); background:#faf6ea; white-space:nowrap; }
  .tbl td{ padding:11px 12px; border-bottom:1px solid var(--line); white-space:nowrap; color:var(--body); }
  .tbl tr:hover td{ background:#fdfbf3; }
  .tbl b{ color:var(--ink); }
  .tag{ font-size:11px; font-weight:800; border-radius:999px; padding:2px 10px; white-space:nowrap; display:inline-block; }
  .t-gold{ background:#fef3c7; color:#92400e; } .t-green{ background:#dcfce7; color:#166534; } .t-red{ background:#fee2e2; color:#991b1b; }
  .t-blue{ background:#dbeafe; color:#1e40af; } .t-gray{ background:#f1f5f9; color:#64748b; } .t-purple{ background:#ede9fe; color:#6d28d9; }
  /* queue board (screen0) */
  .qboard{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .qcol{ background:#faf6ea; border:1px solid var(--line); border-radius:14px; padding:12px; min-width:0; }
  .qcol h4{ margin:0 0 10px; font-size:13px; font-weight:800; color:var(--ink); display:flex; align-items:center; justify-content:space-between; }
  .qcol h4 .cnt{ font-size:11px; background:var(--amber); color:#fff; border-radius:999px; padding:1px 8px; }
  .qcard{ background:#fff; border:1px solid var(--line); border-radius:11px; padding:10px 11px; margin-bottom:9px; border-left:4px solid var(--gold); }
  .qcard.now{ border-left-color:var(--green); box-shadow:0 0 0 2px #dcfce7; }
  .qcard.late{ border-left-color:var(--red); }
  .qcard .no{ font-size:19px; font-weight:900; color:var(--amber-d); }
  .qcard .nm{ font-size:13px; font-weight:700; color:var(--ink); margin-top:2px; }
  .qcard .mt{ font-size:11px; color:var(--muted); margin-top:3px; display:flex; justify-content:space-between; gap:6px; }
  /* vitals (screen1) */
  .vgrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .vcell{ background:#faf6ea; border:1px solid var(--line); border-radius:13px; padding:13px 14px; text-align:center; min-width:0; }
  .vcell .ic{ width:38px; height:38px; margin:0 auto 6px; border-radius:11px; background:#fef3c7; color:var(--amber); display:grid; place-content:center; }
  .vcell .vv{ font-size:22px; font-weight:900; color:var(--ink); } .vcell .vv small{ font-size:12px; color:var(--muted); font-weight:700; }
  .vcell .ll{ font-size:12px; color:var(--muted); font-weight:700; margin-top:2px; }
  .vcell.warn{ background:#fef2f2; border-color:#fecaca; } .vcell.warn .ic{ background:#fee2e2; color:var(--red); }
  .patient{ display:flex; gap:16px; align-items:center; padding:4px 0 14px; border-bottom:1px dashed var(--line); margin-bottom:16px; flex-wrap:wrap; }
  .patient .pic{ width:58px; height:58px; border-radius:16px; background:linear-gradient(135deg,var(--gold),#fbbf24); color:#5a3d05; display:grid; place-content:center; font-size:26px; font-weight:900; flex:none; }
  .patient .pn{ font-size:18px; font-weight:900; color:var(--ink); }
  .patient .pd{ font-size:12px; color:var(--muted); margin-top:3px; }
  .chips{ display:flex; gap:6px; flex-wrap:wrap; margin-left:auto; }
  /* timeline */
  .tl{ position:relative; padding-left:22px; }
  .tl::before{ content:""; position:absolute; left:6px; top:4px; bottom:4px; width:2px; background:var(--line); }
  .tl .it{ position:relative; padding:0 0 16px; }
  .tl .it::before{ content:""; position:absolute; left:-19px; top:3px; width:11px; height:11px; border-radius:50%; background:var(--amber); border:2px solid #fff; box-shadow:0 0 0 2px var(--gold-l); }
  .tl .it .tt{ font-size:13px; font-weight:800; color:var(--ink); }
  .tl .it .dd{ font-size:12px; color:var(--muted); margin-top:2px; line-height:1.5; }
  .tl .it .dt{ font-size:11px; color:var(--amber); font-weight:700; }
  /* order rows (screen2) */
  .rx{ display:flex; align-items:center; gap:11px; padding:11px 12px; border:1px solid var(--line); border-radius:12px; margin-bottom:9px; background:#fff; min-width:0; }
  .rx .rxic{ width:36px; height:36px; border-radius:10px; background:#fef3c7; color:var(--amber); display:grid; place-content:center; flex:none; }
  .rx .rxn{ font-weight:800; color:var(--ink); font-size:14px; } .rx .rxs{ font-size:12px; color:var(--muted); }
  .rx .rxr{ margin-left:auto; text-align:right; } .rx .rxr b{ font-size:13px; color:var(--ink); }
  .seg{ display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  .seg .s{ font-size:12px; font-weight:800; padding:7px 14px; border-radius:999px; background:#faf6ea; color:var(--muted); border:1px solid var(--line); }
  .seg .s.on{ background:var(--amber); color:#fff; border-color:var(--amber); }
  /* claim bars (screen3) */
  .prog{ height:9px; border-radius:999px; background:#f1e9d6; overflow:hidden; min-width:70px; }
  .prog span{ display:block; height:100%; border-radius:999px; }
  .barrow{ display:grid; grid-template-columns:130px 1fr 54px; align-items:center; gap:12px; margin-bottom:13px; }
  .barrow .bl{ font-size:13px; font-weight:700; color:var(--ink); } .barrow .bv{ font-size:13px; font-weight:800; color:var(--amber-d); text-align:right; }
  /* calendar (screen4) */
  .cal{ display:grid; grid-template-columns:repeat(7,1fr); gap:7px; }
  .cal .hd{ font-size:11px; font-weight:800; color:var(--muted); text-align:center; padding-bottom:2px; }
  .day{ background:#faf6ea; border:1px solid var(--line); border-radius:10px; min-height:74px; padding:6px 7px; min-width:0; }
  .day .dn{ font-size:12px; font-weight:800; color:var(--ink); }
  .day.off{ opacity:.4; } .day.today{ border-color:var(--amber); box-shadow:0 0 0 2px var(--gold-l); }
  .pill{ font-size:10px; font-weight:800; border-radius:5px; padding:1px 5px; margin-top:3px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .p-a{ background:#dcfce7; color:#166534; } .p-b{ background:#fef3c7; color:#92400e; } .p-c{ background:#fee2e2; color:#991b1b; }
  /* stock (screen5) */
  .stk{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .stkc{ background:#faf6ea; border:1px solid var(--line); border-radius:14px; padding:14px; border-top:4px solid var(--green); min-width:0; }
  .stkc.low{ border-top-color:var(--gold); } .stkc.crit{ border-top-color:var(--red); }
  .stkc .sh{ display:flex; justify-content:space-between; align-items:center; gap:6px; }
  .stkc .sn{ font-size:14px; font-weight:800; color:var(--ink); } .stkc .sc{ font-size:11px; color:var(--muted); margin-top:2px; }
  .stkc .sbar{ height:8px; border-radius:999px; background:#eadfc7; margin:10px 0 6px; overflow:hidden; }
  .stkc .sbar span{ display:block; height:100%; }
  .stkc .sfoot{ display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:var(--body); gap:6px; }
  .note{ font-size:12px; color:var(--muted); margin-top:8px; }
  @media (max-width:820px){
    .kpis{ grid-template-columns:1fr 1fr; }
    .g2,.g11,.g12{ grid-template-columns:1fr; }
    .qboard{ grid-template-columns:1fr 1fr; }
    .vgrid{ grid-template-columns:1fr 1fr; }
    .stk{ grid-template-columns:1fr; }
    .vh p{ margin-left:0; }
  }
  @media (max-width:560px){
    .tabs button span.lbl{ display:none; }
    .tabs button{ padding:9px 11px; }
    .qboard{ grid-template-columns:1fr; }
    .brand span{ display:none; }
    .wrap{ padding:18px 13px 40px; }
  }
</style>
</head>
<body>
<nav class="nav">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">health_and_safety</span></div>
    <div><b>健康自主管理平台</b><span>Self-Care Clinic Platform</span></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="right">
    <span class="live"><span class="dot"></span>看診中</span>
    <div class="ava">護</div>
  </div>
</nav>
<div class="wrap"><div id="screen"></div></div>

<script>
"use strict";
var C = document.getElementById("screen");
var charts = [];
function clearCharts(){ for(var i=0;i<charts.length;i++){ try{ charts[i].destroy(); }catch(e){} } charts = []; }

var NAV = [
  { icon:"event_available", label:"預約報到" },
  { icon:"folder_shared",   label:"電子病歷" },
  { icon:"stethoscope",     label:"診療醫囑" },
  { icon:"receipt_long",    label:"健保申報" },
  { icon:"cardiology",      label:"回診追蹤" },
  { icon:"inventory_2",     label:"藥材庫存" }
];
(function(){
  var t = document.getElementById("tabs"), h = "";
  for(var i=0;i<NAV.length;i++){
    h += '<button data-i="'+i+'"><span class="material-symbols-outlined">'+NAV[i].icon+'</span><span class="lbl">'+NAV[i].label+'</span></button>';
  }
  t.innerHTML = h;
  t.addEventListener("click", function(e){
    var b = e.target.closest("[data-i]"); if(!b) return;
    show(+b.getAttribute("data-i"));
    try{ window.scrollTo(0,0); }catch(err){}
  });
})();

function kpi(cls,ic,l,v,unit,d,dn){
  return '<div class="kpi '+cls+'"><div class="l"><span class="material-symbols-outlined">'+ic+'</span>'+l+'</div>'+
    '<div class="v">'+v+(unit?' <small>'+unit+'</small>':'')+'</div>'+
    (d?'<div class="d'+(dn?' dn':'')+'"><span class="material-symbols-outlined" style="font-size:15px">'+(dn?'trending_down':'trending_up')+'</span>'+d+'</div>':'')+'</div>';
}
function vh(ic,title,sub,btn){
  return '<div class="vh"><div><h2><span class="material-symbols-outlined">'+ic+'</span>'+title+'</h2><p>'+sub+'</p></div>'+
    (btn?'<button class="btn"><span class="material-symbols-outlined">'+btn.ic+'</span>'+btn.t+'</button>':'')+'</div>';
}

/* ================= SCREEN 0 : 預約報到 (queue board + charts) ================= */
function s0(){
  var cols = [
    { t:"已報到候診", rows:[
      { no:"A-08", nm:"陳美玲", dr:"家醫 · 王志明", tm:"09:20", st:"now" },
      { no:"A-09", nm:"林建宏", dr:"家醫 · 王志明", tm:"09:35", st:"" },
      { no:"A-10", nm:"黃淑芬", dr:"家醫 · 王志明", tm:"09:50", st:"" }
    ]},
    { t:"待報到", rows:[
      { no:"B-03", nm:"吳承恩", dr:"復健 · 李慧君", tm:"10:00", st:"" },
      { no:"B-04", nm:"張雅婷", dr:"復健 · 李慧君", tm:"10:15", st:"" },
      { no:"C-01", nm:"劉俊傑", dr:"內科 · 周文彬", tm:"逾時 10:20", st:"late" }
    ]},
    { t:"檢查／處置", rows:[
      { no:"A-05", nm:"許雅雯", dr:"抽血室", tm:"09:05", st:"" },
      { no:"A-06", nm:"鄭家豪", dr:"心電圖室", tm:"09:12", st:"" }
    ]},
    { t:"完診結帳", rows:[
      { no:"A-01", nm:"謝宗翰", dr:"待結帳", tm:"08:50", st:"" },
      { no:"A-02", nm:"洪詩涵", dr:"待領藥", tm:"08:58", st:"" },
      { no:"A-03", nm:"曾冠宇", dr:"已完成", tm:"09:04", st:"" }
    ]}
  ];
  var boardH = "";
  for(var i=0;i<cols.length;i++){
    var c = cols[i], rowsH = "";
    for(var j=0;j<c.rows.length;j++){
      var r = c.rows[j];
      rowsH += '<div class="qcard '+r.st+'"><div class="no">'+r.no+'</div><div class="nm">'+r.nm+'</div>'+
        '<div class="mt"><span>'+r.dr+'</span><span>'+r.tm+'</span></div></div>';
    }
    boardH += '<div class="qcol"><h4>'+c.t+'<span class="cnt">'+c.rows.length+'</span></h4>'+rowsH+'</div>';
  }
  var html = vh("event_available","預約報到與候診分流","即時候診看板 · 依科別與醫師分流叫號，逾時自動標示",{ic:"add",t:"新增掛號"});
  html += '<div class="kpis">'+
    kpi("","groups","今日預約","186","人","+12 vs 昨日")+
    kpi("g","hourglass_top","目前候診","23","人","平均等候 11 分",true)+
    kpi("gr","how_to_reg","已報到率","92","%","已報到 171 人")+
    kpi("rd","running_with_errors","逾時未到","4","人","已發送提醒簡訊",true)+
    '</div>';
  html += '<div class="card" style="margin-bottom:18px"><h3><span class="material-symbols-outlined">view_kanban</span>候診叫號看板<span class="grow">即時更新</span></h3><div class="scroll"><div class="qboard" style="min-width:720px">'+boardH+'</div></div></div>';
  html += '<div class="grid g2">'+
    '<div class="card"><h3><span class="material-symbols-outlined">bar_chart</span>各時段掛號量</h3><div id="c0a" class="chart"></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>科別掛號占比</h3><div id="c0b" class="chart"></div></div>'+
    '</div>';
  C.innerHTML = html;
  void C.offsetHeight;
  charts.push(new ApexCharts(document.querySelector("#c0a"), {
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false}, type:"bar", height:270, toolbar:{show:false}, redrawOnParentResize:false, redrawOnWindowResize:false, animations:{enabled:false} },
    series:[{ name:"掛號人數", data:[28,42,35,18,31,26,6] }],
    colors:["#a16207"],
    plotOptions:{ bar:{ borderRadius:6, columnWidth:"55%" } },
    dataLabels:{ enabled:false },
    xaxis:{ categories:["08時","09時","10時","11時","14時","15時","16時"], labels:{ style:{ colors:"#8a7a52" } } },
    yaxis:{ labels:{ style:{ colors:"#8a7a52" } } },
    grid:{ borderColor:"#ece3cf" }
  }));
  charts[charts.length-1].render();
  charts.push(new ApexCharts(document.querySelector("#c0b"), {
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false}, type:"donut", height:270, redrawOnParentResize:false, redrawOnWindowResize:false, animations:{enabled:false} },
    series:[64,38,29,21,34],
    labels:["家庭醫學","內科","復健科","小兒科","其他"],
    colors:["#a16207","#eab308","#d97706","#facc15","#e0c98a"],
    legend:{ position:"bottom", labels:{ colors:"#4b3f24" } },
    dataLabels:{ enabled:true, style:{ fontSize:"11px" } },
    plotOptions:{ pie:{ donut:{ size:"60%" } } }
  }));
  charts[charts.length-1].render();
}

/* ================= SCREEN 1 : 電子病歷 (patient + vitals + timeline + trend) ================= */
function s1(){

var SCREENS = [s0,s1,s2,s3,s4,s5];
function show(i){
  clearCharts();
  var tabs = document.querySelectorAll("[data-i]");
  for(var t=0;t<tabs.length;t++){ tabs[t].classList.toggle("on", +tabs[t].getAttribute("data-i")===i); }
  SCREENS[i]();
}

show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
