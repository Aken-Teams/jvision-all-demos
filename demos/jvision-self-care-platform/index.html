<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>美容業預約與門市管理｜Jvision 系統 Demo</title>
<meta name="description" content="預約報到、電子病歷、診療醫囑、健保申報到回診追蹤的門市照護全流程（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0891B2;
  --color-on-primary:#000000;
  --color-secondary:#22D3EE;
  --color-on-secondary:#0F172A;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#ECFEFF;
  --color-foreground:#164E63;
  --color-card:#FFFFFF;
  --color-card-foreground:#164E63;
  --color-muted:#E8F1F6;
  --color-muted-foreground:#475569;
  --color-border:#A5F3FC;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0891B2;
  --blue:#0891B2;
  --ink:#164E63;
  --muted:#475569;
  --line:#A5F3FC;
  --green:#047857;
  --red:#B91C1C;
  --amber:#A16207;
  --purple:#6D28D9;
  --shadow-raised:-5px -5px 15px rgba(255,255,255,.92),5px 5px 15px rgba(8,145,178,.13);
  --shadow-soft:-3px -3px 9px rgba(255,255,255,.9),3px 3px 9px rgba(8,145,178,.11);
  --shadow-inset:inset 2px 2px 5px rgba(8,145,178,.1),inset -2px -2px 5px rgba(255,255,255,.9);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  font-family:"Atkinson Hyperlegible","Microsoft JhengHei",sans-serif;
  color:var(--color-foreground);
  background:
    radial-gradient(circle at 5% 0,rgba(34,211,238,.12),transparent 24rem),
    linear-gradient(145deg,#f7ffff 0,var(--color-background) 48%,#e5f9fb 100%);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,[data-i]{cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
  line-height:1;
}
.nav{
  position:sticky;
  top:0;
  z-index:20;
  min-height:72px;
  padding:10px clamp(14px,2.5vw,34px);
  display:flex;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
  color:var(--ink);
  background:rgba(236,254,255,.94);
  border-bottom:1px solid rgba(165,243,252,.9);
  box-shadow:0 8px 28px rgba(8,145,178,.1);
  backdrop-filter:blur(18px);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:218px;
}
.logo{
  width:44px;
  height:44px;
  display:grid;
  place-items:center;
  flex:none;
  border:1px solid rgba(255,255,255,.9);
  border-radius:14px;
  color:#075E74;
  background:linear-gradient(145deg,#d9fbff,#fff);
  box-shadow:var(--shadow-raised);
}
.logo .material-symbols-outlined{font-size:25px}
.brand b{
  display:block;
  color:#0E566C;
  font-size:17px;
  font-weight:700;
  letter-spacing:.04em;
}
.brand span{
  display:block;
  margin-top:2px;
  color:var(--muted);
  font-size:11px;
  letter-spacing:.05em;
}
.tabs{
  display:flex;
  align-items:center;
  gap:7px;
  min-width:0;
  flex:1;
}
.tabs button{
  min-height:42px;
  padding:9px 12px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  flex:none;
  border:1px solid transparent;
  border-radius:13px;
  color:#315F6F;
  background:var(--color-muted);
  box-shadow:var(--shadow-soft);
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
  transition:transform 150ms ease,box-shadow 150ms ease,color 150ms ease,background 150ms ease;
}
.tabs button:hover{
  color:#075E74;
  background:#F6FFFF;
  transform:translateY(-1px);
}
.tabs button:active{
  transform:translateY(1px);
  box-shadow:var(--shadow-inset);
}
.tabs button.on{
  color:#003D4A;
  border-color:#67E8F9;
  background:linear-gradient(145deg,#84EAF5,#55D9E9);
  box-shadow:inset -2px -2px 5px rgba(255,255,255,.55),inset 2px 2px 5px rgba(8,145,178,.11),3px 3px 10px rgba(8,145,178,.17);
}
.tabs button .material-symbols-outlined{font-size:19px}
.right{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:12px;
}
.live{
  min-height:34px;
  padding:6px 12px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  border:1px solid #99F6E4;
  border-radius:999px;
  color:#065F46;
  background:#ECFDF5;
  box-shadow:var(--shadow-soft);
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
}
.live .dot{
  width:9px;
  height:9px;
  border:2px solid #047857;
  border-radius:50%;
  background:#A7F3D0;
  animation:pulse 2s ease-in-out infinite;
}
.ava{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  flex:none;
  border:1px solid #67E8F9;
  border-radius:50%;
  color:#064E3B;
  background:linear-gradient(145deg,#99F6E4,#D1FAE5);
  box-shadow:var(--shadow-soft);
  font-size:13px;
  font-weight:700;
}
.wrap{
  width:min(100%,1340px);
  margin:0 auto;
  padding:30px clamp(14px,2.5vw,32px) 56px;
}
.vh{
  margin-bottom:22px;
  padding:6px 2px;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
}
.vh h2{
  margin:0;
  display:flex;
  align-items:center;
  gap:10px;
  color:#104F62;
  font-size:clamp(22px,3vw,29px);
  font-weight:700;
  line-height:1.15;
}
.vh h2 .material-symbols-outlined{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border-radius:13px;
  color:#075E74;
  background:var(--color-muted);
  box-shadow:var(--shadow-soft);
  font-size:24px;
}
.vh p{
  margin:7px 0 0 52px;
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
}
.btn{
  min-height:44px;
  padding:0 18px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  border:1px solid #047857;
  border-radius:14px;
  color:#FFFFFF;
  background:linear-gradient(145deg,#059669,#047857);
  box-shadow:-4px -4px 12px rgba(255,255,255,.8),5px 5px 14px rgba(5,150,105,.22);
  font-size:14px;
  font-weight:700;
  transition:transform 150ms ease,box-shadow 150ms ease,filter 150ms ease;
}
.btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn:active{transform:translateY(1px);box-shadow:inset 2px 2px 6px rgba(0,0,0,.18)}
.btn .material-symbols-outlined{font-size:19px}
.kpis{
  margin-bottom:20px;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:16px;
}
.kpi,.card{
  border:1px solid rgba(165,243,252,.88);
  color:var(--color-card-foreground);
  background:linear-gradient(145deg,rgba(255,255,255,.98),rgba(241,252,253,.98));
  box-shadow:var(--shadow-raised);
}
.kpi{
  position:relative;
  min-width:0;
  overflow:hidden;
  padding:17px 18px 16px;
  border-radius:16px;
}
.kpi::after{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:5px;
  background:var(--color-primary);
}
.kpi.g::after{background:#B7791F}
.kpi.gr::after{background:var(--green)}
.kpi.rd::after{background:var(--red)}
.kpi .l{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}
.kpi .l .material-symbols-outlined{color:#087C98;font-size:19px}
.kpi .v{
  margin-top:8px;
  color:#123F4E;
  font-size:29px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  line-height:1;
}
.kpi .v small{color:var(--muted);font-size:13px;font-weight:700}
.kpi .d{
  margin-top:7px;
  display:flex;
  align-items:center;
  gap:4px;
  color:#047857;
  font-size:12px;
  font-weight:700;
}
.kpi .d.dn{color:#A61B1B}
.grid{display:grid;gap:18px;min-width:0}
.grid>*{min-width:0}
.g2{grid-template-columns:2fr 1fr}
.g11{grid-template-columns:1fr 1fr}
.g12{grid-template-columns:1fr 2fr}
.card{
  min-width:0;
  padding:20px;
  border-radius:18px;
}
.card>h3{
  margin:0 0 16px;
  display:flex;
  align-items:center;
  gap:8px;
  color:#104F62;
  font-size:16px;
  font-weight:700;
}
.card>h3 .material-symbols-outlined{color:#087C98;font-size:21px}
.card>h3 .grow{
  margin-left:auto;
  color:#087C98;
  font-size:12px;
  font-weight:700;
}
.chart{width:100%}
.scroll{
  overflow-x:auto;
  scrollbar-color:#67E8F9 transparent;
  scrollbar-width:thin;
}
.tbl{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  font-size:13px;
}
.tbl th{
  padding:12px;
  border-bottom:2px solid var(--line);
  color:#365A68;
  background:#E8F7F9;
  font-size:12px;
  font-weight:700;
  text-align:left;
  white-space:nowrap;
}
.tbl th:first-child{border-radius:10px 0 0}
.tbl th:last-child{border-radius:0 10px 0 0}
.tbl td{
  padding:12px;
  border-bottom:1px solid #C9EEF2;
  color:#315563;
  white-space:nowrap;
}
.tbl tbody tr{transition:background 180ms ease}
.tbl tbody tr:hover td{background:#F2FCFD}
.tbl b{color:#123F4E}
.tbl td:first-child,.tbl td:nth-child(3),.tbl td:nth-child(4){
  font-variant-numeric:tabular-nums;
}
.tbl td:nth-child(4){text-align:right}
.tag{
  padding:4px 10px;
  display:inline-flex;
  align-items:center;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
}
.t-gold{color:#854D0E;background:#FEF9C3}
.t-green{color:#065F46;background:#D1FAE5}
.t-red{color:#991B1B;background:#FEE2E2}
.t-blue{color:#075985;background:#E0F2FE}
.t-gray{color:#475569;background:#F1F5F9}
.t-purple{color:#5B21B6;background:#EDE9FE}
.qboard{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}
.qcol{
  min-width:0;
  padding:13px;
  border:1px solid #BDEDF2;
  border-radius:15px;
  background:#EAF7F9;
  box-shadow:var(--shadow-inset);
}
.qcol h4{
  margin:0 0 11px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  color:#174C5D;
  font-size:13px;
  font-weight:700;
}
.qcol h4 .cnt{
  min-width:24px;
  padding:3px 8px;
  border-radius:999px;
  color:#003A45;
  background:#67E8F9;
  text-align:center;
  font-size:11px;
}
.qcard{
  margin-bottom:10px;
  padding:11px 12px;
  border:1px solid #C3EBEF;
  border-left:4px solid #0891B2;
  border-radius:12px;
  background:#FFF;
  box-shadow:0 3px 10px rgba(8,145,178,.08);
}
.qcard.now{border-left-color:#047857;background:#ECFDF5}
.qcard.late{border-left-color:#B91C1C;background:#FFF7F7}
.qcard .no{
  color:#075E74;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:19px;
  font-weight:700;
}
.qcard.now .no::after{
  content:" · 目前叫號";
  color:#047857;
  font-family:"Atkinson Hyperlegible",sans-serif;
  font-size:10px;
}
.qcard.late .no::after{
  content:" · 逾時";
  color:#B91C1C;
  font-family:"Atkinson Hyperlegible",sans-serif;
  font-size:10px;
}
.qcard .nm{margin-top:2px;color:#173F4C;font-size:13px;font-weight:700}
.qcard .mt{
  margin-top:4px;
  display:flex;
  justify-content:space-between;
  gap:7px;
  color:var(--muted);
  font-size:11px;
  font-variant-numeric:tabular-nums;
}
.vgrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:13px;
}
.vcell{
  min-width:0;
  padding:14px;
  border:1px solid #BDEDF2;
  border-radius:14px;
  background:#EAF7F9;
  box-shadow:var(--shadow-inset);
  text-align:center;
}
.vcell .ic{
  width:40px;
  height:40px;
  margin:0 auto 7px;
  display:grid;
  place-items:center;
  border-radius:12px;
  color:#075E74;
  background:#D6F6FA;
  box-shadow:var(--shadow-soft);
}
.vcell .vv{
  color:#123F4E;
  font-size:22px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.vcell .vv small{color:var(--muted);font-size:12px}
.vcell .ll{margin-top:3px;color:var(--muted);font-size:12px;font-weight:700}
.vcell.warn{border-color:#FCA5A5;background:#FEF2F2}
.vcell.warn .ic{color:#991B1B;background:#FEE2E2}
.vcell.warn .ll::after{content:" · 超出目標";color:#991B1B}
.patient{
  margin-bottom:17px;
  padding:4px 0 17px;
  display:flex;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
  border-bottom:1px dashed #99DDE5;
}
.patient .pic{
  width:60px;
  height:60px;
  display:grid;
  place-items:center;
  flex:none;
  border:1px solid #67E8F9;
  border-radius:17px;
  color:#075E74;
  background:linear-gradient(145deg,#CFFAFE,#A5F3FC);
  box-shadow:var(--shadow-soft);
  font-size:26px;
  font-weight:700;
}
.patient .pn{color:#123F4E;font-size:19px;font-weight:700}
.patient .pd{
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
  font-variant-numeric:tabular-nums;
}
.chips{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
.tl{position:relative;padding-left:24px}
.tl::before{
  content:"";
  position:absolute;
  top:4px;
  bottom:4px;
  left:7px;
  width:2px;
  background:#9DEAF1;
}
.tl .it{position:relative;padding:0 0 17px}
.tl .it::before{
  content:"";
  position:absolute;
  top:3px;
  left:-21px;
  width:11px;
  height:11px;
  border:3px solid #FFF;
  border-radius:50%;
  background:#0891B2;
  box-shadow:0 0 0 2px #67E8F9;
}
.tl .tt{color:#174555;font-size:13px;font-weight:700}
.tl .dd{margin-top:3px;color:var(--muted);font-size:12px;line-height:1.55}
.tl .dt{
  color:#087C98;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:11px;
  font-weight:700;
}
.rx{
  min-width:0;
  margin-bottom:10px;
  padding:12px 13px;
  display:flex;
  align-items:center;
  gap:11px;
  border:1px solid #BDEDF2;
  border-radius:13px;
  background:#F9FFFF;
  box-shadow:0 3px 10px rgba(8,145,178,.06);
}
.rx .rxic{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  flex:none;
  border-radius:11px;
  color:#075E74;
  background:#D9F7FA;
  box-shadow:var(--shadow-soft);
}
.rx .rxn{color:#173F4C;font-size:14px;font-weight:700}
.rx .rxs{color:var(--muted);font-size:12px}
.rx .rxr{margin-left:auto;text-align:right}
.rx .rxr b{
  color:#173F4C;
  font-size:13px;
  font-variant-numeric:tabular-nums;
}
.seg{
  margin-bottom:17px;
  padding:7px;
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  border:1px solid #BDEDF2;
  border-radius:15px;
  background:#EAF7F9;
  box-shadow:var(--shadow-inset);
}
.seg .s{
  padding:8px 15px;
  border:1px solid transparent;
  border-radius:11px;
  color:#45636E;
  font-size:12px;
  font-weight:700;
}
.seg .s.on{
  border-color:#67E8F9;
  color:#064E5C;
  background:#FFFFFF;
  box-shadow:var(--shadow-soft);
}
.prog{
  min-width:70px;
  height:10px;
  overflow:hidden;
  border:1px solid #C6EEF2;
  border-radius:999px;
  background:#E1F2F4;
  box-shadow:var(--shadow-inset);
}
.prog span{display:block;height:100%;border-radius:999px}
.barrow{
  margin-bottom:14px;
  display:grid;
  grid-template-columns:130px 1fr 54px;
  align-items:center;
  gap:12px;
}
.barrow .bl{color:#274D5A;font-size:13px;font-weight:700}
.barrow .bv{
  color:#075E74;
  font-size:13px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  text-align:right;
}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cal .hd{
  padding-bottom:3px;
  color:#47616B;
  font-size:11px;
  font-weight:700;
  text-align:center;
}
.day{
  min-width:0;
  min-height:76px;
  padding:7px 8px;
  border:1px solid #BDEDF2;
  border-radius:11px;
  background:#F8FFFF;
}
.day .dn{
  color:#244B59;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:12px;
  font-weight:700;
}
.day.off{opacity:.45}
.day.today{
  border:2px solid #0891B2;
  background:#ECFEFF;
  box-shadow:0 0 0 3px rgba(34,211,238,.2);
}
.day.today .dn::after{
  content:" 今日";
  color:#075E74;
  font-family:"Atkinson Hyperlegible",sans-serif;
  font-size:9px;
}
.pill{
  margin-top:4px;
  padding:3px 6px;
  display:block;
  overflow:hidden;
  border:1px solid currentColor;
  border-radius:6px;
  font-size:10px;
  font-weight:700;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.p-a{color:#065F46;background:#D1FAE5}
.p-b{color:#854D0E;background:#FEF9C3}
.p-c{color:#991B1B;background:#FEE2E2}
.stk{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}
.stkc{
  min-width:0;
  padding:15px;
  border:1px solid #BDEFD9;
  border-top:4px solid #047857;
  border-radius:15px;
  background:#F7FFFC;
  box-shadow:var(--shadow-soft);
}
.stkc.low{border-color:#FDE68A;border-top-color:#A16207;background:#FFFDF4}
.stkc.crit{border-color:#FCA5A5;border-top-color:#B91C1C;background:#FFF8F8}
.stkc .sh{display:flex;align-items:center;justify-content:space-between;gap:7px}
.stkc .sn{color:#173F4C;font-size:14px;font-weight:700}
.stkc .sc{
  margin-top:3px;
  color:var(--muted);
  font-size:11px;
  font-variant-numeric:tabular-nums;
}
.stkc .sbar{
  height:9px;
  margin:11px 0 7px;
  overflow:hidden;
  border-radius:999px;
  background:#DCEDEF;
  box-shadow:var(--shadow-inset);
}
.stkc .sbar span{display:block;height:100%;border-radius:999px}
.stkc .sfoot{
  display:flex;
  justify-content:space-between;
  gap:7px;
  color:#315563;
  font-size:12px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.note{
  margin-top:9px;
  padding:9px 11px;
  border-left:3px solid #0891B2;
  border-radius:0 8px 8px 0;
  color:#3C5F6B;
  background:#EFFBFC;
  font-size:12px;
  line-height:1.45;
}
.grid-item{animation:rise-in 420ms cubic-bezier(.2,.8,.2,1) both}
.grid-item:nth-child(2){animation-delay:60ms}
.grid-item:nth-child(3){animation-delay:120ms}
.grid-item:nth-child(4){animation-delay:180ms}
@keyframes rise-in{
  from{opacity:0;transform:translateY(12px) scale(.97)}
  to{opacity:1;transform:none}
}
@keyframes pulse{
  50%{opacity:.55;transform:scale(.78)}
}
@media(max-width:1100px){
  .nav{align-items:flex-start}
  .tabs{order:3;width:100%;overflow-x:auto;padding:2px 2px 6px}
  .right{margin-left:auto}
}
@media(max-width:820px){
  .kpis{grid-template-columns:1fr 1fr}
  .g2,.g11,.g12{grid-template-columns:1fr}
  .qboard{grid-template-columns:1fr 1fr}
  .vgrid{grid-template-columns:1fr 1fr}
  .stk{grid-template-columns:1fr}
  .vh p{margin-left:0}
}
@media(max-width:560px){
  .nav{gap:10px;padding:9px 13px}
  .brand{min-width:0;flex:1}
  .brand span{display:none}
  .right{gap:7px}
  .live{padding:6px 9px}
  .ava{width:35px;height:35px}
  .tabs button{min-width:44px;padding:9px 11px}
  .tabs button .lbl{display:none}
  .wrap{padding:22px 13px 42px}
  .vh{margin-bottom:18px}
  .vh h2{font-size:22px}
  .vh h2 .material-symbols-outlined{width:38px;height:38px}
  .btn{width:100%}
  .kpis{grid-template-columns:1fr}
  .qboard{grid-template-columns:1fr}
  .vgrid{grid-template-columns:1fr 1fr}
  .card{padding:16px}
  .barrow{grid-template-columns:106px 1fr 44px;gap:8px}
}
@media(max-width:390px){
  .vgrid{grid-template-columns:1fr}
  .brand b{font-size:15px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  .grid-item{animation:none!important}
}

(function(){

  for(var i=0;i<NAV.length;i++){
    h+='<button type="button" role="tab" aria-selected="false" aria-label="'+NAV[i].label+'" data-i="'+i+'"><span class="material-symbols-outlined" aria-hidden="true">'+NAV[i].icon+'</span><span class="lbl">'+NAV[i].label+'</span></button>';
  }
  t.innerHTML=h;
  t.addEventListener("click",function(e){
    var b=e.target.closest("[data-i]");
    if(!b)return;
    var i=+b.getAttribute("data-i");
    var next="#v"+i;
    if(location.hash!==next)location.hash=next;
    else show(i);
    try{window.scrollTo(0,0)}catch(err){}
  });
  t.addEventListener("keydown",function(e){
    if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft")return;
    var a=[].slice.call(t.querySelectorAll("[data-i]"));
    var current=a.indexOf(document.activeElement);
    if(current<0)return;
    e.preventDefault();
    var next=(current+(e.key==="ArrowRight"?1:-1)+a.length)%a.length;
    a[next].focus();
    a[next].click();
  });
})();

}

var SCREENS=[s0,s1,s2,s3,s4,s5],active=-1;
function show(i){
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  if(active===i&&C.children.length)return;
  active=i;
  clearCharts();
  var tabs=document.querySelectorAll("[data-i]");
  for(var t=0;t<tabs.length;t++){
    var on=+tabs[t].getAttribute("data-i")===i;
    tabs[t].classList.toggle("on",on);
    tabs[t].setAttribute("aria-selected",on?"true":"false");
    tabs[t].setAttribute("tabindex",on?"0":"-1");
  }
  SCREENS[i]();
}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  show(m?Math.min(+m[1],SCREENS.length-1):0);
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
