<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>研發專案管理系統</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#15803d;--accent2:#4ade80;--accent-soft:#dcfce7;
  --bg:#f0f4f1;--card:#ffffff;--ink:#14261a;--muted:#5b6b60;--line:#e2e8e4;
  --amber:#d97706;--red:#dc2626;--blue:#2563eb;--violet:#7c3aed;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);min-width:0;overflow-x:hidden;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.topnav{
  position:sticky;top:0;z-index:50;background:linear-gradient(90deg,#0f5c2c,#15803d);
  color:#fff;padding:0 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  box-shadow:0 2px 10px rgba(0,0,0,.12);min-width:0;
}
.brand{display:flex;align-items:center;gap:10px;padding:12px 0;min-width:0;}
.brand .logo{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;}
.brand .logo .material-symbols-outlined{font-size:22px;color:#fff;}
.brand b{font-size:16px;font-weight:800;letter-spacing:.5px;white-space:nowrap;}
.brand span{font-size:11px;color:var(--accent2);display:block;font-weight:600;}
.navwrap{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0;padding:6px 0;}
.navbtn{
  display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);border:0;color:#eafff0;
  padding:8px 13px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;
  transition:.15s;min-width:0;white-space:nowrap;
}
.navbtn .material-symbols-outlined{font-size:19px;}
.navbtn:hover{background:rgba(255,255,255,.18);}
.navbtn.active{background:#fff;color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.15);}
.usertag{display:flex;align-items:center;gap:8px;padding:6px 0;min-width:0;}
.usertag .av{width:30px;height:30px;border-radius:50%;background:var(--accent2);color:#0f5c2c;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px;}
.usertag small{font-size:12px;color:#dbeee1;white-space:nowrap;}
main{padding:20px;max-width:1360px;margin:0 auto;min-width:0;}
.head{margin-bottom:16px;min-width:0;}
.head h1{margin:0;font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px;}
.head h1 .material-symbols-outlined{color:var(--accent);font-size:26px;}
.head p{margin:6px 0 0;color:var(--muted);font-size:13.5px;}
.grid{display:grid;gap:14px;min-width:0;}
.kpis{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g2b{grid-template-columns:1.4fr 1fr;}
.g2c{grid-template-columns:1fr 1.5fr;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;box-shadow:0 1px 3px rgba(20,40,26,.04);}
.card h3{margin:0 0 12px;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
.card h3 .tag{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted);background:var(--bg);padding:3px 9px;border-radius:20px;white-space:nowrap;}
.kpi .lbl{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;}
.kpi .lbl .material-symbols-outlined{font-size:17px;color:var(--accent);}
.kpi .val{font-size:27px;font-weight:800;margin-top:8px;letter-spacing:-.5px;}
.kpi .val small{font-size:13px;color:var(--muted);font-weight:600;}
.kpi .delta{font-size:12px;font-weight:700;margin-top:5px;display:inline-flex;align-items:center;gap:3px;}
.kpi .delta .material-symbols-outlined{font-size:14px;}
.up{color:var(--accent);}.down{color:var(--red);}
.chartbox{position:relative;width:100%;overflow:hidden;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700;background:#f8faf9;}
td b{font-weight:700;}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;}
.p-green{background:var(--accent-soft);color:#166534;}
.p-amber{background:#fef3c7;color:#92400e;}
.p-red{background:#fee2e2;color:#991b1b;}
.p-blue{background:#dbeafe;color:#1e40af;}
.p-gray{background:#eef2ef;color:#475047;}
.p-violet{background:#ede9fe;color:#5b21b6;}
.bar{height:7px;border-radius:5px;background:#e9efeb;overflow:hidden;min-width:60px;}
.bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;min-width:0;}
.col{background:#f6f9f7;border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0;}
.col>h4{margin:0 0 10px;font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:6px;color:#2f3f34;}
.col>h4 .cnt{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 8px;font-size:11px;color:var(--muted);}
.col>h4 .dot{width:9px;height:9px;border-radius:50%;}
.ticket{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px;margin-bottom:9px;box-shadow:0 1px 2px rgba(20,40,26,.05);min-width:0;}
.ticket .code{font-size:10.5px;font-weight:800;color:var(--accent);letter-spacing:.5px;}
.ticket .tt{font-size:13px;font-weight:700;margin:3px 0 7px;line-height:1.35;}
.ticket .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--muted);}
.ticket .who{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:#166534;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.ticket.warn{border-left-color:var(--amber);}
.ticket.crit{border-left-color:var(--red);}
.ticket.done{border-left-color:var(--accent2);opacity:.92;}
.gantt{min-width:640px;}
.grow{display:grid;grid-template-columns:190px 1fr;align-items:center;gap:0;border-bottom:1px solid var(--line);padding:7px 0;}
.gname{font-size:12.5px;font-weight:600;min-width:0;padding-right:8px;}
.gname small{display:block;color:var(--muted);font-weight:500;font-size:11px;}
.gtrack{position:relative;height:22px;background:#f4f7f5;border-radius:6px;min-width:0;}
.gbar{position:absolute;top:3px;height:16px;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2));display:flex;align-items:center;padding:0 6px;color:#fff;font-size:10px;font-weight:700;overflow:hidden;white-space:nowrap;}
.gbar.b2{background:linear-gradient(90deg,#2563eb,#60a5fa);}
.gbar.b3{background:linear-gradient(90deg,#7c3aed,#a78bfa);}
.gbar.b4{background:linear-gradient(90deg,#d97706,#fbbf24);}
.gmile{position:absolute;top:1px;width:12px;height:12px;transform:rotate(45deg);background:#dc2626;border:2px solid #fff;margin-top:4px;}
.gaxis{display:grid;grid-template-columns:190px 1fr;font-size:10.5px;color:var(--muted);padding-bottom:4px;}
.gaxis .months{display:flex;justify-content:space-between;}
.resrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0;flex-wrap:wrap;}
.resrow .ph{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:#166534;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.resrow .nm{min-width:120px;font-size:13px;font-weight:700;}
.resrow .nm small{display:block;color:var(--muted);font-weight:500;font-size:11px;}
.loadbar{flex:1;min-width:120px;height:20px;border-radius:6px;background:#eef2ef;position:relative;overflow:hidden;}
.loadbar>i{display:block;height:100%;border-radius:6px;}
.loadbar>span{position:absolute;right:8px;top:2px;font-size:11px;font-weight:800;color:#14261a;}
.loadbar .over100{position:absolute;left:83.3%;top:0;bottom:0;width:2px;background:rgba(220,38,38,.6);}
.prow{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;margin-bottom:9px;background:#fff;min-width:0;flex-wrap:wrap;}
.prank{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.prank.r2{background:#22a049;}.prank.r3{background:#4ade80;color:#0f5c2c;}.prank.rlow{background:#cbd5d0;color:#475047;}
.pinfo{flex:1;min-width:130px;}
.pinfo b{font-size:13.5px;}
.pinfo small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px;}
.score{text-align:right;min-width:70px;}
.score b{font-size:19px;color:var(--accent);}
.score small{display:block;color:var(--muted);font-size:11px;}
.mile{display:flex;gap:12px;margin-bottom:2px;min-width:0;}
.mile .rail{display:flex;flex-direction:column;align-items:center;flex-shrink:0;}
.mile .dot2{width:15px;height:15px;border-radius:50%;background:var(--accent);border:3px solid var(--accent-soft);z-index:1;}
.mile .dot2.d-amber{background:var(--amber);border-color:#fef3c7;}
.mile .dot2.d-red{background:var(--red);border-color:#fee2e2;}
.mile .dot2.d-gray{background:#cbd5d0;border-color:#eef2ef;}
.mile .line{width:2px;flex:1;background:var(--line);margin:2px 0;min-height:22px;}
.mile .body{padding-bottom:16px;min-width:0;}
.mile .body .dt{font-size:11px;color:var(--muted);font-weight:700;}
.mile .body b{font-size:13.5px;display:block;margin:2px 0;}
.mile .body p{margin:0;font-size:12px;color:var(--muted);line-height:1.5;}
.risk{display:flex;align-items:flex-start;gap:10px;padding:11px;border-radius:11px;background:#f8faf9;border:1px solid var(--line);margin-bottom:9px;min-width:0;}
.risk .ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.risk .ic .material-symbols-outlined{font-size:19px;}
.risk b{font-size:13px;}
.risk p{margin:3px 0 0;font-size:12px;color:var(--muted);line-height:1.5;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}
@media(max-width:1080px){.kpis{grid-template-columns:repeat(2,1fr);}.board{grid-template-columns:repeat(2,1fr);}}
@media(max-width:820px){
  .g3,.g2,.g2b,.g2c{grid-template-columns:1fr;}
  .board{grid-template-columns:1fr;}
}
@media(max-width:560px){
  .kpis{grid-template-columns:1fr;}
  .navbtn span.lbl{display:none;}
  .navbtn{padding:8px 10px;}
  .brand span{display:none;}
  .usertag small{display:none;}
}
</style>
</head>
<body>
<nav class="topnav">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">account_tree</span></div>
    <div><b>研發專案管理系統</b><span>R&amp;D PROJECT HUB</span></div>
  </div>
  <div class="navwrap" id="nav"></div>
  <div class="usertag">
    <div class="av">林</div>
    <small>林郁婷 · 研發專案管理師</small>
  </div>
</nav>
<main>
  <div class="head" id="head"></div>
  <div id="app"></div>
</main>
<script>
var NAV=[
  {icon:"account_tree",t:"專案看板"},
  {icon:"calendar_month",t:"甘特排程"},
  {icon:"groups",t:"資源人力"},
  {icon:"trending_up",t:"優先排序"},
  {icon:"science",t:"驗證測試"},
  {icon:"insights",t:"研發決策室"}
];
var HEAD=[
  {icon:"account_tree",t:"專案看板",d:"多研發專案階段看板，任務在需求、開發、測試、凍結、量產間流轉。"},
  {icon:"calendar_month",t:"甘特排程",d:"里程碑排程與任務相依關係，計算關鍵路徑並鎖定設計凍結日。"},
  {icon:"groups",t:"資源人力",d:"工程師與共享設備負載分配，即時偵測過載與資源衝突。"},
  {icon:"trending_up",t:"優先排序",d:"跨專案依投報評分與量產承諾日重排優先順序。"},
  {icon:"science",t:"驗證測試",d:"DVT／EVT 測試追蹤與設計凍結管控，異常即時上報。"},
  {icon:"insights",t:"研發決策室",d:"進度指標、風險彙整與成果確認，主管一眼掌握全局。"}
];
var charts={};
function destroyCharts(){for(var k in charts){if(charts[k]){try{charts[k].destroy();}catch(e){}charts[k]=null;}}}
function mkChart(id,cfg){var el=document.getElementById(id);if(!el)return;if(charts[id]){try{charts[id].destroy();}catch(e){}}charts[id]=new Chart(el,cfg);}
var GREEN="#15803d",GREEN2="#4ade80",GRID="rgba(20,40,26,.07)";

/* ---------- screen 0: kanban ---------- */
function s0(){
  var cols=[
    {t:"需求立項",dot:"#94a3b8",items:[
      {c:"RD-2417",t:"次世代電源模組 平台立項",who:"陳",cls:"",pill:["p-blue","規劃"],due:"08/22"},
      {c:"RD-2431",t:"車用感測器 韌體重構",who:"李",cls:"",pill:["p-gray","待評估"],due:"09/03"}
    ]},
    {t:"開發中",dot:"#2563eb",items:[
      {c:"RD-2390",t:"5G 模組 射頻電路設計",who:"王",cls:"",pill:["p-blue","進行中"],due:"08/19"},
      {c:"RD-2405",t:"BMS 電池管理演算法",who:"張",cls:"warn",pill:["p-amber","高負載"],due:"08/25"},
      {c:"RD-2412",t:"影像 SoC 驅動程式",who:"周",cls:"",pill:["p-blue","進行中"],due:"08/30"}
    ]},
    {t:"測試驗證",dot:"#7c3aed",items:[
      {c:"RD-2377",t:"散熱模組 DVT 溫升測試",who:"林",cls:"crit",pill:["p-red","溫升超標"],due:"08/16"},
      {c:"RD-2384",t:"無線充電 EMC 驗證",who:"許",cls:"",pill:["p-violet","測試中"],due:"08/21"}
    ]},
    {t:"設計凍結",dot:"#d97706",items:[
      {c:"RD-2360",t:"智慧手環 主機板 v3",who:"黃",cls:"warn",pill:["p-amber","待簽核"],due:"08/18"}
    ]},
    {t:"量產轉移",dot:"#15803d",items:[
      {c:"RD-2341",t:"工業閘道器 GW-500",who:"吳",cls:"done",pill:["p-green","已放行"],due:"08/12"},
      {c:"RD-2349",t:"感測節點 S-200",who:"蔡",cls:"done",pill:["p-green","量產中"],due:"08/08"}
    ]}
  ];
  var html='';
  html+='<div class="grid kpis" style="margin-bottom:14px">'
    +kpi("在途專案","dashboard","12","件",'<span class="up"><span class="material-symbols-outlined">arrow_upward</span>本月 +2</span>')
    +kpi("整體準時率","event_available","86","%",'<span class="up"><span class="material-symbols-outlined">arrow_upward</span>+19 pt</span>')
    +kpi("阻塞任務","block","3","項",'<span class="down"><span class="material-symbols-outlined">priority_high</span>需介入</span>')
    +kpi("本週里程碑","flag","5","個",'<span class="up"><span class="material-symbols-outlined">check</span>4 達標</span>')
  +'</div>';
  html+='<div class="card"><h3><span class="material-symbols-outlined">account_tree</span>研發專案看板<span class="tag">拖動任務推進階段（示意）</span></h3>';
  html+='<div style="overflow-x:auto"><div class="board" style="min-width:680px">';
  for(var i=0;i<cols.length;i++){
    var c=cols[i];
    html+='<div class="col"><h4><span class="dot" style="background:'+c.dot+'"></span>'+c.t+'<span class="cnt">'+c.items.length+'</span></h4>';
    for(var j=0;j<c.items.length;j++){
      var it=c.items[j];
      html+='<div class="ticket '+it.cls+'"><div class="code">'+it.c+'</div><div class="tt">'+it.t+'</div>'
        +'<div class="meta"><span class="who">'+it.who+'</span>'
        +'<span class="pill '+it.pill[0]+'">'+it.pill[1]+'</span>'
        +'<span style="margin-left:auto"><span class="material-symbols-outlined" style="font-size:14px">schedule</span> '+it.due+'</span></div></div>';
    }
    html+='</div>';
  }
  html+='</div></div></div>';
  html+='<div class="grid g2b" style="margin-top:14px">'
    +'<div class="card"><h3><span class="material-symbols-outlined">bar_chart</span>各階段任務分佈</h3><div class="chartbox" style="height:250px"><canvas id="c0a"></canvas></div></div>'
    +'<div class="card"><h3><span class="material-symbols-outlined">insights</span>專案健康度</h3><div class="chartbox" style="height:250px"><canvas id="c0b"></canvas></div></div>'
  +'</div>';
  return {html:html,init:function(){
    mkChart("c0a",{type:"bar",data:{labels:["需求立項","開發中","測試驗證","設計凍結","量產轉移"],datasets:[{label:"任務數",data:[2,3,2,1,2],backgroundColor:[GREEN2,"#2563eb","#7c3aed","#d97706",GREEN],borderRadius:6}]},options:baropt()});
    mkChart("c0b",{type:"doughnut",data:{labels:["健康","注意","風險"],datasets:[{data:[7,3,2],backgroundColor:[GREEN,"#d97706","#dc2626"],borderWidth:0}]},options:donutopt()});
  }};
}

/* ---------- screen 1: gantt ---------- */
function s1(){
  var rows=[
    {n:"次世代電源模組",s:"平台架構",off:2,len:22,cls:""},
    {n:"5G 模組射頻",s:"電路設計",off:8,len:30,cls:"b2"},
    {n:"BMS 演算法",s:"開發＋整合",off:14,len:26,cls:"b3"},
    {n:"散熱模組 DVT",s:"驗證測試",off:40,len:18,cls:"b4"},
    {n:"智慧手環主機板",s:"設計凍結",off:55,len:12,cls:""},
    {n:"工業閘道器 GW-500",s:"量產轉移",off:66,len:20,cls:"b2"}
  ];
  var miles=[{n:"散熱模組",pos:57},{n:"手環凍結",pos:67},{n:"GW 量產",pos:86}];
  var html='';
  html+='<div class="grid kpis" style="margin-bottom:14px">'
    +kpi("關鍵路徑長度","route","118","天",'<span class="down"><span class="material-symbols-outlined">priority_high</span>+6 天延展</span>')
    +kpi("里程碑達成","flag","18/23","",'<span class="up"><span class="material-symbols-outlined">check</span>78%</span>')
    +kpi("延誤任務","running_with_errors","4","項",'<span class="down"><span class="material-symbols-outlined">arrow_upward</span>需重排</span>')
    +kpi("最近凍結日","ac_unit","08/18","",'<span class="up"><span class="material-symbols-outlined">schedule</span>手環 v3</span>')
  +'</div>';

function baropt(unit){return {responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
  scales:{x:{grid:{display:false},ticks:{font:{size:11}}},y:{grid:{color:GRID},ticks:{font:{size:11},callback:function(v){return v+(unit||"");}}}}};}
function lineopt(unit){return {responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"top",labels:{boxWidth:12,font:{size:11}}}},
  scales:{x:{grid:{display:false},ticks:{font:{size:11}}},y:{grid:{color:GRID},ticks:{font:{size:11},callback:function(v){return v+(unit||"");}}}}};}
function donutopt(){return {responsive:true,maintainAspectRatio:false,cutout:"60%",plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:11},padding:12}}}};}
function radaropt(){return {responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
  scales:{r:{suggestedMin:0,suggestedMax:10,grid:{color:GRID},angleLines:{color:GRID},pointLabels:{font:{size:11}},ticks:{display:false}}}};}

function buildNav(){
  var h='';
  for(var i=0;i<NAV.length;i++){
    h+='<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+NAV[i].icon+'</span><span class="lbl">'+NAV[i].t+'</span></button>';
  }
  document.getElementById("nav").innerHTML=h;
  var btns=document.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    (function(b){b.addEventListener("click",function(){show(+b.getAttribute("data-i"));});})(btns[j]);
  }
}
function show(i){
  var app=document.getElementById("app");
  var hd=document.getElementById("head");
  hd.innerHTML='<h1><span class="material-symbols-outlined">'+HEAD[i].icon+'</span>'+HEAD[i].t+'</h1><p>'+HEAD[i].d+'</p>';
  destroyCharts();
  var s=SCREENS[i]();
  app.innerHTML=s.html;
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){btns[k].classList.toggle("active",+btns[k].getAttribute("data-i")===i);}
  void app.offsetHeight;
  if(s.init)s.init();
}
buildNav();
