<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>研發專案管理系統</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700;800;900&family=Roboto+Mono:wght@300;400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#15803D;
  --color-on-primary:#FFFFFF;
  --color-secondary:#22C55E;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDF4;
  --color-foreground:#14532D;
  --color-card:#FFFFFF;
  --color-card-foreground:#14532D;
  --color-muted:#E8F0F1;
  --color-muted-foreground:#475569;
  --color-border:#BBF7D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#15803D;
  --blue:#1D4ED8;
  --ink:#14532D;
  --muted:#475569;
  --line:#86EFAC;
  --violet:#6D28D9;
  --shadow:7px 7px 0 #14532D;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{
  margin:0;
  min-width:0;
  overflow-x:hidden;
  color:var(--ink);
  background-color:var(--color-background);
  background-image:
    linear-gradient(rgba(21,128,61,.09) 1px,transparent 1px),
    linear-gradient(90deg,rgba(21,128,61,.09) 1px,transparent 1px);
  background-size:32px 32px;
  font-family:"Exo",system-ui,sans-serif;
}
button{font:inherit}
button,[data-i]{cursor:pointer}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:4px solid var(--color-ring);
  outline-offset:3px;
}
.topnav{
  position:sticky;
  top:0;
  z-index:50;
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  align-items:stretch;
  color:#fff;
  background:#14532D;
  border-bottom:4px solid #0F172A;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
  padding:12px 18px;
  background:var(--color-primary);
  border-right:3px solid #0F172A;
}
.brand .logo{
  display:grid;
  place-items:center;
  width:40px;
  height:40px;
  flex:0 0 40px;
  color:#fff;
  background:#0F172A;
  border:2px solid #fff;
}
.brand .logo .material-symbols-outlined{font-size:23px}
.brand b{
  display:block;
  font-size:16px;
  font-weight:900;
  letter-spacing:.05em;
  white-space:nowrap;
}
.brand span{
  display:block;
  margin-top:2px;
  color:#BBF7D0;
  font:700 10px/1.2 "Roboto Mono",monospace;
  letter-spacing:.12em;
}
.navwrap{
  display:flex;
  min-width:0;
  overflow-x:auto;
  scrollbar-width:thin;
}
.navbtn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-width:108px;
  min-height:64px;
  padding:9px 12px;
  color:#DCFCE7;
  background:transparent;
  border:0;
  border-right:1px solid rgba(255,255,255,.24);
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
  transition:background-color .18s,color .18s;
}
.navbtn .material-symbols-outlined{font-size:19px}
.navbtn:hover{color:#0F172A;background:#86EFAC}
.navbtn.active{
  position:relative;
  color:#0F172A;
  background:#fff;
}
.navbtn.active::after{
  content:"";
  position:absolute;
  right:8px;
  bottom:6px;
  left:8px;
  height:4px;
  background:var(--color-accent);
}
.usertag{
  display:flex;
  align-items:center;
  gap:9px;
  padding:9px 15px;
  background:#0F172A;
  border-left:3px solid #fff;
}
.usertag .av{
  display:grid;
  place-items:center;
  width:34px;
  height:34px;
  flex:0 0 34px;
  color:#0F172A;
  background:#FBBF24;
  border:2px solid #fff;
  font-weight:900;
}
.usertag small{color:#F0FDF4;font-size:11px;font-weight:700;white-space:nowrap}
main{width:min(1440px,100%);margin:auto;padding:28px 24px 42px}
.head{
  position:relative;
  margin:0 0 22px;
  padding:18px 20px 17px 26px;
  background:#fff;
  border:3px solid #14532D;
  box-shadow:var(--shadow);
}
.head::before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:9px;
  background:var(--color-accent);
}
.head h1{
  display:flex;
  align-items:center;
  gap:11px;
  margin:0;
  color:#0F172A;
  font-size:clamp(23px,3vw,38px);
  font-weight:900;
  letter-spacing:-.035em;
  line-height:1.05;
}
.head h1 .material-symbols-outlined{
  display:grid;
  place-items:center;
  width:42px;
  height:42px;
  color:#fff;
  background:var(--color-primary);
  border:2px solid #0F172A;
  font-size:24px;
}
.head p{max-width:850px;margin:9px 0 0;color:var(--muted);font-size:13px;font-weight:600;line-height:1.55}
.grid{display:grid;gap:16px;min-width:0}
.kpis{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g2b{grid-template-columns:1.4fr 1fr}
.g2c{grid-template-columns:1fr 1.5fr}
.card{
  min-width:0;
  padding:16px;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:3px solid #14532D;
  box-shadow:4px 4px 0 rgba(20,83,45,.95);
}
.card:nth-child(even){box-shadow:4px 4px 0 var(--color-accent)}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 14px;
  padding-bottom:10px;
  color:#0F172A;
  border-bottom:3px solid #0F172A;
  font-size:14px;
  font-weight:900;
  letter-spacing:.015em;
}
.card h3 .material-symbols-outlined{
  display:grid;
  place-items:center;
  width:28px;
  height:28px;
  color:#fff;
  background:var(--color-primary);
  font-size:17px;
}
.card h3 .tag{
  margin-left:auto;
  padding:4px 7px;
  color:#0F172A;
  background:#DCFCE7;
  border:1px solid #14532D;
  font:700 10px/1.2 "Roboto Mono",monospace;
  white-space:nowrap;
}
.kpi{position:relative;overflow:hidden;padding:15px 15px 17px}
.kpi::after{
  content:"";
  position:absolute;
  right:-22px;
  bottom:-22px;
  width:62px;
  height:62px;
  background:#DCFCE7;
  border:3px solid #14532D;
  transform:rotate(18deg);
}
.kpi .lbl{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:12px;
  font-weight:800;
}
.kpi .lbl .material-symbols-outlined{color:var(--color-primary);font-size:18px}
.kpi .val{
  position:relative;
  z-index:1;
  margin-top:8px;
  color:#0F172A;
  font:900 28px/1 "Roboto Mono",monospace;
  letter-spacing:-.06em;
  font-variant-numeric:tabular-nums;
}
.kpi .val small{color:var(--muted);font:700 12px/1 "Exo",sans-serif;letter-spacing:0}
.kpi .delta{
  position:relative;
  z-index:1;
  display:inline-flex;
  align-items:center;
  gap:3px;
  margin-top:8px;
  font-size:11px;
  font-weight:800;
}
.kpi .delta .material-symbols-outlined{font-size:14px}
.up{color:#166534}
.down{color:#B91C1C}
.chartbox{position:relative;width:100%;overflow:hidden}
table{
  width:100%;
  min-width:520px;
  border-collapse:collapse;
  color:#0F172A;
  font-size:12px;
}
th,td{
  padding:10px;
  border:1px solid #86EFAC;
  text-align:left;
  white-space:nowrap;
}
th{
  color:#fff;
  background:#14532D;
  font:700 10.5px/1.3 "Roboto Mono",monospace;
  letter-spacing:.05em;
}
tbody tr:nth-child(even){background:#F0FDF4}
tbody tr:hover{background:#DCFCE7}
td b{font-weight:900}
td:first-child,
td:nth-child(2),
.code,.dt,.score,.gbar{
  font-family:"Roboto Mono",monospace;
  font-variant-numeric:tabular-nums;
}
td:has(.bar),td:nth-last-child(2){font-variant-numeric:tabular-nums}
.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 7px;
  border:1px solid currentColor;
  font-size:10.5px;
  font-weight:900;
}
.pill::before{content:"■";font-size:7px}
.p-green{color:#14532D;background:#DCFCE7}
.p-amber{color:#78350F;background:#FEF3C7}
.p-red{color:#991B1B;background:#FEE2E2}
.p-blue{color:#1E3A8A;background:#DBEAFE}
.p-gray{color:#334155;background:#E2E8F0}
.p-violet{color:#5B21B6;background:#EDE9FE}
.bar{
  height:11px;
  min-width:70px;
  overflow:hidden;
  background:#E2E8F0;
  border:1px solid #475569;
}
.bar>i{display:block;height:100%;background:repeating-linear-gradient(135deg,#15803D 0 7px,#22C55E 7px 14px)}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;min-width:0}
.col{
  min-width:0;
  padding:9px;
  background:#E8F0F1;
  border:2px solid #14532D;
}
.col>h4{
  display:flex;
  align-items:center;
  gap:7px;
  margin:0 0 10px;
  padding:3px 2px 9px;
  color:#0F172A;
  border-bottom:2px solid #14532D;
  font-size:12px;
  font-weight:900;
}
.col>h4 .cnt{
  margin-left:auto;
  padding:1px 6px;
  color:#0F172A;
  background:#fff;
  border:1px solid #0F172A;
  font:700 10px "Roboto Mono",monospace;
}
.col>h4 .dot{width:10px;height:10px;border:2px solid #0F172A}
.ticket{
  min-width:0;
  margin-bottom:9px;
  padding:10px;
  background:#fff;
  border:2px solid #14532D;
  border-left:7px solid var(--color-primary);
  box-shadow:3px 3px 0 #BBF7D0;
}
.ticket.warn{border-left-color:var(--color-accent)}
.ticket.crit{border-left-color:var(--color-destructive)}
.ticket.done{border-left-color:var(--color-secondary)}
.ticket .code{color:#166534;font-size:10px;font-weight:900;letter-spacing:.05em}
.ticket .tt{margin:4px 0 8px;color:#0F172A;font-size:12px;font-weight:800;line-height:1.4}
.ticket .meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;color:var(--muted);font-size:10px}
.ticket .who,.resrow .ph{
  display:grid;
  place-items:center;
  color:#fff;
  background:#14532D;
  border:1px solid #0F172A;
  font-weight:900;
}
.ticket .who{width:23px;height:23px;font-size:9px}
.gantt{min-width:640px}
.grow{
  display:grid;
  grid-template-columns:190px 1fr;
  align-items:center;
  border-bottom:1px solid #86EFAC;
  padding:8px 0;
}
.gname{min-width:0;padding-right:8px;color:#0F172A;font-size:12px;font-weight:800}
.gname small{display:block;color:var(--muted);font:500 10px "Roboto Mono",monospace}
.gtrack{
  position:relative;
  min-width:0;
  height:25px;
  background:repeating-linear-gradient(90deg,#E8F0F1 0,#E8F0F1 calc(20% - 1px),#86EFAC 20%);
  border:1px solid #86EFAC;
}
.gbar{
  position:absolute;
  top:3px;
  display:flex;
  align-items:center;
  height:17px;
  overflow:hidden;
  padding:0 5px;
  color:#fff;
  background:#15803D;
  border:1px solid #0F172A;
  font-size:9px;
  font-weight:700;
  white-space:nowrap;
}
.gbar.b2{background:#1D4ED8}
.gbar.b3{background:#6D28D9}
.gbar.b4{color:#000;background:#F59E0B}
.gmile{
  position:absolute;
  top:4px;
  width:14px;
  height:14px;
  background:#DC2626;
  border:2px solid #0F172A;
  transform:rotate(45deg);
}
.gaxis{
  display:grid;
  grid-template-columns:190px 1fr;
  padding-bottom:5px;
  color:var(--muted);
  font:500 10px "Roboto Mono",monospace;
}
.gaxis .months{display:flex;justify-content:space-between}
.resrow{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
  padding:10px 0;
  border-bottom:1px solid #86EFAC;
}
.resrow .ph{width:35px;height:35px;flex:0 0 35px;font-size:12px}
.resrow .nm{min-width:120px;color:#0F172A;font-size:12px;font-weight:900}
.resrow .nm small{display:block;color:var(--muted);font-size:10px;font-weight:600}
.loadbar{
  position:relative;
  flex:1;
  min-width:120px;
  height:22px;
  overflow:hidden;
  background:#E2E8F0;
  border:1px solid #475569;
}
.loadbar>i{display:block;height:100%}
.loadbar>span{
  position:absolute;
  top:3px;
  right:7px;
  color:#0F172A;
  font:900 10px "Roboto Mono",monospace;
  text-shadow:0 0 3px #fff;
}
.loadbar .over100{position:absolute;top:0;bottom:0;left:83.3%;width:3px;background:#0F172A}
.prow{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
  margin-bottom:9px;
  padding:10px;
  background:#fff;
  border:2px solid #14532D;
}
.prank{
  display:grid;
  place-items:center;
  width:32px;
  height:32px;
  flex:0 0 32px;
  color:#fff;
  background:#14532D;
  border:2px solid #0F172A;
  font:900 13px "Roboto Mono",monospace;
}
.prank.r2{background:#15803D}
.prank.r3{color:#0F172A;background:#4ADE80}
.prank.rlow{color:#0F172A;background:#CBD5E1}
.pinfo{flex:1;min-width:130px}
.pinfo b{color:#0F172A;font-size:12px}
.pinfo small{display:block;margin-top:3px;color:var(--muted);font-size:10.5px}
.score{min-width:65px;text-align:right}
.score b{color:#14532D;font-size:19px}
.score small{display:block;color:var(--muted);font:600 9px "Exo",sans-serif}
.mile{display:flex;gap:11px;min-width:0}
.mile .rail{display:flex;flex-direction:column;align-items:center;flex:0 0 auto}
.mile .dot2{
  z-index:1;
  width:15px;
  height:15px;
  background:#15803D;
  border:3px solid #0F172A;
}
.mile .dot2.d-amber{background:#F59E0B}
.mile .dot2.d-red{background:#DC2626}
.mile .dot2.d-gray{background:#94A3B8}
.mile .line{width:2px;min-height:23px;flex:1;margin:2px 0;background:#14532D}
.mile .body{min-width:0;padding-bottom:15px}
.mile .body .dt{color:var(--muted);font-size:10px;font-weight:700}
.mile .body b{display:block;margin:2px 0;color:#0F172A;font-size:12px}
.mile .body p{margin:0;color:var(--muted);font-size:11px;line-height:1.5}
.risk{
  display:flex;
  align-items:flex-start;
  gap:10px;
  min-width:0;
  margin-bottom:9px;
  padding:10px;
  background:#F8FAFC;
  border:2px solid #14532D;
}
.risk .ic{
  display:grid;
  place-items:center;
  width:32px;
  height:32px;
  flex:0 0 32px;
  border:1px solid currentColor;
}
.risk .ic .material-symbols-outlined{font-size:18px}
.risk b{color:#0F172A;font-size:12px}
.risk p{margin:3px 0 0;color:var(--muted);font-size:11px;line-height:1.5}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:10.5px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:11px;height:11px;border:1px solid #0F172A}
#app .card{
  animation:card-in .4s cubic-bezier(.2,.9,.3,1.25) both;
}
#app .card:nth-child(2){animation-delay:.06s}
#app .card:nth-child(3){animation-delay:.12s}
#app .card:nth-child(4){animation-delay:.18s}
@keyframes card-in{
  from{opacity:0;transform:translateY(16px) scale(.96)}
  to{opacity:1;transform:none}
}
@media(max-width:1100px){
  .topnav{grid-template-columns:auto 1fr}
  .usertag{display:none}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .board{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:820px){
  main{padding:20px 14px 34px}
  .topnav{display:block}
  .brand{border-right:0;border-bottom:3px solid #0F172A}
  .navbtn{min-width:94px;min-height:49px}
  .g3,.g2,.g2b,.g2c{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
}
@media(max-width:560px){
  .brand{padding:9px 12px}
  .brand .logo{width:34px;height:34px;flex-basis:34px}
  .brand span{display:none}
  .navbtn{min-width:49px;padding:8px}
  .navbtn span.lbl{display:none}
  .kpis{grid-template-columns:1fr}
  .head{padding:15px 14px 14px 21px;box-shadow:4px 4px 0 #14532D}
  .head h1{font-size:24px}
  .head h1 .material-symbols-outlined{width:36px;height:36px}
  .card{padding:12px;box-shadow:3px 3px 0 #14532D}
  .resrow{flex-wrap:wrap}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>
<body>
<nav class="topnav" aria-label="主要功能">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined" aria-hidden="true">account_tree</span></div>
    <div><b>研發專案管理系統</b><span>R&amp;D PROJECT HUB</span></div>
  </div>
  <div class="navwrap" id="nav"></div>
  <div class="usertag">
    <div class="av">林</div>
    <small>林郁婷 · 研發專案管理師</small>
  </div>
</nav>
<main>
  <div class="head" id="head"></div>
  <div id="app"></div>
</main>
<script>
var NAV=[
  {icon:"account_tree",t:"專案看板"},
  {icon:"calendar_month",t:"甘特排程"},
  {icon:"groups",t:"資源人力"},
  {icon:"trending_up",t:"優先排序"},
  {icon:"science",t:"驗證測試"},
  {icon:"insights",t:"研發決策室"}
];
var HEAD=[
  {icon:"account_tree",t:"專案看板",d:"多研發專案階段看板，任務在需求、開發、測試、凍結、量產間流轉。"},
  {icon:"calendar_month",t:"甘特排程",d:"里程碑排程與任務相依關係，計算關鍵路徑並鎖定設計凍結日。"},
  {icon:"groups",t:"資源人力",d:"工程師與共享設備負載分配，即時偵測過載與資源衝突。"},
  {icon:"trending_up",t:"優先排序",d:"跨專案依投報評分與量產承諾日重排優先順序。"},
  {icon:"science",t:"驗證測試",d:"DVT／EVT 測試追蹤與設計凍結管控，異常即時上報。"},
  {icon:"insights",t:"研發決策室",d:"進度指標、風險彙整與成果確認，主管一眼掌握全局。"}
];
var charts={};
function destroyCharts(){
  for(var k in charts){
    if(charts[k]){
      try{charts[k].destroy()}catch(e){}
      charts[k]=null;
    }
  }
}
function mkChart(id,cfg){
  var el=document.getElementById(id);
  if(!el)return;
  if(charts[id])try{charts[id].destroy()}catch(e){}
  charts[id]=new Chart(el,cfg);
}
var GREEN="#15803D",GREEN2="#22C55E",GRID="rgba(20,83,45,.16)";

function s0(){
  var cols=[

    +'</div><div class="grid g2" style="margin-bottom:16px"><div class="card"><h3><span class="material-symbols-outlined">trending_up</span>專案準時率趨勢</h3><div class="chartbox" style="height:240px"><canvas id="c5a"></canvas></div></div><div class="card"><h3><span class="material-symbols-outlined">insights</span>研發資源投入配比</h3><div class="chartbox" style="height:240px"><canvas id="c5b"></canvas></div></div></div><div class="grid g2c"><div class="card"><h3><span class="material-symbols-outlined">gavel</span>待技術長決策</h3>'
    +risk("route","#DCFCE7","#15803D","散熱 DVT 是否延後凍結","溫升修正需 3 天，建議手環 v3 凍結日順延至 08/21，避免帶不良設計進量產。")
    +risk("groups","#DBEAFE","#1D4ED8","射頻工程師支援調度","王柏翰負載 112%，建議自 EMC 團隊借調 0.5 人月支援 5G 模組。")
    +risk("priority_high","#FEF3C7","#D97706","BMS 演算法優先權","是否提升至 P1 以趕上共用平台時程，需評估對其他專案影響。")
    +'</div><div class="card"><h3><span class="material-symbols-outlined">receipt_long</span>專案成果總覽</h3><div style="overflow-x:auto"><table><thead><tr><th>專案</th><th>階段</th><th>進度</th><th>準時</th><th>健康</th></tr></thead><tbody>'
    +srow("次世代電源模組","開發",38,"準時","p-green")
    +srow("5G 模組射頻","開發",55,"準時","p-green")
    +srow("BMS 演算法","開發",47,"落後","p-amber")

  return {html:html,init:function(){

    mkChart("c5b",{type:"doughnut",data:{labels:["開發","驗證","架構設計","量產轉移"],datasets:[{data:[42,26,18,14],backgroundColor:[GREEN,"#1D4ED8","#6D28D9",GREEN2],borderColor:"#0F172A",borderWidth:2}]},options:donutopt()});

function srow(n,ph,pr,st,cls){
  return '<tr><td><b>'+n+'</b></td><td>'+ph+'</td><td><div class="bar"><i style="width:'+pr+'%"></i></div></td><td style="text-align:right">'+pr+'%</td><td><span class="pill '+cls+'">'+st+'</span></td></tr>';
}

function kpi(l,ic,v,u,d){
  return '<div class="card kpi"><div class="lbl"><span class="material-symbols-outlined">'+ic+'</span>'+l+'</div><div class="val">'+v+' <small>'+u+'</small></div><div class="delta">'+d+'</div></div>';
}
function baseScales(){
  return {
    x:{grid:{display:false},border:{color:"#14532D",width:2},ticks:{color:"#334155",font:{family:"Roboto Mono",size:10}}},
    y:{grid:{color:GRID},border:{color:"#14532D",width:2},ticks:{color:"#334155",font:{family:"Roboto Mono",size:10}}}
  };
}
function baropt(unit){
  var s=baseScales();
  s.y.ticks.callback=function(v){return v+(unit||"")};
  return {responsive:true,maintainAspectRatio:false,animation:{duration:400},plugins:{legend:{display:false}},scales:s};
}
function lineopt(unit){
  var s=baseScales();
  s.y.ticks.callback=function(v){return v+(unit||"")};
  return {responsive:true,maintainAspectRatio:false,animation:{duration:400},plugins:{legend:{position:"top",labels:{boxWidth:12,color:"#334155",font:{family:"Exo",size:11}}}},scales:s};
}
function donutopt(){
  return {responsive:true,maintainAspectRatio:false,cutout:"58%",animation:{duration:400},plugins:{legend:{position:"bottom",labels:{boxWidth:12,padding:12,color:"#334155",font:{family:"Exo",size:11}}}}};
}
function radaropt(){
  return {responsive:true,maintainAspectRatio:false,animation:{duration:400},plugins:{legend:{display:false}},scales:{r:{suggestedMin:0,suggestedMax:10,grid:{color:GRID},angleLines:{color:GRID},pointLabels:{color:"#334155",font:{family:"Exo",size:11}},ticks:{display:false}}}};
}

var SCREENS=[s0,s1,s2,s3,s4,s5];
function buildNav(){
  var h="";
  for(var i=0;i<NAV.length;i++){
    h+='<button type="button" class="navbtn" data-i="'+i+'" aria-label="'+NAV[i].t+'"><span class="material-symbols-outlined" aria-hidden="true">'+NAV[i].icon+'</span><span class="lbl">'+NAV[i].t+'</span></button>';
  }
  document.getElementById("nav").innerHTML=h;
  var btns=document.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    (function(b){
      b.addEventListener("click",function(){
        var i=+b.getAttribute("data-i");
        var target="#v"+i;
        if(location.hash===target)show(i);
        else location.hash=target;
      });
    })(btns[j]);
  }
}
function show(i){
  if(i<0||i>=SCREENS.length)i=0;
  var app=document.getElementById("app");
  var hd=document.getElementById("head");
  hd.innerHTML='<h1><span class="material-symbols-outlined" aria-hidden="true">'+HEAD[i].icon+'</span>'+HEAD[i].t+'</h1><p>'+HEAD[i].d+'</p>';
  destroyCharts();
  var s=SCREENS[i]();
  app.innerHTML=s.html;
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){
    var active=+btns[k].getAttribute("data-i")===i;
    btns[k].classList.toggle("active",active);
    btns[k].setAttribute("aria-current",active?"page":"false");
  }
  void app.offsetHeight;
  if(s.init)s.init();
}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return}
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0)}catch(e){}
}
if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){
  Chart.defaults.animation=false;
}
Chart.defaults.color="#334155";
Chart.defaults.font.family='"Exo",system-ui,sans-serif';
buildNav();
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
