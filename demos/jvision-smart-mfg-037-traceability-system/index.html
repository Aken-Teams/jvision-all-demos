<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>產品追溯系統（Traceability System）｜Jvision Demo</title>
<meta name="description" content="物料批次履歷、投料綁定、製程參數關聯、序號生成與雙向追溯查詢的控制中心" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --bg:#F8FAFC;
  --panel:#FFFFFF;
  --panel2:#F1F5F9;
  --dim:#64748B;
  --accent:#2563EB;
  --accent2:#3B82F6;
  --ok:#047857;
  --warn:#9A6700;
  --bad:#B91C1C;
  --info:#1D4ED8;
  --shadow-sm:0 1px 2px rgba(15,23,42,.05);
  --shadow-md:0 8px 24px rgba(15,23,42,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--color-background)}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  color:var(--ink);
  background:
    linear-gradient(rgba(37,99,235,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(37,99,235,.035) 1px,transparent 1px),
    var(--bg);
  background-size:32px 32px;
  font-family:"Fira Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,a,[onclick]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid rgba(37,99,235,.32);
  outline-offset:3px;
}
.ms{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
.topbar{
  position:sticky;
  top:0;
  z-index:30;
  background:rgba(255,255,255,.94);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(12px);
  box-shadow:var(--shadow-sm);
}
.tb-in{
  width:min(100% - 32px,1360px);
  min-height:64px;
  margin:0 auto;
  padding:10px 0;
  display:flex;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .logo{
  width:38px;
  height:38px;
  flex:none;
  display:grid;
  place-items:center;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-radius:6px;
  box-shadow:4px 4px 0 #BFDBFE;
}
.brand .logo .ms{font-size:22px}
.brand b{
  display:block;
  color:#0F172A;
  font-size:15px;
  font-weight:700;
  letter-spacing:.01em;
  white-space:nowrap;
}
.brand span{display:block;color:var(--muted);font-size:11px;font-weight:500}
.tb-status{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--muted);
  font-size:12px;
  font-weight:500;
}
.dot{
  width:10px;
  height:10px;
  flex:none;
  position:relative;
  border:2px solid #FFFFFF;
  border-radius:50%;
  background:var(--ok);
  box-shadow:0 0 0 2px #A7F3D0;
}
nav.tabs{
  position:sticky;
  top:64px;
  z-index:25;
  overflow:hidden;
  background:rgba(248,250,252,.96);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(10px);
}
.tabs-in{
  width:min(100% - 24px,1360px);
  margin:0 auto;
  padding:8px 0;
  display:flex;
  gap:6px;
  overflow-x:auto;
  scrollbar-width:thin;
}
.tabs button{
  min-height:42px;
  flex:1 0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:9px 13px;
  color:var(--muted);
  background:transparent;
  border:1px solid transparent;
  border-radius:6px;
  font:600 13px/1.2 "Fira Sans",sans-serif;
  white-space:nowrap;
  transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s ease,box-shadow .2s ease;
}
.tabs button:hover{
  color:var(--ink);
  background:#FFFFFF;
  border-color:#CBD5E1;
  box-shadow:var(--shadow-sm);
  transform:translateY(-1px);
}
.tabs button.on{
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-color:var(--color-primary);
  box-shadow:0 4px 12px rgba(37,99,235,.2);
}
.tabs button .ms{font-size:19px}
.tabs button .idx{
  color:inherit;
  font-size:10px;
  font-weight:600;
  opacity:.78;
}
main{width:min(100% - 32px,1360px);margin:0 auto;padding:24px 0 64px}
#view{animation:view-in .38s cubic-bezier(.2,.8,.2,1) both}
.screen-head{
  margin:0 0 20px;
  padding:4px 0 18px;
  display:flex;
  align-items:flex-start;
  gap:13px;
  border-bottom:1px solid var(--line);
}
.screen-head .ic{
  width:44px;
  height:44px;
  flex:none;
  display:grid;
  place-items:center;
  color:var(--color-primary);
  background:#EFF6FF;
  border:1px solid #BFDBFE;
  border-radius:6px;
}
.screen-head .ic .ms{font-size:23px}
.screen-head h2{
  margin:0;
  color:#0F172A;
  font-size:clamp(20px,2vw,25px);
  font-weight:700;
  line-height:1.25;
  letter-spacing:-.025em;
}
.screen-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.card,.kpi,.wo,.node,.serchip,.rowline{
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease,background-color .22s ease;
}
.card{
  min-width:0;
  padding:18px;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:8px;
  box-shadow:var(--shadow-sm);
}
.card:hover{border-color:#CBD5E1;box-shadow:var(--shadow-md)}
.card h3{
  margin:0 0 14px;
  display:flex;
  align-items:center;
  gap:8px;
  color:#0F172A;
  font-size:14px;
  font-weight:700;
  letter-spacing:-.005em;
}
.card h3 .ms{color:var(--color-primary);font-size:19px}
.sub{color:var(--muted);font-size:12px;font-weight:400}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g32{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
.split14{margin-top:14px}
.kpi{
  min-width:0;
  position:relative;
  overflow:hidden;
  padding:16px;
  background:#FFFFFF;
  border:1px solid var(--line);
  border-radius:8px;
  box-shadow:var(--shadow-sm);
  animation:grid-in .4s cubic-bezier(.2,.8,.2,1) both;
}
.kpi:nth-child(2){animation-delay:.06s}
.kpi:nth-child(3){animation-delay:.12s}
.kpi:nth-child(4){animation-delay:.18s}
.kpi:before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:3px;
  background:var(--color-primary);
}
.kpi:hover{border-color:#93C5FD;box-shadow:var(--shadow-md);transform:translateY(-2px)}
.kpi .k-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.kpi .k-ic{
  width:36px;
  height:36px;
  display:grid;
  place-items:center;
  color:#FFFFFF;
  border-radius:5px;
  box-shadow:none;
}
.kpi .k-ic .ms{font-size:20px}
.kpi .k-lbl{margin:11px 0 3px;color:var(--muted);font-size:12px;font-weight:500}
.kpi .k-val{
  color:#0F172A;
  font-family:"Fira Code",monospace;
  font-size:clamp(23px,2.2vw,29px);
  font-weight:700;
  line-height:1.15;
  letter-spacing:-.045em;
  font-variant-numeric:tabular-nums;
}
.kpi .k-val small{margin-left:5px;color:var(--muted);font:500 12px "Fira Sans",sans-serif;letter-spacing:0}
.kpi .k-chg,.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:11px;
  font-weight:600;
  line-height:1.2;
}
.kpi .k-chg{padding:3px 7px}
.up{color:#047857;background:#ECFDF5}
.down{color:#B91C1C;background:#FEF2F2}
.neu{color:#1D4ED8;background:#EFF6FF}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{width:100%;min-width:520px;border-collapse:collapse;background:#FFFFFF;font-size:13px}
th{
  padding:10px 12px;
  color:#475569;
  background:#F1F5F9;
  border-bottom:1px solid #CBD5E1;
  text-align:left;
  font-size:11px;
  font-weight:700;
  letter-spacing:.045em;
  text-transform:uppercase;
  white-space:nowrap;
}
td{padding:11px 12px;color:#334155;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#EFF6FF}
td:nth-child(4),td:nth-child(5){font-variant-numeric:tabular-nums}
td.mono,td:has(.mono){font-variant-numeric:tabular-nums}
.mono{
  font-family:"Fira Code",ui-monospace,SFMono-Regular,Consolas,monospace;
  font-variant-numeric:tabular-nums slashed-zero;
  letter-spacing:-.015em;
}
.pill{padding:4px 8px;white-space:nowrap}
.pill .ms{font-size:14px}
.p-ok{color:#047857;background:#ECFDF5}
.p-warn{color:#854D0E;background:#FEFCE8}
.p-bad{color:#B91C1C;background:#FEF2F2}
.p-info{color:#1D4ED8;background:#EFF6FF}
.p-muted{color:#475569;background:#F1F5F9}
.bar{height:7px;overflow:hidden;background:#E2E8F0;border-radius:2px}
.bar>i{display:block;height:100%;background:var(--color-primary);border-radius:2px;transition:width .4s ease}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.wo{min-width:0;padding:14px;background:#F8FAFC;border:1px solid var(--line);border-radius:6px}
.wo:hover{background:#FFFFFF;border-color:#93C5FD;box-shadow:var(--shadow-md);transform:translateY(-2px)}
.wo .wo-h{margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.wo .wo-h b{color:#0F172A;font-family:"Fira Code",monospace;font-size:12px}
.lot{
  min-height:38px;
  margin-top:7px;
  padding:7px 9px;
  display:flex;
  align-items:center;
  gap:8px;
  color:#334155;
  background:#FFFFFF;
  border:1px solid var(--line);
  border-radius:4px;
  font-size:12px;
}
.lot .mono{color:var(--color-primary)!important;font-weight:600}
.lot .ms{font-size:16px}
.mtx-wrap{overflow-x:auto}
.mtx{min-width:560px;border-collapse:separate;border-spacing:5px;background:transparent}
.mtx td,.mtx th{padding:0;border:0;background:transparent}
.mtx th{padding:4px;color:var(--muted);font-size:11px;font-weight:600;white-space:nowrap}
.mtx .rh{padding-right:8px;color:var(--muted);font-size:12px;font-weight:600;text-align:right;white-space:nowrap}
.cell{
  width:100%;
  padding:10px 6px;
  color:#172033;
  border:1px solid rgba(15,23,42,.12);
  border-radius:4px;
  text-align:center;
  font-family:"Fira Code",monospace;
  font-size:12px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.tree{overflow-x:auto;padding:8px 2px 10px}
.tree-in{min-width:720px;display:flex;align-items:stretch}
.tcol{min-width:154px;padding:0 4px;display:flex;flex-direction:column;justify-content:center;gap:9px}
.tcol .tcap{margin-bottom:3px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.08em;text-align:center;text-transform:uppercase}
.node{position:relative;padding:10px 11px;background:#F8FAFC;border:1px solid var(--line);border-radius:5px;font-size:12px}
.node:hover{background:#FFFFFF;border-color:#93C5FD;box-shadow:var(--shadow-sm)}
.node b{display:block;color:#0F172A;font-size:12px}
.node .mono{color:var(--color-primary);font-size:10px}
.node.root{background:#EFF6FF;border:2px solid var(--color-primary);box-shadow:4px 4px 0 #BFDBFE}
.conn{flex:none;display:flex;align-items:center;color:var(--color-primary)}
.conn .ms{color:var(--color-primary);font-size:22px;opacity:.7}
.tl{position:relative;padding-left:24px}
.tl:before{content:"";position:absolute;left:7px;top:5px;bottom:5px;width:2px;background:#BFDBFE}
.tl .ev{position:relative;padding:0 0 18px 7px}
.tl .ev:last-child{padding-bottom:0}
.tl .ev:before{content:"";position:absolute;left:-22px;top:3px;width:11px;height:11px;background:var(--color-primary);border:3px solid #FFFFFF;box-shadow:0 0 0 1px var(--color-primary);border-radius:50%}
.tl .ev .t{color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;font-weight:600}
.tl .ev b{display:block;margin:2px 0;color:#0F172A;font-size:13px}
.tl .ev p{margin:0;color:var(--muted);font-size:12px}
.fn{display:flex;flex-direction:column;align-items:center;gap:8px}
.fn .step{
  padding:11px 12px;
  color:#FFFFFF;
  border:1px solid rgba(15,23,42,.12);
  border-radius:4px;
  box-shadow:var(--shadow-sm);
  text-align:center;
  font-size:13px;
  font-weight:700;
}
.fn .step:nth-child(1){background:#1D4ED8!important}
.fn .step:nth-child(2){background:#2563EB!important}
.fn .step:nth-child(3){background:#3B82F6!important;color:#081226}
.fn .step:nth-child(4){background:#60A5FA!important;color:#081226}
.fn .step:nth-child(5){background:#BFDBFE!important;color:#172033}
.fn .step small{display:block;margin-top:2px;font-size:11px;font-weight:500;opacity:1}
.serchip{
  min-width:0;
  padding:11px;
  display:flex;
  align-items:center;
  gap:10px;
  background:#F8FAFC;
  border:1px solid var(--line);
  border-radius:5px;
}
.serchip:hover{background:#FFFFFF;border-color:#93C5FD;box-shadow:var(--shadow-sm)}
.serchip .qr{width:40px;height:40px;flex:none;display:grid;place-items:center;color:#FFFFFF;background:var(--color-primary);border-radius:4px}
.serchip .sm{color:var(--muted);font-size:10px}
.serchip .sb{color:var(--color-primary)!important;font-size:12px;font-weight:700}
.list{display:flex;flex-direction:column;gap:9px}
.rowline{min-width:0;padding:9px 11px;display:flex;align-items:center;gap:10px;background:#F8FAFC;border:1px solid var(--line);border-radius:5px;font-size:12px}
.rowline .grow{min-width:0;flex:1}
.chart{width:100%;min-height:1px}
.apexcharts-canvas,.apexcharts-text,.apexcharts-legend-text,.apexcharts-tooltip{font-family:"Fira Sans",sans-serif!important}
.apexcharts-tooltip{color:var(--ink)!important;background:#FFFFFF!important;border:1px solid var(--line)!important;box-shadow:var(--shadow-md)!important}
.apexcharts-tooltip-title{background:#F1F5F9!important;border-bottom:1px solid var(--line)!important}
.legend{margin-top:9px;display:flex;flex-wrap:wrap;gap:14px;color:var(--muted);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;display:inline-block;border:1px solid rgba(15,23,42,.15);border-radius:2px}
.note{
  margin-top:12px;
  padding:9px 10px;
  display:flex;
  align-items:flex-start;
  gap:7px;
  color:#334155;
  background:#F1F5F9;
  border-left:3px solid var(--color-primary);
  font-size:11px;
}
.note .ms{flex:none;color:var(--color-primary);font-size:16px}
@keyframes view-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grid-in{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@media(max-width:1024px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.g32{grid-template-columns:minmax(0,1fr)}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:768px){
  .tb-in{width:min(100% - 24px,1360px)}
  nav.tabs{top:64px}
  main{width:min(100% - 24px,1360px);padding-top:18px}
  .g3,.g2{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .card{padding:15px}
  .screen-head{margin-bottom:14px}
}
@media(max-width:560px){
  .tb-status .txt{display:none}
  .tabs button{min-width:48px;padding:10px}
  .tabs button .lbl{display:none}
  .tabs button .idx{display:none}
  .g4{grid-template-columns:1fr}
  .kpi{padding:15px}
  .kpi .k-val{font-size:25px}
  .screen-head .ic{width:40px;height:40px}
  .screen-head h2{font-size:20px}
  table{font-size:12px}
  th,td{padding:9px 10px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
    transition-duration:.01ms!important;
  }
  #view,.kpi{animation:none!important;transform:none!important}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="tb-in">
    <div class="brand">
      <div class="logo"><span class="ms">account_tree</span></div>
      <div><b>Traceability Control</b><span>產品追溯系統 · 控制中心</span></div>
    </div>
    <div class="tb-status">
      <span class="dot"></span><span class="txt">即時採集中 · 資料完整率 99.2%</span>
    </div>
  </div>
</header>
<nav class="tabs">
  <div class="tabs-in" id="tabs">
    <button data-i="0" onclick="show(0)"><span class="idx mono">01</span><span class="ms">inventory_2</span><span class="lbl">物料批次履歷</span></button>
    <button data-i="1" onclick="show(1)"><span class="idx mono">02</span><span class="ms">link</span><span class="lbl">投料綁定</span></button>
    <button data-i="2" onclick="show(2)"><span class="idx mono">03</span><span class="ms">precision_manufacturing</span><span class="lbl">製程參數關聯</span></button>
    <button data-i="3" onclick="show(3)"><span class="idx mono">04</span><span class="ms">qr_code_2</span><span class="lbl">序號生成</span></button>
    <button data-i="4" onclick="show(4)"><span class="idx mono">05</span><span class="ms">account_tree</span><span class="lbl">雙向追溯查詢</span></button>
    <button data-i="5" onclick="show(5)"><span class="idx mono">06</span><span class="ms">campaign</span><span class="lbl">召回影響分析</span></button>
  </div>
</nav>
<main><div id="view"></div></main>

<script>
"use strict";
var AX="#475569", GRID="#E2E8F0", ACC="#2563EB", ACC2="#3B82F6";
var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function el(id){return document.getElementById(id);}

var MODULES=[
  {icon:"inventory_2",name:"物料批次履歷",desc:"來料批號、供應商與收貨紀錄"},
  {icon:"link",name:"投料綁定",desc:"工單投料與批次逐筆綁定"},
  {icon:"precision_manufacturing",name:"製程參數關聯",desc:"機台、人員與製程數值自動採集"},

      +fn('問題批次投入','180,000 pcs 電容',100,'#6d28d9')
      +fn('波及工單','7 張工單',72,'#7c3aed')
      +fn('波及序號','1,240 pcs 成品',54,'#8b5cf6')
      +fn('已出貨序號','860 pcs',40,'#a78bfa')
      +fn('需召回客戶','5 家 · 18 張出貨單',28,'#c4b5fd')
      +'</div><div class="note"><span class="ms">bolt</span>由問題批次一鍵反查，範圍自動收斂，取代人工比對逐張出貨單</div></div>'
    +'<div class="card"><h3><span class="ms">radar</span>召回應變評估雷達</h3><div id="c5" class="chart"></div></div>'
    +'</div>';
  h+='<div class="card split14"><h3><span class="ms">list_alt</span>受影響出貨清單</h3>'
    +'<div class="tbl-wrap"><table><thead><tr><th>出貨單</th><th>客戶</th><th>成品序號範圍</th><th>數量</th><th>出貨日</th><th>召回狀態</th></tr></thead><tbody>'
    +rtr('DO-88213','CUST-A 精機','SN-CX200-000460 ~ 000520','60','08-06','p-bad','已通知')
    +rtr('DO-88190','CUST-B 自動化','SN-S30-001100 ~ 001180','80','08-05','p-warn','評估中')
    +rtr('DO-88155','CUST-C 電子','SN-CX200-000401 ~ 000459','58','08-04','p-ok','已回收')
    +rtr('DO-88121','CUST-D 儀器','SN-D70-000320 ~ 000377','57','08-03','p-warn','評估中')
    +rtr('DO-88098','CUST-E 系統','SN-CX200-000350 ~ 000400','50','08-02','p-info','待出貨攔截')
    +'</tbody></table></div>'
    +'<div class="note"><span class="ms">verified_user</span>依 RULE-02 與追溯譜系，未出貨部分於出貨站自動攔截，避免問題品流出</div></div>';
  return h;
}
function fn(t,s,w,col){return '<div class="step" style="width:'+w+'%;min-width:180px;background:'+col+'">'+t+'<small>'+s+'</small></div>';}
function rtr(d,c,r,q,dt,cls,st){
  return '<tr><td class="mono" style="color:var(--accent2)">'+d+'</td><td>'+c+'</td><td class="mono">'+r+'</td><td class="mono">'+q+'</td><td class="mono">'+dt+'</td><td><span class="pill '+cls+'">'+st+'</span></td></tr>';
}
function s5charts(){
  var o=baseChart('radar',280);
  o.series=[{name:'本次召回',data:[85,70,60,90,55,75]}];
  o.colors=[ACC2];
  o.stroke={width:2};
  o.fill={opacity:.25,colors:[ACC]};
  o.markers={size:3,colors:[ACC2]};
  o.xaxis={categories:['波及範圍','出貨滲透','客戶數','定位速度','庫存可攔截','資料完整'],labels:{style:{colors:AX}}};
  o.yaxis={show:false,max:100};
  o.plotOptions={radar:{polygons:{strokeColors:GRID,connectorColors:GRID}}};
  var c=new ApexCharts(el('c5'),o);c.render();charts.push(c);
}

/* ---------- render router ---------- */
var RENDER=[s0,s1,s2,s3,s4,s5];
var CHARTS=[s0charts,s1charts,s2charts,s3charts,s4charts,s5charts];
var cur=-1;
function show(i){
  if(i===cur)return;
  killCharts();
  cur=i;
  var v=el('view');
  v.innerHTML=RENDER[i]();
  var btns=document.querySelectorAll('[data-i]');
  for(var b=0;b<btns.length;b++){btns[b].className=(+btns[b].getAttribute('data-i')===i)?'on':'';}
  void v.offsetHeight;
  CHARTS[i]();
}
show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
