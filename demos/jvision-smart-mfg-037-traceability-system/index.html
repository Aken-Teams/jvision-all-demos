<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>產品追溯系統（Traceability System）｜Jvision Demo</title>
<meta name="description" content="物料批次履歷、投料綁定、製程參數關聯、序號生成與雙向追溯查詢的控制中心" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#7c3aed; --accent2:#a78bfa;
  --bg:#0e0b1a; --panel:#171227; --panel2:#1f1836; --line:#2c2444;
  --ink:#ece9f6; --muted:#9a90b8; --dim:#6f6690;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --info:#60a5fa;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:radial-gradient(1200px 700px at 80% -10%,rgba(124,58,237,.18),transparent 60%),var(--bg);
  color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased;
}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
/* top nav */
.topbar{position:sticky;top:0;z-index:30;background:rgba(14,11,26,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tb-in{max-width:1360px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.brand b{font-size:15px;font-weight:800;white-space:nowrap}
.brand span{font-size:11px;color:var(--muted);display:block;font-weight:500}
.tb-status{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(52,211,153,.18)}
nav.tabs{background:var(--panel);border-bottom:1px solid var(--line)}
.tabs-in{max-width:1360px;margin:0 auto;padding:8px 12px;display:flex;gap:8px;flex-wrap:wrap}
.tabs button{flex:none;white-space:nowrap;min-width:0;display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.tabs button .ms{font-size:19px}
.tabs button:hover{color:var(--ink);border-color:var(--accent2)}
.tabs button.on{background:linear-gradient(135deg,var(--accent),#6d28d9);color:#fff;border-color:transparent;box-shadow:0 6px 18px -6px rgba(124,58,237,.6)}
.tabs button .idx{font-size:11px;opacity:.7}
main{max-width:1360px;margin:0 auto;padding:18px 16px 60px}
/* headings */
.screen-head{display:flex;align-items:flex-start;gap:12px;margin:2px 0 16px}
.screen-head .ic{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,rgba(124,58,237,.35),rgba(167,139,250,.18));border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--accent2);flex:none}
.screen-head h2{margin:0;font-size:19px;font-weight:800}
.screen-head p{margin:3px 0 0;font-size:13px;color:var(--muted)}
/* generic panel */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .ms{font-size:18px;color:var(--accent2)}
.sub{font-size:12px;color:var(--dim);font-weight:500}
/* grids */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:1.6fr 1fr}
.g32{grid-template-columns:1fr 1.5fr}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
}
/* kpi */
.kpi{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0}
.kpi .k-top{display:flex;align-items:center;justify-content:space-between}
.kpi .k-ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.kpi .k-lbl{font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:500}
.kpi .k-val{font-size:26px;font-weight:800;letter-spacing:-.5px}
.kpi .k-val small{font-size:13px;color:var(--muted);font-weight:600;margin-left:3px}
.kpi .k-chg{font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px}
.up{color:var(--ok);background:rgba(52,211,153,.12)}
.down{color:var(--bad);background:rgba(248,113,113,.12)}
.neu{color:var(--info);background:rgba(96,165,250,.12)}
/* table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th{text-align:left;padding:9px 12px;color:var(--dim);font-weight:600;font-size:11px;letter-spacing:.4px;text-transform:uppercase;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid rgba(44,36,68,.6);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(124,58,237,.06)}
.mono{font-family:"Inter",monospace;font-variant-numeric:tabular-nums;letter-spacing:.3px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.p-ok{color:var(--ok);background:rgba(52,211,153,.13)}
.p-warn{color:var(--warn);background:rgba(251,191,36,.13)}
.p-bad{color:var(--bad);background:rgba(248,113,113,.13)}
.p-info{color:var(--info);background:rgba(96,165,250,.13)}
.p-muted{color:var(--muted);background:rgba(154,144,184,.12)}
/* progress */
.bar{height:7px;border-radius:20px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
/* binding board */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:820px){.board{grid-template-columns:1fr}}
.wo{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.wo .wo-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.wo .wo-h b{font-size:13px}
.lot{display:flex;align-items:center;gap:8px;font-size:12px;padding:7px 9px;border-radius:9px;background:var(--panel);border:1px solid var(--line);margin-top:6px}
.lot .mono{color:var(--accent2);font-weight:600}
.lot .ms{font-size:15px}
/* matrix */
.mtx-wrap{overflow-x:auto}
.mtx{border-collapse:separate;border-spacing:4px;min-width:560px}
.mtx td,.mtx th{padding:0}
.cell{width:100%;border-radius:8px;padding:9px 6px;text-align:center;font-size:12px;font-weight:600;color:#0b0716}
.mtx th{color:var(--dim);font-size:11px;font-weight:600;padding:4px;white-space:nowrap}
.mtx .rh{color:var(--muted);font-size:12px;font-weight:600;text-align:right;padding-right:8px;white-space:nowrap}
/* genealogy tree */
.tree{overflow-x:auto;padding:6px 2px}
.tree-in{display:flex;gap:0;align-items:stretch;min-width:640px}
.tcol{display:flex;flex-direction:column;justify-content:center;gap:10px;padding:0 4px;min-width:150px}
.tcol .tcap{font-size:11px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px;text-align:center}
.node{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:12px;position:relative}
.node b{display:block;font-size:12px}
.node .mono{color:var(--accent2);font-size:11px}
.node.root{border-color:var(--accent);box-shadow:0 0 0 1px rgba(124,58,237,.35),0 8px 20px -10px rgba(124,58,237,.5)}
.conn{display:flex;align-items:center;color:var(--line);flex:none}
.conn .ms{font-size:22px;color:var(--accent2);opacity:.5}
/* timeline */
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--accent),var(--accent2))}
.tl .ev{position:relative;padding:0 0 16px 6px}
.tl .ev:last-child{padding-bottom:0}
.tl .ev:before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 3px var(--panel)}
.tl .ev .t{font-size:11px;color:var(--dim);font-weight:600}
.tl .ev b{font-size:13px;display:block;margin:2px 0}
.tl .ev p{margin:0;font-size:12px;color:var(--muted)}
/* funnel */
.fn{display:flex;flex-direction:column;gap:9px;align-items:center}
.fn .step{border-radius:10px;padding:11px 12px;text-align:center;color:#fff;font-weight:700;font-size:13px;box-shadow:0 6px 16px -8px rgba(0,0,0,.6)}
.fn .step small{display:block;font-weight:500;font-size:11px;opacity:.85;margin-top:2px}
/* serial cards */
.serchip{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px;display:flex;gap:10px;align-items:center;min-width:0}
.serchip .qr{width:40px;height:40px;border-radius:8px;background:conic-gradient(from 45deg,var(--accent),var(--accent2),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.serchip .sm{font-size:11px;color:var(--muted)}
.serchip .sb{font-size:13px;font-weight:700}
.list{display:flex;flex-direction:column;gap:9px}
.rowline{display:flex;align-items:center;gap:10px;font-size:12px;padding:9px 11px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);min-width:0}
.rowline .grow{flex:1;min-width:0}
.chart{width:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
.note{font-size:11px;color:var(--dim);margin-top:10px;display:flex;align-items:center;gap:6px}
@media(max-width:560px){ .tabs button .lbl{display:none} .tb-status .txt{display:none} }
.split14{margin-top:14px}
</style>
</head>
<body>
<header class="topbar">
  <div class="tb-in">
    <div class="brand">
      <div class="logo"><span class="ms">account_tree</span></div>
      <div><b>Traceability Control</b><span>產品追溯系統 · 控制中心</span></div>
    </div>
    <div class="tb-status">
      <span class="dot"></span><span class="txt">即時採集中 · 資料完整率 99.2%</span>
    </div>
  </div>
</header>
<nav class="tabs">
  <div class="tabs-in" id="tabs">
    <button data-i="0" onclick="show(0)"><span class="idx mono">01</span><span class="ms">inventory_2</span><span class="lbl">物料批次履歷</span></button>
    <button data-i="1" onclick="show(1)"><span class="idx mono">02</span><span class="ms">link</span><span class="lbl">投料綁定</span></button>
    <button data-i="2" onclick="show(2)"><span class="idx mono">03</span><span class="ms">precision_manufacturing</span><span class="lbl">製程參數關聯</span></button>
    <button data-i="3" onclick="show(3)"><span class="idx mono">04</span><span class="ms">qr_code_2</span><span class="lbl">序號生成</span></button>
    <button data-i="4" onclick="show(4)"><span class="idx mono">05</span><span class="ms">account_tree</span><span class="lbl">雙向追溯查詢</span></button>
    <button data-i="5" onclick="show(5)"><span class="idx mono">06</span><span class="ms">campaign</span><span class="lbl">召回影響分析</span></button>
  </div>
</nav>
<main><div id="view"></div></main>

<script>
"use strict";
var AX="#9a90b8", GRID="#2c2444", ACC="#7c3aed", ACC2="#a78bfa";
var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function el(id){return document.getElementById(id);}

var MODULES=[
  {icon:"inventory_2",name:"物料批次履歷",desc:"來料批號、供應商與收貨紀錄"},
  {icon:"link",name:"投料綁定",desc:"工單投料與批次逐筆綁定"},
  {icon:"precision_manufacturing",name:"製程參數關聯",desc:"機台、人員與製程數值自動採集"},
  {icon:"qr_code_2",name:"序號生成",desc:"完工序號賦碼與譜系建立"},
  {icon:"account_tree",name:"雙向追溯查詢",desc:"序號/批號正逆向鑽取譜系"},
  {icon:"campaign",name:"召回影響分析",desc:"客訴定位波及範圍與出貨清單"}
];

/* ---------- helpers ---------- */
function baseChart(type,height){
  return {chart:{type:type,height:height,fontFamily:'Inter,Noto Sans TC,sans-serif',foreColor:AX,
    toolbar:{show:false},redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false}},
    grid:{borderColor:GRID,strokeDashArray:3},
    tooltip:{theme:'dark'},dataLabels:{enabled:false},legend:{labels:{colors:AX}}};
}
function kpi(ic,color,lbl,val,unit,chg,cls){
  return '<div class="kpi"><div class="k-top"><div class="k-ic" style="background:'+color+'"><span class="ms">'+ic+'</span></div>'
    +'<span class="k-chg '+cls+'">'+chg+'</span></div>'
    +'<div class="k-lbl">'+lbl+'</div><div class="k-val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div></div>';
}
function head(i){
  var m=MODULES[i];
  return '<div class="screen-head"><div class="ic"><span class="ms">'+m.icon+'</span></div>'
    +'<div><h2>'+m.name+'</h2><p>'+m.desc+'</p></div></div>';
}

/* ================= SCREEN 0 : 物料批次履歷 ================= */
function s0(){
  var rows=[
    {lot:"LOT-AL6061-2408A",mat:"鋁擠型 6061-T6",sup:"晶鋁金屬",qty:"4,800 kg",date:"08-11 07:20",coa:"ok",st:"可用"},
    {lot:"LOT-PCB-K220",mat:"主板 PCB K220",sup:"宏泰電路",qty:"12,000 pcs",date:"08-11 09:05",coa:"ok",st:"可用"},
    {lot:"LOT-CAP-104J",mat:"電容 104J 50V",sup:"國巨被動",qty:"180,000 pcs",date:"08-10 14:40",coa:"warn",st:"待複驗"},
    {lot:"LOT-SCR-M3X8",mat:"螺絲 M3x8 不鏽鋼",sup:"順鎖五金",qty:"56,000 pcs",date:"08-10 11:12",coa:"ok",st:"可用"},
    {lot:"LOT-LCD-70T",mat:"LCD 面板 7.0\"",sup:"友達光電",qty:"3,200 pcs",date:"08-09 16:30",coa:"bad",st:"隔離"},
    {lot:"LOT-WIRE-24AWG",mat:"線材 24AWG",sup:"泰昌電線",qty:"8,500 m",date:"08-09 08:55",coa:"ok",st:"可用"}
  ];
  var stMap={"可用":"p-ok","待複驗":"p-warn","隔離":"p-bad"};
  var coaMap={ok:['p-ok','check_circle','合格'],warn:['p-warn','pending','待驗'],bad:['p-bad','cancel','退回']};
  var tr="";
  for(var i=0;i<rows.length;i++){var r=rows[i];var c=coaMap[r.coa];
    tr+='<tr><td class="mono" style="color:var(--accent2);font-weight:600">'+r.lot+'</td><td>'+r.mat+'</td><td>'+r.sup+'</td>'
      +'<td class="mono">'+r.qty+'</td><td class="mono">'+r.date+'</td>'
      +'<td><span class="pill '+c[0]+'"><span class="ms">'+c[1]+'</span>'+c[2]+'</span></td>'
      +'<td><span class="pill '+stMap[r.st]+'">'+r.st+'</span></td></tr>';
  }
  var h=head(0);
  h+='<div class="grid g4">'
    +kpi('inventory_2','linear-gradient(135deg,#7c3aed,#a78bfa)','在庫批次','1,284','批','+42','up')
    +kpi('local_shipping','linear-gradient(135deg,#2563eb,#60a5fa)','本日入庫','36','批','+9','up')
    +kpi('verified','linear-gradient(135deg,#059669,#34d399)','COA 合格率','98.6','%','+0.7','up')
    +kpi('block','linear-gradient(135deg,#dc2626,#f87171)','隔離批次','7','批','+2','down')
    +'</div>';
  h+='<div class="grid g23 split14">'
    +'<div class="card"><h3><span class="ms">receipt_long</span>來料批次收貨明細 <span class="sub">· 近 3 日</span></h3>'
      +'<div class="tbl-wrap"><table><thead><tr><th>批號</th><th>物料</th><th>供應商</th><th>數量</th><th>收貨時間</th><th>COA</th><th>狀態</th></tr></thead><tbody>'+tr+'</tbody></table></div></div>'
    +'<div class="card"><h3><span class="ms">show_chart</span>每日入庫批次趨勢</h3><div id="c0" class="chart"></div>'
      +'<div class="note"><span class="ms">info</span>入庫即建立批號履歷，供後段投料綁定引用</div></div>'
    +'</div>';
  return h;
}
function s0charts(){
  var o=baseChart('area',260);
  o.series=[{name:'入庫批次',data:[22,28,25,31,29,36,33]},{name:'隔離批次',data:[2,1,3,2,4,2,3]}];
  o.colors=[ACC,'#f87171'];
  o.stroke={curve:'smooth',width:2};
  o.fill={type:'gradient',gradient:{opacityFrom:.35,opacityTo:.03}};
  o.xaxis={categories:['08-05','08-06','08-07','08-08','08-09','08-10','08-11'],labels:{style:{colors:AX}}};
  o.yaxis={labels:{style:{colors:AX}}};
  var c=new ApexCharts(el('c0'),o);c.render();charts.push(c);
}

/* ================= SCREEN 1 : 投料綁定 ================= */
function s1(){
  var wos=[
    {wo:"WO-24081101",prod:"控制器 CX-200",pct:100,st:"已綁定",cls:"p-ok",lots:[["鋁擠型","LOT-AL6061-2408A"],["主板","LOT-PCB-K220"],["電容","LOT-CAP-104J"]]},
    {wo:"WO-24081102",prod:"感測模組 S-30",pct:66,st:"綁定中",cls:"p-info",lots:[["PCB","LOT-PCB-K220"],["線材","LOT-WIRE-24AWG"],["螺絲","未綁定"]]},
    {wo:"WO-24081103",prod:"顯示單元 D-70",pct:33,st:"待綁定",cls:"p-warn",lots:[["LCD","隔離中"],["線材","LOT-WIRE-24AWG"],["外殼","未綁定"]]}
  ];
  var b="";
  for(var i=0;i<wos.length;i++){var w=wos[i];
    var lt="";
    for(var j=0;j<w.lots.length;j++){var l=w.lots[j];var bad=(l[1].indexOf('LOT')!==0);
      lt+='<div class="lot"><span class="ms" style="color:'+(bad?'#fbbf24':'#34d399')+'">'+(bad?'link_off':'link')+'</span>'
        +'<span>'+l[0]+'</span><span class="mono" style="margin-left:auto;color:'+(bad?'#9a90b8':'#a78bfa')+'">'+l[1]+'</span></div>';
    }
    b+='<div class="wo"><div class="wo-h"><b>'+w.wo+'</b><span class="pill '+w.cls+'">'+w.st+'</span></div>'
      +'<div class="sub" style="margin-bottom:8px">'+w.prod+'</div>'
      +'<div class="bar"><i style="width:'+w.pct+'%"></i></div>'
      +'<div class="sub" style="margin:6px 0 2px">綁定進度 '+w.pct+'%</div>'+lt+'</div>';
  }
  var h=head(1);
  h+='<div class="grid g4">'
    +kpi('link','linear-gradient(135deg,#7c3aed,#a78bfa)','今日投料綁定','218','筆','+31','up')
    +kpi('task_alt','linear-gradient(135deg,#059669,#34d399)','綁定完成工單','14','張','+3','up')
    +kpi('link_off','linear-gradient(135deg,#d97706,#fbbf24)','待綁定物料','9','項','-4','up')
    +kpi('error','linear-gradient(135deg,#dc2626,#f87171)','綁定異常攔截','2','件','+2','down')
    +'</div>';
  h+='<div class="card split14"><h3><span class="ms">dashboard_customize</span>工單投料綁定看板 <span class="sub">· 掃碼即時綁定物料批次</span></h3>'
    +'<div class="board">'+b+'</div>'

/* ---------- render router ---------- */
var RENDER=[s0,s1,s2,s3,s4,s5];
var CHARTS=[s0charts,s1charts,s2charts,s3charts,s4charts,s5charts];
var cur=-1;
function show(i){
  if(i===cur)return;
  killCharts();
  cur=i;
  var v=el('view');
  v.innerHTML=RENDER[i]();
  var btns=document.querySelectorAll('[data-i]');
  for(var b=0;b<btns.length;b++){btns[b].className=(+btns[b].getAttribute('data-i')===i)?'on':'';}
  void v.offsetHeight;
  CHARTS[i]();
}
show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m)return;var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
