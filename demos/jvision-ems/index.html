<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>能源管理 EMS · Energy Management</title>
<meta name="description" content="智慧電表、用電監控、需量控制、節能群控、碳排計算與能源報表互動展示"/>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--accent:#ea580c;--accent2:#fb923c;--ink:#1c1917;--bg:#f5f3f0;--card:#fff;--line:#e7e2db;--mut:#78716c;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#2563eb;--purple:#7c3aed;--dark:#1c1410;--dark2:#2a201a}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.shell{display:flex;min-height:100vh;align-items:stretch}
.side{width:236px;flex:none;background:linear-gradient(180deg,var(--dark),var(--dark2));color:#e7e2db;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden}
.sbrand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:900;color:#fff;flex:none;box-shadow:0 8px 20px rgba(234,88,12,.4);font-family:"Noto Sans TC"}
.sbrand b{font-size:15px;font-weight:800;display:block;font-family:"Noto Sans TC";color:#fff}
.sbrand span{font-size:9.5px;color:var(--accent2);letter-spacing:2px}
.nav{display:flex;flex-direction:column;gap:3px;padding:14px 12px;flex:1;min-width:0;overflow-y:auto}
.nav button{border:0;background:transparent;color:#b8b0a7;font:inherit;font-weight:600;font-size:13.5px;padding:11px 13px;border-radius:11px;cursor:pointer;display:flex;align-items:center;gap:11px;flex:none;white-space:nowrap;font-family:"Noto Sans TC";text-align:left;width:100%}
.nav button .material-symbols-outlined{font-size:20px;flex:none}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(234,88,12,.35)}
.sfoot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:10.5px;color:#9c9389;line-height:1.7}
.sfoot .ss{display:flex;align-items:center;gap:7px;color:var(--accent2);font-weight:700;margin-bottom:4px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:14px 24px;position:sticky;top:0;z-index:10;flex-wrap:wrap}
.top .vt{margin:0;font-size:19px;font-family:"Noto Sans TC";font-weight:900}
.top .vd{margin:2px 0 0;color:var(--mut);font-size:12.5px}
.live{margin-left:auto;background:#fff1e7;color:var(--accent);padding:7px 14px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:7px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}
.wrap{padding:22px 24px;max-width:1360px;width:100%;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpis>*{min-width:0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;width:4px;height:100%;background:var(--accent)}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .v small{font-size:12px;font-weight:600;color:var(--mut)}
.kpi .d{font-size:11px;font-weight:700;margin-top:3px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.22;font-size:32px}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.2fr .8fr}
.g21{grid-template-columns:1fr 1fr}
.g31{grid-template-columns:1fr 1fr 1fr}
.g13{grid-template-columns:.85fr 1.15fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#dcfce7;color:#15803d}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#dbeafe;color:#1d4ed8}.t-ac{background:#ffedd5;color:#c2410c}.t-pu{background:#ede9fe;color:#6d28d9}.t-mut{background:#f0ede8;color:#57534e}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#faf7f3}
table.data td b{font-family:"Noto Sans TC"}
table.data tr:hover td{background:#fdf9f4}
.scroll{overflow-x:auto}
.note{font-size:11.5px;color:var(--mut);margin:13px 0 0;line-height:1.65}
/* signature: live load gauge */
.gauge{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring{--p:0;width:150px;height:150px;border-radius:50%;flex:none;background:conic-gradient(var(--accent) calc(var(--p)*1%),#f0ede8 0);display:grid;place-items:center;position:relative}
.ring:after{content:"";position:absolute;inset:16px;background:var(--card);border-radius:50%}
.ring .in{position:relative;z-index:1;text-align:center}
.ring .in b{font-family:Inter;font-size:30px;font-weight:900;color:var(--accent);display:block;line-height:1}
.ring .in small{font-size:11px;color:var(--mut)}
.gstat{flex:1;min-width:180px;display:flex;flex-direction:column;gap:9px}
.gr{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;border-bottom:1px dashed var(--line);padding-bottom:8px}
.gr:last-child{border-bottom:0}
.gr b{font-family:Inter;font-weight:800}
/* meter list rows */
.mrow{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.mrow .mi{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.mrow .mid b{font-size:12.5px;font-family:"Noto Sans TC"}
.mrow .mid small{color:var(--mut);font-size:11px;display:block;margin-top:1px}
.bar{height:6px;border-radius:4px;background:#f0ede8;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.mlist{display:flex;flex-direction:column;gap:9px}
/* demand board */
.dbar{display:flex;flex-direction:column;gap:10px}
.db{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.db .dh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.db .dh b{font-family:"Noto Sans TC";font-size:13px;display:flex;align-items:center;gap:8px}
.db .dh .rk{width:22px;height:22px;border-radius:7px;color:#fff;font-family:Inter;font-weight:800;font-size:11px;display:grid;place-items:center}
.db .hb{height:9px;background:#f0ede8;border-radius:6px;margin-top:10px;overflow:hidden}
.db .hb i{display:block;height:100%;border-radius:6px}
.db .dm{display:flex;gap:16px;margin-top:8px;font-size:11px;color:var(--mut);flex-wrap:wrap}
.db .dm b{color:var(--ink);font-family:Inter}
/* equipment control cards */
.eqg{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.eqg>*{min-width:0}
.eq{border:1px solid var(--line);border-radius:14px;padding:14px;position:relative;overflow:hidden}
.eq .et{display:flex;align-items:center;gap:9px;font-family:"Noto Sans TC";font-weight:800;font-size:13.5px}
.eq .et .ei{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
.eq .es{font-family:Inter;font-weight:900;font-size:24px;margin:11px 0 2px}
.eq .esub{font-size:11px;color:var(--mut)}
.eq .sw{margin-top:11px;display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--mut)}
.pill{width:40px;height:22px;border-radius:20px;position:relative;flex:none}
.pill.on{background:var(--accent)}.pill.off{background:#d6cfc6}
.pill:after{content:"";position:absolute;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.pill.on:after{left:21px}.pill.off:after{left:3px}
/* schedule strip */
.sch{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;font-size:12px}
.srow .sn{font-family:"Noto Sans TC";font-weight:700}
.track{height:26px;background:#f0ede8;border-radius:8px;position:relative;overflow:hidden}
.seg{position:absolute;top:0;height:100%;border-radius:8px;display:grid;place-items:center;font-size:10px;color:#fff;font-weight:700}
/* target progress */
.tp{display:flex;flex-direction:column;gap:12px}
.tprow .tt{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px}
.tprow .tt b{font-family:"Noto Sans TC"}
.tprow .tt .num{font-family:Inter;font-weight:800}
.tbar{height:12px;border-radius:8px;background:#f0ede8;overflow:hidden;position:relative}
.tbar i{display:block;height:100%;border-radius:8px}
.tbar .goal{position:absolute;top:-3px;width:2px;height:18px;background:var(--ink)}
/* scope pills */
.sp{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.sp>*{min-width:0}
.spc{border:1px solid var(--line);border-radius:13px;padding:13px 15px;position:relative;overflow:hidden;background:var(--card)}
.spc .ch{position:absolute;left:0;top:0;width:5px;height:100%}
.spc b{font-family:"Noto Sans TC";font-size:12.5px}
.spc .big{font-family:Inter;font-weight:900;font-size:23px;margin-top:5px}
.spc small{color:var(--mut);font-size:11px;display:block;margin-top:2px}
/* alarm timeline */
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.ti{position:relative;padding:0 0 15px 6px}
.ti:last-child{padding-bottom:0}
.ti .pt{position:absolute;left:-19px;top:2px;width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.ti.bad .pt{border-color:var(--bad)}.ti.ok .pt{background:var(--ok);border-color:var(--ok)}.ti.now .pt{border-color:var(--warn);animation:pulse 1.8s ease-in-out infinite}
.ti .th2{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.ti b{font-family:"Noto Sans TC";font-size:12.5px}
.ti small{color:var(--mut);font-size:11px;display:block;margin-top:1px}
.ti .tm{font-family:Inter;font-size:11px;color:var(--mut);font-weight:700}
/* report cards */
.rpt{display:flex;flex-direction:column;gap:10px}
.rr{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.rr .ri{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.rr .mid b{font-size:13px;font-family:"Noto Sans TC"}
.rr .mid small{color:var(--mut);font-size:11px;display:block;margin-top:1px}
.chartbox{position:relative}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.eqg{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){.shell{flex-direction:column}.side{width:100%;height:auto;position:sticky;top:0;flex-direction:row;align-items:center;flex-wrap:wrap}.sbrand{border-bottom:0;padding:12px 16px}.nav{flex-direction:row;flex-wrap:wrap;padding:8px 12px;overflow:visible}.nav button{width:auto;padding:9px 12px}.sfoot{display:none}}
@media(max-width:820px){.g2,.g21,.g31,.g13{grid-template-columns:1fr}.sp{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:16px 14px}.eqg{grid-template-columns:1fr}.nav button span:not(.material-symbols-outlined){display:none}.nav button{padding:9px}.top{padding:12px 16px}}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
  <div class="sbrand"><div class="logo">能</div><div><b>能源管理 EMS</b><span>ENERGY MGMT</span></div></div>
  <nav class="nav" id="nav"></nav>
  <div class="sfoot"><div class="ss"><span class="dot"></span>系統連線正常</div>資料更新 08:42 · 電表節點 128<br/>台南廠 · 契約容量 4,500 kW</div>
</aside>
<div class="main">
  <header class="top">
    <div><h2 class="vt" id="vt">能源即時監控</h2><p class="vd" id="vd"></p></div>
    <div class="live"><span class="dot"></span><span id="vl">即時 · 每 5 秒刷新</span></div>
  </header>
  <main class="wrap"><div id="view"></div></main>
</div>
</div>
<script>
const MOD=[
 ["能源即時監控","dashboard","能源即時監控","全廠即時功率、負載率與同時率總覽","即時 · 每 5 秒刷新"],
 ["智慧電表管理","electric_meter","智慧電表管理","各回路智慧電表讀值與分項用電計量","128 顆電表 · 全線上"],
 ["需量控制","bolt","需量控制","契約容量監控、需量預測與尖峰卸載","本期最高需量 3,980 kW"],
 ["節能設備控制","eco","節能設備控制","空調/照明/馬達群控與排程節能","5 群組 · 節能模式運轉中"],
 ["碳排計算","co2","碳排計算","用能換算 tCO₂e 與減碳目標追蹤","FY2025 減碳 -14.2%"],
 ["告警與能源報表","notifications_active","告警與能源報表","異常告警派工與能源／碳排報表","今日告警 6 件 · 2 未結"]
];
const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd'),vl=document.getElementById('vl');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span><span>'+m[0]+'</span>';b.onclick=()=>show(i);nav.appendChild(b);});

/* ---------- data ---------- */
const METERS=[
 ["MT-A01","主變壓器 #1","高壓進線","1,284 kW","bolt","#ea580c",82,"正常","t-ok"],
 ["MT-A02","主變壓器 #2","高壓進線","1,156 kW","bolt","#ea580c",74,"正常","t-ok"],
 ["MT-B11","空調冰水主機","動力回路","642 kW","ac_unit","#2563eb",88,"偏高","t-warn"],
 ["MT-B12","空壓機群","動力回路","318 kW","compress","#7c3aed",63,"正常","t-ok"],
 ["MT-C21","射出成型區","製程回路","486 kW","precision_manufacturing","#c2410c",71,"正常","t-ok"],
 ["MT-C22","表面處理線","製程回路","294 kW","science","#16a34a",58,"正常","t-ok"],
 ["MT-D31","照明總回路","公共回路","96 kW","lightbulb","#d97706",41,"節能中","t-info"],
 ["MT-D32","辦公空調","公共回路","128 kW","meeting_room","#0891b2",52,"正常","t-ok"]
];
const DEMAND=[
 [1,"空調冰水主機","動力",642,"尖峰第一卸載","#dc2626",90],
 [2,"空壓機群","動力",318,"可調頻降載","#ea580c",70],
 [3,"射出成型區","製程",486,"排程可延","#d97706",64],
 [4,"表面處理線","製程",294,"維持運轉","#16a34a",42],
 [5,"辦公空調","公共",128,"末段卸載","#2563eb",30]
];
const EQ=[
 ["中央空調","ac_unit","#2563eb","24.5 °C","冰水出水 · 節能設定 +1℃","on","群控 · 自動"],
 ["空壓系統","compress","#7c3aed","6.8 bar","卸載壓力優化 · 變頻","on","群控 · 自動"],
 ["廠區照明","lightbulb","#d97706","41 %","日光感測調光 · 分區","on","排程 · 自動"],
 ["製程馬達群","settings","#c2410c","運轉 18/22","變頻節能 · 尖峰降載","on","群控 · 手動"],
 ["辦公空調","meeting_room","#0891b2","26.0 °C","下班預冷關閉 · 排程","off","排程 · 自動"],
 ["熱回收機組","recycling","#16a34a","回收 62 kW","廢熱回收預熱 · 常開","on","常開 · 自動"]
];
const SCHED=[
 ["中央空調","#2563eb",[[25,42,"預冷"],[67,20,"降載"]]],
 ["製程馬達","#c2410c",[[8,60,"生產"],[68,12,"尖峰降"]]],
 ["廠區照明","#d97706",[[0,29,"低亮"],[29,50,"日光調光"],[79,21,"低亮"]]],
 ["辦公空調","#0891b2",[[33,42,"運轉"]]]
];
const TARGET=[
 ["年度用電量","減 8% vs FY2024","6.2","% 已減","78","#ea580c","減 8%"],
 ["範疇二碳排","綠電抵減 + 節能","14.2","% 已減","83","#16a34a","減 17%"],
 ["能源密集度","kWh/產出單位","11.5","% 已改善","68","#2563eb","減 15%"],
 ["契約容量利用率","避免超約罰款","88.4","% 利用","88","#d97706","≤ 90%"]
];
const ALARMS=[
 ["08:38","空調冰水主機 MT-B11 負載率達 88%","建議啟動尖峰卸載，避免逼近契約容量","warn","派工中","t-warn","now"],
 ["08:15","主變壓器 #1 三相不平衡 4.2%","已通知電氣班巡檢，量測中","bad","處理中","t-bad","bad"],
 ["07:52","空壓機群 卸載壓力偏高","變頻器已自動調頻降載","info","已自動處理","t-info","ok"],
 ["06:40","照明總回路 進入日光調光模式","依排程自動節能，省 18 kW","ok","已完成","t-ok","ok"],
 ["05:20","辦公空調 下班預冷關閉","排程執行完成","ok","已完成","t-ok","ok"],
 ["昨 23:10","射出成型區 離峰時段負載超標","已記錄並排入次日檢討","warn","已結案","t-mut","ok"]
];
const REPORTS=[
 ["月度能源使用報表","2025-07 · 全廠用電 1.28 GWh","summarize","#ea580c","已產出","t-ok"],
 ["需量與契約容量分析","最高需量 3,980 kW · 未超約","monitoring","#2563eb","已產出","t-ok"],
 ["範疇二碳排報表","外購電力 606 tCO₂e","co2","#16a34a","彙整中","t-warn"],
 ["節能措施成效彙總","6 項措施 · 年省 84 萬度","savings","#7c3aed","已產出","t-ok"],
 ["ISO 50001 能源績效指標","EnPI 追蹤 · 待複核","verified","#d97706","待複核","t-warn"]
];

/* ---------- helpers ---------- */
function bar(pct,color){return '<div class="bar"><i style="width:'+pct+'%;background:'+color+'"></i></div>';}

/* ---------- screens ---------- */
const SCREENS=[
// v0 monitor
()=>`<div class="kpis">
 <div class="kpi"><span class="material-symbols-outlined ic">bolt</span><div class="l">即時總功率</div><div class="v">3,842 <small>kW</small></div><div class="d up">▲ 尖峰時段</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">speed</span><div class="l">負載率</div><div class="v">85.4 <small>%</small></div><div class="d" style="color:var(--warn)">接近契約 4,500 kW</div></div>

/* ---------- charts ---------- */
let CH=null;
function killChart(){if(CH){try{CH.destroy();}catch(e){}CH=null;}}
const gc='#e7e2db',tc='#78716c';
function draw(i){
 var ctx;
 if(i===0){ctx=document.getElementById('ch0');if(!ctx)return;
  const lb=[];for(let h=0;h<24;h++)lb.push((h<10?'0'+h:h)+':00');
  const dat=[1650,1520,1480,1440,1500,1780,2450,3180,3720,3980,3910,3860,4020,4180,4120,3980,3860,3540,3120,2680,2340,2080,1860,1720];
  CH=new Chart(ctx,{type:'line',data:{labels:lb,datasets:[{label:'即時功率 kW',data:dat,borderColor:'#ea580c',backgroundColor:'rgba(234,88,12,.12)',fill:true,tension:.35,pointRadius:0,borderWidth:2.5},{label:'契約容量',data:Array(24).fill(4500),borderColor:'#dc2626',borderDash:[6,5],pointRadius:0,borderWidth:1.5,fill:false}]},options:copt({},{y:{beginAtZero:true,max:5000}})});
 }
 if(i===1){ctx=document.getElementById('ch1');if(!ctx)return;
  CH=new Chart(ctx,{type:'doughnut',data:{labels:['高壓進線','空調動力','製程回路','空壓/馬達','公共照明','辦公空調'],datasets:[{data:[2440,642,780,318,96,128],backgroundColor:['#ea580c','#2563eb','#c2410c','#7c3aed','#d97706','#0891b2'],borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,animation:{duration:600},cutout:'58%',plugins:{legend:{position:'right',labels:{font:{size:11},color:tc,boxWidth:12}}}}});
 }
 if(i===2){ctx=document.getElementById('ch2');if(!ctx)return;
  const lb=['07:00','07:15','07:30','07:45','08:00','08:15','08:30','08:45','09:00'];
  CH=new Chart(ctx,{type:'line',data:{labels:lb,datasets:[
   {label:'實際需量 kW',data:[2450,2980,3320,3560,3720,3860,3980,3910,3842],borderColor:'#ea580c',backgroundColor:'rgba(234,88,12,.12)',fill:true,tension:.3,pointRadius:3,borderWidth:2.5},
   {label:'預測需量 kW',data:[null,null,null,null,null,null,3980,4060,4120],borderColor:'#d97706',borderDash:[5,4],pointRadius:2,borderWidth:2,fill:false},
   {label:'契約容量',data:Array(9).fill(4500),borderColor:'#dc2626',borderDash:[6,5],pointRadius:0,borderWidth:1.5,fill:false}]},options:copt({},{y:{beginAtZero:false,min:2000,max:5000}})});
 }
 if(i===3){ctx=document.getElementById('ch3');if(!ctx)return;
  CH=new Chart(ctx,{type:'bar',data:{labels:['中央空調','空壓系統','廠區照明','製程馬達','辦公空調','熱回收'],datasets:[{label:'節能量 kWh/日',data:[1280,640,410,980,320,1490],backgroundColor:['#2563eb','#7c3aed','#d97706','#c2410c','#0891b2','#16a34a'],borderRadius:6,borderWidth:0}]},options:copt({legend:false},{y:{beginAtZero:true}})});
 }
 if(i===4){ctx=document.getElementById('ch4');if(!ctx)return;
  CH=new Chart(ctx,{type:'bar',data:{labels:['2月','3月','4月','5月','6月','7月'],datasets:[
   {label:'範疇一',data:[42,41,40,39,39,38],backgroundColor:'#d97706',stack:'s',borderRadius:3},

 }
}
function copt(p,sc){
 const scales={x:Object.assign({grid:{display:false},ticks:{color:tc,font:{size:10.5}}},sc&&sc.x||{}),y:Object.assign({grid:{color:gc},ticks:{color:tc,font:{size:10.5}}},sc&&sc.y||{})};
 return {responsive:true,maintainAspectRatio:false,animation:{duration:600},interaction:{intersect:false,mode:'index'},plugins:{legend:(p&&p.legend===false)?{display:false}:{position:'bottom',labels:{font:{size:11},color:tc,boxWidth:14,usePointStyle:true}}},scales:scales};
}
function show(i){
 killChart();
 nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));
 vt.textContent=MOD[i][2];vd.textContent=MOD[i][3];vl.textContent=MOD[i][4];
 view.innerHTML=SCREENS[i]();
 void view.offsetHeight;
 draw(i);
}
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
