<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>能源管理 EMS · Energy Management</title>
<meta name="description" content="智慧電表、用電監控、需量控制、節能群控、碳排計算與能源報表互動展示"/>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#059669;--color-on-primary:#000;
  --color-secondary:#10b981;--color-on-secondary:#0f172a;
  --color-accent:#059669;--color-on-accent:#000;
  --color-background:#ecfdf5;--color-foreground:#064e3b;
  --color-card:#fff;--color-card-foreground:#064e3b;
  --color-muted:#e8f1f3;--color-muted-foreground:#475569;
  --color-border:#a7f3d0;--color-destructive:#dc2626;
  --color-on-destructive:#fff;--color-ring:#059669;
  --blue:#059669;--ink:#064e3b;--muted:#475569;--line:#a7f3d0;
  --gold:#b45309;--info:#1d4ed8;--purple:#6d28d9;
  --shadow:0 12px 32px rgba(6,78,59,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Fira Sans",sans-serif;line-height:1.5}
button{font:inherit}
button,a,[role=button]{cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:18px 14px;background:#064e3b;color:#fff;display:flex;flex-direction:column;overflow:auto}
.brand{display:flex;align-items:center;gap:12px;padding:6px 7px 20px}
.logo{width:44px;height:44px;border-radius:58% 42% 52% 48%/45% 56% 44% 55%;display:grid;place-items:center;background:#a7f3d0;color:#064e3b;box-shadow:0 8px 22px rgba(0,0,0,.18)}
.logo svg{width:25px;height:25px}
.brand b{display:block;font-size:16px}
.brand small{color:#a7f3d0;font:600 10px "Fira Code";letter-spacing:.12em}
.nav{display:grid;gap:5px}
.nav button{width:100%;border:0;border-radius:13px 20px 13px 18px;padding:12px;color:#d1fae5;background:transparent;text-align:left;display:flex;align-items:center;gap:11px;font-weight:600;transition:.2s}
.nav button svg{width:19px;height:19px;flex:none}
.nav button:hover{background:rgba(255,255,255,.1);color:#fff;transform:translateX(2px)}
.nav button.on{background:#a7f3d0;color:#064e3b;box-shadow:0 8px 20px rgba(0,0,0,.15)}
.sfoot{margin-top:auto;border-top:1px solid rgba(255,255,255,.15);padding:16px 7px 4px;color:#d1fae5;font-size:11px}
.status{display:flex;align-items:center;gap:7px;font-weight:700;margin-bottom:5px}
.dot{width:9px;height:9px;border-radius:50%;background:#6ee7b7;box-shadow:0 0 0 4px rgba(110,231,183,.14);animation:pulse 1.8s ease-in-out infinite}
.main{min-width:0}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:18px;padding:17px 26px;background:rgba(255,255,255,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.top h1{margin:0;font-size:20px}
.top p{margin:2px 0 0;color:var(--muted);font-size:12px}
.live{margin-left:auto;display:flex;align-items:center;gap:8px;padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:#f0fdf4;color:#065f46;font:600 11px "Fira Code";white-space:nowrap}
.wrap{width:min(1400px,100%);margin:auto;padding:24px}
.hero{position:relative;overflow:hidden;margin-bottom:18px;padding:22px 24px;border:1px solid var(--line);border-radius:24px 18px 28px 19px;background:linear-gradient(125deg,#fff 20%,#d1fae5);box-shadow:var(--shadow)}
.hero:after{content:"";position:absolute;width:230px;height:230px;right:-70px;top:-115px;border-radius:42% 58% 65% 35%/56% 35% 65% 44%;background:rgba(16,185,129,.14)}
.hero small{color:#047857;font:700 10px "Fira Code";letter-spacing:.14em}
.hero h2{margin:5px 0 3px;font-size:24px}
.hero p{margin:0;color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi,.card,.item,.scope{background:var(--color-card);border:1px solid var(--line);box-shadow:0 5px 18px rgba(6,78,59,.045)}
.kpi{position:relative;overflow:hidden;padding:16px;border-radius:17px 23px 18px 15px}
.kpi:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--color-primary)}
.label{color:var(--muted);font-size:11px;font-weight:600}
.value{margin-top:4px;font:700 25px "Fira Code";letter-spacing:-.04em}
.value small{font-size:11px;color:var(--muted);letter-spacing:0}
.delta{margin-top:3px;font-size:11px;font-weight:700}
.ok{color:#047857}.warn{color:#92400e}.bad{color:#b91c1c}.info{color:#1d4ed8}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1.12fr .88fr}.equal{grid-template-columns:1fr 1fr}
.card{min-width:0;padding:18px;border-radius:20px 16px 23px 17px}
.card h3{display:flex;align-items:center;gap:9px;margin:0 0 15px;font-size:14px}
.card h3 svg{width:19px;height:19px;color:var(--color-primary)}
.chart{height:300px;position:relative}
.note{margin:13px 0 0;padding:11px 13px;border-radius:12px;background:var(--color-muted);color:var(--muted);font-size:11px}
.list{display:grid;gap:9px}
.item{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 13px;border-radius:13px 18px 13px 15px}
.icon{width:40px;height:40px;border-radius:12px 17px 11px 15px;display:grid;place-items:center;background:#d1fae5;color:#065f46}
.icon svg{width:20px;height:20px}
.item b{font-size:12px}.item small{display:block;color:var(--muted);font-size:10.5px}
.code{font-family:"Fira Code"}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:700;white-space:nowrap}
.tag:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-ok{color:#065f46;background:#d1fae5}.t-warn{color:#92400e;background:#fef3c7}
.t-bad{color:#991b1b;background:#fee2e2}.t-info{color:#1e40af;background:#dbeafe}
.t-mut{color:#475569;background:#e2e8f0}
.bar{height:7px;margin-top:7px;background:#e2e8f0;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--color-primary)}
.gauge{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:center}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--color-primary) 85%,#dbeafe 0);position:relative}
.ring:before{content:"";position:absolute;inset:16px;border-radius:50%;background:#fff}
.ring div{position:relative;text-align:center}.ring b{display:block;color:#047857;font:700 30px "Fira Code"}.ring small{color:var(--muted)}
.stats{display:grid}.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12px}
.stat b{font-family:"Fira Code";text-align:right}
.eqgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.eq{padding:15px;border:1px solid var(--line);border-radius:19px 14px 22px 16px;background:#fff}
.eqhead{display:flex;align-items:center;gap:9px;font-weight:700;font-size:12px}.eqhead svg{width:19px}
.eqnum{margin:12px 0 2px;font:700 21px "Fira Code";color:#047857}.eq small{color:var(--muted)}
.switchrow{display:flex;justify-content:space-between;margin-top:12px;color:var(--muted);font-size:10.5px}
.switch{width:38px;height:21px;border-radius:99px;background:#94a3b8;position:relative}
.switch:after{content:"";position:absolute;width:15px;height:15px;left:3px;top:3px;border-radius:50%;background:#fff}
.switch.on{background:#059669}.switch.on:after{left:20px}
.schedule{display:grid;gap:10px}.srow{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:center;font-size:11px}
.track{height:27px;border-radius:9px;background:#e2e8f0;overflow:hidden;position:relative}
.seg{position:absolute;height:100%;display:grid;place-items:center;background:#059669;color:#fff;font-size:9px;font-weight:700}
.scopes{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:16px}
.scope{padding:15px;border-radius:18px 24px 16px 20px;border-top:4px solid #059669}
.scope b{font-size:12px}.scope .big{margin-top:5px;font:700 22px "Fira Code"}.scope small{color:var(--muted);font-size:10px}
.progress{display:grid;gap:15px}.prow header{display:flex;justify-content:space-between;font-size:11px;gap:10px}
.prow header strong:last-child{font-family:"Fira Code";color:#047857;text-align:right}
.pbar{height:11px;margin-top:6px;background:#e2e8f0;border-radius:99px;overflow:hidden}.pbar i{display:block;height:100%;background:#059669;border-radius:99px}
.timeline{position:relative;padding-left:22px}.timeline:before{content:"";position:absolute;left:6px;top:5px;bottom:5px;width:2px;background:var(--line)}
.event{position:relative;padding:0 0 16px 7px}.event:last-child{padding-bottom:0}.event:before{content:"";position:absolute;left:-20px;top:3px;width:10px;height:10px;border:3px solid #059669;border-radius:50%;background:#fff}
.event.risk:before{border-color:#dc2626}.event.done:before{background:#059669}
.event header{display:flex;justify-content:space-between;gap:9px;align-items:flex-start}.event b{font-size:12px}.event small{display:block;color:var(--muted);font-size:10.5px}.time{font:600 10px "Fira Code";color:var(--muted)}
.fade{animation:enter .4s cubic-bezier(.34,1.3,.64,1) both}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.985)}}
@keyframes pulse{50%{opacity:.45;transform:scale(.7)}}
@media(max-width:1024px){.kpis{grid-template-columns:repeat(2,1fr)}.eqgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.shell{grid-template-columns:1fr}.side{position:sticky;z-index:20;width:100%;height:auto;padding:9px 12px}.brand{padding:2px 4px 8px}.brand .logo{width:38px;height:38px}.nav{display:flex;overflow-x:auto}.nav button{width:auto;flex:none;padding:10px}.sfoot{display:none}.top{top:113px}.g2,.equal{grid-template-columns:1fr}.scopes{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:15px}.top{padding:12px 15px}.top p{display:none}.live{font-size:9px}.hero{padding:18px}.hero h2{font-size:20px}.kpis{grid-template-columns:1fr 1fr;gap:9px}.kpi{padding:13px}.value{font-size:20px}.eqgrid{grid-template-columns:1fr}.gauge{grid-template-columns:1fr}.ring{margin:auto}.nav button span{display:none}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
  <div class="brand">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 4.5 13H11l-1 9 8.5-12H12l1-8Z"/></svg></div>
    <div><b>能源管理 EMS</b><small>ENERGY MANAGEMENT</small></div>
  </div>
  <nav class="nav" id="nav" aria-label="主要功能"></nav>
  <div class="sfoot"><div class="status"><span class="dot"></span>系統連線正常</div>資料更新 08:42 · 電表節點 128<br/>台南廠 · 契約容量 4,500 kW</div>
</aside>
<div class="main">
<header class="top">
  <div><h1 id="vt">能源即時監控</h1><p id="vd"></p></div>
  <div class="live"><span class="dot"></span><span id="vl">即時 · 每 5 秒刷新</span></div>
</header>
<main class="wrap">
  <section class="hero"><small>VERIFIED ENERGY INTELLIGENCE</small><h2 id="heroTitle">看見每一度能源的流向</h2><p id="heroText">以可驗證的即時資料，支援需量管理、節能控制與減碳決策。</p></section>
  <div id="view" aria-live="polite"></div>
</main>
</div>
</div>
<script>
const I={
dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>',
meter:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="3"/><path d="M8 7h8M9 13h6M12 13v5"/></svg>',
bolt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m13 2-9 12h7l-1 8 10-13h-7V2Z"/></svg>',
leaf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 4C11 4 5 8 5 15c0 3 2 5 5 5 7 0 10-7 10-16Z"/><path d="M4 21c3-6 7-9 13-12"/></svg>',
carbon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M15 9a4 4 0 1 0 0 6"/></svg>',
bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>',
chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V9m6 10V5m6 14v-7m4 7H2"/></svg>'
};
const MOD=[
["能源即時監控","dashboard","全廠即時功率、負載率與同時率總覽","即時 · 每 5 秒刷新"],
["智慧電表管理","meter","各回路智慧電表讀值與分項用電計量","128 顆電表 · 全線上"],
["需量控制","bolt","契約容量監控、需量預測與尖峰卸載","本期最高需量 3,980 kW"],
["節能設備控制","leaf","空調/照明/馬達群控與排程節能","5 群組 · 節能模式運轉中"],
["碳排計算","carbon","用能換算 tCO₂e 與減碳目標追蹤","FY2025 減碳 -14.2%"],
["告警與能源報表","bell","異常告警派工與能源／碳排報表","今日告警 6 件 · 2 未結"]
];
const METERS=[
["MT-A01","主變壓器 #1","高壓進線","1,284 kW",82,"正常","t-ok"],
["MT-A02","主變壓器 #2","高壓進線","1,156 kW",74,"正常","t-ok"],
["MT-B11","空調冰水主機","動力回路","642 kW",88,"偏高","t-warn"],
["MT-B12","空壓機群","動力回路","318 kW",63,"正常","t-ok"],
["MT-C21","射出成型區","製程回路","486 kW",71,"正常","t-ok"],
["MT-C22","表面處理線","製程回路","294 kW",58,"正常","t-ok"],
["MT-D31","照明總回路","公共回路","96 kW",41,"節能中","t-info"],
["MT-D32","辦公空調","公共回路","128 kW",52,"正常","t-ok"]
];
const EQ=[
["中央空調","24.5 °C","冰水出水 · 節能設定 +1℃","群控 · 自動",1],
["空壓系統","6.8 bar","卸載壓力優化 · 變頻","群控 · 自動",1],
["廠區照明","41 %","日光感測調光 · 分區","排程 · 自動",1],
["製程馬達群","運轉 18/22","變頻節能 · 尖峰降載","群控 · 手動",1],
["辦公空調","26.0 °C","下班預冷關閉 · 排程","排程 · 自動",0],
["熱回收機組","回收 62 kW","廢熱回收預熱 · 常開","常開 · 自動",1]
];
const kpi=(l,v,u,d,c="")=>`<div class="kpi"><div class="label">${l}</div><div class="value">${v} <small>${u}</small></div><div class="delta ${c}">${d}</div></div>`;
const card=(title,body)=>`<section class="card"><h3>${I.chart}${title}</h3>${body}</section>`;
const chart=id=>`<div class="chart"><canvas id="${id}"></canvas></div>`;
const SCREENS=[
()=>`<div class="kpis">${kpi("即時總功率","3,842","kW","▲ 尖峰時段","warn")}${kpi("負載率","85.4","%","接近契約 4,500 kW","warn")}${kpi("今日累計用電","42,180","kWh","較昨日 -3.1%","ok")}${kpi("功率因數","0.96","","▲ 免收無效電費","ok")}</div><div class="grid g2">${card("全廠即時負載儀表",`<div class="gauge"><div class="ring"><div><b>85%</b><small>負載率</small></div></div><div class="stats"><div class="stat"><span>即時功率</span><b>3,842 kW</b></div><div class="stat"><span>契約容量</span><b>4,500 kW</b></div><div class="stat"><span>剩餘裕度</span><b class="warn">658 kW</b></div><div class="stat"><span>同時率</span><b>0.78</b></div><div class="stat"><span>本月最高需量</span><b>3,980 kW</b></div></div></div><p class="note">負載率逼近 85% 時，需量控制模組將自動評估尖峰卸載順位，避免超越契約容量產生超約罰款。</p>`)}${card("今日 24 小時負載曲線（kW）",chart("ch0"))}</div>`,
()=>`<div class="kpis">${kpi("電表節點","128","","▲ 全線上","ok")}${kpi("分項回路","8","大類","高壓/動力/製程/公共")}${kpi("即時總量","4,404","kW","八回路合計")}${kpi("偏高回路","1","","空調冰水主機","bad")}</div><div class="grid g2">${card("各回路智慧電表即時讀值",`<div class="list">${METERS.map(m=>`<div class="item"><div class="icon">${I.meter}</div><div><b>${m[1]} <span class="code">${m[0]}</span></b><small>${m[2]} · 即時 ${m[3]}</small><div class="bar"><i style="width:${m[4]}%"></i></div></div><span class="tag ${m[6]}">${m[5]}</span></div>`).join("")}</div>`)}${card("分項用電結構占比",`${chart("ch1")}<p class="note">分項計量將用電拆解至動力、製程、公共等回路，供 ISO 50001 能源基線與異常診斷使用。</p>`)}</div>`,
()=>`<div class="kpis">${kpi("本期最高需量","3,980","kW","契約 88.4%","warn")}${kpi("契約容量","4,500","kW","經常契約")}${kpi("15 分鐘預測","4,120","kW","▲ 建議卸載","bad")}${kpi("本月避免超約","2","次","省罰款約 12 萬","ok")}</div><div class="grid g2">${card("需量趨勢與契約容量（15 分鐘）",`${chart("ch2")}<p class="note">當 15 分鐘需量預測逼近契約容量的 90%，系統依卸載順位表自動觸發尖峰卸載，抑低需量避免罰款。</p>`)}${card("尖峰卸載順位表",`<div class="list">${[["1","空調冰水主機","642 kW","尖峰第一卸載",90],["2","空壓機群","318 kW","可調頻降載",70],["3","射出成型區","486 kW","排程可延",64],["4","表面處理線","294 kW","維持運轉",42],["5","辦公空調","128 kW","末段卸載",30]].map(d=>`<div class="item"><div class="icon code">${d[0]}</div><div><b>${d[1]}</b><small>${d[3]} · 可卸載評分 ${d[4]}</small><div class="bar"><i style="width:${d[4]}%"></i></div></div><b class="code">${d[2]}</b></div>`).join("")}</div>`)}</div>`,
