<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>客戶分級管理 Customer ABC Classification</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#dc2626; --accent2:#f97316; --ink:#1f2430; --muted:#6b7280;
  --bg:#f4f5f8; --card:#ffffff; --line:#e6e8ee; --sidebar:#191c24; --sidebar2:#22262f;
  --A:#dc2626; --B:#f97316; --C:#0ea5e9; --ok:#16a34a; --warn:#d97706;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.app{display:flex;min-height:100vh}
.sidebar{width:250px;background:var(--sidebar);color:#cfd4dd;display:flex;flex-direction:column;flex-shrink:0;padding:18px 14px}
.brand{display:flex;gap:11px;align-items:center;padding:6px 8px 16px}
.brand .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.brand .logo .material-symbols-outlined{font-size:24px}
.brand b{color:#fff;font-size:15px;font-weight:800;letter-spacing:.3px}
.brand span{display:block;font-size:11px;color:#8b93a3;font-weight:500}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.nav button{display:flex;align-items:center;gap:12px;background:transparent;border:0;color:#cfd4dd;font-family:inherit;font-size:14px;font-weight:600;padding:11px 12px;border-radius:10px;cursor:pointer;text-align:left;width:100%;min-width:0}
.nav button .material-symbols-outlined{font-size:21px;color:#8b93a3}
.nav button .idx{margin-left:auto;font-size:11px;color:#5c6472;font-weight:700}
.nav button:hover{background:var(--sidebar2);color:#fff}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.nav button.on .material-symbols-outlined,.nav button.on .idx{color:#fff}
.side-foot{margin-top:auto;padding:12px 10px 4px;font-size:11px;color:#6a7180;border-top:1px solid #2b2f39}
.side-foot b{color:#aeb5c2;font-weight:700}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar h1{font-size:18px;font-weight:800}
.topbar .sub{font-size:12.5px;color:var(--muted);font-weight:500}
.topbar .pill{margin-left:auto;display:inline-flex;align-items:center;gap:6px;background:#fff1f0;color:var(--accent);font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;border:1px solid #fdd}
.topbar .pill .material-symbols-outlined{font-size:16px}
.wrap{padding:22px 26px 40px;min-width:0}
.crumb{font-size:12px;color:var(--muted);margin-bottom:16px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.crumb .material-symbols-outlined{font-size:15px}
.grid{display:grid;gap:16px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g2u{grid-template-columns:1.5fr 1fr}
.g2v{grid-template-columns:1fr 1.6fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;min-width:0}
.card h3{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.card .ch-sub{font-size:12px;color:var(--muted);margin-bottom:14px;font-weight:500}
.kpi{position:relative;overflow:hidden}
.kpi .lab{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .lab .material-symbols-outlined{font-size:17px}
.kpi .val{font-size:29px;font-weight:800;margin-top:8px;letter-spacing:-.5px}
.kpi .val small{font-size:14px;font-weight:600;color:var(--muted);margin-left:3px}
.kpi .delta{font-size:12px;font-weight:700;margin-top:5px;display:inline-flex;align-items:center;gap:3px}
.kpi .delta .material-symbols-outlined{font-size:15px}
.up{color:var(--ok)} .down{color:var(--accent)}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:5px 0 0 5px}
.chart{width:100%;height:280px;overflow:hidden}
.chart.sm{height:230px}
.twrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th,td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#fafbfd;font-weight:700;color:#4b5563;font-size:12px;position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fcfcfd}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.tA{background:#fef2f2;color:var(--A)} .tB{background:#fff7ed;color:var(--B)} .tC{background:#f0f9ff;color:var(--C)}
.tok{background:#f0fdf4;color:var(--ok)} .twn{background:#fffbeb;color:var(--warn)}
.tup{background:#f0fdf4;color:var(--ok)} .tdn{background:#fef2f2;color:var(--A)}
.mini{width:96px;height:7px;background:#eef0f4;border-radius:6px;overflow:hidden;display:inline-block;vertical-align:middle}
.mini i{display:block;height:100%;border-radius:6px}
.tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:9px;border-left:4px solid var(--line)}
.tile:last-child{margin-bottom:0}
.tile .t1{font-weight:700;font-size:13px}
.tile .t2{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tile .t2 b{color:var(--ink)}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:0 0 18px 6px}
.tl .ev:last-child{padding-bottom:0}
.tl .dot{position:absolute;left:-22px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.tl .ev .et{font-weight:700;font-size:13.5px}
.tl .ev .ed{font-size:12px;color:var(--muted);margin-top:3px}
.tl .ev .em{font-size:11px;color:#9aa0ac;margin-top:2px;font-weight:600}
.slider-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.slider-row:last-child{border-bottom:0}
.slider-row .sl-lab{font-size:13px;font-weight:700;width:88px;flex-shrink:0}
.track{flex:1;height:8px;background:#eef0f4;border-radius:6px;position:relative;min-width:60px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.track .knob{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--accent);transform:translate(-50%,-50%)}
.slider-row .sl-val{font-size:13px;font-weight:800;width:52px;text-align:right;flex-shrink:0}
.strat{border:1px solid var(--line);border-radius:13px;padding:15px;border-top:4px solid var(--line);min-width:0}
.strat .sh{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px}
.strat .sh .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.strat ul{list-style:none;margin-top:11px;display:flex;flex-direction:column;gap:8px}
.strat li{font-size:12.5px;display:flex;gap:8px;align-items:flex-start;color:#3b414c}
.strat li .material-symbols-outlined{font-size:17px;color:var(--accent);margin-top:1px}
.strat .meta{display:flex;gap:14px;margin-top:12px;padding-top:11px;border-top:1px dashed var(--line)}
.strat .meta div{font-size:11px;color:var(--muted);font-weight:600}
.strat .meta b{display:block;font-size:17px;color:var(--ink);font-weight:800}
.note{display:flex;gap:10px;align-items:flex-start;background:#fff7ed;border:1px solid #fed7aa;border-radius:11px;padding:12px 14px;font-size:12.5px;color:#7c2d12;font-weight:500}
.note .material-symbols-outlined{font-size:19px;color:var(--accent2)}
.sec-title{font-size:13px;font-weight:800;color:#4b5563;margin:2px 0 12px;display:flex;align-items:center;gap:7px}
.sec-title .material-symbols-outlined{font-size:18px;color:var(--accent)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
.legend span{font-size:12px;font-weight:600;color:#4b5563;display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
@media(max-width:1100px){ .g4{grid-template-columns:repeat(2,1fr)} }
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{width:100%;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 14px;gap:8px}
  .brand{padding:0;flex:1}
  .nav{flex-direction:row;flex-wrap:wrap;margin-top:0;gap:6px}
  .nav button{width:auto;padding:8px 12px}
  .nav button .idx{display:none}
  .side-foot{display:none}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g2u,.g2v{grid-template-columns:1fr}
}
@media(max-width:560px){
  .wrap{padding:16px 14px 32px}
  .topbar{padding:12px 14px}
  .nav button span.lbl{display:none}
  .nav button{padding:8px 10px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">insights</span></div>
      <div><b>ABC 分級管理</b><span>Customer Classification</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">分級週期：<b>2026 Q2</b><br/>分析母體：<b>1,284 客戶</b><br/>模型版本：<b>RFM-v3.2</b></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="scTitle">交易數據彙整</h1>
        <div class="sub" id="scSub">整合 ERP 訂單、營收、毛利與交易頻率明細</div>
      </div>
      <span class="pill"><span class="material-symbols-outlined">verified</span>純 UI 展示・擬真資料</span>
    </div>
    <div class="wrap">
      <div class="crumb" id="crumb"></div>
      <div id="screen"></div>
    </div>
  </main>
</div>
<script>
var MODULES=[
  {icon:"receipt_long",name:"交易數據彙整",desc:"整合 ERP 訂單、營收、毛利與交易頻率明細"},
  {icon:"monitoring",name:"RFM 指標計算",desc:"計算最近購買、頻率、金額與貢獻度分數"},
  {icon:"rule",name:"分級模型設定",desc:"設定 ABC 門檻與 RFM 權重、帕累托規則"},
  {icon:"insights",name:"分級結果視覺化",desc:"ABC 分布、貢獻占比與客戶散點分析"},
  {icon:"account_tree",name:"策略連動",desc:"依分級指派服務等級與拜訪頻率策略"},
  {icon:"history",name:"分級稽核追蹤",desc:"升降級軌跡、留存率與模型準確度稽核"}
];
var charts=[];
function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
function mk(id){var el=document.getElementById(id);if(!el)return null;var c=echarts.init(el);charts.push(c);return c;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

var CUST=[
  {n:"宏達精密工業",id:"C-1042",rev:1820,gm:34,ord:96,rec:3,cls:"A"},
  {n:"台鴻電子",id:"C-0871",rev:1540,gm:29,ord:81,rec:6,cls:"A"},
  {n:"聯欣自動化",id:"C-1190",rev:1310,gm:31,ord:74,rec:4,cls:"A"},
  {n:"銘泰機械",id:"C-0654",rev:980,gm:27,ord:58,rec:11,cls:"A"},
  {n:"大川塑膠",id:"C-1355",rev:742,gm:24,ord:47,rec:9,cls:"B"},
  {n:"永昇科技",id:"C-0233",rev:610,gm:22,ord:41,rec:14,cls:"B"},
  {n:"晶華材料",id:"C-1477",rev:528,gm:26,ord:33,rec:22,cls:"B"},
  {n:"友通模具",id:"C-0918",rev:415,gm:19,ord:29,rec:8,cls:"B"},
  {n:"力鼎工程",id:"C-1601",rev:288,gm:18,ord:22,rec:31,cls:"C"},
  {n:"新曜五金",id:"C-0442",rev:196,gm:15,ord:17,rec:45,cls:"C"},
  {n:"和欣貿易",id:"C-1723",rev:132,gm:13,ord:12,rec:58,cls:"C"},
  {n:"元晟儀器",id:"C-0507",rev:88,gm:11,ord:8,rec:72,cls:"C"}
];

/* screen 0: 交易數據彙整 */
function s0(){
  var kpis=[
    {ic:"receipt_long",l:"本期交易筆數",v:"48,210",u:"筆",d:"+6.4%",up:true,c:"var(--accent)"},
    {ic:"payments",l:"彙整營收",v:"1.24",u:"億元",d:"+8.1%",up:true,c:"var(--accent2)"},
    {ic:"groups",l:"分析客戶數",v:"1,284",u:"家",d:"+37 家",up:true,c:"var(--C)"},
    {ic:"cleaning_services",l:"資料清洗率",v:"99.2",u:"%",d:"去重 812 筆",up:true,c:"var(--ok)"}
  ];
  var kh="";
  for(var i=0;i<kpis.length;i++){var a=kpis[i];
    kh+='<div class="card kpi"><span class="bar" style="background:'+a.c+'"></span>'
     +'<div class="lab"><span class="material-symbols-outlined">'+a.ic+'</span>'+a.l+'</div>'
     +'<div class="val">'+a.v+'<small>'+a.u+'</small></div>'
     +'<div class="delta '+(a.up?'up':'down')+'"><span class="material-symbols-outlined">'+(a.up?'trending_up':'trending_down')+'</span>'+a.d+'</div></div>';
  }
  var src=[
    {s:"ERP 銷售訂單",cnt:"31,540 筆",st:"已同步",ok:true,t:"09:12"},
    {s:"財務營收憑證",cnt:"11,208 筆",st:"已同步",ok:true,t:"09:14"},
    {s:"客戶主檔",cnt:"1,284 家",st:"已同步",ok:true,t:"09:15"},
    {s:"退貨/折讓明細",cnt:"3,462 筆",st:"處理中",ok:false,t:"09:18"}
  ];
  var sr="";
  for(var s=0;s<src.length;s++){var o=src[s];
    sr+='<div class="tile" style="border-left-color:'+(o.ok?'var(--ok)':'var(--warn)')+'">'
      +'<div class="t1">'+esc(o.s)+'</div><div class="t2"><span>筆數 <b>'+o.cnt+'</b></span>'
      +'<span class="tag '+(o.ok?'tok':'twn')+'">'+o.st+'</span><span>'+o.t+'</span></div></div>';
  }
  var rows="";
  for(var j=0;j<CUST.length;j++){var c=CUST[j];
    rows+='<tr><td><b>'+esc(c.n)+'</b></td><td>'+c.id+'</td><td class="num">'+c.ord+'</td>'
      +'<td class="num">'+c.rev+'</td><td class="num">'+c.gm+'%</td><td class="num">'+c.rec+' 天</td></tr>';
  }
  return '<div class="grid g4">'+kh+'</div>'
    +'<div class="grid g2v" style="margin-top:16px">'
      +'<div class="card"><h3><span class="material-symbols-outlined">cloud_sync</span>資料來源同步</h3>'
        +'<div class="ch-sub">2026-08-14 09:20 批次匯入・4 個來源</div>'+sr
        +'<div class="note" style="margin-top:6px"><span class="material-symbols-outlined">info</span>退貨/折讓明細處理中，將於淨營收計算前扣抵。</div></div>'
      +'<div class="card"><h3><span class="material-symbols-outlined">calendar_month</span>近 6 週交易金額趨勢</h3>'
        +'<div class="ch-sub">單位：百萬元</div><div id="c0a" class="chart"></div></div>'
    +'</div>'
    +'<div class="card" style="margin-top:16px"><h3><span class="material-symbols-outlined">table_rows</span>客戶交易彙整明細（節錄）</h3>'
      +'<div class="ch-sub">共 1,284 筆・依營收排序，供指標計算前檢視</div>'
      +'<div class="twrap"><table><thead><tr><th>客戶名稱</th><th>客戶編號</th><th class="num">訂單數</th><th class="num">營收(萬)</th><th class="num">毛利率</th><th class="num">最近購買</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}
function d0(){
  var c=mk("c0a");if(!c)return;
  c.setOption({
    grid:{left:44,right:16,top:20,bottom:28},
    tooltip:{trigger:"axis"},
    xAxis:{type:"category",data:["6/30","7/07","7/14","7/21","7/28","8/04"],axisLine:{lineStyle:{color:"#cbd0d8"}}},
    yAxis:{type:"value",splitLine:{lineStyle:{color:"#eef0f4"}}},
    series:[{type:"bar",data:[168,182,175,196,188,210],barWidth:"48%",
      itemStyle:{borderRadius:[6,6,0,0],color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:"#f97316"},{offset:1,color:"#dc2626"}])}}]
  });
}

/* screen 1: RFM 指標計算 */
function s1(){
  var kpis=[
    {ic:"schedule",l:"平均最近購買 R",v:"23.6",u:"天",c:"var(--C)"},
    {ic:"repeat",l:"平均購買頻率 F",v:"6.8",u:"次/季",c:"var(--accent2)"},
    {ic:"payments",l:"平均消費金額 M",v:"61.2",u:"萬",c:"var(--accent)"},
    {ic:"scoreboard",l:"平均 RFM 綜合分",v:"3.4",u:"/5",c:"var(--ok)"}
  ];
  var kh="";
  for(var i=0;i<kpis.length;i++){var a=kpis[i];
    kh+='<div class="card kpi"><span class="bar" style="background:'+a.c+'"></span>'
      +'<div class="lab"><span class="material-symbols-outlined">'+a.ic+'</span>'+a.l+'</div>'
      +'<div class="val">'+a.v+'<small>'+a.u+'</small></div></div>';
  }
  var rows="";
  for(var j=0;j<CUST.length;j++){var c=CUST[j];
    var R=c.rec<=6?5:c.rec<=15?4:c.rec<=30?3:c.rec<=50?2:1;
    var F=c.ord>=70?5:c.ord>=45?4:c.ord>=25?3:c.ord>=15?2:1;
    var M=c.rev>=1200?5:c.rev>=600?4:c.rev>=350?3:c.rev>=150?2:1;
    var sum=R+F+M;
    var pct=Math.round(sum/15*100);
    var col=c.cls==="A"?"var(--A)":c.cls==="B"?"var(--B)":"var(--C)";
    rows+='<tr><td><b>'+esc(c.n)+'</b></td>'
      +'<td class="num">'+R+'</td><td class="num">'+F+'</td><td class="num">'+M+'</td>'
      +'<td class="num"><b>'+sum+'</b></td>'
      +'<td><span class="mini"><i style="width:'+pct+'%;background:'+col+'"></i></span> '+pct+'%</td>'
      +'<td><span class="tag t'+c.cls+'">'+c.cls+' 級</span></td></tr>';
  }
  return '<div class="grid g4">'+kh+'</div>'
    +'<div class="grid g2" style="margin-top:16px">'
      +'<div class="card"><h3><span class="material-symbols-outlined">radar</span>RFM 三維雷達（A/B/C 級平均）</h3>'
        +'<div class="ch-sub">R 越近、F 越高、M 越大 分數越高</div><div id="c1a" class="chart"></div></div>'
      +'<div class="card"><h3><span class="material-symbols-outlined">bubble_chart</span>頻率 × 金額分布</h3>'

function buildNav(){

  for(var i=0;i<MODULES.length;i++){var m=MODULES[i];
    h+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="lbl">'+esc(m.name)+'</span><span class="idx">0'+(i+1)+'</span></button>';
  }
  nav.innerHTML=h;
  var btns=nav.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].addEventListener("click",function(){location.hash="v"+this.getAttribute("data-i");});}
}
function show(i){
  disposeCharts();
  var m=MODULES[i];
  document.getElementById("scTitle").textContent=m.name;
  document.getElementById("scSub").textContent=m.desc;
  document.getElementById("crumb").innerHTML='<span class="material-symbols-outlined">home</span>ABC 分級管理<span class="material-symbols-outlined">chevron_right</span>'+esc(m.name);
  var nav=document.getElementById("nav").querySelectorAll("[data-i]");
  for(var n=0;n<nav.length;n++){nav[n].className=(+nav[n].getAttribute("data-i")===i)?"on":"";}
  var cont=document.getElementById("screen");
  cont.innerHTML=SCREENS[i]();
  void cont.offsetHeight;
  DRAW[i]();
}
window.addEventListener("resize",function(){for(var i=0;i<charts.length;i++){try{charts[i].resize();}catch(e){}}});
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
