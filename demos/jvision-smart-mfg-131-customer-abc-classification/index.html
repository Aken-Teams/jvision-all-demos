<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>客戶分級管理 Customer ABC Classification</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#ffffff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000000;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#f8fafc;
  --color-foreground:#0f172a;
  --color-card:#ffffff;
  --color-card-foreground:#0f172a;
  --color-muted:#f1f5fd;
  --color-muted-foreground:#475569;
  --color-border:#e4ecfc;
  --color-destructive:#dc2626;
  --color-on-destructive:#ffffff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#0f172a;
  --muted:#475569;
  --line:#e4ecfc;
  --bg:#f8fafc;
  --card:#ffffff;
  --accent:#2563eb;
  --accent2:#3b82f6;
  --sidebar:#ffffff;
  --sidebar2:#f1f5fd;
  --A:#1d4ed8;
  --B:#047857;
  --C:#64748b;
  --ok:#047857;
  --warn:#a16207;
}
*{box-sizing:border-box;margin:0;padding:0}
html{max-width:100%;overflow-x:hidden;scroll-behavior:smooth}
body{max-width:100%;overflow-x:hidden;background:var(--color-background);color:var(--color-foreground);font-family:"Fira Sans","Noto Sans TC",sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,a,[role="button"]{cursor:pointer}
button,input,select,textarea{font:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
::selection{background:#dbeafe;color:#172554}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.app{display:flex;min-height:100vh}
.sidebar{position:sticky;top:0;width:264px;height:100vh;flex-shrink:0;display:flex;flex-direction:column;padding:24px 16px;background:var(--sidebar);color:var(--ink);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 22px;border-bottom:1px solid var(--line)}
.brand .logo{width:42px;height:42px;display:flex;flex-shrink:0;align-items:center;justify-content:center;border-radius:8px;background:var(--color-primary);color:var(--color-on-primary)}
.brand .logo .material-symbols-outlined{font-size:23px}
.brand b{display:block;color:var(--ink);font-size:15px;font-weight:700;letter-spacing:.01em}
.brand span{display:block;color:var(--muted);font-size:10.5px;font-weight:500;letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:5px;margin-top:18px}
.nav button{width:100%;min-height:46px;display:flex;align-items:center;gap:11px;padding:10px 11px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted);font-family:inherit;font-size:13.5px;font-weight:600;text-align:left;transition:background-color .18s ease,color .18s ease,border-color .18s ease}
.nav button .material-symbols-outlined{font-size:20px;color:#64748b;transition:color .18s ease}
.nav button .idx{margin-left:auto;color:#64748b;font-family:"Fira Code",monospace;font-size:10px;font-weight:600;font-variant-numeric:tabular-nums}
.nav button:hover{background:var(--color-muted);color:var(--ink);border-color:var(--line)}
.nav button.on{background:var(--color-primary);color:var(--color-on-primary);border-color:var(--color-primary)}
.nav button.on .material-symbols-outlined,.nav button.on .idx{color:var(--color-on-primary)}
.side-foot{margin-top:auto;padding:18px 9px 4px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.8}
.side-foot b{color:var(--ink);font-family:"Fira Code",monospace;font-weight:600;font-variant-numeric:tabular-nums}
.main{min-width:0;flex:1;display:flex;flex-direction:column}
.topbar{min-height:76px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 28px;background:var(--card);border-bottom:1px solid var(--line)}
.topbar h1{color:var(--ink);font-size:20px;font-weight:700;letter-spacing:-.02em}
.topbar .sub{margin-top:2px;color:var(--muted);font-size:12.5px;font-weight:400}
.topbar .pill{margin-left:auto;display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid #a7f3d0;border-radius:6px;background:#ecfdf5;color:#065f46;font-size:11.5px;font-weight:600}
.topbar .pill .material-symbols-outlined{font-size:16px}
.wrap{min-width:0;width:100%;max-width:1500px;margin:0 auto;padding:24px 28px 44px}
.crumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:17px;color:var(--muted);font-size:11.5px;font-weight:500}
.crumb .material-symbols-outlined{font-size:15px;color:#64748b}
.grid{display:grid;gap:16px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g2u{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.g2v{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.card{min-width:0;padding:18px;background:var(--color-card);color:var(--color-card-foreground);border:1px solid var(--line);border-radius:10px}
.card h3{display:flex;align-items:center;gap:8px;margin-bottom:4px;color:var(--ink);font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--color-primary)}
.card .ch-sub{margin-bottom:15px;color:var(--muted);font-size:11.5px;font-weight:400}
.kpi{position:relative;overflow:hidden;padding-left:21px}
.kpi .bar{position:absolute;inset:0 auto 0 0;width:4px;border-radius:0}
.kpi .lab{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:500}
.kpi .lab .material-symbols-outlined{font-size:17px}
.kpi .val{margin-top:9px;color:var(--ink);font-family:"Fira Code",monospace;font-size:28px;font-weight:700;letter-spacing:-.045em;font-variant-numeric:tabular-nums lining-nums}
.kpi .val small{margin-left:4px;color:var(--muted);font-family:"Fira Sans","Noto Sans TC",sans-serif;font-size:12px;font-weight:500;letter-spacing:0}
.kpi .delta{display:inline-flex;align-items:center;gap:4px;margin-top:7px;font-size:11.5px;font-weight:600}
.kpi .delta .material-symbols-outlined{font-size:15px}
.up{color:#047857}.down{color:var(--color-destructive)}
.chart{width:100%;height:280px;overflow:hidden}
.chart.sm{height:230px}
.twrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;scrollbar-color:#94a3b8 var(--color-muted);scrollbar-width:thin}
table{width:100%;min-width:520px;border-collapse:collapse;color:var(--ink);font-size:12.5px}
th,td{padding:11px 13px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;z-index:1;background:var(--color-muted);color:#334155;font-size:11px;font-weight:700;letter-spacing:.025em}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#f8fbff}
td.num,th.num{text-align:right;font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums lining-nums}
td:nth-child(2){font-variant-numeric:tabular-nums}
td:nth-child(2):not(.num),td:nth-child(5):not(.num){font-family:"Fira Code","Fira Sans",monospace}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1px solid currentColor;border-radius:5px;font-size:10.5px;font-weight:700;line-height:1.35}
.tA{background:#eff6ff;color:#1d4ed8}
.tB{background:#ecfdf5;color:#047857}
.tC{background:#f1f5f9;color:#475569}
.tok,.tup{background:#ecfdf5;color:#047857}
.twn{background:#fffbeb;color:#854d0e}
.tdn{background:#fef2f2;color:#b91c1c}
.mini{width:96px;height:7px;display:inline-block;overflow:hidden;vertical-align:middle;background:#e2e8f0;border-radius:2px}
.mini i{display:block;height:100%;border-radius:0}
.tile{margin-bottom:9px;padding:11px 12px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:7px}
.tile:last-child{margin-bottom:0}
.tile .t1{color:var(--ink);font-size:12.5px;font-weight:600}
.tile .t2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px;color:var(--muted);font-size:10.5px}
.tile .t2 b{color:var(--ink);font-family:"Fira Code",monospace;font-weight:600;font-variant-numeric:tabular-nums}
.tl{position:relative;padding-left:25px}
.tl::before{content:"";position:absolute;left:8px;top:5px;bottom:5px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:0 0 18px 7px}
.tl .ev:last-child{padding-bottom:0}
.tl .dot{position:absolute;left:-22px;top:2px;width:14px;height:14px;border:3px solid var(--color-primary);border-radius:50%;background:#fff}
.tl .ev .et{color:var(--ink);font-size:12.5px;font-weight:700}
.tl .ev .ed{margin-top:3px;color:var(--muted);font-size:11.5px}
.tl .ev .em{margin-top:3px;color:#64748b;font-family:"Fira Code",monospace;font-size:9.5px;font-weight:500;font-variant-numeric:tabular-nums}
.slider-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.slider-row:last-child{border-bottom:0}
.slider-row .sl-lab{width:88px;flex-shrink:0;color:var(--ink);font-size:12.5px;font-weight:600}
.track{position:relative;flex:1;min-width:60px;height:8px;background:#e2e8f0;border-radius:2px}
.track i{position:absolute;inset:0 auto 0 0;border-radius:0}
.track .knob{position:absolute;top:50%;width:16px;height:16px;border:3px solid var(--color-primary);border-radius:50%;background:#fff;transform:translate(-50%,-50%)}
.slider-row .sl-val{width:52px;flex-shrink:0;color:var(--ink);font-family:"Fira Code",monospace;font-size:12.5px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.strat{min-width:0;padding:16px;border:1px solid var(--line);border-top:4px solid var(--line);border-radius:8px;background:#fff}
.strat .sh{display:flex;align-items:center;gap:9px;color:var(--ink);font-size:14px;font-weight:700}
.strat .sh .ic{width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:6px;color:#fff}
.strat .sh .material-symbols-outlined{font-size:19px}
.strat ul{display:flex;flex-direction:column;gap:8px;margin-top:12px;list-style:none}
.strat li{display:flex;align-items:flex-start;gap:8px;color:#334155;font-size:11.5px}
.strat li .material-symbols-outlined{margin-top:1px;color:var(--color-accent);font-size:16px}
.strat .meta{display:flex;gap:20px;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
.strat .meta div{color:var(--muted);font-size:10px;font-weight:500}
.strat .meta b{display:block;margin-top:2px;color:var(--ink);font-family:"Fira Code",monospace;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.note{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border:1px solid #bfdbfe;border-radius:7px;background:#eff6ff;color:#1e3a8a;font-size:11.5px;font-weight:500}
.note .material-symbols-outlined{flex-shrink:0;color:var(--color-primary);font-size:18px}
.sec-title{display:flex;align-items:center;gap:7px;margin:2px 0 12px;color:#334155;font-size:12.5px;font-weight:700}
.sec-title .material-symbols-outlined{color:var(--color-primary);font-size:18px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px;color:#334155;font-size:11px;font-weight:600}
.legend i{width:11px;height:11px;display:inline-block;border-radius:2px;border:1px solid rgba(15,23,42,.18)}
#screen>.grid,#screen>.card,#screen>.sec-title{animation:screen-in .35s ease both}
#screen>.card{animation-delay:.04s}
@keyframes screen-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{position:relative;width:100%;height:auto;padding:12px 16px;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{flex:1;padding:0;border:0}
  .brand .logo{width:38px;height:38px}
  .nav{width:100%;margin-top:2px;flex-direction:row;flex-wrap:nowrap;gap:6px;overflow-x:auto;padding-bottom:3px;scrollbar-width:thin}
  .nav button{width:auto;min-width:max-content;min-height:42px;padding:8px 11px}
  .nav button .idx{display:none}
  .side-foot{display:none}
  .topbar{min-height:70px;padding:13px 20px}
  .wrap{padding:20px 20px 36px}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g2u,.g2v{grid-template-columns:1fr}
  .chart{height:260px}
}
@media(max-width:560px){
  body{font-size:14px}
  .sidebar{padding:10px 12px}
  .brand b{font-size:14px}
  .nav button{min-width:44px;min-height:44px;justify-content:center;padding:9px 11px}
  .nav button span.lbl{display:none}
  .topbar{padding:12px 14px;align-items:flex-start}
  .topbar h1{font-size:17px}
  .topbar .sub{max-width:280px;font-size:11.5px}
  .topbar .pill{width:100%;margin-left:0;justify-content:center}
  .wrap{padding:16px 14px 30px}
  .crumb{margin-bottom:13px}
  .grid{gap:12px}
  .card{padding:15px;border-radius:8px}
  .kpi{padding-left:18px}
  .kpi .val{font-size:25px}
  .chart,.chart.sm{height:240px}
  .slider-row{gap:8px}
  .slider-row .sl-lab{width:72px}
  .strat .meta{gap:14px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  #screen>.grid,#screen>.card,#screen>.sec-title{animation:none!important;opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">insights</span></div>
      <div><b>ABC 分級管理</b><span>Customer Classification</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">分級週期：<b>2026 Q2</b><br/>分析母體：<b>1,284 客戶</b><br/>模型版本：<b>RFM-v3.2</b></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="scTitle">交易數據彙整</h1>
        <div class="sub" id="scSub">整合 ERP 訂單、營收、毛利與交易頻率明細</div>
      </div>
      <span class="pill"><span class="material-symbols-outlined">verified</span>純 UI 展示・擬真資料</span>
    </div>
    <div class="wrap">
      <div class="crumb" id="crumb"></div>
      <div id="screen"></div>
    </div>
  </main>
</div>
<script>
var MODULES=[
  {icon:"receipt_long",name:"交易數據彙整",desc:"整合 ERP 訂單、營收、毛利與交易頻率明細"},
  {icon:"monitoring",name:"RFM 指標計算",desc:"計算最近購買、頻率、金額與貢獻度分數"},
  {icon:"rule",name:"分級模型設定",desc:"設定 ABC 門檻與 RFM 權重、帕累托規則"},
  {icon:"insights",name:"分級結果視覺化",desc:"ABC 分布、貢獻占比與客戶散點分析"},
  {icon:"account_tree",name:"策略連動",desc:"依分級指派服務等級與拜訪頻率策略"},
  {icon:"history",name:"分級稽核追蹤",desc:"升降級軌跡、留存率與模型準確度稽核"}
];
var charts=[];
function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
function mk(id){var el=document.getElementById(id);if(!el)return null;var c=echarts.init(el);charts.push(c);return c;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

var CUST=[
  {n:"O達精密工業",id:"C-1042",rev:1820,gm:34,ord:96,rec:3,cls:"A"},
  {n:"台鴻O子",id:"C-0871",rev:1540,gm:29,ord:81,rec:6,cls:"A"},
  {n:"聯欣自動化",id:"C-1190",rev:1310,gm:31,ord:74,rec:4,cls:"A"},
  {n:"O泰機械",id:"C-0654",rev:980,gm:27,ord:58,rec:11,cls:"A"},
  {n:"O川塑膠",id:"C-1355",rev:742,gm:24,ord:47,rec:9,cls:"B"},
  {n:"永O科技",id:"C-0233",rev:610,gm:22,ord:41,rec:14,cls:"B"},
  {n:"O華材料",id:"C-1477",rev:528,gm:26,ord:33,rec:22,cls:"B"},
  {n:"O通模具",id:"C-0918",rev:415,gm:19,ord:29,rec:8,cls:"B"},
  {n:"力鼎工程",id:"C-1601",rev:288,gm:18,ord:22,rec:31,cls:"C"},
  {n:"O曜五金",id:"C-0442",rev:196,gm:15,ord:17,rec:45,cls:"C"},
  {n:"O欣貿易",id:"C-1723",rev:132,gm:13,ord:12,rec:58,cls:"C"},
  {n:"元O儀器",id:"C-0507",rev:88,gm:11,ord:8,rec:72,cls:"C"}
];

/* screen 0: 交易數據彙整 */
function s0(){
  var kpis=[
    {ic:"receipt_long",l:"本期交易筆數",v:"48,210",u:"筆",d:"+6.4%",up:true,c:"var(--accent)"},
    {ic:"payments",l:"彙整營收",v:"1.24",u:"億元",d:"+8.1%",up:true,c:"var(--accent2)"},
    {ic:"groups",l:"分析客戶數",v:"1,284",u:"家",d:"+37 家",up:true,c:"var(--C)"},
    {ic:"cleaning_services",l:"資料清洗率",v:"99.2",u:"%",d:"去重 812 筆",up:true,c:"var(--ok)"}
  ];
  var kh="";
  for(var i=0;i<kpis.length;i++){var a=kpis[i];
    kh+='<div class="card kpi"><span class="bar" style="background:'+a.c+'"></span>'
     +'<div class="lab"><span class="material-symbols-outlined">'+a.ic+'</span>'+a.l+'</div>'
     +'<div class="val">'+a.v+'<small>'+a.u+'</small></div>'
     +'<div class="delta '+(a.up?'up':'down')+'"><span class="material-symbols-outlined">'+(a.up?'trending_up':'trending_down')+'</span>'+a.d+'</div></div>';
  }
  var src=[
    {s:"ERP 銷售訂單",cnt:"31,540 筆",st:"已同步",ok:true,t:"09:12"},
    {s:"財務營收憑證",cnt:"11,208 筆",st:"已同步",ok:true,t:"09:14"},
    {s:"客戶主檔",cnt:"1,284 家",st:"已同步",ok:true,t:"09:15"},
    {s:"退貨/折讓明細",cnt:"3,462 筆",st:"處理中",ok:false,t:"09:18"}
  ];
  var sr="";
  for(var s=0;s<src.length;s++){var o=src[s];
    sr+='<div class="tile" style="border-left-color:'+(o.ok?'var(--ok)':'var(--warn)')+'">'
      +'<div class="t1">'+esc(o.s)+'</div><div class="t2"><span>筆數 <b>'+o.cnt+'</b></span>'
      +'<span class="tag '+(o.ok?'tok':'twn')+'">'+o.st+'</span><span>'+o.t+'</span></div></div>';
  }
  var rows="";
  for(var j=0;j<CUST.length;j++){var c=CUST[j];
    rows+='<tr><td><b>'+esc(c.n)+'</b></td><td>'+c.id+'</td><td class="num">'+c.ord+'</td>'
      +'<td class="num">'+c.rev+'</td><td class="num">'+c.gm+'%</td><td class="num">'+c.rec+' 天</td></tr>';
  }

    {t:"權重調整（M 30%→40%）",d:"提高金額權重以強化製造業高單價客戶辨識",m:"08/12 11:05 ・業務主管",c:"var(--accent2)"},
    {t:"上期留存追蹤結案",d:"A 級留存率 94.2%，較上期 +3.1pt",m:"08/10 14:00 ・業務部",c:"var(--C)"}
  ];
  var el="";
  for(var e=0;e<evs.length;e++){var o=evs[e];
    el+='<div class="ev"><span class="dot" style="border-color:'+o.c+'"></span>'
      +'<div class="et">'+esc(o.t)+'</div><div class="ed">'+esc(o.d)+'</div><div class="em">'+esc(o.m)+'</div></div>';
  }
  return '<div class="grid g4">'+kh+'</div>'
    +'<div class="grid g2u" style="margin-top:16px">'
      +'<div class="card"><h3><span class="material-symbols-outlined">insights</span>各級留存率趨勢（近 6 期）</h3>'
        +'<div class="ch-sub">高價值客戶留存為分級成效核心指標</div><div id="c5a" class="chart"></div></div>'
      +'<div class="card"><h3><span class="material-symbols-outlined">history</span>分級稽核軌跡</h3>'
        +'<div class="ch-sub">模型調整、覆核與發布紀錄可追溯</div><div class="tl">'+el+'</div></div>'
    +'</div>';
}
function d5(){
  var c=mk("c5a");if(!c)return;
  c.setOption({
    tooltip:{trigger:"axis"},legend:{bottom:0,data:["A 級","B 級","C 級"]},
    grid:{left:44,right:18,top:18,bottom:42},
    xAxis:{type:"category",data:["Q1'25","Q2'25","Q3'25","Q4'25","Q1'26","Q2'26"],boundaryGap:false},
    yAxis:{type:"value",min:50,max:100,axisLabel:{formatter:"{value}%"},splitLine:{lineStyle:{color:"#eef0f4"}}},
    series:[
      {name:"A 級",type:"line",smooth:true,data:[88,89,90.5,91.1,91.1,94.2],lineStyle:{width:3},itemStyle:{color:"#dc2626"},areaStyle:{opacity:.1}},
      {name:"B 級",type:"line",smooth:true,data:[74,75,76,77.5,78,80.4],lineStyle:{width:2.5},itemStyle:{color:"#f97316"}},
      {name:"C 級",type:"line",smooth:true,data:[58,57,59,60,61,62.5],lineStyle:{width:2.5},itemStyle:{color:"#0ea5e9"}}

var SCREENS=[s0,s1,s2,s3,s4,s5];
var DRAW=[d0,d1,d2,d3,d4,d5];
function buildNav(){
  var nav=document.getElementById("nav");var h="";
  for(var i=0;i<MODULES.length;i++){var m=MODULES[i];
    h+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="lbl">'+esc(m.name)+'</span><span class="idx">0'+(i+1)+'</span></button>';
  }
  nav.innerHTML=h;
  var btns=nav.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].addEventListener("click",function(){location.hash="v"+this.getAttribute("data-i");});}
}
function show(i){
  disposeCharts();
  var m=MODULES[i];
  document.getElementById("scTitle").textContent=m.name;
  document.getElementById("scSub").textContent=m.desc;
  document.getElementById("crumb").innerHTML='<span class="material-symbols-outlined">home</span>ABC 分級管理<span class="material-symbols-outlined">chevron_right</span>'+esc(m.name);
  var nav=document.getElementById("nav").querySelectorAll("[data-i]");
  for(var n=0;n<nav.length;n++){nav[n].className=(+nav[n].getAttribute("data-i")===i)?"on":"";}
  var cont=document.getElementById("screen");
  cont.innerHTML=SCREENS[i]();
  void cont.offsetHeight;
  DRAW[i]();
}
window.addEventListener("resize",function(){for(var i=0;i<charts.length;i++){try{charts[i].resize();}catch(e){}}});
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
