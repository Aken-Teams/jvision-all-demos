<html lang="zh-Hant">

  <style>
    :root{
      --color-primary:#2563eb;--color-on-primary:#fff;--color-secondary:#3b82f6;
      --color-on-secondary:#000;--color-accent:#ea580c;--color-on-accent:#000;
      --color-background:#f8fafc;--color-foreground:#1e293b;--color-card:#fff;
      --color-card-foreground:#1e293b;--color-muted:#e9eff8;
      --color-muted-foreground:#475569;--color-border:#e2e8f0;
      --color-destructive:#dc2626;--color-on-destructive:#fff;--color-ring:#2563eb;
      --blue:#2563eb;--ink:#1e293b;--muted:#475569;--line:#e2e8f0;
      --ok:#047857;--warn:#a13d00;--bad:#dc2626;

    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Fira Sans",sans-serif;-webkit-font-smoothing:antialiased}
    button,a{font:inherit}
    button{cursor:pointer}
    button:focus-visible,a:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
    .material-symbols-outlined{font-family:"Material Symbols Outlined";font-size:20px;line-height:1;vertical-align:middle}
    .layout{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
    .side{position:sticky;top:0;height:100vh;padding:22px 16px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column}
    .brand{display:flex;align-items:center;gap:12px;padding:2px 8px 22px}
    .brand-logo{display:grid;place-items:center;width:42px;height:42px;flex:none;color:#fff;background:var(--blue);border-radius:6px;box-shadow:4px 4px 0 #bfdbfe}
    .brand-logo .material-symbols-outlined{font-size:24px}
    .brand b{display:block;font-size:14px;line-height:1.35}
    .brand small{display:block;margin-top:3px;color:var(--muted);font:10px "Fira Code",monospace;letter-spacing:.04em}
    .nav{display:grid;gap:5px}
    .nav button{display:flex;align-items:center;gap:11px;min-height:44px;padding:10px 11px;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--muted);font-size:13px;font-weight:600;text-align:left;transition:background .2s,color .2s,border-color .2s,transform .2s}
    .nav button:hover{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe;transform:translateX(2px)}
    .nav button.on{background:#1e3a8a;color:#fff;border-color:#1e3a8a}
    .nav button.on:after{content:"目前";margin-left:auto;font:9px "Fira Code";letter-spacing:.08em}
    .side-foot{margin-top:auto;padding:15px 8px 2px;border-top:1px solid var(--line);color:var(--muted);font:10px/1.7 "Fira Code",monospace}
    .main{min-width:0;padding:30px clamp(18px,3vw,42px) 64px}
    .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line)}
    .eyebrow{display:flex;align-items:center;gap:7px;margin-bottom:7px;color:var(--blue);font:600 10px "Fira Code";letter-spacing:.13em;text-transform:uppercase}
    .eyebrow:before{content:"";width:22px;height:2px;background:var(--blue)}
    h1{margin:0 0 6px;font-size:clamp(22px,2.4vw,32px);line-height:1.15;letter-spacing:-.035em}
    .topbar p{max-width:670px;margin:0;color:var(--muted);font-size:13px;line-height:1.65}
    .pill,.tag{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-weight:600}
    .pill{min-height:38px;padding:8px 12px;color:#fff;background:#1e3a8a;border-radius:4px;font-size:11px}
    .grid{display:grid;gap:15px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g23{grid-template-columns:minmax(0,1.65fr) minmax(280px,1fr)}.g32{grid-template-columns:minmax(280px,1fr) minmax(0,1.6fr)}
    .mb{margin-bottom:15px}
    .card,.kpi,.mcard{min-width:0;background:var(--color-card);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow)}
    .card{padding:19px}
    .card h3{margin:0;font-size:14px;letter-spacing:-.01em}
    .sub{margin:5px 0 15px;color:var(--muted);font-size:11px;line-height:1.55}
    .card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    .kpi{position:relative;padding:17px;overflow:hidden;transition:transform .22s,box-shadow .22s,border-color .22s}
    .kpi:hover,.mcard:hover{transform:translateY(-2px);border-color:#93c5fd;box-shadow:0 12px 28px rgba(37,99,235,.1)}
    .kpi:before{content:"";position:absolute;top:0;left:0;width:100%;height:3px;background:var(--blue)}
    .kico{display:grid;place-items:center;width:34px;height:34px;margin-bottom:14px;color:#1d4ed8;background:#eff6ff;border:1px solid #dbeafe;border-radius:4px}
    .kl{color:var(--muted);font-size:11px;font-weight:600}
    .kv{margin-top:5px;font:700 24px "Fira Code",monospace;letter-spacing:-.05em}
    .kv small{margin-left:4px;color:var(--muted);font:600 11px "Fira Sans"}
    .kd{display:flex;align-items:center;gap:4px;margin-top:8px;font-size:10px;font-weight:600}.kd .material-symbols-outlined{font-size:14px}
    .up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
    .tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:4px}
    table{width:100%;min-width:560px;border-collapse:collapse;font-size:12px}
    th,td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
    th{background:#f1f5f9;color:#334155;font:600 10px "Fira Code";letter-spacing:.04em}
    td{font-weight:500}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#f8fbff}
    td:nth-child(n+3){font-variant-numeric:tabular-nums}
    .mono{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
    .tag{padding:4px 8px;border:1px solid currentColor;border-radius:3px;font-size:10px}
    .tag:before{content:"";width:6px;height:6px;border:1px solid currentColor;background:currentColor;border-radius:50%}
    .tag.g{color:#047857;background:#ecfdf5}.tag.y{color:#9a3412;background:#fff7ed}.tag.r{color:#b91c1c;background:#fef2f2}.tag.b{color:#1d4ed8;background:#eff6ff}.tag.gray{color:#475569;background:#f1f5f9}
    .chart{width:100%;height:290px}.chart.sm{height:230px}.chart.lg{height:340px}
    .mcard{padding:16px;transition:transform .22s,box-shadow .22s,border-color .22s}
    .mh{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px}.mh b{font-size:13px}.mh span{display:block;margin-top:3px;color:var(--muted);font:10px "Fira Code"}
    .coef{display:grid;grid-template-columns:1fr 1fr;gap:7px}.coef div,.chip{padding:9px;background:#f8fafc;border:1px solid var(--line);border-radius:4px}
    .coef small{display:block;color:var(--muted);font-size:10px}.coef b{font:600 13px "Fira Code"}
    .meter{height:5px;margin-top:9px;background:#e2e8f0;overflow:hidden}.meter i{display:block;height:100%;background:var(--blue)}
    .alert{display:flex;align-items:flex-start;gap:11px;margin-bottom:9px;padding:11px;border:1px solid var(--line);border-left:4px solid;background:#fff;border-radius:4px}

    .ai{display:grid;place-items:center;width:31px;height:31px;flex:none;background:#f1f5f9;border-radius:3px}.alert.r .ai{color:var(--bad)}.alert.y .ai{color:var(--warn)}.alert.g .ai{color:var(--ok)}

    .tl{position:relative;padding-left:25px}.tl:before{content:"";position:absolute;left:8px;top:5px;bottom:5px;width:1px;background:#94a3b8}
    .tl-i{position:relative;padding:0 0 18px}.tl-i:before{content:"";position:absolute;left:-22px;top:3px;width:10px;height:10px;background:#fff;border:2px solid #64748b}.tl-i.done:before{background:var(--blue);border-color:var(--blue)}.tl-i.wait:before{background:#fff7ed;border-color:var(--warn)}
    .tt{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700}.td{margin-top:4px;color:var(--muted);font-size:10.5px}
    .chips{display:flex;gap:8px}.chip{flex:1;color:var(--muted);font-size:10px}.chip b{display:block;margin-top:4px;font:700 15px "Fira Code"}
    .reveal{animation:reveal .35s ease-out both}@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @media(max-width:1024px){.g4{grid-template-columns:repeat(2,1fr)}.g23,.g32{grid-template-columns:1fr}}
    @media(max-width:768px){.layout{display:block}.side{position:relative;width:auto;height:auto;padding:13px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:2px 4px 12px}.nav{display:flex;overflow-x:auto;padding-bottom:3px}.nav button{flex:none}.nav button.on:after,.side-foot{display:none}.main{padding:22px 15px 48px}.topbar{display:block}.pill{margin-top:14px}.g2{grid-template-columns:1fr}}
    @media(max-width:480px){.g4{grid-template-columns:1fr}.nav .nt{display:none}.nav button{min-width:44px;justify-content:center}.card{padding:14px}.coef{grid-template-columns:1fr 1fr}.chips{display:grid}.chart,.chart.lg{height:260px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}.kpi:hover,.mcard:hover,.nav button:hover{transform:none}}
  </style>
</head>
