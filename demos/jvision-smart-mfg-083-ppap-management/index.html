<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PPAP Management（生產件核准程序）</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#fff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000;
  --color-accent:#ea580c;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#1e293b;
  --color-card:#fff;
  --color-card-foreground:#1e293b;
  --color-muted:#e9eff8;
  --color-muted-foreground:#475569;
  --color-border:#e2e8f0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#1e293b;
  --muted:#475569;
  --line:#cbd5e1;
  --bg:#f8fafc;
  --card:#fff;
  --soft:#e9eff8;
  --ok:#15803d;
  --warn:#b45309;
  --bad:#dc2626;
  --info:#1d4ed8;
  --shadow:7px 7px 0 #0f172a;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  background-color:var(--color-background);
  background-image:
    linear-gradient(var(--color-border) 1px,transparent 1px),
    linear-gradient(90deg,var(--color-border) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--color-foreground);
  font-family:"Fira Sans",sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,a,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.msi{
  font-family:"Material Symbols Outlined";
  font-style:normal;
  font-weight:500;
  line-height:1;
  vertical-align:middle;
}
.topbar{
  position:sticky;
  top:0;
  z-index:50;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-bottom:4px solid #0f172a;
}
.topbar::after{
  content:"";
  position:absolute;
  right:0;
  bottom:-4px;
  width:17%;
  height:4px;
  background:var(--color-accent);
}
.topbar-inner{
  max-width:1440px;
  min-height:78px;
  margin:0 auto;
  padding:10px 20px;
  display:flex;
  align-items:center;
  gap:22px;
}
.brand{
  min-width:260px;
  display:flex;
  align-items:center;
  gap:12px;
}
.brand .logo{
  width:48px;
  height:48px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  color:#0f172a;
  background:var(--color-accent);
  border:3px solid #0f172a;
  box-shadow:4px 4px 0 #0f172a;
}
.brand .logo .msi{font-size:28px}
.brand h1{
  margin:0;
  font-family:"Fira Code",monospace;
  font-size:17px;
  font-weight:700;
  letter-spacing:-.03em;
  white-space:nowrap;
}
.brand p{
  margin:2px 0 0;
  color:#dbeafe;
  font-size:11px;
  font-weight:500;
  white-space:nowrap;
}
nav.tabs{
  margin-left:auto;
  display:flex;
  align-items:stretch;
  justify-content:flex-end;
  gap:4px;
}
nav.tabs button{
  min-height:44px;
  padding:8px 11px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  border:2px solid #0f172a;
  border-radius:0;
  background:#1d4ed8;
  color:#fff;
  font:600 12px "Fira Sans",sans-serif;
  box-shadow:2px 2px 0 #0f172a;
  transition:background-color .18s ease,color .18s ease,transform .18s ease,box-shadow .18s ease;
}
nav.tabs button:hover{
  background:#dbeafe;
  color:#0f172a;
  transform:translate(-1px,-1px);
  box-shadow:4px 4px 0 #0f172a;
}
nav.tabs button.active{
  color:#0f172a;
  background:var(--color-accent);
}
nav.tabs button .msi{font-size:19px}
main{
  max-width:1440px;
  min-height:calc(100vh - 78px);
  margin:0 auto;
  padding:30px 20px 72px;
}
.scr-head{
  position:relative;
  min-height:132px;
  margin:0 0 24px;
  padding:24px 28px;
  display:flex;
  align-items:flex-end;
  gap:14px;
  overflow:hidden;
  color:#fff;
  background:#0f172a;
  border:3px solid #0f172a;
  box-shadow:var(--shadow);
}
.scr-head::before{
  content:"QUALITY / COMPLIANCE";
  position:absolute;
  top:16px;
  right:20px;
  color:#93c5fd;
  font:600 11px "Fira Code",monospace;
  letter-spacing:.12em;
}
.scr-head::after{
  content:"";
  position:absolute;
  right:-42px;
  bottom:-75px;
  width:230px;
  height:170px;
  background:var(--color-primary);
  border:3px solid #fff;
  transform:rotate(-12deg);
}
.scr-head>*,.scr-head h2,.scr-head .sub{position:relative;z-index:1}
.scr-head h2{
  margin:0;
  color:#fff;
  font-size:clamp(25px,3vw,40px);
  font-weight:700;
  line-height:1.1;
  letter-spacing:-.045em;
}
.scr-head .sub{
  margin:6px 0 0;
  color:#cbd5e1;
  font-size:13px;
}
.scr-head>.badge:last-child{margin-left:auto}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{
  position:relative;
  min-width:0;
  padding:18px;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:2px solid #0f172a;
  border-radius:0;
  box-shadow:5px 5px 0 #0f172a;
}
.card h3{
  margin:0 0 15px;
  padding-bottom:10px;
  display:flex;
  align-items:center;
  gap:8px;
  border-bottom:2px solid #0f172a;
  font:700 14px "Fira Code",monospace;
  letter-spacing:-.02em;
}
.card h3 .msi{
  padding:4px;
  color:#fff;
  background:var(--color-primary);
  font-size:18px;
}
.kpi{min-height:130px;padding-top:20px}
.kpi::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:62px;
  height:7px;
  background:var(--color-primary);
}
.kpi:nth-child(4n+2)::before{background:var(--color-accent)}
.kpi:nth-child(4n+3)::before{background:#0f172a}
.kpi:nth-child(4n+4)::before{background:var(--color-destructive)}
.kpi .val{
  margin-top:10px;
  font:700 30px "Fira Code",monospace;
  letter-spacing:-.06em;
}
.kpi .val span{
  font-family:"Fira Sans",sans-serif;
  letter-spacing:0;
}
.kpi .lab{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--color-muted-foreground);
  font-size:12px;
  font-weight:600;
}
.kpi .lab .msi{font-size:18px;color:var(--color-primary)}
.kpi .delta{margin-top:7px;font-size:11px;font-weight:700}
.up::before{content:"▲ ";font-size:9px}
.down::before{content:"! ";font-family:"Fira Code",monospace}
.up{color:var(--ok)}
.down{color:var(--bad)}
.badge{
  min-height:25px;
  padding:3px 9px;
  display:inline-flex;
  align-items:center;
  gap:5px;
  border:1.5px solid currentColor;
  border-radius:0;
  font-size:11px;
  font-weight:700;
  line-height:1.2;
}
.badge::before{
  content:"";
  width:6px;
  height:6px;
  flex:0 0 auto;
  background:currentColor;
}
.b-ok{background:#dcfce7;color:#166534}
.b-warn{background:#fef3c7;color:#92400e}
.b-bad{background:#fee2e2;color:#b91c1c}
.b-info{background:#dbeafe;color:#1e40af}
.b-teal{background:#dbeafe;color:#1e40af}
.b-gray{background:#f1f5f9;color:#475569}
.note{
  padding:11px 13px;
  color:#334155;
  background:#eff6ff;
  border:2px solid var(--color-primary);
  border-left-width:8px;
  border-radius:0;
  font-size:12px;
}
.note .msi{color:var(--color-primary)!important}
.flow-in{
  display:inline-flex;
  flex-wrap:wrap;
  gap:7px;
}
.pill{
  padding:2px 7px;
  display:inline-block;
  color:#1e40af;
  background:#dbeafe;
  border:1px solid #2563eb;
  border-radius:0;
  font:600 11px "Fira Code",monospace;
}
.flow-in .pill{font-size:11px}
.tbl-wrap{
  overflow-x:auto;
  border:2px solid #0f172a;
  border-radius:0;
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}
th,td{
  padding:10px 11px;
  text-align:left;
  white-space:nowrap;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
th:last-child,td:last-child{border-right:0}
tbody tr:last-child td{border-bottom:0}
th{
  color:#fff;
  background:#0f172a;
  font:600 11px "Fira Code",monospace;
  letter-spacing:.03em;
}
tbody tr:nth-child(even){background:#f1f5f9}
tbody tr:hover{background:#dbeafe}
td.mono,.mono{
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
td[style*="text-align:center"],th[style*="text-align:center"]{text-align:center!important}
.bar{
  width:80px;
  min-width:70px;
  height:11px;
  overflow:hidden;
  background:#dbe3ef;
  border:1px solid #64748b;
  border-radius:0;
}
.bar>i{
  height:100%;
  display:block;
  background:repeating-linear-gradient(135deg,var(--color-primary) 0 7px,#60a5fa 7px 14px);
  border-radius:0;
}
.chart-wrap{position:relative;width:100%;overflow:hidden}
.legend{
  margin-top:10px;
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  color:var(--color-muted-foreground);
  font-size:11px;
}
.legend span{display:inline-flex;align-items:center;gap:6px}
.board{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
}
.col{
  min-width:0;
  padding:10px;
  background:var(--color-muted);
  border:2px solid #0f172a;
}
.col>h4{
  margin:0 0 10px;
  padding-bottom:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#334155;
  border-bottom:2px solid #0f172a;
  font:700 11px "Fira Code",monospace;
}
.col>h4 span:last-child{
  min-width:24px;
  padding:1px 6px;
  text-align:center;
  color:#fff;
  background:#0f172a;
  border-radius:0;
}
.tk{
  margin-bottom:9px;
  padding:10px;
  background:#fff;
  border:1.5px solid #0f172a;
  border-left:8px solid var(--color-primary);
  border-radius:0;
  box-shadow:3px 3px 0 #94a3b8;
}
.tk:last-child{margin-bottom:0}
.tk .t{font-size:13px;font-weight:700}
.tk .m{
  margin-top:5px;
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:6px;
  color:var(--color-muted-foreground);
  font-size:10px;
}
.el-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:9px;
}
.el{
  min-width:0;
  padding:10px;
  background:#fff;
  border:1.5px solid #0f172a;
  border-radius:0;
}
.el .top{display:flex;align-items:center;gap:8px}
.el .num{
  width:27px;
  height:27px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  color:#fff;
  background:#0f172a;
  border-radius:0;
  font:700 11px "Fira Code",monospace;
}
.el .nm{min-width:0;font-size:12px;font-weight:600}
.el .st{margin-left:auto;flex:0 0 auto}
.dot{
  width:9px;
  height:9px;
  display:inline-block;
  border:1px solid #0f172a;
  border-radius:0;
  transform:rotate(45deg);
}
.lvl-track{display:flex;flex-wrap:wrap;gap:8px}
.lvl{
  min-width:105px;
  min-height:82px;
  padding:12px 10px;
  flex:1;
  text-align:center;
  background:#fff;
  border:2px solid #0f172a;
  border-radius:0;
}
.lvl.on{
  color:#fff;
  background:var(--color-primary);
  border-color:#0f172a;
  box-shadow:5px 5px 0 #0f172a;
  transform:translate(-2px,-2px);
}
.lvl .lv{
  color:var(--color-primary);
  font:700 22px "Fira Code",monospace;
}
.lvl.on .lv,.lvl.on .nm{color:#fff}
.lvl .nm{
  margin-top:3px;
  color:var(--color-muted-foreground);
  font-size:10px;
}
.matrix td .chk{color:var(--ok);font-weight:700}
.matrix td .no{color:#64748b}
.stepper{display:flex;flex-wrap:wrap;gap:0;margin-bottom:4px}
.step{
  position:relative;
  min-width:120px;
  padding:9px 7px;
  flex:1;
  text-align:center;
  color:var(--color-muted-foreground);
  border-right:2px solid #0f172a;
  font-size:11px;
  font-weight:600;
}
.step:last-child{border-right:0}
.step .c{
  width:29px;
  height:29px;
  margin:0 auto 6px;
  display:grid;
  place-items:center;
  color:#334155;
  background:#e2e8f0;
  border:2px solid #0f172a;
  border-radius:0;
  font:700 12px "Fira Code",monospace;
}
.step.done{color:#166534;background:#f0fdf4}
.step.done .c{color:#fff;background:var(--ok)}
.step.cur{color:#1e40af;background:#eff6ff}
.step.cur .c{color:#fff;background:var(--color-primary)}
.avatar{
  width:29px;
  height:29px;
  display:inline-grid;
  place-items:center;
  color:#fff;
  background:#0f172a;
  border-radius:0;
  font:700 10px "Fira Code",monospace;
}
.tl{position:relative;padding-left:26px}
.tl::before{
  content:"";
  position:absolute;
  top:4px;
  bottom:4px;
  left:9px;
  width:4px;
  background:#0f172a;
}
.tl .it{position:relative;padding:0 0 20px 13px}
.tl .it:last-child{padding-bottom:0}
.tl .it::before{
  content:"";
  position:absolute;
  top:2px;
  left:-24px;
  width:14px;
  height:14px;
  background:var(--color-accent);
  border:3px solid #0f172a;
}
.tl .it .h{font-size:13px;font-weight:700}
.tl .it .d{color:var(--color-muted-foreground);font-size:11px}
.tl .it .tm{
  color:#1e40af;
  font:600 10px "Fira Code",monospace;
}
#app>*,.grid>.card,.el,.tk{
  animation:stagger-in .4s backwards cubic-bezier(.2,.9,.25,1.35);
}
#app>*:nth-child(2),.grid>.card:nth-child(2),.el:nth-child(2),.tk:nth-child(2){animation-delay:.06s}
#app>*:nth-child(3),.grid>.card:nth-child(3),.el:nth-child(3),.tk:nth-child(3){animation-delay:.12s}
#app>*:nth-child(4),.grid>.card:nth-child(4),.el:nth-child(4),.tk:nth-child(4){animation-delay:.18s}
.el:nth-child(3n+1){animation-delay:.04s}
.el:nth-child(3n+2){animation-delay:.1s}
.el:nth-child(3n){animation-delay:.16s}
@keyframes stagger-in{
  from{opacity:0;transform:translateY(16px) scale(.92)}
  to{opacity:1;transform:none}
}
@media(max-width:1024px){
  .topbar-inner{align-items:flex-start;flex-direction:column;gap:10px}
  nav.tabs{width:100%;margin-left:0;justify-content:stretch;overflow-x:auto;padding-bottom:3px}
  nav.tabs button{flex:1;min-width:110px}
  .g-2{grid-template-columns:1fr}
  .el-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:768px){
  main{padding:22px 14px 54px}
  .topbar-inner{padding:10px 14px}
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-2e,.g-3{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .scr-head{min-height:120px;padding:22px}
  .scr-head::after{opacity:.55}
}
@media(max-width:560px){
  .brand{min-width:0}
  .brand h1{font-size:15px}
  .brand p{font-size:10px;white-space:normal}
  .topbar-inner{gap:8px}
  nav.tabs button{min-width:48px;padding:8px}
  nav.tabs button .msi{font-size:21px}
  .hide-sm{display:none}
  .g-kpi,.board,.el-grid{grid-template-columns:1fr}
  .scr-head{
    min-height:138px;
    padding:22px 18px;
    align-items:flex-end;
  }
  .scr-head::before{right:14px;font-size:9px}
  .scr-head>.badge:last-child{margin-left:0}
  .card{padding:14px;box-shadow:4px 4px 0 #0f172a}
  .step{min-width:50%;border-bottom:2px solid #0f172a}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-delay:0ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="msi" aria-hidden="true">verified</span></div>
      <div>
        <h1>PPAP Management</h1>
        <p>生產件核准程序 · 品質管理平台</p>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="主要畫面"></nav>
  </div>
</header>
<main><div id="app"></div></main>

<script>
"use strict";
var C={accent:"#2563eb",accent2:"#3b82f6",line:"#cbd5e1",ok:"#15803d",warn:"#b45309",bad:"#dc2626",info:"#1d4ed8",muted:"#475569"};
var charts={};
function destroyCharts(){for(var k in charts){if(charts[k]){try{charts[k].destroy();}catch(e){}charts[k]=null;}}}
function mkChart(id,cfg){
 var el=document.getElementById(id);
 if(!el)return;
 if(charts[id]){try{charts[id].destroy();}catch(e){}}
 cfg.options=cfg.options||{};
 cfg.options.maintainAspectRatio=false;
 cfg.options.responsive=true;
 charts[id]=new Chart(el,cfg);
}
var SCREENS=[
 {icon:"dashboard",name:"案件總覽"},
 {icon:"checklist",name:"18項要素"},
 {icon:"rule",name:"送審等級"},
 {icon:"fact_check",name:"內部審核"},
 {icon:"verified",name:"客戶送審"},
 {icon:"insights",name:"通過率分析"}
];
var CASES=[
 {no:"PPAP-2408-017",part:"托架總成 BR-4471",cust:"O田汽車",lvl:3,stage:"客戶送審",prog:82,due:"08/18",owner:"陳彥廷",risk:"warn"},
 {no:"PPAP-2408-016",part:"齒輪軸 GS-2210",cust:"O特六和",lvl:4,stage:"內部審核",prog:64,due:"08/20",owner:"林孟潔",risk:"info"},
 {no:"PPAP-2408-015",part:"連桿 CR-1188",cust:"和O汽車",lvl:5,stage:"文件準備",prog:38,due:"08/25",owner:"王思翰",risk:"info"},
 {no:"PPAP-2408-013",part:"密封墊 SL-0902",cust:"O陽工業",lvl:2,stage:"核准回覆",prog:95,due:"08/15",owner:"張筱雯",risk:"bad"},
 {no:"PPAP-2408-011",part:"外殼件 HS-3355",cust:"O田汽車",lvl:3,stage:"量產放行",prog:100,due:"已完成",owner:"陳彥廷",risk:"ok"},
 {no:"PPAP-2408-010",part:"軸承座 BH-7720",cust:"O產汽車",lvl:1,stage:"客戶送審",prog:88,due:"08/19",owner:"林孟潔",risk:"warn"}
];

  mkChart("c5c",{type:"bar",data:{labels:CUSTPASS.map(function(c){return c.c;}),datasets:[{label:"一次通過率 %",data:CUSTPASS.map(function(c){return c.p;}),backgroundColor:blue2,borderColor:"#0f172a",borderWidth:1,borderRadius:0,maxBarThickness:40}]},options:{indexAxis:"y",plugins:{legend:{display:false}},scales:{x:{max:100,grid:{color:grid},ticks:{color:C.muted,font:{family:"Fira Code",size:10}},beginAtZero:true},y:{grid:{display:false},ticks:{color:C.muted,font:{family:"Fira Sans",size:11}}}}}});
 }
}
var RENDER=[s0,s1,s2,s3,s4,s5];
function show(i){
 var app=document.getElementById("app");
 destroyCharts();
 app.innerHTML=(RENDER[i]||s0)();
 var btns=document.querySelectorAll("[data-i]");
 for(var b=0;b<btns.length;b++){
  var active=+btns[b].getAttribute("data-i")===i;
  btns[b].classList.toggle("active",active);
  btns[b].setAttribute("aria-current",active?"page":"false");
 }
 void app.offsetHeight;
 initCharts(i);
}
(function(){
 var t=document.getElementById("tabs");
 t.innerHTML=SCREENS.map(function(s,i){
  return '<button type="button" data-i="'+i+'" aria-label="'+s.name+'"><span class="msi" aria-hidden="true">'+s.icon+'</span><span class="hide-sm">'+s.name+'</span></button>';
 }).join("");
 var btns=t.querySelectorAll("[data-i]");
 for(var b=0;b<btns.length;b++){
  (function(el){
   el.addEventListener("click",function(){
    var n=+el.getAttribute("data-i");
    location.hash="v"+n;
   });
  })(btns[b]);
 }
})();
function fromHash(){
 var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
 if(!m){show(0);return}
 var n=document.querySelectorAll("[data-i]").length||6;
 show(Math.min(+m[1],n-1));
 try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
