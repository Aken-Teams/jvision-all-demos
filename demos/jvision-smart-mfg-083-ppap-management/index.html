<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>

<title>PPAP Management（生產件核准程序）</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#0d9488; --accent2:#2dd4bf; --ink:#0f2b28; --muted:#5b7d78;
  --bg:#f2f7f6; --card:#ffffff; --line:#dbe9e6; --soft:#e8f4f2;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.msi{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(100deg,#0b7d73,#0d9488);color:#fff;box-shadow:0 2px 12px rgba(13,148,136,.25);}
.topbar-inner{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand .logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.brand .logo .msi{font-size:24px;}
.brand h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap;}
.brand p{font-size:11px;margin:0;opacity:.82;white-space:nowrap;}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0;}
nav.tabs button{
  border:0;background:rgba(255,255,255,.12);color:#eafaf7;cursor:pointer;
  padding:8px 12px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:6px;transition:.15s;min-width:0;
}
nav.tabs button:hover{background:rgba(255,255,255,.25);}
nav.tabs button.active{background:#fff;color:var(--accent);}
nav.tabs button .msi{font-size:18px;}
main{max-width:1360px;margin:0 auto;padding:20px 18px 60px;}
.scr-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.scr-head h2{font-size:20px;margin:0;font-weight:700;}
.scr-head .sub{font-size:13px;color:var(--muted);margin:0;}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;}
.b-ok{background:#dcfce7;color:#15803d;} .b-warn{background:#fef3c7;color:#b45309;}
.b-bad{background:#fee2e2;color:#b91c1c;} .b-info{background:#dbeafe;color:#1d4ed8;}
.b-teal{background:var(--soft);color:var(--accent);}
.b-gray{background:#eef2f1;color:#5b7d78;}
.grid{display:grid;gap:14px;}
.g-kpi{grid-template-columns:repeat(4,1fr);}
.g-2{grid-template-columns:2fr 1fr;}
.g-2e{grid-template-columns:1fr 1fr;}
.g-3{grid-template-columns:repeat(3,1fr);}
@media(max-width:820px){
  .g-kpi{grid-template-columns:repeat(2,1fr);}
  .g-2,.g-2e,.g-3{grid-template-columns:1fr;}
}
@media(max-width:560px){ .g-kpi{grid-template-columns:1fr;} .hide-sm{display:none;} }
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;}
.card h3{font-size:14px;margin:0 0 12px;font-weight:700;display:flex;align-items:center;gap:7px;}
.card h3 .msi{font-size:19px;color:var(--accent);}
.kpi .val{font-size:26px;font-weight:700;letter-spacing:-.5px;}
.kpi .lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;}
.kpi .lab .msi{font-size:16px;}
.kpi .delta{font-size:11px;font-weight:600;margin-top:6px;}
.up{color:var(--ok);} .down{color:var(--bad);}
.chart-wrap{position:relative;width:100%;overflow:hidden;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.4px;background:var(--soft);}
tbody tr:hover{background:#f7fbfa;}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;}
.bar{height:7px;border-radius:99px;background:#e6efed;overflow:hidden;min-width:70px;}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--accent);}
.mono{font-family:"Inter",monospace;font-variant-numeric:tabular-nums;}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media(max-width:820px){.board{grid-template-columns:1fr;}}
.col{background:#eef4f3;border-radius:12px;padding:10px;min-width:0;}
.col>h4{font-size:12px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-weight:700;}
.col>h4 span:last-child{background:#fff;border-radius:99px;padding:1px 8px;font-size:11px;}
.tk{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;padding:10px;margin-bottom:9px;}
.tk .t{font-weight:700;font-size:13px;}
.tk .m{font-size:11px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;}
.el-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media(max-width:820px){.el-grid{grid-template-columns:1fr;}}
.el{border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff;min-width:0;}
.el .top{display:flex;align-items:center;gap:8px;}
.el .num{width:24px;height:24px;border-radius:7px;background:var(--soft);color:var(--accent);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.el .nm{font-size:13px;font-weight:600;min-width:0;}
.el .st{margin-left:auto;flex:0 0 auto;}
.dot{width:9px;height:9px;border-radius:99px;display:inline-block;}
.tl{position:relative;padding-left:20px;}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl .it{position:relative;padding:0 0 16px 10px;}
.tl .it::before{content:"";position:absolute;left:-18px;top:3px;width:12px;height:12px;border-radius:99px;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent2);}
.tl .it .h{font-weight:700;font-size:13px;}
.tl .it .d{font-size:12px;color:var(--muted);}
.tl .it .tm{font-size:11px;color:var(--accent);font-weight:600;}
.lvl-track{display:flex;gap:8px;flex-wrap:wrap;}
.lvl{flex:1;min-width:90px;border:1.5px solid var(--line);border-radius:12px;padding:12px 10px;background:#fff;text-align:center;}
.lvl.on{border-color:var(--accent);background:var(--soft);box-shadow:0 3px 10px rgba(13,148,136,.15);}
.lvl .lv{font-size:20px;font-weight:700;color:var(--accent);}
.lvl .nm{font-size:11px;color:var(--muted);margin-top:2px;}
.matrix td .chk{color:var(--ok);font-weight:700;}
.matrix td .no{color:#cbd5cf;}
.stepper{display:flex;gap:0;flex-wrap:wrap;margin-bottom:8px;}
.step{flex:1;min-width:120px;position:relative;padding:10px 6px;text-align:center;font-size:12px;font-weight:600;color:var(--muted);}
.step .c{width:26px;height:26px;border-radius:99px;background:#e6efed;color:var(--muted);display:flex;align-items:center;justify-content:center;margin:0 auto 5px;font-weight:700;}
.step.done .c{background:var(--accent);color:#fff;} .step.done{color:var(--ink);}
.step.cur .c{background:#fff;border:2px solid var(--accent);color:var(--accent);} .step.cur{color:var(--accent);}
.note{font-size:12px;color:var(--muted);background:var(--soft);border-radius:9px;padding:9px 11px;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.avatar{width:26px;height:26px;border-radius:99px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;}
.flow-in{display:inline-flex;gap:8px;flex-wrap:wrap;}
.flow-in .pill{font-size:12px;}
</style>
</head>
<body>
<header class="topbar">

      <div class="logo"><span class="msi">verified</span></div>

   (delta?'<div class="delta '+(dir||'')+'">'+delta+'</div>':'')+'</div>';
}

     '<div class="legend"><span>'+elDot("ok")+'齊備</span><span>'+elDot("warn")+'待核</span><span>'+elDot("pend")+'待簽</span><span>'+elDot("na")+'不適用</span></div>'+
   '</div>'+

 '</div>';

function s2(){
 var lvls=LEVELS.map(function(l,i){return '<div class="lvl'+(i===2?' on':'')+'"><div class="lv">'+l.lv+'</div><div class="nm">'+l.nm+'</div></div>';}).join("");
 var mrows=LMATRIX.map(function(r){
  var tds=r.v.map(function(v){return '<td style="text-align:center">'+(v?'<span class="chk msi" style="font-size:18px">check_circle</span>':'<span class="no msi" style="font-size:18px">remove</span>')+'</td>';}).join("");
  return '<tr><td>'+r.el+'</td>'+tds+'</tr>';
 }).join("");
 return ''+
 '<div class="scr-head"><div><h2>送審等級設定</h2><p class="sub">依零件風險與變更類型設定 Level 1~5 送審範圍</p></div><span class="badge b-info" style="margin-left:auto">目前選定 Level 3</span></div>'+
 '<div class="card" style="margin-bottom:14px"><h3><span class="msi">rule</span>送審等級選擇（AIAG PPAP）</h3><div class="lvl-track">'+lvls+'</div>'+
   '<div class="note" style="margin-top:12px"><span class="msi" style="font-size:16px;color:#0d9488">info</span> 建議規則：新開發或高風險安全件採 Level 3；工程變更且量測系統穩定者可採 Level 2；客戶指定則以客戶要求為準。</div></div>'+
 '<div class="grid g-2">'+
   '<div class="card matrix"><h3><span class="msi">grid_on</span>各等級送審要素矩陣</h3><div class="tbl-wrap"><table><thead><tr><th>提交要素</th><th style="text-align:center">L1</th><th style="text-align:center">L2</th><th style="text-align:center">L3</th><th style="text-align:center">L4</th><th style="text-align:center">L5</th></tr></thead><tbody>'+mrows+'</tbody></table></div></div>'+
   '<div class="card"><h3><span class="msi">stacked_bar_chart</span>各等級要求提交項數</h3><div class="chart-wrap" style="height:250px"><canvas id="c2a"></canvas></div></div>'+
 '</div>';

function s3(){
 var steps=['文件齊備檢核','品保初審','工程覆核','品質經理核准'];
 var stepHtml=steps.map(function(s,i){var cls=i<1?'done':(i===1?'cur':'');return '<div class="step '+cls+'"><div class="c">'+(i<1?'✓':(i+1))+'</div>'+s+'</div>';}).join("");
 var rows=REVIEW.map(function(r){
  var m={"核准":"b-ok","退回補件":"b-bad","待補件":"b-warn","待審":"b-info"}[r.res]||"b-gray";
  return '<tr><td class="mono">'+r.no+'</td><td>'+r.part+'</td><td>'+r.gate+'</td><td><span class="avatar">'+r.rev.slice(-2)+'</span></td><td><span class="badge '+m+'">'+r.res+'</span></td><td>'+r.note+'</td><td class="mono hide-sm">'+r.t+'</td></tr>';
 }).join("");
 var kp=REVKPI.map(function(k){return kpi(k.lab,k.v,"fact_check",k.d,"",k.m==="ok"?"up":(k.m==="bad"?"down":""));}).join("");
 return ''+
 '<div class="scr-head"><span class="badge b-teal">內部審核</span><div><h2>內部審核簽核</h2><p class="sub">品保、工程多關卡審核與缺失退回流程</p></div></div>'+
 '<div class="card" style="margin-bottom:14px"><h3><span class="msi">account_tree</span>審核關卡流程</h3><div class="stepper">'+stepHtml+'</div></div>'+
 '<div class="grid g-kpi" style="margin-bottom:14px">'+kp+'</div>'+
 '<div class="card"><h3><span class="msi">history</span>審核紀錄</h3><div class="tbl-wrap"><table><thead><tr><th>案件</th><th>零件</th><th>關卡</th><th>審核人</th><th>結果</th><th>意見</th><th class="hide-sm">時間</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

function s4(){
 var cols=[
  {t:"準備送出",m:"info",items:[["PPAP-2408-015","連桿 CR-1188","和泰 · L5"]]},
  {t:"已送審",m:"teal",items:[["PPAP-2408-017","托架總成","豐田 · L3"],["PPAP-2408-010","軸承座 BH-7720","日產 · L1"]]},
  {t:"客戶審查中",m:"warn",items:[["PPAP-2408-017","托架總成","ETA 08/18"]]},
  {t:"已核准",m:"ok",items:[["PPAP-2408-011","外殼件 HS-3355","豐田 · 完全核准"],["PPAP-2408-008","閥體 VN-2201","福特 · 完全核准"]]}
 ];
 var board=cols.map(function(c){
  var bc=c.m==="ok"?C.ok:(c.m==="warn"?C.warn:(c.m==="info"?C.info:C.accent));
  var tk=c.items.map(function(it){return '<div class="tk" style="border-left-color:'+bc+'"><div class="t">'+it[1]+'</div><div class="m"><span class="mono">'+it[0]+'</span><span>'+it[2]+'</span></div></div>';}).join("");
  return '<div class="col"><h4><span>'+c.t+'</span><span>'+c.items.length+'</span></h4>'+tk+'</div>';
 }).join("");
 var rows=CUSTSUB.map(function(r){
  var m={"完全核准":"b-ok","有條件核准":"b-info","退回":"b-bad","審查中":"b-warn"}[r.status]||"b-gray";
  return '<tr><td class="mono">'+r.no+'</td><td>'+r.cust+'</td><td><span class="pill">L'+r.lvl+'</span></td><td class="mono">'+r.psw+'</td><td class="mono">'+r.sub+'</td><td><span class="badge '+m+'">'+r.status+'</span></td><td class="mono">'+r.eta+'</td></tr>';
 }).join("");
 var tl=PSWTL.map(function(t){return '<div class="it"><div class="h">'+t.h+'</div><div class="d">'+t.d+'</div><div class="tm">'+t.tm+'</div></div>';}).join("");
 return ''+
 '<div class="scr-head"><span class="badge b-teal">客戶送審</span><div><h2>客戶送審與 PSW</h2><p class="sub">零件提交保證書送出、客戶核准狀態追蹤</p></div></div>'+
 '<div class="card" style="margin-bottom:14px"><h3><span class="msi">view_kanban</span>送審看板</h3><div class="board">'+board+'</div></div>'+
 '<div class="grid g-2">'+
   '<div class="card"><h3><span class="msi">receipt_long</span>PSW 送審清單</h3><div class="tbl-wrap"><table><thead><tr><th>案件</th><th>客戶</th><th>等級</th><th>PSW 編號</th><th>送出</th><th>狀態</th><th>ETA</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
   '<div class="card"><h3><span class="msi">timeline</span>PSW-BR4471 追蹤</h3><div class="tl">'+tl+'</div></div>'+
 '</div>';
}

function s5(){
 return ''+
 '<div class="scr-head"><span class="badge b-teal">量產放行</span><div><h2>通過率分析</h2><p class="sub">一次通過率、送審週期與客戶別績效統計</p></div></div>'+
 '<div class="grid g-kpi" style="margin-bottom:14px">'+
   kpi("一次通過率","89%","verified","","+18pt vs 年初","up")+
   kpi("平均送審週期","13","schedule","天","-9 天","up")+
   kpi("本月放行","28","task_alt","件","+5 件","up")+
   kpi("退回補件率","12%","undo","","-8pt","up")+
 '</div>'+
 '<div class="grid g-2" style="margin-bottom:14px">'+
   '<div class="card"><h3><span class="msi">trending_up</span>一次通過率 vs 送審週期趨勢</h3><div class="chart-wrap" style="height:280px"><canvas id="c5a"></canvas></div></div>'+
   '<div class="card"><h3><span class="msi">pie_chart</span>核准結果佔比</h3><div class="chart-wrap" style="height:280px"><canvas id="c5b"></canvas></div></div>'+
 '</div>'+
 '<div class="card"><h3><span class="msi">bar_chart</span>客戶別一次通過率</h3><div class="chart-wrap" style="height:230px"><canvas id="c5c"></canvas></div></div>';
}

function initCharts(i){
 var teal="#0d9488",teal2="#2dd4bf",grid="#e6efed";
 var baseX={grid:{display:false},ticks:{color:C.muted,font:{size:11}}};
 var baseY={grid:{color:grid},ticks:{color:C.muted,font:{size:11}},beginAtZero:true};
 if(i===0){
  mkChart("c0a",{type:"doughnut",data:{labels:["文件準備","內部審核","客戶送審","核准回覆","量產放行"],datasets:[{data:[3,4,3,2,2],backgroundColor:["#94a3b8","#2dd4bf","#0d9488","#d97706","#16a34a"],borderWidth:2,borderColor:"#fff"}]},options:{cutout:"58%",plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:11},color:C.muted}}}}});
 }else if(i===1){
  mkChart("c1a",{type:"bar",data:{labels:["設計/FMEA","製程/控制計畫","量測 MSA","尺寸/材料","製程能力","樣品/檢具"],datasets:[{label:"完成度 %",data:[100,90,55,88,48,100],backgroundColor:teal,borderRadius:6,maxBarThickness:34}]},options:{plugins:{legend:{display:false}},scales:{x:baseX,y:{grid:{color:grid},ticks:{color:C.muted,font:{size:11}},beginAtZero:true,max:100}}}});
 }else if(i===2){
  mkChart("c2a",{type:"bar",data:{labels:["L1","L2","L3","L4","L5"],datasets:[{label:"提交項數",data:[1,5,8,4,8],backgroundColor:["#cbd5cf","#5eead4","#0d9488","#5eead4","#0b7d73"],borderRadius:6,maxBarThickness:46}]},options:{plugins:{legend:{display:false}},scales:{x:baseX,y:baseY}}});
 }else if(i===5){
  mkChart("c5a",{type:"line",data:{labels:TREND.labels,datasets:[
    {label:"一次通過率 %",data:TREND.pass,borderColor:teal,backgroundColor:"rgba(13,148,136,.12)",fill:true,tension:.35,yAxisID:"y",pointRadius:3},
    {label:"送審週期 天",data:TREND.cycle,borderColor:C.warn,backgroundColor:"transparent",tension:.35,yAxisID:"y1",pointRadius:3}
   ]},options:{plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:11},color:C.muted}}},scales:{x:baseX,y:{position:"left",grid:{color:grid},ticks:{color:C.muted,font:{size:11}},min:60,max:100},y1:{position:"right",grid:{display:false},ticks:{color:C.warn,font:{size:11}},min:0,max:28}}}});
  mkChart("c5b",{type:"pie",data:{labels:STATMIX.map(function(s){return s.lab;}),datasets:[{data:STATMIX.map(function(s){return s.v;}),backgroundColor:STATMIX.map(function(s){return s.c;}),borderWidth:2,borderColor:"#fff"}]},options:{plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:11},color:C.muted}}}}});
  mkChart("c5c",{type:"bar",data:{labels:CUSTPASS.map(function(c){return c.c;}),datasets:[{label:"一次通過率 %",data:CUSTPASS.map(function(c){return c.p;}),backgroundColor:teal2,borderRadius:6,maxBarThickness:40}]},options:{indexAxis:"y",plugins:{legend:{display:false}},scales:{x:{max:100,grid:{color:grid},ticks:{color:C.muted,font:{size:11}},beginAtZero:true},y:{grid:{display:false},ticks:{color:C.muted,font:{size:11}}}}}});
 }
}

var RENDER=[s0,s1,s2,s3,s4,s5];
function show(i){
 var app=document.getElementById("app");
 destroyCharts();
 app.innerHTML=(RENDER[i]||s0)();
 var btns=document.querySelectorAll("[data-i]");
 for(var b=0;b<btns.length;b++){btns[b].classList.toggle("active",+btns[b].getAttribute("data-i")===i);}
 void app.offsetHeight;
 initCharts(i);
}

(function(){
 var t=document.getElementById("tabs");
 t.innerHTML=SCREENS.map(function(s,i){return '<button data-i="'+i+'"><span class="msi">'+s.icon+'</span><span class="hide-sm">'+s.name+'</span></button>';}).join("");
 var btns=t.querySelectorAll("[data-i]");
 for(var b=0;b<btns.length;b++){(function(el){el.addEventListener("click",function(){var n=+el.getAttribute("data-i");location.hash="v"+n;});})(btns[b]);}
})();

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
