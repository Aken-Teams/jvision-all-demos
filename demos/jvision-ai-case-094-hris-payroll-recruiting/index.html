<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>人資薪假招募艙 · HRIS 人力資源系統</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFF;
  --color-ring:#0D9488;
  --blue:#1D4ED8;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --green:#08795F;
  --purple:#6D28D9;
  --radius:14px;
  --serif:"Crimson Pro","Noto Serif TC",serif;
  --display:"Cormorant Garamond","Noto Serif TC",serif;
  --caps:"Cinzel","Noto Serif TC",serif
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,a,[role=button]{cursor:pointer}
button{font:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.material-symbols-outlined{font-variation-settings:"FILL" 0,"wght" 500,"GRAD" 0,"opsz" 24;vertical-align:middle}
.shell{display:flex;min-height:100vh}
.side{position:sticky;top:0;display:flex;flex:0 0 250px;flex-direction:column;height:100vh;padding:22px 16px;background:#fff;border-right:2px solid var(--line);overflow:auto}
.brand{display:flex;align-items:center;gap:12px;padding:2px 6px 24px;border-bottom:1px solid var(--line)}
.logo{display:grid;place-items:center;width:44px;height:44px;flex:none;border:2px solid var(--color-primary);border-radius:12px;background:var(--color-secondary);color:#062E2A}
.brand b{display:block;font-family:var(--display);font-size:20px;line-height:1.05}
.brand span:not(.material-symbols-outlined){color:var(--muted);font-size:12px}
.navlbl{padding:22px 10px 8px;color:var(--muted);font-family:var(--caps);font-size:10px;letter-spacing:.14em}
.navwrap{display:grid;gap:5px}
.nav{display:flex;align-items:center;gap:11px;width:100%;min-height:52px;padding:9px 11px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--muted);text-align:left;transition:background-color .18s ease,color .18s ease,border-color .18s ease}
.nav:hover{background:var(--color-background);border-color:var(--line);color:var(--ink)}
.nav.on{background:var(--color-primary);border-color:#08776F;color:#001F1C}
.nav.on small{color:#052F2B}
.nav .material-symbols-outlined{font-size:21px}
.nav .txt{min-width:0}
.nav .txt>span{font-weight:700}
.nav small{display:block;overflow:hidden;color:var(--muted);font-size:11px;text-overflow:ellipsis;white-space:nowrap}
.foot{margin-top:auto;padding:16px 10px 2px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.foot b{color:var(--ink)}
.main{min-width:0;flex:1;padding:28px clamp(16px,3vw,42px) 48px}
.top{position:sticky;z-index:5;top:0;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:-28px calc(clamp(16px,3vw,42px)*-1) 22px;padding:24px clamp(16px,3vw,42px) 18px;background:rgba(240,253,250,.96);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{margin:0;font-family:var(--display);font-size:clamp(30px,4vw,44px);font-weight:700;line-height:1}
.top .sub{margin-top:5px;color:var(--muted)}
.pills,.legend{display:flex;gap:8px;flex-wrap:wrap}
.chip,.tg{display:inline-flex;align-items:center;gap:5px;border-radius:999px;font-weight:700;white-space:nowrap}
.chip{min-height:36px;padding:6px 12px;background:#fff;border:1px solid var(--line);color:var(--ink);font-size:13px}
.chip .material-symbols-outlined{font-size:17px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr)}
.g32{grid-template-columns:minmax(300px,1fr) minmax(0,1.5fr)}
.card,.certc,.excr{background:var(--color-card);border:1px solid var(--line);border-radius:var(--radius)}
.card{min-width:0;padding:18px}
.card h3{display:flex;align-items:center;gap:8px;margin:0 0 3px;font-family:var(--display);font-size:20px;line-height:1.2}
.card h3 .material-symbols-outlined,.certc .material-symbols-outlined{color:var(--color-primary)}
.cap{margin-bottom:14px;color:var(--muted);font-size:13px}
.kpi{border-top:5px solid var(--color-primary)}
.kpi:nth-child(2n){border-top-color:var(--color-secondary)}
.kpi:nth-child(3){border-top-color:var(--color-accent)}
.kpi .lbl{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;font-weight:600}
.kpi .lbl .material-symbols-outlined{color:var(--color-primary);font-size:19px}
.kpi .val{margin-top:10px;font-family:var(--display);font-size:35px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .val small{color:var(--muted);font-family:var(--serif);font-size:14px}
.dv{display:inline-flex;align-items:center;gap:3px;margin-top:9px;font-size:12px;font-weight:700}
.dv.up{color:#08795F}.dv.dn{color:#B91C1C}.dv.fl{color:var(--muted)}
.dv .material-symbols-outlined{font-size:16px}
.bar{height:8px;margin-top:11px;background:var(--color-muted);border:1px solid #C8E6E2;border-radius:999px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--color-primary)}
.canvas-wrap{position:relative;width:100%}
.h180{height:180px}.h200{height:200px}.h220{height:220px}.h240{height:240px}
.legend{margin-top:10px;color:var(--muted);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:2px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{padding:10px;text-align:left;color:var(--muted);border-bottom:2px solid var(--line);font-family:var(--caps);font-size:10px;letter-spacing:.06em;white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid #C9EAE5;vertical-align:middle}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#E5FAF6}
tbody tr:last-child td{border-bottom:0}
td.num,.slip .row span:last-child,.fmeta,.tm{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
td.num{text-align:right}
.tg{padding:4px 9px;border:1px solid currentColor;font-size:11px}
.tg .material-symbols-outlined{font-size:14px}
.t-ok{background:#D9F5E9;color:#066A4E}
.t-warn{background:#FFF1C7;color:#815100}
.t-bad{background:#FDE3E1;color:#A51D1D}
.t-info{background:#E1EAFF;color:#173E9B}
.t-mut{background:#EDF2F4;color:#475569}
.t-teal{background:#DDF9F4;color:#08776F}
.who{display:flex;align-items:center;gap:9px;min-width:0}
.ava{display:grid;place-items:center;width:32px;height:32px;flex:none;border-radius:9px;color:#fff;font-weight:700}
.who b,.who small{display:block}
.who small{color:var(--muted);font-size:11px}
.exc,.progress-list{display:grid;gap:10px}
.excr{display:flex;align-items:center;gap:12px;padding:12px}
.excr .ic{display:grid;place-items:center;width:36px;height:36px;flex:none;border-radius:9px;color:#fff}
.excr .body{min-width:0;flex:1}
.excr p{margin:2px 0 0;color:var(--muted);font-size:13px}
.board{overflow-x:auto}
.rota{min-width:720px;border-collapse:separate;border-spacing:6px}
.rota th{border:0;text-align:center}
.rota td{padding:0;border:0}
.rota .rlbl{text-align:left;font-weight:700}
.shcell{display:flex;min-height:55px;align-items:center;justify-content:center;flex-direction:column;border:1px solid currentColor;border-radius:9px;font-size:12px;font-weight:700}
.shcell small{font-weight:400}
.sh-m{background:#D9F5E9;color:#066A4E}.sh-e{background:#E1EAFF;color:#173E9B}.sh-n{background:#EEE7FF;color:#5B21B6}.sh-o{background:#EDF2F4;color:#475569}.sh-gap{background:#FDE3E1;color:#A51D1D}
.funnel{display:grid;gap:9px}
.frow{display:flex;align-items:center;gap:12px}
.fbar{display:flex;align-items:center;min-width:105px;height:38px;padding:0 13px;border-radius:8px;font-weight:700}
.fmeta{width:70px;flex:none;text-align:right}
.fmeta b{display:block;font-size:17px}
.fmeta small{color:var(--muted)}
.slip{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.slip .sh{padding:15px;background:var(--color-primary);color:#001F1C}
.slip .sh b{font-family:var(--display);font-size:20px}
.slip .sh small{display:block}
.slip .row{display:flex;justify-content:space-between;gap:20px;padding:10px 15px;border-bottom:1px solid #C9EAE5}
.slip .row.neg span:last-child{color:#B91C1C}
.slip .row.tot{background:#DDF9F4;color:#063E38;font-size:18px;font-weight:700}
.slip .material-symbols-outlined{margin-right:6px;color:var(--color-primary);font-size:17px}
.mini{color:var(--muted);font-size:12px}
.pl-row .top{display:flex;justify-content:space-between;gap:10px;margin-bottom:5px;font-weight:700}
.pl-row .top span:last-child{color:var(--muted);font-size:12px}
.badge-rank{display:inline-grid;place-items:center;width:24px;height:24px;border:1px solid var(--line);border-radius:7px;background:#DDF9F4;color:#075F57;font-family:var(--caps);font-size:11px}
.certgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
.certc{padding:14px}
.certc .cn{display:flex;align-items:center;gap:7px;font-weight:700}
.certc .meta{margin:8px 0;color:var(--muted);font-size:12px}
.tl{position:relative;padding-left:24px}
.tl:before{position:absolute;top:5px;bottom:5px;left:7px;width:2px;background:var(--line);content:""}
.tli{position:relative;padding-bottom:16px}
.tli:last-child{padding-bottom:0}
.nd{position:absolute;top:3px;left:-22px;width:12px;height:12px;border:3px solid var(--color-primary);border-radius:50%;background:#fff}
.done .nd{background:var(--color-primary)}
.now .nd{border-color:var(--color-accent)}
.tli h4{margin:1px 0;font-size:15px}.tli p{margin:0;color:var(--muted);font-size:12px}.tm{color:var(--muted);font-size:11px}
.matrix{display:grid;grid-template-columns:auto repeat(3,1fr);grid-template-rows:auto repeat(3,1fr);gap:6px;min-width:540px}
.mx-ax{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;font-weight:700}
.mx-ax.v{writing-mode:vertical-rl;transform:rotate(180deg)}
.mx-cell{min-height:78px;padding:9px;border:1px solid transparent;border-radius:10px}
.mx-cell b{display:block;margin-bottom:5px;color:#334155;font-size:11px}
.mx-1{background:#FDE3E1;border-color:#F4A8A2}.mx-2{background:#FFF1C7;border-color:#E8C768}.mx-3{background:#D9F5E9;border-color:#83D5B8}
.mchip{display:inline-flex;align-items:center;gap:4px;margin:2px 2px 0 0;padding:3px 7px;background:#fff;border:1px solid #CBD5E1;border-radius:6px;font-size:11px;font-weight:700}
.mchip .d{width:7px;height:7px;border-radius:50%}
.screen-enter>.grid,.screen-enter>.card{animation:arrive .4s cubic-bezier(.2,.8,.2,1) both}
.screen-enter>:nth-child(2){animation-delay:.06s}.screen-enter>:nth-child(3){animation-delay:.12s}
@keyframes arrive{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,1fr)}.certgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
  .shell{display:block}.side{position:static;width:100%;height:auto;padding:12px 14px;border-right:0;border-bottom:2px solid var(--line)}
  .brand{padding:0 0 12px}.navlbl,.foot{display:none}.navwrap{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px}
  .nav{width:auto;min-width:max-content}.nav small{display:none}.main{padding:20px 16px 40px}.top{position:static;margin:-20px -16px 18px;padding:20px 16px 16px}
  .g23,.g32,.g2{grid-template-columns:1fr}
}
@media(max-width:560px){
  .g4,.certgrid{grid-template-columns:1fr}.nav .txt{display:none}.nav{min-width:46px;justify-content:center;padding:8px}
  .pills{width:100%}.chip{flex:1;justify-content:center}.excr{align-items:flex-start;flex-wrap:wrap}.excr .act{margin-left:48px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
  <div class="brand"><div class="logo"><span class="material-symbols-outlined">badge</span></div><div><b>人資薪假招募艙</b><span>HRIS · 人力資源全流程</span></div></div>
  <div class="navlbl">功能模組</div>
  <div class="navwrap" id="nav"></div>
  <div class="foot">純 UI 展示 · 擬真資料<br><b>v2026.08</b> 演示版</div>
</aside>
<main class="main">
  <div class="top">
    <div><h1 id="scrTitle">出勤差勤</h1><div class="sub" id="scrSub">打卡、請假與加班時數統計</div></div>
    <div class="pills"><span class="chip"><span class="material-symbols-outlined">domain</span>杰視科技 · 全體 328 人</span><span class="chip"><span class="material-symbols-outlined">event</span>2026 年 8 月</span></div>
  </div>
  <div id="screen" aria-live="polite"></div>
</main>
</div>
<script>
"use strict";
var MODS=[
 {icon:"fingerprint",name:"出勤差勤",desc:"打卡、請假與加班時數統計"},
 {icon:"payments",name:"薪資計算",desc:"薪資、勞健保與所得稅計算"},
 {icon:"calendar_month",name:"排班管理",desc:"智慧排班與最低人力控管"},
 {icon:"person_search",name:"招募任用",desc:"職缺、面試漏斗與報到"},
 {icon:"school",name:"教育訓練",desc:"課程進度與證照到期追蹤"},
 {icon:"workspace_premium",name:"績效考核",desc:"目標設定與九宮格盤點"}
];
var C={teal:"#0D9488",teal2:"#2DD4BF",teald:"#08776F",amber:"#D97706",red:"#DC2626",blue:"#1D4ED8",mut:"#64748B",line:"#B7E6DF"};
var avaColors=[C.teal,C.blue,C.amber,"#6D28D9",C.red,"#08795F","#9A6700"];
var charts=[];
function icon(n){return '<span class="material-symbols-outlined">'+n+'</span>'}
function ava(n,i){return '<span class="ava" style="background:'+avaColors[i%avaColors.length]+'">'+n.slice(0,1)+'</span>'}
function who(n,d,i){return '<div class="who">'+ava(n,i)+'<div><b>'+n+'</b><small>'+d+'</small></div></div>'}
function tag(c,t,ic){return '<span class="tg t-'+c+'">'+(ic?icon(ic):"")+t+'</span>'}
function card(title,cap,body){return '<section class="card"><h3>'+title+'</h3><div class="cap">'+cap+'</div>'+body+'</section>'}
function killCharts(){charts.forEach(function(c){try{c.destroy()}catch(e){}});charts=[]}
function mkChart(id,cfg){var el=document.getElementById(id);if(el)charts.push(new Chart(el,cfg))}
function kpiCard(k){
 var trend=k.dc==="up"?"trending_up":k.dc==="dn"?"trending_down":"trending_flat";
 return '<article class="card kpi"><div class="lbl">'+icon(k.ic)+k.l+'</div><div class="val">'+k.v+' <small>'+k.u+'</small></div><div class="dv '+k.dc+'">'+icon(trend)+k.d+'</div>'+(k.p==null?"":'<div class="bar"><span style="width:'+k.p+'%"></span></div>')+'</article>'
}
function kpiRow(a){return '<div class="grid g4">'+a.map(kpiCard).join("")+'</div>'}
function legend(a){return '<div class="legend">'+a.map(function(x){return '<span><i class="dot" style="background:'+x[1]+'"></i>'+x[0]+'</span>'}).join("")+'</div>'}
function canvas(id,h){return '<div class="canvas-wrap '+h+'"><canvas id="'+id+'"></canvas></div>'}
function progress(i,n,v,x){return '<div class="pl-row"><div class="top"><span><span class="badge-rank">'+i+'</span> '+n+'</span><span>'+v+'%'+(x?" · "+x:"")+'</span></div><div class="bar"><span style="width:'+v+'%"></span></div></div>'}

(function(){
 document.getElementById("nav").innerHTML=MODS.map(function(m,i){return '<button class="nav" type="button" data-i="'+i+'" aria-label="'+m.name+'">'+icon(m.icon)+'<span class="txt"><span>'+m.name+'</span><small>'+m.desc+'</small></span></button>'}).join("");
 document.querySelectorAll("[data-i]").forEach(function(b){b.addEventListener("click",function(){location.hash="v"+this.dataset.i})})
})();

Chart.defaults.font.family="'Crimson Pro', serif";
Chart.defaults.font.size=12;
Chart.defaults.color="#475569";
Chart.defaults.plugins.legend.display=false;

function s0(){
 var k=kpiRow([
  {ic:"how_to_reg",l:"今日出勤率",v:"96.8",u:"%",d:"+1.2pt",dc:"up",p:97},
  {ic:"schedule",l:"待確認加班",v:"14",u:"筆",d:"含 3 筆逾 12hr",dc:"dn",p:40},
  {ic:"event_busy",l:"今日請假",v:"22",u:"人",d:"特休 13・病假 6",dc:"fl",p:55},
  {ic:"error",l:"缺卡/異常",v:"7",u:"筆",d:"需人資補登",dc:"dn",p:25}
 ]);
 var e=[
  ["schedule",C.red,"李盈慧 · 研發部","8/12 單日工時 13.5hr，超過 12hr 上限（RULE-02）","bad","待主管確認"],
  ["fingerprint",C.amber,"王建豪 · 業務部","8/12 下班未打卡，系統推估 18:42 離場","warn","補登中"],
  ["event_busy",C.blue,"陳思妤 · 客服部","8/13 病假未附證明，剩餘特休 3.5 天","info","待附件"],
  ["nights_stay","#6D28D9","周家安 · 生產一課","連續 6 日夜班，建議安排輪替","mut","提醒"],
  ["check_circle",C.teal,"林彥廷 · 研發部","8/11 加班 2.0hr 已核准並轉入補休","ok","已核准"]
 ];
 var ex=e.map(function(x){return '<div class="excr"><div class="ic" style="background:'+x[1]+'">'+icon(x[0])+'</div><div class="body"><b>'+x[2]+'</b><p>'+x[3]+'</p></div><div class="act">'+tag(x[4],x[5],x[4]==="ok"?"check_circle":"priority_high")+'</div></div>'}).join("");
 return k+'<div class="grid g23" style="margin-top:14px">'+card(icon("bar_chart")+"近 14 日出勤與異常趨勢","綠：正常出勤人次　橘：異常/缺卡筆數",canvas("c0a","h240"))+card(icon("donut_small")+"本月請假類別占比","合計 186 人日",canvas("c0b","h180")+legend([["特休",C.teal],["病假",C.blue],["事假",C.amber],["其他",C.mut]]))+'</div>'+card(icon("rule")+"差勤異常待辦（依風險排序）","系統依 RULE-02 標記工時異常，逐筆確認後可轉入薪資關帳",'<div class="exc">'+ex+'</div>').replace('class="card"','class="card" style="margin-top:14px"')
