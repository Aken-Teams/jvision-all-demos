<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>人資薪假招募艙 · HRIS 人力資源系統</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --teal:#0f766e; --teal-2:#5eead4; --teal-d:#0b544e;
  --ink:#0f2320; --muted:#5b7370; --line:#e2ece9;
  --bg:#f2f7f6; --card:#ffffff; --soft:#eafaf6;
  --amber:#c2820b; --red:#c0392b; --blue:#2563eb; --grey:#8aa19d;
  --shadow:0 1px 2px rgba(15,118,110,.06),0 8px 24px rgba(15,118,110,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",sans-serif;
  background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; line-height:1.5;
}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;vertical-align:middle}
.shell{display:flex;min-height:100vh}
/* Sidebar */
.side{
  width:236px;flex:none;background:linear-gradient(180deg,#ffffff, #f7fbfa);
  border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:6px;
  position:sticky;top:0;height:100vh;overflow-y:auto;min-width:0;
}
.brand{display:flex;gap:11px;align-items:center;padding:6px 8px 16px}
.brand .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--teal),var(--teal-2));
  display:flex;align-items:center;justify-content:center;color:#fff;flex:none;box-shadow:0 6px 16px rgba(15,118,110,.28)}
.brand .logo .material-symbols-outlined{font-size:24px}
.brand b{font-size:15px;font-weight:900;letter-spacing:.3px;display:block;color:var(--ink)}
.brand span{font-size:11px;color:var(--muted);font-weight:500}
.navwrap{display:flex;flex-direction:column;gap:4px}
.navlbl{font-size:10.5px;font-weight:700;color:var(--grey);letter-spacing:1px;padding:8px 10px 4px;text-transform:uppercase}
.nav{
  display:flex;align-items:center;gap:11px;padding:10px 11px;border:none;background:transparent;
  border-radius:11px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--muted);
  text-align:left;width:100%;min-width:0;transition:.16s;flex:none;white-space:nowrap;
}
.nav .material-symbols-outlined{font-size:21px;flex:none}
.nav small{display:block;font-size:11px;font-weight:500;color:var(--grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .txt{min-width:0;overflow:hidden}
.nav:hover{background:var(--soft);color:var(--teal-d)}
.nav.on{background:linear-gradient(135deg,var(--teal),var(--teal-d));color:#fff;box-shadow:0 6px 16px rgba(15,118,110,.26)}
.nav.on small{color:rgba(255,255,255,.82)}
.side .foot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid var(--line);font-size:11px;color:var(--grey)}
.side .foot b{color:var(--teal-d);font-weight:700}
/* Main */
.main{flex:1;min-width:0;padding:22px 26px 44px;max-width:100%}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.top h1{font-size:21px;font-weight:900;margin:0 0 3px;letter-spacing:.4px}
.top .sub{font-size:13px;color:var(--muted)}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--soft);color:var(--teal-d);
  border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700}
.chip .material-symbols-outlined{font-size:16px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
/* generic */
.grid{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:1.6fr 1fr}
.g32{grid-template-columns:1fr 1.5fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 2px;font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--teal)}
.card .cap{font-size:11.5px;color:var(--muted);margin-bottom:12px}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .lbl .material-symbols-outlined{font-size:17px;color:var(--teal)}
.kpi .val{font-size:27px;font-weight:900;letter-spacing:.3px;margin-top:6px;line-height:1}
.kpi .val small{font-size:13px;font-weight:700;color:var(--muted)}
.kpi .dv{font-size:11.5px;font-weight:700;margin-top:7px;display:inline-flex;align-items:center;gap:3px}
.dv.up{color:var(--teal)} .dv.dn{color:var(--red)} .dv.fl{color:var(--muted)}
.dv .material-symbols-outlined{font-size:15px}
.bar{height:7px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:10px}
.bar>span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--teal),var(--teal-2))}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:0}
th{text-align:left;font-size:11px;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.4px}
td{padding:9px 10px;border-bottom:1px solid #f0f5f4;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--soft)}
.tg{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.tg .material-symbols-outlined{font-size:14px}
.t-ok{background:#e2f6ee;color:#0d7a52} .t-warn{background:#fcefd6;color:#a8710a}
.t-bad{background:#fbe4e0;color:#b23528} .t-info{background:#e2ebfb;color:#2350c0}
.t-mut{background:#eef2f1;color:#5b7370} .t-teal{background:var(--soft);color:var(--teal-d)}
.who{display:flex;align-items:center;gap:9px;min-width:0}
.ava{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:#fff}
.who b{font-size:12.5px;font-weight:700;display:block}
.who small{font-size:10.5px;color:var(--muted)}
.canvas-wrap{position:relative;width:100%}
.h180{height:180px} .h200{height:200px} .h220{height:220px} .h240{height:240px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
/* scheduling board */
.board{overflow-x:auto}
.rota{width:100%;border-collapse:separate;border-spacing:6px;min-width:640px}
.rota th{background:transparent;border:none;text-align:center;font-size:11px;padding:4px}
.rota td{border:none;padding:0}
.shcell{border-radius:10px;padding:8px 8px;text-align:center;font-size:11px;font-weight:700;min-height:52px;
  display:flex;flex-direction:column;justify-content:center;gap:2px;border:1px solid transparent}
.sh-m{background:#e2f6ee;color:#0d6a4b;border-color:#c6ebdb}
.sh-e{background:#e7effc;color:#2350c0;border-color:#cfe0fb}
.sh-n{background:#ecebf7;color:#5b46b0;border-color:#dcdaf0}
.sh-o{background:#f6f8f7;color:#9aaba8;border-color:#eef2f1}
.sh-gap{background:#fbe4e0;color:#b23528;border-color:#f3c9c2}
.shcell small{font-weight:600;opacity:.8}
.rota .rlbl{text-align:left;font-size:12px;font-weight:700;padding-left:2px;white-space:nowrap}
/* funnel */
.funnel{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.frow{display:flex;align-items:center;gap:12px}
.fbar{flex:1;height:38px;border-radius:10px;display:flex;align-items:center;padding:0 14px;color:#fff;font-weight:800;font-size:13px;min-width:0}
.frow .fmeta{width:74px;flex:none;text-align:right;font-size:12px}
.frow .fmeta b{font-size:15px;display:block;font-weight:900}
.frow .fmeta small{color:var(--muted);font-size:10.5px}
/* timeline */
.tl{position:relative;margin-left:8px;padding-left:20px}
.tl:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tli{position:relative;padding:0 0 16px}
.tli:last-child{padding-bottom:0}
.tli .nd{position:absolute;left:-19px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--teal)}
.tli.done .nd{background:var(--teal)}
.tli.now .nd{border-color:var(--amber);box-shadow:0 0 0 4px rgba(194,130,11,.14)}
.tli h4{margin:0;font-size:13px;font-weight:800}
.tli p{margin:2px 0 0;font-size:11.5px;color:var(--muted)}
.tli .tm{font-size:10.5px;color:var(--grey);font-weight:700}
/* 9-box matrix */
.matrix{display:grid;grid-template-columns:auto repeat(3,1fr);grid-template-rows:auto repeat(3,1fr);gap:6px;min-width:520px}
.mx-cell{border-radius:12px;padding:9px;min-height:74px;position:relative;font-size:11px}
.mx-ax{display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;color:var(--muted)}
.mx-ax.v{writing-mode:vertical-rl;transform:rotate(180deg)}
.mx-1{background:#fbe9e6} .mx-2{background:#fdf2df} .mx-3{background:#e6f6ee}
.mx-cell b{font-size:10.5px;color:var(--muted);font-weight:700;display:block;margin-bottom:5px}
.mchip{display:inline-flex;align-items:center;gap:4px;background:#fff;border-radius:7px;padding:2px 7px;margin:2px 3px 0 0;font-size:10.5px;font-weight:700;box-shadow:0 1px 3px rgba(15,35,32,.08)}
.mchip .d{width:7px;height:7px;border-radius:50%;flex:none}
/* attendance exceptions list */
.exc{display:flex;flex-direction:column;gap:9px}
.excr{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;min-width:0}
.excr .ic{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.excr .ic .material-symbols-outlined{font-size:19px}
.excr .body{flex:1;min-width:0}
.excr .body b{font-size:13px;font-weight:700}
.excr .body p{margin:1px 0 0;font-size:11.5px;color:var(--muted)}
.excr .act{flex:none;font-size:11.5px;font-weight:700}
/* payslip */
.slip{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.slip .sh{background:linear-gradient(135deg,var(--teal),var(--teal-d));color:#fff;padding:14px 16px}
.slip .sh b{font-size:15px;font-weight:800} .slip .sh small{opacity:.85;font-size:11.5px;display:block;margin-top:2px}
.slip .row{display:flex;justify-content:space-between;padding:9px 16px;font-size:12.5px;border-bottom:1px solid #f0f5f4}
.slip .row.neg span:last-child{color:var(--red)}
.slip .row.tot{background:var(--soft);font-weight:900;font-size:15px;border-bottom:none;color:var(--teal-d)}
.slip .row .material-symbols-outlined{font-size:16px;color:var(--teal);margin-right:6px}
.mini{font-size:11px;color:var(--muted);font-weight:600}
.progress-list{display:flex;flex-direction:column;gap:13px}
.pl-row .top{display:flex;justify-content:space-between;margin-bottom:6px;font-size:12.5px;font-weight:700;gap:8px}
.pl-row .top span:last-child{color:var(--muted);font-weight:600;font-size:11.5px;white-space:nowrap}
.badge-rank{width:24px;height:24px;border-radius:8px;background:var(--soft);color:var(--teal-d);display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;flex:none}
/* cert cards */
.certgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.certc{border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff;min-width:0}
.certc .cn{font-size:13px;font-weight:800;display:flex;align-items:center;gap:7px}
.certc .cn .material-symbols-outlined{font-size:18px;color:var(--teal)}
.certc .meta{font-size:11px;color:var(--muted);margin:8px 0 9px}
.hidden{display:none}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,1fr)}.certgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .certgrid{grid-template-columns:1fr}
}
/* sidebar collapse to top nav */
@media(max-width:860px){
  .shell{flex-direction:column}
  .side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;
    border-right:none;border-bottom:1px solid var(--line);padding:12px 14px;gap:8px}
  .brand{padding:0 10px 0 2px;width:100%}
  .navlbl{display:none}
  .navwrap{flex-direction:row;flex-wrap:wrap;gap:8px;width:100%}
  .nav{width:auto;padding:9px 13px}
  .nav small{display:none}
  .side .foot{display:none}
  .main{padding:18px 16px 40px}
}
@media(max-width:560px){
  .nav .txt{display:none}
  .nav{padding:10px}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">badge</span></div>
      <div><b>人資薪假招募艙</b><span>HRIS · 人力資源全流程</span></div>
    </div>
    <div class="navlbl">功能模組</div>
    <div class="navwrap" id="nav"></div>
    <div class="foot">純 UI 展示 · 擬真資料<br/><b>v2026.08</b> 演示版</div>
  </aside>
  <main class="main">
    <div class="top">
      <div>
        <h1 id="scrTitle">出勤差勤</h1>
        <div class="sub" id="scrSub">打卡、請假與加班時數統計</div>
      </div>
      <div class="pills">
        <span class="chip"><span class="material-symbols-outlined">domain</span>杰視科技 · 全體 328 人</span>
        <span class="chip"><span class="material-symbols-outlined">event</span>2026 年 8 月</span>
      </div>
    </div>
    <div id="screen"></div>
  </main>
</div>

<script>
"use strict";
var MODS=[
  {icon:"fingerprint",name:"出勤差勤",desc:"打卡、請假與加班時數統計"},
  {icon:"payments",name:"薪資計算",desc:"薪資、勞健保與所得稅計算"},
  {icon:"calendar_month",name:"排班管理",desc:"智慧排班與最低人力控管"},
  {icon:"person_search",name:"招募任用",desc:"職缺、面試漏斗與報到"},
  {icon:"school",name:"教育訓練",desc:"課程進度與證照到期追蹤"},
  {icon:"workspace_premium",name:"績效考核",desc:"目標設定與九宮格盤點"}
];
var C={teal:"#0f766e",teal2:"#5eead4",teald:"#0b544e",amber:"#c2820b",red:"#c0392b",blue:"#2563eb",mut:"#8aa19d",line:"#e2ece9"};
var avaColors=["#0f766e","#2563eb","#a8710a","#7c5cbf","#b23528","#0d7a52","#c2820b"];
function ava(name,i){return '<span class="ava" style="background:'+avaColors[i%avaColors.length]+'">'+name.slice(0,1)+'</span>';}

/* ---------- build nav ---------- */
(function(){
  var h="";
  for(var i=0;i<MODS.length;i++){
    h+='<button class="nav" data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span>'+
       '<span class="txt"><span>'+MODS[i].name+'</span><small>'+MODS[i].desc+'</small></span></button>';
  }
  document.getElementById("nav").innerHTML=h;
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){
    btns[k].addEventListener("click",function(){show(+this.getAttribute("data-i"));});
  }
})();

var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function mkChart(id,cfg){var el=document.getElementById(id);if(!el)return;charts.push(new Chart(el,cfg));}
Chart.defaults.font.family="Inter, 'Noto Sans TC', sans-serif";
Chart.defaults.font.size=11;
Chart.defaults.color="#5b7370";
Chart.defaults.plugins.legend.display=false;

function kpiCard(k){
  var icon=k.dc==="up"?"trending_up":k.dc==="dn"?"trending_down":"trending_flat";
  return '<div class="card kpi"><div class="lbl"><span class="material-symbols-outlined">'+k.ic+'</span>'+k.l+'</div>'+
    '<div class="val">'+k.v+' <small>'+k.u+'</small></div>'+
    '<div class="dv '+k.dc+'"><span class="material-symbols-outlined">'+icon+'</span>'+k.d+'</div>'+
    (k.p!=null?'<div class="bar"><span style="width:'+k.p+'%"></span></div>':'')+'</div>';
}
function kpiRow(arr){var h="";for(var i=0;i<arr.length;i++)h+=kpiCard(arr[i]);return '<div class="grid g4">'+h+'</div>';}

/* ================= SCREEN 0 : 出勤差勤 ================= */
function s0(){
  var kpis=[
    {ic:"how_to_reg",l:"今日出勤率",v:"96.8",u:"%",d:"+1.2pt",dc:"up",p:97},
    {ic:"schedule",l:"待確認加班",v:"14",u:"筆",d:"含 3 筆逾 12hr",dc:"dn",p:40},
    {ic:"event_busy",l:"今日請假",v:"22",u:"人",d:"特休 13・病假 6",dc:"fl",p:55},
    {ic:"error",l:"缺卡/異常",v:"7",u:"筆",d:"需人資補登",dc:"dn",p:25}
  ];
  var exc=[
    {ic:"schedule",bg:C.red,t:"李盈慧 · 研發部",p:"8/12 單日工時 13.5hr，超過 12hr 上限（RULE-02）",act:'<span class="tg t-bad">待主管確認</span>'},
    {ic:"fingerprint",bg:C.amber,t:"王建豪 · 業務部",p:"8/12 下班未打卡，系統推估 18:42 離場",act:'<span class="tg t-warn">補登中</span>'},
    {ic:"event_busy",bg:C.blue,t:"陳思妤 · 客服部",p:"8/13 病假未附證明，剩餘特休 3.5 天",act:'<span class="tg t-info">待附件</span>'},
    {ic:"nights_stay",bg:"#7c5cbf",t:"周家安 · 生產一課",p:"連續 6 日夜班，建議安排輪替",act:'<span class="tg t-mut">提醒</span>'},
    {ic:"check_circle",bg:C.teal,t:"林彥廷 · 研發部",p:"8/11 加班 2.0hr 已核准並轉入補休",act:'<span class="tg t-ok">已核准</span>'}
  ];
  var eh="";
  for(var j=0;j<exc.length;j++){var e=exc[j];
    eh+='<div class="excr"><div class="ic" style="background:'+e.bg+'"><span class="material-symbols-outlined">'+e.ic+'</span></div>'+
        '<div class="body"><b>'+e.t+'</b><p>'+e.p+'</p></div><div class="act">'+e.act+'</div></div>';
  }
  return kpiRow(kpis)+
    '<div class="grid g23" style="margin-top:14px">'+
      '<div class="card"><h3><span class="material-symbols-outlined">bar_chart</span>近 14 日出勤與異常趨勢</h3>'+
        '<div class="cap">綠：正常出勤人次　橘：異常/缺卡筆數</div>'+
        '<div class="canvas-wrap h240"><canvas id="c0a"></canvas></div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>本月請假類別占比</h3>'+
        '<div class="cap">合計 186 人日</div>'+
        '<div class="canvas-wrap h180"><canvas id="c0b"></canvas></div>'+
        '<div class="legend"><span><i class="dot" style="background:'+C.teal+'"></i>特休</span>'+
        '<span><i class="dot" style="background:'+C.blue+'"></i>病假</span>'+
        '<span><i class="dot" style="background:'+C.amber+'"></i>事假</span>'+

  var boxCls=["mx-2","mx-3","mx-3","mx-1","mx-2","mx-3","mx-1","mx-1","mx-2"];
  var boxTitle=["潛力型","高潛績優","明星人才","待觀察","中堅骨幹","績優穩定","待輔導","一般貢獻","待提升"];
  var boxPeople=[
    [{n:"洪郁婷",c:C.blue}],
    [{n:"蔡雅涵",c:C.teal},{n:"謝孟凡",c:C.amber}],
    [{n:"陳映辰",c:C.teal},{n:"黃俊霖",c:C.blue},{n:"王思穎",c:"#7c5cbf"}],
    [{n:"江秉諭",c:C.mut}],
    [{n:"劉宛蓉",c:C.amber},{n:"周于庭",c:C.teal}],
    [{n:"林孟潔",c:C.blue},{n:"許志豪",c:C.teal}],
    [{n:"曾泓宇",c:C.red}],
    [{n:"鄭博文",c:C.mut}],
    [{n:"吳庭安",c:C.amber}]
  ];
  var mh='<div class="matrix">';
  mh+='<div class="mx-ax"></div><div class="mx-ax">績效低</div><div class="mx-ax">績效中</div><div class="mx-ax">績效高</div>';
  for(var r=0;r<3;r++){
    var vlbl=r===0?"潛力高":r===1?"潛力中":"潛力低";
    mh+='<div class="mx-ax v">'+vlbl+'</div>';
    for(var col=0;col<3;col++){
      var idx=r*3+col;
      var pplH="";
      var ppl=boxPeople[idx];
      for(var m=0;m<ppl.length;m++)pplH+='<span class="mchip"><span class="d" style="background:'+ppl[m].c+'"></span>'+ppl[m].n+'</span>';
      mh+='<div class="mx-cell '+boxCls[idx]+'"><b>'+boxTitle[idx]+'</b>'+pplH+'</div>';
    }
  }
  mh+='</div>';
  return kpiRow(kpis)+
    '<div class="grid g23" style="margin-top:14px">'+
      '<div class="card"><h3><span class="material-symbols-outlined">grid_view</span>人才盤點九宮格</h3>'+
        '<div class="cap">橫軸：績效表現　縱軸：發展潛力（綠＝留任發展、黃＝關注、紅＝輔導）</div>'+
        '<div style="overflow-x:auto">'+mh+'</div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">radar</span>核心職能雷達</h3>'+
        '<div class="cap">研發部團隊平均 vs 職級標準</div>'+
        '<div class="canvas-wrap h240"><canvas id="c5a"></canvas></div></div>'+
    '</div>'+
    '<div class="grid g2" style="margin-top:14px">'+
      '<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>考核等第分布</h3>'+
        '<div class="cap">Q3 已完成評等 240 人</div>'+
        '<div class="canvas-wrap h200"><canvas id="c5b"></canvas></div>'+
        '<div class="legend"><span><i class="dot" style="background:'+C.teal+'"></i>S 卓越</span>'+
        '<span><i class="dot" style="background:'+C.teal2+'"></i>A 優良</span>'+
        '<span><i class="dot" style="background:'+C.amber+'"></i>B 達標</span>'+
        '<span><i class="dot" style="background:'+C.red+'"></i>C 待改善</span></div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">checklist</span>OKR 達成追蹤</h3>'+
        '<div class="cap">部門目標關鍵結果達成率</div>'+
        '<div class="progress-list" style="margin-top:2px">'+
          plRow(1,"研發部 · 交付效率",88)+plRow(2,"業務部 · 新客營收",79)+
          plRow(3,"客服部 · CSAT 滿意度",91)+plRow(4,"生產部 · 良率提升",83)+
          plRow(5,"人資部 · 到位天數",72)+
        '</div></div>'+
    '</div>';
}
function plRow(i,name,v){
  return '<div class="pl-row"><div class="top"><span><span class="badge-rank">'+i+'</span> '+name+'</span><span>'+v+'%</span></div>'+
    '<div class="bar"><span style="width:'+v+'%"></span></div></div>';
}
function s5charts(){
  mkChart("c5a",{type:"radar",data:{labels:["專業技術","溝通協作","問題解決","主動當責","創新思維","品質意識"],
    datasets:[
      {label:"團隊平均",data:[86,74,82,78,70,88],backgroundColor:"rgba(15,118,110,.18)",borderColor:C.teal,pointBackgroundColor:C.teal,borderWidth:2},
      {label:"職級標準",data:[80,80,80,80,75,80],backgroundColor:"rgba(94,234,212,.10)",borderColor:C.teal2,pointBackgroundColor:C.teal2,borderWidth:2}
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,position:"bottom"}},
      scales:{r:{beginAtZero:true,max:100,grid:{color:C.line},angleLines:{color:C.line},pointLabels:{font:{size:11}},ticks:{display:false}}}}});
  mkChart("c5b",{type:"doughnut",data:{labels:["S 卓越","A 優良","B 達標","C 待改善"],
    datasets:[{data:[28,96,109,7],backgroundColor:[C.teal,C.teal2,C.amber,C.red],borderWidth:2,borderColor:"#fff"}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:"62%"}});
}

/* ---------- render controller ---------- */
var RENDER=[s0,s1,s2,s3,s4,s5];
var AFTER=[s0charts,s1charts,s2charts,s3charts,s4charts,s5charts];
show(0);
function show(i){
  i=Math.max(0,Math.min(i,RENDER.length-1));
  killCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++)btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);
  document.getElementById("scrTitle").textContent=MODS[i].name;
  document.getElementById("scrSub").textContent=MODS[i].desc;
  var box=document.getElementById("screen");
  box.innerHTML=RENDER[i]();
  void box.offsetHeight;
  AFTER[i]();
}

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m)return;var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
