<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>入出庫作業管理 WMS｜Jvision 系統 Demo</title>
<meta name="description" content="收貨驗收、智慧上架、波次揀貨、出庫裝車、盤點對帳到安全庫存補料的倉內一體化管理（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --accent:#ea580c; --accent2:#fb923c; --accent-d:#c2410c;
    --ink:#1c1410; --body:#4a3f36; --muted:#8a7d70; --line:#eadfd4;
    --bg:#faf6f1; --card:#ffffff; --soft:#fdf0e6;
    --side:#241a13; --side2:#3a2a1e; --side-mut:#b8a08e;
    --green:#16a34a; --gr-bg:#dcfce7; --amber:#d97706; --am-bg:#fef3c7;
    --blue:#2563eb; --bl-bg:#dbeafe; --red:#dc2626; --rd-bg:#fee2e2;
    --violet:#7c3aed; --vi-bg:#ede9fe; --teal:#0d9488; --te-bg:#ccfbf1;
  }
  *{ box-sizing:border-box; } html,body{ margin:0; }
  body{ font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--body); -webkit-font-smoothing:antialiased; }
  .material-symbols-outlined{ font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; line-height:1; }
  /* ===== shell ===== */
  .shell{ display:flex; min-height:100vh; align-items:stretch; }
  .shell>*{ min-width:0; }
  .side{ width:236px; flex:none; background:linear-gradient(180deg,var(--side),var(--side2)); color:#fff; display:flex; flex-direction:column; min-width:0; position:sticky; top:0; height:100vh; }
  .brand{ display:flex; align-items:center; gap:11px; padding:20px 18px 16px; }
  .brand .lg{ width:44px; height:44px; border-radius:13px; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; display:grid; place-content:center; box-shadow:0 6px 16px rgba(234,88,12,.4); flex:none; }
  .brand .lg .material-symbols-outlined{ font-size:26px; }
  .brand b{ display:block; font-size:15px; font-weight:900; letter-spacing:.02em; color:#fff; }
  .brand small{ display:block; font-size:11px; color:var(--side-mut); margin-top:2px; }
  .nav{ display:flex; flex-direction:column; gap:4px; padding:6px 12px; flex:1; min-width:0; }
  .nav .lbl{ font-size:10px; font-weight:800; color:var(--side-mut); letter-spacing:.14em; padding:12px 10px 5px; text-transform:uppercase; }
  .nav button{ display:flex; align-items:center; gap:11px; border:0; background:transparent; color:var(--side-mut); font:inherit; font-size:13.5px; font-weight:700; padding:10px 12px; border-radius:11px; cursor:pointer; transition:.15s; white-space:nowrap; text-align:left; flex:none; }
  .nav button .material-symbols-outlined{ font-size:21px; flex:none; }
  .nav button .num{ margin-left:auto; font-size:10px; font-weight:900; background:rgba(255,255,255,.1); border-radius:999px; padding:1px 7px; min-width:20px; text-align:center; }
  .nav button:hover{ background:rgba(255,255,255,.07); color:#fff; }
  .nav button.on{ background:linear-gradient(120deg,var(--accent),var(--accent2)); color:#fff; box-shadow:0 6px 16px rgba(234,88,12,.35); }
  .nav button.on .num{ background:rgba(255,255,255,.25); }
  .side-f{ padding:14px 16px; border-top:1px solid rgba(255,255,255,.08); display:flex; align-items:center; gap:10px; }
  .side-f .ava{ width:36px; height:36px; border-radius:11px; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; font-weight:900; display:grid; place-content:center; font-size:14px; flex:none; }
  .side-f .who b{ display:block; font-size:13px; color:#fff; font-weight:800; }
  .side-f .who small{ display:block; font-size:11px; color:var(--side-mut); }
  /* ===== main ===== */
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .top{ display:flex; align-items:center; gap:14px; padding:16px 26px; background:var(--card); border-bottom:1px solid var(--line); flex-wrap:wrap; position:sticky; top:0; z-index:15; }
  .top h1{ margin:0; font-size:19px; font-weight:900; color:var(--ink); }
  .top p{ margin:2px 0 0; font-size:12.5px; color:var(--muted); }
  .top .sp{ margin-left:auto; display:flex; gap:9px; flex-wrap:wrap; align-items:center; }
  .npill{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:800; background:var(--soft); color:var(--accent-d); border-radius:999px; padding:6px 12px; white-space:nowrap; }
  .npill .material-symbols-outlined{ font-size:16px; }
  .npill .dot{ width:8px; height:8px; border-radius:50%; background:var(--green); animation:pulse 2s infinite; }
  @keyframes pulse{ 0%{ box-shadow:0 0 0 0 rgba(22,163,74,.55);} 70%{ box-shadow:0 0 0 8px rgba(22,163,74,0);} 100%{ box-shadow:0 0 0 0 rgba(22,163,74,0);} }
  .wrap{ padding:22px 26px 44px; min-width:0; }
  /* ===== headings/cards ===== */
  h3.sec{ margin:0 0 12px; font-size:15px; font-weight:900; color:var(--ink); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  h3.sec .material-symbols-outlined{ color:var(--accent); font-size:20px; }
  h3.sec .tag{ margin-left:auto; font-size:11px; font-weight:800; color:var(--muted); }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px 20px; }
  .grid{ display:grid; gap:18px; } .grid>*{ min-width:0; }
  .g2{ grid-template-columns:1.5fr 1fr; } .g2e{ grid-template-columns:1fr 1fr; } .g3{ grid-template-columns:1fr 1fr 1fr; }
  @media(max-width:820px){ .g2,.g2e,.g3{ grid-template-columns:1fr; } }
  /* ===== KPI ===== */
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(184px,1fr)); gap:14px; margin-bottom:18px; }
  .kpis>*{ min-width:0; }
  .kpi{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:15px 17px; position:relative; overflow:hidden; }
  .kpi::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:linear-gradient(var(--accent),var(--accent2)); }
  .kpi .l{ font-size:12px; font-weight:800; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .kpi .l .material-symbols-outlined{ font-size:16px; color:var(--accent); }
  .kpi .v{ font-size:25px; font-weight:900; color:var(--ink); margin-top:6px; } .kpi .v small{ font-size:13px; color:var(--muted); font-weight:700; }
  .kpi .d{ font-size:12px; font-weight:800; margin-top:3px; } .kpi .d.up{ color:var(--green); } .kpi .d.dn{ color:var(--red); } .kpi .d.fl{ color:var(--accent); }
  /* ===== charts ===== */
  .chartbox{ position:relative; width:100%; }
  .chartbox.h220{ height:220px; } .chartbox.h240{ height:240px; } .chartbox.h260{ height:260px; } .chartbox.h280{ height:280px; }
  /* ===== table ===== */
  .tblwrap{ overflow-x:auto; }
  table.tbl{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:560px; }
  table.tbl th{ text-align:left; font-size:11px; font-weight:800; color:var(--muted); padding:9px 11px; border-bottom:2px solid var(--line); white-space:nowrap; }
  table.tbl td{ padding:10px 11px; border-bottom:1px solid var(--line); color:var(--body); vertical-align:middle; }
  table.tbl tr:last-child td{ border-bottom:0; }
  table.tbl tr:hover td{ background:var(--soft); }
  table.tbl b{ color:var(--ink); }
  .pill{ display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:800; border-radius:999px; padding:2px 9px; white-space:nowrap; }
  .pill .material-symbols-outlined{ font-size:13px; }
  .p-g{ background:var(--gr-bg); color:#15803d; } .p-a{ background:var(--am-bg); color:#b45309; } .p-b{ background:var(--bl-bg); color:#1d4ed8; }
  .p-r{ background:var(--rd-bg); color:#b91c1c; } .p-v{ background:var(--vi-bg); color:#6d28d9; } .p-t{ background:var(--te-bg); color:#0f766e; } .p-m{ background:#f1f5f9; color:#475569; }
  .bar{ height:8px; border-radius:999px; background:var(--line); overflow:hidden; min-width:60px; } .bar span{ display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,var(--accent),var(--accent2)); }
  /* ===== receiving board (v0) ===== */
  .board-wrap{ overflow-x:auto; padding-bottom:6px; }
  .board{ display:grid; grid-template-columns:repeat(4,minmax(228px,1fr)); gap:13px; }
  .bcol{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; display:flex; flex-direction:column; gap:10px; min-width:0; }
  .bcol-h{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:900; color:var(--ink); padding:2px 2px 10px; border-bottom:2px solid var(--line); }
  .bcol-h .material-symbols-outlined{ font-size:19px; color:var(--accent); }
  .bcol-h .n{ margin-left:auto; font-size:12px; font-weight:900; color:#fff; border-radius:999px; padding:1px 10px; background:var(--accent); }
  .bcol.s1 .bcol-h{ border-color:#93c5fd; } .bcol.s1 .bcol-h .material-symbols-outlined{ color:var(--blue); } .bcol.s1 .bcol-h .n{ background:var(--blue); }
  .bcol.s2 .bcol-h{ border-color:#fcd34d; } .bcol.s2 .bcol-h .material-symbols-outlined{ color:var(--amber); } .bcol.s2 .bcol-h .n{ background:var(--amber); }
  .bcol.s3 .bcol-h{ border-color:#86efac; } .bcol.s3 .bcol-h .material-symbols-outlined{ color:var(--green); } .bcol.s3 .bcol-h .n{ background:var(--green); }
  .gc{ border:1px solid var(--line); border-radius:13px; padding:11px 12px; background:#fff; border-left:5px solid var(--accent); }
  .gc.s1{ border-left-color:var(--blue); } .gc.s2{ border-left-color:var(--amber); } .gc.s3{ border-left-color:var(--green); }
  .gc.warn{ background:#fff8f4; border-left-color:var(--red); animation:beat 2s ease-in-out infinite; }
  @keyframes beat{ 0%,100%{ box-shadow:0 0 0 0 rgba(220,38,38,0);} 50%{ box-shadow:0 0 0 4px rgba(220,38,38,.08);} }
  .gc-h{ display:flex; align-items:center; gap:7px; margin-bottom:7px; flex-wrap:wrap; }
  .gc-h .no{ font-size:13px; font-weight:900; color:var(--ink); }
  .gc .sup{ font-size:12px; color:var(--body); font-weight:700; margin-bottom:6px; display:flex; align-items:center; gap:5px; }
  .gc .sup .material-symbols-outlined{ font-size:14px; color:var(--muted); }
  .gc .gl{ display:flex; flex-wrap:wrap; gap:5px; }
  .gtag{ font-size:11px; font-weight:800; border-radius:8px; padding:2px 8px; background:var(--soft); color:var(--accent-d); display:inline-flex; align-items:center; gap:3px; }
  .gtag .material-symbols-outlined{ font-size:13px; }
  .gtag.qty{ background:var(--bl-bg); color:#1d4ed8; } .gtag.warn{ background:var(--rd-bg); color:#b91c1c; }
  /* ===== storage matrix (v1) ===== */
  .rackwrap{ overflow-x:auto; }
  .rack{ display:grid; gap:9px; min-width:560px; }
  .rack-row{ display:grid; grid-template-columns:64px repeat(10,1fr); gap:6px; align-items:center; }
  .rack-row .rl{ font-size:12px; font-weight:900; color:var(--ink); }
  .cell{ height:40px; border-radius:8px; display:grid; place-content:center; font-size:10px; font-weight:800; color:#fff; position:relative; }
  .cell.lv0{ background:#f1f5f9; color:#94a3b8; } .cell.lv1{ background:#bfdbfe; color:#1e3a8a; } .cell.lv2{ background:#7dd3fc; color:#0c4a6e; }
  .cell.lv3{ background:var(--accent2); } .cell.lv4{ background:var(--accent); } .cell.lv5{ background:var(--red); animation:beat 2s infinite; }
  .legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; font-weight:700; color:var(--body); margin-top:12px; }
  .legend span{ display:inline-flex; align-items:center; gap:6px; } .legend i{ width:14px; height:14px; border-radius:4px; display:inline-block; }
  /* ===== reco list (v1) ===== */
  .reco{ display:flex; flex-direction:column; gap:9px; }
  .rrow{ display:flex; align-items:center; gap:11px; padding:11px 13px; border:1px solid var(--line); border-radius:13px; background:#fff; flex-wrap:wrap; }
  .rrow .rk{ width:40px; height:40px; border-radius:11px; background:var(--soft); color:var(--accent-d); font-weight:900; display:grid; place-content:center; flex:none; font-size:13px; }
  .rrow .info{ flex:1; min-width:130px; } .rrow .info b{ color:var(--ink); font-size:13px; } .rrow .info small{ display:block; color:var(--muted); font-size:11px; margin-top:2px; }
  /* ===== progress rings / wave (v2) ===== */
  .wave{ display:flex; align-items:center; gap:14px; padding:13px 15px; border:1px solid var(--line); border-radius:14px; background:#fff; flex-wrap:wrap; margin-bottom:11px; }
  .wave .ring{ width:56px; height:56px; border-radius:50%; flex:none; display:grid; place-content:center; position:relative; }
  .wave .ring::after{ content:""; position:absolute; inset:6px; border-radius:50%; background:#fff; }
  .wave .ring b{ position:relative; z-index:1; font-size:13px; font-weight:900; color:var(--ink); }
  .wave .wi{ flex:1; min-width:150px; } .wave .wi b{ color:var(--ink); font-size:14px; } .wave .wi small{ display:block; color:var(--muted); font-size:11.5px; margin-top:2px; }
  .wave .wm{ display:flex; gap:8px; flex-wrap:wrap; }
  .mchip{ font-size:11px; font-weight:800; border-radius:9px; padding:4px 9px; background:var(--soft); color:var(--accent-d); display:inline-flex; align-items:center; gap:4px; }
  .mchip .material-symbols-outlined{ font-size:14px; }
  /* ===== loading dock (v3) ===== */
  .dock{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:13px; }
  .dock>*{ min-width:0; }
  .dcard{ border:1px solid var(--line); border-radius:15px; padding:14px; background:#fff; border-top:4px solid var(--accent); }
  .dcard.busy{ border-top-color:var(--amber); } .dcard.done{ border-top-color:var(--green); } .dcard.free{ border-top-color:#cbd5e1; }
  .dcard .dh{ display:flex; align-items:center; gap:8px; margin-bottom:9px; }
  .dcard .dh .dn{ font-size:15px; font-weight:900; color:var(--ink); } .dcard .dh .material-symbols-outlined{ color:var(--accent); font-size:22px; }
  .dcard .truck{ font-size:12.5px; font-weight:800; color:var(--body); display:flex; align-items:center; gap:6px; margin-bottom:8px; }
  .dcard .truck .material-symbols-outlined{ font-size:16px; color:var(--muted); }
  .dcard .prog{ font-size:11px; color:var(--muted); font-weight:700; margin-top:8px; display:flex; justify-content:space-between; gap:8px; }
  /* ===== timeline (v3) ===== */
  .tl{ position:relative; padding-left:24px; }
  .tl::before{ content:""; position:absolute; left:8px; top:4px; bottom:4px; width:2px; background:var(--line); }
  .tli{ position:relative; padding:0 0 16px; }
  .tli::before{ content:""; position:absolute; left:-20px; top:3px; width:12px; height:12px; border-radius:50%; background:var(--accent); border:2px solid #fff; box-shadow:0 0 0 2px var(--accent2); }
  .tli.done::before{ background:var(--green); box-shadow:0 0 0 2px #86efac; }
  .tli b{ font-size:13px; font-weight:900; color:var(--ink); } .tli .tm{ font-size:11px; color:var(--muted); font-weight:700; }
  .tli p{ margin:3px 0 0; font-size:12px; color:var(--body); }
  /* ===== count variance (v4) ===== */
  .vgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; }
  .vgrid>*{ min-width:0; }
  .vc{ border:1px solid var(--line); border-radius:14px; padding:14px; background:#fff; text-align:center; }
  .vc .vn{ font-size:24px; font-weight:900; margin-top:4px; } .vc .vl{ font-size:11.5px; font-weight:800; color:var(--muted); }
  .vc.ok .vn{ color:var(--green); } .vc.warn .vn{ color:var(--amber); } .vc.bad .vn{ color:var(--red); } .vc.info .vn{ color:var(--blue); }
  /* ===== replenish list (v5) ===== */
  .stk{ display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--line); border-radius:14px; background:#fff; flex-wrap:wrap; margin-bottom:10px; }
  .stk .si{ flex:1; min-width:150px; } .stk .si b{ color:var(--ink); font-size:13.5px; } .stk .si small{ display:block; color:var(--muted); font-size:11.5px; margin-top:2px; }
  .gauge{ flex:1; min-width:160px; }
  .gbar{ height:14px; border-radius:999px; background:var(--line); overflow:hidden; position:relative; }
  .gbar span{ display:block; height:100%; border-radius:999px; }
  .gbar .safe{ position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink); }
  .stk .snum{ text-align:right; min-width:100px; font-size:11px; font-weight:700; color:var(--muted); }
  .stk .snum b{ color:var(--ink); font-size:15px; display:block; }
  .btn{ display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 13px; border-radius:10px; border:0; background:var(--accent); color:#fff; font:inherit; font-weight:800; font-size:12.5px; cursor:pointer; }
  .btn:hover{ background:var(--accent-d); } .btn.ghost{ background:#fff; color:var(--accent); border:1px solid var(--line); } .btn.ghost:hover{ background:var(--soft); }
  .btn .material-symbols-outlined{ font-size:17px; }
  /* ===== responsive sidebar collapse ===== */
  @media(max-width:860px){
    .shell{ flex-direction:column; }
    .side{ width:auto; height:auto; position:sticky; top:0; z-index:20; flex-direction:row; align-items:center; flex-wrap:wrap; gap:6px; padding:10px 14px; }
    .brand{ padding:0; margin-right:6px; }
    .nav{ flex-direction:row; flex-wrap:wrap; padding:0; gap:6px; flex:1; }
    .nav .lbl{ display:none; }
    .nav button{ padding:8px 11px; }
    .nav button .num{ display:none; }
    .side-f{ border-top:0; padding:0; }
    .side-f .who{ display:none; }
  }
  @media(max-width:560px){
    .nav button .tx{ display:none; }
    .nav button{ padding:9px; }
    .top{ padding:13px 16px; } .wrap{ padding:18px 16px 36px; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="lg"><span class="material-symbols-outlined">warehouse</span></div>
      <div><b>入出庫 WMS</b><small>倉儲作業管理平台</small></div>
    </div>
    <nav class="nav" id="nav">
      <div class="lbl">倉內作業</div>
    </nav>
    <div class="side-f">
      <div class="ava">陳</div>
      <div class="who"><b>陳志明</b><small>倉儲主管 · A 倉</small></div>
    </div>
  </aside>
  <main class="main">
    <div class="top">
      <div>
        <h1 id="t-title">收貨驗收</h1>
        <p id="t-sub">到貨預約、點收與品檢入庫</p>
      </div>
      <div class="sp">
        <span class="npill"><span class="dot"></span>即時同步 ERP / MES</span>
        <span class="npill"><span class="material-symbols-outlined">calendar_today</span>2026/08/13</span>
      </div>
    </div>
    <div class="wrap" id="view"></div>
  </main>
</div>
<script>
var NAV=[
  ["call_received","收貨驗收","到貨預約、點收與品檢入庫"],
  ["shelf_position","智慧上架","儲位推薦與庫容熱區配置"],
  ["checklist","波次揀貨","訂單合併波次與揀貨路徑"],
  ["local_shipping","出庫裝車","出貨覆核、打包與月台調度"],
  ["fact_check","盤點對帳","循環盤點與帳實差異調整"],
  ["autorenew","補料拉動","安全庫存監控與自動補貨"]
];
var NUM=["9","5","7","4","6","5"];

function kpi(l,ic,v,u,d,cls){ return '<div class="kpi"><div class="l"><span class="material-symbols-outlined">'+ic+'</span>'+l+'</div><div class="v">'+v+(u?' <small>'+u+'</small>':'')+'</div><div class="d '+cls+'">'+d+'</div></div>'; }

/* ============ SCREEN 0 : 收貨驗收 ============ */
var RECV={

  var trs=rows.map(function(r){ return '<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td><td><span class="pill '+r[5]+'">'+r[4]+'</span></td></tr>'; }).join('');

    +'<div class="card" style="margin-bottom:18px"><h3 class="sec"><span class="material-symbols-outlined">speed</span>安全庫存水位監控 <span class="tag">| 為安全庫存線</span></h3>'+sk+'</div>'

}

/* ============ charts ============ */

function baseOpts(extra){
  var o={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{family:"Inter",size:11},color:TICK,usePointStyle:true,pointStyleWidth:9}}},scales:{x:{grid:{display:false},ticks:{color:TICK,font:{size:10}}},y:{grid:{color:GRID},ticks:{color:TICK,font:{size:10}},beginAtZero:true}}};
  if(extra){ for(var kk in extra){ o[kk]=extra[kk]; } }
  return o;
}

    charts.push(new Chart(el,{type:"doughnut",data:{labels:["電子料","五金件","塑料/化工","包材"],datasets:[{data:[42,26,20,12],backgroundColor:[ORANGE,ORANGE2,"#2563eb","#0d9488"],borderWidth:2,borderColor:"#fff"}]},options:{responsive:true,maintainAspectRatio:false,cutout:"58%",plugins:{legend:{position:"right",labels:{color:TICK,font:{size:11},usePointStyle:true,pointStyleWidth:9}}}}}));
  }

  }
  if(i===3 && (el=document.getElementById("c3a"))){
    charts.push(new Chart(el,{type:"line",data:{labels:["8/07","8/08","8/09","8/10","8/11","8/12","8/13"],datasets:[{label:"準時出貨率 %",data:[93.1,94.2,95.0,95.8,94.6,96.1,96.4],borderColor:ORANGE,backgroundColor:"rgba(234,88,12,.12)",fill:true,tension:.4,pointRadius:3,pointBackgroundColor:ORANGE,borderWidth:2.5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{color:TICK,font:{size:10}}},y:{grid:{color:GRID},ticks:{color:TICK,font:{size:10}},min:90,max:100}}}}));
  }
  if(i===4){
    if(el=document.getElementById("c4a")){
      charts.push(new Chart(el,{type:"bar",data:{labels:["電子料","五金件","塑料","化工","包材"],datasets:[{label:"短少",data:[-18,-4,0,-16,0],backgroundColor:"#dc2626",borderRadius:5,maxBarThickness:34},{label:"溢收",data:[0,15,0,0,0],backgroundColor:"#2563eb",borderRadius:5,maxBarThickness:34}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:TICK,font:{size:11},usePointStyle:true,pointStyleWidth:9}}},scales:{x:{stacked:true,grid:{display:false},ticks:{color:TICK,font:{size:10}}},y:{stacked:true,grid:{color:GRID},ticks:{color:TICK,font:{size:10}}}}}}));
    }
    if(el=document.getElementById("c4b")){
      charts.push(new Chart(el,{type:"line",data:{labels:["第1週","第2週","第3週","第4週","第5週","第6週"],datasets:[{label:"帳實相符率 %",data:[84,87,89,92,94,97.3],borderColor:ORANGE,backgroundColor:"rgba(234,88,12,.12)",fill:true,tension:.4,pointRadius:3,pointBackgroundColor:ORANGE,borderWidth:2.5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{color:TICK,font:{size:10}}},y:{grid:{color:GRID},ticks:{color:TICK,font:{size:10}},min:80,max:100}}}}));
    }
  }
  if(i===5 && (el=document.getElementById("c5a"))){
    charts.push(new Chart(el,{type:"bar",data:{labels:["第1週","第2週","第3週","第4週","第5週","第6週"],datasets:[{label:"耗用量",data:[1200,1350,1180,1420,1310,1500],backgroundColor:ORANGE2,borderRadius:5,maxBarThickness:26},{label:"補入量",data:[1000,1400,1200,1300,1400,1350],backgroundColor:"#2563eb",borderRadius:5,maxBarThickness:26}]},options:baseOpts()}));

/* ============ nav + show ============ */
var navEl=document.getElementById("nav");
navEl.insertAdjacentHTML("beforeend",NAV.map(function(t,i){ return '<button data-i="'+i+'" class="'+(i===0?'on':'')+'"><span class="material-symbols-outlined">'+t[0]+'</span><span class="tx">'+t[1]+'</span><span class="num">'+NUM[i]+'</span></button>'; }).join(""));
var view=document.getElementById("view");
function show(i){
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  navEl.querySelectorAll("button[data-i]").forEach(function(b){ b.classList.toggle("on",b.dataset.i===String(i)); });
  document.getElementById("t-title").textContent=NAV[i][1];
  document.getElementById("t-sub").textContent=NAV[i][2];
  view.innerHTML=SCREENS[i]();
  void view.offsetHeight;
  draw(i);
}
navEl.addEventListener("click",function(e){ var b=e.target.closest("button[data-i]"); if(!b)return; show(+b.dataset.i); try{window.scrollTo(0,0);}catch(e){} });
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
