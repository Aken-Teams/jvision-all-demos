<style>
:root{

  --color-on-primary:#fff;
  --color-secondary:#475569;
  --color-on-secondary:#fff;
  --color-accent:#059669;

  --color-background:#f8fafc;
  --color-foreground:#0f172a;
  --color-card:#fff;
  --color-card-foreground:#0f172a;
  --color-muted:#f2f3f4;
  --color-muted-foreground:#475569;
  --color-border:#e6e8ea;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#334155;
  --blue:#2563eb;
  --ink:#0f172a;
  --muted:#475569;
  --line:#e6e8ea;
  --body:#334155;
  --bg:#f8fafc;
  --card:#fff;
  --soft:#f2f3f4;
  --accent:#059669;
  --accent2:#10b981;
  --accent-d:#047857;
  --side:#1e293b;
  --side2:#334155;
  --side-mut:#cbd5e1;
  --green:#047857;
  --gr-bg:#d1fae5;
  --amber:#b45309;
  --am-bg:#fef3c7;
  --bl-bg:#dbeafe;
  --red:#b91c1c;
  --rd-bg:#fee2e2;
  --violet:#6d28d9;
  --vi-bg:#ede9fe;
  --teal:#0f766e;
  --te-bg:#ccfbf1;
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:14px;

}
*{box-sizing:border-box}
html,body{margin:0;min-width:320px}
html{background:var(--color-background);scroll-behavior:smooth}
body{
  font-family:"Open Sans","Microsoft JhengHei",sans-serif;
  background:var(--color-background);
  color:var(--body);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font:inherit}
button,a,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;
  line-height:1;
}
.shell{display:flex;min-height:100vh;align-items:stretch}
.shell>*{min-width:0}
.side{
  width:244px;
  flex:none;
  position:sticky;
  top:0;
  height:100vh;
  z-index:20;
  display:flex;
  flex-direction:column;
  min-width:0;
  overflow:auto;
  color:var(--color-on-primary);
  background:var(--side);
  border-right:1px solid #475569;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-height:76px;
  padding:15px 18px;
  border-bottom:1px solid #475569;
}
.brand .lg{
  width:40px;
  height:40px;
  flex:none;
  display:grid;
  place-content:center;
  border-radius:var(--radius-md);
  color:#fff;
  background:var(--color-accent);
}
.brand .lg .material-symbols-outlined{font-size:24px}
.brand b{
  display:block;
  color:#fff;
  font-family:Poppins,"Open Sans",sans-serif;
  font-size:14px;
  font-weight:600;
  letter-spacing:.01em;
}
.brand small{display:block;margin-top:1px;color:var(--side-mut);font-size:11px}
.nav{display:flex;flex:1;flex-direction:column;gap:3px;min-width:0;padding:12px 10px}
.nav .lbl{
  padding:6px 10px 7px;
  color:#cbd5e1;
  font-size:10px;
  font-weight:700;
  letter-spacing:.13em;
  text-transform:uppercase;
}
.nav button{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:42px;
  width:100%;
  padding:9px 10px;
  border:1px solid transparent;
  border-radius:var(--radius-sm);
  background:transparent;
  color:#cbd5e1;
  font-size:13px;
  font-weight:600;
  text-align:left;
  white-space:nowrap;
  transition:background-color var(--transition),color var(--transition),border-color var(--transition);
}
.nav button .material-symbols-outlined{flex:none;font-size:20px}
.nav button .num{
  min-width:24px;
  margin-left:auto;
  padding:1px 6px;
  border:1px solid #64748b;
  border-radius:999px;
  color:#e2e8f0;
  font-family:Poppins,sans-serif;
  font-size:10px;
  font-weight:600;
  text-align:center;
}
.nav button:hover{background:#334155;color:#fff;border-color:#475569}
.nav button.on{
  color:#fff;
  background:var(--color-accent);
  border-color:#34d399;
}
.nav button.on .num{border-color:#a7f3d0;background:#047857;color:#fff}
.side-f{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 16px;
  border-top:1px solid #475569;
}
.side-f .ava{
  width:34px;
  height:34px;
  flex:none;
  display:grid;
  place-content:center;
  border:1px solid #94a3b8;
  border-radius:50%;
  background:#475569;
  color:#fff;
  font-size:13px;
  font-weight:700;
}
.side-f .who b{display:block;color:#fff;font-size:12px;font-weight:700}
.side-f .who small{display:block;color:#cbd5e1;font-size:10px}
.main{display:flex;flex:1;flex-direction:column;min-width:0}
.top{
  position:sticky;
  top:0;
  z-index:15;
  display:flex;
  align-items:center;
  gap:16px;
  min-height:76px;
  padding:13px 24px;
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(8px);
}
.top h1{
  margin:0;
  color:var(--ink);
  font-family:Poppins,"Open Sans",sans-serif;
  font-size:20px;
  font-weight:600;
  letter-spacing:-.02em;
}
.top p{margin:2px 0 0;color:var(--muted);font-size:12px}
.top .sp{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
.npill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:30px;
  padding:5px 10px;
  border:1px solid var(--line);
  border-radius:999px;
  background:#fff;
  color:var(--color-secondary);
  font-size:11px;
  font-weight:600;
  white-space:nowrap;
}
.npill .material-symbols-outlined{font-size:15px;color:var(--color-primary)}
.npill .dot{width:8px;height:8px;border:2px solid #a7f3d0;border-radius:50%;background:var(--color-accent);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
.wrap{min-width:0;padding:20px 24px 40px}
#view>*{animation:enter .4s cubic-bezier(.2,.8,.2,1) both}
#view>*:nth-child(2){animation-delay:60ms}
#view>*:nth-child(3){animation-delay:120ms}
#view>*:nth-child(4){animation-delay:180ms}
@keyframes enter{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
h3.sec{
  display:flex;
  align-items:center;
  gap:7px;
  margin:0 0 11px;
  color:var(--ink);
  font-family:Poppins,"Open Sans",sans-serif;
  font-size:14px;
  font-weight:600;
  letter-spacing:-.01em;
  flex-wrap:wrap;
}
h3.sec .material-symbols-outlined{color:var(--color-accent);font-size:19px}
h3.sec .tag{margin-left:auto;color:var(--muted);font-family:"Open Sans",sans-serif;font-size:10px;font-weight:600;letter-spacing:.02em}
.card{
  min-width:0;
  padding:16px 18px;
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  background:var(--card);
  color:var(--color-card-foreground);
  transition:border-color var(--transition),background-color var(--transition);
}
.card:hover{border-color:#cbd5e1}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.g2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{
  position:relative;
  min-width:0;
  overflow:hidden;
  padding:14px 15px 13px;
  border:1px solid var(--line);
  border-radius:var(--radius-md);

.kpi:hover{border-color:#94a3b8;background:#fdfefe}
.kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--color-accent)}
.kpi .l{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;font-weight:600}
.kpi .l .material-symbols-outlined{font-size:16px;color:var(--color-primary)}
.kpi .v{margin-top:5px;color:var(--ink);font-family:Poppins,"Open Sans",sans-serif;font-size:24px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .v small{color:var(--muted);font-family:"Open Sans",sans-serif;font-size:11px;font-weight:600}
.kpi .d{margin-top:4px;font-size:11px;font-weight:600}
.kpi .d.up{color:#047857}
.kpi .d.dn{color:#b91c1c}
.kpi .d.fl{color:#334155}
.chartbox{position:relative;width:100%}
.chartbox.h220{height:220px}.chartbox.h240{height:240px}.chartbox.h260{height:260px}.chartbox.h280{height:280px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-md)}
table.tbl{width:100%;min-width:560px;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
table.tbl th{
  padding:9px 10px;
  border-bottom:1px solid #cbd5e1;
  background:#f1f5f9;
  color:#334155;
  font-size:10px;
  font-weight:700;
  letter-spacing:.03em;
  text-align:left;
  white-space:nowrap;
}
table.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);color:var(--body);vertical-align:middle}
table.tbl tbody tr:last-child td{border-bottom:0}
table.tbl tbody tr{transition:background-color var(--transition)}
table.tbl tbody tr:hover td{background:#f8fafc}
table.tbl b{color:var(--ink);font-weight:700}
table.tbl td:first-child,table.tbl td:nth-child(3){font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
table.tbl td:nth-last-child(2):not(:first-child){font-variant-numeric:tabular-nums}
.pill{
  display:inline-flex;
  align-items:center;
  gap:4px;
  min-height:22px;
  padding:2px 8px;
  border:1px solid transparent;
  border-radius:999px;
  font-size:10px;
  font-weight:700;
  line-height:1.25;
  white-space:nowrap;
}
.pill .material-symbols-outlined{font-size:13px}
.p-g{border-color:#a7f3d0;background:var(--gr-bg);color:#065f46}
.p-a{border-color:#fde68a;background:var(--am-bg);color:#92400e}
.p-b{border-color:#bfdbfe;background:var(--bl-bg);color:#1e40af}
.p-r{border-color:#fecaca;background:var(--rd-bg);color:#991b1b}
.p-v{border-color:#ddd6fe;background:var(--vi-bg);color:#5b21b6}
.p-t{border-color:#99f6e4;background:var(--te-bg);color:#115e59}
.p-m{border-color:#cbd5e1;background:#f1f5f9;color:#334155}
.bar{height:7px;min-width:60px;overflow:hidden;border-radius:999px;background:#e2e8f0}
.bar span{display:block;height:100%;border-radius:999px;background:var(--color-accent);transition:width .35s ease}
.board-wrap{overflow-x:auto;padding-bottom:5px}
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:11px}
.bcol{display:flex;min-width:0;flex-direction:column;gap:9px;padding:10px;border:1px solid var(--line);border-radius:var(--radius-md);background:#f8fafc}
.bcol-h{display:flex;align-items:center;gap:7px;padding:2px 2px 9px;border-bottom:2px solid #94a3b8;color:var(--ink);font-size:12px;font-weight:700}
.bcol-h .material-symbols-outlined{font-size:18px;color:var(--color-primary)}
.bcol-h .n{margin-left:auto;padding:1px 8px;border-radius:999px;background:var(--color-primary);color:#fff;font-family:Poppins,sans-serif;font-size:10px;font-weight:600}
.bcol.s1 .bcol-h{border-color:#60a5fa}.bcol.s1 .bcol-h .material-symbols-outlined{color:#1d4ed8}.bcol.s1 .bcol-h .n{background:#1d4ed8}
.bcol.s2 .bcol-h{border-color:#f59e0b}.bcol.s2 .bcol-h .material-symbols-outlined{color:#92400e}.bcol.s2 .bcol-h .n{background:#92400e}
.bcol.s3 .bcol-h{border-color:#10b981}.bcol.s3 .bcol-h .material-symbols-outlined{color:#047857}.bcol.s3 .bcol-h .n{background:#047857}
.gc{padding:10px;border:1px solid var(--line);border-left:3px solid var(--color-primary);border-radius:var(--radius-sm);background:#fff;transition:border-color var(--transition),background-color var(--transition)}
.gc:hover{border-color:#94a3b8}
.gc.s1{border-left-color:#2563eb}.gc.s2{border-left-color:#b45309}.gc.s3{border-left-color:#047857}
.gc.warn{border-color:#fecaca;border-left-color:var(--color-destructive);background:#fff7f7;animation:warning 2s ease-in-out infinite}
@keyframes warning{0%,100%{border-color:#fecaca}50%{border-color:#dc2626}}
.gc-h{display:flex;align-items:center;gap:7px;margin-bottom:6px;flex-wrap:wrap}
.gc-h .no{color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:700}
.gc .sup{display:flex;align-items:center;gap:5px;margin-bottom:6px;color:var(--body);font-size:11px;font-weight:600}
.gc .sup .material-symbols-outlined{font-size:14px;color:var(--muted)}
.gc .gl{display:flex;flex-wrap:wrap;gap:4px}
.gtag{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border:1px solid #cbd5e1;border-radius:var(--radius-sm);background:#f8fafc;color:#334155;font-size:10px;font-weight:600}
.gtag .material-symbols-outlined{font-size:12px}.gtag.qty{border-color:#bfdbfe;background:var(--bl-bg);color:#1e40af}.gtag.warn{border-color:#fecaca;background:var(--rd-bg);color:#991b1b}
.rackwrap{overflow-x:auto}
.rack{display:grid;gap:7px;min-width:560px}
.rack-row{display:grid;grid-template-columns:58px repeat(10,1fr);gap:5px;align-items:center}
.rack-row .rl{color:var(--ink);font-size:11px;font-weight:700}
.cell{position:relative;display:grid;height:38px;place-content:center;border:1px solid transparent;border-radius:var(--radius-sm);color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9px;font-weight:700}
.cell.lv0{border-color:#e2e8f0;background:#f1f5f9;color:#64748b}.cell.lv1{background:#bfdbfe;color:#1e3a8a}.cell.lv2{background:#7dd3fc;color:#0c4a6e}.cell.lv3{background:#f59e0b;color:#422006}.cell.lv4{background:#047857}.cell.lv5{background:#b91c1c;animation:warning 2s infinite}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:11px;color:var(--body);font-size:10px;font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{display:inline-block;width:13px;height:13px;border:1px solid rgba(15,23,42,.12);border-radius:3px}
.reco{display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--radius-md);background:#fff;flex-wrap:wrap;transition:border-color var(--transition)}
.rrow:hover{border-color:#94a3b8}.rrow .rk{display:grid;width:40px;height:36px;flex:none;place-content:center;border-radius:var(--radius-sm);background:#e2e8f0;color:#1e293b;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;font-weight:700}
.rrow .info{flex:1;min-width:130px}.rrow .info b{color:var(--ink);font-size:12px}.rrow .info small{display:block;margin-top:1px;color:var(--muted);font-size:10px}
.wave{display:flex;align-items:center;gap:12px;margin-bottom:9px;padding:11px 13px;border:1px solid var(--line);border-radius:var(--radius-md);background:#fff;flex-wrap:wrap;transition:border-color var(--transition)}
.wave:hover{border-color:#94a3b8}.wave .ring{position:relative;display:grid;width:52px;height:52px;flex:none;place-content:center;border-radius:50%}.wave .ring::after{content:"";position:absolute;inset:6px;border-radius:50%;background:#fff}.wave .ring b{position:relative;z-index:1;color:var(--ink);font-family:Poppins,sans-serif;font-size:11px;font-weight:600}.wave .wi{flex:1;min-width:150px}.wave .wi b{color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}.wave .wi small{display:block;margin-top:2px;color:var(--muted);font-size:10px}.wave .wm{display:flex;flex-wrap:wrap;gap:6px}
.mchip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1px solid #cbd5e1;border-radius:var(--radius-sm);background:#f8fafc;color:#334155;font-size:10px;font-weight:600}.mchip .material-symbols-outlined{font-size:13px}
.dock{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:11px}.dock>*{min-width:0}
.dcard{padding:12px;border:1px solid var(--line);border-top:3px solid var(--color-primary);border-radius:var(--radius-md);background:#fff;transition:border-color var(--transition)}.dcard:hover{border-color:#94a3b8}.dcard.busy{border-top-color:#b45309}.dcard.done{border-top-color:#047857}.dcard.free{border-top-color:#94a3b8}
.dcard .dh{display:flex;align-items:center;gap:7px;margin-bottom:8px}.dcard .dh .dn{color:var(--ink);font-family:Poppins,sans-serif;font-size:13px;font-weight:600}.dcard .dh .material-symbols-outlined{color:var(--color-primary);font-size:20px}.dcard .truck{display:flex;align-items:center;gap:5px;margin-bottom:7px;color:var(--body);font-size:11px;font-weight:600}.dcard .truck .material-symbols-outlined{font-size:15px;color:var(--muted)}.dcard .prog{display:flex;justify-content:space-between;gap:8px;margin-top:7px;color:var(--muted);font-size:10px;font-weight:600}

var SCREENS=[scr0,scr1,scr2,scr3,scr4,scr5];

/* ============ charts ============ */

  var o={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{family:"Inter",size:11},color:TICK,usePointStyle:true,pointStyleWidth:9}}},scales:{x:{grid:{display:false},ticks:{color:TICK,font:{size:10}}},y:{grid:{color:GRID},ticks:{color:TICK,font:{size:10}},beginAtZero:true}}};
  if(extra){ for(var kk in extra){ o[kk]=extra[kk]; } }
  return o;
}
function draw(i){

  }

/* ============ nav + show ============ */
var navEl=document.getElementById("nav");
navEl.insertAdjacentHTML("beforeend",NAV.map(function(t,i){ return '<button data-i="'+i+'" class="'+(i===0?'on':'')+'"><span class="material-symbols-outlined">'+t[0]+'</span><span class="tx">'+t[1]+'</span><span class="num">'+NUM[i]+'</span></button>'; }).join(""));
var view=document.getElementById("view");
function show(i){
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  navEl.querySelectorAll("button[data-i]").forEach(function(b){ b.classList.toggle("on",b.dataset.i===String(i)); });
  document.getElementById("t-title").textContent=NAV[i][1];
  document.getElementById("t-sub").textContent=NAV[i][2];
  view.innerHTML=SCREENS[i]();
  void view.offsetHeight;
  draw(i);
}
navEl.addEventListener("click",function(e){ var b=e.target.closest("button[data-i]"); if(!b)return; show(+b.dataset.i); try{window.scrollTo(0,0);}catch(e){} });
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
