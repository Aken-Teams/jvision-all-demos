<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>升學作品集顧問室 · Student Portfolio Advisory</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--accent:#0891b2;--accent2:#22d3ee;--ink:#0f2b33;--bg:#eef6f8;--card:#ffffff;--line:#d6e6ea;--mut:#5c7c85;--ok:#0f766e;--warn:#b45309;--bad:#be123c;--gold:#b58a2b}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.top{background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:11px 22px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.top>*{min-width:0}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#fff;flex:none;box-shadow:0 8px 18px rgba(8,145,178,.34);font-family:"Noto Sans TC"}
.brand b{font-size:15px;font-weight:800;display:block;font-family:"Noto Sans TC"}
.brand span{font-size:10px;color:var(--accent);letter-spacing:2px}
.nav{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap;min-width:0}
.nav button{border:0;background:transparent;color:var(--mut);font:inherit;font-weight:600;font-size:13px;padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:#e2f1f4;color:var(--accent)}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.wrap{max-width:1280px;margin:0 auto;padding:22px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh>*{min-width:0}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.live{background:#d5eef2;color:var(--accent);padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px;flex:none}
.live i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:p 1.5s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpis>*{min-width:0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.28}
.up{color:var(--ok)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.15fr .85fr}
.g11{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#d3ede9;color:#0f766e}.t-warn{background:#fbe6cf;color:#8a5a08}.t-bad{background:#fbdbe4;color:#a10e39}.t-info{background:#d5eef2;color:#0a6f89}.t-gold{background:#f4ead0;color:#8a6a1f}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#eaf5f7}
.chart{position:relative}
.scroll{overflow-x:auto}
.bar{height:8px;background:#dcecef;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
/* signature portfolio board */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:16px}.board>*{min-width:0}
.pc{border:1px solid var(--line);border-radius:15px;background:var(--card);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 3px 10px rgba(8,145,178,.06)}
.pc .ph{height:120px;border:2px dashed var(--accent2);border-radius:11px 11px 0 0;background:repeating-linear-gradient(45deg,#eef9fb,#eef9fb 9px,#dcf1f5 9px,#dcf1f5 18px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--accent);border-bottom:none}
.pc .ph .material-symbols-outlined{font-size:30px;opacity:.75}
.pc .ph small{font-size:10.5px;font-weight:700;letter-spacing:1px;color:var(--accent)}
.pc .bd{padding:11px 13px 13px;display:flex;flex-direction:column;gap:5px;flex:1}
.pc .bd .cat{font-size:10px;font-weight:800;letter-spacing:1px;color:var(--gold)}
.pc .bd b{font-size:13.5px;font-family:"Noto Sans TC";line-height:1.35}
.pc .bd .meta{font-size:11px;color:var(--mut);display:flex;flex-wrap:wrap;gap:4px 8px}
.pc .bd .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px;padding-top:8px}
.pc .prog{font-family:Inter;font-weight:800;font-size:13px;color:var(--accent)}
/* signature milestone timeline */
.tl{position:relative;padding-left:6px}
.tl .row{display:grid;grid-template-columns:118px 26px 1fr;gap:12px;align-items:start;padding-bottom:18px;position:relative}
.tl .row:last-child{padding-bottom:0}
.tl .dt{text-align:right;font-size:11.5px;color:var(--mut);font-weight:700;padding-top:3px;font-family:Inter}
.tl .dt small{display:block;font-weight:500;font-size:10px}
.tl .ax{display:flex;flex-direction:column;align-items:center;position:relative}
.tl .dot{width:16px;height:16px;border-radius:50%;border:3px solid var(--accent);background:#fff;z-index:2;margin-top:3px;flex:none}
.tl .dot.done{background:var(--accent)}
.tl .dot.now{border-color:var(--accent2);box-shadow:0 0 0 4px rgba(34,211,238,.25)}
.tl .dot.late{border-color:var(--bad)}
.tl .line{position:absolute;top:12px;bottom:-18px;width:2px;background:var(--line);left:50%;transform:translateX(-50%);z-index:1}
.tl .row:last-child .line{display:none}
.tl .mi{border:1px solid var(--line);border-radius:12px;padding:10px 13px;background:var(--card)}
.tl .mi .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tl .mi b{font-size:13px;font-family:"Noto Sans TC"}
.tl .mi p{margin:5px 0 0;font-size:11.5px;color:var(--mut)}
/* student profile */
.prof{display:flex;gap:15px;align-items:center;flex-wrap:wrap}
.prof .av{width:66px;height:66px;border-radius:16px;border:2px dashed var(--accent2);display:grid;place-items:center;color:var(--accent);flex:none;background:repeating-linear-gradient(45deg,#eef9fb,#eef9fb 8px,#dcf1f5 8px,#dcf1f5 16px)}
.prof .info b{font-size:17px;font-family:"Noto Sans TC"}
.prof .info .sub{font-size:12px;color:var(--mut);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:#e2f1f4;color:var(--accent)}
.dl2{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;font-size:12.5px}.dl2>*{min-width:0}
.dl2 .r{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.dl2 .r dt{color:var(--mut)}.dl2 .r dd{margin:0;font-weight:700;text-align:right}
/* target school list */
.ts{display:flex;flex-direction:column;gap:10px}
.trow{border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.trow .nm b{font-size:13px;font-family:"Noto Sans TC"}
.trow .nm small{color:var(--mut);font-size:11px;display:block;margin-top:2px}
/* advising log */
.log{display:flex;flex-direction:column;gap:12px}
.le{border-left:3px solid var(--accent2);background:#f2fafc;border-radius:0 12px 12px 0;padding:11px 14px}
.le .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.le .hd b{font-size:13px;font-family:"Noto Sans TC"}
.le .hd .who{font-size:11px;color:var(--accent);font-weight:700}
.le p{margin:7px 0 0;font-size:12px;color:#375a63;line-height:1.55}
.todo{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.td{display:flex;align-items:center;gap:8px;font-size:11.5px}
.td .material-symbols-outlined{font-size:16px}
.td.done{color:var(--mut);text-decoration:line-through}
.td.done .material-symbols-outlined{color:var(--ok)}
.td.open .material-symbols-outlined{color:var(--warn)}
/* review */
.rv{display:flex;flex-direction:column;gap:12px}
.rc{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rc .top2{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px 14px;background:#f6fbfc}
.rc .th{width:52px;height:52px;border-radius:10px;border:2px dashed var(--accent2);display:grid;place-items:center;color:var(--accent);flex:none}
.rc .mid b{font-size:13.5px;font-family:"Noto Sans TC"}
.rc .mid small{color:var(--mut);font-size:11px;display:block;margin-top:2px}
.score{font-family:Inter;font-weight:800;font-size:20px;text-align:right}
.score small{font-size:11px;color:var(--mut);font-weight:600}
.rc .fb{padding:11px 14px;font-size:12px;color:#375a63;border-top:1px solid var(--line);line-height:1.55}
.rc .fb .lbl{font-weight:800;color:var(--accent);font-size:11px;font-family:"Noto Sans TC"}
.stars{color:var(--gold);font-size:13px;letter-spacing:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.two>*{min-width:0}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g11,.two{grid-template-columns:1fr}.dl2{grid-template-columns:1fr}}
@media(max-width:820px){.tl .row{grid-template-columns:92px 24px 1fr}.trow{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:14px}.nav button span:not(.material-symbols-outlined){display:none}.nav button{padding:9px}.rc .top2{grid-template-columns:44px 1fr auto}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo">集</div><div><b>升學作品集顧問室</b><span>PORTFOLIO ADVISORY</span></div></div>
  <nav class="nav" id="nav"></nav>
</header>
<main class="wrap">
  <div class="vh"><div><h2 id="vt">顧問總覽</h2><p id="vd"></p></div><div class="live"><i></i>48 位輔導中 · 6 件待審閱</div></div>
  <div id="view"></div>
</main>
<script>
const MOD=[["顧問總覽","dashboard","顧問總覽","輔導學生數、作品完成度、里程碑與待審閱戰情"],
["學生檔案","badge","學生檔案","學生志向、學習歷程與目標校系檔案"],
["作品集件","collections","作品集件","專題、競賽、證照件與封面樣張作品板"],
["升學里程碑","flag","升學里程碑","目標校系申請時程與關鍵里程碑時間軸"],
["輔導紀錄","support_agent","輔導紀錄","一對一顧問對談紀錄與行動待辦追蹤"],
["審閱回饋","rate_review","審閱回饋","作品件委員審閱、評分與修改建議"]];
const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span><span>'+m[0]+'</span>';b.onclick=()=>show(i);nav.appendChild(b);});

// 作品件：類別,名稱,類型icon,狀態,狀態tag,完成度,說明
const WORKS=[
["專題研究","智慧灌溉 IoT 系統專題","science","已定稿","t-ok",100,"物聯網 · 團隊 4 人"],
["競賽成果","全國創客大賽 金牌作品","emoji_events","審閱中","t-info",85,"2025 校際 · 個人組"],
["證照件","TQC 程式設計 Python 3","verified","已定稿","t-ok",100,"Level 進階 · 890 分"],
["實作作品","校園導覽 App UI 設計","design_services","修訂中","t-warn",70,"Figma · 個人專案"],
["專題研究","在地小農電商平台","storefront","撰寫中","t-warn",55,"社會參與 · 團隊 3 人"],
["競賽成果","青少年科展 區域佳作","biotech","已定稿","t-ok",100,"生活與應用科學"],
["文件件","自傳與讀書計畫","description","顧問回饋","t-warn",60,"目標：資工系"],
["實作作品","短篇動畫《潮間帶》","movie","撰寫中","t-warn",40,"多媒體 · 個人作品"]
];
// 里程碑：日期,年,狀態,標題,tag,tag文字,說明
const MILE=[
["09/15","2025","done","專題主題定案","t-ok","已完成","與顧問確認資工方向，選定 IoT 智慧灌溉專題。"],
["10/30","2025","done","核心作品初稿","t-ok","已完成","完成 3 件核心作品初稿並上傳作品集平台。"],
["11/20","2025","now","作品委員審閱","t-info","進行中","送 6 件作品給審閱委員，回收評分與修改建議。"],
["12/10","2025","late","自傳讀書計畫定稿","t-bad","已逾期","自傳仍待修訂，距申請截止剩 21 天，升為高優先。"],
["12/25","2025","todo","備審資料彙整","t-warn","待處理","依目標校系需求彙整 PDF 備審，完成最終校對。"],
["01/15","2026","todo","個人申請送件","t-warn","待處理","繁星／個人申請系統上傳，確認校系志願序。"],
["02/20","2026","todo","面試模擬演練","t-warn","待處理","安排 2 場模擬面試，錄影檢討並強化作品口述。"]
];
// 目標校系：校系,類型,tag,tag文字,符合度,缺件
const TARGET=[
["國立清華大學 資訊工程學系","第一志願 · 個人申請","t-info","衝刺",82,"缺 1 件：程式競賽佐證"],
["國立成功大學 資訊工程學系","第二志願 · 繁星推薦","t-ok","穩定",90,"作品件齊全"],
["國立中央大學 資訊管理學系","第三志願 · 個人申請","t-ok","穩定",88,"缺 0 件"],
["國立臺北科技大學 電子工程系","保底 · 個人申請","t-ok","安全",93,"作品件齊全"]
];
// 審閱：作品,委員,分數,滿分,星,狀態,tag,回饋標題,回饋
const REVIEW=[
["智慧灌溉 IoT 系統專題","林教授 · 資工領域","92","100","★★★★★","通過","t-ok","亮點與建議","系統整合完整、實測數據充分，建議補上使用者情境影片增強說服力。"],
["校園導覽 App UI 設計","陳老師 · 設計領域","74","100","★★★☆☆","退回修訂","t-warn","需修訂","資訊架構清楚，但配色對比不足、部分頁面留白過多，請依標註重新排版。"],
["自傳與讀書計畫","王主任 · 升學顧問","68","100","★★★☆☆","退回修訂","t-warn","需修訂","動機描述略為空泛，建議以 IoT 專題經歷具體佐證學習熱忱與校系連結。"],
["全國創客大賽 金牌作品","林教授 · 資工領域","96","100","★★★★★","通過","t-ok","高度肯定","獲獎作品技術含量高，佐證資料完整，可作為第一志願主打作品件。"]
];
// 輔導紀錄：日期,主題,顧問,內容,待辦[[done,文字]...]
const LOGS=[
["11/18","作品審閱結果檢討","王主任","與學生檢視 6 件作品審閱結果，2 件需修訂。優先處理自傳與 App UI 兩件，其餘維持定稿。",[[1,"回收全部委員審閱表"],[0,"App UI 依標註重新排版"],[0,"自傳補入 IoT 專題佐證段落"]]],
["11/11","目標校系與作品盤點","王主任","盤點四所目標校系作品需求，清大缺程式競賽佐證，安排補件。整體符合度平均 88%。",[[1,"完成校系需求對照表"],[1,"確認繁星／個人申請志願序"],[0,"補齊清大程式競賽佐證件"]]],
["10/28","升學方向與時程規劃","王主任","確認以資訊工程為主軸，排定 11–1 月里程碑。學生對競賽作品信心足，需補強文件類。",[[1,"設定 7 項升學里程碑"],[1,"開通作品集平台帳號"],[0,"每週回報作品進度"]]]
];

function workCard(w){return `<div class="pc"><div class="ph"><span class="material-symbols-outlined">${w[2]}</span><small>封面 / 作品樣張</small></div><div class="bd"><span class="cat">${w[0]}</span><b>${w[1]}</b><div class="meta">${w[6]}</div><div class="bar" style="margin-top:2px"><i style="width:${w[5]}%"></i></div><div class="foot"><span class="prog">${w[5]}%</span><span class="tag ${w[4]}">${w[3]}</span></div></div></div>`;}

const SCREENS=[
// 0 顧問總覽
()=>`<div class="kpis">
 <div class="kpi"><span class="material-symbols-outlined ic">groups</span><div class="l">輔導中學生</div><div class="v">48</div><div class="d up">▲ 本月新增 6</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">collections</span><div class="l">作品件總數</div><div class="v">312</div><div class="d up">▲ 本週 +18</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">flag</span><div class="l">里程碑達成率</div><div class="v">78<small style="font-size:12px">%</small></div><div class="d" style="color:var(--warn)">4 項逾期待處理</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">rate_review</span><div class="l">待審閱作品</div><div class="v" style="color:var(--warn)">6</div><div class="d" style="color:var(--mut)">2 件退回修訂</div></div>
</div>
<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">donut_large</span>作品件類型分布</h3><div class="chart" style="height:270px"><canvas id="c_type"></canvas></div></div>
