<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>品質變更管理（Change Control - Quality Impact）</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{--accent:#334155;--accent2:#64748b;--bg:#f1f5f9;--card:#ffffff;--line:#e2e8f0;--txt:#1e293b;--mut:#64748b;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#2563eb;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.6;overflow-x:hidden;}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.app{display:flex;min-height:100vh;align-items:stretch;}
.sidebar{width:248px;flex:0 0 248px;background:#fff;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;}
.brand{display:flex;gap:11px;align-items:center;padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:10px;}
.brand .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 40px;}
.brand .logo .material-symbols-outlined{font-size:24px;}
.brand h1{font-size:15px;margin:0;font-weight:800;line-height:1.25;}
.brand p{font-size:11px;margin:2px 0 0;color:var(--mut);font-weight:500;}
.nav{display:flex;flex-direction:column;gap:4px;min-width:0;}
.navbtn{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;border:none;background:transparent;color:var(--mut);font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;text-align:left;width:100%;min-width:0;transition:background .15s,color .15s;}
.navbtn .material-symbols-outlined{font-size:20px;flex:0 0 auto;}
.navbtn .nlab{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.navbtn .nnum{margin-left:auto;font-size:11px;font-weight:700;color:#94a3b8;background:#f1f5f9;border-radius:6px;padding:1px 7px;}
.navbtn:hover{background:#f1f5f9;color:var(--txt);}
.navbtn.on{background:var(--accent);color:#fff;}
.navbtn.on .nnum{color:#fff;background:rgba(255,255,255,.2);}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);font-size:11px;color:#94a3b8;line-height:1.5;}
.main{flex:1 1 auto;min-width:0;padding:24px 28px 40px;max-width:100%;}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
.topbar .tt{min-width:0;}
.topbar h2{margin:0;font-size:21px;font-weight:800;display:flex;align-items:center;gap:9px;}
.topbar h2 .material-symbols-outlined{color:var(--accent);font-size:26px;}
.topbar .sub{margin:5px 0 0;color:var(--mut);font-size:13px;}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;background:#e2e8f0;color:#475569;}
.chip .material-symbols-outlined{font-size:15px;}
.grid{display:grid;gap:16px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g21{grid-template-columns:2fr 1fr;}
.g12{grid-template-columns:1fr 2fr;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0;}
.card.pad0{padding:0;overflow:hidden;}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.ch h3{margin:0;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:7px;}
.ch h3 .material-symbols-outlined{font-size:19px;color:var(--accent2);}
.ch .hint{font-size:11.5px;color:var(--mut);}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0;}
.kpi .lab{font-size:12px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:6px;}
.kpi .lab .material-symbols-outlined{font-size:17px;}
.kpi .val{font-size:26px;font-weight:800;margin-top:8px;letter-spacing:-.5px;word-break:break-all;}
.kpi .val small{font-size:13px;font-weight:600;color:var(--mut);margin-left:3px;}
.kpi .dt{font-size:11.5px;margin-top:6px;font-weight:600;display:flex;align-items:center;gap:3px;}
.kpi .dt .material-symbols-outlined{font-size:15px;}
.up{color:var(--ok);}.down{color:var(--bad);}.flat{color:var(--mut);}
.kpi.acc{border-left:4px solid var(--accent);}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
th{text-align:left;font-size:11.5px;color:var(--mut);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#f8fafc;}
td{padding:11px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#f8fafc;}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;}
.tag .material-symbols-outlined{font-size:13px;}
.t-ok{background:#dcfce7;color:#15803d;}
.t-warn{background:#fef3c7;color:#b45309;}
.t-bad{background:#fee2e2;color:#b91c1c;}
.t-info{background:#dbeafe;color:#1d4ed8;}
.t-mut{background:#e2e8f0;color:#475569;}
.t-acc{background:#e2e8f0;color:#334155;}
.mono{font-family:"Inter",monospace;font-weight:700;font-size:12.5px;letter-spacing:.2px;}
.bar{height:7px;border-radius:6px;background:#e2e8f0;overflow:hidden;min-width:60px;}
.bar>i{display:block;height:100%;border-radius:6px;}
.ov{overflow-x:auto;}
.wrap{overflow:hidden;}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;min-width:0;}
.col{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:11px;min-width:0;}
.col .colh{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:10px;padding:0 3px;}
.col .colh .cnt{font-size:11px;color:var(--mut);background:#e2e8f0;border-radius:6px;padding:1px 7px;}
.tk{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:9px;min-width:0;}
.tk:last-child{margin-bottom:0;}
.tk .tkid{font-size:10.5px;color:var(--accent2);font-weight:700;}
.tk .tkt{font-size:13px;font-weight:600;margin:3px 0 7px;}
.tk .tkm{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--mut);gap:8px;}
.av{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex:0 0 auto;}
.tl{position:relative;padding-left:26px;}
.tl:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tli{position:relative;padding:0 0 18px 0;}
.tli:last-child{padding-bottom:0;}
.tli .dot{position:absolute;left:-26px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--accent2);display:flex;align-items:center;justify-content:center;}
.tli .dot.done{background:var(--accent);border-color:var(--accent);}
.tli .dot.done:after{content:"";width:6px;height:6px;background:#fff;border-radius:50%;}
.tli .tlt{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.tli .tld{font-size:12px;color:var(--mut);margin-top:3px;}
.tli .tlm{font-size:11px;color:#94a3b8;margin-top:4px;}
.steps{display:flex;gap:8px;flex-wrap:wrap;}
.step{flex:1 1 140px;min-width:0;background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:12px;position:relative;}
.step .sn{width:24px;height:24px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;margin-bottom:8px;}
.step.pend .sn{background:#cbd5e1;color:#475569;}
.step .st{font-size:13px;font-weight:700;}
.step .sd{font-size:11.5px;color:var(--mut);margin-top:3px;}
.matrix{display:grid;grid-template-columns:auto repeat(5,1fr);gap:4px;min-width:0;font-size:11px;}
.matrix .mh{font-weight:700;color:var(--mut);text-align:center;padding:4px;font-size:10.5px;}
.matrix .ml{font-weight:700;color:var(--mut);display:flex;align-items:center;padding-right:4px;font-size:10.5px;justify-content:flex-end;}
.mc{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:12px;min-height:34px;}
.note{background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:11px 13px;font-size:12px;color:var(--mut);display:flex;gap:8px;align-items:flex-start;}
.note .material-symbols-outlined{font-size:17px;color:var(--accent2);flex:0 0 auto;margin-top:1px;}
.checkitem{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f1f5f9;}
.checkitem:last-child{border-bottom:none;}
.checkitem .ci{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.checkitem .ci .material-symbols-outlined{font-size:17px;}
.checkitem .ct{font-size:13px;font-weight:600;min-width:0;}
.checkitem .cs{margin-left:auto;font-size:11px;font-weight:700;flex:0 0 auto;}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--mut);}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}
.mb0{margin-bottom:0;}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr);}.board{grid-template-columns:repeat(2,1fr);}}
@media(max-width:860px){
 .app{display:block;}
 .sidebar{width:auto;flex:none;border-right:none;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px;gap:8px;}
 .brand{border-bottom:none;margin:0;padding:0 10px 0 0;flex:0 0 auto;}
 .nav{flex-direction:row;flex-wrap:wrap;gap:6px;flex:1 1 auto;}
 .navbtn{width:auto;flex:0 0 auto;padding:8px 12px;}
 .navbtn .nnum{display:none;}
 .side-foot{display:none;}
 .main{padding:18px 16px 32px;}
}
@media(max-width:820px){
 .g3,.g2,.g21,.g12{grid-template-columns:1fr;}
}
@media(max-width:560px){
 .navbtn .nlab{display:none;}
 .navbtn{padding:9px;}
 .topbar h2{font-size:18px;}
 .board{grid-template-columns:1fr;}
 .g4{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">published_with_changes</span></div>
      <div>
        <h1>品質變更管理</h1>
        <p>Change Control · Quality Impact</p>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      QMS 品質管理系統<br/>研發部 · 製程工程部 · 品保部<br/>模擬資料 · 純前端展示
    </div>
  </aside>
  <main class="main">
    <div id="view"></div>
  </main>
</div>
<script>
"use strict";
var MODS=[
 {icon:"description",name:"變更申請登錄",sub:"ECR 提出、變更分類與案件總覽"},
 {icon:"warning",name:"品質影響評估",sub:"FMEA/PPAP 觸發判斷與風險分級"},
 {icon:"account_tree",name:"跨部門審核",sub:"CCB 會簽關卡與核決追蹤"},
 {icon:"science",name:"驗證測試",sub:"試產樣品量測與驗證證據"},
 {icon:"task_alt",name:"核准實施",sub:"生效版本與生產切換管控"},
 {icon:"insights",name:"成效追蹤",sub:"核准時效與變更後不良率"}
];
var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function mount(id,opt){var el=document.getElementById(id);if(!el)return;var base={redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:'Inter,"Noto Sans TC",sans-serif'};for(var k in base){if(opt.chart[k]===undefined)opt.chart[k]=base[k];}try{var c=new ApexCharts(el,opt);c.render();charts.push(c);}catch(e){}}

/* ---------- SCREEN 0 ---------- */
function s0(){
 var rows=[
  {id:"ECR-2408-117",item:"料號 PN-4471 外殼",type:"設計變更",cls:"A 級",dept:"研發部",owner:"林彥廷",date:"08/12",st:"評估中",stc:"t-info"},
  {id:"ECR-2408-116",item:"焊接製程 WLD-09",type:"製程變更",cls:"A 級",dept:"製程工程部",owner:"陳彥霖",date:"08/12",st:"CCB 審核",stc:"t-warn"},
  {id:"ECR-2408-114",item:"供應商 SUP-233 換料",type:"供應商變更",cls:"B 級",dept:"採購部",owner:"黃詩涵",date:"08/11",st:"驗證中",stc:"t-info"},
  {id:"ECR-2408-112",item:"料號 PN-2210 鍍層",type:"設計變更",cls:"C 級",dept:"研發部",owner:"吳孟哲",date:"08/10",st:"待評估",stc:"t-mut"},
  {id:"ECR-2408-109",item:"包裝規格 PKG-05",type:"文件變更",cls:"C 級",dept:"品保部",owner:"張雅婷",date:"08/09",st:"已核准",stc:"t-ok"},
  {id:"ECR-2408-105",item:"塑膠原料配方 RM-71",type:"供應商變更",cls:"A 級",dept:"製程工程部",owner:"陳彥霖",date:"08/08",st:"已核准",stc:"t-ok"}
 ];
 return {html:''+
  topbar(0)+
  '<div class="grid g4" style="margin-bottom:16px">'+
   kpi("本月新增變更","description","24","件","up","較上月 +5")+
   kpi("進行中案件","pending_actions","11","件","flat","含 4 件 A 級")+
   kpi("待我簽核","assignment_ind","3","件","down","2 件今日到期",true)+
   kpi("登錄至評估","timer","0.8","天","up","較上季 -0.3")+
  '</div>'+
  '<div class="grid g21" style="margin-bottom:16px">'+
   '<div class="card"><div class="ch"><h3><span class="material-symbols-outlined">table_rows</span>變更申請清單</h3><span class="chip"><span class="material-symbols-outlined">filter_list</span>全部類別</span></div>'+
    '<div class="ov"><table><thead><tr><th>案號</th><th>變更標的</th><th>類別</th><th>等級</th><th>提出單位</th><th>負責人</th><th>日期</th><th>狀態</th></tr></thead><tbody>'+
    rows.map(function(r){return '<tr><td class="mono">'+r.id+'</td><td>'+r.item+'</td><td><span class="tag t-acc">'+r.type+'</span></td><td>'+clsTag(r.cls)+'</td><td>'+r.dept+'</td><td>'+r.owner+'</td><td>'+r.date+'</td><td><span class="tag '+r.stc+'">'+r.st+'</span></td></tr>';}).join('')+
    '</tbody></table></div></div>'+
   '<div class="card"><div class="ch mb0"><h3><span class="material-symbols-outlined">donut_small</span>變更類別分布</h3></div><div class="wrap" id="c0a" style="height:210px"></div>'+
    '<div class="legend" style="margin-top:6px"><span><i style="background:#334155"></i>設計變更</span><span><i style="background:#64748b"></i>製程變更</span><span><i style="background:#94a3b8"></i>供應商變更</span><span><i style="background:#cbd5e1"></i>文件變更</span></div></div>'+
  '</div>'+
  '<div class="grid g12">'+
   '<div class="card"><div class="ch mb0"><h3><span class="material-symbols-outlined">bar_chart</span>各單位提出量</h3></div><div class="wrap" id="c0b" style="height:230px"></div></div>'+
   '<div class="card"><div class="ch mb0"><h3><span class="material-symbols-outlined">timeline</span>近 6 週登錄趨勢</h3></div><div class="wrap" id="c0c" style="height:230px"></div></div>'+
  '</div>',
  init:function(){
   mount("c0a",{chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"donut",height:210},series:[9,6,5,4],labels:["設計變更","製程變更","供應商變更","文件變更"],colors:["#334155","#64748b","#94a3b8","#cbd5e1"],dataLabels:{enabled:false},legend:{show:false},stroke:{width:2},plotOptions:{pie:{donut:{size:"62%",labels:{show:true,total:{show:true,label:"總件數",fontSize:"12px",color:"#64748b",formatter:function(){return"24";}}}}}}});
   mount("c0b",{chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"bar",height:230},series:[{name:"提出件數",data:[9,7,4,3,1]}],colors:["#334155"],plotOptions:{bar:{horizontal:true,borderRadius:4,barHeight:"58%"}},dataLabels:{enabled:true,style:{colors:["#fff"]}},xaxis:{categories:["研發部","製程工程部","採購部","品保部","業務部"]},grid:{borderColor:"#f1f5f9"}});
   mount("c0c",{chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"area",height:230},series:[{name:"登錄件數",data:[14,17,13,19,22,24]}],colors:["#64748b"],stroke:{width:2,curve:"smooth"},fill:{type:"gradient",gradient:{shadeIntensity:1,opacityFrom:.35,opacityTo:.05}},dataLabels:{enabled:false},xaxis:{categories:["第1週","第2週","第3週","第4週","第5週","第6週"]},grid:{borderColor:"#f1f5f9"}});
  }
 };
}

/* ---------- SCREEN 1 ---------- */
function s1(){
 var checks=[
  {t:"是否影響產品功能 / 安規？",v:"是",fmea:1},
  {t:"是否變更關鍵尺寸 / 特性？",v:"是",fmea:1},
  {t:"是否影響客戶圖面 / 規格？",v:"是",fmea:0},
  {t:"是否更換料源 / 供應商？",v:"否",fmea:0}
 ];
 var mtx=[
  ["","極輕","輕微","中等","嚴重","極嚴重"],
  ["幾乎必發","#dc2626","#dc2626","#dc2626","#7f1d1d","#7f1d1d"],
  ["高機率","#f59e0b","#dc2626","#dc2626","#dc2626","#7f1d1d"],
  ["偶發","#16a34a","#f59e0b","#dc2626","#dc2626","#dc2626"],
  ["低機率","#16a34a","#16a34a","#f59e0b","#f59e0b","#dc2626"],
  ["極少","#16a34a","#16a34a","#16a34a","#f59e0b","#f59e0b"]
 ];
 return {html:''+
  topbar(1)+
  '<div class="grid g4" style="margin-bottom:16px">'+
   kpi("評估案件","warning","PN-4471","","flat","ECR-2408-117 外殼")+
   kpi("RPN 風險指數","priority_high","288","","down","嚴重9×發生6×偵測... ",true)+
   kpi("觸發 FMEA","fact_check","需要","","flat","DFMEA 12 條目")+
   kpi("觸發 PPAP","assignment_turned_in","Lv.3","","flat","需重新提交")+
  '</div>'+
  '<div class="grid g2" style="margin-bottom:16px">'+

    tbl.map(function(r){var d=Math.round((1-r.after/r.before)*100);return '<tr><td class="mono">'+r.id+'</td><td>'+r.item+'</td><td>'+r.before+'%</td><td><b>'+r.after+'%</b></td><td><span class="tag '+(d>=40?"t-ok":d>=20?"t-warn":"t-bad")+'">-'+d+'%</span></td><td><span class="tag '+r.stc+'">'+r.st+'</span></td></tr>';}).join('')+
    '</tbody></table></div></div>'+
   '<div class="card"><div class="ch mb0"><h3><span class="material-symbols-outlined">donut_large</span>成效達標分布</h3></div><div class="wrap" id="c5c" style="height:230px"></div>'+
    '<div class="note" style="margin-top:10px"><span class="material-symbols-outlined">gavel</span>改善措施沒有驗證證據不得關閉；未達標案件（SF-04）退回再改善。</div></div>'+
  '</div>',
  init:function(){
   mount("c5a",{chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"area",height:270},series:[{name:"變更後不良率 %",data:[5.8,4.9,4.1,3.3,2.6,2.0]}],colors:["#334155"],stroke:{width:2,curve:"smooth"},fill:{type:"gradient",gradient:{opacityFrom:.4,opacityTo:.05}},dataLabels:{enabled:false},xaxis:{categories:["第1週","第2週","第3週","第4週","第5週","第6週"]},yaxis:{min:0},grid:{borderColor:"#f1f5f9"}});
   mount("c5b",{chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"bar",height:270},series:[{name:"變更前",data:[4.6,3.2,2.1,6.9,5.1]},{name:"變更後",data:[1.8,1.1,1.9,2.4,4.7]}],colors:["#cbd5e1","#334155"],plotOptions:{bar:{borderRadius:3,columnWidth:"62%"}},dataLabels:{enabled:false},xaxis:{categories:["RM-71","IP-22","PKG-05","DIE-12","SF-04"]},grid:{borderColor:"#f1f5f9"},legend:{position:"top",fontSize:"11px"},tooltip:{shared:true,intersect:false}});
   mount("c5c",{chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"donut",height:230},series:[3,1,1],labels:["達標","觀察","未達標"],colors:["#16a34a","#d97706","#dc2626"],dataLabels:{enabled:false},legend:{position:"bottom",fontSize:"11px"},stroke:{width:2},plotOptions:{pie:{donut:{size:"60%"}}}});
  }
 };

/* ---------- helpers ---------- */
function clsTag(c){var m={"A 級":"t-bad","B 級":"t-warn","C 級":"t-mut"};return '<span class="tag '+(m[c]||"t-mut")+'">'+c+'</span>';}
function barcol(p){return p>=80?"#16a34a":p>=60?"#d97706":"#dc2626";}
function kpi(lab,ic,val,unit,dir,dt,acc){
 var dc=dir==="up"?"up":dir==="down"?"down":"flat";
 var arrow=dir==="up"?"arrow_upward":dir==="down"?"arrow_downward":"remove";
 return '<div class="kpi'+(acc?" acc":"")+'"><div class="lab"><span class="material-symbols-outlined">'+ic+'</span>'+lab+'</div><div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div><div class="dt '+dc+'"><span class="material-symbols-outlined">'+arrow+'</span>'+dt+'</div></div>';
}
function topbar(i){var m=MODS[i];return '<div class="topbar"><div class="tt"><h2><span class="material-symbols-outlined">'+m.icon+'</span>'+m.name+'</h2><p class="sub">'+m.sub+'</p></div><span class="chip"><span class="material-symbols-outlined">badge</span>ECR-2408-117 · 進行中</span></div>';}

var SCREENS=[s0,s1,s2,s3,s4,s5];
function buildNav(){
 var nav=document.getElementById("nav");var h="";
 for(var i=0;i<MODS.length;i++){h+='<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span><span class="nlab">'+MODS[i].name+'</span><span class="nnum">'+i+'</span></button>';}
 nav.innerHTML=h;
 var btns=nav.querySelectorAll("[data-i]");
 for(var j=0;j<btns.length;j++){btns[j].addEventListener("click",function(){var n=+this.getAttribute("data-i");window.location.hash="v"+n;});}
}
function show(i){
 killCharts();
 var btns=document.querySelectorAll("[data-i]");
 for(var k=0;k<btns.length;k++){btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i);}
 var fn=SCREENS[i]||SCREENS[0];
 var container=document.getElementById("view");
 var out=fn();
 container.innerHTML=out.html;
 void container.offsetHeight;
 if(out.init)out.init();
}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
