<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>採購申請與電子簽核系統｜Jvision 系統 Demo</title>
<meta name="description" content="線上請購、動態簽核路徑、逐層電子簽核到軌跡歸檔的單一平台" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;--color-on-primary:#fff;--color-secondary:#3B82F6;
  --color-on-secondary:#000;--color-accent:#EA580C;--color-on-accent:#000;
  --color-background:#F8FAFC;--color-foreground:#1E293B;--color-card:#fff;
  --color-card-foreground:#1E293B;--color-muted:#E9EFF8;--color-muted-foreground:#475569;
  --color-border:#E2E8F0;--color-destructive:#DC2626;--color-on-destructive:#fff;
  --color-ring:#2563EB;--blue:#2563EB;--ink:#1E293B;--muted:#475569;--line:#E2E8F0;
  --ok:#15803D;--warn:#B45309;--bad:#DC2626;--shadow:0 8px 24px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Fira Sans",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit}
button,[role=button]{cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.layout{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;padding:24px 18px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20}
.brand{display:flex;gap:12px;align-items:center;padding:0 8px 24px;border-bottom:1px solid var(--line)}
.logo{width:42px;height:42px;display:grid;place-items:center;background:var(--blue);color:#fff;border-radius:8px;box-shadow:4px 4px 0 #BFDBFE;flex:none}
.logo .material-symbols-outlined{font-size:23px}
.brand h1{font-size:15px;line-height:1.35;margin:0;font-weight:700;letter-spacing:.01em}
.brand p{margin:3px 0 0;color:var(--muted);font:500 10px/1.4 "Fira Code",monospace}
.nav{display:flex;flex-direction:column;gap:5px;margin-top:24px}
.navbtn{position:relative;width:100%;min-height:52px;padding:9px 10px;border:1px solid transparent;border-radius:7px;background:transparent;color:#475569;display:flex;align-items:center;gap:11px;text-align:left;transition:background .2s,border-color .2s,color .2s,transform .2s}
.navbtn:hover{background:#F1F5F9;border-color:#CBD5E1;color:var(--ink);transform:translateX(2px)}
.navbtn.on{background:#EFF6FF;border-color:#93C5FD;color:#1D4ED8}
.navbtn.on:before{content:"";position:absolute;left:-19px;width:4px;height:30px;background:var(--blue)}
.navbtn .material-symbols-outlined{font-size:20px;flex:none}
.navbtn .lb{font-size:13px;font-weight:600;min-width:0}
.navbtn small{display:block;margin-top:2px;color:#64748B;font-size:10px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidefoot{margin-top:auto;padding:16px 8px 0;border-top:1px solid var(--line);color:#64748B;font:400 10px/1.7 "Fira Code",monospace}
.main{min-width:0;padding:30px clamp(18px,3vw,44px) 52px}
.topbar{position:sticky;top:0;z-index:15;margin:-30px clamp(-44px,-3vw,-18px) 22px;padding:24px clamp(18px,3vw,44px) 18px;background:rgba(248,250,252,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-end;gap:18px}
.topbar h2{margin:0;font-size:clamp(22px,2.4vw,30px);line-height:1.1;letter-spacing:-.035em}
.topbar .sub{margin-top:6px;color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;background:#FFF7ED;border:1px solid #FDBA74;border-radius:6px;color:#9A3412;font-size:12px;font-weight:600;white-space:nowrap}
.pill .material-symbols-outlined{font-size:17px}
#view{animation:reveal .35s ease-out both}
.grid{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g32{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
.card,.kpi{background:var(--color-card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);min-width:0;transition:border-color .2s,box-shadow .2s,transform .2s}
.card:hover,.kpi:hover{border-color:#CBD5E1;box-shadow:0 12px 30px rgba(15,23,42,.09);transform:translateY(-2px)}
.card{padding:18px}
.card h3{margin:0;font-size:14px;font-weight:700;letter-spacing:.005em}
.ch-sub{margin:4px 0 14px;color:var(--muted);font-size:12px}
.kpi{position:relative;padding:17px 18px 15px;overflow:hidden}
.kpi .bar{position:absolute;inset:0 auto 0 0;width:4px;background:var(--blue)}
.kpi .lab{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:600}
.kpi .lab .material-symbols-outlined{font-size:18px;color:var(--blue)}
.kpi .val{margin:10px 0 3px;color:#0F172A;font:700 25px/1.1 "Fira Code",monospace;letter-spacing:-.04em}
.kpi .dl{font-size:11px;font-weight:600;color:#475569}
.up{color:var(--ok)!important}.dn{color:#B91C1C!important}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;min-width:560px;border-collapse:collapse;font-size:12.5px}
th{padding:10px 12px;border-bottom:2px solid #CBD5E1;background:#F8FAFC;color:#475569;text-align:left;font-size:11px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .18s}
tbody tr:hover{background:#F8FAFC}
tbody tr:last-child td{border-bottom:0}
td:nth-last-child(2),td.mono{text-align:right}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border:1px solid currentColor;border-radius:4px;font-size:11px;font-weight:700;white-space:nowrap}
.tag:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-ok{background:#F0FDF4;color:#166534}.t-warn{background:#FFFBEB;color:#92400E}
.t-bad{background:#FEF2F2;color:#B91C1C}.t-info{background:#EFF6FF;color:#1D4ED8}
.t-gray{background:#F1F5F9;color:#475569}
.mono{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.chartbox{overflow:hidden}
.avatar{width:28px;height:28px;border-radius:5px;background:#DBEAFE;color:#1D4ED8;border:1px solid #93C5FD;display:inline-flex;align-items:center;justify-content:center;font:600 11px "Fira Code",monospace;flex:none}
.rowflex{display:flex;align-items:center;gap:9px}
.bars{height:8px;background:#DBEAFE;border-radius:2px;overflow:hidden;min-width:60px}
.bars>i{display:block;height:100%;background:var(--blue)}
.board{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:12px}
.col{padding:11px;background:#F8FAFC;border:1px solid var(--line);border-radius:7px}
.col h4{margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.col h4 span{padding:2px 7px;background:#fff;border:1px solid #CBD5E1;border-radius:4px;color:#475569;font:600 10px "Fira Code",monospace}
.tk{margin-bottom:8px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 2px 5px rgba(15,23,42,.04);transition:.2s}
.tk:hover{border-color:#93C5FD;transform:translateY(-1px)}
.tk .no{color:#1D4ED8;font:700 10px "Fira Code",monospace}
.tk .ti{margin:4px 0 7px;font-size:12px;font-weight:600;line-height:1.45}
.tk .me{display:flex;justify-content:space-between;gap:6px;color:var(--muted);font-size:10.5px}
.path{list-style:none;margin:0;padding:0}
.path li{position:relative;padding:0 0 20px 34px}
.path li:before{content:"";position:absolute;left:11px;top:23px;bottom:-2px;width:2px;background:#CBD5E1}
.path li:last-child:before{display:none}
.node{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:5px;display:grid;place-items:center;background:#94A3B8;color:#fff;font:700 12px "Fira Code",monospace}
.node.g{background:#15803D}.node.a{background:#B45309}.node.p{background:#64748B}
.path .pt{font-size:13px;font-weight:700}.path .pm{margin-top:3px;color:var(--muted);font-size:11px}
.step{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.dot{width:9px;height:9px;margin-top:5px;border-radius:2px;flex:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:11px}
.legend i{display:inline-block;width:9px;height:9px;margin-right:5px;border-radius:2px;vertical-align:-1px}
.ruleitem{margin-bottom:9px;padding:11px 13px;background:#F8FAFC;border:1px solid var(--line);border-radius:6px}
.ruleitem .rh{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700}
.ruleitem .rb{margin-top:6px;color:#334155;font-size:12px;line-height:1.55}
.chip{display:inline-block;margin-right:5px;padding:3px 7px;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:4px;color:#1D4ED8;font-size:10.5px;font-weight:700}
.big{font:700 34px "Fira Code",monospace;letter-spacing:-.05em}
.sig{background:#172554;color:#fff;border-color:#1E3A8A;box-shadow:8px 8px 0 #DBEAFE}
.sig:hover{border-color:#3B82F6}
.sig h3{color:#fff}.sig .ch-sub{color:#BFDBFE}
.mut{color:var(--muted);font-size:12px}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1024px){
  .layout{grid-template-columns:220px minmax(0,1fr)}
  .sidebar{padding-inline:12px}.navbtn.on:before{left:-13px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:768px){
  .layout{display:block}.sidebar{position:relative;width:100%;height:auto;padding:12px 14px}
  .brand{padding:0 0 12px}.nav{flex-direction:row;overflow-x:auto;margin-top:12px;padding-bottom:3px}
  .navbtn{width:auto;min-width:48px;min-height:44px;padding:9px 12px;white-space:nowrap}
  .navbtn.on:before{inset:auto 8px -4px;height:3px;width:auto}.navbtn small,.sidefoot{display:none}
  .main{padding:20px 16px 40px}.topbar{position:relative;margin:-20px -16px 18px;padding:18px 16px}
  .g2,.g23,.g32{grid-template-columns:1fr}.board{grid-template-columns:repeat(2,minmax(210px,1fr))}
}
@media(max-width:480px){
  .topbar{align-items:flex-start;flex-direction:column}.pill{white-space:normal}
  .g4,.g3{grid-template-columns:1fr}.board{grid-template-columns:1fr}
  .navbtn .lb{display:none}.card{padding:15px}.kpi{padding:15px 16px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}
  #view,.card:hover,.kpi:hover,.navbtn:hover,.tk:hover{transform:none!important}
}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
  <div class="brand"><div class="logo"><span class="material-symbols-outlined">fact_check</span></div><div><h1>採購申請與電子簽核</h1><p>e-Requisition &amp; Approval</p></div></div>
  <nav class="nav" id="nav" aria-label="系統功能"></nav>
  <div class="sidefoot">Jvision 系統 Demo · 純前端展示<br />模擬資料，無後端串接</div>
</aside>
<main class="main">
  <div class="topbar">
    <div><h2 id="scr-title">簽核總覽</h2><div class="sub" id="scr-sub"></div></div>
    <div class="pill"><span class="material-symbols-outlined">verified</span>單一平台 · 可操作可追蹤可稽核</div>
  </div>
  <div id="view"></div>
</main>
</div>
<script>
(function(){
"use strict";
var charts=[];
function destroyCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[]}
function el(id){return document.getElementById(id)}
function mkChart(id,opt){
  var node=el(id);if(!node)return;
  opt.chart=opt.chart||{};opt.chart.redrawOnParentResize=false;opt.chart.redrawOnWindowResize=false;
  opt.chart.animations={enabled:false};if(!opt.chart.fontFamily)opt.chart.fontFamily="Fira Sans,sans-serif";
  opt.chart.foreColor="#475569";
  var c=new ApexCharts(node,opt);c.render();charts.push(c)
}
var SCREENS=[
{icon:"dashboard",name:"簽核總覽",sub:"待辦、逾時與簽核時效即時掌握"},
{icon:"request_quote",name:"請購單建立",sub:"線上填單、品項與預算即時檢核"},
{icon:"account_tree",name:"簽核路徑判定",sub:"依金額與費用類別自動組簽核鏈"},
{icon:"fact_check",name:"逐層簽核",sub:"行動裝置逐關核准／退回與代理"},
{icon:"receipt_long",name:"核准轉採購",sub:"核准轉單、ERP 同步與交期追蹤"},
{icon:"history",name:"軌跡歸檔稽核",sub:"完整操作軌跡與稽核統計查詢"}
];
function kpi(lab,icon,val,dl,cls){return '<div class="kpi"><span class="bar"></span><div class="lab"><span class="material-symbols-outlined">'+icon+'</span>'+lab+'</div><div class="val">'+val+'</div><div class="dl '+(cls||"")+'">'+dl+'</div></div>'}
function tagFor(s){var m={"核准":"t-ok","已核准":"t-ok","進行中":"t-info","待簽核":"t-warn","逾時":"t-bad","退回":"t-bad","已轉採購":"t-ok","歸檔":"t-gray","在途":"t-info","到貨":"t-ok","延遲":"t-bad"};return '<span class="tag '+(m[s]||"t-gray")+'">'+s+'</span>'}
function ini(n){return n.slice(-2)}
function field(l,v){return '<div><div class="mut" style="font-size:11.5px">'+l+'</div><div style="font-weight:700;font-size:14px;margin-top:3px">'+v+'</div></div>'}

function s0(){
var rows=[
["PR-24081","IT 部","筆電替換 8 台","NT$ 412,000","財務長","2h","待簽核"],
["PR-24079","製造二課","治具刀具耗材","NT$ 86,500","課級主管","6h","進行中"],
["PR-24075","品保課","三次元檢測校正","NT$ 158,000","廠長","逾 1.5h","逾時"],
["PR-24071","總務課","辦公耗材季補","NT$ 23,400","課級主管","1h","進行中"],
["PR-24066","研發部","樣品快打模具","NT$ 690,000","總經理","4h","待簽核"]];
var tb=rows.map(function(r){return '<tr><td class="mono">'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td class="mono">'+r[3]+'</td><td><div class="rowflex"><span class="avatar">'+ini(r[4])+'</span>'+r[4]+'</div></td><td class="mono">'+r[5]+'</td><td>'+tagFor(r[6])+'</td></tr>'}).join("");
return '<div class="grid g4">'+

kpi("逾時簽核","hourglass_disabled","<span style='color:#dc2626'>6</span>","<span class='dn'>逾時占比 16.2%</span>","")+
kpi("平均簽核時效","timer","5.3 <small style='font-size:14px'>h</small>","<span class='up'>▼ 較上月 -42%</span>","")+
kpi("本月核准金額","payments","NT$ 4.86M","<span class='up'>▲ 已核 218 單</span>","")+
'</div><div class="grid g23" style="margin-top:14px"><div class="card chartbox"><h3>近 6 週簽核時效趨勢</h3><p class="ch-sub">平均時效（小時）與逾時占比（%）</p><div id="c0a"></div></div><div class="card"><h3>各層級待辦分布</h3><p class="ch-sub">目前卡關在哪一層</p><div id="c0b" class="chartbox"></div></div></div>'+
'<div class="card" style="margin-top:14px"><h3>需優先處理的單據</h3><p class="ch-sub">依逾時風險排序</p><div class="scroll"><table><thead><tr><th>單號</th><th>用料部門</th><th>摘要</th><th>金額</th><th>目前關卡</th><th>停留</th><th>狀態</th></tr></thead><tbody>'+tb+'</tbody></table></div></div>'
}
function s0charts(){
mkChart("c0a",{chart:{type:"line",height:300,toolbar:{show:false}},colors:["#2563EB","#EA580C"],stroke:{width:[3,3],curve:"straight",dashArray:[0,5]},series:[{name:"平均時效(h)",data:[9.2,8.1,7.4,6.6,5.9,5.3]},{name:"逾時占比(%)",data:[31,27,24,21,18,16.2]}],xaxis:{categories:["第1週","第2週","第3週","第4週","第5週","第6週"]},yaxis:[{title:{text:"小時"}},{opposite:true,title:{text:"%"}}],grid:{borderColor:"#E2E8F0"},legend:{position:"top"},dataLabels:{enabled:false}});
mkChart("c0b",{chart:{type:"bar",height:300,toolbar:{show:false}},colors:["#3B82F6"],plotOptions:{bar:{horizontal:true,borderRadius:2,barHeight:"58%"}},series:[{name:"待辦數",data:[14,11,7,3,2]}],xaxis:{categories:["課級主管","部級主管","廠長","財務長","總經理"]},dataLabels:{enabled:true},grid:{borderColor:"#E2E8F0"},tooltip:{shared:false,intersect:true}})
}

function s1(){

["A-1102","精密軸承 6204ZZ","EA","120","NT$ 85","NT$ 10,200"],

return '<div class="grid g32"><div class="card sig"><h3>預算即時檢核</h3><p class="ch-sub">科目 6110 · 生產耗材</p><div class="big">78.4%</div><div class="mut" style="color:#bfdbfe">本季預算已用</div><div class="bars" style="height:12px;margin:14px 0 6px;background:rgba(255,255,255,.18)"><i style="width:78.4%;background:#60a5fa"></i></div><div style="display:flex;justify-content:space-between;font-size:12px;color:#dbeafe"><span>已用 NT$ 1.88M</span><span>餘額 NT$ 517K</span></div><div style="margin-top:16px;font-size:12.5px;color:#eff6ff;line-height:1.8"><span class="material-symbols-outlined" style="font-size:16px;vertical-align:-3px">check_circle</span> 本單合計 NT$ 36,300<br /><span class="material-symbols-outlined" style="font-size:16px;vertical-align:-3px">verified</span> 未超出剩餘預算，可送簽</div></div>'+
'<div class="card"><h3>請購單表頭</h3><p class="ch-sub">PR-24082（草稿）</p><div class="grid g2" style="gap:12px">'+field("用料部門","製造二課")+field("需求日期","2026-08-22")+field("費用類別","生產耗材")+field("預算科目","6110")+field("交貨地點","一廠 3F 倉儲")+field("急件","否")+'</div><div style="margin-top:14px" class="mut"><span class="chip">必填檢核 6/6</span><span class="chip">品項 4</span><span class="chip">合計 NT$ 36,300</span></div></div></div>'+
'<div class="card" style="margin-top:14px"><h3>請購品項明細</h3><p class="ch-sub">系統帶入料號主檔單價與部門</p><div class="scroll"><table><thead><tr><th>料號</th><th>品名</th><th>單位</th><th>數量</th><th>單價</th><th>小計</th></tr></thead><tbody>'+tr+'<tr><td colspan="5" style="text-align:right;font-weight:700">合計</td><td class="mono" style="font-weight:700">NT$ 36,300</td></tr></tbody></table></div></div>'

function s1charts(){}
