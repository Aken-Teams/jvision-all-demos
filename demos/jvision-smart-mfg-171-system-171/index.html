<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>採購申請與電子簽核系統｜Jvision 系統 Demo</title>
<meta name="description" content="線上請購、動態簽核路徑、逐層電子簽核到軌跡歸檔的單一平台" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#6d28d9;--accent2:#8b5cf6;--ink:#1e1b2e;--muted:#6b6684;
  --line:#eae7f4;--bg:#f5f3fb;--card:#ffffff;--ok:#16a34a;--warn:#f59e0b;--bad:#dc2626;
  --sb:#221a3a;--sb2:#2e2350;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.layout{display:flex;min-height:100vh;align-items:stretch}
.sidebar{width:250px;flex:0 0 250px;background:linear-gradient(185deg,var(--sb),var(--sb2));color:#e8e4f5;display:flex;flex-direction:column;padding:22px 16px;min-width:0}
.brand{display:flex;gap:12px;align-items:center;padding:6px 8px 18px}
.brand .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 16px rgba(109,40,217,.4);flex:0 0 auto}
.brand .logo .material-symbols-outlined{font-size:24px}
.brand h1{font-size:15px;margin:0;font-weight:800;line-height:1.3}
.brand p{margin:2px 0 0;font-size:11px;color:#a99fd0}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.navbtn{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;border:0;background:transparent;color:#c8c1e6;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;text-align:left;width:100%;transition:.15s;min-width:0}
.navbtn .material-symbols-outlined{font-size:21px;flex:0 0 auto}
.navbtn small{display:block;font-size:10.5px;color:#8f86b8;font-weight:500;margin-top:1px}
.navbtn:hover{background:rgba(255,255,255,.06);color:#fff}
.navbtn.on{background:linear-gradient(120deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 18px rgba(109,40,217,.4)}
.navbtn.on small{color:#e4dcff}
.sidefoot{margin-top:auto;padding:14px 10px 4px;font-size:11px;color:#8f86b8;border-top:1px solid rgba(255,255,255,.08)}
.main{flex:1 1 auto;min-width:0;padding:26px 30px 46px}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.topbar h2{margin:0;font-size:22px;font-weight:800}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:6px;background:#efe9fd;color:var(--accent);font-size:12px;font-weight:700;padding:6px 12px;border-radius:99px}
.pill .material-symbols-outlined{font-size:16px}
.grid{display:grid;gap:16px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:1.6fr 1fr}
.g32{grid-template-columns:1fr 1.5fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;box-shadow:0 1px 2px rgba(30,27,46,.04)}
.card h3{margin:0 0 3px;font-size:14.5px;font-weight:700}
.card .ch-sub{color:var(--muted);font-size:12px;margin:0 0 12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0;position:relative;overflow:hidden}
.kpi .lab{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--accent)}
.kpi .val{font-size:27px;font-weight:800;margin:8px 0 2px;letter-spacing:-.5px}
.kpi .dl{font-size:11.5px;font-weight:700}
.up{color:var(--ok)}.dn{color:var(--bad)}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(var(--accent),var(--accent2))}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#faf8ff}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.t-ok{background:#dcfce7;color:#15803d}
.t-warn{background:#fef3c7;color:#b45309}
.t-bad{background:#fee2e2;color:#b91c1c}
.t-info{background:#ede9fe;color:#6d28d9}
.t-gray{background:#eef0f4;color:#5b6473}
.mono{font-variant-numeric:tabular-nums;font-family:"Inter",monospace}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.chartbox{overflow:hidden;min-width:0}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex:0 0 auto}
.rowflex{display:flex;align-items:center;gap:9px;min-width:0}
.bars{height:8px;border-radius:99px;background:#eee9f8;overflow:hidden;min-width:60px}
.bars > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
/* board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;min-width:0}
.col{background:#faf9ff;border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.col h4{margin:0 0 10px;font-size:12.5px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.col h4 span{background:#fff;border:1px solid var(--line);border-radius:99px;font-size:11px;padding:1px 8px;color:var(--muted)}
.tk{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(30,27,46,.05)}
.tk .no{font-size:11px;color:var(--accent);font-weight:800}
.tk .ti{font-size:12.5px;font-weight:600;margin:3px 0 6px;line-height:1.4}
.tk .me{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
/* timeline / path */
.path{list-style:none;margin:0;padding:0}
.path li{position:relative;padding:0 0 20px 34px}
.path li::before{content:"";position:absolute;left:11px;top:22px;bottom:-2px;width:2px;background:var(--line)}
.path li:last-child::before{display:none}
.node{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;background:var(--accent)}
.node.g{background:var(--ok)}.node.a{background:var(--warn)}.node.p{background:#c4bcdf}
.path .pt{font-weight:700;font-size:13.5px}
.path .pm{font-size:11.5px;color:var(--muted);margin-top:2px}
.step{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:0 0 auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.ruleitem{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#faf9ff}
.ruleitem .rh{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px}
.ruleitem .rb{font-size:12.5px;color:#40384f;margin-top:6px;line-height:1.6}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:#ede9fe;color:var(--accent);margin-right:6px}
.big{font-size:34px;font-weight:800;letter-spacing:-1px}
.sig{background:linear-gradient(135deg,#2e2350,#4c2a86);color:#fff;border:0}
.sig h3{color:#fff}
.sig .ch-sub{color:#c9bff0}
.split{display:flex;gap:8px;align-items:baseline}
.mut{color:var(--muted);font-size:12px}
.hb{display:none}
@media(max-width:860px){
  .layout{flex-direction:column}
  .sidebar{width:100%;flex:0 0 auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px;gap:8px}
  .brand{padding:0;margin-right:auto}
  .nav{flex-direction:row;flex-wrap:wrap;margin-top:0;gap:6px;width:100%}
  .navbtn{width:auto;flex:0 0 auto;padding:9px 12px}
  .navbtn small{display:none}
  .sidefoot{display:none}
  .main{padding:20px 16px 40px}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .board{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){
  .navbtn span.lb{display:none}
  .navbtn{padding:9px 11px}
  .board{grid-template-columns:1fr}
  .topbar h2{font-size:19px}
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">fact_check</span></div>
      <div>
        <h1>採購申請與電子簽核</h1>
        <p>e-Requisition &amp; Approval</p>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">
      Jvision 系統 Demo · 純前端展示<br/>模擬資料，無後端串接
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h2 id="scr-title">簽核總覽</h2>
        <div class="sub" id="scr-sub"></div>
      </div>
      <div class="pill"><span class="material-symbols-outlined">verified</span>單一平台 · 可操作可追蹤可稽核</div>
    </div>
    <div id="view"></div>
  </main>
</div>
<script>
(function(){
"use strict";
var charts=[];
function destroyCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function el(id){return document.getElementById(id);}
function mkChart(id,opt){var node=el(id);if(!node)return;opt.chart=opt.chart||{};opt.chart.redrawOnParentResize=false;opt.chart.redrawOnWindowResize=false;opt.chart.animations={enabled:false};if(!opt.chart.fontFamily)opt.chart.fontFamily="Inter,Noto Sans TC,sans-serif";var c=new ApexCharts(node,opt);c.render();charts.push(c);}

var SCREENS=[
  {icon:"dashboard",name:"簽核總覽",sub:"待辦、逾時與簽核時效即時掌握"},
  {icon:"request_quote",name:"請購單建立",sub:"線上填單、品項與預算即時檢核"},
  {icon:"account_tree",name:"簽核路徑判定",sub:"依金額與費用類別自動組簽核鏈"},
  {icon:"fact_check",name:"逐層簽核",sub:"行動裝置逐關核准／退回與代理"},
  {icon:"receipt_long",name:"核准轉採購",sub:"核准轉單、ERP 同步與交期追蹤"},
  {icon:"history",name:"軌跡歸檔稽核",sub:"完整操作軌跡與稽核統計查詢"}
];

/* ---------- render helpers ---------- */
function kpi(lab,icon,val,dl,cls){return '<div class="kpi"><span class="bar"></span><div class="lab"><span class="material-symbols-outlined">'+icon+'</span>'+lab+'</div><div class="val">'+val+'</div><div class="dl '+(cls||"")+'">'+dl+'</div></div>';}
function tagFor(s){var m={"核准":"t-ok","已核准":"t-ok","進行中":"t-info","待簽核":"t-warn","逾時":"t-bad","退回":"t-bad","已轉採購":"t-ok","歸檔":"t-gray","在途":"t-info","到貨":"t-ok","延遲":"t-bad"};return '<span class="tag '+(m[s]||"t-gray")+'">'+s+'</span>';}
function ini(n){return n.slice(-2);}

/* ---------- SCREEN 0 : 簽核總覽 ---------- */
function s0(){
  var rows=[
    ["PR-24081","IT 部","筆電替換 8 台","NT$ 412,000","財務長","2h","待簽核"],
    ["PR-24079","製造二課","治具刀具耗材","NT$ 86,500","課級主管","6h","進行中"],
    ["PR-24075","品保課","三次元檢測校正","NT$ 158,000","廠長","逾 1.5h","逾時"],
    ["PR-24071","總務課","辦公耗材季補","NT$ 23,400","課級主管","1h","進行中"],
    ["PR-24066","研發部","樣品快打模具","NT$ 690,000","總經理","4h","待簽核"]
  ];
  var tb=rows.map(function(r){return '<tr><td class="mono">'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td class="mono">'+r[3]+'</td><td><div class="rowflex"><span class="avatar">'+ini(r[4])+'</span>'+r[4]+'</div></td><td class="mono">'+r[5]+'</td><td>'+tagFor(r[6])+'</td></tr>';}).join("");
  return ''+
  '<div class="grid g4">'+
    kpi("待簽核單據","pending_actions","37","<span class=\'up\'>▲ 今日新增 12</span>","")+
    kpi("逾時簽核","hourglass_disabled","<span style=\'color:#dc2626\'>6</span>","<span class=\'dn\'>逾時占比 16.2%</span>","")+
    kpi("平均簽核時效","timer","5.3 <small style=\'font-size:14px\'>h</small>","<span class=\'up\'>▼ 較上月 -42%</span>","")+
    kpi("本月核准金額","payments","NT$ 4.86M","<span class=\'up\'>▲ 已核 218 單</span>","")+
  '</div>'+
  '<div class="grid g23" style="margin-top:16px">'+
    '<div class="card chartbox"><h3>近 6 週簽核時效趨勢</h3><p class="ch-sub">平均時效（小時）與逾時占比（%）</p><div id="c0a"></div></div>'+
    '<div class="card"><h3>各層級待辦分布</h3><p class="ch-sub">目前卡關在哪一層</p><div id="c0b" class="chartbox"></div></div>'+
  '</div>'+
  '<div class="card" style="margin-top:16px"><h3>需優先處理的單據</h3><p class="ch-sub">依逾時風險排序</p>'+
    '<div class="scroll"><table><thead><tr><th>單號</th><th>用料部門</th><th>摘要</th><th>金額</th><th>目前關卡</th><th>停留</th><th>狀態</th></tr></thead><tbody>'+tb+'</tbody></table></div></div>';
}
function s0charts(){
  mkChart("c0a",{chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"line",height:300,toolbar:{show:false}},colors:["#6d28d9","#f59e0b"],stroke:{width:[3,3],curve:"smooth",dashArray:[0,5]},series:[{name:"平均時效(h)",data:[9.2,8.1,7.4,6.6,5.9,5.3]},{name:"逾時占比(%)",data:[31,27,24,21,18,16.2]}],xaxis:{categories:["第1週","第2週","第3週","第4週","第5週","第6週"]},yaxis:[{title:{text:"小時"},labels:{style:{fontSize:"11px"}}},{opposite:true,title:{text:"%"},labels:{style:{fontSize:"11px"}}}],grid:{borderColor:"#eee"},legend:{position:"top"},dataLabels:{enabled:false}});
  mkChart("c0b",{chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"bar",height:300,toolbar:{show:false}},colors:["#8b5cf6"],plotOptions:{bar:{horizontal:true,borderRadius:5,barHeight:"58%"}},series:[{name:"待辦數",data:[14,11,7,3,2]}],xaxis:{categories:["課級主管","部級主管","廠長","財務長","總經理"]},dataLabels:{enabled:true},grid:{borderColor:"#eee"},tooltip:{shared:false,intersect:true}});
}

/* ---------- SCREEN 1 : 請購單建立 ---------- */
function s1(){
  var items=[
    ["A-1102","精密軸承 6204ZZ","EA","120","NT$ 85","NT$ 10,200","製造二課"],
    ["A-2071","切削油 CX-40","桶","6","NT$ 1,250","NT$ 7,500","製造二課"],
    ["B-0044","治具定位銷","組","30","NT$ 340","NT$ 10,200","製造二課"],
    ["C-9910","無塵手套 M","盒","40","NT$ 210","NT$ 8,400","製造二課"]
  ];
  var tr=items.map(function(r){return '<tr><td class="mono">'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td class="mono">'+r[3]+'</td><td class="mono">'+r[4]+'</td><td class="mono">'+r[5]+'</td></tr>';}).join("");
  return ''+
  '<div class="grid g32">'+
    '<div class="card sig">'+
      '<h3>預算即時檢核</h3><p class="ch-sub">科目 6110 · 生產耗材</p>'+
      '<div class="big">78.4%</div><div class="mut" style="color:#c9bff0">本季預算已用</div>'+
      '<div class="bars" style="height:12px;margin:14px 0 6px;background:rgba(255,255,255,.18)"><i style="width:78.4%"></i></div>'+
      '<div style="display:flex;justify-content:space-between;font-size:12px;color:#d9d1f5"><span>已用 NT$ 1.88M</span><span>餘額 NT$ 517K</span></div>'+
      '<div style="margin-top:16px;font-size:12.5px;color:#e6dffa;line-height:1.7"><span class="material-symbols-outlined" style="font-size:16px;vertical-align:-3px">check_circle</span> 本單合計 NT$ 36,300 <br/><span class="material-symbols-outlined" style="font-size:16px;vertical-align:-3px">verified</span> 未超出剩餘預算，可送簽</div>'+
    '</div>'+
    '<div class="card">'+
      '<h3>請購單表頭</h3><p class="ch-sub">PR-24082（草稿）</p>'+
      '<div class="grid g2" style="gap:12px">'+
        field("用料部門","製造二課")+field("需求日期","2026-08-22")+
        field("費用類別","生產耗材")+field("預算科目","6110")+
        field("交貨地點","一廠 3F 倉儲")+field("急件","否")+
      '</div>'+
      '<div style="margin-top:14px" class="mut"><span class="chip">必填檢核 6/6</span><span class="chip">品項 4</span><span class="chip">合計 NT$ 36,300</span></div>'+
    '</div>'+
  '</div>'+
  '<div class="card" style="margin-top:16px"><h3>請購品項明細</h3><p class="ch-sub">系統帶入料號主檔單價與部門</p>'+
    '<div class="scroll"><table><thead><tr><th>料號</th><th>品名</th><th>單位</th><th>數量</th><th>單價</th><th>小計</th></tr></thead><tbody>'+tr+
    '<tr><td colspan="5" style="text-align:right;font-weight:800">合計</td><td class="mono" style="font-weight:800">NT$ 36,300</td></tr></tbody></table></div></div>';
}
function field(l,v){return '<div><div class="mut" style="font-size:11.5px">'+l+'</div><div style="font-weight:700;font-size:14px;margin-top:3px">'+v+'</div></div>';}
function s1charts(){}

/* ---------- SCREEN 2 : 簽核路徑判定 ---------- */
function s2(){
  var levels=[
    ["請購人","製造二課 陳建宏","g","已提交","done"],
    ["課級主管","王秀英","g","金額<10萬自動核","done"],
    ["部級主管","李國樑","a","金額 10~50 萬須核","now"],
    ["廠長","張美玲","p","金額>50萬須核","wait"],
    ["財務長","黃志偉","p","跨科目／急件須核","wait"]
  ];

var RENDER=[[s0,s0charts],[s1,s1charts],[s2,s2charts],[s3,s3charts],[s4,s4charts],[s5,s5charts]];

/* build nav */
(function(){
  var nav=el("nav"),h="";
  for(var i=0;i<SCREENS.length;i++){h+='<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+SCREENS[i].icon+'</span><span class="lb">'+SCREENS[i].name+'<small>'+SCREENS[i].sub+'</small></span></button>';}
  nav.innerHTML=h;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){btns[j].addEventListener("click",function(){show(+this.getAttribute("data-i"));try{window.scrollTo(0,0);}catch(e){}});}
})();

function show(i){
  destroyCharts();
  var sc=SCREENS[i]||SCREENS[0];
  el("scr-title").textContent=sc.name;
  el("scr-sub").textContent=sc.sub;
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].className="navbtn"+(+btns[b].getAttribute("data-i")===i?" on":"");}
  var container=el("view");
  container.innerHTML=RENDER[i][0]();
  void container.offsetHeight;
  RENDER[i][1]();
}
window.show=show;

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
})();
