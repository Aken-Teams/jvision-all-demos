<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>專利地圖與技術情報分析 · PLM 研發管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700;800&family=Roboto+Mono:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700;800&family=Roboto+Mono:wght@300;400;500;600;700&display=swap');

:root{
  --color-primary:#15803D;
  --color-on-primary:#FFFFFF;
  --color-secondary:#22C55E;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDF4;
  --color-foreground:#14532D;
  --color-card:#FFFFFF;
  --color-card-foreground:#14532D;
  --color-muted:#E8F0F1;
  --color-muted-foreground:#475569;
  --color-border:#86D8A4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#15803D;

  --blue:#15803D;
  --ink:#14532D;
  --muted:#475569;
  --line:#86D8A4;

  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --accent-soft:#DCFCE7;
  --accent-soft2:#BBF7D0;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --th:#DDF7E5;
  --hov:#ECFDF3;
  --track:#D1E9DA;
  --sidebar:#052E16;
  --sidebar2:#14532D;
  --side-edge:#22C55E;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#B91C1C;
  --info:#0369A1;
  --r:0px;
  --glow:rgba(20,83,45,.18);
  --shadow:6px 6px 0 #14532D;
}

*{box-sizing:border-box}
html{scroll-behavior:auto;background:var(--bg)}
html,body{margin:0;padding:0;min-width:320px}
body{
  font-family:"Exo","Noto Sans TC",sans-serif;
  background-color:var(--bg);
  background-image:
    linear-gradient(rgba(21,128,61,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(21,128,61,.08) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  font-size:14px;
  line-height:1.5;
}
button,input,select,textarea{font:inherit}
button,[role="button"],a{cursor:pointer}
h1,h2,h3,h4{
  margin:0;
  font-family:"Exo","Noto Sans TC",sans-serif;
  font-weight:800;
  letter-spacing:.01em;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus{outline:none}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
  box-shadow:0 0 0 2px var(--color-card);
}
::selection{background:var(--color-secondary);color:var(--color-on-secondary)}

.app{display:flex;min-height:100vh;align-items:stretch}
.sidebar{
  width:264px;
  flex:none;
  min-width:0;
  background:var(--sidebar);
  color:#F0FDF4;
  display:flex;
  flex-direction:column;
  padding:0;
  position:sticky;
  top:0;
  height:100vh;
  border-right:4px solid var(--color-primary);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  padding:20px 16px;
  background:var(--color-secondary);
  color:var(--color-on-secondary);
  border-bottom:4px solid #052E16;
}
.brand-logo{
  width:46px;
  height:46px;
  flex:none;
  border:3px solid #052E16;
  border-radius:0;
  background:var(--color-card);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--color-primary);
  box-shadow:4px 4px 0 #052E16;
}
.brand-logo .material-symbols-outlined{font-size:27px}
.brand-txt{min-width:0}
.brand-txt b{
  display:block;
  font-family:"Exo","Noto Sans TC",sans-serif;
  font-weight:900;
  font-size:16px;
  letter-spacing:.02em;
}
.brand-txt span{
  display:block;
  margin-top:2px;
  font-family:"Roboto Mono",monospace;
  font-size:9px;
  font-weight:700;
  letter-spacing:.12em;
  color:#14532D;
}
.nav{display:flex;flex-direction:column;gap:0;margin-top:16px;min-width:0;border-top:1px solid #3F7651}
.nav button{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  min-width:0;
  min-height:50px;
  margin:0;
  padding:12px 16px;
  background:transparent;
  border:0;
  border-bottom:1px solid #3F7651;
  border-radius:0;
  color:#D1FAE5;
  text-align:left;
  font-family:"Exo","Noto Sans TC",sans-serif;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
  transition:background-color .18s ease,color .18s ease,transform .18s ease;
}
.nav button .material-symbols-outlined{font-size:21px;flex:none;color:#86EFAC}
.nav button:hover{background:#166534;color:#FFFFFF;transform:translateX(4px)}
.nav button:hover .material-symbols-outlined{color:#FFFFFF}
.nav button.on{
  background:var(--color-accent);
  color:var(--color-on-accent);
  box-shadow:inset 8px 0 0 #FDE68A;
}
.nav button.on .material-symbols-outlined{color:#000000}
.nav .idx{
  margin-left:auto;
  font-family:"Roboto Mono",monospace;
  font-size:10px;
  color:inherit;
  opacity:.85;
  font-weight:700;
}
.side-foot{
  margin-top:auto;
  padding:16px;
  border-top:4px solid var(--color-secondary);
  background:#021F0D;
  font-family:"Roboto Mono",monospace;
  font-size:10px;
  color:#BBF7D0;
  line-height:1.8;
}
.side-foot b{color:#FFFFFF}

.main{flex:1;min-width:0;padding:28px 30px 64px;overflow:hidden}
.topbar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:18px;
  margin-bottom:24px;
  padding:18px 20px;
  background:var(--color-card);
  border:3px solid var(--ink);
  box-shadow:var(--shadow);
  flex-wrap:wrap;
}
.topbar h1{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:clamp(20px,2vw,28px);
  line-height:1.2;
  text-transform:uppercase;
}
.topbar h1 .material-symbols-outlined{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border:2px solid var(--ink);
  font-size:24px;
}
.topbar .sub{font-size:12px;color:var(--muted);margin-top:8px;font-weight:600}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:9px;flex-wrap:wrap}
.chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:36px;
  background:var(--color-muted);
  border:2px solid var(--ink);
  border-radius:0;
  padding:6px 10px;
  font-size:11px;
  font-weight:700;
  color:var(--ink);
}
.chip .dot{
  width:9px;
  height:9px;
  border-radius:0;
  background:var(--ok);
  border:1px solid #052E16;
  box-shadow:none;
  animation:pulse 2s steps(2,end) infinite;
}
.avatar{
  width:38px;
  height:38px;
  border:2px solid var(--ink);
  border-radius:0;
  background:var(--color-accent);
  color:#000000;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Roboto Mono",monospace;
  font-weight:800;
  font-size:13px;
  flex:none;
  box-shadow:3px 3px 0 var(--ink);
}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec{
  min-width:0;
  padding:18px;
  background:var(--panel);
  border:2px solid var(--ink);
  border-radius:0;
  box-shadow:4px 4px 0 var(--line);
}
.sec{margin-bottom:16px}
.sec>h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:14px;
  padding-bottom:10px;
  border-bottom:2px solid var(--ink);
  font-size:15px;
  font-weight:800;
}
.sec>h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.sec>p{margin:0 0 14px;font-size:13px;color:var(--muted);line-height:1.8}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;font-size:13px;margin:0}
.dl dt{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase}
.dl dd{margin:0;line-height:1.8}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:14px;
  padding-bottom:10px;
  border-bottom:2px solid var(--ink);
  flex-wrap:wrap;
}
.card.pad0>.card-h,.card.p0>.card-h{border-bottom:2px solid var(--ink)}
.card-h h3{display:flex;align-items:center;gap:8px;min-width:0;font-size:15px;font-weight:800}
.card-h h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.card-h .hint{
  padding:3px 7px;
  background:var(--color-muted);
  border:1px solid var(--line);
  font-family:"Roboto Mono",monospace;
  font-size:10px;
  color:var(--muted);
  font-weight:600;
}

.kpi,.stat{
  position:relative;
  overflow:hidden;
  min-width:0;
  padding:16px;
  background:var(--panel);
  border:2px solid var(--ink);
  border-radius:0;
  box-shadow:4px 4px 0 var(--line);
}
.kpi::before,.stat::before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:7px;
  background:var(--color-secondary);
}
.kpi::after{content:"DATA";position:absolute;right:8px;top:7px;font-family:"Roboto Mono",monospace;font-size:9px;font-weight:700;color:#78A989;letter-spacing:.1em}
.kpi .ico{
  position:relative;
  z-index:1;
  width:38px;
  height:38px;
  border:2px solid var(--ink);
  border-radius:0;
  background:var(--accent-soft);
  color:var(--accent);
  display:flex;
  align-items:center;
  justify-content:center;
}
.kpi .ico .material-symbols-outlined{font-size:21px}
.kpi .lbl,.stat .lbl{display:flex;align-items:center;gap:5px;margin-top:11px;font-size:11px;color:var(--muted);font-weight:700}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{font-size:15px;color:var(--accent)}
.kpi .val,.stat .val{
  margin-top:3px;
  font-family:"Roboto Mono",monospace;
  font-size:clamp(24px,2.4vw,31px);
  font-weight:700;
  letter-spacing:-.04em;
  line-height:1.2;
  font-variant-numeric:tabular-nums;
}
.kpi .val small,.stat .val small{margin-left:4px;font-size:12px;font-weight:700;color:var(--muted)}
.kpi .delta,.stat .d{display:inline-flex;align-items:center;gap:3px;margin-top:7px;font-size:11px;font-weight:800}
.delta.up,.d.up{color:#166534}
.delta.down,.d.down{color:#B91C1C}
.delta.flat,.d.flat{color:#475569}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:15px}

table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;font-variant-numeric:tabular-nums}
th{
  padding:11px 13px;
  background:#14532D;
  border-right:1px solid #4ADE80;
  border-bottom:3px solid #052E16;
  color:#FFFFFF;
  text-align:left;
  font-size:10px;
  font-weight:800;
  letter-spacing:.06em;
  white-space:nowrap;
  text-transform:none;
}
th:last-child{border-right:0}
td{
  padding:11px 13px;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  background:#FFFFFF;
  color:#173E27;
  white-space:nowrap;
  vertical-align:middle;
}
td:last-child{border-right:0}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even) td{background:#F4FBF6}
tbody tr:hover td{background:#DCFCE7}
td:nth-child(n+2){font-variant-numeric:tabular-nums}
td:has(> b:only-child),td:has(> .prog:only-child){text-align:right}
.mono{
  font-family:"Roboto Mono",monospace;
  font-weight:600;
  letter-spacing:0;
  font-variant-numeric:tabular-nums;
}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  min-height:24px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:0;
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
}
.tag::before{content:"";width:6px;height:6px;background:currentColor;flex:none}
.t-ok{background:#DCFCE7;color:#166534}
.t-warn{background:#FEF3C7;color:#92400E}
.t-bad{background:#FEE2E2;color:#991B1B}
.t-info{background:#E0F2FE;color:#075985}
.t-gray{background:#E8F0F1;color:#475569}
.t-acc,.t-pink{background:#DCFCE7;color:#166534}

.bar{height:10px;min-width:56px;overflow:hidden;background:var(--track);border:1px solid #78A989;border-radius:0}
.bar>i{display:block;height:100%;border-radius:0;background:repeating-linear-gradient(135deg,var(--accent),var(--accent) 6px,var(--color-secondary) 6px,var(--color-secondary) 12px)}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{width:40px;flex:none;text-align:right;font-family:"Roboto Mono",monospace;font-size:10px;color:var(--muted);font-weight:700}

.tl{position:relative;padding-left:28px}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:3px;background:var(--ink)}
.tl-item,.tl-i{position:relative;padding:0 0 18px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;left:-27px;top:2px;width:17px;height:17px;border:3px solid var(--accent);border-radius:0;background:#FFFFFF}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn);background:#FEF3C7}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad);background:#FEE2E2}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok);background:#DCFCE7}
.tl-time,.tl-t{font-family:"Roboto Mono",monospace;font-size:10px;color:var(--muted);font-weight:700}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:12px;font-weight:800}
.tl-item p,.tl-i p{margin:0;font-size:11px;color:var(--muted)}

.chk{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px dashed #78A989;font-size:12px}
.chk:last-child{border-bottom:0}
.chk .material-symbols-outlined{font-size:20px}
.chk .ok{color:var(--ok)}
.chk .wait{color:var(--muted)}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0;font-weight:600}
.chk small{font-family:"Roboto Mono",monospace;color:var(--muted);font-size:10px}
.note{margin-top:13px;padding:12px;background:var(--color-muted);border-left:5px solid var(--color-accent);font-size:11px;color:var(--muted);line-height:1.7}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.board>*{min-width:0}
.col{display:flex;flex-direction:column;gap:9px;padding:11px;background:var(--th);border:2px solid var(--ink);border-radius:0}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 7px;border-bottom:2px solid var(--ink);font-size:12px;font-weight:800}
.col-h .cnt{padding:1px 7px;background:#FFFFFF;border:1px solid var(--ink);border-radius:0;font-family:"Roboto Mono",monospace;font-size:10px;color:var(--ink)}
.pcard{padding:11px;background:#FFFFFF;border:2px solid var(--ink);border-left:7px solid var(--accent);border-radius:0;box-shadow:3px 3px 0 var(--line)}
.pcard b{font-size:12px;font-weight:800}
.pcard .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:5px;font-family:"Roboto Mono",monospace;font-size:10px;color:var(--muted)}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:10px;color:var(--ink)}
.mini-av{width:20px;height:20px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);border:1px solid var(--ink);border-radius:0;color:var(--accent);font-family:"Roboto Mono",monospace;font-size:8px;font-weight:800}

.lane{display:flex;flex-direction:column;gap:11px}
.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 14px;background:#FFFFFF;border:2px solid var(--ink);border-radius:0;box-shadow:3px 3px 0 var(--line)}
.lane-row .num{width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--color-secondary);border:2px solid var(--ink);border-radius:0;color:#052E16;font-family:"Roboto Mono",monospace;font-weight:800;font-size:12px}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:13px;font-weight:800}
.lane-row .body p{margin:2px 0 0;font-size:11px;color:var(--muted)}
.steps{display:flex;align-items:center;flex:none}
.steps .s{width:24px;height:24px;z-index:1;display:flex;align-items:center;justify-content:center;background:#FFFFFF;border:2px solid #64748B;border-radius:0;color:#475569;font-family:"Roboto Mono",monospace;font-size:10px}
.steps .ln{width:20px;height:3px;background:#94A3B8}
.steps .s.done{background:var(--accent);border-color:#052E16;color:#FFFFFF}
.steps .s.cur{border:3px solid var(--color-accent);color:#7C2D12;animation:pulse 1.6s steps(2,end) infinite}
.steps .ln.done{background:var(--accent)}

.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 4px;border-bottom:1px dashed #78A989}
.rep-row:last-child{border-bottom:0}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:12px;font-weight:800}
.rep-row .sku span{font-family:"Roboto Mono",monospace;font-size:10px;color:var(--muted)}
.gauge{width:110px;flex:none}
.gauge .track{position:relative;height:9px;overflow:hidden;background:var(--track);border:1px solid #78A989;border-radius:0}
.gauge .track i{display:block;height:100%;border-radius:0;background:var(--accent)}
.gauge small{display:block;margin-top:3px;text-align:right;font-family:"Roboto Mono",monospace;font-size:9px;color:var(--muted)}
.band{position:relative;height:28px;min-width:150px;background:var(--track);border:1px solid #78A989;border-radius:0}
.band .rng{position:absolute;top:0;bottom:0;border-radius:0;background:var(--accent-soft)}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--muted)}
.band .me{position:absolute;top:3px;width:12px;height:20px;border-radius:0;background:var(--accent);border:1px solid #052E16;box-shadow:none}

.tile{
  position:relative;
  display:flex;
  flex-direction:column;
  gap:8px;
  min-width:0;
  min-height:162px;
  padding:16px 17px;
  overflow:hidden;
  background:var(--panel);
  border:2px solid var(--ink);
  border-radius:0;
  box-shadow:5px 5px 0 var(--line);
}
.tile::after{
  content:"";
  position:absolute;
  right:-24px;
  bottom:-24px;
  width:72px;
  height:72px;
  border:12px solid var(--accent-soft2);
  transform:rotate(45deg);
}
.tile:nth-child(even){transform:translateY(8px)}
.tile:nth-child(3n){border-top:8px solid var(--color-accent)}
.tile .ti{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);border:2px solid var(--ink);border-radius:0;color:var(--accent)}
.tile .ti .material-symbols-outlined{font-size:22px}
.tile b{font-size:13px;font-weight:800;text-transform:uppercase}
.tile p{position:relative;z-index:1;margin:0;font-size:11px;color:var(--muted);line-height:1.6}
.tile .tv{position:relative;z-index:1;font-family:"Roboto Mono",monospace;font-size:25px;font-weight:700;letter-spacing:-.05em;font-variant-numeric:tabular-nums}

function buildNav(){var n=document.getElementById("nav");
 n.innerHTML=MODULES.map(function(m,i){return '<button type="button" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'}).join("");
 Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})})}
function show(i){killCharts();var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i)});
 RENDER[i](document.getElementById("screen"))}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?Math.min(+m[1],MODULES.length-1):0);try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
