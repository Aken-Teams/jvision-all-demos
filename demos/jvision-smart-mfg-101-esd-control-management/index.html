<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ESD Control Management（靜電防護管理）｜Jvision 系統 Demo</title>
  <meta name="description" content="靜電防護點檢、阻值監測、異常警報與 S20.20 合規稽核" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --accent:#e11d48; --accent2:#fb7185; --accent-soft:#fff1f3;
      --ink:#1f2430; --muted:#697086; --line:#eef0f4; --bg:#f6f7f9; --card:#ffffff;
      --ok:#16a34a; --warn:#f59e0b; --bad:#e11d48; --info:#2563eb;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
    .ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
    .shell{max-width:1360px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
    /* topbar */
    .topbar{display:flex;align-items:center;gap:14px;padding:14px 20px;background:linear-gradient(100deg,#e11d48,#fb7185);color:#fff;}
    .brand{display:flex;align-items:center;gap:11px;min-width:0;}
    .brand .logo{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:23px;flex:0 0 auto;}
    .brand h1{font-size:16px;margin:0;font-weight:800;line-height:1.25;}
    .brand p{margin:2px 0 0;font-size:12px;opacity:.9;font-weight:500;}
    .topbar .spacer{flex:1;}
    .badge-live{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;}
    .dot{width:8px;height:8px;border-radius:50%;background:#bbf7d0;box-shadow:0 0 0 3px rgba(187,247,208,.3);}
    /* nav */
    nav{display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;}
    nav button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;color:var(--muted);
      padding:9px 14px;border-radius:11px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;min-width:0;}
    nav button .ms{font-size:19px;}
    nav button:hover{border-color:var(--accent2);color:var(--accent);}
    nav button.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(225,29,72,.28);}
    main{flex:1;padding:22px 20px 40px;}
    .screen-head{margin:0 0 18px;}
    .screen-head h2{margin:0;font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px;}
    .screen-head h2 .ms{color:var(--accent);font-size:24px;}
    .screen-head p{margin:6px 0 0;color:var(--muted);font-size:13px;}
    /* KPI */
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
    .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;position:relative;overflow:hidden;}
    .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);}
    .kpi .lab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;}
    .kpi .lab .ms{font-size:17px;color:var(--accent);}
    .kpi .val{font-size:27px;font-weight:900;margin-top:8px;letter-spacing:-.5px;}
    .kpi .val small{font-size:13px;font-weight:700;color:var(--muted);margin-left:3px;}
    .kpi .sub{font-size:11.5px;margin-top:5px;font-weight:600;}
    .up{color:var(--ok);} .down{color:var(--bad);}
    /* split workspace */
    .split{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start;}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0;}
    .card-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;}
    .card-h .ms{color:var(--accent);font-size:20px;}
    .card-h .tag{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted);background:var(--bg);padding:4px 9px;border-radius:999px;}
    .card-b{padding:16px;}
    /* list pane */
    .lst{display:flex;flex-direction:column;}
    .lrow{display:flex;align-items:center;gap:11px;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s;min-width:0;}
    .lrow:last-child{border-bottom:0;}
    .lrow:hover{background:var(--accent-soft);}
    .lrow.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent);}
    .lrow .ico{width:36px;height:36px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--accent);}
    .lrow .ico .ms{font-size:20px;}
    .lrow .txt{min-width:0;flex:1;}
    .lrow .txt .t{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .lrow .txt .s{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    /* pills */
    .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;}
    .p-ok{background:#e7f6ec;color:var(--ok);}
    .p-warn{background:#fef3e2;color:#b45309;}
    .p-bad{background:#fde8ec;color:var(--bad);}
    .p-info{background:#e6effe;color:var(--info);}
    .p-mut{background:var(--bg);color:var(--muted);}
    /* tables */
    table{width:100%;border-collapse:collapse;font-size:13px;}
    th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
    td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
    tr:last-child td{border-bottom:0;}
    tbody tr:hover{background:var(--accent-soft);}
    .mono{font-family:"Inter";font-weight:700;letter-spacing:.3px;}
    /* detail panel bits */
    .detail-hero{padding:18px;background:linear-gradient(120deg,#fff1f3,#fff);border-bottom:1px solid var(--line);}
    .detail-hero h3{margin:0;font-size:17px;font-weight:800;}
    .detail-hero .meta{margin-top:6px;color:var(--muted);font-size:12.5px;}
    .kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;padding:16px;}
    .kv .k{font-size:11.5px;color:var(--muted);font-weight:600;}
    .kv .v{font-size:14px;font-weight:700;margin-top:3px;}
    .gauge-wrap{position:relative;height:170px;overflow:hidden;}
    .chart-wrap{position:relative;height:260px;overflow:hidden;}
    .chart-sm{position:relative;height:200px;overflow:hidden;}
    /* progress bar */
    .bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:7px;}
    .bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
    /* two column */
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
    .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start;}
    /* board */
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start;}
    .col{background:var(--bg);border-radius:14px;padding:12px;min-width:0;}
    .col h4{margin:0 0 10px;font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:7px;}
    .col h4 .cnt{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:999px;font-size:11px;padding:1px 8px;}
    .tik{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:10px;}
    .tik:last-child{margin-bottom:0;}
    .tik .tt{font-size:12.5px;font-weight:700;}
    .tik .tm{font-size:11px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:5px;}
    /* timeline */
    .tl{position:relative;padding-left:26px;}
    .tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line);}
    .tl .ev{position:relative;padding:0 0 18px 0;}
    .tl .ev:last-child{padding-bottom:0;}
    .tl .ev::before{content:"";position:absolute;left:-22px;top:3px;width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--accent);}
    .tl .ev.done::before{background:var(--accent);}
    .tl .ev .et{font-size:13px;font-weight:700;}
    .tl .ev .ed{font-size:11.5px;color:var(--muted);margin-top:3px;}
    .tl .ev .ex{font-size:12px;margin-top:5px;background:var(--bg);padding:8px 10px;border-radius:9px;}
    /* environment cells */
    .envgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
    .envcell{border:1px solid var(--line);border-radius:13px;padding:13px;min-width:0;}
    .envcell .zn{font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;}
    .envcell .rd{font-size:22px;font-weight:900;margin-top:8px;}
    .envcell .rd small{font-size:12px;color:var(--muted);font-weight:700;}
    .envcell .st{margin-top:8px;}
    .legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:12px;}
    .legend span{display:inline-flex;align-items:center;gap:6px;}
    .legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}
    .note{font-size:12px;color:var(--muted);margin-top:12px;display:flex;align-items:center;gap:7px;background:var(--bg);padding:10px 12px;border-radius:10px;}
    .note .ms{color:var(--accent);font-size:18px;}
    .btnbar{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px;border-top:1px solid var(--line);}
    .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 13px;border-radius:10px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
    .btn .ms{font-size:17px;}
    .sec-title{font-size:13px;font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
    .sec-title .ms{color:var(--accent);font-size:19px;}
    /* responsive */
    @media(max-width:1080px){ .board{grid-template-columns:repeat(2,1fr);} }
    @media(max-width:860px){
      .split{grid-template-columns:1fr;}
    }
    @media(max-width:820px){
      .kpis{grid-template-columns:1fr 1fr;}
      .grid2,.grid3{grid-template-columns:1fr;}
      .envgrid{grid-template-columns:1fr 1fr;}
      .board{grid-template-columns:1fr;}
      .kv{grid-template-columns:1fr 1fr;}
    }
    @media(max-width:560px){
      nav button span.lbl{display:none;}
      nav button{padding:9px 12px;}
      .kpis{grid-template-columns:1fr 1fr;}
      .envgrid{grid-template-columns:1fr 1fr;}
      .brand p{display:none;}
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="brand">
        <div class="logo"><span class="ms">bolt</span></div>
        <div style="min-width:0;">
          <h1>ESD Control Management</h1>
          <p>靜電防護管理平台 · 點檢 / 監測 / 合規</p>
        </div>
      </div>
      <div class="spacer"></div>
      <div class="badge-live"><span class="dot"></span>即時監測中 · 42 工位</div>
    </div>
    <nav id="nav"></nav>
    <main><div id="screen"></div></main>
  </div>

  <script>
  var show;
  (function(){
    var chart=null;

    var NAV=[
      {i:0,icon:"checklist",label:"點檢排程"},
      {i:1,icon:"bolt",label:"阻值監測"},
      {i:2,icon:"warning",label:"異常警報"},
      {i:3,icon:"build",label:"處置追蹤"},
      {i:4,icon:"thermostat",label:"環境監控"},
      {i:5,icon:"verified",label:"合規報告"}
    ];

    function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
    function el(id){return document.getElementById(id);}
    function killChart(){ if(chart){ try{chart.destroy();}catch(e){} chart=null; } }

    /* ---------- data ---------- */
    var checkTasks=[
      {id:"CHK-4821",zone:"SMT A 線",type:"腕帶點檢",items:12,done:12,by:"林建宏",status:"完成",cov:100},
      {id:"CHK-4822",zone:"SMT B 線",type:"鞋跟點檢",items:16,done:14,by:"陳怡君",status:"進行中",cov:88},
      {id:"CHK-4823",zone:"DIP 插件區",type:"地墊接地",items:8,done:5,by:"王志豪",status:"進行中",cov:63},
      {id:"CHK-4824",zone:"包裝出貨",type:"離子風機",items:6,done:0,by:"未派工",status:"待派工",cov:0},
      {id:"CHK-4825",zone:"IQC 進料",type:"腕帶點檢",items:10,done:10,by:"張美玲",status:"完成",cov:100},
      {id:"CHK-4826",zone:"維修工作站",type:"接地線路",items:9,done:3,by:"李冠廷",status:"逾期",cov:33}
    ];
    var measRows=[
      {sta:"WS-A-07",op:"林建宏",band:"腕帶",val:12.4,lo:7.5,hi:35,unit:"MΩ",res:"合格",ts:"09:12"},
      {sta:"WS-A-11",op:"陳怡君",band:"鞋跟",val:41.7,lo:1,hi:35,unit:"MΩ",res:"超規",ts:"09:18"},
      {sta:"WS-B-03",op:"王志豪",band:"腕帶",val:8.9,lo:7.5,hi:35,unit:"MΩ",res:"合格",ts:"09:25"},
      {sta:"WS-B-09",op:"張美玲",band:"地墊",val:0.6,lo:1,hi:100,unit:"MΩ",res:"超規",ts:"09:31"},
      {sta:"WS-C-02",op:"李冠廷",band:"腕帶",val:18.2,lo:7.5,hi:35,unit:"MΩ",res:"合格",ts:"09:40"},
      {sta:"WS-C-06",op:"黃靜宜",band:"鞋跟",val:29.5,lo:1,hi:35,unit:"MΩ",res:"合格",ts:"09:47"}
    ];
    var alarms=[
      {id:"AL-2207",sta:"WS-A-11",kind:"鞋跟阻值超上限",sev:"高",val:"41.7 MΩ",when:"2 分鐘前",ack:false},
      {id:"AL-2206",sta:"WS-B-09",kind:"地墊阻值低於下限",sev:"高",val:"0.6 MΩ",when:"9 分鐘前",ack:false},
      {id:"AL-2205",sta:"Zone-D 包裝",kind:"離子風機平衡偏移",sev:"中",val:"+118 V",when:"27 分鐘前",ack:true},
      {id:"AL-2204",sta:"WS-A-04",kind:"腕帶未偵測到佩戴",sev:"中",val:"開路",when:"41 分鐘前",ack:true},
      {id:"AL-2203",sta:"DIP 插件區",kind:"環境濕度過低",sev:"低",val:"28 %RH",when:"1 小時前",ack:true}
    ];
    var dispo=[
      {id:"D-1042",sta:"WS-A-11",act:"隔離+換件",owner:"品保 陳怡君",stage:"complete"},
      {id:"D-1041",sta:"WS-B-09",act:"接地重接",owner:"設備 王志豪",stage:"active"},
      {id:"D-1040",sta:"Zone-D",act:"風機校正",owner:"設備 李冠廷",stage:"active"}
    ];
    var envZones=[
      {zn:"SMT A 線",t:23.4,h:44,ion:"±35 V",st:"正常",cls:"p-ok"},
      {zn:"SMT B 線",t:24.1,h:41,ion:"±52 V",st:"正常",cls:"p-ok"},
      {zn:"DIP 插件區",t:22.8,h:28,ion:"±88 V",st:"濕度偏低",cls:"p-warn"},
      {zn:"包裝出貨",t:25.6,h:39,ion:"+118 V",st:"離子偏移",cls:"p-bad"},
      {zn:"IQC 進料",t:23.0,h:46,ion:"±29 V",st:"正常",cls:"p-ok"},
      {zn:"維修工作站",t:24.9,h:43,ion:"±61 V",st:"正常",cls:"p-ok"},
      {zn:"倉儲備料",t:22.2,h:37,ion:"±74 V",st:"觀察",cls:"p-warn"},
      {zn:"成品出貨",t:23.7,h:42,ion:"±40 V",st:"正常",cls:"p-ok"}
    ];

    function pillFor(s){
      if(s==="完成"||s==="合格"||s==="正常")return "p-ok";
      if(s==="進行中"||s==="待派工"||s==="觀察"||s==="濕度偏低")return "p-info";
      if(s==="逾期"||s==="超規"||s==="離子偏移")return "p-bad";
      return "p-warn";
    }
    function sevPill(s){ return s==="高"?"p-bad":(s==="中"?"p-warn":"p-mut"); }

    /* ---------- screens ---------- */
    function s0(){
      var sel=checkTasks[1];
      var rows=checkTasks.map(function(t,idx){
        return '<div class="lrow'+(idx===1?' sel':'')+'" data-row="'+idx+'">'+
          '<div class="ico"><span class="ms">assignment</span></div>'+
          '<div class="txt"><div class="t">'+esc(t.id)+' · '+esc(t.zone)+'</div>'+
          '<div class="s">'+esc(t.type)+' · '+esc(t.by)+'</div></div>'+
          '<span class="pill '+pillFor(t.status)+'">'+esc(t.status)+'</span></div>';
      }).join("");
      var kv=
        '<div class="detail-hero"><h3>'+esc(sel.id)+' · '+esc(sel.zone)+'</h3>'+
        '<div class="meta">'+esc(sel.type)+'　·　負責人 '+esc(sel.by)+'　·　班別 早班 A</div></div>'+
        '<div class="kv">'+
        '<div><div class="k">點檢項目</div><div class="v">'+sel.items+' 項</div></div>'+
        '<div><div class="k">已完成</div><div class="v">'+sel.done+' 項</div></div>'+
        '<div><div class="k">覆蓋率</div><div class="v">'+sel.cov+' %<div class="bar"><i style="width:'+sel.cov+'%"></i></div></div></div>'+
        '<div><div class="k">預計完成</div><div class="v">10:30</div></div>'+
        '</div>'+
        '<div style="padding:0 16px 4px;"><div class="sec-title"><span class="ms">insights</span>近 7 日點檢覆蓋率</div>'+
        '<div class="chart-sm"><canvas id="c0"></canvas></div></div>'+
        '<div class="btnbar"><button class="btn primary"><span class="ms">check</span>確認完成</button>'+
        '<button class="btn"><span class="ms">person_add</span>改派人員</button>'+
        '<button class="btn"><span class="ms">event</span>調整排程</button></div>';
      return kpiRow([
        ["today","今日任務","6","+2 較昨日","up","event_available"],
        ["task_alt","完成率","74 %","-6% 目標 80%","down","donut_large"],
        ["group","出勤點檢員","5 / 6","1 人待補","","groups"],
        ["schedule","逾期任務","1","需立即處理","down","warning"]
      ])+
      '<div class="split">'+
        '<div class="card"><div class="card-h"><span class="ms">checklist</span>今日點檢任務<span class="tag">左側清單 · 點選查看</span></div><div class="lst" id="l0">'+rows+'</div></div>'+
        '<div class="card" id="d0">'+kv+'</div>'+
      '</div>';
    }
    function initS0(){
      var ctx=el("c0"); if(!ctx)return;
      chart=new Chart(ctx,{type:"line",data:{labels:["8/8","8/9","8/10","8/11","8/12","8/13","8/14"],
        datasets:[{label:"覆蓋率 %",data:[71,78,83,80,88,92,74],borderColor:"#e11d48",backgroundColor:"rgba(225,29,72,.10)",fill:true,tension:.35,pointRadius:3,pointBackgroundColor:"#e11d48"}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{min:60,max:100,ticks:{callback:function(v){return v+"%";}}}}}});
    }

    function s1(){
      var sel=measRows[1];
      var rows=measRows.map(function(m,idx){
        return '<div class="lrow'+(idx===1?' sel':'')+'" data-row="'+idx+'">'+
          '<div class="ico"><span class="ms">sensors</span></div>'+
          '<div class="txt"><div class="t">'+esc(m.sta)+' · '+esc(m.band)+'</div>'+
          '<div class="s">'+esc(m.op)+' · '+m.val+' '+esc(m.unit)+' · '+esc(m.ts)+'</div></div>'+
          '<span class="pill '+pillFor(m.res)+'">'+esc(m.res)+'</span></div>';
      }).join("");
      var detail=
        '<div class="detail-hero"><h3>'+esc(sel.sta)+' · '+esc(sel.band)+'量測</h3>'+
