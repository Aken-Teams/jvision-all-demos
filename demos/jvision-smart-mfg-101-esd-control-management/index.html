<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ESD Control Management（靜電防護管理）｜Jvision 系統 Demo</title>
  <meta name="description" content="靜電防護點檢、阻值監測、異常警報與 S20.20 合規稽核" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --color-primary:#2563eb;--color-on-primary:#fff;
      --color-secondary:#3b82f6;--color-on-secondary:#000;
      --color-accent:#ea580c;--color-on-accent:#000;
      --color-background:#f8fafc;--color-foreground:#1e293b;
      --color-card:#fff;--color-card-foreground:#1e293b;
      --color-muted:#e9eff8;--color-muted-foreground:#475569;
      --color-border:#e2e8f0;--color-destructive:#dc2626;
      --color-on-destructive:#fff;--color-ring:#2563eb;
      --blue:#2563eb;--ink:#1e293b;--muted:#475569;--line:#e2e8f0;
      --ok:#15803d;--warn:#a14807;--bad:#dc2626;--info:#1d4ed8;
      --bg:#f8fafc;--card:#fff;
      --shadow:0 8px 24px rgba(15,23,42,.06);
      --shadow-hover:0 12px 30px rgba(15,23,42,.1);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    html,body{margin:0;padding:0}
    body{
      min-width:320px;background:var(--bg);color:var(--ink);
      font-family:"Fira Sans",sans-serif;-webkit-font-smoothing:antialiased;
    }
    button{font:inherit}
    button,.lrow{cursor:pointer}
    button:focus-visible,.lrow:focus-visible{
      outline:3px solid var(--color-ring);outline-offset:3px
    }
    .ms{
      font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;
      font-size:20px;line-height:1;vertical-align:middle
    }
    .shell{max-width:1440px;min-height:100vh;margin:auto;display:flex;flex-direction:column}
    .topbar{
      min-height:92px;padding:18px 24px;display:flex;align-items:center;gap:20px;
      background:#0f2a55;color:#fff;border-bottom:4px solid var(--color-primary)
    }
    .brand{display:flex;align-items:center;gap:14px;min-width:0}
    .logo{
      width:46px;height:46px;display:grid;place-items:center;flex:none;
      color:#0f2a55;background:#fff;border:1px solid rgba(255,255,255,.45);border-radius:8px
    }
    .logo .ms{font-size:28px}
    .brand h1{margin:0;font-size:18px;line-height:1.25;font-weight:700;letter-spacing:.01em}
    .brand p{margin:4px 0 0;color:#dbeafe;font-size:12px}
    .spacer{flex:1}
    .badge-live{
      display:inline-flex;align-items:center;gap:8px;padding:8px 11px;
      color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);
      border-radius:6px;font:500 12px "Fira Code",monospace;white-space:nowrap
    }
    .dot{width:8px;height:8px;background:#4ade80;border:2px solid #dcfce7;border-radius:50%}
    nav{
      position:sticky;top:0;z-index:20;display:flex;gap:4px;padding:10px 24px;
      overflow-x:auto;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);
      box-shadow:0 3px 12px rgba(15,23,42,.04)
    }
    nav button{
      min-height:42px;padding:9px 13px;display:inline-flex;align-items:center;justify-content:center;
      gap:8px;flex:0 0 auto;border:1px solid transparent;border-radius:5px;
      background:transparent;color:var(--muted);font-size:13px;font-weight:600;
      transition:color .2s ease,background .2s ease,border-color .2s ease,transform .2s ease
    }
    nav button:hover{color:var(--blue);background:#eff6ff;border-color:#bfdbfe}
    nav button.active{color:#fff;background:var(--blue);border-color:var(--blue)}
    main{flex:1;padding:22px 24px 44px}
    .screen-head{
      margin-bottom:16px;padding:0 0 14px;border-bottom:1px solid var(--line)
    }
    .screen-head h2{
      margin:0;display:flex;align-items:center;gap:10px;font-size:22px;
      line-height:1.3;font-weight:700;letter-spacing:-.02em
    }
    .screen-head h2 .ms{width:32px;height:32px;display:grid;place-items:center;color:#fff;background:var(--blue);border-radius:5px}
    .screen-head p{max-width:840px;margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.65}
    .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
    .kpi{
      position:relative;min-width:0;padding:15px 16px;background:var(--card);
      border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:7px;
      box-shadow:0 3px 10px rgba(15,23,42,.035);
      transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease
    }
    .kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:#bfdbfe}
    .kpi .lab{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:600}
    .kpi .lab .ms{color:var(--blue);font-size:18px}
    .kpi .val{margin-top:8px;font:700 27px/1.1 "Fira Code",monospace;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
    .kpi .sub{margin-top:7px;color:var(--muted);font-size:11.5px;font-weight:500}
    .up{color:var(--ok)!important}.down{color:var(--bad)!important}
    .split{display:grid;grid-template-columns:minmax(300px,340px) minmax(0,1fr);gap:14px;align-items:start}
    .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
    .card{
      min-width:0;overflow:hidden;background:var(--card);border:1px solid var(--line);
      border-radius:7px;box-shadow:var(--shadow)
    }
    .card-h{
      min-height:48px;padding:12px 15px;display:flex;align-items:center;gap:8px;
      border-bottom:1px solid var(--line);font-size:14px;font-weight:700
    }
    .card-h .ms,.sec-title .ms{color:var(--blue)}
    .card-h .tag{
      margin-left:auto;padding:4px 8px;color:var(--muted);background:var(--color-muted);
      border-radius:4px;font:500 10.5px "Fira Code",monospace;white-space:nowrap
    }
    .card-b{padding:15px}
    .lst{display:flex;flex-direction:column}
    .lrow{
      min-width:0;min-height:62px;padding:11px 14px;display:flex;align-items:center;gap:10px;
      border:0;border-bottom:1px solid var(--line);transition:background .2s ease,box-shadow .2s ease
    }
    .lrow:last-child{border-bottom:0}
    .lrow:hover{background:#f3f7fc}
    .lrow.sel{background:#eff6ff;box-shadow:inset 4px 0 0 var(--blue)}
    .lrow .ico{
      width:34px;height:34px;display:grid;place-items:center;flex:none;
      color:var(--blue);background:#eaf2ff;border:1px solid #d7e6ff;border-radius:5px
    }
    .lrow .txt{min-width:0;flex:1}
    .lrow .t{overflow:hidden;color:var(--ink);font-size:13px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}
    .lrow .s{overflow:hidden;margin-top:3px;color:var(--muted);font:400 10.5px "Fira Code",monospace;text-overflow:ellipsis;white-space:nowrap}
    .pill{
      display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border:1px solid currentColor;
      border-radius:4px;font-size:10.5px;font-weight:700;line-height:1;white-space:nowrap
    }
    .pill::before{font-family:"Material Symbols Outlined";font-size:13px}
    .p-ok{color:#166534;background:#f0fdf4}.p-ok::before{content:"check_circle"}
    .p-warn{color:#92400e;background:#fffbeb}.p-warn::before{content:"visibility"}
    .p-bad{color:#b91c1c;background:#fef2f2}.p-bad::before{content:"error"}
    .p-info{color:#1d4ed8;background:#eff6ff}.p-info::before{content:"info"}
    .p-mut{color:#475569;background:#f1f5f9}.p-mut::before{content:"remove_circle"}
    .detail-hero{
      padding:17px;background:linear-gradient(110deg,#eff6ff 0,#fff 70%);
      border-bottom:1px solid var(--line);border-left:4px solid var(--blue)
    }
    .detail-hero h3{margin:0;font-size:17px;font-weight:700}
    .detail-hero .meta{margin-top:6px;color:var(--muted);font:400 11.5px/1.65 "Fira Code",monospace}
    .kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;padding:15px}
    .kv .k{color:var(--muted);font-size:11px;font-weight:500}
    .kv .v{margin-top:4px;font:600 13px "Fira Code",monospace;font-variant-numeric:tabular-nums}
    .sec-title{margin:0 0 11px;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700}
    .chart-wrap{position:relative;height:250px;overflow:hidden}
    .chart-sm{position:relative;height:190px;overflow:hidden}
    .gauge-wrap{position:relative;height:165px;overflow:hidden}
    .bar{height:6px;margin-top:7px;overflow:hidden;background:#dfe7f2;border-radius:2px}
    .bar>i{display:block;height:100%;background:var(--blue);border-radius:2px}
    .btnbar{display:flex;flex-wrap:wrap;gap:8px;padding:13px 15px;border-top:1px solid var(--line)}
    .btn{
      min-height:40px;padding:8px 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
      color:var(--ink);background:#fff;border:1px solid #cbd5e1;border-radius:5px;
      font-size:12px;font-weight:600;transition:transform .2s ease,background .2s ease,border-color .2s ease,box-shadow .2s ease
    }
    .btn:hover{background:#f8fafc;border-color:#94a3b8;transform:translateY(-1px)}
    .btn.primary{color:#fff;background:var(--color-accent);border-color:#c2410c;box-shadow:0 4px 10px rgba(194,65,12,.2)}
    .btn.primary:hover{background:#c2410c}
    .btn .ms{font-size:17px}
    .board{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:10px;align-items:start}
    .col{min-width:0;padding:10px;background:#f1f5f9;border:1px solid var(--line);border-radius:6px}
    .col h4{margin:0 0 9px;display:flex;align-items:center;gap:6px;font-size:12px}
    .col h4 .cnt{margin-left:auto;padding:2px 7px;background:#fff;border:1px solid var(--line);border-radius:3px;font:600 10px "Fira Code",monospace}
    .tik{margin-bottom:8px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:5px}
    .tik:last-child{margin-bottom:0}
    .tik .tt{font-size:12px;font-weight:600}
    .tik .tm{margin-top:5px;display:flex;align-items:center;gap:5px;color:var(--muted);font:400 10px "Fira Code",monospace}
    .tl{position:relative;padding-left:26px}
    .tl::before{content:"";position:absolute;left:8px;top:5px;bottom:5px;width:2px;background:#cbd5e1}
    .tl .ev{position:relative;padding-bottom:17px}
    .tl .ev:last-child{padding-bottom:0}
    .tl .ev::before{
      content:"";position:absolute;left:-23px;top:2px;width:11px;height:11px;
      background:#fff;border:3px solid var(--blue);border-radius:50%
    }
    .tl .ev.done::before{background:var(--blue);box-shadow:inset 0 0 0 2px #fff}
    .tl .et{font-size:12.5px;font-weight:600}
    .tl .ed{margin-top:3px;color:var(--muted);font:400 10.5px "Fira Code",monospace}
    .tl .ex{margin-top:6px;padding:8px 10px;color:#334155;background:#f1f5f9;border-left:3px solid var(--blue);font-size:11.5px}
    .envgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
    .envcell{min-width:0;padding:12px;border:1px solid var(--line);border-radius:5px}
    .envcell .zn{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600}
    .envcell .rd{margin-top:7px;font:700 21px "Fira Code",monospace}
    .envcell .rd small{color:var(--muted);font-size:11px}
    .envcell .st{margin-top:8px}
    .legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:11px;color:var(--muted);font-size:11px}
    .legend span{display:inline-flex;align-items:center;gap:6px}
    .legend i{width:12px;height:4px;display:inline-block;border-radius:1px}
    .note{margin-top:12px;padding:10px 11px;display:flex;align-items:flex-start;gap:7px;color:#334155;background:#f1f5f9;border-left:3px solid var(--blue);font-size:11.5px;line-height:1.55}
    .note .ms{color:var(--blue);font-size:17px}
    table{width:100%;border-collapse:collapse;font-size:12px}
    th{
      padding:10px 11px;text-align:left;color:#334155;background:#f1f5f9;
      border-bottom:2px solid #cbd5e1;font-size:11px;font-weight:700;white-space:nowrap
    }
    td{padding:11px;border-bottom:1px solid var(--line);white-space:nowrap}
    tbody tr:hover{background:#f8fafc}
    td:nth-child(3),th:nth-child(3){text-align:right;font-variant-numeric:tabular-nums}
    .mono{font-family:"Fira Code",monospace;font-weight:600;font-variant-numeric:tabular-nums}
    .reveal{animation:reveal .36s ease-out both}
    @keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @media(max-width:1080px){
      .board{grid-template-columns:repeat(2,minmax(190px,1fr))}
      .envgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media(max-width:860px){
      .split,.grid2{grid-template-columns:1fr}
      .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media(max-width:600px){
      .topbar{min-height:76px;padding:14px 16px}
      .logo{width:40px;height:40px}.brand h1{font-size:15px}.brand p{display:none}
      .badge-live{padding:7px;font-size:0}.badge-live::after{content:"即時";font-size:11px}
      nav{padding:8px 16px}
      nav button{min-width:42px;padding:9px 10px}
      nav .lbl{display:none}
      main{padding:18px 16px 34px}
      .screen-head h2{font-size:19px}
      .kpis{gap:8px}.kpi{padding:12px}.kpi .val{font-size:22px}
      .split{gap:10px}.card-h{align-items:flex-start;flex-wrap:wrap}.card-h .tag{margin-left:0}
      .kv,.envgrid{grid-template-columns:1fr 1fr}
      .board{grid-template-columns:1fr}
      .btn{flex:1 1 calc(50% - 8px)}
    }
    @media(max-width:390px){
      .kpis{grid-template-columns:1fr}
      .kv,.envgrid{grid-template-columns:1fr}
      .badge-live{display:none}
    }
    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
      .reveal{animation:none}
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true"><span class="ms">bolt</span></div>
        <div>
          <h1>ESD Control Management</h1>
          <p>靜電防護管理平台 · 點檢 / 監測 / 合規</p>
        </div>
      </div>
      <div class="spacer"></div>
      <div class="badge-live"><span class="dot" aria-hidden="true"></span>即時監測中 · 42 工位</div>
    </header>
    <nav id="nav" aria-label="主要功能"></nav>
    <main><div id="screen"></div></main>
  </div>

  <script>
  var show;
  (function(){
    "use strict";
    var charts=[];

    var NAV=[
      {i:0,icon:"checklist",label:"點檢排程"},
      {i:1,icon:"bolt",label:"阻值監測"},
      {i:2,icon:"warning",label:"異常警報"},
      {i:3,icon:"build",label:"處置追蹤"},
      {i:4,icon:"thermostat",label:"環境監控"},
      {i:5,icon:"verified",label:"合規報告"}
    ];

    var checkTasks=[
      {id:"CHK-4821",zone:"SMT A 線",type:"腕帶點檢",items:12,done:12,by:"林建宏",status:"完成",cov:100},
      {id:"CHK-4822",zone:"SMT B 線",type:"鞋跟點檢",items:16,done:14,by:"陳怡君",status:"進行中",cov:88},
      {id:"CHK-4823",zone:"DIP 插件區",type:"地墊接地",items:8,done:5,by:"王志豪",status:"進行中",cov:63},
      {id:"CHK-4824",zone:"包裝出貨",type:"離子風機",items:6,done:0,by:"未派工",status:"待派工",cov:0},
      {id:"CHK-4825",zone:"IQC 進料",type:"腕帶點檢",items:10,done:10,by:"張美玲",status:"完成",cov:100},
      {id:"CHK-4826",zone:"維修工作站",type:"接地線路",items:9,done:3,by:"李冠廷",status:"逾期",cov:33}
    ];
    var measRows=[
      {sta:"WS-A-07",op:"林建宏",band:"腕帶",val:12.4,lo:7.5,hi:35,unit:"MΩ",res:"合格",ts:"09:12"},
      {sta:"WS-A-11",op:"陳怡君",band:"鞋跟",val:41.7,lo:1,hi:35,unit:"MΩ",res:"超規",ts:"09:18"},
      {sta:"WS-B-03",op:"王志豪",band:"腕帶",val:8.9,lo:7.5,hi:35,unit:"MΩ",res:"合格",ts:"09:25"},
      {sta:"WS-B-09",op:"張美玲",band:"地墊",val:0.6,lo:1,hi:100,unit:"MΩ",res:"超規",ts:"09:31"},
      {sta:"WS-C-02",op:"李冠廷",band:"腕帶",val:18.2,lo:7.5,hi:35,unit:"MΩ",res:"合格",ts:"09:40"},
      {sta:"WS-C-06",op:"黃靜宜",band:"鞋跟",val:29.5,lo:1,hi:35,unit:"MΩ",res:"合格",ts:"09:47"}
    ];
    var alarms=[
      {id:"AL-2207",sta:"WS-A-11",kind:"鞋跟阻值超上限",sev:"高",val:"41.7 MΩ",when:"2 分鐘前",ack:false},
      {id:"AL-2206",sta:"WS-B-09",kind:"地墊阻值低於下限",sev:"高",val:"0.6 MΩ",when:"9 分鐘前",ack:false},
      {id:"AL-2205",sta:"Zone-D 包裝",kind:"離子風機平衡偏移",sev:"中",val:"+118 V",when:"27 分鐘前",ack:true},
      {id:"AL-2204",sta:"WS-A-04",kind:"腕帶未偵測到佩戴",sev:"中",val:"開路",when:"41 分鐘前",ack:true},
      {id:"AL-2203",sta:"DIP 插件區",kind:"環境濕度過低",sev:"低",val:"28 %RH",when:"1 小時前",ack:true}
    ];
    var dispo=[
      {id:"D-1042",sta:"WS-A-11",act:"隔離+換件",owner:"品保 陳怡君",stage:"complete"},
      {id:"D-1041",sta:"WS-B-09",act:"接地重接",owner:"設備 王志豪",stage:"active"},
      {id:"D-1040",sta:"Zone-D",act:"風機校正",owner:"設備 李冠廷",stage:"active"}
    ];
    var envZones=[
      {zn:"SMT A 線",t:23.4,h:44,ion:"±35 V",st:"正常",cls:"p-ok"},
      {zn:"SMT B 線",t:24.1,h:41,ion:"±52 V",st:"正常",cls:"p-ok"},
      {zn:"DIP 插件區",t:22.8,h:28,ion:"±88 V",st:"濕度偏低",cls:"p-warn"},
      {zn:"包裝出貨",t:25.6,h:39,ion:"+118 V",st:"離子偏移",cls:"p-bad"},
      {zn:"IQC 進料",t:23.0,h:46,ion:"±29 V",st:"正常",cls:"p-ok"},
      {zn:"維修工作站",t:24.9,h:43,ion:"±61 V",st:"正常",cls:"p-ok"},
      {zn:"倉儲備料",t:22.2,h:37,ion:"±74 V",st:"觀察",cls:"p-warn"},
      {zn:"成品出貨",t:23.7,h:42,ion:"±40 V",st:"正常",cls:"p-ok"}
    ];

    function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
    function el(id){return document.getElementById(id)}
    function killCharts(){charts.forEach(function(c){try{c.destroy()}catch(e){}});charts=[]}
    function addChart(node,config){if(node)charts.push(new Chart(node,config))}
    function pillFor(s){
      if(s==="完成"||s==="合格"||s==="正常")return"p-ok";
      if(s==="逾期"||s==="超規"||s==="離子偏移")return"p-bad";
      if(s==="進行中"||s==="待派工")return"p-info";
      return"p-warn"
    }
    function sevPill(s){return s==="高"?"p-bad":s==="中"?"p-warn":"p-mut"}
    function kpiRow(arr){
      return'<div class="kpis">'+arr.map(function(k){
        return'<article class="kpi"><div class="lab"><span class="ms" aria-hidden="true">'+k[0]+'</span>'+esc(k[1])+'</div><div class="val">'+esc(k[2])+'</div><div class="sub '+(k[4]||"")+'">'+esc(k[3])+'</div></article>'
      }).join("")+'</div>'
    }

    }

    show=function(i){
      i=Math.max(0,Math.min(i,RENDER.length-1));killCharts();
      var buttons=document.querySelectorAll("[data-i]");
      for(var b=0;b<buttons.length;b++){
