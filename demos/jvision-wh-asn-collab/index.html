<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ASN 預先出貨通知協同 · WMS 倉儲物流系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#334155;
  --color-on-primary:#fff;
  --color-secondary:#475569;
  --color-on-secondary:#fff;
  --color-accent:#059669;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#0f172a;
  --color-card:#fff;
  --color-card-foreground:#0f172a;
  --color-muted:#f2f3f4;
  --color-muted-foreground:#475569;
  --color-border:#e6e8ea;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#334155;

  --blue:#334155;
  --ink:#0f172a;
  --muted:#475569;
  --line:#e6e8ea;

  --accent:#059669;
  --accent2:#047857;
  --accent-soft:#d1fae5;
  --accent-soft2:#ecfdf5;
  --bg:#f8fafc;
  --panel:#fff;
  --th:#f2f3f4;
  --hov:#ecfdf5;
  --track:#e6e8ea;
  --sidebar:#fff;
  --sidebar2:#fff;
  --side-edge:#e6e8ea;
  --ok:#047857;
  --warn:#b45309;
  --bad:#dc2626;
  --info:#334155;
  --r:12px;
  --glow:transparent;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--color-background);
  color:var(--color-foreground);
  font-family:"Open Sans",sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font:inherit}
button,[role="button"],a{cursor:pointer}
h1,h2,h3,h4,.brand-txt b,.col-h,.pcard b,.lane-row .body b,.rep-row .sku b{
  margin:0;
  color:var(--color-foreground);
  font-family:"Poppins","Open Sans",sans-serif;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus{outline:none}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}

.app{display:flex;min-height:100vh}
.sidebar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  flex:none;
  flex-direction:column;
  width:256px;
  height:100vh;
  padding:24px 16px 18px;
  overflow:hidden;
  color:var(--ink);
  background:var(--panel);
  border-right:1px solid var(--line);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  padding:0 8px 24px;
  border-bottom:1px solid var(--line);
}
.brand-logo{
  display:flex;
  flex:none;
  align-items:center;
  justify-content:center;
  width:42px;
  height:42px;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-radius:10px;
}
.brand-logo .material-symbols-outlined{font-size:23px}
.brand-txt{min-width:0}
.brand-txt b{
  display:block;
  overflow:hidden;
  font-size:15px;
  font-weight:600;
  letter-spacing:.01em;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.brand-txt span{
  display:block;
  margin-top:2px;
  color:var(--muted);
  font-size:10px;
  font-weight:700;
  letter-spacing:.12em;
}
.nav{
  display:flex;
  flex-direction:column;
  gap:6px;
  min-width:0;
  margin-top:20px;
}
.nav button{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
  min-height:44px;
  padding:10px 12px;
  color:var(--muted);
  text-align:left;
  white-space:nowrap;
  background:transparent;
  border:1px solid transparent;
  border-radius:9px;
  transition:color 150ms ease,background-color 150ms ease,border-color 150ms ease;
}
.nav button .material-symbols-outlined{flex:none;font-size:20px}
.nav button .txt{overflow:hidden;text-overflow:ellipsis}
.nav button:hover{
  color:var(--ink);
  background:var(--color-muted);
  border-color:var(--line);
}
.nav button.on{
  color:var(--color-on-primary);
  font-weight:700;
  background:var(--color-primary);
  border-color:var(--color-primary);
}
.nav button.on .material-symbols-outlined{color:#6ee7b7}
.nav .idx{
  margin-left:auto;
  color:inherit;
  font-family:"Poppins",sans-serif;
  font-size:10px;
  font-weight:600;
  opacity:.72;
}
.side-foot{
  margin-top:auto;
  padding:16px 9px 0;
  color:var(--muted);
  font-size:11px;
  line-height:1.7;
  border-top:1px solid var(--line);
}
.side-foot b{color:var(--ink)}

.main{
  flex:1;
  min-width:0;
  max-width:1600px;
  padding:28px 32px 56px;
}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  min-height:64px;
  margin-bottom:24px;
}
.topbar h1{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:22px;
  font-weight:600;
  letter-spacing:-.02em;
}
.topbar h1 .material-symbols-outlined{
  display:flex;
  align-items:center;
  justify-content:center;
  width:36px;
  height:36px;
  color:var(--accent);
  font-size:21px;
  background:var(--accent-soft2);
  border:1px solid #a7f3d0;
  border-radius:9px;
}
.topbar .sub{margin-top:4px;color:var(--muted);font-size:12.5px}
.top-right{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:34px;
  padding:6px 11px;
  color:var(--muted);
  font-size:11.5px;
  font-weight:600;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:8px;
}
.chip .dot{
  width:8px;
  height:8px;
  background:var(--ok);
  border:2px solid var(--panel);
  border-radius:50%;
  outline:2px solid #a7f3d0;
  animation:statusPulse 2s ease-in-out infinite;
}
@keyframes statusPulse{0%,100%{opacity:1}50%{opacity:.45}}
.avatar{
  display:flex;
  flex:none;
  align-items:center;
  justify-content:center;
  width:36px;
  height:36px;
  color:var(--color-on-primary);
  font-size:12px;
  font-weight:700;
  background:var(--color-primary);
  border-radius:9px;
}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{
  min-width:0;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:var(--r);
  transition:border-color 150ms ease,background-color 150ms ease,transform 150ms ease;
}
.card:hover,.sec:hover,.kpi:hover,.stat:hover,.tile:hover{border-color:#cbd5e1}
.card,.sec{padding:18px}
.sec{margin-bottom:16px}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  min-height:38px;
  margin-bottom:14px;
  padding-bottom:12px;
  border-bottom:1px solid var(--line);
}
.card.pad0 .card-h,.card.p0 .card-h{margin-bottom:0}
.card-h h3,.sec>h3{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
  font-size:14px;
  font-weight:600;
}
.card-h h3 .material-symbols-outlined,.sec>h3 .material-symbols-outlined{
  color:var(--accent);
  font-size:19px;
}
.card-h .hint{color:var(--muted);font-size:11px}
.sec>h3{margin-bottom:13px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.sec>p{margin:0 0 13px;color:var(--muted);font-size:13px;line-height:1.75}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0;font-size:13px}
.dl dt{color:var(--muted);font-size:12px;font-weight:600}
.dl dd{margin:0;line-height:1.75}

.kpi,.stat{position:relative;overflow:hidden;padding:17px 18px}
.kpi::before,.stat::before,.tile::before{
  position:absolute;
  top:0;
  right:0;
  left:0;
  height:3px;
  background:var(--accent);
  content:"";
  opacity:0;
  transition:opacity 150ms ease;
}
.kpi:hover::before,.stat:hover::before,.tile:hover::before{opacity:1}
.kpi::after{display:none}
.kpi .ico,.tile .ti{
  display:flex;
  align-items:center;
  justify-content:center;
  width:38px;
  height:38px;
  color:var(--accent);
  background:var(--accent-soft2);
  border:1px solid #a7f3d0;
  border-radius:9px;
}
.kpi .ico .material-symbols-outlined,.tile .ti .material-symbols-outlined{font-size:20px}
.kpi .lbl,.stat .lbl{
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:12px;
  color:var(--muted);
  font-size:12px;
  font-weight:600;
}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{color:var(--accent);font-size:15px}
.kpi .val,.stat .val,.tile .tv{
  margin-top:4px;
  color:var(--ink);
  font-family:"Poppins",sans-serif;
  font-size:26px;
  font-weight:600;
  letter-spacing:-.035em;
  line-height:1.2;
  font-variant-numeric:tabular-nums;
}
.kpi .val small,.stat .val small{
  margin-left:4px;
  color:var(--muted);
  font-family:"Open Sans",sans-serif;
  font-size:12px;
  font-weight:600;
}
.kpi .delta,.stat .d{
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin-top:7px;
  font-size:11.5px;
  font-weight:700;
}
.delta.up,.d.up{color:var(--ok)}
.delta.down,.d.down{color:var(--bad)}
.delta.flat,.d.flat{color:var(--muted)}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:15px}

.tile{position:relative;display:flex;flex-direction:column;gap:8px;padding:18px;overflow:hidden}
.tile b{font-family:"Open Sans",sans-serif;font-size:13px;font-weight:700}
.tile p{margin:0;color:var(--muted);font-size:11.5px;line-height:1.6}
.tile .tv{margin:0;font-size:23px}

.card.pad0>div[style*="overflow-x"],.card.p0>div[style*="overflow-x"]{border-radius:0 0 var(--r) var(--r)}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th{
  padding:11px 14px;
  color:var(--muted);
  text-align:left;
  white-space:nowrap;
  background:var(--th);
  border-bottom:1px solid var(--line);
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.045em;
}
td{
  height:46px;
  padding:10px 14px;
  color:var(--ink);
  white-space:nowrap;
  border-bottom:1px solid var(--line);
}
th:nth-child(n+4),td:nth-child(n+4){text-align:right}
tr:last-child td{border-bottom:none}
tbody tr{transition:background-color 150ms ease}
tbody tr:hover{background:var(--hov)}
.mono{
  font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  font-size:12px;
  font-weight:600;
  letter-spacing:0;
  font-variant-numeric:tabular-nums;
}
.tag{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  min-height:24px;
  padding:3px 9px;
  white-space:nowrap;
  border:1px solid transparent;
  border-radius:6px;
  font-size:10.5px;
  font-weight:700;
  line-height:1;
}
.t-ok{color:#065f46;background:#d1fae5;border-color:#a7f3d0}
.t-warn{color:#92400e;background:#fef3c7;border-color:#fde68a}
.t-bad{color:#991b1b;background:#fee2e2;border-color:#fecaca}
.t-info{color:#1e3a8a;background:#dbeafe;border-color:#bfdbfe}
.t-gray{color:#334155;background:#f1f5f9;border-color:#cbd5e1}
.t-acc,.t-pink{color:#065f46;background:var(--accent-soft2);border-color:#a7f3d0}

.bar{height:7px;min-width:56px;overflow:hidden;background:var(--track);border-radius:4px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{flex:none;width:40px;color:var(--muted);font-size:10.5px;font-weight:700;text-align:right}

.tl{position:relative;padding-left:27px}
.tl::before{position:absolute;top:4px;bottom:4px;left:7px;width:2px;background:var(--line);content:""}
.tl-item,.tl-i{position:relative;padding:0 0 18px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{
  position:absolute;
  top:3px;
  left:-26px;
  width:15px;
  height:15px;
  background:#fff;
  border:4px solid var(--accent);
  border-radius:50%;
}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font-family:"SFMono-Regular",Consolas,monospace;font-size:10.5px;font-weight:600}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:12.5px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:11.5px}

.chk{display:flex;align-items:center;gap:9px;padding:9px 2px;font-size:12.5px;border-bottom:1px dashed var(--line)}
.chk:last-child{border-bottom:none}
.chk .material-symbols-outlined{font-size:19px}
.chk .ok{color:var(--ok)}
.chk .wait{color:var(--muted)}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--muted);font-size:11px}
.note{margin-top:13px;padding-top:12px;color:var(--muted);font-size:11.5px;line-height:1.7;border-top:1px dashed var(--line)}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.col{display:flex;flex-direction:column;gap:9px;padding:12px;background:var(--th);border:1px solid var(--line);border-radius:10px}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 7px;font-size:12px;font-weight:600}
.col-h .cnt{padding:2px 8px;color:var(--muted);font-size:10px;background:#fff;border:1px solid var(--line);border-radius:6px}
.pcard{padding:12px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;transition:border-color 150ms ease,background-color 150ms ease}
.pcard:hover{background:var(--accent-soft2);border-color:#a7f3d0}
.pcard b{font-size:12px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--muted);font-size:10.5px}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:8px;color:var(--ink);font-size:10.5px}
.mini-av,.av{display:inline-flex;flex:none;align-items:center;justify-content:center;color:#065f46;font-weight:800;background:var(--accent-soft);border:1px solid #a7f3d0;border-radius:6px}
.mini-av{width:19px;height:19px;font-size:9px}
.av{width:27px;height:27px;font-size:10px}
.who{display:inline-flex;align-items:center;gap:6px}

.lane{display:flex;flex-direction:column;gap:11px}
.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:9px}
.lane-row .num{display:flex;flex:none;align-items:center;justify-content:center;width:32px;height:32px;color:#065f46;font-family:"Poppins",sans-serif;font-size:12px;font-weight:700;background:var(--accent-soft);border-radius:7px}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:13px}
.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:11.5px}
.steps{display:flex;flex:none;align-items:center}
.steps .s{display:flex;align-items:center;justify-content:center;width:23px;height:23px;color:var(--muted);font-size:10px;background:#fff;border:2px solid var(--line);border-radius:50%;z-index:1}
.steps .ln{width:20px;height:2px;background:var(--line)}
.steps .s.done{color:#fff;background:var(--accent);border-color:var(--accent)}
.steps .s.cur{color:var(--accent);border-color:var(--accent);animation:statusPulse 1.6s ease-in-out infinite}
.steps .ln.done{background:var(--accent)}

.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 4px;border-bottom:1px dashed var(--line)}
.rep-row:last-child{border-bottom:none}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:12.5px}
.rep-row .sku span{color:var(--muted);font-size:10.5px}
.gauge{flex:none;width:110px}
.gauge .track{position:relative;height:8px;overflow:hidden;background:var(--track);border-radius:4px}
.gauge .track i{display:block;height:100%;background:var(--accent);border-radius:4px}
.gauge small{display:block;margin-top:3px;color:var(--muted);font-size:10px;text-align:right}
.band{position:relative;min-width:150px;height:26px;background:var(--track);border-radius:6px}
.band .rng{position:absolute;top:0;bottom:0;background:var(--accent-soft);border-radius:6px}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
.band .me{position:absolute;top:3px;width:12px;height:20px;background:var(--accent);border-radius:3px}

#screen>*{animation:gridEnter 420ms cubic-bezier(.34,1.45,.64,1) both}
#screen>*:nth-child(2){animation-delay:60ms}
#screen>*:nth-child(3){animation-delay:120ms}
#screen>*:nth-child(4){animation-delay:180ms}
@keyframes gridEnter{
  from{opacity:0;transform:translateY(16px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

@media(min-width:1080px){
  #screen{display:grid;grid-template-columns:minmax(0,1fr) 272px;gap:16px;align-items:start}
  #screen>*{grid-column:1;margin-top:0!important}
  #screen>.grid.g4:first-child{
    position:sticky;
    top:20px;
    display:flex;
    grid-column:2;
    grid-row:1 / span 99;
    flex-direction:column;
    gap:12px;
  }
  #screen>.grid.g4:first-child>*{width:100%}
}

@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:900px){
  .app{flex-direction:column}
  .sidebar{
    position:sticky;
    top:0;
    width:100%;
    height:auto;
    padding:10px 16px;
    flex-direction:row;
    align-items:center;
    gap:10px;
    border-right:0;
    border-bottom:1px solid var(--line);
  }
  .brand{padding:0 12px 0 0;border:0}
  .brand-logo{width:38px;height:38px}
  .brand-txt span{display:none}
  .side-foot{display:none}
  .nav{flex:1;flex-direction:row;gap:6px;margin:0;overflow-x:auto}
  .nav button{flex:none;min-height:40px;padding:8px 11px}
  .nav .idx{display:none}
  .main{width:100%;padding:22px 18px 48px}
}
@media(max-width:820px){
  .g2,.g3,.g23,.g32{grid-template-columns:1fr}
  .topbar{align-items:flex-start;flex-direction:column}
}
@media(max-width:600px){
  .sidebar{padding:9px 12px}
  .brand{padding-right:4px}
  .brand-txt{display:none}
  .nav button .txt{display:none}
  .nav button{justify-content:center;width:42px;padding:8px}
  .main{padding:18px 12px 40px}
  .topbar{gap:14px;margin-bottom:18px}
  .topbar h1{font-size:18px}
  .top-right{width:100%}
  .chip{flex:1;justify-content:center}
  .g4{grid-template-columns:1fr 1fr;gap:10px}
