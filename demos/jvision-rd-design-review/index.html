<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>設計審查與階段關卡 · PLM 研發管理系統</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700&family=Roboto+Mono:wght@300;400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#15803D;
  --color-on-primary:#FFFFFF;
  --color-secondary:#22C55E;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDF4;
  --color-foreground:#14532D;
  --color-card:#FFFFFF;
  --color-card-foreground:#14532D;
  --color-muted:#E8F0F1;
  --color-muted-foreground:#475569;
  --color-border:#BBF7D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#15803D;

  --blue:#15803D;
  --ink:#14532D;
  --muted:#475569;
  --line:#BBF7D0;

  --primary-soft:#DCFCE7;
  --primary-pale:#ECFDF3;
  --accent-soft:#FEF3C7;
  --danger-soft:#FEE2E2;
  --info-soft:#E0F2FE;
  --panel:#FFFFFF;
  --shadow:0 18px 50px rgba(20,83,45,.08);
  --shadow-small:0 8px 24px rgba(20,83,45,.07);
  --radius:22px;
  --radius-small:15px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  color:var(--color-foreground);
  background:
    radial-gradient(circle at 8% 5%,rgba(34,197,94,.14),transparent 28rem),
    radial-gradient(circle at 92% 18%,rgba(217,119,6,.08),transparent 25rem),
    var(--color-background);
  font-family:"Exo","Noto Sans TC",sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,a{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  font-size:20px;
  line-height:1;
  vertical-align:middle;
}
.mono,.val,.tv,.num,.date,.chip time,td:first-child{
  font-family:"Roboto Mono",monospace;
  font-variant-numeric:tabular-nums;
}
.app{min-height:100vh}
.shell{
  position:sticky;
  top:0;
  z-index:50;
  padding:12px 22px 0;
  background:rgba(240,253,244,.88);
  backdrop-filter:blur(18px);
}
.topnav{
  max-width:1440px;
  min-height:70px;
  margin:auto;
  padding:10px 14px;
  display:flex;
  align-items:center;
  gap:20px;
  border:1px solid rgba(187,247,208,.85);
  border-radius:24px 24px 16px 16px;
  background:rgba(255,255,255,.92);
  box-shadow:var(--shadow-small);
}
.brand{
  display:flex;
  align-items:center;
  gap:11px;
  flex:none;
  min-width:216px;
}
.brand-logo{
  position:relative;
  width:44px;
  height:44px;
  display:grid;
  place-items:center;
  overflow:hidden;
  color:var(--color-on-primary);
  background:linear-gradient(145deg,var(--color-primary),var(--color-secondary));
  border-radius:55% 45% 62% 38%/44% 55% 45% 56%;
  box-shadow:0 9px 22px rgba(21,128,61,.25);
}
.brand-logo::after{
  content:"";
  position:absolute;
  width:19px;
  height:25px;
  right:-4px;
  bottom:-7px;
  border-radius:100% 0;
  background:rgba(255,255,255,.18);
  transform:rotate(-24deg);
}
.brand-logo span{position:relative;z-index:1}
.brand-copy b{
  display:block;
  font-size:15px;
  font-weight:700;
  letter-spacing:.03em;
}
.brand-copy span{
  display:block;
  color:var(--color-muted-foreground);
  font:500 10px/1.4 "Roboto Mono",monospace;
  letter-spacing:.12em;
}
.nav{
  display:flex;
  flex:1;
  gap:5px;
  overflow-x:auto;
  padding:3px;
  scrollbar-width:none;
}
.nav::-webkit-scrollbar{display:none}
.nav button{
  min-height:44px;
  padding:9px 13px;
  display:flex;
  align-items:center;
  gap:8px;
  flex:none;
  color:#365e45;
  border:1px solid transparent;
  border-radius:14px;
  background:transparent;
  font-weight:600;
  white-space:nowrap;
  transition:background-color .2s,color .2s,border-color .2s,transform .2s;
}
.nav button:hover{
  color:var(--color-primary);
  background:var(--primary-pale);
  border-color:var(--color-border);
  transform:translateY(-1px);
}
.nav button.on{
  color:var(--color-on-primary);
  background:var(--color-primary);
  box-shadow:0 8px 18px rgba(21,128,61,.2);
}
.nav button .material-symbols-outlined{font-size:19px}
.nav .idx{
  color:inherit;
  opacity:.7;
  font:500 9px "Roboto Mono",monospace;
}
.workspace{
  width:min(1440px,calc(100% - 44px));
  margin:0 auto;
  padding:28px 0 64px;
}
.topbar{
  position:relative;
  min-height:174px;
  margin-bottom:20px;
  padding:29px 31px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:22px;
  overflow:hidden;
  color:var(--color-on-primary);
  background:linear-gradient(120deg,#14532D 0%,#15803D 58%,#16A34A 100%);
  border-radius:30px 22px 34px 20px;
  box-shadow:0 22px 45px rgba(20,83,45,.17);
}
.topbar::before,.topbar::after{
  content:"";
  position:absolute;
  pointer-events:none;
  border:1px solid rgba(255,255,255,.16);
}
.topbar::before{
  width:310px;
  height:190px;
  right:-74px;
  top:-80px;
  border-radius:48% 52% 38% 62%/60% 36% 64% 40%;
  background:rgba(255,255,255,.055);
  transform:rotate(16deg);
}
.topbar::after{
  width:190px;
  height:110px;
  left:40%;
  bottom:-80px;
  border-radius:50%;
  background:rgba(187,247,208,.08);
}
.eyebrow{
  position:relative;
  z-index:1;
  margin-bottom:9px;
  display:flex;
  align-items:center;
  gap:7px;
  color:#D1FAE5;
  font:600 11px "Roboto Mono",monospace;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.heading{position:relative;z-index:1}
.heading h1{
  margin:0;
  display:flex;
  align-items:center;
  gap:11px;
  font-size:clamp(24px,3vw,36px);
  line-height:1.15;
  letter-spacing:.01em;
}
.heading h1 .material-symbols-outlined{font-size:32px;color:#BBF7D0}
.heading .sub{
  max-width:660px;
  margin-top:9px;
  color:#DCFCE7;
  font-size:14px;
}
.top-right{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:9px;
  flex-wrap:wrap;
}
.chip{
  min-height:38px;
  padding:8px 12px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:#F0FDF4;
  border:1px solid rgba(255,255,255,.2);
  border-radius:999px;
  background:rgba(255,255,255,.1);
  font-size:12px;
  font-weight:600;
}
.chip .state-icon{color:#86EFAC;font-size:17px}
.avatar{
  width:39px;
  height:39px;
  display:grid;
  place-items:center;
  color:var(--color-on-accent);
  background:var(--color-accent);
  border:2px solid rgba(255,255,255,.72);
  border-radius:54% 46% 60% 40%/50% 57% 43% 50%;
  font-weight:700;
}
.story-progress{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:20px;
}
.story-step{
  min-height:52px;
  padding:10px 13px;
  display:flex;
  align-items:center;
  gap:9px;
  color:var(--color-muted-foreground);
  border:1px solid var(--color-border);
  border-radius:16px 13px 18px 12px;
  background:rgba(255,255,255,.78);
  font-size:12px;
  font-weight:600;
}
.story-step span:first-child{
  width:25px;
  height:25px;
  display:grid;
  place-items:center;
  flex:none;
  color:var(--color-primary);
  background:var(--primary-soft);
  border-radius:50%;
  font:700 10px "Roboto Mono",monospace;
}
.story-step.active{
  color:var(--color-foreground);
  background:var(--color-card);
  box-shadow:var(--shadow-small);
}
.screen{display:block}
.chapter{margin-top:18px}
.chapter:first-child{margin-top:0}
.chapter-label{
  margin:0 0 10px 4px;
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--color-primary);
  font:700 11px "Roboto Mono",monospace;
  letter-spacing:.1em;
  text-transform:uppercase;
}
.chapter-label::before{
  content:"";
  width:24px;
  height:2px;
  background:var(--color-secondary);
  border-radius:2px;
}
.grid{display:grid;gap:15px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g32{grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr)}
.grid>*{min-width:0}
.tile,.card{
  position:relative;
  min-width:0;
  overflow:hidden;
  color:var(--color-card-foreground);
  border:1px solid rgba(187,247,208,.86);
  background:rgba(255,255,255,.94);
  box-shadow:var(--shadow-small);
}
.tile{
  min-height:158px;
  padding:19px;
  border-radius:22px 17px 25px 15px;
}
.tile::after{
  content:"";
  position:absolute;
  width:76px;
  height:76px;
  right:-30px;
  bottom:-36px;
  border-radius:64% 36% 50% 50%/42% 61% 39% 58%;
  background:var(--primary-soft);
  transform:rotate(22deg);
}
.tile:nth-child(2n){border-radius:16px 25px 17px 23px}
.tile:nth-child(3n)::after{background:var(--accent-soft)}
.tile .ti{
  width:39px;
  height:39px;
  display:grid;
  place-items:center;
  color:var(--color-primary);
  background:var(--primary-soft);
  border-radius:55% 45% 58% 42%/48% 58% 42% 52%;
}
.tile b{
  display:block;
  margin-top:13px;
  font-size:12px;
  color:var(--color-muted-foreground);
}
.tile .tv{
  margin-top:3px;
  font-size:27px;
  font-weight:700;
  line-height:1.2;
  letter-spacing:-.04em;
}
.tile p{
  position:relative;
  z-index:1;
  margin:6px 0 0;
  color:var(--color-muted-foreground);
  font-size:11.5px;
}
.card{
  padding:18px;
  border-radius:var(--radius);
}
.card.pad0{padding:0}
.card-h{
  min-height:30px;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}
.card.pad0 .card-h{padding:18px 18px 0}
.card-h h3{
  margin:0;
  display:flex;
  align-items:center;
  gap:8px;
  font-size:14px;
  font-weight:700;
}
.card-h h3 .material-symbols-outlined{color:var(--color-primary)}
.card-h .hint{
  color:var(--color-muted-foreground);
  font-size:11px;
}
.table-wrap{
  width:100%;
  overflow-x:auto;
  scrollbar-color:var(--color-border) transparent;
}
table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  font-size:12.5px;
}
th{
  padding:12px 14px;
  color:#365E45;
  background:#ECFDF3;
  border-top:1px solid var(--color-border);
  border-bottom:1px solid var(--color-border);
  text-align:left;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.05em;
  white-space:nowrap;
}
th:first-child{padding-left:18px}
td{
  height:50px;
  padding:11px 14px;
  color:#234B32;
  border-bottom:1px solid #DCFCE7;
  background:rgba(255,255,255,.72);
  white-space:nowrap;
}
td:first-child{padding-left:18px;font-size:11.5px;font-weight:600}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#F7FEF9}
td.num{text-align:right}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:25px;
  padding:4px 9px;
  border:1px solid transparent;
  border-radius:999px;
  font-size:10.5px;
  font-weight:700;
  line-height:1;
  white-space:nowrap;
}
.tag::before{
  content:"";
  width:6px;
  height:6px;
  flex:none;
  border-radius:50%;
  background:currentColor;
}
.t-ok{color:#166534;background:#DCFCE7;border-color:#BBF7D0}
.t-warn{color:#92400E;background:#FEF3C7;border-color:#FDE68A}
.t-bad{color:#B91C1C;background:#FEE2E2;border-color:#FECACA}
.t-info{color:#075985;background:#E0F2FE;border-color:#BAE6FD}
.t-gray{color:#475569;background:#F1F5F9;border-color:#CBD5E1}
.t-acc,.t-pink{color:#166534;background:#ECFDF3;border-color:#BBF7D0}
.prog{
  min-width:112px;
  display:flex;
  align-items:center;
  gap:8px;
}
.bar{
  height:8px;
  flex:1;
  overflow:hidden;
  background:#E2E8E5;
  border-radius:999px;
}
.bar i{
  display:block;
  height:100%;
  border-radius:inherit;
  background:linear-gradient(90deg,var(--color-primary),var(--color-secondary));
}
.prog small{
  width:37px;
  color:#365E45;
  text-align:right;
  font:600 10px "Roboto Mono",monospace;
}
.insight{
  min-height:110px;
  padding:17px 18px;
  display:flex;
  align-items:flex-start;
  gap:13px;
  color:#713F12;
  border:1px solid #FDE68A;
  border-radius:18px 23px 16px 25px;
  background:#FFFBEB;
}
.insight .material-symbols-outlined{
  width:37px;
  height:37px;
  display:grid;
  place-items:center;
  flex:none;
  color:#92400E;
  background:#FEF3C7;
  border-radius:50% 45% 55% 50%;
}
.insight b{display:block;margin-bottom:3px}
.insight p{margin:0;color:#78350F;font-size:12px}
.action-panel{
  padding:23px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  color:#F0FDF4;
  background:linear-gradient(130deg,#14532D,#166534);
  border-radius:26px 18px 29px 20px;
  box-shadow:var(--shadow);
}
.action-panel h3{margin:0 0 4px;font-size:18px}
.action-panel p{margin:0;color:#DCFCE7;font-size:12px}
.action-button{
  min-height:44px;
  padding:10px 16px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  flex:none;
  color:var(--color-on-accent);
  border:0;
  border-radius:14px 18px 13px 17px;
  background:var(--color-accent);
  font-weight:700;
  box-shadow:0 8px 20px rgba(0,0,0,.14);
  transition:transform .2s,filter .2s;
}
.action-button:hover{transform:translateY(-2px);filter:brightness(1.05)}
.reveal{opacity:0;transform:translateY(12px)}
.reveal.visible{
  opacity:1;
  transform:none;
  transition:opacity .36s ease,transform .36s ease;
}
@media(max-width:1100px){
  .topnav{align-items:flex-start;flex-wrap:wrap}
  .brand{min-width:0}
  .nav{order:2;flex-basis:100%}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:820px){
  .shell{padding:8px 12px 0}
  .topnav{border-radius:18px}
  .brand-copy span{display:none}
  .workspace{width:calc(100% - 24px);padding-top:18px}
  .topbar{min-height:190px;padding:24px;align-items:flex-start;flex-direction:column}
  .top-right{justify-content:flex-start}
  .story-progress{grid-template-columns:1fr}
  .g2,.g3,.g32{grid-template-columns:1fr}
}
@media(max-width:560px){
  .brand{min-width:180px}
  .nav button{padding:9px 11px}
  .nav button .txt{display:none}
  .nav button .idx{font-size:10px}
  .g4{grid-template-columns:1fr 1fr}
  .tile{min-height:146px;padding:15px}
  .tile .tv{font-size:22px}
  .topbar{border-radius:23px 17px 26px 16px}
  .heading h1{font-size:23px}
  .chip:last-of-type{display:none}
  .card{padding:14px}
  .card.pad0 .card-h{padding:15px 15px 0}
  .action-panel{align-items:flex-start;flex-direction:column}
}
@media(max-width:390px){
  .g4{grid-template-columns:1fr}
  .tile{min-height:135px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation:none!important;
    transition:none!important;
  }
  .reveal{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="shell">
    <div class="topnav">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true"><span class="material-symbols-outlined">fact_check</span></div>
        <div class="brand-copy"><b>階段關卡台</b><span>STAGE GATE REVIEW</span></div>
      </div>
      <nav class="nav" id="nav" aria-label="主要功能"></nav>
    </div>
  </header>

  <main class="workspace">
    <section class="topbar" aria-labelledby="th-title">
      <div class="heading">
        <div class="eyebrow"><span class="material-symbols-outlined">biotech</span>RESEARCH DEVELOPMENT CONTROL</div>
        <h1><span class="material-symbols-outlined" id="th-ico"></span><span id="th-title"></span></h1>
        <div class="sub" id="th-sub"></div>
      </div>
      <div class="top-right">
        <span class="chip"><span class="material-symbols-outlined state-icon">check_circle</span>系統連線正常</span>
        <span class="chip"><span class="material-symbols-outlined">calendar_today</span><time datetime="2026-08-20">2026/08/20</time></span>
        <div class="avatar" aria-label="使用者：資">資</div>
      </div>
    </section>

    <div class="story-progress" aria-label="頁面閱讀進度">
      <div class="story-step active"><span>01</span>關鍵狀態</div>
      <div class="story-step"><span>02</span>審查脈絡</div>
      <div class="story-step"><span>03</span>決策行動</div>
    </div>
    <div id="screen" class="screen"></div>
  </main>
</div>

<script>
var charts=[];
var observer=null;
var MODULES=[
  {icon:"dashboard",name:"專案關卡總覽",sub:"12 件在研專案的階段位置與健康度"},
  {icon:"checklist",name:"審查檢核",sub:"DR1–DR4 的檢查項與簽核狀態"},
  {icon:"pending_actions",name:"待辦追蹤",sub:"審查發現事項的關閉進度"},
  {icon:"insights",name:"關卡分析",sub:"卡關原因與通過率統計"},
  {icon:"event_note",name:"審查節點",sub:"本季關卡與近期重要審查節點"},
  {icon:"shield_with_heart",name:"風險聚焦",sub:"集中檢視阻擋事項與高風險專案"}
];

function esc(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}
function killCharts(){
  charts.forEach(function(c){try{c.destroy()}catch(e){}});
  charts=[];
}
function tile(ic,t,v,p){
  return '<div class="tile reveal"><div class="ti"><span class="material-symbols-outlined">'+ic+
    '</span></div><b>'+t+'</b><div class="tv">'+v+'</div><p>'+p+'</p></div>';
}
function pg(p){
  return '<div class="prog" aria-label="進度 '+p+'%"><div class="bar"><i style="width:'+p+
    '%"></i></div><small>'+p+'%</small></div>';
}
function isNumericCell(value){
  var text=String(value).replace(/<[^>]+>/g,"").trim();
  return /^[-+]?(?:\d{1,3}(?:,\d{3})*|\d+)(?:\.\d+)?(?:%| 天| 件| 場| 項| 個職能| 萬)?$/.test(text);
}
function tbl(headers,rows){
  return '<div class="table-wrap"><table><thead><tr>'+
    headers.map(function(x){return '<th>'+esc(x)+'</th>'}).join("")+
    '</tr></thead><tbody>'+
    rows.map(function(row){

function reveal(){
  if(observer)observer.disconnect();
  var reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var nodes=document.querySelectorAll(".reveal");
  if(reduced||!("IntersectionObserver" in window)){
    nodes.forEach(function(node){node.classList.add("visible")});
    return;
  }
  observer=new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        entry.target.classList.add("visible");
        observer.unobserve(entry.target);
      }
    });
  },{threshold:.08,rootMargin:"0px 0px -4% 0px"});
  nodes.forEach(function(node){observer.observe(node)});
}

}
var RENDER=[v0,v1,v2,v3,v4,v5];

function buildNav(){
  var nav=document.getElementById("nav");
  nav.innerHTML=MODULES.map(function(module,i){
    return '<button type="button" data-i="'+i+'" aria-label="'+esc(module.name)+'">'+
      '<span class="material-symbols-outlined" aria-hidden="true">'+module.icon+'</span>'+
      '<span class="txt">'+esc(module.name)+'</span><span class="idx">0'+(i+1)+'</span></button>';
  }).join("");
  Array.prototype.forEach.call(nav.querySelectorAll("[data-i]"),function(button){
    button.addEventListener("click",function(){
      location.hash="go="+button.getAttribute("data-i");
    });
  });
}
function show(i){
  killCharts();
  var module=MODULES[i];
  document.getElementById("th-ico").textContent=module.icon;
  document.getElementById("th-title").textContent=module.name;
  document.getElementById("th-sub").textContent=module.sub;
  Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(button){
    var active=Number(button.getAttribute("data-i"))===i;
    button.classList.toggle("on",active);
    if(active)button.setAttribute("aria-current","page");
    else button.removeAttribute("aria-current");
  });
  RENDER[i]();
  reveal();
}
function fromHash(){
  var match=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  var index=match?Math.min(Number(match[1]),MODULES.length-1):0;
  show(index);
  try{window.scrollTo({top:0,behavior:"auto"})}catch(e){window.scrollTo(0,0)}
}
buildNav();
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
