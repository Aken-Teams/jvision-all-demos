<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SECS/GEM 設備通訊介面系統｜Jvision 系統 Demo</title>
<meta name="description" content="SECS-II 訊息解析、HSMS 連線管理與設備事件回報的通訊中樞" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#4f46e5; --accent2:#818cf8; --accent-soft:#eef2ff;
  --bg:#f4f5fb; --panel:#ffffff; --ink:#1e1b3a; --muted:#6b7291;
  --line:#e6e7f2; --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#0891b2;
  --radius:14px; --shadow:0 1px 2px rgba(30,27,58,.06),0 8px 24px rgba(79,70,229,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
a{color:inherit;text-decoration:none}

.app{max-width:1360px;margin:0 auto;padding:16px;display:grid;grid-template-columns:230px 1fr;gap:16px;min-height:100vh}
.app>*{min-width:0}

.rail{background:linear-gradient(180deg,#312e81,#4f46e5);color:#fff;border-radius:var(--radius);padding:16px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:16px;align-self:start;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:8px}
.brand .logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.brand .logo .material-symbols-outlined{font-size:23px;color:#fff}
.brand b{font-size:15px;font-weight:800;letter-spacing:.2px;display:block}
.brand span{font-size:11px;color:#c7d2fe;font-weight:500}
.nav{display:flex;flex-direction:column;gap:4px;min-width:0}
.nav button{display:flex;align-items:center;gap:11px;background:transparent;border:0;color:#dfe1fb;padding:10px 11px;border-radius:10px;cursor:pointer;font:inherit;font-size:13.5px;font-weight:600;text-align:left;width:100%;transition:.15s;min-width:0}
.nav button .material-symbols-outlined{font-size:20px;flex:none}
.nav button .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav button:hover{background:rgba(255,255,255,.10);color:#fff}
.nav button.on{background:#fff;color:#312e81;font-weight:800;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.railfoot{margin-top:auto;padding-top:12px;border-top:1px solid rgba(255,255,255,.14);font-size:11px;color:#c7d2fe;display:flex;flex-direction:column;gap:6px}
.railfoot .liverow{display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80;flex:none;box-shadow:0 0 0 0 rgba(74,222,128,.7);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.6)}70%{box-shadow:0 0 0 7px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}

.main{display:flex;flex-direction:column;gap:14px;min-width:0}
.topbar{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;box-shadow:var(--shadow);flex-wrap:wrap}
.topbar h1{font-size:17px;margin:0;font-weight:800;display:flex;align-items:center;gap:9px}
.topbar h1 .material-symbols-outlined{color:var(--accent);font-size:22px}
.topbar .sub{font-size:12px;color:var(--muted);margin-top:2px}
.topchips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:20px;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;gap:5px}
.chip .material-symbols-outlined{font-size:15px}
.chip.live{background:#ecfdf5;color:#047857}
.chip.live .d{width:7px;height:7px;border-radius:50%;background:#10b981;animation:pulse 2s infinite}

.screen{display:flex;flex-direction:column;gap:14px;min-width:0}

.split{display:grid;grid-template-columns:340px 1fr;gap:14px;min-width:0;align-items:start}
.split>*{min-width:0}
.split.wide{grid-template-columns:1fr 320px}
.split.wide2{grid-template-columns:1fr 300px}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.pane-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
.pane-h b{font-size:13px;font-weight:800}
.pane-h .cnt{font-size:11px;color:var(--muted);font-weight:600}
.pane-b{padding:12px 14px}
.list{display:flex;flex-direction:column;max-height:560px;overflow-y:auto}
.li{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:5px;transition:.12s;border-left:3px solid transparent}
.li:hover{background:#fafaff}
.li.on{background:var(--accent-soft);border-left-color:var(--accent)}
.li-t{display:flex;align-items:center;justify-content:space-between;gap:8px}
.li-t b{font-size:13px;font-weight:700}
.li-m{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mono{font-family:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace}

.st{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:20px;white-space:nowrap;letter-spacing:.2px}
.st.ok{background:#dcfce7;color:#166534}.st.warn{background:#fef3c7;color:#92400e}.st.bad{background:#fee2e2;color:#991b1b}.st.info{background:#cffafe;color:#155e75}.st.idle{background:#eef2f7;color:#475569}

.grid{display:grid;gap:12px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.grid>*{min-width:0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.kpi .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.kpi .ic .material-symbols-outlined{font-size:20px}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:600}
.kpi .val{font-size:24px;font-weight:900;letter-spacing:-.5px}
.kpi .val small{font-size:12px;font-weight:700;color:var(--muted)}
.kpi .delta{font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.card h3{margin:0 0 4px;font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:7px}
.card h3 .material-symbols-outlined{font-size:18px;color:var(--accent)}
.card .csub{font-size:11.5px;color:var(--muted);margin-bottom:10px}
.chartwrap{position:relative;width:100%}

.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:11px;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fbfbfe}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:#fafaff}

.secs{font-family:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:#1e1b3a;color:#e0e7ff;border-radius:12px;padding:14px 16px;line-height:1.8;overflow-x:auto}
.secs .k{color:#a5b4fc}.secs .fmt{color:#f0abfc}.secs .v{color:#86efac}.secs .c{color:#64748b}
.secs .ln{white-space:pre}
.hdrgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hdrgrid>div{background:#faf5ff;border:1px solid #ede9fe;border-radius:10px;padding:8px 10px}
.hdrgrid .l{font-size:10.5px;color:var(--muted);font-weight:600}
.hdrgrid .n{font-size:15px;font-weight:800;color:var(--accent)}

.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;min-width:0}
.board>*{min-width:0}
.col{background:#fbfbfe;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:9px}
.col-h{font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
.col-h .n{font-size:11px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 8px;color:var(--muted)}
.ev{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px;box-shadow:0 1px 2px rgba(30,27,58,.05);border-left:3px solid var(--accent2)}
.ev.a{border-left-color:var(--bad)}.ev.w{border-left-color:var(--warn)}.ev.o{border-left-color:var(--ok)}
.ev b{font-size:12px;display:block}
.ev .m{font-size:10.5px;color:var(--muted);margin-top:3px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}

.tl{display:flex;flex-direction:column;gap:0}
.tl .row{display:grid;grid-template-columns:72px 22px 1fr;gap:10px;align-items:flex-start;min-width:0}
.tl .tm{font-size:11px;color:var(--muted);text-align:right;padding-top:2px;font-family:ui-monospace,monospace}
.tl .rail-c{display:flex;flex-direction:column;align-items:center}
.tl .nd{width:12px;height:12px;border-radius:50%;background:var(--accent);margin-top:4px;flex:none;box-shadow:0 0 0 3px var(--accent-soft)}
.tl .nd.bad{background:var(--bad);box-shadow:0 0 0 3px #fee2e2}
.tl .nd.warn{background:var(--warn);box-shadow:0 0 0 3px #fef3c7}
.tl .nd.ok{background:var(--ok);box-shadow:0 0 0 3px #dcfce7}
.tl .ln2{width:2px;flex:1;background:var(--line);min-height:20px}
.tl .bd{padding-bottom:16px}
.tl .bd b{font-size:12.5px}
.tl .bd p{margin:2px 0 0;font-size:11.5px;color:var(--muted)}

.pbar{height:7px;background:#eef0f8;border-radius:20px;overflow:hidden}
.pbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:20px}

.flowline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;font-weight:700;color:var(--muted)}
.flowline .stp{background:var(--accent-soft);color:var(--accent);padding:4px 10px;border-radius:8px;white-space:nowrap}
.flowline .material-symbols-outlined{font-size:15px;color:var(--accent2)}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:#eef2ff;color:var(--accent)}
.tag.g{background:#dcfce7;color:#166534}.tag.r{background:#fee2e2;color:#991b1b}.tag.y{background:#fef3c7;color:#92400e}

.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.meta>div{background:#fbfbfe;border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.meta .l{font-size:10.5px;color:var(--muted);font-weight:600}
.meta .v{font-size:13px;font-weight:700;margin-top:2px}

@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:static;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px}
  .brand{border-bottom:0;padding:4px 6px;margin:0;flex:none}
  .nav{flex-direction:row;flex-wrap:wrap;flex:1}
  .nav button{width:auto;flex:none;white-space:nowrap}
  .railfoot{display:none}
  .split,.split.wide,.split.wide2{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .hdrgrid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:820px){
  .g4,.g3,.g2{grid-template-columns:1fr}
  .meta{grid-template-columns:1fr}
}
@media(max-width:560px){
  .nav button .tx{display:none}
  .nav button{padding:9px 11px}
  .topbar h1{font-size:15px}
}
</style>
</head>
<body>

/* ============ RENDER TABLE ============ */
var RENDER=[
  {fn:scr0,init:function(){eqDetail(0);bindList("eqList","eq",eqDetail);}},
  {fn:scr1,init:function(){msgDetail(3);bindList("msgList","msg",msgDetail);}},
  {fn:scr2,init:initScr2},
  {fn:scr3,init:initScr3},
  {fn:scr4,init:initScr4},
  {fn:scr5,init:initScr5}
];
function bindList(listId,attr,cb){
  var box=el(listId);if(!box)return;
  var items=box.querySelectorAll(".li");
  for(var i=0;i<items.length;i++){(function(node){
    node.addEventListener("click",function(){
      for(var j=0;j<items.length;j++)items[j].classList.remove("on");
      node.classList.add("on");
      cb(+node.getAttribute("data-"+attr));
    });
  })(items[i]);}
}

var cur=-1;
function show(i){
  i=Math.max(0,Math.min(RENDER.length-1,i|0));
  if(i===cur)return;
  killCharts();
  cur=i;
  var m=MODULES[i];
  el("tTitle").textContent=m.name;
  el("tIco").textContent=m.icon;
  el("tSub").textContent=m.sub;
  el("tChips").innerHTML='<span class="chip live"><span class="d"></span>Gateway 即時擷取</span><span class="chip"><span class="material-symbols-outlined">memory</span>GEM 標準</span><span class="chip"><span class="material-symbols-outlined">dns</span>24 設備</span>';
  var nav=el("nav").querySelectorAll("button");
  for(var k=0;k<nav.length;k++)nav[k].classList.toggle("on",k===i);
  var v=el("view");
  v.innerHTML=RENDER[i].fn();
  void v.offsetHeight;
  if(RENDER[i].init)RENDER[i].init();
}

(function(){
  var nav=el("nav");
  nav.innerHTML=MODULES.map(function(m,i){
    return '<button data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="tx">'+m.name+'</span></button>';
  }).join("");
  var btns=nav.querySelectorAll("button");
  for(var i=0;i<btns.length;i++){(function(b){b.addEventListener("click",function(){show(+b.getAttribute("data-i"));try{window.scrollTo(0,0);}catch(e){}});})(btns[i]);}
})();
show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
