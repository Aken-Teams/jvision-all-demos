<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SECS/GEM 設備通訊介面系統｜Jvision 系統 Demo</title>
<meta name="description" content="SECS-II 訊息解析、HSMS 連線管理與設備事件回報的通訊中樞" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;

  --blue:var(--color-primary);
  --ink:var(--color-foreground);
  --muted:var(--color-muted-foreground);
  --line:var(--color-border);

  --panel:var(--color-card);
  --bg:var(--color-background);
  --ok:#15803D;
  --warn:#B45309;
  --bad:var(--color-destructive);
  --info:#0369A1;
  --radius:6px;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 5px 16px rgba(15,23,42,.045);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Fira Sans",system-ui,sans-serif;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,a,[data-eq],[data-msg]{cursor:pointer}
button,input,select,textarea{font:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
svg{display:block}
.mono,.num,.time,.code{font-family:"Fira Code",ui-monospace,monospace}
.num{text-align:right;font-variant-numeric:tabular-nums}
.icon{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

.app{
  width:min(100%,1440px);
  min-height:100vh;
  margin:auto;
  display:grid;
  grid-template-columns:248px minmax(0,1fr);
}
.rail{
  position:sticky;
  top:0;
  height:100vh;
  padding:20px 14px;
  background:#0F2447;
  color:#fff;
  border-right:1px solid #1E3A68;
  display:flex;
  flex-direction:column;
  z-index:10;
}
.brand{
  display:grid;
  grid-template-columns:40px 1fr;
  gap:11px;
  align-items:center;
  padding:0 8px 20px;
  border-bottom:1px solid rgba(255,255,255,.16);
}
.logo{
  width:40px;height:40px;
  display:grid;place-items:center;
  background:var(--color-primary);
  border:1px solid #60A5FA;
  border-radius:4px;
}
.brand b{display:block;font-size:15px;letter-spacing:.04em}
.brand span{display:block;margin-top:2px;color:#BFDBFE;font-size:11px}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:16px}
.nav button{
  width:100%;
  min-height:44px;
  padding:10px 11px;
  border:1px solid transparent;
  border-radius:4px;
  background:transparent;
  color:#CBD5E1;
  display:flex;
  gap:10px;
  align-items:center;
  text-align:left;
  font-size:13px;
  font-weight:500;
  transition:background-color .2s,color .2s,border-color .2s;
}
.nav button:hover{background:#173868;color:#fff;border-color:#31578A}
.nav button.on{
  background:#fff;
  color:#153A72;
  border-color:#fff;
  box-shadow:inset 4px 0 var(--color-accent);
  font-weight:700;
}
.railfoot{
  margin-top:auto;
  padding:16px 8px 0;
  border-top:1px solid rgba(255,255,255,.16);
  color:#CBD5E1;
  font-size:11px;
}
.live-row{display:flex;align-items:center;gap:8px;color:#DCFCE7;font-weight:600;margin-bottom:5px}
.live-mark{
  width:17px;height:17px;
  border:1px solid #4ADE80;
  border-radius:50%;
  display:grid;place-items:center;
}
.live-mark::after{content:"";width:5px;height:5px;background:#4ADE80;border-radius:50%}

.main{min-width:0;padding:18px 22px 30px}
.topbar{
  position:sticky;
  top:0;
  z-index:8;
  margin:-18px -22px 16px;
  min-height:76px;
  padding:14px 22px;
  background:rgba(248,250,252,.96);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
}
.title-group{display:flex;align-items:center;gap:12px;min-width:0}
.title-icon{
  width:38px;height:38px;
  border:1px solid #BFDBFE;
  background:#EFF6FF;
  color:var(--blue);
  display:grid;place-items:center;
  border-radius:4px;
}
.topbar h1{margin:0;font-size:19px;line-height:1.25;letter-spacing:-.01em}
.sub{margin-top:3px;color:var(--muted);font-size:12px}
.topchips{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.chip{
  min-height:28px;
  padding:4px 9px;
  display:inline-flex;align-items:center;gap:6px;
  color:#1E40AF;
  background:#EFF6FF;
  border:1px solid #BFDBFE;
  border-radius:3px;
  font-size:11px;font-weight:600;
  white-space:nowrap;
}
.chip.live{color:#166534;background:#F0FDF4;border-color:#BBF7D0}

.screen{display:flex;flex-direction:column;gap:14px;animation:reveal .35s ease-out both}
.grid{display:grid;gap:12px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi,.card,.pane{
  min-width:0;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.kpi{
  min-height:130px;
  padding:14px 15px 13px;
  display:grid;
  grid-template-columns:32px 1fr;
  grid-template-rows:auto auto auto;
  gap:5px 10px;
  border-top:3px solid var(--blue);
  transition:transform .2s,box-shadow .2s,border-color .2s;
}
.kpi:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(15,23,42,.08)}
.kpi.warning{border-top-color:var(--warn)}
.kpi.danger{border-top-color:var(--bad)}
.kpi.success{border-top-color:var(--ok)}
.kpi .ic{
  grid-row:1/3;
  width:32px;height:32px;
  display:grid;place-items:center;
  color:var(--blue);
  background:#EFF6FF;
  border:1px solid #DBEAFE;
  border-radius:4px;
}
.kpi.warning .ic{color:var(--warn);background:#FFFBEB;border-color:#FDE68A}
.kpi.danger .ic{color:var(--bad);background:#FEF2F2;border-color:#FECACA}
.kpi.success .ic{color:var(--ok);background:#F0FDF4;border-color:#BBF7D0}
.kpi .lab{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.035em}
.kpi .val{font:700 24px/1.15 "Fira Code",monospace;font-variant-numeric:tabular-nums}
.kpi .val small{font:500 11px "Fira Sans",sans-serif;color:var(--muted)}
.kpi .delta{grid-column:1/-1;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.delta.good{color:#166534}.delta.risk{color:#991B1B}

.split{display:grid;grid-template-columns:340px minmax(0,1fr);gap:14px;align-items:start}
.split.wide{grid-template-columns:minmax(0,1fr) 320px}
.split.wide2{grid-template-columns:minmax(0,1fr) 300px}
.pane{overflow:hidden}
.pane-h{
  min-height:44px;
  padding:10px 13px;
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:#FBFDFF;
}
.pane-h b,.card h3{font-size:13px;margin:0;font-weight:700}
.cnt,.csub{font-size:11px;color:var(--muted)}
.pane-b{padding:13px}
.card{padding:14px}
.card h3{display:flex;align-items:center;gap:7px}
.card h3 .icon{color:var(--blue)}
.csub{margin:3px 0 10px}

.list{max-height:570px;overflow:auto}
.li{
  min-height:66px;
  padding:10px 12px;
  border-bottom:1px solid var(--line);
  border-left:3px solid transparent;
  transition:background-color .2s,border-color .2s;
}
.li:last-child{border-bottom:0}
.li:hover{background:#F8FAFC}
.li.on{background:#EFF6FF;border-left-color:var(--blue)}
.li-t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.li-t b{font-size:12.5px}
.li-m{margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:10.5px}

.st,.tag{
  display:inline-flex;align-items:center;gap:5px;
  padding:2px 7px;
  border:1px solid;
  border-radius:3px;
  font-size:10px;font-weight:700;
  white-space:nowrap;
}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.ok{color:#166534;background:#F0FDF4;border-color:#BBF7D0}
.st.warn{color:#92400E;background:#FFFBEB;border-color:#FDE68A}
.st.bad{color:#991B1B;background:#FEF2F2;border-color:#FECACA}
.st.info{color:#075985;background:#F0F9FF;border-color:#BAE6FD}
.st.idle{color:#475569;background:#F8FAFC;border-color:#CBD5E1}
.tag{color:#1E40AF;background:#EFF6FF;border-color:#BFDBFE}
.tag.g{color:#166534;background:#F0FDF4;border-color:#BBF7D0}
.tag.r{color:#991B1B;background:#FEF2F2;border-color:#FECACA}
.tag.y{color:#92400E;background:#FFFBEB;border-color:#FDE68A}

.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.meta>div,.hdrgrid>div{
  padding:9px 10px;
  background:#F8FAFC;
  border:1px solid var(--line);
  border-radius:4px;
}
.meta .l,.hdrgrid .l{font-size:10px;color:var(--muted);font-weight:600}
.meta .v,.hdrgrid .n{margin-top:3px;font-size:12.5px;font-weight:700}
.hdrgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.hdrgrid .n{color:#1D4ED8;font-family:"Fira Code",monospace}

.chartwrap{position:relative;width:100%}
.pbar{height:7px;background:#E2E8F0;border-radius:2px;overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--blue);border-radius:2px}

.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{
  padding:9px 10px;
  color:#334155;
  background:#F1F5F9;
  border:1px solid var(--line);
  text-align:left;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.025em;
  white-space:nowrap;
}
.tbl td{
  padding:9px 10px;
  border-bottom:1px solid var(--line);
  vertical-align:middle;
}
.tbl tbody tr:hover{background:#F8FAFC}
.tbl tbody tr:last-child td{border-bottom:0}

.secs{
  padding:14px 16px;
  overflow:auto;
  background:#0F172A;
  border:1px solid #334155;
  border-radius:4px;
  color:#E2E8F0;
  font:12px/1.75 "Fira Code",monospace;
}
.secs .ln{white-space:pre}
.secs .k{color:#93C5FD}.secs .fmt{color:#FDBA74}.secs .v{color:#86EFAC}.secs .c{color:#94A3B8}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;color:var(--muted);font-size:10.5px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:1px}

.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.col{padding:9px;background:#F8FAFC;border:1px solid var(--line);border-radius:4px}
.col-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:11.5px;font-weight:700}
.col-h .n{padding:1px 6px;border:1px solid var(--line);background:#fff;border-radius:2px;color:var(--muted)}
.ev{
  padding:9px;
  margin-bottom:7px;
  background:#fff;
  border:1px solid var(--line);
  border-left:3px solid var(--blue);
  border-radius:3px;
}
.ev:last-child{margin-bottom:0}
.ev.a{border-left-color:var(--bad)}.ev.w{border-left-color:var(--warn)}.ev.o{border-left-color:var(--ok)}
.ev b{font-size:11.5px}
.ev .m{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px;color:var(--muted);font-size:10px}

.tl .row{display:grid;grid-template-columns:65px 18px 1fr;gap:8px}
.tl .tm{text-align:right;color:var(--muted);font:10px "Fira Code",monospace;padding-top:2px}
.rail-c{display:flex;flex-direction:column;align-items:center}
.nd{width:10px;height:10px;margin-top:3px;border:2px solid #fff;border-radius:50%;background:var(--blue);box-shadow:0 0 0 2px #93C5FD}
.nd.bad{background:var(--bad);box-shadow:0 0 0 2px #FCA5A5}
.nd.warn{background:var(--warn);box-shadow:0 0 0 2px #FCD34D}
.nd.ok{background:var(--ok);box-shadow:0 0 0 2px #86EFAC}
.ln2{width:1px;flex:1;min-height:20px;background:var(--line)}
.tl .bd{padding-bottom:14px}
.tl .bd b{font-size:11.5px}
.tl .bd p{margin:2px 0 0;color:var(--muted);font-size:10.5px}

.flowline{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stp{padding:5px 8px;color:#1E40AF;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:3px;font-size:10.5px;font-weight:600}
.arrow{color:var(--blue);font-weight:700}
.empty-note{padding:18px;color:var(--muted);text-align:center}

@keyframes reveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:1080px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:1fr}
}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;padding:12px}
  .brand{padding:0 4px 12px}
  .nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:10px}
  .nav button{justify-content:center;text-align:center}
  .railfoot{display:none}
  .main{padding:14px}
  .topbar{position:static;margin:-14px -14px 14px;padding:12px 14px}
  .split,.split.wide,.split.wide2{grid-template-columns:1fr}
}
@media(max-width:768px){
  .g2{grid-template-columns:1fr}
  .hdrgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:560px){
  .main{padding:10px}
  .topbar{margin:-10px -10px 12px;padding:11px 10px;align-items:flex-start}
  .topchips{display:none}
  .topbar h1{font-size:16px}
  .sub{font-size:11px}
  .title-icon{width:34px;height:34px}
  .nav{grid-template-columns:repeat(6,1fr)}
  .nav button{min-width:0;padding:10px 6px}
  .nav .tx{display:none}
  .g4,.g2{grid-template-columns:1fr}
  .meta,.hdrgrid{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  .screen{opacity:1;transform:none}
}
</style>
</head>
<body>
<svg class="sr-only" aria-hidden="true">

<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="logo"><svg class="icon"><use href="#i-hub"/></svg></div>
      <div><b>SECS/GEM</b><span>設備通訊介面中樞</span></div>

  <main class="main">
    <header class="topbar">
      <div class="title-group">
        <div class="title-icon" id="titleIcon"></div>
        <div>
          <h1 id="tTitle">HSMS 連線管理</h1>
          <div class="sub" id="tSub"></div>

      <div class="topchips">
        <span class="chip live"><span class="live-mark"></span>Gateway 即時擷取</span>

        <span class="chip"><svg class="icon"><use href="#i-server"/></svg>24 設備</span>
      </div>
    </header>
    <div id="view"></div>
  </main>
</div>

<script>
var MODULES=[
  {icon:"i-lan",name:"HSMS 連線管理",sub:"TCP/IP 連線建立、Select/Linktest 心跳與斷線重連"},
  {icon:"i-code",name:"SECS-II 訊息解析",sub:"SxFy Stream/Function 與資料項目編解碼檢視"},
  {icon:"i-bolt",name:"事件與狀態回報",sub:"CEID 採集事件、SVID/DVID 變數即時上報"},
  {icon:"i-bell",name:"設備警報管理",sub:"ALID 警報觸發、解除與 S5F1 通知處理"},
  {icon:"i-sync",name:"MES/EAP 資料寫入",sub:"採集資料映射並回寫 MES、EAP、FDC 系統"},
  {icon:"i-heart",name:"通訊健康監控",sub:"通訊成功率、斷線頻率與延遲趨勢儀表"}
];

function bindList(id,attr,callback){
  var nodes=el(id).querySelectorAll(".li");
  function select(node){
    nodes.forEach(function(n){n.classList.remove("on")});
    node.classList.add("on");
    callback(+node.getAttribute("data-"+attr))
  }
  nodes.forEach(function(node){
    node.addEventListener("click",function(){select(node)});
    node.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();select(node)}})
  })
}
var RENDER=[
  {fn:scr0,init:function(){eqDetail(0);bindList("eqList","eq",eqDetail)}},
  {fn:scr1,init:function(){msgDetail(3);bindList("msgList","msg",msgDetail)}},
  {fn:scr2,init:init2},
  {fn:scr3,init:init3},
  {fn:scr4,init:init4},
  {fn:scr5,init:init5}
];
var current=-1;
function show(i){
  i=Math.max(0,Math.min(5,Number(i)||0));
  if(i===current)return;
  killCharts();
  current=i;
  el("tTitle").textContent=MODULES[i].name;
  el("tSub").textContent=MODULES[i].sub;
  el("titleIcon").innerHTML=icon(MODULES[i].icon);
  el("nav").querySelectorAll("button").forEach(function(b,n){
    b.classList.toggle("on",n===i);
    b.setAttribute("aria-current",n===i?"page":"false")
  });
  el("view").innerHTML=RENDER[i].fn();
  if(RENDER[i].init)RENDER[i].init()
}
(function(){
  el("nav").innerHTML=MODULES.map(function(m,i){return '<button type="button" data-i="'+i+'" aria-label="'+esc(m.name)+'">'+icon(m.icon)+'<span class="tx">'+m.name+'</span></button>'}).join("");
  el("nav").querySelectorAll("button").forEach(function(b){
    b.addEventListener("click",function(){
      var i=+b.getAttribute("data-i");
      if(location.hash!=="#v"+i)location.hash="v"+i;
      else show(i);
      window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})
    })
  })
})();
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  show(m?Math.min(+m[1],5):0)
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
