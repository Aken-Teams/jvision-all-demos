<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>特權帳號管理系統（PAM）</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#0d9488;--accent2:#2dd4bf;--bg:#f0fbfa;--panel:#ffffff;
  --line:#d7ebe8;--ink:#0f2e2b;--muted:#5b7d79;--soft:#f2fbfa;
  --ok:#0f766e;--warn:#b45309;--bad:#b91c1c;--info:#2563eb;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;vertical-align:middle}
.app{display:flex;min-height:100vh;max-width:100%}
.side{width:250px;flex:0 0 250px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh;min-width:0}
.brand{display:flex;gap:11px;align-items:center;padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 42px}
.brand .logo .material-symbols-outlined{font-size:25px;color:#fff}
.brand b{font-size:15px;font-weight:700;display:block;line-height:1.3}
.brand span{font-size:11px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:4px;min-width:0}
.nav .lbl{font-size:11px;color:var(--muted);letter-spacing:.06em;padding:8px 10px 4px;font-weight:600}
.navbtn{display:flex;gap:11px;align-items:center;padding:10px 11px;border-radius:10px;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:13.5px;color:var(--ink);text-align:left;width:100%;min-width:0;transition:background .12s}
.navbtn .material-symbols-outlined{font-size:20px;color:var(--accent);flex:0 0 20px}
.navbtn small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.navbtn .txt{min-width:0;overflow:hidden}
.navbtn .txt b{font-weight:600;font-size:13.5px}
.navbtn:hover{background:var(--soft)}
.navbtn.on{background:var(--accent);color:#fff}
.navbtn.on .material-symbols-outlined{color:#fff}
.navbtn.on small,.navbtn.on .txt b{color:#fff}
.side .foot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.main{flex:1;min-width:0;padding:22px 26px 40px;max-width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:20px;font-weight:700;display:flex;align-items:center;gap:9px}
.top h1 .material-symbols-outlined{font-size:24px;color:var(--accent)}
.top .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.top .meta{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:11.5px;padding:5px 11px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--muted);display:flex;gap:5px;align-items:center;white-space:nowrap}
.chip b{color:var(--accent);font-weight:600}
.grid{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1fr 2fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h3{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px;margin-bottom:12px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.card h3 .tag{margin-left:auto;font-size:11px;font-weight:500;color:var(--muted);padding:3px 9px;background:var(--soft);border-radius:99px;border:1px solid var(--line)}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px;min-width:0;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--accent),var(--accent2))}
.kpi .k-t{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .k-t .material-symbols-outlined{font-size:17px;color:var(--accent)}
.kpi .k-v{font-size:26px;font-weight:700;margin-top:7px;letter-spacing:-.01em}
.kpi .k-v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:3px}
.kpi .k-d{font-size:11.5px;margin-top:4px;display:flex;align-items:center;gap:4px}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
.kpi .k-d .material-symbols-outlined{font-size:15px}
.tw{overflow-x:auto;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px}
th{text-align:left;font-weight:600;color:var(--muted);padding:9px 11px;border-bottom:2px solid var(--line);white-space:nowrap;background:var(--soft)}
td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
.badge{font-size:11px;padding:3px 9px;border-radius:99px;font-weight:500;white-space:nowrap;display:inline-block}
.b-ok{background:#ccfbf1;color:#0f766e}
.b-warn{background:#fef3c7;color:#b45309}
.b-bad{background:#fee2e2;color:#b91c1c}
.b-info{background:#dbeafe;color:#2563eb}
.b-mut{background:#e2e8f0;color:#475569}
.av{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex:0 0 28px}
.mono{font-family:"Inter",monospace;font-variant-numeric:tabular-nums}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0}
.col{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:11px;min-width:0}
.col .col-h{font-size:12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;color:var(--muted)}
.col .col-h .n{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:11px}
.tk{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:8px}
.tk:last-child{margin-bottom:0}
.tk .t-t{font-size:12.5px;font-weight:600;margin-bottom:5px;line-height:1.35}
.tk .t-m{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tk .brd{height:3px;border-radius:99px;margin-bottom:8px}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .ti{position:relative;padding:0 0 16px 4px}
.tl .ti:last-child{padding-bottom:0}
.tl .ti::before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.tl .ti .th{font-size:12.5px;font-weight:600}
.tl .ti .tm{font-size:11px;color:var(--muted);margin-top:2px}
.chart{width:100%;overflow:hidden;min-width:0}
.list{display:flex;flex-direction:column;gap:9px}
.li{display:flex;gap:11px;align-items:flex-start;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--soft);min-width:0}
.li .ic{width:32px;height:32px;border-radius:9px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 32px}
.li .ic .material-symbols-outlined{font-size:18px;color:var(--accent)}
.li .lt{min-width:0}
.li .lt b{font-size:12.5px;font-weight:600;display:block}
.li .lt span{font-size:11.5px;color:var(--muted)}
.li .lr{margin-left:auto;text-align:right;flex:0 0 auto}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tg{font-size:11px;padding:3px 9px;border-radius:7px;background:var(--soft);border:1px solid var(--line);color:var(--accent);font-weight:500}
.tg.a{background:var(--accent);color:#fff;border-color:var(--accent)}
.bar-row{display:flex;flex-direction:column;gap:11px}
.bar-row .br{min-width:0}
.bar-row .br .bl{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.bar-row .br .bl b{font-weight:600}
.bar-row .br .bt{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar-row .br .bf{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.divi{height:1px;background:var(--line);margin:12px 0}
.mini{font-size:11px;color:var(--muted)}
.rowb{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
.rowb:last-child{border-bottom:none}
.rowb .rt{min-width:0;flex:1}
.rowb .rt b{font-size:12.5px;font-weight:600;display:block}
.rowb .rt span{font-size:11px;color:var(--muted)}
.step{display:flex;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--panel);min-width:0}
.step .sn{width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 26px}
.step.done .sn{background:var(--ok)}
.step .st-b{min-width:0}
.step .st-b b{font-size:12.5px;display:block;font-weight:600}
.step .st-b span{font-size:11px;color:var(--muted)}
.step .material-symbols-outlined{margin-left:auto;font-size:19px;color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 8px}
.player{background:#0b2b28;border:1px solid #124a44;border-radius:12px;overflow:hidden}
.player .scr{padding:14px 16px;font-family:monospace;font-size:12px;color:#8ff0e2;min-height:150px;line-height:1.7}
.player .scr .cmd{color:#5eead4}
.player .scr .out{color:#7dd3c8;opacity:.75}
.player .scr .warn{color:#fca5a5}
.player .bar{display:flex;align-items:center;gap:10px;padding:9px 14px;background:#0e3733;border-top:1px solid #124a44}
.player .bar .material-symbols-outlined{color:#5eead4;font-size:20px}
.player .bar .track{flex:1;height:5px;background:#124a44;border-radius:99px;overflow:hidden;min-width:0}
.player .bar .track .f{height:100%;width:62%;background:linear-gradient(90deg,var(--accent2),#5eead4)}
.player .bar .tm{font-size:11px;color:#8ff0e2;font-family:monospace;flex:0 0 auto}
.player .dots{display:flex;gap:8px;align-items:center;padding:8px 14px;background:#0b2b28;border-top:1px solid #124a44}
.player .dots i{width:9px;height:9px;border-radius:50%;background:#f87171;display:inline-block;flex:0 0 9px}
.pill-nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.tab{font-size:12px;padding:6px 13px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:default}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{position:static;width:100%;height:auto;flex:none;flex-direction:column;border-right:none;border-bottom:1px solid var(--line);padding:12px}
  .side .foot{display:none}
  .nav{flex-direction:row;flex-wrap:wrap;gap:6px}
  .nav .lbl{display:none}
  .navbtn{width:auto;flex:0 0 auto;padding:8px 12px}
  .navbtn small{display:none}
  .main{padding:16px 14px 32px}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .board{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){
  .navbtn .txt{display:none}
  .navbtn{padding:9px 11px}
  .board{grid-template-columns:1fr}
  .top h1{font-size:17px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">shield</span></div>

      <button class="navbtn" data-i="1"><span class="material-symbols-outlined">shield</span><span class="txt"><b>密碼保險箱</b><small>密碼保管與自動輪替</small></span></button>

      <button class="navbtn" data-i="3"><span class="material-symbols-outlined">monitoring</span><span class="txt"><b>工作階段側錄</b><small>連線錄影與即時監控</small></span></button>
      <button class="navbtn" data-i="4"><span class="material-symbols-outlined">history</span><span class="txt"><b>到期自動收回</b><small>授權到期權限回收</small></span></button>
      <button class="navbtn" data-i="5"><span class="material-symbols-outlined">verified</span><span class="txt"><b>覆蓋率與合規稽核</b><small>覆蓋率與輪替合規</small></span></button>
    </nav>
    <div class="foot">純 UI 展示 · 擬真資料<br/>資訊安全 · 特權存取治理</div>
  </aside>
  <main class="main">
    <div class="top">
      <div>
        <h1><span class="material-symbols-outlined" id="tIco">account_tree</span><span id="tTitle">特權帳號納管</span></h1>
        <div class="sub" id="tSub"></div>
      </div>
      <div class="meta">
        <span class="chip"><span class="material-symbols-outlined" style="font-size:15px;color:var(--accent)">key</span>納管帳號 <b>1,286</b></span>
        <span class="chip"><span class="material-symbols-outlined" style="font-size:15px;color:var(--accent)">verified_user</span>覆蓋率 <b>94.2%</b></span>
        <span class="chip"><span class="dot" style="background:var(--ok)"></span>保險箱連線中</span>
      </div>
    </div>
    <div id="screen"></div>
  </main>
</div>
<script>
(function(){
"use strict";
var ACC="#0d9488",AC2="#2dd4bf",A3="#5eead4",A4="#99f6e4",AMUT="#5b7d79",ALINE="#d7ebe8";
var chartObjs=[];
function disposeCharts(){for(var i=0;i<chartObjs.length;i++){try{chartObjs[i].dispose();}catch(e){}}chartObjs=[];}
function el(id){return document.getElementById(id);}
function mkChart(id,opt){var node=document.getElementById(id);if(!node)return;try{var c=echarts.init(node);c.setOption(opt);chartObjs.push(c);}catch(e){}}
var GTEXT={fontFamily:'"Inter","Noto Sans TC",sans-serif'};

var META=[
 {ico:"account_tree",title:"特權帳號納管",sub:"掃描網域、資料庫與OT設備發現特權帳號 · 登錄擁有者與用途後集中管控"},
 {ico:"shield",title:"密碼保險箱",sub:"特權密碼收進保險箱 · 設定輪替週期並由系統自動改密，人員不再持有明碼"},
 {ico:"task_alt",title:"臨時授權申請",sub:"填寫用途與期限提出臨時高權限申請 · 主管線上簽核後即時開通"},
 {ico:"monitoring",title:"工作階段側錄",sub:"經保險箱代理登入目標系統 · 全程錄影側錄指令，可即時中斷高風險操作"},
 {ico:"history",title:"到期自動收回",sub:"授權到期或用途結束自動收回權限並重置密碼 · 留存完整稽核紀錄"},
 {ico:"verified",title:"覆蓋率與合規稽核",sub:"追蹤特權帳號納管覆蓋率與密碼輪替合規率 · 產出稽核報表"}
];

function kpi(t,ic,v,u,d,cls,di){
 return '<div class="kpi"><div class="k-t"><span class="material-symbols-outlined">'+ic+'</span>'+t+'</div><div class="k-v">'+v+(u?'<small>'+u+'</small>':'')+'</div><div class="k-d '+cls+'"><span class="material-symbols-outlined">'+di+'</span>'+d+'</div></div>';
}
function badge(txt,cls){return '<span class="badge '+cls+'">'+txt+'</span>';}
function av(n){return '<span class="av">'+n+'</span>';}
function barRow(l,v,c){return '<div class="br"><div class="bl"><span>'+l+'</span><b>'+v+'</b></div><div class="bt"><div class="bf" style="width:'+Math.min(v,100)+'%'+(c?';background:'+c:'')+'"></div></div></div>';}
function ruleLi(id,txt,ev){return '<div class="li"><div class="ic"><span class="material-symbols-outlined">gavel</span></div><div class="lt"><b>'+id+'</b><span>'+txt+'</span><div class="mini" style="margin-top:3px;color:var(--accent)">依據：'+ev+'</div></div></div>';}

/* SCREEN 0 : 特權帳號納管 */
function s0(){
 var rows=[
  ["SVR-AD-01","網域管理員","Windows AD","administrator","資訊部","已納管","2026-08-12"],
  ["DB-ERP-PROD","資料庫SA","MSSQL ERP","sa","資訊部","已納管","2026-08-11"],
  ["OT-PLC-L3","PLC工程帳號","西門子 S7-1500","engineer","產線維護部","待納管","2026-08-13"],
  ["NET-CORE-SW","核心交換器","Cisco IOS","enable","資訊部","已納管","2026-08-09"],
  ["ESXi-CL02","虛擬化 root","VMware ESXi","root","資訊部","已納管","2026-08-08"],
  ["OT-SCADA-02","SCADA 監控","研O WebAccess","admin","產線維護部","待納管","2026-08-13"]
 ];
 var tbody="";
 for(var i=0;i<rows.length;i++){var r=rows[i];
  var st=r[5]==="已納管"?badge("已納管","b-ok"):badge("待納管","b-warn");
  tbody+='<tr><td><b class="mono">'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td><td><span class="tg">'+r[3]+'</span></td><td>'+r[4]+'</td><td>'+st+'</td><td class="mini">'+r[6]+'</td></tr>';
 }
 var h='';
 h+='<div class="grid g4" style="margin-bottom:14px">';
 h+=kpi("特權帳號總數","key","1,286","個","掃描發現","flat","travel_explore");
 h+=kpi("已納管","verified_user","1,211","個","本週 +34","up","trending_up");
 h+=kpi("待納管","warning","75","個","含 OT 22","down","priority_high");
 h+=kpi("納管覆蓋率","monitoring","94.2","%","+6.1pt","up","trending_up");
 h+='</div>';
 h+='<div class="grid g23">';
 h+='<div class="card"><h3><span class="material-symbols-outlined">account_tree</span>掃描發現的特權帳號<span class="tag">最新掃描</span></h3><div class="tw"><table><thead><tr><th>資產編號</th><th>帳號用途</th><th>系統平台</th><th>帳號名</th><th>擁有部門</th><th>納管狀態</th><th>發現日</th></tr></thead><tbody>'+tbody+'</tbody></table></div></div>';
 h+='<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>各平台帳號分布</h3><div id="c0a" class="chart" style="height:230px"></div><div class="divi"></div><div class="bar-row">'+barRow("Windows / AD",312)+barRow("資料庫",214)+barRow("網路設備",168)+'</div></div>';
 h+='</div>';
 h+='<div class="card" style="margin-top:14px"><h3><span class="material-symbols-outlined">travel_explore</span>近 6 次掃描納管進度</h3><div id="c0b" class="chart" style="height:240px"></div></div>';
 return h;
