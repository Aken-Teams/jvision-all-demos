<style>
:root{
  --color-primary:#00FF41;
  --color-on-primary:#0F172A;
  --color-secondary:#0D0D0D;
  --color-on-secondary:#FFFFFF;
  --color-accent:#FF3333;
  --color-on-accent:#000000;
  --color-background:#000000;
  --color-foreground:#E0E0E0;
  --color-card:#0C130E;
  --color-card-foreground:#E0E0E0;
  --color-muted:#181818;
  --color-muted-foreground:#A7B3C4;
  --color-border:#343434;
  --color-destructive:#EF4444;
  --color-on-destructive:#000000;
  --color-ring:#00FF41;
  --blue:#00FF41;
  --ink:#E0E0E0;
  --muted:#A7B3C4;
  --line:#343434;
  --accent:#00FF41;
  --accent2:#8AFFA7;
  --bg:#000000;
  --panel:#0C130E;
  --soft:#181818;
  --ok:#00FF41;
  --warn:#FFD600;
  --bad:#FF5C5C;
  --info:#67B7FF;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--color-background);color-scheme:dark;scroll-behavior:auto}
html,body{max-width:100%;overflow-x:hidden}
body{
  min-width:320px;
  background-color:var(--color-background);
  background-image:linear-gradient(rgba(0,255,65,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,65,.045) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--color-foreground);
  font-family:"Josefin Sans",sans-serif;
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,[data-i]{cursor:pointer}
::selection{background:var(--color-primary);color:var(--color-on-primary)}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;vertical-align:middle}
.app{display:flex;min-height:100vh;max-width:100%}
.side{

  width:272px;height:100vh;min-width:0;padding:0;
  background:#050705;border-right:2px solid var(--color-primary);
}
.brand{display:flex;gap:12px;align-items:center;padding:22px 18px;border-bottom:2px solid var(--color-primary);margin:0;background:var(--color-primary);color:var(--color-on-primary)}
.brand .logo{display:flex;align-items:center;justify-content:center;flex:0 0 46px;width:46px;height:46px;border:2px solid var(--color-on-primary);border-radius:0;background:transparent;color:var(--color-on-primary)}
.brand .logo .material-symbols-outlined{font-size:27px;color:var(--color-on-primary)}
.brand b{display:block;font-family:"Cinzel",serif;font-size:14px;font-weight:700;line-height:1.3;letter-spacing:.02em}
.brand span{font-size:10px;color:#17231A;letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:0;min-width:0}
.nav .lbl{padding:16px 16px 9px;border-bottom:1px solid var(--color-border);color:var(--color-muted-foreground);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.navbtn{position:relative;display:flex;gap:12px;align-items:center;width:100%;min-width:0;min-height:62px;padding:11px 16px;border:0;border-bottom:1px solid var(--color-border);border-radius:0;background:transparent;color:var(--color-foreground);text-align:left;transition:background-color .18s ease,color .18s ease,border-color .18s ease}

.navbtn:hover{background:#101810;color:#fff}

.navbtn .material-symbols-outlined{flex:0 0 22px;color:var(--color-primary);font-size:22px}
.navbtn small{display:block;color:var(--color-muted-foreground);font-size:11px;font-weight:400;letter-spacing:.02em}
.navbtn .txt{min-width:0;overflow:hidden}
.navbtn .txt b{font-size:13px;font-weight:700}
.navbtn.on{background:var(--color-primary);color:var(--color-on-primary)}
.navbtn.on::after{width:7px;background:var(--color-accent)}
.navbtn.on .material-symbols-outlined,.navbtn.on small,.navbtn.on .txt b{color:var(--color-on-primary)}
.side .foot{margin-top:auto;padding:16px;border-top:2px solid var(--color-primary);color:var(--color-muted-foreground);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.main{flex:1;min-width:0;max-width:100%;padding:28px 30px 48px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:18px;border-bottom:2px solid var(--color-primary)}
.top h1{display:flex;align-items:center;gap:11px;font-family:"Cinzel",serif;font-size:clamp(20px,2.2vw,30px);font-weight:700;line-height:1.2;letter-spacing:.015em}
.top h1 .material-symbols-outlined{padding:7px;background:var(--color-primary);color:var(--color-on-primary);font-size:25px}
.top .sub{max-width:820px;margin-top:7px;color:var(--color-muted-foreground);font-size:13px}
.top .meta{display:flex;gap:7px;flex-wrap:wrap}
.chip{display:flex;gap:6px;align-items:center;min-height:34px;padding:6px 10px;border:1px solid var(--color-border);border-radius:0;background:var(--color-card);color:var(--color-muted-foreground);font-size:11px;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.chip b{color:var(--color-primary);font-weight:700;font-variant-numeric:tabular-nums}
.grid{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g32{grid-template-columns:minmax(280px,1fr) minmax(0,2fr)}
.card,.kpi{min-width:0;border:1px solid var(--color-border);border-radius:0;background:var(--color-card);color:var(--color-card-foreground);box-shadow:6px 6px 0 #07190C}
.card{padding:17px}
.card:nth-child(even){border-top-color:var(--color-primary)}
.card h3{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--color-border);font-family:"Cinzel",serif;font-size:13px;font-weight:700;letter-spacing:.025em}
.card h3 .material-symbols-outlined{color:var(--color-primary);font-size:20px}
.card h3 .tag{margin-left:auto;padding:3px 8px;border:1px solid var(--color-primary);border-radius:0;background:transparent;color:var(--color-primary);font-family:"Josefin Sans",sans-serif;font-size:10px;font-weight:700;text-transform:uppercase}
.kpi{position:relative;overflow:hidden;padding:16px 17px 15px;border-left:5px solid var(--color-primary)}
.kpi::after{content:"//";position:absolute;right:10px;top:7px;color:#315038;font-family:monospace;font-size:18px;font-weight:700;letter-spacing:-4px}
.kpi .k-t{display:flex;align-items:center;gap:7px;color:var(--color-muted-foreground);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.kpi .k-t .material-symbols-outlined{color:var(--color-primary);font-size:18px}
.kpi .k-v{margin-top:8px;color:#fff;font-family:"Cinzel",serif;font-size:29px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .k-v small{margin-left:4px;color:var(--color-muted-foreground);font-family:"Josefin Sans",sans-serif;font-size:12px;font-weight:600}
.kpi .k-d{display:flex;align-items:center;gap:4px;margin-top:5px;font-size:11px;font-weight:600}
.kpi .k-d .material-symbols-outlined{font-size:15px}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--color-muted-foreground)}
.tw{overflow-x:auto;border:1px solid var(--color-border);border-radius:0;scrollbar-color:var(--color-primary) #101010}
table{width:100%;min-width:560px;border-collapse:collapse;font-size:12px}
th{padding:10px 11px;border-right:1px solid var(--color-border);border-bottom:2px solid var(--color-primary);background:#121812;color:#C9D2DE;font-size:10px;font-weight:700;letter-spacing:.07em;text-align:left;white-space:nowrap;text-transform:uppercase}
td{padding:10px 11px;border-right:1px solid #292929;border-bottom:1px solid var(--color-border);color:var(--color-foreground);vertical-align:middle}
th:last-child,td:last-child{border-right:0}
tbody tr:nth-child(even){background:#0A0E0B}
tbody tr:hover{background:#122016}
tr:last-child td{border-bottom:0}
td:last-child,.mono{font-variant-numeric:tabular-nums}
td:last-child{text-align:right}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border:1px solid currentColor;border-radius:0;background:transparent;font-size:10px;font-weight:700;line-height:1.3;white-space:nowrap}
.badge::before{content:"■";font-size:7px}
.b-ok{color:#40FF70}.b-warn{color:#FFE04A}.b-bad{color:#FF7171}.b-info{color:#7AC3FF}.b-mut{color:#BCC5D0}
.av{display:inline-flex;align-items:center;justify-content:center;flex:0 0 28px;width:28px;height:28px;border:1px solid var(--color-primary);border-radius:0;background:#07180B;color:var(--color-primary);font-size:11px;font-weight:700}
.mono{font-family:"Courier New",monospace;font-variant-numeric:tabular-nums}
.board{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:10px;min-width:880px}
.col{min-width:0;padding:10px;border:1px solid var(--color-border);border-radius:0;background:#080B09}
.col .col-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--color-primary);color:#D7DEE7;font-size:11px;font-weight:700;text-transform:uppercase}
.col .col-h .n{padding:1px 7px;border:1px solid var(--color-primary);border-radius:0;background:var(--color-primary);color:var(--color-on-primary);font-size:10px}
.tk{margin-bottom:8px;padding:10px;border:1px solid var(--color-border);border-radius:0;background:var(--color-card)}
.tk:last-child{margin-bottom:0}.tk .t-t{margin-bottom:6px;font-size:12px;font-weight:700;line-height:1.4}.tk .t-m{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--color-muted-foreground);font-size:10px}.tk .brd{height:3px;margin-bottom:8px;border-radius:0}
.tl{position:relative;padding-left:23px}.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--color-primary)}.tl .ti{position:relative;padding:0 0 18px 5px}.tl .ti:last-child{padding-bottom:0}.tl .ti::before{content:"";position:absolute;left:-22px;top:3px;width:12px;height:12px;border:2px solid var(--color-primary);border-radius:0;background:#000}.tl .ti .th{font-size:12px;font-weight:700}.tl .ti .tm{margin-top:3px;color:var(--color-muted-foreground);font-size:11px}
.chart{width:100%;min-width:0;overflow:hidden;filter:saturate(1.35) brightness(1.12)}
.list{display:flex;flex-direction:column;gap:8px}.li{display:flex;gap:11px;align-items:flex-start;min-width:0;padding:10px 11px;border:1px solid var(--color-border);border-left:3px solid var(--color-primary);border-radius:0;background:#090D0A}.li .ic{display:flex;align-items:center;justify-content:center;flex:0 0 32px;width:32px;height:32px;border:1px solid var(--color-primary);border-radius:0;background:#000}.li .ic .material-symbols-outlined{color:var(--color-primary);font-size:18px}.li .lt{min-width:0}.li .lt b{display:block;font-size:12px;font-weight:700}.li .lt span{color:var(--color-muted-foreground);font-size:11px}.li .lr{flex:0 0 auto;margin-left:auto;text-align:right}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tg{display:inline-block;padding:3px 7px;border:1px solid #487552;border-radius:0;background:#0A160D;color:#7DFF9D;font-size:10px;font-weight:600}.tg.a{border-color:var(--color-primary);background:var(--color-primary);color:var(--color-on-primary)}
.bar-row{display:flex;flex-direction:column;gap:11px}.bar-row .br{min-width:0}.bar-row .br .bl{display:flex;justify-content:space-between;margin-bottom:5px;font-size:11px}.bar-row .br .bl b{font-weight:700;font-variant-numeric:tabular-nums}.bar-row .br .bt{height:9px;overflow:hidden;border:1px solid var(--color-border);border-radius:0;background:#050505}.bar-row .br .bf{height:100%;border-radius:0;background:var(--color-primary)}
.divi{height:1px;margin:13px 0;background:var(--color-border)}.mini{color:var(--color-muted-foreground);font-size:10px}.rowb{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--color-border)}.rowb:last-child{border-bottom:0}.rowb .rt{flex:1;min-width:0}.rowb .rt b{display:block;font-size:12px;font-weight:700}.rowb .rt span{color:var(--color-muted-foreground);font-size:10px}
.step{display:flex;align-items:center;gap:10px;min-width:0;padding:11px;border:1px solid var(--color-border);border-radius:0;background:var(--color-card)}.step .sn{display:flex;align-items:center;justify-content:center;flex:0 0 27px;width:27px;height:27px;border-radius:0;background:var(--color-primary);color:var(--color-on-primary);font-size:11px;font-weight:700}.step.done .sn{background:var(--ok)}.step .st-b{min-width:0}.step .st-b b{display:block;font-size:12px;font-weight:700}.step .st-b span{color:var(--color-muted-foreground);font-size:10px}.step .material-symbols-outlined{margin-left:auto;color:var(--color-primary);font-size:19px}
.dot{display:inline-block;flex:0 0 8px;width:8px;height:8px;border:1px solid currentColor;border-radius:0}
.player{overflow:hidden;border:2px solid var(--color-primary);border-radius:0;background:#020503;box-shadow:6px 6px 0 #16351E}.player .scr{min-height:150px;padding:15px 16px;color:#A9FFBE;font-family:"Courier New",monospace;font-size:11px;line-height:1.75}.player .scr .cmd{color:#00FF41;font-weight:700}.player .scr .out{color:#B8C8BB}.player .scr .warn{display:block;padding:2px 5px;border-left:3px solid var(--color-accent);background:#2A0909;color:#FF9A9A}.player .bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid #25522F;background:#08130A}.player .bar .material-symbols-outlined{color:var(--color-primary);font-size:20px}.player .bar .track{flex:1;height:7px;min-width:0;overflow:hidden;border:1px solid #30663D;border-radius:0;background:#020503}.player .bar .track .f{width:62%;height:100%;background:var(--color-primary)}.player .bar .tm{flex:0 0 auto;color:#B4FFC6;font-family:"Courier New",monospace;font-size:10px}.player .dots{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid #25522F;background:#071009}.player .dots i{display:inline-block;flex:0 0 9px;width:9px;height:9px;border-radius:0;background:var(--color-accent)}
.pill-nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tab{padding:7px 12px;border:1px solid var(--color-border);border-radius:0;background:var(--color-card);color:var(--color-muted-foreground);font-size:11px;font-weight:700;text-transform:uppercase}.tab.on{border-color:var(--color-primary);background:var(--color-primary);color:var(--color-on-primary)}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.navbtn:focus-visible{position:relative;z-index:2;outline-color:#fff;outline-offset:-5px}
@media (prefers-reduced-motion:no-preference){
  #screen>.grid>* ,#screen>.card,.board>.col,.list>.li{animation:grid-enter .4s cubic-bezier(.22,1.35,.48,1) both}
  #screen>.grid>*:nth-child(2),.board>.col:nth-child(2),.list>.li:nth-child(2){animation-delay:.06s}
  #screen>.grid>*:nth-child(3),.board>.col:nth-child(3),.list>.li:nth-child(3){animation-delay:.12s}
  #screen>.grid>*:nth-child(4),.board>.col:nth-child(4),.list>.li:nth-child(4){animation-delay:.18s}
  #screen>.grid>*:nth-child(n+5),.list>.li:nth-child(n+5){animation-delay:.24s}
  @keyframes grid-enter{from{opacity:0;transform:translateY(16px) scale(.92)}to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media(max-width:1024px){.side{flex-basis:238px;width:238px}.main{padding:24px 20px 40px}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g23,.g32{grid-template-columns:1fr}.top{align-items:flex-start}}
@media(max-width:860px){.app{flex-direction:column}.side{position:static;width:100%;height:auto;flex:none;border-right:0;border-bottom:2px solid var(--color-primary)}.brand{padding:13px 14px}.brand .logo{width:38px;height:38px;flex-basis:38px}.side .foot{display:none}.nav{flex-direction:row;flex-wrap:nowrap;gap:0;overflow-x:auto;border-top:1px solid #122416}.nav .lbl{display:none}.navbtn{width:auto;min-width:58px;min-height:52px;flex:1 0 auto;justify-content:center;padding:9px 12px;border-right:1px solid var(--color-border);border-bottom:0}.navbtn::after{top:auto;bottom:0;width:100%;height:0}.navbtn:hover::after{width:100%;height:3px}.navbtn.on::after{width:100%;height:5px}.navbtn small{display:none}.main{padding:18px 14px 34px}.top{margin-bottom:16px}.card,.kpi{box-shadow:4px 4px 0 #07190C}}
@media(max-width:768px){.g3,.g2{grid-template-columns:1fr}.board{grid-template-columns:repeat(4,minmax(210px,1fr))}.top .meta{width:100%}.chip{flex:1 1 auto}}
@media(max-width:560px){body{background-size:24px 24px}.navbtn .txt{display:none}.navbtn{padding:10px 13px}.main{padding:15px 11px 30px}.g4{grid-template-columns:1fr}.top h1{font-size:18px}.top .sub{font-size:12px}.card{padding:13px}.kpi{padding:14px}.kpi .k-v{font-size:26px}.chip{font-size:10px}.li{align-items:flex-start;flex-wrap:wrap}.li .lr{width:100%;margin-left:43px;text-align:left}.player .scr{overflow-x:auto;white-space:nowrap}.player .bar{gap:7px}.player .bar .material-symbols-outlined:last-child{display:none}}
</style>

<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">shield</span></div>
      <div><b>特權帳號管理 PAM</b><span>Privileged Access Mgmt</span></div>
    </div>

      <div class="lbl">功能模組</div>
      <button class="navbtn" data-i="0"><span class="material-symbols-outlined">account_tree</span><span class="txt"><b>特權帳號納管</b><small>掃描發現與集中管控</small></span></button>

</div>
<script>
(function(){
"use strict";
var ACC="#0d9488",AC2="#2dd4bf",A3="#5eead4",A4="#99f6e4",AMUT="#5b7d79",ALINE="#d7ebe8";
var chartObjs=[];

var SCREENS=[s0,s1,s2,s3,s4,s5];

function show(i){
 disposeCharts();
 var m=META[i]||META[0];
 el("tIco").textContent=m.ico;
 el("tTitle").textContent=m.title;
 el("tSub").textContent=m.sub;
 var btns=document.querySelectorAll("[data-i]");
 for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
 var cont=el("screen");
 cont.innerHTML=SCREENS[i]();
 void cont.offsetHeight;
 CHARTS[i]();
}
var navEl=el("nav");
navEl.addEventListener("click",function(e){
 var t=e.target;while(t&&t!==navEl&&!t.getAttribute("data-i")){t=t.parentNode;}
 if(t&&t.getAttribute("data-i")){location.hash="v"+t.getAttribute("data-i");}
});
window.show=show;
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
})();
