<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>業務知識庫與教育訓練平台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#b45309; --accent2:#f59e0b; --bg:#f4f1ec; --panel:#ffffff;
  --ink:#26211a; --muted:#7a6f61; --line:#e7ddce; --side:#231c14; --side2:#2f261a;
  --ok:#15803d; --warn:#b45309; --bad:#b91c1c; --info:#0369a1;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.app{display:flex;min-height:100vh}
.side{width:248px;flex:0 0 248px;background:linear-gradient(180deg,var(--side),var(--side2));color:#f0e7d8;display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;min-width:0}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff}
.brand .logo .material-symbols-outlined{font-size:22px}
.brand b{font-family:"Noto Sans TC";font-size:15px;font-weight:900;letter-spacing:.5px}
.brand small{display:block;color:#b9a888;font-size:11px;font-weight:500;margin-top:2px}
nav{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.nav-btn{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;border:none;background:transparent;color:#d8cbb4;cursor:pointer;font-family:"Noto Sans TC";font-size:14px;font-weight:500;text-align:left;width:100%;min-width:0;transition:.15s}
.nav-btn .material-symbols-outlined{font-size:20px;flex:0 0 auto}
.nav-btn:hover{background:rgba(245,158,11,.12);color:#fff}
.nav-btn.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(180,83,9,.35)}
.nav-btn .nl{min-width:0;overflow:hidden}
.nav-btn .nl b{display:block;font-size:13.5px;font-weight:700;line-height:1.2}
.nav-btn .nl span{display:block;font-size:11px;color:inherit;opacity:.72;font-weight:400;margin-top:1px}
.side-foot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid rgba(255,255,255,.08);color:#9c8b70;font-size:11px}
.main{flex:1 1 auto;min-width:0;padding:26px 30px 60px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-family:"Noto Sans TC";font-size:23px;font-weight:900;margin:0 0 4px}
.top p{margin:0;color:var(--muted);font-size:13px}
.top .pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12px;font-weight:600;color:var(--accent)}
.top .pill .material-symbols-outlined{font-size:16px}
.grid{display:grid;gap:16px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g21{grid-template-columns:1.6fr 1fr}
.g12{grid-template-columns:1fr 1.7fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;box-shadow:0 1px 2px rgba(60,40,10,.04)}
.card h3{margin:0 0 3px;font-family:"Noto Sans TC";font-size:15px;font-weight:800}
.card .sub{color:var(--muted);font-size:12px;margin:0 0 14px}
.kpi .lab{color:var(--muted);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.kpi .lab .material-symbols-outlined{font-size:18px;color:var(--accent)}
.kpi .val{font-size:29px;font-weight:800;font-family:"Inter";margin:8px 0 2px;letter-spacing:-.5px}
.kpi .val small{font-size:14px;font-weight:600;color:var(--muted)}
.kpi .delta{font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.kpi .delta .material-symbols-outlined{font-size:15px}
.up{color:var(--ok)}.down{color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;line-height:1.5}
.c-ok{background:#dcfce7;color:#15803d}.c-warn{background:#fef3c7;color:#b45309}.c-bad{background:#fee2e2;color:#b91c1c}.c-info{background:#e0f2fe;color:#0369a1}.c-mut{background:#eee6d8;color:#7a6f61}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th{text-align:left;color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;padding:9px 12px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
.tbl-wrap{overflow-x:auto}
.chartbox{position:relative;width:100%;overflow:hidden}
.bar{height:8px;border-radius:99px;background:#eee6d8;overflow:hidden;min-width:60px;display:inline-block}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.mini{font-size:12px;color:var(--muted)}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:0 0 auto}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;min-width:640px}
.col{background:#faf6ef;border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.col h4{margin:0 0 10px;font-size:13px;font-family:"Noto Sans TC";font-weight:800;display:flex;align-items:center;justify-content:space-between}
.col h4 .cnt{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--muted)}
.ticket{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(60,40,10,.05)}
.ticket b{font-size:13px;font-family:"Noto Sans TC";display:block;line-height:1.35}
.ticket .meta{display:flex;align-items:center;justify-content:space-between;margin-top:9px}
.ticket .tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:#f4ede0;color:var(--accent)}
.timeline{position:relative;padding-left:24px;margin:0}
.timeline::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 18px 8px}
.tl-item::before{content:"";position:absolute;left:-20px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent2)}
.tl-item:last-child{padding-bottom:0}
.tl-item .t{font-size:12px;color:var(--accent);font-weight:700}
.tl-item .h{font-size:13.5px;font-weight:700;font-family:"Noto Sans TC";margin:2px 0}
.tl-item .d{font-size:12.5px;color:var(--muted)}
.rowflex{display:flex;align-items:center;gap:10px;min-width:0}
.searchbar{display:flex;align-items:center;gap:10px;background:#faf6ef;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:4px}
.searchbar .material-symbols-outlined{color:var(--accent);font-size:22px}
.searchbar input{border:none;background:transparent;outline:none;font-size:14px;font-family:"Noto Sans TC";flex:1;min-width:0;color:var(--ink)}
.searchbar .kb{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px;background:#fff;white-space:nowrap}
.result{display:flex;gap:12px;padding:13px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff;min-width:0}
.result .ico{width:40px;height:40px;border-radius:10px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:#fdf0dd;color:var(--accent)}
.result .ico .material-symbols-outlined{font-size:22px}
.result .body{min-width:0;flex:1}
.result .body b{font-size:14px;font-family:"Noto Sans TC";display:block}
.result .body p{margin:3px 0 6px;font-size:12.5px;color:var(--muted);line-height:1.4}
.result .tags{display:flex;gap:6px;flex-wrap:wrap}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
.hbars{display:flex;flex-direction:column;gap:12px}
.hbar-row{display:grid;grid-template-columns:132px 1fr 46px;align-items:center;gap:10px;font-size:12.5px}
.hbar-row .nm{font-weight:600;font-family:"Noto Sans TC";min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar-row .vv{text-align:right;font-weight:700;color:var(--accent)}
.hbar-row .bar{width:100%}
.stat-inline{display:flex;flex-wrap:wrap;gap:22px;margin-top:2px}
.stat-inline .si b{display:block;font-size:22px;font-weight:800}
.stat-inline .si span{font-size:11.5px;color:var(--muted);font-weight:600}
.tag-cloud{display:flex;flex-wrap:wrap;gap:8px}
.tag-cloud .tc{border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;background:#fff;color:var(--ink)}
.tag-cloud .tc b{color:var(--accent);margin-left:5px;font-size:11px}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{width:100%;flex:none;height:auto;position:static;flex-direction:column;padding:12px}
  .brand{padding:2px 6px 10px}
  nav{flex-direction:row;flex-wrap:wrap;gap:6px}
  .nav-btn{width:auto;flex:1 1 auto;justify-content:center;padding:9px 12px}
  .nav-btn .nl span{display:none}
  .side-foot{display:none}
  .main{padding:18px 16px 50px}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g21,.g12{grid-template-columns:1fr}
  .board{grid-template-columns:1fr 1fr}
  .hbar-row{grid-template-columns:104px 1fr 42px}
}
@media(max-width:560px){
  .nav-btn .nl{display:none}
  .nav-btn{flex:0 0 auto}
  .board{grid-template-columns:1fr}
  .top h1{font-size:20px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">menu_book</span></div>
      <div><b>SalesKB 知識庫</b><small>Sales Enablement Platform</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">業務知識庫與教育訓練<br/>v3.2 · 產品部維運</div>
  </aside>
  <main class="main">
    <div id="screen"></div>
  </main>
</div>
<script>
var MODS=[
  {icon:"description",name:"知識內容庫",sub:"素材建檔與管理"},
  {icon:"account_tree",name:"分類上架審核",sub:"標籤 · 版本 · 審核"},
  {icon:"insights",name:"智慧檢索助理",sub:"關鍵字 · 語意搜尋"},
  {icon:"groups",name:"教育訓練課程",sub:"指派 · 進度 · 測驗"},
  {icon:"history",name:"內容更新排程",sub:"到期覆核 · 改版"},
  {icon:"monitoring",name:"成效追蹤儀表",sub:"使用率 · 上手時間"}
];
var TITLES=[
  ["知識內容庫","彙整產品規格、應用案例與銷售話術，集中建檔統一維護"],
  ["分類上架審核","設定標籤分類與版本，審核通過後正式上架供業務查詢"],
  ["智慧檢索助理","關鍵字與語意搜尋，讓業務在對話中快速命中所需素材"],
  ["教育訓練課程","指派學習路徑、追蹤進度與測驗成績，加速新人上手"],
  ["內容更新排程","定期覆核到期內容，追蹤改版、失效與下架時程"],
  ["成效追蹤儀表","使用率、新人上手時間與內容熱度的整合分析"]
];
var charts={};
function destroyChart(id){ if(charts[id]){ charts[id].destroy(); delete charts[id]; } }
function el(id){ return document.getElementById(id); }

function buildNav(){
  var n=el("nav"); var h="";
  for(var i=0;i<MODS.length;i++){
    h+='<button class="nav-btn" data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span><span class="nl"><b>'+MODS[i].name+'</b><span>'+MODS[i].sub+'</span></span></button>';
  }
  n.innerHTML=h;
  var btns=n.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){ location.hash="v"+this.getAttribute("data-i"); });
  }
}

function head(i){
  return '<div class="top"><div><h1>'+TITLES[i][0]+'</h1><p>'+TITLES[i][1]+'</p></div><span class="pill"><span class="material-symbols-outlined">'+MODS[i].icon+'</span>模組 '+(i+1)+' / 6</span></div>';
}

/* ---------- SCREEN 0 : 知識內容庫 ---------- */
function s0(){
  var kpis=[
    {ic:"description",lab:"素材總數",val:"1,284",u:"份",d:"+46",up:1},
    {ic:"verified",lab:"已上架",val:"1,057",u:"份",d:"+38",up:1},
    {ic:"edit_note",lab:"草稿待審",val:"63",u:"份",d:"+11",up:0},
    {ic:"warning",lab:"逾期未覆核",val:"41",u:"份",d:"-7",up:1}
  ];
  var rows=[
    {t:"射出成型機 X-720 產品規格書",ty:"產品規格",ind:"塑膠射出",own:"林建宏",v:"v3.1",st:"已上架",cls:"c-ok",use:412},
    {t:"CNC 五軸加工中心導入案例—精密齒輪廠",ty:"應用案例",ind:"金屬加工",own:"陳怡君",v:"v2.0",st:"已上架",cls:"c-ok",use:388},
    {t:"AOI 檢測方案競品比較話術",ty:"銷售話術",ind:"電子製造",own:"王志明",v:"v1.4",st:"審核中",cls:"c-warn",use:0},
    {t:"智慧倉儲 AGV 簡報範本 2026",ty:"簡報範本",ind:"物流倉儲",own:"李美玲",v:"v4.2",st:"已上架",cls:"c-ok",use:276},
    {t:"能源管理系統 ROI 試算話術",ty:"銷售話術",ind:"節能減碳",own:"張家豪",v:"v1.0",st:"草稿",cls:"c-mut",use:0},
    {t:"食品包裝產線導入白皮書",ty:"應用案例",ind:"食品製造",own:"吳雅婷",v:"v2.3",st:"已上架",cls:"c-ok",use:194}
  ];
  var tr="";
  for(var i=0;i<rows.length;i++){var r=rows[i];
    tr+='<tr><td><b style="font-family:Noto Sans TC">'+r.t+'</b></td><td><span class="chip c-info">'+r.ty+'</span></td><td>'+r.ind+'</td><td><span class="rowflex"><span class="avatar">'+r.own.charAt(0)+'</span>'+r.own+'</span></td><td>'+r.v+'</td><td><span class="chip '+r.cls+'">'+r.st+'</span></td><td style="text-align:right;font-weight:700;color:var(--accent)">'+r.use+'</td></tr>';
  }
  var kh="";
  for(var k=0;k<kpis.length;k++){var q=kpis[k];
    kh+='<div class="card kpi"><div class="lab"><span class="material-symbols-outlined">'+q.ic+'</span>'+q.lab+'</div><div class="val">'+q.val+' <small>'+q.u+'</small></div><div class="delta '+(q.up?"up":"down")+'"><span class="material-symbols-outlined">'+(q.up?"trending_up":"trending_flat")+'</span>本月 '+q.d+'</div></div>';
  }
  var cats=[
    {n:"產品規格",v:436,p:100},{n:"應用案例",v:312,p:72},{n:"銷售話術",v:268,p:61},{n:"簡報範本",v:174,p:40},{n:"教材/白皮書",v:94,p:22}
  ];
  var cb="";
  for(var c=0;c<cats.length;c++){var ct=cats[c];
    cb+='<div class="hbar-row"><span class="nm">'+ct.n+'</span><span class="bar"><i style="width:'+ct.p+'%"></i></span><span class="vv">'+ct.v+'</span></div>';
  }
  return head(0)+
    '<div class="grid g4" style="margin-bottom:16px">'+kh+'</div>'+
    '<div class="grid g21">'+
      '<div class="card"><h3>素材清單</h3><p class="sub">依適用產業與角色建檔，支援版本控管</p><div class="tbl-wrap"><table><thead><tr><th>標題</th><th>類型</th><th>適用產業</th><th>負責人</th><th>版本</th><th>狀態</th><th style="text-align:right">查閱</th></tr></thead><tbody>'+tr+'</tbody></table></div></div>'+
      '<div class="card"><h3>內容分類分布</h3><p class="sub">各類型素材數量占比</p><div class="hbars">'+cb+'</div><div class="chartbox" style="height:170px;margin-top:16px"><canvas id="c0"></canvas></div></div>'+
    '</div>';
}
function s0c(){
  destroyChart("c0");
  var ctx=el("c0"); if(!ctx) return;
  charts["c0"]=new Chart(ctx,{type:"doughnut",data:{labels:["塑膠射出","金屬加工","電子製造","物流倉儲","其他"],datasets:[{data:[34,26,18,12,10],backgroundColor:["#b45309","#f59e0b","#d97706","#fbbf24","#e7ddce"],borderWidth:2,borderColor:"#fff"}]},options:{maintainAspectRatio:false,responsive:true,cutout:"62%",plugins:{legend:{position:"bottom",labels:{font:{size:11},boxWidth:12,padding:10}}}}});
}

/* ---------- SCREEN 1 : 分類上架審核 (board) ---------- */
function s1(){
  var cols=[
    {h:"待分類",items:[
      {t:"熱流道模具維護指南",tag:"產品規格",who:"林建宏",p:"P2"},
      {t:"半導體潔淨室方案簡報",tag:"簡報範本",who:"李美玲",p:"P3"}
    ]},
    {h:"審核中",items:[
      {t:"AOI 檢測競品比較話術",tag:"銷售話術",who:"王志明",p:"P1"},
      {t:"AGV 智慧倉儲導入白皮書",tag:"應用案例",who:"吳雅婷",p:"P2"},
      {t:"雷射切割機規格更新 v2",tag:"產品規格",who:"陳怡君",p:"P2"}
    ]},
    {h:"退回修改",items:[
      {t:"能源 ROI 試算話術",tag:"銷售話術",who:"張家豪",p:"P2"}
    ]},
    {h:"已上架",items:[
      {t:"射出成型機 X-720 規格書",tag:"產品規格",who:"林建宏",p:"P1"},
      {t:"精密齒輪廠導入案例",tag:"應用案例",who:"陳怡君",p:"P1"},
      {t:"食品包裝白皮書",tag:"應用案例",who:"吳雅婷",p:"P3"}
    ]}
  ];
  var bh="";
  for(var i=0;i<cols.length;i++){var col=cols[i];var it="";
    for(var j=0;j<col.items.length;j++){var x=col.items[j];
      it+='<div class="ticket"><b>'+x.t+'</b><div class="meta"><span class="tag">'+x.tag+'</span><span class="rowflex mini"><span class="avatar" style="width:22px;height:22px;font-size:10px">'+x.who.charAt(0)+'</span>'+x.p+'</span></div></div>';
    }
    bh+='<div class="col"><h4>'+col.h+'<span class="cnt">'+col.items.length+'</span></h4>'+it+'</div>';
  }
  var logs=[
    {t:"14:20",h:"雷射切割機規格 v2 送審",d:"陳怡君 提交，指派審核人 產品部 主管"},
    {t:"13:05",h:"能源 ROI 話術退回",d:"審核意見：ROI 假設需標註來源與適用產業"},
    {t:"11:48",h:"精密齒輪廠案例上架",d:"版本 v1.0 → v2.0，新增良率數據佐證"},
    {t:"10:12",h:"AOI 話術進入審核",d:"競品比較表需法遵確認，預計 1 日內完成"}
