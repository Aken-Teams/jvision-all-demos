<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>業務知識庫與教育訓練平台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#0F172A;
  --color-card:#FFFFFF;
  --color-card-foreground:#0F172A;
  --color-muted:#F1F5FD;
  --color-muted-foreground:#475569;
  --color-border:#E4ECFC;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#0F172A;
  --muted:#475569;
  --line:#E4ECFC;
  --accent:#2563EB;
  --accent2:#3B82F6;
  --bg:#F8FAFC;
  --panel:#FFFFFF;
  --side:#0F172A;
  --side2:#0F172A;
  --ok:#047857;
  --warn:#A16207;
  --bad:#B91C1C;
  --info:#1D4ED8;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
html,body{margin:0;padding:0}
body{
  font-family:"Fira Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    linear-gradient(var(--line) 1px,transparent 1px),
    linear-gradient(90deg,var(--line) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit}
button{cursor:pointer}
::selection{background:var(--color-primary);color:var(--color-on-primary)}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
.app{display:flex;min-height:100vh}
.side{
  width:264px;
  flex:0 0 264px;
  background:var(--side);
  color:#F8FAFC;
  display:flex;
  flex-direction:column;
  padding:0;
  position:sticky;
  top:0;
  height:100vh;
  min-width:0;
  border-right:4px solid var(--ink);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-height:96px;
  padding:18px;
  border-bottom:2px solid #334155;
}
.brand .logo{
  width:48px;
  height:48px;
  background:var(--color-primary);
  border:2px solid #FFFFFF;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#FFFFFF;
  flex:0 0 auto;
}
.brand .logo .material-symbols-outlined{font-size:25px}
.brand b{
  font-size:16px;
  font-weight:800;
  letter-spacing:.02em;
}
.brand small{
  display:block;
  color:#CBD5E1;
  font-family:"Fira Code",monospace;
  font-size:9px;
  font-weight:500;
  line-height:1.4;
  margin-top:4px;
  text-transform:uppercase;
}
nav{display:flex;flex-direction:column;margin-top:0}
.nav-btn{
  display:flex;
  align-items:center;
  gap:12px;
  min-height:72px;
  padding:13px 17px;
  border:0;
  border-bottom:1px solid #334155;
  border-left:6px solid transparent;
  background:transparent;
  color:#CBD5E1;
  text-align:left;
  width:100%;
  min-width:0;
  transition:background-color .18s ease,color .18s ease,border-color .18s ease;
}
.nav-btn .material-symbols-outlined{font-size:21px;flex:0 0 auto}
.nav-btn:hover{background:#1E293B;color:#FFFFFF;border-left-color:var(--color-secondary)}
.nav-btn.on{
  background:var(--color-primary);
  color:#FFFFFF;
  border-left-color:#FFFFFF;
}
.nav-btn .nl{min-width:0;overflow:hidden}
.nav-btn .nl b{display:block;font-size:14px;font-weight:700;line-height:1.2}
.nav-btn .nl span{
  display:block;
  font-family:"Fira Code",monospace;
  font-size:10px;
  color:inherit;
  opacity:.82;
  font-weight:400;
  margin-top:4px;
}
.side-foot{
  margin-top:auto;
  padding:18px;
  border-top:2px solid #334155;
  color:#CBD5E1;
  font-family:"Fira Code",monospace;
  font-size:10px;
  line-height:1.7;
}
.main{flex:1 1 auto;min-width:0;padding:32px 36px 72px}
.top{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  flex-wrap:wrap;
  margin:0 0 22px;
  padding:0 0 18px;
  border-bottom:4px solid var(--ink);
}
.top h1{
  font-size:clamp(25px,3vw,39px);
  font-weight:800;
  line-height:1.05;
  letter-spacing:-.035em;
  margin:0 0 9px;
}
.top p{max-width:760px;margin:0;color:var(--muted);font-size:14px;line-height:1.55}
.top .pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--color-accent);
  border:2px solid var(--ink);
  padding:9px 13px;
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:700;
  color:#FFFFFF;
  box-shadow:4px 4px 0 var(--ink);
}
.top .pill .material-symbols-outlined{font-size:17px}
.grid{display:grid;gap:16px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr)}
.g12{grid-template-columns:minmax(300px,1fr) minmax(0,1.7fr)}
.card{
  background:var(--panel);
  border:2px solid var(--ink);
  padding:18px;
  min-width:0;
  box-shadow:5px 5px 0 #C7D2FE;
}
.card:nth-child(even){box-shadow:5px 5px 0 #A7F3D0}
.card h3{
  margin:0 0 4px;
  font-size:16px;
  font-weight:800;
  letter-spacing:-.01em;
}
.card .sub{color:var(--muted);font-size:12px;line-height:1.5;margin:0 0 15px}
.kpi{position:relative;overflow:hidden;padding-top:20px}
.kpi::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:46px;
  height:6px;
  background:var(--color-primary);
}
.kpi:nth-child(even)::before{width:72px;background:var(--color-accent)}
.kpi .lab{
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:7px;
}
.kpi .lab .material-symbols-outlined{font-size:19px;color:var(--color-primary)}
.kpi .val{
  font-size:32px;
  font-weight:800;
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
  margin:9px 0 5px;
  letter-spacing:-.055em;
}
.kpi .val small{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0}
.kpi .delta{
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.kpi .delta .material-symbols-outlined{font-size:15px}
.up{color:var(--ok)}.down{color:var(--bad)}
.chip{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 8px;
  border:1px solid currentColor;
  font-size:11px;
  font-weight:700;
  line-height:1.5;
  white-space:nowrap;
}
.c-ok{background:#ECFDF5;color:#047857}
.c-warn{background:#FFFBEB;color:#92400E}
.c-bad{background:#FEF2F2;color:#B91C1C}
.c-info{background:#EFF6FF;color:#1D4ED8}
.c-mut{background:#F1F5F9;color:#475569}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th{
  text-align:left;
  color:#334155;
  background:var(--color-muted);
  font-weight:700;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.05em;
  padding:11px 12px;
  border:1px solid #CBD5E1;
  white-space:nowrap;
}
td{padding:12px;border:1px solid var(--line);vertical-align:middle}
tbody tr:nth-child(even){background:#F8FAFC}
tbody tr:hover{background:#EFF6FF}
td:nth-last-child(-n+3){
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
.tbl-wrap{overflow-x:auto;border:1px solid var(--ink)}
.chartbox{position:relative;width:100%;overflow:hidden}
.bar{
  height:10px;
  background:#E2E8F0;
  border:1px solid #94A3B8;
  overflow:hidden;
  min-width:60px;
  display:inline-block;
}
.bar>i{display:block;height:100%;background:var(--color-primary)}
.mini{font-size:11px;color:var(--muted);font-family:"Fira Code",monospace}
.avatar{
  width:30px;
  height:30px;
  background:var(--color-primary);
  border:1px solid var(--ink);
  color:#FFFFFF;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:700;
  flex:0 0 auto;
}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:0;min-width:720px}
.col{
  background:var(--color-muted);
  border-right:2px solid var(--ink);
  padding:12px;
  min-width:0;
}
.col:last-child{border-right:0}
.col h4{
  margin:0 0 12px;
  padding-bottom:9px;
  border-bottom:2px solid var(--ink);
  font-size:13px;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.col h4 .cnt{
  background:var(--ink);
  border:1px solid var(--ink);
  padding:2px 8px;
  font-family:"Fira Code",monospace;
  font-size:10px;
  color:#FFFFFF;
}
.ticket{
  background:#FFFFFF;
  border:2px solid var(--ink);
  padding:11px;
  margin-bottom:10px;
  box-shadow:3px 3px 0 #CBD5E1;
}
.ticket b{font-size:13px;display:block;line-height:1.4}
.ticket .meta{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.ticket .tag{
  font-size:10px;
  font-weight:700;
  padding:3px 7px;
  border:1px solid var(--color-primary);
  background:#EFF6FF;
  color:#1D4ED8;
}
.timeline{position:relative;padding-left:26px;margin:0}
.timeline::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:3px;background:var(--ink)}
.tl-item{position:relative;padding:0 0 20px 9px}
.tl-item::before{
  content:"";
  position:absolute;
  left:-23px;
  top:3px;
  width:13px;
  height:13px;
  background:var(--color-primary);
  border:3px solid #FFFFFF;
  outline:2px solid var(--ink);
}
.tl-item:last-child{padding-bottom:0}
.tl-item .t{font-family:"Fira Code",monospace;font-size:11px;color:#1D4ED8;font-weight:700}
.tl-item .h{font-size:13px;font-weight:700;margin:3px 0}
.tl-item .d{font-size:12px;line-height:1.5;color:var(--muted)}
.rowflex{display:flex;align-items:center;gap:9px;min-width:0}
.searchbar{
  display:flex;
  align-items:center;
  gap:10px;
  background:#FFFFFF;
  border:3px solid var(--ink);
  padding:13px 15px;
  margin-bottom:4px;
  box-shadow:5px 5px 0 var(--color-primary);
}
.searchbar:focus-within{outline:3px solid var(--color-ring);outline-offset:3px}
.searchbar .material-symbols-outlined{color:var(--color-primary);font-size:23px}
.searchbar input{
  border:none;
  background:transparent;
  outline:none;
  font-size:14px;
  flex:1;
  min-width:0;
  color:var(--ink);
}
.searchbar .kb{
  font-family:"Fira Code",monospace;
  font-size:10px;
  color:#FFFFFF;
  border:1px solid var(--ink);
  padding:4px 8px;
  background:var(--ink);
  white-space:nowrap;
}
.result{
  display:flex;
  gap:12px;
  padding:13px;
  border:2px solid var(--ink);
  margin-bottom:10px;
  background:#FFFFFF;
  min-width:0;
}
.result .ico{
  width:42px;
  height:42px;
  border:2px solid var(--ink);
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#DBEAFE;
  color:#1D4ED8;
}
.result .ico .material-symbols-outlined{font-size:22px}
.result .body{min-width:0;flex:1}
.result .body b{font-size:14px;display:block}
.result .body p{margin:4px 0 7px;font-size:12px;color:var(--muted);line-height:1.5}
.result .tags{display:flex;gap:6px;flex-wrap:wrap}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
.hbars{display:flex;flex-direction:column;gap:13px}
.hbar-row{display:grid;grid-template-columns:132px 1fr 50px;align-items:center;gap:10px;font-size:12px}
.hbar-row .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar-row .vv{
  text-align:right;
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
  font-weight:700;
  color:#1D4ED8;
}
.hbar-row .bar{width:100%}
.stat-inline{display:flex;flex-wrap:wrap;gap:0;margin-top:2px;border:1px solid var(--ink)}
.stat-inline .si{padding:8px 18px;border-right:1px solid var(--ink)}
.stat-inline .si:last-child{border-right:0}
.stat-inline .si b{
  display:block;
  font-family:"Fira Code",monospace;
  font-size:21px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
}
.stat-inline .si span{font-size:11px;color:var(--muted);font-weight:600}
.tag-cloud{display:flex;flex-wrap:wrap;gap:8px}
.tag-cloud .tc{
  border:1px solid var(--ink);
  padding:6px 10px;
  font-size:12px;
  font-weight:600;
  background:#FFFFFF;
  color:var(--ink);
}
.tag-cloud .tc b{
  color:#1D4ED8;
  margin-left:6px;
  font-family:"Fira Code",monospace;
  font-size:10px;
}
#screen>*{animation:reveal .36s ease-out both}
#screen>*:nth-child(2){animation-delay:.04s}
#screen>*:nth-child(3){animation-delay:.08s}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-delay:0ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
    transition-duration:.01ms!important;
  }
}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g21,.g12{grid-template-columns:1fr}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{
    width:100%;
    flex:none;
    height:auto;
    position:static;
    border-right:0;
    border-bottom:4px solid var(--ink);
  }
  .brand{min-height:auto;padding:12px 16px}
  .brand .logo{width:40px;height:40px}
  nav{flex-direction:row;overflow-x:auto;border-top:1px solid #334155}
  .nav-btn{
    width:auto;
    flex:1 0 126px;
    min-height:58px;
    justify-content:center;
    padding:9px 11px;
    border-left:0;
    border-right:1px solid #334155;
  }
  .nav-btn:hover,.nav-btn.on{border-left-color:transparent}
  .nav-btn.on{box-shadow:inset 0 -5px 0 #FFFFFF}
  .nav-btn .nl span{display:none}
  .side-foot{display:none}
  .main{padding:22px 18px 52px}
}
@media(max-width:620px){
  .g4,.g3,.g2,.g21,.g12{grid-template-columns:1fr}
  .main{padding:18px 12px 44px}
  .top{align-items:flex-start;margin-bottom:16px}
  .top h1{font-size:26px}
  .top .pill{box-shadow:3px 3px 0 var(--ink)}
  .card{padding:14px;box-shadow:3px 3px 0 #C7D2FE}
  .nav-btn{flex:0 0 58px;min-height:54px}
  .nav-btn .nl{display:none}
  .board{grid-template-columns:repeat(4,230px)}
  .hbar-row{grid-template-columns:104px 1fr 42px}
  .searchbar{padding:11px;box-shadow:3px 3px 0 var(--color-primary)}
  .searchbar .kb{display:none}
  .result{gap:9px}
  .result .ico{width:36px;height:36px}
  .stat-inline{display:grid;grid-template-columns:1fr 1fr}
  .stat-inline .si{border-right:1px solid var(--ink);border-bottom:1px solid var(--ink)}
  .stat-inline .si:nth-child(even){border-right:0}
  .stat-inline .si:nth-last-child(-n+2){border-bottom:0}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">menu_book</span></div>
      <div><b>SalesKB 知識庫</b><small>Sales Enablement Platform</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">業務知識庫與教育訓練<br/>v3.2 · 產品部維運</div>
  </aside>
  <main class="main">
    <div id="screen"></div>
  </main>
</div>
<script>
var MODS=[
  {icon:"description",name:"知識內容庫",sub:"素材建檔與管理"},
  {icon:"account_tree",name:"分類上架審核",sub:"標籤 · 版本 · 審核"},
  {icon:"insights",name:"智慧檢索助理",sub:"關鍵字 · 語意搜尋"},
  {icon:"groups",name:"教育訓練課程",sub:"指派 · 進度 · 測驗"},
  {icon:"history",name:"內容更新排程",sub:"到期覆核 · 改版"},
  {icon:"monitoring",name:"成效追蹤儀表",sub:"使用率 · 上手時間"}
];
var TITLES=[
  ["知識內容庫","彙整產品規格、應用案例與銷售話術，集中建檔統一維護"],
  ["分類上架審核","設定標籤分類與版本，審核通過後正式上架供業務查詢"],
  ["智慧檢索助理","關鍵字與語意搜尋，讓業務在對話中快速命中所需素材"],
  ["教育訓練課程","指派學習路徑、追蹤進度與測驗成績，加速新人上手"],
  ["內容更新排程","定期覆核到期內容，追蹤改版、失效與下架時程"],
  ["成效追蹤儀表","使用率、新人上手時間與內容熱度的整合分析"]
];
var charts={};
var chartText="#334155";
var chartGrid="#E4ECFC";
var chartBlue="#2563EB";
var chartBlue2="#3B82F6";
var chartGreen="#059669";
Chart.defaults.color=chartText;
Chart.defaults.font.family="'Fira Sans', system-ui, sans-serif";
function destroyChart(id){if(charts[id]){charts[id].destroy();delete charts[id];}}
function el(id){return document.getElementById(id);}
function buildNav(){
  var n=el("nav"),h="";
  for(var i=0;i<MODS.length;i++){
    h+='<button type="button" class="nav-btn" data-i="'+i+'" aria-label="'+MODS[i].name+'"><span class="material-symbols-outlined" aria-hidden="true">'+MODS[i].icon+'</span><span class="nl"><b>'+MODS[i].name+'</b><span>'+MODS[i].sub+'</span></span></button>';
  }
  n.innerHTML=h;
  var btns=n.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){location.hash="v"+this.getAttribute("data-i");});
  }
}
function head(i){
  return '<div class="top"><div><h1>'+TITLES[i][0]+'</h1><p>'+TITLES[i][1]+'</p></div><span class="pill"><span class="material-symbols-outlined" aria-hidden="true">'+MODS[i].icon+'</span>模組 '+(i+1)+' / 6</span></div>';
}
function s0(){
  var kpis=[
    {ic:"description",lab:"素材總數",val:"1,284",u:"份",d:"+46",up:1},
    {ic:"verified",lab:"已上架",val:"1,057",u:"份",d:"+38",up:1},
    {ic:"edit_note",lab:"草稿待審",val:"63",u:"份",d:"+11",up:0},
    {ic:"warning",lab:"逾期未覆核",val:"41",u:"份",d:"-7",up:1}
  ];

}

    {label:"上季",data:[70,60,62,68,58],borderColor:chartGreen,backgroundColor:"rgba(5,150,105,.10)",borderWidth:2,pointRadius:2,borderDash:[4,3]}
  ]},options:{maintainAspectRatio:false,responsive:true,plugins:{legend:{position:"bottom",labels:{font:{size:11},boxWidth:14,padding:10}}},scales:{r:{grid:{color:chartGrid},angleLines:{color:chartGrid},pointLabels:{font:{size:11}},min:0,max:100,ticks:{display:false}}}}});
}
var RENDER=[s0,s1,s2,s3,s4,s5];
var CHARTS=[s0c,s1c,s2c,s3c,s4c,s5c];
function show(i){
  var c=el("screen");
  c.innerHTML=RENDER[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    var active=+btns[b].getAttribute("data-i")===i;
    btns[b].classList.toggle("on",active);
    btns[b].setAttribute("aria-current",active?"page":"false");
  }
  void c.offsetHeight;
  CHARTS[i]();
}
buildNav();
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return;}
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0);}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
