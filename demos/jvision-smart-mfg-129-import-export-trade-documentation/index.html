*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Fira Sans","Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,a{font:inherit}

.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:20px;line-height:1;vertical-align:middle}
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.topbar-inner{max-width:1440px;height:68px;margin:auto;padding:0 28px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:700;letter-spacing:-.01em}

.livedot{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}

.nav::-webkit-scrollbar{display:none}
.nav button{min-height:40px;padding:9px 13px;display:flex;align-items:center;gap:7px;flex:0 0 auto;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted);font-size:13px;font-weight:600;transition:color .2s,background .2s,border-color .2s,transform .2s}
.nav button:hover{color:var(--blue);background:#EFF6FF;border-color:#BFDBFE}
.nav button:active{transform:translateY(1px)}
.nav button.active{color:white;background:var(--blue);border-color:var(--blue)}
.nav button:focus-visible,.tbl-scroll:focus-visible{outline:3px solid rgba(37,99,235,.28);outline-offset:2px}
.wrap{max-width:1440px;margin:auto;padding:30px 28px 64px}

.scr-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:22px}

.tag{padding:6px 10px;border:1px solid #BFDBFE;border-radius:6px;background:#EFF6FF;color:#1D4ED8;font:600 11px "Fira Code",monospace;white-space:nowrap}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(4,1fr)}
.g-2{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-2-1{grid-template-columns:2fr 1fr}
.g-1-2{grid-template-columns:1fr 2fr}
.card,.kpi{background:var(--color-card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card{padding:18px;overflow:hidden}

.kpi{position:relative;padding:17px 18px;overflow:hidden;transition:border-color .22s,transform .22s,box-shadow .22s}

.kpi .sub{margin-top:9px;display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600}
.kpi .sub .material-symbols-outlined{font-size:15px}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
.chart-wrap{position:relative;width:100%;overflow:hidden}
.h180{height:180px}.h220{height:220px}.h240{height:240px}.h260{height:260px}.h300{height:300px}
.tbl-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{width:100%;min-width:540px;border-collapse:collapse;font-size:12.5px}
th{padding:10px 12px;text-align:left;background:var(--color-muted);border-bottom:1px solid var(--line);color:#334155;font-size:11px;font-weight:600;letter-spacing:.025em;white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);color:#1E293B;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}

.tl{position:relative;padding-left:27px}

@keyframes screen-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:1420px){.nav{padding-left:28px;padding-right:28px}}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  #screen{animation:none}.kpi:hover{transform:none}
