<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>進出口貿易文件管理 Import/Export Trade Documentation</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#071722;--panel:#0d2436;--panel2:#12314a;--line:#1e455f;
  --accent:#0369a1;--accent2:#38bdf8;--txt:#e8f4fb;--muted:#8fb4cc;
  --ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--info:#38bdf8;
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html,body{background:var(--bg);color:var(--txt);font-family:"Inter","Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
a{color:inherit;text-decoration:none}

.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(90deg,#061420,#0b2739);border-bottom:1px solid var(--line);padding:0 18px}
.topbar-inner{display:flex;align-items:center;gap:14px;height:60px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;color:#fff}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;box-shadow:0 0 14px rgba(56,189,248,.4)}
.brand .logo .material-symbols-outlined{font-size:20px}
.brand small{display:block;font-size:10px;color:var(--muted);font-weight:500;letter-spacing:.5px}
.livedot{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);background:rgba(56,189,248,.08);border:1px solid var(--line);padding:6px 11px;border-radius:20px}
.livedot .d{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}

.navwrap{background:#0a1f2e;border-bottom:1px solid var(--line);padding:8px 14px;position:sticky;top:60px;z-index:40}
.nav{display:flex;gap:7px;flex-wrap:wrap;max-width:1360px;margin:0 auto}
.nav button{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:8px 13px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;transition:.15s;white-space:nowrap}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{color:var(--txt);border-color:var(--accent2)}
.nav button.active{background:linear-gradient(135deg,var(--accent),#075985);color:#fff;border-color:var(--accent2);box-shadow:0 3px 14px rgba(3,105,161,.5)}

.wrap{max-width:1360px;margin:0 auto;padding:20px 16px 60px}
.scr-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.scr-head h2{font-size:20px;font-weight:800;color:#fff;display:flex;align-items:center;gap:9px}
.scr-head h2 .material-symbols-outlined{color:var(--accent2);font-size:24px}
.scr-head p{color:var(--muted);font-size:13px;margin-top:4px}
.tag{font-size:11px;font-weight:700;padding:5px 10px;border-radius:7px;background:rgba(56,189,248,.12);color:var(--accent2);border:1px solid var(--line)}

.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(4,1fr)}
.g-2{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-2-1{grid-template-columns:2fr 1fr}
.g-1-2{grid-template-columns:1fr 2fr}
@media(max-width:820px){
  .g-kpi{grid-template-columns:1fr 1fr}
  .g-2,.g-3,.g-2-1,.g-1-2{grid-template-columns:1fr}
}
@media(max-width:480px){.g-kpi{grid-template-columns:1fr}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;overflow:hidden}
.card-t{font-size:14px;font-weight:700;color:#fff;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card-t .material-symbols-outlined{font-size:19px;color:var(--accent2)}
.card-t small{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500}

.kpi{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:15px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-16px;top:-16px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,rgba(56,189,248,.18),transparent 70%)}
.kpi .lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .lbl .material-symbols-outlined{font-size:17px;color:var(--accent2)}
.kpi .val{font-size:27px;font-weight:800;color:#fff;margin-top:8px;line-height:1}
.kpi .val small{font-size:13px;color:var(--muted);font-weight:600;margin-left:3px}
.kpi .sub{font-size:11px;margin-top:7px;display:flex;align-items:center;gap:4px}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
.kpi .sub .material-symbols-outlined{font-size:15px}

.chart-wrap{position:relative;width:100%;overflow:hidden}
.h180{height:180px}.h220{height:220px}.h240{height:240px}.h260{height:260px}.h300{height:300px}

.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
th{text-align:left;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:11.5px;letter-spacing:.3px}
td{padding:10px;border-bottom:1px solid rgba(30,69,95,.5);color:var(--txt);white-space:nowrap}
tbody tr:hover{background:rgba(56,189,248,.05)}
.mono{font-family:"Inter",monospace;font-weight:600;letter-spacing:.3px}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.pill .material-symbols-outlined{font-size:14px}
.p-ok{background:rgba(34,197,94,.15);color:#4ade80}
.p-warn{background:rgba(245,158,11,.15);color:#fbbf24}
.p-bad{background:rgba(239,68,68,.15);color:#f87171}
.p-info{background:rgba(56,189,248,.15);color:#7dd3fc}
.p-mut{background:rgba(143,180,204,.12);color:var(--muted)}

.bar{height:7px;background:rgba(30,69,95,.7);border-radius:5px;overflow:hidden;min-width:60px}
.bar > i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2))}

.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:860px){.board{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.board{grid-template-columns:1fr}}
.col{background:rgba(9,29,43,.6);border:1px solid var(--line);border-radius:12px;padding:11px}
.col-h{font-size:12.5px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.col-h .cnt{font-size:11px;background:var(--panel2);color:var(--accent2);padding:2px 8px;border-radius:20px}
.ticket{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:9px;border-left:3px solid var(--accent2)}
.ticket:last-child{margin-bottom:0}
.ticket .tk-id{font-size:11px;color:var(--muted);font-weight:600}
.ticket .tk-t{font-size:13px;font-weight:700;color:#fff;margin:4px 0 6px}
.ticket .tk-m{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;flex-wrap:wrap}

.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 18px 4px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-22px;top:3px;width:13px;height:13px;border-radius:50%;background:var(--panel);border:2px solid var(--accent2);box-shadow:0 0 8px rgba(56,189,248,.5)}
.tl-item.done::before{background:var(--ok);border-color:var(--ok)}
.tl-item.now::before{background:var(--warn);border-color:var(--warn)}
.tl-item .tl-time{font-size:11px;color:var(--accent2);font-weight:700}
.tl-item .tl-t{font-size:13px;font-weight:700;color:#fff;margin:2px 0 3px}
.tl-item .tl-d{font-size:12px;color:var(--muted)}

.chk{display:flex;align-items:flex-start;gap:10px;padding:11px;border:1px solid var(--line);border-radius:10px;margin-bottom:9px;background:rgba(9,29,43,.5)}
.chk:last-child{margin-bottom:0}
.chk .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex-shrink:0}
.chk .ic .material-symbols-outlined{font-size:17px}
.ic-ok{background:rgba(34,197,94,.15);color:#4ade80}
.ic-warn{background:rgba(245,158,11,.15);color:#fbbf24}
.ic-bad{background:rgba(239,68,68,.15);color:#f87171}
.chk .cx{flex:1}
.chk .cx b{font-size:13px;color:#fff;font-weight:700}
.chk .cx p{font-size:11.5px;color:var(--muted);margin-top:3px}

.srow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(30,69,95,.5)}
.srow:last-child{border-bottom:none}
.srow .nm{font-size:12.5px;color:var(--txt);flex:1;min-width:80px}
.srow .vv{font-size:13px;font-weight:700;color:#fff}

@media(max-width:560px){.nav button .txt{display:none}.nav button{padding:9px}.hide-560{display:none}}

.foot{max-width:1360px;margin:0 auto;padding:20px 16px 40px;color:var(--muted);font-size:12px;text-align:center;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">receipt_long</span></div>
      <div>進出口貿易文件管理<small>IMPORT / EXPORT TRADE DOCUMENTATION</small></div>
    </div>
    <div class="livedot"><span class="d"></span>作業終端 · 即時同步 ERP / 海關 EDI</div>
  </div>
</div>

<div class="navwrap">
  <nav class="nav" id="nav"></nav>
</div>

<main class="wrap"><div id="screen"></div></main>
<div class="foot">進出口貿易文件管理 Import/Export Trade Documentation · 純前端展示 Demo · 資料為模擬示意</div>

<script>
"use strict";
var charts = {};
function destroyCharts(){ for(var k in charts){ try{charts[k].destroy();}catch(e){} } charts = {}; }

var MODULES = [
  {icon:"receipt_long", nm:"貿易文件產出"},
  {icon:"verified",     nm:"產地證明與FTA"},
  {icon:"fact_check",   nm:"合規檢核"},
  {icon:"gavel",        nm:"報關資料整合"},
  {icon:"inventory_2",  nm:"出貨放行追蹤"},
  {icon:"history",      nm:"文件歸檔稽核"}
];

var CTXT = "#e8f4fb", CMUT = "#8fb4cc", CLINE = "rgba(30,69,95,.6)";
function axisOpts(extra){
  var o = {
    responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{ labels:{ color:CTXT, font:{size:11}, boxWidth:12 } } },
    scales:{
      x:{ ticks:{ color:CMUT, font:{size:10} }, grid:{ color:CLINE } },
      y:{ ticks:{ color:CMUT, font:{size:10} }, grid:{ color:CLINE }, beginAtZero:true }
    }
  };
  if(extra) for(var k in extra) o[k]=extra[k];
  return o;
}
function mkChart(id, cfg){
  var el = document.getElementById(id);
  if(!el) return;
  charts[id] = new Chart(el.getContext("2d"), cfg);
}

/* ============ SCREEN 0 : 貿易文件產出 ============ */
function scr0(){
  var kpis = [
    {ic:"description", lbl:"本月產出文件", val:"1,284", u:"份", d:"+12.4%", cls:"up", ai:"north_east"},
    {ic:"task_alt",    lbl:"文件準確率", val:"98.6", u:"%", d:"+2.1pt", cls:"up", ai:"north_east"},
    {ic:"schedule",    lbl:"平均產製工時", val:"6.8", u:"分/份", d:"-41%", cls:"up", ai:"south_east"},
    {ic:"pending_actions", lbl:"待處理案件", val:"37", u:"件", d:"3 件逾期", cls:"down", ai:"warning"}
  ];
  var rows = [
    {no:"EXP-260814-018", cust:"Vantage Electronics (US)", inc:"FOB Keelung", items:"12", inv:"USD 84,200", st:"ok",   sl:"已產出"},
    {no:"EXP-260814-017", cust:"Nordholm A/S (DK)",       inc:"CIF Aarhus",  items:"7",  inv:"EUR 52,900", st:"warn", sl:"待覆核"},
    {no:"EXP-260814-016", cust:"Sakura Trading (JP)",     inc:"CFR Osaka",   items:"21", inv:"JPY 6,120,000", st:"ok", sl:"已產出"},
    {no:"EXP-260814-015", cust:"Meridian Parts (AU)",     inc:"FCA Taipei",  items:"5",  inv:"AUD 39,400", st:"proc", sl:"產製中"},
    {no:"EXP-260814-014", cust:"Bright Home GmbH (DE)",   inc:"DAP Hamburg", items:"18", inv:"EUR 71,800", st:"bad",  sl:"缺HS Code"},
    {no:"EXP-260814-013", cust:"Coral Bay Ltd (SG)",      inc:"FOB Kaohsiung",items:"9", inv:"USD 46,300", st:"ok",   sl:"已產出"}
  ];
  var stMap = {ok:["p-ok","check_circle"], warn:["p-warn","hourglass_top"], proc:["p-info","autorenew"], bad:["p-bad","error"]};
  var trs = rows.map(function(r){
    var s = stMap[r.st] || stMap.ok;
    return "<tr><td class='mono'>"+r.no+"</td><td>"+r.cust+"</td><td>"+r.inc+"</td><td style='text-align:center'>"+r.items+"</td><td class='mono'>"+r.inv+"</td><td><span class='pill "+s[0]+"'><span class='material-symbols-outlined'>"+s[1]+"</span>"+r.sl+"</span></td></tr>";
  }).join("");

  return head("receipt_long","貿易文件產出","依出口訂單自動帶入品項與 HS Code，一鍵產出商業發票與裝箱單","v0")+
  "<div class='grid g-kpi'>"+ kpis.map(kpiHtml).join("") +"</div>"+
  "<div class='grid g-2-1' style='margin-top:14px'>"+
    card("insights","近14日文件產出量與準確率","","<div class='chart-wrap h260'><canvas id='c0a'></canvas></div>")+
    card("donut_small","文件類型分布","","<div class='chart-wrap h260'><canvas id='c0b'></canvas></div>")+
  "</div>"+
  "<div class='card' style='margin-top:14px'>"+
    "<div class='card-t'><span class='material-symbols-outlined'>list_alt</span>今日出口文件案件<small>共 6 筆進行中</small></div>"+
    "<div class='tbl-scroll'><table><thead><tr><th>案件編號</th><th>收貨人 / 目的國</th><th>貿易條件</th><th>品項</th><th>發票金額</th><th>狀態</th></tr></thead><tbody>"+trs+"</tbody></table></div>"+
  "</div>";
}
function initScr0(){
  mkChart("c0a",{type:"bar",data:{labels:["8/1","8/3","8/5","8/7","8/9","8/11","8/13"],
    datasets:[
      {type:"bar",label:"產出份數",data:[78,92,84,110,96,124,131],backgroundColor:"rgba(3,105,161,.75)",borderRadius:4,yAxisID:"y"},
      {type:"line",label:"準確率 %",data:[96.2,97.1,96.8,97.9,98.1,98.4,98.6],borderColor:"#38bdf8",backgroundColor:"#38bdf8",tension:.35,yAxisID:"y1",pointRadius:3}
    ]},
    options:axisOpts({scales:{
      x:{ticks:{color:CMUT,font:{size:10}},grid:{color:CLINE}},
      y:{position:"left",ticks:{color:CMUT,font:{size:10}},grid:{color:CLINE},beginAtZero:true},
      y1:{position:"right",min:90,max:100,ticks:{color:"#38bdf8",font:{size:10}},grid:{drawOnChartArea:false}}
    }})});
  mkChart("c0b",{type:"doughnut",data:{labels:["商業發票","裝箱單","產地證明","報關委任","保險單"],
    datasets:[{data:[420,398,236,142,88],backgroundColor:["#0369a1","#38bdf8","#0891b2","#7dd3fc","#155e75"],borderColor:"#0d2436",borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:"58%",plugins:{legend:{position:"right",labels:{color:CTXT,font:{size:11},boxWidth:12,padding:8}}}}});
}

/* ============ SCREEN 1 : 產地證明與 FTA ============ */

    {ic:"verified",   lbl:"本月簽發 CO", val:"312", u:"份", d:"+8.2%", cls:"up", ai:"north_east"},
    {ic:"savings",    lbl:"FTA 節省關稅", val:"4.72", u:"M NTD", d:"+0.6M", cls:"up", ai:"north_east"},
    {ic:"percent",    lbl:"平均優惠稅率", val:"3.4", u:"%", d:"vs 一般 8.1%", cls:"flat", ai:"remove"},

    {no:"CO-GSP-2608-040", dest:"美國 US",  fta:"一般", hs:"8471.30", rate:"0%",  amt:"USD 84,200", st:"ok",   sl:"已簽發"},
    {no:"CO-FTA-2608-039", dest:"日本 JP",  fta:"RCEP", hs:"3926.90", rate:"1.8%",amt:"JPY 6,120,000", st:"warn", sl:"審核中"},
    {no:"CO-FTA-2608-038", dest:"新加坡 SG",fta:"ASTEP",hs:"8544.42", rate:"0%",  amt:"USD 46,300", st:"ok",   sl:"已簽發"},
    {no:"CO-FTA-2608-037", dest:"澳洲 AU",  fta:"ANZTEC",hs:"8517.62",rate:"4.0%",amt:"AUD 39,400", st:"bad",  sl:"原產地不符"},
    {no:"CO-FTA-2608-036", dest:"韓國 KR",  fta:"RCEP", hs:"7326.90", rate:"2.1%",amt:"USD 28,900", st:"warn", sl:"審核中"}

  var ftaRows = [

    {nm:"ANZTEC", v:42, c:"66 份"},
    {nm:"ASTEP",  v:35, c:"54 份"},
    {nm:"GSP 一般",v:28, c:"38 份"},
    {nm:"其他協定",v:15, c:"12 份"}

  return head("verified","產地證明與 FTA","簽發 CO 原產地證明並依 FTA 協定套用優惠稅則，最大化關稅減免","v1")+
  "<div class='grid g-kpi'>"+ kpis.map(kpiHtml).join("") +"</div>"+
  "<div class='grid g-1-2' style='margin-top:14px'>"+
    card("stacked_bar_chart","各 FTA 協定使用占比","",
      "<div style='padding-top:4px'>"+ ftaRows.map(function(r){
        return "<div class='srow'><span class='nm'>"+r.nm+"</span><div class='bar' style='flex:1;max-width:150px'><i style='width:"+r.v+"%'></i></div><span class='vv hide-560'>"+r.c+"</span></div>";
      }).join("") +"</div>")+
    card("insights","月度 FTA 關稅節省趨勢 (M NTD)","","<div class='chart-wrap h240'><canvas id='c1a'></canvas></div>")+
  "</div>"+
  "<div class='card' style='margin-top:14px'>"+
    "<div class='card-t'><span class='material-symbols-outlined'>workspace_premium</span>產地證明簽發清單<small>依目的國套用優惠稅則</small></div>"+
    "<div class='tbl-scroll'><table><thead><tr><th>CO 編號</th><th>目的國</th><th>適用協定</th><th>HS Code</th><th>稅率</th><th>發票金額</th><th>狀態</th></tr></thead><tbody>"+trs+"</tbody></table></div>"+
  "</div>";
}
function initScr1(){
  mkChart("c1a",{type:"line",data:{labels:["3月","4月","5月","6月","7月","8月"],
    datasets:[{label:"關稅節省 (M NTD)",data:[3.1,3.6,3.9,4.2,4.5,4.72],borderColor:"#38bdf8",backgroundColor:"rgba(56,189,248,.16)",fill:true,tension:.35,pointRadius:3,pointBackgroundColor:"#38bdf8"}]},

}

/* ============ SCREEN 2 : 合規檢核 ============ */

/* ============ shared builders ============ */
function head(ic,title,desc,v){
  return "<div class='scr-head'><div><h2><span class='material-symbols-outlined'>"+ic+"</span>"+title+"</h2><p>"+desc+"</p></div><span class='tag'>作業階段 "+v.toUpperCase()+"</span></div>";
}
function card(ic,t,sm,body){
  return "<div class='card'><div class='card-t'><span class='material-symbols-outlined'>"+ic+"</span>"+t+(sm?"<small>"+sm+"</small>":"")+"</div>"+body+"</div>";
}
function kpiHtml(k){
  return "<div class='kpi'><div class='lbl'><span class='material-symbols-outlined'>"+k.ic+"</span>"+k.lbl+"</div>"+
    "<div class='val'>"+k.val+"<small>"+k.u+"</small></div>"+
    "<div class='sub "+k.cls+"'><span class='material-symbols-outlined'>"+k.ai+"</span>"+k.d+"</div></div>";
}

/* ============ router ============ */
var SCR = [scr0,scr1,scr2,scr3,scr4,scr5];
var INIT = [initScr0,initScr1,initScr2,initScr3,initScr4,initScr5];

function buildNav(){
  var nav = document.getElementById("nav");
  nav.innerHTML = MODULES.map(function(m,i){
    return "<button data-i='"+i+"'><span class='material-symbols-outlined'>"+m.icon+"</span><span class='txt'>"+m.nm+"</span></button>";
  }).join("");
  var btns = nav.querySelectorAll("[data-i]");
  for(var i=0;i<btns.length;i++){
    btns[i].addEventListener("click", function(){ location.hash = "v"+this.getAttribute("data-i"); });
  }
}

function show(i){
  var container = document.getElementById("screen");
  destroyCharts();
  var btns = document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    btns[b].classList.toggle("active", +btns[b].getAttribute("data-i")===i);
  }
  container.innerHTML = SCR[i]();
  void container.offsetHeight;
  if(INIT[i]) INIT[i]();
}

buildNav();

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
