*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:Inter,"Noto Sans TC",sans-serif;line-height:1.5}

.shell{min-height:100vh}
.side{height:76px;padding:0 clamp(18px,4vw,56px);background:rgba(248,250,252,.94);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:28px;position:sticky;top:0;z-index:20;backdrop-filter:blur(14px)}

.side button:hover{background:var(--color-muted);color:#0f172a;transform:translateY(-1px)}
.side button.on{background:#0f172a;color:#fff}
.side button.on .material-symbols-outlined{color:#fb923c}
.side .foot{font-size:10px;color:var(--muted);line-height:1.5;white-space:nowrap;border-left:1px solid var(--line);padding-left:18px}
.main{width:min(1440px,100%);margin:auto;padding:clamp(22px,3vw,46px)}
.vh{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:20px}

.vh p{margin:7px 0 0;color:var(--muted);font-size:13px}
.live{flex:none;background:#fff;border:1px solid var(--line);box-shadow:0 5px 18px rgba(15,23,42,.05);padding:8px 13px;border-radius:999px;font-size:12px;font-weight:800;color:#334155;display:flex;align-items:center;gap:7px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(21,128,61,.12)}
.hero{min-height:410px;background:#0f172a;border-radius:24px;color:#fff;overflow:hidden;display:grid;grid-template-columns:1.02fr .98fr;position:relative;margin-bottom:16px;box-shadow:0 24px 70px rgba(15,23,42,.2)}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,rgba(15,23,42,1) 12%,rgba(15,23,42,.94) 48%,rgba(15,23,42,.42));z-index:1;pointer-events:none}
.hero-copy{padding:clamp(30px,5vw,68px);position:relative;z-index:3;display:flex;flex-direction:column;justify-content:center}
.eyebrow{color:#fdba74;font:600 11px/1.4 "JetBrains Mono";letter-spacing:.16em;text-transform:uppercase}
.hero h1{font-size:clamp(38px,5vw,68px);line-height:.98;letter-spacing:-.055em;margin:14px 0 18px;max-width:680px}
.hero h1 em{font-family:"Playfair Display",serif;font-weight:400;color:#fb923c}
.hero p{color:#cbd5e1;max-width:530px;margin:0 0 26px;font-size:14px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.cta{border:0;border-radius:10px;background:var(--color-accent);color:#111827;padding:12px 18px;font-weight:900;display:inline-flex;align-items:center;gap:8px;transition:transform .2s,box-shadow .2s,background .2s}
.cta:hover{transform:translateY(-2px);background:#f97316;box-shadow:0 10px 26px rgba(234,88,12,.3)}
.ghost{border:1px solid #475569;border-radius:10px;background:rgba(255,255,255,.04);color:#fff;padding:12px 18px;font-weight:800;display:inline-flex;align-items:center;gap:8px;transition:background .2s,border-color .2s}
.ghost:hover{background:rgba(255,255,255,.1);border-color:#94a3b8}

.scene-grid{position:absolute;inset:-20%;background-image:linear-gradient(rgba(148,163,184,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.14) 1px,transparent 1px);background-size:42px 42px;transform:rotateX(62deg) rotateZ(-32deg) translateY(12%);transform-origin:center}

.stack{position:absolute;width:130px;height:70px;background:#64748b;border:1px solid #94a3b8;transform:skewY(-8deg);box-shadow:inset 0 12px rgba(255,255,255,.08),16px 18px 30px rgba(0,0,0,.32)}
.s1{right:12%;bottom:14%}.s2{right:40%;bottom:23%;width:105px;height:56px;background:#475569}.s3{right:29%;bottom:8%;width:86px;height:48px;background:#94a3b8}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi,.card{background:var(--color-card);border:1px solid var(--line);box-shadow:0 8px 28px rgba(15,23,42,.045)}
.kpi{border-radius:16px;padding:17px 18px;position:relative;overflow:hidden;min-height:126px;transition:transform .22s,box-shadow .22s,border-color .22s}
.kpi:hover{transform:translateY(-3px);border-color:#cbd5e1;box-shadow:var(--shadow)}
.kpi::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--color-primary)}
.kpi.accent::after{background:var(--color-accent)}
.kpi .l{font-size:12px;color:var(--muted);font-weight:700}
.kpi .v{font-size:29px;line-height:1.2;color:#0f172a;font-weight:900;margin-top:8px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:12px;color:var(--muted);font-weight:700}
.kpi .d{font-size:11px;font-weight:800;margin-top:5px}
.kpi .ic{position:absolute;right:15px;top:15px;color:#64748b;background:var(--color-muted);padding:8px;border-radius:10px}
.up{color:var(--ok)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .85fr}.g11{grid-template-columns:1fr 1fr}
.card{border-radius:18px;padding:18px}
.card h3{margin:0 0 15px;color:#0f172a;font-size:14px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.tag{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-ok{background:#dcfce7;color:#166534}.t-warn{background:#ffedd5;color:#9a3412}
.t-bad{background:#fee2e2;color:#991b1b}.t-info{background:#e2e8f0;color:#334155}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data tr:last-child td{border-bottom:0}
table.data th{background:#f1f5f9;color:#334155;font-size:10.5px;font-weight:900;letter-spacing:.04em;text-transform:uppercase}
table.data tbody tr{transition:background .18s}
table.data tbody tr:hover{background:#f8fafc}
table.data td:nth-child(n+3){font-variant-numeric:tabular-nums}
table.data td:first-child b,code,.tm{font-family:"JetBrains Mono",monospace}
table.data td[style*="font-weight"]{text-align:right}
.rep{display:flex;flex-direction:column;gap:9px}
.ri{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:11px;padding:11px 12px;display:flex;align-items:center;gap:12px;transition:transform .2s,box-shadow .2s}

.ri.w{border-left-color:var(--warn)}

.ri .qty small{display:block;font-size:9px;color:var(--muted)}

.yb{border-radius:9px;padding:10px;color:#fff;min-height:76px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;box-shadow:inset 0 -8px rgba(15,23,42,.12);transition:transform .23s,filter .23s}

.yb .pc{font:800 10px "JetBrains Mono";align-self:flex-end;padding:2px 6px;border-radius:8px}

.lgd{display:flex;gap:13px;flex-wrap:wrap;margin-top:13px;font-size:11px;color:var(--muted)}
.lgd span{display:inline-flex;align-items:center;gap:5px}.lgd i{width:11px;height:11px;border-radius:3px}
.chart{height:270px}
.bar{height:8px;background:#e2e8f0;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:var(--color-accent)}
.scan{display:flex;flex-direction:column;position:relative}
.scan::before{content:"";position:absolute;left:18px;top:18px;bottom:18px;width:2px;background:var(--line)}
.sc{display:flex;align-items:center;gap:11px;padding:10px 11px 10px 0;font-size:12.5px;flex-wrap:wrap;position:relative}
.sc .material-symbols-outlined{z-index:1;color:#fff;background:#64748b;border:4px solid #fff;width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.sc code{background:#f1f5f9;padding:3px 7px;border-radius:5px;font-size:11px;color:#334155;font-weight:700}
.sc .tm{margin-left:auto;color:var(--muted);font-size:10px}
.steps{display:flex;flex-direction:column}
.stp{display:flex;gap:13px;padding-bottom:17px;position:relative}
.stp:not(:last-child)::before{content:"";position:absolute;left:14px;top:30px;bottom:0;width:2px;background:#cbd5e1}
.stp .dot{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;color:#fff;font:800 12px "JetBrains Mono";z-index:1}
.stp .sc2 b{font-size:13px;color:#0f172a;display:block}.stp .sc2 small{color:var(--muted);font-size:11px}
.grid-item{animation:reveal .42s backwards cubic-bezier(.2,.9,.3,1.25)}
.grid-item:nth-child(2){animation-delay:.06s}.grid-item:nth-child(3){animation-delay:.12s}.grid-item:nth-child(4){animation-delay:.18s}
@keyframes reveal{from{opacity:0;transform:translateY(16px) scale(.96)}}
@media(max-width:1100px){.side .foot{display:none}.hero{grid-template-columns:1.15fr .85fr}.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){
  .side{height:auto;min-height:70px;padding:10px 16px;display:block}.bd{margin-bottom:8px}
  #nav{padding-bottom:2px}.side button{padding:9px 10px}.side button span:last-child{display:none}
  .main{padding:24px 16px}.vh{align-items:flex-start}.live{margin-top:2px}
  .hero{grid-template-columns:1fr;min-height:530px}.hero-copy{padding:32px 24px;justify-content:flex-start}
  .hero-scene{position:absolute;inset:auto 0 0;height:235px;min-height:0}.hero::before{background:linear-gradient(#0f172a 43%,rgba(15,23,42,.55))}
  .g2,.g11{grid-template-columns:1fr}.yard{grid-template-columns:repeat(4,1fr)}

@media(max-width:480px){
  .vh h2{font-size:25px}.vh p{max-width:230px}.live{font-size:0;padding:9px}.live::after{content:"同步";font-size:11px}
  .kpis{grid-template-columns:1fr 1fr;gap:9px}.kpi{padding:14px;min-height:118px}.kpi .v{font-size:25px}.kpi .ic{display:none}
  .hero h1{font-size:39px}.hero-actions>*{width:100%;justify-content:center}.yard{grid-template-columns:repeat(3,1fr)}
  .card{padding:14px}.side button{min-width:44px;min-height:44px;justify-content:center}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}
  .grid-item{opacity:1;transform:none}.yb:hover,.kpi:hover,.cta:hover{transform:none}
}
</style>

function yardHtml(){return `<div class="yard">${YARD.map(y=>!y[1]?`<div class="yb empty grid-item"><b>${y[0]}</b><small>空置</small></div>`:`<div class="yb grid-item" style="background:${CAT[y[1]]}"><div><b>${y[0]}</b><small style="display:block">${y[1]}</small></div><span class="pc" style="background:${y[2]>=90?"#991b1b":"rgba(15,23,42,.38)"}" aria-label="佔用率 ${y[2]}%">${y[2]>=90?"警示 ":""}${y[2]}%</span></div>`).join("")}</div>`}
function yardLegend(){return `<div class="lgd">${Object.keys(CAT).map(k=>`<span><i style="background:${CAT[k]}"></i>${k}</span>`).join("")}<span><i style="background:#f1f5f9;border:1px dashed #94a3b8"></i>空置</span></div>`}
const SCREENS=[

<div class="grid g2"><div class="card grid-item"><h3><span class="material-symbols-outlined">grid_view</span>堆置儲區佔用地圖 <span class="tag t-info" style="margin-left:auto">依材料類別著色</span></h3>${yardHtml()}${yardLegend()}</div><div class="card grid-item"><h3><span class="material-symbols-outlined">warning</span>安全存量預警（AI 建議補料）</h3><div class="rep">${REP.map(r=>`<div class="ri ${r[4]==="w"?"w":""}"><div class="mid"><b>${r[4]==="bad"?"缺料警示 · ":"偏低提醒 · "}${r[0]}</b><small>${r[1]} · ${r[2]}</small></div><div class="qty"><b>${r[3]}</b><small>建議補量</small></div></div>`).join("")}</div></div></div>`,
()=>`<div class="grid g2"><div class="card grid-item"><h3><span class="material-symbols-outlined">local_shipping</span>進場驗收作業 <span class="tag t-warn" style="margin-left:auto">文件待核 1</span></h3><div class="scroll"><table class="data"><tr><th>收料單</th><th>供應商</th><th>材料 / 數量</th><th>驗收狀態</th><th>建議堆置區</th></tr>${RECV.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td><span class="tag ${r[5]}">${r[3]}</span></td><td>${r[4]}</td></tr>`).join("")}</table></div></div><div class="card grid-item"><h3><span class="material-symbols-outlined">route</span>進場作業流程</h3><div class="steps">${FLOW.map((f,i)=>`<div class="stp grid-item"><div class="dot" style="background:${f[2]}">${i+1}</div><div class="sc2"><b>${f[0]}</b><small>${f[1]}</small></div></div>`).join("")}</div></div></div>`,
()=>`<div class="card grid-item"><h3><span class="material-symbols-outlined">grid_view</span>堆置儲區佔用地圖</h3>${yardHtml()}${yardLegend()}</div><div class="card grid-item" style="margin-top:16px"><h3><span class="material-symbols-outlined">inventory_2</span>各堆置區存料明細</h3><div class="scroll"><table class="data"><tr><th>堆置區</th><th>材料</th><th>現量</th><th>單位</th><th>安全量</th><th>週轉</th></tr>${STOCK.map(s=>`<tr><td><b>${s[0]}</b></td><td>${s[1]}</td><td style="font-weight:700">${s[2]}</td><td>${s[3]}</td><td>${s[4]}</td><td><span class="tag ${s[6]}">${s[5]}</span></td></tr>`).join("")}</table></div></div>`,
()=>`<div class="card grid-item"><h3><span class="material-symbols-outlined">output</span>領用出庫作業</h3><div class="scroll"><table class="data"><tr><th>領料單</th><th>施工項目</th><th>材料 / 數量</th><th>領用工班</th><th>進度</th><th>狀態</th></tr>${ISSUE.map(p=>`<tr><td><b>${p[0]}</b></td><td>${p[1]}</td><td>${p[2]}</td><td>${p[3]}</td><td style="min-width:120px" aria-label="進度 ${p[5]}%"><div class="bar"><i style="width:${p[5]}%"></i></div><small>${p[5]}%</small></td><td><span class="tag ${p[6]}">${p[4]}</span></td></tr>`).join("")}</table></div></div>`,
()=>`<div class="grid g2"><div class="card grid-item"><h3><span class="material-symbols-outlined">inventory_2</span>料場盤點任務</h3><div class="scroll"><table class="data"><tr><th>盤點單</th><th>範圍</th><th>堆置區</th><th>差異</th><th>狀態</th></tr>${COUNT.map(c=>`<tr><td><b>${c[0]}</b></td><td>${c[1]}</td><td>${c[2]}</td><td>${c[3]}</td><td><span class="tag ${c[5]}">${c[4]}</span></td></tr>`).join("")}</table></div><p style="font-size:11.5px;color:var(--muted);margin:12px 0 0">帳實差異超過門檻自動觸發覆盤與異常調查。</p></div><div class="card grid-item"><h3><span class="material-symbols-outlined">donut_large</span>盤點差異分佈</h3><div class="chart" id="c_ct"></div></div></div>`,

];
let chart;
function draw(i){if(chart){chart.dispose();chart=null}if(i===4){const host=document.getElementById("c_ct");if(host){chart=echarts.init(host);chart.setOption({tooltip:{trigger:"item"},legend:{bottom:0,textStyle:{fontFamily:"Inter",fontSize:11,color:"#475569"}},series:[{type:"pie",radius:["46%","72%"],center:["50%","43%"],label:{fontFamily:"Inter",fontSize:11,color:"#334155"},itemStyle:{borderColor:"#fff",borderWidth:4},data:[{value:79,name:"帳實相符",itemStyle:{color:"#15803d"}},{value:13,name:"盤盈",itemStyle:{color:"#64748b"}},{value:8,name:"盤虧",itemStyle:{color:"#dc2626"}}]}]})}}}
function show(i){i=Math.max(0,Math.min(i,MOD.length-1));nav.querySelectorAll("button").forEach(b=>{const on=+b.dataset.i===i;b.classList.toggle("on",on);b.setAttribute("aria-current",on?"page":"false")});vt.textContent=MOD[i][2];vd.textContent=MOD[i][3];view.innerHTML=SCREENS[i]();draw(i)}
function fromHash(){const m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?+m[1]:0);try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);
window.addEventListener("resize",()=>{if(chart)chart.resize()});
fromHash();
