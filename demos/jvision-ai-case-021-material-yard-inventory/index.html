<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>材料進場庫存所 · Material Yard Ops</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--accent:#78716c;--accent2:#a8a29e;--amber:#d97706;--ink:#292524;--bg:#f5f5f4;--card:#fff;--line:#e2ded9;--mut:#78716c;--ok:#4d7c0f;--warn:#d97706;--bad:#b91c1c}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.shell>*{min-width:0}
.side{background:linear-gradient(185deg,#57534e,#3f3c39);color:#d6d3d1;padding:18px 14px;display:flex;flex-direction:column;gap:5px;position:sticky;top:0;height:100vh;overflow:auto}
.side .bd{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.side .lg{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,var(--accent2),var(--accent));display:grid;place-items:center;font-weight:800;color:#fff;flex:none;box-shadow:0 6px 18px rgba(41,37,36,.5);font-family:"Noto Sans TC"}
.side .bd b{font-size:15px;font-weight:800;font-family:"Noto Sans TC";display:block;color:#fff}
.side .bd span{font-size:10px;color:#a8a29e;letter-spacing:1.3px}
.side button{display:flex;align-items:center;gap:11px;background:transparent;border:0;color:#d6d3d1;font:inherit;font-weight:600;font-size:13.5px;padding:11px 12px;border-radius:10px;cursor:pointer;text-align:left;width:100%;font-family:"Noto Sans TC";flex:none;white-space:nowrap}
.side button .material-symbols-outlined{font-size:20px;color:#a8a29e}
.side button:hover{background:rgba(255,255,255,.06)}
.side button.on{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;font-weight:800}
.side button.on .material-symbols-outlined{color:#fff}
.side .foot{margin-top:auto;padding:12px 10px;font-size:11px;color:#a8a29e;border-top:1px solid rgba(255,255,255,.1);line-height:1.7}
.main{padding:22px 24px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.live{background:#ede9e5;color:#57534e;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--amber);display:inline-block;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.32}
.up{color:var(--ok)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .85fr}
.g11{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#ecfccb;color:#3f6212}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#ede9e5;color:#57534e}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#faf9f7}
.rep{display:flex;flex-direction:column;gap:9px}
.ri{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:11px;padding:10px 13px;display:flex;align-items:center;gap:12px}
.ri.w{border-left-color:var(--amber)}
.ri .mid{flex:1;min-width:0}
.ri .mid b{font-size:13px;font-family:"Noto Sans TC"}
.ri .mid small{color:var(--mut);font-size:11.5px;display:block}
.ri .qty{text-align:right;flex:none}
.ri .qty b{font-family:Inter;font-size:15px;color:var(--accent)}
.ri .qty small{display:block;font-size:10px;color:var(--mut)}
.yard{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.yb{border-radius:9px;padding:9px 8px;color:#fff;min-height:70px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;min-width:0}
.yb b{font-size:12px;font-family:Inter;font-weight:800}
.yb small{font-size:10px;opacity:.92;font-family:"Noto Sans TC";line-height:1.3}
.yb .pc{font-size:10px;font-weight:800;align-self:flex-end;padding:1px 6px;border-radius:10px}
.yb.empty{background:#efece8;color:#a8a29e;border:1px dashed #d6d0c9}
.lgd{display:flex;gap:14px;flex-wrap:wrap;margin-top:13px;font-size:11.5px;color:var(--mut)}
.lgd span{display:inline-flex;align-items:center;gap:5px}
.lgd i{width:11px;height:11px;border-radius:3px;display:inline-block}
.chart{height:250px}
.bar{height:8px;background:#efece8;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.scan{display:flex;flex-direction:column;gap:8px}
.sc{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12.5px;flex-wrap:wrap}
.sc .material-symbols-outlined{color:var(--accent)}
.sc code{background:#f2efec;padding:2px 7px;border-radius:5px;font-size:11.5px;color:var(--accent);font-weight:700}
.sc .tm{margin-left:auto;color:var(--mut);font-size:11px}
.scroll{overflow-x:auto}
.steps{display:flex;flex-direction:column;gap:0}
.stp{display:flex;gap:12px;padding-bottom:14px;position:relative}
.stp:not(:last-child)::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.stp .dot{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800;font-family:Inter;z-index:1}
.stp .sc2{min-width:0}
.stp .sc2 b{font-size:13px;font-family:"Noto Sans TC";display:block}
.stp .sc2 small{color:var(--mut);font-size:11.5px}
@media(max-width:860px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;overflow:visible}.side .bd{width:100%;padding-bottom:8px}.side button{width:auto;flex:none}.side .foot{display:none}.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g11{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="bd"><div class="lg">料</div><div><b>材料進場庫存所</b><span>MATERIAL YARD OPS</span></div></div>
    <div id="nav"></div>
    <div class="foot">在場料項 214 · 堆置區 48<br/>今日進場 12 · 待領 9<br/>安全存量預警 5</div>
  </aside>
  <main class="main">
    <div class="vh"><div><h2 id="vt">材料總覽</h2><p id="vd"></p></div><div class="live"><i></i>料場即時同步</div></div>
    <div id="view"></div>
  </main>
</div>
<script>
const MOD=[["材料總覽","dashboard","材料總覽","料場進出、庫容與供料全局戰情"],
["進場驗收","local_shipping","進場驗收","材料到場過磅、抽驗與收料建帳"],
["堆置儲區","grid_view","堆置儲區","料場堆置區佔用地圖與存料明細"],
["領用出庫","output","領用出庫","工班領料、出庫覆核與工地配送"],
["庫存盤點","inventory_2","庫存盤點","料場實地盤點與帳實差異調整"],
["供料追蹤","sync","供料追蹤","安全存量預警與補料進場排程"]];
const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span>'+m[0];b.onclick=()=>show(i);nav.appendChild(b);});

const CAT={"鋼筋":"#78716c","水泥":"#a8a29e","模板":"#8a6d3b","砂石":"#b08968","管材":"#57534e"};
const YARD=[["A1","鋼筋",92],["A2","鋼筋",74],["A3","水泥",61],["A4","",0],["B1","水泥",88],["B2","模板",45],["B3","砂石",70],["B4","鋼筋",96],["C1","管材",52],["C2","砂石",83],["C3","",0],["C4","模板",38],["D1","鋼筋",67],["D2","水泥",95],["D3","砂石",41],["D4","管材",58]];

const REP=[["卜特蘭水泥","B1 / D2","現量 586 / 安全 640 包","+220","bad"],["#4 竹節鋼筋","A1·A2·B4","現量 11.5t / 安全 20t","+18t","bad"],["H型鋼模板","B2","現量 81 / 安全 150 片","+90","w"],["級配砂石","C2","現量 37 / 安全 80 m³","+50","w"],["PVC 管 4吋","C1","現量 46 / 安全 120 支","+80","w"]];
const RECV=[["MR-2417","力鋼鋼鐵","#4 竹節鋼筋 12.5t","過磅中","A1","t-info"],["MR-2416","台泥物流","卜特蘭水泥 320 包","抽驗合格","B1","t-ok"],["MR-2415","永順模板","H型鋼模板 180 片","文件待核","B2","t-warn"],["MR-2414","大昌砂石","級配砂石 45m³","已入帳","C2","t-ok"],["MR-2413","中興管材","PVC 管 200 支","退貨處理","—","t-bad"]];
const FLOW=[["材料進場驗收","收料員 · 過磅抽驗建帳","#59635c"],["指派堆置儲區","料場管理員 · 貼標上料","#78716c"],["領用出庫","料場管理員 · 掃碼扣帳","#8a6d3b"],["庫存盤點","料場管理員 · 帳實對帳","#a8a29e"],["供料追蹤補料","工程主管 · 排定進場","#d97706"]];
const STOCK=[["A1","#4 竹節鋼筋","11.5","t","12.5","週轉 6 天","t-warn"],["B1","卜特蘭水泥","282","包","320","週轉 4 天","t-bad"],["B2","H型鋼模板","81","片","180","週轉 9 天","t-warn"],["C2","級配砂石","37","m³","45","週轉 7 天","t-warn"],["D2","卜特蘭水泥","304","包","320","週轉 3 天","t-bad"]];
const ISSUE=[["IS-882","一樓RC結構","竹節鋼筋 3.2t","B棟工班","出庫中",64,"t-info"],["IS-881","二樓樓板","水泥 80 包","A棟工班","待配送",90,"t-warn"],["IS-880","擋土牆","砂石 12m³","土建工班","已配送",100,"t-ok"],["IS-879","柱模組立","鋼模板 24 片","模板工班","覆核中",78,"t-warn"]];
const COUNT=[["PD-051","A 區 鋼筋堆置","6 堆置區","+0.3t / -0.1t","已調整","t-ok"],["PD-050","B 區 水泥棚","4 堆置區","0","無差異","t-ok"],["PD-049","C 區 砂石場","5 堆置區","-2.4m³","調查中","t-warn"]];
const SUP=[["#4 竹節鋼筋","11.5t","20.0t","+18t","力鋼鋼鐵","已排程"],["卜特蘭水泥","282 包","500 包","+220 包","台泥物流","待核准"],["H型鋼模板","81 片","150 片","+90 片","永順模板","待核准"],["級配砂石","37 m³","80 m³","+50 m³","大昌砂石","草稿"],["PVC 管 4吋","46 支","120 支","+80 支","中興管材","已排程"]];
const SCAN=[["進場","MR-2417","竹節鋼筋 12.5t","09:12"],["上料","A1","竹節鋼筋 12.5t","09:20"],["領用","IS-882","鋼筋 3.2t","10:05"],["盤點","B1","實盤 282 包","10:31"],["出庫","IS-880","砂石 12m³","10:48"]];

function yardHtml(){return '<div class="yard">'+YARD.map(y=>{if(!y[1])return `<div class="yb empty"><b>${y[0]}</b><small>空置</small></div>`;const p=y[2],pcbg=p>=90?'rgba(185,28,28,.55)':'rgba(0,0,0,.2)';return `<div class="yb" style="background:${CAT[y[1]]}"><div><b>${y[0]}</b><small style="display:block">${y[1]}</small></div><span class="pc" style="background:${pcbg}">${p}%</span></div>`;}).join('')+'</div>';}
function yardLegend(){return '<div class="lgd">'+Object.keys(CAT).map(k=>`<span><i style="background:${CAT[k]}"></i>${k}</span>`).join('')+'<span><i style="background:#efece8;border:1px dashed #d6d0c9"></i>空置</span></div>';}

const SCREENS=[
()=>`<div class="kpis">
 <div class="kpi"><span class="material-symbols-outlined ic">local_shipping</span><div class="l">今日進場</div><div class="v">12<small style="font-size:12px"> 車</small></div><div class="d up">▲ 較昨日 +3</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">grid_view</span><div class="l">堆置區佔用</div><div class="v">71<small style="font-size:12px">%</small></div><div class="d" style="color:var(--mut)">48 區 · 空置 6</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">output</span><div class="l">待領出庫</div><div class="v">9<small style="font-size:12px"> 單</small></div><div class="d" style="color:var(--warn)">3 急件工地待料</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">warning</span><div class="l">安全存量預警</div><div class="v" style="color:var(--amber)">5</div><div class="d" style="color:var(--mut)">2 缺料 · 3 偏低</div></div>
</div>
<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">grid_view</span>堆置儲區佔用地圖 <span class="tag t-info" style="margin-left:auto">依材料類別著色</span></h3>${yardHtml()}${yardLegend()}</div>
 <div class="card"><h3><span class="material-symbols-outlined">warning</span>安全存量預警（AI 建議補料）</h3><div class="rep">${REP.map(r=>`<div class="ri ${r[4]=='w'?'w':''}"><div class="mid"><b>${r[0]}</b><small>${r[1]} · ${r[2]}</small></div><div class="qty"><b>${r[3]}</b><small>建議補量</small></div></div>`).join('')}</div></div>
</div>`,

()=>`<div class="grid g2"><div class="card"><h3><span class="material-symbols-outlined">local_shipping</span>進場驗收作業 <span class="tag t-warn" style="margin-left:auto">文件待核 1</span></h3><div class="scroll"><table class="data"><tr><th>收料單</th><th>供應商</th><th>材料 / 數量</th><th>驗收狀態</th><th>建議堆置區</th></tr>${RECV.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td><span class="tag ${r[5]}">${r[3]}</span></td><td>${r[4]}</td></tr>`).join('')}</table></div></div>
 <div class="card"><h3><span class="material-symbols-outlined">route</span>進場作業流程</h3><div class="steps">${FLOW.map((f,i)=>`<div class="stp"><div class="dot" style="background:${f[2]}">${i+1}</div><div class="sc2"><b>${f[0]}</b><small>${f[1]}</small></div></div>`).join('')}</div></div></div>`,

()=>`<div class="card"><h3><span class="material-symbols-outlined">grid_view</span>堆置儲區佔用地圖</h3>${yardHtml()}${yardLegend()}</div>
<div class="card" style="margin-top:16px"><h3><span class="material-symbols-outlined">inventory_2</span>各堆置區存料明細</h3><div class="scroll"><table class="data"><tr><th>堆置區</th><th>材料</th><th>現量</th><th>單位</th><th>安全量</th><th>週轉</th></tr>${STOCK.map(s=>`<tr><td><b>${s[0]}</b></td><td>${s[1]}</td><td style="font-weight:700">${s[2]}</td><td>${s[3]}</td><td>${s[4]}</td><td><span class="tag ${s[6]}">${s[5]}</span></td></tr>`).join('')}</table></div></div>`,

()=>`<div class="card"><h3><span class="material-symbols-outlined">output</span>領用出庫作業</h3><div class="scroll"><table class="data"><tr><th>領料單</th><th>施工項目</th><th>材料 / 數量</th><th>領用工班</th><th>進度</th><th>狀態</th></tr>${ISSUE.map(p=>`<tr><td><b>${p[0]}</b></td><td>${p[1]}</td><td>${p[2]}</td><td>${p[3]}</td><td style="min-width:120px"><div class="bar"><i style="width:${p[5]}%"></i></div></td><td><span class="tag ${p[6]}">${p[4]}</span></td></tr>`).join('')}</table></div></div>`,

()=>`<div class="grid g2"><div class="card"><h3><span class="material-symbols-outlined">inventory_2</span>料場盤點任務</h3><div class="scroll"><table class="data"><tr><th>盤點單</th><th>範圍</th><th>堆置區</th><th>差異</th><th>狀態</th></tr>${COUNT.map(c=>`<tr><td><b>${c[0]}</b></td><td>${c[1]}</td><td>${c[2]}</td><td>${c[3]}</td><td><span class="tag ${c[5]}">${c[4]}</span></td></tr>`).join('')}</table></div><p style="font-size:11.5px;color:var(--mut);margin:10px 0 0">帳實差異超過門檻自動觸發覆盤與異常調查。</p></div><div class="card"><h3><span class="material-symbols-outlined">donut_large</span>盤點差異分佈</h3><div class="chart" id="c_ct"></div></div></div>`,

()=>`<div class="card"><h3><span class="material-symbols-outlined">sync</span>供料追蹤補料（低於安全存量自動生成）</h3><div class="scroll"><table class="data"><tr><th>材料</th><th>現量</th><th>安全量</th><th>建議補量</th><th>供應商</th><th>進場狀態</th></tr>${SUP.map(r=>`<tr><td><b>${r[0]}</b></td><td style="color:var(--bad);font-weight:700">${r[1]}</td><td>${r[2]}</td><td style="color:var(--accent);font-weight:800">${r[3]}</td><td>${r[4]}</td><td><span class="tag ${r[5]=='已排程'?'t-ok':r[5]=='待核准'?'t-warn':'t-info'}">${r[5]}</span></td></tr>`).join('')}</table></div>
<h3 style="margin-top:18px"><span class="material-symbols-outlined">qr_code_scanner</span>條碼作業即時軌跡</h3><div class="scan">${SCAN.map(s=>`<div class="sc"><span class="material-symbols-outlined">barcode_reader</span><b style="font-family:Noto Sans TC">${s[0]}</b><code>${s[1]}</code><span>${s[2]}</span><span class="tm">${s[3]}</span></div>`).join('')}</div></div>`
];

function draw(i){
 if(i==4){const host=document.getElementById('c_ct');if(host){const c=echarts.init(host);c.setOption({tooltip:{trigger:'item'},legend:{bottom:0,textStyle:{fontSize:11}},series:[{type:'pie',radius:['45%','72%'],center:['50%','44%'],label:{fontSize:11},data:[{value:79,name:'帳實相符',itemStyle:{color:'#4d7c0f'}},{value:13,name:'盤盈',itemStyle:{color:'#78716c'}},{value:8,name:'盤虧',itemStyle:{color:'#b91c1c'}}]}]});}}
}
