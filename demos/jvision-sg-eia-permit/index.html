<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>環境影響評估與開發許可 · ESG 永續管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700;800;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000000;
  --color-secondary:#10B981;
  --color-on-secondary:#0F172A;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#ECFDF5;
  --color-foreground:#064E3B;
  --color-card:#FFFFFF;
  --color-card-foreground:#064E3B;
  --color-muted:#E8F1F3;
  --color-muted-foreground:#475569;
  --color-border:#A7F3D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#059669;

  --blue:#059669;
  --ink:#064E3B;
  --muted:#475569;
  --line:#A7F3D0;

  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --accent-soft:#D1FAE5;
  --accent-soft2:#A7F3D0;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --th:#D1FAE5;
  --hov:#ECFDF5;
  --track:#D9E8E4;
  --sidebar:#022C22;
  --sidebar2:#064E3B;
  --side-edge:#10B981;
  --ok:#047857;
  --warn:#92400E;
  --bad:#B91C1C;
  --info:#075985;
  --r:0px;
  --glow:rgba(5,150,105,.24);
}

*{box-sizing:border-box}
html{scroll-behavior:auto}
html,body{margin:0;padding:0;min-width:320px}
body{
  font-family:"Fira Sans",sans-serif;
  font-size:14px;
  line-height:1.5;
  color:var(--ink);
  background-color:var(--bg);
  background-image:
    linear-gradient(rgba(5,150,105,.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(5,150,105,.07) 1px,transparent 1px);
  background-size:32px 32px;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,[role="button"],a{cursor:pointer}
h1,h2,h3,h4{margin:0;font-family:"Fira Sans",sans-serif;font-weight:800;letter-spacing:-.025em}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring)!important;
  outline-offset:3px!important;
  box-shadow:0 0 0 2px #fff!important;
}
::selection{color:#000;background:#6EE7B7}

.app{display:flex;flex-direction:column;min-height:100vh}
.sidebar{
  position:sticky;
  z-index:40;
  top:0;
  display:flex;
  width:100%;
  min-width:0;
  height:72px;
  flex:none;
  align-items:stretch;
  gap:0;
  padding:0;
  color:#ECFDF5;
  background:var(--sidebar);
  border-bottom:4px solid var(--color-secondary);
}
.brand{
  display:flex;
  flex:0 0 268px;
  align-items:center;
  gap:12px;
  min-width:0;
  padding:10px 18px;
  background:var(--color-secondary);
  color:#022C22;
  border-right:3px solid #000;
}
.brand-logo{
  display:flex;
  width:44px;
  height:44px;
  flex:none;
  align-items:center;
  justify-content:center;
  color:#000;
  background:transparent;
  border:3px solid #000;
  border-radius:0;
  box-shadow:5px 5px 0 #000;
}
.brand-logo .material-symbols-outlined{font-size:25px}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-size:16px;font-weight:900;letter-spacing:.01em;white-space:nowrap}
.brand-txt span{display:block;font-family:"Fira Code",monospace;font-size:10px;font-weight:700;letter-spacing:.14em}
.nav{
  display:flex;
  flex:1;
  flex-direction:row;
  gap:0;
  min-width:0;
  margin:0;
  overflow-x:auto;
  scrollbar-width:thin;
  scrollbar-color:#34D399 #022C22;
}
.nav button{
  position:relative;
  display:flex;
  min-width:max-content;
  min-height:68px;
  align-items:center;
  gap:9px;
  padding:0 20px;
  color:#D1FAE5;
  background:transparent;
  border:0;
  border-right:1px solid rgba(167,243,208,.32);
  border-radius:0;
  text-align:left;
  font-weight:700;
  transition:background-color .18s ease,color .18s ease;
  white-space:nowrap;
}
.nav button:hover{color:#000;background:#6EE7B7}
.nav button.on{color:#000;background:#ECFDF5;box-shadow:inset 0 -7px 0 var(--color-primary)}
.nav button.on::before{content:"";display:none}
.nav button .material-symbols-outlined{font-size:20px;flex:none}
.nav .idx{
  margin-left:7px;
  padding:1px 4px;
  font-family:"Fira Code",monospace;
  font-size:10px;
  border:1px solid currentColor;
}
.side-foot{display:none}
.main{width:100%;max-width:1600px;margin:0 auto;padding:28px 30px 64px}

.topbar{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:18px;
  margin-bottom:20px;
  padding:18px 20px;
  color:#ECFDF5;
  background:#064E3B;
  border:3px solid #022C22;
  box-shadow:8px 8px 0 var(--color-secondary);
}
.topbar h1{display:flex;align-items:center;gap:11px;font-size:clamp(22px,2vw,30px);font-weight:900}
.topbar h1 .material-symbols-outlined{font-size:30px;color:#6EE7B7}
.topbar .sub{margin-top:4px;color:#D1FAE5;font-size:13px;font-weight:500}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{
  display:inline-flex;
  min-height:38px;
  align-items:center;
  gap:7px;
  padding:7px 10px;
  color:#D1FAE5;
  background:#022C22;
  border:1px solid #6EE7B7;
  border-radius:0;
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:600;
}
.chip .dot{
  width:9px;
  height:9px;
  background:#34D399;
  border:2px solid #ECFDF5;
  border-radius:50%;
  box-shadow:none;
  animation:pulse 2s ease-in-out infinite;
}
.avatar{
  display:flex;
  width:38px;
  height:38px;
  flex:none;
  align-items:center;
  justify-content:center;
  color:#000;
  background:#34D399;
  border:2px solid #000;
  border-radius:0;
  font-weight:900;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{
  min-width:0;
  color:var(--color-card-foreground);
  background:var(--panel);
  border:2px solid #064E3B;
  border-radius:0;
  box-shadow:5px 5px 0 var(--line);
}
.card,.sec{padding:17px}
.sec{margin-bottom:15px}
.card:hover,.tile:hover,.kpi:hover{box-shadow:7px 7px 0 #6EE7B7;transform:translate(-2px,-2px);transition:transform .18s ease,box-shadow .18s ease}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px;flex-wrap:wrap}
.card.pad0>.card-h{padding:17px 17px 0!important}
.card-h h3,.sec>h3{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800}
.card-h h3 .material-symbols-outlined,.sec>h3 .material-symbols-outlined{font-size:20px;color:var(--accent)}
.card-h .hint{padding:3px 6px;color:#064E3B;background:#D1FAE5;border:1px solid #059669;font-family:"Fira Code",monospace;font-size:10px;font-weight:600}
.sec>h3{margin-bottom:13px}
.sec>p{margin:0 0 13px;color:var(--muted);font-size:13px;line-height:1.75}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0;font-size:13px}
.dl dt{color:var(--muted);font-size:12px;font-weight:700}
.dl dd{margin:0;line-height:1.75}

.kpi,.stat{position:relative;overflow:hidden;padding:15px 17px}
.kpi::before,.tile::before{content:"";position:absolute;top:0;left:0;width:100%;height:7px;background:var(--color-primary)}
.kpi::after{content:"DATA";position:absolute;right:8px;top:7px;color:#A7F3D0;font-family:"Fira Code",monospace;font-size:10px;font-weight:700;letter-spacing:.12em}
.kpi .ico,.tile .ti{
  display:flex;
  width:38px;
  height:38px;
  align-items:center;
  justify-content:center;
  color:#000;
  background:#34D399;
  border:2px solid #064E3B;
  border-radius:0;
}
.kpi .ico{position:relative;z-index:1;margin-top:5px}
.kpi .ico .material-symbols-outlined,.tile .ti .material-symbols-outlined{font-size:21px}
.kpi .lbl,.stat .lbl{display:flex;align-items:center;gap:5px;margin-top:10px;color:var(--muted);font-size:12px;font-weight:600}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{font-size:15px;color:var(--accent)}
.kpi .val,.stat .val,.tile .tv{
  margin-top:2px;
  font-family:"Fira Code",monospace;
  font-size:27px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.06em;
}
.kpi .val small,.stat .val small{margin-left:4px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:0}
.kpi .delta,.stat .d{display:inline-flex;align-items:center;gap:3px;margin-top:5px;font-size:11px;font-weight:800}
.delta.up,.d.up{color:#047857}
.delta.down,.d.down{color:#B91C1C}
.delta.flat,.d.flat{color:#475569}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:15px}

.tile{position:relative;display:flex;flex-direction:column;gap:7px;padding:21px 17px 15px;overflow:hidden}
.tile:nth-child(even)::before{background:#10B981}
.tile b{font-size:14px;font-weight:800}
.tile p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}
.tile .tv{font-size:25px}
.av,.mini-av{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:none;
  color:#000;
  background:#6EE7B7;
  border:1px solid #064E3B;
  border-radius:0;
  font-weight:800;
}
.av{width:26px;height:26px;font-size:11px}
.mini-av{width:18px;height:18px;font-size:9px}
.who{display:inline-flex;align-items:center;gap:6px}

.card.pad0>div:last-child{scrollbar-width:thin;scrollbar-color:#059669 #D1FAE5}
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th{
  padding:11px 13px;
  color:#022C22;
  background:#A7F3D0;
  border-right:1px solid #6EE7B7;
  border-bottom:3px solid #064E3B;
  text-align:left;
  font-family:"Fira Code","Fira Sans",monospace;
  font-size:10px;
  font-weight:800;
  letter-spacing:.03em;
  white-space:nowrap;
}
td{
  padding:11px 13px;
  border-right:1px solid #D1FAE5;
  border-bottom:1px solid var(--line);
  text-align:right;
  white-space:nowrap;
}
th:first-child,td:first-child,td:nth-child(2){text-align:left}
th:last-child,td:last-child{border-right:0}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#F4FFF9}
tbody tr:hover{background:#D1FAE5}
.mono{font-family:"Fira Code",monospace;font-weight:600;letter-spacing:0;font-variant-numeric:tabular-nums}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 7px;
  border:1px solid currentColor;
  border-radius:0;
  font-size:10px;
  font-weight:800;
  line-height:1.35;
  white-space:nowrap;
}
.tag::before{content:"■";font-size:7px}
.t-ok{color:#065F46;background:#D1FAE5}
.t-warn{color:#78350F;background:#FEF3C7}
.t-bad{color:#991B1B;background:#FEE2E2}
.t-info{color:#075985;background:#E0F2FE}
.t-gray{color:#334155;background:#E2E8F0}
.t-acc,.t-pink{color:#065F46;background:#A7F3D0}

.bar{height:9px;min-width:56px;overflow:hidden;background:var(--track);border:1px solid #94A3B8;border-radius:0}
.bar>i{display:block;height:100%;background:repeating-linear-gradient(135deg,#059669 0,#059669 6px,#34D399 6px,#34D399 10px);border-radius:0}
.prog{display:flex;min-width:0;align-items:center;gap:7px}
.prog small{width:38px;flex:none;color:#334155;font-family:"Fira Code",monospace;font-size:10px;font-weight:700;text-align:right}

.tl{position:relative;padding-left:25px}
.tl::before{content:"";position:absolute;top:4px;bottom:4px;left:7px;width:3px;background:#A7F3D0}
.tl-item,.tl-i{position:relative;padding:0 0 17px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;top:2px;left:-24px;width:15px;height:15px;background:#fff;border:4px solid var(--accent);border-radius:0}
.tl-dot.warn,.tl-d.warn{border-color:#92400E}
.tl-dot.bad,.tl-d.bad{border-color:#B91C1C}
.tl-dot.ok,.tl-d.ok{border-color:#047857}
.tl-time,.tl-t{color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;font-weight:600}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:12px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:11px}

.chk{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px dashed #6EE7B7;font-size:12px}
.chk:last-child{border-bottom:0}
.chk .material-symbols-outlined{font-size:19px}
.chk .ok{color:#047857}.chk .wait{color:#475569}.chk .bad{color:#B91C1C}.chk .warn{color:#92400E}
.chk .n{flex:1;min-width:0}.chk small{color:var(--muted);font-size:10px}
.note{margin-top:13px;padding-top:12px;color:var(--muted);border-top:1px dashed var(--line);font-size:11px;line-height:1.7}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.col{display:flex;flex-direction:column;gap:9px;padding:10px;background:#D1FAE5;border:2px solid #064E3B;border-radius:0}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 3px 5px;font-size:12px;font-weight:800}
.col-h .cnt{padding:1px 7px;color:#064E3B;background:#fff;border:1px solid #064E3B;border-radius:0;font-family:"Fira Code",monospace;font-size:10px}
.pcard{padding:10px 11px;background:#fff;border:1px solid #064E3B;border-left:6px solid var(--accent);border-radius:0;box-shadow:3px 3px 0 #A7F3D0}
.pcard b{font-size:12px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--muted);font-size:10px}
.pcard .who{margin-top:8px;color:var(--ink);font-size:10px}

.lane{display:flex;flex-direction:column;gap:10px}
.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:11px 13px;background:#fff;border:2px solid #064E3B;border-radius:0}
.lane-row .num{display:flex;width:32px;height:32px;flex:none;align-items:center;justify-content:center;color:#000;background:#34D399;border:2px solid #064E3B;border-radius:0;font-family:"Fira Code",monospace;font-weight:800}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:13px}
.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:11px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{z-index:1;display:flex;width:22px;height:22px;align-items:center;justify-content:center;color:#475569;background:#fff;border:2px solid #94A3B8;border-radius:0;font-family:"Fira Code",monospace;font-size:10px}
.steps .ln{width:20px;height:3px;background:#CBD5E1}
.steps .s.done{color:#000;background:#34D399;border-color:#064E3B}
.steps .s.cur{color:#064E3B;border:3px double #059669;animation:pulse 1.6s infinite}
.steps .ln.done{background:#059669}

.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:11px 4px;border-bottom:1px dashed var(--line)}
.rep-row:last-child{border-bottom:0}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:12px}.rep-row .sku span{color:var(--muted);font-size:10px}
.gauge{width:110px;flex:none}.gauge .track{position:relative;height:9px;overflow:hidden;background:var(--track);border:1px solid #94A3B8;border-radius:0}
.gauge .track i{display:block;height:100%;background:var(--accent);border-radius:0}.gauge small{display:block;margin-top:3px;color:var(--muted);font-family:"Fira Code",monospace;font-size:9px;text-align:right}
.band{position:relative;height:26px;min-width:150px;background:var(--track);border:1px solid #94A3B8;border-radius:0}
.band .rng{position:absolute;top:0;bottom:0;background:#A7F3D0;border-radius:0}.band .mid{position:absolute;top:-3px;bottom:-3px;width:3px;background:#475569}.band .me{position:absolute;top:3px;width:12px;height:20px;background:#059669;border:1px solid #064E3B;border-radius:0;box-shadow:none}

.apexcharts-text,.apexcharts-legend-text{font-family:"Fira Sans",sans-serif!important}
.apexcharts-tooltip,.apexcharts-xaxistooltip{border:2px solid #064E3B!important;border-radius:0!important;box-shadow:4px 4px 0 #A7F3D0!important}
.apexcharts-tooltip-title{background:#D1FAE5!important;border-bottom:1px solid #064E3B!important}

#screen>.grid{animation:grid-in .4s cubic-bezier(.2,.85,.3,1.25) both}
#screen>.grid:nth-child(2){animation-delay:.06s}
#screen>.grid:nth-child(3){animation-delay:.12s}
@keyframes grid-in{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}

@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand{flex-basis:230px}
  .nav button{padding:0 14px}
}
@media(max-width:900px){
  .sidebar{position:static;height:auto;flex-wrap:wrap}
  .brand{width:100%;flex-basis:100%;border-right:0;border-bottom:3px solid #000}
  .nav{width:100%;flex-basis:100%}
  .nav button{min-height:52px;flex:1;justify-content:center}
  .main{padding:20px 16px 48px}
  .topbar{align-items:flex-start}
}
@media(max-width:820px){
  .g2,.g3,.g23,.g32{grid-template-columns:1fr}
  .topbar{flex-direction:column}
  .top-right{justify-content:flex-start}
}
@media(max-width:560px){
  body{font-size:13px;background-size:24px 24px}
  .main{padding:14px 10px 38px}
  .g4{grid-template-columns:1fr 1fr;gap:9px}
  .board{grid-template-columns:1fr}
  .nav button{min-width:52px;padding:0 13px}
  .nav button .txt,.nav button .idx{display:none}
  .topbar{padding:15px;box-shadow:5px 5px 0 var(--color-secondary)}
  .topbar h1{font-size:20px}
  .topbar .sub{font-size:12px}
  .chip{min-height:34px;padding:5px 8px;font-size:10px}
  .card,.sec{padding:13px}
  .card.pad0>.card-h{padding:13px 13px 0!important}
  .tile{padding:18px 12px 12px}
  .tile .tv,.kpi .val,.stat .val{font-size:21px}
  .tile p{font-size:11px}
  th,td{padding:9px 10px}
}
@media(max-width:390px){
  .g4{grid-template-columns:1fr}
  .brand{padding:9px 12px}
  .brand-logo{width:40px;height:40px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  #screen>.grid{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">travel_explore</span></div>
      <div class="brand-txt"><b>環評追蹤台</b><span>EIA & PERMIT</span></div>
    </div>
    <nav class="nav" id="nav"></nav>

function buildNav(){var n=document.getElementById("nav");

function show(i){killCharts();var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
