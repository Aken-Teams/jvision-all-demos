<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>產線狀態看板管理系統</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#fff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000;
  --color-accent:#ea580c;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#1e293b;
  --color-card:#fff;
  --color-card-foreground:#1e293b;
  --color-muted:#e9eff8;
  --color-muted-foreground:#475569;
  --color-border:#e2e8f0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#1e293b;
  --muted:#475569;
  --line:#e2e8f0;
  --green:#15803d;
  --amber:#a16207;
  --red:#dc2626;
  --dim:#64748b;
  --panel:#fff;
  --panel2:#f1f5f9;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.055);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Fira Sans",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit}
button,[role=button]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;font-size:20px;line-height:1;vertical-align:middle}
.skip{position:fixed;left:16px;top:-60px;z-index:100;background:var(--ink);color:#fff;padding:10px 14px;text-decoration:none}
.skip:focus{top:12px}
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);box-shadow:0 1px 8px rgba(15,23,42,.06);backdrop-filter:blur(12px)}
.topbar-inner{max-width:1440px;margin:auto;padding:12px 24px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:12px;min-width:286px}
.logo{width:42px;height:42px;display:grid;place-items:center;flex:none;background:var(--blue);color:#fff;border-radius:6px;box-shadow:4px 4px 0 #bfdbfe}
.brand h1{margin:0;font-size:16px;line-height:1.2;letter-spacing:.02em}
.brand p{margin:3px 0 0;color:var(--muted);font-size:11px}
.nav{margin-left:auto;display:flex;align-items:center;gap:4px}
.nav button{display:flex;align-items:center;gap:6px;min-height:42px;padding:9px 11px;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap;transition:background .2s,color .2s,border-color .2s,transform .2s}
.nav button:hover{background:var(--color-muted);border-color:#cbd5e1;color:var(--blue)}
.nav button:active{transform:translateY(1px)}
.nav button.active{background:var(--blue);border-color:var(--blue);color:#fff}
main{max-width:1440px;margin:auto;padding:28px 24px 64px}
.screen-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:0 0 20px;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.screen-head h2{display:flex;align-items:center;gap:10px;margin:0;font-size:clamp(22px,2vw,30px);line-height:1.2;letter-spacing:-.025em}
.screen-head h2 .material-symbols-outlined{color:var(--blue);font-size:28px}
.screen-head p{margin:6px 0 0;color:var(--muted);font-size:13px}
.tag,.pill{display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.tag{padding:7px 11px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--muted);font-size:11px}
.live{color:#166534;border-color:#bbf7d0;background:#f0fdf4}
.dot{width:8px;height:8px;display:inline-block;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px #dcfce7}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gk{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.gk2{grid-template-columns:minmax(300px,1fr) minmax(0,1.4fr)}
.card,.kpi,.stn{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow)}
.card{padding:18px;min-width:0}
.card h3{display:flex;align-items:center;gap:8px;margin:0 0 15px;font-size:14px}
.card h3 .material-symbols-outlined{color:var(--blue)}
.card h3 .sub{margin-left:auto;color:var(--muted);font-size:10px;font-weight:500}
.kpi{position:relative;min-width:0;padding:17px;border-top:3px solid var(--blue);transition:transform .22s,box-shadow .22s,border-color .22s}
.kpi:hover,.stn:hover,.card:hover{box-shadow:0 3px 5px rgba(15,23,42,.06),0 14px 30px rgba(15,23,42,.08)}
.kpi:hover{transform:translateY(-2px)}
.kpi .ic{width:36px;height:36px;display:grid;place-items:center;margin-bottom:13px;border-radius:4px}
.kpi .lab{color:var(--muted);font-size:12px;font-weight:600}
.kpi .val{margin-top:4px;font-family:"Fira Code",monospace;font-size:26px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.kpi .val small{margin-left:4px;color:var(--muted);font:600 12px "Fira Sans"}
.kpi .delta{display:inline-flex;align-items:center;gap:3px;margin-top:6px;font-size:11px;font-weight:600}
.kpi .delta .material-symbols-outlined{font-size:15px}
.up{color:#166534}.down{color:var(--red)}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stn{position:relative;padding:15px;border-left-width:4px;transition:transform .2s,box-shadow .2s}
.stn:hover{transform:translateY(-2px)}
.stn.run{border-left-color:var(--green)}
.stn.warn{border-left-color:var(--amber)}
.stn.stop{border-left-color:var(--red)}
.stn.idle{border-left-color:var(--dim)}
.stn .top,.row{display:flex;align-items:center;gap:8px}
.stn .top{justify-content:space-between}
.stn .code,.mono{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.stn .code{font-size:13px;font-weight:700}
.stn .nm{color:var(--muted);font-size:11px}
.lamp{width:11px;height:11px;border-radius:50%;flex:none;border:2px solid currentColor;background:currentColor}
.lamp.g{color:var(--green);box-shadow:0 0 0 3px #dcfce7}
.lamp.a{color:var(--amber);box-shadow:0 0 0 3px #fef3c7}
.lamp.r{color:var(--red);box-shadow:0 0 0 3px #fee2e2}
.lamp.d{color:var(--dim);box-shadow:0 0 0 3px #e2e8f0}
.stn .metric{display:flex;justify-content:space-between;margin-top:13px;color:var(--muted);font-size:11px}
.stn .metric b{color:var(--ink);font:700 16px "Fira Code";font-variant-numeric:tabular-nums}
.bar{height:6px;margin-top:9px;overflow:hidden;border-radius:2px;background:#e2e8f0}
.bar>i{display:block;height:100%}
.pill{padding:3px 8px;border:1px solid currentColor;border-radius:999px;font-size:10px}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.pill.g{color:#166534;background:#f0fdf4}
.pill.a{color:#854d0e;background:#fffbeb}
.pill.r{color:#991b1b;background:#fef2f2}
.pill.b{color:#1e40af;background:#eff6ff}
.pill.n{color:#475569;background:#f8fafc}
.chart-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:11px 12px;border-bottom:2px solid #cbd5e1;background:#f8fafc;color:#334155;text-align:left;font-size:10px;font-weight:700;letter-spacing:.05em;white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr{transition:background .18s}
tbody tr:hover{background:#f1f5f9}
tbody tr:last-child td{border-bottom:0}
td:nth-child(n+4){font-variant-numeric:tabular-nums}
.legend{display:flex;align-items:center;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:11px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border:1px solid rgba(15,23,42,.15);border-radius:2px}
.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:7px;top:5px;bottom:8px;width:2px;background:#cbd5e1}
.tl .ev{position:relative;padding-bottom:18px}
.tl .ev::before{content:"";position:absolute;left:-22px;top:4px;width:12px;height:12px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #cbd5e1}
.tl .ev.r::before{background:var(--red)}
.tl .ev.a::before{background:var(--amber)}
.tl .ev.g::before{background:var(--green)}
.tl .ev.b::before{background:var(--blue)}
.tl .t{color:var(--muted);font-size:10px;font-weight:600}
.tl .h{margin:2px 0;font-size:13px;font-weight:700}
.tl .d,.mini{color:var(--muted);font-size:11px}
.divider{height:1px;margin:12px 0;background:var(--line)}
.tabs{display:flex;gap:7px;margin-bottom:10px;overflow-x:auto;padding:2px}
.tabs .t{flex:none;padding:6px 12px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--muted);font-size:11px;font-weight:600}
.tabs .t.on{border-color:var(--blue);background:#eff6ff;color:#1d4ed8}
.stat-line{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}
.stat-line:last-child{border-bottom:0}
.avatar{width:29px;height:29px;display:grid;place-items:center;flex:none;border:1px solid #bfdbfe;border-radius:4px;background:#eff6ff;color:#1d4ed8;font-weight:700}
.matrix{min-width:720px;border-collapse:separate;border-spacing:7px}
.matrix td{padding:0;border:0;white-space:normal}
.mxh{padding:5px!important;color:var(--muted);font-size:10px;font-weight:700;text-align:center}
.cell{height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid transparent;border-radius:4px;color:#fff;font:700 13px "Fira Code";box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.cell small{font:500 9px "Fira Sans"}
.cell.g{background:#15803d;border-color:#166534}
.cell.a{background:#a16207;border-color:#854d0e}
.cell.r{background:#dc2626;border-color:#991b1b}
.cell.d{background:#475569;border-color:#334155}
.foot{margin-top:28px;padding-top:17px;border-top:1px solid var(--line);color:var(--muted);font-size:10px;text-align:center}
.grid>*{animation:enter .4s cubic-bezier(.2,.8,.2,1) both}
.grid>*:nth-child(2){animation-delay:.06s}.grid>*:nth-child(3){animation-delay:.12s}
.grid>*:nth-child(4){animation-delay:.18s}.grid>*:nth-child(5){animation-delay:.24s}
.grid>*:nth-child(6){animation-delay:.3s}.grid>*:nth-child(7){animation-delay:.36s}
.grid>*:nth-child(8){animation-delay:.42s}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@media(max-width:1100px){
  .topbar-inner{align-items:flex-start;flex-direction:column;gap:10px}
  .nav{width:100%;margin:0;overflow-x:auto;padding-bottom:2px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:768px){
  main{padding:20px 16px 52px}
  .topbar-inner{padding:10px 16px}
  .brand{min-width:0}
  .screen-head{align-items:flex-start;flex-direction:column}
  .g2,.gk,.gk2{grid-template-columns:1fr}
  .card{padding:15px}
}
@media(max-width:480px){
  .g4,.board{grid-template-columns:1fr}
  .nav button{padding:9px 10px}
  .nav .txt{display:none}
  .brand h1{font-size:14px}
  .screen-head h2{font-size:21px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<a class="skip" href="#app">跳至主要內容</a>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo" aria-hidden="true"><span class="material-symbols-outlined">precision_manufacturing</span></div>
      <div><h1>產線狀態看板管理系統</h1><p>Production Operations · MES 製造執行</p></div>
    </div>
    <nav class="nav" id="nav" aria-label="系統畫面">
      <button type="button" data-i="0" class="active"><span class="material-symbols-outlined" aria-hidden="true">dashboard</span><span class="txt">狀態看板</span></button>
      <button type="button" data-i="1"><span class="material-symbols-outlined" aria-hidden="true">traffic</span><span class="txt">Andon 燈號</span></button>
      <button type="button" data-i="2"><span class="material-symbols-outlined" aria-hidden="true">notification_important</span><span class="txt">異常中心</span></button>
      <button type="button" data-i="3"><span class="material-symbols-outlined" aria-hidden="true">handyman</span><span class="txt">現場處置</span></button>
      <button type="button" data-i="4"><span class="material-symbols-outlined" aria-hidden="true">grid_view</span><span class="txt">站點總覽牆</span></button>
      <button type="button" data-i="5"><span class="material-symbols-outlined" aria-hidden="true">insights</span><span class="txt">歸檔分析</span></button>
    </nav>
  </div>
</header>
<main id="app" tabindex="-1"></main>
<script>
"use strict";
var charts=[];
function clearCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy()}catch(e){}}charts=[]}
function el(id){return document.getElementById(id)}
function mk(id,opt){
  var node=el(id);if(!node)return;
  opt.chart=opt.chart||{};
  opt.chart.redrawOnParentResize=false;
  opt.chart.redrawOnWindowResize=false;
  opt.chart.animations={enabled:false};
  opt.chart.toolbar={show:false};
  opt.chart.fontFamily="Fira Sans,sans-serif";
  opt.theme={mode:"light"};
  var c=new ApexCharts(node,opt);c.render();charts.push(c)
}
function head(icon,title,desc,tag){
  return '<div class="screen-head"><div><h2><span class="material-symbols-outlined">'+icon+'</span>'+title+'</h2><p>'+desc+'</p></div>'+tag+'</div>'
}
function kpis(items){
  var h='<div class="grid g4" style="margin-bottom:14px">';
  for(var i=0;i<items.length;i++){
    var x=items[i];
    h+='<div class="kpi"><div class="ic" style="background:'+x[3]+'18;color:'+x[3]+'"><span class="material-symbols-outlined">'+x[2]+'</span></div><div class="lab">'+x[0]+'</div><div class="val">'+x[1]+'</div>'+(x[4]?'<div class="delta up">'+x[4]+'</div>':'')+'</div>'
  }
  return h+'</div>'
}
function s0(){
  var stns=[
    ["L1-01","CNC 一線","run","g",94,1240,1300,"38s","g","運轉中"],
    ["L1-02","CNC 二線","warn","a",71,880,1200,"52s","a","效率偏低"],
    ["L2-03","沖壓 A 站","run","g",89,2100,2200,"12s","g","運轉中"],
    ["L2-04","沖壓 B 站","stop","r",0,640,2200,"—","r","停線 · 缺料"],
    ["L3-05","焊接站","run","g",86,540,600,"66s","g","運轉中"],
    ["L3-06","組裝線","warn","a",78,990,1150,"44s","a","待料提醒"],
    ["L4-07","檢測站","run","g",97,1180,1200,"9s","b","品檢中"],
    ["L4-08","包裝入庫","idle","d",0,0,800,"—","n","換線待機"]
  ],col={run:"var(--green)",warn:"var(--amber)",stop:"var(--red)",idle:"var(--dim)"};
  var h=head("dashboard","產線狀態即時看板","C 廠 · 4 條產線 8 個站點 · 現場數據採集彙整",'<span class="tag live"><span class="dot"></span>LIVE · 更新於 14:32:07</span>');
  h+=kpis([["運轉站點","6 / 8","group_work","var(--green)","↑ +1 較昨"],["整廠 OEE","82.4%","speed","var(--color-accent)","↑ +3.1%"],["紅燈站點","1","warning","var(--red)","警示：缺料停線"],["今日產出","7,570","inventory_2","var(--blue)","達成 79%"]]);
  h+='<section class="card"><h3><span class="material-symbols-outlined">view_comfy</span>站點狀態卡片<span class="sub">紅＝停線 · 黃＝異常提示 · 綠＝正常運轉</span></h3><div class="board">';
  for(var i=0;i<stns.length;i++){
    var s=stns[i],pct=Math.round(s[5]/s[6]*100);
    h+='<article class="stn '+s[2]+'"><div class="top"><div><div class="code">'+s[0]+'</div><div class="nm">'+s[1]+'</div></div><span class="lamp '+s[3]+'" aria-hidden="true"></span></div><div class="metric"><span>OEE<br><b>'+s[4]+'%</b></span><span style="text-align:right">節拍<br><b>'+s[7]+'</b></span></div><div class="bar"><i style="width:'+pct+'%;background:'+col[s[2]]+'"></i></div><div class="row" style="justify-content:space-between;margin-top:9px"><span class="mini mono">'+s[5].toLocaleString()+' / '+s[6].toLocaleString()+'</span><span class="pill '+s[8]+'">'+s[9]+'</span></div></article>'
  }
  h+='</div></section><div class="grid gk" style="margin-top:14px"><section class="card"><h3><span class="material-symbols-outlined">show_chart</span>整廠產出趨勢（每小時）</h3><div id="c0a"></div></section><section class="card"><h3><span class="material-symbols-outlined">donut_large</span>站點狀態分布</h3><div id="c0b"></div></section></div>';
  render(h);
  mk("c0a",{chart:{type:"area",height:250},series:[{name:"實際產出",data:[420,610,720,690,540,780,810,760]},{name:"目標",data:[600,600,700,700,600,800,800,800]}],colors:["#2563eb","#64748b"],stroke:{curve:"straight",width:[3,2],dashArray:[0,5]},fill:{type:"gradient",gradient:{opacityFrom:.22,opacityTo:.02}},dataLabels:{enabled:false},grid:{borderColor:"#e2e8f0"},xaxis:{categories:["08","09","10","11","12","13","14","15"]},legend:{position:"top"},tooltip:{theme:"light"}});
  mk("c0b",{chart:{type:"donut",height:250},series:[6,2,1,1],labels:["運轉","效率偏低","停線","待機"],colors:["#15803d","#a16207","#dc2626","#64748b"],dataLabels:{enabled:false},legend:{position:"bottom"},plotOptions:{pie:{donut:{size:"66%",labels:{show:true,total:{show:true,label:"總站點",formatter:function(){return"8"}}}}}},tooltip:{theme:"light"}})
}
function s1(){
  var calls=[
    ["14:31:52","L2-04","沖壓 B 站","物料缺料","r","陳建宏"],
    ["14:28:10","L1-02","CNC 二線","品質待確認","a","林佩珊"],
    ["14:19:33","L3-06","組裝線","待料提醒","a","王志明"],
    ["14:05:41","L1-01","CNC 一線","換模完成","g","系統"],
    ["13:58:22","L4-07","檢測站","設備警示","a","張淑芬"]
  ],lm={r:["r","紅燈 · 停線"],a:["a","黃燈 · 提示"],g:["g","綠燈 · 恢復"]};
  var h=head("traffic","Andon 燈號即時監控","燈號觸發、現場呼叫與燈號歷程 · 狀態視覺化呈現",'<span class="tag live"><span class="dot"></span>燈號同步中</span>');
