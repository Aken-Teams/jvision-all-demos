<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>目視化管理系統 Visual Management System</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#dc2626; --accent2:#f97316;
  --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
  --txt:#e8eaef; --muted:#9aa2b1; --dim:#6b7382;
  --green:#22c55e; --amber:#f59e0b; --red:#ef4444; --blue:#38bdf8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;line-height:1.5}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;vertical-align:middle;line-height:1}
.topbar{position:sticky;top:0;z-index:40;background:linear-gradient(90deg,#181b22,#12141a);border-bottom:1px solid var(--line);box-shadow:0 2px 12px rgba(0,0,0,.4)}
.topbar-inner{max-width:1360px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.brand .logo .material-symbols-outlined{font-size:22px}
.brand h1{font-size:15px;font-weight:800;letter-spacing:.3px}
.brand p{font-size:11px;color:var(--muted);font-weight:500}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.nav button{flex:none;white-space:nowrap;display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);padding:8px 12px;border-radius:9px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s;min-width:0}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{border-color:var(--accent);color:var(--txt)}
.nav button.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
main{max-width:1360px;margin:0 auto;padding:18px 16px 60px}
.screen-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.screen-head h2{font-size:20px;font-weight:800;display:flex;align-items:center;gap:9px}
.screen-head h2 .material-symbols-outlined{font-size:24px;color:var(--accent2)}
.screen-head p{font-size:12.5px;color:var(--muted);margin-top:3px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;font-size:11.5px;font-weight:700;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.live{color:var(--green)}.live .dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.gk{grid-template-columns:2fr 1fr}
.gk2{grid-template-columns:1fr 1.4fr}
@media(max-width:820px){.g2,.g3,.g4,.gk,.gk2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h3{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:12px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent2)}
.card h3 .sub{margin-left:auto;font-size:11px;color:var(--dim);font-weight:500}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0;position:relative;overflow:hidden}
.kpi .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.kpi .ic .material-symbols-outlined{font-size:21px}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:600}
.kpi .val{font-size:26px;font-weight:800;margin-top:2px;font-family:"Inter"}
.kpi .val small{font-size:13px;color:var(--muted);font-weight:600;margin-left:3px}
.kpi .delta{font-size:11.5px;font-weight:700;margin-top:5px;display:inline-flex;align-items:center;gap:3px}
.kpi .delta .material-symbols-outlined{font-size:15px}
.up{color:var(--green)}.down{color:var(--red)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:820px){.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.board{grid-template-columns:1fr}}
.stn{border-radius:13px;padding:14px;border:1px solid var(--line);background:var(--panel);position:relative;min-width:0}
.stn.run{border-left:4px solid var(--green)}
.stn.warn{border-left:4px solid var(--amber)}
.stn.stop{border-left:4px solid var(--red)}
.stn.idle{border-left:4px solid var(--dim)}
.stn .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stn .code{font-size:13px;font-weight:800}
.stn .nm{font-size:11.5px;color:var(--muted)}
.lamp{width:12px;height:12px;border-radius:50%;flex:none}
.lamp.g{background:var(--green);box-shadow:0 0 0 4px rgba(34,197,94,.18)}
.lamp.a{background:var(--amber);box-shadow:0 0 0 4px rgba(245,158,11,.18)}
.lamp.r{background:var(--red);box-shadow:0 0 0 4px rgba(239,68,68,.18)}
.lamp.d{background:var(--dim)}
.stn .metric{display:flex;justify-content:space-between;margin-top:12px;font-size:11.5px}
.stn .metric b{font-size:16px;font-weight:800;color:var(--txt)}
.stn .metric span{color:var(--muted)}
.bar{height:6px;border-radius:4px;background:var(--panel2);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:4px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px}
.pill.g{background:rgba(34,197,94,.14);color:#6ee7a0}
.pill.a{background:rgba(245,158,11,.14);color:#fcd34d}
.pill.r{background:rgba(239,68,68,.14);color:#fca5a5}
.pill.b{background:rgba(56,189,248,.14);color:#7dd3fc}
.pill.n{background:var(--panel2);color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--dim);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid #212530;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--panel2)}
.mono{font-family:"Inter";font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:0 0 16px 0}
.tl .ev::before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg)}
.tl .ev.r::before{background:var(--red)}.tl .ev.a::before{background:var(--amber)}.tl .ev.g::before{background:var(--green)}.tl .ev.b::before{background:var(--blue)}
.tl .ev .t{font-size:11px;color:var(--dim);font-weight:600}
.tl .ev .h{font-size:13px;font-weight:700;margin:1px 0}
.tl .ev .d{font-size:11.5px;color:var(--muted)}
.mini{font-size:11px;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.divider{height:1px;background:var(--line);margin:12px 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tabs .t{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.tabs .t.on{background:rgba(220,38,38,.16);color:#fca5a5;border-color:rgba(220,38,38,.4)}
.stat-line{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #212530;font-size:12.5px}
.stat-line:last-child{border:none}
.avatar{width:28px;height:28px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none;color:var(--accent2)}
.foot{margin-top:22px;text-align:center;font-size:11px;color:var(--dim);border-top:1px solid var(--line);padding-top:16px}
@media(max-width:560px){.nav button .txt{display:none}.nav button{padding:8px 10px}}
.chart-scroll{overflow-x:auto}
.matrix{width:100%;border-collapse:separate;border-spacing:5px}
.matrix td{padding:0;border:none;white-space:normal}
.cell{height:56px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800}
.cell small{font-size:9px;opacity:.85;font-weight:500}
.cell.g{background:linear-gradient(135deg,#16a34a,#15803d)}
.cell.a{background:linear-gradient(135deg,#f59e0b,#d97706)}
.cell.r{background:linear-gradient(135deg,#ef4444,#b91c1c)}
.cell.d{background:linear-gradient(135deg,#334155,#1e293b);color:#94a3b8}
.mxh{font-size:10.5px;color:var(--dim);font-weight:700;text-align:center;padding:4px 0}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">visibility</span></div>
      <div>
        <h1>目視化管理系統</h1>
        <p>Visual Management System · MES 製造執行</p>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button data-i="0" class="active"><span class="material-symbols-outlined">dashboard</span><span class="txt">狀態看板</span></button>
      <button data-i="1"><span class="material-symbols-outlined">traffic</span><span class="txt">Andon 燈號</span></button>
      <button data-i="2"><span class="material-symbols-outlined">notification_important</span><span class="txt">異常中心</span></button>
      <button data-i="3"><span class="material-symbols-outlined">handyman</span><span class="txt">現場處置</span></button>
      <button data-i="4"><span class="material-symbols-outlined">grid_view</span><span class="txt">站點總覽牆</span></button>
      <button data-i="5"><span class="material-symbols-outlined">insights</span><span class="txt">歸檔分析</span></button>
    </nav>
  </div>
</div>
<main id="app"></main>
<script>
"use strict";
var charts=[];
function clearCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function el(id){return document.getElementById(id);}
function mk(id,opt){var node=el(id);if(!node)return;opt.chart=opt.chart||{};opt.chart.redrawOnParentResize=false;opt.chart.redrawOnWindowResize=false;opt.chart.animations={enabled:false};opt.chart.toolbar={show:false};opt.chart.fontFamily="Inter,Noto Sans TC,sans-serif";var c=new ApexCharts(node,opt);c.render();charts.push(c);}

/* SCREEN 0: Station status board */
function s0(){
  var stns=[
    {c:"L1-01",n:"CNC 一線",st:"run",lamp:"g",oee:94,out:1240,tgt:1300,cyc:"38s",tk:"g",tl:"運轉中"},
    {c:"L1-02",n:"CNC 二線",st:"warn",lamp:"a",oee:71,out:880,tgt:1200,cyc:"52s",tk:"a",tl:"效率偏低"},
    {c:"L2-03",n:"沖壓 A 站",st:"run",lamp:"g",oee:89,out:2100,tgt:2200,cyc:"12s",tk:"g",tl:"運轉中"},
    {c:"L2-04",n:"沖壓 B 站",st:"stop",lamp:"r",oee:0,out:640,tgt:2200,cyc:"—",tk:"r",tl:"停線 · 缺料"},
    {c:"L3-05",n:"焊接站",st:"run",lamp:"g",oee:86,out:540,tgt:600,cyc:"66s",tk:"g",tl:"運轉中"},
    {c:"L3-06",n:"組裝線",st:"warn",lamp:"a",oee:78,out:990,tgt:1150,cyc:"44s",tk:"a",tl:"待料提醒"},
    {c:"L4-07",n:"檢測站",st:"run",lamp:"g",oee:97,out:1180,tgt:1200,cyc:"9s",tk:"b",tl:"品檢中"},
    {c:"L4-08",n:"包裝入庫",st:"idle",lamp:"d",oee:0,out:0,tgt:800,cyc:"—",tk:"n",tl:"換線待機"}
  ];
  var colr={run:"var(--green)",warn:"var(--amber)",stop:"var(--red)",idle:"var(--dim)"};
  var html='<div class="screen-head"><div><h2><span class="material-symbols-outlined">dashboard</span>產線狀態即時看板</h2><p>C 廠 · 4 條產線 8 個站點 · 現場數據採集彙整</p></div><span class="tag live"><span class="dot"></span>LIVE · 更新於 14:32:07</span></div>';
  html+='<div class="grid g4" style="margin-bottom:14px">';
  var kp=[["運轉站點","6 / 8","group_work","var(--green)","+1 較昨"],["整廠 OEE","82.4%","speed","var(--accent2)","+3.1%"],["紅燈站點","1","warning","var(--red)","缺料停線"],["今日產出","7,570","inventory_2","var(--blue)","達成 79%"]];
  for(var i=0;i<kp.length;i++){html+='<div class="kpi"><div class="ic" style="background:'+kp[i][3]+'22;color:'+kp[i][3]+'"><span class="material-symbols-outlined">'+kp[i][2]+'</span></div><div class="lab">'+kp[i][0]+'</div><div class="val">'+kp[i][1]+'</div><div class="delta up"><span class="material-symbols-outlined">trending_up</span>'+kp[i][4]+'</div></div>';}
  html+='</div>';
  html+='<div class="card"><h3><span class="material-symbols-outlined">view_comfy</span>站點狀態卡片<span class="sub">紅=停線 · 黃=異常提示 · 綠=正常運轉</span></h3><div class="board">';
  for(var j=0;j<stns.length;j++){var s=stns[j];var pct=Math.round(s.out/s.tgt*100);
    html+='<div class="stn '+s.st+'"><div class="top"><div><div class="code">'+s.c+'</div><div class="nm">'+s.n+'</div></div><div class="lamp '+s.lamp+'"></div></div>'+
    '<div class="metric"><span>OEE<br><b>'+s.oee+'%</b></span><span style="text-align:right">節拍<br><b>'+s.cyc+'</b></span></div>'+
    '<div class="bar"><i style="width:'+pct+'%;background:'+colr[s.st]+'"></i></div>'+
    '<div class="row" style="justify-content:space-between;margin-top:8px"><span class="mini">'+s.out+' / '+s.tgt+'</span><span class="pill '+s.tk+'">'+s.tl+'</span></div></div>';}
  html+='</div></div>';
  html+='<div class="grid gk" style="margin-top:14px"><div class="card"><h3><span class="material-symbols-outlined">show_chart</span>整廠產出趨勢（每小時）</h3><div id="c0a"></div></div>'+
  '<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>站點狀態分布</h3><div id="c0b"></div></div></div>';
  render(html);
  mk("c0a",{chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"area",height:250},series:[{name:"實際產出",data:[420,610,720,690,540,780,810,760]},{name:"目標",data:[600,600,700,700,600,800,800,800]}],colors:["#dc2626","#475569"],stroke:{curve:"smooth",width:[3,2],dashArray:[0,5]},fill:{type:"gradient",gradient:{opacityFrom:.35,opacityTo:.02}},dataLabels:{enabled:false},grid:{borderColor:"#242833"},xaxis:{categories:["08","09","10","11","12","13","14","15"],labels:{style:{colors:"#8b93a3"}}},yaxis:{labels:{style:{colors:"#8b93a3"}}},legend:{labels:{colors:"#9aa2b1"}},tooltip:{theme:"dark"}});
  mk("c0b",{chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"donut",height:250},series:[6,2,1,1],labels:["運轉","效率偏低","停線","待機"],colors:["#22c55e","#f59e0b","#ef4444","#64748b"],dataLabels:{enabled:false},legend:{position:"bottom",labels:{colors:"#9aa2b1"}},plotOptions:{pie:{donut:{size:"62%",labels:{show:true,total:{show:true,label:"總站點",color:"#e8eaef",formatter:function(){return "8";}}}}}},tooltip:{theme:"dark"}});
}

/* SCREEN 1: Andon light monitoring */
function s1(){
  var calls=[
    {t:"14:31:52",s:"L2-04",n:"沖壓 B 站",ty:"物料缺料",lv:"r",by:"陳建宏"},
    {t:"14:28:10",s:"L1-02",n:"CNC 二線",ty:"品質待確認",lv:"a",by:"林佩珊"},
    {t:"14:19:33",s:"L3-06",n:"組裝線",ty:"待料提醒",lv:"a",by:"王志明"},
    {t:"14:05:41",s:"L1-01",n:"CNC 一線",ty:"換模完成",lv:"g",by:"系統"},
    {t:"13:58:22",s:"L4-07",n:"檢測站",ty:"設備警示",lv:"a",by:"張淑芬"}
  ];
  var lvmap={r:["r","紅燈 · 停線"],a:["a","黃燈 · 提示"],g:["g","綠燈 · 恢復"]};
  var html='<div class="screen-head"><div><h2><span class="material-symbols-outlined">traffic</span>Andon 燈號即時監控</h2><p>燈號觸發、現場呼叫與燈號歷程 · 狀態視覺化呈現</p></div><span class="tag live"><span class="dot"></span>燈號同步中</span></div>';
  html+='<div class="grid g4" style="margin-bottom:14px">';
  var lamps=[["綠燈站點","5","g","正常運轉","站"],["黃燈站點","3","a","需注意","站"],["紅燈站點","1","r","立即處理","站"],["平均亮燈時長","4.2","b","分鐘/次","分"]];
  for(var i=0;i<lamps.length;i++){var cc={g:"var(--green)",a:"var(--amber)",r:"var(--red)",b:"var(--blue)"}[lamps[i][2]];
    html+='<div class="kpi"><div class="row" style="justify-content:space-between"><div class="ic" style="background:'+cc+'22;color:'+cc+'"><span class="material-symbols-outlined">circle</span></div><div class="lamp '+lamps[i][2]+'" style="width:16px;height:16px"></div></div><div class="lab">'+lamps[i][0]+'</div><div class="val">'+lamps[i][1]+'<small>'+lamps[i][4]+'</small></div><div class="mini" style="margin-top:4px">'+lamps[i][3]+'</div></div>';}
  html+='</div>';
  html+='<div class="grid gk2"><div class="card"><h3><span class="material-symbols-outlined">stacked_bar_chart</span>各產線今日亮燈次數（依燈號）</h3><div id="c1a"></div></div>';
  html+='<div class="card"><h3><span class="material-symbols-outlined">notifications_active</span>即時呼叫佇列<span class="sub">最新在最上</span></h3>';
  for(var k=0;k<calls.length;k++){var c=calls[k];var lm=lvmap[c.lv];
    html+='<div class="stat-line"><div class="row"><span class="lamp '+c.lv+'"></span><div><div style="font-weight:700;font-size:12.5px">'+c.s+' · '+c.n+'</div><div class="mini">'+c.ty+' · '+c.by+'</div></div></div><div style="text-align:right"><span class="pill '+lm[0]+'">'+lm[1]+'</span><div class="mini mono" style="margin-top:3px">'+c.t+'</div></div></div>';}
  html+='</div></div>';
  html+='<div class="card" style="margin-top:14px"><h3><span class="material-symbols-outlined">timeline</span>近 8 小時燈號亮起時序</h3><div id="c1b"></div></div>';
