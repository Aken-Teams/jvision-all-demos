<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>工廠產線浪費改善管理｜Jvision 系統 Demo</title>
  <meta name="description" content="以價值流程、工時量測與七大浪費盤點驅動的精實改善工作台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --color-primary:#2563eb;
      --color-on-primary:#fff;
      --color-secondary:#3b82f6;
      --color-on-secondary:#000;
      --color-accent:#ea580c;
      --color-on-accent:#000;
      --color-background:#f8fafc;
      --color-foreground:#1e293b;
      --color-card:#fff;
      --color-card-foreground:#1e293b;
      --color-muted:#e9eff8;
      --color-muted-foreground:#475569;
      --color-border:#e2e8f0;
      --color-destructive:#dc2626;
      --color-on-destructive:#fff;
      --color-ring:#2563eb;
      --blue:#2563eb;
      --ink:#1e293b;
      --muted:#475569;
      --line:#e2e8f0;
      --ok:#15803d;
      --warn:#b45309;
      --danger:#dc2626;
      --info:#0369a1;
      --shadow:0 1px 2px rgba(15,23,42,.04),0 12px 30px rgba(15,23,42,.06);
      --shadow-hover:0 2px 4px rgba(15,23,42,.06),0 18px 42px rgba(37,99,235,.1);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      background:var(--color-background);
      color:var(--color-foreground);
      font:400 14px/1.55 "Fira Sans",system-ui,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    button{font:inherit}
    button,a,[role="button"],.lrow{cursor:pointer}
    button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
      outline:3px solid var(--color-ring);
      outline-offset:3px;
    }
    .material-symbols-outlined{
      display:inline-block;
      font-family:"Material Symbols Outlined";
      font-weight:normal;
      font-style:normal;
      line-height:1;
      letter-spacing:normal;
      text-transform:none;
      white-space:nowrap;
      direction:ltr;
    }
    .mono,.idx,.kv,.lv,.num,.stime,.cx,.cnt,td:nth-child(1){
      font-family:"Fira Code",monospace;
      font-variant-numeric:tabular-nums;
    }
    .app{display:flex;min-height:100vh}
    .side{
      position:sticky;
      top:0;
      z-index:20;
      display:flex;
      width:248px;
      height:100vh;
      flex:none;
      flex-direction:column;
      color:var(--ink);
      background:#fff;
      border-right:1px solid var(--line);
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      padding:22px 20px;
      border-bottom:1px solid var(--line);
    }
    .logo{
      display:grid;
      width:42px;
      height:42px;
      flex:none;
      place-items:center;
      color:#fff;
      background:var(--blue);
      border-radius:8px;
      box-shadow:5px 5px 0 #bfdbfe;
    }
    .logo .material-symbols-outlined{font-size:23px}
    .brand h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.01em}
    .brand p{
      margin:2px 0 0;
      color:var(--muted);
      font:600 10px/1.4 "Fira Code",monospace;
      letter-spacing:.09em;
    }
    nav{display:flex;flex-direction:column;gap:5px;padding:18px 12px}
    .nav-btn{
      display:flex;
      width:100%;
      min-width:0;
      align-items:center;
      gap:11px;
      padding:11px 12px;
      color:var(--muted);
      text-align:left;
      background:transparent;
      border:1px solid transparent;
      border-radius:7px;
      transition:color .2s ease,background .2s ease,border-color .2s ease,transform .2s ease;
    }
    .nav-btn:hover{
      color:var(--blue);
      background:#eff6ff;
      border-color:#bfdbfe;
      transform:translateX(2px);
    }
    .nav-btn.on{
      color:#fff;
      background:var(--blue);
      border-color:var(--blue);
      box-shadow:4px 4px 0 #bfdbfe;
    }
    .nav-btn .material-symbols-outlined{font-size:20px}
    .nav-btn .lbl{
      min-width:0;
      overflow:hidden;
      font-weight:600;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .nav-btn .idx{
      margin-left:auto;
      color:inherit;
      font-size:10px;
      opacity:.72;
    }
    .side .foot{
      margin-top:auto;
      padding:16px 18px 20px;
      color:var(--muted);
      font-size:11px;
      border-top:1px solid var(--line);
    }
    .side .foot b{color:var(--ink)}
    .main{display:flex;min-width:0;flex:1;flex-direction:column}
    .topbar{
      position:sticky;
      top:0;
      z-index:15;
      display:flex;
      align-items:center;
      gap:14px;
      min-height:82px;
      padding:14px 28px;
      background:rgba(248,250,252,.94);
      border-bottom:1px solid var(--line);
      backdrop-filter:blur(12px);
    }
    .topbar .tt{min-width:0}
    .topbar h2{
      display:flex;
      align-items:center;
      gap:9px;
      margin:0;
      color:var(--ink);
      font-size:19px;
      font-weight:700;
      letter-spacing:-.01em;
    }
    .topbar h2 .material-symbols-outlined{color:var(--blue)}
    .topbar p{margin:3px 0 0;color:var(--muted);font-size:12px}
    .topbar .sp{flex:1}
    .chip,.tag,.save-chip{
      display:inline-flex;
      align-items:center;
      gap:5px;
      white-space:nowrap;
      font-weight:700;
    }
    .chip{
      padding:6px 10px;
      color:#1d4ed8;
      background:#dbeafe;
      border:1px solid #bfdbfe;
      border-radius:5px;
      font-size:11px;
    }
    .chip.secondary{color:var(--muted);background:#fff;border-color:var(--line)}
    .chip .material-symbols-outlined,.tag .material-symbols-outlined{font-size:15px}
    .wrap{width:100%;max-width:1600px;margin:0 auto;padding:26px 28px 44px}
    #screen>*{animation:reveal .4s cubic-bezier(.2,.8,.2,1) both}
    .split{
      display:grid;
      grid-template-columns:340px minmax(0,1fr);
      gap:20px;
      align-items:start;
    }
    .pane,.card,.kpi{
      min-width:0;
      color:var(--color-card-foreground);
      background:var(--color-card);
      border:1px solid var(--line);
      border-radius:8px;
      box-shadow:var(--shadow);
    }
    .pane,.card{overflow:hidden}
    .card{margin-bottom:20px}
    .pane-h,.card-h{
      display:flex;
      align-items:center;
      gap:9px;
      min-height:52px;
      padding:13px 16px;
      border-bottom:1px solid var(--line);
    }
    .pane-h{border-top:3px solid var(--blue)}
    .pane-h .material-symbols-outlined,.card-h .material-symbols-outlined{color:var(--blue);font-size:19px}
    .pane-h b,.card-h b{font-size:13px;font-weight:700}
    .card-h .sub{color:var(--muted);font-size:11px}
    .cnt{
      margin-left:auto;
      padding:2px 7px;
      color:var(--muted);
      background:var(--color-muted);
      border-radius:4px;
      font-size:10px;
    }
    .pane-b{padding:10px}
    .card-b{padding:18px}
    .lrow{
      display:flex;
      min-width:0;
      align-items:flex-start;
      gap:10px;
      padding:11px 10px;
      border:1px solid transparent;
      border-radius:6px;
      transition:background .2s ease,border-color .2s ease,transform .2s ease;
    }
    .lrow:hover{background:#f8fafc;border-color:var(--line);transform:translateX(2px)}
    .lrow.on{background:#eff6ff;border-color:#93c5fd}
    .dot{width:8px;height:8px;flex:none;margin-top:6px;border-radius:2px}
    .lm{min-width:0;flex:1}
    .lt{overflow:hidden;font-size:12.5px;font-weight:700;text-overflow:ellipsis;white-space:nowrap}
    .ls{overflow:hidden;margin-top:2px;color:var(--muted);font-size:11px;text-overflow:ellipsis;white-space:nowrap}
    .lv{flex:none;font-size:11px;font-weight:700;text-align:right}
    .kpis{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:14px;
      margin-bottom:20px;
    }
    .kpi{
      position:relative;
      padding:16px;
      overflow:hidden;
      transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
    }
    .kpi:before{
      position:absolute;
      top:0;
      right:0;
      left:0;
      height:3px;
      background:var(--blue);
      content:"";
    }
    .kpi:hover{transform:translateY(-3px);border-color:#bfdbfe;box-shadow:var(--shadow-hover)}
    .kt{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;font-weight:600}
    .kt .material-symbols-outlined{color:var(--blue);font-size:17px}
    .kv{margin-top:8px;color:var(--ink);font-size:25px;font-weight:700;letter-spacing:-.05em}
    .kv small{margin-left:4px;color:var(--muted);font:600 11px "Fira Sans",sans-serif;letter-spacing:0}
    .kd{display:flex;align-items:center;gap:4px;margin-top:6px;color:var(--muted);font-size:10.5px;font-weight:600}
    .kd .material-symbols-outlined{font-size:14px}
    .up{color:var(--ok)}.down{color:var(--danger)}
    .grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:20px}
    .chart-box{position:relative;height:250px}
    table{width:100%;min-width:520px;border-collapse:collapse;font-size:12px}
    th,td{padding:10px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
    th{
      color:#334155;
      text-align:left;
      background:#f1f5f9;
      font-size:10.5px;
      font-weight:700;
      letter-spacing:.04em;
      text-transform:uppercase;
    }
    tbody tr{transition:background .18s ease}
    tbody tr:hover{background:#eff6ff}
    td.num{text-align:right;font-weight:600}
    td:nth-child(n+2){font-variant-numeric:tabular-nums}
    .tag{
      padding:3px 7px;
      border:1px solid currentColor;
      border-radius:4px;
      font-size:10px;
    }
    .t-ok{color:#166534;background:#dcfce7}
    .t-warn{color:#92400e;background:#fef3c7}
    .t-bad{color:#991b1b;background:#fee2e2}
    .t-info{color:#075985;background:#e0f2fe}
    .t-mut{color:#475569;background:#f1f5f9}
    .bar{height:7px;min-width:70px;overflow:hidden;background:#e2e8f0;border-radius:2px}
    .bar span{display:block;height:100%;background:var(--blue)}
    .vsm{display:flex;align-items:stretch;padding:8px 2px 14px;overflow-x:auto}
    .vstep{display:flex;min-width:151px;flex:none;align-items:center}
    .vbox{
      position:relative;
      width:150px;
      padding:13px;
      background:#fff;
      border:1px solid var(--line);
      border-top:3px solid var(--blue);
      border-radius:6px;
    }
    .vbox.bott{background:#fff7ed;border-color:#fdba74;border-top-color:var(--color-accent)}
    .vn{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
    .vn .material-symbols-outlined{color:var(--blue);font-size:17px}
    .vg{display:flex;justify-content:space-between;margin-top:10px;color:var(--muted);font-size:10px}
    .vg b{display:block;color:var(--ink);font:600 12px "Fira Code",monospace}
    .vwait{display:flex;align-items:center;gap:4px;margin-top:8px;color:var(--warn);font-size:10px;font-weight:700}
    .vwait.ok{color:var(--ok)}
    .vwait .material-symbols-outlined{font-size:14px}
    .varrow{padding:0 2px;color:var(--blue);font-size:21px}
    .vbadge{
      position:absolute;
      top:-11px;
      right:7px;
      padding:2px 6px;
      color:#fff;
      background:var(--danger);
      border-radius:3px;
      font-size:9px;
      font-weight:700;
    }
    .note{
      display:flex;
      align-items:flex-start;
      gap:7px;
      margin-top:12px;
      padding:11px 12px;
      color:#334155;
      background:#eff6ff;
      border-left:3px solid var(--blue);
      font-size:11px;
    }
    .note .material-symbols-outlined{flex:none;color:var(--blue);font-size:16px}
    .board{display:grid;grid-template-columns:repeat(4,minmax(175px,1fr));gap:12px}
    .col{min-width:0;padding:10px;background:#f8fafc;border:1px solid var(--line);border-radius:6px}
    .col-h{display:flex;align-items:center;gap:6px;padding:2px 3px 10px;font-size:11.5px;font-weight:700}
    .col-h .material-symbols-outlined{color:var(--blue);font-size:17px}
    .col-h .n{margin-left:auto;padding:1px 6px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:3px;font-size:10px}
    .wcard{margin-bottom:8px;padding:10px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:4px}
    .wcard:last-child{margin-bottom:0}
    .wcard.p-high{border-left-color:var(--danger)}
    .wcard.p-mid{border-left-color:#d97706}
    .wcard.p-low{border-left-color:var(--info)}
    .wt{font-size:12px;font-weight:700}
    .wm{display:flex;justify-content:space-between;gap:5px;margin-top:5px;color:var(--muted);font-size:10.5px}
    .tl{position:relative;padding-left:27px}
    .tl:before{position:absolute;top:4px;bottom:4px;left:9px;width:2px;background:var(--line);content:""}
    .tli{position:relative;padding-bottom:17px}
    .tli:last-child{padding-bottom:0}
    .tk{position:absolute;top:2px;left:-23px;width:17px;height:17px;background:#fff;border:3px solid var(--blue);border-radius:50%}
    .tli.done .tk{background:var(--blue)}
    .tli.late .tk{border-color:var(--danger)}
    .tli h4{margin:0;font-size:12.5px}
    .tli p{margin:3px 0 0;color:var(--muted);font-size:11px}
    .meta{display:flex;flex-wrap:wrap;gap:12px;margin-top:5px;color:var(--muted);font-size:10.5px}
    .cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-bottom:13px}
    .cb{min-width:0;padding:13px;text-align:center;border:1px solid var(--line);border-radius:6px}
    .cb.before{background:#f8fafc}
    .cb.after{background:#eff6ff;border-color:#93c5fd}
    .cl{color:var(--muted);font-size:10px;font-weight:700}
    .cx{margin-top:4px;font-size:25px;font-weight:700}
    .cu{color:var(--muted);font-size:11px}
    .ca{color:var(--blue)}
    .save-chip{padding:5px 9px;color:#fff;background:var(--blue);border-radius:4px;font-size:10.5px}
    .sop-doc{overflow:hidden;border:1px solid var(--line);border-radius:6px}
    .sop-step{display:flex;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}
    .sop-step:last-child{border-bottom:0}
    .sn{display:grid;width:27px;height:27px;flex:none;place-items:center;color:#fff;background:var(--blue);border-radius:4px;font:700 12px "Fira Code",monospace}
    .st{font-size:12.5px;font-weight:700}
    .sd{margin-top:3px;color:var(--muted);font-size:11px}
    .stime{margin-left:auto;color:#1d4ed8;font-size:11px;font-weight:700}
    .ver-row{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:5px;font-size:11.5px}
    .ver-row.cur{background:#eff6ff;border:1px solid #bfdbfe}
    .hide{display:none}
    @keyframes reveal{
      from{opacity:0;transform:translateY(12px) scale(.985)}
      to{opacity:1;transform:none}
    }
    @media(max-width:1100px){
      .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
      .board{grid-template-columns:repeat(2,minmax(175px,1fr))}
    }
    @media(max-width:880px){
      .app{display:block}
      .side{position:relative;width:100%;height:auto;border-right:0;border-bottom:1px solid var(--line)}
      .brand{padding:14px 16px}
      nav{display:grid;grid-template-columns:repeat(3,1fr);padding:10px 12px}
      .nav-btn{justify-content:center}
      .nav-btn .idx,.side .foot{display:none}
      .topbar{top:0;padding:13px 18px}
      .split,.grid2{grid-template-columns:1fr}
      .wrap{padding:20px 18px 38px}
    }
    @media(max-width:560px){
      nav{grid-template-columns:repeat(6,1fr);gap:4px}
      .nav-btn{padding:10px 7px}
      .nav-btn .lbl{display:none}
      .topbar{align-items:flex-start;flex-wrap:wrap}
      .topbar .sp{display:none}
      .topbar .tt{width:100%}
      .topbar h2{font-size:17px}
      .chip{font-size:10px}
      .wrap{padding:16px 12px 32px}
      .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
      .kpi{padding:13px}
      .kv{font-size:21px}
      .board{grid-template-columns:1fr}
      .cmp{grid-template-columns:1fr}
      .cmp .ca{transform:rotate(90deg)}
      .card-b{padding:13px}
    }
    @media(max-width:390px){
      .kpis{grid-template-columns:1fr}
    }
    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*:before,*:after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        scroll-behavior:auto!important;
        transition-duration:.01ms!important;
      }
      #screen>*{animation:none!important}
      .nav-btn:hover,.lrow:hover,.kpi:hover{transform:none}
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <div class="logo" aria-hidden="true"><span class="material-symbols-outlined">precision_manufacturing</span></div>
        <div>
          <h1>工廠產線浪費改善管理</h1>
          <p>PRODUCTION OPS</p>
        </div>
      </div>
      <nav id="nav" aria-label="主要功能"></nav>
      <div class="foot">
        產線 <b>SMT-A / 組裝-B</b><br />本週改善案 <b>18</b> 件 · 節省 <b>412</b> 分/日
      </div>
    </aside>
    <main class="main">
      <div class="topbar" id="topbar"></div>
      <div class="wrap"><div id="screen"></div></div>
    </main>
  </div>
  <script>
    var CHART=null;
    var CUR=0;
    var MODULES=[
      {icon:"linear_scale",name:"價值流程圖 VSM",sub:"繪製各站工時、庫存與流動，區分加值／非加值"},
      {icon:"timer",name:"工時量測",sub:"循環時間、換模與等待量測，計算標準工時"},
      {icon:"delete_sweep",name:"七大浪費盤點",sub:"看板標記浪費並依影響度排序"},
      {icon:"lightbulb",name:"改善提案 Kaizen",sub:"提案登記、指派負責人與驗證期限追蹤"},
      {icon:"compare_arrows",name:"改善前後驗證",sub:"比對改善前後工時與節省效益"},
      {icon:"menu_book",name:"標準作業 SOP",sub:"凍結最佳作法、版本控管與現場展開"}
    ];
    function esc(s){
      return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]});
    }
    function destroyChart(){
      if(CHART){try{CHART.destroy()}catch(e){}CHART=null}
    }
    function setScreen(title,sub,icon,chipTxt,chipIcon,bodyHtml){
      document.getElementById("topbar").innerHTML=
        '<div class="tt"><h2><span class="material-symbols-outlined" aria-hidden="true">'+icon+'</span>'+esc(title)+'</h2><p>'+esc(sub)+'</p></div>'+
        '<div class="sp"></div>'+
        '<span class="chip"><span class="material-symbols-outlined" aria-hidden="true">'+chipIcon+'</span>'+esc(chipTxt)+'</span>'+
        '<span class="chip secondary"><span class="material-symbols-outlined" aria-hidden="true">calendar_today</span><span class="mono">2026/08/13</span></span>';
      document.getElementById("screen").innerHTML=bodyHtml;
    }
    function paneList(title,icon,count,rows){
      var h='<div class="pane"><div class="pane-h"><span class="material-symbols-outlined" aria-hidden="true">'+icon+'</span><b>'+title+'</b><span class="cnt">'+count+'</span></div><div class="pane-b">';
      rows.forEach(function(r,i){
        h+='<div class="lrow'+(i===0?' on':'')+'" tabindex="0"><span class="dot" style="background:'+r.color+'" aria-hidden="true"></span><div class="lm"><div class="lt">'+esc(r.t)+'</div><div class="ls">'+esc(r.s)+'</div></div><div class="lv" style="color:'+(r.vc||'var(--ink)')+'">'+esc(r.v)+'</div></div>';
      });
      return h+'</div></div>';
    }
    function kpiCard(k){

          return '<tr><td>'+esc(it.id+" "+it.t)+'</td><td class="num">'+it.before+'</td><td class="num" style="color:#1d4ed8">'+it.after+'</td><td class="num">'+cut+'%</td><td><div class="bar" style="display:inline-block;width:70px;vertical-align:middle"><span style="width:'+it.rate+'%"></span></div> '+it.rate+'%</td><td>'+(it.ok?'<span class="tag t-ok"><span class="material-symbols-outlined">verified</span>通過</span>':'<span class="tag t-warn"><span class="material-symbols-outlined">pending</span>待補驗</span>')+'</td></tr>';
        }).join('')+'</tbody></table></div></div></div>';
      var cut=Math.round((sel.before-sel.after)/sel.before*100);
      var leftExtra='<div class="pane" style="margin-top:16px"><div class="pane-h"><span class="material-symbols-outlined">insights</span><b>選定案 '+esc(sel.id)+'</b></div><div class="pane-b"><div class="cmp"><div class="cb before"><div class="cl">改善前</div><div class="cx">'+sel.before+'</div><div class="cu">'+esc(sel.unit)+'</div></div><span class="material-symbols-outlined ca">east</span><div class="cb after"><div class="cl">改善後</div><div class="cx">'+sel.after+'</div><div class="cu">'+esc(sel.unit)+'</div></div></div><div style="text-align:center"><span class="save-chip"><span class="material-symbols-outlined">trending_down</span>改善 '+cut+'% · 達成 '+sel.rate+'%</span></div><div class="note"><span class="material-symbols-outlined">verified</span><span>已達門檻並經主管簽核，可進入標準作業凍結。</span></div></div></div>';
      setScreen("改善前後驗證","比對改善前後工時、節省效益與達成率","compare_arrows","1 件已簽核","fact_check",'<div class="split"><div>'+paneList("待驗證改善案","checklist",items.length+" 件",rows)+leftExtra+'</div><div>'+right+'</div></div>');
      var ctx=document.getElementById("c4");
      if(ctx){
        CHART=new Chart(ctx,{type:"bar",data:{labels:items.map(function(i){return i.id}),datasets:[
          {label:"改善前",data:items.map(function(i){return i.before}),backgroundColor:"#94a3b8",borderRadius:3},
          {label:"改善後",data:items.map(function(i){return i.after}),backgroundColor:"#2563eb",borderRadius:3}
        ]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{ticks:{callback:function(v){return v+"s"}}},x:{grid:{display:false}}},plugins:{legend:{position:"bottom",labels:{boxWidth:11}}}}});
      }
    }
    function s5(){
      var sops=[
        {id:"SOP-RF-07",t:"回焊爐快速換線",ver:"v3.2",st:"cur",own:"林建宏",date:"2026/08/10"},
        {id:"SOP-KB-04",t:"備料 Kanban 拉動",ver:"v2.1",st:"cur",own:"陳雅琪",date:"2026/08/08"},
        {id:"SOP-5S-02",t:"線邊倉 5S 定位",ver:"v1.4",st:"cur",own:"李思婷",date:"2026/08/05"},
        {id:"SOP-AOI-03",t:"AOI 判讀節點",ver:"v1.0",st:"draft",own:"王志明",date:"—"}
      ];
      var rows=sops.map(function(s){return{color:s.st==="cur"?"var(--blue)":"#d97706",t:s.id+" "+s.t,s:"負責 "+s.own+" · "+s.date,v:s.ver,vc:"#1d4ed8"}});
      var steps=[
        {t:"換線前準備（外部作業）",d:"預先備妥治具、程式與錫膏，於前一批生產中完成",time:"120s"},
        {t:"停機與快速定位",d:"以定位銷一次到位，取消人工對位量測",time:"45s"},
        {t:"程式與參數切換",d:"掃描工單條碼自動載入回焊溫度曲線",time:"30s"},
        {t:"首件確認",d:"AOI 首件自動判讀，通過即批量生產",time:"90s"},
        {t:"換線後收尾（外部作業）",d:"舊治具歸位，於下一批生產中進行",time:"—"}
      ];
      var vers=[
        {v:"v3.2",st:"目前版本",cur:true,note:"納入 K-2408 快速換線，換線 600s → 410s"},
        {v:"v3.1",st:"已封存",cur:false,note:"新增首件 AOI 自動判讀節點"},
        {v:"v3.0",st:"已封存",cur:false,note:"導入外部作業分離（SMED）"},
        {v:"v2.4",st:"已封存",cur:false,note:"原始標準，人工對位換線"}
      ];
      var totalIn=285;
      var right='<div class="kpis">'+
        kpiCard({icon:"menu_book",t:"生效 SOP",v:sops.filter(function(s){return s.st==="cur"}).length,u:"份",d:"1 份草稿待審"})+
        kpiCard({icon:"history",t:"版本迭代",v:"4",u:"版",d:"最新 v3.2"})+
        kpiCard({icon:"timer",t:"內部換線時間",v:totalIn,u:"s",d:"由 600s 降低",dir:"up"})+
        kpiCard({icon:"groups",t:"現場展開",v:"12",u:"人",d:"已完成教育訓練",dir:"up"})+
        '</div><div class="card"><div class="card-h"><span class="material-symbols-outlined">description</span><b>SOP-RF-07 回焊爐快速換線 · v3.2</b><span class="sub">內部作業合計 '+totalIn+'s</span></div><div class="card-b"><div class="sop-doc">'+
        steps.map(function(st,i){return '<div class="sop-step"><div class="sn">'+(i+1)+'</div><div style="min-width:0;flex:1"><div class="st">'+esc(st.t)+'</div><div class="sd">'+esc(st.d)+'</div></div><div class="stime">'+esc(st.time)+'</div></div>'}).join('')+
        '</div><div class="note"><span class="material-symbols-outlined">lock</span><span>本版本已凍結並經主管簽核，任何修改需開立新的 Kaizen 提案並重新驗證。</span></div></div></div>';
      var leftExtra='<div class="pane" style="margin-top:16px"><div class="pane-h"><span class="material-symbols-outlined">history</span><b>版本歷程</b></div><div class="pane-b" style="display:flex;flex-direction:column;gap:6px">'+
        vers.map(function(v){return '<div class="ver-row '+(v.cur?"cur":"")+'"><span class="material-symbols-outlined" style="color:'+(v.cur?"var(--blue)":"var(--muted)")+'">'+(v.cur?"check_circle":"radio_button_unchecked")+'</span><div style="min-width:0;flex:1"><b class="mono">'+esc(v.v)+'</b> <span style="color:var(--muted);font-weight:600">'+esc(v.st)+'</span><div style="font-size:10.5px;color:var(--muted)">'+esc(v.note)+'</div></div></div>'}).join('')+
        '</div></div>';
      setScreen("標準作業 SOP","凍結最佳作法、版本控管與現場展開","menu_book","v3.2 生效中","verified_user",'<div class="split"><div>'+paneList("標準作業文件","folder_open",sops.length+" 份",rows)+leftExtra+'</div><div>'+right+'</div></div>');
    }
    var SCREENS=[s0,s1,s2,s3,s4,s5];
    function buildNav(){
      var nav=document.getElementById("nav");
      nav.innerHTML=MODULES.map(function(m,i){
        return '<button type="button" class="nav-btn" data-i="'+i+'" aria-label="'+esc(m.name)+'"><span class="material-symbols-outlined" aria-hidden="true">'+m.icon+'</span><span class="lbl">'+esc(m.name)+'</span><span class="idx">0'+(i+1)+'</span></button>';
      }).join('');
      Array.prototype.forEach.call(nav.querySelectorAll("[data-i]"),function(b){
        b.addEventListener("click",function(){
          var i=+b.getAttribute("data-i");
          if(location.hash!=="#v"+i)location.hash="v"+i;
          else show(i);
        });
      });
    }
    function show(i){
      if(i<0||i>=SCREENS.length)i=0;
      destroyChart();
      CUR=i;
      Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){
        var on=+b.getAttribute("data-i")===i;
        b.classList.toggle("on",on);
        if(on)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");
      });
      SCREENS[i]();
      try{window.scrollTo(0,0)}catch(e){}
    }
    function fromHash(){
      var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
      show(m?Math.min(+m[1],SCREENS.length-1):0);
    }
    chartDefaults();
    buildNav();
    window.addEventListener("hashchange",fromHash);
    fromHash();
  </script>
</body>
