<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>精實生產改善｜Jvision 系統 Demo</title>
  <meta name="description" content="以價值流程、工時量測與七大浪費盤點驅動的精實改善工作台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --acc:#16a34a; --acc2:#4ade80; --acc-soft:#dcfce7; --acc-deep:#15803d;
      --bg:#f1f5f4; --panel:#ffffff; --ink:#0f231a; --muted:#5b6b63;
      --line:#e3ece7; --line2:#eef4f1;
      --warn:#f59e0b; --danger:#ef4444; --ok:#16a34a; --info:#0ea5e9;
      --shadow:0 1px 2px rgba(16,40,28,.05),0 8px 26px rgba(16,40,28,.06);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
      background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
      -webkit-font-smoothing:antialiased;
    }
    .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr}
    .app{display:flex;min-height:100vh;max-width:100%;}
    /* Sidebar */
    .side{
      width:230px;flex:none;background:linear-gradient(180deg,#0f2a1e,#123626);
      color:#dff3e8;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
      min-width:0;
    }
    .brand{padding:18px 18px 14px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.08)}
    .brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;color:#06231a;box-shadow:0 6px 16px rgba(74,222,128,.32)}
    .brand .logo .material-symbols-outlined{font-size:23px}
    .brand h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.3px}
    .brand p{margin:2px 0 0;font-size:11px;color:#9fd6ba;font-weight:600}
    nav{padding:12px 10px;display:flex;flex-direction:column;gap:4px;flex-wrap:wrap}
    .nav-btn{
      display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;
      background:transparent;border:0;color:#cfe9db;cursor:pointer;font:inherit;font-weight:600;
      text-align:left;width:100%;transition:background .15s,color .15s;min-width:0;
    }
    .nav-btn .material-symbols-outlined{font-size:21px;flex:none}
    .nav-btn .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
    .nav-btn .idx{margin-left:auto;font-size:11px;color:#7fbb9c;font-weight:700;flex:none}
    .nav-btn:hover{background:rgba(255,255,255,.06);color:#fff}
    .nav-btn.on{background:linear-gradient(135deg,var(--acc),var(--acc-deep));color:#fff;box-shadow:0 6px 16px rgba(22,163,74,.4)}
    .nav-btn.on .idx{color:#c9f7dc}
    .side .foot{margin-top:auto;padding:14px 16px;font-size:11px;color:#8dc9ac;border-top:1px solid rgba(255,255,255,.08)}
    .side .foot b{color:#dff3e8}
    /* Main */
    .main{flex:1;min-width:0;display:flex;flex-direction:column}
    .topbar{
      display:flex;align-items:center;gap:14px;padding:15px 24px;background:var(--panel);
      border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap;
    }
    .topbar .tt{min-width:0}
    .topbar h2{margin:0;font-size:17px;font-weight:800;display:flex;align-items:center;gap:9px}
    .topbar h2 .material-symbols-outlined{color:var(--acc);font-size:22px}
    .topbar p{margin:2px 0 0;font-size:12px;color:var(--muted)}
    .topbar .sp{flex:1;min-width:8px}
    .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--acc-soft);color:var(--acc-deep);font-size:12px;font-weight:700;white-space:nowrap}
    .chip .material-symbols-outlined{font-size:16px}
    .wrap{padding:22px 24px 40px;min-width:0}
    /* Split workspace */
    .split{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start;min-width:0}
    .pane{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0;overflow:hidden}
    .pane-h{padding:14px 16px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:9px}
    .pane-h .material-symbols-outlined{color:var(--acc);font-size:19px}
    .pane-h b{font-size:13.5px;font-weight:800}
    .pane-h .cnt{margin-left:auto;font-size:11px;color:var(--muted);font-weight:700;background:var(--line2);padding:2px 9px;border-radius:999px}
    .pane-b{padding:14px 16px}
    /* list rows */
    .lrow{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border-radius:12px;cursor:pointer;border:1px solid transparent;transition:.14s;min-width:0}
    .lrow:hover{background:var(--line2)}
    .lrow.on{background:var(--acc-soft);border-color:#bbf0cf}
    .lrow .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}
    .lrow .lm{min-width:0;flex:1}
    .lrow .lt{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .lrow .ls{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .lrow .lv{font-size:12px;font-weight:800;flex:none;text-align:right}
    /* KPI cards */
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;min-width:0}
    .kpi{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px 16px;box-shadow:var(--shadow);min-width:0}
    .kpi .kt{font-size:12px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
    .kpi .kt .material-symbols-outlined{font-size:17px;color:var(--acc)}
    .kpi .kv{font-size:25px;font-weight:900;margin-top:7px;letter-spacing:-.5px}
    .kpi .kv small{font-size:13px;font-weight:700;color:var(--muted);margin-left:3px}
    .kpi .kd{font-size:11.5px;font-weight:700;margin-top:5px;display:flex;align-items:center;gap:4px}
    .kpi .kd .material-symbols-outlined{font-size:15px}
    .up{color:var(--ok)} .down{color:var(--danger)}
    /* generic card */
    .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:18px;min-width:0;overflow:hidden}
    .card-h{padding:14px 18px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
    .card-h .material-symbols-outlined{color:var(--acc);font-size:20px}
    .card-h b{font-size:14px;font-weight:800}
    .card-h .sub{font-size:11.5px;color:var(--muted);font-weight:600}
    .card-b{padding:16px 18px}
    .grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;min-width:0}
    .grid2b{display:grid;grid-template-columns:1fr 1fr;gap:18px;min-width:0}
    .chart-box{position:relative;height:250px;min-width:0}
    .chart-sm{position:relative;height:200px;min-width:0}
    /* table */
    table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
    th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line2);white-space:nowrap}
    th{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.4px;background:#fafcfb}
    tbody tr:hover{background:var(--line2)}
    td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
    .tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800}
    .tag .material-symbols-outlined{font-size:13px}
    .t-ok{background:#dcfce7;color:#15803d}
    .t-warn{background:#fef3c7;color:#b45309}
    .t-bad{background:#fee2e2;color:#b91c1c}
    .t-info{background:#e0f2fe;color:#0369a1}
    .t-mut{background:#eef2f0;color:#556}
    /* progress bar */
    .bar{height:8px;border-radius:999px;background:var(--line2);overflow:hidden;min-width:70px}
    .bar span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc))}
    /* VSM flow */
    .vsm{display:flex;gap:0;align-items:stretch;overflow-x:auto;padding:6px 2px 14px}
    .vstep{min-width:150px;flex:none;display:flex;align-items:center}
    .vbox{width:148px;border:1.5px solid var(--line);border-radius:13px;padding:12px;background:#fbfefc;position:relative}
    .vbox.bott{border-color:#fca5a5;background:#fff5f5}
    .vbox .vn{font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px}
    .vbox .vn .material-symbols-outlined{font-size:17px;color:var(--acc)}
    .vbox .vg{margin-top:9px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
    .vbox .vg b{color:var(--ink);font-size:13px;display:block;font-variant-numeric:tabular-nums}
    .vbox .vwait{margin-top:8px;font-size:11px;font-weight:800;color:var(--warn);display:flex;align-items:center;gap:4px}
    .varrow{color:var(--acc);font-size:22px;padding:0 4px;flex:none;align-self:center}
    .vbadge{position:absolute;top:-9px;right:8px;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--danger);color:#fff}
    /* waste board */
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;min-width:0}
    .col{background:#f7faf8;border:1px solid var(--line);border-radius:14px;padding:11px;min-width:0}
    .col-h{font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px;padding:2px 4px 10px}
    .col-h .n{margin-left:auto;font-size:11px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
    .wcard{background:#fff;border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:10px;padding:10px;margin-bottom:9px;box-shadow:0 1px 2px rgba(0,0,0,.03);min-width:0}
    .wcard:last-child{margin-bottom:0}
    .wcard .wt{font-weight:700;font-size:12.5px}
    .wcard .wm{font-size:11px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:6px}
    .wcard.p-high{border-left-color:var(--danger)}
    .wcard.p-mid{border-left-color:var(--warn)}
    .wcard.p-low{border-left-color:var(--info)}
    /* kaizen timeline */
    .tl{position:relative;padding-left:26px}
    .tl:before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
    .tli{position:relative;padding:0 0 16px}
    .tli:last-child{padding-bottom:0}
    .tli .tk{position:absolute;left:-22px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--acc)}
    .tli.done .tk{background:var(--acc)}
    .tli.late .tk{border-color:var(--danger)}
    .tli h4{margin:0;font-size:13px;font-weight:800}
    .tli p{margin:3px 0 0;font-size:11.5px;color:var(--muted)}
    .tli .meta{font-size:11px;color:var(--muted);margin-top:5px;display:flex;gap:12px;flex-wrap:wrap}
    /* verify before/after */
    .cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin-bottom:14px}
    .cmp .cb{border:1px solid var(--line);border-radius:13px;padding:14px;text-align:center;min-width:0}
    .cmp .cb.before{background:#fafafa}
    .cmp .cb.after{background:var(--acc-soft);border-color:#bbf0cf}
    .cmp .cb .cl{font-size:11px;color:var(--muted);font-weight:800}
    .cmp .cb .cx{font-size:26px;font-weight:900;margin-top:5px}
    .cmp .cb .cu{font-size:12px;color:var(--muted);font-weight:700}
    .cmp .ca{color:var(--acc);font-size:24px}
    .save-chip{display:inline-flex;align-items:center;gap:5px;background:var(--acc);color:#fff;font-weight:800;font-size:12px;padding:4px 11px;border-radius:999px}
    /* SOP */
    .sop-doc{border:1px solid var(--line);border-radius:13px;overflow:hidden}
    .sop-step{display:flex;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line2)}
    .sop-step:last-child{border-bottom:0}
    .sop-step .sn{width:26px;height:26px;border-radius:8px;background:var(--acc-soft);color:var(--acc-deep);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex:none}
    .sop-step .st{font-weight:700;font-size:13px}
    .sop-step .sd{font-size:11.5px;color:var(--muted);margin-top:3px}
    .sop-step .stime{margin-left:auto;font-size:12px;font-weight:800;color:var(--acc-deep);flex:none;font-variant-numeric:tabular-nums}
    .ver-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-size:12px}
    .ver-row.cur{background:var(--acc-soft)}
    .ver-row .material-symbols-outlined{font-size:18px}
    .mini-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:10px}
    .mini-legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
    .note{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:flex-start;margin-top:12px;background:#f7faf8;border:1px dashed var(--line);border-radius:11px;padding:10px 12px}
    .note .material-symbols-outlined{font-size:16px;color:var(--acc);flex:none}
    .hide{display:none}
    /* RWD */
    @media(max-width:1080px){
      .kpis{grid-template-columns:repeat(2,1fr)}
      .board{grid-template-columns:repeat(2,1fr)}
    }
    @media(max-width:860px){
      .app{flex-direction:column}
      .side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center}
      .brand{border-bottom:0;flex:1 1 auto}
      nav{flex-direction:row;flex-wrap:wrap;flex:1 1 100%;order:3}
      .nav-btn{width:auto;flex:none;white-space:nowrap}
      .nav-btn .idx{display:none}
      .side .foot{display:none}
    }
    @media(max-width:820px){
      .split{grid-template-columns:1fr}
      .grid2{grid-template-columns:1fr}
      .grid2b{grid-template-columns:1fr}
    }
    @media(max-width:560px){
      .kpis{grid-template-columns:1fr 1fr}
      .board{grid-template-columns:1fr}
      .nav-btn .lbl{display:none}
      .cmp{grid-template-columns:1fr}
      .cmp .ca{transform:rotate(90deg)}
      .wrap{padding:16px 14px 34px}
      .topbar{padding:13px 15px}
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">insights</span></div>
        <div>
          <h1>精實改善工作台</h1>
          <p>LEAN KAIZEN OPS</p>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="foot">
        產線 <b>SMT-A / 組裝-B</b><br/>本週改善案 <b>18</b> 件 · 節省 <b>412</b> 分/日
      </div>
    </aside>
    <main class="main">
      <div class="topbar" id="topbar"></div>
      <div class="wrap"><div id="screen"></div></div>
    </main>
  </div>

  <script>
  var CHART = null;
  function destroyChart(){ if(CHART){ try{CHART.destroy();}catch(e){} CHART=null; } }

  var MODULES = [
    {icon:"linear_scale", name:"價值流程圖 VSM", sub:"繪製各站工時、庫存與流動，區分加值／非加值"},
    {icon:"timer",        name:"工時量測",       sub:"循環時間、換模與等待量測，計算標準工時"},
    {icon:"delete_sweep", name:"七大浪費盤點",   sub:"看板標記浪費並依影響度排序"},
    {icon:"lightbulb",    name:"改善提案 Kaizen",sub:"提案登記、指派負責人與驗證期限追蹤"},
    {icon:"compare_arrows",name:"改善前後驗證",  sub:"比對改善前後工時與節省效益"},
    {icon:"menu_book",    name:"標準作業 SOP",   sub:"凍結最佳作法、版本控管與現場展開"}
  ];

  function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
  function fmt(n){ try{return Number(n).toLocaleString("en-US");}catch(e){return String(n);} }

  /* ---------- shared split builders ---------- */
  function paneList(title, icon, count, rows){
    var h='<div class="pane"><div class="pane-h"><span class="material-symbols-outlined">'+icon+'</span><b>'+title+'</b><span class="cnt">'+count+'</span></div><div class="pane-b">';
    rows.forEach(function(r,i){
      h+='<div class="lrow'+(i===0?' on':'')+'"><span class="dot" style="background:'+r.color+'"></span><div class="lm"><div class="lt">'+esc(r.t)+'</div><div class="ls">'+esc(r.s)+'</div></div><div class="lv" style="color:'+(r.vc||'var(--ink)')+'">'+esc(r.v)+'</div></div>';
    });
    h+='</div></div>';
    return h;
  }
  function kpiCard(k){
    return '<div class="kpi"><div class="kt"><span class="material-symbols-outlined">'+k.icon+'</span>'+esc(k.t)+'</div><div class="kv">'+esc(k.v)+(k.u?'<small>'+esc(k.u)+'</small>':'')+'</div><div class="kd '+(k.dir==='up'?'up':(k.dir==='down'?'down':''))+'">'+(k.dir==='up'?'<span class="material-symbols-outlined">trending_up</span>':(k.dir==='down'?'<span class="material-symbols-outlined">trending_down</span>':''))+esc(k.d)+'</div></div>';
  }

  /* ================= SCREEN 0 : VSM ================= */
  function s0(){
    var stations=[
      {n:"來料備料",ic:"inventory_2",ct:42,inv:1.8,va:false,wait:38},
      {n:"SMT 印刷",ic:"print",ct:28,inv:0.6,va:true,wait:6},
      {n:"貼片 SMT",ic:"memory",ct:35,inv:0.9,va:true,wait:12},
      {n:"回焊爐",ic:"local_fire_department",ct:44,inv:0.4,va:true,wait:0,bott:true},
      {n:"檢驗 AOI",ic:"visibility",ct:22,inv:1.2,va:false,wait:24},
      {n:"組裝入庫",ic:"conveyor_belt",ct:31,inv:0.7,va:true,wait:9}
    ];
    var rows=stations.map(function(st){return {
      color: st.bott?'var(--danger)':(st.va?'var(--acc)':'var(--warn)'),
      t: st.n, s:(st.va?'加值作業':'非加值／等待'), v: st.ct+'s', vc: st.bott?'var(--danger)':'var(--ink)'
    };});
    var totCT=stations.reduce(function(a,s){return a+s.ct;},0);
    var totWait=stations.reduce(function(a,s){return a+s.wait;},0);
    var vaCT=stations.filter(function(s){return s.va;}).reduce(function(a,s){return a+s.ct;},0);
    var pce=Math.round(vaCT/(totCT+totWait)*1000)/10;

    var vsm='<div class="vsm">';
    stations.forEach(function(st,i){
      vsm+='<div class="vstep"><div class="vbox'+(st.bott?' bott':'')+'">'+(st.bott?'<span class="vbadge">瓶頸</span>':'')+
        '<div class="vn"><span class="material-symbols-outlined">'+st.ic+'</span>'+esc(st.n)+'</div>'+
        '<div class="vg"><span>C/T<b>'+st.ct+'s</b></span><span>庫存<b>'+st.inv+'天</b></span></div>'+
        (st.wait?'<div class="vwait"><span class="material-symbols-outlined">hourglass_bottom</span>等待 '+st.wait+'s</div>':'<div class="vwait" style="color:var(--acc)"><span class="material-symbols-outlined">bolt</span>流動順暢</div>')+
        '</div>'+(i<stations.length-1?'<span class="material-symbols-outlined varrow">chevron_right</span>':'')+'</div>';
    });
    vsm+='</div>';

    var right='<div class="kpis" style="grid-template-columns:repeat(2,1fr)">'+
      kpiCard({icon:"schedule",t:"總前置時間",v:((totCT+totWait)/60).toFixed(1),u:"分",d:"其中加值 "+(vaCT/60).toFixed(1)+" 分",dir:""})+
      kpiCard({icon:"percent",t:"流程效率 PCE",v:pce,u:"%",d:"目標 45%，仍有落差",dir:"down"})+

  /* ---------- shell ---------- */
  var SCREENS=[s0,s1,s2,s3,s4,s5];
  var CUR=0;

  function setScreen(title,sub,icon,chipTxt,chipIcon,bodyHtml){
    document.getElementById("topbar").innerHTML=
      '<div class="tt"><h2><span class="material-symbols-outlined">'+icon+'</span>'+esc(title)+'</h2><p>'+esc(sub)+'</p></div>'+
      '<div class="sp"></div>'+
      '<span class="chip"><span class="material-symbols-outlined">'+chipIcon+'</span>'+esc(chipTxt)+'</span>'+
      '<span class="chip" style="background:#eef4f1;color:var(--muted)"><span class="material-symbols-outlined">calendar_today</span>2026/08/13</span>';
    document.getElementById("screen").innerHTML=bodyHtml;
  }

  function buildNav(){
    var nav=document.getElementById("nav");
    nav.innerHTML=MODULES.map(function(m,i){
      return '<button class="nav-btn" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="lbl">'+esc(m.name)+'</span><span class="idx">0'+(i+1)+'</span></button>';
    }).join('');
    Array.prototype.forEach.call(nav.querySelectorAll("[data-i]"),function(b){
      b.addEventListener("click",function(){ show(+b.getAttribute("data-i")); });
    });
  }

  function show(i){
    destroyChart();
    CUR=i;
    Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){
      b.classList.toggle("on", +b.getAttribute("data-i")===i);
    });
    SCREENS[i]();
    try{window.scrollTo(0,0);}catch(e){}
  }

  buildNav();
  show(0);

  function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m)return;var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
  </script>
