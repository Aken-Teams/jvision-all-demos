<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PLM 產品生命週期管理平台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --red:#dc2626; --red-d:#b91c1c; --orange:#f97316; --orange-l:#fff7ed;
  --ink:#1e232b; --sub:#5f6b7a; --line:#e7ebf0; --bg:#f4f6f9; --card:#fff;
  --green:#16a34a; --blue:#2563eb; --amber:#d97706; --violet:#7c3aed;
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0;}
html,body{max-width:100%;overflow-x:hidden;}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;}
.ms{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;line-height:1;vertical-align:middle;}
.topbar{position:sticky;top:0;z-index:40;background:linear-gradient(120deg,#7f1d1d 0%,var(--red) 55%,var(--orange) 130%);color:#fff;box-shadow:0 2px 14px rgba(180,20,20,.22);}
.tbrow{display:flex;align-items:center;gap:14px;padding:11px 18px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:11px;min-width:0;}
.blogo{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.blogo .ms{font-size:24px;}
.btit{font-weight:800;font-size:16px;letter-spacing:.3px;white-space:nowrap;}
.bsub{font-size:11px;opacity:.85;white-space:nowrap;}
.tbspacer{flex:1 1 auto;}
.tbmeta{display:flex;align-items:center;gap:9px;font-size:12px;opacity:.95;}
.tbchip{background:rgba(255,255,255,.15);padding:5px 11px;border-radius:20px;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.tbchip .ms{font-size:16px;}
nav.tabs{display:flex;gap:6px;padding:0 12px 10px;flex-wrap:wrap;}
nav.tabs button{display:flex;align-items:center;gap:7px;border:0;cursor:pointer;background:rgba(255,255,255,.12);color:#fff;padding:8px 13px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:600;transition:.15s;white-space:nowrap;}
nav.tabs button:hover{background:rgba(255,255,255,.24);}
nav.tabs button.on{background:#fff;color:var(--red);box-shadow:0 3px 10px rgba(0,0,0,.18);}
nav.tabs button .ms{font-size:19px;}
main{padding:20px;max-width:1360px;margin:0 auto;}
.scr-head{margin-bottom:16px;}
.scr-head h2{font-size:20px;font-weight:800;display:flex;align-items:center;gap:9px;}
.scr-head h2 .ms{color:var(--red);font-size:24px;}
.scr-head p{color:var(--sub);font-size:13px;margin-top:3px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(20,30,50,.04);}
.card h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:12px;}
.card h3 .ms{font-size:18px;color:var(--orange);}
.grid{display:grid;gap:14px;}
.g-kpi{grid-template-columns:repeat(4,1fr);}
.g-2{grid-template-columns:1.4fr 1fr;}
.g-2e{grid-template-columns:1fr 1fr;}
.g-3{grid-template-columns:repeat(3,1fr);}
.g-bom{grid-template-columns:1.5fr 1fr;}
@media(max-width:820px){
  .g-kpi{grid-template-columns:repeat(2,1fr);}
  .g-2,.g-2e,.g-3,.g-bom{grid-template-columns:1fr;}
}
@media(max-width:480px){ .g-kpi{grid-template-columns:1fr;} }
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;position:relative;overflow:hidden;}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--red);}
.kpi.o::before{background:var(--orange);}.kpi.g::before{background:var(--green);}.kpi.b::before{background:var(--blue);}
.kpi .lab{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px;}
.kpi .lab .ms{font-size:16px;color:var(--red);}
.kpi.o .lab .ms{color:var(--orange);}.kpi.g .lab .ms{color:var(--green);}.kpi.b .lab .ms{color:var(--blue);}
.kpi .val{font-size:26px;font-weight:800;margin-top:6px;}
.kpi .val small{font-size:13px;font-weight:600;color:var(--sub);}
.kpi .dlt{font-size:11px;margin-top:4px;font-weight:600;}
.up{color:var(--green);}.dn{color:var(--red);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{font-size:11px;color:var(--sub);font-weight:600;text-transform:uppercase;letter-spacing:.4px;background:#fafbfc;}
tbody tr:hover{background:#fcfcfd;}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.tag .ms{font-size:13px;}
.t-red{background:#fee2e2;color:var(--red-d);}
.t-org{background:#ffedd5;color:#c2410c;}
.t-grn{background:#dcfce7;color:#15803d;}
.t-blu{background:#dbeafe;color:#1d4ed8;}
.t-gry{background:#eef1f4;color:#5f6b7a;}
.t-vlt{background:#ede9fe;color:#6d28d9;}
.tree{font-size:13px;}
.tnode{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;margin-bottom:4px;border:1px solid var(--line);background:#fff;}
.tnode .ms{font-size:17px;}
.tnode .code{font-family:"Inter";font-weight:700;color:var(--red);}
.tnode .nm{font-weight:500;}
.tnode .meta{margin-left:auto;font-size:11px;color:var(--sub);display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
.tnode.lv1{margin-left:0;}
.tnode.lv2{margin-left:22px;background:#fcfcfd;}
.tnode.lv3{margin-left:44px;background:#fafbfc;}
.tnode.sel{border-color:var(--orange);background:var(--orange-l);box-shadow:0 0 0 2px rgba(249,115,22,.15);}
.badge-v{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;background:#fee2e2;color:var(--red-d);}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media(max-width:980px){.board{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.board{grid-template-columns:1fr;}}
.col{background:#f0f3f7;border:1px solid var(--line);border-radius:13px;padding:11px;min-width:0;}
.col-h{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13px;margin-bottom:10px;padding:0 3px;}
.col-h .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
.col-h .cnt{margin-left:auto;font-size:11px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 9px;color:var(--sub);}
.kcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(20,30,50,.05);border-left:3px solid var(--red);}
.kcard:last-child{margin-bottom:0;}
.kcard .kt{font-weight:600;font-size:13px;margin-bottom:6px;}
.kcard .km{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--sub);}
.av{width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.diff-row{display:grid;grid-template-columns:130px 1fr 1fr;gap:0;font-size:13px;border-bottom:1px solid var(--line);}
.diff-row>div{padding:9px 11px;min-width:0;overflow-wrap:break-word;}
.diff-row.h{background:#fafbfc;font-size:11px;color:var(--sub);font-weight:600;text-transform:uppercase;}
.diff-old{background:#fef2f2;}
.diff-new{background:#f0fdf4;}
.diff-old del{color:var(--red-d);text-decoration:line-through;}
.diff-new ins{color:#15803d;text-decoration:none;font-weight:600;}
@media(max-width:560px){.diff-row{grid-template-columns:1fr;} .diff-row.h{display:none;}}
.tl{position:relative;padding-left:26px;}
.tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl-item{position:relative;padding-bottom:16px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item .dot{position:absolute;left:-22px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--red);}
.tl-item.ok .dot{border-color:var(--green);}
.tl-item.wait .dot{border-color:var(--amber);}
.tl-item .tt{font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.tl-item .td{font-size:12px;color:var(--sub);margin-top:2px;}
.tl-item .ts{font-size:11px;color:#9aa5b1;}
.chartbox{width:100%;overflow:hidden;}
.bar-line{display:flex;align-items:center;gap:9px;font-size:12px;margin-bottom:9px;}
.bar-line .nm{width:78px;flex:0 0 auto;color:var(--sub);}
.bar-track{flex:1;height:9px;border-radius:6px;background:#eef1f4;overflow:hidden;}
.bar-fill{height:100%;border-radius:6px;}
.bar-line .pc{width:38px;text-align:right;font-weight:700;flex:0 0 auto;}
.mb14{margin-bottom:14px;}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.pill{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;font-size:12px;font-weight:600;color:var(--sub);display:flex;align-items:center;gap:6px;}
.pill .ms{font-size:15px;color:var(--orange);}
.pill.act{background:var(--red);color:#fff;border-color:var(--red);}
.pill.act .ms{color:#fff;}
.approval{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;}
.astep{flex:1;min-width:120px;border:1px solid var(--line);border-radius:11px;padding:12px;margin:4px;position:relative;background:#fff;}
.astep .an{font-size:11px;color:var(--sub);}
.astep .ap{font-weight:700;font-size:13px;margin:3px 0;}
.astep .astat{font-size:11px;font-weight:600;display:flex;align-items:center;gap:4px;}
.astep.done{border-color:var(--green);background:#f0fdf4;}
.astep.cur{border-color:var(--orange);background:var(--orange-l);}
.foot{text-align:center;color:#9aa5b1;font-size:12px;padding:22px 12px 8px;}
.sig{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--red);background:#fee2e2;padding:3px 10px;border-radius:20px;margin-bottom:12px;}
.sig .ms{font-size:14px;}
@media(max-width:560px){ .hide-sm{display:none!important;} .btit{font-size:14px;} }
</style>
</head>
<body>
<header class="topbar">
  <div class="tbrow">
    <div class="brand">
      <div class="blogo"><span class="ms">account_tree</span></div>
      <div>
        <div class="btit">PLM 產品生命週期管理平台</div>
        <div class="bsub hide-sm">Product Lifecycle Management · 研發管理</div>
      </div>
    </div>
    <div class="tbspacer"></div>
    <div class="tbmeta hide-sm">
      <div class="tbchip"><span class="ms">verified</span>已同步 ERP</div>
      <div class="tbchip"><span class="ms">groups</span>3 部門協同</div>
    </div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="app"></main>
<div class="foot">本頁為純 UI 系統展示（無後端），畫面與資料皆為擬真示範。</div>

<script>
(function(){
"use strict";
var TABS=[
  {i:0,ic:"account_tree",t:"產品結構"},
  {i:1,ic:"history",t:"版本控管"},
  {i:2,ic:"groups",t:"協同設計"},
  {i:3,ic:"rule",t:"工程變更"},
  {i:4,ic:"fact_check",t:"簽核稽核"},
  {i:5,ic:"insights",t:"生命週期"}
];
var app=document.getElementById("app");
var charts=[];
function clearCharts(){for(var k=0;k<charts.length;k++){try{charts[k].destroy();}catch(e){}}charts=[];}
function el(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}

(function(){
  var h="";
  for(var a=0;a<TABS.length;a++){h+='<button data-i="'+TABS[a].i+'"><span class="ms">'+TABS[a].ic+'</span><span class="hide-sm">'+TABS[a].t+'</span></button>';}
  el("tabs").innerHTML=h;
  var btns=el("tabs").querySelectorAll("button");
  for(var b=0;b<btns.length;b++){btns[b].addEventListener("click",function(){show(+this.getAttribute("data-i"));try{window.scrollTo(0,0);}catch(e){}});}
})();

function setActive(i){
  var btns=el("tabs").querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].className=(+btns[b].getAttribute("data-i")===i)?"on":"";}
}

/* ============ SCREEN 0: 產品結構 / BOM ============ */
function scr0(){
  var bom=[
    {lv:1,ic:"deployed_code",code:"FG-EV350",nm:"EV350 電動車控制主板（成品）",qty:"1",rev:"D",st:"生效"},
    {lv:2,ic:"memory",code:"PCB-100",nm:"主控電路板 PCBA",qty:"1",rev:"C",st:"生效"},
    {lv:3,ic:"widgets",code:"MCU-32",nm:"32 位元微控制器",qty:"1",rev:"B",st:"生效"},
    {lv:3,ic:"widgets",code:"CAP-47",nm:"鋁電解電容 47µF",qty:"8",rev:"A",st:"生效"},
    {lv:2,ic:"cable",code:"HAR-24",nm:"線束總成 24P",qty:"1",rev:"C",st:"審核中"},
    {lv:3,ic:"widgets",code:"CON-08",nm:"防水連接器 8P",qty:"2",rev:"B",st:"生效"},
    {lv:2,ic:"inventory_2",code:"ENC-AL",nm:"鋁合金外殼",qty:"1",rev:"E",st:"生效"}
  ];
  var stMap={"生效":"t-grn","審核中":"t-org","停用":"t-gry"};
  var tree="";
  for(var i=0;i<bom.length;i++){var b=bom[i];
    tree+='<div class="tnode lv'+b.lv+(i===2?" sel":"")+'">'+
      '<span class="ms" style="color:'+(b.lv===1?"var(--red)":b.lv===2?"var(--orange)":"var(--sub)")+'">'+b.ic+'</span>'+
      '<span class="code">'+b.code+'</span><span class="nm">'+esc(b.nm)+'</span>'+
      '<span class="meta"><span>用量 '+b.qty+'</span><span class="badge-v">Rev '+b.rev+'</span><span class="tag '+stMap[b.st]+'">'+b.st+'</span></span></div>';
  }
  return {html:
    '<div class="scr-head"><h2><span class="ms">account_tree</span>產品結構與 BOM</h2><p>多階 BOM 樹、料號主檔與用量管理 — 生命週期的單一設計基準</p></div>'+
    '<span class="sig"><span class="ms">star</span>簽章元件：多階 BOM 樹狀結構</span>'+
    '<div class="grid g-kpi mb14">'+
      kpi("account_tree","","BOM 料號總數","1,284","+36 本月","up","")+
      kpi("layers","o","最深階層","5 階","EV350 產品線","","o")+
      kpi("verified","g","生效版次","1,097","85.4% 已凍結","","g")+
      kpi("pending_actions","b","待審核件","187","BOM 變更中","dn","b")+
    '</div>'+
    '<div class="grid g-bom">'+
      '<div class="card"><h3><span class="ms">account_tree</span>EV350 產品結構樹　<span class="tag t-red" style="margin-left:auto">選定：MCU-32</span></h3><div style="overflow-x:auto"><div class="tree">'+tree+'</div></div></div>'+
      '<div class="card"><h3><span class="ms">description</span>料號主檔　MCU-32</h3>'+
        specRow("料號","MCU-32")+specRow("品名","32 位元微控制器")+specRow("類別","主動元件 / IC")+specRow("現行版次","Rev B（生效）")+specRow("承認廠商","建智半導體、O鴻電子")+specRow("生命週期","量產（Mass Prod.）")+specRow("最後變更","2026-08-09 · ECN-2418")+
        '<div style="margin-top:12px"><div class="card" style="background:var(--orange-l);border-color:#fed7aa;padding:12px"><div style="font-size:12px;font-weight:700;color:#c2410c;display:flex;align-items:center;gap:6px"><span class="ms" style="font-size:16px">insights</span>此料號被 12 個產品結構引用</div><div style="font-size:11px;color:var(--sub);margin-top:4px">變更將觸發跨產品影響評估。</div></div></div>'+
      '</div>'+
    '</div>'+
    '<div class="card" style="margin-top:14px"><h3><span class="ms">monitoring</span>各產品線 BOM 完整度</h3><div id="c0" class="chartbox"></div></div>'
  ,init:function(){
    var o={
      chart:{type:"bar",stacked:true,height:250,toolbar:{show:false},animations:{enabled:false},redrawOnParentResize:false,redrawOnWindowResize:false,fontFamily:"Inter,Noto Sans TC"},
      series:[{name:"已凍結",data:[92,78,85,64,88]},{name:"待審核",data:[8,22,15,36,12]}],
      plotOptions:{bar:{horizontal:true,borderRadius:4,barHeight:"58%"}},
      colors:["#16a34a","#f97316"],dataLabels:{enabled:false},
      xaxis:{categories:["EV350","EV500","BMS-Pack","車載充電","智慧儀表"],max:100,labels:{formatter:function(v){return v+"%";}}},
      legend:{position:"top"},tooltip:{shared:true,intersect:false},grid:{borderColor:"#eef1f4"}};
    var c=new ApexCharts(el("c0"),o);c.render();charts.push(c);
  }};
}
function specRow(k,v){return '<div style="display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px"><span style="color:var(--sub);flex:0 0 auto">'+k+'</span><span style="font-weight:600;text-align:right">'+esc(v)+'</span></div>';}

/* ============ SCREEN 1: 版本控管 / 差異比對 ============ */
function scr1(){
  var vers=[
    {v:"Rev D",st:"生效中",cls:"ok",who:"林彥廷",dt:"2026-08-09",note:"新增過溫保護，MCU 更換為車規等級"},
    {v:"Rev C",st:"已凍結",cls:"",who:"陳思妤",dt:"2026-06-21",note:"線束連接器改為防水規格 IP67"},
    {v:"Rev B",st:"已凍結",cls:"",who:"林彥廷",dt:"2026-04-02",note:"外殼改為鋁合金，散熱優化"},
    {v:"Rev A",st:"已封存",cls:"wait",who:"王柏宇",dt:"2026-01-15",note:"初版設計，試產 EVT"}
  ];
  var tl="";
  for(var i=0;i<vers.length;i++){var x=vers[i];
    tl+='<div class="tl-item '+x.cls+'"><div class="dot"></div>'+
      '<div class="tt">'+x.v+' <span class="tag '+(i===0?"t-grn":i===3?"t-gry":"t-blu")+'">'+x.st+'</span></div>'+
      '<div class="td">'+esc(x.note)+'</div><div class="ts">'+x.who+' · '+x.dt+'</div></div>';
  }
  var diffs=[
    {f:"MCU 型號",o:"MCU-32 (工規)",n:"MCU-32A (車規 AEC-Q100)"},
    {f:"工作溫度",o:"-20 ~ 70℃",n:"-40 ~ 105℃"},
    {f:"過溫保護",o:"無",n:"新增 (105℃ 自動降載)"},
    {f:"電容 CAP-47",o:"用量 8",n:"用量 10"},
    {f:"外殼 ENC-AL",o:"Rev D",n:"Rev E（散熱鰭片）"}
  ];
  var diff='<div class="diff-row h"><div>比對項目</div><div>Rev C（舊）</div><div>Rev D（新）</div></div>';
  for(var d=0;d<diffs.length;d++){var z=diffs[d];
    diff+='<div class="diff-row"><div style="font-weight:600">'+esc(z.f)+'</div><div class="diff-old"><del>'+esc(z.o)+'</del></div><div class="diff-new"><ins>'+esc(z.n)+'</ins></div></div>';
  }
  return {html:
    '<div class="scr-head"><h2><span class="ms">history</span>版本與版次控管</h2><p>版本鏈、有效版次凍結與逐項差異比對</p></div>'+
    '<span class="sig"><span class="ms">star</span>簽章元件：Rev C ↔ Rev D 差異比對表</span>'+
    '<div class="grid g-kpi mb14">'+
      kpi("history","","現行版次","Rev D","2026-08-09 生效","","")+
