<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>產品全生命週期管理系統</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700&family=Roboto+Mono:wght@300;400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#15803D;
  --color-on-primary:#FFFFFF;
  --color-secondary:#22C55E;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDF4;
  --color-foreground:#14532D;
  --color-card:#FFFFFF;
  --color-card-foreground:#14532D;
  --color-muted:#E8F0F1;
  --color-muted-foreground:#475569;
  --color-border:#BBF7D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#15803D;

  --blue:#2563EB;
  --ink:#14532D;
  --muted:#475569;
  --line:#BBF7D0;

  --green:#15803D;
  --green-bright:#22C55E;
  --orange:#D97706;
  --red:#DC2626;
  --violet:#7C3AED;
  --card:#FFFFFF;
  --bg:#F0FDF4;
  --shadow:0 16px 38px rgba(20,83,45,.08),0 2px 8px rgba(20,83,45,.05);
}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{
  min-height:100vh;
  font-family:"Exo","Noto Sans TC",system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 8% 8%,rgba(34,197,94,.12),transparent 26rem),
    radial-gradient(circle at 94% 35%,rgba(217,119,6,.08),transparent 24rem),
    linear-gradient(180deg,#f7fff9 0,var(--color-background) 46%,#ecf9f0 100%);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  opacity:.32;
  background-image:
    linear-gradient(rgba(21,128,61,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(21,128,61,.035) 1px,transparent 1px);
  background-size:28px 28px;
}
button,a,[role="button"]{cursor:pointer}
button{font:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.ms{
  font-family:"Material Symbols Outlined";
  font-weight:400;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
.mono,.code,td:first-child,.val,.pc,.ts,.badge-v{
  font-family:"Roboto Mono",monospace;
  font-variant-numeric:tabular-nums;
}
.topbar{
  position:sticky;
  top:0;
  z-index:40;
  color:#fff;
  background:
    radial-gradient(circle at 12% -70%,rgba(187,247,208,.42),transparent 18rem),
    linear-gradient(118deg,#14532D 0%,#15803D 58%,#166534 100%);
  border-bottom:1px solid rgba(255,255,255,.22);
  box-shadow:0 12px 30px rgba(20,83,45,.2);
}
.topbar::after{
  content:"";
  position:absolute;
  right:-75px;
  top:-105px;
  width:260px;
  height:210px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:42% 58% 62% 38%/55% 45% 55% 45%;
  pointer-events:none;
}
.tbrow{
  display:flex;
  align-items:center;
  gap:16px;
  padding:14px clamp(14px,3vw,34px) 10px;
  flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:12px}
.blogo{
  width:44px;
  height:44px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  border:1px solid rgba(255,255,255,.28);
  border-radius:48% 52% 38% 62%/58% 42% 58% 42%;
  background:rgba(255,255,255,.14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25);
}
.blogo .ms{font-size:25px}
.btit{font-size:17px;font-weight:700;letter-spacing:.04em}
.bsub{font-size:11px;opacity:.82;letter-spacing:.05em}
.tbspacer{flex:1}
.tbmeta{display:flex;align-items:center;gap:9px;font-size:12px}
.tbchip{
  display:flex;
  align-items:center;
  gap:6px;
  padding:6px 11px;
  white-space:nowrap;
  border:1px solid rgba(255,255,255,.2);
  border-radius:999px;
  background:rgba(255,255,255,.12);
}
.tbchip .ms{font-size:16px}
.tabs{
  display:flex;
  gap:7px;
  padding:0 clamp(12px,3vw,30px) 12px;
  overflow-x:auto;
  scrollbar-width:thin;
}
.tabs button{
  position:relative;
  display:flex;
  flex:1 0 auto;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:40px;
  padding:8px 13px;
  color:rgba(255,255,255,.88);
  border:1px solid rgba(255,255,255,.16);
  border-radius:14px 18px 12px 17px;
  background:rgba(255,255,255,.08);
  font-size:13px;
  font-weight:600;
  transition:background .2s ease,color .2s ease,transform .2s ease,box-shadow .2s ease;
}
.tabs button:hover{background:rgba(255,255,255,.18);transform:translateY(-1px)}
.tabs button.on{
  color:var(--color-primary);
  background:#fff;
  border-color:#fff;
  box-shadow:0 8px 20px rgba(0,0,0,.16);
}
.tabs button.on::after{
  content:"";
  position:absolute;
  left:18%;
  right:18%;
  bottom:-7px;
  height:3px;
  border-radius:999px;
  background:#FBBF24;
}
.tabs button .ms{font-size:19px}
main{
  max-width:1400px;
  margin:auto;
  padding:clamp(18px,3vw,30px);
}
.screen{animation:chapter-in .42s cubic-bezier(.2,.85,.3,1) both}
.scr-head{
  position:relative;
  margin-bottom:17px;
  padding:5px 0 5px 18px;
}
.scr-head::before{
  content:"";
  position:absolute;
  left:0;
  top:2px;
  bottom:2px;
  width:6px;
  border-radius:60% 40% 55% 45%;
  background:linear-gradient(var(--color-secondary),var(--color-primary));
}
.scr-head h2{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0;
  font-size:clamp(20px,2.3vw,27px);
  line-height:1.25;
  font-weight:700;
  letter-spacing:.015em;
}
.scr-head h2 .ms{font-size:27px;color:var(--color-primary)}
.scr-head p{margin:5px 0 0;color:var(--muted);font-size:13px}
.card,.kpi{
  border:1px solid var(--line);
  background:rgba(255,255,255,.96);
  box-shadow:var(--shadow);
}
.card{
  position:relative;
  padding:17px;
  border-radius:20px 16px 22px 17px;
  overflow:hidden;
}
.card::after{
  content:"";
  position:absolute;
  right:-42px;
  top:-45px;
  width:105px;
  height:85px;
  border-radius:45% 55% 62% 38%;
  background:rgba(34,197,94,.045);
  pointer-events:none;
}
.card h3{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  gap:7px;
  margin:0 0 13px;
  font-size:14px;
  font-weight:700;
}
.card h3 .ms{font-size:19px;color:var(--color-accent)}
.grid{display:grid;gap:15px}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2{grid-template-columns:1.4fr 1fr}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-bom{grid-template-columns:1.5fr 1fr}
.mb14{margin-bottom:15px}
.kpi{
  position:relative;
  min-height:126px;
  padding:17px 17px 15px;
  overflow:hidden;
  border-radius:18px 22px 17px 23px;
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.kpi:hover{transform:translateY(-2px);border-color:#86EFAC;box-shadow:0 20px 42px rgba(20,83,45,.12)}
.kpi::before{
  content:"";
  position:absolute;
  left:0;
  top:18px;
  bottom:18px;
  width:5px;
  border-radius:0 8px 8px 0;
  background:var(--color-primary);
}
.kpi::after{
  content:"";
  position:absolute;
  width:90px;
  height:75px;
  right:-32px;
  bottom:-40px;
  border-radius:57% 43% 38% 62%;
  background:rgba(21,128,61,.07);
}
.kpi.o::before{background:var(--color-accent)}
.kpi.g::before{background:var(--green-bright)}
.kpi.b::before{background:var(--blue)}
.kpi .lab{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:12px;
  font-weight:500;
}
.kpi .lab .ms{font-size:18px;color:var(--color-primary)}
.kpi.o .lab .ms{color:var(--color-accent)}
.kpi.g .lab .ms{color:var(--green)}
.kpi.b .lab .ms{color:var(--blue)}
.kpi .val{margin-top:8px;font-size:27px;font-weight:700;letter-spacing:-.04em}
.kpi .val small{font-size:13px;color:var(--muted)}
.kpi .dlt{margin-top:5px;font-size:11px;font-weight:600}
.up{color:#166534}.dn{color:#B91C1C}
.sig{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-bottom:14px;
  padding:5px 11px;
  color:#166534;
  border:1px solid #86EFAC;
  border-radius:999px;
  background:#DCFCE7;
  font-size:11px;
  font-weight:700;
}
.sig .ms{font-size:15px}
table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  font-size:13px;
}
th,td{
  padding:10px 11px;
  text-align:left;
  white-space:nowrap;
  border-bottom:1px solid var(--line);
}
th{
  color:#334155;
  background:#ECFDF3;
  font-size:11px;
  font-weight:700;
  letter-spacing:.04em;
}
th:first-child{border-radius:10px 0 0 0}
th:last-child{border-radius:0 10px 0 0}
tbody tr{transition:background .18s ease}
tbody tr:hover{background:#F0FDF4}
td:nth-child(4),td:nth-child(7){text-align:right;font-variant-numeric:tabular-nums}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 9px;
  border:1px solid transparent;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
}
.tag .ms{font-size:13px}
.t-red{color:#991B1B;background:#FEE2E2;border-color:#FECACA}
.t-org{color:#9A3412;background:#FFEDD5;border-color:#FED7AA}
.t-grn{color:#166534;background:#DCFCE7;border-color:#86EFAC}
.t-blu{color:#1E40AF;background:#DBEAFE;border-color:#BFDBFE}
.t-gry{color:#475569;background:#F1F5F9;border-color:#CBD5E1}
.t-vlt{color:#5B21B6;background:#EDE9FE;border-color:#DDD6FE}
.tree{font-size:13px}
.tnode{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:43px;
  margin-bottom:6px;
  padding:8px 11px;
  border:1px solid var(--line);
  border-radius:14px 11px 15px 12px;
  background:#fff;
  transition:transform .18s ease,border-color .18s ease,background .18s ease;
}
.tnode:hover{transform:translateX(2px);background:#F7FFF9;border-color:#86EFAC}
.tnode .ms{font-size:18px}
.tnode .code{font-weight:700;color:var(--color-primary)}
.tnode .nm{font-weight:500}
.tnode .meta{
  display:flex;
  flex-wrap:wrap;
  justify-content:flex-end;
  gap:9px;
  margin-left:auto;
  color:var(--muted);
  font-size:11px;
}
.tnode.lv2{margin-left:22px;background:#FCFFFD}
.tnode.lv3{margin-left:44px;background:#F8FCF9}
.tnode.sel{border-color:var(--color-accent);background:#FFF7ED;box-shadow:0 0 0 3px rgba(217,119,6,.12)}
.badge-v{
  padding:2px 7px;
  color:#166534;
  border-radius:6px;
  background:#DCFCE7;
  font-size:10px;
  font-weight:700;
}
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px}
.col{
  padding:12px;
  border:1px solid var(--line);
  border-radius:19px 15px 21px 16px;
  background:linear-gradient(180deg,#ECFDF3,#F8FCF9);
}
.col-h{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
  padding:0 3px;
  font-size:13px;
  font-weight:700;
}
.col-h .dot{width:10px;height:10px;flex:0 0 auto;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.9)}
.col-h .cnt{
  margin-left:auto;
  padding:1px 9px;
  color:var(--muted);
  border:1px solid var(--line);
  border-radius:999px;
  background:#fff;
  font:11px "Roboto Mono",monospace;
}
.kcard{
  margin-bottom:9px;
  padding:12px;
  border:1px solid var(--line);
  border-left:4px solid var(--color-primary);
  border-radius:12px 16px 13px 11px;
  background:#fff;
  box-shadow:0 5px 14px rgba(20,83,45,.06);
  transition:transform .2s ease,box-shadow .2s ease;
}
.kcard:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(20,83,45,.1)}
.kcard:last-child{margin-bottom:0}
.kcard .kt{margin-bottom:7px;font-size:13px;font-weight:600}
.kcard .km{display:flex;align-items:center;flex-wrap:wrap;gap:6px;color:var(--muted);font-size:11px}
.av{
  display:grid;
  place-items:center;
  width:24px;
  height:24px;
  flex:0 0 auto;
  color:#fff;
  border-radius:48% 52% 45% 55%;
  font-size:10px;
  font-weight:700;
}
.diff-row{
  display:grid;
  grid-template-columns:130px 1fr 1fr;
  border-bottom:1px solid var(--line);
  font-size:13px;
}
.diff-row>div{padding:10px 11px;overflow-wrap:anywhere}
.diff-row.h{color:#334155;background:#ECFDF3;font-size:11px;font-weight:700}
.diff-old{background:#FFF7F7}
.diff-new{background:#F0FDF4}
.diff-old del{color:#991B1B}
.diff-new ins{color:#166534;text-decoration:none;font-weight:700}
.tl{position:relative;padding-left:27px}
.tl::before{
  content:"";
  position:absolute;
  left:9px;
  top:5px;
  bottom:5px;
  width:3px;
  border-radius:999px;
  background:linear-gradient(var(--green-bright),var(--line));
}
.tl-item{position:relative;padding-bottom:17px}
.tl-item:last-child{padding-bottom:0}
.tl-item .dot{
  position:absolute;
  left:-24px;
  top:2px;
  width:17px;
  height:17px;
  border:4px solid var(--color-primary);
  border-radius:50%;
  background:#fff;
}
.tl-item.ok .dot{border-color:var(--green-bright)}
.tl-item.wait .dot{border-color:var(--color-accent)}
.tl-item .tt{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:13px;font-weight:600}
.tl-item .td{margin-top:2px;color:var(--muted);font-size:12px}
.tl-item .ts{color:#64748B;font-size:11px}
.chartbox{width:100%;overflow:hidden}
.bar-line{display:flex;align-items:center;gap:9px;margin-bottom:11px;font-size:12px}
.bar-line .nm{width:78px;flex:0 0 auto;color:var(--muted)}
.bar-track{flex:1;height:10px;overflow:hidden;border-radius:999px;background:#E2E8F0}
.bar-fill{height:100%;border-radius:999px}
.bar-line .pc{width:42px;flex:0 0 auto;text-align:right;font-weight:700}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.pill{
  display:flex;
  align-items:center;
  gap:6px;
  min-height:36px;
  padding:6px 13px;
  color:var(--muted);
  border:1px solid var(--line);
  border-radius:999px;
  background:#fff;
  font-size:12px;
  font-weight:600;
  box-shadow:0 3px 9px rgba(20,83,45,.04);
}
.pill .ms{font-size:16px;color:var(--color-accent)}
.pill.act{color:#fff;border-color:var(--color-primary);background:var(--color-primary)}
.pill.act .ms{color:#fff}
.approval{display:flex;align-items:stretch;flex-wrap:wrap}
.astep{
  flex:1;
  min-width:145px;
  margin:4px;
  padding:13px;
  border:1px solid var(--line);
  border-radius:14px 18px 13px 17px;
  background:#fff;
}
.astep .an{color:var(--muted);font-size:11px}
.astep .ap{margin:4px 0;font-size:13px;font-weight:700}
.astep .astat{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700}
.astep.done{border-color:#86EFAC;background:#F0FDF4}
.astep.cur{border-color:#FDBA74;background:#FFF7ED;box-shadow:0 0 0 3px rgba(217,119,6,.09)}
.foot{padding:23px 12px;color:#64748B;text-align:center;font-size:12px}
@keyframes chapter-in{
  from{opacity:0;transform:translateY(14px) scale(.992)}
  to{opacity:1;transform:none}
}
@media(max-width:980px){
  .board{grid-template-columns:repeat(2,minmax(220px,1fr))}
}
@media(max-width:820px){
  .g-kpi{grid-template-columns:repeat(2,1fr)}
  .g-2,.g-2e,.g-3,.g-bom{grid-template-columns:1fr}
  .topbar{position:relative}
}
@media(max-width:560px){
  .hide-sm{display:none!important}
  .tbrow{padding:11px 13px 8px}
  .btit{font-size:14px}
  .tabs{padding:0 10px 10px}
  .tabs button{min-width:49px;padding:8px 11px}
  main{padding:16px 12px}
  .g-kpi{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .diff-row{grid-template-columns:1fr}
  .diff-row.h{display:none}
  .tnode.lv2{margin-left:12px}
  .tnode.lv3{margin-left:24px}
  .tnode{align-items:flex-start;flex-wrap:wrap}
  .tnode .meta{width:100%;margin-left:26px;justify-content:flex-start}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  .screen{animation:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="tbrow">
    <div class="brand">
      <div class="blogo"><span class="ms">account_tree</span></div>
      <div>
        <div class="btit">產品全生命週期管理系統</div>
        <div class="bsub hide-sm">PRODUCT LIFECYCLE · RESEARCH DEVELOPMENT</div>
      </div>
    </div>
    <div class="tbspacer"></div>
    <div class="tbmeta hide-sm">
      <div class="tbchip"><span class="ms">verified</span>已同步 ERP</div>
      <div class="tbchip"><span class="ms">groups</span>3 部門協同</div>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="系統主要畫面"></nav>
</header>
<main id="app"></main>
<footer class="foot">本頁為純 UI 系統展示（無後端），畫面與資料皆為擬真示範。</footer>
<script>
(function(){
"use strict";
var TABS=[
  {i:0,ic:"account_tree",t:"產品結構"},
  {i:1,ic:"history",t:"版本控管"},
  {i:2,ic:"groups",t:"協同設計"},
  {i:3,ic:"rule",t:"工程變更"},
  {i:4,ic:"fact_check",t:"簽核稽核"},
  {i:5,ic:"insights",t:"生命週期"}
];
var app=document.getElementById("app"),charts=[];
function clearCharts(){for(var k=0;k<charts.length;k++){try{charts[k].destroy()}catch(e){}}charts=[]}
function el(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
(function(){
  var h="";
  for(var a=0;a<TABS.length;a++){
    h+='<button type="button" data-i="'+TABS[a].i+'" aria-label="'+TABS[a].t+'"><span class="ms">'+TABS[a].ic+'</span><span class="hide-sm">'+TABS[a].t+'</span></button>';
  }
  el("tabs").innerHTML=h;
  var btns=el("tabs").querySelectorAll("button");
  for(var b=0;b<btns.length;b++){
    btns[b].addEventListener("click",function(){
      var i=+this.getAttribute("data-i");
      location.hash="go="+i;
      show(i);
      try{window.scrollTo(0,0)}catch(e){}
    });
  }
})();
function setActive(i){
  var btns=el("tabs").querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    var on=+btns[b].getAttribute("data-i")===i;

var SCREENS=[scr0,scr1,scr2,scr3,scr4,scr5];
function show(i){
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  clearCharts();
  setActive(i);
  var s=SCREENS[i]();
  app.innerHTML='<section class="screen" aria-live="polite">'+s.html+'</section>';
  void app.offsetHeight;
  if(s.init)s.init();
}
window.__show=show;
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  show(m?Math.min(+m[1],5):0);
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
