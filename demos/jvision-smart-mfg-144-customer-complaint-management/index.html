<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>客戶投訴管理 Customer Complaint Management</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet" />
<style>
:root{
  --accent:#334155;--accent2:#64748b;--bg:#f1f5f9;--panel:#ffffff;
  --line:#e2e8f0;--ink:#1e293b;--muted:#64748b;--soft:#f8fafc;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#0891b2;
  --radius:14px;--sh:0 1px 3px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.app{display:flex;min-height:100vh;}
.sidebar{
  width:236px;flex:0 0 236px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:14px;}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 38px;}
.brand .logo .material-symbols-outlined{font-size:22px;}
.brand .t1{font-weight:700;font-size:14px;letter-spacing:.2px;}
.brand .t2{font-size:11px;color:var(--muted);}
.nav{display:flex;flex-direction:column;gap:4px;}
.navbtn{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border:none;background:transparent;
  border-radius:10px;cursor:pointer;font-family:inherit;font-size:13.5px;color:var(--muted);text-align:left;width:100%;
  transition:.15s;min-width:0;
}
.navbtn .material-symbols-outlined{font-size:21px;flex:0 0 auto;}
.navbtn .nlab{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.navbtn:hover{background:var(--soft);color:var(--ink);}
.navbtn.on{background:var(--accent);color:#fff;font-weight:600;}
.navbtn.on .material-symbols-outlined{color:#fff;}
.sidefoot{margin-top:auto;padding:12px 10px 2px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);}
.main{flex:1 1 auto;min-width:0;padding:22px 26px 40px;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
.topbar .h{min-width:0;}
.topbar h1{font-size:19px;margin:0;font-weight:700;}
.topbar .sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--muted);}
.chip b{color:var(--accent);font-weight:700;}
.grid{display:grid;gap:14px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:2fr 1fr;}
.g32{grid-template-columns:1.4fr 1fr;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px;box-shadow:var(--sh);min-width:0;}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent2);}
.card .cinfo{font-size:11.5px;color:var(--muted);font-weight:400;margin-left:auto;}
.kpi{display:flex;flex-direction:column;gap:6px;}
.kpi .kl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.kpi .kl .material-symbols-outlined{font-size:17px;}
.kpi .kv{font-size:26px;font-weight:700;letter-spacing:-.5px;}
.kpi .kv small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px;}
.kpi .kd{font-size:11.5px;display:flex;align-items:center;gap:4px;}
.kpi .kd .material-symbols-outlined{font-size:15px;}
.up{color:var(--ok);}.down{color:var(--bad);}.flat{color:var(--muted);}.warn{color:var(--warn);}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px;}
.tbl th{text-align:left;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:11.5px;}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--soft);vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:var(--soft);}
.scroll{overflow-x:auto;min-width:0;}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;}
.p-red{background:#fef2f2;color:#dc2626;}
.p-amb{background:#fffbeb;color:#b45309;}
.p-grn{background:#f0fdf4;color:#15803d;}
.p-blu{background:#eff6ff;color:#1d4ed8;}
.p-gry{background:#f1f5f9;color:#475569;}
.p-cyn{background:#ecfeff;color:#0e7490;}
.p-vio{background:#f5f3ff;color:#6d28d9;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 8px;}
.bar{height:8px;border-radius:6px;background:var(--soft);overflow:hidden;min-width:60px;}
.bar > i{display:block;height:100%;border-radius:6px;background:var(--accent);}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0;}
.col{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0;}
.col > .ch{font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;padding:0 2px;}
.col > .ch .cnt{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--muted);}
.ticket{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:8px;box-shadow:0 1px 2px rgba(15,23,42,.04);}
.ticket .tk-id{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.3px;}
.ticket .tk-t{font-size:12.5px;font-weight:600;margin:2px 0 6px;line-height:1.35;}
.ticket .tk-m{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;color:var(--muted);}
.ticket .lb{width:100%;height:3px;border-radius:3px;margin-top:7px;}
.tl{position:relative;padding-left:26px;margin:0;}
.tl:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl .ev{position:relative;padding:0 0 16px;}
.tl .ev:last-child{padding-bottom:0;}
.tl .ev .mk{position:absolute;left:-24px;top:1px;width:16px;height:16px;border-radius:50%;background:var(--panel);border:3px solid var(--accent);}
.tl .ev .ev-t{font-size:12.5px;font-weight:600;}
.tl .ev .ev-d{font-size:11.5px;color:var(--muted);}
.tl .ev .ev-time{font-size:10.5px;color:var(--accent2);font-weight:600;margin-bottom:1px;}
.fish{display:flex;flex-direction:column;gap:10px;}
.fish .spine{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap;}
.bone{flex:1 1 200px;min-width:0;border:1px solid var(--line);border-left:4px solid var(--accent2);border-radius:8px;padding:10px 12px;background:var(--soft);}
.bone .bh{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.bone .bh .material-symbols-outlined{font-size:16px;}
.bone ul{margin:0;padding-left:16px;font-size:11.5px;color:var(--muted);}
.bone li{margin:2px 0;}
.step{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--soft);}
.step:last-child{border-bottom:none;}
.step .sn{width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:0 0 26px;}
.step .sn.done{background:var(--ok);}
.step .sn.act{background:var(--warn);}
.step .sc{min-width:0;flex:1;}
.step .sc .st{font-size:12.5px;font-weight:600;}
.step .sc .sd{font-size:11.5px;color:var(--muted);}
.mini{display:flex;flex-direction:column;gap:9px;}
.mrow{display:flex;align-items:center;gap:10px;font-size:12px;}
.mrow .ml{width:78px;flex:0 0 78px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mrow .mv{font-weight:600;width:42px;text-align:right;flex:0 0 42px;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent2);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:0 0 26px;}
.chartbox{overflow:hidden;min-width:0;}
.satwrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.stars .material-symbols-outlined{font-size:20px;color:#f59e0b;}
.notebox{background:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:11px 13px;font-size:12px;color:var(--muted);}
.notebox b{color:var(--ink);}
.hd2{font-size:12px;font-weight:700;color:var(--muted);margin:2px 0 6px;text-transform:uppercase;letter-spacing:.4px;}
.tag8d{display:inline-flex;padding:2px 7px;border-radius:6px;font-size:10.5px;font-weight:700;background:var(--accent);color:#fff;margin-right:6px;}
@media(max-width:860px){
  .app{flex-direction:column;}
  .sidebar{width:auto;flex:none;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px;border-right:none;border-bottom:1px solid var(--line);}
  .brand{border-bottom:none;margin-bottom:0;padding:0 14px 0 4px;border-right:1px solid var(--line);}
  .nav{flex-direction:row;flex-wrap:wrap;gap:6px;}
  .sidefoot{display:none;}
  .navbtn{width:auto;padding:8px 12px;}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
  .board{grid-template-columns:1fr 1fr;}
}
@media(max-width:560px){
  .main{padding:16px 14px 34px;}
  .navbtn .nlab{display:none;}
  .navbtn{padding:8px 10px;}
  .board{grid-template-columns:1fr;}
  .brand .t2{display:none;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">support_agent</span></div>
      <div>
        <div class="t1">投訴管理平台</div>
        <div class="t2">Complaint Mgmt</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">
      純 UI 展示 · 擬真資料<br/>v1.4 · 品保 / 客服 / 業務
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="h">
        <h1 id="scr-title">投訴受理建檔</h1>
        <div class="sub" id="scr-sub">多渠道投訴登錄、嚴重度分級與案件編號</div>
      </div>
      <div class="chip"><span class="material-symbols-outlined" style="font-size:16px">calendar_today</span>資料截止 <b>2026-08-14</b></div>
    </div>
    <div id="view"></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<script>
var MODS=[
  {i:"receipt_long",name:"投訴受理建檔",sub:"多渠道投訴登錄、嚴重度分級與案件編號"},
  {i:"account_tree",name:"分類派工中心",sub:"依缺陷類型自動指派責任部門與承辦人"},
  {i:"science",name:"根因分析 8D",sub:"魚骨圖、5Why 與 8D 步驟化調查追蹤"},
  {i:"fact_check",name:"CAPA 矯正預防",sub:"矯正與預防措施建立、驗證與有效性確認"},
  {i:"task_alt",name:"客戶回覆結案",sub:"回覆函生成、客戶簽認與案件結案歸檔"},
  {i:"insights",name:"投訴趨勢儀表",sub:"結案時效、重複投訴率與缺陷帕累托分析"}
];

var charts=[];
function killCharts(){for(var k=0;k<charts.length;k++){try{charts[k].destroy();}catch(e){}}charts=[];}
function mk(id,opt){
  var el=document.getElementById(id);if(!el)return;
  opt.chart=opt.chart||{};
  opt.chart.redrawOnParentResize=false;opt.chart.redrawOnWindowResize=false;
  opt.chart.animations={enabled:false};opt.chart.fontFamily='Inter,"Noto Sans TC",sans-serif';
  opt.chart.toolbar={show:false};
  try{var c=new ApexCharts(el,opt);c.render();charts.push(c);}catch(e){}
}
var PAL=["#334155","#64748b","#0891b2","#d97706","#16a34a","#94a3b8"];

function esc(s){return String(s).replace(/</g,"&lt;");}

/* ============ SCREEN 0 : 投訴受理建檔 ============ */
function s0(){
  var kpi=[
    {l:"今日新受理",v:"18",u:"件",d:"+4 vs 昨日",c:"up",ic:"inbox"},
    {l:"待分派",v:"7",u:"件",d:"需 4h 內處理",c:"warn",ic:"pending_actions"},
    {l:"嚴重(A級)",v:"3",u:"件",d:"已升級通報",c:"down",ic:"priority_high"},
    {l:"平均受理時效",v:"12",u:"分",d:"-3 分改善",c:"up",ic:"timer"}
  ];
  var rows=[
    ["CC-26081401","宏達精密","LOT-A2231","尺寸公差超標","email","A",1],
    ["CC-26081402","台鴻電子","LOT-B0917","表面刮傷","電話","B",0],
    ["CC-26081403","盛群工業","LOT-C4402","包裝破損","客服單","C",0],
    ["CC-26081404","華晶科技","LOT-A2280","功能失效","email","A",1],
    ["CC-26081405","聯合馬達","LOT-D1120","標籤錯誤","門市","C",0],
    ["CC-26081406","昇陽材料","LOT-B1035","交期延誤","電話","B",0],
    ["CC-26081407","富田機械","LOT-E7781","異音","email","B",1]
  ];
  var sevMap={A:["p-red","A 級 · 嚴重"],B:["p-amb","B 級 · 中度"],C:["p-blu","C 級 · 輕微"]};
  var chMap={"email":"mail","電話":"call","客服單":"confirmation_number","門市":"storefront"};
  var trs=rows.map(function(r){
    var s=sevMap[r[5]];
    return '<tr><td style="font-weight:600">'+r[0]+'</td><td>'+esc(r[1])+'</td><td><span class="pill p-gry">'+r[2]+'</span></td><td>'+esc(r[3])+'</td><td><span style="display:inline-flex;align-items:center;gap:5px;color:var(--muted)"><span class="material-symbols-outlined" style="font-size:16px">'+chMap[r[4]]+'</span>'+r[4]+'</span></td><td><span class="pill '+s[0]+'">'+s[1]+'</span></td><td>'+(r[6]?'<span class="pill p-amb">待分派</span>':'<span class="pill p-grn">已分派</span>')+'</td></tr>';
  }).join("");

  var view=
  '<div class="grid g4">'+kpi.map(function(k){
    return '<div class="card kpi"><div class="kl"><span class="material-symbols-outlined">'+k.ic+'</span>'+k.l+'</div><div class="kv">'+k.v+'<small>'+k.u+'</small></div><div class="kd '+k.c+'"><span class="material-symbols-outlined">'+(k.c=="up"?"trending_up":k.c=="warn"?"schedule":"error")+'</span>'+k.d+'</div></div>';
  }).join("")+'</div>'+
  '<div class="grid g32" style="margin-top:14px">'+
    '<div class="card"><h3><span class="material-symbols-outlined">list_alt</span>今日投訴受理清單<span class="cinfo">共 18 件 · 顯示前 7 筆</span></h3><div class="scroll"><table class="tbl"><thead><tr><th>案件編號</th><th>客戶</th><th>批號</th><th>問題</th><th>來源渠道</th><th>嚴重度</th><th>狀態</th></tr></thead><tbody>'+trs+'</tbody></table></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>來源渠道占比</h3><div class="chartbox" id="c0a"></div><div class="legend"><span><i class="dot" style="background:'+PAL[0]+'"></i>Email</span><span><i class="dot" style="background:'+PAL[1]+'"></i>電話</span><span><i class="dot" style="background:'+PAL[2]+'"></i>客服單</span><span><i class="dot" style="background:'+PAL[3]+'"></i>門市</span></div></div>'+
  '</div>'+
  '<div class="grid g2" style="margin-top:14px">'+
    '<div class="card"><h3><span class="material-symbols-outlined">bar_chart</span>近 7 日受理量趨勢</h3><div class="chartbox" id="c0b"></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">edit_note</span>快速受理表單（示意）</h3>'+
      '<div class="grid g2" style="gap:10px">'+
        '<div><div class="hd2">客戶名稱</div><div class="notebox">華晶科技股份有限公司</div></div>'+
        '<div><div class="hd2">產品 / 批號</div><div class="notebox">功率模組 · <b>LOT-A2280</b></div></div>'+
        '<div><div class="hd2">問題描述</div><div class="notebox">上線後量測發現輸出功率不足，疑似焊接空焊。</div></div>'+
        '<div><div class="hd2">嚴重度判定</div><div class="notebox"><span class="pill p-red">A 級 · 嚴重</span> 影響客戶產線停線</div></div>'+
      '</div>'+
      '<div class="notebox" style="margin-top:12px"><b>系統建議：</b>A 級投訴自動升級品保主管並限 4 小時內完成分派。</div>'+
    '</div>'+
  '</div>';
  document.getElementById("view").innerHTML=view;
  void document.getElementById("view").offsetHeight;
  mk("c0a",{chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"donut",height:236},series:[41,26,22,11],labels:["Email","電話","客服單","門市"],colors:PAL.slice(0,4),legend:{show:false},dataLabels:{enabled:true,formatter:function(v){return Math.round(v)+"%";}},plotOptions:{pie:{donut:{size:"62%"}}},stroke:{width:2}});
  mk("c0b",{chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"bar",height:260},series:[{name:"受理量",data:[14,17,12,20,16,15,18]}],colors:[PAL[0]],plotOptions:{bar:{borderRadius:5,columnWidth:"52%"}},dataLabels:{enabled:false},xaxis:{categories:["8/8","8/9","8/10","8/11","8/12","8/13","8/14"],labels:{style:{colors:"#94a3b8"}}},yaxis:{labels:{style:{colors:"#94a3b8"}}},grid:{borderColor:"#eef2f7"}});
}

/* ============ SCREEN 1 : 分類派工中心 ============ */
function s1(){
  var cols=[
    {t:"待分類",cnt:4,c:"#94a3b8"},
    {t:"品保部",cnt:5,c:"#334155"},
    {t:"生產部",cnt:3,c:"#0891b2"},
    {t:"物流部",cnt:2,c:"#d97706"}
  ];
  var tickets={

var SCREENS=[s0,s1,s2,s3,s4,s5];

function buildNav(){
  var nav=document.getElementById("nav");
  nav.innerHTML=MODS.map(function(m,i){return '<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+m.i+'</span><span class="nlab">'+m.name+'</span></button>';}).join("");
  var btns=nav.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){(function(btn){btn.addEventListener("click",function(){location.hash="go="+btn.getAttribute("data-i");});})(btns[b]);}
}
buildNav();

function show(i){
  killCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  var m=MODS[i]||MODS[0];
  document.getElementById("scr-title").textContent=m.name;
  document.getElementById("scr-sub").textContent=m.sub;
  (SCREENS[i]||SCREENS[0])();
}

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
