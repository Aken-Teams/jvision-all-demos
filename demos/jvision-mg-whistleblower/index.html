<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>企業誠信與檢舉案件管理 · 經營治理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#99E6DC;
  --accent:#0D9488;
  --accent2:#2DD4BF;
  --accent-soft:#CCFBF1;
  --accent-soft2:#F0FDFA;
  --bg:#F0FDFA;
  --panel:#FFFFFF;
  --th:#E7F8F5;
  --hov:#F3FCFA;
  --track:#DCEFEF;
  --sidebar:#083F3B;
  --sidebar2:#0F5D57;
  --side-edge:rgba(255,255,255,.18);
  --ok:#15803D;
  --warn:#A85C04;
  --bad:#DC2626;
  --info:#0369A1;
  --r:8px;
  --glow:rgba(13,148,136,.18);
  --shadow:0 1px 0 rgba(15,78,74,.08),0 8px 24px rgba(15,78,74,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-width:320px}
body{
  font-family:"Crimson Pro","Noto Sans TC",serif;
  background:
    linear-gradient(rgba(13,148,136,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(13,148,136,.035) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--ink);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit}
button,[role="button"],a{cursor:pointer}
h1,h2,h3,h4,.brand-txt b,.nav button,.tile b,.pcard b,.lane-row .body b,.rep-row .sku b,.tl-item b,.tl-i b{
  font-family:"Cormorant Garamond","Noto Sans TC",serif;
  margin:0;
  letter-spacing:.015em;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
  border-radius:4px;
}
::selection{background:#99F6E4;color:#082F2C}

.app{display:flex;flex-direction:column;min-height:100vh}
.sidebar{
  width:100%;
  height:68px;
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:22px;
  padding:0 30px;
  position:sticky;
  top:0;
  z-index:30;
  color:#F0FDFA;
  background:linear-gradient(110deg,var(--sidebar) 0%,var(--sidebar2) 72%,#0D6B63 100%);
  border-bottom:3px solid var(--color-secondary);
  box-shadow:0 5px 18px rgba(8,63,59,.18);
}
.brand{display:flex;align-items:center;gap:11px;padding:0;min-width:0;flex:0 0 auto}
.brand-logo{
  width:39px;height:39px;flex:none;
  display:flex;align-items:center;justify-content:center;
  color:#062E2B;
  background:var(--color-secondary);
  border:1px solid #99F6E4;
  border-radius:6px;
  box-shadow:4px 4px 0 rgba(0,0,0,.18);
}
.brand-logo .material-symbols-outlined{font-size:22px}
.brand-txt b{display:block;font-size:17px;font-weight:700;line-height:1.15;color:#FFFFFF}
.brand-txt span{display:block;margin-top:2px;font-family:"Cinzel",serif;font-size:8.5px;letter-spacing:.12em;color:#BCECE6}
.nav{display:flex;flex:1;min-width:0;gap:4px;margin:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{
  position:relative;
  min-height:44px;
  flex:0 0 auto;
  display:flex;align-items:center;gap:8px;
  padding:9px 13px;
  border:1px solid transparent;
  border-radius:4px;
  color:#D7F5F1;
  background:transparent;
  font-size:14px;
  font-weight:600;
  text-align:left;
  white-space:nowrap;
  transition:background-color 220ms ease,color 220ms ease,border-color 220ms ease,transform 220ms ease;
}
.nav button .material-symbols-outlined{font-size:19px;flex:none}
.nav button:hover{color:#FFFFFF;background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.16);transform:translateY(-1px)}
.nav button.on{color:#062E2B;background:var(--color-secondary);border-color:#99F6E4;box-shadow:3px 3px 0 rgba(0,0,0,.18)}
.nav button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-9px;height:3px;background:#F59E0B}
.nav .idx{margin-left:auto;font-family:"Cinzel",serif;font-size:9px;opacity:.72;font-weight:600}
.side-foot{display:none}
.main{width:100%;max-width:1600px;margin:0 auto;padding:22px 30px 56px;min-width:0}
.topbar{
  display:flex;align-items:flex-end;justify-content:space-between;gap:18px;
  margin-bottom:16px;padding:3px 0 15px;
  border-bottom:1px solid var(--line);
  flex-wrap:wrap;
}
.topbar h1{display:flex;align-items:center;gap:9px;font-size:25px;font-weight:700;line-height:1.15;color:#0F3F3B}
.topbar h1 .material-symbols-outlined{width:32px;height:32px;display:grid;place-items:center;color:var(--color-primary);font-size:22px;background:#CCFBF1;border:1px solid var(--line);border-radius:4px}
.topbar .sub{margin-top:5px;font-family:"Noto Sans TC",sans-serif;font-size:11.5px;color:var(--muted);letter-spacing:.035em}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{
  min-height:34px;
  display:inline-flex;align-items:center;gap:7px;
  padding:6px 11px;
  color:#365C59;background:rgba(255,255,255,.88);
  border:1px solid var(--line);border-radius:4px;
  font-family:"Noto Sans TC",sans-serif;font-size:11px;font-weight:600;
  box-shadow:0 1px 0 rgba(15,78,74,.05);
}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(21,128,61,.15);animation:pulse 2s ease-in-out infinite}
.avatar{width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex:none;border-radius:4px;background:var(--color-accent);color:#201000;border:1px solid #B45309;font-family:"Noto Sans TC",sans-serif;font-weight:800;font-size:12px;box-shadow:3px 3px 0 rgba(120,53,15,.16)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.82)}}
@keyframes enter{0%{opacity:0;transform:translateY(12px) scale(.97)}100%{opacity:1;transform:none}}

.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0;animation:enter 420ms cubic-bezier(.2,.8,.2,1) both}
.grid>*:nth-child(2){animation-delay:55ms}
.grid>*:nth-child(3){animation-delay:110ms}
.grid>*:nth-child(4){animation-delay:165ms}
.grid>*:nth-child(5){animation-delay:220ms}
.grid>*:nth-child(6){animation-delay:275ms}
.grid>*:nth-child(7){animation-delay:330ms}
.grid>*:nth-child(8){animation-delay:385ms}
.card,.sec,.kpi,.stat,.tile{
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:var(--r);
  box-shadow:var(--shadow);
  transition:transform 220ms ease,border-color 220ms ease,box-shadow 220ms ease;
}
.card:hover,.sec:hover,.kpi:hover,.stat:hover,.tile:hover{transform:translateY(-2px);border-color:var(--color-primary);box-shadow:0 2px 0 rgba(13,148,136,.10),0 12px 28px rgba(15,78,74,.10)}
.card,.sec{padding:15px;min-width:0}
.sec{margin-bottom:12px}
.sec>h3,.card-h h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:7px;color:#123F3B}
.sec>h3{margin-bottom:11px}
.sec>h3 .material-symbols-outlined,.card-h h3 .material-symbols-outlined{font-size:18px;color:var(--color-primary)}
.sec>p{margin:0 0 12px;font-size:12px;color:var(--muted);line-height:1.7}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px;flex-wrap:wrap}
.card-h .hint{font-family:"Noto Sans TC",sans-serif;font-size:10.5px;color:var(--muted);letter-spacing:.025em}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:8px 17px;margin:0;font-size:13px}
.dl dt{color:var(--muted);font-size:11.5px;font-weight:600}
.dl dd{margin:0;line-height:1.7}

.kpi,.stat{position:relative;overflow:hidden;min-width:0;padding:14px 15px}
.kpi::before,.tile::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--color-primary),var(--color-secondary))}
.kpi::after{content:"";position:absolute;right:-26px;top:-26px;width:78px;height:78px;border-radius:50%;background:#CCFBF1;opacity:.58}
.kpi .ico,.tile .ti{
  width:35px;height:35px;position:relative;z-index:1;
  display:flex;align-items:center;justify-content:center;
  color:#086B63;background:#D4FAF3;
  border:1px solid #99E6DC;border-radius:4px;
}
.kpi .ico .material-symbols-outlined,.tile .ti .material-symbols-outlined{font-size:19px}
.kpi .lbl,.stat .lbl{display:flex;align-items:center;gap:5px;margin-top:9px;color:var(--muted);font-family:"Noto Sans TC",sans-serif;font-size:10.5px;font-weight:600}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{font-size:15px;color:var(--color-primary)}
.kpi .val,.stat .val,.tile .tv{
  margin-top:2px;color:#103F3B;
  font-family:"Cinzel","Noto Sans TC",serif;
  font-size:25px;font-weight:600;letter-spacing:-.035em;
  font-variant-numeric:tabular-nums lining-nums;
}
.kpi .val small,.stat .val small{margin-left:3px;color:var(--muted);font-family:"Noto Sans TC",sans-serif;font-size:11px;font-weight:600;letter-spacing:0}
.kpi .delta,.stat .d{display:inline-flex;align-items:center;gap:3px;margin-top:4px;font-family:"Noto Sans TC",sans-serif;font-size:10.5px;font-weight:700}
.delta.up,.d.up{color:#146C35}.delta.down,.d.down{color:#B91C1C}.delta.flat,.d.flat{color:#475569}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:14px}

.card.pad0>.card-h{padding:14px 15px 0}
table{width:100%;border-collapse:separate;border-spacing:0;font-family:"Noto Sans TC",sans-serif;font-size:11.5px;font-variant-numeric:tabular-nums lining-nums}
th{padding:9px 12px;text-align:left;white-space:nowrap;color:#315E5A;background:var(--th);border-top:1px solid #C9ECE7;border-bottom:1px solid var(--line);font-size:10px;font-weight:700;letter-spacing:.045em}
td{padding:9px 12px;white-space:nowrap;color:#234D49;background:#FFFFFF;border-bottom:1px solid #D8EFEC}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--hov)}
th:last-child,td:last-child{text-align:right}
td b{color:#0C3E3A}
.mono,td:first-child,td:nth-child(2){font-family:"Cinzel","Noto Sans TC",monospace;font-weight:600;letter-spacing:.015em;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1px solid currentColor;border-radius:999px;font-size:10px;font-weight:700;line-height:1.25;white-space:nowrap}
.t-ok{background:#ECFDF3;color:#166534}.t-warn{background:#FFF7E6;color:#92400E}.t-bad{background:#FEF2F2;color:#B91C1C}.t-info{background:#EFF6FF;color:#075985}.t-gray{background:#F1F5F9;color:#475569}.t-acc,.t-pink{background:#CCFBF1;color:#0F766E}

.bar{height:7px;min-width:56px;overflow:hidden;border-radius:2px;background:var(--track)}
.bar>i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--color-primary),var(--color-secondary))}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{width:38px;flex:none;text-align:right;color:var(--muted);font-family:"Cinzel",serif;font-size:10px;font-weight:600;font-variant-numeric:tabular-nums}

.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:1px;background:var(--line)}
.tl-item,.tl-i{position:relative;padding:0 0 15px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;left:-22px;top:3px;width:12px;height:12px;border-radius:50%;background:#FFFFFF;border:3px solid var(--color-primary);box-shadow:0 0 0 2px #CCFBF1}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font-family:"Cinzel",serif;font-size:10px;font-weight:600;font-variant-numeric:tabular-nums}
.tl-item b,.tl-i b{display:block;margin:1px 0;font-size:13px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:11px}

.chk{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px dashed #B7DDD8;font-size:12px}
.chk:last-child{border-bottom:none}
.chk .material-symbols-outlined{font-size:18px}
.chk .ok{color:var(--ok)}.chk .wait{color:#64748B}.chk .bad{color:var(--bad)}.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}.chk small{color:var(--muted);font-size:10.5px}
.note{margin-top:12px;padding-top:11px;border-top:1px dashed #B7DDD8;color:var(--muted);font-size:11px;line-height:1.65}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
.board>*{min-width:0}
.col{display:flex;flex-direction:column;gap:8px;padding:10px;background:#E9F8F5;border:1px solid var(--line);border-radius:6px}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 3px 5px;font-size:13px;font-weight:700}
.col-h .cnt{padding:1px 8px;color:var(--muted);background:#FFFFFF;border:1px solid var(--line);border-radius:999px;font-family:"Cinzel",serif;font-size:10px}
.pcard{padding:10px 11px;background:#FFFFFF;border:1px solid #BFE4DF;border-left:3px solid var(--color-primary);border-radius:4px;box-shadow:0 2px 7px rgba(15,78,74,.05);transition:transform 200ms ease,border-color 200ms ease}
.pcard:hover{transform:translateX(2px);border-color:var(--color-primary)}
.pcard b{font-size:13px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;color:var(--muted);font-size:10.5px}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:7px;color:var(--ink);font-size:10.5px}
.mini-av,.av{display:inline-flex;align-items:center;justify-content:center;flex:none;color:#0F766E;background:#CCFBF1;border:1px solid #99E6DC;font-weight:800}
.mini-av{width:18px;height:18px;border-radius:3px;font-size:9px}
.av{width:26px;height:26px;border-radius:4px;font-size:10px}
.who{display:inline-flex;align-items:center;gap:6px}

.lane{display:flex;flex-direction:column;gap:9px}
.lane-row{display:flex;align-items:center;gap:12px;min-width:0;padding:10px 12px;background:#FFFFFF;border:1px solid var(--line);border-radius:5px}
.lane-row .num{width:29px;height:29px;display:flex;align-items:center;justify-content:center;flex:none;color:#065F57;background:#CCFBF1;border:1px solid #99E6DC;border-radius:3px;font-family:"Cinzel",serif;font-weight:600;font-size:12px}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:14px}
.lane-row .body p{margin:1px 0 0;color:var(--muted);font-size:11px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{width:21px;height:21px;z-index:1;display:flex;align-items:center;justify-content:center;color:#64748B;background:#FFFFFF;border:2px solid #B7D8D4;border-radius:50%;font-family:"Cinzel",serif;font-size:10px}
.steps .ln{width:18px;height:2px;background:#B7D8D4}
.steps .s.done{color:#FFFFFF;background:var(--color-primary);border-color:var(--color-primary)}
.steps .s.cur{color:#075E57;border-color:var(--color-primary);box-shadow:0 0 0 3px #CCFBF1;animation:pulse 1.6s ease-in-out infinite}
.steps .ln.done{background:var(--color-primary)}

.rep-row{display:flex;align-items:center;gap:12px;min-width:0;padding:10px 3px;border-bottom:1px dashed #B7DDD8}
.rep-row:last-child{border-bottom:none}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:13px}
.rep-row .sku span{color:var(--muted);font-size:10.5px}
.gauge{width:108px;flex:none}
.gauge .track{height:7px;position:relative;overflow:hidden;border-radius:2px;background:var(--track)}
.gauge .track i{display:block;height:100%;border-radius:2px;background:var(--color-primary)}
.gauge small{display:block;margin-top:2px;text-align:right;color:var(--muted);font-family:"Cinzel",serif;font-size:9.5px;font-variant-numeric:tabular-nums}
.band{position:relative;height:24px;min-width:150px;border-radius:3px;background:var(--track)}
.band .rng{position:absolute;top:0;bottom:0;border-radius:3px;background:#99F6E4}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:#475569}
.band .me{position:absolute;top:3px;width:11px;height:18px;border-radius:2px;background:var(--color-accent);box-shadow:0 2px 5px rgba(180,83,9,.25)}

.tile{position:relative;display:flex;flex-direction:column;gap:6px;min-width:0;padding:14px 15px;overflow:hidden}
.tile b{font-size:15px;font-weight:700;color:#123F3B}
.tile p{margin:0;color:var(--muted);font-family:"Noto Sans TC",sans-serif;font-size:10.5px;line-height:1.55}
.tile .tv{font-size:23px}

.apexcharts-text,.apexcharts-legend-text{font-family:"Noto Sans TC",sans-serif!important;fill:#475569!important;color:#475569!important}
.apexcharts-gridline{stroke:#D8EFEC!important}
.apexcharts-tooltip{border:1px solid var(--line)!important;border-radius:4px!important;box-shadow:var(--shadow)!important}
.apexcharts-tooltip-title{background:#E7F8F5!important;border-bottom:1px solid var(--line)!important}

@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sidebar{padding-inline:20px}
  .main{padding-inline:22px}
}
@media(max-width:900px){
  .sidebar{height:auto;min-height:68px;flex-wrap:wrap;gap:8px 14px;padding:10px 16px}
  .brand{height:42px}
  .nav{width:100%;order:2}
  .nav button{min-height:40px;padding:8px 11px}
  .nav button.on::after{bottom:-7px}
}
@media(max-width:820px){
  .g2,.g3,.g23,.g32{grid-template-columns:1fr}
  .main{padding:18px 16px 42px}
  .topbar{align-items:flex-start}
}
@media(max-width:700px){
  .dl{grid-template-columns:1fr;gap:2px 0}
  .dl dt{margin-top:8px}
}
@media(max-width:560px){
  .brand-txt span{display:none}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .board{grid-template-columns:1fr}
  .nav button .txt{display:none}
  .nav button{padding-inline:12px}
  .topbar h1{font-size:21px}
  .top-right{width:100%}
  .chip{flex:1;justify-content:center}
  .tile{padding:12px}
  .tile .tv{font-size:20px}
}
@media(max-width:375px){
  .main{padding-inline:12px}
  .g4{grid-template-columns:1fr}
  .chip{width:100%}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}

  return '<div class="kpi"><div class="ico"><span class="material-symbols-outlined">'+k.ico+'</span></div>'+
   '<div class="lbl">'+esc(k.lbl)+'</div><div class="val">'+k.val+(k.u?'<small>'+k.u+'</small>':'')+'</div>'+
   '<div class="delta '+k.cls+'"><span class="material-symbols-outlined">'+ic+'</span>'+esc(k.d)+'</div></div>'}).join("")+'</div>'}

function tbl(h,r){return '<div style="overflow-x:auto"><table><thead><tr>'+h.map(function(x){return '<th>'+esc(x)+'</th>'}).join("")+
 '</tr></thead><tbody>'+r.map(function(x){return '<tr>'+x.map(function(c,i){return '<td'+(i===0?' class="mono"':'')+'>'+c+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div>'}
