<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>預算管理系統（Budget Management System）｜Jvision 系統 Demo</title>
  <meta name="description" content="年度預算編列、部門專案分配、預實差異分析與動支控管的單一平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
:root{
  --color-primary:#0F172A;
  --color-on-primary:#FFFFFF;
  --color-secondary:#1E293B;
  --color-on-secondary:#FFFFFF;
  --color-accent:#22C55E;
  --color-on-accent:#0F172A;
  --color-background:#020617;
  --color-foreground:#F8FAFC;
  --color-card:#0E1223;
  --color-card-foreground:#F8FAFC;
  --color-muted:#1A1E2F;
  --color-muted-foreground:#94A3B8;
  --color-border:#334155;
  --color-destructive:#EF4444;
  --color-on-destructive:#000000;
  --color-ring:#FFFFFF;

  --blue:#22C55E;
  --ink:#F8FAFC;
  --muted:#A8B5C7;
  --line:#334155;

  --accent:var(--color-accent);
  --accent2:#86EFAC;
  --bg:var(--color-background);
  --card:var(--color-card);
  --soft:var(--color-muted);
  --ok:#4ADE80;
  --warn:#FBBF24;
  --bad:#F87171;
  --info:#60A5FA;
  --shadow:8px 8px 0 #000000;
}

*{box-sizing:border-box}
html{color-scheme:dark;scrollbar-gutter:stable}
html,body{margin:0;padding:0;min-width:0}
body{
  min-height:100vh;
  overflow-x:hidden;
  font-family:"Fira Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);
  background-color:var(--bg);
  background-image:
    linear-gradient(rgba(51,65,85,.18) 1px,transparent 1px),
    linear-gradient(90deg,rgba(51,65,85,.18) 1px,transparent 1px);
  background-size:32px 32px;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,a{cursor:pointer}
a{color:inherit;text-decoration:none}
::selection{color:#020617;background:#86EFAC}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}

:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:30;
  color:var(--color-on-primary);
  background:#020617;
  border-bottom:3px solid var(--accent);
}
.topbar-inner{
  width:min(100%,1440px);
  min-height:76px;
  margin:0 auto;
  padding:0 20px;
  display:flex;
  align-items:stretch;
  gap:24px;
  min-width:0;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:270px;
  padding:10px 18px 10px 0;
  border-right:1px solid var(--line);
}
.brand .logo{
  width:44px;
  height:44px;
  flex:0 0 44px;
  display:grid;
  place-items:center;
  color:var(--color-on-accent);
  background:var(--accent);
  border:2px solid var(--accent);
  border-radius:0;
  font-size:25px;
}
.brand h1{
  margin:0;
  font-size:17px;
  font-weight:700;
  line-height:1.2;
  letter-spacing:.02em;
}
.brand p{
  margin:4px 0 0;
  color:#CBD5E1;
  font-family:"Fira Code",monospace;
  font-size:10px;
  line-height:1.35;
  letter-spacing:.02em;
}
.nav{
  min-width:0;
  margin-left:auto;
  display:flex;
  align-items:stretch;
  flex-wrap:nowrap;
  overflow-x:auto;
}
.nav button{
  min-width:92px;
  min-height:56px;
  padding:10px 14px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  border:0;
  border-left:1px solid var(--line);
  border-radius:0;
  color:#CBD5E1;
  background:transparent;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
  transition:background-color .18s ease,color .18s ease;
}
.nav button:last-child{border-right:1px solid var(--line)}
.nav button:hover{color:#FFFFFF;background:#1E293B}
.nav button.on{
  position:relative;
  color:var(--color-on-accent);
  background:var(--accent);
}
.nav button.on::after{
  content:"ACTIVE";
  position:absolute;
  right:4px;
  bottom:2px;
  font-family:"Fira Code",monospace;
  font-size:7px;
  letter-spacing:.08em;
}
.nav button .material-symbols-outlined{font-size:19px}

.wrap{
  width:min(100%,1440px);
  margin:0 auto;
  padding:32px 20px 64px;
  min-width:0;
}
.screen-head{
  position:relative;
  min-width:0;
  margin-bottom:20px;
  padding:22px 20px 20px 28px;
  display:flex;
  align-items:flex-end;
  gap:16px;
  flex-wrap:wrap;
  background:#070B17;
  border:1px solid var(--line);
  border-left:8px solid var(--accent);
}
.screen-head::before{
  content:"BUDGET / FY2026";
  position:absolute;
  top:7px;
  right:10px;
  color:#64748B;
  font-family:"Fira Code",monospace;
  font-size:9px;
  font-weight:600;
  letter-spacing:.12em;
}
.screen-head .st{min-width:0;flex:1}
.screen-head h2{
  margin:0;
  display:flex;
  align-items:center;
  gap:10px;
  font-size:clamp(22px,3vw,32px);
  line-height:1.15;
  font-weight:700;
  letter-spacing:-.025em;
}
.screen-head h2 .material-symbols-outlined{
  color:var(--accent);
  font-size:30px;
}
.screen-head .sub{
  max-width:800px;
  margin:8px 0 0;
  color:#A8B5C7;
  font-size:13px;
  line-height:1.6;
}
.pill{
  margin-left:auto;
  padding:8px 12px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:#E2E8F0;
  background:#0F172A;
  border:1px solid #64748B;
  border-radius:0;
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:600;
  white-space:nowrap;
}
.pill .dot{
  width:9px;
  height:9px;
  background:var(--accent);
  border:2px solid #020617;
  outline:1px solid var(--accent);
  border-radius:0;
}

.grid{display:grid;gap:16px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(300px,1fr)}
.g32{grid-template-columns:minmax(0,1.4fr) minmax(320px,1fr)}

.card,.kpi{
  min-width:0;
  color:var(--color-card-foreground);
  background:var(--card);
  border:1px solid var(--line);
  border-radius:0;
  box-shadow:var(--shadow);
}
.card{padding:18px}
.card h3{
  min-height:28px;
  margin:0 0 16px;
  padding-bottom:10px;
  display:flex;
  align-items:center;
  gap:8px;
  border-bottom:1px solid var(--line);
  font-size:14px;
  font-weight:700;
  letter-spacing:.01em;
}
.card h3 .material-symbols-outlined{color:var(--accent);font-size:20px}
.card .cap{
  margin-left:auto;
  color:#A8B5C7;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:500;
}

.kpi{
  position:relative;
  isolation:isolate;
  min-height:142px;
  padding:17px 18px 15px;
  overflow:hidden;
}
.kpi::before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  z-index:-1;
  width:5px;
  background:var(--accent);
}
.kpi::after{
  content:"";
  position:absolute;
  right:-20px;
  bottom:-26px;
  z-index:-1;
  width:82px;
  height:82px;
  background:transparent;
  border:12px solid rgba(51,65,85,.42);
  border-radius:0;
  transform:rotate(18deg);
}
.kpi .kt{
  position:relative;
  display:flex;
  align-items:center;
  gap:7px;
  color:#B7C3D2;
  font-size:12px;
  font-weight:600;
}
.kpi .kt .material-symbols-outlined{color:var(--accent);font-size:18px}
.kpi .kv{
  position:relative;
  margin:14px 0 8px;
  color:#FFFFFF;
  font-family:"Fira Code",monospace;
  font-size:clamp(21px,2.2vw,29px);
  line-height:1.1;
  font-weight:700;
  letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;
}
.kpi .kd{
  position:relative;
  display:flex;
  align-items:center;
  gap:5px;
  font-size:11px;
  font-weight:700;
}
.kpi .kd .material-symbols-outlined{font-size:15px}
.up{color:#FCA5A5}
.down{color:#86EFAC}
.flat{color:#CBD5E1}

.chartbox{width:100%;height:280px;min-width:0;overflow:hidden;background:#F8FAFC;border:1px solid #64748B}
.chartbox.sm{height:230px}

.tw{
  width:100%;
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:0;
  scrollbar-color:#64748B #0F172A;
}
table{
  width:100%;
  min-width:520px;
  border-collapse:collapse;
  color:#E2E8F0;
  font-size:13px;
}
th{
  padding:11px 12px;
  text-align:left;
  color:#FFFFFF;
  background:#1E293B;
  border-right:1px solid #475569;
  border-bottom:2px solid var(--accent);
  font-size:11px;
  font-weight:700;
  line-height:1.35;
  letter-spacing:.06em;
  text-transform:uppercase;
  white-space:nowrap;
}
th:last-child{border-right:0}
td{
  padding:11px 12px;
  color:#DCE4EE;
  border-right:1px solid rgba(51,65,85,.7);
  border-bottom:1px solid var(--line);
  line-height:1.4;
  white-space:nowrap;
}
td:last-child{border-right:0}
tbody tr:last-child td{border-bottom:0}
tbody tr{background:#0E1223;transition:background-color .16s ease}
tbody tr:nth-child(even){background:#11182A}
tbody tr:hover{background:#1A2438}
td:first-child,td b,.num{
  font-variant-numeric:tabular-nums;
}
td:first-child,.num{font-family:"Fira Code",monospace}
.num{text-align:right;font-weight:600}

.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:25px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:0;
  font-size:11px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
}
.t-ok{color:#86EFAC;background:#102B20}
.t-warn{color:#FDE68A;background:#33270B}
.t-bad{color:#FCA5A5;background:#3A1118}
.t-info{color:#93C5FD;background:#102440}
.t-mut{color:#CBD5E1;background:#1E293B}

.bar{
  height:10px;
  min-width:80px;
  overflow:hidden;
  background:#020617;
  border:1px solid #475569;
  border-radius:0;
}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:0}
.bar.warn>i{background:repeating-linear-gradient(135deg,#FBBF24 0 6px,#78350F 6px 10px)}
.bar.bad>i{background:repeating-linear-gradient(135deg,#EF4444 0 6px,#7F1D1D 6px 10px)}

.board{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
  min-width:0;
}
.col{
  min-width:0;
  padding:10px;
  background:#080D1A;
  border:1px solid #475569;
  border-radius:0;
}
.col .ch{
  margin-bottom:10px;
  padding-bottom:9px;
  display:flex;
  align-items:center;
  gap:7px;
  border-bottom:2px solid var(--accent);
  font-size:12px;
  font-weight:700;
}
.col .ch .cnt{
  margin-left:auto;
  padding:2px 7px;
  color:#FFFFFF;
  background:#1E293B;
  border:1px solid #64748B;
  border-radius:0;
  font-family:"Fira Code",monospace;
  font-size:10px;
}
.tk{
  margin-bottom:9px;
  padding:10px;
  background:#121A2D;
  border:1px solid var(--line);
  border-left:4px solid var(--accent);
  border-radius:0;
}
.tk:last-child{margin-bottom:0}
.tk .tt{margin-bottom:7px;font-size:12px;font-weight:700;line-height:1.4}
.tk .tm{
  display:flex;
  justify-content:space-between;
  gap:6px;
  flex-wrap:wrap;
  color:#A8B5C7;
  font-family:"Fira Code",monospace;
  font-size:10px;
}

.tl{position:relative;padding-left:8px}
.tl .it{
  position:relative;
  padding:0 0 18px 27px;
  border-left:2px solid #475569;
}
.tl .it:last-child{border-left-color:transparent;padding-bottom:0}
.tl .it .mk{
  position:absolute;
  top:1px;
  left:-8px;
  width:14px;
  height:14px;
  background:#020617;
  border:3px solid #94A3B8;
  border-radius:0;
}
.tl .it.done .mk{background:var(--accent);border-color:var(--accent)}
.tl .it .th{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;line-height:1.4}
.tl .it .tsub{margin-top:4px;color:#A8B5C7;font-size:11px;line-height:1.45}
.tl .it .ttime{margin-top:3px;color:#86EFAC;font-family:"Fira Code",monospace;font-size:10px;font-weight:600}

.flowbar{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:0;
  margin-bottom:18px;
  border:1px solid var(--line);
}
.flowbar .fi{
  min-width:0;
  min-height:68px;
  padding:10px 11px;
  display:flex;
  align-items:center;
  gap:9px;
  color:#DCE4EE;
  background:#0E1223;
  border:0!important;
  border-right:1px solid var(--line)!important;
  border-radius:0!important;
  box-shadow:none!important;
}
.flowbar .fi:last-child{border-right:0!important}
.flowbar .fi:has(.n[style]){background:#17231D}
.flowbar .fi .n{
  width:27px;
  height:27px;
  flex:0 0 27px;
  display:grid;
  place-items:center;
  color:#CBD5E1;
  background:#020617;
  border:1px solid #64748B;
  border-radius:0;
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:700;
}
.flowbar .fi .n[style]{color:#020617!important;background:var(--accent)!important;border-color:var(--accent)}
.flowbar .ft{font-size:12px;font-weight:700}
.flowbar .fr{margin-top:3px;color:#94A3B8;font-size:10px}

.listrow{
  min-width:0;
  padding:11px 0;
  display:flex;
  align-items:center;
  gap:11px;
  border-bottom:1px solid var(--line);
}
.listrow:last-child{border-bottom:0}
.listrow .ico{
  width:36px;
  height:36px;
  flex:0 0 36px;
  display:grid;
  place-items:center;
  color:#020617;
  background:var(--accent);
  border-radius:0;
}
.listrow .li{min-width:0;flex:1}
.listrow .li .a{font-size:13px;font-weight:700;line-height:1.4}
.listrow .li .b{margin-top:3px;color:#A8B5C7;font-size:11px;line-height:1.4}

.seg{display:inline-flex;gap:0;padding:0;background:#020617;border:1px solid var(--line);border-radius:0}
.seg span{padding:5px 11px;color:#A8B5C7;border-right:1px solid var(--line);border-radius:0;font-size:11px;font-weight:700}
.seg span:last-child{border-right:0}
.seg span.on{color:#020617;background:var(--accent)}

.foot{
  margin-top:34px;
  padding:14px;
  color:#A8B5C7;
  background:#080D1A;
  border:1px solid var(--line);
  text-align:center;
  font-family:"Fira Code",monospace;
  font-size:10px;
  line-height:1.6;
}
.foot b{color:#86EFAC}

#screen>.screen-head,
#screen>.grid,
#screen>.flowbar,
#screen>.card{
  animation:ledger-in .4s cubic-bezier(.2,.9,.25,1.25) both;
}
#screen>.grid:nth-of-type(2),#screen>.card:nth-of-type(2){animation-delay:.06s}
#screen>.grid:nth-of-type(3),#screen>.card:nth-of-type(3){animation-delay:.12s}
@keyframes ledger-in{
  from{opacity:0;transform:translateY(16px) scale(.98)}
  to{opacity:1;transform:none}
}

@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .topbar-inner{padding-right:0}
  .brand{min-width:240px}
  .nav button{min-width:76px;padding-inline:10px}
}

@media(max-width:820px){
  .topbar{position:relative}
  .topbar-inner{padding:0;display:block}
  .brand{min-width:0;padding:12px 16px;border-right:0;border-bottom:1px solid var(--line)}
  .nav{width:100%;margin:0;display:grid;grid-template-columns:repeat(6,minmax(70px,1fr));overflow-x:auto}
  .nav button{min-width:70px;min-height:58px;padding:8px 6px;border-left:0;border-right:1px solid var(--line)}
  .wrap{padding:20px 14px 48px}
  .g2,.g23,.g32{grid-template-columns:1fr}
  .flowbar{grid-template-columns:repeat(5,minmax(125px,1fr));overflow-x:auto}
  .screen-head{padding:24px 16px 17px 20px}
  .screen-head::before{right:7px}
}

@media(max-width:560px){
  .brand .logo{width:40px;height:40px;flex-basis:40px}
  .nav button .lbl{display:block;font-size:10px}
  .nav button{flex-direction:column;gap:4px}
  .nav button.on::after{display:none}
  .wrap{padding-inline:10px}
  .screen-head{display:block;border-left-width:5px}
  .screen-head h2{align-items:flex-start;font-size:22px}
  .screen-head .sub{font-size:12px}
  .pill{margin-top:14px;margin-left:0}
  .g4,.g3{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .card{padding:13px;box-shadow:5px 5px 0 #000}
  .kpi{min-height:130px;box-shadow:5px 5px 0 #000}
  .chartbox{height:250px}
  .chartbox.sm{height:220px}
  .listrow{align-items:flex-start}
  .tag{flex:0 0 auto}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    animation-delay:0ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  #screen>.screen-head,#screen>.grid,#screen>.flowbar,#screen>.card{
    opacity:1!important;
    transform:none!important;
  }
}
</style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="logo material-symbols-outlined">savings</div>
        <div>
          <h1>預算管理系統</h1>
          <p>Budget Management System · 財務會計</p>
        </div>
      </div>
      <div class="nav" id="nav"></div>
    </div>
  </div>
  <div class="wrap"><div id="screen"></div>
    <div class="foot">此為純前端展示頁，所有數字為 <b>模擬資料</b>。財年 FY2026 · 幣別 新台幣（仟元）</div>
  </div>

  <script>
  (function(){
    "use strict";
    var fmt = function(n){ return (n||0).toLocaleString("en-US"); };
    var pct = function(n){ return (Math.round(n*10)/10) + "%"; };
    var charts = [];
    function disposeCharts(){
      for(var i=0;i<charts.length;i++){ try{ charts[i].dispose(); }catch(e){} }
      charts = [];
    }
    function mk(id, opt){
      var el = document.getElementById(id);
      if(!el) return;
      var c = echarts.init(el);
      c.setOption(opt);
      charts.push(c);
    }
    var palette = ["#db2777","#f472b6","#fbcfe8","#9d174d","#f9a8d4","#be185d"];
    function baseGrid(){ return {left:8,right:14,top:24,bottom:8,containLabelLabel:true,containLabel:true}; }

    var NAV = [
      {icon:"dashboard",label:"總覽"},
      {icon:"description",label:"編列"},
      {icon:"account_tree",label:"分配"},
      {icon:"checklist",label:"審核"},
      {icon:"insights",label:"差異"},
      {icon:"rule",label:"控管"}
    ];

      h += '<div class="card"><h3><span class="material-symbols-outlined">waterfall_chart</span>科目差異瀑布<span class="cap">仟元</span></h3><div id="c4a" class="chartbox"></div></div>';
      h += '<div class="card"><h3><span class="material-symbols-outlined">show_chart</span>累計差異率趨勢</h3><div id="c4b" class="chartbox"></div></div>';
      h += '</div>';

      h += '<div class="card" style="margin-top:14px"><h3><span class="material-symbols-outlined">query_stats</span>部門差異明細</h3><div class="tw"><table><thead><tr>'+
           '<th>部門</th><th class="num">預算</th><th class="num">實際</th><th class="num">差異</th><th class="num">差異率</th><th>判定</th><th>主要原因</th></tr></thead><tbody>';
      var reasons=["委外加工超量","產線試量產耗材","檢測外包減少","差旅與展會超支","人力精簡節省","雲端授費調降"];
      for(var i=0;i<DEPTS.length;i++){
        var d=DEPTS[i]; var diff=d.a-d.b; var r=Math.round(diff/d.b*1000)/10;
        var bad=diff>0;
        h += '<tr><td><b>'+d.d+'</b></td><td class="num">'+fmt(d.b)+'</td><td class="num">'+fmt(d.a)+'</td>'+
             '<td class="num" style="color:'+(bad?"var(--bad)":"var(--ok)")+'">'+(diff>0?"+":"")+fmt(diff)+'</td>'+
             '<td class="num" style="color:'+(bad?"var(--bad)":"var(--ok)")+'">'+(r>0?"+":"")+r+'%</td>'+
             '<td><span class="tag '+(Math.abs(r)>5?(bad?"t-bad":"t-ok"):"t-warn")+'">'+(bad?"不利":"有利")+'</span></td>'+
             '<td style="color:var(--muted);font-size:12px">'+reasons[i]+'</td></tr>';
      }
      h += '</tbody></table></div></div>';
      return h;
    }

        series:[
          {type:"bar",stack:"t",itemStyle:{color:"transparent"},data:[0,236000,238400,240900,243100,240900,0]},

        ]

        grid:baseGrid(),tooltip:{trigger:"axis",valueFormatter:function(v){return v+"%";}},
        xAxis:{type:"category",data:mon,axisLabel:{fontSize:10}},
        yAxis:{type:"value",axisLabel:{fontSize:10,formatter:"{value}%"}},
        series:[{type:"line",smooth:true,data:[-0.8,0.4,1.1,1.9,2.3,2.0,2.4,2.8,2.6],
          areaStyle:{color:"rgba(219,39,119,.12)"},itemStyle:{color:"#db2777"},lineStyle:{color:"#db2777"},
          markLine:{silent:true,symbol:"none",lineStyle:{color:"#d97706",type:"dashed"},data:[{yAxis:5,label:{formatter:"上限 +5%",fontSize:10}}]}

    /* ---------- screen 5 : 預算控管與追加 ---------- */
    var CTRL=[
      {no:"AP-20260813-07",d:"製造處",it:"原物料採購",amt:2400,rate:"103.4%",st:"攔截待簽",own:"陳建宏"},
      {no:"AP-20260812-31",d:"業務處",it:"展會行銷費",amt:1100,rate:"105.9%",st:"追加審核",own:"張家豪"},
      {no:"AP-20260811-15",d:"研發處",it:"委外試作費",amt:800, rate:"92.0%", st:"已核准",own:"林孟潔"},
      {no:"AP-20260810-04",d:"資訊處",it:"軟體授權費",amt:-600,rate:"76.8%",st:"追減核准",own:"李冠廷"},
      {no:"AP-20260809-22",d:"品保處",it:"檢測外包",amt:9800,rate:"72.4%",st:"待財務核決",own:"黃詩涵"}
    ];
    function s5(){
      var h="";
      h += head("rule","預算控管與追加","動支控管、超支攔截與追加減預算流程，回饋至總覽儀表板","即時攔截");
      h += flowbar(4);
      h += '<div class="grid g4">';
      h += kpi("block","本月攔截筆數","3 筆","逾額動支自動擋下","up","已攔截","gpp_maybe");
      h += kpi("post_add","追加申請","NT$ 3,500 仟","2 案審核中","flat","待核決","pending");
      h += kpi("remove_circle","追減釋出","NT$ 600 仟","授權費調降","down","釋出","recycling");
      h += kpi("verified_user","控管規則","3 條生效","額度/憑證/授權","flat","啟用","policy");
      h += '</div>';

      h += '<div class="grid g32" style="margin-top:14px">';
      h += '<div class="card"><h3><span class="material-symbols-outlined">receipt_long</span>動支控管單</h3><div class="tw"><table><thead><tr>'+
           '<th>單號</th><th>部門</th><th>科目</th><th class="num">追加/減</th><th class="num">動用率</th><th>狀態</th></tr></thead><tbody>';
      for(var i=0;i<CTRL.length;i++){
        var c=CTRL[i];
        var scls=c.st==="已核准"||c.st==="追減核准"?"t-ok":(c.st==="攔截待簽"?"t-bad":"t-info");
        h += '<tr><td><b>'+c.no+'</b></td><td>'+c.d+'</td><td>'+c.it+'</td>'+
             '<td class="num" style="color:'+(c.amt<0?"var(--ok)":"var(--bad)")+'">'+(c.amt>0?"+":"")+fmt(c.amt)+'</td>'+
             '<td class="num">'+c.rate+'</td><td><span class="tag '+scls+'">'+c.st+'</span></td></tr>';
      }
      h += '</tbody></table></div>';
      h += '<div style="margin-top:12px;font-size:12px;color:var(--muted)"><b style="color:var(--accent)">生效規則：</b>RULE-01 逾額動支自動攔截 · RULE-02 超授權額度須財務覆核 · RULE-03 缺憑證不得入帳</div>';
      h += '</div>';
      h += '<div class="card"><h3><span class="material-symbols-outlined">radar</span>各部門動支健康度</h3><div id="c5a" class="chartbox"></div></div>';
      h += '</div>';

      h += '<div class="card" style="margin-top:14px"><h3><span class="material-symbols-outlined">bar_chart</span>剩餘可動支額度</h3><div id="c5b" class="chartbox sm"></div></div>';
      return h;
    }
    function draw5(){
      mk("c5a",{
        tooltip:{},radar:{radius:"62%",center:["50%","52%"],
          indicator:[
            {name:"研發處",max:100},{name:"製造處",max:100},{name:"品保處",max:100},
            {name:"業務處",max:100},{name:"行政處",max:100},{name:"資訊處",max:100}
          ],axisName:{fontSize:11,color:"#8b6b7d"}},
        series:[{type:"radar",areaStyle:{color:"rgba(219,39,119,.15)"},lineStyle:{color:"#db2777"},itemStyle:{color:"#db2777"},
          data:[{value:[85,58,72,52,91,79],name:"動支健康度"}]}]
      });
      var rem=DEPTS.map(function(x){return Math.max(x.b-x.a,0);});
      mk("c5b",{
        grid:baseGrid(),tooltip:{trigger:"axis"},
        xAxis:{type:"category",data:DEPTS.map(function(x){return x.d;}),axisLabel:{fontSize:11,interval:0}},
        yAxis:{type:"value",axisLabel:{fontSize:10}},
        series:[{type:"bar",data:DEPTS.map(function(x,i){
            var r=x.b-x.a;
            return {value:Math.max(r,0),itemStyle:{color:r<=0?"#fca5a5":(r<x.b*0.1?"#fbbf24":"#db2777"),borderRadius:[4,4,0,0]}};
          }),barWidth:"48%"}]
      });
    }

    function flowbar(active){
      var st=[
        {t:"編列草案",r:"會計專員"},
        {t:"部門分配",r:"會計專員"},
        {t:"協調審核",r:"財務經理"},
        {t:"差異分析",r:"財務經理"},
        {t:"控管追加",r:"負責人"}
      ];
      var h='<div class="flowbar">';
      for(var i=0;i<st.length;i++){
        var on=i===active;
        h+='<div class="fi" style="'+(on?"border-color:var(--accent);box-shadow:0 4px 12px rgba(219,39,119,.14)":"")+'">'+
           '<div class="n" style="'+(on?"background:var(--accent);color:#fff":"")+'">'+(i+1)+'</div>'+
           '<div><div class="ft">'+st[i].t+'</div><div class="fr">'+st[i].r+'</div></div></div>';
      }
      return h+'</div>';
    }

    var RENDER=[s0,s1,s2,s3,s4,s5];
    var DRAW=[draw0,draw1,draw2,draw3,draw4,draw5];
    function draw3(){}

    function show(i){
      var container=document.getElementById("screen");
      disposeCharts();
      nav(i);
      container.innerHTML=RENDER[i]();
      void container.offsetHeight;
      if(DRAW[i]) DRAW[i]();
    }

    window.__show=show;
    function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
    window.addEventListener("hashchange",fromHash);fromHash();
  })();
  </script>
