<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>學生學習支持平台｜Jvision 系統 Demo</title>
<meta name="description" content="課程、學員、測驗到學習進度的教學管理" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Comic+Neue:wght@300;400;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#4F46E5;
  --color-on-primary:#FFFFFF;
  --color-secondary:#818CF8;
  --color-on-secondary:#0F172A;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#EEF2FF;
  --color-foreground:#1E1B4B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E1B4B;
  --color-muted:#EBEEF8;
  --color-muted-foreground:#475569;
  --color-border:#C7D2FE;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#4F46E5;

  --blue:#4F46E5;
  --ink:#1E1B4B;
  --muted:#475569;
  --line:#C7D2FE;

  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#4338CA;
  --radius-sm:14px;
  --radius:20px;
  --radius-lg:26px;
  --border:3px solid var(--color-border);
  --shadow:0 7px 0 rgba(79,70,229,.14),0 14px 28px rgba(30,27,75,.08);
  --shadow-sm:0 4px 0 rgba(79,70,229,.12),0 8px 18px rgba(30,27,75,.07);
  --shadow-orange:0 6px 0 #C2410C,0 12px 22px rgba(234,88,12,.22);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  background:
    radial-gradient(circle at 8% 8%,rgba(129,140,248,.22),transparent 24rem),
    radial-gradient(circle at 94% 22%,rgba(234,88,12,.09),transparent 20rem),
    var(--color-background);
  color:var(--color-foreground);
  font-family:"Comic Neue","Noto Sans TC",system-ui,sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,a,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:4px solid rgba(79,70,229,.3);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:500;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
.topbar{
  position:sticky;
  top:0;
  z-index:30;
  border-bottom:3px solid var(--color-border);
  background:rgba(255,255,255,.94);
  box-shadow:0 5px 0 rgba(79,70,229,.09);
  backdrop-filter:blur(14px);
}
.topbar-inner{
  max-width:1440px;
  margin:auto;
  padding:12px 22px;
  display:flex;
  align-items:center;
  gap:18px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:max-content}
.logo{
  width:48px;
  height:48px;
  border:3px solid #3730A3;
  border-radius:17px;
  display:grid;
  place-items:center;
  color:#fff;
  background:linear-gradient(145deg,#818CF8,#4F46E5);
  box-shadow:inset 3px 3px 0 rgba(255,255,255,.3),0 5px 0 #3730A3;
}
.logo .material-symbols-outlined{font-size:27px}
.brand-txt h1{
  margin:0;
  font-family:"Baloo 2","Noto Sans TC",sans-serif;
  font-size:18px;
  font-weight:700;
  letter-spacing:.02em;
}
.brand-txt p{margin:-3px 0 0;color:var(--muted);font-size:12px;font-weight:700}
.nav{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:8px;
  overflow-x:auto;
  scrollbar-width:none;
}
.nav::-webkit-scrollbar{display:none}
.nav button{
  min-height:44px;
  padding:8px 12px;
  border:2px solid var(--color-border);
  border-radius:14px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  flex:none;
  color:#37375F;
  background:#fff;
  font-weight:700;
  font-size:13px;
  box-shadow:0 3px 0 rgba(79,70,229,.11);
  transition:transform .2s ease-out,box-shadow .2s ease-out,border-color .2s ease-out,background .2s ease-out;
}
.nav button .material-symbols-outlined{font-size:19px}
.nav button:hover{
  border-color:var(--color-primary);
  color:var(--color-primary);
  transform:translateY(-2px);
  box-shadow:0 5px 0 rgba(79,70,229,.16);
}
.nav button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(79,70,229,.14)}
.nav button.active{
  border-color:#3730A3;
  color:#fff;
  background:linear-gradient(145deg,#6366F1,#4F46E5);
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.22),0 4px 0 #3730A3;
}
.wrap{max-width:1440px;margin:auto;padding:26px 22px 58px}
#screen{animation:reveal .36s ease-out both}
.screen-head{
  margin-bottom:20px;
  padding:22px 24px;
  border:3px solid var(--color-border);
  border-radius:var(--radius-lg);
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:18px;
  background:
    radial-gradient(circle at 93% 20%,rgba(234,88,12,.15),transparent 8rem),
    linear-gradient(135deg,#fff,#F5F3FF);
  box-shadow:var(--shadow);
}
.screen-head .t{min-width:0}
.eyebrow{
  margin-bottom:8px;
  padding:5px 11px;
  border:2px solid #A5B4FC;
  border-radius:999px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:#3730A3;
  background:#E0E7FF;
  font-family:"Baloo 2","Noto Sans TC",sans-serif;
  font-size:12px;
  font-weight:700;
  letter-spacing:.08em;
}
.eyebrow .material-symbols-outlined{font-size:16px}
.screen-head h2{
  margin:0;
  font-family:"Baloo 2","Noto Sans TC",sans-serif;
  font-size:30px;
  line-height:1.15;
  font-weight:700;
}
.screen-head p{margin:5px 0 0;color:var(--muted);font-size:14px;font-weight:700}
.pill-row{display:flex;gap:9px;flex-wrap:wrap}
.pill{
  min-height:40px;
  padding:7px 12px;
  border:2px solid var(--color-border);
  border-radius:999px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:#fff;
  color:#334155;
  font-size:13px;
  font-weight:700;
  box-shadow:0 3px 0 rgba(79,70,229,.11);
}
.pill .material-symbols-outlined{font-size:18px;color:var(--color-primary)}
.pill b{color:#3730A3;font-family:"Baloo 2",sans-serif;font-size:15px}
.grid{display:grid;gap:18px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-1-2{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.card{
  min-width:0;
  padding:19px;
  border:var(--border);
  border-radius:var(--radius);
  color:var(--color-card-foreground);
  background:var(--color-card);
  box-shadow:var(--shadow);
  transition:transform .2s ease-out,box-shadow .2s ease-out,border-color .2s ease-out;
}
.card:hover{border-color:#A5B4FC;transform:translateY(-2px);box-shadow:0 9px 0 rgba(79,70,229,.14),0 18px 32px rgba(30,27,75,.1)}
.card h3{
  margin:0 0 3px;
  display:flex;
  align-items:center;
  gap:8px;
  font-family:"Baloo 2","Noto Sans TC",sans-serif;
  font-size:17px;
  line-height:1.35;
  font-weight:700;
}
.card h3 .material-symbols-outlined{
  width:31px;
  height:31px;
  border-radius:10px;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--color-primary);
  font-size:18px;
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.25),0 3px 0 #3730A3;
}
.card .sub{margin:3px 0 15px;color:var(--muted);font-size:12.5px;font-weight:700}
.kpi{position:relative;overflow:hidden}
.kpi::after{
  content:"";
  position:absolute;
  width:88px;
  height:88px;
  right:-32px;
  top:-32px;
  border-radius:50%;
  background:#E0E7FF;
  box-shadow:inset 0 0 0 9px rgba(255,255,255,.48);
}
.kpi .ic{
  width:43px;
  height:43px;
  margin-bottom:11px;
  border:2px solid #A5B4FC;
  border-radius:14px;
  display:grid;
  place-items:center;
  color:#3730A3;
  background:#E0E7FF;
  box-shadow:inset 2px 2px 0 #fff,0 4px 0 rgba(79,70,229,.15);
}
.kpi .ic .material-symbols-outlined{font-size:23px}
.kpi .lab{color:var(--muted);font-size:13px;font-weight:700}
.kpi .val{
  margin-top:1px;
  font-family:"Baloo 2","Comic Neue",sans-serif;
  font-size:31px;
  line-height:1.25;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.kpi .delta{margin-top:5px;display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700}
.kpi .delta .material-symbols-outlined{font-size:16px}
.up{color:var(--ok)}.down{color:var(--bad)}
.chart{width:100%;height:300px}
.chart.sm{height:250px}
.tbl-wrap{
  overflow:auto;
  border:2px solid var(--color-border);
  border-radius:15px;
}
table{width:100%;min-width:520px;border-collapse:separate;border-spacing:0;font-size:13px}
th,td{padding:11px 12px;border-bottom:1px solid var(--color-border);white-space:nowrap}
th{
  position:sticky;
  top:0;
  z-index:1;
  text-align:left;
  color:#334155;
  background:#EEF2FF;
  font-size:12px;
  font-weight:700;
  letter-spacing:.025em;
}
td{color:#334155}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#F8FAFF}
td b{color:var(--ink);font-weight:700}
th:nth-child(n+3),td:nth-child(n+3){font-variant-numeric:tabular-nums}
td:nth-child(3){text-align:right}
.badge{
  min-height:27px;
  padding:3px 9px;
  border:1.5px solid currentColor;
  border-radius:999px;
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-size:11.5px;
  line-height:1.2;
  font-weight:700;
}
.badge::before{content:"";width:6px;height:6px;border-radius:2px;background:currentColor}
.b-ok{color:#166534;background:#DCFCE7}
.b-warn{color:#92400E;background:#FEF3C7}
.b-bad{color:#991B1B;background:#FEE2E2}
.b-info{color:#3730A3;background:#E0E7FF}
.b-pink{color:#9A3412;background:#FFEDD5}
.avatar{
  width:28px;
  height:28px;
  margin-right:8px;
  border:2px solid #3730A3;
  border-radius:10px;
  display:inline-grid;
  place-items:center;
  vertical-align:middle;
  color:#fff;
  background:linear-gradient(145deg,#818CF8,#4F46E5);
  box-shadow:2px 2px 0 #C7D2FE;
  font-size:12px;
  font-weight:700;
}
.bar{
  width:100px;
  min-width:70px;
  height:9px;
  border:1px solid #A5B4FC;
  border-radius:999px;
  display:inline-block;
  overflow:hidden;
  vertical-align:middle;
  background:#E0E7FF;
  box-shadow:inset 0 2px 3px rgba(30,27,75,.1);
}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#4F46E5,#818CF8)}
.course{
  min-width:0;
  overflow:hidden;
  border:3px solid var(--color-border);
  border-radius:var(--radius);
  display:flex;
  flex-direction:column;
  background:#fff;
  box-shadow:var(--shadow-sm);
  transition:transform .2s ease-out,box-shadow .2s ease-out;
}
.course:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.course .top{
  height:88px;
  border-bottom:3px solid rgba(30,27,75,.16);
  display:grid;
  place-items:center;
  position:relative;
  color:#fff;
}
.course .top::after{content:"";position:absolute;inset:8px;border:2px solid rgba(255,255,255,.3);border-radius:13px}
.course .top .material-symbols-outlined{z-index:1;font-size:38px}
.course .body{padding:14px 16px 17px}
.course .body h4{margin:0 0 5px;font-family:"Baloo 2","Noto Sans TC",sans-serif;font-size:16px;font-weight:700}
.course .meta{margin-bottom:11px;display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px;font-weight:700}
.course .meta span{display:inline-flex;align-items:center;gap:4px}
.course .meta .material-symbols-outlined{color:var(--color-primary);font-size:16px}
.prog{display:flex;align-items:center;gap:8px;color:#334155;font-size:12px;font-weight:700}
.prog .bar{width:auto;flex:1}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;min-width:0}
.col{
  min-width:0;
  padding:12px;
  border:2px solid var(--color-border);
  border-radius:17px;
  background:#F5F3FF;
  box-shadow:inset 3px 3px 0 #fff;
}
.col-head{margin-bottom:11px;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700}
.col-head .cnt{
  padding:1px 9px;
  border:2px solid var(--color-border);
  border-radius:999px;
  color:var(--muted);
  background:#fff;
  font-variant-numeric:tabular-nums;
}
.tk{
  margin-bottom:10px;
  padding:11px 12px;
  border:2px solid var(--color-border);
  border-radius:14px;
  background:#fff;
  box-shadow:0 4px 0 rgba(79,70,229,.1);
}
.tk:last-child{margin-bottom:0}
.tk .tt{margin-bottom:4px;font-size:13px;font-weight:700}
.tk .cl{margin-bottom:9px;color:var(--muted);font-size:11.5px;font-weight:700}
.tk .ft{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tk .who{display:flex;align-items:center;color:var(--muted);font-size:11.5px;font-weight:700}
.dot{width:10px;height:10px;margin-right:6px;border:2px solid currentColor;border-radius:3px;display:inline-block}
.timeline{position:relative;padding-left:28px}
.timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:4px;border-radius:4px;background:#C7D2FE}
.tl{position:relative;margin-bottom:19px}
.tl:last-child{margin-bottom:0}
.tl::before{
  content:"";
  position:absolute;
  left:-25px;
  top:4px;
  width:13px;
  height:13px;
  border:3px solid #3730A3;
  border-radius:5px;
  background:#818CF8;
  box-shadow:0 0 0 3px #E0E7FF;
}
.tl .th{margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tl .th .time{color:var(--muted);font-family:"Comic Neue",monospace;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.tl .th .tt{font-size:13.5px;font-weight:700}
.tl .desc{color:var(--muted);font-size:12.5px;font-weight:700}
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.bg-item{
  min-width:0;
  padding:16px 10px;
  border:2px solid var(--color-border);
  border-radius:17px;
  position:relative;
  text-align:center;
  background:#F8FAFF;
  box-shadow:0 4px 0 rgba(79,70,229,.1);
}
.bg-item .ring{
  width:60px;
  height:60px;
  margin:0 auto 10px;
  border:3px solid rgba(30,27,75,.2);
  border-radius:20px;
  display:grid;
  place-items:center;
  color:#fff;
  box-shadow:inset 3px 3px 0 rgba(255,255,255,.3),0 5px 0 rgba(30,27,75,.18);
}
.bg-item .ring .material-symbols-outlined{font-size:29px}
.bg-item h4{margin:0 0 3px;font-family:"Baloo 2","Noto Sans TC",sans-serif;font-size:14px;font-weight:700}
.bg-item p{margin:0;color:var(--muted);font-size:11.5px;font-weight:700}
.bg-item.locked{background:#E2E8F0}
.bg-item.locked::after{
  content:"尚未解鎖";
  margin-top:8px;
  display:block;
  color:#475569;
  font-size:10px;
  font-weight:700;
}
.bg-item.locked .ring{background:#64748B!important;box-shadow:inset 3px 3px 0 rgba(255,255,255,.18),0 4px 0 #475569}
.cert{
  padding:24px;
  overflow:hidden;
  position:relative;
  border:4px double #4F46E5;
  border-radius:22px;
  background:linear-gradient(145deg,#fff,#EEF2FF);
  box-shadow:var(--shadow);
}
.cert::before{
  content:"workspace_premium";
  position:absolute;
  right:-12px;
  bottom:-20px;
  color:#E0E7FF;
  font-family:"Material Symbols Outlined";
  font-size:136px;
}
.cert>*{position:relative;z-index:1}
.cert .seal{
  width:59px;
  height:59px;
  margin-bottom:14px;
  border:3px solid #9A3412;
  border-radius:20px;
  display:grid;
  place-items:center;
  color:#fff;
  background:linear-gradient(145deg,#FB923C,#EA580C);
  box-shadow:inset 3px 3px 0 rgba(255,255,255,.28),0 5px 0 #9A3412;
}
.cert .seal .material-symbols-outlined{font-size:31px}
.cert h3{margin:0 0 6px;font-family:"Baloo 2","Noto Sans TC",sans-serif;font-size:22px}
.cert .name{margin:10px 0 4px;color:#3730A3;font-family:"Baloo 2","Noto Sans TC",sans-serif;font-size:29px;font-weight:700}
.cert .line{margin:2px 0;color:var(--muted);font-size:13px;font-weight:700}
.cert .sig{margin-top:20px;display:flex;gap:26px;flex-wrap:wrap}
.cert .sig div{font-size:12px}
.cert .sig b{margin-top:16px;padding-top:5px;border-top:2px solid #A5B4FC;display:block;font-family:"Comic Neue",monospace;font-weight:700;font-variant-numeric:tabular-nums}
.risk{padding:11px 0;border-bottom:1px solid var(--color-border);display:flex;align-items:center;gap:11px}
.risk:last-child{border-bottom:0}
.risk .av{flex:none}
.risk .info{min-width:0;flex:1}
.risk .info .n{font-size:13px;font-weight:700}
.risk .info .s{color:var(--muted);font-size:11.5px;font-weight:700}
.matrow{min-width:0;padding:11px 0;border-bottom:1px solid var(--color-border);display:flex;align-items:center;gap:12px}
.matrow:last-child{border-bottom:0}
.matrow .fic{
  width:38px;
  height:38px;
  border:2px solid rgba(30,27,75,.18);
  border-radius:12px;
  display:grid;
  place-items:center;
  flex:none;
  color:#fff;
  box-shadow:0 3px 0 rgba(30,27,75,.15);
}
.matrow .fic .material-symbols-outlined{font-size:20px}
.matrow .mi{min-width:0;flex:1}
.matrow .mi .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:700}
.matrow .mi .m{color:var(--muted);font-family:"Comic Neue",monospace;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
.foot{margin-top:36px;text-align:center;color:var(--muted);font-size:12px;font-weight:700}
.foot .material-symbols-outlined{color:var(--color-primary);font-size:16px}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1100px){
  .topbar-inner{align-items:flex-start;flex-wrap:wrap}
  .nav{width:100%;margin-left:0;padding-bottom:3px}
}
@media(max-width:860px){
  .g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-2-1,.g-1-2{grid-template-columns:1fr}
  .screen-head{align-items:flex-start;flex-direction:column}
}
@media(max-width:680px){
  .wrap{padding:18px 14px 42px}
  .topbar-inner{padding:10px 14px}
  .brand-txt h1{font-size:16px}
  .brand-txt p{font-size:11px}
  .screen-head{padding:18px;border-radius:21px}
  .screen-head h2{font-size:25px}
  .g2,.g4,.g3,.badges{grid-template-columns:1fr}
  .g2.keep2,.g4.keep2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{padding:16px}
  .risk{align-items:flex-start;flex-wrap:wrap}
  .risk .bar{margin-left:45px;flex:1}
}
@media(max-width:460px){
  .logo{width:44px;height:44px}

var container=document.getElementById("screen");
function show(i){
  disposeCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    var active=+btns[b].getAttribute("data-i")===i;
    btns[b].classList.toggle("active",active);
    btns[b].setAttribute("aria-current",active?"page":"false");
  }
  container.innerHTML=RENDER[i]();
  void container.offsetHeight;
  if(CHARTINIT[i])CHARTINIT[i]();
}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  var n=document.querySelectorAll("[data-i]").length||6;
  var i=m?Math.min(+m[1],n-1):0;
  show(i);
  try{window.scrollTo(0,0);}catch(e){}
}
window.addEventListener("hashchange",fromHash);
window.addEventListener("resize",function(){
  for(var i=0;i<CHARTS.length;i++){try{CHARTS[i].resize();}catch(e){}}
});
fromHash();
