<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>學生學習支持平台｜Jvision 系統 Demo</title>
<meta name="description" content="課程、學員、測驗到學習進度的教學管理" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --pink:#db2777;--pink2:#f472b6;--pink-soft:#fce7f3;--pink-line:#fbcfe8;
  --ink:#3a1026;--muted:#8a6079;--bg:#fdf2f8;--card:#ffffff;--line:#f5d7e6;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#7c3aed;
  --shadow:0 8px 26px rgba(219,39,119,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Noto Sans TC","Inter",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;line-height:1.5;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
/* ---------- top nav ---------- */
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 4px 18px rgba(219,39,119,.06)}
.topbar-inner{max-width:1360px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--pink),var(--pink2));display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 16px rgba(219,39,119,.35);flex:none}
.logo .material-symbols-outlined{font-size:25px}
.brand-txt{min-width:0}
.brand-txt h1{font-size:16px;margin:0;font-weight:900;letter-spacing:.3px;white-space:nowrap}
.brand-txt p{font-size:11.5px;margin:0;color:var(--muted);white-space:nowrap}
.nav{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto;min-width:0}
.nav button{flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--muted);font-family:inherit;font-size:13px;font-weight:700;padding:8px 13px;border-radius:11px;cursor:pointer;transition:.16s}
.nav button .material-symbols-outlined{font-size:19px}
.nav button:hover{border-color:var(--pink2);color:var(--pink)}
.nav button.active{background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;border-color:transparent;box-shadow:0 6px 15px rgba(219,39,119,.30)}
/* ---------- layout ---------- */
.wrap{max-width:1360px;margin:0 auto;padding:22px 20px 60px}
.screen-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.screen-head .t{min-width:0}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:var(--pink);background:var(--pink-soft);padding:4px 11px;border-radius:99px;margin-bottom:9px}
.eyebrow .material-symbols-outlined{font-size:15px}
.screen-head h2{font-size:24px;margin:0;font-weight:900;letter-spacing:.4px}
.screen-head p{margin:5px 0 0;color:var(--muted);font-size:13.5px}
.pill-row{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 13px;font-size:12.5px;font-weight:700;color:var(--ink);box-shadow:var(--shadow)}
.pill .material-symbols-outlined{font-size:16px;color:var(--pink)}
.pill b{color:var(--pink)}
/* cards / grids */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px;min-width:0}
.card h3{margin:0 0 3px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--pink)}
.card .sub{color:var(--muted);font-size:12px;margin:0 0 14px}
.grid{display:grid;gap:16px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g-2-1{grid-template-columns:1.6fr 1fr}
.g-1-2{grid-template-columns:1fr 1.6fr}
/* kpi */
.kpi{position:relative;overflow:hidden}
.kpi .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--pink-soft);color:var(--pink);margin-bottom:11px}
.kpi .ic .material-symbols-outlined{font-size:22px}
.kpi .lab{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .val{font-size:27px;font-weight:900;letter-spacing:.5px;margin-top:2px}
.kpi .delta{font-size:12px;font-weight:800;margin-top:5px;display:inline-flex;align-items:center;gap:3px}
.kpi .delta .material-symbols-outlined{font-size:15px}
.up{color:var(--ok)}.down{color:var(--bad)}
.kpi::after{content:"";position:absolute;right:-24px;top:-24px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,var(--pink-soft),transparent 70%)}
.chart{width:100%;height:300px}
.chart.sm{height:250px}
/* table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.4px;background:#fff8fc;position:sticky;top:0}
tbody tr:hover{background:#fff6fb}
td b{font-weight:800}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:99px}
.b-ok{background:#dcfce7;color:#15803d}
.b-warn{background:#fef3c7;color:#b45309}
.b-bad{background:#fee2e2;color:#b91c1c}
.b-info{background:#ede9fe;color:#6d28d9}
.b-pink{background:var(--pink-soft);color:var(--pink)}
.avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;margin-right:8px;vertical-align:middle}
.bar{height:7px;border-radius:99px;background:var(--pink-soft);overflow:hidden;min-width:70px;display:inline-block;width:100px;vertical-align:middle}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--pink2))}
/* course catalog cards */
.course{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;display:flex;flex-direction:column;min-width:0}
.course .top{height:78px;display:flex;align-items:center;justify-content:center;color:#fff;position:relative}
.course .top .material-symbols-outlined{font-size:34px;opacity:.95}
.course .body{padding:13px 15px 16px}
.course .body h4{margin:0 0 4px;font-size:14.5px;font-weight:800}
.course .meta{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.course .meta span{display:inline-flex;align-items:center;gap:4px}
.course .meta .material-symbols-outlined{font-size:15px;color:var(--pink)}
.prog{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:700}
.prog .bar{flex:1;width:auto}
/* kanban board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;min-width:0}
.col{background:#fff7fb;border:1px solid var(--line);border-radius:15px;padding:12px;min-width:0}
.col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;font-size:13px;font-weight:800}
.col-head .cnt{background:#fff;border:1px solid var(--line);border-radius:99px;padding:1px 9px;font-size:11.5px;color:var(--muted)}
.tk{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:10px;box-shadow:0 3px 9px rgba(219,39,119,.05)}
.tk:last-child{margin-bottom:0}
.tk .tt{font-size:13px;font-weight:800;margin-bottom:5px}
.tk .cl{font-size:11.5px;color:var(--muted);margin-bottom:9px}
.tk .ft{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tk .who{display:flex;align-items:center;font-size:11.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
/* timeline */
.timeline{position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--pink-line)}
.tl{position:relative;margin-bottom:18px}
.tl:last-child{margin-bottom:0}
.tl::before{content:"";position:absolute;left:-22px;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--pink);box-shadow:0 0 0 3px var(--pink-soft)}
.tl .th{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.tl .th .time{font-size:11.5px;color:var(--muted);font-weight:700}
.tl .th .tt{font-size:13.5px;font-weight:800}
.tl .desc{font-size:12.5px;color:var(--muted)}
/* achievement / badges */
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;min-width:0}
.bg-item{border:1px solid var(--line);border-radius:15px;padding:16px 12px;text-align:center;background:#fff;position:relative;min-width:0}
.bg-item .ring{width:58px;height:58px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 16px rgba(219,39,119,.25)}
.bg-item .ring .material-symbols-outlined{font-size:28px}
.bg-item h4{margin:0 0 3px;font-size:13.5px;font-weight:800}
.bg-item p{margin:0;font-size:11.5px;color:var(--muted)}
.bg-item.locked{opacity:.55;filter:grayscale(.4)}
.bg-item.locked .ring{background:#d9c3ce!important;box-shadow:none}
/* certificate */
.cert{border:2px dashed var(--pink2);border-radius:18px;padding:22px;background:linear-gradient(135deg,#fff,#fff5fa);position:relative;overflow:hidden}
.cert::before{content:"workspace_premium";font-family:"Material Symbols Outlined";position:absolute;right:-10px;bottom:-14px;font-size:130px;color:var(--pink-soft);z-index:0}
.cert>*{position:relative;z-index:1}
.cert .seal{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:14px;box-shadow:0 8px 18px rgba(219,39,119,.35)}
.cert .seal .material-symbols-outlined{font-size:30px}
.cert h3{font-size:20px;margin:0 0 6px}
.cert .name{font-size:26px;font-weight:900;color:var(--pink);margin:10px 0 4px}
.cert .line{font-size:13px;color:var(--muted);margin:2px 0}
.cert .sig{display:flex;gap:26px;margin-top:20px;flex-wrap:wrap}
.cert .sig div{font-size:12px}
.cert .sig b{display:block;border-top:1px solid var(--pink-line);padding-top:5px;margin-top:16px;font-weight:800}
/* progress radar side list */
.risk{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.risk:last-child{border-bottom:none}
.risk .av{flex:none}
.risk .info{flex:1;min-width:0}
.risk .info .n{font-size:13px;font-weight:800}
.risk .info .s{font-size:11.5px;color:var(--muted)}
/* material list rows */
.matrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.matrow:last-child{border-bottom:none}
.matrow .fic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.matrow .fic .material-symbols-outlined{font-size:20px}
.matrow .mi{flex:1;min-width:0}
.matrow .mi .n{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.matrow .mi .m{font-size:11.5px;color:var(--muted)}
.foot{margin-top:34px;text-align:center;color:var(--muted);font-size:12px}
.foot .material-symbols-outlined{font-size:15px;color:var(--pink);vertical-align:middle}
/* responsive */
@media(max-width:860px){.nav{margin-left:0;width:100%}}
@media(max-width:820px){
  .g4,.g3,.g2,.g-2-1,.g-1-2,.board,.badges{grid-template-columns:1fr}
  .g2.keep2,.g4.keep2{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){
  .nav button span.lbl{display:none}
  .nav button{padding:9px 11px}
  .screen-head h2{font-size:20px}
  .g2.keep2,.g4.keep2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">school</span></div>
      <div class="brand-txt">
        <h1>學生學習支持平台</h1>
        <p>課程 · 學員 · 測驗 · 學習進度</p>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</header>
<main class="wrap"><div id="screen"></div>
  <div class="foot"><span class="material-symbols-outlined">verified</span> Jvision 系統 Demo · 學生學習支持平台 · 純前端展示資料（虛構）</div>
</main>

<script>
"use strict";
/* ---------------- nav config ---------------- */
var MODULES=[
  {icon:"space_dashboard",name:"學習總覽"},
  {icon:"menu_book",name:"課程與教材"},
  {icon:"assignment_turned_in",name:"作業批改"},
  {icon:"insights",name:"進度追蹤"},
  {icon:"support_agent",name:"輔導提問"},
  {icon:"workspace_premium",name:"成就證書"}
];
var nav=document.getElementById("nav");
nav.innerHTML=MODULES.map(function(m,i){
  return '<button data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="lbl">'+m.name+'</span></button>';
}).join("");
nav.addEventListener("click",function(e){
  var b=e.target.closest("button[data-i]");if(!b)return;show(+b.getAttribute("data-i"));
});
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function head(icon,eyebrow,title,sub,pills){
  return '<div class="screen-head"><div class="t"><span class="eyebrow"><span class="material-symbols-outlined">'+icon+'</span>'+eyebrow+'</span>'+
    '<h2>'+title+'</h2><p>'+sub+'</p></div><div class="pill-row">'+(pills||[]).map(function(p){
      return '<span class="pill"><span class="material-symbols-outlined">'+p.i+'</span>'+p.t+' <b>'+p.v+'</b></span>';
    }).join("")+'</div></div>';
}

/* ---------------- chart mgmt ---------------- */
var CHARTS=[];
function disposeCharts(){for(var i=0;i<CHARTS.length;i++){try{CHARTS[i].dispose();}catch(e){}}CHARTS=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el||typeof echarts==="undefined")return;var c=echarts.init(el);c.setOption(opt);CHARTS.push(c);}
var PINK="#db2777",PINK2="#f472b6",AXIS="#c98db0";
function grid(){return{left:"3%",right:"4%",bottom:"3%",top:"14%",containLabel:true};}
function axisText(){return{color:"#a06484",fontSize:11};}

/* ================= SCREEN 0 : 學習總覽 ================= */
function s0(){
  var kpis=[
    {ic:"groups",lab:"在學學員",val:"1,284",d:"+42",up:1},
    {ic:"fact_check",lab:"本週出席掌握率",val:"89%",d:"+4pt",up:1},
    {ic:"pending_actions",lab:"待批改作業",val:"37",d:"-15",up:1},
    {ic:"trending_up",lab:"平均學習進度",val:"73%",d:"+6pt",up:1}
  ];
  var html=head("space_dashboard","MODULE 01","學習總覽","全班學習概況、出席趨勢與課程完成分佈一頁掌握",[
    {i:"school",t:"班級",v:"32"},{i:"today",t:"學期第",v:"6 週"}
  ]);
  html+='<div class="grid g4" style="margin-bottom:16px">'+kpis.map(function(k){
    return '<div class="card kpi"><div class="ic"><span class="material-symbols-outlined">'+k.ic+'</span></div>'+
      '<div class="lab">'+k.lab+'</div><div class="val">'+k.val+'</div>'+
      '<div class="delta '+(k.up?"up":"down")+'"><span class="material-symbols-outlined">'+(k.up?"arrow_upward":"arrow_downward")+'</span>'+k.d+' 較上週</div></div>';
  }).join("")+'</div>';
  html+='<div class="grid g-2-1" style="margin-bottom:16px">'+
    '<div class="card"><h3><span class="material-symbols-outlined">show_chart</span>出席掌握率與學習進度趨勢</h3><p class="sub">近 6 週逐週彙整</p><div id="c0a" class="chart"></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>課程完成分佈</h3><p class="sub">全體學員課程狀態</p><div id="c0b" class="chart"></div></div>'+
  '</div>';
  var rows=[
    {c:"國小數學．進階班",t:"林雅涵",st:33,p:82,a:"active"},
    {c:"自然科學探索",t:"陳柏宇",st:28,p:64,a:"active"},
    {c:"英語會話 B2",t:"王思婷",st:31,p:57,a:"warn"},
    {c:"程式設計入門",t:"張哲維",st:24,p:91,a:"active"},
    {c:"作文與閱讀理解",t:"李宛庭",st:29,p:48,a:"warn"}
  ];
  html+='<div class="card"><h3><span class="material-symbols-outlined">table_chart</span>各班級學習概況</h3><p class="sub">本週活躍度與平均完成率</p>'+
    '<div class="tbl-wrap"><table><thead><tr><th>課程班級</th><th>授課教師</th><th>學員數</th><th>平均完成率</th><th>狀態</th></tr></thead><tbody>'+
    rows.map(function(r){
      return '<tr><td><b>'+r.c+'</b></td><td><span class="avatar">'+r.t.charAt(0)+'</span>'+r.t+'</td><td>'+r.st+' 人</td>'+
        '<td><span class="bar"><i style="width:'+r.p+'%"></i></span> '+r.p+'%</td>'+
        '<td>'+(r.a==="active"?'<span class="badge b-ok">進度良好</span>':'<span class="badge b-warn">需關注</span>')+'</td></tr>';
    }).join("")+'</tbody></table></div></div>';
  return html;
}
function s0charts(){
  mk("c0a",{
    tooltip:{trigger:"axis"},legend:{data:["出席掌握率 %","學習進度 %"],textStyle:axisText(),top:0},
    grid:grid(),
    xAxis:{type:"category",data:["第1週","第2週","第3週","第4週","第5週","第6週"],axisLabel:axisText(),axisLine:{lineStyle:{color:AXIS}}},
    yAxis:{type:"value",max:100,axisLabel:axisText(),splitLine:{lineStyle:{color:"#f5d7e6"}}},
    series:[
      {name:"出席掌握率 %",type:"line",smooth:true,data:[67,71,76,80,85,89],lineStyle:{width:3,color:PINK},itemStyle:{color:PINK},areaStyle:{color:"rgba(219,39,119,.10)"}},
      {name:"學習進度 %",type:"line",smooth:true,data:[45,52,58,64,69,73],lineStyle:{width:3,color:PINK2},itemStyle:{color:PINK2}}
    ]
  });
  mk("c0b",{
    tooltip:{trigger:"item"},legend:{bottom:0,textStyle:axisText()},
    series:[{type:"pie",radius:["45%","72%"],center:["50%","44%"],avoidLabelOverlap:true,label:{show:false},
      data:[
        {value:512,name:"已完成",itemStyle:{color:PINK}},
        {value:436,name:"進行中",itemStyle:{color:PINK2}},
        {value:238,name:"落後",itemStyle:{color:"#f9a8d4"}},
        {value:98,name:"未開始",itemStyle:{color:"#fbcfe8"}}
      ]}]
  });
}

/* ================= SCREEN 1 : 課程與教材 ================= */
function s1(){
  var courses=[
    {n:"國小數學．進階班",ic:"calculate",c1:"#db2777",c2:"#f472b6",u:12,h:24,p:82},
    {n:"自然科學探索",ic:"science",c1:"#7c3aed",c2:"#a78bfa",u:9,h:18,p:64},

/* ---------------- render dispatch ---------------- */
var RENDER=[s0,s1,s2,s3,s4,s5];
var CHARTINIT=[s0charts,null,null,s3charts,s4charts,s5charts];
var container=document.getElementById("screen");
function show(i){
  disposeCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("active",+btns[b].getAttribute("data-i")===i);}
  container.innerHTML=RENDER[i]();
  void container.offsetHeight;
  if(CHARTINIT[i])CHARTINIT[i]();
}
show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m)return;var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
