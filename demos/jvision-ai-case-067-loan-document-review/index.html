<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>貸款文件審核站 · Loan Document Review</title>
<meta name="description" content="貸款申請受理、文件齊備檢核、AI 文件辨識與風險標記、徵信信用評分、核准撥貸與案件追蹤"/>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--accent:#0891b2;--accent2:#22d3ee;--ink:#0d2430;--bg:#eef6f9;--card:#fff;--line:#cfe9ef;--mut:#5a7784;--ok:#0d9488;--warn:#f59e0b;--bad:#e11d48;--info:#6366f1}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.shell{display:grid;grid-template-columns:242px 1fr;min-height:100vh}
.shell>*{min-width:0}
.side{background:linear-gradient(180deg,#fff,#effbfd);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.side .bd{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.side .lg{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:900;color:#fff;flex:none;box-shadow:0 8px 20px rgba(8,145,178,.42);font-family:"Noto Sans TC"}
.side .bd b{font-size:15px;font-weight:800;font-family:"Noto Sans TC";display:block}
.side .bd span{font-size:9px;color:var(--accent);letter-spacing:1px}
.side button{display:flex;align-items:center;gap:11px;background:transparent;border:0;color:#456470;font:inherit;font-weight:600;font-size:13.5px;padding:10px 12px;border-radius:11px;cursor:pointer;text-align:left;width:100%;font-family:"Noto Sans TC"}
.side button .material-symbols-outlined{font-size:20px;color:#8fc9d6}
.side button:hover{background:#e4f6fa}
.side button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(8,145,178,.32)}
.side button.on .material-symbols-outlined{color:#fff}
.side .foot{margin-top:auto;padding:12px 10px 2px;font-size:11px;color:var(--mut);border-top:1px solid var(--line);line-height:1.8}
.main{padding:22px 24px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.live{background:#d3f1f7;color:#0e7490;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:p 1.4s infinite}
@keyframes p{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(8,145,178,.5)}50%{opacity:.35;box-shadow:0 0 0 6px rgba(8,145,178,0)}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.24}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .85fr}
.g11{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#ccfbf1;color:#0f766e}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#ffe4e6;color:#be123c}.t-info{background:#e0e7ff;color:#4338ca}.t-sky{background:#cff4fa;color:#0e7490}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#e8f7fb}
table.data tr:hover td{background:#f2fbfd}
.chartbox{position:relative;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.two>*{min-width:0}
.bar{height:8px;background:#dceff4;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.scroll{overflow-x:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.btn{font-size:11.5px;font-weight:700;padding:6px 13px;border-radius:9px;border:0;cursor:pointer;font-family:"Noto Sans TC"}
.btn.ok{background:var(--accent);color:#fff}.btn.no{background:#fff;border:1px solid var(--bad);color:var(--bad)}.btn.gh{background:#fff;border:1px solid var(--line);color:var(--mut)}
.mini{display:flex;gap:6px}
.ava{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:inline-grid;place-items:center;font-size:10px;font-weight:800;font-family:"Noto Sans TC"}
/* signature 1 — 文件齊備檢核清單 */
.dchk{display:flex;flex-direction:column;gap:9px}
.dl{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fff}
.dl .st{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;color:#fff}
.st.done{background:linear-gradient(135deg,#0d9488,#2dd4bf)}.st.miss{background:linear-gradient(135deg,#e11d48,#fb7185)}.st.flag{background:linear-gradient(135deg,#f59e0b,#fbbf24)}.st.rev{background:linear-gradient(135deg,#0891b2,#22d3ee)}
.dl .st .material-symbols-outlined{font-size:17px}
.dl .nm{flex:1;min-width:0}
.dl .nm b{font-size:13px;font-family:"Noto Sans TC";display:block}
.dl .nm small{font-size:11px;color:var(--mut)}
.dl .rt{text-align:right;flex:none}
.aiflag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:20px;background:#fff7ed;color:#c2410c;border:1px solid #fed7aa}
.aiflag .material-symbols-outlined{font-size:13px}
.okflag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:20px;background:#ecfdf5;color:#0f766e;border:1px solid #a7f3d0}
.okflag .material-symbols-outlined{font-size:13px}
/* signature 2 — 貸款案件審核 queue */
.queue{display:flex;flex-direction:column;gap:10px}
.qc{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:13px;padding:12px 14px;background:#fff}
.qc.hi{border-left-color:var(--bad);background:linear-gradient(90deg,#fff5f7,#fff)}
.qc.mid{border-left-color:var(--warn)}
.qc.lo{border-left-color:var(--info)}
.qc .qt{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.qc .qt b{font-size:13.5px;font-family:"Noto Sans TC"}
.qc .qt .id{font-family:Inter;font-weight:800;color:var(--accent);font-size:12.5px}
.qc .meta{color:var(--mut);font-size:11.5px;margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
.qc .meta span{display:flex;align-items:center;gap:4px}
.qc .meta .material-symbols-outlined{font-size:14px}
.sla{margin-left:auto;text-align:right;flex:none}
.sla .num{font-family:Inter;font-weight:900;font-size:15px;line-height:1}
.sla small{font-size:9.5px;color:var(--mut);display:block}
.sla.red .num{color:var(--bad)}.sla.amb .num{color:var(--warn)}.sla.grn .num{color:var(--ok)}
.prog{margin-top:8px;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut)}
.prog .bar{flex:1}
/* 貸款申請 form */
.frm{display:grid;grid-template-columns:1fr 1fr;gap:12px}.frm>*{min-width:0}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:11px;color:var(--mut);font-weight:700}
.fld .box{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;background:#f8fdfe;font-family:"Noto Sans TC"}
.fld.full{grid-column:1/-1}
/* AI 辨識 欄位 */
.ocr{display:flex;flex-direction:column;gap:8px}
.orow{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:11px}
.orow .k{font-size:11.5px;color:var(--mut);width:96px;flex:none;font-family:"Noto Sans TC"}
.orow .val{font-size:13px;font-weight:700;font-family:Inter;flex:1;min-width:0}
.orow .cf{font-size:10.5px;font-weight:800;padding:1px 8px;border-radius:20px;flex:none}
.cf.hi{background:#ecfdf5;color:#0f766e}.cf.mi{background:#fff7ed;color:#c2410c}
/* 信用評分 gauge-ish */
.score{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.scball{width:120px;height:120px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--accent) 0 78%,#e2eef1 78% 100%);position:relative}
.scball:after{content:"";position:absolute;inset:12px;border-radius:50%;background:#fff}
.scball .in{position:relative;text-align:center}
.scball .in b{font-family:Inter;font-size:30px;font-weight:900;color:var(--accent);line-height:1}
.scball .in small{font-size:10px;color:var(--mut)}
.scdet{flex:1;min-width:180px}
.scrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.scrow .k{width:104px;flex:none;color:var(--mut);font-family:"Noto Sans TC"}
.scrow .bar{flex:1}
.scrow .n{flex:none;font-family:Inter;font-weight:800;width:38px;text-align:right}
/* 撥貸 approval */
.appr{display:flex;flex-direction:column;gap:9px}
.al{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fff}
.al .st{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff}
.al .st.done{background:var(--ok)}.al .st.now{background:var(--accent)}.al .st.wait{background:#c3d7de;color:#5a7784}
.al .st .material-symbols-outlined{font-size:15px}
.al .nm{flex:1;min-width:0}.al .nm b{font-size:13px;font-family:"Noto Sans TC";display:block}.al .nm small{font-size:11px;color:var(--mut)}
/* 案件追蹤 timeline */
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tli{position:relative;padding:0 0 15px 6px}
.tli:before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent)}
.tli.mut:before{background:#c3d7de;box-shadow:0 0 0 2px #c3d7de}
.tli b{font-size:12.5px;font-family:"Noto Sans TC"}
.tli small{display:block;font-size:11px;color:var(--mut);margin-top:1px}
.tli .tm{font-size:10.5px;color:var(--accent);font-weight:700;font-family:Inter}
@media(max-width:860px){
 .shell{grid-template-columns:1fr}
 .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;overflow:visible}
 .side .bd{width:100%;padding-bottom:8px}
 .side button{width:auto;flex:none}
 .side .foot{display:none}
}
@media(max-width:820px){
 .kpis{grid-template-columns:repeat(2,1fr)}
 .g2,.g11,.two,.frm{grid-template-columns:1fr}
}
@media(max-width:430px){
 .kpis{grid-template-columns:1fr}
 .main{padding:16px 14px}
}
</style>
</head>
<body>

</div>

()=>`<div class="grid g2">

function qcard(c){return `<div class="qc ${c[1]}"><div class="qt"><span class="ava">${c[3]}</span><span class="id">${c[0]}</span><b>${c[2]}</b><div class="sla ${c[7]}"><div class="num">${c[8]}</div><small>${c[9]}</small></div></div>
 <div class="meta"><span><span class="material-symbols-outlined">account_balance</span>${c[4]}</span><span><span class="material-symbols-outlined">payments</span>${c[5]}</span></div>
 <div class="prog"><span>${c[11]}</span><span class="bar"><i style="width:${c[10]}%"></i></span><b style="font-family:Inter;color:var(--accent)">${c[10]}%</b></div></div>`;}

function docline(d){var s=DST[d[2]];return `<div class="dl"><span class="st ${s[0]}"><span class="material-symbols-outlined">${s[1]}</span></span><div class="nm"><b>${d[0]}</b><small>${d[3]}</small></div><div class="rt"><span class="tag t-sky" style="display:block;margin-bottom:4px">${d[1]}</span><span class="${s[3]}"><span class="material-symbols-outlined">${d[2]=='done'?'check_circle':d[2]=='miss'?'error':'flag'}</span>${s[2]}</span></div></div>`;}

let CH=[];
function dispose(){CH.forEach(c=>{try{c.destroy();}catch(e){}});CH=[];}
function mk(id,cfg){const el=document.getElementById(id);if(!el||typeof Chart==='undefined')return;CH.push(new Chart(el,cfg));}
const AX={grid:{color:'#e6f3f6'},ticks:{font:{size:10,family:'Inter'},color:'#5a7784'}};
function draw(i){
 dispose();
 if(i==0){
  mk('c_score',{type:'bar',data:{labels:['<550','550-599','600-649','650-699','700-749','750+'],datasets:[{label:'件數',data:[3,6,14,22,19,11],backgroundColor:['#e11d48','#e11d48','#f59e0b','#f59e0b','#0891b2','#0891b2'],borderRadius:5,barThickness:24}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{...AX,grid:{display:false}},y:{...AX,beginAtZero:true}}}});
  mk('c_sla',{type:'bar',data:{labels:['受理','文件檢核','徵信評分','核准撥貸'],datasets:[{label:'平均天數',data:[0.4,1.1,0.9,0.5],backgroundColor:'#0891b2',borderRadius:5,barThickness:26}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{...AX,beginAtZero:true},y:{...AX,grid:{display:false}}}}});
  mk('c_prod',{type:'doughnut',data:{labels:['信用貸款','房屋貸款','汽車貸款','企業貸款'],datasets:[{data:[24,18,9,7],backgroundColor:['#0891b2','#22d3ee','#0d9488','#6366f1'],borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,cutout:'58%',plugins:{legend:{position:'bottom',labels:{font:{size:10.5,family:'Noto Sans TC'},padding:9,boxWidth:11}}}}});
 }
 if(i==3){
  mk('c_risk',{type:'bar',data:{labels:['A 低','B 中','C 中高','D 高'],datasets:[{label:'件數',data:[16,21,9,4],backgroundColor:['#0d9488','#0891b2','#f59e0b','#e11d48'],borderRadius:5,barThickness:28}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{...AX,grid:{display:false}},y:{...AX,beginAtZero:true}}}});
 }
 if(i==4){
  mk('c_appr',{type:'line',data:{labels:['第1週','第2週','第3週','第4週','第5週','第6週'],datasets:[{label:'核准件',data:[38,42,45,48,52,55],borderColor:'#0891b2',backgroundColor:'rgba(8,145,178,.14)',fill:true,tension:.4,pointRadius:2,borderWidth:2.5},{label:'撥款件',data:[34,39,41,45,49,53],borderColor:'#0d9488',backgroundColor:'transparent',tension:.4,pointRadius:2,borderWidth:2.5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{...AX,grid:{display:false}},y:{...AX,beginAtZero:true}}}});
 }
}
function show(i){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));vt.textContent=MOD[i][2];vd.textContent=MOD[i][3];view.innerHTML=SCREENS[i]();void view.offsetHeight;draw(i);}
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m)return;var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
</body>
</html>
