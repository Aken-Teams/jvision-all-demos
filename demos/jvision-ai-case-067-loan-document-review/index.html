<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>貸款文件審核站 · Loan Document Review</title>
<meta name="description" content="貸款申請受理、文件齊備檢核、AI 文件辨識與風險標記、徵信信用評分、核准撥貸與案件追蹤"/>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
 --color-primary:#F59E0B;--color-on-primary:#0F172A;
 --color-secondary:#FBBF24;--color-on-secondary:#0F172A;
 --color-accent:#8B5CF6;--color-on-accent:#000;
 --color-background:#0F172A;--color-foreground:#F8FAFC;
 --color-card:#222735;--color-card-foreground:#F8FAFC;
 --color-muted:#272F42;--color-muted-foreground:#94A3B8;
 --color-border:#334155;--color-destructive:#EF4444;
 --color-on-destructive:#000;--color-ring:#F59E0B;
 --blue:#F59E0B;--ink:#F8FAFC;--muted:#94A3B8;--line:#334155;
 --accent:var(--color-primary);--accent2:var(--color-secondary);
 --bg:var(--color-background);--card:var(--color-card);--mut:var(--color-muted-foreground);
 --ok:#34D399;--warn:#FBBF24;--bad:#F87171;--info:#A78BFA;
 --shadow:0 14px 32px rgba(2,6,23,.22);
}
*{box-sizing:border-box}
html{color-scheme:dark;scroll-behavior:smooth}
body{margin:0;min-width:320px;font-family:"IBM Plex Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
button{font:inherit}
button,.btn{cursor:pointer}
.material-symbols-outlined{font-size:20px;line-height:1;vertical-align:middle}
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.shell>*{min-width:0}
.side{
 position:sticky;top:0;height:100vh;overflow:auto;z-index:20;
 display:flex;flex-direction:column;gap:6px;padding:22px 16px;
 background:#111827;border-right:1px solid var(--line)
}
.side .bd{display:flex;align-items:center;gap:12px;padding:2px 8px 22px;border-bottom:1px solid var(--line);margin-bottom:10px}
.side .lg{
 width:42px;height:42px;display:grid;place-items:center;flex:none;
 border-radius:8px;background:var(--accent);color:var(--color-on-primary);
 font-size:18px;font-weight:700;box-shadow:4px 4px 0 rgba(139,92,246,.65)
}
.side .bd b{display:block;font-size:15px;font-weight:700;letter-spacing:.02em}
.side .bd span{display:block;margin-top:2px;color:var(--accent);font-size:9px;font-weight:600;letter-spacing:.15em}
.side button{
 width:100%;min-height:44px;display:flex;align-items:center;gap:11px;
 padding:10px 12px;border:1px solid transparent;border-radius:7px;
 background:transparent;color:#CBD5E1;text-align:left;font-weight:500;
 transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s ease
}
.side button .material-symbols-outlined{color:#94A3B8}
.side button:hover{background:#1E293B;color:#FFF;border-color:#475569;transform:translateX(2px)}
.side button.on{background:var(--accent);color:var(--color-on-primary);border-color:var(--accent);font-weight:700}
.side button.on .material-symbols-outlined{color:var(--color-on-primary)}
.side .foot{margin-top:auto;padding:16px 10px 2px;border-top:1px solid var(--line);color:#AAB7CA;font-size:11px;line-height:1.85}
.main{width:100%;max-width:1600px;margin:auto;padding:28px 30px 40px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:20px}
.vh h2{margin:0;font-size:clamp(23px,2vw,30px);line-height:1.2;font-weight:700;letter-spacing:-.025em}
.vh p{margin:6px 0 0;color:#AAB7CA;font-size:13px}
.live{
 display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:7px 12px;
 border:1px solid #526077;border-radius:6px;background:#1B2230;color:#F8FAFC;
 font-size:12px;font-weight:600;white-space:nowrap
}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(52,211,153,.17);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45;transform:scale(.8)}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{
 position:relative;overflow:hidden;padding:17px 18px;border:1px solid var(--line);
 border-radius:8px;background:var(--card);box-shadow:var(--shadow);
 transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease
}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.kpi:hover{transform:translateY(-2px);border-color:#64748B;box-shadow:0 18px 38px rgba(2,6,23,.3)}
.kpi .l{color:#B8C3D4;font-size:12px;font-weight:500}
.kpi .v{margin-top:5px;font-size:27px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .d{margin-top:5px;font-size:11px;font-weight:600}
.kpi .ic{position:absolute;right:15px;top:15px;color:var(--accent);opacity:.72;font-size:23px}
.up{color:#6EE7B7}.dn{color:#FCA5A5}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.35fr) minmax(330px,.85fr)}
.g11{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{
 padding:18px;border:1px solid var(--line);border-radius:8px;
 background:var(--card);box-shadow:var(--shadow);
 transition:border-color .22s ease,transform .22s ease
}
.card:hover{border-color:#475569}
.card h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 15px;font-size:14px;font-weight:600;letter-spacing:.005em}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{
 display:inline-flex;align-items:center;min-height:24px;padding:3px 9px;border:1px solid transparent;
 border-radius:999px;font-size:10.5px;font-weight:700;line-height:1.2;white-space:nowrap
}
.t-ok{background:#123B34;color:#A7F3D0;border-color:#256C5E}
.t-warn{background:#463718;color:#FDE68A;border-color:#80621E}
.t-bad{background:#481F28;color:#FECACA;border-color:#8A3544}
.t-info{background:#302956;color:#DDD6FE;border-color:#5C4C99}
.t-sky{background:#403116;color:#FDE68A;border-color:#75571C}
.scroll{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left}
table.data th{background:#1B2230;color:#CBD5E1;font-size:11px;font-weight:600;text-transform:none;letter-spacing:.03em}
table.data td{color:#E2E8F0}
table.data tr:hover td{background:#282F3F}
table.data td:last-child{font-variant-numeric:tabular-nums}
.chartbox{position:relative;width:100%}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.bar{height:7px;overflow:hidden;border-radius:2px;background:#3A4356}
.bar i{display:block;height:100%;border-radius:2px;background:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:11px;color:#AAB7CA;font-size:11.5px}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;display:inline-block;border:1px solid rgba(255,255,255,.5);border-radius:2px}
.btn{
 min-height:36px;padding:7px 13px;border:1px solid transparent;border-radius:6px;
 font-size:11.5px;font-weight:700;transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s ease
}
.btn:hover{transform:translateY(-1px)}
.btn.ok{background:var(--accent);color:var(--color-on-primary);border-color:var(--accent)}
.btn.ok:hover{background:var(--accent2)}
.btn.no{background:transparent;color:#FCA5A5;border-color:#EF4444}
.btn.no:hover{background:#481F28}
.btn.gh{background:#293142;color:#E2E8F0;border-color:#526077}
.btn.gh:hover{background:#364055;border-color:#64748B}
.mini{display:flex;gap:7px;flex-wrap:wrap}
.ava{width:24px;height:24px;display:inline-grid;place-items:center;flex:none;border-radius:5px;background:var(--accent);color:var(--color-on-primary);font-size:10px;font-weight:700}
.dchk,.queue,.ocr,.appr{display:flex;flex-direction:column;gap:9px}
.dl,.al,.orow{
 display:flex;align-items:center;gap:11px;padding:11px 12px;
 border:1px solid var(--line);border-radius:7px;background:#1C2230;
 transition:border-color .2s ease,background-color .2s ease
}
.dl:hover,.al:hover,.orow:hover{border-color:#59667D;background:#212838}
.dl .st{width:29px;height:29px;display:grid;place-items:center;flex:none;border-radius:6px;color:#07111F}
.st.done{background:var(--ok)}.st.miss{background:var(--bad)}.st.flag{background:var(--warn)}.st.rev{background:#60A5FA}
.dl .st .material-symbols-outlined{font-size:17px}
.dl .nm,.al .nm{flex:1;min-width:0}
.dl .nm b,.al .nm b{display:block;font-size:13px;font-weight:600}
.dl .nm small,.al .nm small{display:block;color:#AAB7CA;font-size:11px}
.dl .rt{text-align:right;flex:none}
.aiflag,.okflag{
 display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1px solid;
 border-radius:999px;font-size:10.5px;font-weight:700;white-space:nowrap
}
.aiflag{background:#463718;color:#FDE68A;border-color:#80621E}
.okflag{background:#123B34;color:#A7F3D0;border-color:#256C5E}
.aiflag .material-symbols-outlined,.okflag .material-symbols-outlined{font-size:13px}
.qc{
 padding:12px 13px;border:1px solid var(--line);border-left:4px solid #60A5FA;
 border-radius:7px;background:#1C2230;transition:transform .2s ease,border-color .2s ease
}
.qc:hover{transform:translateX(2px);border-color:#64748B}
.qc.hi{border-left-color:var(--bad);background:#281F2A}
.qc.mid{border-left-color:var(--warn)}
.qc.lo{border-left-color:#60A5FA}
.qc .qt{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.qc .qt b{font-size:13px;font-weight:600}
.qc .qt .id,.tli .tm{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.qc .qt .id{color:#FBBF24;font-size:12px;font-weight:700}
.qc .meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;color:#AAB7CA;font-size:11.5px}
.qc .meta span{display:flex;align-items:center;gap:4px}
.qc .meta .material-symbols-outlined{font-size:14px}
.sla{margin-left:auto;text-align:right;flex:none}
.sla .num{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:15px;font-weight:700;line-height:1}
.sla small{display:block;color:#AAB7CA;font-size:9.5px}
.sla.red .num{color:#FCA5A5}.sla.amb .num{color:#FDE68A}.sla.grn .num{color:#A7F3D0}
.prog{display:flex;align-items:center;gap:8px;margin-top:9px;color:#AAB7CA;font-size:11px}
.prog .bar{flex:1}
.frm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{color:#B8C3D4;font-size:11px;font-weight:600}
.fld .box{min-height:39px;padding:9px 11px;border:1px solid #465167;border-radius:6px;background:#1B2230;color:#F8FAFC;font-size:13px}
.fld:nth-child(2) .box,.fld:nth-child(4) .box,.fld:nth-child(5) .box,.fld:nth-child(6) .box{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums}
.fld.full{grid-column:1/-1}
.orow .k{width:104px;flex:none;color:#B8C3D4;font-size:11.5px}
.orow .val{flex:1;min-width:0;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px;font-weight:600}
.orow .cf{flex:none;padding:3px 8px;border:1px solid;border-radius:999px;font-size:10.5px;font-weight:700}
.cf.hi{background:#123B34;color:#A7F3D0;border-color:#256C5E}
.cf.mi{background:#463718;color:#FDE68A;border-color:#80621E}
.score{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.scball{width:120px;height:120px;display:grid;place-items:center;position:relative;flex:none;border-radius:50%}
.scball:after{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--card)}
.scball .in{position:relative;z-index:1;text-align:center}
.scball .in b{display:block;color:var(--accent);font-size:31px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.scball .in small{color:#AAB7CA;font-size:10px}
.scdet{flex:1;min-width:190px}
.scrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12px}
.scrow .k{width:106px;flex:none;color:#B8C3D4}
.scrow .bar{flex:1}.scrow .n{width:38px;flex:none;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.al .st{width:27px;height:27px;display:grid;place-items:center;flex:none;border-radius:50%;color:#07111F}
.al .st.done{background:var(--ok)}.al .st.now{background:var(--accent)}.al .st.wait{background:#64748B;color:#F8FAFC}
.al .st .material-symbols-outlined{font-size:15px}
.tl{position:relative;padding-left:24px}
.tl:before{content:"";position:absolute;left:7px;top:5px;bottom:5px;width:2px;background:#526077}
.tli{position:relative;padding:0 0 17px 7px}
.tli:before{
 content:"";position:absolute;left:-21px;top:4px;width:11px;height:11px;border:3px solid var(--card);
 border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--accent)
}
.tli.mut:before{background:#64748B;box-shadow:0 0 0 2px #64748B}
.tli b{font-size:12.5px;font-weight:600}
.tli small{display:block;margin-top:2px;color:#AAB7CA;font-size:11px}
.tli .tm{color:#FBBF24;font-size:10.5px;font-weight:600}
.sug,.notice,.model-note{
 margin-top:12px;padding:11px 13px;border:1px solid var(--line)!important;
 border-radius:7px!important;background:#1B2230!important;color:#B8C3D4!important;font-size:12px
}
.notice{border-color:#80621E!important;background:#362B18!important;color:#FDE68A!important}
:is(a,button,[tabindex],input,select,textarea):focus-visible{
 outline:3px solid var(--color-ring);outline-offset:3px;box-shadow:0 0 0 1px #0F172A
}
@media(max-width:1024px){
 .shell{grid-template-columns:224px minmax(0,1fr)}
 .main{padding:24px 20px 34px}
 .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
 .g2{grid-template-columns:1fr}
}
@media(max-width:768px){
 .shell{display:block}
 .side{position:static;width:100%;height:auto;padding:14px;display:block;overflow:visible}
 .side .bd{padding-bottom:13px;margin-bottom:10px}
 #nav{display:flex;gap:6px;overflow-x:auto;padding:2px 1px 8px;scrollbar-width:thin}
 .side button{width:auto;min-width:max-content}
 .side button:hover{transform:none}
 .side .foot{display:none}
 .vh{align-items:flex-start}
 .g11,.two{grid-template-columns:1fr}
}
@media(max-width:520px){
 .main{padding:18px 14px 28px}
 .vh{display:block}
 .live{margin-top:12px}
 .kpis,.frm{grid-template-columns:1fr}
 .card{padding:15px}
 .dl,.al,.orow{align-items:flex-start}
 .dl .rt{width:100%;text-align:left;padding-left:40px}
 .dl{flex-wrap:wrap}
 .orow{flex-wrap:wrap}
 .orow .k{width:100%}
 .orow .cf{margin-left:auto}
 .mini .btn{flex:1}
 .qc .qt b{width:calc(100% - 70px)}
 .sla{margin-left:33px}
}
@media(prefers-reduced-motion:reduce){
 html{scroll-behavior:auto}
 *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
 .live i{animation:none}
}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
 <div class="bd"><div class="lg">貸</div><div><b>貸款文件審核站</b><span>LOAN DOC REVIEW</span></div></div>
 <div id="nav"></div>
 <div class="foot">授信文件審核平台 · 個貸/房貸<br/>本日申請 58 · 待審 21<br/>AI 文件辨識率 96% · 缺件率 2.8%</div>
</aside>
<main class="main">
 <div class="vh"><div><h2 id="vt">審核總覽</h2><p id="vd"></p></div><div class="live"><i aria-hidden="true"></i>案件審核作業中</div></div>
 <div id="view"></div>
</main>
</div>
<script>
const MOD=[
["審核總覽","dashboard","審核總覽","貸款案件、文件齊備率與審核時效的全局儀表"],
["貸款申請","assignment","貸款申請受理","建立貸款申請案、登錄借款人與額度資訊"],
["文件檢核","fact_check","文件齊備檢核","收件清單比對、AI 文件辨識與風險標記"],
["信用評分","shield","徵信信用評分","聯徵查詢、信用評分模型與可貸額度建議"],
["核准撥貸","gavel","核准撥貸","多層授信核決、撥款排程與適足性檢核"],
["案件追蹤","history","案件追蹤稽核","全程進度追蹤、稽核軌跡與操作紀錄"]
];
const nav=document.getElementById("nav"),view=document.getElementById("view"),vt=document.getElementById("vt"),vd=document.getElementById("vd");
MOD.forEach((m,i)=>{
 const b=document.createElement("button");
 b.type="button";b.dataset.i=i;b.className=i===0?"on":"";
 b.innerHTML='<span class="material-symbols-outlined" aria-hidden="true">'+m[1]+"</span>"+m[0];
 b.onclick=()=>show(i);nav.appendChild(b);
});
const CASES=[
["LN-25081","hi","林志豪 · 個人信貸","林","信用貸款","NT$ 80 萬","hi","red","-04:10","逾時",90,"待主管核決"],
["LN-25078","mid","陳怡君 · 房屋貸款","陳","房屋貸款","NT$ 1,050 萬","mid","amb","01:26","剩",60,"徵信評分中"],
["LN-25075","mid","王大明 · 汽車貸款","王","汽車貸款","NT$ 62 萬","mid","amb","02:48","剩",40,"文件補件中"],
["LN-25072","lo","黃淑芬 · 房屋貸款","黃","房屋貸款","NT$ 780 萬","lo","grn","06:30","剩",25,"文件檢核中"],
["LN-25069","hi","張俊傑 · 企業週轉","張","企業貸款","NT$ 500 萬","hi","red","-01:15","逾時",75,"待覆核"],
["LN-25066","lo","吳雅婷 · 信用貸款","吳","信用貸款","NT$ 45 萬","lo","grn","08:05","剩",100,"已撥款"]
];
const DOCS=[
["身分證正反面","身分核對","done","OCR 擷取完成 · 效期正常"],
["最近三個月薪資轉帳明細","財力證明","flag","AI 標記：第 2 頁金額塗改，需人工複核"],
["扣繳憑單／綜所稅","財力證明","done","年所得 NT$ 96 萬 · 已比對"],
["在職證明","財力證明","done","任職滿 3 年 · 已核對"],
["不動產權狀影本","擔保品","miss","缺件 · 已發送補件通知"],
["聯徵中心查詢同意書","徵信授權","done","已簽署 · 授權有效"],
["近一年信用卡帳單","徵信參考","rev","AI 辨識：循環信用使用率偏高，建議複核"],
["購屋契約／買賣合約","擔保品","miss","缺件 · 房貸案必要文件"]
];
const DST={
 done:["done","check","已齊備","okflag"],
 miss:["miss","priority_high","缺件","aiflag"],
 flag:["flag","flag","AI 風險標記","aiflag"],
 rev:["rev","visibility","待複核","aiflag"]
};
const OCR=[
["借款人姓名","林志豪","hi"],["身分證字號","A12****789","hi"],
["申請額度","NT$ 800,000","hi"],["年所得（憑單）","NT$ 960,000","hi"],
["薪資明細金額","NT$ 62,000／月","mi"],["任職公司","O昀電腦股份有限公司","hi"],
