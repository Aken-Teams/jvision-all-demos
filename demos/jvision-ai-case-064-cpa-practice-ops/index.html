<title>事務所案件進度艙 · CPA Practice Ops</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--ink:#0f172a;--accent:#475569;--accent2:#64748b;--bg:#eef1f5;--card:#fff;--line:#dde3ec;--mut:#64748b;--ok:#0f766e;--warn:#c2660c;--bad:#be123c;--info:#1e4a8a}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.shell{display:grid;grid-template-columns:244px 1fr;min-height:100vh}
.shell>*{min-width:0}
.side{background:linear-gradient(180deg,#334155,#1e293b);color:#cbd5e1;padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.side .bd{display:flex;align-items:center;gap:11px;padding:6px 8px 16px}
.side .lg{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#64748b,#334155);display:grid;place-items:center;font-weight:800;color:#fff;flex:none;box-shadow:0 6px 18px rgba(15,23,42,.5);font-family:"Noto Sans TC"}
.side .bd b{font-size:15px;font-weight:800;font-family:"Noto Sans TC";display:block;color:#fff}
.side .bd span{font-size:9.5px;color:#94a3b8;letter-spacing:1.6px}
.side button{display:flex;align-items:center;gap:11px;background:transparent;border:0;color:#cbd5e1;font:inherit;font-weight:600;font-size:13.5px;padding:11px 12px;border-radius:10px;cursor:pointer;text-align:left;width:100%;font-family:"Noto Sans TC";flex:none;white-space:nowrap}
.side button .material-symbols-outlined{font-size:20px;color:#94a3b8}
.side button:hover{background:rgba(255,255,255,.06)}
.side button.on{background:linear-gradient(135deg,#64748b,#475569);color:#fff;font-weight:800}
.side button.on .material-symbols-outlined{color:#fff}
.side .foot{margin-top:auto;padding:12px 10px;font-size:11px;color:#94a3b8;border-top:1px solid rgba(255,255,255,.12);line-height:1.7}
.main{padding:22px 24px 34px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.live{background:#e2e8f0;color:#334155;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px;white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpis>*{min-width:0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px 15px 20px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent2),var(--accent))}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .l .material-symbols-outlined{font-size:16px;color:var(--accent)}
.kpi .v{font-size:24px;font-weight:800;margin-top:5px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px;color:var(--ok)}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:1.4fr .9fr}
.g11{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.card h3 .sp{margin-left:auto;font-size:11px;color:var(--mut);font-weight:600}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap;display:inline-block}
.t-ok{background:#ccfbf1;color:#0f766e}.t-warn{background:#fef1dd;color:#b45309}.t-bad{background:#ffe4e6;color:#be123c}.t-info{background:#dbe6f7;color:#1e4a8a}.t-mut{background:#e2e8f0;color:#475569}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#f1f4f9;white-space:nowrap}
table.data td b{font-family:"Noto Sans TC"}
.pos{color:var(--bad);font-weight:800;font-family:Inter}
.neg{color:var(--ok);font-weight:800;font-family:Inter}
.bar{height:8px;background:#eef1f5;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.chart{height:250px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two>*{min-width:0}
.scroll{overflow-x:auto}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat>*{min-width:0}
.st{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card)}
.st .l{font-size:11.5px;color:var(--mut);font-weight:600}
.st .v{font-size:19px;font-weight:800;font-family:Inter;margin-top:3px}
.alist{display:flex;flex-direction:column;gap:9px}
.al{display:flex;gap:11px;align-items:flex-start;border-left:3px solid var(--warn);background:#fef9f0;border-radius:0 10px 10px 0;padding:9px 12px}
.al.bad{border-color:var(--bad);background:#fff1f3}.al.info{border-color:var(--info);background:#eff4fb}
.al .material-symbols-outlined{font-size:19px;color:var(--warn);flex:none}
.al.bad .material-symbols-outlined{color:var(--bad)}.al.info .material-symbols-outlined{color:var(--info)}
.al b{font-size:12.5px;font-family:"Noto Sans TC"}
.al small{display:block;color:var(--mut);font-size:11px;margin-top:1px;line-height:1.5}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.mc{border:1px solid var(--line);border-radius:14px;padding:14px}
.mc b{font-family:"Noto Sans TC";font-size:14px;display:block}
.mc small{color:var(--mut);font-size:11px}
.mc .num{font-size:22px;font-weight:800;font-family:Inter;margin:8px 0 6px}
/* kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:13px;overflow-x:auto;padding-bottom:6px}
.col{background:#f4f6fa;border:1px solid var(--line);border-radius:15px;padding:11px;display:flex;flex-direction:column;gap:9px;min-width:0}
.col-h{display:flex;align-items:center;gap:8px;font-family:"Noto Sans TC";font-weight:800;font-size:13px}
.col-h .cnt{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 9px;font-size:11px;color:var(--mut);font-weight:700}
.col-h .dt{width:9px;height:9px;border-radius:50%;flex:none}
.kc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;cursor:pointer;transition:.15s;border-left:4px solid var(--accent)}
.kc:hover{box-shadow:0 6px 18px rgba(51,65,85,.14);transform:translateY(-2px)}
.kc .id{font-size:11px;font-weight:800;color:var(--accent);font-family:Inter;display:flex;align-items:center;gap:5px}
.kc .ti{font-size:12.5px;font-family:"Noto Sans TC";font-weight:700;margin:5px 0 7px;line-height:1.4}
.kc .mt{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kc .foot{display:flex;align-items:center;gap:7px;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);font-size:11px;color:var(--mut)}
.kc .av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;font-family:"Noto Sans TC"}
.mini{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--mut)}
.mini .material-symbols-outlined{font-size:14px}
/* worktime billing panel */
.wt{display:flex;flex-direction:column;gap:9px}
.wr{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.wr .av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;font-family:"Noto Sans TC";flex:none;font-size:13px}
.wr .mid{flex:1;min-width:0}
.wr .mid b{font-size:12.5px;font-family:"Noto Sans TC"}
.wr .mid small{color:var(--mut);font-size:11px;display:block}
.wr .rt{text-align:right;flex:none}
.wr .rt b{font-family:Inter;font-size:14px}
.wr .rt small{color:var(--mut);font-size:10.5px;display:block}
/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.ti{position:relative;padding:0 0 15px 4px}
.ti::before{content:"";position:absolute;left:-21px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.ti.w::before{background:var(--warn)}.ti.b::before{background:var(--bad)}.ti.g::before{background:var(--ok)}
.ti .tt{font-size:12.5px;font-family:"Noto Sans TC";font-weight:700}
.ti small{color:var(--mut);font-size:11px}
.ti .dsc{font-size:12px;color:#475569;margin-top:2px;line-height:1.5}
/* approval steps */
.appr{display:flex;flex-direction:column;gap:0}
.ap{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:15px}
.ap::before{content:"";position:absolute;left:16px;top:33px;bottom:0;width:2px;background:var(--line)}
.ap:last-child::before{display:none}
.ap .dot{width:33px;height:33px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.ap .dot.done{background:var(--ok)}.ap .dot.now{background:var(--accent)}.ap .dot.wait{background:#cbd5e1;color:#64748b}.ap .dot.bad{background:var(--bad)}
.ap .ab{flex:1;min-width:0;border:1px solid var(--line);border-radius:11px;padding:9px 12px}
.ap .ab b{font-family:"Noto Sans TC";font-size:13px}
.ap .ab small{display:block;color:var(--mut);font-size:11px;margin-top:1px;line-height:1.5}
/* doc receipt */
.dl{display:flex;flex-direction:column;gap:8px}
.di{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.di .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;color:#fff}
.di .mid{flex:1;min-width:0}
.di .mid b{font-size:12.5px;font-family:"Noto Sans TC"}
.di .mid small{color:var(--mut);font-size:11px;display:block}
/* schedule cal */
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:13px}
.cal>*{min-width:0}
.cc{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:13px;padding:13px}
.cc.warn{border-left-color:var(--warn)}.cc.bad{border-left-color:var(--bad)}.cc.ok{border-left-color:var(--ok)}
.cc .dd{font-size:11px;color:var(--mut);font-weight:700;font-family:Inter}
.cc b{font-family:"Noto Sans TC";font-size:13.5px;display:block;margin:3px 0 6px}
.cc small{color:var(--mut);font-size:11px;display:block;line-height:1.6}
.prog{height:8px;background:#eef1f5;border-radius:6px;overflow:hidden;margin:8px 0 5px}
.prog i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
@media(max-width:860px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;overflow:visible}.side .bd{width:100%;padding-bottom:8px}.side button{width:auto}.side .foot{display:none}.side #nav{display:flex;flex-wrap:wrap;gap:4px}.kpis,.stat{grid-template-columns:repeat(2,1fr)}.g2,.g11,.two{grid-template-columns:1fr}}
@media(max-width:480px){.kpis,.stat{grid-template-columns:1fr}}
</style>
</head>

    var col=document.createElement('div');col.className='col';
    var cnt=KAN.filter(function(k){return k[0]===ci;}).length;
    col.innerHTML='<div class="col-h"><span class="dt" style="background:'+c[1]+'"></span>'+c[0]+'<span class="cnt">'+cnt+'</span></div>';
