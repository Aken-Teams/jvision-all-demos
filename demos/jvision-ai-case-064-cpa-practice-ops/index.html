<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#0F172A"/>
<title>會計事務所案件管理台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#0F172A;
  --color-on-primary:#FFFFFF;
  --color-secondary:#334155;
  --color-on-secondary:#FFFFFF;
  --color-accent:#0369A1;
  --color-on-accent:#FFFFFF;
  --color-background:#F8FAFC;
  --color-foreground:#020617;
  --color-card:#FFFFFF;
  --color-card-foreground:#020617;
  --color-muted:#E8ECF1;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0F172A;
  --blue:#0369A1;
  --ink:#020617;
  --muted:#475569;
  --line:#E2E8F0;
  --ok:#047857;
  --warn:#A64B08;
  --bad:#DC2626;
  --info:#075985;
  --shadow-sm:0 1px 2px rgba(15,23,42,.05);
  --shadow-md:0 10px 28px rgba(15,23,42,.08);
  --radius:10px;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-width:320px;
  background:
    linear-gradient(rgba(15,23,42,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(15,23,42,.025) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--color-foreground);
  font-family:Lato,"Noto Sans TC",system-ui,sans-serif;
  font-size:16px;
  line-height:1.5;
}
button,a,[tabindex]{-webkit-tap-highlight-color:transparent}
button{font:inherit}
button,[role="button"]{cursor:pointer}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
  border-radius:6px;
}
.skip-link{
  position:fixed;z-index:1000;top:12px;left:12px;
  padding:10px 16px;background:var(--color-on-primary);color:var(--color-primary);
  border:2px solid var(--color-primary);border-radius:8px;
  font-weight:700;transform:translateY(-180%);
}
.skip-link:focus{transform:translateY(0)}
.material-symbols-outlined{font-size:20px;line-height:1;vertical-align:middle}
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.side{
  position:sticky;top:0;height:100vh;overflow:auto;
  display:flex;flex-direction:column;gap:6px;
  padding:22px 16px;
  background:var(--color-primary);color:#CBD5E1;
  border-right:1px solid rgba(255,255,255,.1);
}
.bd{
  display:flex;align-items:center;gap:12px;
  min-height:64px;padding:4px 8px 20px;
  border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:10px;
}
.lg{
  width:46px;height:46px;flex:none;display:grid;place-items:center;
  border:1px solid rgba(255,255,255,.28);border-radius:8px;
  background:#FFFFFF;color:var(--color-primary);
  font-family:"EB Garamond",serif;font-size:25px;font-weight:700;
  box-shadow:0 8px 20px rgba(0,0,0,.2);
}
.bd b{
  display:block;color:#FFFFFF;
  font-family:"EB Garamond","Noto Serif TC",serif;
  font-size:18px;line-height:1.15;letter-spacing:.02em;
}
.bd span{display:block;margin-top:4px;color:#CBD5E1;font-size:10px;letter-spacing:.14em}
#nav{display:flex;flex-direction:column;gap:5px}
.side button{
  position:relative;display:flex;align-items:center;gap:11px;
  width:100%;min-height:46px;padding:10px 12px;
  border:1px solid transparent;border-radius:8px;
  background:transparent;color:#E2E8F0;text-align:left;
  font-weight:700;font-size:14px;white-space:nowrap;
  transition:background-color .2s,border-color .2s,color .2s,transform .2s;
}
.side button:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14)}
.side button.on{
  background:#FFFFFF;color:var(--color-primary);border-color:#FFFFFF;
  box-shadow:0 7px 20px rgba(0,0,0,.18);
}
.side button.on::before{
  content:"";position:absolute;left:-16px;top:11px;width:4px;height:24px;
  background:#38BDF8;border-radius:0 4px 4px 0;
}
.side button .material-symbols-outlined{color:#94A3B8}
.side button.on .material-symbols-outlined{color:var(--color-accent)}
.side .foot{
  margin-top:auto;padding:16px 10px 2px;
  border-top:1px solid rgba(255,255,255,.14);
  color:#CBD5E1;font-size:12px;line-height:1.75;
}
.main{min-width:0;padding:28px clamp(16px,2.4vw,36px) 44px}
.vh{
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:20px;flex-wrap:wrap;margin-bottom:20px;
  padding-bottom:17px;border-bottom:1px solid var(--color-border);
}
.vh h2{
  margin:0;color:var(--color-primary);
  font-family:"EB Garamond","Noto Serif TC",serif;
  font-size:clamp(28px,3vw,38px);font-weight:700;line-height:1.08;
}
.vh p{margin:6px 0 0;color:var(--color-muted-foreground);font-size:14px}
.live{
  display:flex;align-items:center;gap:8px;min-height:36px;
  padding:7px 12px;border:1px solid #BAE6FD;border-radius:999px;
  background:#F0F9FF;color:#075985;font-size:12px;font-weight:700;
}
.live .material-symbols-outlined{font-size:16px}
.live i{
  width:9px;height:9px;border:2px solid #FFFFFF;border-radius:50%;
  background:#0284C7;box-shadow:0 0 0 2px #BAE6FD;
  animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{50%{opacity:.45;transform:scale(.86)}}
.kpis,.stat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi,.st,.card{
  background:var(--color-card);color:var(--color-card-foreground);
  border:1px solid var(--color-border);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
}
.kpi{
  position:relative;overflow:hidden;min-height:122px;padding:17px 17px 15px;
  border-top:3px solid var(--color-secondary);
  transition:transform .2s,box-shadow .2s,border-color .2s;
}
.kpi:hover,.st:hover,.card:hover{border-color:#CBD5E1;box-shadow:var(--shadow-md)}
.kpi::after{
  content:"";position:absolute;right:-20px;bottom:-36px;
  width:95px;height:95px;border:1px solid #E2E8F0;border-radius:50%;
}
.kpi .l,.st .l{
  display:flex;align-items:center;gap:7px;
  color:var(--color-muted-foreground);font-size:12px;font-weight:700;
  letter-spacing:.03em;
}
.kpi .l .material-symbols-outlined{color:var(--color-accent);font-size:18px}
.kpi .v,.st .v,.num{
  color:var(--color-primary);font-variant-numeric:tabular-nums;
}
.kpi .v{margin-top:7px;font-size:26px;font-weight:700;line-height:1.1}
.kpi .d{margin-top:5px;color:var(--ok);font-size:11px;font-weight:700}
.stat{gap:10px}
.st{
  position:relative;padding:14px 15px;min-height:82px;
  border-left:3px solid var(--color-secondary);
  transition:border-color .2s,box-shadow .2s;
}
.st .v{margin-top:4px;font-size:21px;font-weight:700}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:minmax(0,1.45fr) minmax(300px,.85fr)}
.g11,.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{min-width:0;padding:17px}
.card h3{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--color-border);
  color:var(--color-primary);font-size:14px;font-weight:700;
}
.card h3 .material-symbols-outlined{color:var(--color-accent)}
.card h3 .sp{margin-left:auto;color:var(--color-muted-foreground);font-size:11px;font-weight:400}
.tag{
  display:inline-flex;align-items:center;gap:4px;min-height:24px;
  padding:3px 9px;border:1px solid currentColor;border-radius:999px;
  font-size:11px;font-weight:700;line-height:1;white-space:nowrap;
}
.t-ok{background:#ECFDF5;color:#047857}
.t-warn{background:#FFF7ED;color:#9A3412}
.t-bad{background:#FEF2F2;color:#B91C1C}
.t-info{background:#F0F9FF;color:#075985}
.t-mut{background:#F1F5F9;color:#334155}
.scroll{overflow-x:auto;border:1px solid var(--color-border);border-radius:8px}
table.data{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.data th,table.data td{padding:11px 12px;border-bottom:1px solid var(--color-border);text-align:left}
table.data th{
  position:sticky;top:0;z-index:1;background:#F1F5F9;color:#334155;
  font-size:11px;font-weight:700;letter-spacing:.04em;white-space:nowrap;
}
table.data tr:last-child td{border-bottom:0}
table.data tbody tr:hover td,table.data tr:not(:first-child):hover td{background:#F8FAFC}
table.data td:first-child,table.data td:first-child b{
  font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;
}
table.data td:last-child{text-align:right;font-variant-numeric:tabular-nums}
table.data th:last-child{text-align:right}
.bar,.prog{height:8px;overflow:hidden;background:#E2E8F0;border-radius:999px}
.bar i,.prog i{
  display:block;height:100%;border-radius:inherit;
  background:var(--color-accent);
}
.chart{height:250px}
.alist,.wt,.dl{display:flex;flex-direction:column;gap:9px}
.al{
  display:flex;align-items:flex-start;gap:10px;padding:10px 12px;
  border:1px solid #FED7AA;border-left:4px solid var(--warn);border-radius:7px;
  background:#FFFBEB;
}
.al.bad{border-color:#FECACA;border-left-color:var(--bad);background:#FEF2F2}
.al.info{border-color:#BAE6FD;border-left-color:var(--info);background:#F0F9FF}
.al .material-symbols-outlined{flex:none;color:var(--warn);font-size:19px}
.al.bad .material-symbols-outlined{color:var(--bad)}
.al.info .material-symbols-outlined{color:var(--info)}
.al b{font-size:13px}
.al small,.mc small,.wr small,.di small,.cc small,.ti small,.ap small{
  color:var(--color-muted-foreground);font-size:11px;line-height:1.5;
}
.al small,.wr small,.di small,.cc small,.ap small{display:block}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.mc{padding:13px;border:1px solid var(--color-border);border-radius:8px;background:#F8FAFC}
.mc b{display:block;font-size:14px}
.mc .num{margin:6px 0;font-size:23px;font-weight:700}
.board{
  display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);
  gap:12px;overflow-x:auto;padding:2px 2px 9px;
}
.col{
  display:flex;flex-direction:column;gap:9px;min-width:0;padding:11px;
  border:1px solid var(--color-border);border-radius:9px;background:#F1F5F9;
}
.col-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.col-h .cnt{
  margin-left:auto;padding:2px 8px;border:1px solid var(--color-border);
  border-radius:999px;background:#FFFFFF;color:var(--color-muted-foreground);
  font:700 11px var(--mono);
}
.col-h .dt{width:9px;height:9px;border-radius:2px}
.kc{
  padding:11px;border:1px solid var(--color-border);border-left:4px solid var(--color-accent);
  border-radius:8px;background:#FFFFFF;cursor:pointer;
  transition:transform .2s,box-shadow .2s,border-color .2s;
}
.kc:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.kc:focus-visible{outline:3px solid var(--color-ring);outline-offset:2px}
.kc .id{display:flex;align-items:center;gap:4px;color:var(--color-accent);font:700 11px var(--mono)}
.kc .ti{margin:5px 0 8px;font-size:13px;font-weight:700;line-height:1.4}
.kc .mt,.kc .foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kc .foot{margin-top:9px;padding-top:9px;border-top:1px dashed var(--color-border);color:var(--color-muted-foreground);font-size:11px}
.av{
  display:grid;place-items:center;color:#FFFFFF;font-weight:700;
  border:1px solid rgba(255,255,255,.45);
}
.kc .av{width:24px;height:24px;border-radius:6px}
.mini{display:flex;align-items:center;gap:3px;color:var(--color-muted-foreground);font-size:10.5px}
.mini .material-symbols-outlined{font-size:14px}
.wr,.di{
  display:flex;align-items:center;gap:11px;padding:10px 12px;
  border:1px solid var(--color-border);border-radius:8px;background:#FFFFFF;
}
.wr .av{width:36px;height:36px;flex:none;border-radius:7px;font-size:13px}
.wr .mid,.di .mid{flex:1;min-width:0}
.wr .mid b,.di .mid b{font-size:13px}
.wr .rt{flex:none;text-align:right;font-variant-numeric:tabular-nums}
.wr .rt b{font-size:14px}
.di .ic{
  display:grid;place-items:center;width:34px;height:34px;flex:none;
  border-radius:7px;color:#FFFFFF;
}
.tl{position:relative;padding-left:24px}
.tl::before{
  content:"";position:absolute;left:7px;top:4px;bottom:4px;
  width:2px;background:var(--color-border);
}
.tl .ti{position:relative;padding:0 0 16px 4px}
.tl .ti::before{
  content:"";position:absolute;left:-22px;top:3px;width:12px;height:12px;
  border:3px solid #FFFFFF;border-radius:50%;background:var(--color-accent);
  box-shadow:0 0 0 1px var(--color-border);
}
.tl .ti.w::before{background:var(--warn)}
.tl .ti.b::before{background:var(--bad)}
.tl .ti.g::before{background:var(--ok)}
.tl .tt{font-size:13px;font-weight:700}
.tl .dsc{margin-top:2px;color:#334155;font-size:12px;line-height:1.5}
.appr{display:flex;flex-direction:column}
.ap{position:relative;display:flex;gap:12px;align-items:flex-start;padding-bottom:15px}
.ap::before{
  content:"";position:absolute;left:16px;top:34px;bottom:0;
  width:2px;background:var(--color-border);
}
.ap:last-child::before{display:none}
.ap .dot{
  display:grid;place-items:center;width:34px;height:34px;flex:none;
  border-radius:7px;color:#FFFFFF;font:700 13px var(--mono);
}
.ap .dot.done{background:var(--ok)}
.ap .dot.now{background:var(--color-accent)}
.ap .dot.wait{background:#64748B}
.ap .dot.bad{background:var(--bad)}
.ap .ab{
  flex:1;min-width:0;padding:9px 12px;
  border:1px solid var(--color-border);border-radius:8px;
}
.ap .ab b{font-size:13px}
.cal{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:11px}
.cc{
  padding:13px;border:1px solid var(--color-border);
  border-top:4px solid var(--color-accent);border-radius:8px;background:#FFFFFF;
}
.cc.warn{border-top-color:var(--warn)}
.cc.bad{border-top-color:var(--bad)}
.cc.ok{border-top-color:var(--ok)}
.cc .dd{color:var(--color-muted-foreground);font:700 11px var(--mono)}
.cc b{display:block;margin:4px 0 7px;font-size:13px}
.prog{margin:8px 0 6px}
.view-enter>.kpi,.view-enter>.st,.view-enter>.card,
.view-enter .grid>.card,.view-enter .two>.card,.view-enter .grid-item{
  animation:stagger-in .42s cubic-bezier(.2,.8,.2,1) both;
}
.view-enter>*:nth-child(2){animation-delay:.05s}
.view-enter>*:nth-child(3){animation-delay:.1s}
.view-enter>*:nth-child(4){animation-delay:.15s}
@keyframes stagger-in{
  from{opacity:0;transform:translateY(14px) scale(.98)}
  to{opacity:1;transform:none}
}
@media(max-width:1024px){
  .shell{grid-template-columns:224px minmax(0,1fr)}
  .kpis,.stat{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2{grid-template-columns:1fr}
}
@media(max-width:768px){
  .shell{display:block}
  .side{
    position:relative;height:auto;overflow:visible;padding:14px;
    border-right:0;border-bottom:1px solid rgba(255,255,255,.15);
  }
  .bd{padding:2px 4px 12px;margin-bottom:5px}
  #nav{
    display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;
  }
  .side button{justify-content:center;min-height:48px;padding:9px 7px;font-size:12px}
  .side button.on::before{display:none}
  .side .foot{display:none}
  .main{padding-top:22px}
  .g11,.two{grid-template-columns:1fr}
}
@media(max-width:480px){
  body{font-size:15px}
  #nav{grid-template-columns:repeat(2,minmax(0,1fr))}
  .side button{justify-content:flex-start}
  .kpis,.stat{grid-template-columns:1fr}
  .vh{align-items:flex-start}
  .live{width:100%;justify-content:center}
  .card{padding:14px}
  .card h3 .sp{width:100%;margin-left:28px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  .view-enter>*{opacity:1!important;transform:none!important}
}
@media(prefers-color-scheme:dark){
  :root{
    --color-background:#0B1120;
    --color-foreground:#F8FAFC;
    --color-card:#111827;
    --color-card-foreground:#F8FAFC;
    --color-muted:#1E293B;
    --color-muted-foreground:#CBD5E1;
    --color-border:#334155;
    --color-ring:#7DD3FC;
    --ink:#F8FAFC;
    --muted:#CBD5E1;
    --line:#334155;
  }
  body{
    background:
      linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),
      var(--color-background);
    background-size:32px 32px;
  }
  .vh h2,.kpi .v,.st .v,.num,.card h3{color:#F8FAFC}
  .kpi,.st,.card,.wr,.di,.cc,.kc,.ap .ab{background:#111827}
  .col,.mc,table.data th{background:#1E293B}
  table.data tbody tr:hover td,table.data tr:not(:first-child):hover td{background:#182235}
  table.data th{color:#E2E8F0}
  .tl .dsc{color:#CBD5E1}
  .tag{border-color:currentColor}
  .t-ok{background:#052E2B;color:#6EE7B7}
  .t-warn{background:#431407;color:#FDBA74}
  .t-bad{background:#450A0A;color:#FCA5A5}
  .t-info{background:#082F49;color:#7DD3FC}
  .t-mut{background:#1E293B;color:#E2E8F0}
  .al{background:#422006;border-color:#92400E}
  .al.bad{background:#450A0A;border-color:#991B1B}
  .al.info{background:#082F49;border-color:#0369A1}
  .bar,.prog{background:#334155}
}
</style>
</head>
<body>
<a class="skip-link" href="#view">跳至主要內容</a>
<div class="shell">
  <aside class="side" aria-label="主要導覽">
    <div class="bd">
      <div class="lg" aria-hidden="true">帳</div>
      <div><b>會計事務所案件管理台</b><span>CPA PRACTICE WORKSPACE</span></div>
    </div>
    <nav id="nav" aria-label="案件管理畫面"></nav>
    <div class="foot">在管案件 48 件 · 承辦 9 人<br/>本月申報 21 · 逾期 3<br/>© JVISION Practice Ops</div>
  </aside>
  <main class="main" id="main-content">
    <header class="vh">
      <div><h2 id="vt">事務所總覽</h2><p id="vd"></p></div>
      <div class="live" role="status"><i aria-hidden="true"></i><span class="material-symbols-outlined" aria-hidden="true">verified_user</span>案件進度即時彙整</div>
    </header>
    <div id="view" tabindex="-1"></div>
  </main>
</div>
<script>
var MOD=[
["事務所總覽","dashboard","事務所總覽","案件產能、工時計費與逾期戰情"],
["客戶案件","folder_shared","客戶案件","記帳／查核／稅務案件清單與進度"],
["進度看板","view_kanban","進度看板","收件 → 處理 → 覆核 → 交付"],
["工時計費","schedule","工時計費","人員工時記錄、計費彙整與回收率"],
["文件收件","inbox","文件收件","客戶憑證收件與缺件追蹤"],
["申報排程","event_upcoming","申報排程","營所稅／營業稅期限與交付排程"]
];

MOD.forEach(function(m,i){

function show(i){
  i=Math.max(0,Math.min(i,MOD.length-1));
  nav.querySelectorAll("button").forEach(function(b){
    var active=+b.dataset.i===i;
    b.classList.toggle("on",active);
    b.setAttribute("aria-current",active?"page":"false");
  });
  vt.textContent=MOD[i][2];
  vd.textContent=MOD[i][3];
  view.classList.remove("view-enter");
  view.innerHTML=SCREENS[i]();
  void view.offsetHeight;
  view.classList.add("view-enter");
  draw(i);
}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  show(m?Math.min(+m[1],MOD.length-1):0);

}
