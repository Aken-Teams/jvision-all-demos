.board{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:10px;min-width:900px}
.col{padding:12px;background:#F1F5F9;border:1px solid var(--color-primary)}.col h4{display:flex;justify-content:space-between;gap:8px;margin:0 0 11px;font-size:12px;text-transform:uppercase;letter-spacing:.04em}.cnt{padding:1px 7px;background:var(--color-primary);color:#fff}

@media(max-width:1100px){.g-kpi{grid-template-columns:repeat(2,1fr)}.g-side{grid-template-columns:1fr}}

</style>
