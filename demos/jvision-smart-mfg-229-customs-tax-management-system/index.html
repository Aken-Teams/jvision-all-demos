<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>關稅與稅務管理系統 Customs &amp; Tax Management System</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#1d4ed8; --accent2:#60a5fa; --bg:#f1f5f9; --card:#ffffff;
  --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --sidebar:#0b1a3a; --sidebar2:#12234d;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --soft:#eff6ff;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",sans-serif; background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.app{display:flex;min-height:100vh;align-items:stretch;}
.sidebar{
  width:248px;flex:0 0 248px;background:linear-gradient(180deg,var(--sidebar),var(--sidebar2));
  color:#e2e8f0;padding:22px 16px;display:flex;flex-direction:column;gap:6px;min-width:0;
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px;}
.brand .logo{
  width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 42px;
}
.brand .logo .material-symbols-outlined{font-size:26px;}
.brand h1{font-size:15px;margin:0;font-weight:800;color:#fff;line-height:1.3;}
.brand p{font-size:11px;margin:2px 0 0;color:#93c5fd;font-weight:500;}
.navlabel{font-size:11px;color:#64748b;letter-spacing:1px;padding:10px 10px 4px;font-weight:700;}
.nav{display:flex;flex-direction:column;gap:4px;}
.navbtn{
  display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;border:0;
  background:transparent;color:#cbd5e1;font-family:inherit;font-size:13.5px;font-weight:600;
  cursor:pointer;text-align:left;width:100%;transition:.15s;min-width:0;
}
.navbtn .material-symbols-outlined{font-size:21px;flex:0 0 auto;}
.navbtn .nx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.navbtn:hover{background:rgba(96,165,250,.12);color:#fff;}
.navbtn.on{background:linear-gradient(135deg,var(--accent),#2563eb);color:#fff;box-shadow:0 6px 16px -6px rgba(37,99,235,.7);}
.side-foot{margin-top:auto;padding:14px 10px 2px;font-size:11px;color:#64748b;line-height:1.6;border-top:1px solid rgba(148,163,184,.15);}
.main{flex:1 1 auto;min-width:0;padding:24px 28px 42px;max-width:100%;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
.topbar .th{min-width:0;}
.topbar h2{margin:0;font-size:21px;font-weight:800;letter-spacing:-.3px;}
.topbar .sub{margin:3px 0 0;font-size:13px;color:var(--muted);}
.tb-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--accent);border:1px solid #dbeafe;padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:700;}
.pill .material-symbols-outlined{font-size:17px;}
.who{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);padding:6px 12px 6px 8px;border-radius:999px;font-size:12.5px;font-weight:600;}
.who .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;box-shadow:0 1px 2px rgba(15,23,42,.04);}
.card h3{margin:0 0 3px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:20px;color:var(--accent);}
.card .cdesc{font-size:12px;color:var(--muted);margin:0 0 14px;}
.grid{display:grid;gap:16px;}
.g-kpi{grid-template-columns:repeat(4,1fr);}
.g-2{grid-template-columns:1.4fr 1fr;}
.g-2e{grid-template-columns:1fr 1fr;}
.g-side{grid-template-columns:1fr 320px;}
.mt{margin-top:16px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;min-width:0;position:relative;overflow:hidden;}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent),var(--accent2));}
.kpi .kl{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;}
.kpi .kl .material-symbols-outlined{font-size:17px;color:var(--accent);}
.kpi .kv{font-size:26px;font-weight:800;margin:8px 0 2px;letter-spacing:-.5px;}
.kpi .kd{font-size:11.5px;font-weight:700;}
.kpi .kd.up{color:var(--ok);} .kpi .kd.down{color:var(--bad);} .kpi .kd.neu{color:var(--muted);}
.chart{width:100%;height:280px;overflow:hidden;}
.chart.sm{height:230px;}
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px;}
th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{background:#f8fafc;color:var(--muted);font-weight:700;font-size:11.5px;letter-spacing:.3px;position:sticky;top:0;}
tbody tr:hover{background:#f8fafc;}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;line-height:1.4;}
.t-ok{background:#dcfce7;color:#166534;} .t-warn{background:#fef3c7;color:#92400e;}
.t-bad{background:#fee2e2;color:#991b1b;} .t-info{background:#dbeafe;color:#1e40af;}
.t-neu{background:#f1f5f9;color:#475569;}
.bar{height:7px;border-radius:6px;background:#e2e8f0;overflow:hidden;min-width:60px;}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;min-width:0;}
.col{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0;}
.col h4{margin:0 0 10px;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:space-between;}
.col h4 .cnt{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--muted);}
.tk{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(15,23,42,.05);}
.tk.warn{border-left-color:var(--warn);} .tk.bad{border-left-color:var(--bad);} .tk.ok{border-left-color:var(--ok);}
.tk .tkt{font-size:13px;font-weight:700;margin-bottom:5px;}
.tk .tkm{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;}
.tk .tkm b{color:var(--ink);font-weight:700;}
.tl{position:relative;padding-left:26px;}
.tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line);}
.tl .ti{position:relative;padding:0 0 18px;}
.tl .ti::before{content:"";position:absolute;left:-21px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 2px var(--accent2);}
.tl .ti.done::before{background:var(--ok);box-shadow:0 0 0 2px #86efac;}
.tl .ti.wait::before{background:#cbd5e1;box-shadow:0 0 0 2px #e2e8f0;}
.tl .tt{font-size:13.5px;font-weight:700;}
.tl .td2{font-size:12px;color:var(--muted);margin-top:2px;}
.tl .tm{font-size:11px;color:var(--accent);font-weight:700;margin-top:3px;}
.rowlist{display:flex;flex-direction:column;gap:11px;}
.ritem{display:flex;align-items:center;gap:12px;padding:11px;border:1px solid var(--line);border-radius:12px;min-width:0;}
.ritem .ico{width:38px;height:38px;border-radius:10px;flex:0 0 38px;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--accent);}
.ritem .ico .material-symbols-outlined{font-size:21px;}
.ritem .rx{min-width:0;flex:1 1 auto;}
.ritem .rt{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;}
.ritem .rd{font-size:11.5px;color:var(--muted);margin-top:1px;}
.mini{font-size:11.5px;color:var(--muted);}
.hsbox{background:var(--soft);border:1px solid #dbeafe;border-radius:12px;padding:14px;}
.hscode{font-family:"Inter",monospace;font-weight:800;font-size:20px;color:var(--accent);letter-spacing:1px;}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;min-width:0;}
.stat .sv{font-size:22px;font-weight:800;}
.stat .sl{font-size:11.5px;color:var(--muted);margin-top:2px;}
.calc{display:flex;flex-direction:column;gap:0;}
.calc .cr{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;border-bottom:1px dashed var(--line);font-size:13.5px;gap:10px;}
.calc .cr .cl{color:var(--muted);font-weight:600;min-width:0;}
.calc .cr .cc{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
.calc .cr.total{border-bottom:0;margin-top:6px;padding-top:14px;border-top:2px solid var(--ink);font-size:16px;}
.calc .cr.total .cc{color:var(--accent);font-size:19px;font-weight:800;}
.badge-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
@media(max-width:1100px){ .g-side{grid-template-columns:1fr;} .g-kpi{grid-template-columns:repeat(2,1fr);} .board{grid-template-columns:repeat(2,1fr);} }
@media(max-width:860px){
  .app{flex-direction:column;}
  .sidebar{width:auto;flex:1 1 auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px;gap:8px;}
  .brand{padding:0 8px 0 0;flex:1 1 100%;}
  .navlabel,.side-foot{display:none;}
  .nav{flex-direction:row;flex-wrap:wrap;gap:6px;width:100%;}
  .navbtn{width:auto;flex:0 0 auto;padding:9px 12px;}
  .main{padding:18px 16px 40px;}
}
@media(max-width:820px){
  .grid{gap:12px;}
  .g-2,.g-2e,.g-side{grid-template-columns:1fr;}
  .split{grid-template-columns:1fr;}
}
@media(max-width:560px){
  .navbtn .nx{display:none;}
  .navbtn{padding:9px 11px;}
  .g-kpi{grid-template-columns:1fr 1fr;}
  .board{grid-template-columns:1fr;}
  .topbar h2{font-size:18px;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">account_balance</span></div>
      <div>
        <h1>關稅與稅務管理</h1>
        <p>Customs &amp; Tax System</p>
      </div>
    </div>
    <div class="navlabel">功能模組</div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      通關案件即時掌握<br/>可操作 · 可追蹤 · 可稽核
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="th">
        <h2 id="scr-title">—</h2>
        <p class="sub" id="scr-sub">—</p>
      </div>
      <div class="tb-right">
        <span class="pill"><span class="material-symbols-outlined">bolt</span>2026 稅則版</span>
        <div class="who"><span class="av" id="who-av">員</span><span id="who-name">案件管理專員</span></div>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>
<script>
(function(){
"use strict";
var charts=[];
function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts.push(c);}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function kpi(k){
  return '<div class="kpi"><div class="kl"><span class="material-symbols-outlined">'+k.ic+'</span>'+esc(k.l)+'</div><div class="kv">'+esc(k.v)+'</div><div class="kd '+k.c+'">'+esc(k.d)+'</div></div>';
}

var MODS=[
  {icon:"description",name:"進出口報單管理",sub:"報單建立、通關放行進度與海關文件追蹤",who:"案件管理專員",av:"員"},
  {icon:"rule",name:"稅則歸類與稅率",sub:"HS Code 歸類、稅率查詢與歸類疑義覆核",who:"案件管理專員",av:"員"},
  {icon:"inventory_2",name:"保稅料帳管理",sub:"保稅倉／園區進出料帳與存量勾稽",who:"案件管理專員",av:"員"},
  {icon:"request_quote",name:"關稅稅費試算",sub:"關稅、貨物稅與營業稅自動試算覆核",who:"專案合夥人",av:"夥"},
  {icon:"gavel",name:"法規與稅則更新",sub:"稅則異動、優惠稅率與法規時效追蹤",who:"專案合夥人",av:"夥"},
  {icon:"shield",name:"稽核與風險預警",sub:"補稅風險、歸類異常與稽核軌跡監控",who:"事務所負責人",av:"長"}
];

/* ---------- Screen 0: 進出口報單管理 ---------- */
function s0(){
  var kpis=[
    {l:"在辦報單",v:"128",d:"本月 +14",c:"neu",ic:"description"},
    {l:"已放行",v:"96",d:"放行率 75%",c:"up",ic:"task_alt"},
    {l:"待補文件",v:"9",d:"3 件今日到期",c:"down",ic:"warning"},
    {l:"平均通關時效",v:"1.8 天",d:"較上月 -0.4 天",c:"up",ic:"schedule"}
  ];
  var rows=[
    {no:"IM-2026-04821",cli:"O宏電子",type:"進口",port:"基隆關",items:"IC 載板 3,200 pcs",st:"已放行",cls:"t-ok",eta:"08/12"},
    {no:"EX-2026-04820",cli:"O豐精機",type:"出口",port:"台中關",items:"CNC 主軸 48 台",st:"通關中",cls:"t-info",eta:"08/14"},
    {no:"IM-2026-04818",cli:"O能光電",type:"進口",port:"高雄關",items:"矽晶圓 12,000 pcs",st:"待補文件",cls:"t-warn",eta:"08/13"},
    {no:"IM-2026-04815",cli:"O盛化工",type:"進口",port:"台北關",items:"特用化學原料 8 桶",st:"查驗中",cls:"t-info",eta:"08/15"},
    {no:"EX-2026-04812",cli:"O達製藥",type:"出口",port:"桃園關",items:"原料藥 640 kg",st:"歸類疑義",cls:"t-bad",eta:"08/16"},
    {no:"IM-2026-04808",cli:"O欣科技",type:"進口",port:"基隆關",items:"連接器 54,000 pcs",st:"已放行",cls:"t-ok",eta:"08/11"}
  ];
  var h='';
  h+='<div class="grid g-kpi">';kpis.forEach(function(k){h+=kpi(k);});h+='</div>';
  h+='<div class="grid g-2 mt">';
  h+='<div class="card"><h3><span class="material-symbols-outlined">monitoring</span>每日通關量與放行趨勢</h3><p class="cdesc">近 8 個工作日進口／出口報單受理與放行對照</p><div id="c0a" class="chart"></div></div>';
  h+='<div class="card"><h3><span class="material-symbols-outlined">pie_chart</span>報單狀態分佈</h3><p class="cdesc">目前在辦 128 筆報單即時狀態</p><div id="c0b" class="chart"></div></div>';
  h+='</div>';
  h+='<div class="card mt"><h3><span class="material-symbols-outlined">description</span>在辦報單清單</h3><p class="cdesc">依受理時間排序，含放行進度與文件狀態</p>';
  h+='<div class="tbl-wrap"><table><thead><tr><th>報單號</th><th>客戶</th><th>類別</th><th>關別</th><th>主要貨物</th><th>狀態</th><th>預計放行</th></tr></thead><tbody>';
  rows.forEach(function(r){
    h+='<tr><td><b>'+esc(r.no)+'</b></td><td>'+esc(r.cli)+'</td><td><span class="tag t-neu">'+esc(r.type)+'</span></td><td>'+esc(r.port)+'</td><td>'+esc(r.items)+'</td><td><span class="tag '+r.cls+'">'+esc(r.st)+'</span></td><td>'+esc(r.eta)+'</td></tr>';
  });
  h+='</tbody></table></div></div>';
  document.getElementById("view").innerHTML=h;
  void document.getElementById("view").offsetHeight;
  mk("c0a",{
    grid:{left:42,right:14,top:30,bottom:28},tooltip:{trigger:"axis"},
    legend:{data:["進口","出口","放行"],top:0,textStyle:{fontSize:11}},
    xAxis:{type:"category",data:["8/5","8/6","8/7","8/8","8/9","8/12","8/13","8/14"],axisLabel:{fontSize:11}},
    yAxis:{type:"value",splitLine:{lineStyle:{color:"#eef2f7"}}},
    series:[
      {name:"進口",type:"bar",data:[22,26,19,24,28,31,25,20],itemStyle:{color:"#1d4ed8",borderRadius:[3,3,0,0]}},
      {name:"出口",type:"bar",data:[14,17,12,16,15,18,14,11],itemStyle:{color:"#60a5fa",borderRadius:[3,3,0,0]}},
      {name:"放行",type:"line",smooth:true,data:[30,38,27,34,40,45,33,26],itemStyle:{color:"#16a34a"},lineStyle:{width:3}}
    ]
  });
  mk("c0b",{
    tooltip:{trigger:"item"},legend:{bottom:0,textStyle:{fontSize:11}},
    series:[{type:"pie",radius:["48%","74%"],center:["50%","44%"],avoidLabelOverlap:true,
      label:{show:true,formatter:"{b}\n{c}",fontSize:11},
      data:[
        {value:96,name:"已放行",itemStyle:{color:"#16a34a"}},
        {value:15,name:"通關中",itemStyle:{color:"#1d4ed8"}},
        {value:9,name:"待補文件",itemStyle:{color:"#d97706"}},
        {value:5,name:"查驗中",itemStyle:{color:"#60a5fa"}},
        {value:3,name:"歸類疑義",itemStyle:{color:"#dc2626"}}
      ]}]
  });
}

/* ---------- Screen 1: 稅則歸類與稅率 ---------- */
function s1(){
  var q=[
    {hs:"8542.31.00",name:"處理器與控制器 IC",rate:"0%",vat:"5%",note:"資訊科技協定免稅",cls:"t-ok",cf:98},
    {hs:"8486.20.00",name:"半導體製造設備",rate:"0%",vat:"5%",note:"適用免稅清單",cls:"t-ok",cf:95},
    {hs:"3824.99.90",name:"特用化學混合物",rate:"5%",vat:"5%",note:"成分待確認歸類",cls:"t-warn",cf:71},
    {hs:"9018.90.00",name:"醫療電子儀器",rate:"0%",vat:"5%",note:"需附醫材許可",cls:"t-info",cf:88},
    {hs:"2933.99.90",name:"原料藥中間體",rate:"6.5%",vat:"5%",note:"歸類疑義·待覆核",cls:"t-bad",cf:58}
  ];
  var h='';
  h+='<div class="grid g-side">';
  h+='<div class="card"><h3><span class="material-symbols-outlined">rule</span>本批歸類建議與稅率</h3><p class="cdesc">系統依品名與規格比對 HS 稅則，並標註信心度與疑義項目</p>';
  h+='<div class="rowlist">';
  q.forEach(function(r){
    h+='<div class="ritem"><div class="ico"><span class="material-symbols-outlined">tag</span></div>';
    h+='<div class="rx"><div class="rt">'+esc(r.name)+' <span class="hscode" style="font-size:13px;margin-left:6px">'+esc(r.hs)+'</span></div>';
    h+='<div class="rd">關稅 '+esc(r.rate)+' · 營業稅 '+esc(r.vat)+' · '+esc(r.note)+'</div>';
    h+='<div class="bar" style="margin-top:7px;max-width:220px"><i style="width:'+r.cf+'%"></i></div></div>';

    btns[i].addEventListener("click",function(){location.hash="v"+this.getAttribute("data-i");});
  }
}

function show(i){
  disposeCharts();
  var m=MODS[i]||MODS[0];
  document.getElementById("scr-title").textContent=m.name;
  document.getElementById("scr-sub").textContent=m.sub;
  document.getElementById("who-name").textContent=m.who;
  document.getElementById("who-av").textContent=m.av;
  var btns=document.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){btns[j].classList.toggle("on",+btns[j].getAttribute("data-i")===i);}
  (SCREENS[i]||SCREENS[0])();
  try{window.scrollTo(0,0);}catch(e){}
}

buildNav();
window.addEventListener("resize",function(){for(var i=0;i<charts.length;i++){try{charts[i].resize();}catch(e){}}});

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
})();
</script>
