<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>製造成本會計系統 · Mfg Cost Accounting</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--accent:#e11d48;--accent2:#fb7185;--ink:#1b1417;--bg:#f8f4f5;--card:#fff;--line:#f0e0e5;--mut:#8a7480;--ok:#059669;--warn:#e0870b;--bad:#dc2626;--mat:#e11d48;--lab:#8b5cf6;--ovh:#0ea5e9}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.top{background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:11px 20px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#fff;flex:none;box-shadow:0 8px 18px rgba(225,29,72,.32)}
.brand b{font-size:15px;font-weight:800;display:block;font-family:"Noto Sans TC"}
.brand span{font-size:10px;color:var(--accent);letter-spacing:2px}
.nav{display:flex;gap:3px;margin-left:auto;overflow-x:auto;min-width:0;flex-wrap:wrap;-webkit-overflow-scrolling:touch}
.nav button{flex:none;white-space:nowrap;border:0;background:transparent;color:var(--mut);font:inherit;font-weight:600;font-size:13px;padding:9px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:"Noto Sans TC";min-width:0}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:#fdeef1;color:var(--accent)}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 14px rgba(225,29,72,.3)}
.wrap{max-width:1320px;margin:0 auto;padding:20px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.pill{background:#fde2e7;color:#b3123a;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:p 1.4s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpis>*{min-width:0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.28}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .9fr}
.g11{grid-template-columns:1fr 1fr}
.g21{grid-template-columns:1.6fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#d1fae5;color:#047857}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#e0f2fe;color:#0369a1}.t-mut{background:#f2ebee;color:#8a7480}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#fdf2f4}
table.data td.num,table.data th.num{text-align:right;font-family:Inter;font-variant-numeric:tabular-nums}
.chart{height:250px;width:100%;overflow:hidden}
.scroll{overflow-x:auto}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-bottom:6px}
.leg span{display:flex;align-items:center;gap:5px}
.leg em{width:10px;height:10px;border-radius:3px;font-style:normal;display:inline-block}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.board>*{min-width:0}
.col{background:#fbf4f6;border:1px solid var(--line);border-radius:14px;padding:11px;display:flex;flex-direction:column;gap:10px}
.colh{display:flex;align-items:center;gap:8px;font-family:"Noto Sans TC";font-weight:800;font-size:13px;padding:2px 4px}
.colh .dot{width:9px;height:9px;border-radius:50%;flex:none}
.colh .cnt{margin-left:auto;font-family:Inter;font-size:11px;font-weight:800;background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 8px}
.wcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;cursor:pointer;transition:.15s;border-left:3px solid var(--accent2)}
.wcard:hover{box-shadow:0 6px 16px rgba(225,29,72,.12);transform:translateY(-1px)}
.wcard .wo{font-family:Inter;font-weight:800;font-size:12.5px;color:var(--accent)}
.wcard .nm{font-family:"Noto Sans TC";font-size:12.5px;margin:3px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcard .mt{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--mut)}
.wcard .var{font-family:Inter;font-weight:800;font-size:12.5px}
.wcard .bar{height:5px;background:#f2e4e8;border-radius:4px;overflow:hidden;margin:7px 0 4px}
.wcard .bar i{display:block;height:100%;border-radius:4px}
.stdrow{display:grid;grid-template-columns:1.2fr .7fr .7fr .8fr .8fr;gap:1px;background:var(--line);border-radius:11px;overflow:hidden;font-size:12.5px}
.stdrow>div{background:#fff;padding:10px 11px;min-width:0}
.stdrow.hd>div{background:#fdf2f4;color:var(--mut);font-weight:700;font-size:11.5px}
.stdrow .num{text-align:right;font-family:Inter;font-variant-numeric:tabular-nums}
.vrow{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:11px;margin-bottom:9px}
.vrow .dot{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;color:#fff}
.vrow .m{flex:1;min-width:0}
.vrow .m b{font-family:"Noto Sans TC";font-size:13px}
.vrow .m small{color:var(--mut);font-size:11.5px;display:block}
.vrow .delta{font-family:Inter;font-weight:800;font-size:15px;flex:none}
.tl{display:flex;flex-direction:column;gap:10px;position:relative;padding-left:6px}
.tl::before{content:"";position:absolute;left:11px;top:6px;bottom:14px;width:2px;background:var(--line)}
.ti{display:flex;gap:12px;align-items:flex-start;padding-bottom:12px;position:relative;padding-left:24px}
.ti::before{content:"";position:absolute;left:0;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.ti.done::before{background:var(--ok)}
.ti.wait::before{background:var(--mut)}
.ti b{font-family:Inter;font-weight:800;font-size:13.5px}
.ti small{color:var(--mut);font-size:11.5px;display:block}
.mini{font-size:11px;color:var(--mut);margin-top:2px}
.ver{display:flex;flex-direction:column;gap:10px;position:relative;padding-left:6px}
.ver::before{content:"";position:absolute;left:11px;top:6px;bottom:16px;width:2px;background:var(--line)}
.vi{display:flex;gap:12px;align-items:flex-start;padding-bottom:14px;position:relative;padding-left:22px}
.vi::before{content:"";position:absolute;left:0;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.vi.old::before{background:var(--mut)}
.vi b{font-family:Inter;font-weight:800;font-size:13.5px}
.vi small{color:var(--mut);font-size:11.5px;display:block}
.mono{font-family:Inter;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.two>*{min-width:0}
.hl{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:linear-gradient(135deg,#fde2e7,#fecdd6);margin-bottom:14px;flex-wrap:wrap}
.hl .bg{width:44px;height:44px;border-radius:12px;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 4px 10px rgba(225,29,72,.2)}
.hl .bg .material-symbols-outlined{color:var(--accent);font-size:24px}
.hl b{font-family:"Noto Sans TC";font-size:15px;display:block}
.hl small{color:#a01238;font-size:11.5px}
.hl .big{margin-left:auto;text-align:right}
.hl .big b{font-family:Inter;font-size:22px;color:#8f0f31}
.hl .big small{color:#a01238}
@media(max-width:820px){
 .wrap{padding:14px}
 .kpis{grid-template-columns:repeat(2,1fr)}
 .g2,.g11,.g21,.two{grid-template-columns:1fr}
 .board{grid-template-columns:1fr 1fr}
 .stdrow{grid-template-columns:1.2fr .8fr .9fr}
}
@media(max-width:560px){
 .nav button span.txt{display:none}
 .nav button{padding:9px 10px}
 .board{grid-template-columns:1fr}
}
</style>
</head>
