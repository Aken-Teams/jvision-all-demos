<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>製造成本會計系統 · Manufacturing Cost Accounting System</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;--color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;--color-on-secondary:#000000;
  --color-accent:#EA580C;--color-on-accent:#000000;
  --color-background:#F8FAFC;--color-foreground:#1E293B;
  --color-card:#FFFFFF;--color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;--color-muted-foreground:#475569;
  --color-border:#E2E8F0;--color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;--color-ring:#2563EB;
  --blue:#2563EB;--ink:#1E293B;--muted:#475569;--line:#E2E8F0;
  --ok:#047857;--warn:#B45309;--bad:#DC2626;
  --mat:#2563EB;--lab:#7C3AED;--ovh:#0891B2;
  --shadow:0 8px 22px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Fira Sans",sans-serif;line-height:1.5}
button,a,[role=button]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
svg{display:block}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:24px;padding:12px clamp(16px,3vw,40px);background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:12px;min-width:270px}
.logo{width:42px;height:42px;display:grid;place-items:center;flex:none;background:var(--blue);color:#fff;border-radius:8px;box-shadow:0 5px 0 #1D4ED8}
.logo svg{width:23px;height:23px}
.brand b{display:block;font-size:15px;letter-spacing:.02em}
.brand small{display:block;color:var(--muted);font:500 10px/1.4 "Fira Code",monospace;letter-spacing:.12em}
.nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:thin}
.nav button{display:flex;align-items:center;gap:7px;flex:none;min-height:42px;padding:9px 12px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--muted);font:600 13px "Fira Sans",sans-serif;transition:background .2s,color .2s,border-color .2s,transform .2s}
.nav button svg{width:17px;height:17px}
.nav button:hover{background:var(--color-muted);color:var(--blue);border-color:#CBD5E1}
.nav button.on{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 4px 12px rgba(37,99,235,.22)}
.wrap{width:min(1400px,100%);margin:auto;padding:24px clamp(14px,2.6vw,36px) 48px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.vh h1{margin:0;font-size:clamp(22px,2.4vw,31px);line-height:1.15;letter-spacing:-.025em}
.vh p{margin:6px 0 0;color:var(--muted);font-size:13px}
.period{display:flex;align-items:center;gap:8px;flex:none;padding:7px 10px;border:1px solid #BFDBFE;border-radius:6px;background:#EFF6FF;color:#1E40AF;font:600 11px "Fira Code",monospace}
.period svg{width:15px;height:15px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{position:relative;min-width:0;padding:15px 16px;background:var(--color-card);border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 0 rgba(15,23,42,.03);transition:border-color .2s,box-shadow .2s,transform .2s}
.kpi:hover{border-color:#93C5FD;box-shadow:var(--shadow);transform:translateY(-2px)}
.kpi .l{padding-right:30px;color:var(--muted);font-size:11px;font-weight:600}
.kpi .v{margin-top:4px;font:700 clamp(22px,2vw,27px) "Fira Code",monospace;letter-spacing:-.04em}
.kpi .v small{font-size:12px;letter-spacing:0}
.kpi .d{margin-top:4px;font-size:11px;font-weight:600}
.kpi .ic{position:absolute;right:14px;top:14px;color:var(--blue)}
.kpi .ic svg{width:20px;height:20px}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:14px}.grid>*{min-width:0}
.g2{grid-template-columns:1.4fr .9fr}.g11{grid-template-columns:1fr 1fr}.g21{grid-template-columns:1.55fr 1fr}
.card{min-width:0;padding:16px;background:var(--color-card);border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 0 rgba(15,23,42,.025);transition:border-color .2s,box-shadow .2s}
.card:hover{border-color:#CBD5E1;box-shadow:var(--shadow)}
.card h2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line);font-size:14px;letter-spacing:-.01em}
.card h2 svg{width:18px;height:18px;color:var(--blue)}
.chart{width:100%;height:250px;overflow:hidden}
.mt{margin-top:14px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border:1px solid transparent;border-radius:4px;font-size:10px;font-weight:700;white-space:nowrap}
.tag:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-ok{background:#ECFDF5;border-color:#A7F3D0;color:#047857}
.t-warn{background:#FFFBEB;border-color:#FDE68A;color:#92400E}
.t-bad{background:#FEF2F2;border-color:#FECACA;color:#B91C1C}
.t-info{background:#EFF6FF;border-color:#BFDBFE;color:#1D4ED8}
.t-mut{background:#F1F5F9;border-color:#CBD5E1;color:#475569}
.scroll{overflow:auto}
table.data{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{position:sticky;top:0;background:#F1F5F9;color:#334155;font-size:10.5px;font-weight:700;letter-spacing:.035em;text-transform:none}
table.data tbody tr:hover td{background:#F8FAFC}
table.data .num{text-align:right;font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.mono{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.highlight{display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin-bottom:14px;padding:14px 16px;border:1px solid #BFDBFE;border-left:4px solid var(--blue);border-radius:8px;background:#EFF6FF}
.highlight .symbol{width:42px;height:42px;display:grid;place-items:center;flex:none;background:#fff;border:1px solid #BFDBFE;border-radius:6px;color:var(--blue)}
.highlight .symbol svg{width:22px;height:22px}
.highlight b{display:block;font-size:14px}.highlight small{color:var(--muted);font-size:11px}
.highlight .big{margin-left:auto;text-align:right}
.highlight .big b{color:#1D4ED8;font:700 22px "Fira Code",monospace}
.std{display:grid;grid-template-columns:1.35fr .75fr .75fr .8fr .65fr;border-top:1px solid var(--line);border-left:1px solid var(--line);font-size:12px}
.std>div{min-width:0;padding:9px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff}
.std.head>div,.std.total>div{background:#F1F5F9;font-weight:700;color:#334155}
.std .num{text-align:right;font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.setting,.vrow{display:flex;align-items:center;gap:10px;padding:10px 11px;border:1px solid var(--line);border-radius:6px;font-size:12px}
.setting+ .setting,.vrow+ .vrow{margin-top:8px}
.setting>:nth-child(2){margin-left:auto;color:var(--muted)}
.vrow .symbol{width:34px;height:34px;display:grid;place-items:center;flex:none;border-radius:6px;color:#fff}
.vrow .symbol svg{width:17px;height:17px}
.vrow .m{flex:1;min-width:0}.vrow .m b{display:block;font-size:12px}.vrow .m small{display:block;color:var(--muted);font-size:11px}
.vrow .delta{flex:none;font:700 13px "Fira Code",monospace}
.note{margin-top:10px;padding:10px 12px;border-left:3px solid var(--blue);background:#F1F5F9;color:#334155;font-size:12px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.col{min-width:0;padding:10px;background:#F8FAFC;border:1px solid var(--line);border-radius:7px}
.colh{display:flex;align-items:center;gap:7px;margin-bottom:9px;font-size:12px;font-weight:700}
.colh .dot{width:8px;height:8px;border-radius:50%}
.colh .cnt{margin-left:auto;padding:1px 6px;background:#fff;border:1px solid var(--line);border-radius:4px;font:600 10px "Fira Code",monospace}
.wcard{padding:10px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:6px;transition:transform .2s,box-shadow .2s,border-color .2s}
.wcard+ .wcard{margin-top:8px}.wcard:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#93C5FD}
.wcard .wo{color:#1D4ED8;font:700 11px "Fira Code",monospace}.wcard .nm{margin:2px 0 6px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;overflow:hidden;background:#E2E8F0;border-radius:2px}.bar i{display:block;height:100%}
.meta{display:flex;justify-content:space-between;gap:7px;margin-top:5px;color:var(--muted);font-size:10px}.meta b{font-family:"Fira Code",monospace}
.timeline{position:relative;padding-left:24px}.timeline:before{content:"";position:absolute;left:7px;top:8px;bottom:12px;width:2px;background:var(--line)}
.step{position:relative;padding:0 0 14px}.step:before{content:"✓";position:absolute;left:-24px;top:1px;width:16px;height:16px;display:grid;place-items:center;background:var(--ok);border-radius:50%;color:#fff;font-size:9px;font-weight:700}
.step.wait:before{content:"…";background:#64748B}
.step b{display:block;font-size:12px}.step small,.step span{display:block;color:var(--muted);font-size:10.5px}
.version .step:before{content:"";border:4px solid #fff;box-shadow:0 0 0 1px #94A3B8;background:var(--blue)}
.version .step.old:before{background:#64748B}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:6px;color:var(--muted);font-size:10.5px}
.legend span{display:flex;align-items:center;gap:5px}.legend i{width:9px;height:9px;border-radius:2px}
.reveal{animation:reveal .35s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1024px){.top{align-items:flex-start;flex-direction:column;gap:8px}.nav{width:100%;margin:0}.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g21{grid-template-columns:1fr}.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.g11{grid-template-columns:1fr}.vh{align-items:flex-start;flex-direction:column}.period{width:100%}.std{grid-template-columns:1.3fr .8fr .8fr}.std>div:nth-child(4),.std>div:nth-child(5){display:none}}
@media(max-width:560px){.wrap{padding:16px 12px 36px}.brand{min-width:0}.nav button{padding:9px 11px}.nav button .txt{display:none}.kpis,.board{grid-template-columns:1fr}.kpi{padding:14px}.card{padding:13px}.highlight .big{width:100%;margin-left:55px;text-align:left}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21V8l6 3V8l6 3V3h6v18H3Z"/><path d="M7 21v-4h3v4m5-5h2m-2-4h2"/></svg></div>
    <div><b>製造成本會計系統</b><small>MANUFACTURING COST ACCOUNTING</small></div>
  </div>
  <nav class="nav" id="nav" aria-label="主要功能"></nav>
</header>

<main class="wrap">
  <section class="vh">
    <div><h1 id="vt"></h1><p id="vd"></p></div>
    <div class="period"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 12 2 2 4-5"/><circle cx="12" cy="12" r="9"/></svg>2026-08 期 · 標準成本 v4.2 已鎖定</div>
  </section>
  <div id="view" aria-live="polite"></div>
</main>

<script>
const ICONS={
monitoring:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V9m6 10V5m6 14v-7m4 7H2"/></svg>',
rule:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h7"/><circle cx="18" cy="12" r="2"/><circle cx="15" cy="18" r="2"/></svg>',
receipt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6m-6 4h6"/></svg>',
insights:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 17 5-5 4 3 7-9"/><path d="M14 6h5v5"/></svg>',
tree:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="4"/><rect x="3" y="17" width="6" height="4"/><rect x="15" y="17" width="6" height="4"/><path d="M12 7v5M6 17v-5h12v5"/></svg>',
history:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2M3 4v5h5"/></svg>',
money:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M7 9H5m14 6h-2"/></svg>',
warning:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 2 21h20L12 3Z"/><path d="M12 9v5m0 3h.01"/></svg>',
chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10m5 10V4m5 16v-7m5 7V7"/></svg>',
pie:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 3a9 9 0 1 0 9 9h-9V3Z"/><path d="M15 3.8A9 9 0 0 1 20.2 9H15V3.8Z"/></svg>',
list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>'
};
const icon=n=>ICONS[n]||ICONS.chart;
const MOD=[
["成本總覽","monitoring","成本總覽","單位成本、料工費占比與差異總額戰情看板"],
["標準成本","rule","標準成本建置","料工費標準單價、標準用量與費率版本維護"],
["實際歸集","receipt","實際成本歸集","領料、報工與費用分攤歸集至工單與成本中心"],
["差異分析","insights","成本差異分析","用量、價格、效率差異拆解與貢獻瀑布"],
["工單結算","tree","工單成本結算","WIP 結轉、完工結算看板與差異入帳"],
["版本核定","history","成本版本核定","標準成本版本比較、核定發布與稽核履歷"]
];
const nav=document.getElementById("nav"),view=document.getElementById("view"),vt=document.getElementById("vt"),vd=document.getElementById("vd");
MOD.forEach((m,i)=>{const b=document.createElement("button");b.type="button";b.dataset.i=i;b.innerHTML=icon(m[1])+'<span class="txt">'+m[0]+"</span>";b.addEventListener("click",()=>{location.hash="v"+i});nav.appendChild(b)});
const N0=v=>v.toLocaleString("en-US",{maximumFractionDigits:0});
const NT=v=>v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const kpi=(ic,l,v,d,c="")=>`<article class="kpi"><span class="ic">${icon(ic)}</span><div class="l">${l}</div><div class="v">${v}</div><div class="d ${c}">${d}</div></article>`;
const card=(ic,title,body,extra="")=>`<section class="card ${extra}"><h2>${icon(ic)}${title}</h2>${body}</section>`;
const tag=(type,text)=>`<span class="tag ${type}">${text}</span>`;
const WOS=[
["WO-24081","泵浦本體 CNC 加工",128400,131200,102,0],["WO-24082","閥門殼體 鑄造批",96200,94100,96,0],
["WO-24083","傳動軸 精車批",64800,67900,105,1],["WO-24084","法蘭盤 沖壓批",42300,41100,97,1],
["WO-24085","齒輪組 熱處理批",88600,93400,108,1],["WO-24086","軸承座 組立批",71200,70300,99,2],
["WO-24087","端蓋 表面處理批",38900,40200,103,2],["WO-24088","連桿 鍛造批",112500,110800,98,3],
["WO-24089","外殼 塗裝批",54700,55900,102,3]
];
const STG=[["待歸集","#64748B"],["歸集中","#2563EB"],["差異覆核","#B45309"],["已結算","#047857"]];
const STD=[
["M-A101","SCM440 合金鋼棒","m",42.60,3.2,"kg"],["M-A102","304 不鏽鋼板","m",68.40,1.8,"kg"],
["M-A103","黃銅嵌件","m",18.90,4,"件"],["M-A104","O-Ring 密封組","m",6.40,2,"組"],
["L-B201","CNC 加工工時","l",520,0.85,"工時"],["L-B202","熱處理工時","l",380,0.35,"工時"],
["L-B203","組立工時","l",340,0.6,"工時"],["O-C301","設備折舊分攤","o",95,1,"式"],
["O-C302","動力能源分攤","o",62,1,"式"],["O-C303","品保檢測分攤","o",48,1,"式"]
];
const CAT={m:["材料","#2563EB"],l:["人工","#7C3AED"],o:["製費","#0891B2"]};
const SCREENS=[
()=>`<div class="kpis">
${kpi("money","單位實際成本",'$1,842<small>.30</small>',"▲ 較標準 +2.4%","dn")}
${kpi("insights","本期差異總額","+$318K","不利差異 · 佔標準 3.1%","dn")}
${kpi("rule","已結算工單",'142<small>/168</small>',"▲ 完成率 84.5%","up")}
${kpi("warning","重大差異工單","7","警示 · 差異率 > 5% 待覆核","dn")}
</div><div class="grid g2">
${card("monitoring","近六期標準 vs 實際單位成本",'<div class="chart" id="c_ov"></div>')}
${card("pie","本期料工費結構",'<div class="chart" id="c_pie"></div>')}
</div><div class="grid g11 mt">
${card("chart","三大差異類型金額（本期）",'<div class="chart" id="c_var3"></div>')}
${card("warning","差異最大工單 Top5",[
["WO-24085","齒輪組 熱處理批",4800],["WO-24083","傳動軸 精車批",3100],["WO-24081","泵浦本體 CNC 加工",2800],["WO-24087","端蓋 表面處理批",1300],["WO-24089","外殼 塗裝批",1200]
].map((r,i)=>`<div class="vrow"><div class="symbol" style="background:${i<2?'#DC2626':'#EA580C'}">${icon("warning")}</div><div class="m"><b class="mono">${r[0]}</b><small>${r[1]}</small></div><div class="delta dn">+$${N0(r[2])}</div></div>`).join("")+'<div class="note">警示：前五大工單貢獻本期不利差異 <b>41%</b>，建議優先覆核效率差異。</div>')}
</div>`,

()=>{let tot=STD.reduce((a,s)=>a+s[3]*s[4],0);return `<div class="highlight"><div class="symbol">${icon("rule")}</div><div><b>泵浦本體 PMP-3000 · 標準成本卡</b><small>標準成本版本 v4.2 · 生效 2026-08-01 · 成本會計 陳惠雯</small></div><div class="big"><b>$${NT(tot)}</b><small>標準單位成本</small></div></div>
