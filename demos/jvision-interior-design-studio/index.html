<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
:root{
  --accent:#0d9488; --accent2:#2dd4bf; --ink:#0f2622; --muted:#5b7772;
  --bg:#f2f7f5; --card:#ffffff; --line:#dbeae6; --soft:#e8f4f1;
  --warn:#d97706; --bad:#dc2626; --ok:#059669; --info:#0891b2;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.msi{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;line-height:1;vertical-align:middle;}
header{
  background:linear-gradient(100deg,#0d9488,#0f766e);
  color:#fff; position:sticky; top:0; z-index:20;
  box-shadow:0 2px 14px rgba(13,148,136,.28);
}
.brand{display:flex;align-items:center;gap:12px;padding:14px 20px 4px;}
.brand .logo{
  width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);
  display:flex;align-items:center;justify-content:center;font-size:22px;
}
.brand h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.5px;}
.brand .sub{font-size:12px;opacity:.82;margin-top:1px;}
nav{
  display:flex;flex-wrap:wrap;gap:6px;padding:6px 14px 12px;
}
nav button{
  flex:none;white-space:nowrap;cursor:pointer;border:none;
  background:rgba(255,255,255,.10); color:#eafffb;
  font-family:inherit;font-size:13.5px;font-weight:500;
  padding:9px 14px;border-radius:10px;display:flex;align-items:center;gap:7px;
  transition:.18s; min-width:0;
}
nav button:hover{background:rgba(255,255,255,.22);}
nav button.active{background:#fff;color:var(--accent);font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.16);}
nav button .msi{font-size:19px;}
main{max-width:1240px;margin:0 auto;padding:22px 18px 60px;min-width:0;}
.screen-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
.screen-head h2{font-size:21px;margin:0;font-weight:700;display:flex;align-items:center;gap:10px;}
.screen-head h2 .msi{color:var(--accent);font-size:26px;}
.screen-head .desc{font-size:13px;color:var(--muted);margin-top:3px;}
.pill{font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--soft);color:var(--accent);white-space:nowrap;}
.grid{display:grid;gap:14px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:2fr 1fr;}
.g32{grid-template-columns:1.4fr 1fr;}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px 16px;min-width:0;}
.card h3{margin:0 0 12px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
.card h3 .msi{color:var(--accent);font-size:20px;}
.card h3 .tag{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--muted);}
.kpi{position:relative;overflow:hidden;}
.kpi .lab{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.kpi .val{font-size:27px;font-weight:700;margin-top:6px;letter-spacing:.3px;}
.kpi .val small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px;}
.kpi .dt{font-size:11.5px;margin-top:5px;font-weight:600;display:inline-flex;align-items:center;gap:3px;}
.kpi .up{color:var(--ok);}.kpi .down{color:var(--bad);}
.kpi .ic{position:absolute;right:-8px;top:-8px;font-size:74px;opacity:.06;color:var(--accent);}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px;}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;background:#fafdfc;}
tbody tr:hover{background:#f6fbfa;}
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);}
.tbl-wrap table{min-width:600px;}
.b{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;}
.b-ok{background:#d1fae5;color:#047857;}
.b-run{background:#ccfbf1;color:#0f766e;}
.b-wait{background:#fef3c7;color:#b45309;}
.b-late{background:#fee2e2;color:#b91c1c;}
.b-info{background:#cffafe;color:#0e7490;}
.b-mut{background:#eef2f0;color:#5b7772;}
.bar{height:8px;border-radius:6px;background:#e6efec;overflow:hidden;min-width:60px;}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.barrow{display:flex;align-items:center;gap:10px;}
.barrow .num{font-size:12px;font-weight:700;width:38px;text-align:right;color:var(--ink);}
.chartbox{position:relative;height:230px;min-width:0;}
.chartbox.sm{height:200px;}
.pcard{border:1px solid var(--line);border-radius:14px;padding:14px;background:linear-gradient(160deg,#fff,#f5faf9);min-width:0;}
.pcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.pcard .nm{font-weight:700;font-size:14.5px;}
.pcard .meta{font-size:11.5px;color:var(--muted);margin-top:2px;}
.pcard .row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:12px;margin-top:11px;color:var(--muted);}
.pcard .row b{color:var(--ink);}
.tl{position:relative;padding-left:22px;}
.tl:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl .it{position:relative;padding:0 0 15px 6px;}
.tl .it:before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent2);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent);}
.tl .it.done:before{background:var(--ok);box-shadow:0 0 0 2px var(--ok);}
.tl .it.late:before{background:var(--bad);box-shadow:0 0 0 2px var(--bad);}
.tl .d{font-size:11.5px;color:var(--muted);}
.tl .t{font-size:13.5px;font-weight:600;}
.mood{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;min-width:0;}
@media(max-width:820px){.mood{grid-template-columns:repeat(2,1fr);}}
.swatch{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff;}
.swatch .sw{height:70px;display:flex;align-items:flex-end;padding:7px;}
.swatch .cap{padding:8px 9px;}
.swatch .cap .n{font-size:12.5px;font-weight:700;}
.swatch .cap .m{font-size:11px;color:var(--muted);margin-top:1px;}
.chip{font-size:10.5px;font-weight:600;color:#fff;background:rgba(0,0,0,.28);padding:2px 7px;border-radius:999px;}
.fb{display:flex;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line);}
.fb:last-child{border-bottom:none;}
.fb .av{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;}
.fb .bd{min-width:0;}
.fb .nm{font-size:13px;font-weight:700;}
.fb .tx{font-size:12.5px;color:#3d5651;margin-top:2px;}
.fb .tm{font-size:11px;color:var(--muted);margin-top:3px;}
.gantt{min-width:640px;}
.gantt .grow{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);}
.gantt .glab{font-size:12.5px;font-weight:600;min-width:0;}
.gantt .glab small{display:block;font-weight:400;color:var(--muted);font-size:11px;}
.gantt .track{position:relative;height:20px;background:#eef4f2;border-radius:6px;}
.gantt .seg{position:absolute;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10.5px;color:#fff;font-weight:600;overflow:hidden;}
.ganttscale{display:grid;grid-template-columns:150px 1fr;gap:10px;font-size:11px;color:var(--muted);padding-bottom:4px;}
.ganttscale .sc{display:grid;grid-template-columns:repeat(6,1fr);}
.ai{background:linear-gradient(150deg,#0f766e,#0d9488);color:#eafffb;border:none;}
.ai h3{color:#fff;}
.ai h3 .msi{color:#8ff0e2;}
.ai .li{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.14);font-size:13px;}
.ai .li:last-child{border-bottom:none;}
.ai .li .msi{font-size:18px;color:#8ff0e2;flex:none;margin-top:1px;}
.mini{font-size:11.5px;color:var(--muted);}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--muted);margin-top:8px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
.hint{font-size:12px;color:var(--muted);margin-top:10px;display:flex;align-items:center;gap:6px;}
@media(max-width:560px){ nav button .lab{display:none;} nav button{padding:9px 11px;} }
</style>
</head>

function stBadge(st){

    ship:["b-info","運送中"],make:["b-run","製作中"],done:["b-ok","已到貨"]};

function kpiCards(list){
  return list.map(function(x){var a=x.split("|");
    return '<div class="card kpi"><span class="msi ic">'+a[2]+'</span>'+
      '<div class="lab"><span class="msi" style="font-size:16px;color:var(--accent)">'+a[2]+'</span>'+a[0]+'</div>'+
      '<div class="val">'+a[1]+'</div></div>';
  }).join("");
}

function show(i){
  destroyChart();
  var nav=document.getElementById("nav");
  Array.prototype.forEach.call(nav.children,function(b){ b.classList.toggle("active",+b.getAttribute("data-i")===i); });
  var h=HEADS[i];
  var app=document.getElementById("app");
  app.innerHTML='<div class="screen-head"><div><h2><span class="msi">'+h[0]+'</span>'+h[1]+'</h2>'+
    '<div class="desc">'+h[2]+'</div></div><span class="pill">'+h[3]+'</span></div>'+
    '<div id="body"></div>';
  document.getElementById("body").innerHTML=SCREENS[i]();
  void app.offsetHeight;
  try{ CHARTS[i](); }catch(e){}
}

(function(){
  var nav=document.getElementById("nav");
  nav.innerHTML=NAV.map(function(n){
    return '<button data-i="'+n.i+'"><span class="msi">'+n.ic+'</span><span class="lab">'+n.lab+'</span></button>';
  }).join("");
  Array.prototype.forEach.call(nav.children,function(b){
    b.addEventListener("click",function(){ show(+b.getAttribute("data-i")); try{window.scrollTo(0,0);}catch(e){} });
  });
  show(0);
})();

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m)return;var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
