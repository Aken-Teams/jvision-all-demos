<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>室內設計專案管理｜JVision Demo</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#64748B;
  --color-on-primary:#FFFFFF;
  --color-secondary:#94A3B8;
  --color-on-secondary:#0F172A;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#334155;
  --color-card:#FFFFFF;
  --color-card-foreground:#334155;
  --color-muted:#EBF0F5;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#64748B;
  --blue:#64748B;
  --ink:#334155;
  --muted:#475569;
  --line:#E2E8F0;
  --success:#047857;
  --warning:#A44809;
  --info:#0369A1;
  --shadow:0 14px 38px rgba(15,23,42,.08);
  --radius:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  color:var(--ink);
  background:
    linear-gradient(rgba(100,116,139,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(100,116,139,.035) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,a,[data-i]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid rgba(234,88,12,.34);
  outline-offset:3px;
}
.msi{
  font-family:"Material Symbols Outlined";
  font-weight:400;
  font-style:normal;
  font-size:20px;
  line-height:1;
  vertical-align:middle;
}
.mono,table td:first-child,.tm,.d,.num{font-family:"JetBrains Mono",monospace}
.site-header{
  position:sticky;
  top:0;
  z-index:40;
  border-bottom:1px solid rgba(226,232,240,.9);
  background:rgba(248,250,252,.92);
  backdrop-filter:blur(18px);
}
.topbar{
  max-width:1440px;
  min-height:66px;
  margin:auto;
  padding:10px 24px;
  display:flex;
  align-items:center;
  gap:20px;
}
.brand{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:260px;
}
.logo{
  width:42px;
  height:42px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:12px 4px 12px 4px;
  color:#fff;
  background:#334155;
  box-shadow:inset -5px -5px 0 #64748b;
}
.brand h1{
  margin:0;
  color:#0f172a;
  font-size:15px;
  font-weight:800;
  letter-spacing:.02em;
}
.brand p{margin:1px 0 0;color:var(--muted);font-size:11px}
nav{
  display:flex;
  align-items:center;
  gap:4px;
  min-width:0;
  overflow-x:auto;
  scrollbar-width:none;
}
nav::-webkit-scrollbar{display:none}
nav button{
  min-height:42px;
  padding:9px 11px;
  border:1px solid transparent;
  border-radius:10px;
  display:flex;
  align-items:center;
  gap:7px;
  flex:none;
  color:var(--muted);
  background:transparent;
  font-size:12px;
  font-weight:650;
  white-space:nowrap;
  transition:color .2s,background .2s,border-color .2s,transform .2s;
}
nav button:hover{
  color:#0f172a;
  background:#fff;
  border-color:var(--line);
  transform:translateY(-1px);
}
nav button.active{
  color:#fff;
  background:#475569;
  border-color:#475569;
  box-shadow:0 5px 14px rgba(51,65,85,.18);
}
main{max-width:1440px;margin:auto;padding:22px 24px 64px}
.hero{
  position:relative;
  min-height:300px;
  margin-bottom:18px;
  padding:34px clamp(24px,4vw,58px);
  overflow:hidden;
  display:grid;
  grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);
  align-items:center;
  gap:28px;
  color:#fff;
  border-radius:24px;
  background:#334155;
  box-shadow:0 20px 52px rgba(15,23,42,.18);
}
.hero:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(90deg,rgba(15,23,42,.13),transparent 55%),
    repeating-linear-gradient(90deg,transparent 0 79px,rgba(255,255,255,.035) 80px),
    repeating-linear-gradient(0deg,transparent 0 79px,rgba(255,255,255,.035) 80px);
}
.hero-copy{position:relative;z-index:2;max-width:700px}
.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-bottom:16px;
  color:#fed7aa;
  font-size:11px;
  font-weight:800;
  letter-spacing:.14em;
  text-transform:uppercase;
}
.eyebrow:before{content:"";width:28px;height:2px;background:#ea580c}
.hero h2{
  max-width:680px;
  margin:0;
  color:#fff;
  font-size:clamp(34px,5vw,67px);
  line-height:.98;
  font-weight:800;
  letter-spacing:-.055em;
}
.hero h2 em{
  color:#fdba74;
  font-family:"Playfair Display",serif;
  font-weight:400;
}
.hero-desc{
  max-width:610px;
  margin:18px 0 22px;
  color:#e2e8f0;
  font-size:14px;
}
.hero-meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.hero-cta{
  min-height:46px;
  padding:0 18px;
  border:0;
  border-radius:10px;
  display:inline-flex;
  align-items:center;
  gap:9px;
  color:#111827;
  background:var(--color-accent);
  font-weight:800;
  box-shadow:0 8px 20px rgba(234,88,12,.25);
  transition:background .2s,transform .2s,box-shadow .2s;
}
.hero-cta:hover{
  background:#fb6a1b;
  transform:translateY(-2px);
  box-shadow:0 12px 24px rgba(234,88,12,.34);
}
.hero-pill{
  min-height:38px;
  padding:8px 12px;
  border:1px solid rgba(255,255,255,.22);
  border-radius:9px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:#f8fafc;
  background:rgba(255,255,255,.08);
  font-size:12px;
  font-weight:700;
}
.model-wrap{
  min-height:230px;
  position:relative;
  display:grid;
  place-items:center;
  perspective:900px;
}
.room{
  width:280px;
  height:185px;
  position:relative;
  transform-style:preserve-3d;
  transform:rotateX(59deg) rotateZ(-36deg);
  filter:drop-shadow(28px 34px 20px rgba(15,23,42,.38));
}
.floor{
  position:absolute;
  inset:0;
  border:1px solid rgba(255,255,255,.28);
  background:
    linear-gradient(90deg,rgba(255,255,255,.1) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.1) 1px,transparent 1px),
    #64748b;
  background-size:35px 35px;
}
.wall-a,.wall-b{
  position:absolute;
  background:#94a3b8;
  border:1px solid rgba(255,255,255,.28);
  transform-origin:bottom;
}
.wall-a{left:0;right:0;top:-72px;height:72px;transform:rotateX(-90deg)}
.wall-b{top:0;bottom:0;right:-72px;width:72px;transform:rotateY(90deg)}
.block{
  position:absolute;
  border:1px solid rgba(255,255,255,.25);
  background:#cbd5e1;
  box-shadow:inset -10px -10px 0 rgba(71,85,105,.35);
}
.sofa{left:28px;top:68px;width:105px;height:46px;transform:translateZ(19px)}
.table3d{left:151px;top:77px;width:52px;height:48px;transform:translateZ(14px);background:#ea580c}
.cabinet{left:201px;top:17px;width:48px;height:35px;transform:translateZ(28px);background:#e2e8f0}
.model-label{
  position:absolute;
  right:0;
  bottom:3px;
  padding:6px 9px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:7px;
  color:#e2e8f0;
  background:rgba(15,23,42,.35);
  font:10px "JetBrains Mono",monospace;
}
.value-strip{
  margin-bottom:18px;
  padding:12px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  border:1px solid var(--line);
  border-left:4px solid var(--color-accent);
  border-radius:12px;
  background:#fff;
  box-shadow:0 6px 18px rgba(15,23,42,.04);
}
.value-strip strong{color:#0f172a;font-size:13px}
.value-strip span{color:var(--muted);font-size:12px}
.section-title{
  margin:25px 0 12px;
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:16px;
}
.section-title h3{margin:0;color:#0f172a;font-size:18px}
.section-title p{margin:2px 0 0;color:var(--muted);font-size:12px}
.grid{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(300px,1fr)}
.g32{grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr)}
.card,.pcard,.swatch{
  min-width:0;
  border:1px solid var(--line);
  background:var(--color-card);
  box-shadow:0 5px 18px rgba(15,23,42,.045);
}
.card{padding:17px;border-radius:var(--radius)}
.card:hover{border-color:#cbd5e1;box-shadow:var(--shadow)}
.card h3{
  margin:0 0 14px;
  display:flex;
  align-items:center;
  gap:8px;
  color:#0f172a;
  font-size:14px;
  font-weight:800;
}
.card h3 .msi{color:var(--color-accent)}
.card h3 .tag{
  margin-left:auto;
  color:var(--muted);
  font-size:10.5px;
  font-weight:600;
}
.kpi{position:relative;overflow:hidden;min-height:126px}
.kpi:before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:44px;
  height:3px;
  background:var(--color-accent);
}
.kpi .lab{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11.5px;font-weight:650}
.kpi .lab .msi{color:var(--color-primary);font-size:17px}
.kpi .val{
  margin-top:8px;
  color:#0f172a;
  font-size:29px;
  font-weight:800;
  letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;
}
.kpi .val small{margin-left:4px;color:var(--muted);font-size:12px;letter-spacing:0}
.kpi .dt{margin-top:5px;display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700}
.kpi .up{color:var(--success)}
.kpi .down{color:var(--color-destructive)}
.kpi .ic{position:absolute;right:8px;bottom:-12px;color:#64748b;font-size:74px;opacity:.07}
.pcard{
  padding:14px;
  border-radius:14px;
  border-left:3px solid #94a3b8;
}
.pcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pcard .nm{color:#0f172a;font-size:13.5px;font-weight:800}
.pcard .meta{margin-top:2px;color:var(--muted);font-size:10.5px}
.pcard .row{
  margin-top:11px;
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:6px;
  color:var(--muted);
  font-size:11px;
}
.pcard .row b{color:var(--ink)}
.bar{height:7px;min-width:60px;overflow:hidden;border-radius:2px;background:#e2e8f0}
.bar>i{display:block;height:100%;background:#64748b}
.barrow{display:flex;align-items:center;gap:9px}
.barrow .num{width:40px;text-align:right;color:#0f172a;font-size:11px;font-weight:700}
.b{
  padding:3px 8px;
  border-radius:5px;
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-size:10.5px;
  font-weight:800;
  line-height:1.4;
}
.b:before{font-family:"Material Symbols Outlined";font-size:13px}
.b-ok{color:#065f46;background:#d1fae5}.b-ok:before{content:"check_circle"}
.b-run{color:#334155;background:#e2e8f0}.b-run:before{content:"progress_activity"}
.b-wait{color:#92400e;background:#fef3c7}.b-wait:before{content:"pending"}
.b-late{color:#991b1b;background:#fee2e2}.b-late:before{content:"error"}
.b-info{color:#075985;background:#e0f2fe}.b-info:before{content:"local_shipping"}
.b-mut{color:#475569;background:#eef2f6}.b-mut:before{content:"remove"}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:11px}
table{width:100%;min-width:600px;border-collapse:collapse;font-size:12px}
th,td{padding:10px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
th{
  color:#475569;
  background:#f1f5f9;
  text-align:left;
  font-size:10.5px;
  font-weight:800;
  letter-spacing:.06em;
}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f8fafc}
td:nth-last-child(2),td:last-child{font-variant-numeric:tabular-nums}
.num-cell{text-align:right;font-variant-numeric:tabular-nums}
.chartbox{position:relative;height:230px;min-width:0}
.chartbox.sm{height:205px}
.tl{position:relative;padding-left:24px}
.tl:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:1px;background:#cbd5e1}
.tl .it{position:relative;padding:0 0 15px 7px}
.tl .it:before{
  content:"";
  position:absolute;
  left:-22px;
  top:4px;
  width:10px;
  height:10px;
  border:2px solid #fff;
  border-radius:50%;
  background:#64748b;
  box-shadow:0 0 0 2px #64748b;
}
.tl .it.done:before{background:#047857;box-shadow:0 0 0 2px #047857}
.tl .it.late:before{background:#dc2626;box-shadow:0 0 0 2px #dc2626}
.tl .d{color:var(--muted);font-size:10px}
.tl .t{color:#0f172a;font-size:12px;font-weight:700}
.mood{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.swatch{overflow:hidden;border-radius:10px}
.swatch .sw{height:76px;padding:7px;display:flex;align-items:flex-end}
.swatch .cap{padding:8px}
.swatch .n{color:#0f172a;font-size:11.5px;font-weight:800}
.swatch .m{margin-top:1px;color:var(--muted);font-size:10px}
.chip{
  padding:2px 6px;
  border-radius:4px;
  color:#fff;
  background:rgba(15,23,42,.72);
  font-size:9.5px;
  font-weight:800;
}
.fb{padding:11px 0;display:flex;gap:10px;border-bottom:1px solid var(--line)}
.fb:last-child{border-bottom:0}
.fb .av{
  width:34px;
  height:34px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:8px;
  color:#fff;
  font-size:12px;
  font-weight:800;
}
.fb .nm{color:#0f172a;font-size:12px;font-weight:800}
.fb .tx{margin-top:2px;color:#334155;font-size:11.5px}
.fb .tm{margin-top:3px;color:var(--muted);font-size:9.5px}
.gantt{min-width:640px}
.gantt .grow{
  padding:7px 0;
  display:grid;
  grid-template-columns:150px 1fr;
  align-items:center;
  gap:10px;
  border-bottom:1px solid var(--line);
}
.gantt .glab{color:#0f172a;font-size:11.5px;font-weight:700}
.gantt .glab small{display:block;color:var(--muted);font-size:9.5px;font-weight:400}
.gantt .track{position:relative;height:22px;border-radius:3px;background:#edf1f5}
.gantt .seg{
  position:absolute;
  height:22px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:3px;
  color:#fff;
  font-size:9px;
  font-weight:800;
}
.ganttscale{padding-bottom:4px;display:grid;grid-template-columns:150px 1fr;gap:10px;color:var(--muted);font-size:9.5px}
.ganttscale .sc{display:grid;grid-template-columns:repeat(6,1fr)}
.legend{margin-top:9px;display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:10.5px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;display:inline-block;border-radius:2px}
.ai{
  color:#e2e8f0;
  border:0;
  background:#334155;
}
.ai h3{color:#fff}.ai h3 .msi{color:#fdba74}
.ai .li{padding:9px 0;display:flex;gap:8px;border-bottom:1px solid rgba(255,255,255,.13);font-size:11.5px}
.ai .li:last-child{border-bottom:0}
.ai .li .msi{flex:none;margin-top:1px;color:#fdba74;font-size:17px}
.mini,.hint{color:var(--muted);font-size:10.5px}
.hint{margin-top:9px;display:flex;align-items:center;gap:6px}
.ai .mini{color:#cbd5e1}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.mt{margin-top:14px}
.grid-item{animation:item-in .42s cubic-bezier(.18,.89,.32,1.28) both}
.grid-item:nth-child(2){animation-delay:.06s}
.grid-item:nth-child(3){animation-delay:.12s}
.grid-item:nth-child(4){animation-delay:.18s}
.grid-item:nth-child(5){animation-delay:.24s}
.grid-item:nth-child(6){animation-delay:.30s}
@keyframes item-in{
  from{opacity:0;transform:translateY(16px) scale(.96)}
  to{opacity:1;transform:none}
}
@media(max-width:1050px){
  .topbar{align-items:flex-start;flex-direction:column;gap:6px}
  .brand{min-width:0}
  nav{width:100%}
  .hero{grid-template-columns:1fr minmax(260px,.65fr)}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.g32{grid-template-columns:1fr}
}
@media(max-width:768px){
  main{padding:14px 14px 48px}
  .topbar{padding:9px 14px}
  .brand p{display:none}
  .hero{min-height:auto;padding:26px 22px;grid-template-columns:1fr}
  .hero h2{font-size:40px}
  .model-wrap{min-height:185px}
  .room{transform:scale(.82) rotateX(59deg) rotateZ(-36deg)}
  .g2,.g3{grid-template-columns:1fr}
  .mood{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:480px){
  nav button{padding:9px 10px}
  nav button .lab{display:none}
  .hero{border-radius:16px}
  .hero h2{font-size:34px}
  .hero-meta{align-items:stretch;flex-direction:column}
  .hero-cta,.hero-pill{justify-content:center}
  .model-wrap{display:none}
  .g4{grid-template-columns:1fr}
  .value-strip{align-items:flex-start;flex-direction:column;gap:2px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  .grid-item{opacity:1;transform:none}
}
</style>
</head>
<body>
<header class="site-header">
  <div class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true"><span class="msi">architecture</span></div>
      <div>
        <h1>室內設計專案管理</h1>
        <p>Interior Design Studio ｜ 提案 · 選品 · 採購 · 客戶儀表板</p>
      </div>
    </div>
    <nav id="nav" aria-label="主要功能"></nav>
  </div>
</header>
<main id="app"></main>
<script>
"use strict";
var NAV=[
  {i:0,ic:"space_dashboard",lab:"專案總覽"},
  {i:1,ic:"palette",lab:"設計提案"},
  {i:2,ic:"dashboard_customize",lab:"選品材料板"},
  {i:3,ic:"inventory_2",lab:"商品資料庫"},
  {i:4,ic:"local_shipping",lab:"採購追蹤"},
  {i:5,ic:"auto_awesome",lab:"客戶儀表板"}
];
var ACC="#64748B",ACC2="#EA580C",MUT="#475569",LINE="#E2E8F0";

  return '<div class="grid g4">'+genericKpis(["本月採購額|29.4萬|receipt_long","在途訂單|3|local_shipping","待出貨|1|pending","延遲交期|1|schedule"])+'</div><div class="card mt grid-item"><h3><span class="msi">calendar_view_week</span>採購交期甘特圖</h3><div style="overflow-x:auto"><div class="gantt">'+gs+gg+'</div></div><div class="legend"><span><i style="background:#64748B"></i>已到貨</span><span><i style="background:#475569"></i>製作中</span><span><i style="background:#7C3AED"></i>運送中</span><span><i style="background:#A44809"></i>待出貨</span></div></div><div class="grid g23 mt"><div class="card grid-item"><h3><span class="msi">receipt</span>採購訂單追蹤</h3><div class="tbl-wrap"><table><thead><tr><th>單號</th><th>品項</th><th>供應商</th><th>專案</th><th>金額</th><th>預計到貨</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div></div><div class="card grid-item"><h3><span class="msi">show_chart</span>每週到貨金額</h3><div class="chartbox"><canvas id="c4"></canvas></div></div></div>'
}

function c5(){

}
var SCREENS=[s0,s1,s2,s3,s4,s5],CHARTS=[c0,c1,c2,c3,c4,c5];
function hero(i){
  var h=HEADS[i];
  return '<section class="hero"><div class="hero-copy"><div class="eyebrow">JVISION · FIELD CONTROL</div><h2>'+h[4]+'</h2><p class="hero-desc">'+h[2]+'</p><div class="hero-meta"><button class="hero-cta" type="button" id="heroAction"><span class="msi">'+h[0]+'</span>查看'+h[1]+'</button><span class="hero-pill"><span class="msi">verified</span>'+h[3]+'</span></div></div><div class="model-wrap" aria-label="室內空間三維模型示意"><div class="room"><div class="floor"></div><div class="wall-a"></div><div class="wall-b"></div><div class="block sofa"></div><div class="block table3d"></div><div class="block cabinet"></div></div><span class="model-label">MODEL / LIVE STATUS</span></div></section><div class="value-strip"><strong>'+h[1]+'</strong><span>'+h[2]+'</span></div>'
}
function show(i){
  i=Math.max(0,Math.min(i,5));
  destroyChart();
  Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){
    var active=+b.getAttribute("data-i")===i;
    b.classList.toggle("active",active);
    b.setAttribute("aria-current",active?"page":"false")
  });
  document.title=HEADS[i][1]+"｜室內設計專案管理";
  document.getElementById("app").innerHTML=hero(i)+'<section aria-label="'+HEADS[i][1]+'資料"><div class="section-title"><div><h3>'+HEADS[i][1]+'</h3><p>'+HEADS[i][2]+'</p></div><span class="hero-pill" style="color:#334155;background:#fff;border-color:#e2e8f0"><span class="msi">'+HEADS[i][0]+'</span>'+HEADS[i][3]+'</span></div>'+SCREENS[i]()+'</section>';
  document.getElementById("heroAction").addEventListener("click",function(){
    var y=document.querySelector(".section-title").getBoundingClientRect().top+window.pageYOffset-88;
    window.scrollTo({top:y,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})
  });
  requestAnimationFrame(function(){try{CHARTS[i]()}catch(e){}})
}
function hashIndex(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  return m?Math.min(+m[1],5):0
}
(function(){
  var nav=document.getElementById("nav");
  nav.innerHTML=NAV.map(function(n){return '<button type="button" data-i="'+n.i+'" aria-label="'+n.lab+'"><span class="msi" aria-hidden="true">'+n.ic+'</span><span class="lab">'+n.lab+'</span></button>'}).join("");
  Array.prototype.forEach.call(nav.children,function(b){
    b.addEventListener("click",function(){
      var i=+b.getAttribute("data-i"),next="#v"+i;
      if(location.hash===next){show(i);window.scrollTo(0,0)}else{location.hash=next}
    })
  });
  window.addEventListener("hashchange",function(){show(hashIndex());window.scrollTo(0,0)});
  show(hashIndex())
})();
</script>
