<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="../../favicon.svg">
<title>溫室氣體盤查艙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000;
  --color-secondary:#10b981;
  --color-on-secondary:#0f172a;
  --color-accent:#059669;
  --color-on-accent:#000;
  --color-background:#ecfdf5;
  --color-foreground:#064e3b;
  --color-card:#fff;
  --color-card-foreground:#064e3b;
  --color-muted:#e8f1f3;
  --color-muted-foreground:#475569;
  --color-border:#a7f3d0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#059669;
  --blue:#047857;
  --ink:#064e3b;
  --muted:#475569;
  --line:#a7f3d0;
  --bg:#ecfdf5;
  --card:#fff;
  --ok:#047857;
  --warn:#a16207;
  --bad:#b91c1c;
  --info:#1d4ed8;
  --shadow:0 1px 2px rgba(6,78,59,.06),0 10px 28px rgba(6,78,59,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  background:
    linear-gradient(rgba(5,150,105,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(5,150,105,.035) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--color-foreground);
  font-family:"Fira Sans",sans-serif;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
button,[data-i]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-size:20px;
  font-style:normal;
  font-weight:400;
  line-height:1;
  vertical-align:middle;
}
.topbar{
  position:sticky;
  top:0;
  z-index:30;
  color:#fff;
  background:#043f32;
  border-bottom:1px solid rgba(167,243,208,.32);
  box-shadow:0 4px 18px rgba(6,78,59,.16);
}
.topbar-in{
  width:min(1360px,100%);
  min-height:68px;
  margin:auto;
  padding:12px 24px;
  display:flex;
  align-items:center;
  gap:20px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-logo{
  width:42px;height:42px;flex:none;
  display:grid;place-items:center;
  background:#10b981;
  color:#022c22;
  border:1px solid #6ee7b7;
  border-radius:6px;
}
.brand-logo .material-symbols-outlined{font-size:25px}
.brand-t{min-width:0}
.brand-t b{
  display:block;
  font-size:17px;
  font-weight:700;
  letter-spacing:.04em;
  line-height:1.25;
}
.brand-t span{display:block;color:#d1fae5;font-size:11.5px}
.top-meta{margin-left:auto;display:flex;align-items:center;gap:10px}
.top-pill{
  min-height:34px;
  padding:6px 12px;
  display:flex;
  align-items:center;
  gap:7px;
  border:1px solid rgba(167,243,208,.32);
  border-radius:4px;
  background:rgba(255,255,255,.08);
  color:#ecfdf5;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
}
.top-pill .material-symbols-outlined{font-size:16px}
.avatar{
  width:36px;height:36px;flex:none;
  display:grid;place-items:center;
  border:1px solid #6ee7b7;
  border-radius:50%;
  background:#d1fae5;
  color:#064e3b;
  font-weight:700;
}
.nav{
  position:sticky;
  top:68px;
  z-index:25;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(12px);
}
.nav-in{
  width:min(1360px,100%);
  margin:auto;
  padding:8px 20px;
  display:flex;
  gap:4px;
  overflow-x:auto;
  scrollbar-width:thin;
}
.nav button{
  min-height:42px;
  padding:8px 14px;
  flex:none;
  display:flex;
  align-items:center;
  gap:8px;
  border:1px solid transparent;
  border-radius:4px;
  background:transparent;
  color:var(--muted);
  font-size:13px;
  font-weight:600;
  white-space:nowrap;
  transition:background-color .2s,color .2s,border-color .2s,transform .2s;
}
.nav button:hover{
  background:#d1fae5;
  border-color:#6ee7b7;
  color:#065f46;
}
.nav button.active{
  background:#059669;
  border-color:#047857;
  color:#001b12;
  box-shadow:inset 0 -3px 0 #064e3b;
}
.wrap{width:min(1360px,100%);margin:auto;padding:28px 24px 64px}
.screen-head{
  margin-bottom:20px;
  padding-bottom:18px;
  display:flex;
  align-items:flex-end;
  gap:16px;
  border-bottom:1px solid var(--line);
}
.screen-head .st{min-width:0}
.screen-head h1{
  margin:0 0 4px;
  color:#053f32;
  font-size:clamp(22px,2.3vw,30px);
  font-weight:700;
  letter-spacing:-.025em;
  line-height:1.2;
}
.screen-head p{margin:0;color:var(--muted);font-size:13.5px}
.chip{margin-left:auto;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.tag{
  min-height:32px;
  padding:5px 10px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:1px solid var(--line);
  border-radius:4px;
  background:#fff;
  color:#334155;
  font-size:11.5px;
  font-weight:600;
  white-space:nowrap;
}
.tag .material-symbols-outlined{color:#047857;font-size:16px}
.tag.live b{color:#065f46}
.dot{
  width:8px;height:8px;
  display:inline-block;
  border:2px solid #fff;
  border-radius:50%;
  background:#059669;
  box-shadow:0 0 0 2px #047857;
  animation:breathe 1.8s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.62;transform:scale(.82)}
}
.grid{display:grid;gap:16px;min-width:0}
.grid>*{min-width:0}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(300px,1fr)}
.g-1-2{grid-template-columns:minmax(300px,1fr) minmax(0,2fr)}
.card,.kpi{
  border:1px solid var(--line);
  border-radius:7px;
  background:var(--card);
  box-shadow:var(--shadow);
}
.card{padding:18px}
.card-h{
  min-height:28px;
  margin-bottom:14px;
  display:flex;
  align-items:center;
  gap:9px;
}
.card-h .material-symbols-outlined{color:#047857}
.card-h b{font-size:14px;font-weight:700;letter-spacing:.01em}
.card-h .sub{
  margin-left:auto;
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:10.5px;
  font-weight:500;
}
.kpi{
  min-height:136px;
  padding:17px;
  position:relative;
  overflow:hidden;
  transition:transform .22s,box-shadow .22s,border-color .22s;
}
.kpi::before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:4px;
  background:#059669;
}
.kpi::after{
  content:"";
  position:absolute;
  right:-25px;top:-25px;
  width:78px;height:78px;
  border:1px solid #a7f3d0;
  transform:rotate(45deg);
}
.kpi:hover{
  transform:translateY(-2px);
  border-color:#34d399;
  box-shadow:0 12px 30px rgba(6,78,59,.11);
}
.kpi .lbl{
  display:flex;align-items:center;gap:7px;
  color:var(--muted);
  font-size:12px;font-weight:600;
}
.kpi .lbl .material-symbols-outlined{color:#047857;font-size:18px}
.kpi .val{
  margin:8px 0 3px;
  color:#053f32;
  font-family:"Fira Code",monospace;
  font-size:26px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.04em;
}
.kpi .val small{margin-left:4px;color:var(--muted);font:500 12px "Fira Sans",sans-serif}
.kpi .delta{
  display:flex;align-items:center;gap:4px;
  font-size:11.5px;font-weight:600;
}
.kpi .delta .material-symbols-outlined{font-size:16px}
.up{color:#047857}.down{color:#b91c1c}.flat{color:#475569}
.chart{width:100%;min-width:0}
.tbl-wrap{
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:5px;
}
table{width:100%;min-width:560px;border-collapse:collapse;font-size:12.5px}
th{
  padding:11px 12px;
  border-bottom:2px solid #6ee7b7;
  background:#dff8ee;
  color:#064e3b;
  font-size:11.5px;
  font-weight:700;
  letter-spacing:.03em;
  text-align:left;
  white-space:nowrap;
}
td{
  padding:11px 12px;
  border-bottom:1px solid #d1fae5;
  color:#173e35;
  white-space:nowrap;
}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background-color .18s}
tbody tr:hover{background:#f0fdf8}
td:nth-child(n+5){font-variant-numeric:tabular-nums}
.mono{
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
  font-weight:500;
}
.badge{
  min-height:24px;
  padding:3px 8px;
  display:inline-flex;
  align-items:center;
  gap:4px;
  border:1px solid currentColor;
  border-radius:3px;
  font-size:10.5px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
}
.b-ok{background:#dcfce7;color:#166534}
.b-warn{background:#fef3c7;color:#854d0e}
.b-bad{background:#fee2e2;color:#991b1b}
.b-info{background:#dbeafe;color:#1e40af}
.b-gray{background:#f1f5f9;color:#334155}
.b-orange{background:#d1fae5;color:#065f46}
.bar-mini,.kprog,.goal-track{
  overflow:hidden;
  background:#dceae7;
  border-radius:2px;
}
.bar-mini{height:7px;min-width:60px}
.bar-mini>i,.kprog>i,.goal-track>i{
  height:100%;
  display:block;
  background:linear-gradient(90deg,#10b981,#047857);
}
.board{display:grid;grid-template-columns:repeat(4,minmax(245px,1fr));gap:12px}
.col{
  min-width:0;
  padding:11px;
  border:1px solid #c5e9dc;
  border-radius:5px;
  background:#f3faf7;
}
.col-h{margin-bottom:10px;padding:1px 2px;display:flex;align-items:center;gap:8px}
.col-h b{font-size:12.5px;font-weight:700}
.col-h .cnt{
  min-width:23px;height:23px;margin-left:auto;padding:0 6px;
  display:grid;place-items:center;
  border:1px solid var(--line);
  border-radius:3px;
  background:#fff;
  color:var(--muted);
  font:700 10px "Fira Code",monospace;
}
.col-h .swatch{width:8px;height:8px;flex:none;border-radius:1px}
.kcard{
  margin-bottom:8px;
  padding:11px;
  border:1px solid #bce8d8;
  border-left:3px solid #059669;
  border-radius:4px;
  background:#fff;
  transition:transform .2s,box-shadow .2s,border-color .2s;
}
.kcard:last-child{margin-bottom:0}
.kcard:hover{
  transform:translateY(-2px);
  border-color:#34d399;
  box-shadow:0 8px 20px rgba(6,78,59,.1);
}
.kcard .kt{
  margin-bottom:7px;
  display:flex;align-items:flex-start;gap:6px;
  font-size:12.5px;font-weight:700;
}
.kcard .kt .material-symbols-outlined{color:#047857;font-size:16px}
.kmeta{margin-bottom:8px;display:flex;flex-wrap:wrap;gap:5px}
.kmeta span:not(.badge){
  padding:2px 6px;
  border-radius:3px;
  background:#e8f1f3;
  color:#475569;
  font-size:10px;font-weight:600;
}
.kfoot{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:10.5px}
.kfoot .av{
  width:22px;height:22px;flex:none;
  display:grid;place-items:center;
  border-radius:50%;
  background:#047857;color:#fff;
  font-weight:700;
}
.kfoot .due{margin-left:auto;display:flex;align-items:center;gap:3px;font-family:"Fira Code",monospace}
.kfoot .due .material-symbols-outlined{font-size:13px}
.kfoot .due.od{color:#b91c1c;font-weight:700}
.kprog{height:5px;margin-top:8px}
.frow{
  margin-bottom:9px;
  padding:12px 13px;
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  gap:10px;
  border:1px solid var(--line);
  border-radius:4px;
  background:#fff;
  transition:border-color .2s,transform .2s;
}
.frow:hover{transform:translateX(2px);border-color:#34d399}
.frow:last-child{margin-bottom:0}
.fmain{min-width:0}
.fmain b{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:13px}
.fmain b .material-symbols-outlined{color:#047857;font-size:18px}
.fd{margin-top:3px;color:var(--muted);font-size:11px}
.fval{text-align:right}
.fn{color:#047857;font:700 16px "Fira Code",monospace}
.fu{color:var(--muted);font-size:10px}
.tl{position:relative;padding-left:27px}
.tl::before{
  content:"";
  position:absolute;left:8px;top:6px;bottom:6px;
  width:2px;background:#a7f3d0;
}
.tl-item{position:relative;padding-bottom:20px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{
  content:"";
  position:absolute;left:-25px;top:2px;
  width:14px;height:14px;
  border:3px solid #64748b;
  border-radius:50%;
  background:#fff;
}
.tl-item.done::before{border-color:#047857;background:#047857}
.tl-item.active::before{
  border-color:#059669;
  background:#d1fae5;
  box-shadow:0 0 0 3px #a7f3d0;
  animation:breathe 1.8s ease-in-out infinite;
}
.tl-t{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:700}
.tl-time{color:var(--muted);font:500 10.5px "Fira Code",monospace}
.tl-d{margin-top:3px;color:var(--muted);font-size:12px}
.goal{
  margin-bottom:10px;
  padding:13px 14px;
  border:1px solid var(--line);
  border-radius:4px;
  background:#fff;
}
.goal:last-child{margin-bottom:0}
.goal-h{margin-bottom:10px;display:flex;align-items:center;gap:8px}
.goal-h b{font-size:12.5px}
.goal-h .yr{
  margin-left:auto;padding:3px 7px;
  border:1px solid #6ee7b7;border-radius:3px;
  background:#d1fae5;color:#065f46;
  font:700 10.5px "Fira Code",monospace;
}
.goal-track{height:10px;position:relative}
.goal-track .mk{position:absolute;top:-3px;bottom:-3px;width:2px;background:#334155}
.goal-foot{
  margin-top:7px;
  display:flex;justify-content:space-between;gap:8px;
  color:var(--muted);
  font:500 10.5px "Fira Code",monospace;
}
.li{padding:10px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid #d1fae5}
.li:last-child{border-bottom:0}
.li .ic{
  width:34px;height:34px;flex:none;
  display:grid;place-items:center;
  border:1px solid var(--line);
  border-radius:4px;
  background:#ecfdf5;
}
.li .ic .material-symbols-outlined{color:#047857;font-size:19px}
.li .lt{min-width:0;flex:1}
.li .lt b{display:block;font-size:12.5px}
.li .lt span{display:block;color:var(--muted);font-size:11px}
.li .lv{flex:none;text-align:right;font-family:"Fira Code",monospace;font-weight:700}
.donut-legend{display:flex;flex-direction:column;gap:8px}
.dl{display:flex;align-items:center;gap:8px;color:#334155;font-size:12px}
.dl .sw{width:10px;height:10px;flex:none;border-radius:1px}
.dl b{margin-left:auto;font-family:"Fira Code",monospace}
.hint{
  margin-top:13px;
  padding:10px 12px;
  display:flex;align-items:flex-start;gap:7px;
  border-left:3px solid #059669;
  background:#dff8ee;
  color:#334155;
  font-size:11.5px;
}
.hint .material-symbols-outlined{color:#047857;font-size:16px}
.foot{
  margin-top:32px;padding-top:18px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:11px;text-align:center;
}
.grid-item{animation:enter .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{
  from{opacity:0;transform:translateY(12px) scale(.98)}
  to{opacity:1;transform:none}
}
@media(max-width:1024px){
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-2-1,.g-1-2{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(2,minmax(245px,1fr))}
}
@media(max-width:768px){
  .topbar-in{padding:10px 16px}
  .brand-t span{display:none}
  .top-meta{gap:6px}
  .top-pill{padding:6px 8px}
  .top-pill .txt{display:none}
  .nav{top:62px}
  .nav-in{padding:7px 12px}
  .wrap{padding:22px 16px 48px}
  .screen-head{align-items:flex-start;flex-direction:column}
  .chip{margin-left:0;justify-content:flex-start}
  .g2,.g3{grid-template-columns:1fr}
}
@media(max-width:560px){
  .brand-t b{font-size:15px}
  .nav button{min-width:42px;justify-content:center;padding:8px 10px}
  .nav button .txt{display:none}
  .g-kpi{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .card{padding:14px}
  .kpi{min-height:126px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  .dot,.tl-item.active::before,.grid-item{animation:none!important}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true"><span class="material-symbols-outlined">eco</span></div>
      <div class="brand-t"><b>溫室氣體盤查艙</b><span>GHG Inventory Pod · Scope 1/2/3 碳盤查平台</span></div>
    </div>
    <div class="top-meta">
      <div class="top-pill"><span class="material-symbols-outlined" aria-hidden="true">calendar_month</span><span class="txt">盤查年度 2025</span></div>
      <div class="top-pill"><span class="dot" aria-hidden="true"></span><span class="txt">ISO 14064-1 進行中</span></div>
      <div class="avatar" aria-label="使用者：永">永</div>
    </div>
  </div>
</header>
<nav class="nav" aria-label="主要功能"><div class="nav-in" id="nav"></div></nav>
<main class="wrap">
  <div id="view" aria-live="polite"></div>
  <div class="foot">溫室氣體盤查艙 · 純前端展示介面 · 假資料僅供 UI 呈現 · 依 ISO 14064-1 / GHG Protocol 設計</div>
</main>
<script>
"use strict";
var chart=null;
var green="#059669",greenDark="#047857",greenLight="#10b981",mint="#6ee7b7",gridLine="#d1fae5",axis="#475569";
function disposeChart(){
  if(chart){
    if(chart._extra)for(var k=0;k<chart._extra.length;k++)try{chart._extra[k].dispose()}catch(e){}
    try{chart.dispose()}catch(e){}
    chart=null;
  }
}
var NAV=[
  {i:0,ic:"view_kanban",t:"盤查看板"},
  {i:1,ic:"table_chart",t:"活動數據"},
  {i:2,ic:"functions",t:"係數庫"},
  {i:3,ic:"pie_chart",t:"範疇分析"},
  {i:4,ic:"verified",t:"查證軌跡"},
  {i:5,ic:"flag_circle",t:"減碳目標"}
];
function num(n){try{return(n==null?0:n).toLocaleString("en-US")}catch(e){return String(n)}}
function head(title,sub,chips){

function show(i){
  disposeChart();
  document.querySelectorAll("[data-i]").forEach(function(btn){
    var active=+btn.getAttribute("data-i")===i;
    btn.classList.toggle("active",active);
    btn.setAttribute("aria-current",active?"page":"false");
  });
  view.innerHTML="";
  if(i===1)screen1();else if(i===2)screen2();else if(i===3)screen3();else if(i===4)screen4();else if(i===5)screen5();else screen0();
}
(function(){
  var html="";
  NAV.forEach(function(x){html+='<button type="button" data-i="'+x.i+'" aria-label="'+x.t+'"><span class="material-symbols-outlined" aria-hidden="true">'+x.ic+'</span><span class="txt">'+x.t+'</span></button>'});
  nav.innerHTML=html;
  nav.querySelectorAll("[data-i]").forEach(function(btn){
    btn.addEventListener("click",function(){
      var i=+this.getAttribute("data-i");
      location.hash="v"+i;
      show(i);
      try{window.scrollTo(0,0)}catch(e){}
    });
  });
})();
window.addEventListener("resize",function(){
  if(chart){
    try{chart.resize()}catch(e){}
    if(chart._extra)chart._extra.forEach(function(x){try{x.resize()}catch(e){}});
  }
});
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  var n=document.querySelectorAll("[data-i]").length||6;
  show(m?Math.min(+m[1],n-1):0);
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
