<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" href="../../favicon.svg"/>
<title>溫室氣體盤查艙</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#ea580c; --accent2:#fb923c; --accent-soft:#fff2e9;
  --ink:#1c1917; --muted:#78716c; --line:#eee5df; --bg:#faf6f2; --card:#ffffff;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;font-size:20px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(100deg,#7c2d12,#c2410c 55%,#ea580c);color:#fff;box-shadow:0 4px 18px rgba(124,45,18,.25)}
.topbar-in{max-width:1360px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-logo{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none;border:1px solid rgba(255,255,255,.28)}
.brand-logo .material-symbols-outlined{font-size:24px}
.brand-t{min-width:0}
.brand-t b{font-family:"Noto Sans TC";font-weight:900;font-size:17px;letter-spacing:.5px;display:block;line-height:1.2}
.brand-t span{font-size:11.5px;opacity:.82}
.top-meta{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top-pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:5px 13px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
.top-pill .material-symbols-outlined{font-size:16px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#fdba74,#fb923c);display:grid;place-items:center;font-weight:800;color:#7c2d12;font-size:13px;flex:none}
.nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:64px;z-index:25}
.nav-in{max-width:1360px;margin:0 auto;padding:8px 16px;display:flex;gap:6px;flex-wrap:wrap}
.nav button{flex:none;white-space:nowrap;display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--muted);transition:.15s;min-width:0}
.nav button .material-symbols-outlined{font-size:19px}
.nav button:hover{background:var(--accent-soft);color:var(--accent)}
.nav button.active{background:var(--accent);color:#fff;box-shadow:0 3px 10px rgba(234,88,12,.32)}
.wrap{max-width:1360px;margin:0 auto;padding:22px 20px 60px}
.screen-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.screen-head .st{min-width:0}
.screen-head h1{font-family:"Noto Sans TC";font-weight:900;font-size:23px;margin:0 0 3px;letter-spacing:.4px}
.screen-head p{margin:0;color:var(--muted);font-size:13.5px}
.chip{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tag{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.tag .material-symbols-outlined{font-size:15px;color:var(--accent)}
.tag.live b{color:var(--ok)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(22,163,74,.5)}50%{opacity:.55;box-shadow:0 0 0 5px rgba(22,163,74,0)}}
.grid{display:grid;gap:16px;min-width:0}
.g-kpi{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g-2-1{grid-template-columns:2fr 1fr}
.g-1-2{grid-template-columns:1fr 2fr}
.grid>*{min-width:0}
@media(max-width:820px){
  .g-kpi{grid-template-columns:repeat(2,1fr)}
  .g3,.g2,.g-2-1,.g-1-2{grid-template-columns:1fr}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.card-h{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.card-h .material-symbols-outlined{font-size:20px;color:var(--accent)}
.card-h b{font-family:"Noto Sans TC";font-weight:700;font-size:15px}
.card-h .sub{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:600}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.kpi .lbl{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .lbl .material-symbols-outlined{font-size:17px;color:var(--accent2)}
.kpi .val{font-family:"Inter";font-weight:800;font-size:27px;margin:8px 0 3px;letter-spacing:-.5px}
.kpi .val small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px}
.kpi .delta{font-size:11.5px;font-weight:700;display:flex;align-items:center;gap:3px}
.kpi .delta .material-symbols-outlined{font-size:15px}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
.chart{width:100%;min-width:0}
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
th{background:#fbf5f0;text-align:left;padding:11px 13px;font-weight:700;color:#57534e;font-size:12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 13px;border-bottom:1px solid var(--line);color:var(--ink);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fdf9f6}
.mono{font-family:"Inter";font-variant-numeric:tabular-nums;font-weight:600}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-ok{background:#dcfce7;color:#15803d}
.b-warn{background:#fef3c7;color:#b45309}
.b-bad{background:#fee2e2;color:#b91c1c}
.b-info{background:#dbeafe;color:#1d4ed8}
.b-gray{background:#f5f5f4;color:#57534e}
.b-orange{background:var(--accent-soft);color:var(--accent)}
.bar-mini{height:7px;border-radius:99px;background:#f0e9e3;overflow:hidden;min-width:60px}
.bar-mini > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;min-width:0}
.board>*{min-width:0}
@media(max-width:980px){.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.board{grid-template-columns:1fr}}
.col{background:#f7f1ec;border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.col-h{display:flex;align-items:center;gap:8px;margin-bottom:11px;padding:0 2px}
.col-h b{font-family:"Noto Sans TC";font-weight:700;font-size:13.5px}
.col-h .cnt{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:99px;min-width:22px;height:22px;padding:0 7px;display:grid;place-items:center;font-size:11.5px;font-weight:800;color:var(--muted)}
.col-h .swatch{width:9px;height:9px;border-radius:3px;flex:none}
.kcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:9px;border-left:3px solid var(--accent2);transition:.14s}
.kcard:hover{box-shadow:0 5px 16px rgba(124,45,18,.1);transform:translateY(-1px)}
.kcard:last-child{margin-bottom:0}
.kcard .kt{font-weight:700;font-size:13px;font-family:"Noto Sans TC";margin-bottom:6px;display:flex;align-items:center;gap:6px}
.kcard .kt .material-symbols-outlined{font-size:16px;color:var(--accent)}
.kmeta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.kmeta span:not(.badge){font-size:10.5px;background:#f5f0ec;color:#78716c;border-radius:6px;padding:2px 7px;font-weight:600}
.kfoot{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted)}
.kfoot .av{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--accent));display:grid;place-items:center;color:#fff;font-size:10px;font-weight:800;flex:none}
.kfoot .due{margin-left:auto;display:flex;align-items:center;gap:3px;font-weight:600}
.kfoot .due .material-symbols-outlined{font-size:14px}
.kfoot .due.od{color:var(--bad)}
.kprog{height:5px;border-radius:99px;background:#f0e9e3;overflow:hidden;margin-top:8px}
.kprog>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px}
.frow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:13px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff}
.frow:last-child{margin-bottom:0}
.frow .fmain{min-width:0}
.frow .fmain b{font-family:"Noto Sans TC";font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.frow .fmain b .material-symbols-outlined{font-size:18px;color:var(--accent)}
.frow .fmain .fd{font-size:11.5px;color:var(--muted);margin-top:3px}
.frow .fval{text-align:right;flex:none}
.frow .fval .fn{font-family:"Inter";font-weight:800;font-size:16px;color:var(--accent)}
.frow .fval .fu{font-size:10.5px;color:var(--muted)}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:18px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-22px;top:3px;width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--accent2)}
.tl-item.done::before{background:var(--ok);border-color:var(--ok)}
.tl-item.active::before{background:var(--accent);border-color:var(--accent);animation:breathe 1.8s ease-in-out infinite}
.tl-item .tl-t{font-weight:700;font-size:13.5px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tl-item .tl-time{font-size:11px;color:var(--muted);font-weight:600}
.tl-item .tl-d{font-size:12.5px;color:var(--muted);margin-top:3px}
.goal{border:1px solid var(--line);border-radius:14px;padding:15px 16px;background:#fff;margin-bottom:12px}
.goal:last-child{margin-bottom:0}
.goal-h{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.goal-h b{font-family:"Noto Sans TC";font-weight:700;font-size:14px}
.goal-h .yr{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:8px}
.goal-track{height:11px;border-radius:99px;background:#f0e9e3;overflow:hidden;position:relative}
.goal-track>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.goal-track .mk{position:absolute;top:-3px;bottom:-3px;width:2px;background:#57534e}
.goal-foot{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:7px;font-weight:600}
.li{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}
.li .ic{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;flex:none}
.li .ic .material-symbols-outlined{font-size:20px;color:var(--accent)}
.li .lt{min-width:0;flex:1}
.li .lt b{font-size:13.5px;font-family:"Noto Sans TC";font-weight:700;display:block}
.li .lt span{font-size:11.5px;color:var(--muted)}
.li .lv{text-align:right;flex:none;font-weight:800;font-family:"Inter"}
.donut-legend{display:flex;flex-direction:column;gap:9px}
.dl{display:flex;align-items:center;gap:9px;font-size:12.5px}
.dl .sw{width:11px;height:11px;border-radius:3px;flex:none}
.dl b{margin-left:auto;font-family:"Inter";font-weight:800}
.hint{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:12px}
.hint .material-symbols-outlined{font-size:15px;color:var(--accent2)}
.foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:30px;padding-top:18px;border-top:1px solid var(--line)}
@media(max-width:560px){
  .nav button span.txt{display:none}
  .nav button{padding:9px 11px}
  .top-meta .top-pill span.txt{display:none}
}
h1,h2,h3,h4{margin:0}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">eco</span></div>

<script>
"use strict";
var chart=null;
function disposeChart(){
  if(chart){
    if(chart._extra){ for(var k=0;k<chart._extra.length;k++){ try{chart._extra[k].dispose();}catch(e){} } }
    try{chart.dispose();}catch(e){}
    chart=null;
  }
}

var NAV=[
  {i:0,ic:"view_kanban",t:"盤查看板"},
  {i:1,ic:"table_chart",t:"活動數據"},
  {i:2,ic:"functions",t:"係數庫"},
  {i:3,ic:"pie_chart",t:"範疇分析"},
  {i:4,ic:"verified",t:"查證軌跡"},
  {i:5,ic:"flag_circle",t:"減碳目標"}
];

function num(n){try{return (n==null?0:n).toLocaleString("en-US");}catch(e){return String(n);}}
function head(title,sub,chips){
  var h='<div class="screen-head"><div class="st"><h1>'+title+'</h1><p>'+sub+'</p></div>';
  if(chips){h+='<div class="chip">'+chips+'</div>';}
  h+='</div>';
  return h;
}
function kpi(ic,lbl,val,unit,dir,delta){
  var arrow=dir==="up"?"trending_up":(dir==="down"?"trending_down":"trending_flat");
  return '<div class="kpi"><div class="lbl"><span class="material-symbols-outlined">'+ic+'</span>'+lbl+'</div>'
    +'<div class="val">'+val+'<small>'+unit+'</small></div>'
    +'<div class="delta '+dir+'"><span class="material-symbols-outlined">'+arrow+'</span>'+delta+'</div></div>';
}
function dl(c,t,v){return '<div class="dl"><span class="sw" style="background:'+c+'"></span>'+t+'<b>'+v+'</b></div>';}

/* ============ SCREEN 0 : KANBAN 盤查任務看板 (signature) ============ */
function screen0(){
  var cols=[
    {name:"建立盤查任務",color:"#94a3b8"},
    {name:"活動數據登錄",color:"#fb923c"},
    {name:"套用係數計算",color:"#f59e0b"},
    {name:"查證確認 / 結案",color:"#16a34a"}
  ];
  var cards=[
    [
      {t:"台中廠 固定燃燒源盤查",scope:"Scope 1",src:"天然氣鍋爐",owner:"陳",due:"08/20",p:8,od:false,tag:"新任務"},
      {t:"高雄廠 製程逸散排放",scope:"Scope 1",src:"冷媒 R-410A",owner:"林",due:"08/22",p:12,od:false,tag:"新任務"},
      {t:"集團 上游運輸盤查",scope:"Scope 3",src:"外包物流",owner:"黃",due:"08/28",p:0,od:false,tag:"待指派"}
    ],
    [
      {t:"總部 外購電力盤查",scope:"Scope 2",src:"台電電費單",owner:"王",due:"08/16",p:64,od:false,tag:"填報中"},
      {t:"桃園廠 移動燃燒源",scope:"Scope 1",src:"堆高機柴油",owner:"陳",due:"08/15",p:48,od:true,tag:"逾期"},
      {t:"台中廠 外購蒸汽",scope:"Scope 2",src:"汽電共生",owner:"林",due:"08/18",p:55,od:false,tag:"填報中"},
      {t:"集團 員工通勤估算",scope:"Scope 3",src:"問卷抽樣",owner:"黃",due:"08/25",p:30,od:false,tag:"填報中"}
    ],
    [
      {t:"總部 固定燃燒源計算",scope:"Scope 1",src:"IPCC 2006",owner:"王",due:"08/14",p:82,od:false,tag:"計算中"},
      {t:"高雄廠 外購電力計算",scope:"Scope 2",src:"電力係數 2024",owner:"林",due:"08/14",p:90,od:false,tag:"計算中"},
      {t:"集團 商務差旅",scope:"Scope 3",src:"航空里程",owner:"黃",due:"08/19",p:70,od:false,tag:"計算中"}
    ],
    [
      {t:"台南廠 全廠盤查清冊",scope:"全範疇",src:"BSI 查證",owner:"周",due:"08/12",p:100,od:false,tag:"已查證"},
      {t:"桃園廠 Scope 1 複核",scope:"Scope 1",src:"內部稽核",owner:"周",due:"08/13",p:100,od:false,tag:"已結案"},
      {t:"總部 2024 基準年校正",scope:"全範疇",src:"SGS 查證",owner:"周",due:"08/11",p:100,od:false,tag:"已結案"}
    ]
  ];
  var chips='<span class="tag live"><span class="dot"></span><b>看板即時</b></span>'
    +'<span class="tag"><span class="material-symbols-outlined">assignment</span>13 項任務</span>'
    +'<span class="tag"><span class="material-symbols-outlined">warning</span>1 逾期</span>';
  var h=head("盤查任務看板","各廠區、各範疇排放源盤查任務分階段追蹤，一眼掌握卡關與逾期",chips);

  h+='<div class="grid g-kpi" style="margin-bottom:16px">'
    +kpi("bolt","本期排放量","14,820","tCO2e","up","較基準年 -6.4%")
    +kpi("assignment_turned_in","盤查完成率","74","%","up","+12% 本週")
    +kpi("factory","涵蓋排放源","86","項","flat","6 廠區")
    +kpi("schedule","逾期任務","1","項","down","需優先處理")
    +'</div>';

  h+='<div class="card"><div class="card-h"><span class="material-symbols-outlined">view_kanban</span><b>盤查作業看板</b><span class="sub">拖曳更新狀態 · 依範疇篩選</span></div>';
  h+='<div style="overflow-x:auto"><div class="board">';
  for(var c=0;c<cols.length;c++){
    var col=cols[c];
    var list=cards[c]||[];
    h+='<div class="col"><div class="col-h"><span class="swatch" style="background:'+col.color+'"></span><b>'+col.name+'</b><span class="cnt">'+list.length+'</span></div>';
    for(var j=0;j<list.length;j++){
      var k=list[j];
      var scopeCls=k.scope.indexOf("1")>-1?"b-orange":(k.scope.indexOf("2")>-1?"b-info":(k.scope.indexOf("3")>-1?"b-gray":"b-ok"));
      var tagCls=k.tag.indexOf("逾期")>-1?"b-bad":(k.tag.indexOf("查證")>-1||k.tag.indexOf("結案")>-1?"b-ok":"b-orange");

/* ============ router ============ */
function show(i){
  disposeChart();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){ btns[b].classList.toggle("active", +btns[b].getAttribute("data-i")===i); }
  var v=document.getElementById("view");
  v.innerHTML="";
  if(i===1)screen1();
  else if(i===2)screen2();
  else if(i===3)screen3();
  else if(i===4)screen4();
  else if(i===5)screen5();
  else screen0();
}

(function(){
  var nav=document.getElementById("nav");
  var hh="";
  for(var i=0;i<NAV.length;i++){
    hh+='<button data-i="'+NAV[i].i+'"><span class="material-symbols-outlined">'+NAV[i].ic+'</span><span class="txt">'+NAV[i].t+'</span></button>';
  }
  nav.innerHTML=hh;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){ show(+this.getAttribute("data-i")); try{window.scrollTo(0,0);}catch(e){} });
  }
})();

window.addEventListener("resize",function(){
  if(chart){ try{chart.resize();}catch(e){} if(chart._extra){for(var k=0;k<chart._extra.length;k++){try{chart._extra[k].resize();}catch(e){}}} }
});

show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
