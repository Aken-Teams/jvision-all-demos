<style>
:root{
 --color-primary:#2563EB;--color-on-primary:#FFFFFF;
 --color-secondary:#3B82F6;--color-on-secondary:#000000;
 --color-accent:#EA580C;--color-on-accent:#000000;
 --color-background:#F8FAFC;--color-foreground:#1E293B;
 --color-card:#FFFFFF;--color-card-foreground:#1E293B;
 --color-muted:#E9EFF8;--color-muted-foreground:#475569;
 --color-border:#E2E8F0;--color-destructive:#DC2626;
 --color-on-destructive:#FFFFFF;--color-ring:#2563EB;
 --blue:#2563EB;--ink:#1E293B;--muted:#475569;--line:#E2E8F0;
 --ok:#15803D;--warn:#A14909;--bad:#DC2626;
 --panel:#FFFFFF;--panel2:#F8FAFC;
 --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.055)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Fira Sans",sans-serif;font-size:14px;line-height:1.45}
button,input{font:inherit}
button,[role=button],input[type=range]{cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid rgba(37,99,235,.3);outline-offset:2px}
svg{display:block}
.top{
 position:sticky;top:0;z-index:30;display:grid;grid-template-columns:auto auto 1fr;
 align-items:center;gap:18px;min-height:68px;padding:10px clamp(14px,3vw,36px);
 background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);
 box-shadow:0 1px 0 rgba(15,23,42,.02);backdrop-filter:blur(12px)
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{
 width:40px;height:40px;display:grid;place-items:center;flex:none;background:var(--blue);
 color:#fff;border-radius:5px;box-shadow:4px 4px 0 #BFDBFE
}
.logo svg{width:22px;height:22px}
.brand b{display:block;font-weight:700;font-size:15px;letter-spacing:.02em;white-space:nowrap}
.brand span{display:block;color:var(--muted);font:500 9px/1.4 "Fira Code",monospace;letter-spacing:.14em}
.tick{
 display:flex;align-items:center;gap:7px;padding:6px 9px;border:1px solid #BBF7D0;
 background:#F0FDF4;color:#166534;border-radius:4px;font:600 11px "Fira Code",monospace;white-space:nowrap
}
.tick svg{width:15px;height:15px}
.nav{display:flex;justify-content:flex-end;gap:3px;min-width:0;overflow-x:auto;scrollbar-width:thin}
.nav button{
 min-height:40px;display:flex;align-items:center;gap:7px;padding:8px 10px;border:1px solid transparent;
 border-radius:4px;background:transparent;color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap;
 transition:background-color .2s,color .2s,border-color .2s,transform .2s
}
.nav button svg{width:17px;height:17px;stroke-width:1.8}
.nav button:hover{background:var(--color-muted);color:var(--ink);border-color:#CBD5E1}
.nav button:active{transform:translateY(1px)}
.nav button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.wrap{width:min(100%,1440px);margin:auto;padding:20px clamp(14px,3vw,36px) 44px}
.vh{
 display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:8px 0 17px;
 border-bottom:1px solid var(--line);margin-bottom:16px
}
.eyebrow{margin:0 0 5px;color:var(--blue);font:600 10px "Fira Code",monospace;letter-spacing:.12em;text-transform:uppercase}
.vh h1{margin:0;font-size:clamp(21px,2.2vw,29px);line-height:1.12;letter-spacing:-.025em}
.vh p{margin:6px 0 0;color:var(--muted);font-size:12px}
.pill{
 display:flex;align-items:center;gap:7px;padding:8px 11px;border:1px solid #FED7AA;border-radius:4px;
 background:#FFF7ED;color:#9A3412;font:600 11px "Fira Code",monospace;white-space:nowrap
}
.pill svg{width:15px;height:15px}
.view{display:none}.view.on{display:block}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{
 position:relative;min-height:116px;padding:14px 15px;background:var(--panel);border:1px solid var(--line);
 border-radius:6px;box-shadow:0 1px 2px rgba(15,23,42,.035);overflow:hidden;
 transition:transform .22s,border-color .22s,box-shadow .22s
}
.kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--blue)}
.kpi:hover{transform:translateY(-2px);border-color:#BFDBFE;box-shadow:var(--shadow)}
.kpi .l{color:var(--muted);font-size:11px;font-weight:600}
.kpi .v{margin-top:8px;font:700 25px/1 "Fira Code",monospace;letter-spacing:-.04em}
.kpi .v small{font-size:11px;letter-spacing:0}
.kpi .d{margin-top:9px;font-size:10.5px;font-weight:600}
.up{color:#166534}.dn{color:#991B1B}
.grid{display:grid;gap:12px}.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.45fr) minmax(300px,.8fr)}
.g11{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{
 min-width:0;padding:15px;background:var(--panel);border:1px solid var(--line);
 border-radius:6px;box-shadow:0 1px 2px rgba(15,23,42,.035);
 transition:border-color .22s,box-shadow .22s
}
.card:hover{border-color:#CBD5E1;box-shadow:var(--shadow)}
.card h3{
 display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 13px;
 color:var(--ink);font-size:13px;font-weight:700;letter-spacing:.005em
}
.icon{width:18px;height:18px;flex:none;color:var(--blue);stroke-width:1.9}
.chart{height:230px}
.tag{
 display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border:1px solid currentColor;
 border-radius:3px;font:600 9.5px "Fira Code",monospace;white-space:nowrap
}
.tag svg{width:11px;height:11px}
.t-r{background:#FEF2F2;color:#B91C1C}.t-a{background:#FFF7ED;color:#9A3412}
.t-b{background:#EFF6FF;color:#1D4ED8}.t-g{background:#F0FDF4;color:#166534}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:4px}
table.data{width:100%;border-collapse:collapse;font-size:12px}
table.data th,table.data td{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{
 position:sticky;top:0;z-index:1;background:#F1F5F9;color:#334155;
 font-size:10px;font-weight:700;letter-spacing:.035em;text-transform:none
}
table.data tr:last-child td{border-bottom:0}
table.data tbody tr:hover td,table.data tr:hover td{background:#F8FAFC}
table.data th.num,table.data td.num{text-align:right}
.num,.sku,.mono,table.data td:first-child{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.num{font-weight:600}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:10px}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;display:inline-block;border-radius:2px}
.feed{display:grid;gap:7px}
.fi{
 display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);
 border-left:3px solid var(--blue);border-radius:4px;background:#FAFCFF
}
.fi.r{border-left-color:var(--bad);background:#FFFAFA}
.fi.a{border-left-color:var(--warn);background:#FFFCF7}
.fi.g{border-left-color:var(--ok);background:#FAFFFB}
.fi svg{width:17px;height:17px;flex:none;color:var(--blue)}
.fi.r svg{color:var(--bad)}.fi.a svg{color:var(--warn)}.fi.g svg{color:var(--ok)}
.fi b{display:block;font-size:11.5px}.fi small{display:block;margin-top:2px;color:var(--muted);font-size:10px}
.prod{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.pc,.cz,.so,.kc{
 background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:11px;
 transition:border-color .2s,transform .2s
}
.pc:hover,.kc:hover{border-color:#93C5FD;transform:translateY(-1px)}
.pc .top2{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pc b{font-size:12px}.pc .sku{color:var(--muted);font-size:9px}
.pc .mg{font:700 18px "Fira Code",monospace}
.pc small{display:block;margin-top:3px;color:var(--muted);font-size:10px}
.pc .bar{height:5px;margin-top:8px;overflow:hidden;background:#E2E8F0;border-radius:2px}
.pc .bar i,.track i{display:block;height:100%}
.bars{display:flex;flex-direction:column;gap:10px}
.br{display:grid;grid-template-columns:82px 1fr 52px;align-items:center;gap:10px;font-size:11px}
.br b{font-weight:600}.track{height:9px;overflow:hidden;background:#E2E8F0;border-radius:2px}
.br .val{text-align:right;font:600 11px "Fira Code",monospace}
.sim{display:grid;grid-template-columns:minmax(280px,.8fr) minmax(0,1.25fr);gap:12px}
.sim>*{min-width:0}.ctrl{display:flex;flex-direction:column;gap:10px}
.cz .lab{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;font-size:11px}
.cz .lab span{color:var(--blue);font:600 11px "Fira Code",monospace}
input[type=range]{width:100%;accent-color:var(--blue)}
.rangewrap small{display:flex;justify-content:space-between;margin-top:3px;color:var(--muted);font:9px "Fira Code",monospace}
.simout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.so .l{color:var(--muted);font-size:10px}.so .v{margin-top:4px;font:700 17px "Fira Code",monospace}
.kb{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.kc svg{width:22px;height:22px;color:var(--blue)}
.kc b{display:block;margin:7px 0 4px;font-size:12px}.kc p{margin:0;color:var(--muted);font-size:10.5px;line-height:1.55}
.kc .mt{margin-top:8px;color:#1D4ED8;font:600 9.5px "Fira Code",monospace}
@keyframes enter{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.view.on .kpi,.view.on .card{animation:enter .4s cubic-bezier(.2,.8,.2,1) both}
.view.on .kpi:nth-child(2),.view.on .card:nth-child(2){animation-delay:.05s}
.view.on .kpi:nth-child(3){animation-delay:.1s}.view.on .kpi:nth-child(4){animation-delay:.15s}
@media(max-width:1024px){
 .top{grid-template-columns:1fr auto}.nav{grid-column:1/-1;justify-content:flex-start}
 .g2{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:768px){.sim,.g11{grid-template-columns:1fr}.vh{align-items:flex-start;flex-direction:column}.pill{align-self:stretch}}
@media(max-width:560px){
 .top{padding:9px 12px;gap:9px}.brand span,.tick span{display:none}.tick{padding:6px}
 .nav button{min-width:40px;justify-content:center}.nav button .navlabel{display:none}
 .wrap{padding:15px 12px 30px}.kpis{grid-template-columns:1fr 1fr;gap:8px}
 .kpi{min-height:105px;padding:12px}.kpi .v{font-size:21px}.card{padding:12px}
 .simout{grid-template-columns:1fr}.chart{height:220px}
}
@media(max-width:375px){.kpis{grid-template-columns:1fr}.brand b{font-size:14px}}
@media(prefers-reduced-motion:reduce){
 html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
