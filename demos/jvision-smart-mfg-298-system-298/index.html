<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>稽核管理系統 · 稽核控制中心</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#334155;--accent2:#64748b;
  --bg:#0b1220;--panel:#111c2e;--panel2:#16233a;--line:#24344f;
  --ink:#e8eef7;--mut:#9fb0c8;--dim:#6b7d99;
  --ok:#34d399;--warn:#fbbf24;--bad:#f87171;--info:#60a5fa;--purple:#a78bfa;
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html,body{background:var(--bg);color:var(--ink);font-family:"Inter","Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
a{color:inherit;text-decoration:none}

.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,#0e1a2c,#0b1220);border-bottom:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.35)}
.tb-in{max-width:1360px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#475569,#334155);display:grid;place-items:center;color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.brand .logo .ms{font-size:22px}
.brand b{font-weight:800;font-size:15px;letter-spacing:.3px}
.brand span{display:block;font-size:11px;color:var(--dim);font-weight:500}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill{display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:12px;color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.who{display:flex;align-items:center;gap:8px}
.who .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#64748b,#334155);display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.who small{color:var(--dim);font-size:11px}

.nav{background:var(--panel);border-bottom:1px solid var(--line)}
.nav-in{max-width:1360px;margin:0 auto;padding:8px 12px;display:flex;gap:8px;flex-wrap:wrap}
.nav button{display:flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--mut);cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;transition:.15s}
.nav button .ms{font-size:18px}
.nav button:hover{border-color:var(--accent2);color:var(--ink)}
.nav button.on{background:linear-gradient(135deg,#3b4c66,#334155);color:#fff;border-color:#5b6f8f;box-shadow:0 4px 14px rgba(51,65,85,.5)}
.nav .idx{font-size:10px;opacity:.6;font-weight:800}

.wrap{max-width:1360px;margin:0 auto;padding:18px 16px 60px}
.screen-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.screen-head h1{font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px}
.screen-head h1 .ms{font-size:24px;color:var(--accent2)}
.screen-head p{color:var(--mut);font-size:13px;margin-top:4px}
.tag{font-size:11px;padding:4px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--mut)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;overflow:hidden}
.panel h3{font-size:13px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px;margin-bottom:12px}
.panel h3 .ms{font-size:18px;color:var(--accent2)}
.ph-sub{font-size:11px;color:var(--dim);margin-left:auto;font-weight:500}

.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(4,1fr)}
.g-2{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-7-5{grid-template-columns:1.5fr 1fr}
.g-1-2{grid-template-columns:1fr 1.6fr}
@media(max-width:820px){
  .g-kpi{grid-template-columns:1fr 1fr}
  .g-2,.g-3,.g-7-5,.g-1-2{grid-template-columns:1fr}
}
@media(max-width:480px){ .g-kpi{grid-template-columns:1fr} }

.kpi{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:13px;padding:14px 15px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-16px;top:-16px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,rgba(100,116,139,.28),transparent 70%)}
.kpi .lab{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.kpi .lab .ms{font-size:16px;color:var(--accent2)}
.kpi .val{font-size:26px;font-weight:800;margin-top:8px;letter-spacing:.5px}
.kpi .val small{font-size:13px;color:var(--dim);font-weight:600;margin-left:3px}
.kpi .delta{font-size:11px;margin-top:6px;display:inline-flex;align-items:center;gap:3px;font-weight:600}
.up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--warn)}

.chart{width:100%;height:280px;overflow:hidden}
.chart.sm{height:230px}
.chart.lg{height:340px}

.tbl-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
thead th{background:var(--panel2);color:var(--mut);text-align:left;padding:10px 12px;font-weight:600;font-size:11.5px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:10px 12px;border-bottom:1px solid rgba(36,52,79,.6);color:var(--ink)}
tbody tr:hover{background:rgba(100,116,139,.08)}
tbody tr:last-child td{border-bottom:none}
.mono{font-family:"Inter",monospace;font-size:11.5px;color:var(--mut);letter-spacing:.3px}

.bdg{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.b-hi{background:rgba(248,113,113,.16);color:#fca5a5;border:1px solid rgba(248,113,113,.3)}
.b-md{background:rgba(251,191,36,.16);color:#fcd34d;border:1px solid rgba(251,191,36,.3)}
.b-lo{background:rgba(52,211,153,.15);color:#6ee7b7;border:1px solid rgba(52,211,153,.3)}
.b-info{background:rgba(96,165,250,.15);color:#93c5fd;border:1px solid rgba(96,165,250,.3)}
.b-dim{background:rgba(107,125,153,.18);color:var(--mut);border:1px solid var(--line)}

.bar{height:7px;border-radius:6px;background:var(--panel2);overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#64748b,#94a3b8)}
.bar.ok>i{background:linear-gradient(90deg,#10b981,#34d399)}
.bar.warn>i{background:linear-gradient(90deg,#d97706,#fbbf24)}
.bar.bad>i{background:linear-gradient(90deg,#dc2626,#f87171)}

.heat{display:grid;grid-template-columns:64px repeat(5,1fr);gap:5px}
.heat .hl{font-size:11px;color:var(--dim);display:flex;align-items:center;justify-content:flex-end;padding-right:6px}
.heat .cell{aspect-ratio:1.6/1;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#0b1220}
.heat .cell small{font-size:9px;font-weight:600;opacity:.85}
.heat .cax{font-size:10px;color:var(--dim);text-align:center;padding-top:4px}

.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:820px){ .board{grid-template-columns:1fr 1fr} }
@media(max-width:480px){ .board{grid-template-columns:1fr} }
.col{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:120px}
.col .ct{font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.col .cnt{font-size:11px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--mut)}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:9px;padding:9px 10px;margin-bottom:8px}
.card .ct2{font-size:12.5px;font-weight:600;margin-bottom:5px}
.card .meta{font-size:10.5px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card.hi{border-left-color:var(--bad)}
.card.md{border-left-color:var(--warn)}
.card.lo{border-left-color:var(--ok)}

.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .it{position:relative;padding:0 0 16px 4px}
.tl .it::before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent2);border:2px solid var(--panel);box-shadow:0 0 0 2px var(--line)}
.tl .it.done::before{background:var(--ok)}
.tl .it.now::before{background:var(--warn);box-shadow:0 0 0 3px rgba(251,191,36,.25)}
.tl .tt{font-size:13px;font-weight:700}
.tl .td{font-size:11.5px;color:var(--mut);margin-top:2px}
.tl .tm{font-size:10.5px;color:var(--dim);margin-top:3px}

.doc{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:0;overflow:hidden}
.doc .dh{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:linear-gradient(180deg,#182742,#131f33)}
.doc .dh b{font-size:14px}
.doc .db{padding:14px 15px}
.field{margin-bottom:12px}
.field label{font-size:11px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.field .v{font-size:13px;margin-top:4px;color:var(--ink);line-height:1.6}
.chk{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:var(--panel)}
.chk .ms{font-size:19px;margin-top:1px}
.chk .ok{color:var(--ok)} .chk .no{color:var(--bad)} .chk .na{color:var(--dim)}
.chk .ct3{font-size:12.5px;font-weight:600}
.chk .cd{font-size:11px;color:var(--mut);margin-top:2px}

.strip{display:flex;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel2)}
.strip .s{flex:1;padding:13px 14px;border-right:1px solid var(--line);min-width:0}
.strip .s:last-child{border-right:none}
.strip .s .l{font-size:11px;color:var(--dim)}
.strip .s .n{font-size:21px;font-weight:800;margin-top:5px}
.strip .s .n small{font-size:12px;color:var(--mut);font-weight:600}
@media(max-width:640px){ .strip{flex-wrap:wrap}.strip .s{flex:1 1 50%;border-bottom:1px solid var(--line)} }

.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.list{display:flex;flex-direction:column;gap:9px}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
.row .ms{font-size:18px;color:var(--accent2)}
.row .grow{flex:1;min-width:0}
.row .t1{font-size:12.5px;font-weight:600}
.row .t2{font-size:11px;color:var(--dim)}
.row .rt{font-size:12px;font-weight:700;white-space:nowrap}

.mb{margin-bottom:14px}
.foot{text-align:center;color:var(--dim);font-size:11px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
@media(max-width:560px){ .nav button .txt{display:none} .nav button{padding:9px 11px} .pill.opt{display:none} .who small{display:none} }
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-in">
    <div class="brand">
      <div class="logo"><span class="ms">shield</span></div>
      <div><b>稽核管理系統</b><span>Internal Audit Control Center</span></div>
    </div>
    <div class="tb-right">
      <div class="pill opt"><span class="ms" style="font-size:15px;color:var(--info)">calendar_month</span>FY2026 稽核年度</div>
      <div class="pill"><span class="dot"></span>系統即時</div>
      <div class="who"><div class="av">稽</div><div><div style="font-size:12px;font-weight:600">稽核室</div><small>Chief Audit</small></div></div>
    </div>
  </div>
</div>

<div class="nav">
  <div class="nav-in" id="nav"></div>
</div>

<div class="wrap">
  <div id="app"></div>
  <div class="foot">稽核管理系統 · 純前端展示 Demo · 資料為模擬示意，非真實稽核紀錄</div>
</div>

<script>
"use strict";
var LIGHT="#e8eef7",MUT="#9fb0c8",LINE="#24344f",AX="#7688a5";
var charts=[];
function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
function mk(id){var el=document.getElementById(id);if(!el)return null;var c=echarts.init(el);charts.push(c);return c;}
function baseGrid(){return{left:8,right:14,top:24,bottom:6,containLabel:true};}
function axisStyle(){return{axisLine:{lineStyle:{color:LINE}},axisLabel:{color:AX,fontSize:11},splitLine:{lineStyle:{color:"rgba(36,52,79,.55)"}},axisTick:{show:false}};}

var MODS=[
  {icon:"shield",name:"風險評估排程",sub:"風險導向年度稽核優先排序"},
  {icon:"calendar_month",name:"稽核計畫",sub:"年度計畫制定與執行率追蹤"},
  {icon:"fact_check",name:"電子工作底稿",sub:"查核程序與底稿版本管理"},
  {icon:"warning",name:"缺失開立",sub:"查核缺失記錄與風險分級"},
  {icon:"rule",name:"改善追蹤 CAPA",sub:"矯正預防與改善及時率"},
  {icon:"gavel",name:"董事會報告",sub:"稽核成果彙整與呈報"}
];

(function buildNav(){
  var nv=document.getElementById("nav"),h="";
  for(var i=0;i<MODS.length;i++){
    h+='<button data-i="'+i+'" onclick="show('+i+')"><span class="ms">'+MODS[i].icon+'</span><span class="txt">'+MODS[i].name+'</span><span class="idx">0'+(i+1)+'</span></button>';
  }
  nv.innerHTML=h;
})();
function setActive(i){var b=document.querySelectorAll("[data-i]");for(var k=0;k<b.length;k++){b[k].classList.toggle("on",+b[k].getAttribute("data-i")===i);}}

function head(i,extra){
  var m=MODS[i];
  return '<div class="screen-head"><div><h1><span class="ms">'+m.icon+'</span>'+m.name+'</h1><p>'+m.sub+'</p></div>'+(extra||'')+'</div>';
}

/* ============ SCREEN 0 : 風險評估排程 ============ */
function s0(){
  var kpis=[
    {l:"受查單位",v:"24",u:"個",d:"全公司稽核母體",c:"flat",ic:"account_tree"},
    {l:"高風險單位",v:"6",u:"個",d:"風險分數 ≥ 80",c:"down",ic:"warning"},
    {l:"平均風險分數",v:"63.4",u:"",d:"較上年 +4.1",c:"down",ic:"insights"},
    {l:"已排入年度計畫",v:"18",u:"/24",d:"覆蓋率 75%",c:"up",ic:"task_alt"}
  ];
  var kh="";for(var i=0;i<kpis.length;i++){var k=kpis[i];
    kh+='<div class="kpi"><div class="lab"><span class="ms">'+k.ic+'</span>'+k.l+'</div><div class="val">'+k.v+'<small>'+k.u+'</small></div><div class="delta '+k.c+'"><span class="ms" style="font-size:14px">'+(k.c==="up"?"trending_up":k.c==="down"?"priority_high":"remove")+'</span>'+k.d+'</div></div>';
  }
  var rowsL=["極高","高","中","低","極低"];
  var colsL=["極低","低","中","高","極高"];
  var counts=[[0,1,2,3,3],[0,1,2,3,1],[1,2,3,1,0],[2,2,1,0,0],[1,1,0,0,0]];
  function color(r,c){var sc=(5-r)+(c+1);if(sc>=8)return "#f87171";if(sc>=6)return "#fbbf24";if(sc>=4)return "#a3e635";return "#34d399";}
  var hm='<div class="heat"><div></div>';
  for(var c=0;c<5;c++)hm+='<div class="cax">'+colsL[c]+'</div>';
  for(var r=0;r<5;r++){
    hm+='<div class="hl">'+rowsL[r]+'</div>';
    for(var c2=0;c2<5;c2++){
      var n=counts[r][c2];
      hm+='<div class="cell" style="background:'+(n>0?color(r,c2):"var(--panel2)")+';color:'+(n>0?"#0b1220":"var(--dim)")+'">'+(n>0?n:"·")+(n>0?'<small>單位</small>':'')+'</div>';
    }
  }
  hm+='</div><div style="text-align:center;font-size:10.5px;color:var(--dim);margin-top:6px">← 風險可能性 →</div>';

  var units=[
    {u:"海外採購中心",sc:92,l:"hi",trend:"↑",yr:"2024",due:"Q1"},
    {u:"應收帳款作業",sc:88,l:"hi",trend:"↑",yr:"2023",due:"Q1"},
    {u:"資訊安全管理",sc:85,l:"hi",trend:"↑",yr:"2024",due:"Q2"},
    {u:"存貨與盤點",sc:81,l:"hi",trend:"→",yr:"2025",due:"Q2"},
    {u:"工程發包合約",sc:74,l:"md",trend:"↑",yr:"2024",due:"Q3"},
    {u:"薪資與差勤",sc:58,l:"md",trend:"↓",yr:"2025",due:"Q3"},
    {u:"固定資產管理",sc:41,l:"lo",trend:"↓",yr:"2025",due:"Q4"}
  ];
  var tr="";for(var j=0;j<units.length;j++){var x=units[j];
    tr+='<tr><td style="font-weight:600">'+x.u+'</td><td><div style="display:flex;align-items:center;gap:8px"><div class="bar '+(x.l==="hi"?"bad":x.l==="md"?"warn":"ok")+'" style="flex:1"><i style="width:'+x.sc+'%"></i></div><b>'+x.sc+'</b></div></td><td>'+x.trend+'</td><td class="mono">'+x.yr+'</td><td><span class="bdg '+(x.l==="hi"?"b-hi":x.l==="md"?"b-md":"b-lo")+'">'+(x.l==="hi"?"高":x.l==="md"?"中":"低")+'風險</span></td><td class="mono">'+x.due+'</td></tr>';
  }

  return head(0,'<span class="tag">RULE-01 · 風險 ≥ 80 且涉現金流者優先</span>')+
  '<div class="grid g-kpi mb">'+kh+'</div>'+
  '<div class="grid g-2 mb">'+
    '<div class="panel"><h3><span class="ms">grid_view</span>風險矩陣熱區<span class="ph-sub">衝擊 × 可能性</span></h3>'+hm+
      '<div class="legend"><span><i style="background:#34d399"></i>低</span><span><i style="background:#a3e635"></i>中低</span><span><i style="background:#fbbf24"></i>中高</span><span><i style="background:#f87171"></i>高</span></div></div>'+
    '<div class="panel"><h3><span class="ms">radar</span>風險因子構成<span class="ph-sub">前三高風險單位</span></h3><div id="c0a" class="chart"></div></div>'+
  '</div>'+
  '<div class="panel"><h3><span class="ms">format_list_numbered</span>受查單位風險排序<span class="ph-sub">依風險分數排定稽核優先序</span></h3>'+
    '<div class="tbl-wrap"><table><thead><tr><th>受查單位</th><th>風險分數</th><th>趨勢</th><th>前次稽核</th><th>風險等級</th><th>建議排程</th></tr></thead><tbody>'+tr+'</tbody></table></div></div>';
}
function s0charts(){
  var c=mk("c0a");if(!c)return;
  c.setOption({
    color:["#f87171","#fbbf24","#60a5fa"],
    tooltip:{},
    legend:{data:["海外採購中心","應收帳款作業","資訊安全管理"],textStyle:{color:MUT,fontSize:11},top:0},
    radar:{indicator:[
      {name:"財務金額",max:100},{name:"作業複雜度",max:100},{name:"法遵風險",max:100},
      {name:"前次缺失",max:100},{name:"變動頻率",max:100},{name:"控制成熟度",max:100}

}
function s4charts(){
  var a=mk("c4a");

        markLine:{silent:true,symbol:"none",lineStyle:{color:"#fbbf24",type:"dashed"},data:[{yAxis:90,label:{formatter:"目標 90%",color:"#fbbf24",fontSize:10}}]}}

/* ============ SCREEN 5 : 董事會報告 ============ */
function s5(){
  var kpis=[
    {l:"稽核計畫執行率",v:"72",u:"%",ic:"task_alt",bar:72,c:"warn",tgt:"目標 80%"},
    {l:"缺失改善及時率",v:"88",u:"%",ic:"verified",bar:88,c:"ok",tgt:"目標 90%"},
    {l:"高風險缺失結案率",v:"67",u:"%",ic:"shield",bar:67,c:"warn",tgt:"目標 85%"},
    {l:"追蹤事項覆核完成",v:"94",u:"%",ic:"fact_check",bar:94,c:"ok",tgt:"目標 90%"}
  ];
  var kh="";for(var i=0;i<kpis.length;i++){var k=kpis[i];
    kh+='<div class="kpi"><div class="lab"><span class="ms">'+k.ic+'</span>'+k.l+'</div><div class="val">'+k.v+'<small>'+k.u+'</small></div>'+
      '<div class="bar '+(k.c==="ok"?"ok":"warn")+'" style="margin-top:9px"><i style="width:'+k.bar+'%"></i></div>'+
      '<div class="delta flat" style="margin-top:6px;color:var(--dim)">'+k.tgt+'</div></div>';
  }
  var tl='<div class="tl">'+
    '<div class="it done"><div class="tt">Q1 稽核執行完成</div><div class="td">海外採購、應收帳款 2 案完成並提報。</div><div class="tm">2026/03/31 · 已呈報董事會</div></div>'+
    '<div class="it done"><div class="tt">內控重大缺失專案改善</div><div class="td">採購授權控制缺失完成制度修訂。</div><div class="tm">2026/06/15 · 已結案</div></div>'+
    '<div class="it now"><div class="tt">Q3 資安與存貨稽核</div><div class="td">2 案進行中，資安存取控制缺失改善追蹤中。</div><div class="tm">進行中 · 預計 09/30 提報</div></div>'+
    '<div class="it"><div class="tt">董事會年度稽核總結報告</div><div class="td">彙整全年執行率、缺失改善成果與明年計畫。</div><div class="tm">預計 2026/12 · 待辦</div></div>'+
  '</div>';
  var risks=[
    {t:"5 件缺失逾期未改善",lv:"hi",note:"含採購比價、用印權限 2 件高風險"},
    {t:"計畫執行率落後目標 8%",lv:"md",note:"Q3 人力吃緊，建議調整排程"},
    {t:"海外採購中心風險升高",lv:"md",note:"風險分數 92，建議追加專案稽核"}
  ];
  var rr="";for(var j=0;j<risks.length;j++){var r=risks[j];
    rr+='<div class="row"><span class="ms" style="color:'+(r.lv==="hi"?"var(--bad)":"var(--warn)")+'">'+(r.lv==="hi"?"error":"warning")+'</span><div class="grow"><div class="t1">'+r.t+'</div><div class="t2">'+r.note+'</div></div><span class="bdg '+(r.lv==="hi"?"b-hi":"b-md")+'">'+(r.lv==="hi"?"需關注":"提醒")+'</span></div>';
  }
  return head(5,'<span class="tag">FY2026 · 董事會稽核彙報</span>')+
  '<div class="grid g-kpi mb">'+kh+'</div>'+
  '<div class="grid g-7-5 mb">'+
    '<div class="panel"><h3><span class="ms">monitoring</span>稽核成效總覽<span class="ph-sub">關鍵指標 vs 目標</span></h3><div id="c5a" class="chart lg"></div></div>'+
    '<div class="panel"><h3><span class="ms">warning</span>需董事會關注事項<span class="ph-sub">3 項</span></h3><div class="list">'+rr+
      '<div style="margin-top:10px;padding:11px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;font-size:11.5px;color:var(--mut);line-height:1.7"><b style="color:var(--ink)">稽核室結論：</b>年度稽核大致依計畫推進，惟高風險缺失結案率偏低，建議董事會督促相關單位限期完成改善，並就海外採購中心追加專案稽核。</div>'+
    '</div></div>'+
  '</div>'+
  '<div class="panel"><h3><span class="ms">timeline</span>年度稽核里程碑<span class="ph-sub">董事會呈報時序</span></h3>'+tl+'</div>';
}
function s5charts(){
  var a=mk("c5a");if(!a)return;
  a.setOption({
    tooltip:{trigger:"axis"},
    legend:{data:["實際","目標"],textStyle:{color:MUT,fontSize:11},top:0},
    radar:{indicator:[
      {name:"計畫執行率",max:100},{name:"改善及時率",max:100},{name:"高風險結案率",max:100},
      {name:"覆核完成率",max:100},{name:"底稿定稿率",max:100},{name:"追蹤達成率",max:100}
    ],axisName:{color:AX,fontSize:11},splitLine:{lineStyle:{color:LINE}},
      splitArea:{areaStyle:{color:["rgba(100,116,139,.04)","rgba(100,116,139,.1)"]}},axisLine:{lineStyle:{color:LINE}},center:["50%","55%"],radius:"66%"},
    series:[{type:"radar",data:[
      {value:[72,88,67,94,64,90],name:"實際",itemStyle:{color:"#60a5fa"},areaStyle:{opacity:.22}},
      {value:[80,90,85,90,85,90],name:"目標",itemStyle:{color:"#fbbf24"},lineStyle:{type:"dashed"},areaStyle:{opacity:0}}
    ]}]
  });
}

var RENDER=[s0,s1,s2,s3,s4,s5];
var CHARTS=[s0charts,s1charts,s2charts,s3charts,s4charts,s5charts];
function show(i){
  disposeCharts();
  var app=document.getElementById("app");
  app.innerHTML=RENDER[i]();
  setActive(i);
  void app.offsetHeight;
  CHARTS[i]();
}
window.addEventListener("resize",function(){for(var i=0;i<charts.length;i++){try{charts[i].resize();}catch(e){}}});

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
