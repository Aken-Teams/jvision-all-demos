<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>稽核管理系統 · 稽核控制中心</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;

  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;

  --accent:#0D9488;
  --accent2:#0F766E;
  --bg:#F0FDFA;
  --panel:#FFFFFF;
  --panel2:#E8F1F4;
  --mut:#475569;
  --dim:#526273;
  --ok:#047857;
  --warn:#B45309;
  --bad:#B91C1C;
  --info:#0369A1;
  --purple:#6D28D9;

  --shadow-sm:4px 4px 0 #134E4A;
  --shadow-lg:8px 8px 0 #134E4A;
}

*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html{background:var(--bg);color:var(--ink);scroll-behavior:auto}
body{
  min-height:100vh;
  overflow-x:hidden;
  background-color:var(--bg);
  background-image:
    linear-gradient(rgba(13,148,136,.09) 1px,transparent 1px),
    linear-gradient(90deg,rgba(13,148,136,.09) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Crimson Pro","Noto Sans TC",Georgia,serif;
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,a{font:inherit}
a{color:inherit;text-decoration:none}
button,[onclick]{cursor:pointer}
.ms{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  font-size:1.2em;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring)!important;
  outline-offset:3px;
  box-shadow:0 0 0 2px #fff!important;
}
::selection{background:var(--color-secondary);color:#0F172A}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  background:#FFFFFF;
  border-bottom:3px solid var(--ink);
}
.tb-in{
  max-width:1440px;
  min-height:72px;
  margin:0 auto;
  padding:10px 20px;
  display:flex;
  align-items:center;
  gap:18px;
  flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{
  width:46px;
  height:46px;
  display:grid;
  flex:0 0 46px;
  place-items:center;
  background:var(--color-primary);
  color:#001F1C;
  border:3px solid var(--ink);
  border-radius:0;
  box-shadow:4px 4px 0 var(--color-accent);
}
.brand .logo .ms{font-size:27px;font-variation-settings:"FILL" 1}
.brand b{
  display:block;
  font-family:"Cinzel","Noto Sans TC",serif;
  font-size:17px;
  font-weight:700;
  letter-spacing:.04em;
}
.brand span{display:block;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.06em}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill{
  min-height:38px;
  padding:7px 11px;
  display:flex;
  align-items:center;
  gap:7px;
  background:var(--color-muted);
  color:#334155;
  border:2px solid var(--ink);
  border-radius:0;
  font-family:"Noto Sans TC",sans-serif;
  font-size:12px;
  font-weight:700;
}
.dot{
  width:10px;
  height:10px;
  background:var(--ok);
  border:2px solid #064E3B;
  border-radius:50%;
}
.who{display:flex;align-items:center;gap:9px}
.who .av{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  background:var(--color-accent);
  color:#1C1000;
  border:2px solid var(--ink);
  border-radius:0;
  font-family:"Noto Sans TC",sans-serif;
  font-size:13px;
  font-weight:900;
}
.who small{color:var(--muted);font-size:11px;font-weight:600}

.nav{
  position:sticky;
  top:72px;
  z-index:40;
  background:var(--color-secondary);
  border-bottom:3px solid var(--ink);
}
.nav-in{
  max-width:1440px;
  margin:0 auto;
  padding:0 20px;
  display:flex;
  align-items:stretch;
  gap:0;
  overflow-x:auto;
  scrollbar-width:thin;
}
.nav button{
  min-height:52px;
  padding:10px 16px;
  display:flex;
  flex:1 0 auto;
  align-items:center;
  justify-content:center;
  gap:8px;
  background:transparent;
  color:#103E3B;
  border:0;
  border-left:2px solid var(--ink);
  border-radius:0;
  font-family:"Noto Sans TC",sans-serif;
  font-size:13px;
  font-weight:800;
  transition:background-color .18s ease,color .18s ease,transform .18s ease;
}
.nav button:last-child{border-right:2px solid var(--ink)}
.nav button:hover{background:#99F6E4;color:#042F2E}
.nav button.on{
  background:var(--ink);
  color:#FFFFFF;
  box-shadow:inset 0 -6px 0 var(--color-accent);
}
.nav button .ms{font-size:20px}
.nav .idx{
  padding:1px 4px;
  background:#FFFFFF;
  color:#134E4A;
  border:1px solid currentColor;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:10px;
  font-weight:900;
}
.nav button.on .idx{background:var(--color-accent);color:#1F1300}

.wrap{max-width:1440px;margin:0 auto;padding:30px 20px 70px}
.screen-head{
  position:relative;
  margin:0 8px 26px 0;
  padding:22px 24px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:18px;
  flex-wrap:wrap;
  background:var(--color-primary);
  color:#062D2A;
  border:3px solid var(--ink);
  box-shadow:var(--shadow-lg);
}
.screen-head::before{
  content:"AUDIT / CONTROL";
  position:absolute;
  top:-13px;
  right:18px;
  padding:3px 8px;
  background:var(--color-accent);
  color:#1F1300;
  border:2px solid var(--ink);
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:10px;
  font-weight:900;
  letter-spacing:.12em;
}
.screen-head h1{
  display:flex;
  align-items:center;
  gap:11px;
  font-family:"Cinzel","Noto Sans TC",serif;
  font-size:clamp(24px,3vw,38px);
  font-weight:700;
  line-height:1.08;
  letter-spacing:-.025em;
}
.screen-head h1 .ms{font-size:32px;color:#042F2E}
.screen-head p{margin-top:7px;color:#123D3A;font-family:"Noto Sans TC",sans-serif;font-size:13px;font-weight:700}
.tag{
  max-width:100%;
  padding:7px 10px;
  background:#FFFFFF;
  color:#334155;
  border:2px solid var(--ink);
  border-radius:0;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:11px;
  font-weight:800;
  overflow-wrap:anywhere;
}

.grid{display:grid;gap:18px}
.g-kpi{grid-template-columns:repeat(4,1fr)}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-7-5{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.g-1-2{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.mb{margin-bottom:22px}

.panel{
  position:relative;
  padding:19px;
  overflow:hidden;
  background:var(--color-card);
  color:var(--color-card-foreground);
  border:3px solid var(--ink);
  border-radius:0;
  box-shadow:var(--shadow-sm);
}
.panel:nth-child(even){transform:translateY(5px)}
.panel h3{
  min-height:34px;
  margin:-19px -19px 17px;
  padding:9px 12px;
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--color-muted);
  color:#123F3B;
  border-bottom:3px solid var(--ink);
  font-family:"Noto Sans TC",sans-serif;
  font-size:13px;
  font-weight:900;
  letter-spacing:.02em;
}
.panel h3 .ms{font-size:20px;color:var(--color-primary)}
.ph-sub{margin-left:auto;color:#475569;font-size:11px;font-weight:700;text-align:right}

.kpi{
  position:relative;
  min-height:142px;
  padding:16px 17px;
  overflow:hidden;
  background:#FFFFFF;
  border:3px solid var(--ink);
  border-radius:0;
  box-shadow:5px 5px 0 var(--color-secondary);
}
.kpi:nth-child(2n){background:var(--color-muted);box-shadow:5px 5px 0 var(--color-accent)}
.kpi::after{
  content:"";
  position:absolute;
  right:-22px;
  bottom:-28px;
  width:76px;
  height:76px;
  background:transparent;
  border:13px solid var(--color-secondary);
  border-radius:50%;
  opacity:.45;
}
.kpi .lab{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  gap:7px;
  color:#475569;
  font-family:"Noto Sans TC",sans-serif;
  font-size:12px;
  font-weight:800;
}
.kpi .lab .ms{font-size:18px;color:var(--color-primary)}
.kpi .val{
  position:relative;
  z-index:1;
  margin-top:8px;
  color:#123F3B;
  font-family:"Cinzel","Crimson Pro",serif;
  font-size:clamp(30px,3vw,42px);
  font-variant-numeric:tabular-nums lining-nums;
  font-weight:700;
  letter-spacing:-.04em;
  line-height:1;
}
.kpi .val small{margin-left:4px;color:#475569;font-family:"Noto Sans TC",sans-serif;font-size:12px;font-weight:700;letter-spacing:0}
.kpi .delta{position:relative;z-index:1;margin-top:10px;display:inline-flex;align-items:center;gap:4px;font-family:"Noto Sans TC",sans-serif;font-size:11px;font-weight:800}
.up{color:#047857}.down{color:#B91C1C}.flat{color:#92400E}

.chart{width:100%;height:280px;overflow:hidden}
.chart.sm{height:230px}
.chart.lg{height:340px}

.tbl-wrap{
  width:100%;
  overflow-x:auto;
  background:#FFFFFF;
  border:3px solid var(--ink);
  border-radius:0;
  scrollbar-color:var(--color-primary) var(--color-muted);
}
table{width:100%;min-width:520px;border-collapse:collapse;font-family:"Noto Sans TC",sans-serif;font-size:12.5px;font-variant-numeric:tabular-nums lining-nums}
thead th{
  padding:11px 12px;
  background:var(--ink);
  color:#FFFFFF;
  border-right:1px solid #5EEAD4;
  border-bottom:3px solid var(--color-accent);
  font-size:11.5px;
  font-weight:900;
  letter-spacing:.03em;
  text-align:left;
  white-space:nowrap;
}
thead th:last-child{border-right:0}
tbody td{
  padding:11px 12px;
  color:#1E4542;
  border-right:1px solid #99F6E4;
  border-bottom:1px solid var(--line);
  vertical-align:middle;
}
tbody td:last-child{border-right:0}
tbody tr:nth-child(even){background:#F0FDFA}
tbody tr:hover{background:#CCFBF1}
tbody tr:last-child td{border-bottom:0}
td[style*="text-align:center"],th[style*="text-align:center"]{text-align:center!important}
.mono{
  color:#334155;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:11.5px;
  font-variant-numeric:tabular-nums;
  letter-spacing:.02em;
  white-space:nowrap;
}

.bdg{
  display:inline-flex;
  min-height:25px;
  align-items:center;
  gap:5px;
  padding:3px 8px;
  border:2px solid currentColor;
  border-radius:0;
  font-family:"Noto Sans TC",sans-serif;
  font-size:10.5px;
  font-weight:900;
  line-height:1.2;
  white-space:nowrap;
}
.bdg::before{content:"■";font-size:7px}
.b-hi{background:#FEE2E2;color:#991B1B}
.b-md{background:#FEF3C7;color:#92400E}
.b-lo{background:#D1FAE5;color:#065F46}
.b-info{background:#DBEAFE;color:#1E40AF}
.b-dim{background:#E2E8F0;color:#334155}

.bar{
  height:10px;
  min-width:70px;
  overflow:hidden;
  background:#CBD5E1;
  border:1px solid #475569;
  border-radius:0;
}
.bar>i{display:block;height:100%;background:var(--color-primary);border-radius:0}
.bar.ok>i{background:#047857}
.bar.warn>i{background:#D97706}
.bar.bad>i{background:#DC2626}

.heat{display:grid;grid-template-columns:64px repeat(5,minmax(38px,1fr));gap:4px}
.heat .hl{padding-right:6px;display:flex;align-items:center;justify-content:flex-end;color:#475569;font-family:"Noto Sans TC",sans-serif;font-size:11px;font-weight:700}
.heat .cell{
  min-height:42px;
  aspect-ratio:1.6/1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border:2px solid var(--ink);
  border-radius:0;
  color:#0F172A;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:13px;
  font-weight:900;
}
.heat .cell small{font-family:"Noto Sans TC",sans-serif;font-size:9px;font-weight:800;opacity:.9}
.heat .cax{padding-top:4px;color:#475569;font-family:"Noto Sans TC",sans-serif;font-size:10px;font-weight:700;text-align:center}
.legend{margin-top:12px;display:flex;gap:14px;flex-wrap:wrap;color:#475569;font-family:"Noto Sans TC",sans-serif;font-size:11px;font-weight:700}
.legend i{display:inline-block;width:12px;height:12px;margin-right:5px;border:1px solid var(--ink);border-radius:0;vertical-align:-2px}

.strip{
  display:flex;
  overflow:hidden;
  background:#FFFFFF;
  border:3px solid var(--ink);
  border-radius:0;
  box-shadow:6px 6px 0 var(--color-secondary);
}
.strip .s{position:relative;flex:1;padding:15px 16px;border-right:3px solid var(--ink)}
.strip .s:nth-child(even){background:var(--color-muted)}
.strip .s:last-child{border-right:0}
.strip .s .l{color:#475569;font-family:"Noto Sans TC",sans-serif;font-size:11px;font-weight:800}
.strip .s .n{margin-top:5px;color:#123F3B;font-family:"Cinzel","Crimson Pro",serif;font-size:29px;font-variant-numeric:tabular-nums;font-weight:700;line-height:1}
.strip .s .n small{color:#475569;font-family:"Noto Sans TC",sans-serif;font-size:11px;font-weight:700}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.col{min-height:160px;padding:10px;background:var(--color-muted);border:2px solid var(--ink);border-radius:0}
.col .ct{margin:-10px -10px 10px;padding:9px 10px;display:flex;align-items:center;justify-content:space-between;background:var(--color-secondary);color:#123F3B;border-bottom:2px solid var(--ink);font-family:"Noto Sans TC",sans-serif;font-size:12px;font-weight:900}
.col .cnt{padding:1px 7px;background:#FFFFFF;color:#334155;border:2px solid var(--ink);border-radius:0;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10px}
.card{margin-bottom:9px;padding:10px;background:#FFFFFF;border:2px solid var(--ink);border-left:7px solid var(--color-primary);border-radius:0;box-shadow:3px 3px 0 #94A3B8}
.card .ct2{margin-bottom:5px;color:#123F3B;font-family:"Noto Sans TC",sans-serif;font-size:12px;font-weight:900}
.card .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:#475569;font-family:"Noto Sans TC",sans-serif;font-size:10.5px;font-weight:600}
.card.hi{border-left-color:#DC2626}.card.md{border-left-color:#D97706}.card.lo{border-left-color:#047857}

.doc{overflow:hidden;background:#FFFFFF;border:3px solid var(--ink);border-radius:0;box-shadow:var(--shadow-sm)}
.doc .dh{padding:13px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--color-secondary);color:#123F3B;border-bottom:3px solid var(--ink)}
.doc .dh b{font-family:"Cinzel","Noto Sans TC",serif;font-size:15px;font-weight:700}
.doc .db{padding:17px}
.field{margin-bottom:15px}
.field label{color:#475569;font-family:"Noto Sans TC",sans-serif;font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
.field .v{margin-top:5px;color:#1E4542;font-family:"Noto Sans TC",sans-serif;font-size:13px;line-height:1.75}
.chk{margin-bottom:8px;padding:10px 11px;display:flex;align-items:flex-start;gap:9px;background:#F8FAFC;border:2px solid var(--ink);border-radius:0}
.chk .ms{margin-top:1px;font-size:20px}
.chk .ok{color:#047857}.chk .no{color:#B91C1C}.chk .na{color:#475569}
.chk .ct3{color:#123F3B;font-family:"Noto Sans TC",sans-serif;font-size:12.5px;font-weight:900}
.chk .cd{margin-top:3px;color:#475569;font-family:"Noto Sans TC",sans-serif;font-size:11px;line-height:1.55}

.list{display:flex;flex-direction:column;gap:9px}
.row{min-height:54px;padding:10px 12px;display:flex;align-items:center;gap:10px;background:#F8FAFC;border:2px solid var(--ink);border-radius:0}
.row .ms{flex:0 0 auto;font-size:20px;color:var(--color-primary)}
.row .grow{flex:1;min-width:0}
.row .t1{color:#123F3B;font-family:"Noto Sans TC",sans-serif;font-size:12.5px;font-weight:900}
.row .t2{margin-top:2px;color:#475569;font-family:"Noto Sans TC",sans-serif;font-size:11px;line-height:1.5}
.row .rt{color:#123F3B;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;font-variant-numeric:tabular-nums;font-weight:900;white-space:nowrap}

.tl{position:relative;padding-left:27px}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:3px;background:var(--ink)}
.tl .it{position:relative;padding:0 0 19px 6px}
.tl .it::before{content:"";position:absolute;left:-26px;top:2px;width:15px;height:15px;background:#FFFFFF;border:3px solid var(--ink);border-radius:0}
.tl .it.done::before{background:#047857}
.tl .it.now::before{background:var(--color-accent);box-shadow:3px 3px 0 var(--ink)}
.tl .tt{color:#123F3B;font-family:"Noto Sans TC",sans-serif;font-size:13px;font-weight:900}
.tl .td{margin-top:3px;color:#475569;font-family:"Noto Sans TC",sans-serif;font-size:11.5px}
.tl .tm{margin-top:4px;color:#475569;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10.5px;font-weight:700}

.foot{margin-top:36px;padding:16px 10px 0;color:#475569;border-top:3px solid var(--ink);font-family:"Noto Sans TC",sans-serif;font-size:11px;font-weight:600;text-align:center}

#app>.screen-head,#app>.grid,#app>.strip,#app>.panel{
  animation:audit-in .4s cubic-bezier(.34,1.56,.64,1) both;
}
#app>.grid{animation-delay:.06s}
#app>.strip{animation-delay:.06s}
#app>.panel{animation-delay:.12s}
.grid>.kpi,.grid>.panel{animation:audit-item .4s cubic-bezier(.34,1.56,.64,1) both}
.grid>:nth-child(2){animation-delay:.06s}
.grid>:nth-child(3){animation-delay:.12s}
.grid>:nth-child(4){animation-delay:.18s}
@keyframes audit-in{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes audit-item{from{opacity:0;transform:translateY(16px) scale(.92)}to{opacity:1;transform:translateY(0) scale(1)}}

@media(max-width:1024px){
  .tb-in,.nav-in,.wrap{max-width:100%}
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nav button{padding-inline:12px}
}
@media(max-width:820px){
  .nav{top:69px}
  .nav-in{padding:0}
  .g-2,.g-3,.g-7-5,.g-1-2{grid-template-columns:1fr}
  .panel:nth-child(even){transform:none}
  .screen-head{align-items:flex-start}
}
@media(max-width:640px){
  .tb-in{min-height:68px;padding:9px 12px;gap:10px}
  .brand .logo{width:40px;height:40px;flex-basis:40px}

function show(i){
  disposeCharts();
  var app=document.getElementById("app");
  app.innerHTML=RENDER[i]();
  setActive(i);
  void app.offsetHeight;
  CHARTS[i]();
}
window.addEventListener("resize",function(){for(var i=0;i<charts.length;i++){try{charts[i].resize();}catch(e){}}});

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
