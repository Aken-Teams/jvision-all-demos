<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>庫存補貨指揮艙 · Replenishment Ops</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--accent:#0284c7;--accent2:#06b6d4;--ink:#0c1a24;--bg:#eff4f8;--card:#fff;--line:#dde7ef;--mut:#5b7183;--ok:#059669;--warn:#f59e0b;--bad:#e11d48}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.shell{display:grid;grid-template-columns:228px 1fr;min-height:100vh}
.shell>*{min-width:0}
.side{background:var(--card);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.side .bd{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.side .lg{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#fff;flex:none;box-shadow:0 8px 18px rgba(2,132,199,.35)}
.side .bd b{font-size:15px;font-weight:800;font-family:"Noto Sans TC";display:block}
.side .bd span{font-size:10px;color:var(--accent);letter-spacing:1.3px}
.side button{display:flex;align-items:center;gap:11px;background:transparent;border:0;color:#4a5f70;font:inherit;font-weight:600;font-size:13.5px;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left;width:100%;font-family:"Noto Sans TC"}
.side button .material-symbols-outlined{font-size:20px;color:#94a9ba}
.side button:hover{background:#f1f6fa}
.side button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.side button.on .material-symbols-outlined{color:#fff}
.side .foot{margin-top:auto;padding:12px 10px 2px;font-size:11px;color:var(--mut);border-top:1px solid var(--line)}
.main{padding:22px 24px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.live{background:#e0f2fe;color:#0369a1;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:p 1.4s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.35}
.up{color:var(--ok)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.3fr .9fr}
.g11{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#d1fae5;color:#047857}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#ffe4e6;color:#be123c}.t-info{background:#e0f2fe;color:#0369a1}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#f6fafc}
.rep{display:flex;flex-direction:column;gap:9px}
.ri{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:11px;padding:10px 13px;display:flex;align-items:center;gap:12px}
.ri.w{border-left-color:var(--warn)}
.ri .mid{flex:1;min-width:0}
.ri .mid b{font-size:13px;font-family:"Noto Sans TC"}
.ri .mid small{color:var(--mut);font-size:11.5px;display:block}
.ri .qty{text-align:right;flex:none}
.ri .qty b{font-family:Inter;font-size:15px;color:var(--accent)}
.ri .qty small{display:block;font-size:10px;color:var(--mut)}
.heat{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.hx{aspect-ratio:1;border-radius:4px;display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff}
.chart{height:230px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.two>*{min-width:0}
.bar{height:8px;background:#eef4f8;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.scan{display:flex;flex-direction:column;gap:8px}
.sc{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12.5px}
.sc .material-symbols-outlined{color:var(--accent)}
.sc code{background:#f1f6fa;padding:2px 7px;border-radius:5px;font-size:11.5px;color:var(--accent);font-weight:700}
.sc .tm{margin-left:auto;color:var(--mut);font-size:11px}
.scroll{overflow-x:auto}
.hamb{display:none}
@media(max-width:860px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;overflow:visible}.side .bd{width:100%;padding-bottom:8px}.side button{width:auto;flex:none}.side .foot{display:none}.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g11,.two{grid-template-columns:1fr}.heat{grid-template-columns:repeat(8,1fr)}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="bd"><div class="lg">補</div><div><b>庫存補貨指揮艙</b><span>REPLENISHMENT OPS</span></div></div>
    <div id="nav"></div>
    <div class="foot">SKU 1,284 · 儲位 860<br/>待補 26 · 缺貨 3.8%</div>
  </aside>
  <main class="main">
    <div class="vh"><div><h2 id="vt">補貨指揮艙</h2><p id="vd"></p></div><div class="live"><i></i>即時同步中</div></div>
    <div id="view"></div>
  </main>
</div>
<script>
const MOD=[["補貨指揮艙","dashboard","補貨指揮艙","缺貨、補貨與週轉全局戰情，掌握補貨節奏"],
["入庫上架","input","入庫上架","收貨驗收、儲位指派與上架建帳"],
["揀貨出貨","local_shipping","揀貨出貨","波次揀貨、覆核打包與出貨"],
["儲位管理","grid_on","儲位管理","儲位佔用熱區與庫存明細"],
["庫存盤點","checklist","庫存盤點","循環盤點、差異調整與帳實對帳"],
["拉動補料","autorenew","拉動補料","低於安全庫存自動觸發補貨"],
["條碼作業","qr_code_scanner","條碼作業","收貨、揀貨與盤點的條碼掃描"]];
const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span>'+m[0];b.onclick=()=>show(i);nav.appendChild(b);});

const REP=[["SKU-A102","有機燕麥棒 24入","現量 8 / 安全 40","+320","bad"],["SKU-C218","冷萃咖啡 330ml","現量 52 / 安全 120","+400","bad"],["SKU-B075","蔓越莓乾 200g","現量 34 / 安全 60","+180","w"],["SKU-D330","堅果綜合包","現量 41 / 安全 80","+240","w"],["SKU-E441","氣泡水 6入組","現量 96 / 安全 150","+300","w"]];
const HOT=[["冷萃咖啡 330ml",92],["有機燕麥棒",81],["氣泡水 6入",73],["堅果綜合包",64],["蔓越莓乾",52]];
const INB=[["ASN-5521","O美食品","冷萃咖啡×400","建議 B-02-05","待上架","t-warn"],["ASN-5520","綠野農產","燕麥棒×320","建議 A-01-12","上架中","t-info"],["ASN-5519","堅果工坊","綜合堅果×240","已上架 C-03-08","完成","t-ok"],["ASN-5518","泡泡飲料","氣泡水×300","建議 D-04-02","待上架","t-warn"]];
const PICK=[["WAVE-208","線上訂單 32 筆","揀 86 項","王倉管","揀貨中",68,"t-info"],["WAVE-207","門市補貨 8 店","揀 140 項","李倉管","覆核中",90,"t-warn"],["WAVE-206","急單 5 筆","揀 12 項","陳倉管","已出貨",100,"t-ok"]];
const STOCK=[["A-01-12","燕麥棒 24入","8","40","週轉 12 天","t-bad"],["B-02-05","冷萃咖啡","52","120","週轉 5 天","t-bad"],["C-03-08","綜合堅果","41","80","週轉 9 天","t-warn"],["D-04-02","氣泡水 6入","96","150","週轉 7 天","t-warn"],["E-05-01","蔓越莓乾","34","60","週轉 15 天","t-warn"]];
const COUNT=[["CNT-330","A 區 1-3 排","120 儲位","+2 / -1","已調整","t-ok"],["CNT-329","B 區 冷藏","64 儲位","0","無差異","t-ok"],["CNT-328","C 區 乾貨","88 儲位","-3","調查中","t-warn"]];
const SCAN=[["收貨","ASN-5521","冷萃咖啡×400","10:41"],["上架","B-02-05","冷萃咖啡×400","10:44"],["揀貨","WAVE-208","燕麥棒×24","10:47"],["盤點","A-01-12","實盤 8","10:50"],["出貨","WAVE-206","急單×5","10:52"]];

const SCREENS=[
()=>`<div class="kpis">
 <div class="kpi"><span class="material-symbols-outlined ic">inventory</span><div class="l">缺貨率</div><div class="v">3.8<small style="font-size:12px">%</small></div><div class="d up">▼ 較 11%</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">bolt</span><div class="l">補貨反應</div><div class="v">4.2<small style="font-size:12px"> h</small></div><div class="d up">▼ 較 26h</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">cached</span><div class="l">平均週轉</div><div class="v">8.4<small style="font-size:12px"> 天</small></div><div class="d up">▲ 熱銷掌握 92%</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">notification_important</span><div class="l">待補 SKU</div><div class="v" style="color:var(--bad)">26</div><div class="d" style="color:var(--mut)">3 缺貨 · 23 預警</div></div>
</div>
<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">production_quantity_limits</span>待補貨清單（AI 建議補量）</h3><div class="rep">${REP.map(r=>`<div class="ri ${r[4]=='w'?'w':''}"><div class="mid"><b>${r[0]} · ${r[1]}</b><small>${r[2]}</small></div><div class="qty"><b>${r[3]}</b><small>建議補量</small></div></div>`).join('')}</div></div>
 <div class="card"><h3><span class="material-symbols-outlined">local_fire_department</span>熱銷 TOP 5（近 7 日）</h3>${HOT.map(h=>`<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px"><b style="font-family:Noto Sans TC">${h[0]}</b><span style="color:var(--accent);font-weight:700">${h[1]}</span></div><div class="bar"><i style="width:${h[1]}%"></i></div></div>`).join('')}<h3 style="margin-top:16px"><span class="material-symbols-outlined">grid_view</span>倉庫佔用熱區</h3><div class="heat" id="heat"></div></div>
</div>`,
()=>`<div class="card"><h3><span class="material-symbols-outlined">input</span>入庫上架任務 <span class="tag t-warn" style="margin-left:auto">待上架 2</span></h3><div class="scroll"><table class="data"><tr><th>ASN</th><th>供應商</th><th>品項</th><th>建議儲位</th><th>狀態</th></tr>${INB.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td><span class="tag ${r[5]}">${r[4]}</span></td></tr>`).join('')}</table></div></div>`,
()=>`<div class="card"><h3><span class="material-symbols-outlined">local_shipping</span>波次揀貨出貨</h3><div class="scroll"><table class="data"><tr><th>波次</th><th>來源</th><th>項數</th><th>揀貨員</th><th>進度</th><th>狀態</th></tr>${PICK.map(p=>`<tr><td><b>${p[0]}</b></td><td>${p[1]}</td><td>${p[2]}</td><td>${p[3]}</td><td style="min-width:120px"><div class="bar"><i style="width:${p[5]}%"></i></div></td><td><span class="tag ${p[6]}">${p[4]}</span></td></tr>`).join('')}</table></div></div>`,
()=>`<div class="g11 grid"><div class="card"><h3><span class="material-symbols-outlined">grid_on</span>儲位佔用熱區</h3><div class="heat" id="heat2"></div><p style="font-size:11.5px;color:var(--mut);margin:12px 0 0">顏色越深＝佔用率越高；紅色表示需調撥或補貨。</p></div><div class="card"><h3><span class="material-symbols-outlined">inventory_2</span>庫存明細</h3><div class="scroll"><table class="data"><tr><th>儲位</th><th>品名</th><th>現量</th><th>安全量</th><th>週轉</th></tr>${STOCK.map(s=>`<tr><td><b>${s[0]}</b></td><td>${s[1]}</td><td>${s[2]}</td><td>${s[3]}</td><td><span class="tag ${s[5]}">${s[4]}</span></td></tr>`).join('')}</table></div></div></div>`,
()=>`<div class="grid g2"><div class="card"><h3><span class="material-symbols-outlined">checklist</span>循環盤點任務</h3><div class="scroll"><table class="data"><tr><th>單號</th><th>範圍</th><th>儲位數</th><th>差異</th><th>狀態</th></tr>${COUNT.map(c=>`<tr><td><b>${c[0]}</b></td><td>${c[1]}</td><td>${c[2]}</td><td>${c[3]}</td><td><span class="tag ${c[5]}">${c[4]}</span></td></tr>`).join('')}</table></div></div><div class="card"><h3><span class="material-symbols-outlined">donut_large</span>盤點差異分佈</h3><div class="chart" style="height:250px" id="c_ct"></div></div></div>`,
()=>`<div class="card"><h3><span class="material-symbols-outlined">autorenew</span>拉動補貨觸發（低於安全庫存自動生成）</h3><div class="scroll"><table class="data"><tr><th>SKU</th><th>品名</th><th>現量</th><th>安全量</th><th>建議補量</th><th>供應商</th><th>狀態</th></tr>${[["SKU-A102","有機燕麥棒",8,40,320,"綠野農產","已送出"],["SKU-C218","冷萃咖啡",52,120,400,"O美食品","已送出"],["SKU-B075","蔓越莓乾",34,60,180,"堅果工坊","待核准"],["SKU-D330","綜合堅果",41,80,240,"堅果工坊","待核准"],["SKU-E441","氣泡水 6入",96,150,300,"泡泡飲料","草稿"]].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td style="color:var(--bad);font-weight:700">${r[2]}</td><td>${r[3]}</td><td style="color:var(--accent);font-weight:800">+${r[4]}</td><td>${r[5]}</td><td><span class="tag ${r[6]=='已送出'?'t-ok':r[6]=='待核准'?'t-warn':'t-info'}">${r[6]}</span></td></tr>`).join('')}</table></div></div>`,
()=>`<div class="card"><h3><span class="material-symbols-outlined">qr_code_scanner</span>條碼作業即時軌跡</h3><div class="scan">${SCAN.map(s=>`<div class="sc"><span class="material-symbols-outlined">barcode_reader</span><b style="font-family:Noto Sans TC">${s[0]}</b><code>${s[1]}</code><span>${s[2]}</span><span class="tm">${s[3]}</span></div>`).join('')}</div></div>`
];
function heatFill(id){const el=document.getElementById(id);if(!el)return;let h='';for(let i=0;i<60;i++){const v=Math.round(30+((i*37)%70));const c=v>85?'#be123c':v>65?'#f59e0b':v>45?'#0284c7':'#7dd3fc';h+=`<div class="hx" style="background:${c}">${v}</div>`;}el.innerHTML=h;}
function draw(i){
 if(i==0)heatFill('heat');
 if(i==3)heatFill('heat2');
 if(i==4){const c=echarts.init(document.getElementById('c_ct'));c.setOption({tooltip:{trigger:'item'},legend:{bottom:0,textStyle:{fontSize:11}},series:[{type:'pie',radius:['45%','72%'],center:['50%','44%'],label:{fontSize:11},data:[{value:82,name:'無差異',itemStyle:{color:'#059669'}},{value:12,name:'盤盈',itemStyle:{color:'#0284c7'}},{value:6,name:'盤虧',itemStyle:{color:'#e11d48'}}]}]});}
}
function show(i){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));vt.textContent=MOD[i][2];vd.textContent=MOD[i][3];view.innerHTML=SCREENS[i]();draw(i);}
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
<script src="/shared/jv-agent-bridge.js" defer></script>
</body>
</html>
