<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>商品庫存與補貨建議台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;500;600;700&family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000000;
  --color-secondary:#10B981;
  --color-on-secondary:#0F172A;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#ECFDF5;
  --color-foreground:#064E3B;
  --color-card:#FFFFFF;
  --color-card-foreground:#064E3B;
  --color-muted:#E8F1F3;
  --color-muted-foreground:#475569;
  --color-border:#A7F3D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#059669;
  --blue:#059669;
  --ink:#064E3B;
  --muted:#475569;
  --line:#A7F3D0;
  --ok:#047857;
  --warn:#B45309;
  --bad:#B91C1C;
  --shadow:0 12px 32px rgba(6,78,59,.09);
  --shadow-lg:0 18px 50px rgba(6,78,59,.14);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-width:320px;
  background:
    radial-gradient(circle at 92% 5%,rgba(16,185,129,.18),transparent 28rem),
    linear-gradient(135deg,rgba(255,255,255,.7),transparent 42%),
    var(--color-background);
  color:var(--ink);
  font-family:"Nunito Sans",sans-serif;
  line-height:1.5;
}
button,a{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
svg{display:block}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{
  position:sticky;top:0;height:100vh;z-index:20;
  display:flex;flex-direction:column;gap:6px;
  padding:20px 14px;
  overflow:auto;
  background:rgba(255,255,255,.94);
  border-right:1px solid var(--line);
  box-shadow:8px 0 28px rgba(6,78,59,.06);
  backdrop-filter:blur(16px);
}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 20px}
.logo{
  width:46px;height:46px;flex:none;display:grid;place-items:center;
  border:2px solid #064E3B;border-radius:14px;
  color:#fff;background:linear-gradient(145deg,var(--color-primary),var(--color-secondary));
  box-shadow:5px 5px 0 #064E3B;
}
.logo svg{width:25px;height:25px}
.brand b{display:block;font:700 15px/1.25 Rubik,"Nunito Sans",sans-serif}
.brand span{display:block;margin-top:4px;color:var(--color-primary);font:700 9px/1 Rubik,sans-serif;letter-spacing:1.15px}
#nav{display:grid;gap:5px}
#nav button{
  position:relative;display:flex;align-items:center;gap:11px;width:100%;
  min-height:44px;padding:10px 12px;border:1px solid transparent;border-radius:12px;
  color:#334155;background:transparent;text-align:left;font-weight:700;font-size:13px;
  transition:transform .2s ease,background .2s ease,color .2s ease,border-color .2s ease,box-shadow .2s ease;
}
#nav button:hover{transform:translateX(3px);background:#D1FAE5;border-color:var(--line);color:#064E3B}
#nav button.on{
  color:#fff;background:#064E3B;border-color:#064E3B;
  box-shadow:0 8px 18px rgba(6,78,59,.18);
}
.nav-icon{width:20px;height:20px;flex:none}
.side-foot{
  margin-top:auto;padding:14px 12px;border:1px solid var(--line);border-radius:14px;
  background:linear-gradient(145deg,#ECFDF5,#fff);color:var(--muted);font-size:11px;
}
.side-foot strong{display:block;margin-bottom:5px;color:var(--ink);font:700 12px Rubik,sans-serif}
.main{min-width:0;padding:24px clamp(16px,2.6vw,38px) 48px}
.topbar{
  position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;
  gap:18px;margin:-24px calc(clamp(16px,2.6vw,38px)*-1) 26px;
  padding:17px clamp(16px,2.6vw,38px);
  background:rgba(236,253,245,.88);border-bottom:1px solid rgba(167,243,208,.85);
  backdrop-filter:blur(16px);
}
.eyebrow{
  display:flex;align-items:center;gap:7px;margin-bottom:3px;
  color:var(--color-primary);font:700 10px Rubik,sans-serif;letter-spacing:1.4px;text-transform:uppercase;
}
.eyebrow svg{width:15px;height:15px}
.vh h1{margin:0;color:var(--ink);font:700 clamp(24px,3vw,34px)/1.15 Rubik,"Nunito Sans",sans-serif;letter-spacing:-.5px}
.vh p{margin:6px 0 0;color:var(--muted);font-size:13px}
.live{
  display:flex;align-items:center;gap:8px;flex:none;min-height:38px;padding:8px 13px;
  border:1px solid #6EE7B7;border-radius:10px;background:#fff;color:#065F46;
  box-shadow:0 6px 16px rgba(5,150,105,.08);font-weight:800;font-size:12px;
}
.live-dot{width:9px;height:9px;border:2px solid #fff;border-radius:50%;background:var(--color-primary);box-shadow:0 0 0 3px #A7F3D0;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.72);opacity:.55}}
#view{animation:reveal .34s ease both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{
  position:relative;min-height:142px;padding:18px;overflow:hidden;
  border:1px solid var(--line);border-radius:18px;background:var(--color-card);
  box-shadow:var(--shadow);transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.kpi:hover{transform:translateY(-4px);border-color:#34D399;box-shadow:var(--shadow-lg)}
.kpi:after{
  content:"";position:absolute;right:-24px;bottom:-31px;width:92px;height:92px;
  border:16px solid rgba(16,185,129,.11);border-radius:28px;transform:rotate(18deg);
}
.kpi.accent{background:#064E3B;color:#fff;border-color:#064E3B}
.kpi.accent:after{border-color:rgba(255,255,255,.12)}
.kpi .label{color:var(--muted);font-size:12px;font-weight:700}
.kpi.accent .label,.kpi.accent .meta{color:#D1FAE5}
.kpi .value{margin-top:8px;font:700 29px/1 Rubik,sans-serif;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.kpi .value small{font-size:13px}
.kpi .meta{margin-top:9px;color:var(--muted);font-size:11px;font-weight:700}
.kpi .meta.good{color:#047857}
.kpi-icon{
  position:absolute;right:15px;top:15px;width:32px;height:32px;padding:7px;border-radius:10px;
  color:#047857;background:#D1FAE5;
}
.kpi.accent .kpi-icon{color:#fff;background:rgba(255,255,255,.14)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.35fr) minmax(300px,.85fr)}
.g11{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{
  min-width:0;padding:18px;border:1px solid var(--line);border-radius:18px;
  background:var(--color-card);box-shadow:var(--shadow);
}
.card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:15px}
.card-head svg{width:20px;height:20px;color:var(--color-primary)}
.card h2{margin:0;font:700 14px Rubik,"Nunito Sans",sans-serif}
.tag{
  display:inline-flex;align-items:center;gap:5px;min-height:23px;padding:3px 9px;
  border:1px solid transparent;border-radius:999px;white-space:nowrap;
  font-size:10.5px;font-weight:800;
}
.tag:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-ok{color:#065F46;background:#D1FAE5;border-color:#6EE7B7}
.t-warn{color:#92400E;background:#FEF3C7;border-color:#FCD34D}
.t-bad{color:#991B1B;background:#FEE2E2;border-color:#FCA5A5}
.t-info{color:#075985;background:#E0F2FE;border-color:#7DD3FC}
.push{margin-left:auto}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:13px}
table.data{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
table.data th,table.data td{padding:11px 12px;border-bottom:1px solid #D1FAE5;text-align:left;white-space:nowrap}
table.data tr:last-child td{border-bottom:0}
table.data th{
  position:sticky;top:0;z-index:1;color:#334155;background:#E8F1F3;
  font-size:11px;font-weight:800;letter-spacing:.15px;
}
table.data tbody tr{transition:background .18s ease}
table.data tbody tr:hover{background:#F0FDF4}
table.data td:first-child,code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.num{text-align:right!important;font-variant-numeric:tabular-nums}
.rep{display:grid;gap:9px}
.ri{
  display:flex;align-items:center;gap:13px;padding:11px 13px;
  border:1px solid #FCA5A5;border-left:5px solid var(--bad);border-radius:12px;background:#FFF7F7;
  transition:transform .2s ease,box-shadow .2s ease;
}
.ri:hover{transform:translateX(3px);box-shadow:0 7px 18px rgba(185,28,28,.08)}
.ri.warn{border-color:#FCD34D;border-left-color:#B45309;background:#FFFBEB}
.ri .mid{flex:1;min-width:0}
.ri .mid b{display:block;font-size:12.5px}
.ri .mid small{display:block;margin-top:2px;color:var(--muted);font-size:11.5px}
.qty{text-align:right;flex:none}
.qty b{display:block;color:#9A3412;font:700 15px Rubik,sans-serif;font-variant-numeric:tabular-nums}
.qty small{display:block;color:var(--muted);font-size:10px}
.metric-row{margin-bottom:13px}
.metric-line{display:flex;justify-content:space-between;gap:12px;margin-bottom:5px;font-size:12px}
.metric-line b{font-weight:700}.metric-line span{color:#047857;font:700 12px Rubik,sans-serif}
.bar{height:9px;overflow:hidden;border:1px solid #D1FAE5;border-radius:999px;background:#ECFDF5}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--color-primary),#34D399)}
.heat{display:grid;grid-template-columns:repeat(10,minmax(24px,1fr));gap:5px}
.hx{
  aspect-ratio:1;display:grid;place-items:center;border:1px solid rgba(6,78,59,.14);
  border-radius:6px;color:#fff;font:700 9px Rubik,sans-serif;font-variant-numeric:tabular-nums;
}
.hx.light{color:#064E3B}
.legend{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:11px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px}
.scan{display:grid;gap:9px}
.sc{
  display:flex;align-items:center;gap:11px;min-height:50px;padding:10px 12px;
  border:1px solid var(--line);border-radius:12px;background:#FAFFFC;
  transition:border-color .2s ease,transform .2s ease,background .2s ease;
}
.sc:hover{transform:translateX(3px);border-color:#34D399;background:#ECFDF5}
.sc svg{width:20px;height:20px;flex:none;color:var(--color-primary)}
.sc b{font-size:12px}
.sc code{padding:3px 7px;border-radius:6px;background:#D1FAE5;color:#065F46;font-size:11px;font-weight:700}
.sc .detail{font-size:12px}
.sc .tm{margin-left:auto;color:var(--muted);font:600 11px ui-monospace,SFMono-Regular,monospace}
.chart{height:260px}
.note{
  display:flex;align-items:flex-start;gap:7px;margin:12px 0 0;padding:9px 10px;
  border-radius:9px;background:var(--color-muted);color:#334155;font-size:11.5px;
}
.note svg{width:16px;height:16px;flex:none;margin-top:1px;color:#047857}
@media(max-width:1080px){.kpis{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}.heat{grid-template-columns:repeat(8,1fr)}}
@media(max-width:780px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;padding:12px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:2px 4px 10px}.logo{width:40px;height:40px;box-shadow:3px 3px 0 #064E3B}
  #nav{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 8px}
  #nav button{width:auto;flex:none;min-height:42px;padding:9px 11px}
  #nav button:hover{transform:translateY(-2px)}
  .side-foot{display:none}
  .main{padding:18px 14px 36px}
  .topbar{position:static;margin:-18px -14px 20px;padding:16px 14px}
  .vh h1{font-size:25px}.g11{grid-template-columns:1fr}
}
@media(max-width:520px){
  .topbar{align-items:flex-start}.live{padding:8px 10px}.live span:last-child{display:none}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi{min-height:128px;padding:14px}
  .kpi .value{font-size:24px}.kpi-icon{display:none}
  .card{padding:14px;border-radius:15px}.heat{grid-template-columns:repeat(6,1fr)}
  .sc{display:grid;grid-template-columns:auto auto 1fr}.sc .detail{grid-column:2/4}.sc .tm{grid-column:3;margin-left:auto}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation:none!important;transition:none!important}
  #view{opacity:1;transform:none}
}
</style>
</head>

<div class="kpi">${ICONS.box.replace("<svg",'<svg class="kpi-icon"')}<div class="label">平均週轉</div><div class="value">8.4<small> 天</small></div><div class="meta good">良好 · 熱銷掌握 92%</div></div>
<div class="kpi accent">${ICONS.alert.replace("<svg",'<svg class="kpi-icon"')}<div class="label">待補 SKU</div><div class="value">26</div><div class="meta">高風險 · 3 缺貨 · 23 預警</div></div>
</div>

<section class="card">${head("chart","熱銷 TOP 5（近 7 日）")}${HOT.map(h=>`<div class="metric-row"><div class="metric-line"><b>${h[0]}</b><span>${h[1]}</span></div><div class="bar" role="progressbar" aria-valuenow="${h[1]}" aria-valuemin="0" aria-valuemax="100"><i style="width:${h[1]}%"></i></div></div>`).join("")}${head("grid","倉庫佔用熱區")}<div class="heat" id="heat"></div>${legend()}</section>
</div>`,
()=>`<section class="card">${head("input","入庫上架任務",'<span class="tag t-warn push">待上架 2</span>')}<div class="scroll"><table class="data"><thead><tr><th>ASN</th><th>供應商</th><th>品項</th><th>建議儲位</th><th>狀態</th></tr></thead><tbody>${INB.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td class="mono">${r[3]}</td><td><span class="tag ${r[5]}">${r[4]}</span></td></tr>`).join("")}</tbody></table></div></section>`,
()=>`<section class="card">${head("truck","波次揀貨出貨")}<div class="scroll"><table class="data"><thead><tr><th>波次</th><th>來源</th><th>項數</th><th>揀貨員</th><th>進度</th><th>狀態</th></tr></thead><tbody>${PICK.map(p=>`<tr><td><b>${p[0]}</b></td><td>${p[1]}</td><td>${p[2]}</td><td>${p[3]}</td><td style="min-width:130px"><div class="bar" role="progressbar" aria-label="完成 ${p[5]}%" aria-valuenow="${p[5]}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p[5]}%"></i></div></td><td><span class="tag ${p[6]}">${p[4]}</span></td></tr>`).join("")}</tbody></table></div></section>`,
()=>`<div class="g11 grid"><section class="card">${head("grid","儲位佔用熱區")}<div class="heat" id="heat2"></div>${legend()}<p class="note">${ICONS.info}色塊深淺呈現佔用率；每格同時標示數值，紅色格表示需調撥或補貨。</p></section><section class="card">${head("box","庫存明細")}<div class="scroll"><table class="data"><thead><tr><th>儲位</th><th>品名</th><th>現量</th><th>安全量</th><th>週轉</th></tr></thead><tbody>${STOCK.map(s=>`<tr><td><b>${s[0]}</b></td><td>${s[1]}</td><td class="num">${s[2]}</td><td class="num">${s[3]}</td><td><span class="tag ${s[5]}">${s[4]}</span></td></tr>`).join("")}</tbody></table></div></section></div>`,
()=>`<div class="grid g2"><section class="card">${head("check","循環盤點任務")}<div class="scroll"><table class="data"><thead><tr><th>單號</th><th>範圍</th><th>儲位數</th><th>差異</th><th>狀態</th></tr></thead><tbody>${COUNT.map(c=>`<tr><td><b>${c[0]}</b></td><td>${c[1]}</td><td>${c[2]}</td><td class="num">${c[3]}</td><td><span class="tag ${c[5]}">${c[4]}</span></td></tr>`).join("")}</tbody></table></div></section><section class="card">${head("chart","盤點差異分佈")}<div class="chart" id="c_ct" role="img" aria-label="盤點差異分佈：無差異 82、盤盈 12、盤虧 6"></div></section></div>`,
()=>`<section class="card">${head("cycle","拉動補貨觸發（低於安全庫存自動生成）")}<div class="scroll"><table class="data"><thead><tr><th>SKU</th><th>品名</th><th>現量</th><th>安全量</th><th>建議補量</th><th>供應商</th><th>狀態</th></tr></thead><tbody>${[["SKU-A102","有機燕麥棒",8,40,320,"綠野農產","已送出"],["SKU-C218","冷萃咖啡",52,120,400,"O美食品","已送出"],["SKU-B075","蔓越莓乾",34,60,180,"堅果工坊","待核准"],["SKU-D330","綜合堅果",41,80,240,"堅果工坊","待核准"],["SKU-E441","氣泡水 6入",96,150,300,"泡泡飲料","草稿"]].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td class="num" style="color:var(--bad);font-weight:800">${r[2]}</td><td class="num">${r[3]}</td><td class="num" style="color:#9A3412;font-weight:800">+${r[4]}</td><td>${r[5]}</td><td><span class="tag ${r[6]==="已送出"?"t-ok":r[6]==="待核准"?"t-warn":"t-info"}">${r[6]}</span></td></tr>`).join("")}</tbody></table></div></section>`,
()=>`<section class="card">${head("scan","條碼作業即時軌跡")}<div class="scan">${SCAN.map(s=>`<div class="sc">${ICONS.scan}<b>${s[0]}</b><code>${s[1]}</code><span class="detail">${s[2]}</span><span class="tm">${s[3]}</span></div>`).join("")}</div></section>`
];
function legend(){return '<div class="legend" aria-label="熱區圖例"><span><i style="background:#34D399"></i>一般</span><span><i style="background:#047857"></i>高佔用</span><span><i style="background:#B45309"></i>需關注</span><span><i style="background:#B91C1C"></i>需處理</span></div>'}
function heatFill(id){
 const el=document.getElementById(id);if(!el)return;
 let h="";
 for(let i=0;i<60;i++){
  const v=Math.round(30+((i*37)%70));
  const c=v>85?"#B91C1C":v>65?"#B45309":v>45?"#047857":"#6EE7B7";
  h+=`<div class="hx ${v<=45?"light":""}" title="儲位 ${i+1}：佔用率 ${v}%" aria-label="儲位 ${i+1}，佔用率 ${v}%">${v}</div>`;
 }
 el.innerHTML=h;
}
let chartInstance;
function draw(i){
 if(chartInstance){chartInstance.dispose();chartInstance=null}
 if(i===0)heatFill("heat");
 if(i===3)heatFill("heat2");
 if(i===4){
  chartInstance=echarts.init(document.getElementById("c_ct"));
  chartInstance.setOption({
   animation:!matchMedia("(prefers-reduced-motion: reduce)").matches,
   color:["#059669","#0284C7","#B91C1C"],
   tooltip:{trigger:"item",formatter:"{b}<br/>{c}（{d}%）"},
   legend:{bottom:0,itemWidth:10,itemHeight:10,textStyle:{fontFamily:"Nunito Sans",fontSize:11,color:"#475569"}},
   series:[{type:"pie",radius:["47%","72%"],center:["50%","44%"],label:{fontFamily:"Nunito Sans",fontSize:11,color:"#064E3B",formatter:"{b} {c}"},labelLine:{lineStyle:{color:"#A7F3D0"}},data:[{value:82,name:"無差異"},{value:12,name:"盤盈"},{value:6,name:"盤虧"}]}]
  });
 }
}
function show(i){
 const n=Math.max(0,Math.min(Number(i)||0,MOD.length-1));
 nav.querySelectorAll("button").forEach(b=>{const on=Number(b.dataset.i)===n;b.classList.toggle("on",on);b.setAttribute("aria-current",on?"page":"false")});
 vt.textContent=MOD[n][2];vd.textContent=MOD[n][3];view.innerHTML=SCREENS[n]();draw(n);
}
function fromHash(){
 const m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
 show(m?Math.min(Number(m[1]),MOD.length-1):0);
 try{window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}catch(e){window.scrollTo(0,0)}
}
window.addEventListener("hashchange",fromHash);
window.addEventListener("resize",()=>{if(chartInstance)chartInstance.resize()});
fromHash();
</script>
</body>
