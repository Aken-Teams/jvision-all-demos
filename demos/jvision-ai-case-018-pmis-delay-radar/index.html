<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>進度逾期預警圖 · PMIS Delay Radar｜Jvision 系統 Demo</title>
<meta name="description" content="營建專案進度逾期預警：甘特、S 曲線、里程碑與資源負載（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital@1&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#64748B;
  --color-on-primary:#FFFFFF;
  --color-secondary:#94A3B8;
  --color-on-secondary:#0F172A;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#334155;
  --color-card:#FFFFFF;
  --color-card-foreground:#334155;
  --color-muted:#EBF0F5;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#64748B;
  --blue:#64748B;
  --ink:#0F172A;
  --muted:#475569;
  --line:#E2E8F0;
  --red:#DC2626;
  --red-d:#991B1B;
  --amber:#D97706;
  --amber-d:#92400E;
  --green:#15803D;
  --slate:#64748B;
  --bg:#F8FAFC;
  --card:#FFFFFF;
  --body:#334155;
  --shadow:0 16px 44px rgba(15,23,42,.07);
  --shadow-sm:0 4px 14px rgba(15,23,42,.05);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  font-family:Inter,"Microsoft JhengHei",sans-serif;
  background:
    linear-gradient(rgba(100,116,139,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(100,116,139,.035) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--body);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,a,[role="button"]{cursor:pointer}
button{font:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid rgba(234,88,12,.35);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;
  line-height:1;
}
.top{
  position:sticky;
  top:0;
  z-index:30;
  display:flex;
  align-items:center;
  gap:18px;
  min-height:68px;
  padding:10px clamp(14px,3vw,36px);
  background:rgba(255,255,255,.94);
  border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 rgba(15,23,42,.03);
  backdrop-filter:blur(14px);
  overflow-x:auto;
}
.brand{display:flex;align-items:center;gap:12px;flex:none}
.logo{
  position:relative;
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--ink);
  border-radius:10px;
  box-shadow:inset 0 -3px 0 rgba(255,255,255,.08);
}
.logo::after{
  content:"";
  position:absolute;
  right:-3px;
  bottom:-3px;
  width:12px;
  height:12px;
  background:var(--color-accent);
  border:3px solid #fff;
  border-radius:3px;
}
.logo .material-symbols-outlined{font-size:23px}
.brand b{
  display:block;
  color:var(--ink);
  font-size:15px;
  font-weight:800;
  letter-spacing:-.02em;
}
.brand span{
  display:block;
  margin-top:3px;
  color:var(--color-accent);
  font-family:"JetBrains Mono",monospace;
  font-size:9px;
  font-weight:600;
  letter-spacing:.16em;
}
.nav{
  display:flex;
  align-items:center;
  gap:3px;
  margin-left:auto;
  padding:4px;
  background:var(--color-muted);
  border:1px solid var(--line);
  border-radius:12px;
  flex:none;
}
.nav button{
  min-height:38px;
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 11px;
  border:1px solid transparent;
  border-radius:8px;
  background:transparent;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
  transition:background-color .2s,color .2s,box-shadow .2s,transform .2s;
}
.nav button:hover{background:#fff;color:var(--ink)}
.nav button.on{
  color:#fff;
  background:var(--ink);
  border-color:var(--ink);
  box-shadow:0 5px 12px rgba(15,23,42,.16);
}
.nav button.on::after{
  content:"";
  width:5px;
  height:5px;
  border-radius:50%;
  background:var(--color-accent);
}
.nav button .material-symbols-outlined{font-size:18px}
.live{
  flex:none;
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:36px;
  padding:7px 12px;
  color:var(--red-d);
  background:#FEF2F2;
  border:1px solid #FECACA;
  border-radius:8px;
  font-size:11px;
  font-weight:800;
}
.live .dot{
  width:8px;
  height:8px;
  background:var(--red);
  border-radius:2px;
}
.wrap{
  width:min(1420px,100%);
  margin:0 auto;
  padding:24px clamp(12px,2.5vw,34px) 52px;
}
.vh{
  position:relative;
  isolation:isolate;
  min-height:210px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:24px;
  margin-bottom:20px;
  padding:clamp(24px,4vw,44px);
  overflow:hidden;
  color:#fff;
  background:var(--ink);
  border:1px solid #1E293B;
  border-radius:18px;
  box-shadow:var(--shadow);
}
.vh::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-2;
  background:
    linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:34px 34px;
  mask-image:linear-gradient(90deg,transparent,black 48%);
}
.vh::after{
  content:"";
  position:absolute;
  z-index:-1;
  right:7%;
  top:50%;
  width:220px;
  height:150px;
  border:1px solid rgba(255,255,255,.24);
  background:
    linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.01)),
    repeating-linear-gradient(90deg,transparent 0 34px,rgba(255,255,255,.09) 35px),
    repeating-linear-gradient(0deg,transparent 0 26px,rgba(255,255,255,.09) 27px);
  box-shadow:
    28px -22px 0 -1px rgba(100,116,139,.20),
    28px -22px 0 0 rgba(255,255,255,.16),
    56px -44px 0 -1px rgba(100,116,139,.12),
    56px -44px 0 0 rgba(255,255,255,.1);
  transform:translateY(-50%) perspective(600px) rotateX(58deg) rotateZ(-28deg);
}
.vh>div:first-child{max-width:720px}
.vh h2{
  margin:0;
  color:#fff;
  font-size:clamp(30px,5vw,56px);
  font-weight:800;
  line-height:1;
  letter-spacing:-.055em;
}
.vh h2::before{
  content:"FIELD / 26";
  display:block;
  margin-bottom:14px;
  color:#FDBA74;
  font-family:"JetBrains Mono",monospace;
  font-size:10px;
  font-weight:600;
  letter-spacing:.2em;
}
.vh p{
  max-width:620px;
  margin:14px 0 0;
  color:#CBD5E1;
  font-size:13px;
  line-height:1.65;
}
.proj{
  position:relative;
  z-index:2;
  max-width:440px;
  padding:12px 14px;
  color:#E2E8F0;
  background:rgba(15,23,42,.76);
  border:1px solid rgba(255,255,255,.22);
  border-left:4px solid var(--color-accent);
  border-radius:8px;
  font-family:"JetBrains Mono",monospace;
  font-size:10px;
  line-height:1.7;
  box-shadow:0 12px 30px rgba(0,0,0,.18);
}
.kpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
  margin-bottom:18px;
}
.kpi{
  position:relative;
  min-height:142px;
  padding:17px;
  overflow:hidden;
  background:var(--card);
  border:1px solid var(--line);
  border-top:3px solid var(--red);
  border-radius:12px;
  box-shadow:var(--shadow-sm);
}
.kpi.warn{border-top-color:var(--amber)}
.kpi.ok{border-top-color:var(--green)}
.kpi::after{
  content:"";
  position:absolute;
  right:-22px;
  bottom:-30px;
  width:90px;
  height:90px;
  border:16px solid var(--color-muted);
  transform:rotate(18deg);
}
.kpi .l{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:11px;
  font-weight:700;
}
.kpi .l .material-symbols-outlined{font-size:18px;color:var(--red)}
.kpi.warn .l .material-symbols-outlined{color:var(--amber-d)}
.kpi.ok .l .material-symbols-outlined{color:var(--green)}
.kpi .v{
  position:relative;
  z-index:1;
  margin-top:13px;
  color:var(--ink);
  font-family:"JetBrains Mono",monospace;
  font-size:28px;
  font-weight:600;
  letter-spacing:-.05em;
}
.kpi .v small{
  color:var(--muted);
  font-family:Inter,sans-serif;
  font-size:12px;
  font-weight:700;
}
.kpi .d{
  position:relative;
  z-index:1;
  margin-top:7px;
  color:var(--muted);
  font-size:11px;
  font-weight:600;
  line-height:1.45;
}
.grid{display:grid;gap:18px}
.grid>*{min-width:0}
.card{
  min-width:0;
  padding:18px 20px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  box-shadow:var(--shadow-sm);
}
.card>h3{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:30px;
  margin:0 0 15px;
  padding-bottom:12px;
  color:var(--ink);
  border-bottom:1px solid var(--line);
  font-size:14px;
  font-weight:800;
  letter-spacing:-.015em;
}
.card>h3 .material-symbols-outlined{
  width:28px;
  height:28px;
  display:grid;
  place-items:center;
  color:var(--color-accent);
  background:#FFF7ED;
  border:1px solid #FED7AA;
  border-radius:7px;
  font-size:17px;
}
.card>h3 .leg{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-left:auto;
  color:var(--muted);
  font-size:10px;
  font-weight:600;
}
.leg i{
  width:9px;
  height:9px;
  display:inline-block;
  margin-right:4px;
  border-radius:2px;
  vertical-align:middle;
}
.btn{
  min-height:40px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:0 16px;
  color:#fff;
  background:var(--color-accent);
  border:1px solid #C2410C;
  border-radius:8px;
  font-weight:800;
  font-size:12px;
  box-shadow:0 5px 14px rgba(234,88,12,.18);
  transition:background-color .2s,transform .2s,box-shadow .2s;
}
.btn:hover{background:#C2410C;transform:translateY(-1px)}
.btn.ghost{color:var(--ink);background:#fff;border-color:var(--line);box-shadow:none}
.gantt{overflow-x:auto}
.gt-head{
  min-width:820px;
  display:grid;
  grid-template-columns:156px 1fr;
  border-bottom:2px solid var(--ink);
}
.gt-head .hl{
  align-self:end;
  padding:7px 8px;
  color:var(--muted);
  font-family:"JetBrains Mono",monospace;
  font-size:10px;
  font-weight:600;
}
.gt-weeks{display:grid;grid-template-columns:repeat(12,1fr)}
.gt-weeks div{
  padding:7px 2px;
  color:var(--muted);
  border-left:1px solid var(--line);
  font-family:"JetBrains Mono",monospace;
  font-size:9px;
  font-weight:600;
  text-align:center;
}
.gt-row{
  min-width:820px;
  display:grid;
  grid-template-columns:156px 1fr;
  align-items:center;
  border-bottom:1px solid var(--line);
  transition:background-color .18s;
}
.gt-row:hover{background:#F8FAFC}
.gt-lbl{
  padding:10px 8px;
  color:var(--ink);
  font-size:11px;
  font-weight:700;
}
.gt-lbl small{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-size:9px;
  font-weight:500;
}
.gt-track{
  position:relative;
  height:46px;
  background:repeating-linear-gradient(90deg,transparent,transparent calc(8.333% - 1px),#E2E8F0 calc(8.333% - 1px),#E2E8F0 8.333%);
}
.gt-plan{
  position:absolute;
  top:8px;
  height:30px;
  background:rgba(100,116,139,.08);
  border:1px dashed #94A3B8;
  border-radius:4px;
}
.gt-bar{
  position:absolute;
  top:13px;
  height:20px;
  display:flex;
  align-items:center;
  padding:0 7px;
  overflow:hidden;
  color:#fff;
  border-radius:3px;
  font-family:"JetBrains Mono",monospace;
  font-size:9px;
  font-weight:600;
  white-space:nowrap;
  box-shadow:0 2px 6px rgba(15,23,42,.16);
}
.b-done{background:#15803D}
.b-run{background:#B45309}
.b-late{background:#DC2626}
.b-wait{background:#64748B}
.gt-now{
  position:absolute;
  z-index:3;
  top:0;
  bottom:0;
  width:2px;
  background:var(--color-accent);
}
.gt-now::after{
  content:"今日";
  position:absolute;
  top:0;
  left:4px;
  padding:2px 4px;
  color:#fff;
  background:var(--color-accent);
  border-radius:2px;
  font-size:8px;
  font-weight:800;
  white-space:nowrap;
}
.gt-ms{
  position:absolute;
  z-index:2;
  top:6px;
  width:12px;
  height:12px;
  background:var(--amber);
  border:2px solid #fff;
  box-shadow:0 0 0 1px var(--amber-d);
  transform:translateX(-6px) rotate(45deg);
}
.chart{width:100%;height:300px}
.chart.sm{height:250px}
.tbl{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  font-size:12px;
}
.tbl th{
  padding:10px 12px;
  color:var(--muted);
  background:var(--color-muted);
  border-top:1px solid var(--line);
  border-bottom:1px solid #CBD5E1;
  font-size:10px;
  font-weight:800;
  letter-spacing:.035em;
  text-align:left;
  white-space:nowrap;
}
.tbl th:first-child{border-left:1px solid var(--line);border-radius:7px 0 0 0}
.tbl th:last-child{border-right:1px solid var(--line);border-radius:0 7px 0 0}
.tbl td{
  padding:11px 12px;
  border-bottom:1px solid var(--line);
  white-space:nowrap;
}
.tbl tbody tr{transition:background-color .18s}
.tbl tbody tr:hover{background:#F8FAFC}
.tbl td:nth-child(4),
.tbl td:nth-child(5),
.tbl th:nth-child(4),
.tbl th:nth-child(5){text-align:right;font-variant-numeric:tabular-nums}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:5px;
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
}
.tag::before{
  content:"";
  width:5px;
  height:5px;
  border-radius:1px;
  background:currentColor;
}
.g-done{color:#166534;background:#F0FDF4}
.g-run{color:#92400E;background:#FFFBEB}
.g-late{color:#991B1B;background:#FEF2F2}
.g-wait{color:#475569;background:#F8FAFC}
.spi{
  font-family:"JetBrains Mono",monospace;
  font-weight:600;
  font-variant-numeric:tabular-nums;
}
.spi.bad{color:var(--red-d)}
.spi.warn{color:var(--amber-d)}
.spi.ok{color:var(--green)}
.bar{
  min-width:76px;
  height:7px;
  overflow:hidden;
  background:#E2E8F0;
  border-radius:2px;
}
.bar span{display:block;height:100%}
.alert{
  display:flex;
  align-items:flex-start;
  gap:11px;
  padding:12px 0;
  border-top:1px solid var(--line);
}
.alert:first-of-type{border-top:0}
.alert-ic{
  width:34px;
  height:34px;
  display:grid;
  place-content:center;
  flex:none;
  border:1px solid currentColor;
  border-radius:7px;
  font-family:"JetBrains Mono",monospace;
  font-size:12px;
  font-weight:700;
}
.alert-ic .material-symbols-outlined{font-size:18px}
.a-red{color:#991B1B;background:#FEF2F2}
.a-amber{color:#92400E;background:#FFFBEB}
.a-blue{color:#334155;background:#F1F5F9}
.alert p{min-width:0;margin:0;color:var(--body);font-size:12px;line-height:1.5}
.alert b{color:var(--ink)}
.alert small{display:block;margin-top:3px;color:var(--muted);font-size:10px;line-height:1.55}
.alert .tm{
  margin-left:auto;
  color:var(--muted);
  font-family:"JetBrains Mono",monospace;
  font-size:9px;
  white-space:nowrap;
}
.ms{display:flex;flex-direction:column}
.ms-i{
  position:relative;
  display:grid;
  grid-template-columns:20px 1fr auto;
  gap:13px;
  align-items:flex-start;
  padding:3px 0 20px;
}
.ms-dot{
  z-index:2;
  width:14px;
  height:14px;
  margin-top:3px;
  background:#CBD5E1;
  border:3px solid #fff;
  border-radius:3px;
  box-shadow:0 0 0 2px #94A3B8;
  transform:rotate(45deg);
}
.ms-i.done .ms-dot{background:var(--green);box-shadow:0 0 0 2px var(--green)}
.ms-i.now .ms-dot{background:var(--amber);box-shadow:0 0 0 2px var(--amber-d)}
.ms-i.late .ms-dot{background:var(--red);box-shadow:0 0 0 2px var(--red)}
.ms-i:not(:last-child)::before{
  content:"";
  position:absolute;
  left:6px;
  top:17px;
  bottom:-2px;
  width:2px;
  background:var(--line);
}
.ms-i b{color:var(--ink);font-size:13px}
.ms-i small{display:block;margin-top:3px;color:var(--muted);font-size:10px}
.ms-i .r{
  color:var(--muted);
  font-family:"JetBrains Mono",monospace;
  font-size:10px;
  text-align:right;
  white-space:nowrap;
}
.ms-i .r b{display:block;font-family:Inter,sans-serif;font-size:11px}
.res{display:flex;flex-direction:column;gap:15px}
.res-r{
  display:grid;
  grid-template-columns:128px 1fr 58px;
  gap:12px;
  align-items:center;
}
.res-r .nm{color:var(--ink);font-size:12px;font-weight:700}
.res-r .nm small{display:block;margin-top:2px;color:var(--muted);font-size:10px;font-weight:500}
.res-track{
  position:relative;
  height:20px;
  overflow:hidden;
  background:
    repeating-linear-gradient(90deg,transparent,transparent calc(10% - 1px),rgba(100,116,139,.12) calc(10% - 1px),rgba(100,116,139,.12) 10%),
    var(--color-muted);
  border:1px solid var(--line);
  border-radius:3px;
}
.res-track span{display:block;height:100%;border-radius:2px}
.res-track .cap{
  position:absolute;
  top:0;
  bottom:0;
  width:2px;
  background:var(--red);
}
.res-r .pc{
  font-family:"JetBrains Mono",monospace;
  font-size:12px;
  font-weight:600;
  text-align:right;
  font-variant-numeric:tabular-nums;
}
.note{
  margin-top:13px;
  padding:10px 12px;
  color:var(--muted);
  background:#F8FAFC;
  border-left:3px solid var(--color-primary);
  font-size:10px;
  line-height:1.7;
}
@media(max-width:1100px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nav button span:last-child{display:none}
}
@media(max-width:900px){
  .grid{grid-template-columns:1fr!important}
  .vh{min-height:230px;align-items:flex-start;flex-direction:column}
  .vh::after{right:-20px;opacity:.58}
  .proj{margin-top:auto}
}
@media(max-width:620px){
  .top{gap:10px;padding:9px 12px}
  .brand span,.live{display:none}

const nav=document.getElementById("nav"),view=document.getElementById("view");
nav.innerHTML=NAV.map((m,i)=>`<button type="button" data-i="${i}" class="${i===0?"on":""}" aria-label="${m[1]}" aria-current="${i===0?"page":"false"}"><span class="material-symbols-outlined">${m[0]}</span><span>${m[1]}</span></button>`).join("");
function show(i){
 nav.querySelectorAll("button[data-i]").forEach(b=>{const active=+b.dataset.i===i;b.classList.toggle("on",active);b.setAttribute("aria-current",active?"page":"false")});
 view.innerHTML=`<section class="vh"><div><h2>${NAV[i][1]}</h2><p>${DESC[i]}</p></div><div class="proj"><span>${PROJ}</span></div></section>`+SCREENS[i]();
 draw(i)
}
nav.addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(b){const i=+b.dataset.i;location.hash="v"+i;if((location.hash||"")==="#v"+i)show(i)}});
window.addEventListener("resize",()=>charts.forEach(c=>{try{c.resize()}catch(e){}}));
function fromHash(){const m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return}const n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
