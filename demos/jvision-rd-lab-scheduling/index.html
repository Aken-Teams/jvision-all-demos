<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>測試設備與實驗室排程 · PLM 研發管理系統</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700&family=Roboto+Mono:wght@300;400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#15803D;
  --color-on-primary:#FFFFFF;
  --color-secondary:#22C55E;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDF4;
  --color-foreground:#14532D;
  --color-card:#FFFFFF;
  --color-card-foreground:#14532D;
  --color-muted:#E8F0F1;
  --color-muted-foreground:#475569;
  --color-border:#BBF7D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#15803D;

  --blue:#15803D;
  --ink:#14532D;
  --muted:#475569;
  --line:#BBF7D0;

  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --accent-soft:#DCFCE7;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --th:#ECFDF3;
  --hov:#F2FBF5;
  --track:#DCECE2;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#B91C1C;
  --info:#166534;
  --r:20px;
  --shadow:0 1px 2px rgba(20,83,45,.05),0 12px 32px rgba(20,83,45,.08);
  --shadow-hover:0 4px 10px rgba(20,83,45,.08),0 20px 42px rgba(20,83,45,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%;padding:0}
body{
  background:
    radial-gradient(circle at 92% 4%,rgba(34,197,94,.13),transparent 24rem),
    radial-gradient(circle at 18% 90%,rgba(217,119,6,.08),transparent 26rem),
    var(--bg);
  color:var(--ink);
  font-family:"Exo","Noto Sans TC",system-ui,sans-serif;
  font-size:14px;
  -webkit-font-smoothing:antialiased
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
h1,h2,h3,h4,p{margin-top:0}
h1,h2,h3,h4{font-family:"Exo","Noto Sans TC",system-ui,sans-serif}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
  border-radius:8px
}
.skip{
  position:fixed;
  left:16px;
  top:-60px;
  z-index:100;
  padding:10px 16px;
  border-radius:12px;
  background:var(--color-primary);
  color:#fff;
  text-decoration:none
}
.skip:focus{top:16px}
.app{display:flex;min-height:100vh}
.sidebar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  flex:none;
  flex-direction:column;
  width:256px;
  height:100vh;
  padding:22px 16px;
  overflow:hidden;
  color:var(--ink);
  background:rgba(255,255,255,.92);
  border-right:1px solid rgba(187,247,208,.95);
  box-shadow:8px 0 34px rgba(20,83,45,.045);
  backdrop-filter:blur(16px)
}
.sidebar::before,.sidebar::after{
  position:absolute;
  z-index:-1;
  content:"";
  border-radius:42% 58% 68% 32%/40% 42% 58% 60%;
  pointer-events:none
}
.sidebar::before{
  top:-85px;
  right:-105px;
  width:230px;
  height:220px;
  background:rgba(34,197,94,.13)
}
.sidebar::after{
  right:-85px;
  bottom:40px;
  width:180px;
  height:180px;
  background:rgba(217,119,6,.07)
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  padding:2px 7px 23px
}
.brand-logo{
  display:grid;
  flex:none;
  width:44px;
  height:44px;
  place-items:center;
  color:#fff;
  background:linear-gradient(145deg,#166534,var(--color-secondary));
  border-radius:15px 20px 14px 22px;
  box-shadow:0 9px 22px rgba(21,128,61,.22)
}
.brand-logo .material-symbols-outlined{font-size:24px}
.brand-txt{min-width:0}
.brand-txt b{
  display:block;
  overflow:hidden;
  font-size:15px;
  font-weight:700;
  letter-spacing:.03em;
  text-overflow:ellipsis;
  white-space:nowrap
}
.brand-txt span{
  display:block;
  margin-top:2px;
  color:var(--muted);
  font-family:"Roboto Mono",monospace;
  font-size:9px;
  font-weight:500;
  letter-spacing:.13em
}
.nav{
  display:flex;
  flex-direction:column;
  gap:7px;
  min-width:0;
  margin-top:5px
}
.nav button{
  display:flex;
  align-items:center;
  min-height:44px;
  gap:11px;
  width:100%;
  padding:10px 12px;
  color:var(--muted);
  text-align:left;
  background:transparent;
  border:1px solid transparent;
  border-radius:14px 18px 14px 18px;
  transition:background-color .2s,color .2s,border-color .2s,transform .2s
}
.nav button:hover{
  color:var(--ink);
  background:#F0FDF4;
  border-color:var(--line);
  transform:translateX(2px)
}
.nav button.on{
  color:#fff;
  background:linear-gradient(135deg,#166534,var(--color-primary));
  border-color:#166534;
  box-shadow:0 9px 22px rgba(21,128,61,.2)
}
.nav button .material-symbols-outlined{flex:none;font-size:20px}
.nav .txt{
  overflow:hidden;
  font-weight:600;
  text-overflow:ellipsis;
  white-space:nowrap
}
.nav .idx{
  margin-left:auto;
  font-family:"Roboto Mono",monospace;
  font-size:10px;
  font-weight:700;
  opacity:.75
}
.side-foot{
  margin-top:auto;
  padding:15px 10px 2px;
  color:var(--muted);
  border-top:1px solid var(--line);
  font-family:"Roboto Mono",monospace;
  font-size:10px;
  line-height:1.75
}
.side-foot b{color:var(--ink)}
.main{
  flex:1;
  min-width:0;
  max-width:1760px;
  padding:25px 30px 58px
}
.topbar{
  position:relative;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:18px;
  margin-bottom:20px;
  padding:0 2px 16px;
  border-bottom:1px solid rgba(187,247,208,.85)
}
.topbar::after{
  position:absolute;
  bottom:-1px;
  left:0;
  width:25%;
  height:3px;
  content:"";
  background:linear-gradient(90deg,var(--color-primary),var(--color-secondary));
  border-radius:99px
}
.topbar h1{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0;
  color:#14532D;
  font-size:22px;
  font-weight:700;
  letter-spacing:.01em
}
.topbar h1 .material-symbols-outlined{
  display:grid;
  width:34px;
  height:34px;
  place-items:center;
  color:var(--color-primary);
  background:#DCFCE7;
  border-radius:10px 14px 10px 14px;
  font-size:21px
}
.topbar .sub{margin-top:5px;color:var(--muted);font-size:12.5px}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:9px;flex-wrap:wrap}
.chip{
  display:inline-flex;
  align-items:center;
  min-height:34px;
  gap:7px;
  padding:6px 11px;
  color:var(--muted);
  background:rgba(255,255,255,.8);
  border:1px solid var(--line);
  border-radius:999px;
  font-size:11px;
  font-weight:600;
  box-shadow:0 3px 12px rgba(20,83,45,.04)
}
.chip .dot{
  width:8px;
  height:8px;
  background:var(--ok);
  border:2px solid #fff;
  border-radius:50%;
  box-shadow:0 0 0 3px rgba(21,128,61,.2);
  animation:pulse 2s ease-in-out infinite
}
.avatar{
  display:grid;
  flex:none;
  width:36px;
  height:36px;
  place-items:center;
  color:#fff;
  background:linear-gradient(145deg,#14532D,#22C55E);
  border:2px solid #fff;
  border-radius:46% 54% 42% 58%;
  box-shadow:0 5px 14px rgba(21,128,61,.2);
  font-weight:700
}
.grid{display:grid;gap:15px}
.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.card,.sec,.kpi,.stat,.tile{
  position:relative;
  min-width:0;
  color:var(--color-card-foreground);
  background:rgba(255,255,255,.94);
  border:1px solid rgba(187,247,208,.9);
  box-shadow:var(--shadow)
}
.card,.sec{
  padding:16px;
  border-radius:20px 24px 20px 24px
}
.card,.kpi,.stat,.tile{
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease
}
.card:hover,.kpi:hover,.stat:hover,.tile:hover{
  border-color:#86EFAC;
  box-shadow:var(--shadow-hover);
  transform:translateY(-2px)
}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.sec{margin-bottom:15px}
.sec>h3,.card-h h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0;
  font-size:14px;
  font-weight:700
}
.sec>h3{margin-bottom:13px}
.sec>h3 .material-symbols-outlined,.card-h h3 .material-symbols-outlined{
  color:var(--color-primary);
  font-size:19px
}
.sec>p{margin:0 0 13px;color:var(--muted);font-size:13px;line-height:1.75}
.card-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:13px;
  flex-wrap:wrap
}
.card-h .hint{color:var(--muted);font-size:11px}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0;font-size:13px}
.dl dt{color:var(--muted);font-size:12px;font-weight:600}
.dl dd{margin:0;line-height:1.8}
.kpi,.stat{
  min-height:132px;
  padding:15px 17px;
  overflow:hidden;
  border-radius:18px 23px 18px 23px
}
.kpi::after{
  position:absolute;
  top:-31px;
  right:-27px;
  width:92px;
  height:88px;
  content:"";
  background:linear-gradient(145deg,rgba(34,197,94,.2),rgba(217,119,6,.08));
  border-radius:41% 59% 66% 34%/45% 43% 57% 55%
}
.kpi .ico{
  position:relative;
  z-index:1;
  display:grid;
  width:38px;
  height:38px;
  place-items:center;
  color:var(--color-primary);
  background:#DCFCE7;
  border:1px solid #BBF7D0;
  border-radius:12px 17px 12px 17px
}
.kpi .ico .material-symbols-outlined{font-size:20px}
.kpi .lbl,.stat .lbl{
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:10px;
  color:var(--muted);
  font-size:11.5px;
  font-weight:600
}
.stat .lbl{margin-top:0}
.kpi .val,.stat .val,.tile .tv{
  margin-top:3px;
  color:#14532D;
  font-family:"Roboto Mono",monospace;
  font-size:25px;
  font-variant-numeric:tabular-nums;
  font-weight:700;
  letter-spacing:-.05em
}
.kpi .val small,.stat .val small{
  margin-left:4px;
  color:var(--muted);
  font-size:12px;
  font-weight:600;
  letter-spacing:0
}
.kpi .delta,.stat .d{
  display:inline-flex;
  align-items:center;
  gap:3px;
  margin-top:5px;
  font-size:11px;
  font-weight:700
}
.delta.up,.d.up{color:#166534}
.delta.down,.d.down{color:#B91C1C}
.delta.flat,.d.flat{color:var(--muted)}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:14px}
table{
  width:100%;
  border-spacing:0;
  border-collapse:separate;
  color:#163D27;
  font-size:12px;
  font-variant-numeric:tabular-nums
}
th{
  padding:10px 12px;
  color:#3F5F4B;
  text-align:left;
  white-space:nowrap;
  background:#ECFDF3;
  border-top:1px solid #D1FAE5;
  border-bottom:1px solid var(--line);
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.04em
}
th:first-child{padding-left:17px}
th:last-child{padding-right:17px}
td{
  padding:10px 12px;
  white-space:nowrap;
  background:rgba(255,255,255,.72);
  border-bottom:1px solid #DCF4E4
}
td:first-child{padding-left:17px}
td:last-child{padding-right:17px}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--hov)}
td:nth-child(n+3){font-variant-numeric:tabular-nums}
.mono,td:first-child{
  font-family:"Roboto Mono",monospace;
  font-weight:600;
  letter-spacing:.01em
}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 9px;
  border:1px solid transparent;
  border-radius:999px;
  font-size:10.5px;
  font-weight:700;
  white-space:nowrap
}
.tag::before{
  width:6px;
  height:6px;
  content:"";
  background:currentColor;
  border-radius:50%
}
.t-ok{color:#166534;background:#DCFCE7;border-color:#86EFAC}
.t-warn{color:#92400E;background:#FEF3C7;border-color:#FCD34D}
.t-bad{color:#991B1B;background:#FEE2E2;border-color:#FCA5A5}
.t-info{color:#1E40AF;background:#DBEAFE;border-color:#93C5FD}
.t-gray{color:#475569;background:#F1F5F9;border-color:#CBD5E1}
.t-acc,.t-pink{color:#166534;background:#E7F8EC;border-color:#BBF7D0}
.bar{
  height:8px;
  min-width:58px;
  overflow:hidden;
  background:var(--track);
  border-radius:999px
}
.bar>i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--color-primary),var(--color-secondary));
  border-radius:999px
}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{
  flex:none;
  width:38px;
  color:var(--muted);
  text-align:right;
  font-family:"Roboto Mono",monospace;
  font-size:10.5px;
  font-weight:600
}
.tile{
  display:flex;
  min-height:150px;
  flex-direction:column;
  gap:7px;
  padding:16px 17px;
  overflow:hidden;
  border-radius:18px 24px 18px 24px
}
.tile::after{
  position:absolute;
  right:-30px;
  bottom:-38px;
  width:115px;
  height:105px;
  content:"";
  background:rgba(34,197,94,.08);
  border-radius:63% 37% 38% 62%/44% 54% 46% 56%
}
.tile .ti{
  display:grid;
  width:38px;
  height:38px;
  place-items:center;
  color:var(--color-primary);
  background:#DCFCE7;
  border:1px solid var(--line);
  border-radius:13px 18px 13px 18px
}
.tile .ti .material-symbols-outlined{font-size:20px}
.tile b{font-size:13px;font-weight:700}
.tile p{
  position:relative;
  z-index:1;
  margin:0;
  color:var(--muted);
  font-size:11.5px;
  line-height:1.55
}
.tile .tv{position:relative;z-index:1;font-size:22px}
.tl{position:relative;padding-left:25px}
.tl::before{position:absolute;top:4px;bottom:4px;left:7px;width:2px;content:"";background:var(--line)}
.tl-item,.tl-i{position:relative;padding:0 0 17px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{
  position:absolute;
  top:3px;
  left:-23px;
  width:13px;
  height:13px;
  background:#fff;
  border:3px solid var(--accent);
  border-radius:50%
}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font-family:"Roboto Mono",monospace;font-size:10.5px;font-weight:600}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:12.5px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:11.5px}
.chk{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px dashed var(--line);font-size:12.5px}
.chk:last-child{border-bottom:0}
.chk .material-symbols-outlined{font-size:19px}
.chk .ok{color:var(--ok)}
.chk .wait{color:var(--muted)}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--muted);font-size:11px}
.note{margin-top:13px;padding-top:12px;color:var(--muted);border-top:1px dashed var(--line);font-size:11.5px;line-height:1.7}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.board>*{min-width:0}
.col{display:flex;flex-direction:column;gap:9px;padding:11px;background:var(--th);border:1px solid var(--line);border-radius:18px}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 6px;font-size:12.5px;font-weight:700}
.col-h .cnt{padding:2px 9px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;font-size:11px}
.pcard{padding:11px 12px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px 17px 12px 17px}
.pcard b{font-size:12.5px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--muted);font-size:11px}
.pcard .who,.who{display:inline-flex;align-items:center;gap:6px}
.pcard .who{margin-top:8px;color:var(--ink);font-size:11px}
.mini-av,.av{display:inline-flex;flex:none;align-items:center;justify-content:center;color:var(--accent);background:var(--accent-soft);border-radius:50%;font-weight:700}
.mini-av{width:18px;height:18px;font-size:9px}
.av{width:26px;height:26px;font-size:11px}
.lane{display:flex;flex-direction:column;gap:11px}
.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:15px}
.lane-row .num{display:flex;flex:none;align-items:center;justify-content:center;width:31px;height:31px;color:var(--accent);background:var(--accent-soft);border-radius:10px 14px 10px 14px;font-family:"Roboto Mono",monospace;font-size:13px;font-weight:700}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:13.5px}
.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:11.5px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{z-index:1;display:flex;align-items:center;justify-content:center;width:22px;height:22px;color:#64748B;background:#fff;border:2px solid var(--line);border-radius:50%;font-size:11px}
.steps .ln{width:20px;height:2px;background:var(--line)}
.steps .s.done{color:#fff;background:var(--accent);border-color:var(--accent)}
.steps .s.cur{color:var(--accent);border-color:var(--accent);animation:pulse 1.6s infinite}
.steps .ln.done{background:var(--accent)}
.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 4px;border-bottom:1px dashed var(--line)}
.rep-row:last-child{border-bottom:0}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:13px}
.rep-row .sku span{color:var(--muted);font-size:11px}
.gauge{width:110px;flex:none}
.gauge .track{position:relative;height:8px;overflow:hidden;background:var(--track);border-radius:999px}
.gauge .track i{display:block;height:100%;background:var(--accent);border-radius:999px}
.gauge small{display:block;margin-top:3px;color:var(--muted);text-align:right;font-family:"Roboto Mono",monospace;font-size:10px}
.band{position:relative;min-width:150px;height:26px;background:var(--track);border-radius:8px}
.band .rng{position:absolute;top:0;bottom:0;background:var(--accent-soft);border-radius:8px}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
.band .me{position:absolute;top:3px;width:12px;height:20px;background:var(--accent);border-radius:5px;box-shadow:0 2px 6px rgba(21,128,61,.28)}
#screen>*{animation:reveal .42s cubic-bezier(.2,.8,.2,1) both}

var RENDER=[v0,v1,v2,v3];
function buildNav(){
 var n=document.getElementById("nav");
 n.innerHTML=MODULES.map(function(m,i){return '<button type="button" data-i="'+i+'" aria-label="'+m.name+'"><span class="material-symbols-outlined" aria-hidden="true">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'}).join("");
 Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})})
}
function show(i){
 killCharts();
 var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){
  var active=+b.getAttribute("data-i")===i;
  b.classList.toggle("on",active);
  b.setAttribute("aria-current",active?"page":"false")
 });
 RENDER[i](document.getElementById("screen"))
}
buildNav();
function fromHash(){
 var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
 show(m?Math.min(+m[1],MODULES.length-1):0);
 try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
