<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>客戶關係管理 CRM｜Jvision 系統 Demo</title>
<meta name="description" content="從名單到成交的完整客戶生命週期管理（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#14B8A6;
  --color-on-secondary:#0F172A;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#99F6E4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#2563EB;
  --ink:#0F3F3C;
  --muted:#475569;
  --line:#B7E8E1;
  --green:#15803D;
  --red:#B91C1C;
  --amber:#B45309;
  --shadow:0 8px 24px rgba(15,118,110,.08);
  --shadow-hover:0 14px 32px rgba(15,118,110,.14);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  font-family:"Plus Jakarta Sans","Microsoft JhengHei",sans-serif;
  background:
    linear-gradient(rgba(13,148,136,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(13,148,136,.035) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--color-foreground);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}
button,a,[role="button"]{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;
  line-height:1;
}
.nav{
  position:sticky;
  top:0;
  z-index:20;
  color:var(--color-foreground);
  background:rgba(255,255,255,.94);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(16px);
}
.nav-in{
  width:min(1440px,100%);
  min-height:72px;
  margin:auto;
  padding:10px 28px;
  display:flex;
  align-items:center;
  gap:22px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:218px}
.brand .lg{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  flex:none;
  color:#fff;
  background:var(--color-primary);
  border-radius:10px;
  box-shadow:5px 5px 0 #CCFBF1;
}
.brand b{
  display:block;
  color:var(--ink);
  font-size:16px;
  font-weight:700;
  letter-spacing:-.02em;
}
.brand small{display:block;margin-top:3px;color:var(--muted);font-size:10px}
.navbtns{
  display:flex;
  align-items:center;
  gap:3px;
  min-width:0;
  overflow-x:auto;
  scrollbar-width:none;
}
.navbtns::-webkit-scrollbar{display:none}
.navbtns button{
  min-height:42px;
  padding:9px 11px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  flex:none;
  border:1px solid transparent;
  border-radius:8px;
  background:transparent;
  color:var(--muted);
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .2s ease;
}
.navbtns button:hover{
  color:var(--color-primary);
  background:#ECFDF5;
  border-color:var(--line);
}
.navbtns button.on{
  color:#fff;
  background:var(--color-primary);
  border-color:var(--color-primary);
}
.navbtns button .material-symbols-outlined{font-size:19px}
.nav .r{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
.live{
  min-height:34px;
  padding:6px 11px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:#166534;
  background:#F0FDF4;
  border:1px solid #BBF7D0;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
.live .dot{
  width:8px;
  height:8px;
  border:2px solid #fff;
  border-radius:50%;
  background:#16A34A;
  box-shadow:0 0 0 2px #86EFAC;
  animation:pulse 1.8s ease-in-out infinite;
}
.ava{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  flex:none;
  color:#fff;
  background:var(--ink);
  border:2px solid #fff;
  border-radius:50%;
  font-weight:700;
  box-shadow:0 0 0 1px var(--line);
}
.wrap{width:min(1440px,100%);margin:auto;padding:30px 28px 56px}
.vh{
  margin-bottom:22px;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:18px;
}
.vh h2{
  margin:0;
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--ink);
  font-size:clamp(22px,2.2vw,30px);
  font-weight:700;
  letter-spacing:-.045em;
}
.vh h2 .material-symbols-outlined{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  color:var(--color-primary);
  background:#CCFBF1;
  border-radius:8px;
  font-size:22px;
}
.vh p{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.6}
.btn{
  min-height:42px;
  padding:0 16px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  flex:none;
  border:1px solid var(--color-accent);
  border-radius:8px;
  color:#fff;
  background:var(--color-accent);
  box-shadow:3px 3px 0 #FED7AA;
  font-weight:700;
  font-size:12px;
  white-space:nowrap;
  transition:transform .2s ease,box-shadow .2s ease,background-color .2s ease;
}
.btn:hover{transform:translate(-1px,-1px);background:#C2410C;box-shadow:5px 5px 0 #FED7AA}
.btn.ghost{
  color:var(--color-primary);
  background:#fff;
  border-color:var(--line);
  box-shadow:3px 3px 0 #CCFBF1;
}
.btn.ghost:hover{background:#F0FDFA;border-color:var(--color-primary)}
.btn .material-symbols-outlined{font-size:18px}
.kpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
  margin-bottom:18px;
}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi,.card{
  min-width:0;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:12px;
  box-shadow:var(--shadow);
}
.kpi{
  position:relative;
  padding:18px;
  overflow:hidden;
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.kpi::after{
  content:"";
  position:absolute;
  right:-20px;
  bottom:-28px;
  width:80px;
  height:80px;
  border:12px solid #CCFBF1;
  border-radius:50%;
  opacity:.65;
}
.kpi:hover{transform:translateY(-3px);border-color:var(--color-primary);box-shadow:var(--shadow-hover)}
.kpi .l{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:11px;
  font-weight:700;
}
.kpi .l .material-symbols-outlined{color:var(--color-primary);font-size:18px}
.kpi .v{
  position:relative;
  z-index:1;
  margin-top:10px;
  color:var(--ink);
  font-size:27px;
  font-weight:700;
  letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;
}
.kpi .v small{color:var(--muted);font-size:12px;font-weight:600}
.kpi .d{position:relative;z-index:1;margin-top:7px;font-size:11px;font-weight:700}
.up{color:#166534}
.down{color:var(--red)}
.grid{display:grid;gap:18px;min-width:0}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,1.55fr)}
.card{padding:20px}
.card>h3{
  margin:0 0 17px;
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--ink);
  font-size:14px;
  font-weight:700;
}
.card>h3 .material-symbols-outlined{
  width:30px;
  height:30px;
  display:grid;
  place-items:center;
  color:var(--color-primary);
  background:#F0FDFA;
  border-radius:7px;
  font-size:19px;
}
.card>h3 .grow{
  margin-left:auto;
  color:var(--color-primary);
  font-size:11px;
  font-weight:700;
}
.chart-box{position:relative;width:100%;height:280px}
.chart-box.sm{height:220px}
.table-scroll{overflow-x:auto}
.tbl{
  width:100%;
  border-spacing:0;
  border-collapse:separate;
  font-size:12px;
}
.tbl th{
  padding:11px 12px;
  color:#3F5967;
  background:#F0FDFA;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  text-align:left;
  font-size:10px;
  font-weight:700;
  letter-spacing:.06em;
  white-space:nowrap;
}
.tbl th:first-child{border-left:1px solid var(--line);border-radius:7px 0 0 7px}
.tbl th:last-child{border-right:1px solid var(--line);border-radius:0 7px 7px 0}
.tbl td{
  padding:12px;
  border-bottom:1px solid #DCEBE9;
  color:#334155;
  white-space:nowrap;
  transition:background-color .2s ease;
}
.tbl tbody tr:hover td{background:#F8FFFE}
.tbl td b{color:var(--ink);font-weight:700}
.tbl td:nth-child(4),
.tbl td:nth-child(6){text-align:right;font-variant-numeric:tabular-nums}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:10px;
  font-weight:700;
  white-space:nowrap;
}
.tag::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.t-hot{color:#B91C1C;background:#FEF2F2}
.t-warm{color:#92400E;background:#FFFBEB}
.t-cold{color:#1D4ED8;background:#EFF6FF}
.t-won{color:#166534;background:#F0FDF4}
.t-lost{color:#475569;background:#F1F5F9}
.t-open{color:#854D0E;background:#FEFCE8}
.board{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px}
.col{
  min-width:0;
  padding:10px;
  background:#F5FCFB;
  border:1px solid var(--line);
  border-radius:10px;
}
.col-h{margin:2px 3px 8px;display:flex;align-items:center;justify-content:space-between}
.col-h b{color:var(--ink);font-size:12px;font-weight:700}
.col-h .n{
  min-width:24px;
  padding:2px 7px;
  color:#fff;
  background:var(--color-primary);
  border-radius:999px;
  text-align:center;
  font-size:10px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.col-sum{margin:0 3px 9px;color:var(--muted);font-size:10px;font-weight:600}
.deal{
  margin-bottom:8px;
  padding:11px;
  background:#fff;
  border:1px solid #CDE8E4;
  border-left:3px solid var(--color-primary);
  border-radius:8px;
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.deal:hover{transform:translateY(-2px);border-color:var(--color-primary);box-shadow:0 8px 18px rgba(15,118,110,.12)}
.deal b{display:block;color:var(--ink);font-size:11px;font-weight:700}
.deal .amt{
  margin:7px 0 5px;
  color:#0F766E;
  font-size:14px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.deal .mt{display:flex;align-items:center;justify-content:space-between;gap:5px;color:var(--muted);font-size:9px}
.deal .who{display:inline-flex;align-items:center;gap:5px}
.av{
  width:20px;
  height:20px;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--ink);
  border-radius:5px;
  font-size:9px;
  font-weight:700;
}
.prob{height:5px;margin-top:8px;overflow:hidden;background:#DDEDEA;border-radius:999px}
.prob span{display:block;height:100%;background:var(--color-primary);border-radius:inherit}
.prob-label{margin-top:5px;color:var(--muted);font-size:9px;text-align:right;font-variant-numeric:tabular-nums}
.prof{display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.prof .big{
  width:62px;
  height:62px;
  display:grid;
  place-items:center;
  flex:none;
  color:#fff;
  background:var(--color-primary);
  border-radius:12px;
  font-size:23px;
  font-weight:700;
  box-shadow:5px 5px 0 #CCFBF1;
}
.prof .nm b{color:var(--ink);font-size:19px;font-weight:700}
.prof .nm div{margin-top:4px;color:var(--muted);font-size:11px}
.chips{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.chip{
  padding:5px 9px;
  color:#0F766E;
  background:#F0FDFA;
  border:1px solid var(--line);
  border-radius:999px;
  font-size:10px;
  font-weight:700;
}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:17px}
.fact{padding:12px;background:#F5FCFB;border-left:3px solid var(--color-secondary);border-radius:7px}
.fact small{color:var(--muted);font-size:10px;font-weight:600}
.fact b{
  display:block;
  margin-top:4px;
  color:var(--ink);
  font-size:15px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;top:5px;bottom:5px;left:8px;width:1px;background:var(--line)}
.tl-item{position:relative;padding:0 0 18px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{
  position:absolute;
  top:3px;
  left:-23px;
  width:13px;
  height:13px;
  background:#fff;
  border:3px solid var(--color-primary);
  border-radius:50%;
}
.tl-item.g .tl-dot{border-color:var(--green)}
.tl-item.b .tl-dot{border-color:var(--blue)}
.tl-item.a .tl-dot{border-color:var(--amber)}
.tl-item p{margin:0;color:#334155;font-size:12px;line-height:1.6}
.tl-item p b{color:var(--ink)}
.tl-item small{color:var(--muted);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10px}
.act{display:flex;gap:11px;padding:12px 0;border-top:1px solid #DCEBE9}
.act:first-of-type{border-top:0}
.act-ic{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  flex:none;
  border:1px solid currentColor;
  border-radius:8px;
}
.act-ic .material-symbols-outlined{font-size:18px}
.ic-g{color:#166534;background:#F0FDF4}
.ic-a{color:#92400E;background:#FFFBEB}
.ic-b{color:#1D4ED8;background:#EFF6FF}
.ic-r{color:#B91C1C;background:#FEF2F2}
.act p{margin:0;color:#334155;font-size:11px;line-height:1.6}
.act p b{color:var(--ink)}
.act small{color:var(--muted);font-size:9px}
.cal{
  display:grid;
  grid-template-columns:58px repeat(5,minmax(105px,1fr));
  min-width:640px;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:9px;
}
.cal .hd{
  padding:10px 4px;
  color:var(--ink);
  background:#F0FDFA;
  border-bottom:1px solid var(--line);
  text-align:center;
  font-size:10px;
  font-weight:700;
}
.cal .hd small{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:9px;
  font-weight:500;
}
.cal .tm{
  padding:7px;
  color:var(--muted);
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  text-align:right;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:9px;
  font-weight:600;
}
.cal .cell{min-height:54px;padding:5px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.ev{
  margin-bottom:3px;
  padding:5px 6px;
  color:#fff;
  border-left:3px solid rgba(255,255,255,.75);
  border-radius:5px;
  font-size:9px;
  font-weight:700;
  line-height:1.35;
}
.ev.call{background:#0F766E}
.ev.meet{background:#1D4ED8}
.ev.demo2{background:#15803D}
.ev.task{color:#451A03;background:#FDBA74;border-left-color:#9A3412}
.task-l{margin:0;padding:0;list-style:none}
.task-l li{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid #DCEBE9;font-size:11px}
.task-l li:first-child{border-top:0}
.ck{
  width:19px;
  height:19px;
  display:grid;
  place-items:center;
  flex:none;
  color:#fff;
  border:2px solid var(--color-primary);
  border-radius:5px;
}
.ck.done{background:var(--color-primary)}
.ck .material-symbols-outlined{font-size:13px}
.task-l li.d .tx{text-decoration:line-through;color:var(--muted)}
.task-l .tx{flex:1;min-width:0}
.task-l li b{color:var(--ink)}
.due{
  padding:3px 7px;
  color:#0F766E;
  background:#ECFDF5;
  border:1px solid #A7F3D0;
  border-radius:999px;
  font-size:9px;
  font-weight:700;
  white-space:nowrap;
}
.due.late{color:#B91C1C;background:#FEF2F2;border-color:#FECACA}
.funnel{display:flex;flex-direction:column;gap:8px}
.fn{
  min-width:164px;
  height:44px;
  margin:auto;
  padding:0 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  color:#fff;
  border-radius:6px;
  font-size:11px;
  font-weight:700;
}
.fn small{font-size:9px;font-weight:600}
.rank{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid #DCEBE9}
.rank:first-of-type{border-top:0}
.rank .no{
  width:27px;
  height:27px;
  display:grid;
  place-items:center;
  flex:none;
  color:#0F766E;
  background:#F0FDFA;
  border:1px solid var(--line);
  border-radius:6px;
  font-size:11px;
  font-weight:700;
}
.rank .no.top{color:#fff;background:var(--color-primary);border-color:var(--color-primary)}
.rank .nm{flex:1;min-width:0}
.rank .nm b{color:var(--ink);font-size:11px}
.rank .nm .bar{height:6px;margin-top:6px;overflow:hidden;background:#DDEDEA;border-radius:999px}
.rank .nm .bar span{display:block;height:100%;background:var(--color-primary)}
.rank .val{color:var(--ink);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.srcs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.src{
  padding:14px;
  background:#F5FCFB;
  border:1px solid var(--line);
  border-top:3px solid var(--color-primary);
  border-radius:8px;
  transition:transform .2s ease,border-color .2s ease;
}
.src:hover{transform:translateY(-2px);border-color:var(--color-primary)}
.src b{display:flex;align-items:center;gap:7px;color:var(--ink);font-size:11px}
.src b .material-symbols-outlined{color:var(--color-primary);font-size:18px}
.src .n{margin:8px 0 3px;color:var(--ink);font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.src .r2{color:#166534;font-size:10px;font-weight:700}
.note{color:var(--muted);font-size:10px;line-height:1.7}
.view-enter>*{animation:grid-in .4s both cubic-bezier(.2,.8,.2,1)}
.view-enter>*:nth-child(2){animation-delay:.05s}
.view-enter>*:nth-child(3){animation-delay:.1s}

     <ul class="task-l">
     ${TASKS.map(t=>`<li class="${t[0]?"d":""}"><span class="ck ${t[0]?"done":""}" aria-label="${t[0]?"已完成":"未完成"}">${t[0]?'<span class="material-symbols-outlined" aria-hidden="true">check</span>':""}</span><span class="tx"><b>${t[1]}</b><br><small style="color:var(--muted)">${t[2]}</small></span><span class="due ${t[4]?"late":""}">${t[3]}</span></li>`).join("")}
     </ul>
     <div class="act" style="margin-top:6px"><div class="act-ic ic-a"><span class="material-symbols-outlined" aria-hidden="true">notifications_active</span></div><p><b>3 筆跟進今日到期</b>，1 筆已逾期，建議優先處理O暘商機。</p></div>
   </div>
 </div>`;
}

function s5(){
 return head(5,'<button type="button" class="btn ghost"><span class="material-symbols-outlined" aria-hidden="true">download</span>匯出報表</button>')+
 `<div class="kpis k3">
   <div class="kpi"><div class="l"><span class="material-symbols-outlined" aria-hidden="true">flag</span>季度目標</div><div class="v">${wan(15000000)}</div><div class="d up">Q3 業績目標</div></div>
   <div class="kpi"><div class="l"><span class="material-symbols-outlined" aria-hidden="true">trending_up</span>加權預測</div><div class="v">${wan(13800000)}</div><div class="d up">▲ 達成率 92%</div></div>
   <div class="kpi"><div class="l"><span class="material-symbols-outlined" aria-hidden="true">emoji_events</span>已成交</div><div class="v">${wan(9400000)}</div><div class="d up">▲ 進度 63%</div></div>
 </div>
 <div class="grid g2">
   <div class="card"><h3><span class="material-symbols-outlined" aria-hidden="true">filter_alt</span>銷售漏斗</h3>
     <div class="funnel">
       ${[["接觸名單",100,"#0F766E",620],["合格商機",82,"#0D9488",384],["方案報價",66,"#0F766E",254],["議約談判",50,"#115E59",161],["成交",36,"#134E4A",112]].map(f=>`<div class="fn" style="width:${f[1]}%;background:${f[2]}">${f[0]}<small>${f[3]} 筆</small></div>`).join("")}
     </div>
     <div class="note" style="margin-top:12px">整體轉換率 18%，議約→成交環節轉換 70%，接觸→合格為主要流失點，建議加強名單品質篩選。</div>
   </div>
   <div class="card"><h3><span class="material-symbols-outlined" aria-hidden="true">stacked_line_chart</span>目標 vs 實際 vs 預測</h3><div class="chart-box"><canvas id="c5a" role="img" aria-label="季度業績目標、實際與預測趨勢圖"></canvas></div></div>
 </div>
 <div class="grid g2" style="margin-top:18px">
   <div class="card"><h3><span class="material-symbols-outlined" aria-hidden="true">leaderboard</span>業務排行榜</h3>
     ${RANK.map((r,i)=>`<div class="rank"><span class="no ${i===0?"top":""}">${i+1}</span><div class="nm"><b>${r[0]}</b><div class="bar" role="progressbar" aria-label="${r[0]} 目標達成率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${r[2]}"><span style="width:${r[2]}%"></span></div></div><span class="val">${wan(r[1])} · ${r[2]}%</span></div>`).join("")}
   </div>
   <div class="card"><h3><span class="material-symbols-outlined" aria-hidden="true">radar</span>團隊能力雷達</h3><div class="chart-box"><canvas id="c5b" role="img" aria-label="張美玲與團隊平均能力雷達圖"></canvas></div></div>
 </div>`;
}

const SCREENS=[s0,s1,s2,s3,s4,s5];
let charts=[];
const TEAL="#0D9488";
const DARK_TEAL="#115E59";
const ORANGE="#EA580C";
const GRID="#D6E7E4";
const MUTE="#475569";

function destroyCharts(){
 charts.forEach(c=>{try{c.destroy()}catch(e){}});
 charts=[];
}
function mk(id,cfg){
 const node=document.getElementById(id);
 if(!node||!window.Chart)return;
 charts.push(new Chart(node,cfg));
}
if(window.Chart){
 Chart.defaults.font.family='"Plus Jakarta Sans","Microsoft JhengHei",sans-serif';
 Chart.defaults.color=MUTE;
}

function drawCharts(i){
 destroyCharts();
 if(!window.Chart)return;
 if(i===0){
   mk("c0a",{
     type:"line",
     data:{labels:["3月","4月","5月","6月","7月","8月"],datasets:[
       {label:"成交金額(萬)",data:[720,850,910,1040,1180,1320],borderColor:TEAL,backgroundColor:"rgba(13,148,136,.12)",fill:true,tension:.35,borderWidth:3,pointRadius:3},
       {label:"目標(萬)",data:[800,850,900,1000,1100,1250],borderColor:ORANGE,borderDash:[6,4],borderWidth:2,pointRadius:0,tension:.3}
     ]},
     options:baseOpts(true)
   });
   mk("c0b",{
     type:"doughnut",
     data:{labels:STAGES,datasets:[{
       data:STAGES.map((_,s)=>DEALS.filter(d=>d.stage===s).reduce((a,d)=>a+d.amt/10000,0)),
       backgroundColor:["#CCFBF1","#5EEAD4","#14B8A6","#0D9488","#115E59"],
       borderWidth:3,
       borderColor:"#FFFFFF"
     }]},
     options:{maintainAspectRatio:false,responsive:true,cutout:"62%",plugins:{legend:{position:"right",labels:{boxWidth:12,padding:11,font:{size:10}}}}}
   });
 }else if(i===1){
   mk("c1a",{
     type:"bar",
     data:{labels:STAGES,datasets:[
       {label:"商機數",data:STAGES.map((_,s)=>DEALS.filter(d=>d.stage===s).length),backgroundColor:TEAL,borderRadius:5},
       {label:"平均贏率%",data:[18,38,58,78,100],type:"line",borderColor:ORANGE,borderWidth:3,pointRadius:3,yAxisID:"y1",tension:.3}
     ]},
     options:{maintainAspectRatio:false,responsive:true,plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:10}}}},scales:{x:{grid:{display:false}},y:{beginAtZero:true,grid:{color:GRID}},y1:{position:"right",max:100,grid:{display:false}}}}
   });
 }else if(i===3){
   mk("c3a",{
     type:"bar",
     data:{labels:CAMP.map(c=>c[0]),datasets:[{label:"ROI 倍數",data:[3.9,5.2,2.8,4.1,6.5],backgroundColor:CAMP.map((_,i)=>i===4?ORANGE:TEAL),borderRadius:5}]},
     options:{maintainAspectRatio:false,responsive:true,indexAxis:"y",plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,grid:{color:GRID}},y:{grid:{display:false}}}}
   });
 }else if(i===5){
   mk("c5a",{
     type:"line",
     data:{labels:["第1週","第2週","第3週","第4週","第5週","第6週"],datasets:[
       {label:"目標(萬)",data:[250,500,750,1000,1250,1500],borderColor:MUTE,borderDash:[5,4],borderWidth:2,pointRadius:0,tension:.2},
       {label:"實際(萬)",data:[230,470,700,880,940,940],borderColor:TEAL,backgroundColor:"rgba(13,148,136,.12)",fill:true,borderWidth:3,pointRadius:3,tension:.3},
       {label:"預測(萬)",data:[null,null,null,null,1160,1380],borderColor:ORANGE,borderDash:[3,3],borderWidth:3,pointRadius:3,tension:.3}
     ]},
     options:baseOpts(true)
   });
   mk("c5b",{
     type:"radar",
     data:{labels:["開發","跟進","報價","談判","結案","服務"],datasets:[
       {label:"張美玲",data:[9,8,7,9,10,8],borderColor:TEAL,backgroundColor:"rgba(13,148,136,.16)",borderWidth:2,pointRadius:2},
       {label:"團隊平均",data:[7,7,6,6,7,7],borderColor:ORANGE,backgroundColor:"rgba(234,88,12,.08)",borderWidth:2,pointRadius:2}
     ]},
     options:{maintainAspectRatio:false,responsive:true,plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:10}}}},scales:{r:{beginAtZero:true,max:10,grid:{color:GRID},angleLines:{color:GRID},pointLabels:{font:{size:10},color:MUTE},ticks:{display:false}}}}
   });
 }
}
function baseOpts(legend){
 return {
   maintainAspectRatio:false,
   responsive:true,
   interaction:{mode:"index",intersect:false},
   plugins:{legend:{display:!!legend,position:"bottom",labels:{boxWidth:12,padding:12,font:{size:10}}}},
   scales:{x:{grid:{display:false}},y:{beginAtZero:true,grid:{color:GRID}}}
 };
}

function show(i){
 const index=Math.max(0,Math.min(Number(i)||0,SCREENS.length-1));
 nav.querySelectorAll("button[data-i]").forEach(b=>{
   const active=Number(b.dataset.i)===index;
   b.classList.toggle("on",active);
   b.setAttribute("aria-current",active?"page":"false");
 });
 view.classList.remove("view-enter");
 view.innerHTML=SCREENS[index]();
 void view.offsetHeight;
 view.classList.add("view-enter");
 drawCharts(index);
}

nav.addEventListener("click",e=>{
 const button=e.target.closest("button[data-i]");
 if(!button)return;
 const index=Number(button.dataset.i);
 const nextHash="#v"+index;
 if(location.hash===nextHash)show(index);
 else location.hash=nextHash;
});
window.addEventListener("resize",()=>{
 charts.forEach(c=>{try{c.resize()}catch(e){}});
});
function fromHash(){
 const match=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
 const index=match?Math.min(Number(match[1]),MODS.length-1):0;
 show(index);
 try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
</body>
</html>
