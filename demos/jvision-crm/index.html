</style>

function destroyCharts(){ charts.forEach(c=>{try{c.destroy();}catch(e){}}); charts=[]; }
function mk(id,cfg){ const el=document.getElementById(id); if(!el||!window.Chart) return; charts.push(new Chart(el,cfg)); }

// ---- controller ----
function show(i){
 nav.querySelectorAll("button[data-i]").forEach(b=>b.classList.toggle("on",+b.dataset.i===i));

 void view.offsetHeight;
 drawCharts(i);
}

show(0);
