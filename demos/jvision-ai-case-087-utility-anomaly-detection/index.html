<style>
:root{
  --color-primary:#059669;--color-on-primary:#000;
  --color-secondary:#10b981;--color-on-secondary:#0f172a;
  --color-accent:#059669;--color-on-accent:#000;
  --color-background:#ecfdf5;--color-foreground:#064e3b;
  --color-card:#fff;--color-card-foreground:#064e3b;
  --color-muted:#e8f1f3;--color-muted-foreground:#475569;
  --color-border:#a7f3d0;--color-destructive:#dc2626;
  --color-on-destructive:#fff;--color-ring:#059669;
  --blue:#059669;--ink:#064e3b;--muted:#475569;--line:#a7f3d0;

*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(rgba(5,150,105,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(5,150,105,.1) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font-family:"Fira Sans",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit}
button,[role=button]{cursor:pointer}
button:focus-visible,[role=button]:focus-visible{outline:4px solid var(--color-ring);outline-offset:3px}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:500;font-style:normal;line-height:1;vertical-align:middle;font-size:20px}
.wrap{max-width:1440px;margin:auto;padding:16px}
.top{display:flex;align-items:center;gap:18px;min-width:0;padding:17px 20px;background:var(--ink);color:#fff;border:3px solid #000;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{width:48px;height:48px;display:grid;place-items:center;flex:none;background:var(--color-secondary);color:#000;border:3px solid #000}
.logo .material-symbols-outlined{font-size:29px}

.live{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none;padding:8px 11px;background:#fff;color:#052e2b;border:2px solid #000;font:700 12px "Fira Code",monospace}
.dot{width:10px;height:10px;background:#10b981;border:2px solid #000;animation:pulse 1.8s infinite}
@keyframes pulse{50%{transform:scale(.65);opacity:.5}}
.shell{display:grid;grid-template-columns:238px minmax(0,1fr);gap:18px;margin-top:18px;align-items:start}
.side{position:sticky;top:16px;padding:10px;background:var(--panel);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
.sh{padding:8px 9px 7px;color:var(--muted);font:700 11px "Fira Code",monospace;letter-spacing:.12em;text-transform:uppercase}
nav{display:flex;flex-direction:column;gap:6px}
.nav-btn{display:grid;grid-template-columns:24px 22px 1fr;align-items:center;gap:9px;width:100%;min-height:46px;padding:9px;border:2px solid transparent;background:#fff;color:var(--ink);text-align:left;font-size:13px;font-weight:700}
.nav-btn:hover{border-color:var(--ink);background:var(--soft)}
.nav-btn.on{border-color:#000;background:var(--color-secondary);color:#032d23;box-shadow:3px 3px 0 #000}

.nav-btn.on .idx{background:#fff;color:#000}
.tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{min-width:0}
.card,.kpi,.diag{min-width:0;background:var(--panel);border:2px solid var(--ink);box-shadow:4px 4px 0 rgba(6,78,59,.9)}
.pad,.diag{padding:15px}
.scr-head{display:flex;align-items:flex-start;gap:12px;margin:0 0 15px;padding:14px;background:var(--color-secondary);border:3px solid #000;box-shadow:5px 5px 0 #000}
.scr-head .ic,.detail-ic{width:43px;height:43px;display:grid;place-items:center;flex:none;background:#fff;color:#000;border:2px solid #000}
.scr-head h2{margin:0;font-size:21px;font-weight:800;letter-spacing:-.03em}
.scr-head p{margin:3px 0 0;color:#064e3b;font-size:12.5px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border:2px solid currentColor;background:#fff;font:700 10.5px "Fira Code",monospace}
.pill::before{content:"";width:7px;height:7px;background:currentColor;border:1px solid #000}
.pill.g{color:#047857}.pill.a{color:#8a4700}.pill.r{color:#b91c1c}.pill.b{color:#1d4ed8}.pill.c{color:#047857}
.kpis,.kpis3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpis3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{position:relative;overflow:hidden;padding:13px}
.kpi::before{content:"";position:absolute;right:0;top:0;width:34px;height:8px;background:var(--color-secondary);border-left:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.kpi .l{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11.5px;font-weight:700}
.kpi .v{margin-top:7px;font:700 25px "Fira Code",monospace;letter-spacing:-.06em}
.kpi .v small{margin-left:4px;color:var(--muted);font:600 11px "Fira Code",monospace;letter-spacing:0}
.kpi .d{margin-top:5px;font-size:11px;font-weight:700}
.up{color:var(--bad)}.down{color:var(--ok)}
.g2,.g3,.split{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.split{grid-template-columns:350px minmax(0,1fr)}
.mt14{margin-top:14px}
.sect-t{display:flex;align-items:center;gap:8px;margin:0 0 11px;padding-bottom:8px;border-bottom:2px solid var(--ink);font-size:13px;font-weight:800}
.sect-t .material-symbols-outlined{color:var(--blue)}
.lst{display:flex;flex-direction:column;gap:8px;max-height:570px;padding:2px 4px 5px 2px;overflow:auto}
.lrow{padding:10px;background:#fff;border:2px solid var(--line);min-width:0}
.lrow:hover{border-color:var(--ink);background:var(--soft)}
.lrow.on{border-color:#000;background:#d1fae5;box-shadow:3px 3px 0 #000}
.lrow .t{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800}
.lrow .m{display:flex;gap:9px;flex-wrap:wrap;margin-top:5px;color:var(--muted);font:500 10.5px "Fira Code",monospace}
.spark{height:33px;margin-top:6px}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:12px}
th,td{padding:10px;text-align:left;border:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--ink);color:#fff;font:700 10.5px "Fira Code",monospace;letter-spacing:.04em}

td:nth-child(n+3){font-variant-numeric:tabular-nums}
.mono{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:9px;min-width:60px;overflow:hidden;background:var(--soft);border:1px solid var(--ink)}
.bar>i{display:block;height:100%;background:var(--blue)}
.chart{width:100%;height:290px}.chart.sm{height:230px}
.board{display:grid;grid-template-columns:repeat(4,minmax(205px,1fr));gap:11px}
.col{padding:9px;background:var(--soft);border:2px solid var(--ink)}
.col h4{display:flex;align-items:center;justify-content:space-between;margin:0 0 9px;font-size:12px;font-weight:800}
.cnt{padding:2px 7px;background:#fff;border:2px solid var(--ink);font:700 10px "Fira Code",monospace}
.tk{margin-bottom:8px;padding:10px;background:#fff;border:2px solid var(--ink)}
.tk .tt{font-size:12px;font-weight:800}.tk .tm{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.tk .who{display:inline-flex;align-items:center;gap:6px;margin-top:7px;color:var(--ink);font-size:10.5px;font-weight:700}
.av{width:21px;height:21px;display:grid;place-items:center;background:var(--color-secondary);border:1px solid #000;font-weight:800}
.edge{border-left:7px solid var(--blue)}.edge.r{border-left-color:var(--bad)}.edge.a{border-left-color:var(--warn)}.edge.b{border-left-color:var(--info)}
.gauge-wrap{display:flex;align-items:center;gap:14px}.big{font:700 34px "Fira Code",monospace}
.stat-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--muted);font-size:12px}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:11px;font-weight:600}
.leg span{display:inline-flex;align-items:center;gap:6px}.sw{width:12px;height:12px;display:inline-block;border:1px solid #000}
.saving{display:flex;flex-direction:column;gap:10px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px;border:2px solid var(--ink);background:#fff}
.srow .n{font-size:12.5px;font-weight:800}.srow .sub{margin-top:3px;color:var(--muted);font-size:10.5px}
.srow .amt{text-align:right;color:var(--ok);font:700 14px "Fira Code",monospace;white-space:nowrap}
.tag{display:inline-block;padding:2px 6px;background:var(--soft);border:1px solid var(--muted);color:#334155;font:600 10px "Fira Code",monospace}
.foot{text-align:center;color:var(--muted);font:500 10.5px "Fira Code",monospace;padding:20px 8px 8px}
.grid-item,.kpi,.card,.diag{animation:arrive .4s both cubic-bezier(.2,.8,.2,1)}
.kpis>:nth-child(2),.g2>:nth-child(2){animation-delay:.06s}.kpis>:nth-child(3){animation-delay:.12s}.kpis>:nth-child(4){animation-delay:.18s}
@keyframes arrive{from{opacity:0;transform:translateY(16px) scale(.96)}}
@media(max-width:1024px){.shell{grid-template-columns:210px minmax(0,1fr)}.split{grid-template-columns:300px minmax(0,1fr)}.board{grid-template-columns:repeat(2,minmax(210px,1fr))}}
@media(max-width:768px){.shell{grid-template-columns:1fr}.side{position:static}nav{display:grid;grid-template-columns:repeat(3,1fr)}.nav-btn{grid-template-columns:24px 20px 1fr}.kpis,.kpis3{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g3,.split{grid-template-columns:1fr}.live{display:none}}
@media(max-width:480px){.wrap{padding:9px}.top{padding:13px}.brand h1{font-size:18px}.brand p{font-size:10.5px}.logo{width:42px;height:42px}nav{grid-template-columns:repeat(3,1fr)}.nav-btn{display:flex;justify-content:center}.nav-btn .tx,.nav-btn>.material-symbols-outlined{display:none}.kpis,.kpis3{grid-template-columns:1fr 1fr}.kpi .v{font-size:21px}.scr-head h2{font-size:18px}.pad,.diag{padding:11px}.srow{grid-template-columns:1fr}.srow .amt{text-align:left}.board{grid-template-columns:repeat(4,215px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

 mk(document.getElementById("s0chart"),ext({tooltip:{trigger:"axis"},xAxis:{type:"category",data:["-6h","-5h","-4h","-3h","-2h","-1h","現在"]},yAxis:{type:"value",scale:true,splitLine:{lineStyle:{color:"#a7f3d0"}}},series:[{name:"實測",type:"line",data:sel.trend,symbol:"rect",symbolSize:7,lineStyle:{width:3},areaStyle:{color:"rgba(5,150,105,.13)"}},{name:"基線",type:"line",data:sel.trend.map(function(){return sel.base}),symbol:"none",lineStyle:{width:2,type:"dashed",color:"#475569"}}]}));
