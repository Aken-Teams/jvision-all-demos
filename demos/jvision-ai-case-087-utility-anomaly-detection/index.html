<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>水電異常偵測儀｜Jvision 系統 Demo</title>
<meta name="description" content="自動偵測水電異常、尖峰與節能機會的單一平台" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --c:#0891b2;--c2:#22d3ee;--ink:#0e2a33;--sub:#5a7883;
  --bg:#eef4f6;--panel:#ffffff;--line:#dbe7ea;--soft:#f4f9fb;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#2563eb;
  --shadow:0 1px 2px rgba(9,60,72,.06),0 8px 24px rgba(9,60,72,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:radial-gradient(1200px 600px at 100% -10%,#dff3f7 0,transparent 60%),var(--bg);
  color:var(--ink);-webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;font-size:20px}
.wrap{max-width:1360px;margin:0 auto;padding:16px}
/* top bar */
.top{display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,#083b46,#0891b2 55%,#0e7490);color:#fff;border-radius:18px;padding:16px 20px;box-shadow:var(--shadow);min-width:0}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none;border:1px solid rgba(255,255,255,.25)}
.logo .material-symbols-outlined{font-size:26px}
.brand h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.3px}
.brand p{margin:2px 0 0;font-size:12px;opacity:.85;font-weight:500}
.top .live{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;background:rgba(255,255,255,.14);padding:7px 12px;border-radius:999px;flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 0 rgba(74,222,128,.7);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.6)}70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
/* layout */
.shell{display:grid;grid-template-columns:230px 1fr;gap:16px;margin-top:16px;align-items:start}
.side{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:var(--shadow);position:sticky;top:16px;min-width:0}
.side .sh{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:1px;padding:8px 10px 4px}
nav{display:flex;flex-direction:column;gap:4px}
.nav-btn{display:flex;align-items:center;gap:11px;border:1px solid transparent;background:transparent;color:var(--ink);text-align:left;padding:11px 12px;border-radius:12px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;transition:.15s;min-width:0}
.nav-btn .idx{width:22px;height:22px;border-radius:7px;background:var(--soft);color:var(--sub);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.nav-btn:hover{background:var(--soft)}
.nav-btn.on{background:linear-gradient(120deg,#e0f7fc,#f0fbfe);border-color:var(--c2);color:#075e6e}
.nav-btn.on .idx{background:var(--c);color:#fff}
.nav-btn .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{min-width:0}
/* generic cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0}
.pad{padding:16px}
.scr-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px;min-width:0}
.scr-head .ic{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;display:grid;place-items:center;flex:none}
.scr-head h2{margin:0;font-size:19px;font-weight:800}
.scr-head p{margin:3px 0 0;font-size:12.5px;color:var(--sub);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.pill.g{background:#dcfce7;color:#166534}.pill.a{background:#fef3c7;color:#92400e}.pill.r{background:#fee2e2;color:#991b1b}.pill.b{background:#dbeafe;color:#1e40af}.pill.c{background:#cffafe;color:#0e7490}
/* kpi grid */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpis3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);min-width:0;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-10px;top:-10px;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle,var(--c2),transparent 70%);opacity:.16}
.kpi .l{font-size:12px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:26px;font-weight:900;margin-top:6px;letter-spacing:-.5px}
.kpi .v small{font-size:13px;font-weight:700;color:var(--sub);margin-left:3px}
.kpi .d{font-size:11.5px;font-weight:700;margin-top:4px}
.up{color:var(--bad)}.down{color:var(--ok)}
/* grids */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.split{display:grid;grid-template-columns:340px 1fr;gap:14px}
.mt14{margin-top:14px}
.sect-t{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;margin:0 0 10px}
.sect-t .material-symbols-outlined{color:var(--c);font-size:20px}
/* list pane */
.lst{display:flex;flex-direction:column;gap:8px;max-height:560px;overflow:auto}
.lrow{border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;transition:.15s;background:var(--panel);min-width:0}
.lrow:hover{border-color:var(--c2);background:var(--soft)}
.lrow.on{border-color:var(--c);background:linear-gradient(120deg,#ecfbfe,#fff);box-shadow:0 0 0 2px rgba(34,211,238,.25)}
.lrow .t{font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:7px}
.lrow .m{font-size:11.5px;color:var(--sub);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.spark{height:34px;margin-top:8px}
/* table */
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
th,td{padding:10px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;color:var(--sub);font-weight:700;letter-spacing:.4px;background:var(--soft);position:sticky;top:0}
tbody tr:hover{background:var(--soft)}
.mono{font-variant-numeric:tabular-nums;font-weight:700}
.bar{height:7px;border-radius:99px;background:#e6eff2;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--c),var(--c2))}
/* chart box */
.chart{width:100%;height:290px}
.chart.sm{height:230px}
/* board / kanban */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.col{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
.col h4{margin:0 0 9px;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
.col h4 .cnt{background:#fff;border:1px solid var(--line);border-radius:99px;font-size:11px;padding:1px 8px;color:var(--sub)}
.tk{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:8px;box-shadow:0 1px 2px rgba(9,60,72,.05)}
.tk .tt{font-size:12.5px;font-weight:800}
.tk .tm{font-size:11px;color:var(--sub);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
.tk .who{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;margin-top:7px;color:#075e6e}
.av{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;display:grid;place-items:center;font-size:10px;font-weight:800}
.edge{border-left:3px solid var(--c)}
.edge.r{border-left-color:var(--bad)}.edge.a{border-left-color:var(--warn)}.edge.b{border-left-color:var(--info)}
/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:0 0 16px 6px}
.tl .ev::before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--c)}
.tl .ev.r::before{border-color:var(--bad)}.tl .ev.a::before{border-color:var(--warn)}.tl .ev.g::before{border-color:var(--ok)}
.tl .ev .h{font-size:12.5px;font-weight:800}
.tl .ev .s{font-size:11.5px;color:var(--sub);margin-top:3px}
.tl .ev .ti{font-size:11px;color:var(--c);font-weight:700}
/* diagnostic cards */
.diag{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--panel);min-width:0}
.gauge-wrap{display:flex;align-items:center;gap:14px}
.big{font-size:34px;font-weight:900;letter-spacing:-1px}
.stat-row{display:flex;justify-content:space-between;font-size:12.5px;padding:7px 0;border-bottom:1px dashed var(--line)}
.stat-row b{font-weight:800}
/* matrix */
.matrix{display:grid;grid-template-columns:90px repeat(6,1fr);gap:5px;min-width:520px}
.matrix .hd{font-size:10.5px;font-weight:700;color:var(--sub);display:grid;place-items:center;padding:5px 0}
.cell{height:36px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#083b46}
.rowlab{font-size:11px;font-weight:700;display:grid;place-items:center;color:var(--ink)}
/* legend */
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);font-weight:600;margin-top:10px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block}
/* progress list */
.saving{display:flex;flex-direction:column;gap:11px}
.srow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:11px 13px;min-width:0}
.srow .n{font-size:13px;font-weight:800}
.srow .sub{font-size:11px;color:var(--sub);margin-top:3px}
.srow .amt{font-size:16px;font-weight:900;color:var(--ok);text-align:right;white-space:nowrap}
.tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--soft);border:1px solid var(--line);color:var(--sub)}
.foot{text-align:center;color:var(--sub);font-size:11.5px;padding:20px 10px 8px}
@media(max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:static}
  nav{flex-direction:row;flex-wrap:wrap}
  .nav-btn{flex:none}
}
@media(max-width:820px){
  .kpis,.kpis3{grid-template-columns:1fr 1fr}
  .g2,.g3,.split,.board,.matrix{grid-template-columns:1fr}
}
@media(max-width:560px){
  .nav-btn .tx{display:none}
  .side .sh{display:none}
  .nav-btn{padding:10px}
  .top .live{display:none}
  .kpis,.kpis3{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">water_ec</span></div>
      <div style="min-width:0">
        <h1>水電異常偵測儀</h1>
        <p>自動偵測水電異常、尖峰與節能機會 · Utility Anomaly Detection</p>
      </div>
    </div>
    <div class="live"><span class="dot"></span> 即時計量 · 128 分路上線</div>
  </div>

  <div class="shell">
    <aside class="side">
      <div class="sh">功能模組</div>
      <nav id="nav"></nav>
    </aside>
    <main><div id="screen"></div>
      <div class="foot">純 UI 系統展示 · 畫面與資料皆為擬真示範 · Jvision Demo</div>
    </main>
  </div>
</div>

<script>
"use strict";
var charts=[];
function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
function mk(el,opt){if(!el)return;var c=echarts.init(el);c.setOption(opt);charts.push(c);return c;}
var BASE={grid:{left:8,right:12,top:18,bottom:6,containLabel:true},textStyle:{fontFamily:'Inter,"Noto Sans TC",sans-serif'},color:['#0891b2','#22d3ee','#f59e0b','#dc2626','#16a34a']};
function ext(o){var r={};for(var k in BASE)r[k]=BASE[k];for(var k2 in o)r[k2]=o[k2];return r;}

var MODULES=[
  {icon:"sensors",name:"即時計量監控",desc:"水電表分路即時讀值與負載監看"},
  {icon:"troubleshoot",name:"異常偵測引擎",desc:"AI 分析基線偏移、突波與漏耗"},
  {icon:"notification_important",name:"告警與派工",desc:"異常自動分級告警並指派處理"},
  {icon:"water_drop",name:"漏水漏電診斷",desc:"夜間基載比對定位管線與迴路"},
  {icon:"electric_bolt",name:"需量與尖峰管理",desc:"契約容量與尖峰負載預警"},
  {icon:"savings",name:"節能機會分析",desc:"用能標竿比對與節費建議"}
];

/* ---------- fake data ---------- */
var METERS=[
  {id:"E-A1",name:"A 棟總電表",type:"電",loc:"A 棟主配電室",now:842,unit:"kW",base:760,status:"異常",sev:"r",trend:[720,740,735,760,910,960,842],note:"午後負載較基線高 +11%"},
  {id:"W-A1",name:"A 棟總水表",type:"水",loc:"A 棟地下泵浦房",now:38.6,unit:"m³/h",base:22,status:"異常",sev:"r",trend:[20,21,22,24,30,36,38.6],note:"夜間基載未歸零疑漏水"},
  {id:"E-B2",name:"B 棟空調冰機",type:"電",loc:"B 棟頂樓機房",now:388,unit:"kW",base:360,status:"注意",sev:"a",trend:[350,355,360,362,370,381,388],note:"冰機效率略降"},
  {id:"E-C1",name:"C 棟生產線",type:"電",loc:"C 棟一樓",now:604,unit:"kW",base:610,status:"正常",sev:"g",trend:[600,608,612,605,601,606,604],note:"用電平穩"},
  {id:"W-C1",name:"C 棟製程用水",type:"水",loc:"C 棟製程區",now:14.2,unit:"m³/h",base:15,status:"正常",sev:"g",trend:[15,14,15,14.5,14,14.2,14.2],note:"用水正常"},
  {id:"E-D3",name:"D 棟辦公照明",type:"電",loc:"D 棟 3F",now:96,unit:"kW",base:70,status:"注意",sev:"a",trend:[68,70,72,70,78,90,96],note:"下班後未關燈"},
  {id:"W-B1",name:"B 棟中水回收",type:"水",loc:"B 棟中水池",now:6.1,unit:"m³/h",base:6,status:"正常",sev:"g",trend:[6,5.9,6.1,6,6.2,6,6.1],note:"回收正常"},
  {id:"E-E1",name:"E 棟資料機房",type:"電",loc:"E 棟 UPS 室",now:212,unit:"kW",base:205,status:"正常",sev:"g",trend:[205,208,210,206,209,211,212],note:"機房穩定"}
];
var ANOM=[
  {id:"AN-2419",meter:"W-A1",title:"夜間水表基載未歸零",type:"疑似漏水",score:94,dur:"6h 20m",loss:"約 118 m³",sev:"r",time:"02:14"},
  {id:"AN-2418",meter:"E-A1",title:"午後尖峰負載超基線",type:"用電突波",score:88,dur:"1h 05m",loss:"約 82 kWh",sev:"r",time:"13:40"},
  {id:"AN-2415",meter:"E-D3",title:"下班後照明未關",type:"能耗浪費",score:71,dur:"連續 4 晚",loss:"約 96 kWh",sev:"a",time:"20:10"},
  {id:"AN-2411",meter:"E-B2",title:"冰機能效係數下降",type:"設備劣化",score:63,dur:"3 天",loss:"約 5% 能耗",sev:"a",time:"11:22"},
  {id:"AN-2407",meter:"E-C1",title:"三相電流不平衡",type:"迴路異常",score:58,dur:"間歇",loss:"待評估",sev:"a",time:"09:05"}
];

/* ---------- shared render helpers ---------- */
function head(i,extra){var m=MODULES[i];return '<div class="scr-head"><div class="ic"><span class="material-symbols-outlined">'+m.icon+'</span></div><div style="min-width:0"><h2>'+m.name+'</h2><p>'+m.desc+'</p></div>'+(extra||'')+'</div>';}
function sevPill(s){var map={r:['r','危急'],a:['a','注意'],g:['g','正常'],b:['b','處理中']};var v=map[s]||map.g;return '<span class="pill '+v[0]+'">'+v[1]+'</span>';}

/* ================= SCREEN 0 : 即時計量監控 (split workspace) ================= */
function s0(){
  var selId=(s0.sel||METERS[0].id);
  var sel=null;for(var i=0;i<METERS.length;i++){if(METERS[i].id===selId)sel=METERS[i];}
  if(!sel)sel=METERS[0];
  var list="";
  for(var j=0;j<METERS.length;j++){var m=METERS[j];
    list+='<div class="lrow'+(m.id===sel.id?' on':'')+'" data-mid="'+m.id+'">'+
      '<div class="t"><span class="material-symbols-outlined" style="color:var(--c);font-size:18px">'+(m.type==="水"?"water_drop":"bolt")+'</span>'+m.name+' '+sevPill(m.sev)+'</div>'+
      '<div class="m"><span>'+m.id+'</span><span>'+m.loc+'</span><span class="mono">'+m.now+' '+m.unit+'</span></div>'+
      '<div class="spark" id="sp'+j+'"></div></div>';
  }
  var pct=Math.round(sel.now/ (sel.base||1) *100);
  var detail='<div class="card pad">'+
      '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0"><div class="ic" style="width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;display:grid;place-items:center;flex:none"><span class="material-symbols-outlined">'+(sel.type==="水"?"water_drop":"bolt")+'</span></div>'+
      '<div style="min-width:0"><div style="font-size:16px;font-weight:900">'+sel.name+' '+sevPill(sel.sev)+'</div><div style="font-size:12px;color:var(--sub);margin-top:2px">'+sel.id+' · '+sel.loc+'</div></div></div>'+
      '<div class="kpis3 mt14">'+
        '<div class="kpi"><div class="l">即時讀值</div><div class="v">'+sel.now+'<small>'+sel.unit+'</small></div><div class="d '+(sel.now>=sel.base?'up':'down')+'">基線 '+sel.base+' '+sel.unit+'</div></div>'+
        '<div class="kpi"><div class="l">相對基線</div><div class="v">'+pct+'<small>%</small></div><div class="d '+(pct>=100?'up':'down')+'">'+(pct>=100?'高於基線':'低於基線')+'</div></div>'+
        '<div class="kpi"><div class="l">狀態</div><div class="v" style="font-size:20px;padding-top:6px">'+ (sel.status) +'</div><div class="d" style="color:var(--sub)">'+sel.note+'</div></div>'+
      '</div>'+
      '<div class="sect-t mt14"><span class="material-symbols-outlined">show_chart</span>近 7 時段負載趨勢</div>'+
      '<div id="s0chart" class="chart sm"></div>'+
    '</div>';
  var kbar='<div class="kpis" style="margin-bottom:14px">'+

    sv+='<div class="srow"><div style="min-width:0"><div class="n">'+o.n+(o.done?' <span class="pill g">已導入</span>':'')+'</div><div class="sub">'+o.sub+'</div><div style="margin-top:6px"><span class="tag">'+o.tag+'</span></div></div><div class="amt">'+o.amt+'</div></div>';
  }
  return head(5)+
    '<div class="kpis">'+
      '<div class="kpi"><div class="l">年化節費潛力</div><div class="v">411<small>萬</small></div><div class="d down">已實現 42%</div></div>'+
      '<div class="kpi"><div class="l">節能機會</div><div class="v">12<small>項</small></div><div class="d" style="color:var(--sub)">已導入 4 項</div></div>'+
      '<div class="kpi"><div class="l">用能強度 EUI</div><div class="v">142<small>kWh/m²</small></div><div class="d down">同業標竿 155</div></div>'+
      '<div class="kpi"><div class="l">預估減碳</div><div class="v">218<small>tCO₂e</small></div><div class="d down">年減 8.4%</div></div>'+
    '</div>'+
    '<div class="g2 mt14">'+
      '<div class="card pad"><div class="sect-t"><span class="material-symbols-outlined">savings</span>節能機會清單（依月節費排序）</div><div class="saving">'+sv+'</div></div>'+
      '<div style="display:flex;flex-direction:column;gap:14px;min-width:0">'+
        '<div class="card pad"><div class="sect-t"><span class="material-symbols-outlined">radar</span>各棟用能標竿（vs 同業）</div><div id="s5radar" class="chart sm"></div></div>'+
        '<div class="card pad"><div class="sect-t"><span class="material-symbols-outlined">trending_down</span>累計節費趨勢</div><div id="s5trend" class="chart sm"></div></div>'+
      '</div>'+
    '</div>';
}
function s5init(){
  mk(document.getElementById('s5radar'),ext({tooltip:{},legend:{bottom:0,textStyle:{fontSize:11}},
    radar:{indicator:[{name:'A棟',max:100},{name:'B棟',max:100},{name:'C棟',max:100},{name:'D棟',max:100},{name:'E棟',max:100}],
      radius:'62%',axisName:{color:'#5a7883',fontSize:11},splitLine:{lineStyle:{color:'#e2eef1'}},splitArea:{areaStyle:{color:['#fff','#f4f9fb']}}},
    series:[{type:'radar',data:[
      {value:[88,72,90,58,84],name:'本廠用能效率',areaStyle:{color:'rgba(8,145,178,.18)'},lineStyle:{color:'#0891b2'},itemStyle:{color:'#0891b2'}},
      {value:[80,80,80,80,80],name:'同業標竿',lineStyle:{color:'#22d3ee',type:'dashed'},itemStyle:{color:'#22d3ee'}}
    ]}]}));
  mk(document.getElementById('s5trend'),ext({tooltip:{trigger:'axis',valueFormatter:function(v){return v+' 萬';}},
    xAxis:{type:'category',data:['1月','2月','3月','4月','5月','6月'],axisLine:{lineStyle:{color:'#cdd'}}},
    yAxis:{type:'value',name:'萬',splitLine:{lineStyle:{color:'#eef4f6'}}},
    series:[{type:'bar',data:[18,31,52,88,132,172],barWidth:'50%',itemStyle:{borderRadius:[6,6,0,0],color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'#22d3ee'},{offset:1,color:'#0891b2'}])}}]}));
}

/* ---------- router ---------- */
var RENDER=[s0,s1,s2,s3,s4,s5];
var INIT=[s0init,s1init,s2init,s3init,s4init,s5init];
function buildNav(){
  var n=document.getElementById('nav');var h="";
  for(var i=0;i<MODULES.length;i++){h+='<button class="nav-btn" data-i="'+i+'"><span class="idx">'+i+'</span><span class="material-symbols-outlined" style="color:var(--c);font-size:19px">'+MODULES[i].icon+'</span><span class="tx">'+MODULES[i].name+'</span></button>';}
  n.innerHTML=h;
  n.addEventListener('click',function(e){var b=e.target.closest('[data-i]');if(!b)return;show(+b.getAttribute('data-i'));});
}
function show(i){
  disposeCharts();
  var c=document.getElementById('screen');
  c.innerHTML=RENDER[i]();
  var btns=document.querySelectorAll('[data-i]');
  for(var k=0;k<btns.length;k++){btns[k].classList.toggle('on',+btns[k].getAttribute('data-i')===i);}
  void c.offsetHeight;
  INIT[i]();
}
buildNav();
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
</body>
