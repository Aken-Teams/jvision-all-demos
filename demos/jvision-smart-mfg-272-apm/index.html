<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>應用程式效能監控（APM）｜Jvision 系統 Demo</title>
  <meta name="description" content="交易響應時間追蹤、程式碼剖析與應用拓樸依賴的即時 APM 控制台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#CBD5E1;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:var(--color-primary);
  --ink:var(--color-foreground);
  --muted:var(--color-muted-foreground);
  --line:var(--color-border);
  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --bg:var(--color-background);
  --panel:var(--color-card);
  --panel2:var(--color-muted);
  --txt:var(--color-card-foreground);
  --dim:#64748B;
  --ok:#047857;
  --warn:#A13C06;
  --bad:var(--color-destructive);
  --info:#1D4ED8;
  --shadow:6px 6px 0 #0F172A;
  color-scheme:light;
}
*{box-sizing:border-box;}
html{scroll-behavior:auto;background:var(--bg);}
html,body{margin:0;padding:0;min-width:0;overflow-x:hidden;}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--ink);
  font-family:'Work Sans',system-ui,sans-serif;
  font-size:15px;
  line-height:1.5;
}
button,a{font:inherit;}
a{color:inherit;text-decoration:none;}
button{cursor:pointer;}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
::selection{background:var(--color-primary);color:var(--color-on-primary);}
.msym{
  display:inline-block;
  vertical-align:middle;
  font-family:'Material Symbols Outlined';
  font-size:1.15em;
  font-style:normal;
  font-weight:normal;
  line-height:1;
  letter-spacing:normal;
}
.nav{
  position:sticky;
  top:0;
  z-index:50;
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  align-items:stretch;
  gap:0;
  min-width:0;
  padding:0;
  background:var(--color-card);
  border-bottom:3px solid var(--ink);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  padding:10px 16px;
  background:var(--ink);
  color:#FFFFFF;
  border-right:3px solid var(--ink);
}
.brand .logo{
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
  width:42px;
  height:42px;
  color:var(--color-on-accent);
  background:var(--color-accent);
  border:2px solid #FFFFFF;
  border-radius:0;
  box-shadow:4px 4px 0 var(--color-primary);
}
.brand .logo .msym{font-size:24px;}
.brand b{
  font-family:'Outfit','Work Sans',sans-serif;
  font-size:16px;
  font-weight:700;
  letter-spacing:.03em;
  white-space:nowrap;
}
.brand span{font-size:11px;color:#CBD5E1;white-space:nowrap;}
.navbtns{
  display:flex;
  align-items:stretch;
  min-width:0;
  overflow-x:auto;
  scrollbar-width:thin;
  background:var(--color-card);
}
.nb{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  flex:1 0 auto;
  min-width:54px;
  min-height:62px;
  padding:9px 12px;
  color:var(--muted);
  background:transparent;
  border:0;
  border-right:1px solid var(--line);
  border-radius:0;
  font-family:inherit;
  font-size:12px;
  font-weight:700;
  transition:background-color 180ms ease,color 180ms ease,box-shadow 180ms ease;
}
.nb .msym{font-size:19px;}
.nb:hover{background:var(--color-muted);color:var(--ink);}
.nb.on{
  color:var(--color-on-primary);
  background:var(--color-primary);
  box-shadow:inset 0 -6px 0 var(--color-accent);
}
.nb.on::after{
  content:'CURRENT';
  position:absolute;
  top:3px;
  right:4px;
  font-family:'Outfit',sans-serif;
  font-size:7px;
  font-weight:700;
  letter-spacing:.08em;
}
.navstat{
  display:flex;
  align-items:center;
  gap:9px;
  padding:10px 16px;
  color:var(--ink);
  background:#FFFFFF;
  border-left:3px solid var(--ink);
  font-family:'Outfit',sans-serif;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
}
.pulse{
  position:relative;
  width:12px;
  height:12px;
  flex:none;
  background:var(--ok);
  border:2px solid var(--ink);
  border-radius:0;
  animation:pulse-mark 1.8s steps(2,end) infinite;
}
.pulse::after{content:'';position:absolute;inset:2px;background:#FFFFFF;}
@keyframes pulse-mark{50%{background:#FFFFFF;}}
.wrap{width:min(100%,1440px);min-width:0;margin:0 auto;padding:28px 24px 56px;}
#screen{min-width:0;}
.schead{
  position:relative;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  min-width:0;
  margin:0 0 22px;
  padding:24px 26px 22px;
  background:var(--color-card);
  border:3px solid var(--ink);
  box-shadow:var(--shadow);
}
.schead::before{
  content:'APM / OPERATIONS';
  position:absolute;
  top:0;
  right:0;
  padding:4px 9px;
  color:var(--color-on-primary);
  background:var(--color-primary);
  font-family:'Outfit',sans-serif;
  font-size:10px;
  font-weight:700;
  letter-spacing:.12em;
}
.schead h1{
  max-width:760px;
  margin:0;
  font-family:'Outfit','Work Sans',sans-serif;
  font-size:clamp(28px,4vw,52px);
  font-weight:700;
  line-height:.96;
  letter-spacing:-.035em;
}
.schead p{margin:10px 0 0;color:var(--muted);font-size:14px;font-weight:500;}
.tag{
  display:inline-flex;
  align-items:center;
  gap:7px;
  flex:none;
  max-width:100%;
  padding:9px 12px;
  color:var(--color-on-accent);
  background:var(--color-accent);
  border:2px solid var(--ink);
  border-radius:0;
  box-shadow:3px 3px 0 var(--ink);
  font-size:11px;
  font-weight:700;
}
.tag .msym{font-size:16px;}
.g4,.g3,.g2,.g21,.g12{display:grid;gap:16px;min-width:0;}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g21{grid-template-columns:minmax(0,2fr) minmax(280px,1fr);}
.g12{grid-template-columns:minmax(280px,1fr) minmax(0,2fr);}
.mt{margin-top:16px;}
.card,.kpi{
  min-width:0;
  color:var(--ink);
  background:var(--color-card);
  border:2px solid var(--ink);
  border-radius:0;
}
.card{padding:18px;box-shadow:4px 4px 0 var(--line);}
.card:nth-child(even){box-shadow:4px 4px 0 var(--color-secondary);}
.card h3{
  display:flex;
  align-items:center;
  gap:9px;
  margin:-18px -18px 16px;
  padding:11px 14px;
  color:var(--ink);
  background:var(--color-muted);
  border-bottom:2px solid var(--ink);
  font-family:'Outfit','Work Sans',sans-serif;
  font-size:14px;
  font-weight:700;
  line-height:1.35;
}
.card h3 .msym{flex:none;font-size:19px;color:var(--color-primary);}
.kpi{
  position:relative;
  overflow:hidden;
  padding:16px 16px 17px;
  box-shadow:4px 4px 0 var(--ink);
}
.kpi::before{content:'';position:absolute;left:0;top:0;width:100%;height:7px;background:var(--color-primary);}
.kpi:nth-child(2n)::before{background:var(--color-accent);}
.kpi .lbl{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  letter-spacing:.02em;
}
.kpi .lbl .msym{font-size:17px;color:var(--color-primary);}
.kpi .val{
  margin-top:7px;
  font-family:'Outfit','Work Sans',sans-serif;
  font-size:clamp(27px,3vw,38px);
  font-weight:700;
  line-height:1;
  letter-spacing:-.025em;
  font-variant-numeric:tabular-nums;
}
.kpi .val small{margin-left:5px;color:var(--muted);font-size:13px;font-weight:600;letter-spacing:0;}
.kpi .delta{
  display:inline-flex;
  align-items:center;
  gap:3px;
  margin-top:9px;
  padding:2px 6px;
  border:1px solid currentColor;
  font-size:11px;
  font-weight:700;
}
.kpi .delta .msym{font-size:14px;}
.up{color:var(--ok);}.down{color:var(--bad);}.flat{color:var(--muted);}
.chartbox{position:relative;width:100%;overflow:hidden;background:#FFFFFF;}
.tblwrap{width:100%;overflow-x:auto;border:2px solid var(--ink);border-radius:0;}
table{width:100%;min-width:520px;border-collapse:collapse;background:#FFFFFF;font-size:12.5px;}
thead th{
  padding:10px 12px;
  color:#FFFFFF;
  background:var(--ink);
  border-right:1px solid #64748B;
  border-bottom:2px solid var(--ink);
  font-family:'Outfit','Work Sans',sans-serif;
  font-size:11px;
  font-weight:700;
  letter-spacing:.035em;
  text-align:left;
  white-space:nowrap;
}
thead th:last-child{border-right:0;}
tbody td{
  padding:10px 12px;
  color:var(--ink);
  background:#FFFFFF;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  white-space:nowrap;
}
tbody td:last-child{border-right:0;}
tbody tr:last-child td{border-bottom:0;}
tbody tr:nth-child(even) td{background:#F1F5F9;}
tbody tr:hover td{background:#DBEAFE;}
.mono,.wfrow .ms,.prow,.tli .tm{
  font-family:ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace;
  font-variant-numeric:tabular-nums;
}
td.mono{text-align:right;}
td:first-child.mono{text-align:left;}
.bdg{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:0;
  font-size:11px;
  font-weight:700;
  line-height:1.3;
}
.bdg::before{content:'■';font-size:8px;line-height:1;}
.b-ok{color:#065F46;background:#D1FAE5;}
.b-warn{color:#7C2D12;background:#FFEDD5;}
.b-bad{color:#991B1B;background:#FEE2E2;}
.b-info{color:#1E40AF;background:#DBEAFE;}
.b-vio{color:#3730A3;background:#E0E7FF;}
.dot{display:inline-block;width:9px;height:9px;flex:none;border:1px solid var(--ink);border-radius:0;}
.meter{height:10px;min-width:70px;overflow:hidden;background:#E2E8F0;border:1px solid var(--ink);border-radius:0;}
.meter i{display:block;height:100%;background:var(--color-primary);border-radius:0;}
.topo{display:flex;flex-direction:column;gap:0;}
.node{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  padding:12px 13px;
  background:#FFFFFF;
  border:2px solid var(--ink);
  border-radius:0;
  box-shadow:3px 3px 0 var(--line);
}
.node .ic{
  display:flex;
  align-items:center;
  justify-content:center;
  width:40px;
  height:40px;
  flex:none;
  color:#FFFFFF;
  border:2px solid var(--ink);
  border-radius:0;
}
.node .ic .msym{font-size:21px;}
.node .meta{min-width:0;flex:1;}
.node .meta b{display:block;font-size:13px;font-weight:700;}
.node .meta span{display:block;margin-top:2px;color:var(--muted);font-size:11px;}
.node .rt{flex:none;text-align:right;font-variant-numeric:tabular-nums;}
.node .rt b{font-family:'Outfit',sans-serif;font-size:15px;}
.node .rt span{color:var(--muted);font-size:11px;}
.conn{width:3px;height:13px;margin-left:31px;background:var(--ink);}
.wf{display:flex;flex-direction:column;gap:8px;}
.wfrow{display:grid;grid-template-columns:180px minmax(100px,1fr) 70px;align-items:center;gap:10px;min-width:0;}
.wfrow .nm{min-width:0;overflow:hidden;color:var(--muted);font-size:12px;font-weight:600;text-overflow:ellipsis;white-space:nowrap;}
.wftrack{position:relative;height:22px;min-width:0;overflow:hidden;background:#E2E8F0;border:1px solid var(--ink);border-radius:0;}
.wftrack i{position:absolute;top:0;bottom:0;border-right:2px solid var(--ink);border-radius:0;}
.wfrow .ms{color:var(--ink);font-size:12px;text-align:right;}
.tl{position:relative;padding-left:30px;}
.tl::before{content:'';position:absolute;left:9px;top:4px;bottom:4px;width:3px;background:var(--ink);}
.tli{position:relative;padding:0 0 19px;}
.tli::before{
  content:'INFO';
  position:absolute;
  left:-30px;
  top:2px;
  width:21px;
  height:16px;
  color:#FFFFFF;
  background:var(--color-primary);
  border:2px solid var(--ink);
  font-size:0;
}
.tli.warn::before{content:'!';font-size:11px;font-weight:700;line-height:12px;text-align:center;color:#000000;background:#F59E0B;}
.tli.bad::before{content:'×';font-size:14px;font-weight:700;line-height:11px;text-align:center;background:var(--bad);}
.tli .tt{font-size:13px;font-weight:700;}
.tli .td{max-width:920px;margin-top:3px;color:var(--muted);font-size:12px;}
.tli .tm{color:var(--dim);font-size:11px;}
.ptree{font-family:ui-monospace,'SFMono-Regular',Consolas,monospace;font-size:12.5px;}
.prow{display:flex;align-items:center;gap:10px;min-width:0;padding:8px 10px;border-bottom:1px solid var(--line);border-radius:0;}
.prow:hover{background:#DBEAFE;}
.prow .pn{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:pre;}
.prow .pm{display:flex;align-items:center;gap:8px;width:180px;flex:none;}
.prow .pv{width:64px;flex:none;text-align:right;font-variant-numeric:tabular-nums;}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:12px;color:var(--muted);font-size:11px;font-weight:600;}
.legend span{display:flex;align-items:center;gap:6px;}
.foot{
  margin-top:34px;
  padding:16px;
  color:#FFFFFF;
  background:var(--ink);
  border:2px solid var(--ink);
  font-family:ui-monospace,Consolas,monospace;
  font-size:11px;
  text-align:center;
}
.seg{display:inline-flex;overflow:hidden;border:2px solid var(--ink);border-radius:0;}
.seg b{padding:7px 12px;color:var(--muted);font-size:12px;font-weight:700;cursor:default;}
.seg b.on{color:var(--color-on-primary);background:var(--color-primary);}
.pill{padding:4px 9px;color:var(--muted);background:#FFFFFF;border:1px solid var(--ink);border-radius:0;font-size:11px;}
.g4>.kpi,.g3>*:not(.schead),.g2>.card,.g21>.card,.g12>.card,.card.mt{
  animation:grid-enter 420ms cubic-bezier(.34,1.56,.64,1) both;
}
.g4>.kpi:nth-child(2),.g3>*:nth-child(2),.g2>.card:nth-child(2),.g21>.card:nth-child(2),.g12>.card:nth-child(2){animation-delay:60ms;}
.g4>.kpi:nth-child(3),.g3>*:nth-child(3){animation-delay:120ms;}
.g4>.kpi:nth-child(4){animation-delay:180ms;}
@keyframes grid-enter{from{opacity:0;transform:translateY(16px) scale(.92);}to{opacity:1;transform:none;}}
@media(max-width:1100px){
  .nav{grid-template-columns:auto minmax(0,1fr);}
  .navstat{display:none;}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));}
  .g21,.g12{grid-template-columns:minmax(0,1.35fr) minmax(260px,.65fr);}
}
@media(max-width:820px){
  .nav{display:flex;flex-wrap:wrap;}
  .brand{width:100%;border-right:0;border-bottom:3px solid var(--ink);}
  .navbtns{width:100%;}
  .nb{min-height:52px;}
  .wrap{padding:20px 16px 44px;}
  .schead{align-items:flex-start;padding:22px 20px 20px;}
  .schead h1{font-size:34px;}
  .g3,.g2,.g21,.g12{grid-template-columns:1fr;}
}
@media(max-width:560px){
  body{background-size:24px 24px;}
  .hidesm{display:none!important;}
  .brand{padding:9px 12px;}
  .brand .logo{width:38px;height:38px;}
  .navbtns{display:grid;grid-template-columns:repeat(6,1fr);overflow:visible;}
  .nb{min-width:0;padding:8px 4px;border-right:1px solid var(--line);}
  .nb.on::after{display:none;}
  .wrap{padding:14px 10px 36px;}
  .schead{display:block;margin-bottom:18px;padding:20px 15px 16px;box-shadow:4px 4px 0 var(--ink);}
  .schead::before{font-size:8px;}
  .schead h1{padding-top:8px;font-size:29px;}
  .schead p{font-size:12px;}
  .tag{margin-top:16px;white-space:normal;}
  .g4{grid-template-columns:1fr 1fr;gap:10px;}
  .kpi{padding:14px 11px;box-shadow:3px 3px 0 var(--ink);}
  .kpi .val{font-size:25px;}
  .card{padding:14px;}
  .card h3{margin:-14px -14px 14px;padding:10px 11px;}
  .wfrow{grid-template-columns:100px minmax(80px,1fr) 52px;gap:6px;}
  .prow .pm{width:82px;}.prow .pv{width:48px;}
  .node{padding:10px;}.node .ic{width:36px;height:36px;}
}
@media(max-width:390px){
  .g4{grid-template-columns:1fr;}
  .schead h1{font-size:27px;}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
  .g4>.kpi,.g3>*,.g2>.card,.g21>.card,.g12>.card,.card.mt{opacity:1!important;transform:none!important;}
}
</style>
</head>
<body>
  <div class="nav">
    <div class="brand">
      <div class="logo"><span class="msym">insights</span></div>
      <div style="min-width:0;">
        <b>APM 效能控制台</b><br/>
        <span class="hidesm">應用程式效能監控 · Application Performance Monitoring</span>
      </div>
    </div>
    <div class="navbtns" id="navbtns"></div>
    <div class="navstat">
      <span class="pulse"></span><span class="hidesm">即時串流 · 3.2k tx/s</span>
    </div>
  </div>
  <div class="wrap"><div id="screen"></div></div>

  <script>
  "use strict";
  var CH = {}; // chart registry keyed by canvas id

  var MODS = [
    {i:"monitoring",  t:"即時效能總覽", s:"交易響應時間、吞吐量與錯誤率即時儀表"},
    {i:"history",     t:"交易追蹤",     s:"端到端分散式追蹤與慢交易瀑布圖"},
    {i:"account_tree",t:"應用拓樸依賴", s:"服務相依關係圖與呼叫鏈健康度"},
    {i:"warning",     t:"異常告警",     s:"效能異常自動偵測、告警彙整與分派"},
    {i:"insights",    t:"根因分析",     s:"程式碼層級剖析與慢方法定位"},
    {i:"trending_up", t:"效能趨勢",     s:"SLA、Apdex 與可用率長期趨勢報表"}
  ];

  var GRID="#2a2748", TICK="#9a94c0";
  function baseOpts(extra){
    var o={responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{color:"#c9c4e6",font:{size:11},boxWidth:12}}},
      scales:{
        x:{ticks:{color:TICK,font:{size:10}},grid:{color:GRID}},
        y:{ticks:{color:TICK,font:{size:10}},grid:{color:GRID}}
      }};
    if(extra){ for(var k in extra){ o[k]=extra[k]; } }
    return o;
  }
  function mkChart(id,cfg){
    var el=document.getElementById(id);
    if(!el) return;

    mkChart("c4a",{type:"polarArea",data:{labels:["外部支付 API","DB 寫入","重試退避","業務邏輯","序列化"],
      datasets:[{data:[410,260,218,120,44],backgroundColor:["#f87171","#a78bfa","#fb923c","#7c3aed","#60a5fa"],borderColor:"#141227",borderWidth:2}]},
      options:baseOpts({scales:{r:{grid:{color:GRID},ticks:{color:TICK,backdropColor:"transparent",font:{size:9}},pointLabels:{color:"#c9c4e6"}}},
        plugins:{legend:{position:"bottom",labels:{color:"#c9c4e6",font:{size:10},boxWidth:11,padding:9}}}})});
  }

  /* ---------------- SCREEN 5 : 效能趨勢 ---------------- */
  function s5(){
    var sla=[
      {n:"訂單服務 order-svc",tgt:99.9,act:99.95,st:"ok"},
      {n:"支付閘道 pay-gateway",tgt:99.9,act:99.62,st:"bad"},
      {n:"會員中心 member-api",tgt:99.5,act:99.88,st:"ok"},
      {n:"庫存服務 inventory-svc",tgt:99.5,act:99.71,st:"ok"},
      {n:"搜尋服務 search-svc",tgt:99.0,act:98.40,st:"warn"}
    ];
    var srows="";
    for(var i=0;i<sla.length;i++){var s=sla[i];
      var b=s.st==="ok"?"b-ok":s.st==="warn"?"b-warn":"b-bad";
      var ok=s.act>=s.tgt;
      srows+='<tr><td>'+esc(s.n)+'</td><td class="mono">'+s.tgt.toFixed(2)+'%</td>'
        +'<td class="mono">'+s.act.toFixed(2)+'%</td>'
        +'<td><div class="meter" style="width:120px"><i style="width:'+Math.min(100,s.act)+'%;background:'+(ok?"linear-gradient(90deg,#34d399,#6ee7b7)":"linear-gradient(90deg,#f87171,#fca5a5)")+'"></i></div></td>'
        +'<td><span class="bdg '+b+'">'+(ok?"達標":"未達標")+'</span></td></tr>';
    }
    return schead(5,"效能趨勢與 SLA · Trends")
      +'<div class="g4">'
      +kpi("percent","系統可用率","99.82","%","+0.2%","up")
      +kpi("speed","平均響應","268","ms","-14%","up")
      +kpi("sentiment_satisfied","Apdex","0.94","","+0.03","up")
      +kpi("gavel","SLA 達成","4/5","服務","","flat")
      +'</div>'
      +'<div class="g2 mt">'
      +'<div class="card"><h3><span class="msym">trending_up</span>6 週響應時間 & 可用率趨勢</h3>'
      +'  <div class="chartbox" style="height:280px"><canvas id="c5a"></canvas></div></div>'
      +'<div class="card"><h3><span class="msym">stacked_line_chart</span>Apdex 分數趨勢</h3>'
      +'  <div class="chartbox" style="height:280px"><canvas id="c5b"></canvas></div></div>'
      +'</div>'
      +'<div class="card mt"><h3><span class="msym">gavel</span>SLA 達成率（各服務）</h3>'
      +'<div class="tblwrap"><table><thead><tr><th>服務</th><th>SLA 目標</th><th>實際可用率</th><th>進度</th><th>結果</th></tr></thead><tbody>'+srows+'</tbody></table></div></div>';
  }
  function s5charts(){
    var wk=["第1週","第2週","第3週","第4週","第5週","第6週"];
    mkChart("c5a",{type:"line",data:{labels:wk,datasets:[
      {label:"平均響應 ms",data:[420,388,352,320,292,268],borderColor:"#a78bfa",backgroundColor:"rgba(167,139,250,.18)",fill:true,tension:.4,pointRadius:3,yAxisID:"y"},
      {label:"可用率 %",data:[99.4,99.5,99.6,99.7,99.78,99.82],borderColor:"#34d399",tension:.4,pointRadius:3,yAxisID:"y1"}
    ]},options:baseOpts({scales:{
      x:{ticks:{color:TICK,font:{size:10}},grid:{color:GRID}},
      y:{position:"left",ticks:{color:"#a78bfa",font:{size:10}},grid:{color:GRID}},
      y1:{position:"right",min:99,max:100,ticks:{color:"#34d399",font:{size:10}},grid:{drawOnChartArea:false}}
    }})});
    mkChart("c5b",{type:"line",data:{labels:["第1週","第2週","第3週","第4週","第5週","第6週"],datasets:[
      {label:"Apdex",data:[0.82,0.85,0.88,0.90,0.92,0.94],borderColor:"#7c3aed",backgroundColor:"rgba(124,58,237,.2)",fill:true,tension:.4,pointRadius:3}
    ]},options:baseOpts({scales:{
      x:{ticks:{color:TICK,font:{size:10}},grid:{color:GRID}},
      y:{min:0.7,max:1,ticks:{color:TICK,font:{size:10}},grid:{color:GRID}}}})});
  }

  /* -------- shared render helpers -------- */
  function kpi(ic,l,v,u,d,dir){
    var dd="";
    if(d){ dir=dir||"flat";
      dd='<div class="delta '+dir+'"><span class="msym">'+(dir==="up"?"trending_up":dir==="down"?"trending_down":"remove")+'</span>'+d+'</div>';
    }
    return '<div class="kpi"><div class="lbl"><span class="msym">'+ic+'</span>'+l+'</div>'
      +'<div class="val">'+v+(u?'<small>'+u+'</small>':'')+'</div>'+dd+'</div>';
  }
  function schead(i,badge){
    var m=MODS[i];
    return '<div class="schead"><div style="min-width:0"><h1>'+esc(m.t)+'</h1><p>'+esc(m.s)+'</p></div>'
      +'<span class="tag"><span class="msym">bolt</span>'+esc(badge)+'</span></div>';
  }

  var RENDER=[s0,s1,s2,s3,s4,s5];
  var CHARTS=[s0charts,s1charts,s2charts,s3charts,s4charts,s5charts];

  function buildNav(){
    var h="";
    for(var i=0;i<MODS.length;i++){
      h+='<button class="nb" data-i="'+i+'" onclick="show('+i+')"><span class="msym">'+MODS[i].i+'</span><span class="nbt hidesm">'+esc(MODS[i].t)+'</span></button>';
    }
    document.getElementById("navbtns").innerHTML=h;
  }

  function show(i){
    destroyAll();
    var btns=document.querySelectorAll("[data-i]");
    for(var b=0;b<btns.length;b++){ btns[b].classList.toggle("on", +btns[b].getAttribute("data-i")===i); }
    var container=document.getElementById("screen");
    container.innerHTML=RENDER[i]()
      +'<div class="foot">APM 效能控制台 · 純前端 Demo · 資料為模擬產生 · Jvision 系統展示</div>';
    void container.offsetHeight;
    if(CHARTS[i]) CHARTS[i]();
    try{window.scrollTo(0,0);}catch(e){}
  }

  buildNav();

  function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
  </script>
</body>
