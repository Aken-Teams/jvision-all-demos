<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>應用程式效能監控（APM）｜Jvision 系統 Demo</title>
  <meta name="description" content="交易響應時間追蹤、程式碼剖析與應用拓樸依賴的即時 APM 控制台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --accent:#7c3aed; --accent2:#a78bfa;
      --bg:#0c0a1a; --panel:#141227; --panel2:#1c1936;
      --line:#2a2748; --txt:#e7e5f4; --muted:#9a94c0; --dim:#6f6a93;
      --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --info:#60a5fa;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
      font-family:'Inter','Noto Sans TC',system-ui,sans-serif;overflow-x:hidden;}
    body{min-width:0;}
    a{color:inherit;text-decoration:none;}
    .msym{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;
      line-height:1;letter-spacing:normal;display:inline-block;vertical-align:middle;}
    /* NAV */
    .nav{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,#17142e,#100e22);
      border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;
      padding:10px 16px;flex-wrap:wrap;min-width:0;}
    .brand{display:flex;align-items:center;gap:10px;min-width:0;}
    .brand .logo{width:34px;height:34px;border-radius:9px;flex:none;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      display:flex;align-items:center;justify-content:center;color:#fff;
      box-shadow:0 0 18px rgba(124,58,237,.5);}
    .brand .logo .msym{font-size:20px;}
    .brand b{font-size:15px;font-weight:800;letter-spacing:.3px;white-space:nowrap;}
    .brand span{font-size:11px;color:var(--muted);white-space:nowrap;}
    .navbtns{display:flex;gap:6px;flex-wrap:wrap;min-width:0;flex:1;}
    .nb{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;
      border:1px solid transparent;background:transparent;color:var(--muted);
      font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;min-width:0;}
    .nb .msym{font-size:18px;}
    .nb:hover{background:var(--panel2);color:var(--txt);}
    .nb.on{background:linear-gradient(135deg,rgba(124,58,237,.28),rgba(167,139,250,.18));
      border-color:var(--accent);color:#fff;box-shadow:0 0 0 1px rgba(124,58,237,.3) inset;}
    .navstat{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);
      white-space:nowrap;min-width:0;}
    .pulse{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none;
      box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pl 2s infinite;}
    @keyframes pl{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5);}70%{box-shadow:0 0 0 7px rgba(52,211,153,0);}100%{box-shadow:0 0 0 0 rgba(52,211,153,0);}}
    /* LAYOUT */
    .wrap{padding:18px 16px 44px;max-width:1360px;margin:0 auto;min-width:0;}
    .schead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
      flex-wrap:wrap;margin-bottom:16px;min-width:0;}
    .schead h1{font-size:20px;margin:0;font-weight:800;}
    .schead p{margin:4px 0 0;color:var(--muted);font-size:13px;}
    .tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
      padding:5px 10px;border-radius:20px;border:1px solid var(--line);
      background:var(--panel);color:var(--accent2);}
    .tag .msym{font-size:15px;}
    /* GRID SYSTEMS */
    .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;min-width:0;}
    .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;min-width:0;}
    .g2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;min-width:0;}
    .g21{display:grid;grid-template-columns:2fr 1fr;gap:14px;min-width:0;}
    .g12{display:grid;grid-template-columns:1fr 2fr;gap:14px;min-width:0;}
    .mt{margin-top:14px;}
    @media(max-width:820px){
      .g4,.g3,.g2,.g21,.g12{grid-template-columns:1fr;}
    }
    /* CARDS */
    .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
      padding:16px;min-width:0;}
    .card h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;
      align-items:center;gap:8px;}
    .card h3 .msym{font-size:18px;color:var(--accent2);}
    .kpi{background:linear-gradient(180deg,var(--panel2),var(--panel));
      border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0;
      position:relative;overflow:hidden;}
    .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
      background:linear-gradient(180deg,var(--accent),var(--accent2));}
    .kpi .lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;}
    .kpi .lbl .msym{font-size:16px;color:var(--accent2);}
    .kpi .val{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:.5px;}
    .kpi .val small{font-size:13px;color:var(--muted);font-weight:600;margin-left:3px;}
    .kpi .delta{font-size:11px;font-weight:700;margin-top:5px;display:inline-flex;
      align-items:center;gap:3px;}
    .kpi .delta .msym{font-size:14px;}
    .up{color:var(--ok);} .down{color:var(--bad);} .flat{color:var(--muted);}
    /* CHART */
    .chartbox{position:relative;width:100%;overflow:hidden;}
    /* TABLE */
    .tblwrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line);}
    table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px;}
    thead th{background:var(--panel2);color:var(--muted);text-align:left;
      padding:9px 12px;font-weight:700;white-space:nowrap;border-bottom:1px solid var(--line);}
    tbody td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;color:var(--txt);}
    tbody tr:last-child td{border-bottom:none;}
    tbody tr:hover td{background:rgba(124,58,237,.07);}
    .mono{font-family:'Inter',monospace;font-variant-numeric:tabular-nums;}
    /* BADGES */
    .bdg{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;
      padding:3px 9px;border-radius:20px;}
    .b-ok{background:rgba(52,211,153,.16);color:var(--ok);}
    .b-warn{background:rgba(251,191,36,.16);color:var(--warn);}
    .b-bad{background:rgba(248,113,113,.16);color:var(--bad);}
    .b-info{background:rgba(96,165,250,.16);color:var(--info);}
    .b-vio{background:rgba(167,139,250,.18);color:var(--accent2);}
    .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;}
    /* BAR meters */
    .meter{height:7px;border-radius:5px;background:var(--panel2);overflow:hidden;min-width:70px;}
    .meter i{display:block;height:100%;border-radius:5px;
      background:linear-gradient(90deg,var(--accent),var(--accent2));}
    /* TOPO */
    .topo{display:flex;flex-direction:column;gap:10px;}
    .node{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:11px;
      background:var(--panel2);border:1px solid var(--line);min-width:0;}
    .node .ic{width:38px;height:38px;border-radius:10px;flex:none;display:flex;
      align-items:center;justify-content:center;color:#fff;}
    .node .ic .msym{font-size:20px;}
    .node .meta{min-width:0;flex:1;}
    .node .meta b{font-size:13px;display:block;}
    .node .meta span{font-size:11px;color:var(--muted);}
    .node .rt{text-align:right;flex:none;}
    .node .rt b{font-size:14px;} .node .rt span{font-size:11px;color:var(--muted);}
    .conn{width:2px;height:12px;background:var(--line);margin-left:31px;}
    /* WATERFALL */
    .wf{display:flex;flex-direction:column;gap:7px;}
    .wfrow{display:grid;grid-template-columns:180px 1fr 70px;align-items:center;gap:10px;min-width:0;}
    .wfrow .nm{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;
      text-overflow:ellipsis;min-width:0;}
    .wftrack{height:20px;background:var(--panel2);border-radius:5px;position:relative;overflow:hidden;min-width:0;}
    .wftrack i{position:absolute;top:0;bottom:0;border-radius:5px;
      background:linear-gradient(90deg,var(--accent),var(--accent2));}
    .wfrow .ms{font-size:12px;text-align:right;font-variant-numeric:tabular-nums;color:var(--txt);}
    @media(max-width:560px){.wfrow{grid-template-columns:110px 1fr 56px;}}
    /* TIMELINE */
    .tl{position:relative;padding-left:26px;}
    .tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line);}
    .tli{position:relative;padding:0 0 16px;}
    .tli::before{content:"";position:absolute;left:-22px;top:3px;width:12px;height:12px;
      border-radius:50%;background:var(--accent);border:2px solid var(--bg);box-shadow:0 0 0 3px rgba(124,58,237,.2);}
    .tli.warn::before{background:var(--warn);box-shadow:0 0 0 3px rgba(251,191,36,.2);}
    .tli.bad::before{background:var(--bad);box-shadow:0 0 0 3px rgba(248,113,113,.2);}
    .tli .tt{font-size:13px;font-weight:700;}
    .tli .td{font-size:12px;color:var(--muted);margin-top:2px;}
    .tli .tm{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;}
    /* PROFILE tree */
    .ptree{font-family:'Inter',monospace;font-size:12.5px;}
    .prow{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;min-width:0;}
    .prow:hover{background:rgba(124,58,237,.07);}
    .prow .pn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .prow .pm{width:180px;flex:none;display:flex;align-items:center;gap:8px;}
    .prow .pv{width:64px;text-align:right;flex:none;font-variant-numeric:tabular-nums;}
    @media(max-width:560px){.prow .pm{width:96px;}.prow .pv{width:48px;}}
    .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px;}
    .legend span{display:flex;align-items:center;gap:5px;}
    .foot{text-align:center;color:var(--dim);font-size:11px;margin-top:26px;padding-top:16px;
      border-top:1px solid var(--line);}
    .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
    .seg b{padding:6px 12px;font-size:12px;font-weight:700;color:var(--muted);cursor:default;}
    .seg b.on{background:var(--accent);color:#fff;}
    .pill{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:20px;
      padding:4px 10px;background:var(--panel);}
    @media(max-width:560px){.hidesm{display:none !important;}}
  </style>
</head>
<body>
  <div class="nav">
    <div class="brand">
      <div class="logo"><span class="msym">insights</span></div>
      <div style="min-width:0;">
        <b>APM 效能控制台</b><br/>
        <span class="hidesm">應用程式效能監控 · Application Performance Monitoring</span>
      </div>
    </div>
    <div class="navbtns" id="navbtns"></div>
    <div class="navstat">
      <span class="pulse"></span><span class="hidesm">即時串流 · 3.2k tx/s</span>
    </div>
  </div>
  <div class="wrap"><div id="screen"></div></div>

  <script>
  "use strict";
  var CH = {}; // chart registry keyed by canvas id

  var MODS = [
    {i:"monitoring",  t:"即時效能總覽", s:"交易響應時間、吞吐量與錯誤率即時儀表"},
    {i:"history",     t:"交易追蹤",     s:"端到端分散式追蹤與慢交易瀑布圖"},
    {i:"account_tree",t:"應用拓樸依賴", s:"服務相依關係圖與呼叫鏈健康度"},
    {i:"warning",     t:"異常告警",     s:"效能異常自動偵測、告警彙整與分派"},
    {i:"insights",    t:"根因分析",     s:"程式碼層級剖析與慢方法定位"},
    {i:"trending_up", t:"效能趨勢",     s:"SLA、Apdex 與可用率長期趨勢報表"}
  ];

  var GRID="#2a2748", TICK="#9a94c0";
  function baseOpts(extra){
    var o={responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{color:"#c9c4e6",font:{size:11},boxWidth:12}}},
      scales:{
        x:{ticks:{color:TICK,font:{size:10}},grid:{color:GRID}},
        y:{ticks:{color:TICK,font:{size:10}},grid:{color:GRID}}
      }};
    if(extra){ for(var k in extra){ o[k]=extra[k]; } }
    return o;
  }
  function mkChart(id,cfg){
    var el=document.getElementById(id);
    if(!el) return;
    if(CH[id]){ try{CH[id].destroy();}catch(e){} CH[id]=null; }
    CH[id]=new Chart(el.getContext("2d"),cfg);
  }
  function destroyAll(){ for(var k in CH){ if(CH[k]){ try{CH[k].destroy();}catch(e){} CH[k]=null; } } }

  function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}

  /* ---------------- SCREEN 0 : 即時效能總覽 ---------------- */
  function s0(){
    var kpis=[
      {l:"平均響應時間",ic:"timer",v:"268",u:"ms",d:"-14%",dir:"up"},
      {l:"吞吐量",ic:"bolt",v:"3.24",u:"k tx/s",d:"+6%",dir:"up"},
      {l:"錯誤率",ic:"error",v:"0.42",u:"%",d:"+0.1%",dir:"down"},
      {l:"Apdex 分數",ic:"sentiment_satisfied",v:"0.94",u:"",d:"良好",dir:"flat"}
    ];
    var k="";
    for(var i=0;i<kpis.length;i++){var x=kpis[i];
      k+='<div class="kpi"><div class="lbl"><span class="msym">'+x.ic+'</span>'+x.l+'</div>'
        +'<div class="val">'+x.v+'<small>'+x.u+'</small></div>'
        +'<div class="delta '+x.dir+'"><span class="msym">'+(x.dir==="up"?"trending_up":x.dir==="down"?"trending_down":"remove")+'</span>'+x.d+'</div></div>';
    }
    var apps=[
      {n:"訂單服務 order-svc",rt:212,tp:980,er:0.2,ap:0.97,st:"ok"},
      {n:"支付閘道 pay-gateway",rt:486,tp:540,er:1.1,ap:0.88,st:"warn"},
      {n:"會員中心 member-api",rt:174,tp:1220,er:0.1,ap:0.98,st:"ok"},
      {n:"庫存服務 inventory-svc",rt:322,tp:410,er:0.5,ap:0.93,st:"ok"},
      {n:"搜尋服務 search-svc",rt:640,tp:300,er:2.4,ap:0.79,st:"bad"},
      {n:"通知服務 notify-svc",rt:96,tp:760,er:0.0,ap:0.99,st:"ok"}
    ];
    var rows="";
    for(var j=0;j<apps.length;j++){var a=apps[j];
      var b=a.st==="ok"?"b-ok":a.st==="warn"?"b-warn":"b-bad";
      var t=a.st==="ok"?"健康":a.st==="warn"?"注意":"異常";
      rows+='<tr><td>'+esc(a.n)+'</td>'
        +'<td class="mono">'+a.rt+' ms</td>'
        +'<td class="mono">'+a.tp+'</td>'
        +'<td class="mono">'+a.er.toFixed(1)+'%</td>'
        +'<td><div style="display:flex;align-items:center;gap:8px"><div class="meter" style="width:90px"><i style="width:'+Math.round(a.ap*100)+'%"></i></div><span class="mono">'+a.ap.toFixed(2)+'</span></div></td>'
        +'<td><span class="bdg '+b+'">'+t+'</span></td></tr>';
    }
    return schead(0,"即時串流 · 最近 60 秒")
      +'<div class="g4">'+k+'</div>'
      +'<div class="g21 mt">'
      +' <div class="card"><h3><span class="msym">show_chart</span>響應時間 vs 吞吐量（最近 30 分）</h3>'
      +'   <div class="chartbox" style="height:300px"><canvas id="c0a"></canvas></div></div>'
      +' <div class="card"><h3><span class="msym">donut_small</span>請求分佈</h3>'
      +'   <div class="chartbox" style="height:300px"><canvas id="c0b"></canvas></div></div>'
      +'</div>'
      +'<div class="card mt"><h3><span class="msym">dns</span>受監控應用（'+apps.length+' 個服務）</h3>'
      +' <div class="tblwrap"><table><thead><tr><th>服務</th><th>響應時間</th><th>吞吐量/分</th><th>錯誤率</th><th>Apdex</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
  }
  function s0charts(){
    var lbl=[],rt=[],tp=[];
    for(var m=30;m>=0;m--){lbl.push("-"+m+"m");
      rt.push(Math.round(240+Math.sin(m/3)*40+ (m<6?90:0)));
      tp.push(Math.round(3000+Math.cos(m/4)*500));
    }
    mkChart("c0a",{type:"line",data:{labels:lbl,datasets:[
      {label:"響應時間 ms",data:rt,borderColor:"#a78bfa",backgroundColor:"rgba(167,139,250,.15)",fill:true,tension:.4,pointRadius:0,yAxisID:"y"},
      {label:"吞吐量 tx/s",data:tp,borderColor:"#34d399",backgroundColor:"transparent",tension:.4,pointRadius:0,yAxisID:"y1"}
    ]},options:baseOpts({scales:{
      x:{ticks:{color:TICK,font:{size:9},maxTicksLimit:8},grid:{color:GRID}},
      y:{position:"left",ticks:{color:"#a78bfa",font:{size:10}},grid:{color:GRID}},
      y1:{position:"right",ticks:{color:"#34d399",font:{size:10}},grid:{drawOnChartArea:false}}
    }})});
    mkChart("c0b",{type:"doughnut",data:{labels:["<200ms","200-500ms","500ms-1s",">1s / 錯誤"],
      datasets:[{data:[62,24,9,5],backgroundColor:["#34d399","#7c3aed","#fbbf24","#f87171"],borderColor:"#141227",borderWidth:2}]},
      options:baseOpts({cutout:"62%",scales:{},plugins:{legend:{position:"bottom",labels:{color:"#c9c4e6",font:{size:11},boxWidth:12,padding:12}}}})});
  }

  /* ---------------- SCREEN 1 : 交易追蹤 ---------------- */
  function s1(){
    var traces=[
      {id:"tx-8f3a21",ep:"POST /api/checkout",dur:1420,st:"bad",t:"11:42:07",sp:14},
      {id:"tx-7b1c09",ep:"GET /api/products",dur:186,st:"ok",t:"11:42:05",sp:6},
      {id:"tx-6a0e55",ep:"POST /api/pay",dur:842,st:"warn",t:"11:42:03",sp:11},
      {id:"tx-5d9f12",ep:"GET /api/member/me",dur:118,st:"ok",t:"11:42:01",sp:4},
      {id:"tx-4c8b77",ep:"GET /api/search",dur:1180,st:"bad",t:"11:41:58",sp:9}
    ];
    var trows="";
    for(var i=0;i<traces.length;i++){var x=traces[i];
      var b=x.st==="ok"?"b-ok":x.st==="warn"?"b-warn":"b-bad";
      trows+='<tr><td class="mono">'+x.id+'</td><td>'+esc(x.ep)+'</td>'
        +'<td class="mono">'+x.dur+' ms</td><td class="mono">'+x.sp+'</td>'
        +'<td class="mono">'+x.t+'</td>'
        +'<td><span class="bdg '+b+'">'+(x.st==="ok"?"正常":x.st==="warn"?"偏慢":"逾時")+'</span></td></tr>';
    }
    // waterfall spans for selected slow trace
    var spans=[
      {n:"api-gateway",off:0,w:100,ms:1420,c:"#7c3aed"},
      {n:"auth-svc.verify",off:1,w:6,ms:82,c:"#60a5fa"},
      {n:"checkout-svc",off:7,w:88,ms:1250,c:"#a78bfa"},
      {n:"inventory.reserve",off:9,w:14,ms:198,c:"#34d399"},
      {n:"pay-gateway.charge",off:24,w:46,ms:640,c:"#fbbf24"},
      {n:"db.orders INSERT",off:72,w:20,ms:284,c:"#f87171"},
      {n:"notify-svc.enqueue",off:93,w:5,ms:64,c:"#60a5fa"}
    ];
    var wf="";
    for(var j=0;j<spans.length;j++){var s=spans[j];
      wf+='<div class="wfrow"><div class="nm">'+esc(s.n)+'</div>'
        +'<div class="wftrack"><i style="left:'+s.off+'%;width:'+s.w+'%;background:'+s.c+'"></i></div>'
        +'<div class="ms">'+s.ms+'ms</div></div>';
    }
    return schead(1,"分散式追蹤 · Distributed Tracing")
      +'<div class="g4">'
      +kpi("dataset","已擷取追蹤","18.6k","筆/時")
      +kpi("timer","P95 響應","912","ms")

    for(var b=0;b<btns.length;b++){ btns[b].classList.toggle("on", +btns[b].getAttribute("data-i")===i); }
    var container=document.getElementById("screen");
    container.innerHTML=RENDER[i]()
      +'<div class="foot">APM 效能控制台 · 純前端 Demo · 資料為模擬產生 · Jvision 系統展示</div>';
    void container.offsetHeight;

    try{window.scrollTo(0,0);}catch(e){}
  }

  function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
