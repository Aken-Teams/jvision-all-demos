<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>數位作業指導書管理 SOP｜Jvision 系統 Demo</title>
  <meta name="description" content="SOP 數位化編輯、審核發行、版本管制、掃碼查閱、閱讀簽核與定期複審的作業指導書管理平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --color-primary:#2563eb;
      --color-on-primary:#fff;
      --color-secondary:#3b82f6;
      --color-on-secondary:#000;
      --color-accent:#ea580c;
      --color-on-accent:#000;
      --color-background:#f8fafc;
      --color-foreground:#1e293b;
      --color-card:#fff;
      --color-card-foreground:#1e293b;
      --color-muted:#e9eff8;
      --color-muted-foreground:#475569;
      --color-border:#e2e8f0;
      --color-destructive:#dc2626;
      --color-on-destructive:#fff;
      --color-ring:#2563eb;
      --blue:#2563eb;
      --ink:#1e293b;
      --muted:#475569;
      --line:#e2e8f0;
      --ok:#15803d;
      --warn:#a34808;
      --bad:#dc2626;
      --info:#2563eb;
      --sidebar:#0f172a;
      --sidebar-muted:#b8c5d8;
      --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.035);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    html,body{margin:0;padding:0}
    body{
      min-width:320px;
      background:var(--color-background);
      color:var(--color-foreground);
      font-family:"Fira Sans",system-ui,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    button,a{font:inherit}
    button{cursor:pointer}
    :focus-visible{
      outline:3px solid var(--color-ring);
      outline-offset:3px;
      border-radius:6px;
    }
    .material-symbols-outlined{
      font-family:"Material Symbols Outlined";
      font-weight:normal;
      font-style:normal;
      line-height:1;
      vertical-align:middle;
    }
    .shell{display:flex;min-height:100vh}
    .sidebar{
      position:sticky;top:0;z-index:20;
      width:248px;height:100vh;flex:0 0 248px;
      display:flex;flex-direction:column;
      background:var(--sidebar);color:#f8fafc;
      border-right:1px solid #243148;
    }
    .brand{
      min-height:80px;padding:18px;
      display:flex;align-items:center;gap:12px;
      border-bottom:1px solid rgba(255,255,255,.1);
    }
    .logo{
      width:42px;height:42px;flex:0 0 42px;
      display:grid;place-items:center;
      background:var(--color-primary);color:#fff;
      border:1px solid #60a5fa;border-radius:8px;
      box-shadow:4px 4px 0 #172554;
    }
    .logo .material-symbols-outlined{font-size:23px}
    .brand h1{margin:0;color:#fff;font-size:15px;font-weight:700;letter-spacing:.02em}
    .brand p{
      margin:4px 0 0;color:var(--sidebar-muted);
      font:500 10px/1.2 "Fira Code",monospace;
      letter-spacing:.08em;text-transform:uppercase;
    }
    .nav{
      display:flex;flex:1;flex-direction:column;gap:5px;
      padding:16px 12px;overflow-y:auto;
    }
    .nav .lbl{
      padding:4px 10px 9px;color:#94a3b8;
      font:600 10px/1 "Fira Code",monospace;
      letter-spacing:.12em;
    }
    .navbtn{
      width:100%;min-height:44px;padding:10px 11px;
      display:flex;align-items:center;gap:11px;
      border:1px solid transparent;border-radius:7px;
      background:transparent;color:#dbe5f3;
      text-align:left;font-size:13px;font-weight:500;
      transition:background-color .2s,border-color .2s,color .2s,transform .2s;
    }
    .navbtn .material-symbols-outlined{color:#94a3b8;font-size:20px}
    .navbtn:hover{background:#18243a;border-color:#334155;color:#fff;transform:translateX(2px)}
    .navbtn.on{
      background:#eff6ff;border-color:#bfdbfe;color:#1e3a8a;
      box-shadow:inset 3px 0 0 var(--color-primary);
    }
    .navbtn.on .material-symbols-outlined{color:var(--color-primary)}
    .nt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .sbfoot{
      margin:0 12px 14px;padding:12px;
      display:flex;align-items:center;gap:9px;
      border:1px solid #334155;background:#18243a;border-radius:7px;
      color:#dbe5f3;font-size:11px;
    }
    .status-icon{
      width:18px;height:18px;display:grid;place-items:center;
      border:1px solid #4ade80;border-radius:50%;
      color:#4ade80;font-size:12px;font-weight:700;
    }
    .main{min-width:0;flex:1;display:flex;flex-direction:column}
    .topbar{
      position:sticky;top:0;z-index:10;
      min-height:80px;padding:14px 28px;
      display:flex;align-items:center;gap:12px;flex-wrap:wrap;
      background:rgba(255,255,255,.96);
      border-bottom:1px solid var(--color-border);
      backdrop-filter:blur(12px);
    }
    .topbar::before{
      content:"";align-self:stretch;width:3px;
      background:var(--color-primary);border-radius:2px;
    }
    .tt{min-width:180px}
    .tt h2{margin:0;font-size:20px;line-height:1.2;font-weight:700;letter-spacing:-.02em}
    .tt p{margin:5px 0 0;color:var(--muted);font-size:12px}
    .spacer{flex:1}
    .pill{
      min-height:36px;padding:7px 11px;
      display:inline-flex;align-items:center;gap:7px;
      border:1px solid var(--line);border-radius:6px;
      background:#fff;color:#334155;font-size:11.5px;font-weight:600;
    }
    .pill .material-symbols-outlined{font-size:17px;color:var(--color-primary)}
    .content{min-width:0;width:100%;max-width:1600px;margin:0 auto;padding:24px 28px 44px}
    #screen{animation:screen-in .35s ease-out both}
    .grid{display:grid;gap:16px;min-width:0}
    .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .g23{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
    .g32{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
    .card{
      min-width:0;padding:18px;
      background:var(--color-card);color:var(--color-card-foreground);
      border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);
      transition:border-color .2s,box-shadow .2s,transform .2s;
    }
    .card:hover{border-color:#cbd5e1;box-shadow:0 2px 4px rgba(15,23,42,.05),0 12px 28px rgba(15,23,42,.055)}
    .card h3{
      margin:0 0 4px;display:flex;align-items:center;gap:8px;
      color:#172033;font-size:14px;font-weight:700;
    }
    .card h3 .material-symbols-outlined{font-size:19px;color:var(--color-primary)}
    .sub{margin:0 0 15px;color:var(--muted);font-size:11.5px;line-height:1.5}
    .kpi{position:relative;gap:8px;display:flex;flex-direction:column;overflow:hidden}
    .kpi::after{
      content:"";position:absolute;right:-20px;bottom:-32px;
      width:90px;height:90px;border:14px solid #eff6ff;border-radius:50%;
      pointer-events:none;
    }
    .kpi .top{display:flex;align-items:flex-start;justify-content:space-between;position:relative;z-index:1}
    .kpi .ic{
      width:38px;height:38px;display:grid;place-items:center;
      border-radius:7px;color:#fff;border:1px solid rgba(15,23,42,.08);
    }
    .kpi .ic .material-symbols-outlined{font-size:20px}
    .kpi .val{
      position:relative;z-index:1;
      margin-top:3px;font:700 27px/1 "Fira Code",monospace;
      letter-spacing:-.04em;font-variant-numeric:tabular-nums;
    }
    .kpi .lab{position:relative;z-index:1;color:var(--muted);font-size:12px;font-weight:500}
    .delta{
      display:inline-flex;align-items:center;gap:3px;
      font:600 10.5px/1 "Fira Code",monospace;
    }
    .delta .material-symbols-outlined{font-size:14px}
    .up{color:var(--ok)}.down{color:var(--bad)}
    .chartbox{position:relative;width:100%;overflow:hidden}
    .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:7px}
    table{width:100%;min-width:520px;border-collapse:collapse;font-size:12px}
    th{
      padding:10px;text-align:left;white-space:nowrap;
      background:#f1f5f9;color:#334155;border-bottom:1px solid #cbd5e1;
      font-size:10.5px;font-weight:700;letter-spacing:.035em;
    }
    td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
    tbody tr:last-child td{border-bottom:0}
    tbody tr{transition:background-color .18s}
    tbody tr:hover{background:#f8fbff}
    th:nth-last-child(-n+2),td.numeric{text-align:right}
    .mono{
      font-family:"Fira Code",monospace;
      font-variant-numeric:tabular-nums;
      font-weight:600;letter-spacing:-.02em;
    }
    .tag{
      min-height:24px;padding:4px 8px;
      display:inline-flex;align-items:center;gap:4px;white-space:nowrap;
      border:1px solid transparent;border-radius:5px;
      font-size:10.5px;font-weight:700;
    }
    .tag::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
    .t-ok{background:#ecfdf3;color:#166534;border-color:#bbf7d0}
    .t-warn{background:#fff7ed;color:#9a3412;border-color:#fed7aa}
    .t-bad{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
    .t-info{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
    .t-mut{background:#f1f5f9;color:#475569;border-color:#cbd5e1}
    .t-acc{background:#fff7ed;color:#c2410c;border-color:#fdba74}
    .bar{height:7px;min-width:64px;overflow:hidden;background:#e2e8f0;border-radius:2px}
    .bar>i{display:block;height:100%;border-radius:2px}
    .rowb{display:flex;align-items:center;gap:10px;min-width:0}
    .avatar{
      width:34px;height:34px;flex:0 0 34px;
      display:grid;place-items:center;border-radius:6px;
      color:#fff;font:700 12px/1 "Fira Code",monospace;
    }
    .ed{display:grid;grid-template-columns:170px minmax(0,1fr) 200px;gap:14px;min-width:0}
    .stepvert,.side-panel,.station{display:flex;flex-direction:column;gap:8px;min-width:0}
    .stepvert .st{
      min-width:0;padding:9px;display:flex;gap:9px;
      border:1px solid transparent;border-radius:6px;
    }
    .stepvert .n{
      width:25px;height:25px;flex:0 0 25px;
      display:grid;place-items:center;
      border:1px solid #cbd5e1;border-radius:5px;
      background:#f1f5f9;color:#475569;
      font:700 11px/1 "Fira Code",monospace;
    }
    .stepvert .done .n{background:#166534;border-color:#166534;color:#fff}
    .stepvert .cur{background:#eff6ff;border-color:#bfdbfe}
    .stepvert .cur .n{background:var(--color-primary);border-color:var(--color-primary);color:#fff}
    .stepvert .tx{min-width:0}
    .stepvert b{display:block;font-size:12px}
    .stepvert span{color:var(--muted);font-size:10.5px}
    .canvas-mock{min-width:0;overflow:hidden;background:#fff;border:1px solid #cbd5e1;border-radius:7px}
    .cm-media{
      position:relative;aspect-ratio:16/8;
      display:grid;place-items:center;overflow:hidden;color:#fff;
      background:
        linear-gradient(135deg,rgba(15,23,42,.92),rgba(30,64,175,.82)),
        repeating-linear-gradient(90deg,transparent 0 42px,rgba(255,255,255,.05) 42px 43px);
    }
    .cm-media::after{
      content:"ASSEMBLY / WORK CELL";
      position:absolute;right:12px;bottom:10px;
      color:#bfdbfe;font:500 9px/1 "Fira Code",monospace;letter-spacing:.1em;
    }
    .play{
      width:52px;height:52px;display:grid;place-items:center;
      background:#fff;color:var(--color-primary);border:1px solid #bfdbfe;border-radius:50%;
      box-shadow:0 8px 24px rgba(15,23,42,.22);cursor:pointer;
      transition:transform .2s,box-shadow .2s;
    }
    .play:hover{transform:scale(1.05);box-shadow:0 10px 28px rgba(15,23,42,.3)}
    .play .material-symbols-outlined{font-size:30px}
    .badge{
      position:absolute;top:10px;left:10px;padding:5px 8px;
      background:#0f172a;border:1px solid #475569;border-radius:4px;
      color:#fff;font:600 10px/1 "Fira Code",monospace;
    }
    .cm-body{padding:15px 16px}
    .cm-body h4{margin:0 0 8px;font-size:14px}
    .cm-step{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
    .cm-step:last-child{border-bottom:0}
    .cn{
      width:23px;height:23px;flex:0 0 23px;display:grid;place-items:center;
      background:var(--color-primary);color:#fff;border-radius:4px;
      font:700 10px/1 "Fira Code",monospace;
    }
    .ct{min-width:0;font-size:12px}
    .ct b{display:block}.ct span{display:block;margin-top:3px;color:var(--muted);font-size:11px;line-height:1.45}
    .field{min-width:0;padding:10px;background:#f8fafc;border:1px solid var(--line);border-radius:6px}
    .fl{color:var(--muted);font:600 9.5px/1.3 "Fira Code",monospace;letter-spacing:.06em}
    .fv{margin-top:4px;font-size:12.5px;font-weight:600}
    .chip{
      margin:5px 3px 0 0;padding:4px 7px;display:inline-flex;
      background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:4px;
      font-size:10.5px;font-weight:700;
    }
    .board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;min-width:760px}
    .col{min-width:0;padding:11px;background:#f1f5f9;border:1px solid var(--line);border-radius:7px}
    .ch{margin-bottom:10px;padding:0 2px;display:flex;align-items:center;justify-content:space-between}
    .ch b{font-size:12px}.cnt{padding:2px 7px;background:#fff;border:1px solid #cbd5e1;border-radius:4px;color:#475569;font:700 10px/1.4 "Fira Code",monospace}
    .ticket{
      margin-bottom:8px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:6px;
      transition:border-color .2s,transform .2s,box-shadow .2s;
    }
    .ticket:last-child{margin-bottom:0}
    .ticket:hover{border-color:#93c5fd;transform:translateY(-2px);box-shadow:0 6px 16px rgba(37,99,235,.08)}
    .code{color:#1d4ed8;font:700 10px/1.3 "Fira Code",monospace}
    .ticket h5{margin:5px 0 8px;font-size:12.5px;line-height:1.45}
    .meta{display:flex;align-items:center;justify-content:space-between;gap:5px;color:var(--muted);font-size:10.5px}
    .prio{width:7px;height:7px;display:inline-block;margin-right:5px;border-radius:2px}
    .tl{position:relative;padding-left:27px}
    .tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:1px;background:#cbd5e1}
    .ev{position:relative;padding:0 0 19px}.ev:last-child{padding-bottom:0}
    .dotm{position:absolute;left:-23px;top:1px;width:12px;height:12px;background:#fff;border:3px solid var(--color-primary);border-radius:2px}
    .old .dotm{border-color:#64748b}
    .vh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.vh b{font:700 12px/1.3 "Fira Code",monospace}
    .vt{color:var(--muted);font:500 10px/1.4 "Fira Code",monospace}.vd{margin-top:4px;color:var(--muted);font-size:11.5px;line-height:1.5}
    .ringwrap{display:flex;align-items:center;gap:17px;flex-wrap:wrap}
    .qr{
      width:110px;height:110px;flex:0 0 110px;border:7px solid #0f172a;border-radius:5px;
      background:
        repeating-linear-gradient(90deg,#0f172a 0 6px,#fff 6px 12px),
        repeating-linear-gradient(0deg,rgba(255,255,255,.55) 0 6px,transparent 6px 12px);
    }
    .stn{min-width:0;padding:10px;display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);border-radius:6px}
    .si{width:39px;height:39px;flex:0 0 39px;display:grid;place-items:center;border-radius:6px;color:#fff}
    .si .material-symbols-outlined{font-size:21px}.sx{min-width:0;flex:1}.sx b{display:block;font-size:12.5px}.sx span{display:block;margin-top:3px;color:var(--muted);font-size:11px}
    .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
    .cd{
      position:relative;min-width:0;aspect-ratio:1/.82;padding:6px;overflow:hidden;
      background:#fff;border:1px solid var(--line);border-radius:5px;font-size:10.5px;
    }
    .dn{color:var(--muted);font:600 10px/1 "Fira Code",monospace}
    .cd.due{background:#fff7ed;border:2px solid #ea580c}.cd.due .dn{color:#9a3412}
    .dt{position:absolute;right:5px;bottom:5px;left:5px;overflow:hidden;color:#9a3412;font-size:9px;font-weight:700;line-height:1.2}
    .dow{padding-bottom:3px;color:var(--muted);font:600 10px/1.4 "Fira Code",monospace;text-align:center}
    .legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:11px;font-weight:500}
    .legend i{width:11px;height:11px;display:inline-block;margin-right:5px;border-radius:2px;vertical-align:-1px}
    .note{color:var(--muted);font-size:11.5px;line-height:1.6}
    @keyframes screen-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @media(max-width:1180px){
      .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
      .ed{grid-template-columns:1fr 1fr}.side-panel{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr)}
    }
    @media(max-width:860px){
      .shell{display:block}
      .sidebar{position:sticky;width:100%;height:auto;min-height:0;display:flex;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid #334155}
      .brand{min-height:62px;padding:10px 14px;flex:1}.logo{width:38px;height:38px;flex-basis:38px}
      .nav{order:3;flex:1 1 100%;flex-direction:row;padding:7px 10px 10px;overflow-x:auto}.nav .lbl{display:none}
      .navbtn{width:auto;flex:0 0 auto;min-height:40px}.navbtn:hover{transform:none}.sbfoot{display:none}
      .topbar{top:105px;min-height:68px;padding:11px 16px}.content{padding:18px 16px 34px}
    }
    @media(max-width:720px){
      .g4,.g3,.g2,.g23,.g32,.ed{grid-template-columns:1fr}
      .side-panel{grid-column:auto;display:flex}
    }
    @media(max-width:520px){
      .brand p{display:none}.navbtn{padding:9px}.navbtn .nt{font-size:11px}
      .topbar{top:103px}.topbar .pill{display:none}.topbar::before{display:none}
      .content{padding:14px 12px 30px}.card{padding:14px}.g4{gap:10px}
      .kpi .val{font-size:24px}.cal{gap:3px}.cd{padding:4px}.dt{font-size:8px}
    }
    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
      #screen{animation:none}
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">fact_check</span></div>
        <div>
          <h1>現場數位作業指導管理</h1>
          <p>Quality Operations</p>
        </div>
      </div>
      <nav class="nav" id="nav" aria-label="主要功能">
        <div class="lbl">作業指導書</div>
      </nav>
      <div class="sbfoot"><span class="status-icon" aria-hidden="true">✓</span> 系統正常 · 有效版 328 份</div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="tt">
          <h2 id="scTitle">SOP 編輯器</h2>
          <p id="scSub">數位作業指導書生命週期</p>
        </div>
        <div class="spacer"></div>
        <span class="pill"><span class="material-symbols-outlined">factory</span> 第二廠 · 組裝線</span>
        <span class="pill"><span class="material-symbols-outlined">person</span> 陳品瑄 · 製程工程</span>
      </header>
      <div class="content"><div id="screen" aria-live="polite"></div></div>
    </main>
  </div>
  <script>
  (function(){
    "use strict";
    var C={accent:"#2563eb",accent2:"#ea580c",ok:"#15803d",warn:"#c2410c",bad:"#dc2626",info:"#3b82f6",ink:"#1e293b",mut:"#475569",line:"#e2e8f0"};
    var NAV=[
      {i:0,ic:"description",t:"SOP 編輯器"},
      {i:1,ic:"fact_check",t:"審核發行"},

      var cells=["日","一","二","三","四","五","六"].map(function(d){return '<div class="dow">'+d+'</div>'}).join("");
      for(var x=0;x<6;x++)cells+='<div class="cd" style="background:#f1f5f9;border-style:dashed"></div>';
      for(var day=1;day<=31;day++)cells+='<div class="cd'+(due[day]?" due":"")+'"><div class="dn">'+day+'</div>'+(due[day]?'<div class="dt">'+esc(due[day])+'</div>':"")+'</div>';
      var rows=[
        ["WI-CLN-0077","無塵室進出規範","2025/07/28","2026/08/19","5 天","t-bad","李郁欣"],
        ["WI-QC-0201","進料檢驗抽樣","2025/08/23","2026/08/23","9 天","t-warn","王思婷"],
        ["WI-SMT-0508","SMT 錫膏印刷參數","2025/09/03","2026/09/03","20 天","t-info","黃志明"],
        ["WI-PKG-0233","成品包裝與貼標","2025/09/09","2026/09/09","26 天","t-info","林建豪"],
        ["WI-WLD-0415","雷射焊接作業","2026/02/12","2027/02/12","182 天","t-ok","吳承翰"]
      ].map(function(r){return '<tr><td class="mono" style="color:#1d4ed8">'+r[0]+'</td><td>'+esc(r[1])+'</td><td class="mono" style="color:var(--muted)">'+r[2]+'</td><td class="mono">'+r[3]+'</td><td>'+tag(r[4],r[5])+'</td><td>'+esc(r[6])+'</td></tr>'}).join("");
      return {html:
        '<div class="grid g4" style="margin-bottom:16px">'+kpi("event_upcoming",C.accent,"7","30 天內到期")+kpi("warning",C.bad,"2","逾期未複審")+kpi("fact_check",C.ok,"88%","年度複審達成率","6%","up")+kpi("update",C.info,"12","本月已複審")+'</div>'+
        '<div class="grid g23"><section class="card"><h3>'+icon("calendar_month")+'複審到期行事曆 · 2026 年 8 月</h3><p class="sub">系統依生效日 +12 個月自動排定複審</p><div class="cal">'+cells+'</div><div class="legend" style="margin-top:12px"><span><i style="background:#fff7ed;border:2px solid #ea580c"></i>複審到期日</span><span><i style="background:#fff;border:1px solid var(--line)"></i>一般日</span></div></section><section class="card"><h3>'+icon("radar")+'複審健康度</h3><p class="sub">各面向複審合規表現</p><div class="chartbox" style="height:260px"><canvas id="c5a"></canvas></div></section></div>'+
        '<section class="card" style="margin-top:16px"><h3>'+icon("assignment_late")+'複審排程清單</h3><p class="sub">到期提醒 → 定期複審 → 更新版本閉環</p><div class="table-wrap"><table><thead><tr><th>文件編號</th><th>名稱</th><th>上次複審</th><th>下次到期</th><th>剩餘</th><th>負責人</th></tr></thead><tbody>'+rows+'</tbody></table></div></section>',
        init:function(){
          charts.c5a=new Chart(el("c5a"),{type:"radar",data:{labels:["準時複審","版本正確","簽核完成","素材更新","安規符合"],datasets:[{label:"本季",data:[88,94,91,82,96],borderColor:C.accent,backgroundColor:"rgba(37,99,235,.14)",borderWidth:2,pointBackgroundColor:C.accent},{label:"上季",data:[74,88,80,70,90],borderColor:C.accent2,backgroundColor:"rgba(234,88,12,.08)",borderWidth:2,pointBackgroundColor:C.accent2}]},options:radarOpt()});
        }};
    }
    function baseOpt(o){
      o=o||{};
      var opt={responsive:true,maintainAspectRatio:false,
        plugins:{
          legend:{display:!o.noLegend,position:"bottom",labels:{font:{family:"Fira Sans",size:11},color:C.mut,usePointStyle:true,boxWidth:8,padding:14}},
          tooltip:{backgroundColor:"#0f172a",titleColor:"#fff",bodyColor:"#e2e8f0",titleFont:{family:"Fira Sans"},bodyFont:{family:"Fira Code"},padding:10,cornerRadius:4}
        },
        scales:{
          x:{grid:{display:false},border:{color:C.line},ticks:{font:{family:"Fira Code",size:10},color:C.mut}},
          y:{beginAtZero:true,grid:{color:"#e9eff8"},border:{display:false},ticks:{font:{family:"Fira Code",size:10},color:C.mut}}
        }
      };
      if(o.max)opt.scales.y.max=o.max;
      if(o.horizontal){opt.indexAxis="y";opt.scales.x.beginAtZero=true;opt.scales.x.grid={color:"#e9eff8"};opt.scales.y.grid={display:false}}
      return opt;
    }
    function donutOpt(){return {responsive:true,maintainAspectRatio:false,cutout:"66%",plugins:{legend:{position:"bottom",labels:{font:{family:"Fira Sans",size:11},color:C.mut,usePointStyle:true,boxWidth:8,padding:12}},tooltip:{backgroundColor:"#0f172a",padding:10,cornerRadius:4}}}}
    function radarOpt(){return {responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{font:{family:"Fira Sans",size:11},color:C.mut,usePointStyle:true,boxWidth:8,padding:12}}},scales:{r:{beginAtZero:true,max:100,grid:{color:C.line},angleLines:{color:C.line},pointLabels:{font:{family:"Fira Sans",size:11},color:C.ink},ticks:{display:false,stepSize:25}}}}}
    var BUILDERS=[s0,s1,s2,s3,s4,s5];
    function show(i){
      i=Math.max(0,Math.min(i,BUILDERS.length-1));
      destroyAll();
      var built=BUILDERS[i](),cont=el("screen");
      cont.innerHTML=built.html;
      document.querySelectorAll("[data-i]").forEach(function(btn){
        var active=+btn.getAttribute("data-i")===i;
        btn.classList.toggle("on",active);
        btn.setAttribute("aria-current",active?"page":"false");
      });
      el("scTitle").textContent=TITLES[i][0];
      el("scSub").textContent=TITLES[i][1];
      document.title=TITLES[i][0]+"｜現場數位作業指導管理";
      if(built.init){try{built.init()}catch(e){}}
    }
    function fromHash(){
      var match=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
      show(match?Math.min(+match[1],5):0);
      try{window.scrollTo({top:0,behavior:window.matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}catch(e){window.scrollTo(0,0)}
    }
    window.addEventListener("hashchange",fromHash);
    fromHash();
  })();
  </script>
