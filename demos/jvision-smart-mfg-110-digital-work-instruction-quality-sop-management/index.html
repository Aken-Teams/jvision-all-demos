<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>數位作業指導書管理 SOP｜Jvision 系統 Demo</title>
  <meta name="description" content="SOP 數位化編輯、審核發行、版本管制、掃碼查閱、閱讀簽核與定期複審的作業指導書管理平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --accent:#dc2626; --accent2:#f97316;
      --ink:#1a1512; --muted:#6b6560; --line:#eadfd8;
      --bg:#f6f2ee; --card:#ffffff;
      --sb:#221712; --sb2:#2f201a; --sbtx:#e9d9cf; --sbmut:#a78e82;
      --ok:#16a34a; --warn:#f59e0b; --bad:#dc2626; --info:#2563eb;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
      background:var(--bg); color:var(--ink);
      -webkit-font-smoothing:antialiased;
    }
    .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
    .shell{display:flex;min-height:100vh;align-items:stretch}
    /* sidebar */
    .sidebar{
      width:246px;flex:0 0 246px;background:linear-gradient(180deg,var(--sb),var(--sb2));
      color:var(--sbtx);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
    }
    .brand{padding:20px 18px 14px;display:flex;gap:11px;align-items:center;border-bottom:1px solid rgba(255,255,255,.07)}
    .brand .logo{
      width:40px;height:40px;border-radius:11px;flex:0 0 40px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 16px rgba(220,38,38,.4)
    }
    .brand .logo .material-symbols-outlined{font-size:24px}
    .brand h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.3px;color:#fff}
    .brand p{margin:2px 0 0;font-size:11px;color:var(--sbmut)}
    .nav{padding:12px 10px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;flex:1}
    .nav .lbl{font-size:10px;letter-spacing:1.5px;color:var(--sbmut);padding:8px 12px 4px;font-weight:700}
    .navbtn{
      display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;border:0;cursor:pointer;
      background:transparent;color:var(--sbtx);font-size:13.5px;font-weight:600;text-align:left;width:100%;
      font-family:inherit;transition:background .15s,color .15s;min-width:0;
    }
    .navbtn .material-symbols-outlined{font-size:21px;color:var(--sbmut);flex:0 0 auto}
    .navbtn .nt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .navbtn:hover{background:rgba(255,255,255,.06)}
    .navbtn.on{background:linear-gradient(135deg,rgba(220,38,38,.22),rgba(249,115,22,.14));color:#fff}
    .navbtn.on .material-symbols-outlined{color:var(--accent2)}
    .sbfoot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;color:var(--sbmut);display:flex;align-items:center;gap:8px}
    .sbfoot .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(22,163,74,.2)}
    /* main */
    .main{flex:1;min-width:0;display:flex;flex-direction:column}
    .topbar{
      background:var(--card);border-bottom:1px solid var(--line);padding:14px 26px;
      display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:5
    }
    .topbar .tt{min-width:0}
    .topbar .tt h2{margin:0;font-size:18px;font-weight:800}
    .topbar .tt p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
    .topbar .spacer{flex:1}
    .pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:12px;font-weight:700;color:var(--muted)}
    .pill .material-symbols-outlined{font-size:17px;color:var(--accent)}
    .content{padding:22px 26px 40px;min-width:0}
    /* generic */
    .grid{display:grid;gap:16px;min-width:0}
    .g4{grid-template-columns:repeat(4,1fr)}
    .g3{grid-template-columns:repeat(3,1fr)}
    .g2{grid-template-columns:repeat(2,1fr)}
    .g23{grid-template-columns:1.6fr 1fr}
    .g32{grid-template-columns:1fr 1.6fr}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;box-shadow:0 1px 2px rgba(30,20,10,.03)}
    .card h3{margin:0 0 3px;font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px}
    .card h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
    .card .sub{font-size:11.5px;color:var(--muted);margin:0 0 14px}
    .kpi{display:flex;flex-direction:column;gap:8px}
    .kpi .top{display:flex;align-items:center;justify-content:space-between}
    .kpi .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff}
    .kpi .ic .material-symbols-outlined{font-size:21px}
    .kpi .val{font-size:27px;font-weight:900;line-height:1;letter-spacing:-.5px}
    .kpi .lab{font-size:12px;color:var(--muted);font-weight:600}
    .kpi .delta{font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
    .kpi .delta .material-symbols-outlined{font-size:15px}
    .up{color:var(--ok)} .down{color:var(--bad)}
    .chartbox{position:relative;width:100%;overflow:hidden}
    table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
    th{text-align:left;font-size:11px;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap;letter-spacing:.3px}
    td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
    tr:last-child td{border-bottom:0}
    tbody tr:hover{background:#fbf7f3}
    .tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
    .t-ok{background:#e7f6ec;color:#15803d} .t-warn{background:#fef3d7;color:#b45309}
    .t-bad{background:#fde8e8;color:#b91c1c} .t-info{background:#e6effe;color:#1d4ed8}
    .t-mut{background:#efeae6;color:#6b6560} .t-acc{background:#fde5df;color:#c2410c}
    .bar{height:7px;border-radius:5px;background:#efeae6;overflow:hidden;min-width:60px}
    .bar > i{display:block;height:100%;border-radius:5px}
    .mono{font-variant-numeric:tabular-nums;font-family:"Inter",monospace;font-weight:700}
    .stack{display:flex;flex-direction:column;gap:14px;min-width:0}
    .rowb{display:flex;align-items:center;gap:12px;min-width:0}
    .avatar{width:34px;height:34px;border-radius:50%;flex:0 0 34px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12.5px}
    /* editor screen */
    .ed{display:grid;grid-template-columns:170px 1fr 200px;gap:14px;min-width:0}
    .stepvert{display:flex;flex-direction:column;gap:2px;min-width:0}
    .stepvert .st{display:flex;gap:10px;padding:9px 10px;border-radius:10px;cursor:default;min-width:0}
    .stepvert .st .n{width:24px;height:24px;border-radius:50%;flex:0 0 24px;background:#efeae6;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
    .stepvert .st.done .n{background:var(--ok);color:#fff}
    .stepvert .st.cur{background:#fde5df}
    .stepvert .st.cur .n{background:var(--accent);color:#fff}
    .stepvert .st .tx{min-width:0}
    .stepvert .st .tx b{font-size:12.5px;display:block}
    .stepvert .st .tx span{font-size:10.5px;color:var(--muted)}
    .canvas-mock{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;min-width:0}
    .cm-media{aspect-ratio:16/8;background:linear-gradient(135deg,#3a2a22,#5a3a2a);position:relative;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden}
    .cm-media .play{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;color:var(--accent)}
    .cm-media .play .material-symbols-outlined{font-size:32px}
    .cm-media .badge{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.5);color:#fff;font-size:11px;padding:4px 9px;border-radius:8px;font-weight:700}
    .cm-body{padding:14px 16px}
    .cm-body h4{margin:0 0 8px;font-size:14px;font-weight:800}
    .cm-step{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
    .cm-step:last-child{border-bottom:0}
    .cm-step .cn{width:22px;height:22px;border-radius:6px;flex:0 0 22px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
    .cm-step .ct{font-size:12.5px;min-width:0}
    .cm-step .ct b{display:block}
    .cm-step .ct span{color:var(--muted);font-size:11.5px}
    .side-panel{display:flex;flex-direction:column;gap:12px;min-width:0}
    .field{background:#faf6f2;border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
    .field .fl{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.5px}
    .field .fv{font-size:13px;font-weight:700;margin-top:2px}
    .chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:8px;background:#fde5df;color:var(--accent);margin:3px 3px 0 0}
    /* review board */
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;min-width:0}
    .col{background:#f1ece7;border-radius:14px;padding:12px 11px;min-width:0}
    .col > .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 3px}
    .col > .ch b{font-size:12.5px;font-weight:800}
    .col > .ch .cnt{font-size:11px;font-weight:800;background:#fff;border-radius:999px;padding:2px 8px;color:var(--muted)}
    .ticket{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
    .ticket:last-child{margin-bottom:0}
    .ticket .code{font-size:10.5px;font-weight:800;color:var(--accent);letter-spacing:.5px}
    .ticket h5{margin:3px 0 6px;font-size:13px;font-weight:700;line-height:1.35}
    .ticket .meta{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted)}
    .ticket .prio{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}
    /* timeline */
    .tl{position:relative;padding-left:26px}
    .tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line)}
    .tl .ev{position:relative;padding:0 0 18px}
    .tl .ev:last-child{padding-bottom:0}
    .tl .ev .dotm{position:absolute;left:-22px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 0 0 3px #fff}
    .tl .ev.old .dotm{border-color:var(--muted)}
    .tl .ev .vh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .tl .ev .vh b{font-size:13px}
    .tl .ev .vt{font-size:11px;color:var(--muted)}
    .tl .ev .vd{font-size:12px;color:var(--muted);margin-top:3px}
    /* qr / scan */
    .qr{width:110px;height:110px;border-radius:12px;background:
      repeating-linear-gradient(90deg,#1a1512 0 6px,#fff 6px 12px),
      repeating-linear-gradient(0deg,rgba(255,255,255,.5) 0 6px,transparent 6px 12px);
      border:6px solid #1a1512;flex:0 0 110px}
    .station{display:flex;flex-direction:column;gap:10px}
    .stn{display:flex;align-items:center;gap:12px;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff;min-width:0}
    .stn .si{width:40px;height:40px;border-radius:10px;flex:0 0 40px;display:flex;align-items:center;justify-content:center;color:#fff}
    .stn .si .material-symbols-outlined{font-size:22px}
    .stn .sx{min-width:0;flex:1}
    .stn .sx b{font-size:13px;display:block}
    .stn .sx span{font-size:11.5px;color:var(--muted)}
    .ringwrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
    /* calendar / review */
    .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;min-width:0}
    .cal .cd{aspect-ratio:1/.82;border:1px solid var(--line);border-radius:9px;padding:6px;font-size:11px;position:relative;background:#fff;min-width:0;overflow:hidden}
    .cal .cd .dn{font-weight:800;color:var(--muted)}
    .cal .cd.due{background:#fde5df;border-color:#f7b8a8}
    .cal .cd.due .dn{color:var(--accent)}
    .cal .cd .dt{position:absolute;bottom:5px;left:6px;right:6px;font-size:9.5px;font-weight:700;color:var(--accent);line-height:1.2;overflow:hidden}
    .cal .dow{font-size:10.5px;color:var(--muted);font-weight:800;text-align:center;padding-bottom:2px}
    .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);font-weight:600}
    .legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
    .note{font-size:11.5px;color:var(--muted);line-height:1.6}
    /* responsive */
    @media(max-width:1180px){ .g4{grid-template-columns:repeat(2,1fr)} .ed{grid-template-columns:1fr 1fr} .side-panel{grid-column:1/-1} }
    @media(max-width:860px){
      .shell{flex-direction:column}
      .sidebar{width:100%;flex:none;height:auto;position:sticky;top:0;flex-direction:row;align-items:center;flex-wrap:wrap;z-index:20}
      .brand{border-bottom:0;padding:12px 14px;flex:1 1 auto}
      .nav{flex-direction:row;flex-wrap:wrap;flex:1 1 100%;order:3;padding:8px 10px;gap:6px;overflow:visible}
      .nav .lbl{display:none}
      .navbtn{width:auto}
      .sbfoot{display:none}
    }
    @media(max-width:820px){
      .g4,.g3,.g2,.g23,.g32,.board,.ed{grid-template-columns:1fr}
    }
    @media(max-width:560px){
      .navbtn .nt{display:none}
      .navbtn{padding:9px 11px}
      .content{padding:16px 14px 30px}
      .topbar{padding:12px 14px}
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">menu_book</span></div>
        <div>
          <h1>SOP 指導書平台</h1>
          <p>Digital Work Instruction</p>
        </div>
      </div>
      <nav class="nav" id="nav">
        <div class="lbl">作業指導書</div>
      </nav>
      <div class="sbfoot"><span class="dot"></span> 系統正常 · 有效版 328 份</div>
    </aside>
    <div class="main">
      <div class="topbar">
        <div class="tt">
          <h2 id="scTitle">SOP 編輯器</h2>
          <p id="scSub">數位作業指導書生命週期</p>
        </div>
        <div class="spacer"></div>
        <span class="pill"><span class="material-symbols-outlined">factory</span> 第二廠 · 組裝線</span>
        <span class="pill"><span class="material-symbols-outlined">person</span> 陳品瑄 · 製程工程</span>
      </div>
      <div class="content"><div id="screen"></div></div>
    </div>
  </div>

  <script>
  (function(){
    var C={accent:"#dc2626",accent2:"#f97316",ok:"#16a34a",warn:"#f59e0b",bad:"#dc2626",info:"#2563eb",ink:"#1a1512",mut:"#6b6560",line:"#eadfd8"};
    var NAV=[
      {i:0,ic:"description",t:"SOP 編輯器"},
      {i:1,ic:"fact_check",t:"審核發行"},
      {i:2,ic:"history",t:"版本管制"},
      {i:3,ic:"task_alt",t:"推播查閱"},
      {i:4,ic:"verified",t:"閱讀簽核"},
      {i:5,ic:"calendar_month",t:"定期複審"}
    ];
    var TITLES=[
      ["SOP 編輯器","多媒體圖文/影片作業指導書線上編寫"],
      ["審核發行","SOP 編寫審核與正式發行管制"],
      ["版本管制","版本自動更新、變更履歷與失效控管"],
      ["推播查閱","更新推播與現場掃碼即時查閱"],
      ["閱讀簽核","現場閱讀簽核與完成率追蹤"],
      ["定期複審","到期提醒與定期複審更新排程"]
    ];
    var charts={};
    function destroyAll(){for(var k in charts){if(charts[k]){try{charts[k].destroy();}catch(e){}charts[k]=null;}}}
    function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
    function el(id){return document.getElementById(id);}

    (function(){
      var nav=el("nav");
      NAV.forEach(function(n){
        var b=document.createElement("button");
        b.className="navbtn";b.setAttribute("data-i",n.i);
        b.innerHTML='<span class="material-symbols-outlined">'+n.ic+'</span><span class="nt">'+n.t+'</span>';
        b.addEventListener("click",function(){location.hash="v"+n.i;});
        nav.appendChild(b);
      });
    })();

    function kpi(icon,color,val,lab,delta,dir){
      var d=delta?('<span class="delta '+(dir==="up"?"up":"down")+'"><span class="material-symbols-outlined">'+(dir==="up"?"trending_up":"trending_down")+'</span>'+delta+'</span>'):'';
      return '<div class="card kpi"><div class="top"><div class="ic" style="background:linear-gradient(135deg,'+color+','+color+'cc)"><span class="material-symbols-outlined">'+icon+'</span></div>'+d+'</div>'+
        '<div class="val">'+val+'</div><div class="lab">'+lab+'</div></div>';
    }
    function barcell(pct,color){return '<div class="bar"><i style="width:'+pct+'%;background:'+color+'"></i></div>';}
    function av(txt,color){return '<span class="avatar" style="background:'+color+'">'+txt+'</span>';}

    // ---------- SCREEN 0: EDITOR ----------
    function s0(){
      var steps=[
        {n:1,t:"基本資訊",s:"站別/產品",cls:"done"},
        {n:2,t:"作業步驟",s:"圖文編排",cls:"cur"},
        {n:3,t:"影片素材",s:"上傳連結",cls:""},
        {n:4,t:"安全重點",s:"警示標註",cls:""},
        {n:5,t:"送審發布",s:"版本設定",cls:""}
      ];
      var sv=steps.map(function(x){return '<div class="st '+x.cls+'"><div class="n">'+(x.cls==="done"?'<span class="material-symbols-outlined" style="font-size:15px">check</span>':x.n)+'</div><div class="tx"><b>'+x.t+'</b><span>'+x.s+'</span></div></div>';}).join("");
      var csteps=[
        {t:"取放料件並確認治具編號",s:"對照 JIG-A21，卡榫需完全到位"},
        {t:"執行 8 顆螺絲鎖付",s:"扭力 1.2 N·m，依對角順序"},
        {t:"貼附序號標籤",s:"掃碼確認與工單批號一致"},
        {t:"外觀與功能自主檢查",s:"無刮傷、指示燈亮起即為合格"}
      ];
      var cs=csteps.map(function(x,idx){return '<div class="cm-step"><div class="cn">'+(idx+1)+'</div><div class="ct"><b>'+esc(x.t)+'</b><span>'+esc(x.s)+'</span></div></div>';}).join("");
      var html=
        '<div class="grid g4" style="margin-bottom:16px">'+
          kpi("edit_document",C.accent,"12","編輯中草稿")+
          kpi("image",C.accent2,"5","已嵌入圖文")+
          kpi("smart_display",C.info,"2","作業影片")+
          kpi("warning",C.warn,"3","安全警示點")+
        '</div>'+
        '<div class="card"><h3><span class="material-symbols-outlined">description</span>作業指導書編輯器</h3>'+
        '<p class="sub">WI-ASM-0471 · 主機板組裝作業 · 草稿 v3.0（未發行）</p>'+
        '<div class="ed">'+
          '<div class="stepvert">'+sv+'</div>'+
          '<div class="canvas-mock">'+

        {doc:"WI-PKG-0233",n:"成品包裝與貼標",last:"2025/09/09",due:"2026/09/09",left:"26 天",cls:"t-info",own:"林建豪"},
        {doc:"WI-WLD-0415",n:"雷射焊接作業",last:"2026/02/12",due:"2027/02/12",left:"182 天",cls:"t-ok",own:"吳承翰"}
      ];
      var tr=rows.map(function(r){
        return '<tr><td class="mono" style="color:var(--accent);font-size:11.5px">'+r.doc+'</td><td>'+esc(r.n)+'</td><td style="color:var(--muted)">'+r.last+'</td><td class="mono">'+r.due+'</td><td><span class="tag '+r.cls+'">'+r.left+'</span></td><td>'+esc(r.own)+'</td></tr>';
      }).join("");
      var html=
        '<div class="grid g4" style="margin-bottom:16px">'+
          kpi("event_upcoming",C.accent,"7","30 天內到期")+
          kpi("warning",C.bad,"2","逾期未複審")+
          kpi("fact_check",C.ok,"88%","年度複審達成率","6%","up")+
          kpi("update",C.info,"12","本月已複審")+
        '</div>'+
        '<div class="grid g23">'+
          '<div class="card"><h3><span class="material-symbols-outlined">calendar_month</span>複審到期行事曆 · 2026 年 8 月</h3><p class="sub">系統依生效日 +12 個月自動排定複審</p>'+
            '<div class="cal">'+cells+'</div>'+
            '<div class="legend" style="margin-top:12px"><span><i style="background:#fde5df;border:1px solid #f7b8a8"></i>複審到期日</span><span><i style="background:#fff;border:1px solid var(--line)"></i>一般日</span></div>'+
          '</div>'+
          '<div class="card"><h3><span class="material-symbols-outlined">radar</span>複審健康度</h3><p class="sub">各面向複審合規表現</p><div class="chartbox" style="height:260px"><canvas id="c5a"></canvas></div></div>'+
        '</div>'+
        '<div class="card" style="margin-top:16px"><h3><span class="material-symbols-outlined">assignment_late</span>複審排程清單</h3><p class="sub">到期提醒 → 定期複審 → 更新版本閉環</p>'+
        '<div style="overflow-x:auto"><table><thead><tr><th>文件編號</th><th>名稱</th><th>上次複審</th><th>下次到期</th><th>剩餘</th><th>負責人</th></tr></thead><tbody>'+tr+'</tbody></table></div></div>';
      return {html:html,init:function(){
        charts.c5a=new Chart(el("c5a"),{type:"radar",data:{labels:["準時複審","版本正確","簽核完成","素材更新","安規符合"],datasets:[
          {label:"本季",data:[88,94,91,82,96],borderColor:C.accent,backgroundColor:"rgba(220,38,38,.16)",borderWidth:2,pointBackgroundColor:C.accent},
          {label:"上季",data:[74,88,80,70,90],borderColor:C.accent2,backgroundColor:"rgba(249,115,22,.10)",borderWidth:2,pointBackgroundColor:C.accent2}
        ]},options:radarOpt()});
      }};
    }

    // ---- chart option helpers ----
    function baseOpt(o){o=o||{};
      var opt={responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:!o.noLegend,position:"bottom",labels:{font:{family:"Inter",size:11},color:C.mut,usePointStyle:true,boxWidth:8,padding:14}},
          tooltip:{backgroundColor:"#1a1512",titleFont:{family:"Inter"},bodyFont:{family:"Inter"},padding:10,cornerRadius:8}},
        scales:{x:{grid:{display:false},ticks:{font:{family:"Inter",size:11},color:C.mut}},
          y:{beginAtZero:true,grid:{color:"#f0e9e3"},ticks:{font:{family:"Inter",size:11},color:C.mut}}}};
      if(o.max){opt.scales.y.max=o.max;}
      if(o.horizontal){opt.indexAxis="y";opt.scales.x.beginAtZero=true;opt.scales.x.grid={color:"#f0e9e3"};opt.scales.y.grid={display:false};}
      return opt;
    }
    function donutOpt(){return {responsive:true,maintainAspectRatio:false,cutout:"62%",
      plugins:{legend:{position:"bottom",labels:{font:{family:"Inter",size:11},color:C.mut,usePointStyle:true,boxWidth:8,padding:12}},
        tooltip:{backgroundColor:"#1a1512",padding:10,cornerRadius:8}}};}
    function radarOpt(){return {responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:"bottom",labels:{font:{family:"Inter",size:11},color:C.mut,usePointStyle:true,boxWidth:8,padding:12}}},
      scales:{r:{beginAtZero:true,max:100,grid:{color:"#eadfd8"},angleLines:{color:"#eadfd8"},pointLabels:{font:{family:"Noto Sans TC",size:11},color:C.ink},ticks:{display:false,stepSize:25}}}};}

    var BUILDERS=[s0,s1,s2,s3,s4,s5];

    function show(i){
      i=Math.max(0,Math.min(i,BUILDERS.length-1));
      destroyAll();
      var built=BUILDERS[i]();
      var cont=el("screen");
      cont.innerHTML=built.html;
      var btns=document.querySelectorAll("[data-i]");
      for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
      el("scTitle").textContent=TITLES[i][0];
      el("scSub").textContent=TITLES[i][1];
      void cont.offsetHeight;
      if(built.init){try{built.init();}catch(e){}}
    }

    function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
  })();
  </script>
