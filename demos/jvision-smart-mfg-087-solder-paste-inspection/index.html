<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPI 錫膏檢測管理｜控制中心</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --ok:#047857;
  --warn:#A84600;
  --bad:#B91C1C;
  --info:#1D4ED8;
  --shadow:0 8px 24px rgba(15,23,42,.06);
}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
body{
  margin:0;
  overflow-x:hidden;
  color:var(--ink);
  background:
    linear-gradient(rgba(37,99,235,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(37,99,235,.035) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  font-family:"Fira Sans",sans-serif;
  line-height:1.5;
}
button{font:inherit}
button,.tab{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.icon{
  width:18px;
  height:18px;
  flex:none;
  stroke:currentColor;
  fill:none;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.nav{
  position:sticky;
  top:0;
  z-index:50;
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  gap:24px;
  min-height:68px;
  padding:10px clamp(16px,3vw,40px);
  background:rgba(248,250,252,.94);
  border-bottom:1px solid var(--line);
  box-shadow:0 4px 16px rgba(15,23,42,.04);
  backdrop-filter:blur(12px);
}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;white-space:nowrap}
.logo{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--blue);
  border-radius:8px;
  box-shadow:5px 5px 0 #BFDBFE;
}
.logo .icon{width:23px;height:23px}
.brand small{
  display:block;
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:500;
  letter-spacing:.06em;
}
.tabs{
  display:flex;
  justify-content:center;
  gap:3px;
  overflow-x:auto;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:42px;
  padding:8px 11px;
  color:var(--muted);
  white-space:nowrap;
  background:transparent;
  border:1px solid transparent;
  border-radius:7px;
  font-size:13px;
  font-weight:600;
  transition:background-color .2s,color .2s,border-color .2s,transform .2s;
}
.tab:hover{color:var(--blue);background:#EFF6FF}
.tab.on{
  color:#fff;
  background:var(--blue);
  border-color:var(--blue);
  box-shadow:0 3px 0 #1E40AF;
}
.tab:active{transform:translateY(1px)}
.live{
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:#065F46;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
}
.live-mark{
  width:18px;
  height:18px;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--ok);
  border-radius:50%;
}
.live-mark .icon{width:12px;height:12px;stroke-width:2.5}
.wrap{width:min(1440px,100%);margin:auto;padding:24px clamp(14px,2.5vw,34px) 48px}
.view{animation:enter .42s cubic-bezier(.34,1.35,.64,1)}
@keyframes enter{from{opacity:0;transform:translateY(12px) scale(.992)}}
.head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:16px;
  padding:19px 20px;
  background:linear-gradient(115deg,#fff 0,#fff 68%,#EFF6FF 68%);
  border:1px solid var(--line);
  border-left:5px solid var(--blue);
  border-radius:9px;
  box-shadow:var(--shadow);
}
.eyebrow{
  margin:0 0 4px;
  color:var(--blue);
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.head h1{margin:0;font-size:clamp(21px,2.2vw,30px);line-height:1.18;letter-spacing:-.02em}
.head p{margin:7px 0 0;color:var(--muted);font-size:13px}
.chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:36px;
  padding:7px 11px;
  color:#1E40AF;
  background:#EFF6FF;
  border:1px solid #BFDBFE;
  border-radius:6px;
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:600;
  white-space:nowrap;
}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr)}
.g32{grid-template-columns:minmax(300px,1fr) minmax(0,1.5fr)}
.mb{margin-bottom:12px}
.panel,.kpi{
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:8px;
  box-shadow:var(--shadow);
}
.panel{padding:15px}
.panel h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0;
  color:var(--ink);
  font-size:14px;
  font-weight:700;
}
.panel h3 .icon{color:var(--blue)}
.sub{margin:4px 0 12px;color:var(--muted);font-size:12px}
.kpi{
  position:relative;
  overflow:hidden;
  padding:14px 15px;
  border-top:3px solid var(--blue);
  transition:transform .22s,border-color .22s,box-shadow .22s;
}
.kpi:hover{transform:translateY(-3px);border-color:#93C5FD;box-shadow:0 12px 25px rgba(37,99,235,.11)}
.kpi:after{
  content:"";
  position:absolute;
  right:-22px;
  bottom:-30px;
  width:76px;
  height:76px;
  border:12px solid #EFF6FF;
  transform:rotate(45deg);
}
.lbl{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:12px;
  font-weight:600;
}
.lbl .icon{color:var(--blue)}
.val{
  position:relative;
  z-index:1;
  margin-top:5px;
  font-family:"Fira Code",monospace;
  font-size:clamp(23px,2.5vw,30px);
  font-weight:700;
  letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;
}
.val small{color:var(--muted);font-family:"Fira Sans",sans-serif;font-size:12px}
.delta{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:3px;
  font-size:11px;
  font-weight:700;
}
.delta:before{content:"—";font-family:"Fira Code",monospace}
.up{color:var(--ok)}.up:before{content:"↑"}
.down{color:var(--bad)}.down:before{content:"!"}
.flat{color:var(--muted)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:12px}
th{
  padding:9px 10px;
  color:#334155;
  background:#F1F5F9;
  border-bottom:2px solid #CBD5E1;
  text-align:left;
  font-size:11px;
  font-weight:700;
  letter-spacing:.025em;
}
td{padding:9px 10px;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background-color .18s}
tbody tr:hover{background:#F8FAFC}
td.num,th.num{text-align:right}
.mono{
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:23px;
  padding:2px 8px;
  border:1px solid;
  border-radius:999px;
  font-size:10px;
  font-weight:700;
}
.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{color:#047857;background:#ECFDF5;border-color:#A7F3D0}
.b-warn{color:#92400E;background:#FFFBEB;border-color:#FCD34D}
.b-bad{color:#B91C1C;background:#FEF2F2;border-color:#FECACA}
.b-info{color:#1D4ED8;background:#EFF6FF;border-color:#BFDBFE}
.b-mut{color:#475569;background:#F1F5F9;border-color:#CBD5E1}
.bar{height:8px;overflow:hidden;background:#E2E8F0;border-radius:2px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:2px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.col{min-height:145px;padding:10px;background:#F8FAFC;border:1px solid var(--line);border-radius:6px}
.col h4{display:flex;align-items:center;justify-content:space-between;margin:0 0 9px;font-size:12px}
.card{
  margin-bottom:8px;
  padding:10px;
  background:#fff;
  border:1px solid var(--line);
  border-left:3px solid var(--blue);
  border-radius:5px;
  transition:transform .2s,box-shadow .2s;
}
.card:hover{transform:translateX(2px);box-shadow:0 5px 12px rgba(15,23,42,.08)}
.card .t{font-size:12px;font-weight:700}
.card .m{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:5px;color:var(--muted);font-size:10px}
.stat-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}
.stat-row:last-child{border:0}
.pill{display:inline-block;padding:3px 8px;color:#1E40AF;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:4px;font-size:10px;font-weight:700}
.tl{position:relative;padding-left:24px}
.tl:before{content:"";position:absolute;left:7px;top:5px;bottom:9px;width:2px;background:#BFDBFE}
.it{position:relative;padding-bottom:15px}
.it:before{
  content:"";
  position:absolute;
  left:-21px;
  top:3px;
  width:10px;
  height:10px;
  background:#fff;
  border:3px solid var(--blue);
  border-radius:50%;
}
.tm{color:var(--blue);font-family:"Fira Code",monospace;font-size:10px;font-weight:600}
.tt{margin-top:2px;font-size:12px;font-weight:700}
.td{margin-top:2px;color:var(--muted);font-size:11px}
.heat{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;padding:4px;background:#F1F5F9;border:1px solid var(--line);border-radius:4px}
.heat i{display:block;aspect-ratio:1;border-radius:1px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:9px;color:var(--muted);font-size:11px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px}
.gauge-wrap{display:flex;align-items:center;justify-content:center;overflow:hidden}
[id^="c"]{overflow:hidden}
.foot{
  margin-top:25px;
  padding:15px;
  color:var(--muted);
  border-top:1px solid var(--line);
  text-align:center;
  font-family:"Fira Code",monospace;
  font-size:10px;
}
@media(max-width:1100px){
  .nav{grid-template-columns:auto 1fr}.tabs{grid-row:2;grid-column:1/-1;justify-content:flex-start}.live{justify-self:end}
  .g4{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:820px){
  .g2,.g23,.g32{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(2,1fr)}
  .head{align-items:flex-start;flex-direction:column;background:#fff}
}
@media(max-width:560px){
  .nav{display:flex;gap:12px;flex-wrap:wrap;padding:9px 13px}
  .brand{flex:1}.brand small{display:none}.logo{width:36px;height:36px}
  .tabs{order:3;width:100%;justify-content:flex-start}
  .tab{min-width:42px;justify-content:center}.tab .txt{display:none}
  .wrap{padding:16px 11px 36px}.g4{grid-template-columns:1fr 1fr;gap:8px}
  .kpi{padding:12px}.val{font-size:21px}.board{grid-template-columns:1fr}
  .head{padding:16px}.chip{white-space:normal}
}
@media(max-width:390px){.g4{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .view,.kpi,.card{animation:none!important;transform:none!important}
}
</style>
</head>

};
var TABS=[
{i:0,ic:"monitoring",t:"檢測總覽"},{i:1,ic:"machine",t:"焊點量測"},
{i:2,ic:"chart",t:"SPC 製程管制"},{i:3,ic:"warning",t:"缺陷判定"},

];
var charts=[];
function el(id){return document.getElementById(id)}
function clearCharts(){charts.forEach(function(c){try{c.destroy()}catch(e){}});charts=[]}
function mk(id,opt){var n=el(id);if(!n)return;var c=new ApexCharts(n,opt);c.render();charts.push(c)}
function axis(){return{labels:{style:{colors:"#475569",fontSize:"10px",fontFamily:"Fira Code"}},axisBorder:{color:"#CBD5E1"},axisTicks:{color:"#CBD5E1"}}}
function base(extra){
