<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MES 製造執行系統｜生產現場全流程數位化</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
  :root{
    --accent:#16a34a; --accent2:#4ade80; --accent-soft:#dcfce7;
    --ink:#0f2417; --ink2:#4b5f52; --muted:#7c8b81;
    --line:#e3ebe5; --bg:#f2f6f3; --card:#ffffff;
    --shadow:0 1px 2px rgba(16,40,25,.05),0 8px 24px rgba(16,40,25,.06);
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Inter","Noto Sans TC",sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'opsz' 24;vertical-align:middle;line-height:1}
  .app{display:flex;flex-direction:column;min-height:100vh}
  .topbar{
    display:flex;align-items:center;gap:14px;
    padding:14px 22px;background:#fff;border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:40;
  }
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .logo{
    width:42px;height:42px;border-radius:12px;flex:none;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px rgba(22,163,74,.35);
  }
  .logo .material-symbols-outlined{font-size:24px}
  .brand h1{font-size:16px;margin:0;font-weight:800;letter-spacing:.2px}
  .brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
  .topbar .spacer{flex:1}
  .pill{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
    padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:#15803d;
  }
  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:blink 1.6s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}

  .shell{display:flex;flex:1;min-height:0}
  nav.side{
    width:236px;flex:none;background:#fff;border-right:1px solid var(--line);
    padding:16px 12px;display:flex;flex-direction:column;gap:4px;
  }
  nav.side .nlabel{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1px;padding:8px 12px 4px}
  .navbtn{
    display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;
    border:none;background:transparent;color:var(--ink2);cursor:pointer;
    font-family:inherit;font-size:14px;font-weight:600;text-align:left;width:100%;
    transition:background .15s,color .15s;min-width:0;
  }
  .navbtn .material-symbols-outlined{font-size:22px;flex:none}
  .navbtn .nt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .navbtn:hover{background:var(--bg)}
  .navbtn.on{background:linear-gradient(135deg,var(--accent),#15803d);color:#fff;box-shadow:0 6px 16px rgba(22,163,74,.3)}
  .navbtn .idx{margin-left:auto;font-size:11px;font-weight:700;opacity:.5;flex:none}
  .navbtn.on .idx{opacity:.85}

  main{flex:1;min-width:0;padding:22px;max-width:100%}
  .screen{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .schead{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .schead .st{min-width:0}
  .schead h2{margin:0;font-size:20px;font-weight:800}
  .schead p{margin:4px 0 0;font-size:13px;color:var(--muted)}
  .schead .tag{margin-left:auto;font-size:12px;color:var(--ink2);background:#fff;border:1px solid var(--line);padding:7px 12px;border-radius:10px;font-weight:600}

  .split{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
  .panel .ph{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .panel .ph h3{margin:0;font-size:14px;font-weight:700}
  .panel .ph .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
  .pb{padding:14px 16px}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--shadow);min-width:0}
  .kpi .kt{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
  .kpi .kt .material-symbols-outlined{font-size:16px;color:var(--accent)}
  .kpi .kv{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
  .kpi .kd{font-size:12px;margin-top:4px;font-weight:600}
  .up{color:#16a34a}.down{color:#dc2626}.warn{color:#d97706}

  .wo-row{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
  .wo-row:last-child{border-bottom:none}
  .wo-row:hover{background:var(--bg)}
  .wo-row.sel{background:var(--accent-soft)}
  .wo-row .wid{font-weight:700;font-size:13px}
  .wo-row .wsub{font-size:12px;color:var(--muted);margin-top:2px}
  .wo-row .rt{margin-left:auto;text-align:right;flex:none}
  .prio{width:6px;align-self:stretch;border-radius:3px;flex:none;min-height:32px}
  .p-high{background:#dc2626}.p-mid{background:#d97706}.p-low{background:#16a34a}

  .badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
  .b-green{background:#dcfce7;color:#15803d}
  .b-blue{background:#dbeafe;color:#1d4ed8}
  .b-amber{background:#fef3c7;color:#b45309}
  .b-red{background:#fee2e2;color:#b91c1c}
  .b-gray{background:#eef2ef;color:#556}
  .b-purple{background:#ede9fe;color:#6d28d9}

  .metagrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .meta{background:var(--bg);border-radius:10px;padding:11px 13px;min-width:0}
  .meta .ml{font-size:11px;color:var(--muted);font-weight:600}
  .meta .mv{font-size:15px;font-weight:700;margin-top:3px}
  .progress{height:8px;border-radius:6px;background:#eef2ef;overflow:hidden;margin-top:8px}
  .progress > i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:11px;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  tr:last-child td{border-bottom:none}
  .mono{font-variant-numeric:tabular-nums;font-family:"Inter",monospace}

  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:640px}
  .col{background:var(--bg);border-radius:12px;padding:10px;min-width:0}
  .col > .ch{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 6px 10px;color:var(--ink2)}
  .col > .ch .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .col .cc{margin-left:auto;font-size:11px;color:var(--muted)}
  .kcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;box-shadow:0 1px 2px rgba(16,40,25,.04)}
  .kcard:last-child{margin-bottom:0}
  .kcard .kk{font-weight:700;font-size:12px}
  .kcard .kmeta{font-size:11px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:6px}
  .kcard .kbar{height:5px;border-radius:4px;background:#eef2ef;margin-top:8px;overflow:hidden}
  .kcard .kbar>i{display:block;height:100%;background:var(--accent)}

  .stations{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .station{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);min-width:0}
  .station .snm{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}

  .chartbox{width:100%;height:280px}
  .chartbox.sm{height:220px}

  .trace{position:relative;padding-left:26px}
  .trace::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .tnode{position:relative;padding:0 0 18px}
  .tnode:last-child{padding-bottom:0}
  .tnode .tdot{position:absolute;left:-24px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 0 0 3px #fff}
  .tnode.done .tdot{background:var(--accent)}
  .tnode .tt{font-weight:700;font-size:13px}
  .tnode .td{font-size:12px;color:var(--muted);margin-top:2px}
  .tnode .ttime{font-size:11px;color:var(--accent);font-weight:600;margin-top:3px}

  .legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px}
  .lg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
  .lg .sq{width:12px;height:12px;border-radius:3px;flex:none}

  .stat-strip{display:flex;flex-wrap:wrap;gap:18px;padding:14px 16px;background:var(--bg);border-radius:12px}
  .ss{min-width:0}
  .ss .sl{font-size:11px;color:var(--muted);font-weight:600}
  .ss .sv{font-size:18px;font-weight:800;margin-top:2px}

  .alert{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:10px;background:#fef2f2;border:1px solid #fecaca;margin-bottom:8px}
  .alert:last-child{margin-bottom:0}
  .alert.ok{background:#f0fdf4;border-color:#bbf7d0}
  .alert .material-symbols-outlined{font-size:20px;flex:none}
  .alert .at{font-size:13px;font-weight:700}
  .alert .ad{font-size:12px;color:var(--ink2);margin-top:2px}

  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .btn{font-family:inherit;font-size:13px;font-weight:600;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn .material-symbols-outlined{font-size:18px}

  .subgrid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .subgrid3{display:grid;grid-template-columns:2fr 1fr;gap:18px}

  @media(max-width:860px){
    nav.side{width:100%;flex-direction:row;flex-wrap:wrap;border-right:none;border-bottom:1px solid var(--line);position:sticky;top:71px;z-index:30;padding:10px}
    nav.side .nlabel{display:none}
    .shell{flex-direction:column}
    .navbtn{width:auto;flex:none;white-space:nowrap;padding:9px 12px}
    .navbtn .idx{display:none}
  }
  @media(max-width:820px){
    .split{grid-template-columns:1fr}
    .kpis{grid-template-columns:1fr 1fr}
    .stations{grid-template-columns:1fr 1fr}
    .subgrid2,.subgrid3{grid-template-columns:1fr}
    .metagrid{grid-template-columns:1fr 1fr}
  }
  @media(max-width:560px){
    .navbtn .nt{display:none}
    .navbtn{padding:9px 11px}
    .kpis{grid-template-columns:1fr 1fr}
    .stations{grid-template-columns:1fr}
    main{padding:16px}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">precision_manufacturing</span></div>
      <div>
        <h1>MES 製造執行系統</h1>
        <p>訂單到入庫的製造現場全流程數位化</p>
      </div>
    </div>
    <div class="spacer"></div>
    <span class="pill"><span class="live-dot"></span>現場即時連線</span>
  </header>
  <div class="shell">
    <nav class="side" id="nav">
      <div class="nlabel">功能模組</div>
      <button class="navbtn on" data-i="0"><span class="material-symbols-outlined">assignment</span><span class="nt">工單派發</span><span class="idx">01</span></button>
      <button class="navbtn" data-i="1"><span class="material-symbols-outlined">view_kanban</span><span class="nt">現場執行看板</span><span class="idx">02</span></button>
      <button class="navbtn" data-i="2"><span class="material-symbols-outlined">precision_manufacturing</span><span class="nt">製程數據採集</span><span class="idx">03</span></button>
      <button class="navbtn" data-i="3"><span class="material-symbols-outlined">fact_check</span><span class="nt">品質判定</span><span class="idx">04</span></button>
      <button class="navbtn" data-i="4"><span class="material-symbols-outlined">speed</span><span class="nt">設備稼動 OEE</span><span class="idx">05</span></button>
      <button class="navbtn" data-i="5"><span class="material-symbols-outlined">genetics</span><span class="nt">批次序號追溯</span><span class="idx">06</span></button>
    </nav>
    <main id="view"></main>
  </div>
</div>
<script>
(function(){
  "use strict";
  var view = document.getElementById("view");
  var navbtns = document.querySelectorAll("[data-i]");
  var charts = [];

  function disposeCharts(){
    charts.forEach(function(c){ try{ c.dispose(); }catch(e){} });
    charts = [];
  }
  function mk(dom){ var c = echarts.init(dom); charts.push(c); return c; }

  var workOrders = [
    {id:"WO-2607-118", part:"AL-6061 散熱鰭片", cust:"泓昇科技", qty:1800, done:1240, due:"07-24", prio:"high", line:"CNC-A 線", status:"生產中", pct:69, proc:"CNC 銑削"},
    {id:"WO-2607-121", part:"SUS304 支架組", cust:"日月光", qty:900, done:0, due:"07-25", prio:"high", line:"沖壓 B 線", status:"待排程", pct:0, proc:"沖壓成型"},
    {id:"WO-2607-124", part:"PA66 齒輪箱蓋", cust:"和大工業", qty:2400, done:2400, due:"07-22", prio:"mid", line:"射出 C 線", status:"待品檢", pct:100, proc:"射出成型"},
    {id:"WO-2607-127", part:"Cu 導電端子", cust:"台達電子", qty:5200, done:3120, due:"07-26", prio:"mid", line:"沖壓 A 線", status:"生產中", pct:60, proc:"沖壓成型"},
    {id:"WO-2607-130", part:"AL-7075 結構件", cust:"漢翔航太", qty:600, done:600, due:"07-23", prio:"high", line:"CNC-B 線", status:"已入庫", pct:100, proc:"五軸加工"},
    {id:"WO-2607-133", part:"ABS 外殼上蓋", cust:"廣達電腦", qty:3000, done:450, due:"07-28", prio:"low", line:"射出 A 線", status:"生產中", pct:15, proc:"射出成型"},
    {id:"WO-2607-136", part:"鋅合金 壓鑄件", cust:"友達光電", qty:1500, done:0, due:"07-27", prio:"mid", line:"壓鑄 A 線", status:"待排程", pct:0, proc:"壓鑄成型"}
  ];
  var statusBadge = {"生產中":"b-blue","待排程":"b-gray","待品檢":"b-amber","已入庫":"b-green"};

  /* ===== SCREEN 0 — 工單派發 ===== */
  function s0(){
    var rows = workOrders.map(function(w,i){
      return '<div class="wo-row'+(i===0?' sel':'')+'" data-wo="'+i+'">'+
        '<div class="prio p-'+w.prio+'"></div>'+
        '<div style="min-width:0"><div class="wid">'+w.id+'</div><div class="wsub">'+w.part+'</div></div>'+
        '<div class="rt"><span class="badge '+statusBadge[w.status]+'">'+w.status+'</span>'+
        '<div class="wsub" style="margin-top:4px">交期 '+w.due+'</div></div></div>';
    }).join("");

    view.innerHTML =
    '<div class="screen">'+
      '<div class="schead"><div class="st"><h2>工單派發</h2><p>由 ERP 匯入訂單，依產能與交期拆併單後派發至產線工站</p></div>'+
        '<span class="tag">本週工單 7 張 · 待派發 2 張</span></div>'+
      '<div class="kpis">'+
        '<div class="kpi"><div class="kt"><span class="material-symbols-outlined">assignment</span>進行中工單</div><div class="kv">7</div><div class="kd up">＋2 較昨日</div></div>'+
        '<div class="kpi"><div class="kt"><span class="material-symbols-outlined">schedule</span>準時交付率</div><div class="kv">89%</div><div class="kd up">▲ 6% MoM</div></div>'+
        '<div class="kpi"><div class="kt"><span class="material-symbols-outlined">inventory</span>缺料工單</div><div class="kv warn">1</div><div class="kd warn">SUS304 待到料</div></div>'+
        '<div class="kpi"><div class="kt"><span class="material-symbols-outlined">factory</span>產線負載</div><div class="kv">82%</div><div class="kd down">CNC-A 逼近上限</div></div>'+
      '</div>'+
      '<div class="split">'+
        '<div class="panel"><div class="ph"><span class="material-symbols-outlined" style="color:var(--accent)">list_alt</span><h3>工單佇列</h3><span class="cnt">7 張</span></div>'+
          '<div id="woList">'+rows+'</div></div>'+
        '<div class="panel"><div class="ph"><span class="material-symbols-outlined" style="color:var(--accent)">description</span><h3>派發明細</h3><span class="cnt" id="woHint">WO-2607-118</span></div>'+
          '<div class="pb" id="woDetail"></div></div>'+
      '</div>'+
    '</div>';
    void view.offsetHeight;

    function renderDetail(idx){
      var w = workOrders[idx];
      document.getElementById("woDetail").innerHTML =
        '<div class="metagrid">'+
          '<div class="meta"><div class="ml">工單號</div><div class="mv mono">'+w.id+'</div></div>'+
          '<div class="meta"><div class="ml">客戶</div><div class="mv">'+w.cust+'</div></div>'+
          '<div class="meta"><div class="ml">料號品名</div><div class="mv" style="font-size:13px">'+w.part+'</div></div>'+
          '<div class="meta"><div class="ml">主製程</div><div class="mv" style="font-size:13px">'+w.proc+'</div></div>'+
          '<div class="meta"><div class="ml">派發產線</div><div class="mv" style="font-size:14px">'+w.line+'</div></div>'+
          '<div class="meta"><div class="ml">承諾交期</div><div class="mv">2026-'+w.due+'</div></div>'+
        '</div>'+
        '<div style="margin-top:14px;font-size:12px;color:var(--muted);font-weight:600">生產進度 '+w.done.toLocaleString()+' / '+w.qty.toLocaleString()+' 件（'+w.pct+'%）</div>'+
        '<div class="progress"><i style="width:'+w.pct+'%"></i></div>'+
        '<div class="stat-strip" style="margin-top:14px">'+
          '<div class="ss"><div class="sl">目前狀態</div><div class="sv"><span class="badge '+statusBadge[w.status]+'">'+w.status+'</span></div></div>'+
          '<div class="ss"><div class="sl">優先序</div><div class="sv" style="font-size:15px">'+(w.prio==="high"?"高":w.prio==="mid"?"中":"低")+'</div></div>'+
          '<div class="ss"><div class="sl">預估工時</div><div class="sv">'+(Math.round(w.qty/120))+' h</div></div>'+
        '</div>'+
        (w.status==="待排程" && w.id.indexOf("121")>-1 ?
          '<div class="alert" style="margin-top:14px"><span class="material-symbols-outlined" style="color:#b91c1c">inventory_2</span><div><div class="at">缺料攔阻（RULE-02）</div><div class="ad">SUS304 板材尚未到料，依規則不得排入正式生產，已通知採購。</div></div></div>'
          :'<div class="alert ok" style="margin-top:14px"><span class="material-symbols-outlined" style="color:#15803d">task_alt</span><div><div class="at">物料備妥</div><div class="ad">BOM 料件齊套，可下達現場派工。</div></div></div>')+
        '<div class="btnrow"><button class="btn pri"><span class="material-symbols-outlined">send</span>下達派工</button>'+
          '<button class="btn"><span class="material-symbols-outlined">call_split</span>拆併單</button>'+
          '<button class="btn"><span class="material-symbols-outlined">event</span>調整交期</button></div>';
      document.getElementById("woHint").textContent = w.id;
    }
    renderDetail(0);
    document.getElementById("woList").addEventListener("click", function(e){
      var r = e.target.closest("[data-wo]"); if(!r) return;
