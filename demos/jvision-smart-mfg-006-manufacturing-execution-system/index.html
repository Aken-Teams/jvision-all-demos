<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>生產現場執行管理系統｜MES</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#fff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000;
  --color-accent:#ea580c;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#1e293b;
  --color-card:#fff;
  --color-card-foreground:#1e293b;
  --color-muted:#e9eff8;
  --color-muted-foreground:#475569;
  --color-border:#e2e8f0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#1e293b;
  --muted:#475569;
  --line:#e2e8f0;
  --bg:#f8fafc;
  --card:#fff;
  --accent:#2563eb;
  --accent2:#3b82f6;
  --accent-soft:#eff6ff;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.055);
  --radius:8px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  background:var(--color-background);
  color:var(--color-foreground);
  font-family:"Fira Sans",sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button,input{font:inherit}
button,[data-wo],[data-lot],[data-sn]{cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{
  outline:3px solid rgba(37,99,235,.32);
  outline-offset:2px;
}
.material-symbols-outlined{
  font-variation-settings:"FILL" 0,"wght" 500,"opsz" 24;
  vertical-align:middle;
  line-height:1;
}
.app{display:flex;min-height:100vh}
.topbar{
  position:fixed;
  inset:0 0 auto 0;
  z-index:50;
  height:68px;
  display:flex;
  align-items:center;
  gap:16px;
  padding:0 24px;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(12px);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  flex:none;
  color:#fff;
  background:var(--color-primary);
  border-radius:6px;
  box-shadow:0 5px 14px rgba(37,99,235,.2);
}
.logo .material-symbols-outlined{font-size:23px}
.brand h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.015em}
.brand p{margin:3px 0 0;color:var(--muted);font-size:11px}
.spacer{flex:1}
.pill{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:7px 10px;
  color:#166534;
  background:#f0fdf4;
  border:1px solid #bbf7d0;
  border-radius:5px;
  font-size:11px;
  font-weight:600;
  white-space:nowrap;
}
.live-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#16a34a;
  animation:blink 1.8s ease-in-out infinite;
}
.shell{display:flex;width:100%;padding-top:68px}
.side{
  position:fixed;
  top:68px;
  bottom:0;
  left:0;
  z-index:40;
  width:220px;
  display:flex;
  flex-direction:column;
  gap:3px;
  padding:20px 12px;
  background:#fff;
  border-right:1px solid var(--line);
}
.nlabel{
  padding:0 10px 9px;
  color:#64748b;
  font-size:10px;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.navbtn{
  width:100%;
  min-height:42px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:9px 11px;
  color:#475569;
  background:transparent;
  border:1px solid transparent;
  border-radius:6px;
  font-size:13px;
  font-weight:600;
  text-align:left;
  transition:background-color .2s,color .2s,border-color .2s,transform .2s;
}
.navbtn:hover{color:#1e3a8a;background:#f8fafc;border-color:#dbeafe}
.navbtn.on{
  color:#fff;
  background:#2563eb;
  border-color:#2563eb;
  box-shadow:0 4px 12px rgba(37,99,235,.2);
}
.navbtn.on:hover{background:#1d4ed8}
.navbtn .material-symbols-outlined{font-size:20px;flex:none}
.navbtn .nt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navbtn .idx{
  margin-left:auto;
  font-family:"Fira Code",monospace;
  font-size:10px;
  opacity:.7;
}
main{
  width:calc(100% - 220px);
  min-width:0;
  margin-left:220px;
  padding:22px;
}
.screen{animation:reveal .35s ease-out both}
.schead{
  display:flex;
  align-items:flex-end;
  gap:14px;
  margin-bottom:16px;
  padding-bottom:15px;
  border-bottom:1px solid var(--line);
}
.schead .st{min-width:0}
.schead h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.025em}
.schead p{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.55}
.schead .tag{
  margin-left:auto;
  padding:7px 10px;
  color:#334155;
  background:#fff;
  border:1px solid var(--line);
  border-radius:5px;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:500;
  white-space:nowrap;
}
.split{display:grid;grid-template-columns:330px minmax(0,1fr);gap:14px;align-items:start}
.subgrid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.subgrid3{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.panel,.kpi,.station{
  min-width:0;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.panel .ph{
  min-height:47px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:11px 14px;
  border-bottom:1px solid var(--line);
}
.panel .ph>.material-symbols-outlined{font-size:18px}
.panel .ph h3{margin:0;font-size:13px;font-weight:700}
.panel .ph .cnt{
  margin-left:auto;
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:10px;
}
.pb{padding:14px}
.kpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
  margin-bottom:14px;
}
.kpi{position:relative;padding:14px;overflow:hidden}
.kpi:before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:3px;
  background:#2563eb;
}
.kpi .kt{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--muted);
  font-size:11px;
  font-weight:600;
}
.kpi .kt .material-symbols-outlined{color:#2563eb;font-size:16px}
.kpi .kv{
  margin-top:7px;
  font-family:"Fira Code",monospace;
  font-size:24px;
  font-weight:700;
  letter-spacing:-.04em;
}
.kpi .kd{margin-top:4px;font-size:11px;font-weight:600}
.up{color:#15803d}.down{color:#b91c1c}.warn{color:#b45309}
.wo-row{
  min-height:58px;
  display:flex;
  align-items:center;
  gap:9px;
  padding:9px 13px;
  border-bottom:1px solid var(--line);
  transition:background-color .2s,box-shadow .2s;
}
.wo-row:last-child{border-bottom:0}
.wo-row:hover{background:#f8fafc}
.wo-row.sel{background:#eff6ff;box-shadow:inset 3px 0 #2563eb}
.wid{font-family:"Fira Code",monospace;font-size:12px;font-weight:600}
.wsub{margin-top:3px;color:var(--muted);font-size:11px}
.rt{margin-left:auto;flex:none;text-align:right}
.prio{width:4px;min-height:34px;align-self:stretch;border-radius:2px;flex:none}
.p-high{background:#dc2626}.p-mid{background:#d97706}.p-low{background:#15803d}
.badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 7px;
  border:1px solid transparent;
  border-radius:4px;
  font-size:10px;
  font-weight:700;
  white-space:nowrap;
}
.b-green{color:#166534;background:#f0fdf4;border-color:#bbf7d0}
.b-blue{color:#1d4ed8;background:#eff6ff;border-color:#bfdbfe}
.b-amber{color:#92400e;background:#fffbeb;border-color:#fde68a}
.b-red{color:#991b1b;background:#fef2f2;border-color:#fecaca}
.b-gray{color:#475569;background:#f8fafc;border-color:#cbd5e1}
.b-purple{color:#6d28d9;background:#f5f3ff;border-color:#ddd6fe}
.metagrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.meta{
  min-width:0;
  padding:10px 11px;
  background:#f8fafc;
  border:1px solid #edf2f7;
  border-radius:5px;
}
.meta .ml{color:var(--muted);font-size:10px;font-weight:600}
.meta .mv{margin-top:4px;font-size:14px;font-weight:600}
.progress{
  height:7px;
  margin-top:7px;
  overflow:hidden;
  background:#e9eff8;
  border-radius:2px;
}
.progress>i{display:block;height:100%;background:#2563eb;border-radius:2px}
.stat-strip{
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  padding:12px;
  background:#f8fafc;
  border:1px solid #edf2f7;
  border-radius:5px;
}
.ss .sl{color:var(--muted);font-size:10px;font-weight:600}
.ss .sv{margin-top:3px;font-family:"Fira Code",monospace;font-size:17px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:12px}
th{
  padding:9px 11px;
  color:#475569;
  background:#f8fafc;
  border-bottom:1px solid var(--line);
  font-size:10px;
  font-weight:700;
  text-align:left;
  white-space:nowrap;
}
td{padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
td.numeric,th.numeric{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.mono{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;min-width:630px}
.col{min-width:0;padding:9px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:6px}
.col>.ch{
  display:flex;
  align-items:center;
  gap:6px;
  padding:2px 4px 9px;
  color:#334155;
  font-size:11px;
  font-weight:700;
}
.col>.ch .dot{width:7px;height:7px;border-radius:50%}
.col .cc{margin-left:auto;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px}
.kcard{
  margin-bottom:7px;
  padding:9px;
  background:#fff;
  border:1px solid #dbe3ee;
  border-radius:5px;
  box-shadow:0 1px 2px rgba(15,23,42,.04);
  transition:transform .2s,border-color .2s,box-shadow .2s;
}
.kcard:hover{transform:translateY(-1px);border-color:#93c5fd;box-shadow:0 5px 12px rgba(15,23,42,.07)}
.kcard:last-child{margin-bottom:0}
.kcard .kk{font-size:11px;font-weight:700}
.kcard .kmeta{display:flex;justify-content:space-between;gap:5px;margin-top:4px;color:var(--muted);font-size:10px}
.kcard .kbar{height:4px;margin-top:7px;overflow:hidden;background:#e9eff8;border-radius:1px}
.kcard .kbar>i{display:block;height:100%;background:#2563eb}
.stations{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.station{padding:12px}
.station .snm{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700}
.chartbox{width:100%;height:276px}
.chartbox.sm{height:216px}
.trace{position:relative;padding-left:25px}
.trace:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:1px;background:#cbd5e1}
.tnode{position:relative;padding-bottom:16px}
.tnode:last-child{padding-bottom:0}
.tnode .tdot{
  position:absolute;
  left:-23px;
  top:2px;
  width:14px;
  height:14px;
  background:#fff;
  border:3px solid #2563eb;
  border-radius:50%;
  box-shadow:0 0 0 2px #fff;
}
.tnode.done .tdot{background:#2563eb}
.tnode .tt{font-size:12px;font-weight:700}
.tnode .td{margin-top:2px;color:var(--muted);font-size:11px;line-height:1.45}
.tnode .ttime{margin-top:3px;color:#1d4ed8;font-family:"Fira Code",monospace;font-size:10px;font-weight:600}
.alert{
  display:flex;
  align-items:flex-start;
  gap:9px;
  margin-bottom:8px;
  padding:10px 11px;
  color:#7f1d1d;
  background:#fef2f2;
  border:1px solid #fecaca;
  border-radius:5px;
}
.alert:last-child{margin-bottom:0}
.alert.ok{color:#14532d;background:#f0fdf4;border-color:#bbf7d0}
.alert .material-symbols-outlined{font-size:18px;flex:none}
.alert .at{font-size:12px;font-weight:700}
.alert .ad{margin-top:2px;color:#475569;font-size:11px;line-height:1.5}
.btnrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.btn{
  min-height:38px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:8px 12px;
  color:#334155;
  background:#fff;
  border:1px solid #cbd5e1;
  border-radius:5px;
  font-size:12px;
  font-weight:600;
  transition:background-color .2s,border-color .2s,color .2s,box-shadow .2s,transform .2s;
}
.btn:hover{color:#1d4ed8;background:#eff6ff;border-color:#93c5fd;transform:translateY(-1px)}
.btn.pri{color:#fff;background:#ea580c;border-color:#c2410c}
.btn.pri:hover{background:#c2410c;border-color:#9a3412}
.btn .material-symbols-outlined{font-size:17px}
@keyframes reveal{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:none}
}
@keyframes blink{50%{opacity:.35}}
@media(max-width:1024px){
  .side{width:190px}
  main{width:calc(100% - 190px);margin-left:190px}
  .split{grid-template-columns:300px minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:768px){
  .topbar{height:64px;padding:0 15px}
  .brand p{display:none}
  .logo{width:36px;height:36px}
  .shell{padding-top:64px;flex-direction:column}
  .side{
    position:sticky;
    top:64px;
    width:100%;
    height:auto;
    flex-direction:row;
    overflow-x:auto;
    padding:8px 12px;
    border-right:0;
    border-bottom:1px solid var(--line);
  }
  .nlabel,.navbtn .idx{display:none}
  .navbtn{width:auto;min-width:max-content}
  main{width:100%;margin-left:0;padding:16px}
  .split,.subgrid2,.subgrid3{grid-template-columns:1fr!important}
  .stations{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:560px){
  .pill{padding:6px}.pill{font-size:0}.pill .live-dot{margin:0}
  .brand h1{font-size:14px}
  .navbtn{min-height:40px;padding:8px 10px}
  .navbtn .nt{display:none}
  .schead{align-items:flex-start}
  .schead .tag{width:100%;margin-left:0}
  .kpis,.stations,.metagrid{grid-template-columns:1fr}
  main{padding:13px}
  .panel .ph{padding:10px 12px}
  .pb{padding:12px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  .screen{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined" aria-hidden="true">precision_manufacturing</span></div>
    <div><h1>生產現場執行管理系統</h1><p>訂單到入庫的製造現場全流程數位化</p></div>
  </div>
  <div class="spacer"></div>
  <span class="pill"><span class="live-dot" aria-hidden="true"></span>現場即時連線</span>
</header>
<div class="shell">
<nav class="side" id="nav" aria-label="功能模組">
  <div class="nlabel">功能模組</div>
  <button class="navbtn on" data-i="0"><span class="material-symbols-outlined">assignment</span><span class="nt">工單派發</span><span class="idx">01</span></button>
  <button class="navbtn" data-i="1"><span class="material-symbols-outlined">view_kanban</span><span class="nt">現場執行看板</span><span class="idx">02</span></button>
  <button class="navbtn" data-i="2"><span class="material-symbols-outlined">precision_manufacturing</span><span class="nt">製程數據採集</span><span class="idx">03</span></button>
  <button class="navbtn" data-i="3"><span class="material-symbols-outlined">fact_check</span><span class="nt">品質判定</span><span class="idx">04</span></button>
  <button class="navbtn" data-i="4"><span class="material-symbols-outlined">speed</span><span class="nt">設備稼動 OEE</span><span class="idx">05</span></button>
  <button class="navbtn" data-i="5"><span class="material-symbols-outlined">genetics</span><span class="nt">批次序號追溯</span><span class="idx">06</span></button>
</nav>
<main id="view"></main>
</div>
</div>
<script>
(function(){
"use strict";
var view=document.getElementById("view");
var navbtns=document.querySelectorAll("[data-i]");
var charts=[];
function disposeCharts(){charts.forEach(function(c){try{c.dispose()}catch(e){}});charts=[]}
function mk(dom){var c=echarts.init(dom);charts.push(c);return c}
function icon(n){return'<span class="material-symbols-outlined" aria-hidden="true">'+n+"</span>"}
var workOrders=[
{id:"WO-2607-118",part:"AL-6061 散熱鰭片",cust:"泓O科技",qty:1800,done:1240,due:"07-24",prio:"high",line:"CNC-A 線",status:"生產中",pct:69,proc:"CNC 銑削"},
{id:"WO-2607-121",part:"SUS304 支架組",cust:"O辰光",qty:900,done:0,due:"07-25",prio:"high",line:"沖壓 B 線",status:"待排程",pct:0,proc:"沖壓成型"},
{id:"WO-2607-124",part:"PA66 齒輪箱蓋",cust:"O大工業",qty:2400,done:2400,due:"07-22",prio:"mid",line:"射出 C 線",status:"待品檢",pct:100,proc:"射出成型"},
{id:"WO-2607-127",part:"Cu 導電端子",cust:"O昇電子",qty:5200,done:3120,due:"07-26",prio:"mid",line:"沖壓 A 線",status:"生產中",pct:60,proc:"沖壓成型"},
{id:"WO-2607-130",part:"AL-7075 結構件",cust:"O翔航太",qty:600,done:600,due:"07-23",prio:"high",line:"CNC-B 線",status:"已入庫",pct:100,proc:"五軸加工"},
{id:"WO-2607-133",part:"ABS 外殼上蓋",cust:"O宸電腦",qty:3000,done:450,due:"07-28",prio:"low",line:"射出 A 線",status:"生產中",pct:15,proc:"射出成型"},
{id:"WO-2607-136",part:"鋅合金 壓鑄件",cust:"O暘光電",qty:1500,done:0,due:"07-27",prio:"mid",line:"壓鑄 A 線",status:"待排程",pct:0,proc:"壓鑄成型"}];
var statusBadge={"生產中":"b-blue","待排程":"b-gray","待品檢":"b-amber","已入庫":"b-green"};
