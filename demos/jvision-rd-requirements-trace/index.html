<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>需求管理與規格追溯 · PLM 研發管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700&family=Roboto+Mono:wght@300;400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#15803d;
  --color-on-primary:#fff;
  --color-secondary:#22c55e;
  --color-on-secondary:#0f172a;
  --color-accent:#d97706;
  --color-on-accent:#000;
  --color-background:#f0fdf4;
  --color-foreground:#14532d;
  --color-card:#fff;
  --color-card-foreground:#14532d;
  --color-muted:#e8f0f1;
  --color-muted-foreground:#475569;
  --color-border:#bbf7d0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#15803d;

  --blue:#15803d;
  --ink:#14532d;
  --muted:#475569;
  --line:#bbf7d0;

  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --accent-soft:#dcfce7;
  --accent-soft2:#f0fdf4;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --th:#ecfdf3;
  --hov:#f0fdf4;
  --track:#dbeae1;
  --sidebar:#0f3d27;
  --sidebar2:#14532d;
  --side-edge:rgba(255,255,255,.13);
  --ok:#15803d;
  --warn:#b45309;
  --bad:#dc2626;
  --info:#2563eb;
  --r:20px;
  --glow:rgba(21,128,61,.2);
  --shadow-sm:0 2px 8px rgba(20,83,45,.06);
  --shadow-md:0 12px 30px rgba(20,83,45,.09);
  --shadow-lg:0 22px 50px rgba(15,61,39,.14);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:"Exo",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 92% 5%,rgba(34,197,94,.12),transparent 25rem),
    radial-gradient(circle at 18% 88%,rgba(217,119,6,.07),transparent 30rem),
    var(--bg);
  color:var(--ink);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,[data-i]{cursor:pointer}
h1,h2,h3,h4{margin:0;font-family:"Exo",system-ui,sans-serif;color:var(--ink);letter-spacing:-.015em}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
:focus{outline:none}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px;box-shadow:0 0 0 6px rgba(21,128,61,.16)}
::selection{background:#bbf7d0;color:#14532d}

.app{display:flex;min-height:100vh;isolation:isolate}
.sidebar{
  width:258px;
  flex:none;
  min-width:0;
  height:100vh;
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  flex-direction:column;
  padding:24px 16px 18px;
  overflow:hidden;
  color:#f0fdf4;
  background:
    radial-gradient(circle at 15% 12%,rgba(34,197,94,.22),transparent 12rem),
    linear-gradient(168deg,var(--sidebar),var(--sidebar2));
  border-right:1px solid var(--side-edge);
  box-shadow:12px 0 34px rgba(15,61,39,.1);
}
.sidebar::before,.sidebar::after{
  content:"";
  position:absolute;
  z-index:-1;
  border:1px solid rgba(187,247,208,.15);
  border-radius:48% 52% 63% 37%/55% 38% 62% 45%;
  pointer-events:none;
}
.sidebar::before{width:230px;height:230px;right:-125px;top:34%}
.sidebar::after{width:170px;height:110px;left:-90px;bottom:7%;transform:rotate(18deg)}
.brand{display:flex;align-items:center;gap:12px;min-width:0;padding:2px 8px 24px}
.brand-logo{
  width:44px;
  height:44px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  background:linear-gradient(145deg,#22c55e,#15803d);
  border:1px solid rgba(255,255,255,.25);
  border-radius:46% 54% 58% 42%/43% 42% 58% 57%;
  box-shadow:0 10px 24px rgba(0,0,0,.2);
}
.brand-logo .material-symbols-outlined{font-size:24px}
.brand-txt{min-width:0}
.brand-txt b{display:block;color:#fff;font-size:16px;font-weight:700;letter-spacing:.04em}
.brand-txt span{display:block;margin-top:2px;color:#bbf7d0;font:500 9.5px/1.3 "Roboto Mono",monospace;letter-spacing:.13em}
.nav{position:relative;display:flex;flex-direction:column;gap:7px;min-width:0;margin-top:4px;padding-left:12px}
.nav::before{content:"";position:absolute;left:1px;top:19px;bottom:19px;width:1px;background:rgba(187,247,208,.25)}
.nav button{
  position:relative;
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
  min-height:46px;
  padding:10px 12px;
  color:#d7f7df;
  background:transparent;
  border:1px solid transparent;
  border-radius:12px 18px 14px 18px;
  font-size:13px;
  font-weight:600;
  text-align:left;
  white-space:nowrap;
  transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s ease,box-shadow .2s ease;
}
.nav button::before{content:"";position:absolute;left:-15px;width:7px;height:7px;border:2px solid #67d78b;border-radius:50%;background:var(--sidebar)}
.nav button:hover{color:#fff;background:rgba(255,255,255,.09);border-color:rgba(187,247,208,.18);transform:translateX(2px)}
.nav button.on{color:#0f3d27;background:#f0fdf4;border-color:#bbf7d0;box-shadow:0 12px 24px rgba(0,0,0,.18)}
.nav button.on::before{width:9px;height:9px;left:-16px;background:#f59e0b;border-color:#fde68a;box-shadow:0 0 0 5px rgba(245,158,11,.17)}
.nav button .material-symbols-outlined{flex:none;font-size:20px}
.nav button.on .material-symbols-outlined{color:var(--accent)}
.nav .idx{margin-left:auto;color:inherit;opacity:.68;font:700 10px "Roboto Mono",monospace}
.side-foot{margin-top:auto;padding:15px 9px 3px;border-top:1px solid rgba(255,255,255,.13);color:#ccebd5;font:400 10.5px/1.75 "Roboto Mono",monospace}
.side-foot b{color:#fff}

.main{flex:1;min-width:0;padding:24px 28px 56px}
.topbar{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  min-height:76px;
  margin-bottom:18px;
  padding:14px 18px 14px 21px;
  overflow:hidden;
  background:rgba(255,255,255,.88);
  border:1px solid var(--line);
  border-radius:18px 28px 18px 24px;
  box-shadow:var(--shadow-sm);
  backdrop-filter:blur(12px);
}
.topbar::after{content:"";position:absolute;right:16%;bottom:-42px;width:160px;height:70px;border-radius:50%;background:rgba(34,197,94,.08);pointer-events:none}
.topbar h1{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700}
.topbar h1 .material-symbols-outlined{display:grid;place-items:center;width:34px;height:34px;color:var(--accent);background:var(--accent-soft);border-radius:11px 16px 12px 15px;font-size:21px}
.topbar .sub{margin:3px 0 0 44px;color:var(--muted);font-size:12.5px}
.top-right{position:relative;z-index:1;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:6px 11px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;font-size:11px;font-weight:600;box-shadow:0 2px 5px rgba(20,83,45,.04)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(21,128,61,.13);animation:pulse 2s ease-in-out infinite}
.avatar{display:flex;align-items:center;justify-content:center;width:36px;height:36px;flex:none;color:#fff;background:linear-gradient(145deg,#15803d,#22c55e);border:2px solid #fff;border-radius:48% 52% 58% 42%/45% 44% 56% 55%;font-weight:700;box-shadow:0 5px 14px var(--glow)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.82)}}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{
  color:var(--color-card-foreground);
  background:rgba(255,255,255,.95);
  border:1px solid var(--line);
  box-shadow:var(--shadow-sm);
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.card:hover,.sec:hover,.kpi:hover,.stat:hover,.tile:hover{border-color:#86efac;box-shadow:var(--shadow-md);transform:translateY(-2px)}
.card,.sec{min-width:0;padding:17px;border-radius:18px 24px 18px 22px}
.sec{margin-bottom:14px}
.sec>h3{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:14px;font-weight:700}
.sec>h3 .material-symbols-outlined{color:var(--accent);font-size:18px}
.sec>p{margin:0 0 13px;color:var(--muted);font-size:13px;line-height:1.8}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0;font-size:13px}
.dl dt{color:var(--muted);font-size:12px;font-weight:600}
.dl dd{margin:0;line-height:1.8}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px;flex-wrap:wrap}
.card-h h3{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px;font-weight:700}
.card-h h3 .material-symbols-outlined{display:grid;place-items:center;width:28px;height:28px;color:var(--accent);background:var(--accent-soft);border-radius:9px 12px 10px 12px;font-size:17px}
.card-h .hint{color:var(--muted);font:500 10.5px "Roboto Mono",monospace}

.kpi,.stat{position:relative;min-width:0;overflow:hidden;padding:15px 16px;border-radius:18px 25px 18px 22px}
.kpi::before,.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--color-secondary),var(--color-primary))}
.kpi::after{content:"";position:absolute;right:-25px;top:-30px;width:92px;height:82px;background:rgba(34,197,94,.09);border-radius:42% 58% 55% 45%/59% 36% 64% 41%}
.kpi .ico{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;width:38px;height:38px;color:var(--accent);background:var(--accent-soft);border:1px solid #bbf7d0;border-radius:45% 55% 61% 39%/42% 44% 56% 58%}
.kpi .ico .material-symbols-outlined{font-size:20px}
.kpi .lbl,.stat .lbl{display:flex;align-items:center;gap:5px;margin-top:10px;color:var(--muted);font-size:11.5px;font-weight:600}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{color:var(--accent);font-size:15px}
.kpi .val,.stat .val,.tile .tv{font-family:"Roboto Mono",monospace;font-variant-numeric:tabular-nums lining-nums}
.kpi .val,.stat .val{margin-top:3px;color:var(--ink);font-size:24px;font-weight:700;letter-spacing:-.06em}
.kpi .val small,.stat .val small{margin-left:4px;color:var(--muted);font:600 11px "Exo",sans-serif;letter-spacing:0}
.kpi .delta,.stat .d{display:inline-flex;align-items:center;gap:3px;margin-top:5px;font-size:11px;font-weight:700}
.delta.up,.d.up{color:#15733a}.delta.down,.d.down{color:#b91c1c}.delta.flat,.d.flat{color:var(--muted)}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:14px}

.card.pad0>div[style*="overflow-x"],.card.p0>div[style*="overflow-x"]{scrollbar-color:#86efac #ecfdf3;scrollbar-width:thin}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;z-index:1;padding:11px 13px;color:#31594a;background:var(--th);border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;letter-spacing:.045em;text-align:left;white-space:nowrap}
td{padding:10px 13px;color:#244b39;background:#fff;border-bottom:1px solid #dcfce7;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--hov)}
th:first-child,td:first-child{padding-left:17px}
th:last-child,td:last-child{padding-right:17px}
td:nth-child(n+2){font-variant-numeric:tabular-nums}
td:has(> .prog),td:has(> b),td:has(> .tag){vertical-align:middle}
.mono,td:first-child,.side-foot,.idx{font-family:"Roboto Mono",monospace;font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:.01em}
.tag{display:inline-flex;align-items:center;gap:5px;min-height:23px;padding:3px 8px;border:1px solid transparent;border-radius:999px;font-size:10.5px;font-weight:700;line-height:1;white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;flex:none;border-radius:50%;background:currentColor}
.t-ok{color:#166534;background:#dcfce7;border-color:#bbf7d0}
.t-warn{color:#92400e;background:#fef3c7;border-color:#fde68a}
.t-bad{color:#b91c1c;background:#fee2e2;border-color:#fecaca}
.t-info{color:#1d4ed8;background:#dbeafe;border-color:#bfdbfe}
.t-gray{color:#475569;background:#f1f5f9;border-color:#e2e8f0}
.t-acc,.t-pink{color:#166534;background:#dcfce7;border-color:#bbf7d0}

.bar{height:8px;min-width:56px;overflow:hidden;background:var(--track);border-radius:999px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--color-secondary));border-radius:999px}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{width:39px;flex:none;color:var(--muted);font:600 10.5px "Roboto Mono",monospace;text-align:right;font-variant-numeric:tabular-nums}
.tl{position:relative;padding-left:25px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item,.tl-i{position:relative;padding:0 0 17px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;left:-23px;top:3px;width:13px;height:13px;background:#fff;border:3px solid var(--accent);border-radius:45% 55% 58% 42%}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font:600 10.5px "Roboto Mono",monospace}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:12.5px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:11.5px}
.chk{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px dashed var(--line);font-size:12.5px}
.chk:last-child{border-bottom:none}.chk .material-symbols-outlined{font-size:19px}.chk .ok{color:var(--ok)}.chk .wait{color:var(--muted)}.chk .bad{color:var(--bad)}.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}.chk small{color:var(--muted);font-size:11px}.note{margin-top:13px;padding-top:12px;color:var(--muted);border-top:1px dashed var(--line);font-size:11.5px;line-height:1.7}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.board>*{min-width:0}
.col{display:flex;flex-direction:column;gap:9px;padding:11px;background:#ecfdf3;border:1px solid var(--line);border-radius:18px 23px 16px 21px}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 6px;font-size:12.5px;font-weight:700}
.col-h .cnt{padding:2px 8px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;font:600 10.5px "Roboto Mono",monospace}
.pcard{padding:11px 12px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:11px 16px 12px 15px;box-shadow:var(--shadow-sm)}
.pcard b{font-size:12.5px}.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--muted);font:400 10.5px "Roboto Mono",monospace}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:8px;color:var(--ink);font-size:11px}
.mini-av,.av{display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--accent);background:var(--accent-soft);border:1px solid var(--line);border-radius:48% 52% 58% 42%/44% 46% 54% 56%;font-weight:700}
.mini-av{width:18px;height:18px;font-size:9px}
.av{width:26px;height:26px;font-size:11px}.who{display:inline-flex;align-items:center;gap:6px}

.lane{display:flex;flex-direction:column;gap:10px}
.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:14px 20px 14px 18px;box-shadow:var(--shadow-sm)}
.lane-row .num{display:flex;align-items:center;justify-content:center;width:32px;height:32px;flex:none;color:var(--accent);background:var(--accent-soft);border-radius:45% 55% 61% 39%/42% 44% 56% 58%;font:700 12px "Roboto Mono",monospace}
.lane-row .body{flex:1;min-width:0}.lane-row .body b{font-size:13px}.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:11.5px}
.steps{display:flex;align-items:center;flex:none}.steps .s{z-index:1;display:flex;align-items:center;justify-content:center;width:22px;height:22px;color:#64748b;background:#fff;border:2px solid var(--line);border-radius:50%;font:600 10px "Roboto Mono",monospace}.steps .ln{width:20px;height:2px;background:var(--line)}.steps .s.done{color:#fff;background:var(--accent);border-color:var(--accent)}.steps .s.cur{color:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px rgba(21,128,61,.12);animation:pulse 1.8s ease-in-out infinite}.steps .ln.done{background:var(--accent)}
.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 4px;border-bottom:1px dashed var(--line)}.rep-row:last-child{border-bottom:none}.rep-row .sku{flex:1;min-width:0}.rep-row .sku b{display:block;font-size:13px}.rep-row .sku span{color:var(--muted);font-size:11px}.gauge{width:110px;flex:none}.gauge .track{position:relative;height:8px;overflow:hidden;background:var(--track);border-radius:999px}.gauge .track i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--color-secondary));border-radius:999px}.gauge small{display:block;margin-top:3px;color:var(--muted);font:500 10px "Roboto Mono",monospace;text-align:right}
.band{position:relative;height:26px;min-width:150px;background:var(--track);border-radius:9px 13px 8px 12px}.band .rng{position:absolute;top:0;bottom:0;background:var(--accent-soft);border-radius:inherit}.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}.band .me{position:absolute;top:3px;width:12px;height:20px;background:var(--accent);border-radius:4px;box-shadow:0 2px 6px var(--glow)}

.tile{position:relative;display:flex;flex-direction:column;gap:7px;min-width:0;overflow:hidden;padding:15px 16px;border-radius:18px 25px 18px 22px}
.tile::after{content:"";position:absolute;right:-25px;bottom:-34px;width:95px;height:80px;background:rgba(34,197,94,.07);border-radius:42% 58% 55% 45%/59% 36% 64% 41%;pointer-events:none}
.tile .ti{display:flex;align-items:center;justify-content:center;width:38px;height:38px;color:var(--accent);background:var(--accent-soft);border:1px solid #bbf7d0;border-radius:44% 56% 62% 38%/43% 41% 59% 57%}
.tile .ti .material-symbols-outlined{font-size:20px}.tile b{font-size:12.5px;font-weight:700}.tile p{position:relative;z-index:1;margin:0;color:var(--muted);font-size:11.3px;line-height:1.55}.tile .tv{position:relative;z-index:1;color:var(--ink);font-size:21px;font-weight:700;letter-spacing:-.05em}

.apexcharts-canvas{margin-inline:auto}.apexcharts-text{font-family:"Exo",system-ui,sans-serif!important}.apexcharts-gridline{stroke:#dbeae1}.apexcharts-tooltip,.apexcharts-menu{border:1px solid var(--line)!important;border-radius:12px!important;box-shadow:var(--shadow-md)!important}.apexcharts-legend-text{color:var(--muted)!important}.apexcharts-series path.apexcharts-area,.apexcharts-series path.apexcharts-line{filter:saturate(.85)}

@media(min-width:1080px){
  #screen{display:grid;grid-template-columns:minmax(0,1fr) 272px;gap:14px;align-items:start}
  #screen>*{grid-column:1;margin-top:0!important}
  #screen>.grid.g4:first-child{grid-column:2;grid-row:1/span 99;display:flex;flex-direction:column;gap:12px;position:sticky;top:18px}

function buildNav(){var n=document.getElementById("nav");

 Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})})}
function show(i){killCharts();var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i)});
 RENDER[i](document.getElementById("screen"))}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?Math.min(+m[1],MODULES.length-1):0);try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
