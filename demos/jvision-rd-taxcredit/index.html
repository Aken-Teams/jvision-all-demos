<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>研發投抵與補助專案管理 · PLM 研發管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700&family=Roboto+Mono:wght@300;400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#15803D;
  --color-on-primary:#FFFFFF;
  --color-secondary:#22C55E;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDF4;
  --color-foreground:#14532D;
  --color-card:#FFFFFF;
  --color-card-foreground:#14532D;
  --color-muted:#E8F0F1;
  --color-muted-foreground:#475569;
  --color-border:#BBF7D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#15803D;

  --blue:#15803D;
  --ink:#14532D;
  --muted:#475569;
  --line:#BBF7D0;

  --accent:#15803D;
  --accent2:#22C55E;
  --accent-soft:#DCFCE7;
  --accent-soft2:#BBF7D0;
  --bg:#F0FDF4;
  --panel:#FFFFFF;
  --th:#ECFDF3;
  --hov:#F0FDF4;
  --track:#DDEBE3;
  --sidebar:#123D25;
  --sidebar2:#0D2E1B;
  --side-edge:rgba(255,255,255,.14);
  --ok:#15803D;
  --warn:#B45309;
  --bad:#B91C1C;
  --info:#0369A1;
  --r:20px;
  --glow:rgba(21,128,61,.22);
  --shadow-sm:0 2px 8px rgba(20,83,45,.06);
  --shadow-md:0 12px 30px rgba(20,83,45,.09);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  font-family:"Exo",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;
  line-height:1.5;
  color:var(--ink);
  background:
    radial-gradient(circle at 92% 4%,rgba(34,197,94,.12),transparent 26rem),
    radial-gradient(circle at 38% 92%,rgba(217,119,6,.06),transparent 30rem),
    var(--bg);
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font:inherit}
button,[role="button"],a{cursor:pointer}
h1,h2,h3,h4{margin:0;font-family:"Exo",system-ui,sans-serif;color:var(--ink)}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
  border-radius:8px;
}
::selection{color:#052E16;background:#86EFAC}

.app{display:flex;min-height:100vh}
.sidebar{
  width:254px;
  flex:none;
  min-width:0;
  height:100vh;
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  padding:24px 16px 18px;
  overflow:hidden;
  color:#F0FDF4;
  background:
    radial-gradient(circle at 12% 8%,rgba(134,239,172,.18),transparent 11rem),
    linear-gradient(165deg,var(--sidebar),var(--sidebar2));
  border-right:1px solid var(--side-edge);
  box-shadow:8px 0 28px rgba(20,83,45,.08);
}
.sidebar::after{
  content:"";
  position:absolute;
  right:-76px;
  bottom:8%;
  width:170px;
  height:230px;
  border:1px solid rgba(187,247,208,.14);
  border-radius:60% 40% 65% 35% / 45% 58% 42% 55%;
  transform:rotate(-16deg);
  pointer-events:none;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0;padding:3px 7px 24px}
.brand-logo{
  width:44px;
  height:44px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--color-on-primary);
  background:linear-gradient(145deg,#22C55E,#15803D);
  border:1px solid rgba(255,255,255,.22);
  border-radius:56% 44% 60% 40% / 44% 55% 45% 56%;
  box-shadow:0 10px 24px rgba(0,0,0,.2);
}
.brand-logo .material-symbols-outlined{font-size:24px}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-size:16px;font-weight:700;letter-spacing:.04em;color:#FFFFFF}
.brand-txt span{display:block;margin-top:2px;font:500 10px/1.4 "Roboto Mono",monospace;letter-spacing:.12em;color:#BBF7D0}
.nav{display:flex;flex-direction:column;gap:7px;min-width:0;margin-top:5px}
.nav button{
  position:relative;
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  min-height:44px;
  min-width:0;
  padding:10px 12px;
  overflow:hidden;
  color:#D1FAE5;
  background:transparent;
  border:1px solid transparent;
  border-radius:14px 18px 14px 18px;
  text-align:left;
  white-space:nowrap;
  transition:background-color .2s ease,border-color .2s ease,transform .2s ease,color .2s ease;
}
.nav button .material-symbols-outlined{flex:none;font-size:20px}
.nav button:hover{color:#FFFFFF;background:rgba(255,255,255,.09);border-color:rgba(187,247,208,.16);transform:translateX(2px)}
.nav button.on{
  color:#052E16;
  background:#DCFCE7;
  border-color:#86EFAC;
  box-shadow:0 8px 20px rgba(0,0,0,.15);
}
.nav button.on::before{
  content:"";
  position:absolute;
  left:0;
  top:9px;
  bottom:9px;
  width:4px;
  border-radius:0 5px 5px 0;
  background:var(--color-accent);
}
.nav .idx{margin-left:auto;font:500 10px/1 "Roboto Mono",monospace;opacity:.72}
.side-foot{
  position:relative;
  z-index:1;
  margin-top:auto;
  padding:15px 9px 2px;
  color:#A7F3D0;
  border-top:1px solid rgba(255,255,255,.13);
  font:400 10.5px/1.7 "Roboto Mono",monospace;
}
.side-foot b{color:#FFFFFF}

.main{flex:1;min-width:0;padding:26px 30px 60px}
.topbar{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  margin-bottom:20px;
  padding:18px 20px;
  flex-wrap:wrap;
  background:rgba(255,255,255,.78);
  border:1px solid rgba(187,247,208,.9);
  border-radius:22px 18px 28px 18px;
  box-shadow:var(--shadow-sm);
  backdrop-filter:blur(12px);
}
.topbar::before{
  content:"";
  position:absolute;
  left:20px;
  bottom:-1px;
  width:72px;
  height:3px;
  background:linear-gradient(90deg,var(--color-primary),var(--color-secondary));
  border-radius:999px;
}
.topbar h1{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;letter-spacing:.01em}
.topbar h1 .material-symbols-outlined{font-size:26px;color:var(--color-primary)}
.topbar .sub{margin-top:4px;color:var(--muted);font-size:12.5px;font-weight:500}
.top-right{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:34px;
  padding:6px 12px;
  color:var(--muted);
  background:#FFFFFF;
  border:1px solid var(--line);
  border-radius:999px;
  font-size:11.5px;
  font-weight:600;
  box-shadow:0 1px 3px rgba(20,83,45,.04);
}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(21,128,61,.14);animation:pulse 2.4s ease-in-out infinite}
.avatar{
  width:36px;
  height:36px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#FFFFFF;
  background:linear-gradient(145deg,var(--color-primary),#166534);
  border:2px solid #DCFCE7;
  border-radius:58% 42% 55% 45% / 44% 58% 42% 56%;
  font-size:12px;
  font-weight:700;
  box-shadow:0 5px 14px var(--glow);
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.62;transform:scale(.86)}}

.grid{display:grid;gap:15px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g32{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.grid>*{min-width:0}
.card,.sec,.tile,.kpi,.stat{
  color:var(--color-card-foreground);
  background:rgba(255,255,255,.94);
  border:1px solid var(--line);
  box-shadow:var(--shadow-sm);
}
.card,.sec{min-width:0;padding:18px;border-radius:20px 24px 20px 24px}
.card:hover,.sec:hover,.tile:hover,.kpi:hover,.stat:hover{border-color:#86EFAC;box-shadow:var(--shadow-md)}
.sec{margin-bottom:15px}
.sec>h3,.card-h h3{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:14.5px;
  font-weight:700;
}
.sec>h3{margin-bottom:13px}
.sec>h3 .material-symbols-outlined,.card-h h3 .material-symbols-outlined{font-size:19px;color:var(--color-primary)}
.sec>p{margin:0 0 13px;color:var(--muted);font-size:13px;line-height:1.8}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0;font-size:13px}
.dl dt{color:var(--muted);font-size:12px;font-weight:600}
.dl dd{margin:0;line-height:1.8}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h .hint{color:var(--muted);font:500 11px/1.4 "Roboto Mono",monospace}

.kpi,.stat,.tile{
  position:relative;
  min-width:0;
  overflow:hidden;
  padding:17px 18px;
  border-left:1px solid var(--line);
  border-radius:22px 18px 26px 18px;
}
.kpi::before,.stat::before,.tile::before{
  content:"";
  position:absolute;
  left:0;
  top:18px;
  width:4px;
  height:36px;
  border-radius:0 999px 999px 0;
  background:linear-gradient(180deg,var(--color-secondary),var(--color-primary));
}
.kpi::after,.tile::after{
  content:"";
  position:absolute;
  right:-30px;
  top:-35px;
  width:105px;
  height:105px;
  border-radius:62% 38% 58% 42% / 42% 54% 46% 58%;
  background:linear-gradient(145deg,rgba(187,247,208,.65),rgba(240,253,244,.2));
  pointer-events:none;
}
.kpi .ico,.tile .ti{
  position:absolute;
  z-index:1;
  right:15px;
  top:15px;
  width:34px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--color-primary);
  background:#ECFDF3;
  border:1px solid #BBF7D0;
  border-radius:55% 45% 60% 40% / 45% 60% 40% 55%;
}
.kpi .ico .material-symbols-outlined,.tile .ti .material-symbols-outlined{font-size:20px}
.kpi .lbl,.stat .lbl{display:flex;align-items:center;gap:5px;margin-top:0;color:var(--muted);font-size:12px;font-weight:600}
.stat .lbl .material-symbols-outlined{font-size:15px;color:var(--color-primary)}
.kpi .val,.stat .val,.tile .tv{
  margin-top:6px;
  color:#0F5132;
  font:700 27px/1.15 "Roboto Mono",monospace;
  letter-spacing:-.05em;
  font-variant-numeric:tabular-nums;
}
.kpi .val small,.stat .val small{margin-left:4px;color:var(--muted);font:600 12px/1 "Exo",sans-serif;letter-spacing:0}
.kpi .delta,.stat .d{display:inline-flex;align-items:center;gap:3px;margin-top:7px;font-size:11.5px;font-weight:700}
.delta.up,.d.up{color:#166534}
.delta.down,.d.down{color:#B91C1C}
.delta.flat,.d.flat{color:var(--muted)}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:15px}
.tile{display:flex;flex-direction:column;gap:7px;min-height:142px}
.tile b{max-width:calc(100% - 44px);font-size:13px;font-weight:700}
.tile p{max-width:92%;margin:0;color:var(--muted);font-size:11.8px;line-height:1.55}
.tile .tv{margin-top:auto;font-size:25px}

.card.pad0 .card-h{padding:18px 18px 0!important}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;font-variant-numeric:tabular-nums}
th{
  padding:11px 14px;
  color:#365A49;
  background:var(--th);
  border-bottom:1px solid var(--line);
  text-align:left;
  white-space:nowrap;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.04em;
}
td{padding:11px 14px;color:#183F2A;border-bottom:1px solid #DDF5E5;white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:var(--hov)}
td:nth-child(n+2){font-variant-numeric:tabular-nums}
td b{font-weight:700}
.mono{font-family:"Roboto Mono",monospace;font-weight:500;letter-spacing:-.02em}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 9px;
  border:1px solid transparent;
  border-radius:999px;
  white-space:nowrap;
  font-size:10.5px;
  font-weight:700;
}
.tag::before{content:"";width:6px;height:6px;flex:none;border:2px solid currentColor;border-radius:50%}
.t-ok{color:#166534;background:#DCFCE7;border-color:#86EFAC}
.t-warn{color:#92400E;background:#FEF3C7;border-color:#FCD34D}
.t-bad{color:#991B1B;background:#FEE2E2;border-color:#FCA5A5}
.t-info{color:#075985;background:#E0F2FE;border-color:#7DD3FC}
.t-gray{color:#475569;background:#F1F5F9;border-color:#CBD5E1}
.t-acc,.t-pink{color:#14532D;background:#DCFCE7;border-color:#86EFAC}

.bar{height:8px;min-width:58px;overflow:hidden;background:var(--track);border:1px solid #CEE6D6;border-radius:999px}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--color-primary),var(--color-secondary))}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{width:40px;flex:none;color:#365A49;text-align:right;font:600 10.5px/1 "Roboto Mono",monospace}

.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item,.tl-i{position:relative;padding:0 0 17px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;left:-24px;top:3px;width:14px;height:14px;border:3px solid var(--color-primary);border-radius:55% 45% 60% 40%;background:#FFFFFF}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font:500 10.5px/1.4 "Roboto Mono",monospace}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:12.5px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:11.5px}

.chk{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px dashed var(--line);font-size:12.5px}
.chk:last-child{border-bottom:none}
.chk .material-symbols-outlined{font-size:19px}
.chk .ok{color:var(--ok)}
.chk .wait{color:var(--muted)}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--muted);font-size:11px}
.note{margin-top:13px;padding-top:12px;color:var(--muted);border-top:1px dashed var(--line);font-size:11.5px;line-height:1.7}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.board>*{min-width:0}
.col{display:flex;flex-direction:column;gap:9px;padding:12px;background:#ECFDF3;border:1px solid var(--line);border-radius:20px 16px 22px 17px}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 6px;font-size:12.5px;font-weight:700}
.col-h .cnt{padding:2px 9px;color:var(--muted);background:#FFFFFF;border:1px solid var(--line);border-radius:999px;font:600 10.5px/1.4 "Roboto Mono",monospace}
.pcard{padding:11px 12px;background:#FFFFFF;border:1px solid var(--line);border-left:3px solid var(--color-primary);border-radius:12px 16px 12px 16px;box-shadow:var(--shadow-sm)}
.pcard b{font-size:12.5px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--muted);font-size:11px}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:8px;color:var(--ink);font-size:11px}
.mini-av,.av{display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--color-primary);background:#DCFCE7;border:1px solid #86EFAC;border-radius:50%;font-weight:700}
.mini-av{width:19px;height:19px;font-size:9px}
.av{width:27px;height:27px;font-size:10.5px}
.who{display:inline-flex;align-items:center;gap:6px}

.lane{display:flex;flex-direction:column;gap:11px}
.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 14px;background:#FFFFFF;border:1px solid var(--line);border-radius:17px 14px 20px 14px}
.lane-row .num{width:32px;height:32px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--color-primary);background:#DCFCE7;border:1px solid #86EFAC;border-radius:50%;font:700 12px/1 "Roboto Mono",monospace}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:13.5px}
.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:11.5px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{z-index:1;width:23px;height:23px;display:flex;align-items:center;justify-content:center;color:#64748B;background:#FFFFFF;border:2px solid #CBD5E1;border-radius:50%;font:600 10px/1 "Roboto Mono",monospace}
.steps .ln{width:20px;height:2px;background:#CBD5E1}
.steps .s.done{color:#FFFFFF;background:var(--color-primary);border-color:var(--color-primary)}
.steps .s.cur{color:var(--color-primary);border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(21,128,61,.12);animation:pulse 1.8s ease-in-out infinite}
.steps .ln.done{background:var(--color-primary)}

.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 4px;border-bottom:1px dashed var(--line)}
.rep-row:last-child{border-bottom:none}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:13px}
.rep-row .sku span{color:var(--muted);font-size:11px}
.gauge{width:110px;flex:none}
.gauge .track{position:relative;height:8px;overflow:hidden;background:var(--track);border-radius:999px}
.gauge .track i{display:block;height:100%;background:linear-gradient(90deg,var(--color-primary),var(--color-secondary));border-radius:999px}
.gauge small{display:block;margin-top:3px;color:var(--muted);text-align:right;font:500 10px/1.4 "Roboto Mono",monospace}
.band{position:relative;height:27px;min-width:150px;background:var(--track);border-radius:999px}
.band .rng{position:absolute;top:0;bottom:0;background:#BBF7D0;border-radius:999px}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
.band .me{position:absolute;top:3px;width:12px;height:21px;background:var(--color-accent);border:2px solid #FFFFFF;border-radius:999px;box-shadow:0 2px 7px rgba(217,119,6,.28)}

@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;flex-direction:row;align-items:center;flex-wrap:wrap;padding:12px 14px;gap:7px;border-right:0;border-bottom:1px solid var(--side-edge)}
  .sidebar::after,.side-foot{display:none}
  .brand{padding:0 10px 0 2px}
  .brand-logo{width:39px;height:39px}
  .nav{flex:1;flex-direction:row;flex-wrap:wrap;gap:6px;margin-top:0}
  .nav button{width:auto;min-height:42px;padding:9px 11px}
  .nav button:hover{transform:none}
  .nav button.on::before{left:8px;right:8px;top:auto;bottom:0;width:auto;height:3px;border-radius:999px 999px 0 0}
  .nav .idx{display:none}
  .main{padding:18px 16px 46px}
}
@media(max-width:820px){
  .g2,.g3,.g23,.g32{grid-template-columns:1fr}
}
@media(max-width:560px){
  body{font-size:13.5px}

var RENDER=[v0,v1,v2,v3];



/* ── 導覽 ── */
function buildNav(){var n=document.getElementById("nav");
 n.innerHTML=MODULES.map(function(m,i){return '<button type="button" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'}).join("");
 Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})})}
function show(i){killCharts();var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i)});
 RENDER[i](document.getElementById("screen"))}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?Math.min(+m[1],MODULES.length-1):0);try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
