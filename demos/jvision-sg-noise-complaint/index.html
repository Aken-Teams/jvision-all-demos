<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>噪音振動與環保陳情管理 · ESG 永續管理系統</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000000;
  --color-secondary:#10b981;
  --color-on-secondary:#0f172a;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#ecfdf5;
  --color-foreground:#064e3b;
  --color-card:#ffffff;
  --color-card-foreground:#064e3b;
  --color-muted:#e8f1f3;
  --color-muted-foreground:#475569;
  --color-border:#a7f3d0;
  --color-destructive:#dc2626;
  --color-on-destructive:#ffffff;
  --color-ring:#059669;
  --blue:#059669;
  --ink:#064e3b;
  --muted:#475569;
  --line:#a7f3d0;
  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --accent-soft:#d1fae5;
  --accent-soft2:#a7f3d0;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --th:#f0fdf4;
  --hov:#ecfdf5;
  --track:#dcefe8;
  --sidebar:#ffffff;
  --sidebar2:#f0fdf4;
  --side-edge:var(--color-border);
  --ok:#047857;
  --warn:#a16207;
  --bad:#dc2626;
  --info:#2563eb;
  --r:20px;
  --glow:rgba(5,150,105,.2);
  --shadow-sm:0 2px 8px rgba(6,78,59,.06);
  --shadow-md:0 14px 34px rgba(6,78,59,.09);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:"Fira Sans",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;z-index:-1;inset:0;background:radial-gradient(circle at 88% 6%,rgba(16,185,129,.16),transparent 27%),radial-gradient(ellipse at 4% 88%,rgba(167,243,208,.38),transparent 32%);pointer-events:none}
button,input,select,textarea{font:inherit}
button,[data-i]{cursor:pointer}
h1,h2,h3,h4{font-family:"Fira Sans",sans-serif;margin:0;color:var(--ink);letter-spacing:-.02em}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px;border-radius:8px}
::selection{background:#a7f3d0;color:#064e3b}
.app{display:flex;min-height:100vh}
.sidebar{width:260px;flex:none;min-width:0;background:rgba(255,255,255,.93);color:var(--ink);display:flex;flex-direction:column;padding:24px 17px;position:sticky;top:0;height:100vh;border-right:1px solid var(--line);box-shadow:8px 0 30px rgba(6,78,59,.04);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:12px;padding:3px 7px 23px;min-width:0}
.brand-logo{width:44px;height:44px;flex:none;border-radius:17px 13px 18px 12px;background:linear-gradient(145deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#001d14;box-shadow:0 9px 22px var(--glow)}
.brand-logo .material-symbols-outlined{font-size:24px}
.brand-txt b{display:block;font-weight:700;font-size:16px;letter-spacing:.02em}

.nav button .material-symbols-outlined{font-size:20px;flex:none}

.nav button.on{background:linear-gradient(135deg,#d1fae5,#ecfdf5);border-color:#6ee7b7;color:#065f46;font-weight:700;box-shadow:var(--shadow-sm)}

.main{flex:1;min-width:0;padding:30px clamp(18px,3vw,42px) 64px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px;flex-wrap:wrap}
.topbar h1{font-size:clamp(20px,2vw,26px);font-weight:700;display:flex;align-items:center;gap:10px}
.topbar h1 .material-symbols-outlined{width:38px;height:38px;border-radius:14px 11px 15px 12px;background:#d1fae5;color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-size:22px}
.topbar .sub{font-size:12.5px;color:var(--muted);margin-top:5px}
.top-right{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:11.5px;font-weight:600;color:var(--muted);box-shadow:var(--shadow-sm)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(4,120,87,.14);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.82)}}
.avatar{width:36px;height:36px;border-radius:15px 12px 16px 11px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#001d14;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex:none;box-shadow:var(--shadow-sm)}
.grid{display:grid;gap:17px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g23{grid-template-columns:2fr 1fr}.g32{grid-template-columns:1.4fr 1fr}.grid>*{min-width:0}
.card,.sec{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:22px 17px 24px 18px;padding:19px;min-width:0;box-shadow:var(--shadow-sm);animation:reveal .36s ease-out both}
.card:hover,.sec:hover{box-shadow:var(--shadow-md);border-color:#6ee7b7}
.sec{margin-bottom:17px}
.sec>h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:14px}

.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;font-size:13px;margin:0}.dl dt{color:var(--muted);font-size:12px;font-weight:600}.dl dd{margin:0;line-height:1.75}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;min-width:0}
.card-h h3 .material-symbols-outlined{width:30px;height:30px;border-radius:11px 9px 12px 8px;background:#d1fae5;display:inline-flex;align-items:center;justify-content:center;font-size:18px;color:var(--accent)}
.card-h .hint{font-size:11.5px;color:var(--muted);font-family:"Fira Code",monospace}
.kpi,.stat,.tile{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:22px 15px 24px 17px;padding:18px 19px;position:relative;overflow:hidden;min-width:0;box-shadow:var(--shadow-sm);animation:reveal .36s ease-out both;transition:transform .2s,box-shadow .2s,border-color .2s}
.kpi::after,.tile::after{content:"";position:absolute;right:-24px;top:-28px;width:94px;height:94px;border-radius:54% 46% 61% 39%;background:linear-gradient(145deg,#d1fae5,#ecfdf5);opacity:.9}
.kpi:hover,.stat:hover,.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:#6ee7b7}
.kpi .ico,.tile .ti{width:39px;height:39px;border-radius:15px 11px 16px 10px;display:flex;align-items:center;justify-content:center;background:#d1fae5;color:var(--accent);position:relative;z-index:1}
.kpi .ico .material-symbols-outlined,.tile .ti .material-symbols-outlined{font-size:21px}
.kpi .lbl,.stat .lbl{font-size:12px;color:var(--muted);margin-top:12px;font-weight:500;display:flex;align-items:center;gap:5px}.stat .lbl{margin-top:0}.stat .lbl .material-symbols-outlined{font-size:15px;color:var(--accent)}
.kpi .val,.stat .val,.tile .tv{font-family:"Fira Code",monospace;font-size:26px;font-weight:700;letter-spacing:-.04em;margin-top:4px;color:var(--ink);font-variant-numeric:tabular-nums}
.kpi .val small,.stat .val small{font-family:"Fira Sans",sans-serif;font-size:13px;font-weight:600;color:var(--muted);margin-left:4px}
.kpi .delta,.stat .d{font-size:11.5px;font-weight:700;margin-top:6px;display:inline-flex;align-items:center;gap:3px}.delta.up,.d.up{color:var(--ok)}.delta.down,.d.down{color:#b91c1c}.delta.flat,.d.flat{color:var(--muted)}.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:14px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:600;color:#334155;font-size:11px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--th);letter-spacing:.02em;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid #d9eee5;white-space:nowrap;color:#164e3d}
td:nth-child(n+2){font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}tbody tr{transition:background-color .18s}tbody tr:hover{background:#f0fdf4}
.mono{font-family:"Fira Code",monospace;font-weight:600;letter-spacing:0}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:10.5px;font-weight:700;white-space:nowrap;border:1px solid currentColor}
.tag::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.t-ok{background:#ecfdf5;color:#047857}.t-warn{background:#fffbeb;color:#92400e}.t-bad{background:#fef2f2;color:#b91c1c}.t-info{background:#eff6ff;color:#1d4ed8}.t-gray{background:#f1f5f9;color:#475569}.t-acc,.t-pink{background:#ecfdf5;color:#047857}
.bar{height:8px;border-radius:999px;background:var(--track);overflow:hidden;min-width:56px}.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2))}.prog{display:flex;align-items:center;gap:8px;min-width:0}.prog small{font-family:"Fira Code",monospace;font-size:10.5px;color:var(--muted);font-weight:600;width:40px;flex:none;text-align:right}
.tl{position:relative;padding-left:27px}.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}.tl-item,.tl-i{position:relative;padding:0 0 18px}.tl-item:last-child,.tl-i:last-child{padding-bottom:0}.tl-dot,.tl-d{position:absolute;left:-26px;top:3px;width:15px;height:15px;border-radius:50%;background:#fff;border:4px solid var(--accent)}.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}.tl-time,.tl-t{font-family:"Fira Code",monospace;font-size:10.5px;color:var(--muted);font-weight:600}.tl-item b,.tl-i b{font-size:12.5px;display:block;margin:3px 0}.tl-item p,.tl-i p{margin:0;font-size:11.5px;color:var(--muted)}
.chk{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:9px 2px;border-bottom:1px dashed var(--line)}.chk:last-child{border-bottom:none}.chk .material-symbols-outlined{font-size:19px}.chk .ok{color:var(--ok)}.chk .wait{color:var(--muted)}.chk .bad{color:var(--bad)}.chk .warn{color:var(--warn)}.chk .n{flex:1;min-width:0}.chk small{color:var(--muted);font-size:11px}.note{font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:13px;padding-top:12px;border-top:1px dashed var(--line)}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.col{background:#f0fdf4;border:1px solid var(--line);border-radius:20px 15px 22px 16px;padding:12px;display:flex;flex-direction:column;gap:10px}.col-h{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;padding:2px 4px 6px}.col-h .cnt{background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-family:"Fira Code",monospace;font-size:10.5px;color:var(--muted)}.pcard{background:#fff;border:1px solid var(--line);border-radius:15px 12px 16px 11px;padding:12px;border-left:4px solid var(--accent);box-shadow:var(--shadow-sm)}.pcard b{font-size:12.5px}.pcard .meta{font-size:11px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;gap:8px;align-items:center}.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:11px;color:var(--ink)}.mini-av,.av{border-radius:50%;background:#d1fae5;color:#047857;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}.mini-av{width:19px;height:19px;font-size:9px}.av{width:27px;height:27px;font-size:11px}.who{display:inline-flex;align-items:center;gap:6px}
.lane{display:flex;flex-direction:column;gap:11px}.lane-row{display:flex;align-items:center;gap:13px;padding:13px 14px;border:1px solid var(--line);border-radius:17px 13px 18px 14px;background:#fff;min-width:0}.lane-row .num{width:33px;height:33px;flex:none;border-radius:13px 10px 14px 9px;background:#d1fae5;color:#047857;display:flex;align-items:center;justify-content:center;font-family:"Fira Code",monospace;font-weight:700;font-size:12px}.lane-row .body{flex:1;min-width:0}.lane-row .body b{font-size:13.5px}.lane-row .body p{margin:2px 0 0;font-size:11.5px;color:var(--muted)}.steps{display:flex;align-items:center;flex:none}.steps .s{width:23px;height:23px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:"Fira Code",monospace;font-size:10px;color:#64748b;background:#fff;z-index:1}.steps .ln{width:20px;height:2px;background:var(--line)}.steps .s.done{background:var(--accent);border-color:var(--accent);color:#001d14}.steps .s.cur{border-color:var(--accent);color:#047857;animation:pulse 1.6s infinite}.steps .ln.done{background:var(--accent)}
.rep-row{display:flex;align-items:center;gap:13px;padding:12px 4px;border-bottom:1px dashed var(--line);min-width:0}.rep-row:last-child{border-bottom:none}.rep-row .sku{flex:1;min-width:0}.rep-row .sku b{font-size:13px;display:block}.rep-row .sku span{font-size:11px;color:var(--muted)}.gauge{width:110px;flex:none}.gauge .track{height:8px;border-radius:999px;background:var(--track);position:relative;overflow:hidden}.gauge .track i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2))}.gauge small{font-family:"Fira Code",monospace;font-size:10px;color:var(--muted);display:block;margin-top:3px;text-align:right}
.band{position:relative;height:27px;border-radius:10px 7px 11px 8px;background:var(--track);min-width:150px}.band .rng{position:absolute;top:0;bottom:0;border-radius:inherit;background:#a7f3d0}.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}.band .me{position:absolute;top:3px;width:12px;height:21px;border-radius:5px;background:var(--accent);box-shadow:0 2px 7px var(--glow)}
.tile{display:flex;flex-direction:column;gap:8px}.tile .ti{position:relative;z-index:1}.tile b{font-size:14px;font-weight:700}.tile p{margin:0;font-size:11.8px;color:var(--muted);line-height:1.6}.tile .tv{font-size:25px;margin-top:0;position:relative;z-index:1}
@keyframes reveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:860px){.app{flex-direction:column}.sidebar{width:100%;height:auto;position:static;flex-direction:row;align-items:center;flex-wrap:wrap;padding:12px 14px;gap:7px;border-right:none;border-bottom:1px solid var(--line)}.brand{padding:0 12px 0 4px}.side-foot{display:none}.nav{flex-direction:row;flex-wrap:wrap;gap:6px;margin-top:0;flex:1}.nav button{padding:9px 11px}.nav .idx{display:none}.main{padding:22px 16px 48px}}
@media(max-width:820px){.g2,.g3,.g23,.g32{grid-template-columns:1fr}}
@media(max-width:700px){.dl{grid-template-columns:1fr;gap:2px 0}.dl dt{margin-top:9px}}
@media(max-width:560px){.g4{grid-template-columns:1fr}.board{grid-template-columns:1fr}.nav button .txt{display:none}.nav button{min-width:44px;min-height:44px;justify-content:center}.topbar{align-items:flex-start}.topbar h1{font-size:19px}.top-right{width:100%}.chip{flex:1;justify-content:center}.card,.sec{border-radius:18px 14px 20px 15px;padding:16px}.kpi,.stat,.tile{min-height:142px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important;transform:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">graphic_eq</span></div>
      <div class="brand-txt"><b>陳情處理台</b><span>NOISE & COMPLAINT</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">本年度陳情 18 件<br/>監測點 8 處<br/>版本 <b>v1.0.0</b> · 純 UI 展示</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1><span class="material-symbols-outlined" id="th-ico"></span><span id="th-title"></span></h1>
        <div class="sub" id="th-sub"></div>
      </div>
      <div class="top-right">
        <span class="chip"><span class="dot"></span>系統連線正常</span>
        <span class="chip"><span class="material-symbols-outlined" style="font-size:16px;color:var(--accent)">calendar_today</span>2026/08/20</span>
        <div class="avatar">資</div>
      </div>
    </div>
    <div id="screen"></div>
  </main>
</div>
<script>
/* ── 共用工具（同時支援兩種內容方言）── */
var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy()}catch(e){}}charts=[]}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function money(n){try{return Number(n).toLocaleString("en-US")}catch(e){return String(n)}}
function _kpi(a){return '<div class="grid g4">'+a.map(function(k){
  var ic=k.cls==="up"?"trending_up":(k.cls==="down"?"trending_down":"trending_flat");
  return '<div class="kpi"><div class="ico"><span class="material-symbols-outlined">'+k.ico+'</span></div>'+
   '<div class="lbl">'+esc(k.lbl)+'</div><div class="val">'+k.val+(k.u?'<small>'+k.u+'</small>':'')+'</div>'+
   '<div class="delta '+k.cls+'"><span class="material-symbols-outlined">'+ic+'</span>'+esc(k.d)+'</div></div>'}).join("")+'</div>'}
var kpiGrid=_kpi, stats=_kpi;
function tbl(h,r){return '<div style="overflow-x:auto"><table><thead><tr>'+h.map(function(x){return '<th>'+esc(x)+'</th>'}).join("")+
 '</tr></thead><tbody>'+r.map(function(x){return '<tr>'+x.map(function(c,i){return '<td'+(i===0?' class="mono"':'')+'>'+c+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div>'}
function pg(p){return '<div class="prog"><div class="bar" style="flex:1"><i style="width:'+p+'%"></i></div><small>'+p+'%</small></div>'}
var progCell=pg;
function _tl(a){return '<div class="tl">'+a.map(function(t){return '<div class="tl-item"><div class="tl-dot '+(t.k||"")+'"></div><div class="tl-time">'+esc(t.t)+'</div><b>'+esc(t.b)+'</b><p>'+esc(t.p)+'</p></div>'}).join("")+'</div>'}
var tl=_tl, tlHtml=_tl;

function buildNav(){var n=document.getElementById("nav");

window.addEventListener("hashchange",fromHash);fromHash();
