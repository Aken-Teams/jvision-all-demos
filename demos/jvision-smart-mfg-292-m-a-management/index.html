<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>併購管理系統（M&amp;A Management）</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#7c3aed; --accent2:#a78bfa; --accent-soft:#f3effe;
  --ink:#1e1b2e; --muted:#6b6787; --line:#e7e3f3; --bg:#f6f4fb; --card:#ffffff;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.app{max-width:1360px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
.hdr{background:linear-gradient(120deg,#5b21b6,#7c3aed 55%,#8b5cf6);color:#fff;padding:18px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.hdr .logo{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hdr .logo .material-symbols-outlined{font-size:28px;}
.hdr h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.3px;}
.hdr .sub{font-size:12.5px;opacity:.85;margin-top:2px;}
.hdr .spacer{flex:1;min-width:12px;}
.hdr .badge{font-size:11px;background:rgba(255,255,255,.16);padding:5px 11px;border-radius:20px;white-space:nowrap;}
.nav{background:var(--card);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;position:sticky;top:0;z-index:20;}
.nav button{border:1px solid var(--line);background:#fff;color:var(--muted);font-family:inherit;font-size:13px;font-weight:600;padding:8px 14px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.15s;min-width:0;}
.nav button .material-symbols-outlined{font-size:19px;}
.nav button:hover{border-color:var(--accent2);color:var(--accent);}
.nav button.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(124,58,237,.28);}
.wrap{padding:20px;flex:1;}
.scr-head{margin-bottom:16px;}
.scr-head h2{font-size:20px;margin:0 0 4px;font-weight:800;display:flex;align-items:center;gap:9px;}
.scr-head h2 .material-symbols-outlined{color:var(--accent);font-size:24px;}
.scr-head p{margin:0;color:var(--muted);font-size:13px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.card h3 .material-symbols-outlined{font-size:18px;color:var(--accent);}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0;position:relative;overflow:hidden;}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);}
.kpi .lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;}
.kpi .lbl .material-symbols-outlined{font-size:16px;color:var(--accent2);}
.kpi .val{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:.3px;}
.kpi .val small{font-size:13px;font-weight:600;color:var(--muted);}
.kpi .dt{font-size:11.5px;margin-top:4px;font-weight:600;}
.up{color:var(--ok);}.down{color:var(--bad);}
.split{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start;}
.list-pane{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.list-search{padding:11px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;}
.list-search .material-symbols-outlined{font-size:18px;}
.list-search input{border:none;outline:none;font-family:inherit;font-size:13px;flex:1;min-width:0;color:var(--ink);background:transparent;}
.li{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:.13s;min-width:0;}
.li:hover{background:var(--accent-soft);}
.li.on{background:var(--accent-soft);border-left:3px solid var(--accent);padding-left:11px;}
.li .li-t{font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.li .li-t span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.li .li-s{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;}
.detail-pane{display:flex;flex-direction:column;gap:16px;min-width:0;}
.det-hero{background:linear-gradient(120deg,#ede9fe,#faf9ff);border:1px solid var(--line);border-radius:14px;padding:18px;}
.det-hero .dt-name{font-size:18px;font-weight:800;}
.det-hero .dt-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.det2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.pill .material-symbols-outlined{font-size:13px;}
.p-purple{background:var(--accent-soft);color:var(--accent);}
.p-ok{background:#e7f6ec;color:var(--ok);}
.p-warn{background:#fdf0dc;color:var(--warn);}
.p-bad{background:#fbe6e6;color:var(--bad);}
.p-info{background:#e4edfd;color:var(--info);}
.p-grey{background:#eef0f4;color:var(--muted);}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap;}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.num{font-variant-numeric:tabular-nums;font-weight:700;}
.bar{height:7px;border-radius:5px;background:#eee4fb;overflow:hidden;}
.bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.score-ring{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;font-weight:800;font-size:14px;color:#fff;flex-shrink:0;}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.col{background:#faf9ff;border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0;}
.col .col-h{font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;padding:0 2px;}
.col .col-h .cnt{background:var(--accent);color:#fff;font-size:11px;border-radius:20px;padding:1px 8px;}
.tk{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:8px;min-width:0;}
.tk:last-child{margin-bottom:0;}
.tk .tk-t{font-size:12.5px;font-weight:700;line-height:1.35;}
.tk .tk-m{font-size:11px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;align-items:center;}
.tk .tk-owner{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;}
.tl{position:relative;padding-left:26px;}
.tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line);}
.tl .step{position:relative;padding:0 0 18px 6px;}
.tl .step:last-child{padding-bottom:0;}
.tl .dot{position:absolute;left:-22px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--accent2);display:flex;align-items:center;justify-content:center;}
.tl .dot.done{background:var(--accent);border-color:var(--accent);}
.tl .dot.done .material-symbols-outlined{font-size:11px;color:#fff;}
.tl .dot.now{border-color:var(--accent);}
.tl .st-t{font-size:13.5px;font-weight:700;}
.tl .st-d{font-size:12px;color:var(--muted);margin-top:2px;}
.tl .st-x{font-size:11px;color:var(--muted);margin-top:4px;}
.chk{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);}
.chk:last-child{border-bottom:none;}
.chk .cbox{width:22px;height:22px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);margin-top:1px;}
.chk .cbox.done{background:var(--accent);border-color:var(--accent);}
.chk .cbox.done .material-symbols-outlined{font-size:15px;color:#fff;}
.chk .cbox.warn{border-color:var(--warn);color:var(--warn);}
.chk .cbox.warn .material-symbols-outlined{font-size:15px;}
.chk .ck-t{font-size:13px;font-weight:600;}
.chk .ck-t.dn{color:var(--muted);text-decoration:line-through;}
.chk .ck-m{font-size:11.5px;color:var(--muted);margin-top:3px;}
.chart{width:100%;height:280px;min-width:0;overflow:hidden;}
.chart.sm{height:230px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.mb16{margin-bottom:16px;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px;}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle;}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px;}
.stat-row:last-child{border-bottom:none;}
.stat-row b{font-variant-numeric:tabular-nums;font-size:15px;}
.foot{text-align:center;color:var(--muted);font-size:11.5px;padding:16px;border-top:1px solid var(--line);}
@media(max-width:860px){
  .split{grid-template-columns:1fr;}
}
@media(max-width:820px){
  .kpis{grid-template-columns:repeat(2,1fr);}
  .det2{grid-template-columns:1fr;}
  .board{grid-template-columns:1fr 1fr;}
  .grid2{grid-template-columns:1fr;}
}
@media(max-width:560px){
  .nav button .txt{display:none;}
  .nav button{padding:8px 11px;}
  .board{grid-template-columns:1fr;}
  .hdr h1{font-size:16px;}
}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div class="logo"><span class="material-symbols-outlined">account_tree</span></div>
    <div>
      <h1>併購管理系統（M&amp;A Management）</h1>
      <div class="sub">把分散數據變成可下鑽、可決策的併購經營洞察</div>
    </div>
    <div class="spacer"></div>
    <div class="badge">企業發展部 · 財務部 · 法務部</div>
    <div class="badge">FY2026 併購管道</div>
  </div>
  <div class="nav" id="nav"></div>
  <div class="wrap"><div id="screen"></div></div>
  <div class="foot">併購管理系統（M&amp;A Management）· 純前端展示原型 · 資料為模擬示意</div>
</div>

<script>
"use strict";
var C={accent:"#7c3aed",accent2:"#a78bfa",ok:"#16a34a",warn:"#d97706",bad:"#dc2626",info:"#2563eb",line:"#e7e3f3",muted:"#6b6787"};
var charts=[];
function disposeCharts(){for(var k=0;k<charts.length;k++){try{charts[k].dispose();}catch(e){}}charts=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var ch=echarts.init(el);ch.setOption(opt);charts.push(ch);}

/* ---------- fake data ---------- */
var TARGETS=[
  {id:"T-01",name:"晶睿精密機電",ind:"精密機械",rev:42.6,ebitda:8.9,fit:92,stage:"盡職調查",risk:"中",loc:"台中",note:"CNC 高階零組件龍頭，客戶重疊度高、通路綜效大。",owner:"陳"},
  {id:"T-02",name:"泓昇自動化",ind:"工業自動化",rev:28.1,ebitda:5.4,fit:88,stage:"交易談判",risk:"低",loc:"新竹",note:"產線自動化整合商，補足我方系統整合能力缺口。",owner:"林"},
  {id:"T-03",name:"銳鋒模具",ind:"模具沖壓",rev:15.8,ebitda:2.1,fit:74,stage:"初步評估",risk:"中",loc:"台南",note:"模具開發能量佳，惟毛利偏低需重整產品組合。",owner:"王"},
  {id:"T-04",name:"綠能動力科技",ind:"儲能電控",rev:36.4,ebitda:6.7,fit:81,stage:"初步評估",risk:"高",loc:"桃園",note:"切入儲能新市場，技術護城河強但客戶集中度高。",owner:"陳"},
  {id:"T-05",name:"宏達檢測",ind:"檢測驗證",rev:9.3,ebitda:2.8,fit:69,stage:"標的篩選",risk:"低",loc:"高雄",note:"第三方檢測認證，現金流穩定但規模較小。",owner:"李"},
  {id:"T-06",name:"聯洲物流倉儲",ind:"智慧倉儲",rev:51.2,ebitda:7.2,fit:63,stage:"標的篩選",risk:"高",loc:"桃園",note:"倉配一體化平台，估值偏高、整合難度大。",owner:"林"}
];
function riskCls(r){return r==="低"?"p-ok":r==="中"?"p-warn":"p-bad";}
function stageCls(s){return s==="交易談判"?"p-purple":s==="盡職調查"?"p-info":s==="初步評估"?"p-warn":"p-grey";}
function scoreColor(v){return v>=85?C.ok:v>=75?C.accent:v>=65?C.warn:C.bad;}
function kpi(icon,lbl,val,dt,dtl,dir){
  return '<div class="kpi"><div class="lbl"><span class="material-symbols-outlined">'+icon+'</span>'+lbl+'</div>'
    +'<div class="val">'+val+'</div>'
    +'<div class="dt '+(dir==="up"?"up":dir==="down"?"down":"")+'">'+(dt?dt+' ':'')+'<small style="color:var(--muted);font-weight:600">'+dtl+'</small></div></div>';
}
function statRow(k,v){return '<div class="stat-row"><span style="color:var(--muted)">'+k+'</span><b>'+v+'</b></div>';}
function tlStep(state,t,d,x){
  var dot=state==="done"?'<div class="dot done"><span class="material-symbols-outlined">check</span></div>':state==="now"?'<div class="dot now"></div>':'<div class="dot"></div>';
  return '<div class="step">'+dot+'<div class="st-t">'+t+'</div><div class="st-d">'+d+'</div><div class="st-x">'+x+'</div></div>';
}

/* ============ SCREEN 0 : 標的資料庫 (split pane) ============ */
function scr0(host){
  var sel=window.__t0||0;
  var rows=TARGETS.map(function(t,i){
    return '<div class="li'+(i===sel?' on':'')+'" data-t0="'+i+'">'
      +'<div class="li-t"><span>'+t.name+'</span><span class="pill '+stageCls(t.stage)+'">'+t.stage+'</span></div>'
      +'<div class="li-s"><span>'+t.ind+'</span><span>營收 '+t.rev+'億</span><span>配適 '+t.fit+'</span></div>'
      +'</div>';
  }).join("");
  var t=TARGETS[sel];
  host.innerHTML=''
  +'<div class="scr-head"><h2><span class="material-symbols-outlined">account_tree</span>標的資料庫</h2>'
  +'<p>候選併購標的建檔與策略配適評分，左側清單挑選、右側檢視標的檔案與綜效潛力。</p></div>'
  +'<div class="kpis">'
    +kpi("inventory_2","管道標的數","24","+5","本季新增","up")
    +kpi("verified","通過初篩","11","46%","進入評估","")
    +kpi("request_quote","估值總額","218","億元","加權管道值","")
    +kpi("trending_up","平均策略配適","78","+6","近月提升","up")
  +'</div>'
  +'<div class="split">'
    +'<div class="list-pane"><div class="list-search"><span class="material-symbols-outlined">search</span><input placeholder="搜尋標的名稱／產業…"/></div>'+rows+'</div>'
    +'<div class="detail-pane">'
      +'<div class="det-hero">'
        +'<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap">'
          +'<div><div class="dt-name">'+t.name+'</div><div style="font-size:12.5px;color:var(--muted);margin-top:3px">'+t.id+' · '+t.ind+' · '+t.loc+'</div></div>'
          +'<div class="score-ring" style="background:'+scoreColor(t.fit)+'">'+t.fit+'</div>'
        +'</div>'
        +'<div class="dt-meta"><span class="pill '+stageCls(t.stage)+'">'+t.stage+'</span><span class="pill '+riskCls(t.risk)+'"><span class="material-symbols-outlined">shield</span>風險 '+t.risk+'</span><span class="pill p-grey">負責 '+t.owner+' 專員</span></div>'
        +'<p style="font-size:13px;color:var(--ink);margin:12px 0 0;line-height:1.6">'+t.note+'</p>'
      +'</div>'
      +'<div class="det2">'
        +'<div class="card"><h3><span class="material-symbols-outlined">monitoring</span>財務快照（億元）</h3>'
          +statRow("年營收",t.rev)+statRow("EBITDA",t.ebitda)
          +statRow("EBITDA 率",(t.ebitda/t.rev*100).toFixed(1)+"%")
          +statRow("估值倍數","EV/EBITDA "+(7+sel*0.4).toFixed(1)+"x")
        +'</div>'
        +'<div class="card"><h3><span class="material-symbols-outlined">insights</span>綜效配適雷達</h3><div id="c0r" class="chart sm"></div></div>'
      +'</div>'
    +'</div>'
  +'</div>';
  void host.offsetHeight;
  var dims=["策略契合","客戶綜效","成本綜效","技術互補","整合順度","財務體質"];
  var base=[t.fit,88-sel*4,72+sel*3,80-sel*2,100-(t.risk==="高"?60:t.risk==="中"?38:20),Math.round(t.ebitda/t.rev*100)+55];
  mk("c0r",{radar:{indicator:dims.map(function(d){return {name:d,max:100};}),radius:"62%",center:["50%","54%"],axisName:{color:C.muted,fontSize:11},splitLine:{lineStyle:{color:C.line}},splitArea:{areaStyle:{color:["#faf9ff","#fff"]}}},
    series:[{type:"radar",data:[{value:base,areaStyle:{color:"rgba(124,58,237,.22)"},lineStyle:{color:C.accent,width:2},itemStyle:{color:C.accent}}]}]});
  var els=host.querySelectorAll("[data-t0]");
  for(var i=0;i<els.length;i++){els[i].addEventListener("click",function(){window.__t0=+this.getAttribute("data-t0");scr0(host);});}
}

/* ============ SCREEN 1 : 估值情境分析 ============ */
function scr1(host){
  host.innerHTML=''
  +'<div class="scr-head"><h2><span class="material-symbols-outlined">request_quote</span>估值情境分析</h2>'
  +'<p>以 DCF 與可比公司法建立多情境估值，界定合理報價區間 — 標的：晶睿精密機電。</p></div>'
  +'<div class="kpis">'
    +kpi("payments","基準企業價值","78.4","億","DCF 基準情境","")
    +kpi("trending_up","報價區間上限","91.0","億","樂觀情境","up")
    +kpi("trending_down","保守下限","64.2","億","保守情境","down")
    +kpi("percent","隱含 EV/EBITDA","8.8","x","對比同業 9.2x","")
  +'</div>'
  +'<div class="grid2 mb16">'
    +'<div class="card"><h3><span class="material-symbols-outlined">monitoring</span>三情境企業價值（億元）</h3><div id="c1a" class="chart"></div></div>'
    +'<div class="card"><h3><span class="material-symbols-outlined">insights</span>敏感度：折現率 vs 永續成長率</h3><div id="c1b" class="chart"></div></div>'
  +'</div>'
  +'<div class="grid2">'
    +'<div class="card"><h3><span class="material-symbols-outlined">description</span>可比公司法對照</h3>'
      +'<div class="tbl-wrap"><table><thead><tr><th>可比公司</th><th>EV/EBITDA</th><th>P/E</th><th>營收成長</th></tr></thead><tbody>'

  nav.innerHTML=html;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){btns[j].addEventListener("click",function(){show(+this.getAttribute("data-i"));});}
})();
function show(i){
  disposeCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){btns[k].className=(+btns[k].getAttribute("data-i")===i)?"on":"";}
  var container=document.getElementById("screen");
  container.innerHTML="";
  void container.offsetHeight;
  SCREENS[i].fn(container);
}
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
</body>
