<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>併購管理系統（M&amp;A Management）</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --bg:#F0FDFA;
  --card:#FFFFFF;
  --accent:#0D9488;
  --accent2:#2DD4BF;
  --accent-soft:#CCFBF1;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#0369A1;
}
*{box-sizing:border-box;}
html{scroll-behavior:auto;}
html,body{margin:0;padding:0;}
body{
  min-width:320px;
  overflow-x:hidden;
  background:
    linear-gradient(rgba(13,148,136,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(13,148,136,.08) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Crimson Pro","Noto Sans TC",serif;
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;}
button,[data-t0]{cursor:pointer;}
button:focus-visible,input:focus-visible,[data-t0]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
::selection{background:var(--color-secondary);color:#0F172A;}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
.app{
  width:min(100%,1440px);
  min-height:100vh;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  background:rgba(240,253,250,.88);
  border-inline:2px solid var(--ink);
}
.hdr{
  position:relative;
  isolation:isolate;
  display:flex;
  align-items:center;
  gap:18px;
  flex-wrap:wrap;
  min-height:138px;
  padding:22px clamp(18px,3vw,42px);
  overflow:hidden;
  border-bottom:4px solid #0F172A;
  background:var(--color-primary);
  color:#061B19;
}
.hdr::after{
  content:"M&A / 2026";
  position:absolute;
  z-index:-1;
  right:-18px;
  bottom:-31px;
  color:rgba(255,255,255,.22);
  font-family:"Cinzel",serif;
  font-size:clamp(54px,8vw,116px);
  font-weight:600;
  letter-spacing:-.08em;
  white-space:nowrap;
}
.hdr .logo{
  width:62px;
  height:62px;
  flex:0 0 62px;
  display:grid;
  place-items:center;
  background:#FDE68A;
  border:3px solid #0F172A;
  box-shadow:7px 7px 0 #0F172A;
}
.hdr .logo .material-symbols-outlined{font-size:34px;}
.hdr h1{
  max-width:760px;
  margin:0;
  font-family:"Cinzel","Noto Sans TC",serif;
  font-size:clamp(20px,2.25vw,34px);
  font-weight:600;
  line-height:1.12;
  letter-spacing:-.02em;
}
.hdr .sub{margin-top:7px;font-size:14px;font-weight:600;}
.hdr .spacer{flex:1;min-width:12px;}
.hdr .badge{
  padding:7px 10px;
  border:2px solid #0F172A;
  background:#FFFFFF;
  color:#0F172A;
  font-family:"Noto Sans TC",sans-serif;
  font-size:11px;
  font-weight:700;
  letter-spacing:.04em;
  white-space:nowrap;
  box-shadow:4px 4px 0 #0F172A;
}
.nav{
  position:sticky;
  z-index:20;
  top:0;
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:0;
  padding:0;
  background:#FFFFFF;
  border-bottom:3px solid #0F172A;
}
.nav button{
  min-width:0;
  min-height:52px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:10px 8px;
  border:0;
  border-right:2px solid #0F172A;
  border-radius:0;
  background:#FFFFFF;
  color:#334155;
  font-family:"Noto Sans TC",sans-serif;
  font-size:12px;
  font-weight:700;
}
.nav button:last-child{border-right:0;}
.nav button:hover{background:var(--color-muted);color:#0F172A;}
.nav button.on{
  background:#0F172A;
  color:#FFFFFF;
  box-shadow:inset 0 -6px 0 var(--color-secondary);
}
.nav button .material-symbols-outlined{font-size:20px;}
.wrap{flex:1;padding:clamp(18px,3vw,40px);}
#screen{animation:screen-in .36s ease-out both;}
.scr-head{
  position:relative;
  max-width:1050px;
  margin:0 0 24px;
  padding:0 0 16px 18px;
  border-left:8px solid var(--color-accent);
  border-bottom:2px solid #0F172A;
}
.scr-head h2{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0 0 5px;
  font-family:"Cinzel","Noto Sans TC",serif;
  font-size:clamp(24px,3vw,38px);
  font-weight:600;
  line-height:1.15;
  letter-spacing:-.025em;
}
.scr-head h2 .material-symbols-outlined{color:var(--color-primary);font-size:30px;}
.scr-head p{max-width:780px;margin:0;color:#475569;font-size:14px;}
.card,.kpi,.list-pane,.det-hero,.col,.tk{
  border-radius:0;
  background:var(--color-card);
  color:var(--color-card-foreground);
}
.card{
  min-width:0;
  padding:18px;
  border:2px solid #0F172A;
  box-shadow:6px 6px 0 var(--color-border);
}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin:0 0 16px;
  padding-bottom:10px;
  border-bottom:2px solid var(--line);
  font-family:"Noto Sans TC",sans-serif;
  font-size:14px;
  font-weight:900;
}
.card h3 .material-symbols-outlined{color:var(--color-primary);font-size:20px;}
.kpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
  margin-bottom:22px;
}
.kpi{
  position:relative;
  min-width:0;
  min-height:142px;
  padding:17px 16px 15px;
  overflow:hidden;
  border:2px solid #0F172A;
  box-shadow:5px 5px 0 #0F172A;
}
.kpi:nth-child(even){transform:translateY(8px);}
.kpi::before{
  content:"";
  position:absolute;
  top:0;
  right:0;
  width:42px;
  height:10px;
  background:var(--color-primary);
  border-left:2px solid #0F172A;
  border-bottom:2px solid #0F172A;
}
.kpi:nth-child(3n)::before{background:var(--color-accent);}
.kpi .lbl{
  display:flex;
  align-items:center;
  gap:6px;
  color:#475569;
  font-family:"Noto Sans TC",sans-serif;
  font-size:12px;
  font-weight:700;
}
.kpi .lbl .material-symbols-outlined{color:var(--color-primary);font-size:18px;}
.kpi .val{
  margin-top:8px;
  font-family:"Cinzel","Noto Sans TC",serif;
  font-size:clamp(27px,3vw,38px);
  font-weight:600;
  font-variant-numeric:tabular-nums lining-nums;
  line-height:1;
  letter-spacing:-.04em;
}
.kpi .val small{color:#475569;font-size:13px;font-weight:700;}
.kpi .dt{margin-top:9px;font-family:"Noto Sans TC",sans-serif;font-size:11.5px;font-weight:700;}
.up{color:#166534;}
.down{color:#B91C1C;}
.split{display:grid;grid-template-columns:minmax(280px,350px) minmax(0,1fr);gap:20px;align-items:start;}
.list-pane{overflow:hidden;border:2px solid #0F172A;box-shadow:6px 6px 0 var(--color-border);}
.list-search{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:52px;
  padding:11px 13px;
  border-bottom:3px solid #0F172A;
  background:var(--color-muted);
  color:#475569;
}
.list-search .material-symbols-outlined{font-size:19px;}
.list-search input{width:100%;min-width:0;border:0;background:transparent;color:var(--ink);outline:0;font-size:14px;}
.list-search input::placeholder{color:#64748B;}
.li{min-width:0;padding:14px;border-bottom:1px solid #94A3B8;background:#FFFFFF;}
.li:last-child{border-bottom:0;}
.li:hover{background:#ECFEFF;}
.li.on{padding-left:11px;border-left:7px solid var(--color-accent);background:#CCFBF1;}
.li .li-t{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;font-weight:700;}
.li .li-t span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.li .li-s{display:flex;gap:10px;flex-wrap:wrap;margin-top:5px;color:#475569;font-size:12px;}
.detail-pane{display:flex;flex-direction:column;gap:18px;min-width:0;}
.det-hero{
  position:relative;
  padding:22px;
  overflow:hidden;
  border:3px solid #0F172A;
  background:linear-gradient(115deg,#FFFFFF 0 73%,#99F6E4 73%);
  box-shadow:8px 8px 0 #0F172A;
}
.det-hero::after{content:"TARGET";position:absolute;right:14px;bottom:-8px;color:rgba(15,23,42,.13);font-family:"Cinzel",serif;font-size:48px;font-weight:600;}
.det-hero .dt-name{font-family:"Cinzel","Noto Sans TC",serif;font-size:24px;font-weight:600;}
.det-hero .dt-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.det-hero .dt-name+div{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-variant-numeric:tabular-nums;}
.det2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.pill{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:4px 8px;
  border:1px solid currentColor;
  border-radius:0;
  font-family:"Noto Sans TC",sans-serif;
  font-size:11px;
  font-weight:800;
  line-height:1.25;
  white-space:nowrap;
}
.pill .material-symbols-outlined{font-size:14px;}
.p-purple{background:#CCFBF1;color:#115E59;}
.p-ok{background:#DCFCE7;color:#166534;}
.p-warn{background:#FEF3C7;color:#92400E;}
.p-bad{background:#FEE2E2;color:#991B1B;}
.p-info{background:#E0F2FE;color:#075985;}
.p-grey{background:#F1F5F9;color:#475569;}
.tbl-wrap{overflow-x:auto;border:2px solid #0F172A;}
table{width:100%;min-width:520px;border-collapse:collapse;background:#FFFFFF;font-size:13px;}
th{
  padding:11px 10px;
  border-right:1px solid #475569;
  border-bottom:3px solid #0F172A;
  background:#0F172A;
  color:#FFFFFF;
  font-family:"Noto Sans TC",sans-serif;
  font-size:11.5px;
  font-weight:900;
  text-align:left;
  white-space:nowrap;
}
th:last-child{border-right:0;}
td{padding:12px 10px;border-right:1px solid #CBD5E1;border-bottom:1px solid #94A3B8;vertical-align:middle;}
td:last-child{border-right:0;}
tr:last-child td{border-bottom:0;}
tbody tr:nth-child(even){background:#F0FDFA;}
tbody tr:hover{background:#CCFBF1;}
.num{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;}
.bar{height:10px;overflow:hidden;border:1px solid #0F172A;border-radius:0;background:#E2E8F0;}
.bar>i{display:block;height:100%;border-radius:0;background:repeating-linear-gradient(135deg,var(--color-primary) 0 7px,var(--color-secondary) 7px 14px);}
.score-ring{
  width:54px;
  height:54px;
  flex-shrink:0;
  display:inline-grid;
  place-items:center;
  border:3px solid #0F172A;
  border-radius:0;
  box-shadow:4px 4px 0 #0F172A;
  color:#FFFFFF;
  font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;
  font-size:16px;
  font-weight:900;
}
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;}
.col{min-width:0;padding:11px;border:2px solid #0F172A;background:#F0FDFA;}
.col:nth-child(even){background:#E8F1F4;}
.col .col-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:9px;border-bottom:2px solid #0F172A;font-size:13px;font-weight:900;}
.col .col-h .cnt{min-width:25px;padding:2px 7px;border:1px solid #0F172A;border-radius:0;background:var(--color-primary);color:#071F1D;font-family:ui-monospace,monospace;font-size:11px;text-align:center;}
.tk{min-width:0;margin-bottom:9px;padding:11px;border:1px solid #0F172A;box-shadow:3px 3px 0 var(--color-border);}
.tk:last-child{margin-bottom:0;}
.tk .tk-t{font-size:13px;font-weight:700;line-height:1.4;}
.tk .tk-m{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;margin-top:8px;color:#475569;font-size:11px;}
.tk .tk-owner{width:24px;height:24px;display:inline-grid;place-items:center;border:1px solid #0F172A;border-radius:0;background:#0F172A;color:#FFFFFF;font-size:10px;font-weight:800;}
.tl{position:relative;padding-left:31px;}
.tl::before{content:"";position:absolute;top:6px;bottom:6px;left:10px;width:3px;background:#0F172A;}
.tl .step{position:relative;padding:0 0 20px 8px;}
.tl .step:last-child{padding-bottom:0;}
.tl .dot{position:absolute;top:1px;left:-29px;width:21px;height:21px;display:grid;place-items:center;border:3px solid var(--color-primary);border-radius:0;background:#FFFFFF;}
.tl .dot.done{border-color:#0F172A;background:var(--color-primary);}
.tl .dot.done .material-symbols-outlined{color:#071F1D;font-size:13px;font-weight:900;}
.tl .dot.now{border-color:#0F172A;background:#FDE68A;box-shadow:3px 3px 0 #0F172A;}
.tl .st-t{font-size:14px;font-weight:800;}
.tl .st-d{margin-top:2px;color:#475569;font-size:12.5px;}
.tl .st-x{margin-top:4px;color:#475569;font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:11px;font-variant-numeric:tabular-nums;}
.chk{display:flex;align-items:flex-start;gap:11px;padding:12px 0;border-bottom:1px solid #94A3B8;}
.chk:last-child{border-bottom:0;}
.chk .cbox{width:24px;height:24px;flex-shrink:0;display:grid;place-items:center;margin-top:1px;border:2px solid #0F172A;border-radius:0;background:#FFFFFF;}
.chk .cbox.done{background:var(--color-primary);}
.chk .cbox.done .material-symbols-outlined{color:#071F1D;font-size:16px;font-weight:900;}
.chk .cbox.warn{border-color:#92400E;background:#FEF3C7;color:#92400E;}
.chk .cbox.warn .material-symbols-outlined{font-size:16px;font-weight:900;}
.chk .ck-t{font-size:13px;font-weight:700;}
.chk .ck-t.dn{color:#475569;text-decoration:line-through;text-decoration-thickness:2px;}
.chk .ck-m{margin-top:3px;color:#475569;font-size:12px;}
.chart{width:100%;height:280px;min-width:0;overflow:hidden;}
.chart.sm{height:230px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.mb16{margin-bottom:20px;}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:#475569;font-size:12px;}
.legend i{display:inline-block;width:14px;height:10px;margin-right:5px;border:1px solid #0F172A;border-radius:0;vertical-align:middle;}
.stat-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px dashed #64748B;font-size:13px;}
.stat-row:last-child{border-bottom:0;}
.stat-row b{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:15px;font-variant-numeric:tabular-nums;text-align:right;}
.foot{padding:22px 16px;border-top:3px solid #0F172A;background:#0F172A;color:#CBD5E1;font-family:"Noto Sans TC",sans-serif;font-size:11.5px;text-align:center;}
@keyframes screen-in{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
@media(max-width:1024px){
  .nav{grid-template-columns:repeat(3,1fr);}
  .nav button:nth-child(3){border-right:0;}
  .nav button:nth-child(-n+3){border-bottom:2px solid #0F172A;}
  .kpis{grid-template-columns:repeat(2,1fr);}
  .split{grid-template-columns:300px minmax(0,1fr);}
  .board{grid-template-columns:repeat(2,minmax(220px,1fr));}
}
@media(max-width:768px){
  .app{border-inline:0;}
  .hdr{align-items:flex-start;min-height:0;}
  .hdr .spacer{display:none;}
  .hdr .badge{white-space:normal;}
  .wrap{padding:20px 14px 28px;}
  .split,.det2,.grid2{grid-template-columns:1fr;}
  .kpi:nth-child(even){transform:none;}
  .det-hero{background:#FFFFFF;}
  .board{grid-template-columns:repeat(2,minmax(210px,1fr));}
}
@media(max-width:560px){
  .hdr{gap:14px;padding:18px 14px 20px;}
  .hdr .logo{width:48px;height:48px;flex-basis:48px;box-shadow:4px 4px 0 #0F172A;}
  .hdr .logo .material-symbols-outlined{font-size:28px;}
  .hdr h1{font-size:18px;}
  .hdr .sub{font-size:12px;}
  .nav{grid-template-columns:repeat(6,1fr);}
  .nav button{min-height:50px;border-right:1px solid #0F172A;border-bottom:0!important;padding:9px 4px;}
  .nav button:nth-child(3){border-right:1px solid #0F172A;}
  .nav button .txt{display:none;}
  .kpis{grid-template-columns:1fr;}
  .kpi{min-height:120px;}
  .scr-head{padding-left:12px;}
  .scr-head h2{font-size:23px;}
  .card{padding:14px;box-shadow:4px 4px 0 var(--color-border);}
  .board{grid-template-columns:1fr;}
  .chart{height:250px;}
  .chart.sm{height:220px;}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
  #screen{animation:none;}
}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div class="logo"><span class="material-symbols-outlined">account_tree</span></div>
    <div>
      <h1>併購管理系統（M&amp;A Management）</h1>
      <div class="sub">把分散數據變成可下鑽、可決策的併購經營洞察</div>
    </div>
    <div class="spacer"></div>
    <div class="badge">企業發展部 · 財務部 · 法務部</div>
    <div class="badge">FY2026 併購管道</div>
  </div>
  <div class="nav" id="nav"></div>
  <div class="wrap"><div id="screen"></div></div>
  <div class="foot">併購管理系統（M&amp;A Management）· 純前端展示原型 · 資料為模擬示意</div>
</div>

<script>
"use strict";
var C={accent:"#7c3aed",accent2:"#a78bfa",ok:"#16a34a",warn:"#d97706",bad:"#dc2626",info:"#2563eb",line:"#e7e3f3",muted:"#6b6787"};
var charts=[];
function disposeCharts(){for(var k=0;k<charts.length;k++){try{charts[k].dispose();}catch(e){}}charts=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var ch=echarts.init(el);ch.setOption(opt);charts.push(ch);}

/* ---------- fake data ---------- */
var TARGETS=[

function synRow(k,amt,pct,cls){
  return '<tr><td>'+k+'</td><td class="num">'+amt+'</td><td style="min-width:120px"><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i style="width:'+pct+'%"></i></div><span class="num" style="font-size:12px">'+pct+'%</span></div></td>'
    +'<td><span class="pill '+cls+'">'+(pct>=65?"上軌":pct>=45?"追趕":"落後")+'</span></td></tr>';
}

/* ---------- nav + router ---------- */
var SCREENS=[
  {icon:"account_tree",label:"標的資料庫",fn:scr0},
  {icon:"request_quote",label:"估值情境",fn:scr1},
  {icon:"fact_check",label:"盡職調查",fn:scr2},
  {icon:"gavel",label:"交易談判",fn:scr3},
  {icon:"task_alt",label:"交割檢核",fn:scr4},
  {icon:"trending_up",label:"整合綜效",fn:scr5}
];
(function(){
  var nav=document.getElementById("nav");
  var html="";
  for(var i=0;i<SCREENS.length;i++){
    html+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+SCREENS[i].icon+'</span><span class="txt">'+SCREENS[i].label+'</span></button>';
  }
  nav.innerHTML=html;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){btns[j].addEventListener("click",function(){show(+this.getAttribute("data-i"));});}
})();
function show(i){
  disposeCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){btns[k].className=(+btns[k].getAttribute("data-i")===i)?"on":"";}
  var container=document.getElementById("screen");
  container.innerHTML="";
  void container.offsetHeight;
  SCREENS[i].fn(container);
}
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
