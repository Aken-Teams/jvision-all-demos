<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>智慧財產權/專利管理系統</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#16a34a; --accent2:#4ade80; --accent-soft:#dcfce7;
  --bg:#f1f5f4; --panel:#ffffff; --ink:#0f2417; --muted:#64766c;
  --line:#e3ebe7; --shadow:0 1px 3px rgba(15,36,23,.06),0 8px 24px rgba(15,36,23,.05);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; line-height:1.5;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.app{max-width:1360px;margin:0 auto;padding:16px;}
.top{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:linear-gradient(120deg,#0f2417 0%,#14532d 55%,#166534 100%);
  color:#fff;border-radius:18px;padding:16px 20px;box-shadow:var(--shadow);min-width:0;
}
.logo{
  width:46px;height:46px;border-radius:13px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;color:#06230f;
}
.logo .material-symbols-outlined{font-size:28px;}
.top .tt{min-width:0;flex:1 1 200px;}
.top h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.3px;}
.top p{margin:2px 0 0;font-size:12.5px;color:#bbf7d0;}
.top .badges{display:flex;gap:8px;flex-wrap:wrap;}
.badge{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 12px;font-size:12px;display:flex;align-items:center;gap:5px;}
.badge .material-symbols-outlined{font-size:16px;color:var(--accent2);}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;}
nav button{
  display:flex;align-items:center;gap:7px;cursor:pointer;
  border:1px solid var(--line);background:var(--panel);color:var(--muted);
  padding:9px 14px;border-radius:11px;font-size:13px;font-weight:600;
  font-family:inherit;transition:.15s;min-width:0;
}
nav button .material-symbols-outlined{font-size:19px;}
nav button:hover{border-color:var(--accent2);color:var(--accent);}
nav button.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(22,163,74,.28);}
.split{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start;min-width:0;}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0;overflow:hidden;}
.pane-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;}
.pane-h h2{margin:0;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;min-width:0;}
.pane-h h2 .material-symbols-outlined{font-size:20px;color:var(--accent);}
.pane-h .sub{font-size:11.5px;color:var(--muted);font-weight:500;white-space:nowrap;}
.pane-b{padding:16px;min-width:0;}
.litem{display:flex;gap:10px;padding:11px 12px;border-radius:12px;cursor:pointer;border:1px solid transparent;transition:.12s;align-items:flex-start;min-width:0;}
.litem:hover{background:var(--accent-soft);}
.litem.sel{background:var(--accent-soft);border-color:var(--accent2);}
.litem .ic{width:34px;height:34px;border-radius:9px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:#eaf5ee;color:var(--accent);}
.litem .ic .material-symbols-outlined{font-size:19px;}
.litem .tx{min-width:0;flex:1;}
.litem .tx b{font-size:13.5px;display:block;}
.litem .tx small{font-size:11.5px;color:var(--muted);display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;}
.litem .pill{height:fit-content;}
.grid{display:grid;gap:14px;min-width:0;}
.g2{grid-template-columns:1fr 1fr;}
.g3{grid-template-columns:1fr 1fr 1fr;}
.g4{grid-template-columns:repeat(4,1fr);}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0;}
.kpi .lb{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.kpi .lb .material-symbols-outlined{font-size:17px;color:var(--accent);}
.kpi .vv{font-size:24px;font-weight:800;margin-top:6px;letter-spacing:.4px;}
.kpi .dd{font-size:11.5px;margin-top:3px;font-weight:600;}
.up{color:#16a34a;} .down{color:#dc2626;} .flat{color:var(--muted);}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0;}
.card h3{margin:0 0 12px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
.chart-wrap{position:relative;width:100%;overflow:hidden;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;font-weight:700;color:var(--muted);padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap;font-size:11.5px;}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
tbody tr:hover{background:#f6faf8;}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;}
.p-green{background:#dcfce7;color:#15803d;}
.p-amber{background:#fef3c7;color:#b45309;}
.p-red{background:#fee2e2;color:#b91c1c;}
.p-blue{background:#dbeafe;color:#1d4ed8;}
.p-gray{background:#eef2f0;color:#556;}
.p-violet{background:#ede9fe;color:#6d28d9;}
.bar{height:8px;border-radius:999px;background:#eef2f0;overflow:hidden;min-width:60px;}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.sec-title{font-size:13px;font-weight:800;margin:2px 0 10px;color:var(--ink);display:flex;align-items:center;gap:7px;}
.sec-title .material-symbols-outlined{font-size:18px;color:var(--accent);}
.tl{position:relative;padding-left:22px;}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl .ev{position:relative;padding:0 0 16px 6px;}
.tl .ev:last-child{padding-bottom:0;}
.tl .dot{position:absolute;left:-20px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent-soft);}
.tl .ev b{font-size:13px;} .tl .ev small{color:var(--muted);font-size:11.5px;}
.tl .ev p{margin:3px 0 0;font-size:12px;color:#3a4a40;}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0;}
.col{background:#f6faf8;border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0;}
.col .ch{font-size:12px;font-weight:800;display:flex;justify-content:space-between;margin-bottom:9px;color:var(--muted);}
.col .ch em{font-style:normal;background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:10.5px;}
.tk{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;padding:9px 10px;margin-bottom:8px;box-shadow:0 1px 2px rgba(15,36,23,.04);}
.tk b{font-size:12.5px;display:block;} .tk small{font-size:11px;color:var(--muted);}
.tk .row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:6px;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px;}
.legend span{display:flex;align-items:center;gap:5px;}
.dotc{width:10px;height:10px;border-radius:3px;display:inline-block;}
.hl{background:var(--accent-soft);border:1px solid var(--accent2);border-radius:12px;padding:12px 14px;font-size:12.5px;color:#14532d;display:flex;gap:9px;align-items:flex-start;}
.hl .material-symbols-outlined{color:var(--accent);font-size:20px;flex:0 0 auto;}
.heat{display:grid;grid-template-columns:110px repeat(5,1fr);gap:6px;min-width:400px;}
.heat .hc{border-radius:7px;padding:9px 4px;text-align:center;font-size:11px;font-weight:700;}
.heat .rl{font-size:11.5px;font-weight:700;display:flex;align-items:center;color:var(--muted);}
.heat .hh{font-size:10.5px;font-weight:700;text-align:center;color:var(--muted);padding-bottom:2px;}
.foot{text-align:center;color:var(--muted);font-size:11.5px;padding:18px 0 8px;}
@media(max-width:860px){
  .split{grid-template-columns:1fr;}
}
@media(max-width:820px){
  .g2,.g3,.g4{grid-template-columns:1fr;}
  .board{grid-template-columns:1fr 1fr;}
}
@media(max-width:560px){
  nav button span.txt{display:none;}
  nav button{padding:9px 11px;}
  .board{grid-template-columns:1fr;}
  .top h1{font-size:16px;}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo"><span class="material-symbols-outlined">shield</span></div>
    <div class="tt">
      <h1>智慧財產權 / 專利管理系統</h1>
      <p>從發明揭露到年費維護的專利資產全生命週期數位化</p>
    </div>
    <div class="badges">
      <span class="badge"><span class="material-symbols-outlined">groups</span>研發專案管理師 · 研發經理 · 技術長</span>
      <span class="badge"><span class="material-symbols-outlined">verified</span>可操作 · 可追蹤 · 可稽核</span>
    </div>
  </header>

  <nav id="nav"></nav>
  <div id="screen"></div>

  <div class="foot">智慧財產權 / 專利管理系統 · 純前端展示雛型（資料為模擬）· 綠色主題工作台</div>
</div>

<script>
"use strict";
var NAV=[
  {i:0,ic:"dashboard",t:"專利組合總覽"},
  {i:1,ic:"checklist",t:"申請進度追蹤"},
  {i:2,ic:"account_tree",t:"布局地圖分析"},
  {i:3,ic:"calendar_month",t:"年費到期提醒"},
  {i:4,ic:"gavel",t:"侵權與訴訟監控"},
  {i:5,ic:"insights",t:"決策洞察站"}
];
var chartRef={};
function destroyCharts(){for(var k in chartRef){if(chartRef[k]){try{chartRef[k].destroy();}catch(e){}chartRef[k]=null;}}}
function el(id){return document.getElementById(id);}

function buildNav(){
  var h="";
  for(var a=0;a<NAV.length;a++){
    var n=NAV[a];
    h+='<button data-i="'+n.i+'" onclick="show('+n.i+')"><span class="material-symbols-outlined">'+n.ic+'</span><span class="txt">'+n.t+'</span></button>';
  }
  el("nav").innerHTML=h;
}

function listPane(title,sub,items,selIdx){
  var h='<div class="pane"><div class="pane-h"><h2><span class="material-symbols-outlined">'+items.hi+'</span>'+title+'</h2><span class="sub">'+sub+'</span></div><div class="pane-b">';
  for(var a=0;a<items.rows.length;a++){
    var r=items.rows[a];
    h+='<div class="litem'+(a===selIdx?' sel':'')+'"><div class="ic"><span class="material-symbols-outlined">'+r.ic+'</span></div><div class="tx"><b>'+r.b+'</b><small>'+r.s+'</small></div><span class="pill '+r.pc+'">'+r.tag+'</span></div>';
  }
  h+='</div></div>';
  return h;
}

/* SCREEN 0 : 專利組合總覽 */
function screen0(){
  var list={hi:"folder_special",rows:[
    {ic:"memory",b:"半導體封裝",s:"IPC H01L · 128 件",tag:"高價值",pc:"p-green"},
    {ic:"bolt",b:"電源管理",s:"IPC H02M · 86 件",tag:"核心",pc:"p-blue"},
    {ic:"wifi",b:"無線通訊",s:"IPC H04W · 74 件",tag:"成長",pc:"p-violet"},
    {ic:"battery_charging_full",b:"電池材料",s:"IPC H01M · 41 件",tag:"觀察",pc:"p-amber"},
    {ic:"visibility",b:"影像感測",s:"IPC H04N · 33 件",tag:"新興",pc:"p-gray"}
  ]};
  var right=''
    +'<div class="pane"><div class="pane-h"><h2><span class="material-symbols-outlined">memory</span>半導體封裝 · 專利組合檢視</h2><span class="sub">更新 2026/08/14</span></div><div class="pane-b">'
    +'<div class="grid g4">'
    +kpi("inventory_2","專利資產總數","362","+18 本年度","up")
    +kpi("verified","已核准","241","67% 核准率","flat")
    +kpi("pending","審查中","98","含 12 件答辯","flat")
    +kpi("account_balance_wallet","本年應繳年費","4.6M","涵蓋 187 件","flat")
    +'</div>'
    +'<div class="grid g2" style="margin-top:14px">'
    +'<div class="card"><h3><span class="material-symbols-outlined">public</span>各國專利分布</h3><div class="chart-wrap" style="height:240px"><canvas id="c0a"></canvas></div></div>'
    +'<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>法律狀態占比</h3><div class="chart-wrap" style="height:240px"><canvas id="c0b"></canvas></div></div>'
    +'</div>'
    +'<div class="card" style="margin-top:14px"><h3><span class="material-symbols-outlined">stars</span>高價值專利（依價值評分）</h3><div style="overflow-x:auto"><table><thead><tr><th>專利號</th><th>名稱</th><th>技術類別</th><th>剩餘年限</th><th>價值評分</th><th>狀態</th></tr></thead><tbody>'
    +hvRow("US 11,482,317","覆晶封裝散熱結構","半導體封裝","11 年",94,"p-green","維護中")
    +hvRow("TW I789,204","高密度重佈線層製程","半導體封裝","13 年",88,"p-green","維護中")
    +hvRow("CN 115,204,881","晶圓級扇出封裝","半導體封裝","9 年",81,"p-blue","維護中")
    +hvRow("JP 7,205,118","低介電互連材料","電源管理","7 年",76,"p-amber","待續繳")
    +hvRow("EP 3,984,220","堆疊式功率模組","電源管理","10 年",72,"p-blue","維護中")
    +'</tbody></table></div></div>'
    +'</div></div>';
  return '<div class="split">'+listPane("技術組合","5 大技術群 · 362 件",list,0)+right+'</div>';
}
function hvRow(no,nm,cls,yr,sc,pc,st){
  return '<tr><td><b>'+no+'</b></td><td>'+nm+'</td><td>'+cls+'</td><td>'+yr+'</td><td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="width:70px"><span style="width:'+sc+'%"></span></div><b>'+sc+'</b></div></td><td><span class="pill '+pc+'">'+st+'</span></td></tr>';
}

/* SCREEN 1 : 申請進度追蹤 */
function screen1(){
  var list={hi:"pending_actions",rows:[
    {ic:"error",b:"US 17/902,118",s:"OA 答辯剩 6 天",tag:"急件",pc:"p-red"},
    {ic:"schedule",b:"EP 22 194 552",s:"補正剩 14 天",tag:"待辦",pc:"p-amber"},
    {ic:"fact_check",b:"TW 111 138 204",s:"實審通知已收",tag:"審查中",pc:"p-blue"},
    {ic:"drafts",b:"CN 2022 1 05881",s:"公開待實審",tag:"公開",pc:"p-gray"},
    {ic:"task_alt",b:"JP 2022-118552",s:"核准領證中",tag:"核准",pc:"p-green"}
  ]};
  var right=''
    +'<div class="pane"><div class="pane-h"><h2><span class="material-symbols-outlined">error</span>US 17/902,118 · 覆晶封裝散熱結構</h2><span class="sub">代理人：李昀</span></div><div class="pane-b">'
    +'<div class="grid g3">'
    +kpi("gavel","目前階段","OA 答辯","第 1 次核駁","flat")
    +kpi("hourglass_bottom","官方期限","08/20","剩 6 天","down")
    +kpi("trending_up","核准機率","72%","類案模型推估","up")
    +'</div>'
    +'<div class="hl" style="margin-top:14px"><span class="material-symbols-outlined">priority_high</span><div><b>期限預警：</b>本案答辯期限僅剩 6 天，且屬凍結設計關聯案，依 RULE-01 應優先處理。建議 08/17 前完成答辯書定稿。</div></div>'
    +'<div class="grid g2" style="margin-top:14px">'
    +'<div class="card"><h3><span class="material-symbols-outlined">history</span>審查歷程</h3>'+timeline1()+'</div>'
    +'<div class="card"><h3><span class="material-symbols-outlined">stacked_bar_chart</span>組合審查階段分布</h3><div class="chart-wrap" style="height:230px"><canvas id="c1a"></canvas></div></div>'
    +'</div>'
    +'<div class="card" style="margin-top:14px"><h3><span class="material-symbols-outlined">list_alt</span>近期官方期限（未結案件）</h3><div style="overflow-x:auto"><table><thead><tr><th>申請號</th><th>國別</th><th>事項</th><th>期限</th><th>剩餘</th><th>負責人</th><th>狀態</th></tr></thead><tbody>'
    +dlRow("US 17/902,118","美國","OA 答辯","2026/08/20","6 天","李昀","p-red","逼近")
    +dlRow("EP 22 194 552","歐洲","規則71(3)補正","2026/08/28","14 天","陳維","p-amber","處理中")
    +dlRow("TW 111 138 204","台灣","實審意見答辯","2026/09/10","27 天","王孟","p-blue","排程中")
    +dlRow("KR 10-2022-118","韓國","年費暨核准費","2026/09/02","19 天","李昀","p-amber","待繳")
    +dlRow("CN 2022 1 05881","中國","實審請求","2026/10/05","52 天","王孟","p-gray","未逼近")
    +'</tbody></table></div></div>'
    +'</div></div>';
  return '<div class="split">'+listPane("進行中案件","5 件待辦 · 依期限排序",list,0)+right+'</div>';
}
function dlRow(no,co,it,dl,rm,pe,pc,st){
  return '<tr><td><b>'+no+'</b></td><td>'+co+'</td><td>'+it+'</td><td>'+dl+'</td><td>'+rm+'</td><td>'+pe+'</td><td><span class="pill '+pc+'">'+st+'</span></td></tr>';
}
function timeline1(){
  var ev=[
    {t:"送件受理",d:"2022/09/02",p:"USPTO 受理，取得申請日與序號。"},
    {t:"公開",d:"2023/03/14",p:"申請案公開，進入可監控狀態。"},
    {t:"第 1 次核駁 (OA)",d:"2026/05/22",p:"審查委員以 §103 顯而易見核駁 3 項請求項。"},
    {t:"答辯撰擬中",d:"2026/08/14",p:"代理人備妥修正與答辯理由，待客戶確認。"},
    {t:"答辯期限",d:"2026/08/20",p:"含展期最終期限，逾期案件視為放棄。"}
  ];
  var h='<div class="tl">';
  for(var a=0;a<ev.length;a++){h+='<div class="ev"><div class="dot"></div><b>'+ev[a].t+'</b> <small>· '+ev[a].d+'</small><p>'+ev[a].p+'</p></div>';}
  return h+'</div>';
}

/* SCREEN 2 : 布局地圖分析 */
function screen2(){
  var list={hi:"travel_explore",rows:[
    {ic:"business",b:"本公司",s:"362 件 · 主場優勢",tag:"362",pc:"p-green"},
    {ic:"factory",b:"對手 A（先進封裝）",s:"高密度互連布局密集",tag:"541",pc:"p-red"},
    {ic:"factory",b:"對手 B（電源）",s:"功率模組專利領先",tag:"418",pc:"p-amber"},
    {ic:"factory",b:"對手 C（通訊）",s:"射頻前端布局廣",tag:"296",pc:"p-blue"},
    {ic:"factory",b:"對手 D（材料）",s:"介電材料起步中",tag:"152",pc:"p-gray"}
