<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>智慧財產權/專利管理系統</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700&family=Roboto+Mono:wght@300;400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700&family=Roboto+Mono:wght@300;400;500;700&display=swap');

:root{
  --color-primary:#15803d;
  --color-on-primary:#ffffff;
  --color-secondary:#22c55e;
  --color-on-secondary:#0f172a;
  --color-accent:#d97706;
  --color-on-accent:#000000;
  --color-background:#f0fdf4;
  --color-foreground:#14532d;
  --color-card:#ffffff;
  --color-card-foreground:#14532d;
  --color-muted:#e8f0f1;
  --color-muted-foreground:#475569;
  --color-border:#bbf7d0;
  --color-destructive:#dc2626;
  --color-on-destructive:#ffffff;
  --color-ring:#15803d;
  --blue:#15803d;
  --ink:#14532d;
  --muted:#475569;
  --line:#bbf7d0;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --accent-soft:#dcfce7;
  --shadow:0 1px 0 rgba(20,83,45,.08),0 10px 24px rgba(20,83,45,.06);
  --shadow-hover:0 2px 0 rgba(20,83,45,.10),0 14px 30px rgba(20,83,45,.10);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
html,body{margin:0;padding:0;}
body{
  min-width:320px;
  background:
    linear-gradient(rgba(21,128,61,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(21,128,61,.035) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--color-foreground);
  font-family:"Exo",system-ui,-apple-system,"Segoe UI",sans-serif;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit;}
button,[onclick],.litem{cursor:pointer;}
button:focus-visible,[onclick]:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
.app{width:min(100%,1440px);margin:0 auto;padding:20px clamp(14px,2vw,28px) 12px;}
.top{
  position:relative;
  display:grid;
  grid-template-columns:auto minmax(220px,1fr) auto;
  align-items:center;
  gap:18px;
  min-width:0;
  overflow:hidden;
  padding:22px 24px;
  border:1px solid #166534;
  border-radius:8px;
  background:linear-gradient(112deg,#14532d 0%,#166534 62%,#15803d 100%);
  color:var(--color-on-primary);
  box-shadow:0 12px 30px rgba(20,83,45,.16);
}
.top::after{
  content:"";
  position:absolute;
  top:0;right:0;
  width:26%;height:100%;
  border-left:1px solid rgba(255,255,255,.14);
  background:repeating-linear-gradient(135deg,transparent 0 18px,rgba(255,255,255,.04) 18px 19px);
  pointer-events:none;
}
.logo{
  position:relative;
  z-index:1;
  display:grid;
  place-items:center;
  width:48px;height:48px;
  flex:0 0 auto;
  border:1px solid rgba(255,255,255,.42);
  border-radius:4px;
  background:var(--color-secondary);
  color:var(--color-on-secondary);
  box-shadow:4px 4px 0 rgba(0,0,0,.16);
}
.logo .material-symbols-outlined{font-size:28px;}
.top .tt{position:relative;z-index:1;min-width:0;}
.top h1{margin:0;font-size:clamp(18px,2vw,24px);font-weight:700;letter-spacing:.035em;line-height:1.25;}
.top p{margin:5px 0 0;color:#dcfce7;font-size:13px;font-weight:400;letter-spacing:.02em;}
.top .badges{position:relative;z-index:1;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;max-width:520px;}
.badge{
  display:flex;
  align-items:center;
  gap:6px;
  padding:6px 10px;
  border:1px solid rgba(255,255,255,.32);
  border-radius:3px;
  background:rgba(255,255,255,.09);
  color:#ffffff;
  font-size:11.5px;
  font-weight:600;
  backdrop-filter:blur(4px);
}
.badge .material-symbols-outlined{font-size:16px;color:#86efac;}
nav{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  gap:6px;
  margin:16px 0;
  padding:6px;
  overflow-x:auto;
  border:1px solid var(--color-border);
  border-radius:6px;
  background:rgba(255,255,255,.94);
  box-shadow:0 4px 16px rgba(20,83,45,.06);
  scrollbar-width:thin;
  backdrop-filter:blur(12px);
}
nav button{
  position:relative;
  display:flex;
  flex:1 0 auto;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:42px;
  padding:9px 13px;
  border:1px solid transparent;
  border-radius:3px;
  background:transparent;
  color:var(--color-muted-foreground);
  font-size:12.5px;
  font-weight:600;
  letter-spacing:.015em;
  transition:background-color 220ms ease,border-color 220ms ease,color 220ms ease,transform 220ms ease,box-shadow 220ms ease;
}
nav button::after{
  content:"";
  position:absolute;
  right:10px;bottom:4px;left:10px;
  height:2px;
  background:transparent;
  transition:background-color 220ms ease;
}
nav button .material-symbols-outlined{font-size:19px;}
nav button:hover{border-color:var(--color-border);background:#f0fdf4;color:var(--color-primary);transform:translateY(-1px);}
nav button.active{border-color:var(--color-primary);background:var(--color-primary);color:var(--color-on-primary);box-shadow:3px 3px 0 #bbf7d0;}
nav button.active::after{background:#86efac;}
#screen{animation:screen-reveal 360ms ease-out both;}
.split{display:grid;grid-template-columns:minmax(280px,320px) minmax(0,1fr);gap:16px;align-items:start;min-width:0;}
.pane{
  min-width:0;
  overflow:hidden;
  border:1px solid var(--color-border);
  border-radius:7px;
  background:var(--color-card);
  color:var(--color-card-foreground);
  box-shadow:var(--shadow);
}
.split>.pane:first-child{position:sticky;top:76px;}
.pane-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  min-width:0;
  padding:14px 16px;
  border-bottom:1px solid var(--color-border);
  background:linear-gradient(90deg,#f0fdf4,#ffffff);
}
.pane-h h2{display:flex;align-items:center;gap:8px;min-width:0;margin:0;font-size:14px;font-weight:700;letter-spacing:.02em;}
.pane-h h2 .material-symbols-outlined{font-size:20px;color:var(--color-primary);}
.pane-h .sub{color:var(--color-muted-foreground);font-family:"Roboto Mono",monospace;font-size:10.5px;font-weight:500;white-space:nowrap;}
.pane-b{min-width:0;padding:16px;}
.litem{
  display:flex;
  align-items:flex-start;
  gap:10px;
  min-width:0;
  margin-bottom:4px;
  padding:10px;
  border:1px solid transparent;
  border-radius:4px;
  transition:background-color 220ms ease,border-color 220ms ease,transform 220ms ease,box-shadow 220ms ease;
}
.litem:last-child{margin-bottom:0;}
.litem:hover{border-color:var(--color-border);background:#f0fdf4;transform:translateX(2px);}
.litem.sel{border-color:var(--color-primary);background:#dcfce7;box-shadow:inset 3px 0 0 var(--color-primary);}
.litem .ic{display:grid;place-items:center;width:34px;height:34px;flex:0 0 auto;border:1px solid var(--color-border);border-radius:3px;background:#ffffff;color:var(--color-primary);}
.litem.sel .ic{border-color:var(--color-primary);background:var(--color-primary);color:#ffffff;}
.litem .ic .material-symbols-outlined{font-size:18px;}
.litem .tx{min-width:0;flex:1;}
.litem .tx b{display:block;font-size:13px;font-weight:700;}
.litem .tx small{display:block;overflow:hidden;margin-top:2px;color:var(--color-muted-foreground);font-size:11px;text-overflow:ellipsis;}
.litem .pill{height:fit-content;}
.grid{display:grid;gap:12px;min-width:0;}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
.kpi,.card{
  min-width:0;
  border:1px solid var(--color-border);
  border-radius:5px;
  background:var(--color-card);
  box-shadow:0 1px 0 rgba(20,83,45,.04);
  transition:border-color 220ms ease,box-shadow 220ms ease,transform 220ms ease;
}
.kpi:hover,.card:hover{border-color:#86efac;box-shadow:var(--shadow-hover);transform:translateY(-2px);}
.kpi{position:relative;overflow:hidden;padding:13px 14px 14px;}
.kpi::before{content:"";position:absolute;top:0;right:0;left:0;height:3px;background:var(--color-primary);}
.kpi .lb{display:flex;align-items:center;gap:6px;color:var(--color-muted-foreground);font-size:11.5px;font-weight:600;}
.kpi .lb .material-symbols-outlined{font-size:17px;color:var(--color-primary);}
.kpi .vv{margin-top:7px;color:var(--color-foreground);font-family:"Roboto Mono",monospace;font-size:clamp(20px,2vw,25px);font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums;}
.kpi .dd{margin-top:3px;font-size:11px;font-weight:600;}
.up::before{content:"↑ ";font-family:"Roboto Mono",monospace;}
.down::before{content:"! ";font-family:"Roboto Mono",monospace;font-weight:700;}
.flat::before{content:"— ";font-family:"Roboto Mono",monospace;}
.up{color:#166534;}.down{color:#b91c1c;}.flat{color:var(--color-muted-foreground);}
.card{padding:14px;}
.card h3{display:flex;align-items:center;gap:7px;margin:0 0 12px;padding-bottom:9px;border-bottom:1px solid var(--color-muted);font-size:13.5px;font-weight:700;letter-spacing:.015em;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--color-primary);}
.chart-wrap{position:relative;width:100%;overflow:hidden;}
table{width:100%;border-collapse:separate;border-spacing:0;color:var(--color-card-foreground);font-size:12px;font-variant-numeric:tabular-nums;}
th{padding:9px 10px;border-top:1px solid var(--color-border);border-bottom:1px solid var(--color-border);background:#f0fdf4;color:#334155;text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.055em;white-space:nowrap;}
th:first-child{border-left:1px solid var(--color-border);}
th:last-child{border-right:1px solid var(--color-border);}
td{padding:10px;border-bottom:1px solid var(--color-muted);background:#ffffff;white-space:nowrap;transition:background-color 180ms ease;}
tbody tr:hover td{background:#f0fdf4;}
td:first-child,td:first-child b{font-family:"Roboto Mono",monospace;font-size:11.5px;letter-spacing:-.02em;}
th:nth-child(4),th:nth-child(5),th:nth-child(6),td:nth-child(4),td:nth-child(5),td:nth-child(6){text-align:right;}
td:has(.bar){text-align:right;}
.pill{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:3px;
  font-size:10.5px;
  font-weight:700;
  line-height:1.25;
  white-space:nowrap;
}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;}
.p-green{background:#dcfce7;color:#166534;}
.p-amber{background:#fef3c7;color:#92400e;}
.p-red{background:#fee2e2;color:#991b1b;}
.p-blue{background:#dbeafe;color:#1e40af;}
.p-gray{background:#f1f5f9;color:#475569;}
.p-violet{background:#ede9fe;color:#5b21b6;}
.bar{height:7px;min-width:60px;overflow:hidden;border-radius:2px;background:var(--color-muted);}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--color-primary),var(--color-secondary));}
.sec-title{display:flex;align-items:center;gap:7px;margin:2px 0 11px;color:var(--color-foreground);font-size:13px;font-weight:700;letter-spacing:.02em;}
.sec-title .material-symbols-outlined{font-size:18px;color:var(--color-primary);}
.tl{position:relative;padding-left:24px;}
.tl::before{content:"";position:absolute;top:4px;bottom:4px;left:7px;width:2px;background:var(--color-border);}
.tl .ev{position:relative;padding:0 0 16px 7px;}
.tl .ev:last-child{padding-bottom:0;}
.tl .dot{position:absolute;top:4px;left:-21px;width:11px;height:11px;border:2px solid #ffffff;border-radius:2px;background:var(--color-primary);box-shadow:0 0 0 2px var(--color-primary);}
.tl .ev b{font-size:12.5px;}
.tl .ev small{color:var(--color-muted-foreground);font-family:"Roboto Mono",monospace;font-size:10.5px;}
.tl .ev p{margin:3px 0 0;color:#334155;font-size:11.5px;}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;min-width:0;}
.col{min-width:0;padding:10px;border:1px solid var(--color-border);border-radius:4px;background:#f8fafc;}
.col .ch{display:flex;justify-content:space-between;margin-bottom:9px;color:#334155;font-size:11.5px;font-weight:700;letter-spacing:.03em;}
.col .ch em{padding:1px 7px;border:1px solid var(--color-border);border-radius:2px;background:#ffffff;color:var(--color-primary);font-family:"Roboto Mono",monospace;font-size:10px;font-style:normal;}
.tk{margin-bottom:7px;padding:9px;border:1px solid var(--color-border);border-left:3px solid var(--color-primary);border-radius:3px;background:#ffffff;box-shadow:2px 2px 0 var(--color-muted);transition:transform 220ms ease,box-shadow 220ms ease;}
.tk:last-child{margin-bottom:0;}
.tk:hover{transform:translateY(-2px);box-shadow:3px 4px 0 #d1fae5;}
.tk b{display:block;font-size:12px;}
.tk small{color:var(--color-muted-foreground);font-size:10.5px;}
.tk .row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px;}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:10px;color:var(--color-muted-foreground);font-size:11px;}
.legend span{display:flex;align-items:center;gap:5px;}
.dotc{display:inline-block;width:10px;height:10px;border:1px solid rgba(20,83,45,.18);border-radius:2px;}
.hl{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1px solid #86efac;border-left:4px solid var(--color-primary);border-radius:4px;background:#ecfdf5;color:#14532d;font-size:12px;box-shadow:2px 2px 0 #dcfce7;}
.hl .material-symbols-outlined{flex:0 0 auto;color:var(--color-primary);font-size:20px;}
.heat{display:grid;grid-template-columns:110px repeat(5,minmax(58px,1fr));gap:5px;min-width:430px;}
.heat .hc{padding:9px 4px;border:1px solid rgba(20,83,45,.12);border-radius:3px;text-align:center;font-family:"Roboto Mono",monospace;font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums;}
.heat .rl{display:flex;align-items:center;color:#334155;font-size:11px;font-weight:700;}
.heat .hh{padding-bottom:3px;color:var(--color-muted-foreground);text-align:center;font-size:10px;font-weight:700;}
.foot{padding:20px 0 8px;color:var(--color-muted-foreground);text-align:center;font-family:"Roboto Mono",monospace;font-size:10.5px;}
@keyframes screen-reveal{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:1100px){
  .top{grid-template-columns:auto 1fr;}
  .top .badges{grid-column:1/-1;justify-content:flex-start;max-width:none;}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media(max-width:860px){
  .split{grid-template-columns:1fr;}
  .split>.pane:first-child{position:static;}
  .pane-b{padding:14px;}
}
@media(max-width:768px){
  .app{padding:12px;}
  .top{padding:18px;}
  .g2,.g3{grid-template-columns:1fr;}
  .board{grid-template-columns:repeat(2,minmax(0,1fr));}
  nav{top:0;margin:12px 0;}
}
@media(max-width:560px){
  .top{grid-template-columns:auto 1fr;gap:12px;border-radius:6px;}
  .top::after{display:none;}
  .top h1{font-size:17px;}
  .top p{font-size:11.5px;}
  .badge{width:100%;}
  nav{justify-content:flex-start;}
  nav button{flex:0 0 44px;min-width:44px;min-height:44px;padding:10px;}
  nav button span.txt{display:none;}
  .g4,.board{grid-template-columns:1fr;}
  .pane-h{align-items:flex-start;flex-direction:column;}
  .pane-h .sub{white-space:normal;}
  .kpi{padding:12px;}
  th,td{padding:9px 8px;}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important;}
  #screen{animation:none;}
  nav button:hover,.litem:hover,.kpi:hover,.card:hover,.tk:hover{transform:none;}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo"><span class="material-symbols-outlined">shield</span></div>
    <div class="tt">
      <h1>智慧財產權 / 專利管理系統</h1>
      <p>從發明揭露到年費維護的專利資產全生命週期數位化</p>
    </div>
    <div class="badges">
      <span class="badge"><span class="material-symbols-outlined">groups</span>研發專案管理師 · 研發經理 · 技術長</span>
      <span class="badge"><span class="material-symbols-outlined">verified</span>可操作 · 可追蹤 · 可稽核</span>
    </div>
  </header>

  <nav id="nav"></nav>
  <div id="screen"></div>

  <div class="foot">智慧財產權 / 專利管理系統 · 純前端展示雛型（資料為模擬）· 綠色主題工作台</div>
</div>

<script>
"use strict";
var NAV=[
  {i:0,ic:"dashboard",t:"專利組合總覽"},
  {i:1,ic:"checklist",t:"申請進度追蹤"},
  {i:2,ic:"account_tree",t:"布局地圖分析"},
  {i:3,ic:"calendar_month",t:"年費到期提醒"},
  {i:4,ic:"gavel",t:"侵權與訴訟監控"},
  {i:5,ic:"insights",t:"決策洞察站"}
];
var chartRef={};
function destroyCharts(){for(var k in chartRef){if(chartRef[k]){try{chartRef[k].destroy();}catch(e){}chartRef[k]=null;}}}
function el(id){return document.getElementById(id);}

function buildNav(){
  var h="";
  for(var a=0;a<NAV.length;a++){
    var n=NAV[a];
    h+='<button data-i="'+n.i+'" onclick="show('+n.i+')"><span class="material-symbols-outlined">'+n.ic+'</span><span class="txt">'+n.t+'</span></button>';
  }
  el("nav").innerHTML=h;
}

function listPane(title,sub,items,selIdx){
  var h='<div class="pane"><div class="pane-h"><h2><span class="material-symbols-outlined">'+items.hi+'</span>'+title+'</h2><span class="sub">'+sub+'</span></div><div class="pane-b">';
  for(var a=0;a<items.rows.length;a++){
    var r=items.rows[a];
    h+='<div class="litem'+(a===selIdx?' sel':'')+'"><div class="ic"><span class="material-symbols-outlined">'+r.ic+'</span></div><div class="tx"><b>'+r.b+'</b><small>'+r.s+'</small></div><span class="pill '+r.pc+'">'+r.tag+'</span></div>';
  }
  h+='</div></div>';
  return h;
}

/* SCREEN 0 : 專利組合總覽 */
function screen0(){
  var list={hi:"folder_special",rows:[
    {ic:"memory",b:"半導體封裝",s:"IPC H01L · 128 件",tag:"高價值",pc:"p-green"},
    {ic:"bolt",b:"電源管理",s:"IPC H02M · 86 件",tag:"核心",pc:"p-blue"},
    {ic:"wifi",b:"無線通訊",s:"IPC H04W · 74 件",tag:"成長",pc:"p-violet"},
    {ic:"battery_charging_full",b:"電池材料",s:"IPC H01M · 41 件",tag:"觀察",pc:"p-amber"},
    {ic:"visibility",b:"影像感測",s:"IPC H04N · 33 件",tag:"新興",pc:"p-gray"}
  ]};
  var right=''
    +'<div class="pane"><div class="pane-h"><h2><span class="material-symbols-outlined">memory</span>半導體封裝 · 專利組合檢視</h2><span class="sub">更新 2026/08/14</span></div><div class="pane-b">'
    +'<div class="grid g4">'
    +kpi("inventory_2","專利資產總數","362","+18 本年度","up")

/* helpers */
function kpi(ic,lb,vv,dd,cls){
  return '<div class="kpi"><div class="lb"><span class="material-symbols-outlined">'+ic+'</span>'+lb+'</div><div class="vv">'+vv+'</div><div class="dd '+cls+'">'+dd+'</div></div>';
}
var GREEN="#16a34a",GREEN2="#4ade80",PALETTE=["#16a34a","#4ade80","#86efac","#bbf7d0","#166534","#22c55e"];
function baseOpts(extra){
  var o={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{family:"Inter",size:11},boxWidth:12}}}};
  if(extra){for(var k in extra){o[k]=extra[k];}}
  return o;
}
function mkChart(id,cfg){
  var cv=el(id);if(!cv)return;
  chartRef[id]=new Chart(cv.getContext("2d"),cfg);
}

function initCharts(i){
  if(i===0){
    mkChart("c0a",{type:"bar",data:{labels:["美國","台灣","中國","日本","歐洲","韓國"],datasets:[{label:"件數",data:[112,98,74,42,24,12],backgroundColor:GREEN,borderRadius:6}]},options:baseOpts({scales:{y:{beginAtZero:true,grid:{color:"#eef2f0"}},x:{grid:{display:false}}},plugins:{legend:{display:false}}})});
    mkChart("c0b",{type:"doughnut",data:{labels:["已核准","審查中","公開未實審","已放棄"],datasets:[{data:[241,98,15,8],backgroundColor:PALETTE,borderWidth:2,borderColor:"#fff"}]},options:baseOpts({cutout:"60%"})});
  }else if(i===1){
    mkChart("c1a",{type:"bar",data:{labels:["送件","公開","實審中","OA答辯","核准"],datasets:[{label:"美國",data:[6,9,14,8,20],backgroundColor:GREEN},{label:"其他各國",data:[10,18,26,12,30],backgroundColor:GREEN2}]},options:baseOpts({scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,beginAtZero:true,grid:{color:"#eef2f0"}}}})});
  }else if(i===2){
    mkChart("c2a",{type:"radar",data:{labels:["封裝結構","重佈線層","功率模組","射頻前端","電池材料"],datasets:[{label:"本公司",data:[92,74,46,38,24],borderColor:GREEN,backgroundColor:"rgba(22,163,74,.18)",borderWidth:2},{label:"對手綜合",data:[88,95,90,88,70],borderColor:"#f59e0b",backgroundColor:"rgba(245,158,11,.12)",borderWidth:2}]},options:baseOpts({scales:{r:{beginAtZero:true,suggestedMax:100,pointLabels:{font:{size:10}}}}})});
    mkChart("c2b",{type:"line",data:{labels:["2021","2022","2023","2024","2025"],datasets:[{label:"本公司申請",data:[42,55,61,58,66],borderColor:GREEN,backgroundColor:"rgba(22,163,74,.12)",fill:true,tension:.35},{label:"對手A申請",data:[70,82,95,104,118],borderColor:"#ef4444",tension:.35}]},options:baseOpts({scales:{y:{beginAtZero:true,grid:{color:"#eef2f0"}},x:{grid:{display:false}}}})});
  }else if(i===3){
    mkChart("c3a",{type:"bar",data:{labels:["8月","9月","10月","11月","12月","1月","2月","3月","4月","5月","6月","7月"],datasets:[{label:"年費金額",data:[62,79,54,41,88,33,47,29,66,52,38,71],backgroundColor:function(c){return c.raw>=70?"#dc2626":c.raw>=45?"#f59e0b":GREEN;},borderRadius:5}]},options:baseOpts({scales:{y:{beginAtZero:true,grid:{color:"#eef2f0"}},x:{grid:{display:false}}},plugins:{legend:{display:false}}})});
  }else if(i===4){
    mkChart("c4a",{type:"doughnut",data:{labels:["侵權訴訟","異議程序","疑似侵權監控","授權談判","無效舉發"],datasets:[{data:[1,1,1,1,1],backgroundColor:["#dc2626","#f59e0b","#3b82f6","#8b5cf6","#94a3b8"],borderWidth:2,borderColor:"#fff"}]},options:baseOpts({cutout:"58%"})});
    mkChart("c4b",{type:"line",data:{labels:["3月","4月","5月","6月","7月","8月"],datasets:[{label:"比對命中件數",data:[4,6,5,9,7,11],borderColor:GREEN,backgroundColor:"rgba(22,163,74,.14)",fill:true,tension:.35}]},options:baseOpts({scales:{y:{beginAtZero:true,grid:{color:"#eef2f0"}},x:{grid:{display:false}}},plugins:{legend:{display:false}}})});
  }else if(i===5){
    mkChart("c5a",{type:"line",data:{labels:["第1週","第2週","第3週","第4週","第5週","第6週"],datasets:[{label:"專案準時率 %",data:[66,70,74,78,82,86],borderColor:GREEN,backgroundColor:"rgba(22,163,74,.14)",fill:true,tension:.35,pointRadius:4,pointBackgroundColor:GREEN}]},options:baseOpts({scales:{y:{beginAtZero:false,min:60,max:100,grid:{color:"#eef2f0"}},x:{grid:{display:false}}},plugins:{legend:{display:false}}})});
    mkChart("c5b",{type:"doughnut",data:{labels:["核心高價值","策略型","一般","低價值/待放棄"],datasets:[{data:[64,118,146,34],backgroundColor:PALETTE,borderWidth:2,borderColor:"#fff"}]},options:baseOpts({cutout:"60%"})});
  }
}

var SCREENS=[screen0,screen1,screen2,screen3,screen4,screen5];
function show(i){
  destroyCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var a=0;a<btns.length;a++){btns[a].classList.toggle("active",+btns[a].getAttribute("data-i")===i);}
  var c=el("screen");
  c.innerHTML=SCREENS[i]();
  void c.offsetHeight;
  initCharts(i);
}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
</body>
</html>
