<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>衝突礦產申報管理 · Conflict Minerals Reporting</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#dc2626; --accent2:#f97316;
  --bg:#f4f5f7; --panel:#ffffff; --ink:#1f2430; --muted:#6b7280;
  --line:#e5e7eb; --side:#171a21; --side2:#20242e; --sideink:#c8ccd6;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter','Noto Sans TC',system-ui,sans-serif;
  background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle;}
.app{display:flex;min-height:100vh;}
/* sidebar */
.side{
  width:248px;flex:none;background:var(--side);color:var(--sideink);
  display:flex;flex-direction:column;padding:18px 14px;gap:6px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px;}
.brand .logo{
  width:40px;height:40px;flex:none;border-radius:11px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 6px 16px rgba(220,38,38,.35);
}
.brand .logo .material-symbols-outlined{font-size:24px;}
.brand b{color:#fff;font-size:15px;font-weight:800;letter-spacing:.3px;display:block;line-height:1.2;}
.brand span{font-size:11px;color:#8b90a0;}
.navlbl{font-size:10px;letter-spacing:1.5px;color:#6b7280;padding:6px 10px 2px;text-transform:uppercase;}
.nav{display:flex;flex-direction:column;gap:4px;}
.navbtn{
  display:flex;align-items:center;gap:12px;min-width:0;
  background:transparent;border:none;color:var(--sideink);cursor:pointer;
  padding:11px 12px;border-radius:10px;font:inherit;font-size:13.5px;text-align:left;width:100%;
  transition:.16s;white-space:nowrap;
}
.navbtn .material-symbols-outlined{font-size:21px;color:#8b90a0;flex:none;}
.navbtn .nx{display:flex;flex-direction:column;min-width:0;overflow:hidden;}
.navbtn .nx b{font-weight:600;font-size:13.5px;}
.navbtn .nx small{font-size:10.5px;color:#7a8091;}
.navbtn:hover{background:var(--side2);color:#fff;}
.navbtn.on{background:linear-gradient(100deg,rgba(220,38,38,.22),rgba(249,115,22,.14));color:#fff;box-shadow:inset 3px 0 0 var(--accent);}
.navbtn.on .material-symbols-outlined{color:var(--accent2);}
.sidefoot{margin-top:auto;padding:12px 10px 2px;font-size:11px;color:#6b7280;border-top:1px solid #262b36;}
.sidefoot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.top{
  background:var(--panel);border-bottom:1px solid var(--line);
  padding:16px 26px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20;
}
.top .tt{min-width:0;}
.top .tt h1{margin:0;font-size:18px;font-weight:800;letter-spacing:.2px;}
.top .tt p{margin:2px 0 0;font-size:12.5px;color:var(--muted);}
.top .sp{margin-left:auto;}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fef2f2;color:var(--accent);border:1px solid #fecaca;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;}
.pill.g{background:#f0fdf4;color:var(--ok);border-color:#bbf7d0;}
.wrap{padding:24px 26px 42px;}
/* generic */
.grid{display:grid;gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:1.6fr 1fr;}
.g32{grid-template-columns:1fr 1.5fr;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px;min-width:0;}
.card h3{margin:0 0 3px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
.card .sub{font-size:11.5px;color:var(--muted);margin:0 0 14px;}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px 17px;position:relative;overflow:hidden;min-width:0;}
.kpi .lb{font-size:12px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px;}
.kpi .vl{font-size:27px;font-weight:800;margin:8px 0 2px;letter-spacing:.3px;}
.kpi .dt{font-size:11.5px;font-weight:600;}
.kpi .ic{position:absolute;right:-8px;top:-8px;font-size:74px;opacity:.06;color:var(--accent);}
.up{color:var(--ok);} .down{color:var(--bad);}
.chart{width:100%;height:270px;}
.chart.sm{height:220px;}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px;}
th{background:#f9fafb;color:#6b7280;font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:11.5px;}
td{padding:10px 12px;border-bottom:1px solid #f0f1f3;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#fafbfc;}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;}
.t-ok{background:#f0fdf4;color:var(--ok);}
.t-warn{background:#fffbeb;color:var(--warn);}
.t-bad{background:#fef2f2;color:var(--bad);}
.t-info{background:#eff6ff;color:var(--info);}
.t-mut{background:#f3f4f6;color:#6b7280;}
.bar{height:7px;border-radius:5px;background:#eef0f3;overflow:hidden;min-width:60px;}
.bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
/* template board (v0) */
.tboard{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.tcol{background:#f9fafb;border:1px solid var(--line);border-radius:13px;padding:12px;min-width:0;}
.tcol>h4{margin:0 0 10px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:space-between;}
.tcol>h4 span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--muted);}
.tcard{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:11px 12px;margin-bottom:9px;}
.tcard:last-child{margin-bottom:0;}
.tcard b{font-size:12.5px;}
.tcard .meta{font-size:11px;color:var(--muted);margin-top:5px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.tcard.v2{border-left-color:var(--accent2);}
.tcard.v3{border-left-color:var(--info);}
/* timeline (v5) */
.tl{position:relative;padding-left:26px;}
.tl:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tlrow{position:relative;padding:0 0 18px;}
.tlrow:last-child{padding-bottom:0;}
.tlrow .dot{position:absolute;left:-22px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--accent);}
.tlrow.done .dot{background:var(--ok);border-color:var(--ok);}
.tlrow.now .dot{border-color:var(--accent2);box-shadow:0 0 0 4px rgba(249,115,22,.18);}
.tlrow b{font-size:13px;}
.tlrow .meta{font-size:11.5px;color:var(--muted);margin-top:3px;}
/* smelter matrix (v3) */
.mtx{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px;}
.mcell{border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff;}
.mcell b{font-size:12.5px;display:block;}
.mcell small{font-size:11px;color:var(--muted);}
.mcell .st{margin-top:8px;}
/* funnel steps (v1) */
.steps{display:flex;flex-direction:column;gap:9px;}
.step{display:flex;align-items:center;gap:12px;}
.step .lab{width:96px;flex:none;font-size:12px;font-weight:600;}
.step .track{flex:1;height:26px;border-radius:7px;background:#f1f2f4;overflow:hidden;position:relative;min-width:0;}
.step .track>i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.step .track>span{position:absolute;right:9px;top:0;line-height:26px;font-size:11.5px;font-weight:700;color:#fff;}
.step .num{width:52px;flex:none;text-align:right;font-size:12.5px;font-weight:700;}
/* trace chain (v4) */
.chain{display:flex;flex-wrap:wrap;gap:0;align-items:stretch;}
.node{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 13px;min-width:130px;position:relative;}
.node .lv{font-size:10px;letter-spacing:.5px;color:var(--accent);font-weight:700;text-transform:uppercase;}
.node b{font-size:12.5px;display:block;margin-top:2px;}
.node small{font-size:11px;color:var(--muted);}
.arw{align-self:center;color:var(--muted);padding:0 4px;}
.notice{background:#fff7ed;border:1px solid #fed7aa;border-radius:11px;padding:12px 14px;font-size:12.5px;color:#9a3412;display:flex;gap:9px;align-items:flex-start;}
.notice .material-symbols-outlined{color:var(--accent2);font-size:20px;flex:none;}
/* mobile nav */
.mnav{display:none;}
@media(max-width:860px){
  .side{display:none;}
  .app{flex-direction:column;}
  .mnav{
    display:flex;flex-wrap:wrap;gap:7px;background:var(--side);
    padding:11px 12px;position:sticky;top:0;z-index:30;
  }
  .mnav .mb{
    flex:none;white-space:nowrap;min-width:0;display:flex;align-items:center;gap:6px;
    background:var(--side2);color:var(--sideink);border:none;border-radius:9px;
    padding:8px 11px;font:inherit;font-size:12.5px;cursor:pointer;
  }
  .mnav .mb .material-symbols-outlined{font-size:18px;}
  .mnav .mb.on{background:linear-gradient(100deg,var(--accent),var(--accent2));color:#fff;}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32,.tboard{grid-template-columns:1fr;}
  .top{padding:14px 16px;}
  .wrap{padding:18px 16px 34px;}
}
@media(max-width:560px){
  .mnav .mb .mtxt{display:none;}
  .mnav .mb{padding:9px 11px;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">diamond</span></div>
      <div><b>CMRT Hub</b><span>衝突礦產申報管理</span></div>
    </div>
    <div class="navlbl">申報作業</div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot"><span class="dot"></span>RMI 清單同步：正常 · 08/14</div>
  </aside>
  <div class="main">
    <div class="mnav" id="mnav"></div>
    <div class="top">
      <div class="tt"><h1 id="scT">—</h1><p id="scS">—</p></div>
      <div class="sp"></div>
      <span class="pill g"><span class="material-symbols-outlined" style="font-size:16px">verified</span>合規率 91%</span>
    </div>
    <div class="wrap"><div id="view"></div></div>
  </div>
</div>
<script>
(function(){
"use strict";
var MODS=[
  {icon:"description",name:"CMRT/EMRT 範本",sub:"申報範本版本、欄位與適用料號管理"},
  {icon:"forward_to_inbox",name:"問卷發送追蹤",sub:"供應商調查發送狀態與回覆率"},
  {icon:"fact_check",name:"數據驗證",sub:"填報完整性、必填與邏輯校驗"},
  {icon:"factory",name:"冶煉廠比對",sub:"RMI 合規冶煉廠清單自動核對"},
  {icon:"hub",name:"供應鏈溯源",sub:"3TG 礦種來源鏈追溯"},
  {icon:"assignment_turned_in",name:"報告彙總提交",sub:"公司級 CMRT 彙總與稽核提交"}
];
var view=document.getElementById("view");
var charts=[];
function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts.push(c);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

/* ---------- SCREEN 0 : CMRT/EMRT 範本 ---------- */
function s0(){
  var cols=[
    {h:"使用中範本",n:3,cards:[
      {t:"CMRT 6.4 (2024)",v:"",m:["3TG 錫鉭鎢金","228 料號適用","更新 07/18"]},
      {t:"EMRT 1.3 擴展礦",v:"v2",m:["鈷 / 雲母","64 料號適用","更新 06/30"]},
      {t:"客戶 A 自訂欄位包",v:"v3",m:["加掛 12 欄位","汽車電子","更新 07/02"]}
    ]},
    {h:"審核中",n:2,cards:[
      {t:"CMRT 6.5 草案",v:"",m:["法規事務部","待欄位對映","建立 08/05"]},
      {t:"EMRT 2.0 導入評估",v:"v2",m:["新增鎳礦","衝擊分析中","建立 08/09"]}
    ]},
    {h:"已封存",n:2,cards:[
      {t:"CMRT 6.31",v:"v3",m:["2023 版","已停用","封存 01/15"]},
      {t:"舊客訂範本 v0.9",v:"v3",m:["欄位不足","已停用","封存 2023"]}
    ]}
  ];
  var boards="";
  cols.forEach(function(c){
    var inner="";
    c.cards.forEach(function(k){inner+='<div class="tcard '+k.v+'"><b>'+esc(k.t)+'</b><div class="meta">'+k.m.map(function(x){return '<span>'+esc(x)+'</span>';}).join('')+'</div></div>';});
    boards+='<div class="tcol"><h4>'+esc(c.h)+'<span>'+c.n+'</span></h4>'+inner+'</div>';
  });
  var rows=[
    ["料號 PN-A1207","車用連接器","CMRT 6.4","228","t-ok","已對映"],
    ["料號 PN-B3391","電池模組","EMRT 1.3","64","t-warn","缺 2 欄位"],
    ["料號 PN-C0455","主機板","CMRT 6.4","228","t-ok","已對映"],
    ["料號 PN-D8820","感測器","客訂欄位包","12","t-info","待審核"],
    ["料號 PN-E1102","線束總成","EMRT 1.3","64","t-ok","已對映"]
  ];
  var tr=rows.map(function(r){
    return '<tr><td><b>'+esc(r[0])+'</b></td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td><td>'+r[3]+'</td><td><span class="tag '+r[4]+'">'+esc(r[5])+'</span></td></tr>';
  }).join('');
  return '<div class="grid g4">'
    +kpi("使用中範本","3","涵蓋 3TG + 擴展礦","description","up","+1 本季")
    +kpi("適用料號","304","已完成範本對映","memory","up","96% 覆蓋")
    +kpi("待對映料號","13","缺必填欄位","report","down","本週 -5")
    +kpi("最新版本","6.4","CMRT 2024 標準","new_releases","","07/18 發布")
    +'</div>'
    +'<div class="card" style="margin-top:16px"><h3><span class="material-symbols-outlined">dashboard</span>範本生命週期看板</h3><p class="sub">依狀態管理各版 CMRT/EMRT 範本，卡片色條標示所屬礦種類別</p><div class="scroll"><div class="tboard" style="min-width:640px">'+boards+'</div></div></div>'
    +'<div class="grid g23" style="margin-top:16px">'
      +'<div class="card"><h3><span class="material-symbols-outlined">table_chart</span>料號 ↔ 範本對映</h3><p class="sub">各料號套用之申報範本與欄位對映狀態</p><div class="scroll"><table><thead><tr><th>料號</th><th>品名</th><th>套用範本</th><th>欄位數</th><th>狀態</th></tr></thead><tbody>'+tr+'</tbody></table></div></div>'
      +'<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>範本涵蓋分布</h3><p class="sub">各範本適用料號比例</p><div id="c0a" class="chart sm"></div></div>'
    +'</div>';
}
function c0(){
  mk("c0a",{tooltip:{trigger:"item"},legend:{bottom:0,icon:"circle",textStyle:{fontSize:11}},
    color:["#dc2626","#f97316","#2563eb","#9ca3af"],
    series:[{type:"pie",radius:["46%","70%"],center:["50%","44%"],avoidLabelOverlap:true,
      label:{show:true,formatter:"{b}\n{d}%",fontSize:11},
      data:[{value:228,name:"CMRT 6.4"},{value:64,name:"EMRT 1.3"},{value:12,name:"客訂欄位包"},{value:13,name:"未對映"}]}]});
}

/* ---------- SCREEN 1 : 問卷發送追蹤 ---------- */
function s1(){
  var steps=[
    ["已發送",342,100],
    ["已開啟",301,88],
    ["填報中",214,63],
    ["已回覆",236,69],
    ["已驗收",188,55]
  ];
  var st=steps.map(function(x){
    return '<div class="step"><div class="lab">'+esc(x[0])+'</div><div class="track"><i style="width:'+x[2]+'%"></i><span>'+x[2]+'%</span></div><div class="num">'+x[1]+'</div></div>';
  }).join('');
  var rows=[
    ["O鴻精密","fuhong@ex.com","已回覆","t-ok","08/09","—"],
    ["泰O金屬","taigang@ex.com","逾期未回","t-bad","—","催收 2 次"],
    ["O曜電子","xkele@ex.com","填報中","t-info","—","已開啟"],
    ["O達材料","hongda@ex.com","已驗收","t-ok","08/07","通過"],
    ["環宇連接","huanyu@ex.com","退回補正","t-warn","08/11","缺冶煉廠"],
    ["日昇鎢業","risheng@ex.com","已回覆","t-ok","08/10","待驗證"]
  ];
  var tr=rows.map(function(r){
    return '<tr><td><b>'+esc(r[0])+'</b></td><td style="color:#6b7280">'+esc(r[1])+'</td><td><span class="tag '+r[3]+'">'+esc(r[2])+'</span></td><td>'+esc(r[4])+'</td><td style="color:#6b7280">'+esc(r[5])+'</td></tr>';
  }).join('');
  return '<div class="grid g4">'
    +kpi("本期發送","342","家供應商","send","","批次 CM-2024Q3")
    +kpi("回覆率","69%","目標 85%","mark_email_read","up","週增 +6pt")
    +kpi("逾期未回","78","已自動催收","schedule_send","down","本週 -14")
    +kpi("平均回覆天","5.8","天 / 家","timer","up","去年 9.2")
    +'</div>'
    +'<div class="grid g23" style="margin-top:16px">'
      +'<div class="card"><h3><span class="material-symbols-outlined">show_chart</span>回覆率週趨勢</h3><p class="sub">每週累積回覆比例（%）與目標線</p><div id="c1a" class="chart"></div></div>'
      +'<div class="card"><h3><span class="material-symbols-outlined">filter_alt</span>問卷轉化漏斗</h3><p class="sub">發送 → 開啟 → 填報 → 回覆 → 驗收</p><div class="steps" style="margin-top:6px">'+st+'</div></div>'
    +'</div>'
    +'<div class="card" style="margin-top:16px"><h3><span class="material-symbols-outlined">contacts</span>供應商回覆明細</h3><p class="sub">各供應商窗口填報狀態與催收紀錄</p><div class="scroll"><table><thead><tr><th>供應商</th><th>窗口</th><th>狀態</th><th>回覆日</th><th>備註</th></tr></thead><tbody>'+tr+'</tbody></table></div></div>';
}
function c1(){
  mk("c1a",{tooltip:{trigger:"axis"},grid:{left:38,right:16,top:24,bottom:28},

/* ---------- helpers ---------- */
function kpi(lb,vl,dt,ic,dir,tail){
  var cls=dir==="up"?"up":(dir==="down"?"down":"");
  var ar=dir==="up"?"trending_up":(dir==="down"?"trending_down":"remove");
  var tailH=tail?'<span style="color:#9ca3af;font-weight:500"> · '+esc(tail)+'</span>':'';
  var dtH=dir?('<span class="material-symbols-outlined" style="font-size:15px">'+ar+'</span>'+esc(dt)):esc(dt);
  return '<div class="kpi"><span class="material-symbols-outlined ic">'+ic+'</span><div class="lb">'+esc(lb)+'</div><div class="vl">'+esc(vl)+'</div><div class="dt '+cls+'">'+dtH+tailH+'</div></div>';
}

var RENDER=[s0,s1,s2,s3,s4,s5];
var AFTER=[c0,c1,c2,c3,c4,c5];

function show(i){
  i=Math.max(0,Math.min(5,i|0));
  disposeCharts();
  document.getElementById("scT").textContent=MODS[i].name;
  document.getElementById("scS").textContent=MODS[i].sub;
  view.innerHTML=RENDER[i]();
  var bs=document.querySelectorAll("[data-i]");
  for(var k=0;k<bs.length;k++){bs[k].classList.toggle("on",+bs[k].getAttribute("data-i")===i);}
  void view.offsetHeight;
  AFTER[i]();
}

/* build nav */
(function(){
  var nav=document.getElementById("nav"),mnav=document.getElementById("mnav"),h="",mh="";
  for(var i=0;i<MODS.length;i++){

    mh+='<button class="mb" data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span><span class="mtxt">'+esc(MODS[i].name)+'</span></button>';
  }
  nav.innerHTML=h;mnav.innerHTML=mh;
  var all=document.querySelectorAll("[data-i]");
  for(var j=0;j<all.length;j++){
    all[j].addEventListener("click",function(){show(+this.getAttribute("data-i"));try{window.scrollTo(0,0);}catch(e){}});
  }
})();

show(0);
window.__show=show;
