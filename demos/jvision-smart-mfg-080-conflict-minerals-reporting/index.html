<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>衝突礦產申報管理 · Conflict Minerals Reporting</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#CBD5E1;
  --bg:#F8FAFC;
  --panel:#FFFFFF;
  --side:#0F172A;
  --side2:#1E293B;
  --sideink:#E2E8F0;
  --accent:#2563EB;
  --accent2:#EA580C;
  --ok:#15803D;
  --warn:#9A3412;
  --bad:#DC2626;
  --info:#1D4ED8;
  --shadow:7px 7px 0 #0F172A;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:'Fira Sans','Noto Sans TC',system-ui,sans-serif;
  color:var(--ink);
  background-color:var(--bg);
  background-image:linear-gradient(var(--color-border) 1px,transparent 1px),linear-gradient(90deg,var(--color-border) 1px,transparent 1px);
  background-size:32px 32px;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,[data-i]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-variation-settings:'FILL' 0,'wght' 600,'GRAD' 0,'opsz' 24;
  vertical-align:middle;
}
.app{display:flex;min-height:100vh}
.side{
  width:270px;
  flex:none;
  display:flex;
  flex-direction:column;
  gap:8px;
  position:sticky;
  top:0;
  height:100vh;
  padding:18px 16px;
  color:var(--sideink);
  background:var(--side);
  border-right:4px solid var(--color-primary);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:4px 2px 19px;
  margin-bottom:7px;
  border-bottom:2px solid #334155;
}
.brand .logo{
  width:46px;
  height:46px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border:2px solid #FFFFFF;
  border-radius:0;
  box-shadow:5px 5px 0 var(--color-accent);
}
.brand .logo .material-symbols-outlined{font-size:26px}
.brand b{
  display:block;
  color:#FFFFFF;
  font-size:15px;
  font-weight:800;
  line-height:1.25;
  letter-spacing:.04em;
  text-transform:uppercase;
}
.brand span{font-size:11px;color:#CBD5E1}
.navlbl{
  padding:7px 10px 3px;
  color:#94A3B8;
  font-family:'Fira Code',monospace;
  font-size:10px;
  font-weight:700;
  letter-spacing:.16em;
  text-transform:uppercase;
}
.nav{display:flex;flex-direction:column;gap:6px}
.navbtn{
  width:100%;
  min-width:0;
  min-height:54px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 11px;
  color:var(--sideink);
  background:transparent;
  border:2px solid transparent;
  border-radius:0;
  text-align:left;
  white-space:nowrap;
}
.navbtn .material-symbols-outlined{font-size:21px;color:#94A3B8;flex:none}
.navbtn .nx{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.navbtn .nx b{font-size:13px;font-weight:700}
.navbtn .nx small{overflow:hidden;color:#94A3B8;font-size:10px;text-overflow:ellipsis}
.navbtn:hover{color:#FFFFFF;background:#1E293B;border-color:#64748B}
.navbtn.on{
  color:#FFFFFF;
  background:var(--color-primary);
  border-color:#FFFFFF;
  box-shadow:5px 5px 0 var(--color-accent);
  transform:translate(-2px,-2px);
}
.navbtn.on .material-symbols-outlined{color:#FFFFFF}
.navbtn.on .nx small{color:#DBEAFE}
.sidefoot{
  margin-top:auto;
  padding:14px 5px 3px;
  color:#CBD5E1;
  border-top:2px solid #334155;
  font-family:'Fira Code',monospace;
  font-size:10px;
  line-height:1.6;
}
.sidefoot .dot{
  display:inline-block;
  width:9px;
  height:9px;
  margin-right:7px;
  background:var(--ok);
  border:2px solid #FFFFFF;
  border-radius:50%;
}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  gap:16px;
  min-height:78px;
  padding:15px 28px;
  background:rgba(248,250,252,.96);
  border-bottom:3px solid var(--ink);
}
.top:before{
  content:'COMPLIANCE / LIVE';
  align-self:stretch;
  display:flex;
  align-items:center;
  padding:0 12px;
  color:#FFFFFF;
  background:var(--ink);
  font-family:'Fira Code',monospace;
  font-size:10px;
  font-weight:700;
  letter-spacing:.08em;
}
.top .tt{min-width:0}
.top .tt h1{margin:0;font-size:clamp(19px,2vw,27px);font-weight:800;line-height:1.1;letter-spacing:-.03em}
.top .tt p{margin:5px 0 0;color:var(--muted);font-size:12px;font-weight:500}
.top .sp{margin-left:auto}
.pill{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:7px 11px;
  color:var(--color-destructive);
  background:#FEF2F2;
  border:2px solid var(--color-destructive);
  border-radius:0;
  font-family:'Fira Code',monospace;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
.pill.g{color:#14532D;background:#DCFCE7;border-color:#15803D}
.wrap{padding:26px 28px 48px}
.grid{display:grid;gap:17px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.65fr) minmax(280px,1fr)}
.g32{grid-template-columns:minmax(280px,1fr) minmax(0,1.5fr)}
.card,.kpi{
  min-width:0;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:2px solid var(--ink);
  border-radius:0;
}
.card{padding:18px}
.card:nth-child(even){box-shadow:5px 5px 0 var(--color-primary)}
.card h3{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0 0 4px;
  padding-bottom:10px;
  border-bottom:2px solid var(--line);
  font-size:14px;
  font-weight:800;
  letter-spacing:.01em;
}
.card h3 .material-symbols-outlined{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:29px;
  height:29px;
  color:#FFFFFF;
  background:var(--color-primary);
  font-size:18px;
}
.card .sub{margin:8px 0 16px;color:var(--muted);font-size:11.5px;line-height:1.55}
.kpi{
  position:relative;
  overflow:hidden;
  padding:17px 18px 16px;
  box-shadow:5px 5px 0 var(--ink);
}
.kpi:before{content:'';position:absolute;top:0;left:0;width:100%;height:7px;background:var(--color-primary)}
.kpi:nth-child(2n):before{background:var(--color-accent)}
.kpi .lb{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--muted);
  font-size:11px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
}
.kpi .vl{
  margin:9px 0 4px;
  font-family:'Fira Code',monospace;
  font-size:clamp(25px,2.3vw,34px);
  font-weight:700;
  line-height:1;
  letter-spacing:-.05em;
  font-variant-numeric:tabular-nums;
}
.kpi .dt{display:flex;align-items:center;color:var(--muted);font-size:11px;font-weight:600;line-height:1.4}
.kpi .ic{position:absolute;right:7px;top:13px;color:var(--color-primary);font-size:54px;opacity:.1}
.up{color:#166534!important}.down{color:#B91C1C!important}
.chart{width:100%;height:270px}.chart.sm{height:220px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line)}
table{width:100%;min-width:560px;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th{
  padding:11px 12px;
  color:#FFFFFF;
  background:var(--ink);
  border-right:1px solid #475569;
  border-bottom:3px solid var(--color-primary);
  font-family:'Fira Code','Noto Sans TC',monospace;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.04em;
  text-align:left;
  white-space:nowrap;
}
th:last-child{border-right:0}
td{padding:11px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:middle}
td:last-child{border-right:0}
tbody tr:nth-child(even){background:#F8FAFC}
tbody tr:hover{background:#DBEAFE}
tbody tr:last-child td{border-bottom:0}
th:nth-child(4),td:nth-child(4){text-align:right;font-variant-numeric:tabular-nums}
td b,td:first-child,.vl,.num,.node b,.mcell b{font-variant-numeric:tabular-nums}
td:first-child,.mcell b,.node b,.sidefoot{font-family:'Fira Code','Noto Sans TC',monospace}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 8px;
  border:1px solid currentColor;
  border-radius:0;
  font-size:10.5px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
}
.tag:before{content:'●';font-size:8px}
.t-ok{color:#14532D;background:#DCFCE7}
.t-warn{color:#7C2D12;background:#FFEDD5}
.t-bad{color:#991B1B;background:#FEE2E2}
.t-info{color:#1E40AF;background:#DBEAFE}
.t-mut{color:#334155;background:#E2E8F0}
.bar{height:12px;min-width:60px;overflow:hidden;background:var(--color-muted);border:1px solid var(--ink);border-radius:0}
.bar>i{display:block;height:100%;background:var(--color-primary);border-radius:0}
.tboard{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tcol{min-width:0;padding:12px;background:var(--color-muted);border:2px solid var(--ink);border-radius:0}
.tcol>h4{display:flex;align-items:center;justify-content:space-between;margin:0 0 11px;font-size:12px;font-weight:800;text-transform:uppercase}
.tcol>h4 span{padding:2px 8px;color:#FFFFFF;background:var(--ink);border-radius:0;font-family:'Fira Code',monospace;font-size:10px}
.tcard{margin-bottom:9px;padding:11px 12px;background:#FFFFFF;border:2px solid var(--ink);border-left:7px solid var(--color-primary);border-radius:0}
.tcard:last-child{margin-bottom:0}
.tcard:nth-child(odd){transform:translateX(3px)}
.tcard b{font-size:12px;font-weight:800}
.tcard .meta{display:flex;flex-wrap:wrap;gap:5px 10px;margin-top:7px;color:var(--muted);font-size:10.5px}
.tcard.v2{border-left-color:var(--color-accent)}
.tcard.v3{border-left-color:#0F766E}
.tl{position:relative;padding-left:29px}
.tl:before{content:'';position:absolute;left:9px;top:4px;bottom:4px;width:3px;background:var(--ink)}
.tlrow{position:relative;padding:0 0 19px}
.tlrow:last-child{padding-bottom:0}
.tlrow .dot{position:absolute;left:-26px;top:1px;width:17px;height:17px;background:#FFFFFF;border:3px solid var(--ink);border-radius:0}
.tlrow.done .dot{background:#15803D;border-color:#14532D}
.tlrow.done .dot:after{content:'✓';position:absolute;left:1px;top:-4px;color:#FFFFFF;font-size:12px;font-weight:900}
.tlrow.now .dot{background:var(--color-accent);border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.tlrow b{font-size:13px;font-weight:800}
.tlrow .meta{margin-top:4px;color:var(--muted);font-size:11px;line-height:1.5}
.mtx{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:11px}
.mcell{padding:12px;background:#FFFFFF;border:2px solid var(--ink);border-radius:0;box-shadow:3px 3px 0 var(--line)}
.mcell b{display:block;font-size:12px;font-weight:700}
.mcell small{color:var(--muted);font-size:10.5px}
.mcell .st{margin-top:9px}
.steps{display:flex;flex-direction:column;gap:11px}
.step{display:flex;align-items:center;gap:10px}
.step .lab{width:70px;flex:none;font-size:11px;font-weight:700}
.step .track{position:relative;flex:1;min-width:0;height:27px;overflow:hidden;background:var(--color-muted);border:2px solid var(--ink);border-radius:0}
.step .track>i{display:block;height:100%;background:var(--color-primary);border-radius:0}
.step:nth-child(even) .track>i{background:var(--color-secondary)}
.step .track>span{position:absolute;top:0;right:7px;color:#FFFFFF;font-family:'Fira Code',monospace;font-size:10px;font-weight:700;line-height:23px;text-shadow:1px 1px 0 #000}
.step .num{width:44px;flex:none;text-align:right;font-family:'Fira Code',monospace;font-size:12px;font-weight:700}
.chain{display:flex;flex-wrap:wrap;align-items:stretch}
.node{position:relative;min-width:130px;padding:12px;background:#FFFFFF;border:2px solid var(--ink);border-radius:0;box-shadow:3px 3px 0 var(--color-primary)}
.node .lv{color:var(--color-primary);font-family:'Fira Code',monospace;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.node b{display:block;margin-top:4px;font-size:12px}
.node small{color:var(--muted);font-size:10.5px}
.arw{align-self:center;padding:0 5px;color:var(--ink)}
.notice{
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:13px 15px;
  color:#7C2D12;
  background:#FFEDD5;
  border:2px solid #9A3412;
  border-left:9px solid var(--color-accent);
  border-radius:0;
  box-shadow:4px 4px 0 #9A3412;
  font-size:12px;
  line-height:1.55;
}
.notice .material-symbols-outlined{flex:none;color:#9A3412;font-size:21px}
.mnav{display:none}
#view>.grid:first-child .kpi,.grid-item,.card,.tcard,.mcell{animation:grid-in .4s cubic-bezier(.2,.9,.3,1.35) both}
#view>.grid:first-child .kpi:nth-child(2),.card:nth-child(2){animation-delay:.06s}
#view>.grid:first-child .kpi:nth-child(3),.tcard:nth-child(2),.mcell:nth-child(2){animation-delay:.12s}
#view>.grid:first-child .kpi:nth-child(4),.tcard:nth-child(3),.mcell:nth-child(3){animation-delay:.18s}
@keyframes grid-in{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.g32{grid-template-columns:1fr}
}
@media(max-width:860px){
  .side{display:none}
  .app{flex-direction:column}
  .mnav{
    position:sticky;
    top:0;
    z-index:30;
    display:flex;
    gap:0;
    overflow-x:auto;
    padding:8px;
    color:#FFFFFF;
    background:var(--side);
    border-bottom:4px solid var(--color-primary);
  }
  .mnav .mb{
    flex:none;
    min-width:48px;
    min-height:44px;
    display:flex;
    align-items:center;
    gap:7px;
    padding:9px 11px;
    color:var(--sideink);
    background:var(--side2);
    border:2px solid #475569;
    border-right:0;
    border-radius:0;
    white-space:nowrap;
  }
  .mnav .mb:last-child{border-right:2px solid #475569}
  .mnav .mb .material-symbols-outlined{font-size:18px}
  .mnav .mb.on{color:#FFFFFF;background:var(--color-primary);border-color:#FFFFFF}
  .top{position:relative;padding:14px 16px}
  .top:before{display:none}
  .wrap{padding:20px 16px 38px}
}
@media(max-width:600px){
  body{background-size:24px 24px}
  .g4,.g3,.g2,.g23,.g32,.tboard{grid-template-columns:1fr}
  .top{align-items:flex-start;flex-wrap:wrap;border-bottom-width:2px}
  .top .tt{width:calc(100% - 105px)}
  .top .tt h1{font-size:20px}
  .top .tt p{font-size:11px}
  .top .sp{display:none}
  .pill{margin-left:auto;padding:6px 8px}
  .wrap{padding:16px 12px 32px}
  .card{padding:14px}
  .kpi{padding:16px}
  .chart{height:245px}
  .step .lab{width:62px}
  .mnav .mb{padding:9px 12px}
  .mnav .mb .mtxt{display:none}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
  }
  #view>.grid:first-child .kpi,.grid-item,.card,.tcard,.mcell{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">diamond</span></div>
      <div><b>CMRT Hub</b><span>衝突礦產申報管理</span></div>
    </div>
    <div class="navlbl">申報作業</div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot"><span class="dot"></span>RMI 清單同步：正常 · 08/14</div>

  <div class="main">
    <div class="mnav" id="mnav"></div>

      <div class="tt"><h1 id="scT">—</h1><p id="scS">—</p></div>
      <div class="sp"></div>
      <span class="pill g"><span class="material-symbols-outlined" style="font-size:16px">verified</span>合規率 91%</span>
    </div>
    <div class="wrap"><div id="view"></div></div>
  </div>
</div>
<script>
(function(){
"use strict";

  {icon:"description",name:"CMRT/EMRT 範本",sub:"申報範本版本、欄位與適用料號管理"},

  {icon:"assignment_turned_in",name:"報告彙總提交",sub:"公司級 CMRT 彙總與稽核提交"}
];
var view=document.getElementById("view");
var charts=[];
function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts.push(c);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

/* ---------- SCREEN 0 : CMRT/EMRT 範本 ---------- */
function s0(){
  var cols=[
    {h:"使用中範本",n:3,cards:[
      {t:"CMRT 6.4 (2024)",v:"",m:["3TG 錫鉭鎢金","228 料號適用","更新 07/18"]},
      {t:"EMRT 1.3 擴展礦",v:"v2",m:["鈷 / 雲母","64 料號適用","更新 06/30"]},
      {t:"客戶 A 自訂欄位包",v:"v3",m:["加掛 12 欄位","汽車電子","更新 07/02"]}
    ]},
    {h:"審核中",n:2,cards:[
      {t:"CMRT 6.5 草案",v:"",m:["法規事務部","待欄位對映","建立 08/05"]},
      {t:"EMRT 2.0 導入評估",v:"v2",m:["新增鎳礦","衝擊分析中","建立 08/09"]}
    ]},

/* ---------- helpers ---------- */
function kpi(lb,vl,dt,ic,dir,tail){
  var cls=dir==="up"?"up":(dir==="down"?"down":"");
  var ar=dir==="up"?"trending_up":(dir==="down"?"trending_down":"remove");
  var tailH=tail?'<span style="color:#9ca3af;font-weight:500"> · '+esc(tail)+'</span>':'';
  var dtH=dir?('<span class="material-symbols-outlined" style="font-size:15px">'+ar+'</span>'+esc(dt)):esc(dt);
  return '<div class="kpi"><span class="material-symbols-outlined ic">'+ic+'</span><div class="lb">'+esc(lb)+'</div><div class="vl">'+esc(vl)+'</div><div class="dt '+cls+'">'+dtH+tailH+'</div></div>';
}

var RENDER=[s0,s1,s2,s3,s4,s5];
var AFTER=[c0,c1,c2,c3,c4,c5];

function show(i){
  i=Math.max(0,Math.min(5,i|0));
  disposeCharts();
  document.getElementById("scT").textContent=MODS[i].name;
  document.getElementById("scS").textContent=MODS[i].sub;
  view.innerHTML=RENDER[i]();
  var bs=document.querySelectorAll("[data-i]");
  for(var k=0;k<bs.length;k++){bs[k].classList.toggle("on",+bs[k].getAttribute("data-i")===i);}
  void view.offsetHeight;
  AFTER[i]();
}

/* build nav */
(function(){
  var nav=document.getElementById("nav"),mnav=document.getElementById("mnav"),h="",mh="";
  for(var i=0;i<MODS.length;i++){
    h+='<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span><span class="nx"><b>'+esc(MODS[i].name)+'</b><small>'+esc(MODS[i].sub)+'</small></span></button>';
    mh+='<button class="mb" data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span><span class="mtxt">'+esc(MODS[i].name)+'</span></button>';
  }
  nav.innerHTML=h;mnav.innerHTML=mh;
  var all=document.querySelectorAll("[data-i]");
  for(var j=0;j<all.length;j++){
    all[j].addEventListener("click",function(){show(+this.getAttribute("data-i"));try{window.scrollTo(0,0);}catch(e){}});
  }
})();

show(0);
window.__show=show;
})();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){window.__show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;window.__show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
