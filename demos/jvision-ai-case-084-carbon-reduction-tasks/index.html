<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>減碳任務績效台｜Jvision 系統 Demo</title>
<meta name="description" content="碳盤查、能源監控到減碳目標的永續管理：減碳任務績效、節能效益與成效查證的單一平台。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#0369a1;--accent2:#38bdf8;--ink:#0f2231;--muted:#5b7183;
  --line:#e2ebf1;--bg:#eef4f8;--card:#ffffff;--soft:#f2f8fc;
  --green:#16a34a;--amber:#d97706;--red:#dc2626;--slate:#64748b;
  --shadow:0 6px 22px rgba(3,105,161,.09);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{font-family:"Noto Sans TC","Inter",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;font-variation-settings:'opsz' 24}
/* top nav */
.topbar{position:sticky;top:0;z-index:40;background:linear-gradient(100deg,#075985,#0369a1 55%,#0284c7);color:#fff;box-shadow:0 4px 18px rgba(3,105,161,.28)}
.topbar-in{max-width:1360px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#38bdf8,#0ea5e9);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.22);flex:none}
.brand .logo .material-symbols-outlined{font-size:24px;color:#fff}
.brand h1{font-size:17px;margin:0;font-weight:900;letter-spacing:.3px;white-space:nowrap}
.brand p{margin:1px 0 0;font-size:11.5px;opacity:.82;font-weight:500}
.brand .meta{min-width:0}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px;flex:none}
.top-right .pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.top-right .pill .material-symbols-outlined{font-size:16px}
.avatar{width:34px;height:34px;border-radius:50%;background:#e0f2fe;color:#075985;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex:none}
nav.tabs{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.tabs-in{max-width:1360px;margin:0 auto;padding:8px 14px;display:flex;gap:8px;flex-wrap:wrap}
.tabbtn{flex:none;white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--muted);padding:9px 15px;border-radius:11px;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.16s}
.tabbtn .material-symbols-outlined{font-size:19px}
.tabbtn:hover{border-color:var(--accent2);color:var(--accent)}
.tabbtn.on{background:linear-gradient(120deg,#0369a1,#0ea5e9);color:#fff;border-color:transparent;box-shadow:0 5px 14px rgba(3,105,161,.28)}
main{max-width:1360px;margin:0 auto;padding:20px 18px 46px}
.scr-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.scr-head .ttl{min-width:0}
.scr-head h2{margin:0;font-size:21px;font-weight:900;display:flex;align-items:center;gap:9px}
.scr-head h2 .material-symbols-outlined{color:var(--accent);font-size:26px}
.scr-head p{margin:5px 0 0;font-size:13px;color:var(--muted);font-weight:500}
.scr-head .spacer{margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:5px 11px;border-radius:999px}
.chip .material-symbols-outlined{font-size:15px}
.chip.g{background:#dcfce7;color:#15803d}.chip.a{background:#fef3c7;color:#b45309}.chip.r{background:#fee2e2;color:#b91c1c}.chip.b{background:#e0f2fe;color:#075985}.chip.s{background:#f1f5f9;color:#475569}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0}
.card.pad{padding:16px 18px}
.card h3{margin:0 0 3px;font-size:15px;font-weight:900;display:flex;align-items:center;gap:7px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.card .sub{font-size:11.5px;color:var(--muted);margin:0 0 13px;font-weight:500}
/* grids */
.grid{display:grid;gap:14px;min-width:0}
.g-kpi{grid-template-columns:repeat(4,1fr)}
.g-2{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-2-1{grid-template-columns:2fr 1fr}
.g-1-2{grid-template-columns:1fr 2fr}
@media(max-width:820px){
  .g-kpi,.g-2,.g-3,.g-2-1,.g-1-2{grid-template-columns:1fr}
}
/* kpi card */
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden;min-width:0}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:74px;height:74px;border-radius:50%;background:radial-gradient(circle,rgba(56,189,248,.18),transparent 70%)}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--accent)}
.kpi .val{font-size:27px;font-weight:900;margin:8px 0 2px;font-family:"Inter";letter-spacing:-.5px}
.kpi .val small{font-size:13px;font-weight:800;color:var(--muted);margin-left:3px}
.kpi .dt{font-size:11.5px;font-weight:800;display:flex;align-items:center;gap:3px}
.kpi .dt.up{color:var(--green)}.kpi .dt.dn{color:var(--red)}.kpi .dt .material-symbols-outlined{font-size:15px}
.echart{width:100%;height:280px;min-width:0}
.echart.sm{height:230px}
/* table */
.tbl-wrap{overflow-x:auto}
table.tb{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
table.tb th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:800;padding:10px 12px;border-bottom:2px solid var(--line);white-space:nowrap;background:var(--soft)}
table.tb td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tb tr:last-child td{border-bottom:none}
table.tb tr:hover td{background:var(--soft)}
.mono{font-family:"Inter";font-weight:700}
.bar{height:7px;border-radius:5px;background:#e6eef4;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#0369a1,#38bdf8)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px}
.tag.g{background:#dcfce7;color:#15803d}.tag.a{background:#fef3c7;color:#b45309}.tag.r{background:#fee2e2;color:#b91c1c}.tag.b{background:#e0f2fe;color:#075985}.tag.s{background:#f1f5f9;color:#475569}
/* kanban */
.kb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;min-width:820px}
.kb-col{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:11px;min-width:0}
.kb-col h4{margin:0 0 10px;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:space-between}
.kb-col h4 .material-symbols-outlined{font-size:17px}
.kb-col .cnt{background:#fff;border:1px solid var(--line);border-radius:999px;font-size:11px;padding:1px 9px;color:var(--muted);font-weight:800}
.kb-card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(15,34,49,.05);border-left:4px solid var(--accent)}
.kb-card:last-child{margin-bottom:0}
.kb-card .id{font-size:10.5px;font-family:"Inter";font-weight:800;color:var(--accent)}
.kb-card .t{font-size:13px;font-weight:800;margin:3px 0 7px;line-height:1.4}
.kb-card .m{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:700}
.kb-card .m .who{display:flex;align-items:center;gap:5px}
.kb-card .who .av{width:20px;height:20px;border-radius:50%;background:#e0f2fe;color:#075985;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900}
.kb-card .co2{font-family:"Inter";font-weight:800;color:var(--green)}
/* timeline / milestone */
.mile{position:relative;padding-left:8px}
.mstep{position:relative;padding:0 0 20px 30px;border-left:2px solid var(--line);margin-left:8px}
.mstep:last-child{border-left-color:transparent;padding-bottom:2px}
.mstep .dot{position:absolute;left:-9px;top:0;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--accent2);display:flex;align-items:center;justify-content:center}
.mstep.done .dot{background:var(--green);border-color:var(--green)}
.mstep.now .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px rgba(3,105,161,.16)}
.mstep .dot .material-symbols-outlined{font-size:11px;color:#fff}
.mstep .mh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mstep .mh b{font-size:14px;font-weight:900}
.mstep .mh .dd{font-size:11px;color:var(--muted);font-weight:700;font-family:"Inter"}
.mstep .md{font-size:12px;color:var(--muted);margin:5px 0 8px;font-weight:500}
.prog{height:8px;border-radius:6px;background:#e6eef4;overflow:hidden;max-width:340px}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,#0369a1,#38bdf8)}
.pline{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:800;color:var(--muted);margin-top:4px}
/* project cards */
.pj{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;min-width:0}
@media(max-width:820px){.pj{grid-template-columns:1fr}}
.pjc{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;box-shadow:var(--shadow);min-width:0}
.pjc .ph{display:flex;align-items:flex-start;gap:9px}
.pjc .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.pjc .ic .material-symbols-outlined{font-size:21px}
.pjc h4{margin:0;font-size:14px;font-weight:900;line-height:1.35}
.pjc .pl{font-size:11px;color:var(--muted);font-weight:700;margin-top:2px}
.pjc .st{display:flex;gap:16px;margin:12px 0 6px}
.pjc .st div{min-width:0}
.pjc .st .n{font-size:19px;font-weight:900;font-family:"Inter";letter-spacing:-.5px}
.pjc .st .k{font-size:10.5px;color:var(--muted);font-weight:700}
/* verify checklist */
.vlist{display:flex;flex-direction:column;gap:0}
.vrow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:none}
.vrow .vic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.vrow .vic .material-symbols-outlined{font-size:18px}
.vic.ok{background:#dcfce7;color:#15803d}.vic.wait{background:#fef3c7;color:#b45309}.vic.no{background:#fee2e2;color:#b91c1c}
.vrow .vt{min-width:0;flex:1}
.vrow .vt b{font-size:13.5px;font-weight:800;display:block}
.vrow .vt span{font-size:11.5px;color:var(--muted);font-weight:600}
.vrow .vmeta{text-align:right;flex:none}
.vrow .vmeta .mono{font-size:12px;display:block}
.vrow .vmeta small{font-size:10.5px;color:var(--muted);font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;font-weight:700;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.note{background:var(--soft);border:1px dashed var(--accent2);border-radius:12px;padding:11px 13px;font-size:12px;color:#075985;font-weight:600;display:flex;gap:8px;align-items:flex-start}
.note .material-symbols-outlined{font-size:18px;color:var(--accent);flex:none}
.spark{display:flex;align-items:flex-end;gap:3px;height:34px}
.spark i{flex:1;background:linear-gradient(180deg,#38bdf8,#0369a1);border-radius:2px;min-width:0}
@media(max-width:560px){
  .tabbtn .lbl{display:none}
  .tabbtn{padding:9px 11px}
  .brand p{display:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">eco</span></div>
      <div class="meta">
        <h1>減碳任務績效台</h1>
        <p>Carbon Reduction Task Performance Board</p>
      </div>
    </div>
    <div class="top-right">
      <span class="pill"><span class="material-symbols-outlined">calendar_today</span>2026 Q3</span>
      <span class="pill"><span class="material-symbols-outlined">factory</span>4 廠區</span>
      <div class="avatar">永</div>
    </div>
  </div>
</header>
<nav class="tabs">
  <div class="tabs-in" id="tabs"></div>
</nav>
<main><div id="screen"></div></main>

<script>
"use strict";
var CHARTS=[];
function disposeCharts(){for(var i=0;i<CHARTS.length;i++){try{CHARTS[i].dispose();}catch(e){}}CHARTS=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);CHARTS.push(c);}
function esc(s){return String(s==null?"":s);}
var AX={grid:{left:6,right:14,top:24,bottom:6,containLabel:true},textStyle:{fontFamily:"Inter,Noto Sans TC"}};

var MODS=[
 {icon:"leaderboard",name:"績效總覽",full:"減碳績效總覽"},
 {icon:"assignment",name:"任務看板",full:"減碳任務看板"},
 {icon:"track_changes",name:"目標里程碑",full:"目標與里程碑"},
 {icon:"savings",name:"效益核算",full:"節能效益核算"},
 {icon:"eco",name:"專案庫",full:"減碳專案庫"},
 {icon:"verified",name:"查證揭露",full:"成效查證揭露"}
];

/* ---------- shared builders ---------- */
function head(icon,title,desc,chips){
  var c=(chips||[]).map(function(x){return '<span class="chip '+x.k+'"><span class="material-symbols-outlined">'+x.i+'</span>'+x.t+'</span>';}).join("");
  return '<div class="scr-head"><div class="ttl"><h2><span class="material-symbols-outlined">'+icon+'</span>'+title+'</h2><p>'+desc+'</p></div><div class="spacer"></div>'+c+'</div>';
}
function kpi(o){
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+o.icon+'</span>'+o.lab+'</div>'+
    '<div class="val">'+o.val+(o.unit?'<small>'+o.unit+'</small>':'')+'</div>'+
    '<div class="dt '+(o.dir)+'"><span class="material-symbols-outlined">'+(o.dir==='up'?'trending_up':'trending_down')+'</span>'+o.delta+'</div></div>';
}

/* ================= v0 績效總覽 ================= */
function v0(){
  var kpis=[
    {icon:"co2",lab:"年度累計減碳量",val:"3,842",unit:"tCO₂e",dir:"up",delta:"達標 83% ・ +6.2% MoM"},
    {icon:"bolt",lab:"累計節電量",val:"5.16",unit:"GWh",dir:"up",delta:"+412 MWh vs 上季"},
    {icon:"payments",lab:"節能效益",val:"1,872",unit:"萬元",dir:"up",delta:"+9.1% YoY"},
    {icon:"task_alt",lab:"任務達成率",val:"78",unit:"%",dir:"up",delta:"48/62 任務完成"}
  ];
  var h=head("leaderboard","減碳績效總覽","2026 年度整體減碳成效、目標達成與趨勢",[{k:"g",i:"trending_up",t:"達成率 83%"},{k:"b",i:"verified",t:"已查證 41 項"}]);
  h+='<div class="grid g-kpi" style="margin-bottom:14px">'+kpis.map(kpi).join("")+'</div>';
  h+='<div class="grid g-2-1" style="margin-bottom:14px">'+
       '<div class="card pad"><h3><span class="material-symbols-outlined">show_chart</span>月減碳量 vs 目標</h3><p class="sub">實際減碳量與月度目標基準比較（tCO₂e）</p><div id="c0a" class="echart"></div></div>'+
       '<div class="card pad"><h3><span class="material-symbols-outlined">speed</span>年度目標達成度</h3><p class="sub">距 4,600 tCO₂e 目標</p><div id="c0b" class="echart"></div></div>'+
     '</div>';
  h+='<div class="grid g-2">'+
       '<div class="card pad"><h3><span class="material-symbols-outlined">donut_large</span>減碳來源占比</h3><p class="sub">各類減碳措施貢獻度</p><div id="c0c" class="echart sm"></div></div>'+
       '<div class="card pad"><h3><span class="material-symbols-outlined">apartment</span>各廠區減碳量</h3><p class="sub">四廠區本年度累計（tCO₂e）</p><div id="c0d" class="echart sm"></div></div>'+
     '</div>';
  return h;
}
function v0charts(){
  var months=["1月","2月","3月","4月","5月","6月","7月","8月","9月"];
  mk("c0a",{tooltip:{trigger:"axis"},legend:{data:["實際減碳","目標基準"],top:0,textStyle:{fontFamily:"Noto Sans TC"}},grid:AX.grid,
    xAxis:{type:"category",data:months,axisLabel:{color:"#5b7183"}},yAxis:{type:"value",splitLine:{lineStyle:{color:"#eef4f8"}},axisLabel:{color:"#5b7183"}},
    series:[
      {name:"實際減碳",type:"bar",data:[318,352,401,388,447,462,489,501,484],itemStyle:{color:"#0369a1",borderRadius:[5,5,0,0]},barWidth:"46%"},
      {name:"目標基準",type:"line",data:[360,370,380,390,420,440,460,470,470],smooth:true,lineStyle:{color:"#38bdf8",width:3,type:"dashed"},itemStyle:{color:"#38bdf8"},symbolSize:6}
    ]});
  mk("c0b",{series:[{type:"gauge",startAngle:210,endAngle:-30,min:0,max:100,progress:{show:true,width:16,itemStyle:{color:"#0369a1"}},
    axisLine:{lineStyle:{width:16,color:[[1,"#e0f2fe"]]}},axisTick:{show:false},splitLine:{length:12,lineStyle:{color:"#cbd5e1"}},
    axisLabel:{color:"#94a3b8",fontSize:10,distance:14},pointer:{width:5,itemStyle:{color:"#0ea5e9"}},
    anchor:{show:true,size:12,itemStyle:{color:"#0369a1"}},
    detail:{valueAnimation:false,fontSize:30,fontFamily:"Inter",fontWeight:900,color:"#0369a1",offsetCenter:[0,"38%"],formatter:"{value}%"},
    title:{offsetCenter:[0,"66%"],fontSize:11,color:"#5b7183"},
    data:[{value:83,name:"目標達成率"}]}]});
  mk("c0c",{tooltip:{trigger:"item",formatter:"{b}: {c} tCO₂e ({d}%)"},legend:{bottom:0,textStyle:{fontFamily:"Noto Sans TC",fontSize:11}},
    series:[{type:"pie",radius:["42%","70%"],center:["50%","44%"],avoidLabelOverlap:true,itemStyle:{borderColor:"#fff",borderWidth:2},
      label:{show:false},data:[
      {value:1420,name:"製程能效優化",itemStyle:{color:"#0369a1"}},
      {value:986,name:"再生能源採購",itemStyle:{color:"#0ea5e9"}},
      {value:742,name:"空調/照明改善",itemStyle:{color:"#38bdf8"}},
      {value:468,name:"物流路線優化",itemStyle:{color:"#7dd3fc"}},
      {value:226,name:"廢熱回收",itemStyle:{color:"#bae6fd"}}
    ]}]});
  mk("c0d",{tooltip:{trigger:"axis",axisPointer:{type:"shadow"}},grid:AX.grid,
    yAxis:{type:"category",data:["永康廠","仁德廠","善化廠","路竹廠"],axisLabel:{color:"#5b7183"}},
    xAxis:{type:"value",splitLine:{lineStyle:{color:"#eef4f8"}},axisLabel:{color:"#5b7183"}},
    series:[{type:"bar",data:[1284,1042,876,640],barWidth:"52%",itemStyle:{borderRadius:[0,6,6,0],
      color:new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:"#0369a1"},{offset:1,color:"#38bdf8"}])},
      label:{show:true,position:"right",color:"#0f2231",fontFamily:"Inter",fontWeight:700}}]});
}

/* ================= v1 任務看板 ================= */
function v1(){

      '<div class="card pad"><h3><span class="material-symbols-outlined">radar</span>揭露完整度雷達</h3><p class="sub">GRI/ISO 各構面就緒度</p><div id="c5a" class="echart"></div></div>'+
     '</div>';
  h+='<div class="note"><span class="material-symbols-outlined">verified_user</span><span>查證揭露為減碳績效台終點：所有成效需可追溯至原始憑證與計算來源，方可對外揭露為官方減碳績效。</span></div>';
  return h;
}
function v5charts(){
  mk("c5a",{tooltip:{},radar:{indicator:[
      {name:"活動數據",max:100},{name:"排放係數",max:100},{name:"原始憑證",max:100},
      {name:"計算方法",max:100},{name:"第三方查證",max:100},{name:"文件揭露",max:100}
    ],radius:"66%",splitLine:{lineStyle:{color:"#e2ebf1"}},splitArea:{areaStyle:{color:["#f7fbfe","#eef6fb"]}},axisLine:{lineStyle:{color:"#cbd5e1"}},name:{color:"#5b7183",fontSize:11}},
    series:[{type:"radar",data:[
      {value:[94,98,82,90,76,88],name:"目前就緒度",areaStyle:{color:"rgba(3,105,161,.22)"},lineStyle:{color:"#0369a1",width:2},itemStyle:{color:"#0369a1"}},
      {value:[100,100,95,95,95,95],name:"申報門檻",lineStyle:{color:"#38bdf8",width:2,type:"dashed"},itemStyle:{color:"#38bdf8"},areaStyle:{color:"rgba(56,189,248,.06)"}}
    ]}]});
}

/* ---------- render ---------- */
var RENDER=[v0,v1,v2,v3,v4,v5];
var CHARTFN=[v0charts,v1charts,v2charts,v3charts,v4charts,v5charts];
var cur=-1;
function show(i){
  i=Math.max(0,Math.min(i,RENDER.length-1));
  disposeCharts();
  cur=i;
  var tabs=document.querySelectorAll("[data-i]");
  for(var t=0;t<tabs.length;t++){tabs[t].classList.toggle("on",+tabs[t].getAttribute("data-i")===i);}
  var container=document.getElementById("screen");
  container.innerHTML=RENDER[i]();
  void container.offsetHeight;
  CHARTFN[i]();
}
(function initTabs(){
  var wrap=document.getElementById("tabs");
  wrap.innerHTML=MODS.map(function(m,i){
    return '<button class="tabbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="lbl">'+m.name+'</span></button>';
  }).join("");
  var bs=wrap.querySelectorAll("[data-i]");
  for(var i=0;i<bs.length;i++){(function(b){b.addEventListener("click",function(){show(+b.getAttribute("data-i"));try{window.scrollTo(0,0);}catch(e){}});})(bs[i]);}
})();
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m)return;var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
</body>
