<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>可靠度測試管理 Reliability Test Management</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#0f766e; --accent2:#5eead4; --accent-soft:#e6fffb;
  --bg:#f1f5f4; --panel:#ffffff; --ink:#0f2b28; --muted:#6b8480;
  --line:#dce7e5; --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#0891b2;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.app{display:flex; min-height:100vh; align-items:stretch;}
.sidebar{
  width:248px; flex:none; background:linear-gradient(180deg,#ffffff,#f7fbfa);
  border-right:1px solid var(--line); padding:20px 14px; display:flex; flex-direction:column; gap:6px;
}
.brand{display:flex; align-items:center; gap:11px; padding:6px 8px 16px;}
.brand .logo{
  width:42px; height:42px; border-radius:12px; flex:none;
  background:linear-gradient(135deg,var(--accent),#14b8a6); color:#fff;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 6px 16px rgba(15,118,110,.32);
}
.brand .logo .material-symbols-outlined{font-size:24px;}
.brand h1{font-size:15px; margin:0; font-weight:800; letter-spacing:.2px;}
.brand p{font-size:11px; margin:2px 0 0; color:var(--muted); font-weight:500;}
.nav{display:flex; flex-direction:column; gap:4px;}
.nav button{
  display:flex; align-items:center; gap:11px; width:100%;
  border:1px solid transparent; background:transparent; cursor:pointer;
  padding:10px 12px; border-radius:11px; text-align:left;
  color:var(--muted); font-family:inherit; font-size:13.5px; font-weight:600;
  transition:all .15s; min-width:0;
}
.nav button .material-symbols-outlined{font-size:21px; flex:none;}
.nav button .nx{display:flex; flex-direction:column; min-width:0;}
.nav button .nx small{font-size:10.5px; font-weight:500; color:#9fb3af; line-height:1.2;}
.nav button:hover{background:var(--accent-soft); color:var(--accent);}
.nav button.on{background:linear-gradient(135deg,var(--accent),#14b8a6); color:#fff; box-shadow:0 5px 14px rgba(15,118,110,.28);}
.nav button.on small{color:rgba(255,255,255,.8);}
.sidebar .foot{margin-top:auto; padding:12px 8px 0; border-top:1px solid var(--line); font-size:11px; color:var(--muted);}
.sidebar .foot b{color:var(--accent);}
.main{flex:1 1 auto; min-width:0; padding:24px 28px 40px; max-width:100%;}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px;}
.topbar .htxt h2{margin:0; font-size:20px; font-weight:800;}
.topbar .htxt p{margin:3px 0 0; font-size:12.5px; color:var(--muted);}
.pill{display:inline-flex; align-items:center; gap:6px; background:var(--accent-soft); color:var(--accent); border-radius:999px; padding:6px 13px; font-size:12px; font-weight:700;}
.pill .material-symbols-outlined{font-size:16px;}
.grid{display:grid; gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:1.6fr 1fr;}
@media(max-width:820px){.g4,.g3,.g2,.g23{grid-template-columns:1fr;}}
.card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; min-width:0;}
.card.pad0{padding:0; overflow:hidden;}
.card h3{margin:0 0 4px; font-size:14.5px; font-weight:800;}
.card .sub{font-size:11.5px; color:var(--muted); margin:0 0 14px;}
.kpi{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px 17px; min-width:0; position:relative; overflow:hidden;}
.kpi .kl{font-size:12px; color:var(--muted); font-weight:600; display:flex; align-items:center; gap:6px;}
.kpi .kl .material-symbols-outlined{font-size:17px; color:var(--accent);}
.kpi .kv{font-size:27px; font-weight:800; margin-top:8px; letter-spacing:-.5px;}
.kpi .kv small{font-size:13px; font-weight:600; color:var(--muted);}
.kpi .kd{font-size:11.5px; margin-top:4px; font-weight:600;}
.kpi .kd.up{color:var(--ok);} .kpi .kd.down{color:var(--bad);} .kpi .kd.flat{color:var(--muted);}
.kpi::after{content:""; position:absolute; right:-24px; top:-24px; width:70px; height:70px; border-radius:50%; background:var(--accent-soft); opacity:.7;}
.chart{width:100%; height:260px;}
.chart.sm{height:210px;}
.chart.lg{height:300px;}
table{width:100%; border-collapse:collapse; font-size:12.5px;}
th,td{padding:10px 12px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap;}
th{font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); font-weight:700; background:#fafcfb;}
tbody tr:hover{background:#f6fbfa;}
td.num{font-variant-numeric:tabular-nums; font-weight:600;}
.tag{display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700; white-space:nowrap;}
.tag .material-symbols-outlined{font-size:14px;}
.t-ok{background:#dcfce7; color:#15803d;} .t-run{background:#dbeafe; color:#1d4ed8;}
.t-warn{background:#fef3c7; color:#b45309;} .t-bad{background:#fee2e2; color:#b91c1c;}
.t-idle{background:#eef2f1; color:#64748b;} .t-teal{background:var(--accent-soft); color:var(--accent);}
.bar{height:7px; border-radius:99px; background:#eef2f1; overflow:hidden; min-width:60px;}
.bar > i{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--accent),var(--accent2));}
.scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
.board{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media(max-width:820px){.board{grid-template-columns:1fr;}}
.col{background:#f7faf9; border:1px solid var(--line); border-radius:14px; padding:12px; min-width:0;}
.col h4{margin:0 0 10px; font-size:12.5px; font-weight:800; display:flex; align-items:center; justify-content:space-between;}
.col h4 span{background:#fff; border:1px solid var(--line); border-radius:99px; padding:1px 9px; font-size:11px; color:var(--muted);}
.tk{background:#fff; border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:10px; padding:10px 11px; margin-bottom:9px;}
.tk .tt{font-size:12.5px; font-weight:700;}
.tk .tm{font-size:11px; color:var(--muted); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.tk .tm b{color:var(--ink); font-weight:700;}
.tl{position:relative; padding-left:22px;}
.tl::before{content:""; position:absolute; left:7px; top:6px; bottom:6px; width:2px; background:var(--line);}
.tl .ev{position:relative; padding:0 0 16px 8px;}
.tl .ev::before{content:""; position:absolute; left:-19px; top:4px; width:11px; height:11px; border-radius:50%; background:#fff; border:3px solid var(--accent);}
.tl .ev.warn::before{border-color:var(--warn);} .tl .ev.bad::before{border-color:var(--bad);}
.tl .ev .et{font-size:12.5px; font-weight:700;}
.tl .ev .em{font-size:11px; color:var(--muted); margin-top:2px;}
.tl .ev .ed{font-size:11px; color:var(--accent); font-weight:700;}
.envrow{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
@media(max-width:820px){.envrow{grid-template-columns:1fr;}}
.env{background:linear-gradient(135deg,#0f766e,#134e4a); color:#fff; border-radius:16px; padding:16px; min-width:0; position:relative; overflow:hidden;}
.env .el{font-size:12px; opacity:.85; font-weight:600; display:flex; align-items:center; gap:6px;}
.env .ev{font-size:30px; font-weight:800; margin:6px 0 2px; letter-spacing:-.5px;}
.env .er{font-size:11px; opacity:.8;}
.env .ec{position:absolute; right:12px; top:12px; font-size:11px; background:rgba(255,255,255,.15); border-radius:99px; padding:3px 9px; font-weight:700;}
.note{font-size:11.5px; color:var(--muted); background:#f7faf9; border:1px dashed var(--line); border-radius:10px; padding:10px 12px; margin-top:12px;}
.note b{color:var(--accent);}
.inline{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.pc{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
@media(max-width:820px){.pc{grid-template-columns:repeat(2,1fr);}}
.pcell{background:#f7faf9; border:1px solid var(--line); border-radius:12px; padding:12px;}
.pcell .pk{font-size:11px; color:var(--muted); font-weight:600;}
.pcell .pv{font-size:20px; font-weight:800; margin-top:4px;}
.pcell .pv small{font-size:11px; color:var(--muted); font-weight:600;}
@media(max-width:860px){
  .app{flex-direction:column;}
  .sidebar{width:100%; flex-direction:row; flex-wrap:wrap; align-items:center; padding:12px; gap:8px; border-right:none; border-bottom:1px solid var(--line);}
  .brand{padding:0 8px 0 4px; flex:none;}
  .sidebar .foot{display:none;}
  .nav{flex-direction:row; flex-wrap:wrap; flex:1 1 auto;}
  .nav button{width:auto; flex:none; white-space:nowrap;}
  .nav button .nx small{display:none;}
  .main{padding:18px 16px 34px;}
}
@media(max-width:560px){
  .nav button .nx{display:none;}
  .nav button{padding:9px 11px;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">verified</span></div>
      <div>
        <h1>可靠度測試管理</h1>
        <p>Reliability Test Mgmt</p>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">可靠度工程部 · <b>RTM v2.6</b><br/>同步 QMS / FMEA / FA 系統</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="htxt">
        <h2 id="ttl">—</h2>
        <p id="sub">—</p>
      </div>
      <div class="pill"><span class="material-symbols-outlined">bolt</span><span id="cnt">—</span></div>
    </div>
    <div id="view"></div>
  </main>
</div>
<script>
(function(){
"use strict";
var MODS=[
  {icon:"event_note",name:"測試計畫排程",sub:"計畫制定與試箱排程"},
  {icon:"science",name:"樣品與試箱管理",sub:"樣品準備與資源狀態"},
  {icon:"thermostat",name:"測試條件監控",sub:"溫濕度/振動/EMI"},
  {icon:"error",name:"失效數據登錄",sub:"失效模式與存活追蹤"},
  {icon:"analytics",name:"可靠度分析",sub:"Weibull / MTTF"},
  {icon:"summarize",name:"測試報告產出",sub:"達成率與審核簽核"}
];
var SUBT=[
  "可靠度測試計畫甘特排程與試箱資源配置",
  "受測樣品批號、治具與試箱可用狀態看板",
  "環境測試條件即時監控與逐時量測趨勢",
  "失效模式登錄、樣本存活曲線與帕累托分析",
  "Weibull 壽命分佈、浴缸曲線與 MTTF 目標判定",
  "測試報告進度、計畫達成率與簽核追蹤"
];
var CNT=["8 項進行中","24 個樣品","3 試箱線上","41 筆失效","6 份分析","12 份報告"];

function disposeAll(){
  try{
    var els=document.querySelectorAll(".chart");
    for(var i=0;i<els.length;i++){var ins=echarts.getInstanceByDom(els[i]); if(ins){ins.dispose();}}
  }catch(e){}
}
function mk(id,opt){
  var el=document.getElementById(id); if(!el){return;}
  var c=echarts.init(el); c.setOption(opt);
}
var TEAL="#0f766e", TEAL2="#5eead4", AMBER="#d97706", RED="#dc2626", BLUE="#0891b2", GREY="#94a3b8";
var axBase={axisLine:{lineStyle:{color:"#cbd8d5"}},axisLabel:{color:"#6b8480",fontSize:11},splitLine:{lineStyle:{color:"#eef2f1"}}};

function tag(cls,ic,txt){return '<span class="tag '+cls+'"><span class="material-symbols-outlined">'+ic+'</span>'+txt+'</span>';}
function kpi(ic,l,v,u,d,dir){
  return '<div class="kpi"><div class="kl"><span class="material-symbols-outlined">'+ic+'</span>'+l+'</div>'+
    '<div class="kv">'+v+' <small>'+(u||"")+'</small></div>'+
    '<div class="kd '+dir+'"><span class="material-symbols-outlined" style="font-size:14px;vertical-align:-2px">'+(dir==="up"?"trending_up":dir==="down"?"trending_down":"trending_flat")+'</span> '+d+'</div></div>';
}
function pcell(k,v,u,d){return '<div class="pcell"><div class="pk">'+k+'</div><div class="pv">'+v+' <small>'+(u||"")+'</small></div><div class="pk" style="margin-top:3px">'+d+'</div></div>';}

/* ---------- SCREEN 0 : 測試計畫排程 (gantt signature) ---------- */
function s0(){
  var plans=[
    {id:"RTP-2408-01",p:"車用電源模組 PSU-A",std:"IEC 60068-2-1 低溫",eng:"林承翰",prog:82,st:["run","進行中"],due:"08/22"},
    {id:"RTP-2408-02",p:"感測器 SNR-7 溫循",std:"JESD22-A104 溫循",eng:"陳姿羽",prog:100,st:["ok","已完成"],due:"08/12"},
    {id:"RTP-2408-03",p:"連接器 CN-9 振動",std:"IEC 60068-2-6 振動",eng:"黃柏勳",prog:45,st:["run","進行中"],due:"08/28"},
    {id:"RTP-2408-04",p:"控制板 MCU-3 EMI",std:"CISPR 32 輻射",eng:"吳念真",prog:12,st:["warn","待進場"],due:"09/03"},
    {id:"RTP-2408-05",p:"電池模組 BAT-2 HALT",std:"HALT 極限",eng:"林承翰",prog:0,st:["idle","已排程"],due:"09/10"}
  ];
  var rows=plans.map(function(x){
    return '<tr><td class="num">'+x.id+'</td><td><b>'+x.p+'</b></td><td>'+x.std+'</td><td>'+x.eng+'</td>'+
      '<td style="min-width:120px"><div class="inline"><div class="bar" style="flex:1"><i style="width:'+x.prog+'%"></i></div><span class="num" style="font-size:11px">'+x.prog+'%</span></div></td>'+
      '<td>'+tag("t-"+x.st[0],x.st[0]==="ok"?"check_circle":x.st[0]==="run"?"play_circle":x.st[0]==="warn"?"schedule":"radio_button_unchecked",x.st[1])+'</td>'+
      '<td class="num">'+x.due+'</td></tr>';
  }).join("");
  return ''+
  '<div class="grid g4" style="margin-bottom:16px">'+
    kpi("assignment","本月測試計畫","18","件","+3 vs 上月","up")+
    kpi("event_available","計畫達成率","94.2","%","目標 90%","up")+
    kpi("pending_actions","逾期風險","2","件","需關注排程","down")+
    kpi("schedule","平均週期","11.4","天","-1.6 天","up")+
  '</div>'+
  '<div class="grid g23" style="margin-bottom:16px">'+
    '<div class="card pad0"><div style="padding:18px 18px 0"><h3>測試計畫甘特排程</h3><p class="sub">試箱資源時程配置（8月）</p></div><div class="scroll"><div id="c0g" class="chart lg" style="min-width:560px;padding:0 8px 8px"></div></div></div>'+
    '<div class="card"><h3>試箱線負載</h3><p class="sub">各測試設備綜合稼動率</p><div id="c0b" class="chart lg"></div></div>'+
  '</div>'+
  '<div class="card pad0"><div style="padding:18px 18px 0"><h3>進行中測試計畫</h3></div><div class="scroll"><table><thead><tr><th>計畫編號</th><th>受測產品</th><th>測試標準</th><th>負責工程師</th><th>進度</th><th>狀態</th><th>期限</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}
function s0charts(){
  var cats=["高低溫箱","溫濕循環箱","振動台","EMI 暗室","HALT 箱"];
  var data=[
    {s:2,e:9,c:TEAL,plan:"PSU-A 低溫"},
    {s:1,e:6,c:BLUE,plan:"SNR-7 溫循"},
    {s:5,e:13,c:AMBER,plan:"CN-9 振動"},
    {s:9,e:15,c:"#7c3aed",plan:"MCU-3 EMI"},
    {s:12,e:18,c:RED,plan:"BAT-2 HALT"}
  ];
  var base=data.map(function(d){return d.s;});
  mk("c0g",{
    grid:{left:78,right:24,top:16,bottom:40},
    tooltip:{formatter:function(p){return data[p.dataIndex].plan+"<br/>第 "+data[p.dataIndex].s+"–"+data[p.dataIndex].e+" 天";}},
    xAxis:Object.assign({type:"value",max:20,name:"排程天(第X天)",nameGap:24,nameLocation:"middle",nameTextStyle:{color:"#6b8480"}},axBase),
    yAxis:Object.assign({type:"category",data:cats,inverse:true},axBase),
    series:[
      {type:"bar",stack:"g",itemStyle:{color:"transparent"},data:base,silent:true},
      {type:"bar",stack:"g",barWidth:18,data:data.map(function(d){return {value:d.e-d.s,itemStyle:{color:d.c,borderRadius:5}};}),label:{show:true,position:"insideLeft",color:"#fff",fontSize:10,formatter:function(p){return data[p.dataIndex].plan;}}}
    ]
  });
  mk("c0b",{
    tooltip:{trigger:"item"},
    series:[{type:"gauge",radius:"90%",startAngle:210,endAngle:-30,min:0,max:100,progress:{show:true,width:14,itemStyle:{color:TEAL}},axisLine:{lineStyle:{width:14,color:[[1,"#eef2f1"]]}},axisTick:{show:false},splitLine:{length:12,lineStyle:{color:"#cbd8d5"}},axisLabel:{color:"#6b8480",fontSize:9,distance:14},pointer:{itemStyle:{color:TEAL}},detail:{valueAnimation:false,formatter:"{value}%",color:TEAL,fontSize:26,offsetCenter:[0,"58%"]},title:{offsetCenter:[0,"82%"],fontSize:12,color:"#6b8480"},data:[{value:78,name:"綜合稼動率"}]}]
  });
}

/* ---------- SCREEN 1 : 樣品與試箱管理 (board signature) ---------- */
function s1(){
  var cols=[
    {t:"待準備",n:2,items:[
      {tt:"BAT-2 電池模組",m:["批號 L2408A","x24 pcs","林承翰"]},
      {tt:"MCU-3 控制板",m:["批號 L2408B","x12 pcs","吳念真"]}
    ]},
    {t:"樣品備妥",n:2,items:[
      {tt:"CN-9 連接器",m:["批號 L2407C","x30 pcs","治具就緒"]},
      {tt:"PSU-A 電源",m:["批號 L2408D","x16 pcs","治具就緒"]}
    ]},
    {t:"試箱進行中",n:2,items:[
      {tt:"SNR-7 感測器",m:["溫濕循環箱","第 3/5 循環","陳姿羽"]},
      {tt:"PSU-A 電源",m:["高低溫箱","−40°C 保持","林承翰"]}
    ]},
    {t:"測試完成",n:2,items:[
      {tt:"RES-4 電阻件",m:["批號 L2406E","通過","已釋出"]},
      {tt:"CAP-1 電容件",m:["批號 L2406F","2 失效","待分析"]}
    ]}
  ];
  var board=cols.map(function(c){
    return '<div class="col"><h4>'+c.t+'<span>'+c.n+'</span></h4>'+c.items.map(function(it){
      return '<div class="tk"><div class="tt">'+it.tt+'</div><div class="tm">'+it.m.map(function(m){return '<b>'+m+'</b>';}).join('<span>·</span>')+'</div></div>';
    }).join("")+'</div>';
  }).join("");
  var boxes=[
    {n:"高低溫箱 TH-01",st:["run","運轉中"],load:"−40°C",util:88},
    {n:"溫濕循環箱 TH-02",st:["run","運轉中"],load:"85°C/85%",util:76},
    {n:"振動台 VB-01",st:["idle","閒置"],load:"待機",util:0},
    {n:"EMI 暗室 EM-01",st:["warn","校正中"],load:"維護",util:12},
    {n:"HALT 箱 HL-01",st:["ok","可用"],load:"就緒",util:0}

var RENDER=[s0,s1,s2,s3,s4,s5];
var AFTER=[s0charts,s1charts,s2charts,s3charts,s4charts,s5charts];

function buildNav(){
  var nav=document.getElementById("nav");
  nav.innerHTML=MODS.map(function(m,i){
    return '<button data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="nx">'+m.name+'<small>'+m.sub+'</small></span></button>';
  }).join("");
  var btns=nav.querySelectorAll("[data-i]");
  for(var i=0;i<btns.length;i++){
    btns[i].addEventListener("click",function(){show(+this.getAttribute("data-i"));});
  }
}
function show(idx){
  var i=Math.max(0,Math.min(idx,RENDER.length-1));
  disposeAll();
  var view=document.getElementById("view");
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",(+btns[b].getAttribute("data-i"))===i);}
  document.getElementById("ttl").textContent=MODS[i].name;
  document.getElementById("sub").textContent=SUBT[i];
  document.getElementById("cnt").textContent=CNT[i];
  view.innerHTML=RENDER[i]();
  void view.offsetHeight;
  AFTER[i]();
}
buildNav();

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);
show(0);
fromHash();
})();
