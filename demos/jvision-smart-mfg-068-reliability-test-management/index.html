<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>可靠度測試管理 Reliability Test Management</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#ffffff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000000;
  --color-accent:#ea580c;
  --color-on-accent:#000000;
  --color-background:#f8fafc;
  --color-foreground:#1e293b;
  --color-card:#ffffff;
  --color-card-foreground:#1e293b;
  --color-muted:#e9eff8;
  --color-muted-foreground:#475569;
  --color-border:#e2e8f0;
  --color-destructive:#dc2626;
  --color-on-destructive:#ffffff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#1e293b;
  --muted:#475569;
  --line:#e2e8f0;
  --accent:#2563eb;
  --accent2:#60a5fa;
  --accent-soft:#eff6ff;
  --bg:#f8fafc;
  --panel:#ffffff;
  --ok:#15803d;
  --warn:#b45309;
  --bad:#dc2626;
  --info:#0369a1;
  --mono:"Fira Code",ui-monospace,SFMono-Regular,Consolas,monospace;
  --sans:"Fira Sans","Noto Sans TC",system-ui,sans-serif;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.05);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
html,body{margin:0;padding:0;min-height:100%;}
body{
  font-family:var(--sans);
  background:var(--color-background);
  color:var(--color-foreground);
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit;}
button,a,[role="button"]{cursor:pointer;}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px;}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
  font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;
}
.app{display:flex;min-height:100vh;align-items:stretch;}
.sidebar{
  position:sticky;
  top:0;
  width:264px;
  height:100vh;
  flex:none;
  z-index:20;
  background:#fff;
  border-right:1px solid var(--color-border);
  padding:24px 16px 20px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 18px;border-bottom:1px solid var(--color-border);}
.brand .logo{
  width:42px;
  height:42px;
  border-radius:8px;
  flex:none;
  background:var(--color-primary);
  color:var(--color-on-primary);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:4px 4px 0 #bfdbfe;
}
.brand .logo .material-symbols-outlined{font-size:23px;}
.brand h1{font-size:15px;line-height:1.3;margin:0;font-weight:700;letter-spacing:.02em;}
.brand p{font-family:var(--mono);font-size:10px;line-height:1.4;margin:4px 0 0;color:var(--color-muted-foreground);}
.nav{display:flex;flex-direction:column;gap:5px;}
.nav button{
  position:relative;
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  min-height:48px;
  min-width:0;
  padding:9px 11px;
  border:1px solid transparent;
  border-radius:7px;
  background:transparent;
  color:var(--color-muted-foreground);
  text-align:left;
  font-size:13px;
  font-weight:600;
  transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s ease;
}
.nav button .material-symbols-outlined{font-size:20px;flex:none;}
.nav button .nx{display:flex;flex-direction:column;min-width:0;}
.nav button .nx small{font-size:10px;font-weight:400;color:#64748b;line-height:1.35;margin-top:2px;}
.nav button:hover{background:var(--color-muted);border-color:#dbe7f7;color:#1d4ed8;transform:translateX(2px);}
.nav button.on{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-on-primary);}
.nav button.on::before{content:"";position:absolute;left:-17px;top:10px;bottom:10px;width:3px;background:var(--color-accent);}
.nav button.on small{color:#dbeafe;}
.sidebar .foot{margin-top:auto;padding:16px 8px 0;border-top:1px solid var(--color-border);font-size:11px;color:var(--color-muted-foreground);}
.sidebar .foot b{font-family:var(--mono);color:#1d4ed8;}
.main{flex:1 1 auto;min-width:0;max-width:1600px;margin:0 auto;padding:28px 32px 48px;}
.topbar{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  flex-wrap:wrap;
  margin-bottom:22px;
  padding-bottom:18px;
  border-bottom:1px solid var(--color-border);
}
.topbar .htxt h2{margin:0;font-size:clamp(21px,2vw,28px);line-height:1.2;font-weight:700;letter-spacing:-.025em;}
.topbar .htxt p{margin:7px 0 0;font-size:12.5px;color:var(--color-muted-foreground);}
.pill{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:36px;
  background:#fff7ed;
  color:#9a3412;
  border:1px solid #fed7aa;
  border-radius:6px;
  padding:7px 12px;
  font-size:12px;
  font-weight:700;
  font-family:var(--mono);
}
.pill .material-symbols-outlined{font-size:17px;}
.grid{display:grid;gap:16px;}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g23{grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);}
.card,.kpi{
  min-width:0;
  background:var(--color-card);
  color:var(--color-card-foreground);
  border:1px solid var(--color-border);
  border-radius:9px;
  box-shadow:var(--shadow);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.card:hover,.kpi:hover{border-color:#bfdbfe;box-shadow:0 2px 4px rgba(15,23,42,.05),0 12px 30px rgba(37,99,235,.07);}
.card{padding:19px;}
.card.pad0{padding:0;overflow:hidden;}
.card h3{margin:0 0 5px;font-size:14px;line-height:1.35;font-weight:700;letter-spacing:.01em;}
.card h3::before{content:"";display:inline-block;width:3px;height:13px;margin-right:8px;background:var(--color-primary);vertical-align:-1px;}
.card .sub{font-size:11.5px;color:var(--color-muted-foreground);margin:0 0 15px;}
.kpi{position:relative;overflow:hidden;padding:17px 18px;border-top:3px solid var(--color-primary);}
.kpi::after{content:"";position:absolute;right:0;top:0;width:38px;height:38px;background:linear-gradient(135deg,transparent 50%,#dbeafe 50%);}
.kpi .kl{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--color-muted-foreground);font-weight:600;}
.kpi .kl .material-symbols-outlined{font-size:18px;color:var(--color-primary);}
.kpi .kv{margin-top:9px;font-family:var(--mono);font-size:27px;line-height:1.15;font-weight:700;letter-spacing:-.045em;font-variant-numeric:tabular-nums;}
.kpi .kv small{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--color-muted-foreground);letter-spacing:0;}
.kpi .kd{display:flex;align-items:center;gap:3px;margin-top:6px;font-size:11px;font-weight:600;}
.kpi .kd.up{color:#166534;}
.kpi .kd.down{color:#b91c1c;}
.kpi .kd.flat{color:var(--color-muted-foreground);}
.chart{width:100%;height:260px;}
.chart.sm{height:210px;}
.chart.lg{height:300px;}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-color:#94a3b8 #f1f5f9;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th,td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--color-border);white-space:nowrap;}
th{background:#f1f5f9;color:#334155;font-size:10.5px;font-weight:700;letter-spacing:.055em;text-transform:uppercase;}
tbody tr{transition:background-color .18s ease;}
tbody tr:hover{background:#eff6ff;}
tbody tr:last-child td{border-bottom:0;}
td.num,.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;}
td.num{text-align:right;}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:4px 8px;
  border:1px solid transparent;
  border-radius:5px;
  font-size:10.5px;
  line-height:1.25;
  font-weight:700;
  white-space:nowrap;
}
.tag .material-symbols-outlined{font-size:14px;}
.t-ok{background:#f0fdf4;color:#166534;border-color:#bbf7d0;}
.t-run{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe;}
.t-warn{background:#fffbeb;color:#92400e;border-color:#fde68a;}
.t-bad{background:#fef2f2;color:#b91c1c;border-color:#fecaca;}
.t-idle{background:#f1f5f9;color:#475569;border-color:#cbd5e1;}
.t-teal{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe;}
.bar{height:7px;min-width:60px;border-radius:2px;background:#e2e8f0;overflow:hidden;}
.bar>i{display:block;height:100%;border-radius:2px;background:var(--color-primary);}
.board{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:12px;}
.col{min-width:0;padding:12px;background:#f8fafc;border:1px solid var(--color-border);border-radius:7px;}
.col h4{display:flex;align-items:center;justify-content:space-between;margin:0 0 11px;font-size:12px;font-weight:700;}
.col h4 span{min-width:25px;padding:2px 7px;border:1px solid #cbd5e1;border-radius:4px;background:#fff;color:var(--color-muted-foreground);font-family:var(--mono);font-size:10px;text-align:center;}
.tk{margin-bottom:8px;padding:10px 11px;background:#fff;border:1px solid var(--color-border);border-left:3px solid var(--color-primary);border-radius:5px;box-shadow:0 1px 2px rgba(15,23,42,.04);transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;}
.tk:last-child{margin-bottom:0;}
.tk:hover{transform:translateY(-2px);border-color:#93c5fd;box-shadow:0 5px 14px rgba(37,99,235,.09);}
.tk .tt{font-size:12px;font-weight:700;}
.tk .tm{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px;font-size:10px;color:var(--color-muted-foreground);}
.tk .tm b{color:#334155;font-weight:500;}
.tl{position:relative;padding-left:22px;}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:1px;background:#cbd5e1;}
.tl .ev{position:relative;padding:0 0 17px 9px;}
.tl .ev::before{content:"";position:absolute;left:-20px;top:4px;width:11px;height:11px;border-radius:50%;background:#fff;border:3px solid var(--color-primary);}
.tl .ev.warn::before{border-color:var(--warn);}
.tl .ev.bad::before{border-color:var(--bad);}
.tl .ev .et{font-size:12px;font-weight:700;}
.tl .ev .em{margin-top:2px;font-size:10.5px;color:var(--color-muted-foreground);}
.tl .ev .ed{font-family:var(--mono);font-size:10.5px;color:#1d4ed8;font-weight:600;}
.envrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;}
.env{position:relative;min-width:0;overflow:hidden;padding:17px 18px;background:#fff;color:var(--color-foreground);border:1px solid var(--color-border);border-top:3px solid var(--color-primary);border-radius:9px;box-shadow:var(--shadow);}
.env::after{content:"";position:absolute;right:-34px;bottom:-42px;width:104px;height:104px;border:16px solid #eff6ff;border-radius:50%;}
.env .el{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--color-muted-foreground);font-weight:600;}
.env .el .material-symbols-outlined{color:var(--color-primary);font-size:18px;}
.env .ev{margin:7px 0 3px;font-family:var(--mono);font-size:30px;line-height:1.2;font-weight:700;letter-spacing:-.045em;font-variant-numeric:tabular-nums;}
.env .er{font-size:10.5px;color:var(--color-muted-foreground);}
.env .ec{position:absolute;z-index:1;right:12px;top:12px;padding:3px 7px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:4px;font-family:var(--mono);font-size:10px;font-weight:600;}
.note{margin-top:13px;padding:11px 13px;background:#fff7ed;color:#7c2d12;border:1px solid #fed7aa;border-left:3px solid var(--color-accent);border-radius:5px;font-size:11.5px;}
.note b{color:#9a3412;}
.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.pc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;}
.pcell{padding:13px;background:#f8fafc;border:1px solid var(--color-border);border-radius:6px;}
.pcell .pk{font-size:10.5px;color:var(--color-muted-foreground);font-weight:600;}
.pcell .pv{margin-top:5px;font-family:var(--mono);font-size:20px;line-height:1.2;font-weight:700;font-variant-numeric:tabular-nums;}
.pcell .pv small{font-family:var(--sans);font-size:10px;color:var(--color-muted-foreground);font-weight:600;}
#view>.grid,#view>.card,#view>.envrow{animation:enter .4s cubic-bezier(.34,1.35,.64,1) both;}
#view>:nth-child(2){animation-delay:.06s;}
#view>:nth-child(3){animation-delay:.12s;}
@keyframes enter{from{opacity:0;transform:translateY(12px) scale(.985);}to{opacity:1;transform:none;}}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));}
  .g23{grid-template-columns:1fr;}
  .pc{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media(max-width:860px){
  .app{flex-direction:column;}
  .sidebar{position:relative;width:100%;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 16px;gap:10px;border-right:0;border-bottom:1px solid var(--color-border);}
  .brand{padding:0 15px 0 0;border:0;border-right:1px solid var(--color-border);}
  .brand .logo{width:38px;height:38px;box-shadow:3px 3px 0 #bfdbfe;}
  .sidebar .foot{display:none;}
  .nav{flex:1 1 100%;flex-direction:row;overflow-x:auto;padding:2px 1px 5px;scrollbar-width:thin;}
  .nav button{width:auto;min-height:44px;flex:none;white-space:nowrap;}
  .nav button.on::before{left:10px;right:10px;top:auto;bottom:-3px;width:auto;height:3px;}
  .nav button:hover{transform:translateY(-1px);}
  .main{width:100%;padding:22px 18px 38px;}
  .board{min-width:640px;}
}
@media(max-width:700px){
  .g3,.g2,.g23,.envrow{grid-template-columns:1fr;}
  .topbar{align-items:flex-start;}
  .chart.lg{height:280px;}
}
@media(max-width:480px){
  body{font-size:13px;}
  .sidebar{padding:11px 12px;}
  .brand{width:100%;padding:0 0 10px;border-right:0;border-bottom:1px solid var(--color-border);}
  .nav button .nx small{display:none;}
  .main{padding:18px 12px 32px;}
  .topbar{margin-bottom:16px;padding-bottom:14px;}
  .g4{grid-template-columns:1fr;gap:10px;}
  .pc{grid-template-columns:repeat(2,minmax(0,1fr));}
  .card{padding:15px;}
  .kpi{padding:15px 16px;}
  .kpi .kv{font-size:25px;}
  .chart,.chart.lg{height:250px;}
  th,td{padding:10px 11px;}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important;}
  #view>.grid,#view>.card,#view>.envrow{animation:none!important;opacity:1!important;transform:none!important;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">verified</span></div>
      <div>
        <h1>可靠度測試管理</h1>
        <p>Reliability Test Mgmt</p>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">可靠度工程部 · <b>RTM v2.6</b><br/>同步 QMS / FMEA / FA 系統</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="htxt">
        <h2 id="ttl">—</h2>
        <p id="sub">—</p>
      </div>
      <div class="pill"><span class="material-symbols-outlined">bolt</span><span id="cnt">—</span></div>
    </div>
    <div id="view"></div>
  </main>
</div>
<script>
(function(){
"use strict";
var MODS=[
  {icon:"event_note",name:"測試計畫排程",sub:"計畫制定與試箱排程"},
  {icon:"science",name:"樣品與試箱管理",sub:"樣品準備與資源狀態"},
  {icon:"thermostat",name:"測試條件監控",sub:"溫濕度/振動/EMI"},
  {icon:"error",name:"失效數據登錄",sub:"失效模式與存活追蹤"},
  {icon:"analytics",name:"可靠度分析",sub:"Weibull / MTTF"},
  {icon:"summarize",name:"測試報告產出",sub:"達成率與審核簽核"}
];
var SUBT=[
  "可靠度測試計畫甘特排程與試箱資源配置",
  "受測樣品批號、治具與試箱可用狀態看板",
  "環境測試條件即時監控與逐時量測趨勢",
  "失效模式登錄、樣本存活曲線與帕累托分析",
  "Weibull 壽命分佈、浴缸曲線與 MTTF 目標判定",
  "測試報告進度、計畫達成率與簽核追蹤"
];
var CNT=["8 項進行中","24 個樣品","3 試箱線上","41 筆失效","6 份分析","12 份報告"];

function disposeAll(){
  try{
    var els=document.querySelectorAll(".chart");
    for(var i=0;i<els.length;i++){var ins=echarts.getInstanceByDom(els[i]); if(ins){ins.dispose();}}
  }catch(e){}
}
function mk(id,opt){
  var el=document.getElementById(id); if(!el){return;}
  var c=echarts.init(el); c.setOption(opt);
}
var TEAL="#0f766e", TEAL2="#5eead4", AMBER="#d97706", RED="#dc2626", BLUE="#0891b2", GREY="#94a3b8";
var axBase={axisLine:{lineStyle:{color:"#cbd8d5"}},axisLabel:{color:"#6b8480",fontSize:11},splitLine:{lineStyle:{color:"#eef2f1"}}};

function tag(cls,ic,txt){return '<span class="tag '+cls+'"><span class="material-symbols-outlined">'+ic+'</span>'+txt+'</span>';}
function kpi(ic,l,v,u,d,dir){
  return '<div class="kpi"><div class="kl"><span class="material-symbols-outlined">'+ic+'</span>'+l+'</div>'+
    '<div class="kv">'+v+' <small>'+(u||"")+'</small></div>'+
    '<div class="kd '+dir+'"><span class="material-symbols-outlined" style="font-size:14px;vertical-align:-2px">'+(dir==="up"?"trending_up":dir==="down"?"trending_down":"trending_flat")+'</span> '+d+'</div></div>';
}
function pcell(k,v,u,d){return '<div class="pcell"><div class="pk">'+k+'</div><div class="pv">'+v+' <small>'+(u||"")+'</small></div><div class="pk" style="margin-top:3px">'+d+'</div></div>';}

/* ---------- SCREEN 0 : 測試計畫排程 (gantt signature) ---------- */
function s0(){
  var plans=[
    {id:"RTP-2408-01",p:"車用電源模組 PSU-A",std:"IEC 60068-2-1 低溫",eng:"林承翰",prog:82,st:["run","進行中"],due:"08/22"},
    {id:"RTP-2408-02",p:"感測器 SNR-7 溫循",std:"JESD22-A104 溫循",eng:"陳姿羽",prog:100,st:["ok","已完成"],due:"08/12"},
    {id:"RTP-2408-03",p:"連接器 CN-9 振動",std:"IEC 60068-2-6 振動",eng:"黃柏勳",prog:45,st:["run","進行中"],due:"08/28"},
    {id:"RTP-2408-04",p:"控制板 MCU-3 EMI",std:"CISPR 32 輻射",eng:"吳念真",prog:12,st:["warn","待進場"],due:"09/03"},
    {id:"RTP-2408-05",p:"電池模組 BAT-2 HALT",std:"HALT 極限",eng:"林承翰",prog:0,st:["idle","已排程"],due:"09/10"}
  ];

var RENDER=[s0,s1,s2,s3,s4,s5];
var AFTER=[s0charts,s1charts,s2charts,s3charts,s4charts,s5charts];

function buildNav(){
  var nav=document.getElementById("nav");
  nav.innerHTML=MODS.map(function(m,i){
    return '<button data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="nx">'+m.name+'<small>'+m.sub+'</small></span></button>';
  }).join("");
  var btns=nav.querySelectorAll("[data-i]");
  for(var i=0;i<btns.length;i++){
    btns[i].addEventListener("click",function(){show(+this.getAttribute("data-i"));});
  }
}
function show(idx){
  var i=Math.max(0,Math.min(idx,RENDER.length-1));
  disposeAll();
  var view=document.getElementById("view");
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",(+btns[b].getAttribute("data-i"))===i);}
  document.getElementById("ttl").textContent=MODS[i].name;
  document.getElementById("sub").textContent=SUBT[i];
  document.getElementById("cnt").textContent=CNT[i];
  view.innerHTML=RENDER[i]();
  void view.offsetHeight;
  AFTER[i]();
}
buildNav();

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);
show(0);
fromHash();
})();
