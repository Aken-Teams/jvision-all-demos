<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>貿易營運 ERP · Jvision</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --color-primary:#2563EB;
 --color-on-primary:#FFFFFF;
 --color-secondary:#3B82F6;
 --color-on-secondary:#000000;
 --color-accent:#EA580C;
 --color-on-accent:#000000;
 --color-background:#F8FAFC;
 --color-foreground:#1E293B;
 --color-card:#FFFFFF;
 --color-card-foreground:#1E293B;
 --color-muted:#E9EFF8;
 --color-muted-foreground:#475569;
 --color-border:#E2E8F0;
 --color-destructive:#DC2626;
 --color-on-destructive:#FFFFFF;
 --color-ring:#2563EB;
 --blue:#2563EB;
 --ink:#1E293B;
 --muted:#475569;
 --mut:var(--muted);
 --line:#E2E8F0;
 --acc:#EA580C;
 --acc2:#3B82F6;
 --bg:#F8FAFC;
 --card:#FFFFFF;
 --ok:#15803D;
 --warn:#A34B00;
 --bad:#DC2626;
 --black:#0F172A;
 --shadow:5px 5px 0 #1E293B;
}
html{background:var(--color-background);scroll-behavior:auto}
body{
 min-width:320px;
 min-height:100vh;
 overflow-x:hidden;
 color:var(--color-foreground);
 background-color:var(--color-background);
 background-image:linear-gradient(var(--color-border) 1px,transparent 1px),linear-gradient(90deg,var(--color-border) 1px,transparent 1px);
 background-size:32px 32px;
 font-family:"Fira Sans",sans-serif;
 font-size:14px;
 line-height:1.5;
}
button,input,select,textarea{font:inherit}
button,[data-i]{cursor:pointer}
::selection{color:#fff;background:var(--blue)}
.material-symbols-outlined{
 display:inline-block;
 flex:0 0 auto;
 font-family:"Material Symbols Outlined";
 font-size:20px;
 font-style:normal;
 font-weight:normal;
 line-height:1;
 letter-spacing:normal;
 text-transform:none;
 white-space:nowrap;
 direction:ltr;
 vertical-align:middle;
}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
header{
 position:sticky;
 top:0;
 z-index:20;
 color:var(--color-on-primary);
 background:var(--color-primary);
 border-bottom:4px solid var(--black);
 box-shadow:none;
}
header::after{
 content:"LIVE OPERATIONS / 06 MODULES";
 position:absolute;
 right:16px;
 bottom:-24px;
 padding:3px 9px;
 color:#fff;
 background:var(--black);
 border:2px solid var(--black);
 font-family:"Fira Code",monospace;
 font-size:10px;
 font-weight:700;
 letter-spacing:.08em;
}
.hwrap{
 width:100%;
 max-width:1440px;
 min-width:0;
 margin:0 auto;
 padding:0 18px;
 display:flex;
 align-items:stretch;
 gap:0;
}
.brand{
 min-width:230px;
 display:flex;
 align-items:center;
 gap:11px;
 padding:11px 18px 11px 0;
 border-right:3px solid var(--black);
 font-size:18px;
 font-weight:700;
 letter-spacing:-.02em;
 white-space:nowrap;
}
.brand .logo{
 width:38px;
 height:38px;
 display:flex;
 align-items:center;
 justify-content:center;
 color:var(--black);
 background:var(--color-accent);
 border:3px solid var(--black);
 border-radius:0;
}
.brand .logo .material-symbols-outlined{font-size:23px;font-weight:700}
nav{
 min-width:0;
 flex:1;
 display:grid;
 grid-template-columns:repeat(6,minmax(96px,1fr));
}
.nbtn{
 min-width:0;
 min-height:64px;
 padding:9px 10px;
 display:flex;
 align-items:center;
 justify-content:center;
 gap:7px;
 color:#fff;
 background:transparent;
 border:0;
 border-right:2px solid rgba(15,23,42,.55);
 border-radius:0;
 font-size:12px;
 font-weight:600;
 white-space:nowrap;
 transition:background-color 180ms ease,color 180ms ease,transform 180ms ease;
}
.nbtn:first-child{border-left:0}
.nbtn:hover{color:var(--black);background:#93C5FD}
.nbtn.on{
 color:var(--black);
 background:var(--color-accent);
 box-shadow:inset 0 -6px 0 var(--black);
 font-weight:700;
}
.nbtn:active{transform:translateY(2px)}
.nbtn:focus-visible{position:relative;z-index:2;outline-color:#fff;outline-offset:-5px}
.nbtn .material-symbols-outlined{font-size:19px}
main{
 width:100%;
 max-width:1440px;
 min-height:calc(100vh - 64px);
 margin:0 auto;
 padding:34px 18px 72px;
 background:rgba(248,250,252,.88);
 border-right:1px solid var(--line);
 border-left:1px solid var(--line);
}
#app{min-width:0}
.scr-head{
 min-width:0;
 margin-bottom:18px;
 padding:20px 22px;
 display:flex;
 align-items:flex-end;
 justify-content:space-between;
 gap:18px;
 color:#fff;
 background:var(--black);
 border:3px solid var(--black);
 border-left:12px solid var(--color-accent);
}
.scr-head>div{min-width:0}
.scr-head h1{
 font-size:clamp(24px,3vw,38px);
 font-weight:700;
 line-height:1.08;
 letter-spacing:-.045em;
}
.scr-head p{max-width:760px;margin-top:8px;color:#CBD5E1;font-size:13px}
.pill{
 flex:0 0 auto;
 padding:7px 12px;
 color:var(--black);
 background:var(--color-accent);
 border:2px solid #fff;
 border-radius:0;
 font-family:"Fira Code",monospace;
 font-size:11px;
 font-weight:700;
 text-transform:uppercase;
 white-space:nowrap;
 box-shadow:4px 4px 0 #fff;
}
.kpis{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:0;
 margin-bottom:18px;
 border:3px solid var(--black);
 background:var(--black);
}
.kpi{
 position:relative;
 min-width:0;
 padding:16px 18px 18px;
 background:var(--color-card);
 border:0;
 border-right:3px solid var(--black);
 border-radius:0;
}
.kpi:last-child{border-right:0}
.kpi:nth-child(even){background:var(--color-muted)}
.kpi::before{
 content:"";
 position:absolute;
 top:0;
 left:0;
 width:42px;
 height:5px;
 background:var(--color-primary);
}
.kpi:nth-child(2n)::before{background:var(--color-accent)}
.kpi .lbl{
 min-height:20px;
 display:flex;
 align-items:center;
 gap:7px;
 color:var(--color-muted-foreground);
 font-size:11px;
 font-weight:700;
 letter-spacing:.035em;
 text-transform:uppercase;
}
.kpi .lbl .material-symbols-outlined{color:var(--blue);font-size:17px}
.kpi .val{
 margin-top:8px;
 overflow-wrap:anywhere;
 color:var(--black);
 font-family:"Fira Code",monospace;
 font-size:clamp(22px,2.25vw,31px);
 font-weight:700;
 line-height:1.1;
 letter-spacing:-.06em;
 font-variant-numeric:tabular-nums;
}
.kpi .sub{margin-top:7px;font-size:11px;font-weight:700}
.up::before{content:"▲ ";font-size:.8em}.down::before{content:"▼ ";font-size:.8em}.flat::before{content:"■ ";font-size:.65em}.warn::before{content:"! ";font-weight:700}
.up{color:#166534}.down{color:#B91C1C}.flat{color:var(--color-muted-foreground)}.warn{color:#92400E}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(310px,.85fr);gap:18px}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{
 min-width:0;
 padding:17px;
 color:var(--color-card-foreground);
 background:var(--color-card);
 border:3px solid var(--black);
 border-radius:0;
 box-shadow:var(--shadow);
}
.card:nth-child(even){box-shadow:5px 5px 0 var(--color-primary)}
.card h3{
 margin:-17px -17px 16px;
 padding:11px 14px;
 display:flex;
 align-items:center;
 gap:8px;
 color:#fff;
 background:var(--black);
 border-bottom:3px solid var(--black);
 font-size:14px;
 font-weight:700;
 letter-spacing:.01em;
}
.card h3 .material-symbols-outlined{
 width:25px;
 height:25px;
 display:inline-flex;
 align-items:center;
 justify-content:center;
 color:var(--black);
 background:var(--color-accent);
 font-size:17px;
}
.chart{width:100%;height:280px;overflow:hidden}
.chart.sm{height:230px}
.ovf{width:100%;overflow-x:auto;overscroll-behavior-inline:contain}
table{
 width:100%;
 border-collapse:collapse;
 color:var(--color-foreground);
 font-size:12px;
 white-space:nowrap;
 font-variant-numeric:tabular-nums;
}
th{
 padding:9px 10px;
 color:#fff;
 background:var(--color-primary);
 border:2px solid var(--black);
 text-align:left;
 font-family:"Fira Code",monospace;
 font-size:11px;
 font-weight:700;
 letter-spacing:.025em;
}
th:nth-child(n+3){text-align:right}
th:last-child{text-align:center}
td{
 padding:10px;
 background:#fff;
 border:1px solid #CBD5E1;
 border-bottom:2px solid var(--black);
}
td:nth-child(n+3){text-align:right}
td:last-child{text-align:center}
td:first-child,td b,.money{
 font-family:"Fira Code",monospace;
 font-variant-numeric:tabular-nums;
}
tbody tr:nth-child(even) td{background:#F1F5F9}
tbody tr:hover td{background:#FFF1E8}
.money{text-align:right;font-weight:700}
.tag{
 display:inline-flex;
 align-items:center;
 gap:5px;
 padding:3px 8px;
 border:2px solid currentColor;
 border-radius:0;
 font-size:10px;
 font-weight:700;
 line-height:1.25;
 white-space:nowrap;
}
.tag::before{content:"■";font-size:7px}
.t-ok{color:#166534;background:#DCFCE7}
.t-warn{color:#854D0E;background:#FEF3C7}
.t-bad{color:#991B1B;background:#FEE2E2}
.t-info{color:#1E40AF;background:#DBEAFE}
.t-mut{color:#334155;background:#E2E8F0}
.bar{
 min-width:70px;
 height:12px;
 overflow:hidden;
 background:#E2E8F0;
 border:2px solid var(--black);
 border-radius:0;
}
.bar>i{display:block;height:100%;border-radius:0;background:var(--color-primary)}
.tl{position:relative;padding-left:29px}
.tl::before{content:"";position:absolute;top:4px;bottom:4px;left:9px;width:4px;background:var(--black)}
.tl .ev{position:relative;margin-bottom:15px;padding:9px 11px;background:var(--color-muted);border:2px solid var(--black)}
.tl .ev:last-child{margin-bottom:0}
.tl .ev::before{
 content:"PENDING";
 position:absolute;
 top:9px;
 left:-31px;
 width:17px;
 height:17px;
 overflow:hidden;
 color:transparent;
 background:#fff;
 border:4px solid var(--color-accent);
}
.tl .ev.done::before{content:"DONE";background:var(--color-primary);border-color:var(--black)}
.tl .ev .et{font-family:"Fira Code",monospace;font-size:12px;font-weight:700}
.tl .ev .ed{margin-top:3px;color:var(--color-muted-foreground);font-size:12px}
.tl .ev .ec{margin-top:4px;color:#9A3412;font-family:"Fira Code",monospace;font-size:10px;font-weight:700}
.doc{overflow:hidden;border:3px solid var(--black);border-radius:0}
.doc .dh{
 padding:12px 14px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:8px;
 flex-wrap:wrap;
 background:#DBEAFE;
 border-bottom:3px solid var(--black);
}
.doc .dh .dt{font-family:"Fira Code",monospace;font-size:15px;font-weight:700;letter-spacing:.04em}
.doc .db{padding:14px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;font-size:12px}
.kv .k{color:var(--color-muted-foreground);font-weight:600}
.kv .v{overflow-wrap:anywhere;text-align:right;font-family:"Fira Code",monospace;font-weight:600;font-variant-numeric:tabular-nums}
.mark{
 padding:18px 14px;
 color:var(--black);
 background:repeating-linear-gradient(-45deg,#fff,#fff 10px,#E9EFF8 10px,#E9EFF8 20px);
 border:5px double var(--black);
 border-radius:0;
 text-align:center;
 font-family:"Fira Code",monospace;
 font-size:14px;
 font-weight:700;
 line-height:1.85;
 letter-spacing:.07em;
}
.legend{margin-top:10px;display:flex;gap:12px;flex-wrap:wrap;color:var(--color-muted-foreground);font-size:11px;font-weight:600}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;display:inline-block;border:2px solid var(--black);border-radius:0}
.note{
 padding:11px 12px;
 display:flex;
 align-items:flex-start;
 gap:8px;
 color:#7C2D12;
 background:#FFEDD5;
 border:2px solid var(--color-accent);
 border-left:7px solid var(--color-accent);
 border-radius:0;
 font-size:12px;
 font-weight:500;
}
.note .material-symbols-outlined{color:#9A3412;font-size:19px}
.rowflex{min-width:0;display:flex;align-items:center;gap:8px}
.mb12{margin-bottom:12px}.mb14{margin-bottom:14px}
.stat-row{
 min-height:39px;
 padding:9px 4px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:12px;
 border-bottom:2px dashed #94A3B8;
 font-size:12px;
}
.stat-row:last-child{border-bottom:0}
.stat-row b{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
#app>*{animation:brutal-in 380ms cubic-bezier(.34,1.45,.64,1) both}
#app>*:nth-child(2){animation-delay:60ms}
#app>*:nth-child(3){animation-delay:120ms}
#app>*:nth-child(4){animation-delay:180ms}
@keyframes brutal-in{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@media(max-width:1100px){
 .hwrap{padding:0 12px;display:block}
 .brand{min-width:0;padding:9px 0;border-right:0;border-bottom:2px solid var(--black)}
 nav{grid-template-columns:repeat(6,1fr)}
 .nbtn{min-height:48px}
 main{padding-top:32px}
 .grid2{grid-template-columns:minmax(0,1.25fr) minmax(290px,.75fr)}
}
@media(max-width:820px){
 header{position:relative}
 header::after{display:none}
 .hwrap{padding:0}
 .brand{padding:10px 14px}
 nav{overflow-x:auto;display:flex;border-top:0}
 .nbtn{min-width:130px;flex:1;border-top:0;border-right:2px solid var(--black)}
 main{padding:20px 12px 56px}
 .scr-head{align-items:flex-start;padding:17px;flex-direction:column}
 .pill{align-self:flex-start}
 .kpis{grid-template-columns:1fr 1fr}
 .kpi:nth-child(2){border-right:0}
 .kpi:nth-child(-n+2){border-bottom:3px solid var(--black)}
 .grid2,.grid2b,.grid3{grid-template-columns:1fr}
 .card,.card:nth-child(even){box-shadow:4px 4px 0 var(--black)}
}
@media(max-width:560px){
 body{background-size:24px 24px}
 .brand{font-size:16px}
 .brand .logo{width:34px;height:34px}
 .nbtn{min-width:52px;padding:8px}
 .nbtn .txt{display:none}
 .nbtn .material-symbols-outlined{font-size:21px}
 main{padding:15px 9px 44px}
 .scr-head{margin-bottom:12px;padding:15px;border-left-width:8px}
 .scr-head h1{font-size:23px}
 .scr-head p{font-size:12px}
 .kpis{margin-bottom:12px}
 .kpi{padding:13px 11px 14px}
 .kpi .lbl{font-size:10px}
 .kpi .val{font-size:20px}
 .card{padding:13px}
 .card h3{margin:-13px -13px 13px;padding:10px 11px}
 .chart{height:250px}.chart.sm{height:215px}
 .stat-row{align-items:flex-start}
 .rowflex{flex-wrap:wrap}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
 #app>*{opacity:1;transform:none}
}
</style>
</head>
<body>
<header>
 <div class="hwrap">
  <div class="brand"><span class="logo"><span class="material-symbols-outlined">public</span></span><span>貿易營運 ERP</span></div>
  <nav id="nav"></nav>
 </div>
</header>
<main><div id="app"></div></main>
<script>
var NAV=[
 {i:0,ic:"request_quote",t:"報價確認"},
 {i:1,ic:"account_tree",t:"採購供應"},
 {i:2,ic:"inventory_2",t:"裝箱出貨"},
 {i:3,ic:"receipt_long",t:"發票單據"},
 {i:4,ic:"fact_check",t:"應收應付"},
 {i:5,ic:"insights",t:"利潤分析"}
];
var app=document.getElementById("app");
var chart=null;
function navHtml(){
 var h="";
 for(var k=0;k<NAV.length;k++){var n=NAV[k];
  h+='<button class="nbtn" data-i="'+n.i+'"><span class="material-symbols-outlined">'+n.ic+'</span><span class="txt">'+n.t+'</span></button>';}
 return h;
}
document.getElementById("nav").innerHTML=navHtml();
function setActive(i){
 var bs=document.querySelectorAll(".nbtn");
 for(var k=0;k<bs.length;k++){bs[k].className="nbtn"+(+bs[k].getAttribute("data-i")===i?" on":"");}
}
document.getElementById("nav").addEventListener("click",function(e){
 var b=e.target.closest(".nbtn");if(!b)return;
 var i=+b.getAttribute("data-i");location.hash="v"+i;
});
function disposeChart(){if(chart){try{chart.dispose();}catch(e){}chart=null;}}
function mkChart(id,opt){
 var el=document.getElementById(id);if(!el)return;
 var c=echarts.init(el);c.setOption(opt);chart=c;
}
function head(t,d,pill){
 return '<div class="scr-head"><div style="min-width:0"><h1>'+t+'</h1><p>'+d+'</p></div><span class="pill">'+pill+'</span></div>';
}
function kpi(lbl,ic,val,sub,cls){
 return '<div class="kpi"><div class="lbl"><span class="material-symbols-outlined">'+ic+'</span>'+lbl+'</div><div class="val">'+val+'</div><div class="sub '+(cls||"flat")+'">'+sub+'</div></div>';
}
function bar(p){return '<div class="rowflex"><div class="bar" style="flex:1"><i style="width:'+p+'%"></i></div><span style="font-size:12px;color:var(--mut);min-width:34px;text-align:right">'+p+'%</span></div>';}

/* ===== SCREEN 0: 報價與銷售確認 ===== */
function s0(){
 var rows=[
  ["QT-24081","日商 Marubeni","不鏽鋼閥件 x2,400","USD","$186,400","FOB Keelung","t-ok","已確認"],
  ["QT-24082","US Harbor Freight","LED 工作燈 x15,000","USD","$92,750","CIF Long Beach","t-warn","待客戶回覆"],
  ["QT-24083","德商 KRAMER GmbH","精密齒輪組 x800","EUR","EUR 64,200","EXW 台中","t-info","報價中"],
  ["QT-24084","越南 Phu My Co.","電動工具 x3,200","USD","$41,600","FOB Kaohsiung","t-ok","已確認"],
  ["QT-24085","澳洲 BlueScope","鍍鋅捲料 x120噸","USD","$228,000","CFR Sydney","t-bad","價格未過"]
 ];
 var tr="";for(var i=0;i<rows.length;i++){var r=rows[i];
  tr+='<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td><td class="money">'+r[4]+'</td><td>'+r[5]+'</td><td><span class="tag '+r[6]+'">'+r[7]+'</span></td></tr>';}
 var h=head("報價與銷售確認","業務依成本與匯率試算報價，客戶確認後產出銷售確認單 (SC)","業務專員");
 h+='<div class="kpis">'
  +kpi("本月報價","request_quote","38 筆","+6 vs 上月","up")
  +kpi("報價轉換率","trending_up","46%","+4.2pt","up")
  +kpi("待確認金額","payments","$612K","5 筆進行中","flat")
  +kpi("平均毛利率","percent","23.8%","目標 22%","up")
  +'</div>';
 h+='<div class="grid2">';
 h+='<div class="card"><h3><span class="material-symbols-outlined">list_alt</span>報價單追蹤</h3><div class="ovf"><table><thead><tr><th>報價號</th><th>客戶</th><th>品項</th><th>幣別</th><th>金額</th><th>條件</th><th>狀態</th></tr></thead><tbody>'+tr+'</tbody></table></div></div>';
 h+='<div class="card"><h3><span class="material-symbols-outlined">calculate</span>成本試算 · QT-24081</h3>'
  +'<div class="stat-row"><span>採購成本 (FOB)</span><b>$142,000</b></div>'
  +'<div class="stat-row"><span>海運＋保險</span><b>$8,600</b></div>'
  +'<div class="stat-row"><span>報關／雜支</span><b>$3,200</b></div>'
