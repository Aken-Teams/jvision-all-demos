<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>貿易營運 ERP · Jvision</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--acc:#ea580c;--acc2:#fb923c;--bg:#f8fafc;--card:#ffffff;--ink:#1e293b;--mut:#64748b;--line:#e2e8f0;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--blue:#2563eb}
html,body{background:var(--bg);color:var(--ink);font-family:"Inter","Noto Sans TC",sans-serif;font-size:14px;line-height:1.5;overflow-x:hidden}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:20px;line-height:1;vertical-align:middle;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr}
header{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,#7c2d12,#ea580c);color:#fff;box-shadow:0 2px 10px rgba(124,45,18,.25)}
.hwrap{max-width:1360px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;white-space:nowrap;min-width:0}
.brand .logo{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
nav{display:flex;gap:6px;flex-wrap:wrap;min-width:0;flex:1}
.nbtn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);color:#fff;padding:7px 12px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;white-space:nowrap;min-width:0;transition:.15s}
.nbtn:hover{background:rgba(255,255,255,.22)}
.nbtn.on{background:#fff;color:var(--acc)}
.nbtn .material-symbols-outlined{font-size:18px}
main{max-width:1360px;margin:0 auto;padding:20px 16px 60px}
.scr-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;min-width:0}
.scr-head h1{font-size:20px;font-weight:800}
.scr-head p{color:var(--mut);font-size:13px;margin-top:3px}
.pill{background:#fff7ed;color:var(--acc);border:1px solid #fed7aa;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.kpi .lbl{color:var(--mut);font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .lbl .material-symbols-outlined{font-size:16px;color:var(--acc)}
.kpi .val{font-size:24px;font-weight:800;margin-top:6px}
.kpi .sub{font-size:12px;margin-top:2px;font-weight:600}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--mut)}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h3{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--acc)}
.chart{width:100%;height:280px;overflow:hidden}
.chart.sm{height:230px}
table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
th{text-align:left;color:var(--mut);font-weight:600;font-size:12px;padding:8px 10px;border-bottom:2px solid var(--line);background:#fafafa}
td{padding:9px 10px;border-bottom:1px solid var(--line)}
tbody tr:hover{background:#fff7ed}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
.t-ok{background:#dcfce7;color:#15803d}
.t-warn{background:#fef3c7;color:#b45309}
.t-bad{background:#fee2e2;color:#b91c1c}
.t-info{background:#dbeafe;color:#1d4ed8}
.t-mut{background:#f1f5f9;color:#475569}
.money{font-variant-numeric:tabular-nums;font-weight:700}
.bar{height:7px;border-radius:999px;background:#f1f5f9;overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .ev{position:relative;margin-bottom:14px}
.tl .ev::before{content:"";position:absolute;left:-21px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--acc)}
.tl .ev.done::before{background:var(--acc)}
.tl .ev .et{font-weight:700;font-size:13px}
.tl .ev .ed{color:var(--mut);font-size:12px;margin-top:2px}
.tl .ev .ec{font-size:11px;color:var(--acc2);font-weight:700;margin-top:2px}
.doc{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.doc .dh{background:linear-gradient(90deg,#fff7ed,#ffedd5);padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.doc .dh .dt{font-weight:800;font-size:15px}
.doc .db{padding:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv .k{color:var(--mut)}
.kv .v{font-weight:600;text-align:right}
.mark{border:3px solid var(--ink);border-radius:6px;padding:14px;text-align:center;font-weight:800;letter-spacing:1px;line-height:1.7;background:repeating-linear-gradient(45deg,#fafafa,#fafafa 8px,#fff 8px,#fff 16px)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.note{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:11px 13px;font-size:12px;color:#9a3412;display:flex;gap:8px;align-items:flex-start}
.note .material-symbols-outlined{font-size:18px;color:var(--acc)}
.rowflex{display:flex;align-items:center;gap:8px;min-width:0}
.ovf{overflow-x:auto}
.mb12{margin-bottom:12px}.mb14{margin-bottom:14px}
.stat-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.stat-row:last-child{border-bottom:none}
.stat-row b{font-variant-numeric:tabular-nums}
@media(max-width:820px){
 .kpis{grid-template-columns:1fr 1fr}
 .grid2,.grid2b,.grid3{grid-template-columns:1fr}
}
@media(max-width:560px){
 .nbtn .txt{display:none}
 .nbtn{padding:8px}
 .kpis{grid-template-columns:1fr 1fr}
 .scr-head h1{font-size:17px}
}
</style>
</head>
<body>
<header>
 <div class="hwrap">
  <div class="brand"><span class="logo"><span class="material-symbols-outlined">public</span></span><span>貿易營運 ERP</span></div>
  <nav id="nav"></nav>
 </div>
</header>
<main><div id="app"></div></main>
<script>
var NAV=[
 {i:0,ic:"request_quote",t:"報價確認"},
 {i:1,ic:"account_tree",t:"採購供應"},
 {i:2,ic:"inventory_2",t:"裝箱出貨"},
 {i:3,ic:"receipt_long",t:"發票單據"},
 {i:4,ic:"fact_check",t:"應收應付"},
 {i:5,ic:"insights",t:"利潤分析"}
];
var app=document.getElementById("app");
var chart=null;
function navHtml(){
 var h="";
 for(var k=0;k<NAV.length;k++){var n=NAV[k];
  h+='<button class="nbtn" data-i="'+n.i+'"><span class="material-symbols-outlined">'+n.ic+'</span><span class="txt">'+n.t+'</span></button>';}
 return h;
}
document.getElementById("nav").innerHTML=navHtml();
function setActive(i){
 var bs=document.querySelectorAll(".nbtn");
 for(var k=0;k<bs.length;k++){bs[k].className="nbtn"+(+bs[k].getAttribute("data-i")===i?" on":"");}
}
document.getElementById("nav").addEventListener("click",function(e){
 var b=e.target.closest(".nbtn");if(!b)return;
 var i=+b.getAttribute("data-i");location.hash="v"+i;
});
function disposeChart(){if(chart){try{chart.dispose();}catch(e){}chart=null;}}
function mkChart(id,opt){
 var el=document.getElementById(id);if(!el)return;
 var c=echarts.init(el);c.setOption(opt);chart=c;
}
function head(t,d,pill){
 return '<div class="scr-head"><div style="min-width:0"><h1>'+t+'</h1><p>'+d+'</p></div><span class="pill">'+pill+'</span></div>';
}
function kpi(lbl,ic,val,sub,cls){
 return '<div class="kpi"><div class="lbl"><span class="material-symbols-outlined">'+ic+'</span>'+lbl+'</div><div class="val">'+val+'</div><div class="sub '+(cls||"flat")+'">'+sub+'</div></div>';
}
function bar(p){return '<div class="rowflex"><div class="bar" style="flex:1"><i style="width:'+p+'%"></i></div><span style="font-size:12px;color:var(--mut);min-width:34px;text-align:right">'+p+'%</span></div>';}

/* ===== SCREEN 0: 報價與銷售確認 ===== */
function s0(){
 var rows=[
  ["QT-24081","日商 Marubeni","不鏽鋼閥件 x2,400","USD","$186,400","FOB Keelung","t-ok","已確認"],
  ["QT-24082","US Harbor Freight","LED 工作燈 x15,000","USD","$92,750","CIF Long Beach","t-warn","待客戶回覆"],
  ["QT-24083","德商 KRAMER GmbH","精密齒輪組 x800","EUR","EUR 64,200","EXW 台中","t-info","報價中"],
  ["QT-24084","越南 Phu My Co.","電動工具 x3,200","USD","$41,600","FOB Kaohsiung","t-ok","已確認"],
  ["QT-24085","澳洲 BlueScope","鍍鋅捲料 x120噸","USD","$228,000","CFR Sydney","t-bad","價格未過"]
 ];
 var tr="";for(var i=0;i<rows.length;i++){var r=rows[i];
  tr+='<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td><td class="money">'+r[4]+'</td><td>'+r[5]+'</td><td><span class="tag '+r[6]+'">'+r[7]+'</span></td></tr>';}
 var h=head("報價與銷售確認","業務依成本與匯率試算報價，客戶確認後產出銷售確認單 (SC)","業務專員");
 h+='<div class="kpis">'
  +kpi("本月報價","request_quote","38 筆","+6 vs 上月","up")
  +kpi("報價轉換率","trending_up","46%","+4.2pt","up")
  +kpi("待確認金額","payments","$612K","5 筆進行中","flat")
  +kpi("平均毛利率","percent","23.8%","目標 22%","up")
  +'</div>';
 h+='<div class="grid2">';
 h+='<div class="card"><h3><span class="material-symbols-outlined">list_alt</span>報價單追蹤</h3><div class="ovf"><table><thead><tr><th>報價號</th><th>客戶</th><th>品項</th><th>幣別</th><th>金額</th><th>條件</th><th>狀態</th></tr></thead><tbody>'+tr+'</tbody></table></div></div>';
 h+='<div class="card"><h3><span class="material-symbols-outlined">calculate</span>成本試算 · QT-24081</h3>'
  +'<div class="stat-row"><span>採購成本 (FOB)</span><b>$142,000</b></div>'
  +'<div class="stat-row"><span>海運＋保險</span><b>$8,600</b></div>'
  +'<div class="stat-row"><span>報關／雜支</span><b>$3,200</b></div>'
  +'<div class="stat-row"><span>匯兌緩衝 (1.5%)</span><b>$2,290</b></div>'
  +'<div class="stat-row" style="color:var(--acc)"><span><b>報價售價</b></span><b>$186,400</b></div>'
  +'<div class="stat-row"><span>預估毛利</span><b class="up">$30,310 (16.3%)</b></div>'
  +'<div class="note" style="margin-top:12px"><span class="material-symbols-outlined">bolt</span>匯率 USD/TWD 32.15，較上週升值 0.4%，建議報價保留緩衝。</div></div>';
 h+='</div>';
 app.innerHTML=h;
}

/* ===== SCREEN 1: 採購與供應商 ===== */
function s1(){
 var h=head("採購與供應商","依銷售確認單向供應商開立採購單，追蹤交期、到料與缺料風險","採購專員");
 h+='<div class="kpis">'
  +kpi("進行中採購單","account_tree","27 張","6 張本週到料","flat")
  +kpi("準時到料率","local_shipping","89%","+3pt","up")
  +kpi("缺料風險","warning","3 項","需催料","down")
  +kpi("採購總額","payments","$1.24M","本月","flat")
  +'</div>';
 h+='<div class="grid2">';
 h+='<div class="card"><h3><span class="material-symbols-outlined">bar_chart</span>供應商交期表現 (準時率 %)</h3><div id="c1" class="chart"></div></div>';
 var sup=[
  ["O泰精密","閥件加工","98%",96],
  ["東O金屬","鋼材","91%",91],
  ["O達電子","LED 模組","84%",84],
  ["永成O膠","外殼","72%",72],
  ["三和治具","治具","95%",95]
 ];
 var st="";for(var i=0;i<sup.length;i++){var s=sup[i];
  st+='<div class="mb12"><div class="rowflex mb12" style="justify-content:space-between"><b>'+s[0]+'</b><span style="color:var(--mut);font-size:12px">'+s[1]+' · '+s[2]+'</span></div>'+bar(s[3])+'</div>';}
 h+='<div class="card"><h3><span class="material-symbols-outlined">verified_user</span>供應商評分</h3>'+st+'</div>';
 h+='</div>';
 var po=[
  ["PO-5521","O泰精密","閥件毛胚 x2,400","$88,000","08/06","08/18","t-ok","如期"],
  ["PO-5522","O達電子","LED 模組 x15,000","$46,500","08/07","08/22","t-warn","延遲2日"],
  ["PO-5523","東O金屬","不鏽鋼板 x6噸","$32,400","08/08","08/16","t-ok","如期"],
  ["PO-5524","永成O膠","ABS 外殼 x3,200","$18,900","08/09","08/20","t-bad","缺料催料"],
  ["PO-5525","三和治具","專用治具 x4","$12,000","08/10","08/25","t-info","製作中"]
 ];
 var tr="";for(i=0;i<po.length;i++){var p=po[i];
  tr+='<tr><td><b>'+p[0]+'</b></td><td>'+p[1]+'</td><td>'+p[2]+'</td><td class="money">'+p[3]+'</td><td>'+p[4]+'</td><td>'+p[5]+'</td><td><span class="tag '+p[6]+'">'+p[7]+'</span></td></tr>';}
 h+='<div class="card" style="margin-top:14px"><h3><span class="material-symbols-outlined">shopping_cart</span>採購單狀態</h3><div class="ovf"><table><thead><tr><th>採購單</th><th>供應商</th><th>品項</th><th>金額</th><th>下單</th><th>交期</th><th>狀態</th></tr></thead><tbody>'+tr+'</tbody></table></div></div>';
 app.innerHTML=h;
 void app.offsetHeight;
 disposeChart();
 mkChart("c1",{grid:{left:44,right:14,top:20,bottom:28},tooltip:{trigger:"axis"},
  xAxis:{type:"category",data:["昌泰","東鋼","宏達","永成","三和"],axisLabel:{color:"#64748b"}},
  yAxis:{type:"value",max:100,axisLabel:{color:"#64748b"},splitLine:{lineStyle:{color:"#eef2f6"}}},
  series:[{type:"bar",data:[96,91,84,72,95],barWidth:"46%",itemStyle:{borderRadius:[6,6,0,0],color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:"#fb923c"},{offset:1,color:"#ea580c"}])}}]});
}

/* ===== SCREEN 2: 裝箱與出貨嘜頭 ===== */
function s2(){
 var h=head("裝箱與出貨嘜頭","編製裝箱單、標註嘜頭並完成貨櫃配載","出貨專員");
 h+='<div class="kpis">'
  +kpi("待出貨訂單","local_shipping","9 張","3 張本週","flat")
  +kpi("已配載箱數","inventory_2","1,280 箱","+140","up")
  +kpi("貨櫃使用率","view_in_ar","91%","40HQ x2","up")
  +kpi("總毛重","scale","18.6 噸","淨重 16.2 噸","flat")
  +'</div>';
 h+='<div class="grid2">';
 var pk=[
  ["1-40","不鏽鋼閥件","40","480 pcs","12.0","10.4"],
  ["41-72","LED 工作燈","32","1,600 pcs","6.4","5.6"],
  ["73-96","電動工具","24","480 pcs","4.8","4.2"],
  ["97-108","治具備品","12","24 pcs","1.4","1.1"]
 ];
 var tr="";for(var i=0;i<pk.length;i++){var p=pk[i];
  tr+='<tr><td><b>'+p[0]+'</b></td><td>'+p[1]+'</td><td>'+p[2]+'</td><td>'+p[3]+'</td><td class="money">'+p[4]+'</td><td class="money">'+p[5]+'</td></tr>';}
 h+='<div class="card"><h3><span class="material-symbols-outlined">table_view</span>裝箱單 · SC-24081</h3><div class="ovf"><table><thead><tr><th>箱號</th><th>品名</th><th>箱數</th><th>數量</th><th>毛重kg</th><th>淨重kg</th></tr></thead><tbody>'+tr+'</tbody></table></div>'
  +'<div class="legend"><span>合計：108 箱 · 毛重 24.6t · CBM 42.3</span></div></div>';
 h+='<div class="card"><h3><span class="material-symbols-outlined">qr_code_2</span>出貨嘜頭 (Shipping Mark)</h3>'
  +'<div class="mark">MARUBENI<br>Osaka, JAPAN<br>C/NO. 1-108<br>MADE IN TAIWAN<br>SC-24081</div>'
  +'<div class="kv" style="margin-top:12px"><span class="k">目的港</span><span class="v">Osaka Port</span><span class="k">貨櫃</span><span class="v">40HQ x2</span><span class="k">預計開船</span><span class="v">2026/08/21</span><span class="k">船公司</span><span class="v">Evergreen EMC</span></div></div>';
 h+='</div>';
 h+='<div class="card" style="margin-top:14px"><h3><span class="material-symbols-outlined">view_column</span>貨櫃配載狀態</h3><div id="c2" class="chart sm"></div></div>';
 app.innerHTML=h;
 void app.offsetHeight;
 disposeChart();
 mkChart("c2",{grid:{left:80,right:24,top:14,bottom:24},tooltip:{trigger:"axis"},
  xAxis:{type:"value",max:100,axisLabel:{formatter:"{value}%",color:"#64748b"},splitLine:{lineStyle:{color:"#eef2f6"}}},
  yAxis:{type:"category",data:["CTNR-A 40HQ","CTNR-B 40HQ","散裝棧板"],axisLabel:{color:"#64748b"}},
  series:[{type:"bar",data:[94,88,61],barWidth:16,label:{show:true,position:"right",formatter:"{c}%"},itemStyle:{borderRadius:8,color:new echarts.graphic.LinearGradient(1,0,0,0,[{offset:0,color:"#ea580c"},{offset:1,color:"#fb923c"}])}}]});
}

/* ===== SCREEN 3: 商業發票與單據 ===== */
function s3(){
 var h=head("商業發票與報關單據","產出商業發票、產地證明與報關文件，供貨代與海關作業","單證專員");
 h+='<div class="kpis">'
  +kpi("本月發票","receipt_long","31 張","開立完成","flat")
  +kpi("發票金額","payments","$1.86M","USD 計","flat")
  +kpi("待報關","description","4 筆","文件備齊 3 筆","warn")
  +kpi("產證申請","verified","12 件","已核發 10","up")
  +'</div>';
 h+='<div class="grid2">';
 h+='<div class="card"><h3><span class="material-symbols-outlined">receipt_long</span>商業發票 · CI-24081</h3><div class="doc">'
  +'<div class="dh"><div class="dt">COMMERCIAL INVOICE</div><span class="tag t-ok">已簽核</span></div>'
  +'<div class="db"><div class="kv"><span class="k">Invoice No.</span><span class="v">CI-24081</span>'
  +'<span class="k">Date</span><span class="v">2026/08/14</span>'
