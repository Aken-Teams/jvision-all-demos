<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>產品碳足跡與碳標籤 PCF · ESG 永續管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000000;
  --color-secondary:#10b981;
  --color-on-secondary:#0f172a;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#ecfdf5;
  --color-foreground:#064e3b;
  --color-card:#ffffff;
  --color-card-foreground:#064e3b;
  --color-muted:#e8f1f3;
  --color-muted-foreground:#475569;
  --color-border:#6ee7b7;
  --color-destructive:#dc2626;
  --color-on-destructive:#ffffff;
  --color-ring:#059669;

  --blue:#059669;
  --ink:#064e3b;
  --muted:#475569;
  --line:#6ee7b7;

  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --accent-soft:#d1fae5;
  --accent-soft2:#a7f3d0;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --th:#d1fae5;
  --hov:#ecfdf5;
  --track:#cbd5e1;
  --sidebar:#052e2b;
  --sidebar2:#064e3b;
  --side-edge:#34d399;
  --ok:#047857;
  --warn:#92400e;
  --bad:#b91c1c;
  --info:#3730a3;
  --r:0px;
  --glow:rgba(5,150,105,.22);
  --heavy:#022c22;
  --shadow:7px 7px 0 #064e3b;
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:auto}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  background-color:var(--bg);
  background-image:linear-gradient(rgba(5,150,105,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(5,150,105,.1) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Fira Sans",sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,[data-i]{cursor:pointer}
h1,h2,h3,h4{margin:0;color:var(--heavy);font-family:"Fira Sans",sans-serif;font-weight:700;line-height:1.15}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
:focus-visible{outline:4px solid var(--color-ring);outline-offset:3px}
::selection{background:#fbbf24;color:#000}

.app{display:flex;min-height:100vh}
.sidebar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  flex:none;
  flex-direction:column;
  width:264px;
  min-width:0;
  height:100vh;
  padding:0;
  overflow:hidden;
  background:var(--sidebar);
  color:#ecfdf5;
  border-right:4px solid var(--heavy);
}
.brand{display:flex;align-items:center;gap:13px;min-width:0;padding:24px 18px;border-bottom:3px solid var(--color-secondary);background:#022c22}
.brand-logo{display:flex;align-items:center;justify-content:center;flex:none;width:48px;height:48px;background:#fbbf24;color:#000;border:3px solid #000;box-shadow:4px 4px 0 var(--color-secondary)}
.brand-logo .material-symbols-outlined{font-size:27px}
.brand-txt{min-width:0}
.brand-txt b{display:block;color:#fff;font-family:"Fira Sans",sans-serif;font-size:16px;font-weight:700;letter-spacing:.04em}
.brand-txt span{display:block;margin-top:4px;color:#a7f3d0;font-family:"Fira Code",monospace;font-size:9px;font-weight:600;letter-spacing:.08em;white-space:normal}
.nav{display:flex;flex-direction:column;gap:0;min-width:0;margin:0;padding:18px 0}
.nav button{display:flex;align-items:center;gap:12px;min-width:0;min-height:52px;padding:12px 18px;background:transparent;color:#d1fae5;border:0;border-bottom:1px solid rgba(167,243,208,.25);border-left:6px solid transparent;text-align:left;font-family:"Fira Sans",sans-serif;font-size:14px;font-weight:600;white-space:nowrap}
.nav button:hover{background:#064e3b;color:#fff;border-left-color:#fbbf24}
.nav button.on{background:#10b981;color:#000;border-left-color:#fbbf24;box-shadow:inset -8px 0 0 #fbbf24;font-weight:700}
.nav button .material-symbols-outlined{flex:none;font-size:21px}
.nav .idx{margin-left:auto;color:inherit;font-family:"Fira Code",monospace;font-size:11px;font-weight:700;opacity:.8}
.side-foot{margin-top:auto;padding:18px;border-top:3px solid var(--color-secondary);background:#022c22;color:#a7f3d0;font-family:"Fira Code",monospace;font-size:10px;line-height:1.8}
.side-foot b{color:#fff}
.main{flex:1;min-width:0;padding:28px 30px 64px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:22px;margin-bottom:24px;padding:0 0 18px;border-bottom:4px solid var(--heavy);flex-wrap:wrap}
.topbar h1{display:flex;align-items:center;gap:10px;font-size:clamp(22px,2.1vw,32px);font-weight:700;letter-spacing:-.04em}
.topbar h1 .material-symbols-outlined{display:flex;align-items:center;justify-content:center;width:42px;height:42px;background:var(--color-primary);color:#000;border:3px solid #000;font-size:24px}
.topbar .sub{max-width:660px;margin-top:8px;color:var(--muted);font-size:13px;font-weight:500}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:7px 11px;background:#fff;color:#334155;border:2px solid var(--heavy);font-family:"Fira Code",monospace;font-size:11px;font-weight:600}
.chip .dot{width:9px;height:9px;background:var(--ok);border:2px solid #000;animation:pulse 2s steps(2,end) infinite}
.avatar{display:flex;align-items:center;justify-content:center;flex:none;width:38px;height:38px;background:#fbbf24;color:#000;border:3px solid #000;font-family:"Fira Code",monospace;font-size:12px;font-weight:700}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.38}}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{background:var(--panel);color:var(--color-card-foreground);border:3px solid var(--heavy);border-radius:0}
.card,.sec{min-width:0;padding:18px}
.card{box-shadow:5px 5px 0 rgba(6,78,59,.18)}
.sec{margin-bottom:16px}
.sec>h3,.card-h h3{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
.sec>h3{margin-bottom:14px}
.sec>h3 .material-symbols-outlined,.card-h h3 .material-symbols-outlined{color:var(--accent);font-size:20px}
.sec>p{margin:0 0 13px;color:var(--muted);font-size:13px;line-height:1.75}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0;font-size:13px}
.dl dt{color:var(--muted);font-size:12px;font-weight:600}
.dl dd{margin:0;line-height:1.8}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;padding-bottom:11px;border-bottom:2px solid var(--line);flex-wrap:wrap}
.card.pad0>.card-h,.card.p0>.card-h{margin-bottom:0!important;padding:16px 17px!important;background:#d1fae5;border-bottom:3px solid var(--heavy)}
.card-h .hint{padding:3px 6px;background:var(--heavy);color:#fff;font-family:"Fira Code",monospace;font-size:10px;font-weight:600}

.kpi,.stat{position:relative;min-width:0;padding:17px;overflow:hidden}
.kpi::before,.stat::before,.tile::before{content:"";position:absolute;top:0;left:0;width:42%;height:6px;background:var(--color-primary)}
.kpi::after{content:"PCF";position:absolute;right:8px;top:8px;color:rgba(6,78,59,.12);font-family:"Fira Code",monospace;font-size:22px;font-weight:700;letter-spacing:.08em}
.kpi .ico{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;width:40px;height:40px;background:#d1fae5;color:var(--accent);border:2px solid var(--heavy);border-radius:0}
.kpi .ico .material-symbols-outlined{font-size:21px}
.kpi .lbl,.stat .lbl{display:flex;align-items:center;gap:5px;margin-top:12px;color:var(--muted);font-size:12px;font-weight:600}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{color:var(--accent);font-size:15px}
.kpi .val,.stat .val,.tile .tv{margin-top:4px;color:var(--heavy);font-family:"Fira Code",monospace;font-size:25px;font-weight:700;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.kpi .val small,.stat .val small{margin-left:4px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:0}
.kpi .delta,.stat .d{display:inline-flex;align-items:center;gap:3px;margin-top:7px;padding:2px 5px;border:1px solid currentColor;font-size:11px;font-weight:700}
.delta.up,.d.up{color:#047857}
.delta.down,.d.down{color:#b91c1c}
.delta.flat,.d.flat{color:#475569}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:14px}

table{width:100%;border-collapse:collapse;background:#fff;font-size:12.5px}
thead{border-bottom:3px solid var(--heavy)}
th{padding:12px 14px;background:#d1fae5;color:#064e3b;border-right:1px solid #6ee7b7;text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
th:last-child{border-right:0}
td{padding:12px 14px;color:#173f35;border-right:1px solid #d1fae5;border-bottom:1px solid #a7f3d0;white-space:nowrap;font-variant-numeric:tabular-nums}
td:last-child{border-right:0}
tbody tr:nth-child(even){background:#f0fdf4}
tbody tr:hover{background:#fef3c7}
tbody tr:last-child td{border-bottom:0}
th:nth-child(n+2),td:nth-child(n+2){text-align:right}
.mono,td:first-child,.tl-time,.tl-t{font-family:"Fira Code",monospace;font-weight:600;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border:1px solid currentColor;border-radius:0;font-size:10.5px;font-weight:700;white-space:nowrap}
.tag::before{content:"■";font-size:7px;line-height:1}
.t-ok{background:#d1fae5;color:#065f46}
.t-warn{background:#fef3c7;color:#78350f}
.t-bad{background:#fee2e2;color:#991b1b}
.t-info{background:#e0e7ff;color:#3730a3}
.t-gray{background:#e2e8f0;color:#334155}
.t-acc,.t-pink{background:#a7f3d0;color:#064e3b}

.bar{height:9px;min-width:56px;overflow:hidden;background:var(--track);border:1px solid #475569;border-radius:0}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:0}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{flex:none;width:42px;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;font-weight:600;text-align:right}
.tl{position:relative;padding-left:29px}
.tl::before{content:"";position:absolute;left:8px;top:3px;bottom:3px;width:3px;background:var(--heavy)}
.tl-item,.tl-i{position:relative;padding:0 0 18px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;left:-28px;top:2px;width:17px;height:17px;background:#fff;border:4px solid var(--accent);border-radius:0}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font-size:10px;font-weight:600}
.tl-item b,.tl-i b{display:block;margin:3px 0;color:var(--heavy);font-family:"Fira Sans",sans-serif;font-size:13px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:11.5px}
.chk{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px dashed #64748b;font-size:12.5px}
.chk:last-child{border-bottom:0}
.chk .material-symbols-outlined{font-size:20px}
.chk .ok{color:var(--ok)}
.chk .wait{color:var(--muted)}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--muted);font-size:11px}
.note{margin-top:13px;padding-top:12px;color:var(--muted);border-top:2px dashed #64748b;font-size:11.5px;line-height:1.7}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.board>*{min-width:0}
.col{display:flex;flex-direction:column;gap:9px;padding:11px;background:#d1fae5;border:3px solid var(--heavy);border-radius:0}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:3px 4px 7px;color:var(--heavy);font-family:"Fira Sans",sans-serif;font-size:12.5px;font-weight:700}
.col-h .cnt{padding:1px 8px;background:#fff;color:var(--muted);border:2px solid var(--heavy);border-radius:0;font-family:"Fira Code",monospace;font-size:10px}
.pcard{padding:11px 12px;background:#fff;border:2px solid var(--heavy);border-left:7px solid var(--accent);border-radius:0}
.pcard b{color:var(--heavy);font-family:"Fira Sans",sans-serif;font-size:12.5px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:8px;color:var(--ink);font-size:11px}
.mini-av,.av{display:inline-flex;align-items:center;justify-content:center;flex:none;background:#a7f3d0;color:#064e3b;border:1px solid #064e3b;border-radius:0;font-weight:700}
.mini-av{width:19px;height:19px;font-size:9px}
.av{width:27px;height:27px;font-size:10px}
.who{display:inline-flex;align-items:center;gap:6px}
.lane{display:flex;flex-direction:column;gap:10px}
.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 14px;background:#fff;border:2px solid var(--heavy);border-radius:0}
.lane-row .num{display:flex;align-items:center;justify-content:center;flex:none;width:32px;height:32px;background:#a7f3d0;color:#000;border:2px solid #000;border-radius:0;font-family:"Fira Code",monospace;font-size:12px;font-weight:700}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{color:var(--heavy);font-family:"Fira Sans",sans-serif;font-size:13.5px}
.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:11.5px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{z-index:1;display:flex;align-items:center;justify-content:center;width:24px;height:24px;background:#fff;color:#64748b;border:2px solid #64748b;border-radius:0;font-family:"Fira Code",monospace;font-size:10px}
.steps .ln{width:20px;height:3px;background:#94a3b8}
.steps .s.done{background:var(--accent);color:#000;border-color:#000}
.steps .s.cur{color:#064e3b;border:4px double var(--accent);animation:pulse 1.6s steps(2,end) infinite}
.steps .ln.done{background:var(--accent)}
.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 4px;border-bottom:1px dashed #64748b}
.rep-row:last-child{border-bottom:0}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;color:var(--heavy);font-family:"Fira Sans",sans-serif;font-size:13px}
.rep-row .sku span{color:var(--muted);font-size:11px}
.gauge{flex:none;width:110px}
.gauge .track{position:relative;height:9px;overflow:hidden;background:var(--track);border:1px solid #475569;border-radius:0}
.gauge .track i{display:block;height:100%;background:var(--accent);border-radius:0}
.gauge small{display:block;margin-top:3px;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;text-align:right}
.band{position:relative;min-width:150px;height:27px;background:var(--track);border:1px solid #475569;border-radius:0}
.band .rng{position:absolute;top:0;bottom:0;background:#a7f3d0;border-radius:0}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:3px;background:#334155}
.band .me{position:absolute;top:3px;width:12px;height:19px;background:var(--accent);border:2px solid #000;border-radius:0}
.tile{position:relative;display:flex;flex-direction:column;gap:8px;min-width:0;padding:17px;overflow:hidden}
.tile .ti{display:flex;align-items:center;justify-content:center;width:40px;height:40px;background:#a7f3d0;color:#064e3b;border:2px solid var(--heavy);border-radius:0}
.tile .ti .material-symbols-outlined{font-size:21px}
.tile b{color:var(--heavy);font-size:14px;font-weight:700}
.tile p{margin:0;color:var(--muted);font-size:11.5px;line-height:1.6}
.tile .tv{font-size:22px}

#screen{display:grid;grid-template-columns:410px minmax(0,1fr);grid-auto-rows:min-content;gap:17px;align-items:start}
#screen>*{grid-column:1/-1;margin-top:0!important}
#screen>.grid.g4:first-child{grid-column:1;grid-row:1;display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:13px;background:none!important;border:0!important;padding:0!important}
#screen>.grid.g4:first-child>*{flex:none!important;border-right:3px solid var(--heavy)!important;border-bottom:3px solid var(--heavy)!important;background:var(--panel)!important;padding:16px!important}
#screen>.grid.g4:first-child>*:nth-child(1){transform:translate(-3px,-3px)}
#screen>.grid.g4:first-child>*:nth-child(4){transform:translate(3px,3px)}
#screen>.grid.g4:first-child>.tile .ti{width:36px;height:36px;margin:0;overflow:visible}
#screen>*:nth-child(2){grid-column:2;grid-row:1}
#screen>*:nth-child(2).grid{grid-template-columns:minmax(0,1fr)}
#screen>*:nth-child(2)>.card:first-child{min-height:326px;box-shadow:var(--shadow)}
#screen>*:nth-child(n){animation:grid-enter .4s cubic-bezier(.2,.8,.2,1) both}
#screen>*:nth-child(2){animation-delay:.06s}
#screen>*:nth-child(3){animation-delay:.12s}
#screen>*:nth-child(4){animation-delay:.18s}
@keyframes grid-enter{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}

.apexcharts-canvas,.apexcharts-svg{font-family:"Fira Sans",sans-serif!important}
.apexcharts-legend-text,.apexcharts-text{font-family:"Fira Code",monospace!important}
.apexcharts-tooltip{border:2px solid var(--heavy)!important;border-radius:0!important;box-shadow:4px 4px 0 rgba(6,78,59,.25)!important}

@media(max-width:1120px){
  #screen{grid-template-columns:minmax(0,1fr)}
  #screen>*,#screen>.grid.g4:first-child,#screen>*:nth-child(2){grid-column:1;grid-row:auto}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:900px){
  .app{flex-direction:column}
  .sidebar{position:static;width:100%;height:auto;border-right:0;border-bottom:4px solid var(--heavy)}
  .brand{padding:14px 16px}
  .brand-logo{width:42px;height:42px}
  .nav{flex-direction:row;overflow-x:auto;padding:0;border-top:1px solid rgba(167,243,208,.25)}
  .nav button{flex:1;justify-content:center;min-width:148px;border-bottom:0;border-left:0;border-right:1px solid rgba(167,243,208,.25)}
  .nav button:hover,.nav button.on{border-left:0;border-bottom:6px solid #fbbf24;box-shadow:none}
  .side-foot{display:none}
  .main{padding:22px 18px 48px}
  .topbar{align-items:flex-start}
}
@media(max-width:820px){
  .g2,.g3,.g23,.g32{grid-template-columns:1fr}
  .card{box-shadow:4px 4px 0 rgba(6,78,59,.16)}
}
@media(max-width:700px){
  .dl{grid-template-columns:1fr;gap:2px 0}
  .dl dt{margin-top:9px}
}
@media(max-width:560px){
  body{font-size:13px;background-size:24px 24px}
  .main{padding:18px 12px 40px}
  .topbar{margin-bottom:18px}
  .topbar h1{font-size:21px}
  .topbar h1 .material-symbols-outlined{width:38px;height:38px}
  .top-right{width:100%}
  .chip{flex:1;justify-content:center}
  #screen>.grid.g4:first-child,.g4{grid-template-columns:1fr 1fr!important;gap:9px}
  #screen>.grid.g4:first-child>*{padding:12px!important}
  #screen>.grid.g4:first-child>*:nth-child(1),#screen>.grid.g4:first-child>*:nth-child(4){transform:none}
  .tile .tv{font-size:18px}
  .tile b{font-size:12px}

function buildNav(){var n=document.getElementById("nav");
 n.innerHTML=MODULES.map(function(m,i){return '<button type="button" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'}).join("");
 Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})})}
function show(i){killCharts();var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i)});
 RENDER[i](document.getElementById("screen"))}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?Math.min(+m[1],MODULES.length-1):0);try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
