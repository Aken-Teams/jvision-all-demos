<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>生產工單管理｜MES 製造執行終端</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#fff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000;
  --color-accent:#ea580c;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#1e293b;
  --color-card:#fff;
  --color-card-foreground:#1e293b;
  --color-muted:#e9eff8;
  --color-muted-foreground:#475569;
  --color-border:#e2e8f0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#1e293b;
  --muted:#475569;
  --line:#94a3b8;
  --bg:#f8fafc;
  --panel:#fff;
  --panel2:#e9eff8;
  --mut:#475569;
  --dim:#475569;
  --acc:#ea580c;
  --acc2:#2563eb;
  --ok:#15803d;
  --warn:#a16207;
  --bad:#dc2626;
  --info:#0369a1;
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html{background:var(--color-background);color:var(--color-foreground);font-family:"Fira Sans",Arial,sans-serif;scrollbar-gutter:stable}
body{min-height:100vh;overflow-x:hidden;background-color:var(--color-background);background-image:linear-gradient(rgba(37,99,235,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(37,99,235,.07) 1px,transparent 1px);background-size:32px 32px;color:var(--ink)}
button,input,select,textarea{font:inherit}
button,a,[data-i]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px;box-shadow:0 0 0 2px var(--color-card)}
::selection{background:var(--color-primary);color:var(--color-on-primary)}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-size:20px;line-height:1;vertical-align:middle;font-weight:400}
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;min-height:64px;padding:0 18px;background:var(--color-primary);color:var(--color-on-primary);border:0;border-bottom:4px solid var(--ink);box-shadow:8px 8px 0 rgba(30,41,59,.16);flex-wrap:wrap}
.top::after{content:"OPS / LIVE";align-self:stretch;display:grid;place-items:center;margin-left:4px;padding:0 16px;background:var(--ink);color:#fff;border-left:3px solid #fff;font:700 11px/1 "Fira Code",monospace;letter-spacing:.12em}
.brand{display:flex;align-items:center;gap:12px;flex:none}
.logo{width:42px;height:42px;display:grid;place-items:center;flex:none;background:var(--color-accent);color:#fff;border:3px solid var(--ink);border-radius:0;box-shadow:4px 4px 0 var(--ink)}
.brand b{font-size:17px;font-weight:700;letter-spacing:.04em}
.brand small{display:block;margin-top:2px;color:#dbeafe;font:500 11px/1.3 "Fira Code",monospace}
.live{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none;padding:7px 10px;background:#fff;color:var(--ink);border:2px solid var(--ink);font:600 11px/1 "Fira Code",monospace;box-shadow:3px 3px 0 var(--ink)}
.dot{width:10px;height:10px;flex:none;background:var(--ok);border:2px solid var(--ink);border-radius:0;animation:signal 1.8s steps(2,end) infinite}
@keyframes signal{50%{background:#fff}}
.nav{position:sticky;top:64px;z-index:40;display:grid;grid-template-columns:repeat(6,minmax(118px,1fr));gap:0;padding:0 18px;background:var(--color-card);border-bottom:3px solid var(--ink);box-shadow:0 5px 0 rgba(30,41,59,.1);overflow-x:auto}
.nav button{position:relative;display:flex;align-items:center;justify-content:center;gap:7px;min-height:48px;padding:9px 10px;background:var(--color-card);color:var(--muted);border:0;border-right:1px solid var(--line);border-radius:0;font-size:12px;font-weight:700;white-space:nowrap;transition:background-color .16s ease,color .16s ease,box-shadow .16s ease}
.nav button:first-child{border-left:1px solid var(--line)}
.nav button:hover{background:var(--color-muted);color:var(--ink);box-shadow:inset 0 -4px 0 var(--color-primary)}
.nav button.on{background:var(--color-accent);color:#fff;box-shadow:inset 0 -5px 0 var(--ink)}
.nav button.on::before{content:"";position:absolute;top:0;left:0;width:12px;height:12px;background:var(--ink);clip-path:polygon(0 0,100% 0,0 100%)}
.nav .idx{padding:2px 4px;background:var(--ink);color:#fff;font:700 9px/1 "Fira Code",monospace}
.wrap{width:min(100%,1480px);margin:0 auto;padding:24px 18px 56px}
.head{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:16px;margin:0 0 18px;padding:18px 20px;background:var(--ink);color:#fff;border-left:12px solid var(--color-accent);box-shadow:8px 8px 0 var(--color-primary)}
.head::after{content:"MES // PRODUCTION CONTROL";position:absolute;right:18px;top:9px;color:#93c5fd;font:600 9px/1 "Fira Code",monospace;letter-spacing:.14em}
.head h2{font-size:clamp(22px,2.4vw,34px);font-weight:700;line-height:1;letter-spacing:-.03em}
.head p{margin-top:8px;color:#e2e8f0;font-size:13px;line-height:1.5}
.tag{align-self:end;padding:7px 10px;background:var(--color-accent);color:#fff;border:2px solid #fff;border-radius:0;font:700 11px/1.2 "Fira Code",monospace;white-space:nowrap}
.g{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(300px,1fr)}
.card,.kpi,.stat,.ai{border-radius:0}
.card{position:relative;padding:16px;background:var(--color-card);color:var(--color-card-foreground);border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
.card::before{content:"";position:absolute;top:-2px;right:-2px;width:20px;height:20px;background:var(--color-primary);border-left:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.card h3{display:flex;align-items:center;gap:8px;margin:0 24px 3px 0;font-size:14px;font-weight:700;line-height:1.3}
.card h3 .material-symbols-outlined{color:var(--color-primary)}
.card .sub{margin-bottom:13px;color:var(--muted);font-size:12px;line-height:1.45}
.kpi{position:relative;overflow:hidden;min-height:126px;padding:14px 14px 12px;background:var(--color-card);border:2px solid var(--ink);box-shadow:5px 5px 0 var(--color-primary)}
.kpi:nth-child(even){box-shadow:5px 5px 0 var(--color-accent)}
.kpi::before{content:"";position:absolute;right:0;top:0;width:34px;height:34px;background:var(--color-muted);border-left:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.kpi::after{content:"";position:absolute;right:8px;top:8px;width:8px;height:8px;background:var(--color-primary);border:2px solid var(--ink)}
.kpi .lab{display:flex;align-items:center;gap:6px;padding-right:28px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.02em}
.kpi .lab .material-symbols-outlined{color:var(--color-primary)!important}
.kpi .val{margin-top:9px;color:var(--ink);font:700 29px/1 "Fira Code",monospace;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.kpi .val small{margin-left:5px;color:var(--muted);font:600 12px/1 "Fira Sans",sans-serif;letter-spacing:0}
.kpi .delta{display:flex;align-items:center;gap:3px;margin-top:9px;font-size:11px;font-weight:700}
.up{color:var(--ok)}
.down{color:var(--bad)}
.flat{color:var(--warn)}
.chart{width:100%;height:260px;background:linear-gradient(180deg,rgba(233,239,248,.45),transparent);border-left:1px solid var(--line);border-bottom:1px solid var(--line)}
.chart.sm{height:200px}
.overx{overflow-x:auto;overscroll-behavior-inline:contain;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;background:var(--color-card);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
th{padding:10px;text-align:left;background:var(--ink);color:#fff;border-right:1px solid #64748b;border-bottom:3px solid var(--color-primary);font-size:11px;font-weight:700;letter-spacing:.04em}
th:last-child{border-right:0}
td{padding:10px;color:var(--ink);border-right:1px solid var(--color-border);border-bottom:1px solid var(--line)}
td:last-child{border-right:0}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even) td{background:#f1f5f9}
tbody tr:hover td{background:#dbeafe}
td:nth-last-child(2):not(:first-child),td.mono{text-align:right}
.mono{font-family:"Fira Code",monospace;font-weight:600;letter-spacing:0;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border:1px solid currentColor;border-radius:0;font-size:10px;font-weight:700;line-height:1.15;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;background:currentColor;border:1px solid var(--ink)}
.p-ok{background:#dcfce7;color:#166534}
.p-warn{background:#fef3c7;color:#854d0e}
.p-bad{background:#fee2e2;color:#b91c1c}
.p-info{background:#dbeafe;color:#1d4ed8}
.p-acc{background:#ffedd5;color:#c2410c}
.p-mut{background:#e2e8f0;color:#334155}
.bar{height:9px;min-width:70px;overflow:hidden;background:#cbd5e1;border:1px solid var(--ink);border-radius:0}
.bar>i{display:block;height:100%;background:var(--color-primary);border-right:2px solid var(--ink);border-radius:0}
.board{display:grid;gap:12px}
.wo{margin-bottom:9px;padding:10px;background:var(--color-card);border:2px solid var(--ink);border-left:8px solid var(--color-accent);border-radius:0;box-shadow:3px 3px 0 var(--ink)}
.gantt{min-width:680px;border:1px solid var(--ink)}
.grow{display:grid;grid-template-columns:150px 1fr;align-items:center;border-bottom:1px solid var(--line)}
.grow:last-child{border-bottom:0}
.grow:nth-child(odd){background:#f1f5f9}
.gname{padding:9px 8px;border-right:2px solid var(--ink);font-size:12px}
.gname b{display:block;font-weight:700}
.gname span{color:var(--muted);font:500 10px/1.4 "Fira Code",monospace}
.gtrack{position:relative;height:45px;background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(12.5% - 1px),#cbd5e1 calc(12.5% - 1px),#cbd5e1 12.5%)}
.gbar{position:absolute;top:10px;display:flex;align-items:center;height:25px;overflow:hidden;padding:0 7px;color:#fff!important;border:2px solid var(--ink);border-radius:0;box-shadow:2px 2px 0 var(--ink);font:700 10px/1 "Fira Code",monospace}
.ghdr{display:grid;grid-template-columns:150px 1fr;background:var(--ink);color:#fff;border-bottom:2px solid var(--ink);font-size:10px;font-weight:700}
.gscale{display:grid;grid-template-columns:repeat(8,1fr);font-family:"Fira Code",monospace}
.gscale span{padding:7px 4px;text-align:center;border-left:1px solid #64748b}
.matx{min-width:680px;border-collapse:collapse;border-spacing:0}
.matx td,.matx th{padding:8px 6px;text-align:center}
.matx td:first-child,.matx th:first-child{text-align:left}
.cell{display:inline-flex;align-items:center;justify-content:center;width:27px;height:27px;margin:auto;border:2px solid currentColor;border-radius:0}
.c-ok{background:#dcfce7;color:#166534}
.c-no{background:#fee2e2;color:#b91c1c}
.c-part{background:#fef3c7;color:#854d0e}
.feed{position:relative;padding-left:24px}
.feed::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:3px;background:var(--ink)}
.fi{position:relative;padding:0 0 16px}
.fi::before{content:"";position:absolute;left:-22px;top:2px;width:13px;height:13px;background:var(--color-primary);border:3px solid var(--ink);border-radius:0}
.fi.ok::before{background:var(--ok)}
.fi.bad::before{background:var(--bad)}
.fi .ft{font-size:12px;font-weight:700}
.fi .fm{margin-top:3px;color:var(--muted);font-size:11px;line-height:1.45}
.fi .fw{margin-top:4px;color:var(--muted);font:500 10px/1.3 "Fira Code",monospace}
.stat{position:relative;padding:13px;background:var(--color-card);border:2px solid var(--ink);box-shadow:4px 4px 0 #94a3b8}
.stat::after{content:"STATION";position:absolute;right:8px;bottom:7px;color:#94a3b8;font:700 8px/1 "Fira Code",monospace;letter-spacing:.12em}
.stat .sn{display:flex;align-items:center;justify-content:space-between;gap:7px;flex-wrap:wrap;font-size:12px;font-weight:700}
.stat .sw{margin-top:7px;color:var(--color-primary);font:700 11px/1.3 "Fira Code",monospace}
.stat .op{margin-top:4px;color:var(--muted);font-size:11px}
.stat .rng{margin-top:11px;padding-right:44px}
.stat .rng .bar{height:10px}
.stat .num{display:flex;justify-content:space-between;margin-top:5px;color:var(--muted);font:500 10px/1 "Fira Code",monospace}
.led{display:inline-block;width:9px;height:9px;margin-right:5px;background:var(--line);border:2px solid var(--ink);border-radius:0;animation:signal 2.4s steps(2,end) infinite}
.led.g{background:var(--ok)}
.led.y{background:#eab308}
.led.r{background:var(--bad)}
.ai{position:relative;display:flex;gap:12px;padding:16px;background:#fff7ed;border:3px solid var(--color-accent);box-shadow:7px 7px 0 var(--color-accent)}
.ai::after{content:"AI / RECOMMENDATION";position:absolute;right:8px;top:7px;color:#9a3412;font:700 8px/1 "Fira Code",monospace;letter-spacing:.1em}
.ai>.material-symbols-outlined{flex:none;color:var(--color-accent);font-size:26px}
.ai b{display:inline-block;margin:0 120px 7px 0;color:#9a3412;font-size:13px}
.ai p{color:var(--ink);font-size:12px;line-height:1.65}
.lg{list-style:none}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}
.li:last-child{border-bottom:0}
.li .ic{display:grid;place-items:center;width:34px;height:34px;flex:none;background:var(--color-muted);border:1px solid var(--ink);border-radius:0}
.li .ic .material-symbols-outlined{color:var(--color-primary)!important}
.li .gg{margin-left:auto;color:var(--muted);text-align:right;font-size:11px}
.donutwrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.legend{color:var(--muted);font-size:11px}
.legend div{display:flex;align-items:center;gap:7px;padding:4px 0}
.legend i{display:inline-block;width:12px;height:12px;border:2px solid var(--ink);border-radius:0}
.mini{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:5px 8px;background:var(--color-muted);color:var(--muted);border:1px solid var(--ink);border-radius:0;font-size:10px;font-weight:600}
.card,.kpi,.stat,.ai{animation:grid-in .4s cubic-bezier(.2,.9,.3,1.25) both}
.g>*:nth-child(2){animation-delay:.05s}
.g>*:nth-child(3){animation-delay:.1s}
.g>*:nth-child(4){animation-delay:.15s}
.g>*:nth-child(5){animation-delay:.2s}
.g>*:nth-child(6){animation-delay:.25s}
@keyframes grid-in{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@media(max-width:1024px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23{grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr)}
  .nav{padding:0 12px}
  .wrap{padding-inline:14px}
}
@media(max-width:820px){
  .top{min-height:62px;padding:8px 12px}
  .top::after{display:none}
  .nav{top:62px;display:flex;padding:0 10px}
  .nav button{flex:0 0 auto;min-width:116px}
  .g2,.g3,.g23{grid-template-columns:1fr}
  .head{grid-template-columns:1fr;padding:16px}
  .head::after{display:none}
  .tag{justify-self:start}
}
@media(max-width:560px){
  .top{gap:8px}
  .logo{width:38px;height:38px}
  .brand b{font-size:14px}
  .brand small{font-size:9px}
  .live{width:100%;margin-left:0;justify-content:center;order:2}
  .nav{top:94px}
  .nav button{min-width:50px;padding:9px 12px}
  .nav button .tx{display:none}
  .nav .idx{font-size:8px}
  .wrap{padding:16px 10px 44px}
  .head{margin-bottom:14px;box-shadow:5px 5px 0 var(--color-primary)}
  .head h2{font-size:22px}
  .g4{grid-template-columns:1fr 1fr;gap:10px}
  .g{gap:12px}
  .kpi{min-height:120px;padding:12px}
  .kpi .val{font-size:24px}
  .card{padding:13px;box-shadow:4px 4px 0 var(--ink)}
  .ai b{margin-right:0}
}
@media(max-width:390px){
  .g4{grid-template-columns:1fr}
  .live{font-size:10px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}
  .card,.kpi,.stat,.ai{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="top">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">precision_manufacturing</span></div>
    <div><b>生產工單管理</b><small>MES 製造執行終端 · 第二廠</small></div>
  </div>
  <div class="live"><span class="dot"></span>現場連線中 · 08:42 更新</div>
</div>
<nav class="nav" id="nav"></nav>
<div class="wrap"><div id="view"></div></div>

<script>
var charts=[];
function disposeCharts(){charts.forEach(function(c){try{c.dispose();}catch(e){}});charts=[];}
function mk(el,opt){if(!el)return;var c=echarts.init(el,null,{renderer:"canvas"});c.setOption(opt);charts.push(c);return c;}
var AX={axisLine:{lineStyle:{color:"#3a4456"}},axisLabel:{color:"#8b98ad"},splitLine:{lineStyle:{color:"#1e2534"}}};
var GRID={left:44,right:16,top:28,bottom:30};

function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function head(t,p,tag){return '<div class="head"><div><h2>'+t+'</h2><p>'+p+'</p></div><span class="tag">'+tag+'</span></div>';}
function kpi(ic,lab,val,unit,cls,delta){
  var arrow=cls==="up"?"trending_up":cls==="down"?"trending_down":"trending_flat";
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined" style="font-size:17px;color:#fb923c">'+ic+'</span>'+lab+'</div>'+
    '<div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'+
    '<div class="delta '+cls+'"><span class="material-symbols-outlined" style="font-size:15px">'+arrow+'</span>'+delta+'</div></div>';
}

/* ---------- Screen 0: 訂單轉工單 ---------- */
function s0(v){
  var orders=[
    {ord:"SO-24107",cust:"O達精機",prod:"齒輪箱總成 GX-40",qty:1200,due:"07/21",wo:3,st:"已拆單",stc:"p-ok"},
    {ord:"SO-24108",cust:"鼎O電子",prod:"散熱模組 HS-12",qty:800,due:"07/24",wo:2,st:"拆單中",stc:"p-acc"},
    {ord:"SO-24109",cust:"台O扣件",prod:"精密螺帽 M8",qty:5000,due:"07/26",wo:4,st:"已拆單",stc:"p-ok"},
    {ord:"SO-24110",cust:"長O塑膠",prod:"外殼射出件 C7",qty:2400,due:"07/28",wo:0,st:"待拆單",stc:"p-warn"},
    {ord:"SO-24111",cust:"聯O食品",prod:"包裝托盤 P-20",qty:3200,due:"07/30",wo:0,st:"待拆單",stc:"p-warn"},
    {ord:"SO-24112",cust:"O暘光電",prod:"背板結構件 B9",qty:900,due:"08/02",wo:2,st:"已拆單",stc:"p-ok"}
  ];
  var rows=orders.map(function(o){
    return '<tr><td class="mono">'+o.ord+'</td><td>'+esc(o.cust)+'</td><td>'+esc(o.prod)+'</td>'+
    '<td class="mono">'+o.qty.toLocaleString()+'</td><td>'+o.due+'</td>'+
    '<td>'+(o.wo>0?'<span class="pill p-info">'+o.wo+' 張</span>':'<span class="pill p-mut">—</span>')+'</td>'+
    '<td><span class="pill '+o.stc+'">'+o.st+'</span></td></tr>';
  }).join("");
  v.innerHTML=
  head("訂單轉工單","接單依製程拆解為工單，設定數量、交期與物料需求","本週待轉 5 筆")+

];

var nav=document.getElementById("nav");
nav.innerHTML=SCREENS.map(function(s,i){
  return '<button data-i="'+i+'"><span class="material-symbols-outlined" style="font-size:18px">'+s.icon+'</span><span class="tx">'+s.name+'</span><span class="idx">v'+i+'</span></button>';
}).join("");
var view=document.getElementById("view");
function show(i){
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  disposeCharts();
  var btns=nav.querySelectorAll("button");
  btns.forEach(function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i);});
  SCREENS[i].fn(view);
}
nav.addEventListener("click",function(e){
  var b=e.target.closest("button[data-i]");if(!b)return;show(+b.getAttribute("data-i"));
  try{window.scrollTo(0,0);}catch(err){}
});
window.addEventListener("resize",function(){charts.forEach(function(c){try{c.resize();}catch(e){}});});
show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
