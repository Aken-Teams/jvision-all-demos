<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>生產工單管理｜MES 製造執行終端</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --bg:#0c0f16;--panel:#141924;--panel2:#1b2130;--line:#28303f;
  --ink:#e8edf5;--mut:#8b98ad;--dim:#5c6a7e;
  --acc:#c2410c;--acc2:#fb923c;--ok:#22c55e;--warn:#fbbf24;--bad:#ef4444;--info:#38bdf8;
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html,body{background:var(--bg);color:var(--ink);font-family:"Inter","Noto Sans TC",sans-serif}
body{overflow-x:hidden}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-size:20px;line-height:1;vertical-align:middle}
.top{position:sticky;top:0;z-index:50;background:linear-gradient(90deg,#10141d,#0c0f16);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));
  display:grid;place-items:center;color:#fff;box-shadow:0 0 18px rgba(194,65,12,.5)}
.brand b{font-size:15px;letter-spacing:.3px}
.brand small{display:block;color:var(--mut);font-size:11px;font-weight:500}
.live{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12px;flex:none}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}70%{box-shadow:0 0 0 9px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.nav{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;background:#0e121b;border-bottom:1px solid var(--line);position:sticky;top:55px;z-index:40}
.nav button{flex:none;white-space:nowrap;display:flex;align-items:center;gap:7px;background:var(--panel);
  color:var(--mut);border:1px solid var(--line);border-radius:9px;padding:8px 13px;font-size:13px;font-weight:600;
  font-family:inherit;cursor:pointer;transition:.15s}
.nav button:hover{color:var(--ink);border-color:var(--acc2)}
.nav button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(194,65,12,.35)}
.nav .idx{font-size:11px;opacity:.7}
.wrap{padding:18px 16px 46px;max-width:1360px;margin:0 auto}
.head{display:flex;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.head h2{font-size:20px;font-weight:800}
.head p{color:var(--mut);font-size:13px}
.tag{margin-left:auto;flex:none;font-size:12px;color:var(--acc2);border:1px solid var(--acc);border-radius:20px;padding:4px 12px;background:rgba(194,65,12,.1)}
.g{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g23{grid-template-columns:2fr 1fr}
@media(max-width:820px){.g2,.g3,.g4,.g23{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{font-size:14px;font-weight:700;margin-bottom:2px;display:flex;align-items:center;gap:8px}
.card .sub{color:var(--dim);font-size:12px;margin-bottom:12px}
.kpi{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:15px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-16px;top:-16px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,rgba(251,146,60,.16),transparent 70%)}
.kpi .lab{color:var(--mut);font-size:12px;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:27px;font-weight:800;margin-top:6px;letter-spacing:.5px}
.kpi .val small{font-size:13px;color:var(--mut);font-weight:600;margin-left:3px}
.kpi .delta{font-size:12px;margin-top:5px;font-weight:600;display:flex;align-items:center;gap:3px}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--warn)}
.chart{width:100%;height:260px}
.chart.sm{height:200px}
table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
th{text-align:left;color:var(--dim);font-weight:600;font-size:12px;padding:9px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid #1e2534;color:var(--ink)}
tr:last-child td{border-bottom:none}
tr:hover td{background:#181f2c}
.mono{font-family:"Inter",monospace;font-weight:600;letter-spacing:.3px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.p-ok{background:rgba(34,197,94,.14);color:#4ade80}
.p-warn{background:rgba(251,191,36,.15);color:#fcd34d}
.p-bad{background:rgba(239,68,68,.15);color:#f87171}
.p-info{background:rgba(56,189,248,.14);color:#7dd3fc}
.p-acc{background:rgba(251,146,60,.16);color:#fdba74}
.p-mut{background:#232b3a;color:var(--mut)}
.bar{height:7px;border-radius:5px;background:#232b3a;overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.board{display:grid;gap:12px}
.wo{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc2);border-radius:9px;padding:10px;margin-bottom:9px}
.gantt{min-width:640px}
.grow{display:grid;grid-template-columns:150px 1fr;align-items:center;border-bottom:1px solid #1e2534}
.grow:last-child{border-bottom:none}
.gname{padding:9px 8px;font-size:12px}
.gname b{display:block;font-weight:700}.gname span{color:var(--dim);font-size:11px}
.gtrack{position:relative;height:44px}
.gbar{position:absolute;top:11px;height:22px;border-radius:6px;display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:700;color:#1a1206;overflow:hidden}
.ghdr{display:grid;grid-template-columns:150px 1fr;border-bottom:1px solid var(--line);color:var(--dim);font-size:11px}
.gscale{display:grid;grid-template-columns:repeat(8,1fr)}
.gscale span{padding:6px 4px;border-left:1px solid #1e2534;text-align:center}
.matx{min-width:620px;border-collapse:separate;border-spacing:0}
.matx td,.matx th{text-align:center;padding:8px 6px}
.matx td:first-child,.matx th:first-child{text-align:left}
.cell{width:26px;height:26px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;margin:auto}
.c-ok{background:rgba(34,197,94,.16);color:#4ade80}
.c-no{background:rgba(239,68,68,.16);color:#f87171}
.c-part{background:rgba(251,191,36,.16);color:#fcd34d}
.feed{position:relative;padding-left:22px}
.feed::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.fi{position:relative;padding:0 0 15px}
.fi::before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--acc2);border:2px solid var(--bg);box-shadow:0 0 0 2px var(--line)}
.fi.ok::before{background:var(--ok)}.fi.bad::before{background:var(--bad)}
.fi .ft{font-size:13px;font-weight:700}
.fi .fm{color:var(--mut);font-size:12px;margin-top:2px}
.fi .fw{color:var(--dim);font-size:11px;margin-top:3px}
.stat{background:linear-gradient(155deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:13px;padding:14px}
.stat .sn{font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.stat .sw{font-size:12px;color:var(--acc2);font-weight:700;margin-top:6px}
.stat .op{color:var(--mut);font-size:12px;margin-top:3px}
.stat .rng{margin-top:10px}
.stat .rng .bar{height:9px}
.stat .num{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:5px}
.led{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;animation:pulse 2.4s infinite}
.led.g{background:var(--ok)}.led.y{background:var(--warn)}.led.r{background:var(--bad)}
.ai{background:linear-gradient(120deg,rgba(194,65,12,.12),rgba(251,146,60,.06));border:1px solid rgba(251,146,60,.3);border-radius:13px;padding:14px;display:flex;gap:11px}
.ai .material-symbols-outlined{color:var(--acc2);flex:none}
.ai b{color:var(--acc2)}
.ai p{font-size:13px;color:var(--ink);line-height:1.55}
.lg{list-style:none}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #1e2534;font-size:13px}
.li:last-child{border-bottom:none}
.li .ic{width:34px;height:34px;border-radius:9px;background:var(--panel2);display:grid;place-items:center;flex:none}
.li .gg{margin-left:auto;text-align:right;font-size:12px;color:var(--mut)}
.donutwrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.legend{font-size:12px;color:var(--mut)}
.legend div{display:flex;align-items:center;gap:7px;padding:4px 0}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.overx{overflow-x:auto}
.mini{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:11px;color:var(--mut);background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:4px 9px}
@media(max-width:560px){.nav button .tx{display:none}.nav button{padding:9px}}
</style>
</head>
<body>
<div class="top">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">precision_manufacturing</span></div>
    <div><b>生產工單管理</b><small>MES 製造執行終端 · 第二廠</small></div>
  </div>
  <div class="live"><span class="dot"></span>現場連線中 · 08:42 更新</div>
</div>
<nav class="nav" id="nav"></nav>
<div class="wrap"><div id="view"></div></div>

<script>
var charts=[];
function disposeCharts(){charts.forEach(function(c){try{c.dispose();}catch(e){}});charts=[];}
function mk(el,opt){if(!el)return;var c=echarts.init(el,null,{renderer:"canvas"});c.setOption(opt);charts.push(c);return c;}
var AX={axisLine:{lineStyle:{color:"#3a4456"}},axisLabel:{color:"#8b98ad"},splitLine:{lineStyle:{color:"#1e2534"}}};
var GRID={left:44,right:16,top:28,bottom:30};

function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function head(t,p,tag){return '<div class="head"><div><h2>'+t+'</h2><p>'+p+'</p></div><span class="tag">'+tag+'</span></div>';}
function kpi(ic,lab,val,unit,cls,delta){
  var arrow=cls==="up"?"trending_up":cls==="down"?"trending_down":"trending_flat";
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined" style="font-size:17px;color:#fb923c">'+ic+'</span>'+lab+'</div>'+
    '<div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'+
    '<div class="delta '+cls+'"><span class="material-symbols-outlined" style="font-size:15px">'+arrow+'</span>'+delta+'</div></div>';
}

/* ---------- Screen 0: 訂單轉工單 ---------- */
function s0(v){
  var orders=[
    {ord:"SO-24107",cust:"O達精機",prod:"齒輪箱總成 GX-40",qty:1200,due:"07/21",wo:3,st:"已拆單",stc:"p-ok"},
    {ord:"SO-24108",cust:"鼎O電子",prod:"散熱模組 HS-12",qty:800,due:"07/24",wo:2,st:"拆單中",stc:"p-acc"},
    {ord:"SO-24109",cust:"台O扣件",prod:"精密螺帽 M8",qty:5000,due:"07/26",wo:4,st:"已拆單",stc:"p-ok"},
    {ord:"SO-24110",cust:"長O塑膠",prod:"外殼射出件 C7",qty:2400,due:"07/28",wo:0,st:"待拆單",stc:"p-warn"},
    {ord:"SO-24111",cust:"聯O食品",prod:"包裝托盤 P-20",qty:3200,due:"07/30",wo:0,st:"待拆單",stc:"p-warn"},
    {ord:"SO-24112",cust:"O暘光電",prod:"背板結構件 B9",qty:900,due:"08/02",wo:2,st:"已拆單",stc:"p-ok"}
  ];
  var rows=orders.map(function(o){
    return '<tr><td class="mono">'+o.ord+'</td><td>'+esc(o.cust)+'</td><td>'+esc(o.prod)+'</td>'+
    '<td class="mono">'+o.qty.toLocaleString()+'</td><td>'+o.due+'</td>'+
    '<td>'+(o.wo>0?'<span class="pill p-info">'+o.wo+' 張</span>':'<span class="pill p-mut">—</span>')+'</td>'+
    '<td><span class="pill '+o.stc+'">'+o.st+'</span></td></tr>';
  }).join("");
  v.innerHTML=
  head("訂單轉工單","接單依製程拆解為工單，設定數量、交期與物料需求","本週待轉 5 筆")+
  '<div class="g g4" style="margin-bottom:14px">'+
    kpi("today","本日新進訂單","12","筆","up","+3 vs 昨日")+
    kpi("call_split","已拆解工單","34","張","up","齊套率 78%")+
    kpi("pending_actions","待拆單訂單","5","筆","flat","含 2 筆急單")+
    kpi("schedule","平均拆單工時","1.5","小時","up","−4.5 小時")+
  '</div>'+
  '<div class="g g23" style="margin-bottom:14px">'+
    '<div class="card"><h3><span class="material-symbols-outlined">receipt_long</span>訂單轉工單看板</h3><div class="sub">依交期排序，急單優先拆解派產</div>'+
      '<div class="overx"><table><thead><tr><th>訂單號</th><th>客戶</th><th>產品</th><th>數量</th><th>交期</th><th>工單</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>工單來源分布</h3><div class="sub">本月工單依訂單類型</div><div id="c0a" class="chart sm"></div></div>'+
  '</div>'+
  '<div class="g g2">'+
    '<div class="card"><h3><span class="material-symbols-outlined">insights</span>每日訂單轉工單量</h3><div class="sub">近 7 日訂單數與拆出工單數</div><div id="c0b" class="chart sm"></div></div>'+
    '<div class="ai"><span class="material-symbols-outlined">auto_awesome</span><div><b>AI 拆單建議</b><p>SO-24110 外殼射出件交期 07/28，需連動 C7 模具與塑膠原料，建議今日完成拆單並預留 3 天前置。SO-24111 與既有托盤工單可合併排產，節省換線 2 次。</p></div></div>'+
  '</div>';
  void v.offsetHeight;
  mk(document.getElementById("c0a"),{tooltip:{trigger:"item"},legend:{show:false},
    series:[{type:"pie",radius:["48%","74%"],center:["50%","50%"],label:{color:"#c8d2e0",fontSize:11},
      data:[{value:18,name:"標準量產",itemStyle:{color:"#c2410c"}},{value:9,name:"急單插單",itemStyle:{color:"#fb923c"}},
        {value:5,name:"客製工單",itemStyle:{color:"#38bdf8"}},{value:2,name:"重工返修",itemStyle:{color:"#fbbf24"}}]}]});
  mk(document.getElementById("c0b"),{tooltip:{trigger:"axis"},legend:{textStyle:{color:"#8b98ad"},top:0},grid:GRID,
    xAxis:{type:"category",data:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],axisLine:AX.axisLine,axisLabel:AX.axisLabel},
    yAxis:{type:"value",axisLabel:AX.axisLabel,splitLine:AX.splitLine},
    series:[{name:"訂單",type:"bar",data:[9,12,10,14,12,6,4],itemStyle:{color:"#334155",borderRadius:[4,4,0,0]},barWidth:12},
      {name:"工單",type:"line",smooth:true,data:[22,31,26,38,34,15,9],lineStyle:{color:"#fb923c",width:3},itemStyle:{color:"#fb923c"},areaStyle:{color:"rgba(251,146,60,.12)"}}]});
}

/* ---------- Screen 1: 排產派工 (Gantt) ---------- */
function s1(v){
  var lines=[
    {n:"沖壓一線",c:"CNC-01",bars:[{s:0,w:2.2,t:"WO-01",col:"#c2410c"},{s:2.4,w:1.6,t:"WO-07",col:"#fb923c"}]},
    {n:"沖壓二線",c:"CNC-02",bars:[{s:0.5,w:1.8,t:"WO-02",col:"#fb923c"},{s:2.6,w:2.4,t:"WO-11",col:"#c2410c"}]},
    {n:"組裝一線",c:"ASM-01",bars:[{s:1,w:3,t:"WO-03",col:"#c2410c"},{s:4.2,w:1.4,t:"WO-14",col:"#fb923c"}]},
    {n:"組裝二線",c:"ASM-02",bars:[{s:0,w:2.6,t:"WO-04",col:"#fb923c"},{s:3,w:2,t:"WO-09",col:"#c2410c"}]},
    {n:"包裝線",c:"PKG-01",bars:[{s:2,w:1.2,t:"WO-05",col:"#38bdf8"},{s:3.5,w:2.5,t:"WO-12",col:"#c2410c"}]},
    {n:"品檢站",c:"QC-01",bars:[{s:3,w:1,t:"WO-05",col:"#fbbf24"},{s:5,w:1.4,t:"WO-03",col:"#fbbf24"}]}
  ];
  var hours=["08","09","10","11","12","13","14","15"];
  var grows=lines.map(function(l){
    var bars=l.bars.map(function(b){
      var left=(b.s/8*100).toFixed(1),wd=(b.w/8*100).toFixed(1);
      return '<div class="gbar" style="left:'+left+'%;width:'+wd+'%;background:linear-gradient(90deg,'+b.col+','+b.col+'cc)" title="'+b.t+'">'+b.t+'</div>';
    }).join("");
    return '<div class="grow"><div class="gname"><b>'+l.n+'</b><span>'+l.c+'</span></div><div class="gtrack">'+bars+'</div></div>';
  }).join("");
  var scale=hours.map(function(h){return '<span>'+h+':00</span>';}).join("");
  v.innerHTML=
  head("排產派工","依產能負載與交期把工單排入產線甘特並派工","6 條產線 · 12 張在排")+
  '<div class="g g4" style="margin-bottom:14px">'+
    kpi("view_timeline","今日排入工單","12","張","up","覆蓋 6 產線")+
    kpi("speed","平均產線負載","82","%","flat","峰值 CNC-01 96%")+
    kpi("event_available","準時可交","10","/12","up","2 張需趕工")+
    kpi("bolt","換線次數","7","次","down","−3 較上週")+
  '</div>'+
  '<div class="card" style="margin-bottom:14px"><h3><span class="material-symbols-outlined">calendar_view_week</span>產線排程甘特</h3><div class="sub">今日 08:00–16:00 派工時序，色塊為工單佔用時段</div>'+
    '<div class="overx"><div class="gantt"><div class="ghdr"><div style="padding:6px 8px">產線 / 設備</div><div class="gscale">'+scale+'</div></div>'+grows+'</div></div>'+
    '<div class="mini" style="margin-top:12px"><span class="chip"><span class="led g"></span>正常排產</span><span class="chip"><span class="led y"></span>品檢排隊</span><span class="chip"><span class="led r"></span>負載超載</span></div></div>'+
  '<div class="g g2">'+
    '<div class="card"><h3><span class="material-symbols-outlined">stacked_bar_chart</span>各產線產能負載</h3><div class="sub">已排 vs 剩餘工時 (小時)</div><div id="c1a" class="chart sm"></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">groups</span>今日派工名單</h3><div class="sub">工單指派負責人與產線</div>'+dispatchList()+'</div>'+
  '</div>';
  void v.offsetHeight;
  mk(document.getElementById("c1a"),{tooltip:{trigger:"axis",axisPointer:{type:"shadow"}},legend:{textStyle:{color:"#8b98ad"},top:0},grid:GRID,
    xAxis:{type:"category",data:["沖壓一","沖壓二","組裝一","組裝二","包裝","品檢"],axisLine:AX.axisLine,axisLabel:AX.axisLabel},

      label:{show:true,position:"right",color:"#c8d2e0",formatter:"{c}%"}}]});
}

var SCREENS=[
  {icon:"assignment_add",name:"訂單轉工單",fn:s0},
  {icon:"view_timeline",name:"排產派工",fn:s1},
  {icon:"inventory_2",name:"料況齊套",fn:s2},
  {icon:"precision_manufacturing",name:"現場報工",fn:s3},
  {icon:"fact_check",name:"品檢判定",fn:s4},
  {icon:"warehouse",name:"允收入庫",fn:s5}
];

var nav=document.getElementById("nav");
nav.innerHTML=SCREENS.map(function(s,i){
  return '<button data-i="'+i+'"><span class="material-symbols-outlined" style="font-size:18px">'+s.icon+'</span><span class="tx">'+s.name+'</span><span class="idx">v'+i+'</span></button>';
}).join("");
var view=document.getElementById("view");
function show(i){
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  disposeCharts();
  var btns=nav.querySelectorAll("button");
  btns.forEach(function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i);});
  SCREENS[i].fn(view);
}
nav.addEventListener("click",function(e){
  var b=e.target.closest("button[data-i]");if(!b)return;show(+b.getAttribute("data-i"));
  try{window.scrollTo(0,0);}catch(err){}
});
window.addEventListener("resize",function(){charts.forEach(function(c){try{c.resize();}catch(e){}});});
show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
