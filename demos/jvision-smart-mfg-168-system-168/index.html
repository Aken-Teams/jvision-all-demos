<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>關鍵零組件庫存協同平台</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
  :root{
    --accent:#c2410c; --accent2:#fb923c; --accent-soft:#fff3ec;
    --ink:#1c1917; --sub:#78716c; --line:#eee2da; --bg:#faf6f2; --card:#ffffff;
    --ok:#15803d; --ok-bg:#dcfce7; --warn:#b45309; --warn-bg:#fef3c7; --bad:#b91c1c; --bad-bg:#fee2e2;
    --shadow:0 1px 2px rgba(28,25,23,.05),0 8px 24px rgba(194,65,12,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;line-height:1.55;
  }
  .msi{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
  .app{display:flex;min-height:100vh;min-width:0;}
  .side{
    width:240px;flex-shrink:0;background:#3b1a0c;color:#fde8db;display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;
  }
  .brand{padding:20px 18px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08);}
  .brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
  .brand .logo .msi{font-size:22px;}
  .brand b{font-family:"Noto Sans TC";font-weight:900;font-size:15px;display:block;color:#fff;letter-spacing:.3px;}
  .brand span{font-size:11px;color:#e0a483;}
  nav{padding:12px 10px;display:flex;flex-direction:column;gap:3px;flex-wrap:wrap;overflow:auto;}
  nav button{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;cursor:pointer;
    background:transparent;color:#f0d3c2;padding:11px 12px;border-radius:10px;font-family:"Noto Sans TC";
    font-size:13.5px;font-weight:500;min-width:0;transition:background .12s;
  }
  nav button .msi{font-size:20px;flex-shrink:0;color:#e79b6e;}
  nav button:hover{background:rgba(255,255,255,.06);}
  nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(194,65,12,.35);}
  nav button.on .msi{color:#fff;}
  nav .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .side-foot{margin-top:auto;padding:14px 16px;font-size:11px;color:#c98a63;border-top:1px solid rgba(255,255,255,.08);}
  main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .top{
    background:var(--card);border-bottom:1px solid var(--line);padding:16px 26px;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:20;
  }
  .top h1{font-family:"Noto Sans TC";font-size:18px;font-weight:900;margin:0;min-width:0;}
  .top .crumb{font-size:12px;color:var(--sub);margin-top:2px;}
  .top .sp{flex:1;min-width:0;}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border:1px solid #f7d3bd;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;}
  .chip .msi{font-size:15px;}
  .wrap{padding:22px 26px 40px;min-width:0;}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px;box-shadow:var(--shadow);min-width:0;position:relative;overflow:hidden;}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--accent),var(--accent2));}
  .kpi .lab{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px;font-weight:600;}
  .kpi .lab .msi{font-size:16px;color:var(--accent);}
  .kpi .val{font-size:26px;font-weight:800;margin-top:7px;font-family:"Inter";letter-spacing:-.5px;}
  .kpi .val small{font-size:13px;font-weight:600;color:var(--sub);margin-left:3px;}
  .kpi .delta{font-size:11.5px;margin-top:4px;font-weight:600;}
  .up{color:var(--ok);}.down{color:var(--bad);}
  .grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start;}
  .grid2b{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;}
  .split{display:grid;grid-template-columns:360px 1fr;gap:18px;align-items:start;}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0;overflow:hidden;}
  .panel .ph{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;}
  .panel .ph h3{font-family:"Noto Sans TC";font-size:14.5px;font-weight:700;margin:0;min-width:0;}
  .panel .ph .msi{font-size:19px;color:var(--accent);}
  .panel .ph .tag{margin-left:auto;font-size:11px;color:var(--sub);font-weight:600;flex-shrink:0;}
  .pb{padding:16px;min-width:0;}
  .chart{overflow:hidden;min-width:0;}
  .list{display:flex;flex-direction:column;max-height:560px;overflow:auto;}
  .li{padding:13px 15px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:11px;align-items:flex-start;min-width:0;}
  .li:hover{background:var(--accent-soft);}
  .li.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent);}
  .li .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex-shrink:0;}
  .li .body{min-width:0;flex:1;}
  .li .t{font-weight:700;font-size:13.5px;font-family:"Noto Sans TC";display:flex;gap:8px;align-items:center;min-width:0;}
  .li .t code{font-family:"Inter";font-size:11px;color:var(--sub);font-weight:600;flex-shrink:0;}
  .li .m{font-size:11.5px;color:var(--sub);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
  th{font-size:11.5px;color:var(--sub);font-weight:700;background:#fbf6f2;font-family:"Noto Sans TC";}
  td{font-family:"Noto Sans TC";}
  tbody tr:hover{background:#fdf8f4;}
  .num{font-family:"Inter";font-variant-numeric:tabular-nums;text-align:right;}
  .bar-cell{min-width:120px;}
  .mini{height:7px;border-radius:99px;background:#f0e5dc;overflow:hidden;}
  .mini i{display:block;height:100%;border-radius:99px;}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;font-family:"Noto Sans TC";}
  .b-ok{background:var(--ok-bg);color:var(--ok);}
  .b-warn{background:var(--warn-bg);color:var(--warn);}
  .b-bad{background:var(--bad-bg);color:var(--bad);}
  .b-info{background:#e0f2fe;color:#0369a1;}
  .b-mut{background:#f5f5f4;color:#78716c;}
  .dcard{padding:18px;}
  .dhead{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px;}
  .dhead .ic{width:46px;height:46px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .dhead .ic .msi{font-size:26px;}
  .dhead h2{font-family:"Noto Sans TC";font-size:19px;margin:0;font-weight:900;}
  .dhead .sub{font-size:12.5px;color:var(--sub);margin-top:3px;}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
  .field{background:#fbf6f2;border:1px solid var(--line);border-radius:10px;padding:11px 13px;min-width:0;}
  .field .k{font-size:11px;color:var(--sub);font-weight:600;}
  .field .v{font-size:14px;font-weight:700;font-family:"Noto Sans TC";margin-top:3px;overflow:hidden;text-overflow:ellipsis;}
  .field .v.big{font-family:"Inter";font-size:19px;letter-spacing:-.3px;}
  .tl{position:relative;padding-left:22px;}
  .tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line);}
  .tl .it{position:relative;padding:0 0 16px 6px;}
  .tl .it::before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent-soft);}
  .tl .it .tt{font-weight:700;font-size:13px;font-family:"Noto Sans TC";}
  .tl .it .td{font-size:11.5px;color:var(--sub);margin-top:2px;}
  .tl .it .tm{font-size:11px;color:var(--accent);font-weight:600;font-family:"Inter";}
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start;}
  .col{background:#fbf6f2;border:1px solid var(--line);border-radius:12px;padding:11px;min-width:0;}
  .col > .h{font-size:12px;font-weight:700;font-family:"Noto Sans TC";display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 3px;}
  .col > .h .cnt{background:#fff;border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:11px;color:var(--sub);}
  .task{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(0,0,0,.03);min-width:0;}
  .task .tk{font-weight:700;font-size:12.5px;font-family:"Noto Sans TC";overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .task .tp{font-size:11px;color:var(--sub);margin-top:4px;display:flex;justify-content:space-between;gap:8px;}
  .cbar{height:5px;border-radius:99px;background:#eee2da;margin-top:8px;overflow:hidden;}
  .cbar i{display:block;height:100%;}
  .simrow{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:11px;margin-bottom:10px;background:#fff;min-width:0;flex-wrap:wrap;}
  .simrow .nm{font-weight:700;font-size:13px;font-family:"Noto Sans TC";min-width:0;}
  .simrow .rng{flex:1;min-width:120px;}
  input[type=range]{width:100%;accent-color:var(--accent);}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:10px;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}
  .note{font-size:12px;color:var(--sub);background:#fbf6f2;border:1px dashed var(--line);border-radius:10px;padding:11px 13px;margin-top:6px;display:flex;gap:9px;}
  .note .msi{color:var(--accent);font-size:18px;flex-shrink:0;}
  .flowbar{display:flex;gap:0;align-items:stretch;flex-wrap:wrap;}
  .fstep{flex:1;min-width:120px;background:#fbf6f2;border:1px solid var(--line);border-radius:11px;padding:12px;margin:4px;position:relative;}
  .fstep .fn{font-size:11px;color:var(--accent);font-weight:700;}
  .fstep .ft{font-weight:700;font-size:13px;font-family:"Noto Sans TC";margin-top:3px;}
  .fstep .fr{font-size:11px;color:var(--sub);margin-top:3px;}
  h4.sec{font-family:"Noto Sans TC";font-size:13px;font-weight:700;margin:2px 0 10px;color:var(--ink);display:flex;align-items:center;gap:7px;}
  h4.sec .msi{font-size:17px;color:var(--accent);}
  @media(max-width:860px){
    .app{flex-direction:column;}
    .side{width:100%;height:auto;position:static;flex-direction:row;align-items:center;}
    .brand{border-bottom:0;border-right:1px solid rgba(255,255,255,.08);flex-shrink:0;}
    nav{flex-direction:row;flex:1;overflow-x:auto;padding:8px;}
    nav button{width:auto;white-space:nowrap;}
    .side-foot{display:none;}
    .split{grid-template-columns:1fr;}
    .list{max-height:340px;}
  }
  @media(max-width:820px){
    .kpis{grid-template-columns:1fr 1fr;}
    .grid2,.grid2b{grid-template-columns:1fr;}
    .board{grid-template-columns:1fr 1fr;}
    .fields{grid-template-columns:1fr;}
    .wrap{padding:18px 15px 36px;}
    .top{padding:14px 16px;}
  }
  @media(max-width:560px){
    nav .txt{display:none;}
    nav button{padding:10px;}
    .kpis{grid-template-columns:1fr 1fr;}
    .board{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="msi">hub</span></div>
      <div style="min-width:0;">
        <b>零組件協同</b>
        <span>Critical Parts Collab</span>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">純 UI 展示 · 擬真資料<br/>供應鏈 · 關鍵料件協同</div>
  </aside>
  <main>
    <div class="top">
      <div style="min-width:0;">
        <h1 id="scr-title">關鍵料件庫存</h1>
        <div class="crumb"><span id="scr-crumb">庫存協同 · 可視化總覽</span></div>
      </div>
      <div class="sp"></div>
      <span class="chip"><span class="msi">verified</span>可視覆蓋率 86%</span>
      <span class="chip"><span class="msi">insights</span>預測準確度 91.4%</span>
    </div>
    <div class="wrap"><div id="view"></div></div>
  </main>
</div>

<script>
(function(){
  "use strict";
  var MODS=[
    {icon:"inventory_2",name:"關鍵料件庫存",crumb:"庫存協同 · 可視化總覽"},
    {icon:"insights",name:"需求預測協同",crumb:"需求預測 · 跨部門共享"},
    {icon:"factory",name:"供應商產能",crumb:"供應商 · 產能與交期回饋"},
    {icon:"warning",name:"缺料情境模擬",crumb:"風險 · 缺料情境推演"},
    {icon:"account_tree",name:"動態調度",crumb:"調度 · 跨廠調撥看板"},
    {icon:"verified",name:"協同成效追蹤",crumb:"成效 · 覆蓋率與準確度"}
  ];
  var charts=[];
  function clearCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
  function mk(id,opt){
    var el=document.getElementById(id);if(!el)return;
    opt.chart=opt.chart||{};
    opt.chart.redrawOnParentResize=false;opt.chart.redrawOnWindowResize=false;
    opt.chart.animations={enabled:false};opt.chart.toolbar={show:false};
    opt.chart.fontFamily="Inter, Noto Sans TC, sans-serif";
    try{var c=new ApexCharts(el,opt);c.render();charts.push(c);}catch(e){}
  }
  var ACC="#c2410c",ACC2="#fb923c",OK="#15803d",WARN="#f59e0b",BAD="#dc2626",BLU="#0ea5e9",GRY="#a8a29e";

  function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
  function barcell(pct,color){return '<div class="bar-cell"><div class="mini"><i style="width:'+pct+'%;background:'+color+'"></i></div></div>';}
  function coverColor(c){return c<70?BAD:(c<100?WARN:OK);}

  var PARTS=[
    {id:"IC-A83",name:"車用 MCU 控制晶片",spec:"32-bit / AEC-Q100",cat:"半導體",stock:1240,safe:1800,cover:52,eta:"48天",risk:"high",supplier:"NexSemi",fabs:["桃園廠","台中廠"]},
    {id:"PW-M21",name:"電源管理 IC",spec:"PMIC 12V",cat:"半導體",stock:5600,safe:4200,cover:118,eta:"21天",risk:"low",supplier:"VoltCore",fabs:["台中廠"]},
    {id:"SN-G07",name:"六軸慣性感測器",spec:"IMU / I2C",cat:"感測元件",stock:2100,safe:2600,cover:71,eta:"33天",risk:"mid",supplier:"MotionTek",fabs:["桃園廠"]},
    {id:"CN-B44",name:"高速板對板連接器",spec:"0.4mm 120pin",cat:"連接器",stock:8800,safe:6000,cover:132,eta:"14天",risk:"low",supplier:"LinkPro",fabs:["台中廠","高雄廠"]},
    {id:"MEM-D9",name:"LPDDR5 記憶體",spec:"8GB / 6400Mbps",cat:"記憶體",stock:920,safe:2400,cover:31,eta:"56天",risk:"high",supplier:"MemOne",fabs:["桃園廠"]},
    {id:"CAP-T2",name:"車規積層陶瓷電容",spec:"MLCC 10uF X7R",cat:"被動元件",stock:42000,safe:30000,cover:145,eta:"9天",risk:"low",supplier:"CapMax",fabs:["高雄廠"]},
    {id:"FPC-51",name:"軟性排線模組",spec:"FPC 0.3mm",cat:"連接器",stock:3300,safe:3600,cover:78,eta:"27天",risk:"mid",supplier:"FlexWire",fabs:["台中廠"]},
    {id:"OSC-19",name:"低相噪振盪器",spec:"TCXO 26MHz",cat:"時脈元件",stock:1550,safe:1500,cover:96,eta:"30天",risk:"mid",supplier:"ClockLab",fabs:["桃園廠","高雄廠"]}
  ];
  function riskBadge(r){
    if(r==="high")return '<span class="badge b-bad">高風險</span>';
    if(r==="mid")return '<span class="badge b-warn">中風險</span>';
    return '<span class="badge b-ok">安全</span>';
  }

  /* ============ SCREEN 0 : 關鍵料件庫存 (SPLIT signature) ============ */
  function v0(){
    var kpi=''+
      kpiCard("inventory_2","關鍵料件品項","148","項","up","可視覆蓋 86%")+
      kpiCard("warning","缺料風險品項","12","項","down","較上週 -3")+
      kpiCard("percent","平均庫存覆蓋","94","%","up","目標 100%")+
      kpiCard("schedule","平均補料交期","28","天","up","縮短 4 天");
    var rows="";
    for(var i=0;i<PARTS.length;i++){var p=PARTS[i];
      rows+='<div class="li'+(i===0?' on':'')+'" data-p="'+i+'" onclick="window.__pick('+i+')">'+
        '<span class="dot" style="background:'+(p.risk==="high"?BAD:p.risk==="mid"?WARN:OK)+'"></span>'+
        '<div class="body"><div class="t">'+esc(p.name)+' <code>'+p.id+'</code></div>'+
        '<div class="m">'+esc(p.cat)+' · '+esc(p.supplier)+' · 覆蓋 '+p.cover+'%</div></div>'+
        '<div style="flex-shrink:0;">'+riskBadge(p.risk)+'</div></div>';
    }
    return '<div class="kpis">'+kpi+'</div>'+
    '<div class="split">'+
      '<div class="panel"><div class="ph"><span class="msi">inventory_2</span><h3>關鍵料件清單</h3><span class="tag">8 / 148</span></div>'+
        '<div class="list">'+rows+'</div></div>'+
      '<div class="panel"><div class="ph"><span class="msi">description</span><h3>料件庫存詳情</h3><span class="tag" id="d-tag"></span></div>'+
        '<div id="detail"></div></div>'+
    '</div>';
  }
  function renderDetail(idx){
    var p=PARTS[idx];var el=document.getElementById("detail");if(!el)return;
    var tg=document.getElementById("d-tag");if(tg)tg.textContent=p.id;
    var days=["-5週","-4週","-3週","-2週","-1週","本週"];
    var hist=[];for(var k=5;k>=0;k--){hist.push(Math.round(p.stock*(1+(k*0.06))));}
    el.innerHTML='<div class="dcard">'+
      '<div class="dhead"><div class="ic"><span class="msi">memory</span></div>'+
        '<div style="min-width:0;"><h2>'+esc(p.name)+'</h2><div class="sub">'+esc(p.spec)+' · '+esc(p.cat)+'</div></div>'+
        '<div style="margin-left:auto;flex-shrink:0;">'+riskBadge(p.risk)+'</div></div>'+
      '<div class="fields">'+
        field("目前庫存",p.stock.toLocaleString()+" 顆",true)+
        field("安全庫存",p.safe.toLocaleString()+" 顆",true)+
        field("庫存覆蓋率",p.cover+" %",true)+
        field("補料交期",p.eta,false)+
        field("主要供應商",p.supplier,false)+
        field("供應廠區",p.fabs.join("、"),false)+
      '</div>'+
      '<h4 class="sec"><span class="msi">show_chart</span>近 6 週庫存水位</h4>'+

      {n:"S5",t:"動態調度",r:"採購"}
    ];
    var flow=stages.map(function(s){return '<div class="fstep"><div class="fn">'+s.n+'</div><div class="ft">'+esc(s.t)+'</div><div class="fr">'+esc(s.r)+'</div></div>';}).join("");
    return '<div class="kpis">'+kpi+'</div>'+
    '<div class="grid2">'+
      '<div class="panel"><div class="ph"><span class="msi">trending_up</span><h3>可視覆蓋率與準確度趨勢</h3></div>'+
        '<div class="pb"><div class="chart" id="c5a" style="height:280px;"></div></div></div>'+
      '<div class="panel"><div class="ph"><span class="msi">radar</span><h3>協同成熟度評估</h3></div>'+
        '<div class="pb"><div class="chart" id="c5b" style="height:280px;"></div></div></div>'+
    '</div>'+
    '<div class="panel" style="margin-top:18px;"><div class="ph"><span class="msi">flag</span><h3>導入效益對照</h3><span class="tag">導入前 → 導入後</span></div>'+
      '<div style="overflow-x:auto;"><table><thead><tr><th>指標</th><th class="num">導入前</th><th class="num">導入後</th><th class="bar-cell">達成</th><th class="num">改善</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
    '<div class="panel" style="margin-top:18px;"><div class="ph"><span class="msi">conversion_path</span><h3>協同運作流程</h3></div>'+
      '<div class="pb"><div class="flowbar">'+flow+'</div></div></div>';
  }
  function initV5(){
    mk("c5a",{
      chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"line",height:280},
      series:[
        {name:"可視覆蓋率 %",data:[41,52,63,71,80,86]},
        {name:"預測準確度 %",data:[85.2,87,88.4,89.6,90.5,91.4]},
        {name:"準時到貨率 %",data:[82,85,89,92,96,99]}
      ],
      colors:[ACC,ACC2,BLU],
      stroke:{width:2,curve:"smooth"},
      dataLabels:{enabled:false},
      xaxis:{categories:["第1週","第2週","第3週","第4週","第5週","第6週"],labels:{style:{fontSize:"11px"}}},
      yaxis:{min:40,max:100,labels:{style:{fontSize:"11px"},formatter:function(v){return Math.round(v)+"%";}}},
      legend:{position:"top",horizontalAlign:"right",fontSize:"11px"},
      grid:{borderColor:"#f0e5dc",strokeDashArray:4},
      markers:{size:3}
    });
    mk("c5b",{
      chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"radar",height:280},
      series:[{name:"目前",data:[86,91,88,82,90]},{name:"目標",data:[95,95,95,95,95]}],
      colors:[ACC,GRY],
      stroke:{width:2},
      fill:{opacity:0.12},
      markers:{size:3},
      xaxis:{categories:["庫存可視","預測準確","供應協同","情境模擬","動態調度"],labels:{style:{fontSize:"10px"}}},
      yaxis:{show:false,max:100},
      legend:{position:"top",horizontalAlign:"right",fontSize:"11px"}
    });
  }

  /* ===== helpers ===== */
  function kpiCard(icon,label,val,unit,dir,delta){
    return '<div class="kpi"><div class="lab"><span class="msi">'+icon+'</span>'+esc(label)+'</div>'+
      '<div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'+
      '<div class="delta '+(dir==="up"?"up":"down")+'">'+(dir==="up"?'▲ ':'▼ ')+esc(delta)+'</div></div>';
  }
  function field(k,v,big){return '<div class="field"><div class="k">'+esc(k)+'</div><div class="v'+(big?' big':'')+'">'+esc(v)+'</div></div>';}
  function tlItem(tm,tt,td){return '<div class="it"><div class="tm">'+tm+'</div><div class="tt">'+esc(tt)+'</div><div class="td">'+esc(td)+'</div></div>';}

  var SCREENS=[v0,v1,v2,v3,v4,v5];
  var INITS=[function(){renderDetail(0);},initV1,initV2,initV3,initV4,initV5];

  var navEl=document.getElementById("nav");
  var navHtml="";
  for(var i=0;i<MODS.length;i++){
    navHtml+='<button data-i="'+i+'" onclick="window.__go('+i+')"><span class="msi">'+MODS[i].icon+'</span><span class="txt">'+esc(MODS[i].name)+'</span></button>';
  }
  navEl.innerHTML=navHtml;

  function show(i){
    clearCharts();
    var container=document.getElementById("view");
    container.innerHTML=SCREENS[i]();
    document.getElementById("scr-title").textContent=MODS[i].name;
    document.getElementById("scr-crumb").textContent=MODS[i].crumb;
    var btns=document.querySelectorAll("[data-i]");
    for(var k=0;k<btns.length;k++){btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i);}
    void container.offsetHeight;
    INITS[i]();
  }
  window.__go=function(i){location.hash="v"+i;};

  function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
  window.addEventListener("hashchange",fromHash);fromHash();
})();
</script>
</body>
</html>
