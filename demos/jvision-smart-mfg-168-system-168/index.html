<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>關鍵零組件庫存協同平台</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,600,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --sub:#475569;
  --bg:#F8FAFC;
  --card:#FFFFFF;
  --ok:#166534;
  --ok-bg:#DCFCE7;
  --warn:#92400E;
  --warn-bg:#FEF3C7;
  --bad:#B91C1C;
  --bad-bg:#FEE2E2;
  --shadow:6px 6px 0 #1E293B;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
html,body{margin:0;min-height:100%}
body{
  background-color:var(--color-background);
  background-image:
    linear-gradient(rgba(37,99,235,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(37,99,235,.055) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--color-foreground);
  font-family:"Fira Sans",sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased
}
button,input{font:inherit}
button,[onclick],input[type=range]{cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px
}
.msi{
  font-family:"Material Symbols Outlined";
  font-style:normal;
  font-weight:600;
  line-height:1;
  vertical-align:middle
}
.app{display:flex;min-height:100vh;min-width:0}
.side{
  position:sticky;
  top:0;
  z-index:30;
  width:264px;
  height:100vh;
  flex:0 0 264px;
  display:flex;
  flex-direction:column;
  color:#fff;
  background:#172033;
  border-right:4px solid var(--ink)
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-height:92px;
  padding:16px;
  border-bottom:4px solid var(--ink);
  background:var(--color-primary)
}
.logo{
  width:48px;
  height:48px;
  flex:none;
  display:grid;
  place-items:center;
  background:var(--color-accent);
  color:#000;
  border:3px solid var(--ink);
  box-shadow:4px 4px 0 var(--ink)
}
.logo .msi{font-size:27px}
.brand b{
  display:block;
  color:#fff;
  font-size:16px;
  font-weight:700;
  letter-spacing:.03em
}
.brand span:not(.msi){
  color:#DBEAFE;
  font-family:"Fira Code",monospace;
  font-size:10px
}
nav{
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:14px;
  overflow:auto
}
nav button{
  width:100%;
  min-height:48px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 12px;
  border:2px solid #94A3B8;
  border-radius:0;
  color:#E2E8F0;
  background:transparent;
  text-align:left;
  font-weight:600
}
nav button .msi{font-size:21px;color:#93C5FD}
nav button:hover{background:#24314A;color:#fff}
nav button.on{
  position:relative;
  left:6px;
  background:var(--color-accent);
  border-color:#fff;
  color:#000;
  box-shadow:-6px 6px 0 #fff
}
nav button.on .msi{color:#000}
.txt{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}
.side-foot{
  margin-top:auto;
  padding:16px;
  border-top:2px solid #64748B;
  color:#CBD5E1;
  font-family:"Fira Code",monospace;
  font-size:10px;
  line-height:1.7
}
main{min-width:0;flex:1}
.top{
  position:sticky;
  top:0;
  z-index:20;
  min-height:92px;
  display:flex;
  align-items:center;
  gap:14px;
  padding:15px 28px;
  background:rgba(248,250,252,.97);
  border-bottom:4px solid var(--ink)
}
.top h1{
  margin:0;
  font-size:clamp(19px,2vw,25px);
  font-weight:700;
  letter-spacing:-.02em
}
.crumb{
  margin-top:3px;
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:11px
}
.sp{flex:1}
.chip{
  min-height:38px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:7px 10px;
  background:#fff;
  border:2px solid var(--ink);
  color:var(--ink);
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
  box-shadow:3px 3px 0 var(--color-primary)
}
.chip .msi{font-size:17px;color:var(--color-primary)}
.wrap{min-width:0;max-width:1600px;padding:28px 30px 52px}
.kpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:16px;
  margin-bottom:24px
}
.kpi{
  position:relative;
  min-width:0;
  min-height:146px;
  padding:17px;
  overflow:hidden;
  background:var(--card);
  border:3px solid var(--ink);
  box-shadow:var(--shadow)
}
.kpi:nth-child(2n){transform:translateY(8px)}
.kpi::after{
  content:"";
  position:absolute;
  right:-26px;
  bottom:-28px;
  width:76px;
  height:76px;
  background:var(--color-muted);
  border:3px solid var(--ink);
  transform:rotate(18deg)
}
.kpi .lab{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--muted);
  font-size:12px;
  font-weight:700
}
.kpi .lab .msi{font-size:19px;color:var(--color-primary)}
.kpi .val{
  position:relative;
  z-index:1;
  margin-top:10px;
  font-family:"Fira Code",monospace;
  font-size:28px;
  font-weight:700;
  letter-spacing:-.06em
}
.kpi .val small{
  margin-left:5px;
  color:var(--muted);
  font-family:"Fira Sans",sans-serif;
  font-size:12px;
  letter-spacing:0
}
.delta{
  position:relative;
  z-index:1;
  margin-top:6px;
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:700
}
.up{color:#166534}
.down{color:#B91C1C}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr);gap:22px;align-items:start}
.grid2b{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;align-items:start}
.split{display:grid;grid-template-columns:370px minmax(0,1fr);gap:22px;align-items:start}
.panel{
  min-width:0;
  overflow:hidden;
  background:var(--card);
  border:3px solid var(--ink);
  box-shadow:var(--shadow)
}
.ph{
  min-height:54px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 15px;
  background:var(--color-muted);
  border-bottom:3px solid var(--ink)
}
.ph h3{min-width:0;margin:0;font-size:15px;font-weight:700}
.ph .msi{font-size:21px;color:var(--color-primary)}
.ph .tag{
  margin-left:auto;
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:600;
  white-space:nowrap
}
.pb{min-width:0;padding:17px}
.chart{min-width:0;overflow:hidden}
.list{display:flex;max-height:600px;flex-direction:column;overflow:auto}
.li{
  min-width:0;
  display:flex;
  align-items:flex-start;
  gap:11px;
  padding:14px;
  border-bottom:2px solid var(--line);
  cursor:pointer
}
.li:hover{background:#EFF6FF}
.li.on{
  background:#DBEAFE;
  box-shadow:inset 7px 0 0 var(--color-primary)
}
.li .dot{
  width:11px;
  height:11px;
  margin-top:6px;
  flex:none;
  border:2px solid var(--ink);
  border-radius:50%
}
.li .body{min-width:0;flex:1}
.li .t{
  min-width:0;
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  font-weight:700
}
.li .t code,.tm{
  color:var(--color-primary);
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:700
}
.li .m{
  margin-top:4px;
  overflow:hidden;
  color:var(--muted);
  font-size:11px;
  text-overflow:ellipsis;
  white-space:nowrap
}
table{
  width:100%;
  min-width:560px;
  border-collapse:collapse;
  font-size:13px
}
th,td{
  padding:12px;
  border-right:1px solid #CBD5E1;
  border-bottom:2px solid var(--line);
  text-align:left;
  white-space:nowrap
}
th:last-child,td:last-child{border-right:0}
th{
  background:#172033;
  color:#fff;
  font-size:11px;
  font-weight:700;
  letter-spacing:.02em
}
tbody tr:nth-child(even){background:#F8FAFC}
tbody tr:hover{background:#DBEAFE}
.num{
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
  text-align:right
}
.bar-cell{min-width:125px}
.mini,.cbar{
  height:9px;
  overflow:hidden;
  background:#DCE3ED;
  border:1px solid var(--ink)
}
.mini i,.cbar i{display:block;height:100%}
.badge{
  display:inline-flex;
  min-height:25px;
  align-items:center;
  gap:4px;
  padding:3px 8px;
  border:2px solid currentColor;
  border-radius:0;
  font-size:10px;
  font-weight:700;
  white-space:nowrap
}
.b-ok{background:var(--ok-bg);color:#166534}
.b-warn{background:var(--warn-bg);color:#92400E}
.b-bad{background:var(--bad-bg);color:#B91C1C}
.b-info{background:#E0F2FE;color:#075985}
.b-mut{background:#F1F5F9;color:#475569}
.dcard{padding:19px}
.dhead{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px}
.dhead .ic{
  width:50px;
  height:50px;
  flex:none;
  display:grid;
  place-items:center;
  background:var(--color-primary);
  border:3px solid var(--ink);
  color:#fff;
  box-shadow:4px 4px 0 var(--color-accent)
}
.dhead .ic .msi{font-size:27px}
.dhead h2{margin:0;font-size:20px;font-weight:700}
.dhead .sub{margin-top:4px;color:var(--muted);font-size:12px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:18px}
.field{
  min-width:0;
  padding:11px 12px;
  background:#F8FAFC;
  border:2px solid var(--ink)
}
.field .k{color:var(--muted);font-size:10px;font-weight:600}
.field .v{
  margin-top:4px;
  overflow:hidden;
  font-size:14px;
  font-weight:700;
  text-overflow:ellipsis
}
.field .v.big{
  font-family:"Fira Code",monospace;
  font-size:18px;
  font-variant-numeric:tabular-nums
}
h4.sec{
  display:flex;
  align-items:center;
  gap:7px;
  margin:3px 0 10px;
  font-size:13px
}
h4.sec .msi{font-size:18px;color:var(--color-primary)}
.note{
  display:flex;
  gap:9px;
  margin-top:9px;
  padding:12px;
  background:#FFF7ED;
  border:2px dashed var(--color-accent);
  color:#7C2D12;
  font-size:12px
}
.note .msi{flex:none;font-size:19px}
.tl{position:relative;padding-left:23px}
.tl::before{
  content:"";
  position:absolute;
  top:4px;
  bottom:4px;
  left:7px;
  width:3px;
  background:var(--ink)
}
.tl .it{position:relative;padding:0 0 18px 7px}
.tl .it::before{
  content:"";
  position:absolute;
  top:3px;
  left:-21px;
  width:12px;
  height:12px;
  background:var(--color-accent);
  border:3px solid var(--ink)
}
.tl .tt{font-size:13px;font-weight:700}
.tl .td{margin-top:2px;color:var(--muted);font-size:11px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;align-items:start}
.col{
  min-width:0;
  padding:10px;
  background:#E9EFF8;
  border:2px solid var(--ink)
}
.col>.h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
  padding:2px;
  font-size:12px;
  font-weight:700
}
.cnt{
  padding:1px 7px;
  background:#fff;
  border:2px solid var(--ink);
  color:var(--ink);
  font-family:"Fira Code",monospace;
  font-size:10px
}
.task{
  min-width:0;
  margin-bottom:9px;
  padding:10px;
  background:#fff;
  border:2px solid var(--ink);
  box-shadow:3px 3px 0 #94A3B8
}
.task .tk{
  overflow:hidden;
  font-size:12px;
  font-weight:700;
  text-overflow:ellipsis;
  white-space:nowrap
}
.task .tp{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin-top:5px;
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:9px
}
.cbar{height:7px;margin-top:8px}
.simrow{
  min-width:0;
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:10px;
  padding:11px;
  background:#fff;
  border:2px solid var(--ink)
}
.simrow .nm{min-width:0;font-size:12px;font-weight:700}
.simrow .rng{min-width:100px;flex:1}
input[type=range]{width:100%;accent-color:var(--color-primary)}
.legend{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  margin-top:10px;
  color:var(--muted);
  font-size:11px
}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;display:inline-block;border:1px solid var(--ink)}
.flowbar{display:flex;align-items:stretch;flex-wrap:wrap}
.fstep{
  position:relative;
  min-width:130px;
  flex:1;
  margin:5px;
  padding:12px;
  background:#F8FAFC;
  border:2px solid var(--ink)
}
.fstep:nth-child(even){background:#DBEAFE;transform:translateY(7px)}
.fstep .fn{color:var(--color-primary);font-family:"Fira Code",monospace;font-size:10px;font-weight:700}
.fstep .ft{margin-top:4px;font-size:12px;font-weight:700}
.fstep .fr{margin-top:3px;color:var(--muted);font-size:10px}
.grid-item{animation:grid-in .4s cubic-bezier(.2,.9,.3,1.3) both}
.grid-item:nth-child(2){animation-delay:.06s}
.grid-item:nth-child(3){animation-delay:.12s}
.grid-item:nth-child(4){animation-delay:.18s}
@keyframes grid-in{
  from{opacity:0;transform:translateY(16px) scale(.92)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@media(max-width:1024px){
  .side{width:220px;flex-basis:220px}
  .top{padding-inline:20px}
  .wrap{padding-inline:20px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .grid2,.grid2b{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:768px){
  .app{display:block}
  .side{
    position:static;
    width:100%;
    height:auto;
    flex-direction:row;
    border-right:0;
    border-bottom:4px solid var(--ink)
  }
  .brand{min-height:76px;flex:none;border-bottom:0;border-right:4px solid var(--ink)}
  .logo{width:42px;height:42px}
  nav{flex:1;flex-direction:row;overflow-x:auto}
  nav button{width:auto;min-width:max-content}
  nav button.on{left:0;box-shadow:4px 4px 0 #fff}
  .side-foot{display:none}
  .top{top:0;min-height:auto;align-items:flex-start;flex-wrap:wrap}
  .chip{display:none}
  .split{grid-template-columns:1fr}
  .list{max-height:350px}
}
@media(max-width:560px){
  .brand{padding:11px}
  .brand>div:last-child{display:none}
  nav{padding:9px}
  nav button{min-width:46px;justify-content:center;padding:9px}
  nav .txt{display:none}
  .wrap{padding:18px 13px 40px}
  .top{padding:12px 15px}
  .kpis{grid-template-columns:1fr;gap:13px}
  .kpi{min-height:126px}
  .kpi:nth-child(2n){transform:none}
  .fields,.board{grid-template-columns:1fr}
  .simrow{align-items:flex-start;flex-direction:column}
  .simrow .nm,.simrow .rng{width:100%!important;flex-basis:auto!important}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
    transition-duration:.01ms!important
  }
  .grid-item{animation:none!important;opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="msi">hub</span></div>
      <div style="min-width:0">
        <b>零組件協同</b>
        <span>Critical Parts Collab</span>
      </div>
    </div>
    <nav id="nav" aria-label="主要功能"></nav>
    <div class="side-foot">純 UI 展示 · 擬真資料<br>供應鏈 · 關鍵料件協同</div>
  </aside>
  <main>
    <header class="top">
      <div style="min-width:0">
        <h1 id="scr-title">關鍵料件庫存</h1>
        <div class="crumb"><span id="scr-crumb">庫存協同 · 可視化總覽</span></div>
      </div>
      <div class="sp"></div>
      <span class="chip"><span class="msi">verified</span>可視覆蓋率 86%</span>
      <span class="chip"><span class="msi">insights</span>預測準確度 91.4%</span>
    </header>
    <div class="wrap"><div id="view"></div></div>
  </main>
</div>
<script>
(function(){
"use strict";
var MODS=[
 {icon:"inventory_2",name:"關鍵料件庫存",crumb:"庫存協同 · 可視化總覽"},
 {icon:"insights",name:"需求預測協同",crumb:"需求預測 · 跨部門共享"},
 {icon:"factory",name:"供應商產能",crumb:"供應商 · 產能與交期回饋"},
 {icon:"warning",name:"缺料情境模擬",crumb:"風險 · 缺料情境推演"},
 {icon:"account_tree",name:"動態調度",crumb:"調度 · 跨廠調撥看板"},
 {icon:"verified",name:"協同成效追蹤",crumb:"成效 · 覆蓋率與準確度"}
];
var charts=[];
var ACC="#2563EB",ACC2="#EA580C",OK="#166534",WARN="#D97706",BAD="#DC2626",BLU="#3B82F6",GRY="#64748B";
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function clearCharts(){charts.forEach(function(c){try{c.destroy()}catch(e){}});charts=[]}
function mk(id,opt){
 var el=document.getElementById(id);if(!el)return;
 opt.chart=opt.chart||{};
 opt.chart.redrawOnParentResize=false;
 opt.chart.redrawOnWindowResize=false;
 opt.chart.animations={enabled:false};
 opt.chart.toolbar={show:false};
 opt.chart.fontFamily="Fira Sans, sans-serif";
 opt.theme={mode:"light"};
 try{var c=new ApexCharts(el,opt);c.render();charts.push(c)}catch(e){}
}
function barcell(pct,color){return'<div class="bar-cell"><div class="mini"><i style="width:'+pct+'%;background:'+color+'"></i></div></div>'}
function coverColor(c){return c<70?BAD:c<100?WARN:OK}
function riskBadge(r){
 if(r==="high")return'<span class="badge b-bad"><span class="msi">error</span>高風險</span>';
 if(r==="mid")return'<span class="badge b-warn"><span class="msi">warning</span>中風險</span>';
 return'<span class="badge b-ok"><span class="msi">check_circle</span>安全</span>'

 var kpi=kpiCard("verified","可視覆蓋率","86","%","up","41% → 86%")+kpiCard("insights","協同預測準確度","91.4","%","up","+6.2pt")+kpiCard("event_available","準時到貨率","99","%","up","82% → 99%")+kpiCard("schedule","採購前置時間","5.2","天","up","12 → 5.2");
 var data=[{label:"採購前置時間",before:12,after:5.2,unit:"天",inv:true},{label:"準時到貨率",before:82,after:99,unit:"%",inv:false},{label:"缺料預警覆蓋",before:41,after:86,unit:"%",inv:false},{label:"議價作業工時",before:8.3,after:1.9,unit:"小時/週",inv:true}];
 var rows=data.map(function(k){
  var imp=k.inv?Math.round((k.before-k.after)/k.before*100):Math.round((k.after-k.before)/k.before*100),pct=k.inv?Math.round(k.after/k.before*100):k.after;
  return'<tr><td style="font-weight:700">'+esc(k.label)+'</td><td class="num" style="color:var(--sub)">'+k.before+k.unit+'</td><td class="num" style="font-weight:700;color:var(--color-primary)">'+k.after+k.unit+'</td><td>'+barcell(Math.min(100,pct),ACC)+'</td><td class="num"><span class="badge b-ok"><span class="msi">trending_up</span>改善 '+imp+'%</span></td></tr>'
 }).join("");
 var stages=[{n:"S1",t:"需求預測共享",r:"生管"},{n:"S2",t:"供應商產能回饋",r:"採購"},{n:"S3",t:"庫存協同調整",r:"規劃"},{n:"S4",t:"缺料情境模擬",r:"規劃"},{n:"S5",t:"動態調度",r:"採購"}];
 var flow=stages.map(function(s){return'<div class="fstep"><div class="fn">'+s.n+'</div><div class="ft">'+esc(s.t)+'</div><div class="fr">'+esc(s.r)+'</div></div>'}).join("");
 return'<div class="kpis">'+kpi+'</div><div class="grid2"><section class="panel grid-item"><div class="ph"><span class="msi">trending_up</span><h3>可視覆蓋率與準確度趨勢</h3></div><div class="pb"><div id="c5a" style="height:280px"></div></div></section><section class="panel grid-item"><div class="ph"><span class="msi">radar</span><h3>協同成熟度評估</h3></div><div class="pb"><div id="c5b" style="height:280px"></div></div></section></div><section class="panel grid-item" style="margin-top:22px"><div class="ph"><span class="msi">flag</span><h3>導入效益對照</h3><span class="tag">導入前 → 導入後</span></div><div style="overflow-x:auto"><table><thead><tr><th>指標</th><th class="num">導入前</th><th class="num">導入後</th><th class="bar-cell">達成</th><th class="num">改善</th></tr></thead><tbody>'+rows+'</tbody></table></div></section><section class="panel grid-item" style="margin-top:22px"><div class="ph"><span class="msi">conversion_path</span><h3>協同運作流程</h3></div><div class="pb"><div class="flowbar">'+flow+'</div></div></section>'
}
function initV5(){
 mk("c5a",{chart:{type:"line",height:280},series:[{name:"可視覆蓋率 %",data:[41,52,63,71,80,86]},{name:"預測準確度 %",data:[85.2,87,88.4,89.6,90.5,91.4]},{name:"準時到貨率 %",data:[82,85,89,92,96,99]}],colors:[ACC,ACC2,BLU],stroke:{width:3,curve:"straight"},dataLabels:{enabled:false},xaxis:{categories:["第1週","第2週","第3週","第4週","第5週","第6週"]},yaxis:{min:40,max:100,labels:{formatter:function(v){return Math.round(v)+"%"}}},legend:{position:"top",horizontalAlign:"right"},grid:{borderColor:"#CBD5E1"},markers:{size:4}});
 mk("c5b",{chart:{type:"radar",height:280},series:[{name:"目前",data:[86,91,88,82,90]},{name:"目標",data:[95,95,95,95,95]}],colors:[ACC,GRY],stroke:{width:3},fill:{opacity:.12},markers:{size:4},xaxis:{categories:["庫存可視","預測準確","供應協同","情境模擬","動態調度"]},yaxis:{show:false,max:100},legend:{position:"top",horizontalAlign:"right"}})
}

var SCREENS=[v0,v1,v2,v3,v4,v5];
var INITS=[function(){renderDetail(0)},initV1,initV2,initV3,initV4,initV5];
document.getElementById("nav").innerHTML=MODS.map(function(m,i){
 return'<button type="button" data-i="'+i+'" onclick="window.__go('+i+')"><span class="msi">'+m.icon+'</span><span class="txt">'+esc(m.name)+'</span></button>'
}).join("");

function show(i){
 clearCharts();
 var container=document.getElementById("view");
 container.innerHTML=SCREENS[i]();
 document.getElementById("scr-title").textContent=MODS[i].name;
 document.getElementById("scr-crumb").textContent=MODS[i].crumb;
 document.querySelectorAll("[data-i]").forEach(function(btn){
  var on=+btn.dataset.i===i;
  btn.classList.toggle("on",on);
  btn.setAttribute("aria-current",on?"page":"false")
 });
 void container.offsetHeight;
 INITS[i]()
}
window.__go=function(i){location.hash="v"+i};
function fromHash(){
 var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
 if(!m){show(0);return}
 show(Math.min(+m[1],5));
 try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash()
})();
</script>
