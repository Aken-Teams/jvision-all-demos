<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>活動婚禮專案管理 · 婚宴營運中樞</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#b45309; --accent2:#f59e0b; --accent-soft:#fef3c7; --accent-line:#fde68a;
  --ink:#3f2d17; --ink2:#94795a; --muted:#a98d68;
  --bg:#faf6ef; --panel:#ffffff; --line:#efe4d3; --line2:#e7d8c2;
  --ok:#15803d; --ok-bg:#dcfce7; --warn:#b45309; --warn-bg:#fef3c7; --bad:#b91c1c; --bad-bg:#fee2e2; --info:#0369a1; --info-bg:#e0f2fe;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;font-size:20px}
.shell{display:flex;min-height:100vh;align-items:stretch}
.shell>*{min-width:0}
.side{width:236px;flex:none;background:linear-gradient(175deg,#fffdf9,#fdf5e8);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;gap:6px;position:sticky;top:0;height:100vh;overflow:auto;min-width:0}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
.brand .logo{width:38px;height:38px;flex:none;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 14px rgba(180,83,9,.28)}
.brand .logo .material-symbols-outlined{font-size:22px}
.brand b{font-size:15px;letter-spacing:.3px;display:block}
.brand span{font-size:11px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:4px;min-width:0}
.nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border:none;background:transparent;border-radius:10px;color:var(--ink2);font:inherit;font-size:13.5px;cursor:pointer;text-align:left;width:100%;transition:.15s;white-space:nowrap}
.nav button:hover{background:#fff6e6;color:var(--ink)}
.nav button.on{background:var(--accent);color:#fff;box-shadow:0 5px 12px rgba(180,83,9,.26)}
.nav button.on .material-symbols-outlined{color:#fff}
.nav button .material-symbols-outlined{font-size:20px;color:var(--muted)}
.nav .lbl{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.nav .lbl small{font-size:10.5px;opacity:.7;font-weight:400}
.side .foot{margin-top:auto;padding:12px 8px 2px;font-size:11px;color:var(--muted);border-top:1px solid var(--line)}
.side .foot .who{display:flex;align-items:center;gap:8px;margin-top:8px}
.side .foot .av{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:16px 26px;border-bottom:1px solid var(--line);background:rgba(255,253,249,.9);backdrop-filter:blur(4px);position:sticky;top:0;z-index:5}
.top h1{font-size:17px;margin:0;font-weight:700}
.top .sub{font-size:12px;color:var(--muted);margin-top:2px}
.top .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:20px;background:var(--panel);border:1px solid var(--line);font-size:12px;color:var(--ink2);white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.7)}}
.wrap{padding:22px 26px 40px;min-width:0}
.screen-title{display:flex;align-items:center;gap:10px;margin:0 0 16px}
.screen-title .material-symbols-outlined{color:var(--accent);font-size:24px}
.screen-title h2{font-size:16px;margin:0;font-weight:700}
.screen-title p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.grid{display:grid;gap:14px;min-width:0}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.kpis{grid-template-columns:repeat(4,1fr)}
.split{grid-template-columns:1.7fr 1fr}
.split2{grid-template-columns:1fr 1.35fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card.pad0{padding:0;overflow:hidden}
.card h3{margin:0 0 12px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.card h3 .tag{margin-left:auto;font-weight:500}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px;position:relative;overflow:hidden;min-width:0}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:64px;height:64px;border-radius:50%;background:var(--accent-soft);opacity:.6}
.kpi .k-ic{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:10px;position:relative;z-index:1}
.kpi .k-v{font-size:24px;font-weight:700;letter-spacing:.5px;position:relative;z-index:1}
.kpi .k-l{font-size:12px;color:var(--muted);margin-top:3px;position:relative;z-index:1}
.kpi .k-d{font-size:11px;margin-top:7px;font-weight:600;position:relative;z-index:1;display:inline-flex;align-items:center;gap:3px}
.up{color:var(--ok)} .down{color:var(--bad)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-info{background:var(--info-bg);color:var(--info)}
.b-mut{background:#f1e9db;color:var(--ink2)}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
thead th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;padding:9px 12px;border-bottom:1px solid var(--line2);white-space:nowrap;background:#fdf8ef}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fffaf0}
.tb-name{font-weight:600;color:var(--ink)}
.tb-sub{font-size:11px;color:var(--muted)}
.scroll{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.scroll table{min-width:560px}
.cal{width:100%;border-collapse:separate;border-spacing:6px;min-width:640px}
.cal th{color:var(--muted);font-size:11px;font-weight:600;padding:4px}
.cal td{background:#fdf8ef;border:1px solid var(--line);border-radius:10px;height:78px;vertical-align:top;padding:6px 7px;position:relative}
.cal td.mut{opacity:.4}
.cal .dn{font-size:12px;font-weight:600;color:var(--ink2)}
.cal .ev{font-size:10px;padding:2px 5px;border-radius:6px;margin-top:3px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .ev.full{background:var(--bad-bg);color:var(--bad)}
.cal .ev.hold{background:var(--warn-bg);color:var(--warn)}
.cal .ev.tour{background:var(--info-bg);color:var(--info)}
.cal .ev.free{background:var(--ok-bg);color:var(--ok)}
.cal td.today{outline:2px solid var(--accent);outline-offset:-2px}
.floor{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;min-width:560px;padding:6px}
.tbl{aspect-ratio:1/1;border-radius:50%;border:2px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:600;position:relative;background:#fff;transition:.15s}
.tbl .tn{font-size:13px;font-weight:700}
.tbl .tc{font-size:10px;color:var(--muted)}
.tbl.f-full{background:#fde3c8;border-color:var(--accent2)}
.tbl.f-vip{background:var(--accent);color:#fff;border-color:var(--accent)}
.tbl.f-vip .tc{color:#ffe8c9}
.tbl.f-part{background:#fff}
.tbl.f-empty{background:#faf6ef;border-style:dashed;color:var(--muted)}
.stage-bar{grid-column:1/-1;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;border-radius:10px;text-align:center;padding:8px;font-weight:700;font-size:12px;letter-spacing:2px}
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:720px}
.kb-col{background:#fdf8ef;border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.kb-col h4{margin:0 0 10px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.kb-col h4 .cnt{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 8px;font-size:11px;color:var(--muted)}
.kb-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;box-shadow:0 1px 2px rgba(120,80,20,.04)}
.kb-card:last-child{margin-bottom:0}
.kb-card .t{font-weight:600;font-size:12.5px;margin-bottom:6px}
.kb-card .m{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted)}
.kb-card .who{display:inline-flex;align-items:center;gap:5px}
.av-s{width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.barline{height:5px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:8px}
.barline i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.prow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:none}
.prow .pl{width:120px;flex:none;font-size:12.5px;font-weight:600}
.prow .pbar{flex:1;height:8px;border-radius:8px;background:var(--line);overflow:hidden;min-width:0}
.prow .pbar i{display:block;height:100%;border-radius:8px}
.prow .pv{width:44px;text-align:right;font-size:12px;font-weight:700;color:var(--ink2)}
.pay-tl{position:relative;padding-left:22px}
.pay-tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line2)}
.pay-item{position:relative;padding:0 0 16px}
.pay-item:last-child{padding-bottom:0}
.pay-item .dotm{position:absolute;left:-18px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--accent2)}
.pay-item.done .dotm{background:var(--ok);border-color:var(--ok)}
.pay-item.now .dotm{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.pay-item .pt{font-weight:600;font-size:13px}
.pay-item .pd{font-size:11.5px;color:var(--muted);margin-top:2px}
.pay-item .pa{float:right;font-weight:700;font-size:13px}
.mono{font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:flex-start;background:#fdf8ef;border:1px dashed var(--line2);border-radius:10px;padding:10px 12px}
.hint .material-symbols-outlined{font-size:18px;color:var(--accent2);flex:none}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--ink2);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.ai-line{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.ai-line:last-child{border-bottom:none}
.ai-line .ai-ic{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent)}
.ai-line .ai-b{font-size:12.5px;min-width:0}
.ai-line .ai-b b{display:block;margin-bottom:2px}
.ai-line .ai-b span{color:var(--muted)}
.chip{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;background:var(--accent-soft);color:var(--accent);font-weight:600;margin:2px 4px 2px 0}
.mini-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;min-width:0}
.mini{background:#fdf8ef;border:1px solid var(--line);border-radius:11px;padding:12px}
.mini .mv{font-size:19px;font-weight:700}
.mini .ml{font-size:11px;color:var(--muted);margin-top:2px}
.quote-line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.quote-line:last-of-type{border-bottom:none}
.quote-total{display:flex;justify-content:space-between;margin-top:10px;padding-top:12px;border-top:2px solid var(--line2);font-weight:700;font-size:15px}
.quote-total .num{color:var(--accent)}
@media(max-width:1100px){.split,.split2{grid-template-columns:1fr}}
@media(max-width:860px){
  .shell{flex-direction:column}
  .side{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 12px;border-right:none;border-bottom:1px solid var(--line);gap:6px}
  .brand{padding:0 10px 0 4px;flex:1 1 auto}
  .nav{flex-direction:row;flex-wrap:wrap;gap:6px;width:auto}
  .nav button{width:auto;padding:8px 12px}
  .nav .lbl small{display:none}
  .side .foot{display:none}
  .wrap{padding:18px 16px 34px}
  .top{padding:14px 16px}
}
@media(max-width:820px){
  .g2,.g3,.kpis,.split,.split2,.mini-cards{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){
  .nav .lbl{display:none}
  .nav button{padding:9px 11px}
  .kpis{grid-template-columns:1fr 1fr}
  table{min-width:460px}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">celebration</span></div>
      <div><b>婚宴中樞</b><span>活動婚禮專案管理</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      本季已成交 128 場 · 準時到府率 98%
      <div class="who"><div class="av">婷</div><div><b style="font-size:12px">王婉婷</b><br><span>婚企顧問 · 信義旗艦店</span></div></div>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <div>
        <h1 id="topTitle">檔期日曆</h1>
        <div class="sub" id="topSub">宴會廳檔期與試菜排程</div>
      </div>
      <div class="spacer"></div>
      <span class="pill"><span class="dot"></span>即時同步 · 3 據點</span>
    </header>
    <main class="wrap" id="view"></main>
  </div>
</div>

<script>
"use strict";

var MODULES=[
  {icon:"event_available",name:"檔期日曆",desc:"宴會廳檔期與試菜排程"},
  {icon:"request_quote",name:"詢價報價",desc:"方案試算與報價合約"},
  {icon:"payments",name:"訂金付款",desc:"訂金收款與分期追蹤"},
  {icon:"table_restaurant",name:"賓客桌次",desc:"桌次配置與座位圖"},
  {icon:"checklist",name:"籌備任務",desc:"婚企籌備待辦看板"},
  {icon:"auto_awesome",name:"AI 活動摘要",desc:"當日流程與洞察摘要"}
];

var chart=null;
function killChart(){ if(chart){ try{chart.destroy();}catch(e){} chart=null; } }
function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); }
function money(n){ n=(typeof n==="number"&&isFinite(n))?n:0; return "$"+n.toLocaleString("en-US"); }
function kpiRow(list){ return list.map(function(k){ return '<div class="kpi"><div class="k-ic"><span class="material-symbols-outlined">'+k.ic+'</span></div><div class="k-v mono">'+esc(k.v)+'</div><div class="k-l">'+esc(k.l)+'</div><div class="k-d '+(k.cls||"up")+'"><span class="material-symbols-outlined" style="font-size:14px">trending_up</span>'+esc(k.d)+'</div></div>'; }).join(""); }

/* ---------- screen 0 : 檔期日曆 ---------- */
function s0(){
  var cells=[
    {m:1},{m:1},{d:1,ev:[["free","可預約"]]},{d:2,ev:[["tour","10:00 試菜"]]},{d:3,ev:[["free","可預約"]]},{d:4,ev:[["hold","保留-陳"]]},{d:5,ev:[["full","午宴12桌"]]},
    {d:6,ev:[["full","晚宴20桌"]]},{d:7,ev:[["free","可預約"]]},{d:8,ev:[["tour","14:00 勘場"]]},{d:9,ev:[["hold","保留-林"]]},{d:10,ev:[["free","可預約"]]},{d:11,ev:[["full","晚宴18桌"]]},{d:12,ev:[["full","午+晚"]]},
    {d:13,today:1,ev:[["tour","11:00 試菜"]]},{d:14,ev:[["free","可預約"]]},{d:15,ev:[["hold","保留-黃"]]},{d:16,ev:[["free","可預約"]]},{d:17,ev:[["full","晚宴22桌"]]},{d:18,ev:[["full","午宴15桌"]]},{d:19,ev:[["free","可預約"]]},
    {d:20,ev:[["tour","09:30 勘場"]]},{d:21,ev:[["hold","保留-吳"]]},{d:22,ev:[["free","可預約"]]},{d:23,ev:[["full","晚宴28桌"]]},{d:24,ev:[["full","午宴10桌"]]},{d:25,ev:[["hold","保留-鄭"]]},{d:26,ev:[["free","可預約"]]},
    {d:27,ev:[["full","晚宴24桌"]]},{d:28,ev:[["tour","16:00 試菜"]]},{d:29,ev:[["free","可預約"]]},{d:30,ev:[["full","午+晚"]]},{m:1},{m:1},{m:1}
  ];
  var wk=["日","一","二","三","四","五","六"];
  var calRows="";
  for(var i=0;i<cells.length;i++){
    if(i%7===0) calRows+= (i===0?"":"</tr>")+"<tr>";
    var c=cells[i];
    if(c.m){ calRows+='<td class="mut"></td>'; continue; }
    var evs=(c.ev||[]).map(function(e){ return '<div class="ev '+e[0]+'">'+esc(e[1])+'</div>'; }).join("");
    calRows+='<td class="'+(c.today?"today":"")+'"><div class="dn">'+c.d+'</div>'+evs+'</td>';
  }
  calRows+="</tr>";

  var upcoming=[
    {couple:"陳彥廷 · 林思妤",date:"8/17 (六)",time:"晚宴",tables:22,hall:"凡爾賽廳",st:["b-ok","已簽約"]},
    {couple:"黃冠宇 · 蔡欣妤",date:"8/18 (日)",time:"午宴",tables:15,hall:"香檳廳",st:["b-warn","待訂金"]},
    {couple:"吳承恩 · 周佳蓉",date:"8/23 (五)",time:"晚宴",tables:28,hall:"凡爾賽廳",st:["b-ok","已簽約"]},
    {couple:"鄭凱文 · 許郁婷",date:"8/25 (日)",time:"保留",tables:12,hall:"香檳廳",st:["b-info","詢價中"]},
    {couple:"劉柏睿 · 何宜庭",date:"8/27 (二)",time:"晚宴",tables:24,hall:"凡爾賽廳",st:["b-ok","已簽約"]}
  ];
  var rows=upcoming.map(function(u){
    return '<tr><td><div class="tb-name">'+esc(u.couple)+'</div><div class="tb-sub">'+esc(u.hall)+'</div></td>'+
      '<td class="mono">'+esc(u.date)+'</td><td>'+esc(u.time)+'</td>'+
      '<td class="mono">'+u.tables+' 桌</td><td><span class="badge '+u.st[0]+'">'+esc(u.st[1])+'</span></td></tr>';
  }).join("");

  var kpis=[
    {ic:"event_available",v:"14",l:"本月可預約日",d:"週末剩 3 日",cls:"down"},
    {ic:"lock",v:"9",l:"保留檔期",d:"3 筆將到期",cls:"down"},
    {ic:"restaurant",v:"5",l:"本週試菜/勘場",d:"較上週 +2",cls:"up"},

/* ---------- router ---------- */
var SCREENS=[s0,s1,s2,s3,s4,s5];
var DRAWERS=[null,draw1,draw2,null,null,draw5];

function buildNav(){
  var nav=document.getElementById("nav");
  nav.innerHTML=MODULES.map(function(m,i){
    return '<button data-i="'+i+'"'+(i===0?' class="on"':'')+'><span class="material-symbols-outlined">'+m.icon+'</span><span class="lbl">'+esc(m.name)+'<small>'+esc(m.desc)+'</small></span></button>';
  }).join("");
  nav.querySelectorAll("[data-i]").forEach(function(b){
    b.addEventListener("click",function(){ show(+b.getAttribute("data-i")); });
  });
}

function show(i){
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  killChart();
  var view=document.getElementById("view");
  view.innerHTML=SCREENS[i]();
  document.querySelectorAll("#nav [data-i]").forEach(function(b){ b.classList.toggle("on",+b.getAttribute("data-i")===i); });
  document.getElementById("topTitle").textContent=MODULES[i].name;
  document.getElementById("topSub").textContent=MODULES[i].desc;
  void view.offsetHeight;
  if(DRAWERS[i]) DRAWERS[i]();
}

buildNav();
show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
