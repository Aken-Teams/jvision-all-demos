<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CRM 客戶關係管理｜Jvision 系統 Demo</title>
<meta name="description" content="從名單到成交的完整客戶生命週期（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#0F172A;
  --color-card:#FFFFFF;
  --color-card-foreground:#0F172A;
  --color-muted:#F1F5FD;
  --color-muted-foreground:#475569;
  --color-border:#E4ECFC;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#0F172A;
  --muted:#475569;
  --line:#E4ECFC;
  --green:#047857;
  --amber:#B45309;
  --red:#B91C1C;
  --sidebar:#0F172A;
  --sidebar-muted:#CBD5E1;
  --radius:10px;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 7px 18px rgba(15,23,42,.04);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  font-family:"Fira Sans","Microsoft JhengHei",sans-serif;
  background:var(--color-background);
  color:var(--color-muted-foreground);
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit}
button,a,label,input{cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{
  outline:3px solid rgba(37,99,235,.32);
  outline-offset:2px;
}
.material-symbols-outlined{
  font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;
  line-height:1;
}
.mono,.amt,.v,.sum,.when,.tbl td:nth-child(1),.tbl td:nth-child(3),.tbl td:nth-child(4){
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{
  position:sticky;
  top:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  background:var(--sidebar);
  color:#FFF;
  border-right:1px solid #1E293B;
}
.brand{
  min-height:78px;
  padding:18px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid #334155;
}
.brand .lg{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  flex:none;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-radius:8px;
}
.brand b{display:block;color:#FFF;font-size:15px;line-height:1.3}
.brand small{display:block;margin-top:3px;color:#CBD5E1;font-size:11px}
.nav{flex:1;padding:16px 12px;display:flex;flex-direction:column;gap:5px}
.nav .t{
  padding:7px 10px;
  color:#94A3B8;
  font:600 10px/1.4 "Fira Code",monospace;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.nav button{
  width:100%;
  min-height:44px;
  padding:10px 11px;
  display:flex;
  align-items:center;
  gap:10px;
  border:1px solid transparent;
  border-radius:8px;
  background:transparent;
  color:#CBD5E1;
  font-size:13px;
  font-weight:500;
  text-align:left;
  transition:background-color .22s ease,border-color .22s ease,color .22s ease,transform .22s ease;
}
.nav button .material-symbols-outlined{font-size:20px;color:#94A3B8}
.nav button:hover{background:#1E293B;color:#FFF;transform:translateX(2px)}
.nav button.on{
  background:#FFF;
  border-color:#FFF;
  color:#1D4ED8;
  font-weight:600;
}
.nav button.on .material-symbols-outlined{color:#2563EB}
.side-f{padding:16px;border-top:1px solid #334155}
.quota{color:#CBD5E1;font-size:11px}
.quota b{
  display:block;
  margin:5px 0 8px;
  color:#FFF;
  font:600 16px/1.3 "Fira Code",monospace;
}
.qbar{height:6px;overflow:hidden;border-radius:3px;background:#334155}
.qbar span{display:block;height:100%;background:#34D399}
.main{min-width:0}
.top{
  position:sticky;
  top:0;
  z-index:20;
  min-height:78px;
  padding:14px 26px;
  display:flex;
  align-items:center;
  gap:18px;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(10px);
}
.top h1{margin:0;color:var(--ink);font-size:19px;line-height:1.25;font-weight:600}
.top .sub{margin-top:4px;color:var(--muted);font:400 11px/1.4 "Fira Code",monospace}
.top .r{margin-left:auto;display:flex;align-items:center;gap:12px}
.search{
  min-width:230px;
  min-height:40px;
  padding:0 11px;
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--muted);
  background:var(--color-background);
  border:1px solid var(--line);
  border-radius:8px;
  transition:border-color .2s ease,box-shadow .2s ease,background-color .2s ease;
}
.search:focus-within{
  background:#FFF;
  border-color:var(--color-ring);
  box-shadow:0 0 0 3px rgba(37,99,235,.14);
}
.search input{
  width:100%;
  min-width:0;
  border:0;
  outline:0;
  color:var(--ink);
  background:transparent;
  cursor:text;
  font-size:13px;
}
.search input::placeholder{color:#64748B}
.ava,.av2{
  display:grid;
  place-items:center;
  flex:none;
  color:#1D4ED8;
  background:#DBEAFE;
  font-weight:600;
}
.ava{width:36px;height:36px;border-radius:8px}
.av2{width:24px;height:24px;border-radius:6px;font-size:10px}
.body{padding:24px 26px 48px}
.vh{
  margin-bottom:19px;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:14px;
  flex-wrap:wrap;
}
.vh h2{margin:0;color:var(--ink);font-size:23px;line-height:1.25;font-weight:600;letter-spacing:-.02em}
.vh p{margin:5px 0 0;color:var(--muted);font-size:13px}
.btn{
  min-height:40px;
  padding:0 15px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  border:1px solid var(--color-primary);
  border-radius:8px;
  background:var(--color-primary);
  color:var(--color-on-primary);
  font-size:13px;
  font-weight:600;
  transition:background-color .2s ease,border-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.btn:hover{background:#1D4ED8;border-color:#1D4ED8;box-shadow:0 4px 10px rgba(37,99,235,.18);transform:translateY(-1px)}
.btn.ghost{background:#FFF;color:#1D4ED8;border-color:#BFDBFE}
.btn.ghost:hover{background:#EFF6FF;border-color:#2563EB}
.btn.sm{min-height:32px;padding:0 10px;font-size:12px}
.btn .material-symbols-outlined{font-size:18px}
.kpis{
  margin-bottom:18px;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
}
.kpi,.card,.cp,.deal{
  background:var(--color-card);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
}
.kpi{
  min-width:0;
  padding:17px 18px;
  border-radius:var(--radius);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
  animation:item-in .4s both;
}
.kpi:nth-child(2){animation-delay:.06s}
.kpi:nth-child(3){animation-delay:.12s}
.kpi:nth-child(4){animation-delay:.18s}
.kpi:hover{border-color:#BFDBFE;box-shadow:0 8px 20px rgba(37,99,235,.08);transform:translateY(-2px)}
.kpi .l{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:500}
.kpi .l .material-symbols-outlined{color:var(--color-primary);font-size:18px}
.kpi .v{margin-top:8px;color:var(--ink);font-size:27px;line-height:1.2;font-weight:600;letter-spacing:-.04em}
.kpi .v small{margin-left:3px;color:var(--muted);font:500 12px/1 "Fira Sans",sans-serif}
.kpi .d{
  width:max-content;
  margin-top:7px;
  padding:2px 6px;
  color:#065F46;
  background:#D1FAE5;
  border-radius:4px;
  font:600 11px/1.4 "Fira Code",monospace;
}
.grid{display:grid;gap:18px}
.grid>*{min-width:0}
.card{
  min-width:0;
  padding:19px 20px;
  border-radius:var(--radius);
  animation:item-in .4s both;
}
.card>h3,.card>div>h3{
  margin:0 0 15px;
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--ink);
  font-size:15px;
  line-height:1.35;
  font-weight:600;
}
.card h3 .material-symbols-outlined{color:var(--color-primary);font-size:20px}
.card h3 .grow{margin-left:auto;color:#1D4ED8;font-size:12px;font-weight:500}
.pipe{
  padding-bottom:5px;
  display:grid;
  grid-auto-flow:column;
  grid-auto-columns:minmax(225px,1fr);
  gap:12px;
  overflow-x:auto;
  scrollbar-color:#CBD5E1 transparent;
}
.pcol{padding:11px;background:var(--color-background);border:1px solid var(--line);border-radius:8px}
.pch{margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.pch b{color:var(--ink);font-size:12px;font-weight:600}
.pch .sum{
  padding:3px 7px;
  color:#1D4ED8;
  background:#DBEAFE;
  border-radius:4px;
  font-size:10px;
  font-weight:600;
}
.deal{
  margin-bottom:9px;
  padding:12px;
  border-radius:7px;
  box-shadow:0 1px 2px rgba(15,23,42,.04);
  transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.deal:last-child{margin-bottom:0}
.deal:hover{border-color:#93C5FD;box-shadow:0 5px 12px rgba(37,99,235,.08);transform:translateY(-1px)}
.deal b{color:var(--ink);font-size:12px;font-weight:600}
.deal .amt{margin:6px 0;color:#1D4ED8;font-size:15px;font-weight:600}
.deal small{display:block;color:var(--muted);font-size:10px}
.prog{height:5px;margin:9px 0 7px;overflow:hidden;background:#E2E8F0;border-radius:2px}
.prog span{display:block;height:100%;background:var(--color-primary)}
.deal-f{margin-top:7px;display:flex;align-items:center;gap:6px}
.risk,.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  white-space:nowrap;
  border-radius:4px;
  font-size:10px;
  font-weight:600;
}
.risk{padding:3px 7px}
.risk::before,.tag::before{font-family:"Material Symbols Outlined";font-size:13px;line-height:1}
.r-hot{color:#991B1B;background:#FEE2E2}
.r-hot::before{content:"priority_high"}
.r-warm{color:#92400E;background:#FEF3C7}
.r-warm::before{content:"schedule"}
.c360{margin-bottom:17px;display:flex;align-items:center;gap:15px}
.c-av{
  width:60px;
  height:60px;
  display:grid;
  place-items:center;
  flex:none;
  color:#FFF;
  background:#2563EB;
  border-radius:10px;
  font-size:22px;
  font-weight:600;
}
.c360 b{color:var(--ink);font-size:19px;font-weight:600}
.c360 small{color:var(--muted);font-size:12px;line-height:1.6}
.cstat{
  margin-bottom:17px;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
}
.cs{padding:13px 10px;text-align:center;background:var(--color-muted);border:1px solid var(--line);border-radius:7px}
.cs b{display:block;color:var(--ink);font:600 18px/1.3 "Fira Code",monospace}
.cs span{color:var(--muted);font-size:10px}
.tl-i,.todo{padding:11px 0;display:flex;align-items:center;gap:11px;border-top:1px solid var(--line)}
.tl-i:first-of-type,.todo:first-of-type{border-top:0}
.tl-ic{
  width:32px;
  height:32px;
  display:grid;
  place-items:center;
  flex:none;
  color:#1D4ED8;
  background:#EFF6FF;
  border:1px solid #DBEAFE;
  border-radius:7px;
}
.tl-ic .material-symbols-outlined{font-size:17px}
.tl-i b,.todo .info b{color:var(--ink);font-size:12px;font-weight:600}
.tl-i small,.todo .info small{display:block;margin-top:2px;color:var(--muted);font-size:11px;line-height:1.45}
.tl-i .when{margin-left:auto;color:#64748B;font-size:10px;white-space:nowrap}
.todo .info{flex:1}
.ai-row{
  margin-bottom:10px;
  padding:12px;
  display:flex;
  gap:10px;
  background:#EFF6FF;
  border:1px solid #DBEAFE;
  border-radius:7px;
}
.ai-ic{
  width:32px;
  height:32px;
  display:grid;
  place-items:center;
  flex:none;
  color:#FFF;
  background:var(--color-primary);
  border-radius:6px;
}
.ai-row p{margin:0;color:#334155;font-size:12px;line-height:1.55}
.ai-row b{color:var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{
  padding:11px 12px;
  color:#475569;
  background:#F8FAFC;
  border-bottom:1px solid #CBD5E1;
  font-size:10px;
  font-weight:600;
  letter-spacing:.04em;
  text-align:left;
  text-transform:uppercase;
  white-space:nowrap;
}
.tbl td{padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tbody tr{transition:background-color .2s ease}
.tbl tbody tr:hover td{background:#F8FAFC}
.tbl th:nth-child(3),.tbl th:nth-child(4),.tbl td:nth-child(3),.tbl td:nth-child(4){text-align:right}
.tag{padding:4px 8px}
.g-ok{color:#065F46;background:#D1FAE5}
.g-ok::before{content:"check_circle"}
.g-wait{color:#92400E;background:#FEF3C7}
.g-wait::before{content:"schedule"}
.g-rej{color:#991B1B;background:#FEE2E2}
.g-rej::before{content:"error"}
.camp{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:13px}
.cp{
  padding:15px;
  border-top:3px solid var(--color-primary);
  border-radius:8px;
  transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.cp:hover{border-color:#60A5FA;box-shadow:0 7px 16px rgba(37,99,235,.08);transform:translateY(-2px)}
.cp b{color:var(--ink);font-weight:600}
.cp .m{margin-top:11px;display:flex;justify-content:space-between;font-size:11px}
.cp .m div span{display:block;color:var(--muted);font-size:10px}
.cp .m div b{color:#1D4ED8;font:600 15px/1.5 "Fira Code",monospace}
.alert-card{border-left-width:4px!important;box-shadow:none}
.alert-danger{background:#FEF2F2!important;border-color:#FCA5A5!important}
.alert-warn{background:#FFFBEB!important;border-color:#FCD34D!important}
.chart{width:100%;height:270px}
@keyframes item-in{
  from{opacity:0;transform:translateY(16px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto}
  .brand{min-height:66px}
  .nav{padding:9px 12px;flex-direction:row;overflow-x:auto}
  .nav .t,.side-f{display:none}
  .nav button{width:auto;flex:none;white-space:nowrap}
  .nav button:hover{transform:none}
  .grid{grid-template-columns:1fr!important}
}
@media (max-width:640px){
  .top{min-height:auto;padding:12px 15px;flex-wrap:wrap}
  .top .r{width:100%}
  .search{min-width:0;flex:1}
  .body{padding:18px 14px 34px}
  .vh h2{font-size:20px}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:14px}
  .kpi .v{font-size:22px}
  .card{padding:16px}
  .c360{align-items:flex-start;flex-wrap:wrap}
  .c360 .btn{margin-left:0!important}
  .cstat{grid-template-columns:1fr 1fr}
}
@media (max-width:390px){
  .kpis{grid-template-columns:1fr}
  .top h1{font-size:17px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  .kpi,.card{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <span class="lg"><span class="material-symbols-outlined" aria-hidden="true">contacts</span></span>
      <div><b>CRM 客戶關係</b><small>禾川商務</small></div>
    </div>
    <nav class="nav" id="nav" aria-label="功能模組"></nav>
    <div class="side-f">
      <div class="quota">本月業績達成<b>$3.4M / 4M</b><div class="qbar" role="progressbar" aria-label="本月業績達成率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="85"><span style="width:85%"></span></div></div>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <div><h1 id="vt">客戶 360 視圖</h1><div class="sub">業務團隊 · 上午 09:20</div></div>
      <div class="r">
        <label class="search">
          <span class="material-symbols-outlined" aria-hidden="true" style="font-size:20px">search</span>
          <input aria-label="搜尋客戶或商機" placeholder="搜尋客戶、商機…" />
        </label>
        <span class="ava" aria-label="目前使用者：業務">業</span>
      </div>
    </header>
    <main class="body" id="view"></main>
  </div>
</div>
<script>
const MODS=[
 ["account_circle","客戶 360 視圖"],
 ["filter_alt","銷售管線"],
 ["request_quote","報價與風險"],

];

const KPI=[["商機轉換率","27","%","+9pt"],["平均回應時間","6","小時","−77%"],["客戶資料完整率","94","%","+32pt"],["本季預估","1,724","萬","+18%"]];
const STAGES=["需求確認","方案評估","報價議合","已成交"];
const DEALS=[
 ["OPP-01","高峰物流車隊","152","需求確認","李柏翰",30,"hot","官網詢問"],["OPP-02","力盛精密設備","98","需求確認","陳彥廷",25,"","展會名單"],["OPP-03","佳明科技採購","120","需求確認","黃詩涵",20,"","冷名單開發"],["OPP-04","宏達雲端評估","88","需求確認","王志明",15,"","電銷"],
