<style>

  .nav button:hover{ background:rgba(255,255,255,.1); } .nav button.on{ background:#fff; color:var(--ind); } .nav button.on .material-symbols-outlined{ color:var(--ind); }

  .quota{ font-size:11px; color:#c7d2fe; } .quota b{ color:#fff; font-size:18px; display:block; } .qbar{ height:7px; border-radius:999px; background:rgba(255,255,255,.2); overflow:hidden; margin-top:6px; } .qbar span{ display:block; height:100%; background:#a5b4fc; }
  .main{ min-width:0; }
  .top{ position:sticky; top:0; z-index:10; background:#fff; border-bottom:1px solid var(--line); padding:14px 26px; display:flex; align-items:center; gap:16px; }
  .top h1{ margin:0; font-size:19px; font-weight:900; color:var(--ink); } .top .sub{ font-size:12px; color:var(--muted); }
  .top .r{ margin-left:auto; display:flex; align-items:center; gap:12px; } .search{ display:flex; align-items:center; gap:8px; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:8px 12px; color:var(--muted); min-width:200px; } .search input{ border:0; background:none; outline:none; font:inherit; font-size:13px; width:100%; } .ava{ width:34px; height:34px; border-radius:50%; background:#ddd6fe; color:var(--ind); font-weight:800; display:grid; place-content:center; }
  .body{ padding:22px 26px 44px; }
  .btn{ display:inline-flex; align-items:center; gap:6px; height:38px; padding:0 15px; border-radius:10px; border:0; background:var(--ind); color:#fff; font:inherit; font-weight:800; font-size:13px; cursor:pointer; } .btn.ghost{ background:#fff; color:var(--ind); border:1px solid var(--line); } .btn.sm{ height:30px; padding:0 10px; font-size:12px; } .btn .material-symbols-outlined{ font-size:18px; }
  .vh{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:18px; flex-wrap:wrap; } .vh h2{ margin:0; font-size:21px; font-weight:900; color:var(--ink); } .vh p{ margin:3px 0 0; font-size:13px; color:var(--muted); }
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:20px; }
  .kpi{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px 18px; } .kpi .l{ font-size:12px; font-weight:700; color:var(--muted); display:flex; gap:6px; } .kpi .l .material-symbols-outlined{ font-size:18px; color:var(--ind); } .kpi .v{ font-size:27px; font-weight:900; color:var(--ink); margin-top:6px; } .kpi .v small{ font-size:13px; color:var(--muted); } .kpi .d{ font-size:12px; font-weight:800; color:var(--green); margin-top:4px; }
  .grid{ display:grid; gap:18px; } .grid>*{ min-width:0; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:18px; padding:18px 20px; min-width:0; } .card>h3{ margin:0 0 14px; font-size:15px; font-weight:800; color:var(--ink); display:flex; align-items:center; gap:8px; } .card>h3 .material-symbols-outlined{ color:var(--ind); font-size:20px; } .card>h3 .grow{ margin-left:auto; font-size:12px; font-weight:700; color:var(--ind); cursor:pointer; }
  .pipe{ display:grid; grid-auto-flow:column; grid-auto-columns:minmax(224px,1fr); gap:12px; overflow-x:auto; }
  .pcol{ background:var(--bg); border:1px solid var(--line); border-radius:13px; padding:11px; }
  .pch{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; } .pch b{ color:var(--ink); font-size:13px; } .pch .sum{ font-size:11px; font-weight:800; color:var(--ind); background:#ede9fe; border-radius:999px; padding:2px 9px; }
  .deal{ background:#fff; border:1px solid var(--line); border-radius:11px; padding:12px; margin-bottom:9px; box-shadow:0 1px 3px rgba(30,27,75,.05); }
  .deal b{ color:var(--ink); font-size:13px; } .deal .amt{ color:var(--ind); font-weight:900; font-size:15px; margin:5px 0; } .deal small{ color:var(--muted); font-size:11px; display:block; }
  .deal .prog{ height:5px; border-radius:999px; background:var(--line); overflow:hidden; margin:8px 0 6px; } .deal .prog span{ display:block; height:100%; background:var(--vio); }
  .deal-f{ display:flex; align-items:center; gap:6px; margin-top:6px; } .av2{ width:22px; height:22px; border-radius:50%; background:#ddd6fe; color:var(--ind); font-size:10px; font-weight:800; display:grid; place-content:center; } .deal-f small{ color:var(--muted); font-size:11px; }
  .risk{ font-size:10px; font-weight:800; border-radius:6px; padding:1px 7px; } .r-hot{ background:#fee2e2; color:#dc2626; } .r-warm{ background:#fef3c7; color:#b45309; }
  .c360{ display:flex; align-items:center; gap:16px; margin-bottom:16px; } .c-av{ width:60px; height:60px; border-radius:18px; background:linear-gradient(135deg,#a78bfa,#4338ca); color:#fff; display:grid; place-content:center; font-size:24px; font-weight:800; } .c360 b{ font-size:20px; color:var(--ink); } .c360 small{ color:var(--muted); font-size:13px; }
  .cstat{ display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:12px; margin-bottom:16px; } .cs{ background:var(--bg); border-radius:12px; padding:12px; text-align:center; } .cs b{ display:block; font-size:19px; color:var(--ink); font-weight:900; } .cs span{ font-size:11px; color:var(--muted); }
  .tl-i{ display:flex; gap:12px; padding:11px 0; border-top:1px solid var(--line); } .tl-i:first-of-type{ border-top:0; } .tl-ic{ width:32px; height:32px; border-radius:9px; background:#ede9fe; color:var(--ind); display:grid; place-content:center; flex:none; } .tl-ic .material-symbols-outlined{ font-size:18px; } .tl-i b{ color:var(--ink); font-size:13px; } .tl-i small{ display:block; color:var(--muted); font-size:12px; } .tl-i .when{ margin-left:auto; font-size:11px; color:#a0a0c0; white-space:nowrap; }
  .todo{ display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--line); } .todo:first-of-type{ border-top:0; } .todo .info{ flex:1; } .todo .info b{ color:var(--ink); font-size:13px; } .todo .info small{ display:block; color:var(--muted); font-size:11px; }
  .ai-row{ display:flex; gap:11px; background:#ede9fe; border-radius:12px; padding:12px 13px; margin-bottom:10px; } .ai-ic{ width:32px; height:32px; border-radius:9px; background:var(--ind); color:#fff; display:grid; place-content:center; flex:none; } .ai-row p{ margin:0; font-size:13px; color:var(--body); line-height:1.5; } .ai-row b{ color:var(--ink); }
  .tbl{ width:100%; border-collapse:collapse; font-size:13px; } .tbl th{ text-align:left; font-size:11px; text-transform:uppercase; color:var(--muted); font-weight:800; padding:11px 12px; border-bottom:2px solid var(--line); background:var(--bg); white-space:nowrap; } .tbl td{ padding:11px 12px; border-bottom:1px solid var(--line); white-space:nowrap; } .tbl tr:hover td{ background:var(--bg); }
  .tag{ font-size:11px; font-weight:800; border-radius:999px; padding:2px 9px; } .g-ok{ background:#dcfce7; color:#166534; } .g-wait{ background:#fef3c7; color:#92400e; } .g-rej{ background:#fee2e2; color:#991b1b; }
  .camp{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; } .cp{ background:#fff; border:1px solid var(--line); border-radius:15px; padding:16px; border-top:4px solid var(--vio); } .cp b{ color:var(--ink); } .cp .m{ display:flex; justify-content:space-between; margin-top:10px; font-size:12px; } .cp .m div span{ display:block; color:var(--muted); font-size:11px; } .cp .m div b{ color:var(--ind); font-size:16px; }
  .chart{ width:100%; height:270px; }
  @media (max-width:900px){ .shell{ grid-template-columns:1fr; } .shell>*{ min-width:0; } .side{ position:static; height:auto; min-width:0; } .nav{ flex-direction:row; overflow-x:auto; min-width:0; } .nav button{ white-space:nowrap; flex:none; } .nav .t,.side-f{ display:none; } .main{ min-width:0; } .grid{ grid-template-columns:1fr !important; } }
  @media (max-width:640px){ .top{ flex-wrap:wrap; padding:12px 16px; } .top .r{ width:100%; } .search{ flex:1; min-width:0; } .body{ padding:16px 14px 30px; } .kpis{ grid-template-columns:1fr 1fr; } .cstat{ grid-template-columns:1fr 1fr; } }
</style>
</head>

 ["OPP-09","鼎盛精密報價","210","報價議合","陳彥廷",80,"warm","展會"],["OPP-10","O昀雲端專案","320","報價議合","黃詩涵",78,"hot","官網"],["OPP-11","O通電信企網","280","報價議合","李柏翰",72,"hot","招標"],

const SCREENS={

let charts=[];
function pie(id,data){const el=document.getElementById(id);if(!el)return;const c=echarts.init(el);c.setOption({tooltip:{trigger:"item"},legend:{bottom:0,textStyle:{fontSize:11}},series:[{type:"pie",radius:["46%","72%"],center:["50%","44%"],itemStyle:{borderColor:"#fff",borderWidth:2},label:{show:false},data}]});charts.push(c);}
function draw(i){charts.forEach(c=>{try{c.dispose();}catch(e){}});charts=[];if(!window.echarts)return;
 if(i===2){pie("cQ",[{name:"待確認",value:3,itemStyle:{color:"#f59e0b"}},{name:"已核准",value:2,itemStyle:{color:"#16a34a"}},{name:"逾期",value:1,itemStyle:{color:"#dc2626"}},{name:"待報價",value:1,itemStyle:{color:"#818cf8"}}]);}

 if(i===4){const f=document.getElementById("cF");if(f){const c=echarts.init(f);c.setOption({tooltip:{trigger:"item"},series:[{type:"funnel",left:10,right:10,top:10,bottom:10,label:{color:"#4b4b6b"},data:[{value:100,name:"名單",itemStyle:{color:"#c7d2fe"}},{value:68,name:"商機",itemStyle:{color:"#a5b4fc"}},{value:42,name:"報價",itemStyle:{color:"#818cf8"}},{value:27,name:"成交",itemStyle:{color:"#4338ca"}}]}]});charts.push(c);}
  const r=document.getElementById("cR");if(r){const c=echarts.init(r);c.setOption({grid:{left:6,right:16,top:20,bottom:6,containLabel:true},tooltip:{trigger:"axis"},xAxis:{type:"category",data:["李柏翰","陳彥廷","吳佳蓉","黃詩涵","王志明"],axisLabel:{color:"#8888a8"}},yAxis:{type:"value",splitLine:{lineStyle:{color:"#ece9f8"}},axisLabel:{color:"#8888a8"}},series:[{type:"bar",data:[820,640,710,520,480],itemStyle:{color:"#4338ca",borderRadius:[6,6,0,0]}}]});charts.push(c);}
  const m=document.getElementById("cM");if(m){const c=echarts.init(m);c.setOption({grid:{left:8,right:16,top:20,bottom:8,containLabel:true},tooltip:{trigger:"axis"},legend:{data:["實際","預測"],top:0},xAxis:{type:"category",boundaryGap:false,data:["1月","2月","3月","4月","5月","6月"],axisLabel:{color:"#8888a8"}},yAxis:{type:"value",splitLine:{lineStyle:{color:"#ece9f8"}},axisLabel:{color:"#8888a8"}},series:[{name:"實際",type:"line",smooth:true,data:[280,320,300,360,340,380],itemStyle:{color:"#4338ca"},lineStyle:{width:3,color:"#4338ca"},areaStyle:{color:"#4338ca22"}},{name:"預測",type:"line",smooth:true,data:[null,null,null,null,340,410],itemStyle:{color:"#a5b4fc"},lineStyle:{width:3,type:"dashed",color:"#a5b4fc"}}]});charts.push(c);}}
}
const nav=document.getElementById("nav"),view=document.getElementById("view"),vt=document.getElementById("vt");
nav.innerHTML=`<div class="t">功能模組</div>`+MODS.map((m,i)=>`<button data-i="${i}" class="${i===0?"on":""}"><span class="material-symbols-outlined">${m[0]}</span>${m[1]}</button>`).join("");
function show(i){nav.querySelectorAll("button").forEach(b=>b.classList.toggle("on",+b.dataset.i===i));vt.textContent=NAMES[i];view.innerHTML=`<div class="vh"><div><h2>${NAMES[i]}</h2><p>${DESC[i]}</p></div></div>`+SCREENS[i]();draw(i);}
nav.addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(b)show(+b.dataset.i);});
