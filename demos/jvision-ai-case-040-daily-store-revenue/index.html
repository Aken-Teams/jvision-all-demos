<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>門市營收異常儀 · Daily Store Revenue Monitor</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;500;600;700;800;900&family=Rubik:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000000;
  --color-secondary:#10B981;
  --color-on-secondary:#0F172A;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#ECFDF5;
  --color-foreground:#064E3B;
  --color-card:#FFFFFF;
  --color-card-foreground:#064E3B;
  --color-muted:#E8F1F3;
  --color-muted-foreground:#475569;
  --color-border:#A7F3D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#059669;
  --blue:#059669;
  --ink:#064E3B;
  --muted:#475569;
  --line:#A7F3D0;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --panel2:#F4FFF9;
  --ok:#047857;
  --warn:#B45309;
  --bad:var(--color-destructive);
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{
  margin:0;
  background:
    linear-gradient(rgba(5,150,105,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(5,150,105,.08) 1px,transparent 1px),
    var(--bg);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Nunito Sans",sans-serif;
  font-size:15px;
}
button,a,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:4px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{font-size:21px;line-height:1;vertical-align:middle}
.top{
  position:sticky;
  top:0;
  z-index:20;
  display:grid;
  grid-template-columns:auto auto 1fr;
  align-items:center;
  gap:18px;
  padding:12px 20px;
  background:#fff;
  border-bottom:3px solid var(--ink);
  box-shadow:7px 7px 0 rgba(6,78,59,.14);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{
  display:grid;
  place-items:center;
  width:46px;
  height:46px;
  flex:none;
  background:var(--color-primary);
  border:3px solid var(--ink);
  color:#000;
  font-family:Rubik,sans-serif;
  font-size:22px;
  font-weight:900;
  box-shadow:4px 4px 0 var(--ink);
}
.brand b{
  display:block;
  font-family:Rubik,"Nunito Sans",sans-serif;
  font-size:16px;
  font-weight:900;
  letter-spacing:.02em;
}
.brand span{
  display:block;
  color:var(--color-primary);
  font-family:Rubik,sans-serif;
  font-size:10px;
  font-weight:900;
  letter-spacing:.15em;
}
.tick{
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 10px;
  background:#FFF7ED;
  border:2px solid var(--color-accent);
  color:#7C2D12;
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
}
.tick i{
  width:10px;
  height:10px;
  background:var(--bad);
  border:2px solid #7F1D1D;
  animation:pulse 1.5s steps(2,end) infinite;
}
.nav{
  display:flex;
  justify-content:flex-end;
  gap:6px;
  min-width:0;
  overflow-x:auto;
  scrollbar-width:thin;
}
.nav button{
  display:flex;
  align-items:center;
  gap:6px;
  flex:none;
  padding:10px 12px;
  background:var(--color-muted);
  border:2px solid var(--ink);
  border-radius:0;
  color:var(--ink);
  font:800 13px "Nunito Sans",sans-serif;
  box-shadow:3px 3px 0 var(--ink);
  transition:transform .18s ease,box-shadow .18s ease,background .18s ease;
}
.nav button:hover{background:#D1FAE5;transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.nav button.on{background:var(--color-accent);color:#000;transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.wrap{width:min(1380px,100%);margin:auto;padding:28px 22px 48px}
.vh{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:18px;
  margin-bottom:20px;
  padding:22px;
  background:var(--color-primary);
  border:3px solid var(--ink);
  box-shadow:8px 8px 0 var(--ink);
}
.vh h2{
  margin:0;
  color:#000;
  font-family:Rubik,"Nunito Sans",sans-serif;
  font-size:clamp(25px,4vw,46px);
  font-weight:900;
  line-height:1;
  letter-spacing:-.04em;
}
.vh p{max-width:720px;margin:9px 0 0;color:#052E25;font-size:14px;font-weight:700}
.pill{
  display:flex;
  align-items:center;
  flex:none;
  min-height:44px;
  padding:9px 13px;
  background:var(--color-accent);
  border:3px solid #000;
  color:#000;
  font-family:Rubik,sans-serif;
  font-size:13px;
  font-weight:900;
  box-shadow:4px 4px 0 #000;
}
.view{display:none}
.view.on{display:block}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi,.card,.sc,.kc{
  position:relative;
  min-width:0;
  background:var(--panel);
  border:3px solid var(--ink);
  border-radius:0;
  box-shadow:6px 6px 0 rgba(6,78,59,.22);
}
.kpi{padding:16px;overflow:hidden}
.kpi::before{
  content:"";
  position:absolute;
  top:0;
  right:0;
  width:34px;
  height:10px;
  background:var(--color-secondary);
  border-left:2px solid var(--ink);
  border-bottom:2px solid var(--ink);
}
.kpi:nth-child(even)::before{background:var(--color-accent)}
.kpi .l{color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{
  margin-top:5px;
  color:var(--ink);
  font:900 clamp(24px,3vw,34px) Rubik,sans-serif;
  font-variant-numeric:tabular-nums;
}
.kpi .d{margin-top:5px;font-size:12px;font-weight:900}
.up{color:#047857}.dn{color:#B91C1C}
.grid{display:grid;gap:18px}
.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.5fr) minmax(300px,.9fr)}
.g11{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{padding:17px}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin:0 0 15px;
  padding-bottom:10px;
  border-bottom:3px solid var(--ink);
  color:var(--ink);
  font-family:Rubik,"Nunito Sans",sans-serif;
  font-size:15px;
  font-weight:900;
}
.card h3 .material-symbols-outlined{
  display:grid;
  place-items:center;
  width:30px;
  height:30px;
  background:var(--color-secondary);
  border:2px solid var(--ink);
  color:#000;
}
.chart{height:240px;min-width:0}
.tag{
  display:inline-flex;
  align-items:center;
  min-height:25px;
  padding:3px 8px;
  border:2px solid currentColor;
  border-radius:0;
  font-size:10px;
  font-weight:900;
  line-height:1.2;
  white-space:nowrap;
}
.t-r{background:#FEE2E2;color:#991B1B}
.t-a{background:#FFEDD5;color:#92400E}
.t-b{background:#DBEAFE;color:#1E40AF}
.t-g{background:#D1FAE5;color:#065F46}
.scroll{overflow:auto;border:2px solid var(--ink)}
table.data{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
table.data th,table.data td{padding:10px 11px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{
  position:sticky;
  top:0;
  z-index:1;
  background:var(--ink);
  color:#fff;
  font-size:11px;
  font-weight:900;
  letter-spacing:.04em;
}
table.data tr:nth-child(even) td{background:#F0FDF4}
table.data tr:hover td{background:#D1FAE5}
.num{
  text-align:right!important;
  font-family:Rubik,monospace;
  font-weight:800;
  font-variant-numeric:tabular-nums;
}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:11px;font-weight:800}
.legend span{display:flex;align-items:center;gap:5px}
.dot{display:inline-block;width:11px;height:11px;border:2px solid var(--ink)}
.alist{display:flex;flex-direction:column;gap:10px}
.al{
  display:flex;
  align-items:flex-start;
  gap:11px;
  padding:11px;
  background:#fff;
  border:2px solid var(--ink);
  border-left-width:8px;
}
.al.r{border-left-color:var(--bad);background:#FFF7F7}
.al.a{border-left-color:var(--color-accent);background:#FFF9F0}
.al.g{border-left-color:var(--ok);background:#F0FDF4}
.al .ic{
  display:grid;
  place-items:center;
  width:35px;
  height:35px;
  flex:none;
  border:2px solid var(--ink);
  background:var(--color-muted);
  color:var(--ink);
}
.al.r .ic{background:#FECACA;color:#991B1B}
.al.a .ic{background:#FED7AA;color:#9A3412}
.al.g .ic{background:#A7F3D0;color:#065F46}
.al .bd{flex:1;min-width:0}
.al .bd b{font-size:13px;font-weight:900}
.al .bd small{display:block;margin-top:3px;color:var(--muted);font-size:11px;line-height:1.5}
.al .rt{flex:none;text-align:right}
.al .rt .dv{font:900 15px Rubik,sans-serif;font-variant-numeric:tabular-nums}
.al .rt small{display:block;color:var(--muted);font:700 10px Rubik,monospace}
.storelist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.sc{padding:14px}
.sc.badx{border-color:var(--bad);box-shadow:6px 6px 0 #FCA5A5}
.sc .top2{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.sc b{font-size:14px;font-weight:900}
.sc .rev{margin-top:8px;font:900 22px Rubik,sans-serif;font-variant-numeric:tabular-nums}
.sc small{display:block;margin-top:4px;color:var(--muted);font-size:11px;font-weight:700}
.sc .bar,.br .track{
  height:12px;
  overflow:hidden;
  background:var(--color-muted);
  border:2px solid var(--ink);
}
.sc .bar{margin-top:10px}
.sc .bar i,.br .track i{display:block;height:100%}
.bars{display:flex;flex-direction:column;gap:12px}
.br{display:grid;grid-template-columns:110px 1fr 58px;align-items:center;gap:10px;font-size:12px}
.br b{font-weight:900}
.br .val{text-align:right;font:900 12px Rubik,monospace}
.dl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px;color:var(--muted)}
.dl .crumb{
  padding:7px 10px;
  background:#fff;
  border:2px solid var(--ink);
  color:var(--ink);
  font-size:12px;
  font-weight:900;
  box-shadow:3px 3px 0 var(--ink);
}
.dl .crumb.act{background:var(--color-accent);color:#000}
.hm{display:grid;grid-template-columns:70px repeat(7,minmax(38px,1fr));gap:5px;font-size:10px}
.hm .hh,.hm .rl{display:flex;align-items:center;font-weight:900}
.hm .hh{justify-content:center;color:var(--muted)}
.hm .rl{color:var(--ink);font-size:11px}
.hm .cell{
  display:grid;
  place-items:center;
  height:34px;
  border:2px solid var(--ink);
  font:900 10px Rubik,monospace;
}
.kb{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.kc{padding:14px;background:#F0FDF4;box-shadow:4px 4px 0 rgba(6,78,59,.2)}
.kc .material-symbols-outlined{color:var(--color-primary);font-size:26px}
.kc b{display:block;margin:6px 0 4px;font-size:14px;font-weight:900}
.kc p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}
.rep{display:grid;grid-template-columns:minmax(300px,.8fr) minmax(0,1.2fr);gap:18px}
.rep>*{min-width:0}
.opt{display:flex;flex-direction:column;gap:10px}
.oz,.sched{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  padding:11px;
  background:#F8FFFB;
  border:2px solid var(--ink);
}
.oz b,.sched b{font-size:13px;font-weight:900}
.oz small{display:block;color:var(--muted);font-size:11px}
.chip{display:flex;gap:5px;flex-wrap:wrap}
.chip .c{
  padding:4px 8px;
  background:var(--color-primary);
  border:2px solid var(--ink);
  color:#000;
  font-size:11px;
  font-weight:900;
}
.chip .c.off{background:var(--color-muted);color:var(--muted)}
.sched{margin-bottom:9px;font-size:12px}
.sched .material-symbols-outlined{color:var(--color-accent)}
.sched .r{margin-left:auto;color:var(--muted);font:700 11px Rubik,monospace}
.prev{padding:15px;background:#F8FFFB;border:3px dashed var(--ink)}
.prev .ph{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:14px;
  padding-bottom:11px;
  border-bottom:2px solid var(--ink);
}
.prev .ph b{font-size:15px;font-weight:900}
.prev .ph small{display:block;color:var(--muted);font-size:11px}
.grid-item{animation:arrive .42s cubic-bezier(.2,.9,.2,1.2) both}
.grid-item:nth-child(2){animation-delay:.06s}
.grid-item:nth-child(3){animation-delay:.12s}
.grid-item:nth-child(4){animation-delay:.18s}
@keyframes arrive{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.35}}
@media(max-width:1050px){
  .top{grid-template-columns:1fr auto}
  .nav{grid-column:1/-1;justify-content:flex-start}
  .g2,.g11,.g3,.rep{grid-template-columns:1fr}
}
@media(max-width:768px){
  .wrap{padding:20px 14px 40px}
  .top{padding:10px 13px;gap:12px}
  .tick{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .vh{align-items:flex-start;flex-direction:column;padding:18px}
  .pill{align-self:stretch}
  .card{padding:14px}
}
@media(max-width:480px){
  .brand span{letter-spacing:.08em}
  .nav button{min-width:44px;min-height:44px;padding:10px}
  .nav button span:not(.material-symbols-outlined){display:none}
  .kpis{grid-template-columns:1fr}
  .kpi .v{font-size:30px}
  .br{grid-template-columns:86px 1fr 50px}
  .hm{grid-template-columns:54px repeat(7,minmax(36px,1fr))}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">異</div>
    <div><b>門市營收異常儀</b><span>DAILY REVENUE MONITOR</span></div>
  </div>
  <div class="tick"><i aria-hidden="true"></i><span>警示：32 門市 · 3 異常告警</span></div>
  <nav class="nav" id="nav" aria-label="主要功能"></nav>
</header>
<main class="wrap">
  <div class="vh">
    <div><h2 id="vt">營收總覽</h2><p id="vd"></p></div>
    <div class="pill" id="badge">今日營收 NT$ 4.86M</div>
  </div>
  <div id="view"></div>
</main>
<script>
var MOD=[
 ["營收總覽","monitoring","營收總覽","全門市每日營收即時看板、達成率與異常門市快照"],
 ["異常偵測","warning","異常偵測","營收管制上下限管制圖，自動標記突破管制界線的異常點"],
 ["門市比較","compare_arrows","門市比較","門市間營收、客單與偏離度排行，定位異常來源"],
 ["品類時段","category","品類時段","品類與時段營收熱度、貢獻缺口與異常主因歸因"],
 ["預警通知","notifications_active","預警通知","異常門市告警派送、負責人指派與處理追蹤"],
 ["營收報表","summarize","營收報表","日/週營收異常報表、趨勢彙整與排程寄送"]
];
var BADGE=["今日營收 NT$ 4.86M","異常點 3 · 突破管制界線","偏離最大 -34%","品類缺口 美妝 -22%","告警 3 · 待處理 2","日報 · 2026/08/13"];
var STORES=[
 ["信義旗艦店","北區",842,780,108,"g"],["南港 CITYLINK","北區",618,640,97,"g"],
 ["板橋大遠百","北區",411,468,88,"a"],["桃園統領","北區",286,392,73,"r"],
 ["台中大遠百","中區",574,560,102,"g"],["新竹巨城","北區",496,470,106,"g"],
 ["台中三井","中區",338,410,82,"a"],["高雄夢時代","南區",531,520,102,"g"],
 ["台南南紡","南區",294,398,74,"r"],["嘉義垂楊","南區",188,286,66,"r"],
 ["桃園藝文","北區",356,360,99,"g"],["中壢 SOGO","北區",402,420,96,"g"]
];
var ATC=[1284,1210,1042,986,1180,1220,940,1156,902,868,1104,1088];
var ALERTS=[
 ["嘉義垂楊","營收 188K 跌破管制下限（下限 214K），偏離 -34%","-34%","r","09:12"],
 ["桃園統領","下午時段營收驟降，突破 -2σ 下限，客流 -21%","-27%","r","10:40"],
 ["台南南紡","連續 3 日低於預期，週末檔期轉換走弱","-26%","r","昨日"],
 ["台中三井","美妝品類缺口擴大，接近管制下限","-18%","a","11:05"]
];
var HH=[["上午",[92,64,58,110,72,46,140]],["午間",[130,88,80,150,96,60,180]],["下午",[110,70,62,120,74,40,160]],["傍晚",[168,102,90,175,120,66,210]],["夜間",[120,78,70,128,88,50,150]]];
var CATS=["美妝","女裝","3C","家居","食品","鞋包","配件"];
var CAT_GAP=[["美妝保養",-22,"r"],["女裝服飾",-9,"a"],["3C 配件",4,"g"],["生活家居",-3,"a"],["食品飲料",6,"g"],["鞋包配件",-14,"a"]];
var nav=document.getElementById("nav"),view=document.getElementById("view"),vt=document.getElementById("vt"),vd=document.getElementById("vd"),badge=document.getElementById("badge");
function icon(name){return '<span class="material-symbols-outlined" aria-hidden="true">'+name+"</span>"}
function tag(state,text){return '<span class="tag t-'+state+'">'+text+"</span>"}
function stateName(s){return s==="g"?"正常":s==="a"?"觀察":"異常"}
function color(s){return s==="g"?"#047857":s==="a"?"#B45309":"#DC2626"}
MOD.forEach(function(m,i){
  var b=document.createElement("button");
  b.type="button";
  b.dataset.i=i;
  b.setAttribute("aria-label",m[0]);
  b.innerHTML=icon(m[1])+"<span>"+m[0]+"</span>";
  b.onclick=function(){location.hash="v"+i};
  nav.appendChild(b);
});
function kpi(label,value,detail,cls){
 return '<div class="kpi grid-item"><div class="l">'+label+'</div><div class="v">'+value+'</div><div class="d '+(cls||"")+'">'+detail+"</div></div>";
}
function alerts(){
 return ALERTS.map(function(a){
  return '<div class="al '+a[3]+'"><div class="ic">'+icon(a[3]==="r"?"trending_down":"warning")+'</div><div class="bd"><b>'+a[0]+"</b><small>"+a[1]+'</small></div><div class="rt"><div class="dv" style="color:'+color(a[3])+'">'+a[2]+"</div><small>"+a[4]+"</small></div></div>";
 }).join("");
}
