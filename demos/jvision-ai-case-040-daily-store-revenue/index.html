<style>
:root{--accent:#dc2626;--accent2:#f59e0b;--bg:#f5f6f8;--panel:#ffffff;--panel2:#fbfbfc;--line:#e7e9ee;--ink:#1c2230;--mut:#6b7280;--ok:#16a34a;--warn:#f59e0b;--bad:#dc2626;--blu:#2563eb}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.top{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 20px;position:sticky;top:0;z-index:20;flex-wrap:wrap;box-shadow:0 1px 3px rgba(20,25,40,.05)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),#ef4444);display:grid;place-items:center;font-weight:900;color:#fff;flex:none;box-shadow:0 3px 10px rgba(220,38,38,.35)}

.tick{margin-left:10px;display:flex;align-items:center;gap:7px;background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.22);padding:5px 11px;border-radius:8px;font-size:11.5px;font-weight:700;color:var(--accent);white-space:nowrap;min-width:0}
.tick i{width:8px;height:8px;border-radius:50%;background:var(--bad);display:inline-block;animation:bl 1.6s infinite}
@keyframes bl{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(220,38,38,.5)}50%{opacity:.4;box-shadow:0 0 0 5px rgba(220,38,38,0)}}
.nav{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap;min-width:0}
.nav button{border:0;background:transparent;color:var(--mut);font:inherit;font-weight:600;font-size:13px;padding:9px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:#f1f2f5;color:var(--ink)}
.nav button.on{background:linear-gradient(135deg,var(--accent),#ef4444);color:#fff;box-shadow:0 2px 8px rgba(220,38,38,.3)}
.wrap{max-width:1320px;margin:0 auto;padding:20px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:20px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.pill{background:rgba(220,38,38,.1);color:var(--accent);border:1px solid rgba(220,38,38,.28);padding:6px 13px;border-radius:9px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:7px;white-space:nowrap}
.view{display:none;animation:f .3s}
.view.on{display:block}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}
.kpis>*{min-width:0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 15px;position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(20,25,40,.04)}

.kpi .l{font-size:11.5px;color:var(--mut);font-weight:600}
.kpi .v{font-size:24px;font-weight:800;margin-top:3px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:15px}.grid>*{min-width:0}
.g2{grid-template-columns:1.5fr .9fr}
.g11{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:0 1px 2px rgba(20,25,40,.04)}

.card h3 .material-symbols-outlined{color:var(--accent)}
.chart{height:230px}
.tag{font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;white-space:nowrap}

table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px}
table.data tr:hover td{background:var(--panel2)}
.num{font-family:Inter;font-weight:700;text-align:right}
.scroll{overflow-x:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:6px}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.bars{display:flex;flex-direction:column;gap:11px}
.br{display:grid;grid-template-columns:110px 1fr 60px;align-items:center;gap:10px;font-size:12px}
.br b{font-family:"Noto Sans TC";font-weight:700}
.br .track{height:12px;background:#eef0f4;border-radius:6px;overflow:hidden}
.br .track i{display:block;height:100%;border-radius:6px}
.br .val{font-family:Inter;font-weight:800;text-align:right}
.alist{display:flex;flex-direction:column;gap:9px}
.al{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--mut)}
.al.r{border-left-color:var(--bad);background:rgba(220,38,38,.04)}
.al.a{border-left-color:var(--warn);background:rgba(245,158,11,.05)}
.al.g{border-left-color:var(--ok)}
.al .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
.al.r .ic{background:rgba(220,38,38,.12);color:var(--bad)}
.al.a .ic{background:rgba(245,158,11,.16);color:var(--warn)}
.al.g .ic{background:rgba(22,163,74,.12);color:var(--ok)}
.al .bd{flex:1;min-width:0}
.al .bd b{font-family:"Noto Sans TC";font-size:13px}
.al .bd small{display:block;color:var(--mut);font-size:11px;margin-top:2px;line-height:1.5}
.al .rt{text-align:right;flex:none}

.al .rt small{color:var(--mut);font-size:10px;display:block}
.storelist{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.storelist>*{min-width:0}
.sc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(20,25,40,.04)}

.sc b{font-family:"Noto Sans TC";font-size:13.5px}
.sc .rev{font-family:Inter;font-size:20px;font-weight:900;margin-top:5px}
.sc small{color:var(--mut);font-size:11px;display:block;margin-top:3px}
.sc .bar{height:6px;background:#eef0f4;border-radius:4px;overflow:hidden;margin-top:9px}
.sc .bar i{display:block;height:100%}
.dl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);margin-bottom:12px;flex-wrap:wrap}
.dl .crumb{background:var(--panel);border:1px solid var(--line);padding:5px 11px;border-radius:8px;font-weight:700;color:var(--ink);font-family:"Noto Sans TC"}
.dl .crumb.act{background:linear-gradient(135deg,var(--accent),#ef4444);color:#fff;border-color:transparent}
.dl .material-symbols-outlined{font-size:16px}
.kc{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:14px}
.kb{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:13px}
.kb>*{min-width:0}
.kc .material-symbols-outlined{color:var(--accent);font-size:24px}

.kc p{margin:0;font-size:12px;color:var(--mut);line-height:1.6}
.rep{display:grid;grid-template-columns:.85fr 1.15fr;gap:15px}.rep>*{min-width:0}
.opt{display:flex;flex-direction:column;gap:9px}
.oz{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--panel2);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.oz small{color:var(--mut);font-size:11px;display:block}
.chip{display:inline-flex;gap:5px;flex-wrap:wrap}

.prev{border:1px dashed var(--line);border-radius:12px;background:var(--panel2);padding:16px}

.sched{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:9px;background:var(--panel);border:1px solid var(--line);margin-bottom:8px;font-size:12px;flex-wrap:wrap}

.sched .r{margin-left:auto;color:var(--mut)}
.hm{display:grid;grid-template-columns:70px repeat(7,1fr);gap:4px;font-size:10.5px}
.hm .hh{color:var(--mut);font-weight:700;display:flex;align-items:center;justify-content:center;padding:3px 0}
.hm .rl{color:var(--mut);font-weight:700;display:flex;align-items:center;font-family:"Noto Sans TC";font-size:11px}
.hm .cell{height:30px;border-radius:6px;display:grid;place-items:center;color:#fff;font-weight:800;font-family:Inter;font-size:10px}
@media(max-width:980px){.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g11,.g3,.rep{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:14px}.tick{display:none}.nav button span:not(.material-symbols-outlined){display:none}.nav button{padding:9px}.kpis{grid-template-columns:1fr}.hm{font-size:9px;grid-template-columns:52px repeat(7,1fr)}}
</style>
</head>
