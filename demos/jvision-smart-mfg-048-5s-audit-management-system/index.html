<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>5S稽核管理系統（5S Audit Management System）｜Jvision 系統 Demo</title>
  <meta name="description" content="從稽核排程、現場評分到缺失改善與複查結案的 5S 品質閉環稽核平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --accent:#0f766e;--accent2:#5eead4;--ink:#0f172a;--muted:#64748b;
      --line:#e2e8f0;--bg:#f4f7f6;--card:#ffffff;--soft:#effcfa;
      --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--radius:16px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{max-width:100%;overflow-x:hidden}
    body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
    .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;vertical-align:middle}
    a{color:inherit;text-decoration:none}
    .shell{display:flex;min-height:100vh;align-items:stretch}
    .sidebar{width:250px;flex:none;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
    .brand{display:flex;align-items:center;gap:11px;padding:18px 16px;border-bottom:1px solid var(--line)}
    .brand .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#0d9488);display:grid;place-items:center;flex:none}
    .brand .logo .material-symbols-outlined{font-size:24px;color:#ecfeff}
    .brand .txt{min-width:0}
    .brand h1{font-size:15px;font-weight:800;letter-spacing:.2px;line-height:1.25}
    .brand .subx{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .nav{padding:12px 10px;display:flex;flex-direction:column;gap:4px;overflow:auto}
    .nav .lbl{font-size:11px;color:var(--muted);padding:8px 10px 4px;letter-spacing:.5px}
    .navbtn{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;border:1px solid transparent;background:transparent;color:var(--ink);cursor:pointer;font:inherit;font-size:14px;font-weight:600;text-align:left;min-width:0;width:100%}
    .navbtn .material-symbols-outlined{font-size:21px;color:var(--muted);flex:none}
    .navbtn .nlabel{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .navbtn:hover{background:var(--soft)}
    .navbtn.on{background:linear-gradient(100deg,#0f766e,#0d9488);color:#fff;border-color:#0f766e;box-shadow:0 6px 16px rgba(15,118,110,.28)}
    .navbtn.on .material-symbols-outlined{color:#ccfbf1}
    .sidefoot{margin-top:auto;padding:14px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
    .main{flex:1;min-width:0;display:flex;flex-direction:column}
    .topbar{position:sticky;top:0;z-index:30;background:rgba(244,247,246,.86);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
    .topbar .pagetitle{font-size:16px;font-weight:800;min-width:0}
    .topbar .pagetitle .m{display:block;font-size:11px;color:var(--muted);font-weight:500}
    .spacer{flex:1}
    .pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--accent);white-space:nowrap}
    .pill .material-symbols-outlined{font-size:16px}
    .content{padding:20px;max-width:1360px;width:100%;margin:0 auto}
    .grid{display:grid;gap:14px}
    .g2{grid-template-columns:repeat(2,1fr)}
    .g3{grid-template-columns:repeat(3,1fr)}
    .g4{grid-template-columns:repeat(4,1fr)}
    .col-2{grid-template-columns:2fr 1fr}
    .col-3{grid-template-columns:1.4fr 1fr}
    @media(max-width:820px){
      .g2,.g3,.g4,.col-2,.col-3{grid-template-columns:1fr}
    }
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
    .card.pad0{padding:0;overflow:hidden}
    .chd{display:flex;align-items:center;gap:9px;margin-bottom:12px}
    .chd .material-symbols-outlined{font-size:20px;color:var(--accent)}
    .chd h3{font-size:14px;font-weight:800}
    .chd .subx{font-size:12px;color:var(--muted);font-weight:500}
    .chd .r{margin-left:auto}
    .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;min-width:0}
    .kpi .top{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;font-weight:600;min-width:0}
    .kpi .top .material-symbols-outlined{font-size:18px}
    .kpi .ic{width:34px;height:34px;border-radius:10px;background:var(--soft);display:grid;place-items:center;flex:none}
    .kpi .ic .material-symbols-outlined{font-size:19px;color:var(--accent)}
    .kpi .val{font-size:26px;font-weight:900;letter-spacing:-.5px;margin-top:8px}
    .kpi .val small{font-size:13px;font-weight:700;color:var(--muted)}
    .kpi .dt{font-size:12px;margin-top:3px;display:flex;align-items:center;gap:5px}
    .kpi .dt .material-symbols-outlined{font-size:15px}
    .up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
    table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
    thead th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafcfb}
    tbody td{padding:10px 12px;border-bottom:1px solid #f1f5f4;vertical-align:middle}
    tbody tr:last-child td{border-bottom:none}
    tbody tr:hover{background:#fafdfc}
    .scroll{overflow-x:auto}
    .tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
    .tag .material-symbols-outlined{font-size:13px}
    .t-ok{background:#dcfce7;color:#15803d}
    .t-warn{background:#fef3c7;color:#b45309}
    .t-bad{background:#fee2e2;color:#b91c1c}
    .t-info{background:#cffafe;color:#0e7490}
    .t-mut{background:#f1f5f9;color:#475569}
    .bar{height:8px;border-radius:999px;background:#e6efed;overflow:hidden;min-width:60px}
    .bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#0f766e,#5eead4)}
    .fiveS{display:grid;gap:12px;grid-template-columns:repeat(5,1fr)}
    @media(max-width:820px){.fiveS{grid-template-columns:1fr 1fr}}
    @media(max-width:480px){.fiveS{grid-template-columns:1fr}}
    .scol{border:1px solid var(--line);border-radius:14px;background:#fafcfb;padding:10px;min-width:0}
    .scol .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
    .scol .sh b{font-size:13px}
    .scol .sh .sc{font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px}
    .item{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 9px;margin-bottom:7px;font-size:12px}
    .item .it-h{display:flex;align-items:center;justify-content:space-between;gap:6px}
    .item .m{color:var(--muted);font-size:11px;margin-top:3px}
    .checkrow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #f1f5f4;flex-wrap:wrap}
    .checkrow:last-child{border-bottom:none}
    .checkrow .qi{width:32px;height:32px;border-radius:9px;background:var(--soft);display:grid;place-items:center;flex:none;color:var(--accent);font-weight:800;font-size:13px}
    .checkrow .qt{flex:1;min-width:120px}
    .checkrow .qt b{font-size:13.5px;font-weight:700}
    .checkrow .qt .m{font-size:12px;color:var(--muted)}
    .scoreset{display:flex;gap:5px;flex:none;flex-wrap:wrap}
    .sbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:800;background:#fff;color:var(--muted)}
    .sbtn.act{background:var(--accent);color:#fff;border-color:var(--accent)}
    .tl{position:relative;padding-left:24px}
    .tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}
    .tl .ev{position:relative;padding:0 0 16px 0}
    .tl .ev::before{content:"";position:absolute;left:-20px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
    .tl .ev.done::before{background:var(--accent)}
    .tl .ev .tt{font-size:13px;font-weight:700}
    .tl .ev .mm{font-size:12px;color:var(--muted)}
    .tl .ev .tm{font-size:11px;color:var(--accent);font-weight:700}
    .chartbox{position:relative;width:100%;height:260px}
    .chartbox.sm{height:220px}
    .radarwrap{position:relative;width:100%;height:300px}
    .flexrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#0f766e,#5eead4);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
    .rank{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid #f1f5f4}
    .rank:last-child{border-bottom:none}
    .rank .no{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:900;font-size:13px;background:var(--soft);color:var(--accent);flex:none}
    .rank .no.g1{background:#fef9c3;color:#a16207}
    .rank .no.g2{background:#f1f5f9;color:#475569}
    .rank .no.g3{background:#ffedd5;color:#c2410c}
    .rank .rn{flex:1;min-width:0;font-size:13px;font-weight:700}
    .rank .rn .m{font-size:11px;color:var(--muted);font-weight:500}
    .big{font-size:15px;font-weight:900;color:var(--accent)}
    .note{background:var(--soft);border:1px solid #cbeee8;border-radius:12px;padding:11px 13px;font-size:12.5px;color:#0f5850;display:flex;gap:9px;align-items:flex-start}
    .note .material-symbols-outlined{font-size:18px;color:var(--accent);flex:none}
    .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
    .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
    .donutwrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
    .prog-list > div{margin-bottom:13px}
    .prog-list .lab{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:5px}
    .stat-strip{display:flex;gap:10px;flex-wrap:wrap}
    .stat-strip .s{flex:1;min-width:120px;background:var(--soft);border:1px solid #cbeee8;border-radius:12px;padding:11px 13px}
    .stat-strip .s .l{font-size:11.5px;color:var(--muted);font-weight:600}
    .stat-strip .s .v{font-size:20px;font-weight:900;color:var(--accent);margin-top:2px}
    .mono{font-variant-numeric:tabular-nums}
    @media(max-width:860px){
      .shell{flex-direction:column}
      .sidebar{width:100%;height:auto;position:static;flex-direction:column;border-right:none;border-bottom:1px solid var(--line)}
      .nav{flex-direction:row;flex-wrap:wrap;padding:8px 10px;gap:6px}
      .nav .lbl,.sidefoot{display:none}
      .navbtn{width:auto;flex:none;white-space:nowrap;padding:9px 12px}
    }
    @media(max-width:560px){
      .navbtn .nlabel{display:none}
      .navbtn{padding:9px 11px}
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">cleaning_services</span></div>
        <div class="txt">
          <h1>5S稽核管理</h1>
          <div class="subx">5S Audit Management</div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <div class="lbl">稽核模組</div>
      </nav>
      <div class="sidefoot">
        <div style="font-weight:700;color:var(--ink)">德昌精機 · 二廠</div>
        <div>2026 Q3 稽核週期 · QMS 整合</div>
      </div>
    </aside>
    <div class="main">
      <div class="topbar">
        <div class="pagetitle" id="ptitle">稽核排程<span class="m" id="psub">區域週期排定與稽核員指派</span></div>
        <div class="spacer"></div>
        <span class="pill"><span class="material-symbols-outlined">verified</span>平均 87.4 分</span>
        <span class="pill"><span class="material-symbols-outlined">person</span>品保專員 · 林曉琪</span>
      </div>
      <div class="content" id="view"></div>
    </div>
  </div>

<script>
(function(){
  "use strict";
  var MODS = [
    {icon:"event_available", name:"稽核排程", sub:"區域週期排定與稽核員指派"},
    {icon:"checklist",       name:"行動稽核表", sub:"5S 分項評分與現場拍照存證"},
    {icon:"scoreboard",      name:"評分彙整", sub:"各區 5S 分數自動計算與比較"},
    {icon:"build_circle",    name:"缺失改善", sub:"缺失分派、期限與改善進度追蹤"},
    {icon:"task_alt",        name:"複查結案", sub:"改善成效複查與稽核結案確認"},
    {icon:"insights",        name:"稽核分析", sub:"趨勢、紅榜排行與5S素養洞察"}
  ];

  var liveCharts = [];
  function destroyCharts(){ for(var i=0;i<liveCharts.length;i++){ try{liveCharts[i].destroy();}catch(e){} } liveCharts=[]; }
  function gc(id){ return document.getElementById(id); }
  function mk(id,cfg){ var el=gc(id); if(!el) return; var c=new Chart(el,cfg); liveCharts.push(c); return c; }

  var view = gc("view");

  (function(){
    var nav = gc("nav");
    var html = '<div class="lbl">稽核模組</div>';
    for(var i=0;i<MODS.length;i++){
      html += '<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span><span class="nlabel">'+MODS[i].name+'</span></button>';
    }
    nav.innerHTML = html;
    nav.addEventListener("click", function(e){
      var b = e.target && e.target.closest ? e.target.closest("[data-i]") : null;
      if(!b) return;
      show(+b.getAttribute("data-i"));
    });
  })();

  function setActive(i){
    var btns = document.querySelectorAll("[data-i]");
    for(var k=0;k<btns.length;k++){ btns[k].classList.toggle("on", +btns[k].getAttribute("data-i")===i); }
    gc("ptitle").childNodes[0].nodeValue = MODS[i].name;
    gc("psub").textContent = MODS[i].sub;
  }

  function bar(pct){ return '<div class="bar"><i style="width:'+Math.max(3,Math.min(100,pct))+'%"></i></div>'; }
  function scoreTag(s){
    var cls = s>=90?"t-ok":(s>=80?"t-info":(s>=70?"t-warn":"t-bad"));
    return '<span class="tag '+cls+'">'+s.toFixed(1)+'</span>';
  }
  function progRow(l,p){ return '<div><div class="lab"><span>'+l+'</span><span class="mono">'+p+'%</span></div>'+bar(p)+'</div>'; }
  function kpi(icon,label,val,unit,dir,dt){
    var dcl = dir==="up"?"up":(dir==="down"?"down":"flat");
    var dic = dir==="up"?"north_east":(dir==="down"?"south_east":"remove");
    return '<div class="kpi"><div class="flexrow" style="justify-content:space-between"><div class="top"><span class="material-symbols-outlined">'+icon+'</span>'+label+'</div><div class="ic"><span class="material-symbols-outlined">'+icon+'</span></div></div>'+
      '<div class="val">'+val+' <small>'+unit+'</small></div>'+
      '<div class="dt '+dcl+'"><span class="material-symbols-outlined">'+dic+'</span>'+dt+'</div></div>';
  }
  function legItem(c,l,v){ return '<span><i style="background:'+c+'"></i>'+l+' <b style="color:var(--ink)">'+v+'</b></span>'; }
  function baseOpt(extra){
    var o = { responsive:true, maintainAspectRatio:false, plugins:{legend:{}}, animation:{duration:500} };
    if(extra){ for(var k in extra){ if(extra.hasOwnProperty(k)) o[k]=extra[k]; } }
    return o;
  }

  // ================= SCREEN 0 : 稽核排程 =================
  function s0(){
    var sched = [
      {area:"SMT 貼片區", zone:"A-01", auditor:"林曉琪", date:"08/18 09:00", cycle:"週稽", type:"例行", st:"已排程"},
      {area:"波峰焊產線", zone:"A-03", auditor:"陳建豪", date:"08/18 13:30", cycle:"週稽", type:"例行", st:"已排程"},
      {area:"成品倉儲", zone:"B-02", auditor:"王思穎", date:"08/19 10:00", cycle:"月稽", type:"重點", st:"待確認"},
      {area:"包裝出貨區", zone:"B-05", auditor:"林曉琪", date:"08/19 15:00", cycle:"週稽", type:"例行", st:"已排程"},
      {area:"物料暫存區", zone:"C-01", auditor:"陳建豪", date:"08/20 09:30", cycle:"週稽", type:"複查", st:"已排程"},
      {area:"CNC 加工區", zone:"C-04", auditor:"王思穎", date:"08/20 14:00", cycle:"月稽", type:"重點", st:"待確認"},
      {area:"辦公行政區", zone:"D-01", auditor:"林曉琪", date:"08/21 11:00", cycle:"季稽", type:"例行", st:"未排"}
    ];
    var week = [
      {d:"週一 08/18", items:[{t:"SMT 貼片區 A-01", who:"林曉琪", cl:"t-ok"},{t:"波峰焊產線 A-03", who:"陳建豪", cl:"t-ok"}]},
      {d:"週二 08/19", items:[{t:"成品倉儲 B-02", who:"王思穎", cl:"t-warn"},{t:"包裝出貨區 B-05", who:"林曉琪", cl:"t-ok"}]},
      {d:"週三 08/20", items:[{t:"物料暫存區 C-01", who:"陳建豪", cl:"t-info"},{t:"CNC 加工區 C-04", who:"王思穎", cl:"t-warn"}]},
      {d:"週四 08/21", items:[{t:"辦公行政區 D-01", who:"林曉琪", cl:"t-mut"}]},
      {d:"週五 08/22", items:[]}
    ];
    var rows = "";
    for(var i=0;i<sched.length;i++){
      var s=sched[i];
      var tcl = s.type==="重點"?"t-bad":(s.type==="複查"?"t-info":"t-mut");
      var scl = s.st==="已排程"?"t-ok":(s.st==="待確認"?"t-warn":"t-mut");
      rows += '<tr><td><b>'+s.area+'</b></td><td class="mono">'+s.zone+'</td><td><div class="flexrow"><span class="avatar">'+s.auditor.charAt(0)+'</span>'+s.auditor+'</div></td><td class="mono">'+s.date+'</td><td>'+s.cycle+'</td><td><span class="tag '+tcl+'">'+s.type+'</span></td><td><span class="tag '+scl+'">'+s.st+'</span></td></tr>';
    }
    var wk = "";
    for(var j=0;j<week.length;j++){
      var w=week[j];
      var inner = "";
      if(w.items.length===0){ inner = '<div class="m" style="color:var(--muted);font-size:12px;padding:6px 2px">無排程</div>'; }
      for(var m=0;m<w.items.length;m++){
        inner += '<div class="item"><div class="it-h"><b>'+w.items[m].t+'</b><span class="tag '+w.items[m].cl+'">'+w.items[m].who+'</span></div></div>';
      }
      wk += '<div class="scol"><div class="sh"><b>'+w.d+'</b><span class="sc t-info" style="background:#cffafe;color:#0e7490">'+w.items.length+'</span></div>'+inner+'</div>';
    }

    view.innerHTML =
      '<div class="grid g4" style="margin-bottom:14px">'+
        kpi("event","本週排程","12","場","up","+3 較上週")+
        kpi("groups","稽核員","3","位","flat","負載均衡")+
        kpi("domain","涵蓋區域","18/20","區","up","90% 覆蓋")+
        kpi("pending_actions","待確認","2","場","down","需主管核准")+
      '</div>'+
      '<div class="grid col-3" style="margin-bottom:14px">'+
        '<div class="card pad0">'+

          '<div class="scroll" style="padding:0 6px 6px"><table><thead><tr><th>缺失單號</th><th>區域 / 項目</th><th>分數變化</th><th>複查結果</th><th>複查人</th><th>日期</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
        '</div>'+
        '<div class="card">'+
          '<div class="chd"><span class="material-symbols-outlined">timeline</span><h3>結案追溯</h3><span class="subx r">C-01 案例</span></div>'+

        datasets:[
          {label:"改善前", data:[62,70,58,66], backgroundColor:"#cbd5e1", borderRadius:5, maxBarThickness:34},
          {label:"改善後", data:[90,94,88,74], backgroundColor:"#0f766e", borderRadius:5, maxBarThickness:34}
        ]},
      options:baseOpt({ scales:{ y:{beginAtZero:true,max:100,grid:{color:"#eef2f1"}}, x:{grid:{display:false}} },
        plugins:{ legend:{position:"bottom", labels:{boxWidth:12,font:{size:12}}} } })
    });
  }

  // ================= SCREEN 5 : 稽核分析 =================
  function s5(){
    var ranks = [
      {n:"包裝出貨區 B-05", s:91.5, o:"品保課"},
      {n:"SMT 貼片區 A-01", s:88.0, o:"製造一課"},
      {n:"CNC 加工區 C-04", s:85.0, o:"製造三課"},
      {n:"波峰焊產線 A-03", s:82.5, o:"製造二課"},
      {n:"成品倉儲 B-02", s:76.0, o:"倉管課"},
      {n:"物料暫存區 C-01", s:68.5, o:"倉管課"}
    ];
    var rh="";
    for(var i=0;i<ranks.length;i++){
      var r=ranks[i]; var g=i===0?"g1":(i===1?"g2":(i===2?"g3":""));
      rh += '<div class="rank"><div class="no '+g+'">'+(i+1)+'</div><div class="rn">'+r.n+'<div class="m">'+r.o+'</div></div><div class="big">'+r.s.toFixed(1)+'</div></div>';
    }
    view.innerHTML =
      '<div class="grid g4" style="margin-bottom:14px">'+
        kpi("query_stats","季平均分","83.1","分","up","+2.4 較上季")+
        kpi("emoji_events","紅榜連續","3","個月","up","包裝出貨區")+
        kpi("psychology","素養平均","85.7","分","up","最高構面")+
        kpi("crisis","最弱構面","整頓","","flat","77.8 分待強化")+
      '</div>'+
      '<div class="grid col-2" style="margin-bottom:14px">'+
        '<div class="card">'+
          '<div class="chd"><span class="material-symbols-outlined">stacked_line_chart</span><h3>5S 平均分數趨勢</h3><span class="subx r">近 6 期 vs 缺失數</span></div>'+
          '<div class="chartbox"><canvas id="c5trend"></canvas></div>'+
        '</div>'+
        '<div class="card">'+
          '<div class="chd"><span class="material-symbols-outlined">leaderboard</span><h3>各區紅榜排行</h3><span class="subx r">本季</span></div>'+
          rh+
        '</div>'+
      '</div>'+
      '<div class="grid col-3">'+
        '<div class="card">'+
          '<div class="chd"><span class="material-symbols-outlined">insights</span><h3>五構面全廠平均</h3></div>'+
          '<div class="chartbox sm"><canvas id="c5bar"></canvas></div>'+
        '</div>'+
        '<div class="card">'+
          '<div class="chd"><span class="material-symbols-outlined">lightbulb</span><h3>洞察與建議</h3></div>'+
          '<div class="note" style="margin-bottom:10px"><span class="material-symbols-outlined">trending_down</span><div><b>整頓 (Seiton)</b> 為全廠最弱構面（77.8 分），料架標示與定位缺失佔 41%，建議導入影像看板。</div></div>'+
          '<div class="note" style="margin-bottom:10px"><span class="material-symbols-outlined">warning</span><div><b>物料暫存區 C-01</b> 連續兩期低於標準，建議列入重點稽核並增加複查頻率。</div></div>'+
          '<div class="note"><span class="material-symbols-outlined">celebration</span><div><b>包裝出貨區</b> 連續 3 個月紅榜，可提報為 5S 標竿觀摩區。</div></div>'+
        '</div>'+
      '</div>';

    void view.offsetHeight;
    mk("c5trend", {
      type:"bar",
      data:{ labels:["3月","4月","5月","6月","7月","8月"],
        datasets:[
          {type:"line", label:"5S 平均分", data:[78.4,79.6,80.2,81.5,82.0,83.1], borderColor:"#0f766e", backgroundColor:"rgba(15,118,110,.12)", borderWidth:3, tension:.35, fill:true, yAxisID:"y", pointRadius:4, pointBackgroundColor:"#0f766e"},
          {type:"bar", label:"缺失數", data:[22,19,17,14,12,9], backgroundColor:"#5eead4", borderRadius:5, maxBarThickness:26, yAxisID:"y1"}
        ]},
      options:baseOpt({
        scales:{
          y:{beginAtZero:false,min:70,max:90,position:"left",grid:{color:"#eef2f1"},title:{display:true,text:"平均分",font:{size:11}}},
          y1:{beginAtZero:true,max:30,position:"right",grid:{display:false},title:{display:true,text:"缺失數",font:{size:11}}},
          x:{grid:{display:false}}
        },
        plugins:{ legend:{position:"bottom", labels:{boxWidth:12,font:{size:12}}} }
      })
    });
    mk("c5bar", {
      type:"bar",
      data:{ labels:["整理","整頓","清掃","清潔","素養"],
        datasets:[{label:"全廠平均", data:[82.5,77.8,83.4,84.1,85.7],
          backgroundColor:["#0f766e","#dc2626","#0f766e","#0f766e","#0d9488"], borderRadius:6, maxBarThickness:40}]},
      options:baseOpt({ indexAxis:"y", scales:{ x:{beginAtZero:true,max:100,grid:{color:"#eef2f1"}}, y:{grid:{display:false}} },
        plugins:{legend:{display:false}} })
    });
  }

  var SCREENS = [s0,s1,s2,s3,s4,s5];
  function show(i){
    i = Math.max(0, Math.min(SCREENS.length-1, i|0));
    destroyCharts();
    setActive(i);
    SCREENS[i]();
    try{ window.scrollTo(0,0); }catch(e){}
  }

  show(0);

  function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
})();
</script>
