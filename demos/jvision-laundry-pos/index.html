<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>洗衣門市 POS｜Jvision Demo</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
  :root{
    --accent:#ea580c; --accent2:#fb923c; --ink:#2a1608; --muted:#8a6f5c;
    --bg:#faf6f2; --card:#ffffff; --line:#f0e3d8; --soft:#fdf3ea;
    --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --purple:#7c3aed; --blue:#2563eb;
    --radius:16px; --shadow:0 6px 24px rgba(234,88,12,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
  body{
    font-family:"Inter","Noto Sans TC",sans-serif; color:var(--ink);
    background:linear-gradient(180deg,#fdf0e6 0%,#faf6f2 260px,#faf6f2 100%);
    -webkit-font-smoothing:antialiased;
  }
  .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
  header.topbar{
    position:sticky;top:0;z-index:30;
    background:linear-gradient(100deg,#9a3412,#ea580c 55%,#c2410c);
    color:#fff;box-shadow:0 4px 18px rgba(154,52,18,.28);
  }
  .topwrap{max-width:1360px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:11px;min-width:0;}
  .brand .logo{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none;border:1px solid rgba(255,255,255,.28);}
  .brand .logo .material-symbols-outlined{font-size:24px;color:#ffedd5;}
  .brand h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.5px;white-space:nowrap;}
  .brand p{margin:0;font-size:11.5px;color:#fed7aa;font-weight:500;white-space:nowrap;}
  .topmeta{margin-left:auto;display:flex;align-items:center;gap:14px;min-width:0;}
  .topmeta .pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:6px 13px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .topmeta .pill .dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.28);animation:pulse 2.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#fb923c,#ea580c);display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none;border:2px solid rgba(255,255,255,.4);}
  nav.tabs{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:64px;z-index:25;box-shadow:0 2px 8px rgba(234,88,12,.05);}
  .tabwrap{max-width:1360px;margin:0 auto;padding:9px 16px;display:flex;gap:8px;flex-wrap:wrap;}
  nav.tabs button{
    flex:none;white-space:nowrap;display:flex;align-items:center;gap:8px;cursor:pointer;
    border:1px solid var(--line);background:#fff;color:var(--muted);
    padding:9px 15px;border-radius:11px;font-size:13.5px;font-weight:600;font-family:inherit;transition:.16s;
  }
  nav.tabs button .material-symbols-outlined{font-size:20px;}
  nav.tabs button:hover{border-color:var(--accent2);color:var(--accent);background:var(--soft);}
  nav.tabs button.on{background:linear-gradient(120deg,#ea580c,#c2410c);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(234,88,12,.32);}
  nav.tabs button .idx{font-size:11px;opacity:.7;font-weight:700;}
  main{max-width:1360px;margin:0 auto;padding:22px 20px 60px;}
  .shead{display:flex;align-items:flex-start;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
  .shead .sic{width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;flex:none;box-shadow:var(--shadow);}
  .shead .sic .material-symbols-outlined{font-size:28px;color:#fff;}
  .shead h2{margin:0;font-size:21px;font-weight:800;}
  .shead p{margin:3px 0 0;color:var(--muted);font-size:13px;font-weight:500;}
  .shead .stag{margin-left:auto;align-self:center;background:var(--soft);color:var(--accent);border:1px solid var(--line);padding:7px 14px;border-radius:20px;font-size:12.5px;font-weight:700;white-space:nowrap;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;min-width:0;}
  .card h3{margin:0 0 14px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;}
  .card h3 .material-symbols-outlined{font-size:20px;color:var(--accent);}
  .card h3 .sub{font-size:11.5px;font-weight:600;color:var(--muted);margin-left:auto;}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .grid-7-5{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
  .grid-5-7{display:grid;grid-template-columns:1fr 1.5fr;gap:16px;}
  @media(max-width:820px){
    .kpis{grid-template-columns:1fr 1fr;}
    .grid2,.grid3,.grid4,.grid-7-5,.grid-5-7{grid-template-columns:1fr;}
  }
  @media(max-width:480px){.kpis{grid-template-columns:1fr;}}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden;min-width:0;}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--accent),var(--accent2));}
  .kpi .kl{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;}
  .kpi .kl .material-symbols-outlined{font-size:17px;color:var(--accent);}
  .kpi .kv{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.5px;}
  .kpi .kv small{font-size:13px;font-weight:600;color:var(--muted);}
  .kpi .kd{font-size:11.5px;font-weight:700;margin-top:4px;display:flex;align-items:center;gap:3px;}
  .kpi .kd.up{color:var(--ok);} .kpi .kd.down{color:var(--bad);} .kpi .kd.flat{color:var(--muted);}
  .kpi .kd .material-symbols-outlined{font-size:15px;}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px;}
  thead th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:2px solid var(--line);white-space:nowrap;background:var(--soft);}
  tbody td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:hover{background:var(--soft);}
  tbody tr:last-child td{border-bottom:none;}
  .tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;}
  .tag.g{background:#dcfce7;color:#15803d;} .tag.y{background:#fef3c7;color:#b45309;}
  .tag.r{background:#fee2e2;color:#b91c1c;} .tag.b{background:#dbeafe;color:#1d4ed8;}
  .tag.o{background:#ffedd5;color:#c2410c;} .tag.p{background:#ede9fe;color:#6d28d9;} .tag.gr{background:#f1f5f9;color:#475569;}
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  @media(max-width:820px){.board{grid-template-columns:1fr 1fr;}}
  @media(max-width:480px){.board{grid-template-columns:1fr;}}
  .bcol{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0;}
  .bcol .bh{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px;margin-bottom:11px;padding-bottom:9px;border-bottom:2px solid var(--line);}
  .bcol .bh .cnt{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:20px;font-size:11px;padding:1px 9px;color:var(--muted);}
  .bcol .bh .bd{width:11px;height:11px;border-radius:3px;flex:none;}
  .rcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px;box-shadow:0 2px 6px rgba(234,88,12,.05);position:relative;overflow:hidden;}
  .rcard:last-child{margin-bottom:0;}
  .rcard .rn{font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px;}
  .rcard .rt{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:3px;}
  .rcard .rf{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .rcard .g{font-size:11.5px;color:var(--ink);font-weight:600;display:flex;align-items:center;gap:4px;}
  .rcard .g .material-symbols-outlined{font-size:15px;color:var(--muted);}
  .rcard .stripe{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:11px 0 0 11px;}
  .prog{height:6px;background:var(--soft);border-radius:6px;overflow:hidden;margin-top:8px;}
  .prog > i{display:block;height:100%;border-radius:6px;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:600;color:var(--muted);margin-top:12px;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}
  .bar{height:8px;background:var(--soft);border-radius:6px;overflow:hidden;min-width:60px;}
  .bar > i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
  .tl{position:relative;padding-left:26px;}
  .tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line);}
  .tl .ti{position:relative;margin-bottom:16px;}
  .tl .ti:last-child{margin-bottom:0;}
  .tl .ti .dot{position:absolute;left:-24px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 2px var(--accent2);}
  .tl .ti .tm{font-size:11.5px;color:var(--accent);font-weight:800;}
  .tl .ti .tt{font-size:13.5px;font-weight:700;margin-top:2px;}
  .tl .ti .td{font-size:12px;color:var(--muted);margin-top:2px;}
  .ticket{border:1px dashed var(--accent2);border-radius:12px;padding:14px;background:var(--soft);}
  .frow2{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;}
  .frow2:last-child{border-bottom:none;}
  .frow2 .fl{color:var(--muted);font-weight:600;}
  .frow2 .fv{font-weight:800;}
  .items{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
  .item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;}
  .item .ii{width:34px;height:34px;border-radius:9px;background:var(--soft);display:grid;place-items:center;flex:none;}
  .item .ii .material-symbols-outlined{font-size:19px;color:var(--accent);}
  .item .inm{font-weight:700;font-size:13px;}
  .item .isub{font-size:11px;color:var(--muted);font-weight:600;margin-top:1px;}
  .shelf{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;}
  @media(max-width:820px){.shelf{grid-template-columns:repeat(4,1fr);}}
  @media(max-width:480px){.shelf{grid-template-columns:repeat(3,1fr);}}
  .slot{aspect-ratio:1/1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:12px;border:1px solid var(--line);min-width:0;position:relative;}
  .slot small{font-size:9.5px;font-weight:600;margin-top:2px;}
  .slot.occ{background:#ffedd5;color:#c2410c;border-color:#fed7aa;}
  .slot.hold{background:#fee2e2;color:#b91c1c;border-color:#fecaca;}
  .slot.empty{background:var(--soft);color:#c9b8ab;}
  .slot .material-symbols-outlined{font-size:18px;}
  .mrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;gap:10px;}
  .mrow:last-child{border-bottom:none;}
  .mrow .ml{color:var(--ink);font-weight:600;display:flex;align-items:center;gap:7px;min-width:0;flex-wrap:wrap;}
  .mrow .ml .material-symbols-outlined{font-size:18px;color:var(--accent);}
  .mrow .mv{font-weight:800;white-space:nowrap;}
  .mcard{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fff;box-shadow:var(--shadow);min-width:0;}
  .mcard .mhd{display:flex;align-items:center;gap:10px;}
  .mcard .mav{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--accent));display:grid;place-items:center;color:#fff;font-weight:800;flex:none;}
  .mcard .mnm{font-weight:800;font-size:14px;}
  .mcard .mlv{font-size:11px;color:var(--muted);font-weight:600;margin-top:3px;}
  .mcard .mbal{font-size:22px;font-weight:800;color:var(--accent);margin:11px 0 3px;}
  .avatar-sm{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#fb923c,#ea580c);display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none;}
  .chart-box{position:relative;height:280px;width:100%;}
  .chart-sm{position:relative;height:230px;width:100%;}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:34px;padding-top:18px;border-top:1px solid var(--line);}
  .nav-txt{display:inline;}
  @media(max-width:560px){.nav-txt{display:none;} nav.tabs button{padding:9px 11px;} .brand p{display:none;} .topmeta .pill span.plabel{display:none;}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topwrap">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">local_laundry_service</span></div>

<script>
"use strict";
var NAV=[
  {ic:"point_of_sale",name:"前台收送件"},
  {ic:"view_kanban",name:"洗程看板"},
  {ic:"checkroom",name:"衣物入庫"},
  {ic:"groups",name:"會員儲值"},
  {ic:"payments",name:"每日收支"},
  {ic:"summarize",name:"日月報表"}
];
var chart=null, chart2=null;
function destroyChart(){ if(chart){try{chart.dispose();}catch(e){}chart=null;} if(chart2){try{chart2.dispose();}catch(e){}chart2=null;} }
function head(ic,title,desc,tag){
  return '<div class="shead"><div class="sic"><span class="material-symbols-outlined">'+ic+'</span></div>'
    +'<div style="min-width:0"><h2>'+title+'</h2><p>'+desc+'</p></div>'
    +'<div class="stag">'+tag+'</div></div>';
}
function kpi(label,ic,val,unit,dir,delta){
  var cls=dir==="up"?"up":dir==="down"?"down":"flat";
  var dic=dir==="up"?"trending_up":dir==="down"?"trending_down":"remove";
  return '<div class="kpi"><div class="kl"><span class="material-symbols-outlined">'+ic+'</span>'+label+'</div>'
    +'<div class="kv">'+val+(unit?'<small> '+unit+'</small>':'')+'</div>'
    +'<div class="kd '+cls+'"><span class="material-symbols-outlined">'+dic+'</span>'+delta+'</div></div>';
}

/* SCREEN 0 : 前台收送件 */
function s0(){
  var items=[
    {ic:"checkroom",n:"西裝外套 ×1",sub:"乾洗 · 深藍 · 領口油漬",p:220},
    {ic:"dry_cleaning",n:"羊毛大衣 ×1",sub:"乾洗 · 駝色 · 袖口磨損標記",p:380},
    {ic:"apparel",n:"襯衫 ×3",sub:"水洗＋整燙 · 白",p:180},
    {ic:"bed",n:"羽絨被 ×1",sub:"大件水洗 · 雙人",p:450}
  ];
  var itemH="";var subtot=0;
  items.forEach(function(it){ subtot+=it.p;
    itemH+='<div class="item"><div class="ii"><span class="material-symbols-outlined">'+it.ic+'</span></div>'
      +'<div style="min-width:0;flex:1"><div class="inm">'+it.n+'</div><div class="isub">'+it.sub+'</div></div>'
      +'<div style="font-weight:800;font-size:13px">NT$'+it.p+'</div></div>';
  });
  var rows=[
    {id:"WO-5821",c:"王雅琪",pcs:6,svc:"乾洗",due:"08/16",amt:1230,st:["o","收件中"]},
    {id:"WO-5820",c:"陳建宏",pcs:3,svc:"水洗",due:"08/15",amt:540,st:["b","已收件"]},
    {id:"WO-5819",c:"林淑芬",pcs:1,svc:"大件",due:"08/17",amt:450,st:["b","已收件"]},
    {id:"WO-5818",c:"張家豪",pcs:4,svc:"乾洗＋燙",due:"08/15",amt:880,st:["g","已完成"]},
    {id:"WO-5817",c:"黃美玲",pcs:2,svc:"修改",due:"08/18",amt:360,st:["y","待報價"]},
    {id:"WO-5816",c:"吳志明",pcs:5,svc:"乾洗",due:"08/14",amt:1050,st:["g","已完成"]}
  ];
  var body="";
  rows.forEach(function(r){
    body+='<tr><td style="font-weight:700">'+r.id+'</td>'
      +'<td><span class="avatar-sm">'+r.c.charAt(0)+'</span>&nbsp;'+r.c+'</td>'
      +'<td style="text-align:center">'+r.pcs+' 件</td><td>'+r.svc+'</td><td>'+r.due+'</td>'
      +'<td style="font-weight:700">NT$'+r.amt.toLocaleString()+'</td>'
      +'<td><span class="tag '+r.st[0]+'">'+r.st[1]+'</span></td></tr>';
  });
  var tl=[
    {tm:"09:12",tt:"開單 WO-5821",td:"王雅琪 · 6 件乾洗 · 已逐件拍照登錄"},
    {tm:"10:05",tt:"污漬標記",td:"深藍西裝領口油漬，已提示無法完全去除"},
    {tm:"11:30",tt:"取件結帳 WO-5810",td:"李先生 · 現金 NT$680 · 已列印收據"},
    {tm:"13:48",tt:"會員儲值",td:"陳建宏 儲值 NT$2,000 · 贈 10% 回饋"},
    {tm:"15:20",tt:"待報價 WO-5817",td:"黃美玲 · 褲管修改，待技師估價"}
  ];
  var tlH="";
  tl.forEach(function(t){ tlH+='<div class="ti"><div class="dot"></div><div class="tm">'+t.tm+'</div><div class="tt">'+t.tt+'</div><div class="td">'+t.td+'</div></div>'; });
  var kpis='<div class="kpis">'
    +kpi("今日收件單","receipt_long","38","單","up","+6 單")
    +kpi("今日取件","local_shipping","31","單","up","+4 單")
    +kpi("今日營收","payments","28,640","元","up","+12%")
    +kpi("待報價","help","5","件","flat","需技師確認")
    +'</div>';
  return head("point_of_sale","前台收送件","送洗開單、逐件拍照登錄品項與污漬，取件憑單快速結帳","收送作業")
    + kpis
    + '<div class="grid-5-7" style="margin-bottom:16px">'
    +   '<div class="card"><h3><span class="material-symbols-outlined">edit_note</span>送洗開單<span class="sub">WO-5821 · 王雅琪</span></h3>'
    +     '<div class="ticket">'
    +       '<div class="frow2"><span class="fl">會員</span><span class="fv">王雅琪 · 金卡</span></div>'
    +       '<div class="frow2"><span class="fl">取件日</span><span class="fv">2026/08/16（三）</span></div>'
    +       '<div class="frow2"><span class="fl">送洗件數</span><span class="fv">6 件</span></div>'

var RENDER=[s0,s1,s2,s3,s4,s5];

function buildTabs(){
  var h="";
  NAV.forEach(function(n,i){
    h+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+n.ic+'</span><span class="nav-txt">'+n.name+'</span><span class="idx">0'+i+'</span></button>';
  });
  var t=document.getElementById("tabs");
  t.innerHTML=h;
  var btns=t.querySelectorAll("button");
  for(var i=0;i<btns.length;i++){ (function(b){ b.addEventListener("click",function(){ show(+b.getAttribute("data-i")); }); })(btns[i]); }
}
function show(i){
  destroyChart();
  var container=document.getElementById("screen");
  container.innerHTML=RENDER[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){ btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i); }
  void container.offsetHeight;
  if(CHARTS[i]){ CHARTS[i](); }
}
buildTabs();
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
