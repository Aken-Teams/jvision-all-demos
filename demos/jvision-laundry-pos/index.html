<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>洗衣門市 POS｜Jvision Demo</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;500;600;700&family=Rubik:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000000;
  --color-secondary:#10b981;
  --color-on-secondary:#0f172a;
  --color-accent:#ea580c;
  --color-on-accent:#000000;
  --color-background:#ecfdf5;
  --color-foreground:#064e3b;
  --color-card:#ffffff;
  --color-card-foreground:#064e3b;
  --color-muted:#e8f1f3;
  --color-muted-foreground:#475569;
  --color-border:#a7f3d0;
  --color-destructive:#dc2626;
  --color-on-destructive:#ffffff;
  --color-ring:#059669;
  --blue:#2563eb;
  --ink:#064e3b;
  --muted:#475569;
  --line:#a7f3d0;
  --accent:#ea580c;
  --accent2:#fb923c;
  --bg:#ecfdf5;
  --card:#ffffff;
  --soft:#f0fdfa;
  --ok:#047857;
  --warn:#b45309;
  --bad:#dc2626;
  --purple:#7c3aed;
  --radius:20px;
  --shadow:0 12px 32px rgba(6,78,59,.10),0 2px 8px rgba(6,78,59,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  min-height:100vh;
  font-family:"Nunito Sans",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 8% 4%,rgba(16,185,129,.20),transparent 25rem),
    radial-gradient(circle at 96% 18%,rgba(234,88,12,.12),transparent 22rem),
    linear-gradient(180deg,#d1fae5 0,#ecfdf5 25rem,#f8fffc 100%);
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,[data-i]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
header.topbar{
  position:sticky;
  top:0;
  z-index:30;
  color:#fff;
  background:
    linear-gradient(115deg,rgba(255,255,255,.10) 0 18%,transparent 18% 75%,rgba(255,255,255,.08) 75%),
    linear-gradient(100deg,#064e3b,#047857 55%,#059669);
  border-bottom:1px solid rgba(255,255,255,.18);
  box-shadow:0 10px 28px rgba(6,78,59,.24);
}
.topwrap{
  max-width:1440px;
  min-height:72px;
  margin:0 auto;
  padding:12px 24px;
  display:flex;
  align-items:center;
  gap:18px;
  flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{
  width:46px;
  height:46px;
  border-radius:15px;
  display:grid;
  place-items:center;
  flex:none;
  color:#052e16;
  background:#6ee7b7;
  border:2px solid rgba(255,255,255,.72);
  box-shadow:5px 5px 0 #ea580c;
  transform:rotate(-2deg);
}
.brand .logo .material-symbols-outlined{font-size:27px;color:#052e16}
.brand h1{
  margin:0;
  font-family:"Rubik",sans-serif;
  font-size:19px;
  line-height:1.2;
  font-weight:700;
  letter-spacing:.3px;
  white-space:nowrap;
}
.brand p{margin:3px 0 0;font-size:12px;color:#d1fae5;font-weight:600;white-space:nowrap}
.topmeta{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
.topmeta .pill{
  min-height:38px;
  padding:7px 13px;
  display:flex;
  align-items:center;
  gap:7px;
  white-space:nowrap;
  color:#fff;
  font-size:12px;
  font-weight:700;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.32);
  border-radius:12px;
  backdrop-filter:blur(8px);
}
.topmeta .pill .dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#86efac;
  border:2px solid #fff;
  box-shadow:0 0 0 3px rgba(134,239,172,.24);
  animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.78);opacity:.6}}
.avatar{
  width:40px;
  height:40px;
  border-radius:13px;
  display:grid;
  place-items:center;
  flex:none;
  color:#111827;
  font-weight:800;
  background:#fdba74;
  border:2px solid #fff;
  box-shadow:3px 3px 0 rgba(6,78,59,.55);
}
nav.tabs{
  position:sticky;
  top:72px;
  z-index:25;
  background:rgba(255,255,255,.92);
  border-bottom:1px solid var(--line);
  box-shadow:0 5px 18px rgba(6,78,59,.07);
  backdrop-filter:blur(14px);
}
.tabwrap{
  max-width:1440px;
  margin:0 auto;
  padding:10px 20px;
  display:flex;
  gap:9px;
  overflow-x:auto;
  scrollbar-width:thin;
}
nav.tabs button{
  min-height:42px;
  flex:none;
  white-space:nowrap;
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 15px;
  color:#36534a;
  background:#fff;
  border:1px solid #bbf7d0;
  border-radius:13px;
  font-size:13.5px;
  font-weight:700;
  transition:transform .22s ease,background-color .22s ease,color .22s ease,border-color .22s ease,box-shadow .22s ease;
}
nav.tabs button .material-symbols-outlined{font-size:20px}
nav.tabs button:hover{transform:translateY(-2px);color:#064e3b;background:#d1fae5;border-color:#34d399;box-shadow:0 6px 14px rgba(5,150,105,.14)}
nav.tabs button.on{
  color:#fff;
  background:linear-gradient(125deg,#047857,#10b981);
  border-color:#047857;
  box-shadow:4px 4px 0 #fdba74;
}
nav.tabs button .idx{font-family:"Rubik",monospace;font-size:10px;opacity:.78;font-weight:700}
main{max-width:1440px;margin:0 auto;padding:34px 24px 72px}
#screen{animation:screenIn .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes screenIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.shead{
  position:relative;
  display:flex;
  align-items:flex-start;
  gap:16px;
  margin-bottom:26px;
  padding:22px 24px;
  overflow:hidden;
  flex-wrap:wrap;
  background:linear-gradient(110deg,#fff 0 68%,#d1fae5 68%);
  border:1px solid var(--line);
  border-radius:24px;
  box-shadow:var(--shadow);
}
.shead::after{
  content:"";
  position:absolute;
  width:110px;
  height:110px;
  right:7%;
  bottom:-70px;
  border:18px solid rgba(234,88,12,.16);
  transform:rotate(18deg);
  pointer-events:none;
}
.shead .sic{
  width:58px;
  height:58px;
  border-radius:18px;
  display:grid;
  place-items:center;
  flex:none;
  color:#052e16;
  background:#34d399;
  border:2px solid #064e3b;
  box-shadow:5px 5px 0 #fdba74;
}
.shead .sic .material-symbols-outlined{font-size:31px;color:#052e16}
.shead h2{margin:2px 0 0;font-family:"Rubik",sans-serif;font-size:clamp(25px,3vw,34px);line-height:1.08;font-weight:700;letter-spacing:-.6px}
.shead p{margin:7px 0 0;max-width:760px;color:var(--muted);font-size:13.5px;font-weight:600}
.shead .stag{
  position:relative;
  z-index:1;
  margin-left:auto;
  align-self:center;
  padding:8px 14px;
  color:#7c2d12;
  background:#ffedd5;
  border:1px solid #fdba74;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
}
.card,.kpi,.mcard{transition:transform .24s ease,box-shadow .24s ease,border-color .24s ease}
.card{
  min-width:0;
  padding:20px;
  color:var(--color-card-foreground);
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.card:hover,.mcard:hover{transform:translateY(-3px);border-color:#34d399;box-shadow:0 17px 38px rgba(6,78,59,.14)}
.card h3{
  margin:0 0 17px;
  display:flex;
  align-items:center;
  gap:9px;
  font-family:"Rubik",sans-serif;
  font-size:15px;
  line-height:1.35;
  font-weight:700;
}
.card h3 .material-symbols-outlined{font-size:21px;color:var(--accent)}
.card h3 .sub{margin-left:auto;color:var(--muted);font-family:"Nunito Sans",sans-serif;font-size:11.5px;font-weight:700;text-align:right}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}
.grid-7-5{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
.grid-5-7{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:18px}
.kpi{
  position:relative;
  min-width:0;
  min-height:132px;
  overflow:hidden;
  padding:17px 18px 17px 21px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow);
}
.kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:7px;background:linear-gradient(180deg,#059669,#34d399)}
.kpi::after{content:"";position:absolute;width:62px;height:62px;right:-24px;top:-24px;border-radius:18px;background:rgba(234,88,12,.09);transform:rotate(24deg)}
.kpi:hover{transform:translateY(-4px) rotate(-.35deg);border-color:#34d399;box-shadow:0 16px 32px rgba(5,150,105,.16)}
.kpi .kl{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:700}
.kpi .kl .material-symbols-outlined{font-size:18px;color:#047857}
.kpi .kv{margin-top:7px;font-family:"Rubik",sans-serif;font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-.7px;font-variant-numeric:tabular-nums}
.kpi .kv small{color:var(--muted);font-family:"Nunito Sans",sans-serif;font-size:13px;font-weight:700}
.kpi .kd{margin-top:8px;display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800}
.kpi .kd.up{color:#047857}.kpi .kd.down{color:#b91c1c}.kpi .kd.flat{color:#475569}
.kpi .kd .material-symbols-outlined{font-size:16px}
table{width:100%;min-width:560px;border-collapse:separate;border-spacing:0;font-size:13px;font-variant-numeric:tabular-nums}
thead th{padding:11px 12px;color:#334155;background:#d1fae5;border-top:1px solid #a7f3d0;border-bottom:2px solid #34d399;text-align:left;font-size:11.5px;font-weight:800;white-space:nowrap}
thead th:first-child{border-left:1px solid #a7f3d0;border-radius:10px 0 0 0}
thead th:last-child{border-right:1px solid #a7f3d0;border-radius:0 10px 0 0}
tbody td{padding:12px;border-bottom:1px solid #d7eee5;vertical-align:middle}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#ecfdf5}
tbody tr:last-child td{border-bottom:none}
tbody td:first-child,tbody td:nth-child(5){font-family:"Rubik",monospace;font-variant-numeric:tabular-nums}
tbody td[style*="font-weight:700"],tbody td[style*="font-weight:800"]{font-variant-numeric:tabular-nums}
.tag{min-height:25px;padding:4px 9px;display:inline-flex;align-items:center;gap:5px;border:1px solid currentColor;border-radius:8px;font-size:11.5px;font-weight:800;white-space:nowrap}
.tag.g{color:#065f46;background:#d1fae5}.tag.y{color:#92400e;background:#fef3c7}.tag.r{color:#991b1b;background:#fee2e2}.tag.b{color:#1e40af;background:#dbeafe}.tag.o{color:#9a3412;background:#ffedd5}.tag.p{color:#5b21b6;background:#ede9fe}.tag.gr{color:#334155;background:#f1f5f9}
.board{display:grid;grid-template-columns:repeat(4,minmax(215px,1fr));gap:14px}
.bcol{min-width:0;padding:13px;background:#effcf7;border:1px solid var(--line);border-radius:17px}
.bcol .bh{margin-bottom:12px;padding:3px 2px 11px;display:flex;align-items:center;gap:8px;border-bottom:2px solid #a7f3d0;font-size:13.5px;font-weight:800}
.bcol .bh .cnt{margin-left:auto;padding:2px 9px;color:#334155;background:#fff;border:1px solid var(--line);border-radius:999px;font-family:"Rubik",sans-serif;font-size:11px}
.bcol .bh .bd{width:11px;height:11px;border-radius:3px;flex:none;box-shadow:0 0 0 2px #fff,0 0 0 3px currentColor}
.rcard{position:relative;overflow:hidden;margin-bottom:10px;padding:12px 11px 12px 15px;background:#fff;border:1px solid #ccebdd;border-radius:13px;box-shadow:0 4px 10px rgba(6,78,59,.07);transition:transform .2s ease,box-shadow .2s ease}
.rcard:hover{transform:translateY(-2px);box-shadow:0 9px 18px rgba(6,78,59,.12)}
.rcard:last-child{margin-bottom:0}.rcard .rn{display:flex;align-items:center;gap:6px;font-family:"Rubik",monospace;font-size:14px;font-weight:700}.rcard .rt{margin-top:4px;color:var(--muted);font-size:11.5px;font-weight:700}.rcard .rf{margin-top:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.rcard .g{display:flex;align-items:center;gap:4px;color:var(--ink);font-size:11.5px;font-weight:700}.rcard .g .material-symbols-outlined{font-size:15px;color:var(--muted)}.rcard .stripe{position:absolute;inset:0 auto 0 0;width:5px}
.prog{height:8px;margin-top:9px;overflow:hidden;background:#e2e8f0;border:1px solid #cbd5e1;border-radius:999px}.prog>i{display:block;height:100%;border-radius:999px}
.legend{margin-top:14px;display:flex;gap:15px;flex-wrap:wrap;color:var(--muted);font-size:12px;font-weight:700}.legend span{display:inline-flex;align-items:center;gap:7px}.legend i{width:12px;height:12px;display:inline-block;border:1px solid rgba(15,23,42,.32);border-radius:3px}
.bar{height:9px;min-width:60px;overflow:hidden;background:#dcefe8;border-radius:999px}.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#059669,#34d399)}
.tl{position:relative;padding-left:29px}.tl::before{content:"";position:absolute;left:8px;top:5px;bottom:5px;width:3px;background:#a7f3d0;border-radius:3px}.tl .ti{position:relative;margin-bottom:17px}.tl .ti:last-child{margin-bottom:0}.tl .ti .dot{position:absolute;left:-27px;top:2px;width:15px;height:15px;border-radius:5px;background:#ea580c;border:3px solid #fff;box-shadow:0 0 0 2px #fdba74;transform:rotate(45deg)}.tl .ti .tm{color:#9a3412;font-family:"Rubik",monospace;font-size:11.5px;font-weight:700}.tl .ti .tt{margin-top:2px;font-size:13.5px;font-weight:800}.tl .ti .td{margin-top:2px;color:var(--muted);font-size:12px}
.ticket{padding:15px;background:linear-gradient(135deg,#ecfdf5,#fff7ed);border:2px dashed #34d399;border-radius:15px}.frow2{padding:9px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px dashed #a7f3d0;font-size:13px}.frow2:last-child{border-bottom:none}.frow2 .fl{color:var(--muted);font-weight:700}.frow2 .fv{font-weight:800;text-align:right}
.items{margin-top:9px;display:flex;flex-direction:column;gap:9px}.item{min-height:56px;padding:9px 11px;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:13px;transition:border-color .2s ease,transform .2s ease}.item:hover{transform:translateX(3px);border-color:#34d399}.item .ii{width:36px;height:36px;display:grid;place-items:center;flex:none;color:#052e16;background:#a7f3d0;border-radius:10px}.item .ii .material-symbols-outlined{font-size:20px;color:#065f46}.item .inm{font-size:13px;font-weight:800}.item .isub{margin-top:1px;color:var(--muted);font-size:11px;font-weight:600}
.shelf{display:grid;grid-template-columns:repeat(8,minmax(62px,1fr));gap:9px}.slot{position:relative;min-width:0;aspect-ratio:1/1;padding:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:12px;font-family:"Rubik",monospace;font-size:12px;font-weight:700}.slot small{margin-top:3px;font-size:9.5px;font-weight:600}.slot.occ{color:#065f46;background:#d1fae5;border-color:#34d399}.slot.hold{color:#991b1b;background:#fee2e2;border-color:#ef4444}.slot.empty{color:#64748b;background:#f1f5f9;border-style:dashed}.slot .material-symbols-outlined{font-size:19px}
.mrow{min-height:50px;padding:10px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #d7eee5;font-size:13px}.mrow:last-child{border-bottom:none}.mrow .ml{min-width:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap;color:var(--ink);font-weight:700}.mrow .ml .material-symbols-outlined{font-size:19px;color:#047857}.mrow .mv{white-space:nowrap;text-align:right;font-family:"Rubik",monospace;font-weight:700;font-variant-numeric:tabular-nums}
.mcard{min-width:0;padding:16px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 7px 18px rgba(6,78,59,.08)}.mcard .mhd{display:flex;align-items:center;gap:10px}.mcard .mav,.avatar-sm{display:grid;place-items:center;flex:none;color:#052e16;background:#6ee7b7;border:1px solid #059669;font-weight:800}.mcard .mav{width:42px;height:42px;border-radius:13px}.mcard .mnm{font-size:14px;font-weight:800}.mcard .mlv{margin-top:3px;color:var(--muted);font-size:11px;font-weight:700}.mcard .mbal{margin:12px 0 3px;color:#9a3412;font-family:"Rubik",sans-serif;font-size:23px;font-weight:700;font-variant-numeric:tabular-nums}.avatar-sm{width:27px;height:27px;display:inline-grid;border-radius:9px;font-size:11px}
.chart-box{position:relative;width:100%;height:280px}.chart-sm{position:relative;width:100%;height:230px}
.foot{margin-top:44px;padding-top:20px;color:#526b63;border-top:1px solid var(--line);text-align:center;font-size:12px;font-weight:600}.nav-txt{display:inline}
@media(max-width:1024px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.board{grid-template-columns:repeat(4,minmax(220px,1fr))}}

@media(max-width:600px){.topwrap{padding:10px 15px;gap:10px}.brand .logo{width:42px;height:42px}.brand p{display:none}.topmeta{margin-left:auto;gap:7px}.topmeta .pill{min-height:36px;padding:6px 9px}.topmeta .pill span.plabel{display:none}.avatar{width:36px;height:36px}.tabwrap{padding:9px 13px}.nav-txt{display:none}nav.tabs button{min-width:43px;padding:9px 10px;justify-content:center}main{padding:24px 14px 54px}.shead{padding:18px;border-radius:19px}.shead .sic{width:50px;height:50px}.shead h2{font-size:24px}.shead .stag{width:100%;margin-left:66px}.kpis{gap:11px}.kpi{min-height:123px;padding:15px 13px 15px 18px}.kpi .kv{font-size:24px}.card{padding:16px;border-radius:17px}.card h3{align-items:flex-start;flex-wrap:wrap}.card h3 .sub{width:100%;margin-left:30px;text-align:left}.shelf{grid-template-columns:repeat(3,1fr)}.chart-box{height:245px}.mrow{align-items:flex-start}.foot{margin-top:34px}}
@media(max-width:390px){.brand h1{font-size:16px}.topmeta .pill:nth-child(2){display:none}.kpis{grid-template-columns:1fr}.shead .stag{margin-left:0}.shelf{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}.topmeta .pill .dot{animation:none}#screen{animation:none}.card:hover,.kpi:hover,.mcard:hover,.rcard:hover,.item:hover,nav.tabs button:hover{transform:none}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topwrap">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">local_laundry_service</span></div>
      <div>
        <h1>洗衣門市 POS</h1>
        <p>Jvision Laundry Store POS Suite</p>
      </div>
    </div>

function buildTabs(){
  var h="";
  NAV.forEach(function(n,i){
    h+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+n.ic+'</span><span class="nav-txt">'+n.name+'</span><span class="idx">0'+i+'</span></button>';
  });
  var t=document.getElementById("tabs");
  t.innerHTML=h;
  var btns=t.querySelectorAll("button");
  for(var i=0;i<btns.length;i++){ (function(b){ b.addEventListener("click",function(){ show(+b.getAttribute("data-i")); }); })(btns[i]); }
}
function show(i){
  destroyChart();
  var container=document.getElementById("screen");
  container.innerHTML=RENDER[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){ btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i); }
  void container.offsetHeight;
  if(CHARTS[i]){ CHARTS[i](); }
}
buildTabs();
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
