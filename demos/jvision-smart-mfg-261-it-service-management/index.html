<title>企業資訊服務工單管理系統</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#1D4ED8;
  --panel:#FFFFFF;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06);
  --shadow-up:0 12px 30px rgba(37,99,235,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  background:
    radial-gradient(circle at 90% 0,rgba(59,130,246,.08),transparent 28rem),
    var(--color-background);
  color:var(--ink);
  font-family:"Work Sans",system-ui,sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit}
button{cursor:pointer}
.material-symbols-outlined{
  font-variation-settings:"FILL" 0,"wght" 450,"GRAD" 0,"opsz" 24;
  line-height:1;
  vertical-align:middle;
}
.app{width:min(100%,1440px);min-height:100vh;margin:auto}
.top{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:14px;
  min-height:72px;padding:12px clamp(16px,3vw,32px);
  color:#fff;background:rgba(30,64,175,.97);
  border-bottom:1px solid rgba(255,255,255,.18);
  box-shadow:0 8px 25px rgba(30,64,175,.18);
  backdrop-filter:blur(14px);
}
.logo{
  display:grid;place-items:center;flex:0 0 auto;
  width:42px;height:42px;border-radius:10px;
  color:#fff;background:linear-gradient(145deg,#60A5FA,#2563EB);
  border:1px solid rgba(255,255,255,.4);
  box-shadow:inset 0 1px rgba(255,255,255,.3);
}
.logo .material-symbols-outlined{font-size:24px}
.brand{min-width:0}
.brand h1{
  margin:0;font-family:"Outfit",sans-serif;font-size:18px;
  font-weight:700;letter-spacing:.01em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.brand p{margin:1px 0 0;color:#DBEAFE;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.stat{text-align:right}
.stat b{display:block;font:700 17px/1.15 "Outfit",sans-serif;font-variant-numeric:tabular-nums}
.stat span{color:#DBEAFE;font-size:11px}
.nav{
  position:sticky;top:72px;z-index:19;
  display:flex;gap:6px;overflow-x:auto;padding:10px clamp(16px,3vw,32px);
  background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);
  scrollbar-width:thin;backdrop-filter:blur(12px);
}
.nav button{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  flex:0 0 auto;min-height:40px;padding:8px 12px;
  color:var(--muted);background:transparent;border:1px solid transparent;
  border-radius:8px;font-size:13px;font-weight:600;
  transition:color .2s,background .2s,border-color .2s,box-shadow .2s,transform .2s;
}
.nav button:hover{color:var(--blue);background:#EFF6FF;border-color:#BFDBFE;transform:translateY(-1px)}
.nav button.on{color:#fff;background:var(--blue);border-color:var(--blue);box-shadow:0 5px 14px rgba(37,99,235,.24)}
.nav .material-symbols-outlined{font-size:19px}
.wrap{padding:clamp(18px,3vw,32px)}
.page-head{
  display:flex;align-items:flex-end;justify-content:space-between;gap:18px;
  margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--line);
}
.h2{
  display:flex;align-items:center;gap:9px;margin:0 0 4px;
  font:700 clamp(18px,2vw,22px)/1.25 "Outfit",sans-serif;
}
.h2 .material-symbols-outlined{display:grid;place-items:center;width:34px;height:34px;color:var(--blue);background:#DBEAFE;border-radius:8px;font-size:20px}
.sub{max-width:900px;margin:0;color:var(--muted);font-size:12.5px}
.page-action{
  display:inline-flex;align-items:center;gap:7px;flex:0 0 auto;
  min-height:40px;padding:9px 14px;color:#fff;background:var(--color-accent);
  border:1px solid #C2410C;border-radius:8px;font-weight:700;
  box-shadow:0 5px 14px rgba(234,88,12,.2);
  transition:transform .2s,box-shadow .2s,background .2s;
}
.page-action:hover{background:#C2410C;transform:translateY(-1px);box-shadow:0 8px 18px rgba(194,65,12,.24)}
.card,.kpi,.detail,.tile{
  background:var(--panel);border:1px solid var(--line);
  border-radius:10px;box-shadow:var(--shadow);
}
.pad{padding:16px}
.section-title{margin:0 0 11px;font:700 14px/1.3 "Outfit",sans-serif}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{position:relative;overflow:hidden;padding:15px}
.kpi:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--blue)}
.kpi .lab{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:600}
.kpi .lab .material-symbols-outlined{color:var(--blue);font-size:18px}
.kpi .val{margin-top:7px;font:700 26px/1.1 "Outfit",sans-serif;font-variant-numeric:tabular-nums}
.kpi .val small{margin-left:4px;color:var(--muted);font:600 12px "Work Sans",sans-serif}
.kpi .dt{margin-top:5px;font-size:11.5px;font-weight:600}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
.split{display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr);gap:16px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g21{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr);gap:16px}
.listcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.srch{
  display:flex;align-items:center;gap:8px;min-height:42px;padding:8px 11px;
  color:var(--muted);background:#fff;border:1px solid var(--line);
  border-radius:8px;font-size:12px;
}
.srch .material-symbols-outlined{font-size:18px}
.tick{
  width:100%;min-width:0;padding:11px 12px;text-align:left;
  color:var(--ink);background:#fff;border:1px solid var(--line);
  border-radius:9px;box-shadow:0 1px 2px rgba(15,23,42,.03);
  transition:border-color .2s,box-shadow .2s,transform .2s,background .2s;
}
.tick:hover{border-color:#93C5FD;transform:translateY(-1px);box-shadow:var(--shadow-up)}
.tick.on{border-color:var(--blue);background:#F8FBFF;box-shadow:0 0 0 1px var(--blue),0 8px 22px rgba(37,99,235,.09)}
.tick .r1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tick .id,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.tick .id{color:var(--blue);font-size:12px;font-weight:700}
.tick .ti{margin:5px 0 3px;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tick .mt{display:flex;gap:9px;flex-wrap:wrap;color:var(--muted);font-size:11.5px}
.detail{min-width:0;padding:18px}
.dtitle{margin:0 0 3px;font:700 18px/1.3 "Outfit",sans-serif}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:14px}
.field{min-width:0;padding:10px 11px;background:#F8FAFC;border:1px solid var(--line);border-radius:8px}
.field .k{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:11px;font-weight:600}
.field .k .material-symbols-outlined{color:var(--blue);font-size:15px}
.field .v{margin-top:4px;font-size:13.5px;font-weight:700}
.bdg{
  display:inline-flex;align-items:center;gap:4px;padding:3px 8px;
  border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;
}
.bdg:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-red{color:#991B1B;background:#FEE2E2}.b-amb{color:#92400E;background:#FEF3C7}
.b-grn{color:#166534;background:#DCFCE7}.b-blu{color:#1E40AF;background:#DBEAFE}
.b-pur{color:#5B21B6;background:#EDE9FE}.b-gry{color:#475569;background:#E2E8F0}
.sla,.gauge{height:7px;overflow:hidden;background:#E2E8F0;border-radius:99px}
.sla i,.gauge i{display:block;height:100%;border-radius:inherit}
.tl{margin-top:7px;padding-left:7px}
.tl .it{position:relative;padding:0 0 15px 23px;border-left:2px solid var(--line)}
.tl .it:last-child{border-left-color:transparent}
.tl .it:before{content:"";position:absolute;left:-7px;top:2px;width:12px;height:12px;background:var(--blue);border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #BFDBFE}
.tl .tt{font-size:12.5px;font-weight:700}
.tl .tm{margin:2px 0;color:var(--muted);font:11px ui-monospace,SFMono-Regular,Menlo,monospace}
.tl .tx{color:#334155;font-size:12px}
.note{display:flex;align-items:flex-start;gap:8px;padding:11px 12px;color:#1E40AF;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:8px;font-size:12px}
.note .material-symbols-outlined{flex:0 0 auto;font-size:18px}
.ovf{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{width:100%;min-width:560px;border-collapse:collapse;font-size:12.5px}
thead th{padding:9px 10px;text-align:left;color:#334155;background:#F1F5F9;border-bottom:1px solid var(--line);font-size:11px;font-weight:700;white-space:nowrap}
tbody td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#F8FAFC}
.num{text-align:right;font-variant-numeric:tabular-nums}
.board{display:grid;grid-template-columns:repeat(4,minmax(132px,1fr));gap:9px}
.col{min-width:0;padding:9px;background:#F1F5F9;border:1px solid var(--line);border-radius:8px}
.col h4{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px;font-size:12px}
.cnt{padding:1px 7px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:99px;font-size:10px}
.ccard{margin-bottom:8px;padding:9px;background:#fff;border:1px solid var(--line);border-radius:7px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.ccard:last-child{margin-bottom:0}
.cn{color:var(--blue);font:700 10.5px ui-monospace,SFMono-Regular,Menlo,monospace}
.cttl{margin:4px 0 6px;font-size:12px;font-weight:700}
.cft{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:10.5px}
.av{display:grid;place-items:center;width:22px;height:22px;color:#1E40AF;background:#DBEAFE;border-radius:50%;font-weight:700}
.mon{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.tile{min-width:0;padding:13px}
.tile .th{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:700}
.tile .big{margin:8px 0 4px;font:700 22px "Outfit",sans-serif;font-variant-numeric:tabular-nums}
.chartbox{min-width:0;overflow:hidden}
.clickable,.kpi,.tile,.ccard{transition:transform .2s,border-color .2s,box-shadow .2s}
.kpi:hover,.tile:hover,.ccard:hover{transform:translateY(-2px);border-color:#BFDBFE;box-shadow:var(--shadow-up)}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid rgba(37,99,235,.35);outline-offset:2px}
@keyframes enter{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
#screen>.page-head,#screen>.kpis,#screen>.split,#screen>.g2,#screen>.g21,#screen>.mon{animation:enter .4s cubic-bezier(.2,.8,.2,1) both}
#screen>:nth-child(2){animation-delay:.05s}#screen>:nth-child(3){animation-delay:.1s}#screen>:nth-child(4){animation-delay:.15s}
@media(max-width:1000px){
  .kpis,.board,.mon{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g21{grid-template-columns:1fr}
}
@media(max-width:768px){
  .top{min-height:66px}.nav{top:66px}
  .split,.g2,.fields{grid-template-columns:1fr}
  .page-head{align-items:flex-start}
  .page-action{display:none}
}
@media(max-width:520px){
  .wrap{padding:16px 12px}.top,.nav{padding-left:12px;padding-right:12px}
  .brand p,.stat.hideS,.nav .txt{display:none}
  .nav button{min-width:40px;padding:8px 10px}
  .kpis,.mon{grid-template-columns:1fr 1fr}
  .kpi{padding:12px}.kpi .val{font-size:22px}
}
@media(max-width:390px){.kpis,.mon{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?+m[1]:0);try{scrollTo(0,0)}catch(e){}}
addEventListener("hashchange",fromHash);fromHash();
</script>
