<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ITSM IT 服務管理平台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --acc:#9333ea; --acc2:#c084fc; --acc-soft:#f3e8ff;
  --bg:#f6f4fb; --panel:#ffffff; --ink:#1f1533; --sub:#6b6280;
  --line:#ece7f4; --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
  --shadow:0 1px 3px rgba(76,29,149,.06),0 8px 24px rgba(76,29,149,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle;line-height:1}
.app{max-width:1360px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:14px 20px;background:linear-gradient(100deg,#4c1d95,#7c3aed 55%,#9333ea);color:#fff}
.logo{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.logo .material-symbols-outlined{font-size:24px;color:#fff}
.brand{min-width:0}
.brand h1{margin:0;font-size:17px;font-weight:800;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:2px 0 0;font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .spacer{flex:1}
.top .stat{text-align:right;min-width:0}
.top .stat b{font-size:16px;font-weight:800;display:block}
.top .stat span{font-size:11px;opacity:.82}
.nav{display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.nav button{
  display:inline-flex;align-items:center;gap:7px;min-width:0;cursor:pointer;
  border:1px solid var(--line);background:#fff;color:var(--sub);
  padding:8px 13px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;
  transition:.15s;
}
.nav button .material-symbols-outlined{font-size:19px}
.nav button:hover{border-color:var(--acc2);color:var(--acc)}
.nav button.on{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 4px 12px rgba(147,51,234,.28)}
.wrap{padding:20px;flex:1}
.h2{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:800;margin:0 0 3px}
.h2 .material-symbols-outlined{font-size:21px;color:var(--acc)}
.sub{color:var(--sub);font-size:12.5px;margin:0 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:16px}
.min0>*{min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 15px;box-shadow:var(--shadow);min-width:0}
.kpi .lab{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:12px;font-weight:600}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--acc)}
.kpi .val{font-size:24px;font-weight:800;margin-top:7px;letter-spacing:.3px}
.kpi .val small{font-size:13px;font-weight:600;color:var(--sub);margin-left:3px}
.kpi .dt{font-size:11.5px;margin-top:4px;font-weight:600}
.up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--sub)}
.split{display:grid;grid-template-columns:340px 1fr;gap:16px}
.listcol{display:flex;flex-direction:column;gap:9px;min-width:0}
.srch{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;color:var(--sub);font-size:12.5px}
.srch .material-symbols-outlined{font-size:18px}
.tick{display:block;width:100%;text-align:left;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 13px;transition:.14s;min-width:0}
.tick:hover{border-color:var(--acc2);transform:translateY(-1px)}
.tick.on{border-color:var(--acc);box-shadow:0 4px 14px rgba(147,51,234,.14);background:#fdfbff}
.tick .r1{display:flex;align-items:center;gap:8px;justify-content:space-between}
.tick .id{font-family:Inter;font-weight:800;font-size:12.5px;color:var(--acc)}
.tick .ti{font-weight:700;font-size:13.5px;margin:6px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tick .mt{font-size:11.5px;color:var(--sub);display:flex;gap:9px;flex-wrap:wrap}
.bdg{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-red{background:#fee2e2;color:#b91c1c}.b-amb{background:#fef3c7;color:#b45309}
.b-grn{background:#dcfce7;color:#15803d}.b-blu{background:#dbeafe;color:#1d4ed8}
.b-pur{background:var(--acc-soft);color:#7e22ce}.b-gry{background:#eef0f4;color:#475569}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;min-width:0}
.dtitle{font-size:17px;font-weight:800;margin:0 0 3px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.field{border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#fafaff;min-width:0}
.field .k{font-size:11px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:5px}
.field .k .material-symbols-outlined{font-size:15px;color:var(--acc)}
.field .v{font-size:14px;font-weight:700;margin-top:5px}
.sla{margin-top:8px;height:9px;border-radius:99px;background:#eee6f7;overflow:hidden}
.sla i{display:block;height:100%;border-radius:99px}
.tl{position:relative;margin-top:6px;padding-left:8px}
.tl .it{position:relative;padding:0 0 16px 24px;border-left:2px solid var(--line)}
.tl .it:last-child{border-left-color:transparent}
.tl .it::before{content:"";position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--acc);border:2px solid #fff;box-shadow:0 0 0 2px var(--acc-soft)}
.tl .it .tt{font-weight:700;font-size:13px}
.tl .it .tm{font-size:11.5px;color:var(--sub);margin:2px 0 3px}
.tl .it .tx{font-size:12.5px;color:#4b4460}
table{width:100%;border-collapse:collapse;font-size:12.8px;min-width:560px}
thead th{text-align:left;font-size:11.5px;color:var(--sub);font-weight:700;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap;background:#faf9fd}
tbody td{padding:10px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:hover{background:#fbf9ff}
.mono{font-family:Inter;font-weight:700}
.ovf{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.col{background:#faf9fd;border:1px solid var(--line);border-radius:13px;padding:11px;min-width:0}
.col h4{margin:0 0 10px;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
.col h4 .cnt{background:#fff;border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:11px;color:var(--sub)}
.ccard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:9px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.ccard .cn{font-family:Inter;font-weight:800;font-size:11px;color:var(--acc)}
.ccard .cttl{font-size:12.8px;font-weight:700;margin:4px 0 6px}
.ccard .cft{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--sub)}
.av{width:22px;height:22px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g21{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.chartbox{overflow:hidden;min-width:0}
.mon{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{border:1px solid var(--line);border-radius:13px;padding:13px;background:var(--panel);box-shadow:var(--shadow);min-width:0}
.tile .th{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700}
.tile .big{font-size:22px;font-weight:800;margin:8px 0 2px}
.tile .gauge{height:7px;border-radius:99px;background:#eee6f7;overflow:hidden;margin-top:8px}
.tile .gauge i{display:block;height:100%}
.note{background:var(--acc-soft);border:1px solid #e9d5ff;border-radius:11px;padding:11px 13px;font-size:12.5px;color:#6b21a8;display:flex;gap:8px;align-items:flex-start}
.note .material-symbols-outlined{font-size:18px;flex:0 0 auto;margin-top:1px}
@media(max-width:1000px){
  .board,.mon{grid-template-columns:1fr 1fr}
  .kpis{grid-template-columns:1fr 1fr}
}
@media(max-width:820px){
  .split,.g2,.g21,.board,.mon,.kpis,.fields{grid-template-columns:1fr}
}
@media(max-width:560px){
  .nav button span.txt{display:none}
  .nav button{padding:9px 11px}
  .top .stat.hideS{display:none}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo"><span class="material-symbols-outlined">support_agent</span></div>
    <div class="brand">
      <h1>ITSM · IT 服務管理平台</h1>
      <p>服務工單、資產、監控到 SLA 的單一維運中心</p>
    </div>
    <div class="spacer"></div>
    <div class="stat hideS"><b>99.2%</b><span>本月系統可用率</span></div>
    <div class="stat"><b>29 分</b><span>平均處理 MTTR</span></div>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="wrap"><div id="screen"></div></div>
</div>

<script>
"use strict";
var MODS=[
  {i:0,ic:"receipt_long",nm:"服務台工單"},
  {i:1,ic:"warning",nm:"事件管理"},
  {i:2,ic:"account_tree",nm:"變更管理"},
  {i:3,ic:"inventory_2",nm:"資產與 CMDB"},
  {i:4,ic:"monitoring",nm:"即時監控告警"},
  {i:5,ic:"insights",nm:"SLA 服務報表"}
];
var chartRegistry=[];
function destroyCharts(){for(var k=0;k<chartRegistry.length;k++){try{chartRegistry[k].destroy();}catch(e){}}chartRegistry=[];}
function mkChart(id,opt){
  var el=document.getElementById(id);
  if(!el)return;
  var baseChart={redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:'Inter,"Noto Sans TC",sans-serif'};
  opt.chart=Object.assign(baseChart,opt.chart||{});
  var cht=new ApexCharts(el,opt);
  cht.render();chartRegistry.push(cht);
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

var TICKETS=[
  {id:"INC-20841",ti:"ERP 登入逾時，多人受影響",type:"事件",pr:"P1",prc:"b-red",st:"處理中",cat:"應用系統",user:"財務部 · 陳雅婷",eng:"林建宏",sla:38,slaMax:60,slac:"var(--warn)",asset:"SRV-ERP-02",ch:"監控告警",
    tl:[{t:"11:02",h:"監控告警觸發",x:"APM 偵測 ERP 回應時間 > 8s"},{t:"11:05",h:"服務台受理",x:"歸類為 P1 重大事件並升級"},{t:"11:09",h:"指派工程師",x:"分派應用組 林建宏 處理"},{t:"11:24",h:"處理中",x:"發現連線池耗盡，重啟服務中"}]},
  {id:"REQ-73310",ti:"新進同仁帳號開通申請",type:"請求",pr:"P3",prc:"b-blu",st:"待審核",cat:"帳號權限",user:"人資部 · 王曉明",eng:"待指派",sla:210,slaMax:480,slac:"var(--ok)",asset:"AD-DOMAIN",ch:"自助入口",
    tl:[{t:"09:14",h:"使用者提交",x:"申請 AD 帳號與 ERP 唯讀權限"},{t:"09:20",h:"服務台分類",x:"歸類為帳號權限請求"},{t:"09:30",h:"待主管核准",x:"依 RULE-02 需部門主管核准"}]},
  {id:"INC-20838",ti:"倉庫無線 AP 斷線",type:"事件",pr:"P2",prc:"b-amb",st:"處理中",cat:"網路",user:"倉儲部 · 張志豪",eng:"黃俊傑",sla:52,slaMax:120,slac:"var(--warn)",asset:"AP-WH-07",ch:"電話報修",
    tl:[{t:"10:41",h:"電話報修",x:"倉庫掃碼槍無法連線"},{t:"10:46",h:"服務台受理",x:"確認影響 1 個區域"},{t:"10:52",h:"派工",x:"分派網路組 黃俊傑 現場檢修"}]},
  {id:"REQ-73298",ti:"軟體授權擴充 - Adobe 5 席",type:"請求",pr:"P4",prc:"b-gry",st:"處理中",cat:"軟體授權",user:"行銷部 · 李思妤",eng:"周家瑋",sla:640,slaMax:1440,slac:"var(--ok)",asset:"LIC-ADOBE",ch:"自助入口",
    tl:[{t:"昨 16:20",h:"使用者提交",x:"申請新增 5 席設計軟體授權"},{t:"昨 16:40",h:"服務台受理",x:"確認預算與授權餘量"},{t:"今 09:00",h:"採購協調中",x:"與供應商確認交期"}]},
  {id:"INC-20835",ti:"郵件伺服器空間告警 92%",type:"事件",pr:"P2",prc:"b-amb",st:"待處理",cat:"基礎設施",user:"系統監控",eng:"待指派",sla:8,slaMax:90,slac:"var(--bad)",asset:"SRV-MAIL-01",ch:"監控告警",
    tl:[{t:"11:33",h:"容量告警",x:"儲存使用率達 92%，觸發 RULE-03"},{t:"11:34",h:"進入佇列",x:"等待容量組工程師承接"}]},
  {id:"INC-20829",ti:"VPN 憑證即將到期",type:"事件",pr:"P3",prc:"b-blu",st:"已解決",cat:"資安",user:"資訊部",eng:"陳冠廷",sla:120,slaMax:480,slac:"var(--ok)",asset:"GW-VPN",ch:"監控告警",
    tl:[{t:"昨 14:10",h:"憑證掃描告警",x:"距到期 7 天"},{t:"昨 14:30",h:"服務台受理",x:"建立更換憑證任務"},{t:"昨 15:50",h:"已解決",x:"完成憑證更新並驗證"}]},
  {id:"REQ-73280",ti:"筆電汰換 - 研發部 3 台",type:"請求",pr:"P4",prc:"b-gry",st:"已完成",cat:"資產調度",user:"研發部 · 吳承恩",eng:"周家瑋",sla:1200,slaMax:2880,slac:"var(--ok)",asset:"PC-POOL",ch:"自助入口",
    tl:[{t:"前日",h:"使用者提交",x:"申請汰換老舊設備"},{t:"昨日",h:"資產配發",x:"完成資產登錄與部署"},{t:"今 08:30",h:"已完成",x:"使用者確認結案"}]}
];
var PR_ORDER={"P1":0,"P2":1,"P3":2,"P4":3};

(function(){
  var nav=document.getElementById("nav");var s="";
  for(var i=0;i<MODS.length;i++){
    s+='<button data-i="'+MODS[i].i+'" onclick="show('+MODS[i].i+')"><span class="material-symbols-outlined">'+MODS[i].ic+'</span><span class="txt">'+MODS[i].nm+'</span></button>';
  }
  nav.innerHTML=s;
})();
function setNav(i){
  var b=document.querySelectorAll("[data-i]");
  for(var k=0;k<b.length;k++){b[k].classList.toggle("on",+b[k].getAttribute("data-i")===i);}
}

var SEL0=0;
function screen0(c){
  var openCnt=TICKETS.filter(function(t){return t.st!=="已完成"&&t.st!=="已關閉";}).length;
  var p1=TICKETS.filter(function(t){return t.pr==="P1";}).length;
  var h='';
  h+='<div class="h2"><span class="material-symbols-outlined">receipt_long</span>服務台工單受理</div>';
  h+='<p class="sub">單一收件匣整合報修、自助入口與監控告警；受理後自動分類、套用 SLA 並分派。左側為工單佇列，右側為受理詳情。</p>';
  h+='<div class="kpis">';
  h+=kpi("inbox","今日待受理",String(openCnt),"件","+5 vs 昨","up");
  h+=kpi("priority_high","P1 重大事件",String(p1),"件","即時升級中","down");
  h+=kpi("timer","服務台首解率","64","%","+7pt","up");
  h+=kpi("groups","線上工程師","6","人","2 人閒置","flat");
  h+='</div>';
  h+='<div class="split min0">';
  h+='<div class="listcol"><div class="srch"><span class="material-symbols-outlined">search</span>搜尋工單編號 / 使用者 / 資產…</div>';
  var sorted=TICKETS.slice().sort(function(a,b){return (PR_ORDER[a.pr]-PR_ORDER[b.pr]);});
  for(var i=0;i<sorted.length;i++){
    var t=sorted[i];var idx=TICKETS.indexOf(t);
    h+='<button class="tick'+(idx===SEL0?' on':'')+'" onclick="pick0('+idx+')">';
    h+='<div class="r1"><span class="id">'+t.id+'</span><span class="bdg '+t.prc+'">'+t.pr+'</span></div>';
    h+='<div class="ti">'+esc(t.ti)+'</div>';
    h+='<div class="mt"><span><span class="material-symbols-outlined" style="font-size:14px">person</span> '+esc(t.user)+'</span><span>'+t.cat+'</span></div>';
    h+='</button>';
  }
  h+='</div>';
  h+='<div id="det0"></div>';
  h+='</div>';
  c.innerHTML=h;
  renderDet0();
}
function pick0(i){
  SEL0=i;
  var s=TICKETS.slice().sort(function(a,z){return PR_ORDER[a.pr]-PR_ORDER[z.pr];});
  var order=s.map(function(x){return TICKETS.indexOf(x);});
  var list=document.querySelectorAll("#screen .listcol .tick");
  for(var k=0;k<list.length;k++){list[k].classList.toggle("on",order[k]===i);}
  renderDet0();
}
function renderDet0(){
  var el=document.getElementById("det0");if(!el)return;
  var t=TICKETS[SEL0];
  var pct=Math.round(t.sla/t.slaMax*100);
  var h='<div class="detail">';
  h+='<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div><div class="dtitle">'+esc(t.ti)+'</div><div style="color:var(--sub);font-size:12.5px" class="mono">'+t.id+' · '+t.type+'</div></div><span class="bdg '+t.prc+'">'+t.pr+'</span></div>';
  h+='<div class="fields">';
  h+=fld("person","申報人",esc(t.user));
  h+=fld("engineering","處理工程師",esc(t.eng));
  h+=fld("category","分類",t.cat);
  h+=fld("dns","關聯資產",t.asset);
  h+=fld("call","來源管道",t.ch);
  h+=fld("flag","目前狀態",t.st);
  h+='</div>';
  h+='<div style="margin-top:14px"><div style="display:flex;justify-content:space-between;font-size:12px;font-weight:600"><span style="color:var(--sub)">SLA 時效倒數</span><span style="color:'+t.slac+'">已用 '+t.sla+' / '+t.slaMax+' 分</span></div>';
  h+='<div class="sla"><i style="width:'+Math.min(pct,100)+'%;background:'+t.slac+'"></i></div></div>';
  h+='<div style="font-size:12.5px;font-weight:700;margin:16px 0 4px;color:var(--sub)">受理與處理紀錄</div>';
  h+='<div class="tl">';
  for(var j=0;j<t.tl.length;j++){h+='<div class="it"><div class="tt">'+esc(t.tl[j].h)+'</div><div class="tm">'+t.tl[j].t+'</div><div class="tx">'+esc(t.tl[j].x)+'</div></div>';}

function kpi(ic,lab,val,unit,dt,cls){
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+ic+'</span>'+lab+'</div><div class="val">'+val+'<small>'+unit+'</small></div><div class="dt '+cls+'">'+dt+'</div></div>';
}
function fld(ic,k,v){
  return '<div class="field"><div class="k"><span class="material-symbols-outlined">'+ic+'</span>'+k+'</div><div class="v">'+v+'</div></div>';
}

var RENDER=[screen0,screen1,screen2,screen3,screen4,screen5];
function show(i){
  destroyCharts();
  var c=document.getElementById("screen");
  RENDER[i](c);
  setNav(i);
  void c.offsetHeight;
}
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
