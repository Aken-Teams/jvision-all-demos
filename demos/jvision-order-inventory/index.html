<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>訂單與庫存管理｜WMS 倉儲管理 Demo</title>
<meta name="description" content="收貨到出貨的倉內作業與庫存精準管理" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;500;600;700&family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000000;
  --color-secondary:#10b981;
  --color-on-secondary:#0f172a;
  --color-accent:#ea580c;
  --color-on-accent:#000000;
  --color-background:#ecfdf5;
  --color-foreground:#064e3b;
  --color-card:#ffffff;
  --color-card-foreground:#064e3b;
  --color-muted:#e8f1f3;
  --color-muted-foreground:#475569;
  --color-border:#a7f3d0;
  --color-destructive:#dc2626;
  --color-on-destructive:#ffffff;
  --color-ring:#059669;
  --blue:#059669;
  --ink:#064e3b;
  --muted:#475569;
  --line:#a7f3d0;
  --bg:#ecfdf5;
  --card:#ffffff;
  --accent:#059669;
  --accent2:#10b981;
  --accent-d:#047857;
  --ok:#15803d;
  --warn:#b45309;
  --bad:#dc2626;
  --info:#0369a1;
  --radius-sm:10px;
  --radius-md:16px;
  --radius-lg:22px;
  --shadow-sm:0 2px 0 rgba(6,78,59,.08);
  --shadow:0 3px 0 rgba(6,78,59,.08),0 16px 36px rgba(5,150,105,.10);
  --shadow-hover:0 5px 0 rgba(6,78,59,.10),0 22px 44px rgba(5,150,105,.16);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  background:
    radial-gradient(circle at 92% 5%,rgba(234,88,12,.13) 0 9%,transparent 9.2%),
    linear-gradient(135deg,rgba(16,185,129,.08) 25%,transparent 25%) 0 0/34px 34px,
    var(--color-background);
  color:var(--color-foreground);
  font-family:"Nunito Sans",system-ui,sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,[data-i],.btn{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.msy{
  font-family:"Material Symbols Outlined";
  font-weight:400;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
  -webkit-font-feature-settings:'liga';
  font-feature-settings:'liga';
}
.shell{display:flex;min-height:100vh}
.shell>*{min-width:0}
.side{
  position:sticky;
  top:0;
  z-index:30;
  display:flex;
  flex:none;
  flex-direction:column;
  width:244px;
  height:100vh;
  overflow:hidden;
  color:#d1fae5;
  background:
    linear-gradient(145deg,transparent 0 72%,rgba(234,88,12,.22) 72% 82%,transparent 82%),
    linear-gradient(180deg,#064e3b 0%,#065f46 58%,#047857 100%);
  border-right:3px solid #10b981;
  box-shadow:10px 0 36px rgba(6,78,59,.16);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:22px 18px 18px;
  border-bottom:1px solid rgba(255,255,255,.18);
}
.brand .logo{
  display:flex;
  flex:none;
  align-items:center;
  justify-content:center;
  width:44px;
  height:44px;
  color:#052e16;
  background:#f97316;
  border:2px solid #fed7aa;
  border-radius:14px 6px 14px 6px;
  box-shadow:5px 5px 0 rgba(0,0,0,.2);
  transform:rotate(-2deg);
}
.brand .logo .msy{font-size:25px}
.brand b{
  display:block;
  color:#fff;
  font-family:"Rubik",sans-serif;
  font-size:16px;
  font-weight:700;
  letter-spacing:.2px;
}
.brand span{font-size:11px;color:#a7f3d0;letter-spacing:.5px}
.nav{display:flex;flex:1;flex-direction:column;gap:7px;min-width:0;padding:16px 12px;overflow:auto}
.nav button{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  min-width:0;
  min-height:48px;
  padding:10px 12px;
  color:#d1fae5;
  text-align:left;
  background:transparent;
  border:1px solid transparent;
  border-radius:13px;
  transition:transform .22s ease,background-color .22s ease,color .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.nav button .msy{flex:none;font-size:21px}
.nav button .nt{min-width:0;overflow:hidden;font-size:13.5px;font-weight:700;text-overflow:ellipsis;white-space:nowrap}
.nav button small{display:block;color:#a7f3d0;font-size:10.5px;font-weight:500}
.nav button:hover{color:#fff;background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.18);transform:translateX(3px)}
.nav button.on{
  color:#052e16;
  background:#6ee7b7;
  border-color:#d1fae5;
  box-shadow:5px 5px 0 #022c22;
  transform:translate(-2px,-2px);
}
.nav button.on small{color:#064e3b}
.sfoot{
  display:flex;
  align-items:center;
  gap:9px;
  padding:15px 18px;
  color:#d1fae5;
  font-size:11px;
  border-top:1px solid rgba(255,255,255,.18);
  background:rgba(0,0,0,.12);
}
.sfoot .dot{width:9px;height:9px;border:2px solid #d1fae5;border-radius:50%;background:#34d399;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(110,231,183,.7)}70%{box-shadow:0 0 0 9px rgba(110,231,183,0)}100%{box-shadow:0 0 0 0 rgba(110,231,183,0)}}
.main{display:flex;flex:1;min-width:0;flex-direction:column}
.top{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  gap:16px;
  min-height:76px;
  padding:14px 26px;
  background:rgba(255,255,255,.92);
  border-bottom:2px solid var(--color-border);
  box-shadow:0 6px 22px rgba(6,78,59,.07);
  backdrop-filter:blur(12px);
}
.top h1{margin:0;font-family:"Rubik",sans-serif;font-size:22px;font-weight:700;letter-spacing:-.4px}
.top h1::after{display:inline-block;width:10px;height:10px;margin-left:9px;background:var(--color-accent);border-radius:2px;content:"";transform:rotate(12deg)}
.top .sub{margin-top:2px;color:var(--color-muted-foreground);font-size:12px;font-weight:600}
.top .spacer{flex:1;min-width:12px}
.chipbar{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 11px;
  color:#065f46;
  background:#d1fae5;
  border:1px solid #6ee7b7;
  border-radius:9px;
  font-size:12px;
  font-weight:700;
  box-shadow:2px 2px 0 rgba(5,150,105,.14);
}
.chip .msy{font-size:16px}
.wrap{width:100%;max-width:1320px;padding:28px 28px 52px}
.g{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,1fr)}
.k{
  position:relative;
  min-width:0;
  min-height:138px;
  overflow:hidden;
  padding:18px;
  background:var(--color-card);
  border:2px solid var(--color-border);
  border-radius:var(--radius-lg) var(--radius-lg) 8px var(--radius-lg);
  box-shadow:var(--shadow);
  transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;
  animation:card-in .4s both cubic-bezier(.2,.8,.2,1.15);
}
.k:nth-child(2){animation-delay:.06s}.k:nth-child(3){animation-delay:.12s}.k:nth-child(4){animation-delay:.18s}
.k::before{position:absolute;top:0;right:0;width:54px;height:10px;background:var(--color-accent);border-radius:0 0 0 8px;content:""}
.k::after{position:absolute;right:-16px;bottom:-22px;width:70px;height:70px;background:rgba(16,185,129,.11);border:2px solid rgba(5,150,105,.16);border-radius:18px;content:"";transform:rotate(24deg)}
.k:hover{border-color:#34d399;box-shadow:var(--shadow-hover);transform:translateY(-4px)}
.k .lab{display:flex;align-items:center;gap:7px;color:var(--color-muted-foreground);font-size:12px;font-weight:700}
.k .lab .msy{display:grid;width:28px;height:28px;place-items:center;color:#065f46;background:#d1fae5;border-radius:8px;font-size:17px}
.k .val{position:relative;z-index:1;margin-top:9px;font-family:"Rubik",sans-serif;font-size:28px;font-weight:700;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.k .val small{color:var(--color-muted-foreground);font-size:13px;font-weight:700}
.k .delta{position:relative;z-index:1;margin-top:5px;font-size:11.5px;font-weight:700}
.up{color:#166534}.down{color:#b91c1c}.flat{color:#475569}
.card,.lp{
  min-width:0;
  overflow:hidden;
  background:var(--color-card);
  border:2px solid var(--color-border);
  border-radius:var(--radius-lg) var(--radius-lg) 10px var(--radius-lg);
  box-shadow:var(--shadow);
  animation:card-in .42s both cubic-bezier(.2,.8,.2,1.15);
}
.card{transition:box-shadow .25s ease,border-color .25s ease}
.card:hover{border-color:#6ee7b7;box-shadow:var(--shadow-hover)}
.card>.ch{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:55px;
  padding:14px 17px;
  background:linear-gradient(90deg,#f0fdf4,#fff);
  border-bottom:2px solid var(--color-border);
  flex-wrap:wrap;
}
.card>.ch h3{margin:0;font-family:"Rubik",sans-serif;font-size:15px;font-weight:700}
.card>.ch>.msy{display:grid;width:30px;height:30px;place-items:center;color:#fff;background:#059669;border-radius:9px;font-size:18px}
.card>.ch .r{display:flex;align-items:center;gap:8px;margin-left:auto;color:var(--color-muted-foreground);font-size:12px;font-weight:700;flex-wrap:wrap}
.card>.cb{padding:17px}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.split{display:grid;grid-template-columns:350px 1fr;gap:16px;align-items:start}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
th,td{padding:11px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid #d7eee4}
th{color:#334155;background:#dff8ea;font-size:11px;font-weight:800;letter-spacing:.45px;text-transform:uppercase}
th:first-child{border-radius:9px 0 0 9px}th:last-child{border-radius:0 9px 9px 0}
tbody tr{transition:background-color .18s ease,transform .18s ease}
tbody tr:hover{background:#f0fdf4}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.num{font-family:"Rubik",ui-monospace,monospace}
.mini,.id,.tm{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border:1px solid currentColor;border-radius:7px;font-size:11px;font-weight:800;line-height:1.35}
.tag::before{width:6px;height:6px;border:1px solid currentColor;border-radius:50%;background:currentColor;content:""}
.t-ok{color:#166534;background:#dcfce7}.t-warn{color:#92400e;background:#fef3c7}.t-bad{color:#991b1b;background:#fee2e2}.t-info{color:#075985;background:#e0f2fe}.t-mut{color:#475569;background:#f1f5f9}
.bar{height:9px;min-width:60px;overflow:hidden;background:#dce9e4;border-radius:3px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#047857,#10b981);border-radius:3px;transition:width .45s ease}
.echart{width:100%;height:270px}
.mini{color:var(--color-muted-foreground);font-size:11.5px}
.lp .lph{display:flex;align-items:center;gap:9px;padding:15px;background:#064e3b;color:#fff;border-bottom:2px solid #10b981}
.lp .lph .msy{color:#6ee7b7}
.lp .lph b{font-family:"Rubik",sans-serif;font-size:14px;font-weight:700}
.lp .lph .cnt{margin-left:auto;padding:3px 8px;color:#052e16;background:#6ee7b7;border-radius:6px;font-size:11px;font-weight:800}
.lrow{display:flex;flex-direction:column;gap:6px;padding:13px 15px;border-bottom:1px solid #d7eee4;transition:background-color .2s ease,transform .2s ease}
.lrow:hover{background:#f0fdf4;transform:translateX(3px)}
.lrow.sel{background:linear-gradient(90deg,#d1fae5,#fff7ed);box-shadow:inset 5px 0 0 var(--color-accent)}
.lrow .t1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lrow .t1 b{font-size:13px;font-weight:800}
.lrow .t1 .id{color:var(--color-muted-foreground);font-size:11px}
.lrow .t2{display:flex;align-items:center;gap:6px;color:var(--color-muted-foreground);font-size:11.5px}
.dp{display:flex;min-width:0;flex-direction:column;gap:16px}
.dhead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.dhead .dt b{font-family:"Rubik",sans-serif;font-size:18px;font-weight:700}
.dhead .dt .m{margin-top:3px;color:var(--color-muted-foreground);font-size:12px}
.dhead .r{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:8px 13px;color:var(--color-foreground);background:#fff;border:2px solid var(--color-border);border-radius:10px;font-size:12.5px;font-weight:800;box-shadow:2px 2px 0 rgba(6,78,59,.12);transition:transform .2s ease,box-shadow .2s ease,background-color .2s ease}
.btn:hover{background:#ecfdf5;box-shadow:4px 4px 0 rgba(6,78,59,.16);transform:translate(-1px,-1px)}
.btn.pri{color:#fff;background:#ea580c;border-color:#c2410c;box-shadow:3px 3px 0 #7c2d12}
.btn.pri:hover{background:#c2410c;box-shadow:5px 5px 0 #7c2d12}
.btn .msy{font-size:17px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.fact{min-width:0;padding:12px;background:#ecfdf5;border:1px solid #6ee7b7;border-radius:12px 12px 5px 12px}
.fact .l{color:var(--color-muted-foreground);font-size:11px;font-weight:700}
.fact .v{margin-top:4px;font-family:"Rubik",sans-serif;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.steps{display:flex;flex-direction:column}
.stp{position:relative;display:flex;gap:12px;padding:0 0 17px}
.stp:last-child{padding-bottom:0}
.stp .dot{z-index:1;display:flex;flex:none;align-items:center;justify-content:center;width:28px;height:28px;border:2px solid transparent;border-radius:9px}
.stp .dot .msy{font-size:16px}
.stp .dot.done{color:#fff;background:#15803d}.stp .dot.now{color:#fff;background:#047857;box-shadow:0 0 0 4px #d1fae5}.stp .dot.wait{color:#475569;background:#e8f1f3;border-color:#94a3b8}
.stp::before{position:absolute;top:27px;bottom:0;left:13px;width:2px;background:var(--color-border);content:""}
.stp:last-child::before{display:none}
.stp .sc b{font-size:13.5px;font-weight:800}.stp .sc .m{margin-top:2px;color:var(--color-muted-foreground);font-size:11.5px}
.binmap{display:grid;grid-template-columns:repeat(12,1fr);gap:7px;min-width:520px}
.binmap .cell{display:flex;align-items:center;justify-content:center;aspect-ratio:1;color:#fff;border:2px solid rgba(0,0,0,.12);border-radius:6px;font-size:10px;font-weight:800;box-shadow:2px 2px 0 rgba(6,78,59,.14);transition:transform .2s ease,filter .2s ease}
.binmap .cell:hover{filter:saturate(1.15);transform:scale(1.08)}
.binmap .cell span{opacity:1;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.legend{display:flex;gap:14px;margin-top:13px;color:var(--color-muted-foreground);font-size:11.5px;flex-wrap:wrap}
.legend i{display:inline-block;width:13px;height:13px;margin-right:5px;vertical-align:-2px;border:1px solid rgba(0,0,0,.28);border-radius:3px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;min-width:700px;align-items:start}
.col{min-width:0;padding:11px;background:#ecfdf5;border:2px solid var(--color-border);border-radius:15px 15px 6px 15px}
.col>.h{display:flex;align-items:center;gap:7px;margin-bottom:10px;padding:1px 2px;font-family:"Rubik",sans-serif;font-size:12.5px;font-weight:700}
.col>.h .n{margin-left:auto;padding:2px 8px;color:#065f46;background:#fff;border:1px solid #6ee7b7;border-radius:6px;font-size:11px}
.tk{padding:11px;margin-bottom:10px;background:#fff;border:1px solid #a7f3d0;border-radius:11px;box-shadow:3px 3px 0 rgba(5,150,105,.12);transition:transform .2s ease,box-shadow .2s ease}
.tk:hover{box-shadow:5px 5px 0 rgba(5,150,105,.16);transform:translate(-1px,-2px)}
.tk:last-child{margin-bottom:0}.tk .tkt{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800}.tk .tkm{display:flex;gap:10px;margin-top:5px;color:var(--color-muted-foreground);font-size:11px;flex-wrap:wrap}.tk .pr{flex:none;width:10px;height:10px;margin-left:auto;border:2px solid currentColor;border-radius:2px}.pr-h{color:#991b1b;background:#ef4444}.pr-m{color:#92400e;background:#f59e0b}.pr-l{color:#166534;background:#22c55e}
.pda{max-width:310px;margin:0 auto;padding:15px;background:#052e16;border:3px solid #10b981;border-radius:28px 28px 13px 28px;box-shadow:10px 12px 0 #bbf7d0,0 25px 45px rgba(6,78,59,.28)}
.pda .scr{padding:15px;color:#d1fae5;background:#022c22;border:1px solid #047857;border-radius:17px;font-family:"Nunito Sans",sans-serif}
.pda .scr .sh{display:flex;justify-content:space-between;padding-bottom:9px;margin-bottom:11px;color:#a7f3d0;border-bottom:1px solid rgba(255,255,255,.16);font-family:ui-monospace,monospace;font-size:11px}
.pda .beam{position:relative;display:flex;align-items:center;justify-content:center;height:112px;overflow:hidden;background:rgba(16,185,129,.08);border:2px dashed #6ee7b7;border-radius:12px}
.pda .beam .msy{color:#6ee7b7;font-size:48px}.pda .beam::after{position:absolute;top:7px;right:0;left:0;height:3px;background:linear-gradient(90deg,transparent,#f97316,transparent);content:"";animation:scan 2.4s ease-in-out infinite}
@keyframes scan{0%,100%{top:7px}50%{top:101px}}
.pda .row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.10);font-size:12px}.pda .row b{color:#fff}.pda .big{margin:11px 0 5px;color:#6ee7b7;font-family:"Rubik",sans-serif;font-size:23px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.scanlog{font-size:12.5px}.scanlog .r{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--color-border)}.scanlog .r:last-child{border:0}.scanlog .r .msy{flex:none;font-size:18px}.scanlog .r .tm{flex:none;margin-left:auto;color:var(--color-muted-foreground);font-size:11px}
.gz{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ovx{overflow-x:auto;scrollbar-color:#10b981 #d1fae5;scrollbar-width:thin}
@keyframes card-in{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.two,.split{grid-template-columns:1fr}.gz{grid-template-columns:repeat(3,1fr)}}
@media(max-width:860px){
  .shell{flex-direction:column}
  .side{position:sticky;top:0;z-index:30;flex-direction:row;align-items:center;width:100%;height:auto;border-right:0;border-bottom:3px solid #10b981}
  .brand{flex:none;padding:10px 12px;border-right:1px solid rgba(255,255,255,.18);border-bottom:0}
  .brand .logo{width:38px;height:38px;box-shadow:3px 3px 0 rgba(0,0,0,.2)}
  .brand .txt{display:none}
  .nav{flex-direction:row;gap:6px;padding:7px;overflow-x:auto}
  .nav button{flex:none;width:auto;min-height:44px;padding:8px 11px;white-space:nowrap}
  .nav button small{display:none}
  .nav button:hover{transform:translateY(-2px)}
  .sfoot{display:none}
  .facts{grid-template-columns:1fr}
  .top{top:61px}
}
@media(max-width:768px){.wrap{padding:20px 16px 40px}.top{padding:12px 16px}.chipbar{width:100%}.chip{flex:1;justify-content:center}.card>.cb{padding:14px}.k{min-height:128px}}
@media(max-width:560px){
  .nav button .nt{display:none}
  .nav button{min-width:43px;justify-content:center}
  .top{align-items:flex-start;top:61px;gap:8px}.top h1{font-size:20px}.top .spacer{display:none}.chipbar{gap:6px}.chip{padding:5px 7px;font-size:10.5px}

/* ---------- nav / router ---------- */
var SCREENS=[s0,s1,s2,s3,s4,s5];
function buildNav(){
  var h=MOD.map(function(m,i){
    return '<button data-i="'+i+'"><span class="msy">'+m.icon+'</span><span class="nt">'+esc(m.name)+'<small>'+esc(m.desc)+'</small></span></button>';
  }).join('');
  document.getElementById('nav').innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('[data-i]'),function(b){
    b.addEventListener('click',function(){show(+b.getAttribute('data-i'));});
  });
}
function show(i){
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  disposeGauges();disposeChart();
  document.getElementById('scrT').textContent=MOD[i].name;
  document.getElementById('scrS').textContent=MOD[i].desc;
  Array.prototype.forEach.call(document.querySelectorAll('[data-i]'),function(b){
    b.classList.toggle('on',+b.getAttribute('data-i')===i);
  });
  SCREENS[i]();
}
buildNav();
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
