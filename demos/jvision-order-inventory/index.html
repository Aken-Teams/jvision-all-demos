<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>訂單與庫存管理｜WMS 倉儲管理 Demo</title>
<meta name="description" content="收貨到出貨的倉內作業與庫存精準管理" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#0891b2;--accent2:#22d3ee;--accent-d:#0e7490;
  --ink:#0f2b33;--muted:#5b7681;--line:#dbe8ec;--bg:#eef4f6;--card:#ffffff;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#0284c7;
  --shadow:0 1px 2px rgba(8,145,178,.06),0 8px 24px rgba(8,145,178,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5;
}
.msy{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;line-height:1;vertical-align:middle;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.shell{display:flex;min-height:100vh}
.shell>*{min-width:0}

/* Sidebar rail */
.side{
  width:224px;flex:none;background:linear-gradient(180deg,#083344 0%,#0b4553 60%,#0e5566 100%);
  color:#cdeff5;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#062830;flex:none;box-shadow:0 6px 16px rgba(34,211,238,.35)}
.brand .logo .msy{font-size:22px}
.brand b{display:block;color:#fff;font-size:15px;font-weight:800;letter-spacing:.3px}
.brand span{font-size:11px;color:#7fd4e3;letter-spacing:.5px}
.nav{display:flex;flex-direction:column;gap:3px;padding:12px 10px;overflow:auto;flex:1;min-width:0}
.nav button{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;
  background:transparent;border:0;color:#bfe6ee;padding:10px 12px;border-radius:11px;
  font-family:inherit;font-size:13.5px;font-weight:600;transition:.15s;min-width:0;
}
.nav button .msy{font-size:20px;flex:none}
.nav button .nt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nav button small{display:block;font-size:10.5px;color:#6fb9c8;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;box-shadow:0 8px 20px rgba(8,145,178,.4)}
.nav button.on small{color:#d4f5fb}
.sfoot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#7fd4e3;display:flex;align-items:center;gap:8px}
.sfoot .dot{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}

/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{
  display:flex;align-items:center;gap:14px;padding:14px 22px;background:rgba(255,255,255,.85);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap;
}
.top h1{font-size:17px;margin:0;font-weight:800}
.top .sub{font-size:12px;color:var(--muted);margin-top:1px}
.top .spacer{flex:1;min-width:12px}
.chipbar{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:#e0f5fa;color:var(--accent-d);border:1px solid #b6e6f0;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700}
.chip .msy{font-size:15px}
.wrap{padding:20px 22px 40px;max-width:1240px;width:100%}

/* Generic */
.g{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(4,1fr)}
.k{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden;min-width:0}
.k::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent),var(--accent2))}
.k .lab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.k .lab .msy{font-size:16px;color:var(--accent)}
.k .val{font-size:26px;font-weight:900;letter-spacing:-.5px;margin-top:6px}
.k .val small{font-size:13px;font-weight:700;color:var(--muted)}
.k .delta{font-size:11.5px;font-weight:700;margin-top:4px}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0}
.card>.ch{display:flex;align-items:center;gap:9px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card>.ch h3{margin:0;font-size:14.5px;font-weight:800}
.card>.ch .msy{color:var(--accent);font-size:19px}
.card>.ch .r{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card>.cb{padding:14px 16px}

.two{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.split{display:grid;grid-template-columns:340px 1fr;gap:14px;align-items:start}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.4px;color:var(--muted);text-transform:uppercase;font-weight:700;background:#f4fafb}
tbody tr:hover{background:#f2fbfd}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
.t-ok{background:#dcfce7;color:#15803d}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#e0f2fe;color:#0369a1}.t-mut{background:#eef2f4;color:#64748b}
.bar{height:7px;border-radius:6px;background:#e6eef1;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.echart{width:100%;height:270px}
.mini{font-size:11.5px;color:var(--muted)}

/* Left list pane (signature split) */
.lp{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.lp .lph{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.lp .lph .msy{color:var(--accent)}
.lp .lph b{font-size:13.5px;font-weight:800}
.lp .lph .cnt{margin-left:auto;font-size:11px;background:#e0f5fa;color:var(--accent-d);padding:2px 8px;border-radius:999px;font-weight:700}
.lrow{padding:11px 14px;border-bottom:1px solid #eef4f6;display:flex;flex-direction:column;gap:5px}
.lrow:hover{background:#f2fbfd}
.lrow.sel{background:linear-gradient(90deg,#e0f7fb,#f4fdff);box-shadow:inset 3px 0 0 var(--accent)}
.lrow .t1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lrow .t1 b{font-size:13px;font-weight:800}
.lrow .t1 .id{font-size:11px;color:var(--muted);font-family:Inter}
.lrow .t2{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}

/* Detail pane */
.dp{display:flex;flex-direction:column;gap:14px;min-width:0}
.dhead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.dhead .dt b{font-size:17px;font-weight:900}
.dhead .dt .m{font-size:12px;color:var(--muted);margin-top:2px}
.dhead .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 13px;border-radius:10px;font-size:12.5px;font-weight:700;cursor:default;font-family:inherit}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;border-color:transparent}
.btn .msy{font-size:16px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fact{background:#f6fbfc;border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-width:0}
.fact .l{font-size:11px;color:var(--muted);font-weight:600}
.fact .v{font-size:16px;font-weight:800;margin-top:3px}

/* checklist / steps */
.steps{display:flex;flex-direction:column;gap:0}
.stp{display:flex;gap:12px;padding:0 0 16px;position:relative}
.stp:last-child{padding-bottom:0}
.stp .dot{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;z-index:1}
.stp .dot .msy{font-size:15px}
.stp .dot.done{background:var(--ok);color:#fff}
.stp .dot.now{background:var(--accent);color:#fff;box-shadow:0 0 0 4px rgba(8,145,178,.15)}
.stp .dot.wait{background:#e2eef1;color:#8aa;border:1px solid var(--line)}
.stp::before{content:"";position:absolute;left:12.5px;top:26px;bottom:0;width:2px;background:var(--line)}
.stp:last-child::before{display:none}
.stp .sc b{font-size:13.5px;font-weight:800}
.stp .sc .m{font-size:11.5px;color:var(--muted);margin-top:2px}

/* Putaway bin matrix */
.binmap{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;min-width:520px}
.binmap .cell{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff}
.binmap .cell span{opacity:.95}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* Wave board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start;min-width:640px}
.col{background:#f5fafb;border:1px solid var(--line);border-radius:13px;padding:10px;min-width:0}
.col>.h{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;margin-bottom:9px;padding:0 2px}
.col>.h .n{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:999px;font-size:11px;padding:1px 8px;color:var(--muted)}
.tk{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:9px;box-shadow:0 1px 2px rgba(8,145,178,.05)}
.tk:last-child{margin-bottom:0}
.tk .tkt{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800}
.tk .tkm{font-size:11px;color:var(--muted);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.tk .pr{margin-left:auto;width:9px;height:9px;border-radius:50%;flex:none}
.pr-h{background:var(--bad)}.pr-m{background:var(--warn)}.pr-l{background:var(--ok)}

/* PDA scan */
.pda{max-width:300px;margin:0 auto;background:#0b3d49;border-radius:26px;padding:14px;box-shadow:0 20px 40px rgba(6,40,48,.3)}
.pda .scr{background:#0f2b33;border-radius:16px;padding:14px;color:#d6f6fb;font-family:Inter}
.pda .scr .sh{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#7fd4e3;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:8px;margin-bottom:10px}
.pda .beam{height:110px;border:2px dashed #22d3ee;border-radius:12px;position:relative;overflow:hidden;background:rgba(34,211,238,.06);display:flex;align-items:center;justify-content:center}
.pda .beam .msy{font-size:46px;color:#22d3ee}
.pda .beam::after{content:"";position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#22d3ee,transparent);top:6px;animation:scan 2.4s ease-in-out infinite}
@keyframes scan{0%,100%{top:6px}50%{top:100px}}
.pda .row{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.pda .row b{color:#fff}
.pda .big{font-size:22px;font-weight:900;color:#22d3ee;text-align:center;margin:10px 0 4px}
.scanlog{font-size:12.5px}
.scanlog .r{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}
.scanlog .r:last-child{border:0}
.scanlog .r .msy{font-size:17px;flex:none}
.scanlog .r .tm{margin-left:auto;color:var(--muted);font-size:11px;flex:none}

/* gauge row */
.gz{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.two,.split{grid-template-columns:1fr}.gz{grid-template-columns:repeat(3,1fr)}}
@media(max-width:860px){
  .shell{flex-direction:column}
  .side{width:100%;height:auto;position:sticky;top:0;flex-direction:row;align-items:center;z-index:30}
  .brand{border-bottom:0;border-right:1px solid rgba(255,255,255,.08);padding:12px 14px;flex:none}
  .brand .txt{display:none}
  .nav{flex-direction:row;overflow-x:auto;padding:8px;gap:6px;flex:1}
  .nav button{flex:none;white-space:nowrap;width:auto;padding:8px 12px}
  .nav button small{display:none}
  .sfoot{display:none}
  .facts{grid-template-columns:1fr}
}
@media(max-width:820px){
  .kpis{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:560px){
  .nav button .nt{display:none}
  .kpis{grid-template-columns:1fr 1fr}
  .gz{grid-template-columns:1fr}
  .wrap{padding:14px 12px 34px}
  .top{padding:12px 14px}
}
.ovx{overflow-x:auto}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="msy">warehouse</span></div>
      <div class="txt">
        <b>StockFlow WMS</b>
        <span>倉儲作業中控台</span>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sfoot"><span class="dot"></span> 系統連線正常 · 3 座庫區</div>
  </aside>
  <main class="main">
    <header class="top">
      <div>
        <h1 id="scrT">收貨驗收</h1>
        <div class="sub" id="scrS">到貨排程、卸貨與品項驗收</div>
      </div>
      <div class="spacer"></div>
      <div class="chipbar">
        <span class="chip"><span class="msy">today</span> 2026/08/13 週四</span>
        <span class="chip"><span class="msy">person</span> 倉管 · 陳庭宇</span>
      </div>
    </header>
    <div class="wrap"><div id="view"></div></div>
  </main>
</div>
<script>
var MOD=[
  {icon:"call_received",name:"收貨驗收",desc:"到貨排程、卸貨與品項驗收"},
  {icon:"shelves",name:"智慧上架",desc:"依儲位策略指派上架任務"},
  {icon:"grid_view",name:"儲位地圖",desc:"庫區庫容與儲位使用視覺化"},
  {icon:"inventory",name:"庫存盤點",desc:"即時庫存、循環盤點與調撥"},
  {icon:"conveyor_belt",name:"波次揀貨",desc:"訂單合批、揀貨路徑與覆核"},
  {icon:"local_shipping",name:"出貨裝車",desc:"覆核封箱、裝車與庫存回寫"}
];
var view=document.getElementById('view');
var _chart=null,_gauges=[];
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function disposeChart(){ if(_chart){try{_chart.dispose();}catch(e){} _chart=null;} }
function disposeGauges(){ _gauges.forEach(function(g){try{g.dispose();}catch(e){}}); _gauges=[]; }
function tag(cls,txt){return '<span class="tag '+cls+'">'+esc(txt)+'</span>';}
function kpi(icon,lab,val,sub,dir){
  var d=dir==='up'?'delta up':dir==='down'?'delta down':'delta flat';
  var arrow=dir==='up'?'▲ ':dir==='down'?'▼ ':'';
  return '<div class="k"><div class="lab"><span class="msy">'+icon+'</span>'+esc(lab)+'</div>'+
    '<div class="val">'+esc(val)+'</div>'+
    '<div class="'+d+'">'+arrow+esc(sub)+'</div></div>';
}
function fact(l,v){return '<div class="fact"><div class="l">'+esc(l)+'</div><div class="v">'+esc(v)+'</div></div>';}
function step(cls,t,m){
  var ic=cls==='done'?'check':cls==='now'?'sync':'schedule';
  return '<div class="stp"><div class="dot '+cls+'"><span class="msy">'+ic+'</span></div><div class="sc"><b>'+esc(t)+'</b><div class="m">'+esc(m)+'</div></div></div>';
}
function progrow(name,pct){
  return '<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:5px"><span>'+esc(name)+'</span><span>'+pct+'%</span></div><div class="bar"><i style="width:'+pct+'%"></i></div></div>';
}
function logrow(icon,color,txt,tm){
  return '<div class="r"><span class="msy" style="color:'+color+'">'+icon+'</span><span>'+esc(txt)+'</span><span class="tm">'+esc(tm)+'</span></div>';
}
function n(v){return Number(v||0).toLocaleString();}

/* ---------- SCREEN 0 : 收貨驗收 ---------- */
var ASN=[
  {id:"ASN-24081",sup:"和昌食品",eta:"08:30",items:12,qty:640,dock:"D1",st:"驗收中",cls:"t-info"},
  {id:"ASN-24082",sup:"永盛紙器",eta:"09:10",items:8,qty:1200,dock:"D2",st:"待卸貨",cls:"t-warn"},
  {id:"ASN-24083",sup:"綠源生鮮",eta:"09:40",items:20,qty:880,dock:"D3",st:"驗收中",cls:"t-info"},
  {id:"ASN-24084",sup:"立群電子",eta:"10:20",items:5,qty:300,dock:"—",st:"待到貨",cls:"t-mut"},
  {id:"ASN-24085",sup:"同茂物流",eta:"07:50",items:16,qty:1520,dock:"D1",st:"已完成",cls:"t-ok"},
  {id:"ASN-24086",sup:"欣揚包裝",eta:"11:00",items:9,qty:540,dock:"—",st:"待到貨",cls:"t-mut"}
];
var ASN_LINES=[
  {sku:"SKU-88012",name:"有機燕麥片 500g",po:120,rcv:120,st:"合格",cls:"t-ok"},
  {sku:"SKU-88104",name:"冷壓橄欖油 1L",po:80,rcv:78,st:"短溢 2",cls:"t-warn"},
  {sku:"SKU-88220",name:"手工蘇打餅 300g",po:200,rcv:200,st:"合格",cls:"t-ok"},
  {sku:"SKU-88345",name:"堅果綜合罐 250g",po:60,rcv:60,st:"合格",cls:"t-ok"},
  {sku:"SKU-88401",name:"氣泡礦泉水 6入",po:180,rcv:172,st:"破損 8",cls:"t-bad"}
];
function s0(){
  var rows=ASN.map(function(a,i){
    return '<div class="lrow'+(i===0?' sel':'')+'">'+
      '<div class="t1"><b>'+esc(a.sup)+'</b><span class="id">'+esc(a.id)+'</span>'+tag(a.cls,a.st)+'</div>'+
      '<div class="t2"><span class="msy" style="font-size:14px">schedule</span>ETA '+esc(a.eta)+' · 月台 '+esc(a.dock)+' · '+a.items+' 品項 / '+n(a.qty)+' 件</div>'+
      '</div>';
  }).join('');
  var lines=ASN_LINES.map(function(l){
    var rate=Math.round(l.rcv/l.po*100);
    return '<tr><td><b>'+esc(l.name)+'</b><div class="mini">'+esc(l.sku)+'</div></td>'+
      '<td class="num">'+l.po+'</td><td class="num">'+l.rcv+'</td>'+
      '<td><div class="bar" style="width:90px"><i style="width:'+Math.min(rate,100)+'%"></i></div></td>'+
      '<td>'+tag(l.cls,l.st)+'</td></tr>';
  }).join('');
  view.innerHTML=
    '<div class="g kpis" style="margin-bottom:14px">'+
