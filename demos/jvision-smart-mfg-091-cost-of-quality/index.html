<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>COQ 品質成本管理平台 · Cost of Quality</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--accent:#0891b2;--accent2:#22d3ee;--ink:#0c2a33;--bg:#f0f7f9;--card:#fff;--line:#d6e8ee;--mut:#5b7a83;--ok:#0d9488;--warn:#d97706;--bad:#dc2626;--cP:#0891b2;--cA:#7c3aed;--cIF:#d97706;--cEF:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.top{background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:11px 20px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#fff;flex:none;box-shadow:0 8px 18px rgba(8,145,178,.32)}
.brand b{font-size:15px;font-weight:800;display:block;font-family:"Noto Sans TC"}
.brand span{font-size:10px;color:var(--accent);letter-spacing:2px}
.nav{display:flex;gap:3px;margin-left:auto;overflow-x:auto;min-width:0;flex-wrap:wrap;-webkit-overflow-scrolling:touch}
.nav button{flex:none;white-space:nowrap;border:0;background:transparent;color:var(--mut);font:inherit;font-weight:600;font-size:13px;padding:9px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:"Noto Sans TC";min-width:0}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:#e2f2f6;color:var(--accent)}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 14px rgba(8,145,178,.3)}
.wrap{max-width:1300px;margin:0 auto;padding:20px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.pill{background:#cffafe;color:#0e7490;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:p 1.4s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpis>*{min-width:0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.28}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .9fr}
.g11{grid-template-columns:1fr 1fr}
.split{grid-template-columns:340px 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#ccfbf1;color:#0f766e}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#cffafe;color:#0e7490}.t-mut{background:#e6eff2;color:#5b7a83}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#eef7f9}
table.data td.num,table.data th.num{text-align:right;font-family:Inter;font-variant-numeric:tabular-nums}
.chart{height:250px;width:100%;overflow:hidden}
.scroll{overflow-x:auto}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-bottom:6px}
.leg span{display:flex;align-items:center;gap:5px}
.leg em{width:10px;height:10px;border-radius:3px;font-style:normal;display:inline-block}
.catlist{display:flex;flex-direction:column;gap:8px}
.catnode{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;cursor:pointer;border:1px solid var(--line);background:#fbfeff}
.catnode:hover{background:#eef7f9}
.catnode.sel{border-color:var(--accent);background:#e6f8fb;box-shadow:0 4px 12px rgba(8,145,178,.12)}
.catnode .dot{width:12px;height:12px;border-radius:4px;flex:none}
.catnode .m{flex:1;min-width:0}
.catnode .m b{font-family:"Noto Sans TC";font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catnode .m small{color:var(--mut);font-size:11px}
.catnode .amt{font-family:Inter;font-weight:800;font-size:14px;flex:none}
.detail-hd{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:13px;color:#fff;margin-bottom:14px}
.detail-hd .bg{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.detail-hd .bg .material-symbols-outlined{color:#fff;font-size:26px}
.detail-hd b{font-family:"Noto Sans TC";font-size:16px;display:block}
.detail-hd small{opacity:.9;font-size:11.5px}
.detail-hd .big{margin-left:auto;text-align:right}
.detail-hd .big b{font-family:Inter;font-size:23px}
.detail-hd .big small{opacity:.9}
.bar{height:8px;background:#e6eff2;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.board>*{min-width:0}
.col{background:#eef7f9;border:1px solid var(--line);border-radius:13px;padding:11px}
.col>h4{margin:0 0 10px;font-size:12.5px;font-family:"Noto Sans TC";display:flex;justify-content:space-between;align-items:center}
.col>h4 .n{background:#fff;border:1px solid var(--line);border-radius:20px;font-size:10.5px;padding:1px 8px;color:var(--mut);font-weight:700}
.tk{background:#fff;border:1px solid var(--line);border-left-width:4px;border-radius:9px;padding:9px 10px;margin-bottom:8px}
.tk b{font-family:Inter;font-size:12px}
.tk .d{font-size:11px;color:var(--mut);font-family:"Noto Sans TC";margin-top:2px}
.tk .f{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:10.5px}
.roigrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.roigrid>*{min-width:0}
.roi{border:1px solid var(--line);border-radius:14px;padding:14px;position:relative}
.roi.best{border-color:var(--accent);box-shadow:0 8px 20px rgba(8,145,178,.14)}
.roi .badge{position:absolute;top:-9px;right:12px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px}
.roi b{font-family:"Noto Sans TC";font-size:13.5px}
.roi .pr{font-family:Inter;font-weight:800;font-size:24px;margin:8px 0 2px;color:var(--accent)}
.roi .row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);padding:5px 0;border-top:1px dashed var(--line)}
.ver{display:flex;flex-direction:column;gap:10px;position:relative;padding-left:6px}
.vi{display:flex;gap:12px;align-items:flex-start;padding-bottom:14px;position:relative;padding-left:22px}
.vi::before{content:"";position:absolute;left:0;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.vi.old::before{background:var(--mut)}
.vi b{font-family:Inter;font-weight:800;font-size:13.5px}
.vi small{color:var(--mut);font-size:11.5px;display:block}
.mini{font-size:11px;color:var(--mut);margin-top:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.two>*{min-width:0}
.sign{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;margin-bottom:9px}
.sign .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;font-family:"Noto Sans TC"}
.sign .m{flex:1;min-width:0}
.sign .m b{font-family:"Noto Sans TC";font-size:13px}
.sign .m small{color:var(--mut);font-size:11px;display:block}
@media(max-width:860px){.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.wrap{padding:14px}.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g11,.split,.two,.roigrid{grid-template-columns:1fr}.board{grid-template-columns:1fr}}
@media(max-width:560px){.nav button span.txt{display:none}.nav button{padding:9px}}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><div class="logo">Q</div><div><b>COQ 品質成本管理平台</b><span>COST OF QUALITY</span></div></div>
  <div class="nav" id="nav"></div>
</div>
<div class="wrap">
  <div class="vh"><div><h2 id="vt"></h2><p id="vd"></p></div><div class="pill"><i></i><span>2026 Q3 · ERP／QMS 已同步</span></div></div>
  <div id="view"></div>
</div>
<script>
var MOD=[
["總覽","monitoring","COQ 戰情總覽","品質成本占營收比與 P-A-F 四類即時儀表"],
["科目分類","account_tree","成本科目分類","預防／鑑定／內外部失敗四類科目建置與歸屬"],
["跨部門歸集","receipt_long","跨部門成本歸集","彙整 ERP、QMS、NCR 單據並歸屬品質成本科目"],
["趨勢分析","trending_up","成本趨勢分析","月度 COQ 走勢、失敗成本比與 Pareto 拆解"],

["管理審查","fact_check","管理審查報表","COQ 月報產出、簽核與管理審查紀錄"]];
var nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach(function(m,i){var b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span><span class="txt">'+m[0]+'</span>';b.onclick=function(){location.hash='go='+i;};nav.appendChild(b);});

var NK=function(v){return (v/10000).toFixed(1);}; // 萬->M
var COL={P:'#0891b2',A:'#7c3aed',IF:'#d97706',EF:'#dc2626'};

var CATS=[
{k:"P",name:"預防成本",en:"Prevention",icon:"shield",color:"#0891b2",amt:512,pct:18.2,yoy:-6.1,good:true,

{k:"IF",name:"內部失敗成本",en:"Internal Failure",icon:"build",color:"#d97706",amt:836,pct:29.7,yoy:-14.8,good:true,

{k:"EF",name:"外部失敗成本",en:"External Failure",icon:"warning",color:"#dc2626",amt:782,pct:27.8,yoy:-9.3,good:true,

var TOTAL=CATS.reduce(function(a,c){return a+c.amt;},0); // 2814 萬 -> 28.1M

var SCREENS=[
// 0 總覽
function(){return '<div class="kpis">'
+'<div class="kpi"><span class="material-symbols-outlined ic">savings</span><div class="l">品質成本總額 (年)</div><div class="v">'+(TOTAL/100).toFixed(1)+'<small style="font-size:12px">M</small></div><div class="d up">▼ 較去年 9.2%</div></div>'

+'<div class="kpi"><span class="material-symbols-outlined ic">balance</span><div class="l">失敗成本比 IF+EF</div><div class="v">57.5<small style="font-size:12px">%</small></div><div class="d up">▼ -6.4 pt</div></div>'
+'<div class="kpi"><span class="material-symbols-outlined ic">warning</span><div class="l">本月待歸屬單據</div><div class="v" style="color:var(--bad)">23</div><div class="d" style="color:var(--mut)">跨 3 系統</div></div>'

+'<div class="card"><h3><span class="material-symbols-outlined">insights</span>降本槓桿觀測</h3>'

+'<div style="padding:10px 12px;background:#eef7f9;border-radius:10px;font-size:12px;color:var(--mut)"><span class="material-symbols-outlined" style="color:var(--accent);font-size:16px">bolt</span> 預防成本每投入 1 元，帶動失敗成本下降 <b style="color:var(--ink)">3.4 元</b>。</div></div>'
+'</div>'
+'<div class="card" style="margin-top:16px"><h3><span class="material-symbols-outlined">stacked_line_chart</span>近 12 個月 COQ 走勢（占營收比）</h3><div class="chart" id="c0b" style="height:230px"></div></div>';},

// 1 科目分類 — SIGNATURE split
function(){return '<div class="grid split">'
+'<div class="card"><h3><span class="material-symbols-outlined">account_tree</span>品質成本科目 <span class="tag t-mut" style="margin-left:auto">P-A-F 模型</span></h3>'
+'<div class="catlist" id="catlist"></div>'
+'<div style="margin-top:12px;padding:10px 12px;background:#eef7f9;border-radius:10px;font-size:11.5px;color:var(--mut)"><span class="material-symbols-outlined" style="color:var(--accent);font-size:15px">rule</span> 依 RULE-02，規格超差且影響功能之費用一律歸內部失敗成本。</div></div>'
+'<div class="card" id="catDetail"></div>'
+'</div>';},

function(){
 var cols=[
  ["ERP 財務","261","--accent",[["採購退料折讓","EF","退貨處理","¥21.4萬","t-bad"],["報廢損失沖銷","IF","報廢","¥14.8萬","t-warn"],["校正外包費","A","設備校正","¥3.2萬","t-info"]]],

 var board=cols.map(function(col){return '<div class="col"><h4><span>'+col[0]+'</span><span class="n">'+col[1]+'</span></h4>'+col[3].map(function(t){return '<div class="tk" style="border-left-color:var('+col[2]+')"><b>'+t[0]+'</b><div class="d">'+(t[1]?t[1]+' · ':'')+t[2]+'</div><div class="f"><span class="tag '+t[4]+'">'+(t[1]||'待辦')+'</span><b style="font-family:Inter">'+t[3]+'</b></div></div>';}).join('')+'</div>';}).join('');
 var rows=[
  ["PO-R-8841","ERP","供應商連續兩批尺寸超差退貨","EF · 退貨處理",21.4,"t-ok","已歸屬"],

  ["QMS-SUP-044","QMS","供應商到廠品質輔導","P · 供應商輔導",2.8,"t-ok","已歸屬"]];
 return '<div class="kpis">'
+'<div class="kpi"><span class="material-symbols-outlined ic">sync</span><div class="l">本月匯入單據</div><div class="v">418</div><div class="d" style="color:var(--mut)">ERP 261 · QMS 104 · NCR 53</div></div>'
