<style>
:root{
--color-primary:#2563EB;--color-on-primary:#FFF;--color-secondary:#3B82F6;--color-on-secondary:#000;
--color-accent:#EA580C;--color-on-accent:#000;--color-background:#F8FAFC;--color-foreground:#1E293B;
--color-card:#FFF;--color-card-foreground:#1E293B;--color-muted:#E9EFF8;--color-muted-foreground:#475569;
--color-border:#E2E8F0;--color-destructive:#DC2626;--color-on-destructive:#FFF;--color-ring:#2563EB;
--blue:#2563EB;--ink:#1E293B;--muted:#475569;--line:#E2E8F0;
--accent:#EA580C;--accent2:#FB923C;--bg:#F8FAFC;--card:#FFF;--mut:#475569;
--ok:#047857;--warn:#B45309;--bad:#DC2626;--cP:#2563EB;--cA:#7C3AED;--cIF:#B45309;--cEF:#DC2626
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fira Sans",sans-serif;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px}
button,[onclick]{cursor:pointer}
button:focus-visible,[onclick]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.icon{width:20px;height:20px;display:inline-block;flex:none;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:square;stroke-linejoin:miter}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:stretch;gap:18px;min-height:72px;padding:0 24px;background:#fff;border-bottom:3px solid var(--ink);box-shadow:8px 8px 0 rgba(37,99,235,.12)}
.brand{display:flex;align-items:center;gap:12px;min-width:260px}
.logo{display:grid;place-items:center;width:44px;height:44px;background:var(--blue);border:3px solid var(--ink);color:#fff;font:700 22px "Fira Code";box-shadow:4px 4px 0 var(--accent)}
.brand b{display:block;font-size:16px;font-weight:700}
.brand span{display:block;margin-top:2px;color:var(--blue);font:600 10px "Fira Code";letter-spacing:1.7px}
.nav{display:flex;align-items:stretch;margin-left:auto;overflow-x:auto}
.nav button{display:flex;align-items:center;gap:7px;min-height:44px;padding:0 14px;border:0;border-left:1px solid var(--line);background:#fff;color:var(--mut);font:600 13px "Fira Sans";white-space:nowrap}
.nav button:hover{background:var(--color-muted);color:var(--ink)}
.nav button.on{background:var(--blue);color:#fff;box-shadow:inset 0 -5px 0 var(--accent)}
.wrap{max-width:1440px;margin:auto;padding:30px 28px 48px}
.vh{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:20px;margin-bottom:22px;padding:22px 24px;background:#fff;border:3px solid var(--ink);box-shadow:8px 8px 0 var(--blue)}
.vh h2{margin:0;font-size:clamp(25px,3vw,42px);font-weight:700;line-height:1.05;letter-spacing:-1px}
.vh p{max-width:760px;margin:9px 0 0;color:var(--mut);font-size:14px}
.pill{display:flex;align-items:center;gap:9px;padding:9px 12px;background:#DBEAFE;border:2px solid var(--blue);color:#1E40AF;font:600 12px "Fira Code";white-space:nowrap}
.pill i{width:10px;height:10px;background:var(--ok);border:2px solid var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi,.card,.roi,.sign,.catnode,.col,.tk{background:#fff;border:2px solid var(--ink);border-radius:0}
.kpi{position:relative;min-width:0;padding:17px;box-shadow:5px 5px 0 var(--line)}
.kpi:nth-child(2n){transform:translateY(6px)}
.kpi .l{color:var(--mut);font-size:12px;font-weight:600;text-transform:uppercase}
.kpi .v{margin-top:6px;font:700 28px "Fira Code";font-variant-numeric:tabular-nums}
.kpi .d{margin-top:4px;font-size:11px;font-weight:700}
.kpi .ic{position:absolute;right:13px;top:13px;color:var(--blue)}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:18px}.grid>*{min-width:0}
.g2{grid-template-columns:1.38fr .9fr}.g11,.two{grid-template-columns:1fr 1fr}.split{grid-template-columns:340px 1fr}
.card{padding:18px;box-shadow:6px 6px 0 var(--line)}
.card h3{display:flex;align-items:center;gap:8px;margin:0 0 16px;padding-bottom:10px;border-bottom:2px solid var(--ink);font-size:15px;font-weight:700}
.card h3 .icon{color:var(--blue)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border:1px solid currentColor;font:700 10px "Fira Code";white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;background:currentColor}
.t-ok{background:#D1FAE5;color:#065F46}.t-warn{background:#FEF3C7;color:#92400E}.t-bad{background:#FEE2E2;color:#991B1B}
.t-info{background:#DBEAFE;color:#1E40AF}.t-mut{background:#E9EFF8;color:#475569}
.scroll{overflow-x:auto;border:1px solid var(--ink)}
table.data{width:100%;border-collapse:collapse;background:#fff;font-size:12.5px}
table.data th,table.data td{padding:10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left}
table.data th{background:var(--ink);color:#fff;font-size:11px;font-weight:700;letter-spacing:.3px}
table.data tr:last-child td{border-bottom:0}
table.data tbody tr:hover,table.data tr:hover td{background:#EFF6FF}
table.data td.num,table.data th.num{text-align:right;font-family:"Fira Code";font-variant-numeric:tabular-nums}
table.data td:first-child{font-family:"Fira Code"}
.chart{width:100%;height:250px;overflow:hidden}
.bar{height:10px;overflow:hidden;background:#E2E8F0;border:1px solid var(--ink)}
.bar i{display:block;height:100%}
.callout{padding:11px 13px;background:#FFF7ED;border:2px solid var(--accent);color:var(--mut);font-size:12px}
.catlist{display:flex;flex-direction:column;gap:10px}
.catnode{display:flex;align-items:center;gap:10px;padding:12px}
.catnode:hover{background:#EFF6FF}.catnode.sel{background:#DBEAFE;border-color:var(--blue);box-shadow:4px 4px 0 var(--blue)}
.dot{width:13px;height:13px;border:2px solid var(--ink);flex:none}
.catnode .m{flex:1;min-width:0}.catnode .m b{display:block;font-size:14px}.catnode small{color:var(--mut);font-size:11px}
.amt{font:700 14px "Fira Code"}
.detail-hd{display:flex;align-items:center;gap:12px;margin-bottom:15px;padding:15px;border:3px solid var(--ink);color:#fff;box-shadow:5px 5px 0 var(--ink)}
.detail-hd .bg{display:grid;place-items:center;width:45px;height:45px;border:2px solid #fff}
.detail-hd b{display:block;font-size:16px}.detail-hd small{font-size:11px}
.detail-hd .big{margin-left:auto;text-align:right}.detail-hd .big b{font:700 23px "Fira Code"}
.leg{display:flex;gap:14px;margin:8px 0;font-size:11px;color:var(--mut)}.leg span{display:flex;align-items:center;gap:5px}.leg em{width:10px;height:10px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.col{min-width:0;padding:11px;background:var(--color-muted)}
.col>h4{display:flex;justify-content:space-between;margin:0 0 10px;font-size:12px}.col>h4 .n{padding:2px 7px;background:#fff;border:1px solid var(--ink);font:700 10px "Fira Code"}
.tk{margin-bottom:8px;padding:9px;border-left-width:6px}.tk b{font:600 12px "Fira Code"}.tk .d{margin-top:3px;color:var(--mut);font-size:11px}
.tk .f{display:flex;justify-content:space-between;align-items:center;margin-top:7px;font-size:10px}
.roigrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.roi{position:relative;padding:16px}
.roi.best{background:#FFF7ED;border-color:var(--accent);box-shadow:5px 5px 0 var(--accent)}
.roi .badge{position:absolute;right:-2px;top:-13px;padding:4px 8px;background:var(--accent);border:2px solid var(--ink);color:#fff;font:700 10px "Fira Code"}
.roi .pr{margin:8px 0;color:var(--blue);font:700 26px "Fira Code"}.roi .row{display:flex;justify-content:space-between;padding:6px 0;border-top:1px dashed var(--mut);font-size:11px}
.sign{display:flex;align-items:center;gap:10px;margin-bottom:9px;padding:11px}.sign .av{display:grid;place-items:center;width:34px;height:34px;background:var(--blue);border:2px solid var(--ink);color:#fff;font-weight:700}
.sign .m{flex:1}.sign .m b{font-size:13px}.sign small{display:block;color:var(--mut);font-size:11px}
.ver{display:flex;flex-direction:column}.vi{position:relative;padding:0 0 18px 24px;border-left:2px solid var(--ink)}
.vi::before{content:"";position:absolute;left:-7px;top:2px;width:12px;height:12px;background:var(--blue);border:2px solid #fff;outline:1px solid var(--ink)}
.vi.old::before{background:var(--mut)}.vi b{font:700 13px "Fira Code"}.vi small,.mini{display:block;color:var(--mut);font-size:11px}
.grid-item{animation:enter .4s both cubic-bezier(.2,.9,.3,1.25)}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.grid-item{opacity:1;transform:none}}
@media(max-width:1024px){.top{padding:0 14px}.brand{min-width:220px}.nav button{padding:0 10px}.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.top{display:block;padding:10px 14px 0}.brand{padding-bottom:10px}.nav{margin:0 -14px}.nav button{min-height:48px}.wrap{padding:20px 14px 40px}.vh{grid-template-columns:1fr;padding:18px}.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g11,.split,.two,.roigrid{grid-template-columns:1fr}.board{grid-template-columns:1fr}.kpi:nth-child(2n){transform:none}}
@media(max-width:480px){.brand b{font-size:14px}.nav .txt{display:none}.nav button{flex:1;justify-content:center}.kpis{grid-template-columns:1fr}.vh h2{font-size:27px}.pill{white-space:normal}.card{padding:13px}.detail-hd{align-items:flex-start;flex-wrap:wrap}.detail-hd .big{width:100%;margin:0;text-align:left}}
</style>
</head>
