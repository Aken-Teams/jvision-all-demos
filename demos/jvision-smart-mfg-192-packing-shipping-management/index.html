<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>包裝出貨管理系統 Packing &amp; Shipping Management</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap');

:root{
  --color-primary:#334155;
  --color-on-primary:#ffffff;
  --color-secondary:#475569;
  --color-on-secondary:#ffffff;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#f8fafc;
  --color-foreground:#0f172a;
  --color-card:#ffffff;
  --color-card-foreground:#0f172a;
  --color-muted:#f2f3f4;
  --color-muted-foreground:#475569;
  --color-border:#e6e8ea;
  --color-destructive:#dc2626;
  --color-on-destructive:#ffffff;
  --color-ring:#334155;

  --blue:#334155;
  --ink:#0f172a;
  --muted:#475569;
  --line:#e6e8ea;

  --acc:#059669;
  --acc2:#34d399;
  --acc-d:#047857;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --sub:var(--color-muted-foreground);
  --ok:#047857;
  --warn:#a16207;
  --bad:var(--color-destructive);
  --soft:#ecfdf5;
  --radius-sm:6px;
  --radius-md:9px;
  --radius-lg:12px;
  --ease:150ms ease;
}

*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html{max-width:100%;overflow-x:hidden;background:var(--bg);scroll-behavior:smooth}
body{max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:"Open Sans",sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit}
button,[role="button"],[onclick]{cursor:pointer}
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
::selection{background:#a7f3d0;color:var(--ink)}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:20px;line-height:1;vertical-align:middle}
.app{display:flex;flex-direction:column;min-height:100vh}

.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:13px;min-height:66px;padding:11px clamp(14px,2vw,28px);background:var(--color-primary);color:var(--color-on-primary);border-bottom:1px solid #475569}
.logo{display:grid;place-items:center;width:40px;height:40px;flex:0 0 40px;border:1px solid #64748b;border-radius:var(--radius-md);background:#475569;color:#a7f3d0;transition:background-color var(--ease),color var(--ease),border-color var(--ease)}
.logo .material-symbols-outlined{font-size:24px}
.topbar:hover .logo{background:#0f766e;border-color:#34d399;color:#fff}
.brand b{display:block;font-family:"Poppins",sans-serif;font-size:16px;font-weight:600;letter-spacing:.01em}
.brand span{display:block;margin-top:1px;color:#e2e8f0;font-size:11px;letter-spacing:.035em}
.topbar .pill{display:flex;align-items:center;gap:7px;margin-left:auto;padding:6px 10px;border:1px solid #64748b;border-radius:999px;background:#475569;color:#fff;font-size:11.5px;font-weight:600;white-space:nowrap}
.topbar .pill .material-symbols-outlined{font-size:16px;color:#6ee7b7}

.nav{position:sticky;top:66px;z-index:20;display:flex;gap:5px;padding:8px clamp(12px,2vw,28px);overflow-x:auto;background:rgba(248,250,252,.98);border-bottom:1px solid var(--line);scrollbar-width:thin}
.nav button{display:flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:8px 12px;border:1px solid transparent;border-radius:var(--radius-sm);background:transparent;color:var(--sub);font-family:"Open Sans",sans-serif;font-size:12.5px;font-weight:600;white-space:nowrap;transition:color var(--ease),background-color var(--ease),border-color var(--ease)}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{border-color:#cbd5e1;background:var(--color-muted);color:var(--ink)}
.nav button.on{border-color:var(--color-primary);background:var(--color-primary);color:var(--color-on-primary)}
.nav button.on .material-symbols-outlined{color:#6ee7b7}

.wrap{width:100%;max-width:1440px;margin:0 auto;padding:20px clamp(14px,2.2vw,30px) 34px}
#screen{animation:screen-in .35s ease-out both}
.scr-head{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;margin-bottom:15px;padding-bottom:13px;border-bottom:1px solid var(--line)}
.scr-head h2{display:flex;align-items:center;gap:9px;color:var(--ink);font-family:"Poppins",sans-serif;font-size:clamp(18px,2vw,21px);font-weight:600;line-height:1.3}
.scr-head h2 .material-symbols-outlined{display:grid;place-items:center;width:34px;height:34px;border-radius:var(--radius-sm);background:#d1fae5;color:var(--acc-d);font-size:20px}
.scr-head p{max-width:860px;margin-left:43px;color:var(--sub);font-size:12.5px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.kpi{position:relative;overflow:hidden;padding:13px 14px 12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-md);transition:border-color var(--ease),background-color var(--ease)}
.kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--acc)}
.kpi:hover{border-color:#94a3b8;background:#fcfdfd}
.kpi .k-lab{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:11.5px;font-weight:600}
.kpi .k-lab .material-symbols-outlined{color:var(--acc-d);font-size:17px}
.kpi .k-val{margin-top:5px;color:var(--ink);font-family:"Poppins",sans-serif;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .k-val small{color:var(--sub);font-family:"Open Sans",sans-serif;font-size:12px;font-weight:600;letter-spacing:0}
.kpi .k-dt{display:flex;align-items:center;gap:4px;margin-top:2px;font-size:11px;font-weight:700}
.kpi .k-dt::before{font-family:"Material Symbols Outlined";font-size:14px;font-weight:normal}
.up{color:var(--ok)}
.up::before{content:"trending_up"}
.dn{color:var(--bad)}
.dn::before{content:"priority_high"}
.fl{color:var(--warn)}
.fl::before{content:"schedule"}

.split{display:grid;grid-template-columns:330px minmax(0,1fr);gap:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.panel,.card{background:var(--panel);color:var(--color-card-foreground);border:1px solid var(--line);border-radius:var(--radius-md)}
.panel{overflow:hidden}
.card{padding:14px;transition:border-color var(--ease),background-color var(--ease)}
.card:hover{border-color:#cbd5e1}
.panel-h{display:flex;align-items:center;gap:7px;min-height:45px;padding:10px 14px;border-bottom:1px solid var(--line);background:#fafbfc;font-family:"Poppins",sans-serif;font-size:12.5px;font-weight:600}
.panel-h .material-symbols-outlined,.card .c-t .material-symbols-outlined{color:var(--acc-d);font-size:19px}
.panel-h .cnt{margin-left:auto;padding:2px 8px;border:1px solid #d1fae5;border-radius:999px;background:var(--soft);color:#065f46;font-family:"Open Sans",sans-serif;font-size:10.5px;font-weight:700}
.panel-b{padding:13px}
.card .c-t{display:flex;align-items:center;gap:7px;margin-bottom:10px;color:var(--ink);font-family:"Poppins",sans-serif;font-size:12.5px;font-weight:600}

.list{display:flex;flex-direction:column}
.li{position:relative;padding:11px 13px;border-bottom:1px solid var(--line);border-left:3px solid transparent;background:#fff;transition:background-color var(--ease),border-color var(--ease),color var(--ease)}
.li:last-child{border-bottom:0}
.li:hover{background:var(--color-muted)}
.li.sel{border-left-color:var(--acc);background:var(--soft)}
.li.sel::after{content:"check";position:absolute;right:12px;bottom:9px;color:var(--acc-d);font-family:"Material Symbols Outlined";font-size:15px}
.li .li-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-right:0}
.li .li-id,.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-variant-numeric:tabular-nums}
.li .li-id{color:var(--ink);font-size:12.5px;font-weight:700}
.li .li-sub{margin-top:3px;padding-right:20px;color:var(--sub);font-size:11.5px}
.li .li-tag,.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border:1px solid currentColor;border-radius:999px;font-size:10.5px;font-weight:700;line-height:1.45;white-space:nowrap}
.t-hi{background:#fef2f2;color:#b91c1c}
.t-md{background:#fffbeb;color:#92400e}
.t-lo{background:#ecfdf5;color:#047857}
.t-nu{background:#f1f5f9;color:#334155}

.det-hero{margin-bottom:13px;padding:16px;border:1px solid #475569;border-radius:var(--radius-md);background:var(--color-primary);color:#fff}
.det-hero h3{font-family:"Poppins",sans-serif;font-size:17px;font-weight:600}
.det-hero .dh-sub{margin-top:4px;color:#e2e8f0;font-size:11.5px}
.det-hero .dh-row{display:grid;grid-template-columns:repeat(5,minmax(92px,1fr));gap:1px;margin-top:13px;border:1px solid #64748b;border-radius:var(--radius-sm);overflow:hidden;background:#64748b}
.det-hero .dh-row div{padding:9px 10px;background:#3b4a5d}
.det-hero .dh-row div span{display:block;color:#cbd5e1;font-size:10px}
.det-hero .dh-row div b{display:block;margin-top:2px;color:#fff;font-family:"Poppins",sans-serif;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}

.chart{width:100%;height:250px;overflow:hidden}
.chart.sm{height:200px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;color:var(--ink);font-size:11.5px}
.tbl th{padding:8px 10px;border-bottom:1px solid #cbd5e1;background:var(--color-muted);color:#334155;font-size:10.5px;font-weight:700;letter-spacing:.025em;text-align:left;white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl td.mono{text-align:right;font-weight:600}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background-color var(--ease)}
.tbl tbody tr:hover{background:#f8fafc}
.bar{height:6px;min-width:60px;overflow:hidden;border-radius:999px;background:#e2e8f0}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--acc)}
.chip .material-symbols-outlined{font-size:13px}
.c-ok{background:#ecfdf5;color:#047857}
.c-wa{background:#fffbeb;color:#92400e}
.c-ba{background:#fef2f2;color:#b91c1c}
.c-in{background:#f1f5f9;color:#334155}

.board{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:9px}
.col{min-height:130px;padding:9px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--color-muted)}
.col-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 2px;color:#334155;font-size:11.5px;font-weight:700}
.col-h .n{min-width:25px;padding:1px 7px;border:1px solid #cbd5e1;border-radius:999px;background:#fff;color:var(--sub);font-family:ui-monospace,monospace;font-size:10px;text-align:center}
.tk{margin-bottom:8px;padding:9px;border:1px solid var(--line);border-top:3px solid var(--acc);border-radius:var(--radius-sm);background:#fff;transition:border-color var(--ease),background-color var(--ease)}
.tk:last-child{margin-bottom:0}
.tk:hover{border-color:#94a3b8;background:#f8fafc}
.tk .tk-id{color:var(--sub);font-family:ui-monospace,monospace;font-size:10.5px;font-weight:700}
.tk .tk-t{margin:3px 0 5px;font-size:11.5px;font-weight:700}
.tk .tk-m{display:flex;align-items:center;gap:5px;color:var(--sub);font-size:10.5px}
.tk .tk-m .material-symbols-outlined{color:var(--acc-d);font-size:14px}

.tl{position:relative;padding-left:25px}
.tl::before{content:"";position:absolute;top:5px;bottom:5px;left:8px;width:1px;background:#cbd5e1}
.tl-i{position:relative;padding-bottom:14px}
.tl-i:last-child{padding-bottom:0}
.tl-i::before{content:"";position:absolute;top:3px;left:-22px;width:11px;height:11px;border:3px solid #64748b;border-radius:50%;background:#fff}
.tl-i.done::before{border-color:var(--acc);background:var(--acc)}
.tl-i.done::after{content:"check";position:absolute;top:2px;left:-21px;color:#fff;font-family:"Material Symbols Outlined";font-size:10px}
.tl-i .tl-time{color:var(--sub);font-family:ui-monospace,monospace;font-size:10px;font-weight:700}
.tl-i .tl-t{margin:2px 0;color:var(--ink);font-size:12px;font-weight:700}
.tl-i .tl-d{color:var(--sub);font-size:11px}

.rule{display:flex;gap:11px;margin-bottom:10px;padding:12px;border:1px solid var(--line);border-radius:var(--radius-md);background:#fff}
.rule .r-ic{display:grid;place-items:center;width:36px;height:36px;flex:0 0 36px;border:1px solid #a7f3d0;border-radius:var(--radius-sm);background:var(--soft);color:var(--acc-d)}
.rule .r-t{font-size:12.5px;font-weight:700}
.rule .r-d{margin-top:3px;color:var(--sub);font-size:11.5px}
.rule .r-d b{color:#334155}
.rule .r-ev{display:inline-block;margin-top:6px;padding:2px 7px;border-left:3px solid var(--acc);background:var(--soft);color:#065f46;font-size:10.5px;font-weight:600}

.boxview{padding:15px;border:1px solid #475569;border-radius:var(--radius-md);background:var(--color-primary);color:#fff}
.boxview .bv-title{display:flex;align-items:center;gap:7px;margin-bottom:10px;color:#e2e8f0;font-size:12px;font-weight:700}
.boxstage{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:7px;min-height:145px;padding:14px;border:1px solid #64748b;border-radius:var(--radius-sm);background:#293548}
.crate{padding:9px 8px;border:1px dashed #94a3b8;border-radius:var(--radius-sm);background:#334155;text-align:center}
.crate .cr-dim{color:#cbd5e1;font-family:ui-monospace,monospace;font-size:10px}
.crate .cr-fill{color:#6ee7b7;font-family:"Poppins",sans-serif;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.crate .cr-lab{margin-top:1px;color:#e2e8f0;font-size:9.5px}
.bv-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.bv-meta div span{display:block;color:#cbd5e1;font-size:9.5px}
.bv-meta div b{display:block;margin-top:1px;font-family:"Poppins",sans-serif;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}

.label{max-width:360px;margin:0 auto;padding:13px;border:2px solid var(--ink);border-radius:var(--radius-sm);background:#fff;color:var(--ink);font-family:ui-monospace,"SFMono-Regular",Consolas,monospace}
.label .lb-top{display:flex;justify-content:space-between;margin-bottom:8px;padding-bottom:7px;border-bottom:2px solid var(--ink)}
.label .lb-top b{font-size:14px}
.label .lb-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;font-size:10.5px}
.label .lb-grid span{display:block;color:#475569;font-size:9px}
.label .barcode{height:43px;margin:9px 0 4px;border-radius:2px;background:repeating-linear-gradient(90deg,#0f172a,#0f172a 2px,#fff 2px,#fff 4px,#0f172a 4px,#0f172a 7px,#fff 7px,#fff 9px)}
.label .bc-num{text-align:center;font-size:11px;font-weight:700;letter-spacing:2px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;color:var(--sub);font-size:11px}
.legend span{display:flex;align-items:center;gap:5px}
.dot{display:inline-block;width:10px;height:10px;border:1px solid currentColor;border-radius:2px}
.hint{display:flex;align-items:flex-start;gap:6px;margin-top:8px;padding:7px 9px;border-left:3px solid var(--acc);background:var(--soft);color:#334155;font-size:10.5px}
.hint .material-symbols-outlined{color:var(--acc-d);font-size:14px}

@keyframes screen-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:1024px){
  .split{grid-template-columns:290px minmax(0,1fr)}
  .det-hero .dh-row{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:860px){
  .nav{position:static}
  .split{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr 1fr}
}
@media(max-width:768px){
  .kpis{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .board{min-width:780px}
  .topbar{min-height:62px}
  .brand b{font-size:14px}
  .brand span{font-size:10px}
  .scr-head p{margin-left:0}
}
@media(max-width:560px){
  .wrap{padding:14px 12px 28px}
  .topbar{padding:10px 12px}
  .topbar .pill{display:none}
  .nav{padding:7px 10px}
  .nav button{min-width:42px;padding:8px 10px}
  .nav button .txt{display:none}
  .kpis{gap:8px}
  .kpi{padding:11px 11px 10px}
  .kpi .k-val{font-size:20px}
  .det-hero{padding:13px}
  .det-hero .dh-row{grid-template-columns:1fr 1fr}
  .grid3{grid-template-columns:1fr}
  .bv-meta{grid-template-columns:1fr 1fr}
  .card,.panel-b{padding:11px}
}
@media(max-width:390px){
  .kpis{grid-template-columns:1fr}
  .scr-head h2{font-size:17px}
  .logo{width:36px;height:36px;flex-basis:36px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  #screen{animation:none;transform:none}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="logo"><span class="material-symbols-outlined">package_2</span></div>
    <div class="brand">
      <b>包裝出貨管理系統</b>
      <span>Packing &amp; Shipping Management · WMS</span>
    </div>
    <div class="pill"><span class="material-symbols-outlined">local_shipping</span>DC-華東配送中心 / 早班</div>

  <div class="wrap"><div id="screen"></div></div>
</div>
<script>

function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
function mkChart(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts.push(c);}
function esc(s){return String(s).replace(/[&<>]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[m];});}

var NAV=[

  {i:3,ic:"description",t:"標籤嘜頭"},
  {i:4,ic:"fact_check",t:"裝箱覆核"},
  {i:5,ic:"trending_up",t:"成本合格率"}
];

var ORDERS=[
  {id:"SO-24518",cust:"日商 精密電子 (東京)",items:14,qty:320,due:"08/14 15:00",pri:"急件",tag:"t-hi",dest:"日本 · 成田",mode:"空運",rule:"靜電+防潮",boxes:6,wt:"84.5 kg",addr:"Tokyo, Ota-ku 3-2-1"},
  {id:"SO-24519",cust:"O暘光電 台中廠",items:8,qty:180,due:"08/14 17:30",pri:"標準",tag:"t-nu",dest:"台中 · 大雅",mode:"陸運",rule:"防潮",boxes:4,wt:"52.0 kg",addr:"台中市大雅區科雅路 66 號"},

  var cols=[["todo","待裝箱","#94a3b8"],["packing","裝箱中","#0891b2"],["check","覆核中","#22d3ee"],["done","已封箱","#16a34a"]];
  var board='';
  for(var c=0;c<cols.length;c++){var key=cols[c][0];var arr=PACKQ[key]||[];
    var tks='';
    for(var t=0;t<arr.length;t++){var x=arr[t];
      tks+='<div class="tk" style="border-top-color:'+cols[c][2]+'"><div class="tk-id">'+esc(x.id)+'</div><div class="tk-t">'+esc(x.t)+'</div><div class="tk-m"><span class="material-symbols-outlined">inventory_2</span>'+esc(x.m)+'</div></div>';
    }
    board+='<div class="col"><div class="col-h">'+cols[c][1]+'<span class="n">'+arr.length+'</span></div>'+tks+'</div>';
  }
  var rows='';
  for(var i=0;i<VERIFY.length;i++){var v=VERIFY[i];
    rows+='<tr><td class="mono">'+esc(v.box)+'</td><td class="mono">'+v.scan+'</td><td class="mono">'+v.exp+'</td><td><span class="chip '+v.c+'">'+esc(v.st)+'</span></td><td>'+esc(v.who)+'</td></tr>';
  }
  return head("fact_check","裝箱清單與覆核","作業員依規則裝箱，掃碼綁定品項與箱號，覆核數量無誤後封箱。")+k+
    '<div class="card" style="margin-bottom:14px"><div class="c-t"><span class="material-symbols-outlined">view_kanban</span>裝箱作業看板</div>'+
      '<div style="overflow-x:auto"><div class="board">'+board+'</div></div></div>'+
    '<div class="card"><div class="c-t"><span class="material-symbols-outlined">barcode_scanner</span>掃碼覆核紀錄</div>'+
      '<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>箱號</th><th>掃碼數</th><th>應裝數</th><th>結果</th><th>覆核員</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
      '<div class="hint"><span class="material-symbols-outlined">rule</span>掃碼數與應裝數不符時系統阻擋封箱並提示異常。</div></div>';
}

/* ============ shell ============ */
function buildNav(){var h='';for(var i=0;i<NAV.length;i++){var n=NAV[i];h+='<button data-i="'+n.i+'" onclick="show('+n.i+')"><span class="material-symbols-outlined">'+n.ic+'</span><span class="txt">'+n.t+'</span></button>';}document.getElementById("nav").innerHTML=h;}

function show(i){
  disposeCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].className=(+btns[b].getAttribute("data-i")===i)?"on":"";}
  var c=document.getElementById("screen");
  c.innerHTML=SCREENS[i]();
  void c.offsetHeight;
  if(i===0)pickOrder(selOrder);
  if(i===1)chart1();
  if(i===2)pickRule(selRule);
  if(i===3)chart3();
  if(i===5)chart5();
}
buildNav();
window.addEventListener("resize",function(){for(var i=0;i<charts.length;i++){try{charts[i].resize();}catch(e){}}});

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
