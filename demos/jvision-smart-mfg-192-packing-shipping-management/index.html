<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>包裝出貨管理系統 Packing &amp; Shipping Management</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --acc:#0891b2; --acc2:#22d3ee; --acc-d:#0e7490;
  --bg:#f1f5f9; --panel:#ffffff; --ink:#0f172a; --sub:#64748b; --line:#e2e8f0;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --soft:#ecfeff;
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;font-size:20px}
.app{display:flex;flex-direction:column;min-height:100vh}
.topbar{background:linear-gradient(100deg,var(--acc-d),var(--acc));color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:30;box-shadow:0 2px 12px rgba(8,145,178,.28)}
.logo{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo .material-symbols-outlined{font-size:24px}
.brand b{font-size:17px;font-weight:800;letter-spacing:.3px;display:block}
.brand span{font-size:11.5px;opacity:.85;letter-spacing:.5px}
.topbar .pill{margin-left:auto;background:rgba(255,255,255,.15);padding:6px 13px;border-radius:20px;font-size:12px;display:flex;align-items:center;gap:6px}
.topbar .pill .material-symbols-outlined{font-size:16px}
.nav{background:#fff;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;padding:9px 16px;position:sticky;top:68px;z-index:20}
.nav button{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--sub);padding:8px 13px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.nav button .material-symbols-outlined{font-size:19px}
.nav button:hover{border-color:var(--acc2);color:var(--acc-d)}
.nav button.on{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 3px 10px rgba(8,145,178,.3)}
.wrap{padding:20px;max-width:1400px;margin:0 auto;width:100%}
.scr-head{margin-bottom:16px}
.scr-head h2{font-size:20px;font-weight:800;display:flex;align-items:center;gap:9px}
.scr-head h2 .material-symbols-outlined{color:var(--acc);font-size:24px}
.scr-head p{color:var(--sub);font-size:13px;margin-top:3px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--acc),var(--acc2))}
.kpi .k-lab{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
.kpi .k-lab .material-symbols-outlined{font-size:17px;color:var(--acc)}
.kpi .k-val{font-size:25px;font-weight:800;margin-top:6px}
.kpi .k-val small{font-size:13px;font-weight:600;color:var(--sub)}
.kpi .k-dt{font-size:11.5px;margin-top:4px;font-weight:600}
.up{color:var(--ok)} .dn{color:var(--bad)} .fl{color:var(--warn)}
.split{display:grid;grid-template-columns:340px 1fr;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.panel-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.panel-h .material-symbols-outlined{color:var(--acc);font-size:20px}
.panel-h .cnt{margin-left:auto;font-size:11.5px;color:var(--sub);font-weight:600;background:var(--soft);padding:2px 9px;border-radius:20px}
.panel-b{padding:14px 16px}
.list{display:flex;flex-direction:column}
.li{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:.12s;border-left:3px solid transparent}
.li:hover{background:#f8fafc}
.li.sel{background:var(--soft);border-left-color:var(--acc)}
.li .li-top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.li .li-id{font-weight:700;font-size:13.5px}
.li .li-sub{font-size:12px;color:var(--sub);margin-top:3px}
.li .li-tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.t-hi{background:#fef2f2;color:var(--bad)} .t-md{background:#fffbeb;color:var(--warn)} .t-lo{background:#ecfdf5;color:var(--ok)} .t-nu{background:#eff6ff;color:#2563eb}
.det-hero{background:linear-gradient(120deg,#083344,#0e7490);color:#fff;border-radius:14px;padding:18px;margin-bottom:16px}
.det-hero h3{font-size:19px;font-weight:800}
.det-hero .dh-sub{font-size:12.5px;opacity:.85;margin-top:4px}
.det-hero .dh-row{display:flex;flex-wrap:wrap;gap:18px;margin-top:14px}
.det-hero .dh-row div span{display:block;font-size:11px;opacity:.75}
.det-hero .dh-row div b{font-size:17px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px}
.card .c-t{font-size:13px;font-weight:700;margin-bottom:11px;display:flex;align-items:center;gap:7px}
.card .c-t .material-symbols-outlined{color:var(--acc);font-size:19px}
.chart{width:100%;height:250px;overflow:hidden}
.chart.sm{height:200px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;padding:9px 11px;background:#f8fafc;color:var(--sub);font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:#f8fafc}
.mono{font-family:"Inter",monospace;font-weight:600}
.bar{height:7px;border-radius:5px;background:#e2e8f0;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}
.chip .material-symbols-outlined{font-size:14px}
.c-ok{background:#ecfdf5;color:var(--ok)} .c-wa{background:#fffbeb;color:var(--warn)} .c-ba{background:#fef2f2;color:var(--bad)} .c-in{background:var(--soft);color:var(--acc-d)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.col{background:#f8fafc;border:1px solid var(--line);border-radius:13px;padding:10px;min-height:120px}
.col-h{font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;padding:0 3px}
.col-h .n{background:#fff;border:1px solid var(--line);border-radius:20px;font-size:11px;padding:1px 8px;color:var(--sub)}
.tk{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:9px;border-top:3px solid var(--acc)}
.tk .tk-id{font-size:11px;color:var(--sub);font-weight:600}
.tk .tk-t{font-size:12.5px;font-weight:700;margin:3px 0 6px}
.tk .tk-m{font-size:11px;color:var(--sub);display:flex;align-items:center;gap:5px}
.tk .tk-m .material-symbols-outlined{font-size:14px;color:var(--acc)}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-i{position:relative;padding-bottom:16px}
.tl-i::before{content:"";position:absolute;left:-22px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--acc)}
.tl-i.done::before{background:var(--acc)}
.tl-i .tl-time{font-size:11px;color:var(--sub);font-weight:600}
.tl-i .tl-t{font-size:13px;font-weight:700;margin:2px 0}
.tl-i .tl-d{font-size:12px;color:var(--sub)}
.rule{display:flex;gap:12px;padding:13px;border:1px solid var(--line);border-radius:12px;margin-bottom:11px;background:#fff}
.rule .r-ic{width:38px;height:38px;border-radius:10px;background:var(--soft);color:var(--acc-d);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rule .r-t{font-weight:700;font-size:13px}
.rule .r-d{font-size:12px;color:var(--sub);margin-top:2px}
.rule .r-ev{font-size:11px;color:var(--acc-d);margin-top:5px;background:var(--soft);display:inline-block;padding:2px 8px;border-radius:20px}
.boxview{background:#083344;border-radius:13px;padding:18px;color:#fff}
.boxview .bv-title{font-size:13px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:7px;opacity:.9}
.boxstage{background:repeating-linear-gradient(45deg,#0e4a5c,#0e4a5c 12px,#0c4353 12px,#0c4353 24px);border-radius:10px;padding:16px;position:relative;min-height:150px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px}
.crate{border:2px dashed rgba(255,255,255,.35);border-radius:8px;padding:10px 8px;text-align:center;background:rgba(34,211,238,.1)}
.crate .cr-dim{font-size:11px;opacity:.8}
.crate .cr-fill{font-size:20px;font-weight:800;color:var(--acc2)}
.crate .cr-lab{font-size:10px;opacity:.7;margin-top:2px}
.bv-meta{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-size:12px}
.bv-meta div span{display:block;opacity:.65;font-size:10.5px}
.bv-meta div b{font-size:14px}
.label{background:#fff;border:2px solid #0f172a;border-radius:8px;padding:14px;font-family:"Inter",monospace;max-width:360px;margin:0 auto}
.label .lb-top{display:flex;justify-content:space-between;border-bottom:2px solid #0f172a;padding-bottom:8px;margin-bottom:8px}
.label .lb-top b{font-size:15px}
.label .lb-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:11px}
.label .lb-grid span{color:#64748b;display:block;font-size:9.5px}
.label .barcode{height:44px;background:repeating-linear-gradient(90deg,#0f172a,#0f172a 2px,#fff 2px,#fff 4px,#0f172a 4px,#0f172a 7px,#fff 7px,#fff 9px);margin:10px 0 4px;border-radius:2px}
.label .bc-num{text-align:center;letter-spacing:3px;font-size:12px;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--sub);margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.hint{font-size:11.5px;color:var(--sub);margin-top:8px;display:flex;align-items:center;gap:6px}
.hint .material-symbols-outlined{font-size:15px;color:var(--acc)}
@media(max-width:1024px){.split{grid-template-columns:300px 1fr}}
@media(max-width:860px){
  .split{grid-template-columns:1fr}
  .nav{position:static}
}
@media(max-width:820px){
  .kpis{grid-template-columns:1fr 1fr}
  .grid2,.grid3,.board{grid-template-columns:1fr}
}
@media(max-width:560px){
  .wrap{padding:14px}
  .nav button .txt{display:none}
  .nav button{padding:8px 11px}
  .kpis{grid-template-columns:1fr 1fr}
  .topbar .pill{display:none}
}
</style>
</head>
<body>
