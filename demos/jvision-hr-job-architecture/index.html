<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0D9488">
<title>職務說明書與職等職級管理 · HRIS 人力資源系統</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --ok:#047857;
  --warn:#B45309;
  --bad:#B91C1C;
  --info:#4338CA;
  --shadow:7px 7px 0 #134E4A;
  --font-display:"Cormorant Garamond","Crimson Pro",serif;
  --font-body:"Crimson Pro","Noto Serif TC",serif;
  --font-code:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{
  margin:0;
  min-width:320px;
  background:
    linear-gradient(rgba(13,148,136,.09) 1px,transparent 1px),
    linear-gradient(90deg,rgba(13,148,136,.09) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased
}
button{font:inherit}
button,a,[role=button]{cursor:pointer}
:focus-visible{
  outline:4px solid var(--color-ring);
  outline-offset:3px;
  box-shadow:0 0 0 2px #fff
}
::selection{background:var(--color-secondary);color:#0F172A}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:500;
  font-style:normal;
  font-size:1.25rem;
  line-height:1;
  vertical-align:middle
}
.app{min-height:100vh}
.sidebar{
  position:sticky;
  inset:0 0 auto;
  z-index:30;
  display:grid;
  grid-template-columns:minmax(210px,auto) minmax(0,1fr) auto;
  align-items:stretch;
  min-height:76px;
  background:#0F766E;
  color:#fff;
  border-bottom:4px solid var(--ink)
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 20px;
  border-right:3px solid var(--ink);
  background:var(--color-secondary);
  color:#0F172A
}
.brand-logo{
  display:grid;
  place-items:center;
  width:44px;
  height:44px;
  flex:none;
  border:3px solid #0F172A;
  background:var(--color-accent);
  box-shadow:4px 4px 0 #0F172A
}
.brand-logo .material-symbols-outlined{font-size:25px}
.brand-txt b{
  display:block;
  font-family:var(--font-display);
  font-size:20px;
  font-weight:700;
  line-height:1;
  letter-spacing:.03em
}
.brand-txt span{
  display:block;
  margin-top:5px;
  font-family:"Cinzel",serif;
  font-size:9px;
  font-weight:600;
  letter-spacing:.16em
}
.nav{
  display:flex;
  min-width:0;
  overflow-x:auto;
  scrollbar-width:thin
}
.nav button{
  position:relative;
  display:flex;
  align-items:center;
  gap:8px;
  min-width:max-content;
  padding:12px 18px;
  border:0;
  border-right:2px solid rgba(15,23,42,.75);
  background:transparent;
  color:#fff;
  font-weight:700;
  text-align:left
}
.nav button:hover{background:#115E59}
.nav button.on{
  background:var(--color-accent);
  color:#111827
}
.nav button.on::after{
  content:"";
  position:absolute;
  right:8px;
  bottom:7px;
  left:8px;
  height:4px;
  background:#111827
}
.nav .idx{
  margin-left:8px;
  font-family:var(--font-code);
  font-size:11px;
  opacity:.78
}
.side-foot{
  display:flex;
  align-items:center;
  padding:8px 16px;
  border-left:3px solid var(--ink);
  background:#134E4A;
  color:#CCFBF1;
  font-size:12px;
  line-height:1.3
}
.side-foot b{color:#fff}
.main{
  width:min(1540px,100%);
  margin:auto;
  padding:26px 30px 64px
}
.topbar{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:22px;
  padding:18px 20px;
  border:3px solid var(--ink);
  background:var(--color-card);
  box-shadow:var(--shadow)
}
.topbar h1{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0;
  font-family:var(--font-display);
  font-size:clamp(28px,3vw,44px);
  font-weight:700;
  line-height:.95
}
.topbar h1 .material-symbols-outlined{
  display:grid;
  place-items:center;
  width:44px;
  height:44px;
  flex:none;
  border:3px solid var(--ink);
  background:var(--color-secondary);
  font-size:26px
}
.topbar .sub{
  max-width:760px;
  margin-top:10px;
  color:var(--muted);
  font-size:15px;
  font-weight:600
}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:38px;
  padding:7px 10px;
  border:2px solid var(--ink);
  background:#fff;
  color:var(--ink);
  font-size:13px;
  font-weight:700
}
.dot{
  width:10px;
  height:10px;
  border:2px solid #064E3B;
  background:#34D399
}
.avatar{
  display:grid;
  place-items:center;
  width:38px;
  height:38px;
  border:2px solid var(--ink);
  background:var(--color-accent);
  color:#111827;
  font-weight:700
}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.stat,.kpi,.tile{
  min-width:0;
  border:3px solid var(--ink);
  border-radius:0;
  background:var(--color-card);
  color:var(--color-card-foreground)
}
.card,.sec{padding:18px}
.sec{
  margin-bottom:18px;
  box-shadow:5px 5px 0 rgba(19,78,74,.85)
}
.sec:nth-child(even){transform:translateX(8px)}
.sec>h3,.card-h h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0;
  font-family:var(--font-display);
  font-size:22px;
  font-weight:700;
  line-height:1.1
}
.sec>h3{
  margin:-18px -18px 16px;
  padding:11px 14px;
  border-bottom:3px solid var(--ink);
  background:var(--color-muted)
}
.sec>h3 .material-symbols-outlined,
.card-h .material-symbols-outlined{color:#0F766E}
.sec>p{margin:0 0 15px;color:var(--muted);line-height:1.65}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:14px
}
.card-h .hint{color:var(--muted);font-size:13px}
.stat,.kpi,.tile{
  position:relative;
  overflow:hidden;
  padding:15px;
  box-shadow:4px 4px 0 var(--color-border)
}
.stat:nth-child(2n),.kpi:nth-child(2n){background:#ECFEFF}
.stat::before,.kpi::before,.tile::before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:8px;
  background:var(--color-primary)
}
.stat .lbl,.kpi .lbl{
  display:flex;
  align-items:center;
  gap:6px;
  margin:0 0 5px 7px;
  color:var(--muted);
  font-size:13px;
  font-weight:700
}
.stat .val,.kpi .val,.tile .tv{
  margin-left:7px;
  color:#0F172A;
  font-family:var(--font-code);
  font-size:clamp(26px,3vw,36px);
  font-weight:800;
  letter-spacing:-.06em;
  line-height:1
}
.stat .val small,.kpi .val small{
  margin-left:6px;
  color:var(--muted);
  font-family:var(--font-body);
  font-size:14px;
  letter-spacing:0
}
.stat .d,.kpi .delta{
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin:8px 0 0 7px;
  padding:3px 6px;
  border:1px solid currentColor;
  font-size:12px;
  font-weight:700
}
.d.up,.delta.up{color:#047857}
.d.down,.delta.down{color:#B91C1C}
.d.flat,.delta.flat{color:#475569}
.d.up::before,.delta.up::before{content:"▲"}
.d.down::before,.delta.down::before{content:"!"}
.d.flat::before,.delta.flat::before{content:"—"}
.kpi .ico{
  position:absolute;
  top:12px;
  right:12px;
  color:#0F766E
}
.dl{
  display:grid;
  grid-template-columns:160px minmax(0,1fr);
  gap:0;
  margin:0;
  border:2px solid var(--ink)
}
.dl dt,.dl dd{
  margin:0;
  padding:11px 13px;
  border-bottom:1px solid #94A3B8
}
.dl dt{
  border-right:2px solid var(--ink);
  background:var(--color-muted);
  color:#334155;
  font-size:14px;
  font-weight:700
}
.dl dd{line-height:1.65}
.dl dt:last-of-type,.dl dd:last-of-type{border-bottom:0}
table{
  width:100%;
  border-collapse:collapse;
  border:2px solid var(--ink);
  font-size:14px;
  font-variant-numeric:tabular-nums
}
th{
  padding:10px 12px;
  border-right:1px solid #134E4A;
  border-bottom:3px solid var(--ink);
  background:#134E4A;
  color:#fff;
  font-family:var(--font-body);
  font-size:13px;
  font-weight:700;
  letter-spacing:.02em;
  text-align:left;
  white-space:nowrap
}
th:last-child{border-right:0}
td{
  padding:10px 12px;
  border-right:1px solid #99F6E4;
  border-bottom:1px solid #5EEAD4;
  background:#fff;
  white-space:nowrap
}
td:last-child{border-right:0}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even) td{background:#F0FDFA}
tbody tr:hover td{background:#CCFBF1}
td:nth-child(n+4){font-variant-numeric:tabular-nums}
.mono{
  font-family:var(--font-code);
  font-weight:700;
  letter-spacing:.01em
}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 7px;
  border:2px solid currentColor;
  background:#fff;
  font-size:12px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap
}
.tag::before{font-family:var(--font-code);font-weight:900}
.t-ok{color:#047857}.t-ok::before{content:"✓"}
.t-warn{color:#92400E}.t-warn::before{content:"!"}
.t-bad{color:#B91C1C}.t-bad::before{content:"×"}
.t-info{color:#4338CA}.t-info::before{content:"→"}
.t-gray{color:#475569}.t-gray::before{content:"—"}
.t-acc,.t-pink{color:#0F766E}.t-acc::before,.t-pink::before{content:"◆"}
.note{
  margin-top:15px;
  padding:12px 14px;
  border:2px solid var(--ink);
  border-left:10px solid var(--color-accent);
  background:#FFFBEB;
  color:#374151;
  font-size:13px;
  font-weight:600;
  line-height:1.6
}
.bar{
  height:10px;
  min-width:60px;
  overflow:hidden;
  border:1px solid var(--ink);
  background:#DDE7EA
}
.bar>i{display:block;height:100%;background:var(--color-primary)}
.prog{display:flex;align-items:center;gap:8px}
.prog small{
  width:42px;
  flex:none;
  color:var(--muted);
  font-family:var(--font-code);
  font-size:11px;
  font-weight:700;
  text-align:right
}
.tl{position:relative;padding-left:28px}
.tl::before{
  content:"";
  position:absolute;
  top:4px;
  bottom:4px;
  left:8px;
  width:3px;
  background:var(--ink)
}
.tl-item,.tl-i{position:relative;padding:0 0 18px}
.tl-dot,.tl-d{
  position:absolute;
  top:2px;
  left:-27px;
  width:17px;
  height:17px;
  border:3px solid var(--ink);
  background:var(--color-secondary)
}
.tl-dot.warn,.tl-d.warn{background:#F59E0B}
.tl-dot.bad,.tl-d.bad{background:#DC2626}
.tl-dot.ok,.tl-d.ok{background:#10B981}
.tl-time,.tl-t{color:var(--muted);font-family:var(--font-code);font-size:11px}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-weight:700}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:13px}
.chk{
  display:flex;
  align-items:center;
  gap:9px;
  padding:9px 2px;
  border-bottom:1px dashed var(--ink)
}
.chk .n{flex:1}.chk small{color:var(--muted)}
.chk .ok{color:var(--ok)}.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}.chk .wait{color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.col{
  padding:10px;
  border:2px solid var(--ink);
  background:var(--color-muted)
}
.col-h{
  display:flex;
  justify-content:space-between;
  padding:3px 3px 10px;
  font-weight:700
}
.col-h .cnt{
  padding:0 7px;
  border:1px solid var(--ink);
  background:#fff;
  font-family:var(--font-code)
}
.pcard{
  margin-top:8px;
  padding:10px;
  border:2px solid var(--ink);
  border-left:7px solid var(--color-primary);
  background:#fff
}
.pcard .meta{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin-top:5px;
  color:var(--muted);
  font-size:12px
}
.who{display:inline-flex;align-items:center;gap:6px}
.mini-av,.av{
  display:inline-grid;
  place-items:center;
  flex:none;
  border:1px solid var(--ink);
  background:var(--color-secondary);
  color:#0F172A;
  font-family:var(--font-code);
  font-weight:800
}
.mini-av{width:20px;height:20px;font-size:9px}
.av{width:28px;height:28px;font-size:11px}
.lane{display:flex;flex-direction:column;gap:10px}
.lane-row{
  display:flex;
  align-items:center;
  gap:13px;
  min-width:0;
  padding:12px;
  border:2px solid var(--ink);
  background:#fff
}
.lane-row .num{
  display:grid;
  place-items:center;
  width:34px;
  height:34px;
  flex:none;
  border:2px solid var(--ink);
  background:var(--color-secondary);
  font-family:var(--font-code);
  font-weight:800
}
.lane-row .body{flex:1;min-width:0}
.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:13px}
.steps{display:flex;align-items:center}
.steps .s{
  display:grid;
  place-items:center;
  width:24px;
  height:24px;
  border:2px solid var(--ink);
  background:#fff;
  font-family:var(--font-code);
  font-size:11px
}
.steps .s.done{background:var(--color-primary);color:#fff}
.steps .s.cur{border-width:4px;border-color:var(--color-accent)}
.steps .ln{width:18px;height:3px;background:#94A3B8}
.steps .ln.done{background:var(--color-primary)}
.rep-row{
  display:flex;
  align-items:center;
  gap:13px;
  padding:12px 3px;
  border-bottom:1px dashed var(--ink)
}
.rep-row .sku{flex:1}.rep-row .sku span{color:var(--muted);font-size:12px}
.gauge{width:120px}
.gauge .track{height:10px;border:1px solid var(--ink);background:#DDE7EA}
.gauge .track i{display:block;height:100%;background:var(--color-primary)}
.gauge small{display:block;text-align:right;color:var(--muted);font-family:var(--font-code)}
.band{position:relative;height:28px;min-width:150px;border:2px solid var(--ink);background:#DDE7EA}
.band .rng{position:absolute;inset:0 auto;background:#99F6E4}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--ink)}
.band .me{position:absolute;top:3px;width:12px;height:18px;background:var(--color-accent)}
.tile{display:flex;flex-direction:column;gap:8px}
.tile .ti{color:var(--color-primary)}
.tile b{font-family:var(--font-display);font-size:19px}
.tile p{margin:0;color:var(--muted)}
@media(max-width:1100px){
  .sidebar{grid-template-columns:auto 1fr}
  .side-foot{display:none}
  .g4,.board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:820px){
  .sidebar{position:static;grid-template-columns:1fr}
  .brand{border-right:0;border-bottom:3px solid var(--ink)}
  .nav button{flex:1;justify-content:center}
  .main{padding:18px 14px 50px}
  .topbar{align-items:flex-start;flex-direction:column}
  .top-right{justify-content:flex-start}
  .g2,.g3,.g23,.g32{grid-template-columns:1fr}
  .sec:nth-child(even){transform:none}
}
@media(max-width:560px){
  .brand{padding:10px 14px}
  .nav button{padding:11px 13px}
  .nav .txt{font-size:13px}
  .nav .idx{display:none}
  .g4,.board{grid-template-columns:1fr}
  .topbar{padding:14px;box-shadow:4px 4px 0 var(--ink)}
  .topbar h1{font-size:29px}
  .topbar h1 .material-symbols-outlined{width:38px;height:38px}
  .chip{font-size:12px}
  .dl{grid-template-columns:1fr}
  .dl dt{border-right:0;border-bottom:1px solid var(--ink)}
  .dl dd{border-bottom:2px solid var(--ink)}
  .dl dt:last-of-type{border-bottom:1px solid var(--ink)}
  .dl dd:last-of-type{border-bottom:0}
}
@media(prefers-reduced-motion:no-preference){
  #screen>.sec{
    animation:reveal .36s ease-out both
  }
  #screen>.sec:nth-child(2){animation-delay:.06s}
  #screen>.sec:nth-child(3){animation-delay:.12s}
  .nav button,.chip,tbody td{transition:background-color .18s,color .18s}
  @keyframes reveal{
    from{opacity:0;transform:translateY(12px)}
    to{opacity:1;transform:translateY(0)}
  }
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation:none!important;
    transition:none!important
  }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">menu_book</span></div>
      <div class="brand-txt"><b>職務規章庫</b><span>JOB ARCHITECTURE</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
    <div class="side-foot">版本 2026.3<br>186 份職務說明書<br>版本 <b>v1.0.0</b> · 純 UI 展示</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1><span class="material-symbols-outlined" id="th-ico"></span><span id="th-title"></span></h1>
        <div class="sub" id="th-sub"></div>
      </div>
      <div class="top-right">
        <span class="chip"><span class="dot" aria-hidden="true"></span>系統連線正常</span>
        <span class="chip"><span class="material-symbols-outlined">calendar_today</span>2026/08/20</span>
        <div class="avatar" aria-label="資管使用者">資</div>
      </div>
    </div>
    <div id="screen" aria-live="polite"></div>
  </main>
</div>
<script>
var charts=[];
function killCharts(){charts.forEach(function(c){try{c.destroy()}catch(e){}});charts=[]}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function tbl(h,r){return '<div style="overflow-x:auto"><table><thead><tr>'+h.map(function(x){return'<th>'+esc(x)+'</th>'}).join("")+'</tr></thead><tbody>'+r.map(function(x){return'<tr>'+x.map(function(c,i){return'<td'+(i===0?' class="mono"':'')+'>'+c+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div>'}
var AX={style:{colors:"#475569",fontSize:"12px",fontFamily:'"Crimson Pro",serif'}};
var CB={redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:'"Crimson Pro",serif',foreColor:"#475569"};
function push(el,opt){var n=document.getElementById(el);if(!n)return;var c=new ApexCharts(n,opt);c.render();charts.push(c)}
function mkBar(el,cats,data,name,horiz,min,h){
  push(el,{
    chart:Object.assign({},CB,{type:"bar",height:h||240}),
    series:[{name:name,data:data}],
    xaxis:{categories:cats,labels:AX},
    yaxis:{min:min,labels:{style:AX.style}},
    grid:{borderColor:"#5EEAD4",strokeDashArray:0},
    dataLabels:{enabled:false},
    plotOptions:{bar:{borderRadius:0,horizontal:!!horiz,columnWidth:"62%",barHeight:"64%"}},
    colors:["#0D9488"],
    tooltip:{theme:"light"}
  })
}

var RENDER=[v0,v1,v2,v3];
function buildNav(){
  var n=document.getElementById("nav");
  n.innerHTML=MODULES.map(function(m,i){
    return'<button type="button" data-i="'+i+'" aria-label="'+esc(m.name)+'"><span class="material-symbols-outlined" aria-hidden="true">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'
  }).join("");
  Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){
    b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})
  })
}
function show(i){
  killCharts();
  var m=MODULES[i];
  document.getElementById("th-ico").textContent=m.icon;
  document.getElementById("th-title").textContent=m.name;
  document.getElementById("th-sub").textContent=m.sub;
  Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){
    var on=+b.getAttribute("data-i")===i;
    b.classList.toggle("on",on);
    if(on)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")
  });
  RENDER[i](document.getElementById("screen"))
}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  show(m?Math.min(+m[1],MODULES.length-1):0);
  try{window.scrollTo(0,0)}catch(e){}
}
buildNav();
window.addEventListener("hashchange",fromHash);
fromHash();
