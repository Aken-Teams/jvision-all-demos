<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>有限產能排程系統 FCS｜Jvision 系統 Demo</title>
<meta name="description" content="設備級產能建模、有限產能排程演算、甘特圖與現場派工的單一平台" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{--acc:#4f46e5;--acc2:#818cf8;--bg:#0b0f1a;--panel:#121a2b;--panel2:#0f1626;--line:#233049;--txt:#e5eaf5;--mut:#8494b4;--ok:#34d399;--warn:#fbbf24;--bad:#fb7185}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:radial-gradient(1200px 600px at 80% -10%,#1a2038 0%,var(--bg) 55%);color:var(--txt);min-height:100vh}
.sym{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.topbar{position:sticky;top:0;z-index:20;background:rgba(9,13,22,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tb-in{display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 0 18px rgba(79,70,229,.5)}
.brand b{font-size:15px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;color:var(--mut);font-size:11px;white-space:nowrap}
.live{margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--mut);font-size:12px;flex:none}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.55)}70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.nav{display:flex;gap:6px;padding:0 12px 10px;flex-wrap:wrap}
.nav button{flex:none;white-space:nowrap;display:flex;align-items:center;gap:7px;background:var(--panel2);color:var(--mut);border:1px solid var(--line);padding:8px 13px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.nav button:hover{color:var(--txt);border-color:var(--acc2)}
.nav button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent;box-shadow:0 4px 16px rgba(79,70,229,.4)}
.nav button .sym{font-size:19px}
.wrap{max-width:1360px;margin:0 auto;padding:16px}
.scr-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.scr-head h2{margin:0;font-size:20px;font-weight:800}
.scr-head p{margin:0;color:var(--mut);font-size:13px}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--acc2);background:rgba(79,70,229,.12)}
.g{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:2fr 1fr}
.g5{grid-template-columns:1.4fr 1fr}
@media(max-width:820px){.kpis{grid-template-columns:1fr 1fr}.g2,.g3,.g5{grid-template-columns:1fr}}
@media(max-width:560px){.brand small{display:none}.nav button span.lbl{display:none}.nav button{padding:8px 11px}}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0}
.card h3{margin:0 0 4px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px}
.card h3 .sym{font-size:18px;color:var(--acc2)}
.card .sub{color:var(--mut);font-size:12px;margin:0 0 12px}
.kpi{position:relative;overflow:hidden}
.kpi .lab{color:var(--mut);font-size:12px;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:28px;font-weight:900;margin-top:6px;letter-spacing:.5px}
.kpi .val small{font-size:13px;color:var(--mut);font-weight:600}
.kpi .delta{font-size:12px;font-weight:700;margin-top:4px;display:flex;align-items:center;gap:3px}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--warn)}
.kpi .ic{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:9px;background:rgba(79,70,229,.15);display:grid;place-items:center;color:var(--acc2)}
.kpi .ic .sym{font-size:20px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th{text-align:left;color:var(--mut);font-weight:600;font-size:11.5px;padding:9px 10px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
td{padding:10px;border-bottom:1px solid rgba(35,48,73,.55);white-space:nowrap}
tr:last-child td{border-bottom:0}
tr:hover td{background:rgba(79,70,229,.06)}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.p-ok{background:rgba(52,211,153,.14);color:var(--ok)}
.p-warn{background:rgba(251,191,36,.14);color:var(--warn)}
.p-bad{background:rgba(251,113,133,.14);color:var(--bad)}
.p-idle{background:rgba(132,148,180,.14);color:var(--mut)}
.bar{height:7px;border-radius:5px;background:#1c2740;overflow:hidden;min-width:70px;flex:1}
.bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.gantt{min-width:720px}
.gantt .row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(35,48,73,.5)}
.gantt .mc{width:120px;flex:none;font-size:12.5px;font-weight:700;color:var(--txt)}
.gantt .track{position:relative;flex:1;height:26px;background:repeating-linear-gradient(90deg,#0e1626 0,#0e1626 calc(100%/8 - 1px),#1a2440 calc(100%/8 - 1px),#1a2440 calc(100%/8))}
.gbar{position:absolute;top:3px;height:20px;border-radius:5px;display:flex;align-items:center;padding:0 6px;font-size:10.5px;font-weight:700;color:#fff;overflow:hidden;white-space:nowrap}
.gchg{position:absolute;top:3px;height:20px;background:repeating-linear-gradient(45deg,#334155,#334155 3px,#1e293b 3px,#1e293b 6px);border-radius:3px}
.gaxis{display:flex;margin-left:130px;color:var(--mut);font-size:10.5px}
.gaxis span{flex:1;text-align:left}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:820px){.board{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.board{grid-template-columns:1fr}}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.col h4{margin:0 0 9px;font-size:12.5px;display:flex;align-items:center;justify-content:space-between;color:var(--mut)}
.col h4 b{color:var(--txt)}
.col .cnt{font-size:11px;background:#1c2740;border-radius:999px;padding:1px 8px;color:var(--acc2);font-weight:700}
.wo{background:linear-gradient(180deg,#162034,#111a2b);border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:8px;border-left:3px solid var(--acc)}
.wo:last-child{margin-bottom:0}
.wo .t{font-size:12.5px;font-weight:700}
.wo .m{color:var(--mut);font-size:11px;margin-top:3px;display:flex;justify-content:space-between;gap:8px}
.prow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);margin-bottom:9px;min-width:0}
.prow:last-child{margin-bottom:0}
.rank{width:30px;height:30px;flex:none;border-radius:8px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-weight:900;font-size:14px;color:#fff}
.prow .info{flex:1;min-width:0}
.prow .info .a{font-size:13px;font-weight:700}
.prow .info .b{font-size:11px;color:var(--mut);margin-top:2px}
.prow .score{text-align:right;flex:none}
.prow .score .s{font-size:17px;font-weight:900;color:var(--acc2)}
.prow .score .l{font-size:10px;color:var(--mut)}
.tl{position:relative;padding-left:20px}
.tl:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .it{position:relative;padding:0 0 14px 6px}
.tl .it:last-child{padding-bottom:0}
.tl .it:before{content:"";position:absolute;left:-18px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--acc);border:2px solid var(--bg);box-shadow:0 0 0 2px var(--acc2)}
.tl .it .h{font-size:12.5px;font-weight:700}
.tl .it .d{font-size:11.5px;color:var(--mut);margin-top:2px}
.tl .it .tm{font-size:10.5px;color:var(--acc2);font-weight:700}
.mx{border-collapse:separate;border-spacing:3px;min-width:520px}
.mx th{border:0;text-align:center;padding:6px}
.mx td.h{color:var(--mut);font-weight:700;text-align:right;padding-right:8px;font-size:12px}
.mx td.c{text-align:center;border-radius:6px;font-size:11.5px;font-weight:700;padding:8px}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:10px}
.lg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:middle}
.chart{width:100%}
.note{font-size:11.5px;color:var(--mut);margin-top:10px;display:flex;gap:7px;align-items:flex-start}
.note .sym{font-size:15px;color:var(--acc2);flex:none}
.split{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 9px;color:var(--mut)}
.chip b{color:var(--txt)}
</style>
</head>
<body>
<header class="topbar">
  <div class="tb-in">
    <div class="brand">
      <div class="logo"><span class="sym">view_timeline</span></div>
      <div><b>FCS 有限產能排程</b><small>Finite Capacity Scheduling · 楠亭一廠</small></div>
    </div>
    <div class="live"><span class="dot"></span>排程引擎在線 · 2026-08-13 08:40</div>
  </div>
  <nav class="nav" id="nav"></nav>
</header>
<main class="wrap"><div id="view"></div></main>

<script>
var CH=[];
function killCharts(){CH.forEach(function(c){try{c.destroy();}catch(e){}});CH=[];}

var MODS=[
 {ic:"precision_manufacturing",name:"設備產能建模"},
 {ic:"low_priority",name:"訂單優先序"},
 {ic:"auto_awesome",name:"排程演算"},
 {ic:"view_timeline",name:"排程甘特圖"},
 {ic:"cached",name:"換線負載分析"},
 {ic:"assignment_turned_in",name:"現場派工"}
];

function head(t,d,v){return '<div class="scr-head"><h2>'+t+'</h2><span class="tag">'+v+'</span><p>'+d+'</p></div>';}
function barc(p){return '<div class="bar"><i style="width:'+p+'%"></i></div>';}

function kpi(lab,val,ic,unit,dir,delta){
 var cls=dir==="up"?"up":dir==="down"?"down":"flat";
 var arrow=dir==="up"?"trending_up":dir==="down"?"trending_down":"trending_flat";
 return '<div class="card kpi"><div class="ic"><span class="sym">'+ic+'</span></div>'
  +'<div class="lab">'+lab+'</div>'
  +'<div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div>'
  +'<div class="delta '+cls+'"><span class="sym" style="font-size:15px">'+arrow+'</span>'+delta+'</div></div>';
}

/* SCREEN 0 : 設備產能建模 */
function s0(){
 var eq=[
  {id:"CNC-01",nm:"CNC 加工中心 A",cap:960,used:842,shift:"三班",cal:"日曆-A"},
  {id:"CNC-02",nm:"CNC 加工中心 B",cap:960,used:918,shift:"三班",cal:"日曆-A"},
  {id:"MILL-03",nm:"精密銑床 03",cap:640,used:401,shift:"二班",cal:"日曆-B"},
  {id:"LATH-05",nm:"數控車床 05",cap:640,used:612,shift:"二班",cal:"日曆-B"},
  {id:"GRND-07",nm:"平面磨床 07",cap:480,used:212,shift:"一班",cal:"日曆-C"},
  {id:"WELD-09",nm:"自動焊接線 09",cap:720,used:690,shift:"三班",cal:"日曆-A"},
  {id:"COAT-11",nm:"表面塗裝 11",cap:560,used:398,shift:"二班",cal:"日曆-B"}
 ];
 var rows=eq.map(function(e){
   var pct=Math.round(e.used/e.cap*100);
   var pc=pct>=95?'p-bad':pct>=85?'p-warn':pct<45?'p-idle':'p-ok';
   var st=pct>=95?'超載':pct>=85?'高載':pct<45?'閒置':'正常';
   return '<tr><td class="mono"><b>'+e.id+'</b></td><td>'+e.nm+'</td><td>'+e.shift+'</td><td class="mono">'+e.cal+'</td>'
    +'<td class="mono">'+e.cap+' 分</td><td class="mono">'+e.used+' 分</td>'
    +'<td><div class="split" style="align-items:center;gap:8px">'+barc(pct)+'<span class="mono">'+pct+'%</span></div></td>'
    +'<td><span class="pill '+pc+'">'+st+'</span></td></tr>';
 }).join("");
 return head("設備產能建模","設備級可用產能、班別日曆與換線時間矩陣，作為排程能力上限基礎。","v0")
 +'<div class="g kpis" style="margin-bottom:14px">'
 + kpi("設備台數","7","precision_manufacturing","台","flat","3 條產線")
 + kpi("今日可用產能","4,960","bolt","分","up","+320 分 vs 昨")
 + kpi("平均稼動率","82.6","monitoring","%","up","+4.1%")
 + kpi("超載設備","2","warning","台","down","需重排")
 +'</div>'
 +'<div class="g g3">'
 +'<div class="card"><h3><span class="sym">table_chart</span>設備產能建檔表</h3><p class="sub">可用產能 = 班別工時 − 計畫停機 − 換線預留</p>'
 +'<div class="tw"><table><thead><tr><th>設備</th><th>名稱</th><th>班別</th><th>日曆</th><th>可用</th><th>已排</th><th>負載</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'
 +'<div class="card"><h3><span class="sym">calendar_month</span>班別日曆</h3><p class="sub">本週產能班表</p>'
 + calGrid()
 +'<div class="lg"><span><i style="background:var(--acc)"></i>三班</span><span><i style="background:var(--acc2)"></i>二班</span><span><i style="background:#4b5aa0"></i>一班</span><span><i style="background:#334155"></i>休</span></div></div>'
 +'</div>';
}
function calGrid(){
 var days=["一","二","三","四","五","六","日"];
 var pat=[3,3,2,3,2,1,0]; var cols={3:"var(--acc)",2:"var(--acc2)",1:"#4b5aa0",0:"#334155"};
 var cells=days.map(function(d,i){var v=pat[i];return '<div style="text-align:center"><div style="font-size:11px;color:var(--mut);margin-bottom:5px">'+d+'</div><div style="height:46px;border-radius:8px;background:'+cols[v]+';display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff">'+(v?v+'班':'休')+'</div></div>';}).join("");
 return '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">'+cells+'</div>';
}

/* SCREEN 1 : 訂單優先序 */
function s1(){
 var ord=[
  {wo:"WO-24118",item:"閥體 V-330",qty:1200,due:"07-22",cust:"AA 集團",w:9.4,late:true,mat:"齊料"},
  {wo:"WO-24127",item:"軸承座 B-07",qty:800,due:"07-24",cust:"BB 電機",w:8.7,late:false,mat:"齊料"},
  {wo:"WO-24133",item:"連桿 R-118",qty:2400,due:"07-25",cust:"CC 汽車",w:8.1,late:false,mat:"缺料"},
  {wo:"WO-24140",item:"殼件 H-52",qty:600,due:"07-28",cust:"AA 集團",w:7.2,late:false,mat:"齊料"},
  {wo:"WO-24151",item:"法蘭 F-90",qty:1500,due:"07-30",cust:"DD 重工",w:6.5,late:false,mat:"部分"},
  {wo:"WO-24162",item:"齒輪 G-44",qty:900,due:"08-02",cust:"BB 電機",w:5.8,late:false,mat:"齊料"}
 ];
 var list=ord.map(function(o,i){
   var matp=o.mat==="缺料"?'p-bad':o.mat==="部分"?'p-warn':'p-ok';
   return '<div class="prow"><div class="rank">'+(i+1)+'</div><div class="info">'
    +'<div class="a">'+o.wo+' · '+o.item+' <span class="pill '+matp+'" style="margin-left:4px">'+o.mat+'</span>'+(o.late?' <span class="pill p-bad">交期風險</span>':'')+'</div>'
    +'<div class="b">'+o.cust+' · '+o.qty+' 件 · 承諾交期 '+o.due+'</div></div>'
    +'<div class="score"><div class="s">'+o.w.toFixed(1)+'</div><div class="l">優先分數</div></div></div>';
 }).join("");
 return head("訂單優先序設定","依承諾交期、客戶權重與缺料狀態排定待排訂單優先順序與凍結區間。","v1")
 +'<div class="g kpis" style="margin-bottom:14px">'
 + kpi("待排訂單","6","list_alt","張","flat","本週視窗")
 + kpi("交期風險","1","event_busy","張","down","逾期預警")
 + kpi("缺料卡關","1","inventory","張","flat","不得排入")
 + kpi("凍結區間","48","lock_clock","hr","flat","不可異動")
 +'</div>'
 +'<div class="g g5">'
 +'<div class="card"><h3><span class="sym">low_priority</span>優先序排隊清單</h3><p class="sub">分數 = 交期緊迫 0.5 + 客戶權重 0.3 + 齊料 0.2</p>'+list+'</div>'
 +'<div class="card"><h3><span class="sym">tune</span>優先規則權重</h3><p class="sub">生管可調整加權係數</p>'
 +'<div id="c1" class="chart"></div>'
 +'<div class="note"><span class="sym">rule</span>RULE-01：承諾交期在 07-25 前且尚未生產者優先；缺料工單到料前凍結。</div></div>'
 +'</div>';
}

/* SCREEN 2 : 排程演算 */
function s2(){
 return head("有限產能排程演算","在不超過設備產能上限下納入換線時間求解，產生各設備的可行工序序列。","v2")
 +'<div class="g kpis" style="margin-bottom:14px">'
 + kpi("求解迭代","1,284","autorenew","次","flat","已收斂")
 + kpi("可行解","是","check_circle","","up","0 違反約束")
 + kpi("平均延遲","0.4","schedule","日","up","−1.9 日")
 + kpi("換線總時","312","cached","分","down","−88 分")
 +'</div>'
 +'<div class="g g2" style="margin-bottom:14px">'
 +'<div class="card"><h3><span class="sym">insights</span>求解收斂曲線</h3><p class="sub">目標函數：加權延遲 + 換線成本</p><div id="c2a" class="chart"></div></div>'
 +'<div class="card"><h3><span class="sym">rule_folder</span>約束檢核</h3><p class="sub">硬約束全數滿足才輸出排程</p>'
 + constraintList()
 +'</div>'
 +'</div>'
 +'<div class="card"><h3><span class="sym">balance</span>各設備排入負載 vs 產能上限</h3><p class="sub">演算後每台設備的已排分鐘與餘裕</p><div id="c2b" class="chart"></div></div>';
}
function constraintList(){
 var cs=[
  {t:"產能上限不超載",d:"每設備每班已排 ≤ 可用產能"},
  {t:"換線時間納入",d:"相鄰異料號插入換線區塊"},
  {t:"缺料工單凍結",d:"WO-24133 到料前不排入"},
  {t:"交期軟約束",d:"WO-24118 提前 1.2 日完成"},
  {t:"班別可用性",d:"GRND-07 僅一班可派"},
  {t:"優先序遵循",d:"高優先訂單先佔用產能"}
 ];

var SCR=[s0,s1,s2,s3,s4,s5];
function show(i){
 i=Math.max(0,Math.min(SCR.length-1,i|0));
 killCharts();
 var nav=document.getElementById("nav");
 [].forEach.call(nav.children,function(b,k){b.classList.toggle("on",k===i);});
 var view=document.getElementById("view");
 view.innerHTML=SCR[i]();
 void view.offsetHeight;
 drawCharts(i);
}
(function(){
 var nav=document.getElementById("nav");
 nav.innerHTML=MODS.map(function(m,i){return '<button data-i="'+i+'"><span class="sym">'+m.ic+'</span><span class="lbl">'+m.name+'</span></button>';}).join("");
 [].forEach.call(nav.children,function(b){b.addEventListener("click",function(){show(+b.getAttribute("data-i"));try{window.scrollTo(0,0);}catch(e){}});});
 show(0);
})();

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
