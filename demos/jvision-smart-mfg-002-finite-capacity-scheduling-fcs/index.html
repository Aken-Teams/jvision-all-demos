<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>有限產能排程系統 FCS｜Jvision 系統 Demo</title>
<meta name="description" content="設備級產能建模、有限產能排程演算、甘特圖與現場派工的單一平台" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --ok:#08783F;
  --warn:#9A4A00;
  --bad:#B91C1C;
  --shadow:6px 6px 0 #1E293B;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  background-color:var(--color-background);
  background-image:
    linear-gradient(var(--line) 1px,transparent 1px),
    linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:32px 32px;
  font-family:"Fira Sans",sans-serif;
}
button,a,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.sym{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  color:#fff;
  background:#101827;
  border-bottom:4px solid var(--color-accent);
}
.tb-in{
  display:flex;
  align-items:center;
  gap:16px;
  min-height:64px;
  padding:10px clamp(12px,3vw,28px);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  display:grid;
  flex:none;
  width:42px;
  height:42px;
  place-items:center;
  color:#fff;
  background:var(--blue);
  border:2px solid #fff;
  box-shadow:4px 4px 0 var(--color-accent);
}
.logo .sym{font-size:25px}
.brand b{font-size:16px;font-weight:700;letter-spacing:.02em}
.brand small{display:block;margin-top:2px;color:#CBD5E1;font-size:11px}
.live{
  display:flex;
  align-items:center;
  gap:8px;
  margin-left:auto;
  color:#E2E8F0;
  font:500 12px "Fira Code",monospace;
  white-space:nowrap;
}
.dot{
  display:inline-grid;
  width:18px;
  height:18px;
  place-items:center;
  background:#B9F6D2;
  border:2px solid #fff;
}
.dot:after{content:"";width:7px;height:7px;background:var(--ok)}
.nav{
  display:flex;
  gap:0;
  padding:0 clamp(12px,3vw,28px);
  overflow-x:auto;
  scrollbar-width:thin;
}
.nav button{
  display:flex;
  align-items:center;
  gap:7px;
  min-height:46px;
  padding:9px 14px;
  color:#E2E8F0;
  background:#101827;
  border:0;
  border-left:1px solid #475569;
  border-top:1px solid #475569;
  font:600 13px "Fira Sans",sans-serif;
  white-space:nowrap;
  transition:background-color .18s,color .18s;
}
.nav button:last-child{border-right:1px solid #475569}
.nav button:hover{color:#fff;background:#25334A}
.nav button.on{
  color:#fff;
  background:var(--blue);
  box-shadow:inset 0 -5px 0 #fff;
}
.nav button .sym{font-size:19px}
.wrap{max-width:1440px;margin:0 auto;padding:22px clamp(12px,3vw,28px) 42px}
.scr-head{
  position:relative;
  display:grid;
  grid-template-columns:auto auto 1fr;
  align-items:end;
  gap:8px 12px;
  margin-bottom:18px;
  padding:16px 18px;
  color:#fff;
  background:var(--blue);
  border:3px solid var(--ink);
  box-shadow:var(--shadow);
}
.scr-head:after{
  content:"FCS / OPERATIONS";
  position:absolute;
  right:14px;
  top:8px;
  color:#DBEAFE;
  font:600 10px "Fira Code",monospace;
  letter-spacing:.12em;
}
.scr-head h2{margin:0;font-size:clamp(20px,2.3vw,30px);font-weight:700;line-height:1.15}
.scr-head p{margin:0 0 2px;color:#EFF6FF;font-size:13px}
.tag{
  align-self:center;
  padding:4px 8px;
  color:#111827;
  background:#fff;
  border:2px solid #111827;
  font:700 11px "Fira Code",monospace;
}
.g{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g5{grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr)}
.card{
  min-width:0;
  padding:15px;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:2px solid var(--ink);
  box-shadow:4px 4px 0 #94A3B8;
}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 5px;
  font-size:14px;
  font-weight:700;
  letter-spacing:.01em;
}
.card h3 .sym{color:var(--blue);font-size:20px}
.card .sub{margin:0 0 13px;color:var(--muted);font-size:12px}
.kpi{position:relative;min-height:126px;overflow:hidden;border-top:8px solid var(--blue)}
.kpi:nth-child(even){border-top-color:var(--color-accent)}
.kpi .lab{padding-right:40px;color:var(--muted);font-size:12px;font-weight:600}
.kpi .val{
  margin-top:8px;
  font:700 28px "Fira Code",monospace;
  letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;
}
.kpi .val small{color:var(--muted);font:600 12px "Fira Sans",sans-serif;letter-spacing:0}
.kpi .delta{
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:7px;
  font-size:12px;
  font-weight:700;
}
.kpi .ic{
  position:absolute;
  right:10px;
  top:9px;
  display:grid;
  width:36px;
  height:36px;
  place-items:center;
  color:#fff;
  background:var(--blue);
  border:2px solid var(--ink);
}
.kpi .ic .sym{font-size:20px}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--warn)}
.tw{overflow-x:auto;border:1px solid var(--line)}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:13px}
th{
  padding:9px 10px;
  color:#fff;
  background:var(--ink);
  border:1px solid #64748B;
  font-size:11px;
  font-weight:700;
  letter-spacing:.04em;
  text-align:left;
  white-space:nowrap;
}
td{
  padding:10px;
  border:1px solid var(--line);
  background:#fff;
  white-space:nowrap;
}
tbody tr:nth-child(even) td{background:#F1F5F9}
tbody tr:hover td{background:#DBEAFE}
.mono,.val,.score,.tm,.chip b,.gaxis,.mc{
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 8px;
  border:1px solid currentColor;
  font-size:11px;
  font-weight:700;
}
.pill:before{font-family:"Material Symbols Outlined";font-size:14px}
.p-ok{color:var(--ok);background:#DCFCE7}.p-ok:before{content:"check_circle"}
.p-warn{color:var(--warn);background:#FFF0D8}.p-warn:before{content:"warning"}
.p-bad{color:var(--bad);background:#FEE2E2}.p-bad:before{content:"error"}
.p-idle{color:#475569;background:#E2E8F0}.p-idle:before{content:"pause_circle"}
.bar{height:12px;min-width:72px;flex:1;overflow:hidden;background:#E2E8F0;border:1px solid #64748B}
.bar>i{display:block;height:100%;background:var(--blue)}
.split{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  padding:6px 9px;
  color:var(--muted);
  background:#fff;
  border:2px solid var(--ink);
  font-size:11px;
}
.chip b{color:var(--ink)}
.gantt{min-width:760px}
.gantt .row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.gantt .mc{width:120px;flex:none;color:var(--ink);font-size:12px;font-weight:700}
.gantt .track{
  position:relative;
  flex:1;
  height:30px;
  background:repeating-linear-gradient(90deg,#F1F5F9 0,#F1F5F9 calc(12.5% - 1px),#94A3B8 calc(12.5% - 1px),#94A3B8 12.5%);
  border:1px solid #94A3B8;
}
.gbar{
  position:absolute;
  top:3px;
  display:flex;
  align-items:center;
  height:22px;
  padding:0 6px;
  overflow:hidden;
  color:#fff;
  border:1px solid #111827;
  font:700 10px "Fira Code",monospace;
  white-space:nowrap;
}
.gchg{
  position:absolute;
  top:3px;
  height:22px;
  background:repeating-linear-gradient(45deg,#111827,#111827 3px,#CBD5E1 3px,#CBD5E1 6px);
  border:1px solid #111827;
}
.gaxis{display:flex;margin:7px 0 0 130px;color:var(--muted);font-size:10px}
.gaxis span{flex:1;text-align:left}
.board{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:10px}
.col{min-width:0;padding:9px;background:#E9EFF8;border:2px solid var(--ink)}
.col h4{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:0 0 9px;
  color:var(--muted);
  font-size:12px;
}
.col h4 b{color:var(--ink)}
.cnt{padding:2px 7px;color:#fff;background:var(--blue);border:1px solid var(--ink);font-family:"Fira Code",monospace}
.wo{margin-bottom:8px;padding:9px;background:#fff;border:2px solid var(--ink);border-left:7px solid var(--blue);box-shadow:3px 3px 0 #94A3B8}
.wo:last-child{margin-bottom:0}
.wo .t{font:700 12px "Fira Code",monospace}
.wo .m{display:flex;justify-content:space-between;gap:8px;margin-top:4px;color:var(--muted);font-size:11px}
.prow{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  margin-bottom:9px;
  padding:10px;
  background:#F8FAFC;
  border:2px solid var(--ink);
}
.prow:last-child{margin-bottom:0}
.rank{
  display:grid;
  width:34px;
  height:34px;
  flex:none;
  place-items:center;
  color:#fff;
  background:var(--blue);
  border:2px solid var(--ink);
  font:700 14px "Fira Code",monospace;
}
.prow .info{flex:1;min-width:0}
.prow .info .a{font-size:13px;font-weight:700}
.prow .info .b{margin-top:3px;color:var(--muted);font-size:11px}
.prow .score{flex:none;text-align:right}
.prow .score .s{color:var(--blue);font:700 18px "Fira Code",monospace}
.prow .score .l{color:var(--muted);font-size:10px}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:3px;background:var(--ink)}
.tl .it{position:relative;padding:0 0 15px 7px}
.tl .it:last-child{padding-bottom:0}
.tl .it:before{
  content:"";
  position:absolute;
  left:-21px;
  top:3px;
  width:12px;
  height:12px;
  background:var(--color-accent);
  border:2px solid var(--ink);
}
.tl .it .h{font-size:12px;font-weight:700}
.tl .it .d{margin-top:2px;color:var(--muted);font-size:11px}
.tl .it .tm{color:var(--blue);font-size:10px;font-weight:700}
.mx{border-collapse:separate;border-spacing:3px}
.mx th{text-align:center}
.mx td.h{color:var(--muted);font-weight:700;text-align:right}
.mx td.c{padding:9px;text-align:center;font:700 12px "Fira Code",monospace;border:2px solid var(--ink)}
.lg{display:flex;gap:14px;flex-wrap:wrap;margin-top:11px;color:var(--muted);font-size:11px}
.lg i{display:inline-block;width:13px;height:13px;margin-right:5px;vertical-align:-2px;border:1px solid var(--ink)}
.chart{width:100%}
.note{
  display:flex;
  align-items:flex-start;
  gap:7px;
  margin-top:11px;
  padding:9px;
  color:#334155;
  background:#EFF6FF;
  border-left:5px solid var(--blue);
  font-size:11px;
}
.note .sym{flex:none;color:var(--blue);font-size:16px}
.grid-item{animation:grid-in .42s both cubic-bezier(.2,.9,.3,1.25)}
.grid-item:nth-child(2){animation-delay:.05s}
.grid-item:nth-child(3){animation-delay:.1s}
.grid-item:nth-child(4){animation-delay:.15s}
@keyframes grid-in{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@media(max-width:1024px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3,.g5{grid-template-columns:1fr}
}
@media(max-width:768px){
  .tb-in{align-items:flex-start;flex-wrap:wrap}
  .live{width:100%;margin-left:54px}
  .scr-head{grid-template-columns:auto 1fr;align-items:center}
  .scr-head p{grid-column:1/-1}
  .g2{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(2,minmax(180px,1fr))}
}
@media(max-width:480px){
  .brand small{white-space:normal}
  .live{margin-left:0;font-size:10px}
  .nav button{padding:9px 11px}
  .nav button .lbl{display:none}
  .kpis{grid-template-columns:1fr}
  .scr-head{padding-top:28px}
  .scr-head:after{left:17px;right:auto}
  .card{padding:12px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .grid-item{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="tb-in">
    <div class="brand">
      <div class="logo" aria-hidden="true"><span class="sym">view_timeline</span></div>
      <div><b>FCS 有限產能排程</b><small>Finite Capacity Scheduling · 楠亭一廠</small></div>
    </div>
    <div class="live"><span class="dot" aria-hidden="true"></span>排程引擎在線 · 2026-08-13 08:40</div>
  </div>
  <nav class="nav" id="nav" aria-label="系統功能"></nav>
</header>
<main class="wrap"><div id="view"></div></main>
<script>
var CH=[];
function killCharts(){CH.forEach(function(c){try{c.destroy()}catch(e){}});CH=[]}
var MODS=[
 {ic:"precision_manufacturing",name:"設備產能建模"},
 {ic:"low_priority",name:"訂單優先序"},
 {ic:"auto_awesome",name:"排程演算"},
 {ic:"view_timeline",name:"排程甘特圖"},
 {ic:"cached",name:"換線負載分析"},
 {ic:"assignment_turned_in",name:"現場派工"}
];
function head(t,d,v){return '<div class="scr-head grid-item"><h2>'+t+'</h2><span class="tag">'+v+'</span><p>'+d+'</p></div>'}
function barc(p){return '<div class="bar" role="progressbar" aria-label="負載 '+p+'%" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+p+'"><i style="width:'+p+'%"></i></div>'}
function kpi(lab,val,ic,unit,dir,delta){
 var cls=dir==="up"?"up":dir==="down"?"down":"flat";
 var arrow=dir==="up"?"trending_up":dir==="down"?"trending_down":"trending_flat";
 return '<div class="card kpi grid-item"><div class="ic" aria-hidden="true"><span class="sym">'+ic+'</span></div><div class="lab">'+lab+'</div><div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div><div class="delta '+cls+'"><span class="sym" aria-hidden="true" style="font-size:15px">'+arrow+'</span>'+delta+'</div></div>'
}
function s0(){
 var eq=[
  {id:"CNC-01",nm:"CNC 加工中心 A",cap:960,used:842,shift:"三班",cal:"日曆-A"},
  {id:"CNC-02",nm:"CNC 加工中心 B",cap:960,used:918,shift:"三班",cal:"日曆-A"},
  {id:"MILL-03",nm:"精密銑床 03",cap:640,used:401,shift:"二班",cal:"日曆-B"},
  {id:"LATH-05",nm:"數控車床 05",cap:640,used:612,shift:"二班",cal:"日曆-B"},
  {id:"GRND-07",nm:"平面磨床 07",cap:480,used:212,shift:"一班",cal:"日曆-C"},
  {id:"WELD-09",nm:"自動焊接線 09",cap:720,used:690,shift:"三班",cal:"日曆-A"},
  {id:"COAT-11",nm:"表面塗裝 11",cap:560,used:398,shift:"二班",cal:"日曆-B"}
 ];
 var rows=eq.map(function(e){
  var pct=Math.round(e.used/e.cap*100),pc=pct>=95?"p-bad":pct>=85?"p-warn":pct<45?"p-idle":"p-ok";
  var st=pct>=95?"超載":pct>=85?"高載":pct<45?"閒置":"正常";
  return '<tr><td class="mono"><b>'+e.id+'</b></td><td>'+e.nm+'</td><td>'+e.shift+'</td><td class="mono">'+e.cal+'</td><td class="mono">'+e.cap.toLocaleString("zh-Hant")+' 分</td><td class="mono">'+e.used.toLocaleString("zh-Hant")+' 分</td><td><div class="split" style="align-items:center">'+barc(pct)+'<span class="mono">'+pct+'%</span></div></td><td><span class="pill '+pc+'">'+st+'</span></td></tr>'
 }).join("");
 return head("設備產能建模","設備級可用產能、班別日曆與換線時間矩陣，作為排程能力上限基礎。","v0")
 +'<div class="g kpis" style="margin-bottom:14px">'+kpi("設備台數","7","precision_manufacturing","台","flat","3 條產線")+kpi("今日可用產能","4,960","bolt","分","up","+320 分 vs 昨")+kpi("平均稼動率","82.6","monitoring","%","up","+4.1%")+kpi("超載設備","2","warning","台","down","需重排")+'</div>'
 +'<div class="g g3"><div class="card grid-item"><h3><span class="sym">table_chart</span>設備產能建檔表</h3><p class="sub">可用產能 = 班別工時 − 計畫停機 − 換線預留</p><div class="tw"><table><thead><tr><th>設備</th><th>名稱</th><th>班別</th><th>日曆</th><th>可用</th><th>已排</th><th>負載</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'
 +'<div class="card grid-item"><h3><span class="sym">calendar_month</span>班別日曆</h3><p class="sub">本週產能班表</p>'+calGrid()+'<div class="lg"><span><i style="background:#2563EB"></i>三班</span><span><i style="background:#3B82F6"></i>二班</span><span><i style="background:#64748B"></i>一班</span><span><i style="background:#CBD5E1"></i>休</span></div></div></div>'
}
function calGrid(){
 var days=["一","二","三","四","五","六","日"],pat=[3,3,2,3,2,1,0],cols={3:"#2563EB",2:"#3B82F6",1:"#64748B",0:"#CBD5E1"};
 return '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px">'+days.map(function(d,i){var v=pat[i];return '<div style="text-align:center"><div style="font-size:11px;color:var(--muted);margin-bottom:5px">'+d+'</div><div style="height:46px;background:'+cols[v]+';border:2px solid var(--ink);display:grid;place-items:center;font-size:11px;font-weight:700;color:'+(v?"#fff":"#1E293B")+'">'+(v?v+"班":"休")+'</div></div>'}).join("")+'</div>'
}
function s1(){
 var ord=[
  {wo:"WO-24118",item:"閥體 V-330",qty:1200,due:"07-22",cust:"AA 集團",w:9.4,late:true,mat:"齊料"},
