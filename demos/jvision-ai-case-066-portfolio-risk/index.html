<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>投資風險羅盤 · Portfolio Risk Compass</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
--color-primary:#F59E0B;--color-on-primary:#0F172A;
--color-secondary:#FBBF24;--color-on-secondary:#0F172A;
--color-accent:#8B5CF6;--color-on-accent:#000;
--color-background:#0F172A;--color-foreground:#F8FAFC;
--color-card:#222735;--color-card-foreground:#F8FAFC;
--color-muted:#272F42;--color-muted-foreground:#AAB7CA;
--color-border:#334155;--color-destructive:#EF4444;
--color-on-destructive:#000;--color-ring:#F59E0B;
--blue:#F59E0B;--ink:#F8FAFC;--muted:#AAB7CA;--line:#334155;
--ok:#4ADE80;--warn:#FBBF24;--bad:#FB7185;--vio:#A78BFA;
--mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace
}
*{box-sizing:border-box}
html{color-scheme:dark;scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"IBM Plex Sans",sans-serif;font-size:14px;line-height:1.5}
button,input{font:inherit}
button,a,input{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.material-symbols-outlined{font-size:19px;line-height:1;vertical-align:middle}
.top{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:auto auto 1fr;align-items:center;gap:22px;padding:12px 24px;background:rgba(15,23,42,.97);border-bottom:1px solid var(--line);box-shadow:0 8px 20px rgba(0,0,0,.16)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{display:grid;place-items:center;width:40px;height:40px;flex:none;border:1px solid var(--color-primary);border-radius:5px;background:var(--color-primary);color:var(--color-on-primary);font-weight:700;box-shadow:5px 5px 0 rgba(245,158,11,.18)}
.brand b{display:block;font-size:15px;letter-spacing:.02em}
.brand small{display:block;color:var(--muted);font-size:9px;font-weight:600;letter-spacing:.16em}
.tick{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:4px;background:var(--color-card);color:var(--muted);font-size:11px;white-space:nowrap}
.tick i{width:8px;height:8px;border:2px solid var(--ok);border-radius:50%;background:transparent;animation:pulse 1.8s ease-in-out infinite}
.nav{display:flex;justify-content:flex-end;gap:3px;min-width:0}
.nav button{display:flex;align-items:center;gap:6px;min-height:40px;padding:8px 10px;border:1px solid transparent;border-radius:4px;background:transparent;color:var(--muted);font-weight:600;font-size:12px;transition:background .2s,border-color .2s,color .2s,transform .2s}
.nav button:hover{border-color:var(--line);background:var(--color-muted);color:var(--ink)}
.nav button.on{border-color:var(--color-primary);background:var(--color-primary);color:var(--color-on-primary)}
.wrap{width:min(1380px,100%);margin:auto;padding:22px 24px 42px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.vh h1{margin:0;font-size:clamp(22px,2vw,30px);line-height:1.15;letter-spacing:-.025em}
.vh p{max-width:720px;margin:5px 0 0;color:var(--muted);font-size:13px}
.pill,.tag{display:inline-flex;align-items:center;gap:5px;border:1px solid currentColor;border-radius:999px;font-weight:700;white-space:nowrap}
.pill{padding:6px 11px;background:rgba(245,158,11,.1);color:#FFD66B;font-size:12px}
.view{display:none}.view.on{display:block;animation:reveal .35s ease-out}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.kpi,.card,.gz,.so,.cz,.kc{border:1px solid var(--line);background:var(--color-card)}
.kpi{position:relative;padding:14px 15px;border-radius:5px;box-shadow:0 5px 14px rgba(0,0,0,.1);transition:border-color .2s,transform .2s}
.kpi:hover{border-color:#64748B;transform:translateY(-2px)}
.kpi:before{position:absolute;top:-1px;left:-1px;width:38px;height:3px;background:var(--color-primary);content:""}
.kpi .l,.so .l{color:var(--muted);font-size:11px;font-weight:600}
.kpi .v{margin-top:4px;font-size:25px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.kpi .d{margin-top:3px;font-size:11px;font-weight:600}
.up{color:#86EFAC}.dn{color:#FDA4AF}
.grid{display:grid;gap:12px}.grid>*{min-width:0}
.g2{grid-template-columns:1.4fr .9fr}.g11{grid-template-columns:1fr 1fr}
.card{padding:15px;border-radius:5px;box-shadow:0 7px 18px rgba(0,0,0,.12)}
.card h2{display:flex;align-items:center;gap:7px;margin:0 0 13px;color:var(--ink);font-size:13px;letter-spacing:.01em}
.card h2 .material-symbols-outlined{color:var(--color-primary)}
.chart{height:240px;min-width:0}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:3px}
table.data{width:100%;border-collapse:collapse;font-size:12px}
table.data th,table.data td{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{position:sticky;top:0;z-index:1;background:#192133;color:#C9D4E4;font-size:11px;font-weight:600;letter-spacing:.025em}
table.data tbody tr:last-child td{border-bottom:0}
table.data tbody tr{transition:background .18s}
table.data tbody tr:hover{background:#293247}
table.data td:nth-child(2){font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{text-align:right!important;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tag{padding:2px 7px;font-size:10px}
.t-r{background:rgba(239,68,68,.12);color:#FDA4AF}.t-a{background:rgba(245,158,11,.12);color:#FCD34D}
.t-b{background:rgba(139,92,246,.13);color:#C4B5FD}.t-g{background:rgba(74,222,128,.1);color:#86EFAC}
.legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:7px;color:var(--muted);font-size:11px}
.legend span{display:flex;align-items:center;gap:5px}.dot{width:9px;height:9px;border-radius:2px}
.fi{display:flex;gap:10px;margin-bottom:8px;padding:10px;border:1px solid var(--line);border-left:4px solid var(--color-accent);border-radius:3px;background:#1B2231}
.fi.r{border-left-color:var(--bad)}.fi.a{border-left-color:var(--warn)}.fi.g{border-left-color:var(--ok)}
.fi .material-symbols-outlined{flex:none;color:var(--color-accent)}.fi.r .material-symbols-outlined{color:var(--bad)}.fi.a .material-symbols-outlined{color:var(--warn)}.fi.g .material-symbols-outlined{color:var(--ok)}
.fi b{font-size:12px}.fi small{display:block;margin-top:2px;color:var(--muted);font-size:10px}
.bars,.ctrl{display:flex;flex-direction:column;gap:10px}
.br{display:grid;grid-template-columns:88px 1fr 48px;align-items:center;gap:10px;font-size:12px}
.track{height:10px;overflow:hidden;border:1px solid var(--line);border-radius:2px;background:#151C2A}.track i{display:block;height:100%}
.val{font-family:var(--mono);font-weight:700;text-align:right}
.gauge{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-bottom:12px}
.gz{padding:13px;border-radius:4px;text-align:center}.gl{min-height:34px;color:var(--muted);font-size:11px}.gv{font-family:var(--mono);font-size:22px;font-weight:700}.gs{font-size:10px;font-weight:600}
.sim{display:grid;grid-template-columns:.8fr 1.3fr;gap:12px}.sim>*{min-width:0}
.cz{padding:11px;border-radius:4px;background:#1B2231}.lab{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;font-size:12px}.lab span{color:#FCD34D;font-family:var(--mono);font-weight:700}
input[type=range]{width:100%;accent-color:var(--color-primary)}
.rangewrap small{display:flex;justify-content:space-between;color:var(--muted);font-size:9px}
.simout{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.so{padding:11px;border-radius:4px;background:#1B2231}.so .v{margin-top:3px;font-family:var(--mono);font-size:18px;font-weight:700}
.kb{display:grid;gap:8px}.kc{padding:11px;border-radius:4px;background:#1B2231}.kc .material-symbols-outlined{color:var(--color-primary)}.kc b{display:block;margin:5px 0 3px;font-size:12px}.kc p{margin:0;color:var(--muted);font-size:11px}.kc .mt{margin-top:5px;color:#FCD34D;font-size:10px;font-weight:600}
.mono{font-family:var(--mono)}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}
@media(max-width:1100px){.top{grid-template-columns:auto 1fr}.tick{display:none}.nav{grid-column:1/-1;justify-content:flex-start;overflow:auto}.gauge{grid-template-columns:repeat(3,1fr)}}
@media(max-width:768px){.wrap{padding:16px}.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g11,.sim{grid-template-columns:1fr}.vh{align-items:flex-start;flex-direction:column}.gauge{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.top{padding:10px 14px}.brand small{display:none}.nav button{min-width:42px;justify-content:center}.nav button span:last-child{display:none}.wrap{padding:14px 10px 30px}.kpis{gap:7px}.kpi{padding:12px}.kpi .v{font-size:21px}.card{padding:11px}.chart{height:220px}.pill{font-size:10px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
<div class="brand"><div class="logo" aria-hidden="true">羅</div><div><b>投資風險羅盤</b><small>PORTFOLIO RISK COMPASS</small></div></div>
<div class="tick"><i aria-hidden="true"></i><span>系統正常 · 組合市值 NT$ 4.82B · 即時</span></div>
<nav class="nav" id="nav" aria-label="主要功能"></nav>
</header>
<main class="wrap">
<header class="vh"><div><h1 id="vt">投資總覽</h1><p id="vd"></p></div><div class="pill" id="badge">組合報酬 +11.4%</div></header>
<div id="view"></div>
</main>
<script>
const MOD=[
["投資總覽","dashboard","投資總覽","組合市值、報酬與風險輪廓的即時儀表板"],
["投資組合","account_balance_wallet","投資組合部位","逐檔持股、債券與基金部位、損益與權重"],
["資產配置","donut_large","資產配置","各資產類別權重、目標偏離與再平衡建議"],
["風險指標","shield","風險指標","VaR、波動度、Beta、Sharpe 與風險雷達"],
["壓力測試","science","情境壓力測試","市場情境衝擊下的組合潛在損失模擬"],
["績效報表","insights","績效歸因報表","報酬走勢、資產貢獻拆解與風險調整績效"]];
const BADGE=["組合報酬 +11.4%","部位 42 檔 · 3 檔超限","股票 52% · 偏離 +4pt","VaR(95) NT$ 96M","5 情境 · 最壞 -18.6%","年化 Sharpe 1.42"];
const HOLD=[["O晶電","9301","股票 · 半導體","NT$ 862M",17.9,"+24.6%","g"],["O昕科","9302","股票 · 半導體","NT$ 318M",6.6,"+12.1%","g"],["美國10年公債","UST10","債券 · 政府","NT$ 640M",13.3,"+3.2%","b"],["O通電","9304","股票 · 電信","NT$ 246M",5.1,"+6.8%","b"],["元O高股息","0091","ETF · 高股息","NT$ 288M",6,"+9.4%","b"],["蘋果 AAPL","AAPL","股票 · 科技","NT$ 372M",7.7,"+18.3%","g"],["投等公司債","IGCB","債券 · 公司","NT$ 410M",8.5,"+1.6%","b"],["長O","9303","股票 · 航運","NT$ 184M",3.8,"-11.2%","r"],["黃金 ETF","GLD","另類 · 商品","NT$ 220M",4.6,"+7.9%","b"],["貨幣市場","CASH","現金 · 短期","NT$ 468M",9.7,"+1.1%","b"]];
const ALLOC=[["股票",52,48,"#F59E0B"],["債券",24,28,"#FBBF24"],["ETF/基金",9,10,"#8B5CF6"],["另類資產",5,6,"#A78BFA"],["現金",10,8,"#4ADE80"]];
const ALERTS=[["長O 2603 單日 -6.4%","航運部位波動放大，佔組合 3.8%，觸發個股波動告警","r","12 分鐘前"],["半導體產業曝險 24.5%","超過單一產業 20% 集中度上限，建議分散","a","1 小時前"],["O晶電 2330 權重 17.9%","逼近單一標的 18% 上限，需注意再平衡","a","2 小時前"],["組合 Beta 回落至 0.94","市場敏感度下降，防禦性配置生效","g","昨日"]];
const STRESS=[["2008 金融海嘯","股 -42% / 債 +8%","-18.6%","NT$ -896M","嚴重","t-r"],["2020 疫情急跌","股 -30% / 債 +5%","-13.1%","NT$ -632M","嚴重","t-r"],["升息 100bp","債 -6% / 股 -8%","-6.4%","NT$ -308M","中度","t-a"],["科技股回檔 20%","科技 -20%","-9.2%","NT$ -444M","中度","t-a"],["新台幣升值 5%","海外部位 -5%","-2.3%","NT$ -111M","輕微","t-b"]];
const nav=document.getElementById("nav"),view=document.getElementById("view");
MOD.forEach((m,i)=>{let b=document.createElement("button");b.type="button";b.dataset.i=i;b.setAttribute("aria-label",m[0]);b.innerHTML=`<span class="material-symbols-outlined" aria-hidden="true">${m[1]}</span><span>${m[0]}</span>`;b.onclick=()=>{location.hash="v"+i};nav.append(b)});

const kpi=(l,v,d,c="")=>`<div class="kpi"><div class="l">${l}</div><div class="v" style="${c}">${v}</div><div class="d ${d.includes("▲")?"up":"dn"}">${d}</div></div>`;
const head=t=>`<h2><span class="material-symbols-outlined" aria-hidden="true">${t[0]}</span>${t[1]}</h2>`;
const alertHTML=()=>ALERTS.map(x=>`<div class="fi ${x[2]}"><span class="material-symbols-outlined" aria-hidden="true">${x[2]=="r"?"error":x[2]=="a"?"warning":"check_circle"}</span><div><b>${x[0]}</b><small>${x[1]} · ${x[3]}</small></div></div>`).join("");

const SCREENS=[
()=>`<div class="kpis">${kpi("組合總市值",'4.82<small>B</small>',"▲ 年初至今 +11.4%")}${kpi("當日損益",'+18.3<small>M</small>',"▲ +0.38%","color:#86EFAC")}${kpi("VaR(95,1日)",'96<small>M</small>',"佔市值 2.0%","color:#FDA4AF")}${kpi("超限警示","3","集中度 2 · 波動 1","color:#FCD34D")}</div><div class="grid g2"><section class="card">${head(["donut_large","資產配置 · 各類別權重"])}<div class="chart" id="c_pie"></div><div class="legend"><span><i class="dot" style="background:#F59E0B"></i>股票</span><span><i class="dot" style="background:#FBBF24"></i>債券</span><span><i class="dot" style="background:#8B5CF6"></i>ETF/基金</span><span><i class="dot" style="background:#A78BFA"></i>另類</span><span><i class="dot" style="background:#4ADE80"></i>現金</span></div></section><section class="card">${head(["notifications_active","風險預警快訊"])}${alertHTML()}</section></div>`,
()=>`<section class="card">${head(["account_balance_wallet",'投資組合部位明細 <span class="tag t-r" style="margin-left:auto">虧損 1</span><span class="tag t-a">超限 1</span>'])}<div class="scroll"><table class="data"><thead><tr><th>標的</th><th>代碼</th><th>類別</th><th class="num">市值</th><th class="num">權重</th><th class="num">未實現損益</th><th>狀態</th></tr></thead><tbody>${HOLD.map(x=>{let s=x[4]>=15?["超限","t-a"]:x[6]=="r"?["觀察","t-r"]:["正常","t-g"];return`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td>${x[2]}</td><td class="num">${x[3]}</td><td class="num">${x[4]}%</td><td class="num">${x[5]}</td><td><span class="tag ${s[1]}">${s[0]}</span></td></tr>`}).join("")}</tbody></table></div><div class="grid g11" style="margin-top:12px"><section class="card">${head(["bar_chart","各標的權重佔比"])}<div class="chart" id="c_wt"></div></section><section class="card">${head(["rule","部位管理規則"])}${[["LMT-01","單一標的權重上限 18%，逾限觸發再平衡","O晶電 17.9% 逼近"],["LMT-02","單一產業曝險上限 20%","半導體 24.5% 已超限"],["LMT-03","組合回撤逾 8% 啟動下檔保護","目前 -3.1% 安全"]].map(r=>`<div class="cz" style="margin-bottom:8px"><div class="lab"><b class="mono">${r[0]}</b><span class="tag t-b">${r[2]}</span></div><small style="color:var(--muted)">${r[1]}</small></div>`).join("")}</section></div></section>`,
()=>`<div class="grid g2"><section class="card">${head(["donut_large","資產配置 · 實際 vs 目標"])}<div class="chart" id="c_alloc"></div></section><section class="card">${head(["balance","目標偏離與再平衡"])}<div class="bars">${ALLOC.map(x=>`<div class="br"><b>${x[0]}</b><div class="track"><i style="width:${x[1]}%;background:${x[3]}"></i></div><span class="val">${x[1]}%</span></div>`).join("")}</div><div class="scroll" style="margin-top:15px"><table class="data"><thead><tr><th>資產類別</th><th class="num">實際</th><th class="num">目標</th><th class="num">偏離</th><th>建議</th></tr></thead><tbody>${ALLOC.map(x=>{let d=x[1]-x[2];return`<tr><td>${x[0]}</td><td class="num">${x[1]}%</td><td class="num">${x[2]}%</td><td class="num">${d>0?"+":""}${d}pt</td><td>${d>=3?"減碼":d<=-3?"加碼":"維持"}</td></tr>`}).join("")}</tbody></table></div></section></div>`,
()=>`<div class="gauge">${[["VaR (95% / 1日)","NT$ 96M","佔市值 2.0%","FDA4AF"],["年化波動度","14.2%","中度風險","FCD34D"],["組合 Beta","0.94","低於大盤","86EFAC"],["Sharpe 比率","1.42","風險調整優","86EFAC"],["最大回撤","-8.7%","近12月","FDA4AF"],["追蹤誤差","3.1%","相對基準","C4B5FD"]].map(x=>`<div class="gz"><div class="gl">${x[0]}</div><div class="gv" style="color:#${x[3]}">${x[1]}</div><div class="gs">${x[2]}</div></div>`).join("")}</div><div class="grid g2"><section class="card">${head(["radar","風險維度雷達 · 組合 vs 基準"])}<div class="chart" id="c_radar"></div></section><section class="card">${head(["insights","風險貢獻拆解（邊際 VaR）"])}<div class="chart" id="c_mvar"></div></section></div>`,
()=>`<div class="sim"><section class="card">${head(["tune","情境參數設定"])}<div class="ctrl">${[["eq","股市衝擊",-50,10,-20,1,"%"],["rt","利率變動",-100,300,100,25,"bp"],["cr","信用利差",0,300,50,25,"bp"],["fx","匯率變動",-10,10,-3,1,"%"]].map(x=>`<div class="cz rangewrap"><div class="lab"><b>${x[1]}</b><span id="l_${x[0]}"></span></div><input aria-label="${x[1]}" type="range" id="r_${x[0]}" min="${x[2]}" max="${x[3]}" value="${x[4]}" step="${x[5]}"><small><span>${x[2]}${x[6]}</span><span>+${x[3]}${x[6]}</span></small></div>`).join("")}</div></section><section class="card">${head(["science","組合壓力測試結果"])}<div class="chart" id="c_sim"></div><div class="simout"><div class="so"><div class="l">組合預估損益</div><div class="v" id="o_pnl">—</div></div><div class="so"><div class="l">預估報酬率</div><div class="v" id="o_ret">—</div></div><div class="so"><div class="l">壓力後 VaR</div><div class="v" id="o_var">—</div></div><div class="so"><div class="l">系統研判</div><div class="v" id="o_adv">—</div></div></div></section></div><section class="card" style="margin-top:12px">${head(["history_edu","預設歷史情境重演"])}<div class="scroll"><table class="data"><thead><tr><th>情境</th><th>假設</th><th class="num">組合報酬</th><th class="num">潛在損失</th><th>等級</th></tr></thead><tbody>${STRESS.map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td class="num">${x[2]}</td><td class="num">${x[3]}</td><td><span class="tag ${x[5]}">${x[4]}</span></td></tr>`).join("")}</tbody></table></div></section>`,
()=>`<div class="kpis">${kpi("年初至今報酬","+11.4%","▲ 勝基準 +2.8pt")}${kpi("年化 Sharpe","1.42","▲ 風險調整佳")}${kpi("Alpha (年化)","+3.1%","▲ 主動報酬")}${kpi("股息殖利率","3.8%","▲ 現金流穩定")}</div><div class="grid g2"><section class="card">${head(["show_chart","累積報酬 · 組合 vs 基準"])}<div class="chart" id="c_perf"></div></section><section class="card">${head(["auto_awesome","AI 風險與配置建議"])}<div class="kb">${[["balance","集中度再平衡","單一標的逾 18% 或產業逾 20% 時觸發，提出分批減碼與替代標的建議，附風險預算試算。","引用 16 次"],["trending_down","下檔保護對策","組合回撤逼近 -8% 停損線時，建議提高債券與現金配置或加掛避險部位。","引用 11 次"],["percent","收益率增益","低波段建議配置高股息與投等債，維持組合現金流並降低整體波動。","引用 8 次"],["public","匯率曝險控管","海外部位淨曝險逾 40% 時建議部分匯率避險，降低匯損對報酬的侵蝕。","引用 7 次"]].map(x=>`<div class="kc"><span class="material-symbols-outlined">${x[0]}</span><b>${x[1]}</b><p>${x[2]}</p><div class="mt">${x[3]}</div></div>`).join("")}</div></section></div><section class="card" style="margin-top:12px">${head(["stacked_bar_chart","資產類別報酬貢獻歸因"])}<div class="chart" id="c_attr"></div></section>`
];

const AX="#AAB7CA",LN="#334155",TT={backgroundColor:"#192133",borderColor:LN,textStyle:{color:"#F8FAFC"}};
const axis=()=>({axisLabel:{color:AX,fontSize:10},axisLine:{lineStyle:{color:LN}},splitLine:{lineStyle:{color:LN}}});
let charts=[];
function chart(id,opt){let el=document.getElementById(id);if(!el)return;let c=echarts.init(el);c.setOption(opt);charts.push(c)}
function draw(i){
charts.forEach(c=>c.dispose());charts=[];
if(i===0)chart("c_pie",{tooltip:{...TT,trigger:"item"},series:[{type:"pie",radius:["48%","74%"],label:{color:"#F8FAFC",formatter:"{b}\n{d}%"},data:ALLOC.map(x=>({name:x[0],value:x[1],itemStyle:{color:x[3]}}))}]});
if(i===1)chart("c_wt",{grid:{left:42,right:10,top:10,bottom:42},tooltip:{...TT,trigger:"axis"},xAxis:{type:"category",data:HOLD.map(x=>x[1]),axisLabel:{color:AX,rotate:35}},yAxis:{type:"value",...axis()},series:[{type:"bar",data:HOLD.map(x=>({value:x[4],itemStyle:{color:x[4]>=15?"#F59E0B":x[6]=="r"?"#EF4444":"#8B5CF6"}}))}]});
if(i===2)chart("c_alloc",{tooltip:{...TT,trigger:"axis"},legend:{textStyle:{color:AX}},xAxis:{type:"category",data:ALLOC.map(x=>x[0]),...axis()},yAxis:{type:"value",...axis()},series:[{name:"實際",type:"bar",data:ALLOC.map(x=>x[1]),itemStyle:{color:"#F59E0B"}},{name:"目標",type:"bar",data:ALLOC.map(x=>x[2]),itemStyle:{color:"#8B5CF6"}}]});
if(i===3){
chart("c_radar",{tooltip:TT,radar:{indicator:["波動度","集中度","市場Beta","流動性","信用風險","匯率曝險"].map(name=>({name,max:100})),axisName:{color:"#F8FAFC"},splitLine:{lineStyle:{color:LN}},axisLine:{lineStyle:{color:LN}}},series:[{type:"radar",data:[{value:[58,72,47,80,35,52],name:"本組合",itemStyle:{color:"#F59E0B"},areaStyle:{color:"rgba(245,158,11,.2)"}},{value:[65,55,60,70,45,40],name:"市場基準",itemStyle:{color:"#8B5CF6"}}]}]});
let d=[["O晶電",34],["半導體其他",18],["美債",6],["公司債",9],["航運",14],["科技海外",12],["另類",7]];
chart("c_mvar",{grid:{left:80,right:15,top:10,bottom:25},tooltip:{...TT,trigger:"axis"},xAxis:{type:"value",...axis()},yAxis:{type:"category",data:d.map(x=>x[0]).reverse(),axisLabel:{color:AX}},series:[{type:"bar",data:d.map(x=>x[1]).reverse(),itemStyle:{color:"#F59E0B"}}]})
}
if(i===4)bindSim();
if(i===5){
chart("c_perf",{grid:{left:42,right:12,top:30,bottom:28},tooltip:{...TT,trigger:"axis"},legend:{textStyle:{color:AX}},xAxis:{type:"category",boundaryGap:false,data:["1月","2月","3月","4月","5月","6月","7月","8月"],...axis()},yAxis:{type:"value",...axis()},series:[{name:"本組合%",type:"line",data:[0,2.1,3.4,5.8,6.2,8.9,10.1,11.4],lineStyle:{color:"#F59E0B",width:3},itemStyle:{color:"#F59E0B"}},{name:"市場基準%",type:"line",data:[0,1.8,2.6,4.1,4.4,6.2,7.5,8.6],lineStyle:{color:"#8B5CF6",width:2},itemStyle:{color:"#8B5CF6"}}]});
chart("c_attr",{grid:{left:42,right:12,top:20,bottom:25},tooltip:{...TT,trigger:"axis"},xAxis:{type:"category",data:["股票","債券","ETF/基金","另類","現金"],...axis()},yAxis:{type:"value",...axis()},series:[{type:"bar",data:[7.8,1.6,.9,.6,.5],itemStyle:{color:"#F59E0B"},label:{show:true,position:"top",color:"#F8FAFC"}}]})
}}
function bindSim(){
const e=["eq","rt","cr","fx"].map(x=>document.getElementById("r_"+x)),c=echarts.init(document.getElementById("c_sim"));charts.push(c);
function calc(){
let [eq,rt,cr,fx]=e.map(x=>+x.value),parts=[4820*.61*eq/100,4820*.235*(-(rt/100+cr/100)*.06),4820*.42*fx/100],p=parts.reduce((a,b)=>a+b,0),r=p/48.2,v=96*(1+Math.abs(eq/100)*2.2+Math.abs(rt)/300);
["eq","rt","cr","fx"].forEach((x,j)=>document.getElementById("l_"+x).textContent=(e[j].value>=0?"+":"")+e[j].value+(j===1||j===2?"bp":"%"));
document.getElementById("o_pnl").textContent=`NT$ ${p>=0?"+":""}${p.toFixed(0)}M`;document.getElementById("o_ret").textContent=`${r>=0?"+":""}${r.toFixed(1)}%`;document.getElementById("o_var").textContent=`NT$ ${v.toFixed(0)}M`;document.getElementById("o_adv").textContent=r<-15?"嚴重 · 建議啟動避險":r<-8?"中度 · 提高現金部位":r<-3?"可承受 · 密切監控":"風險可控";
c.setOption({grid:{left:45,right:10,top:15,bottom:25},tooltip:{...TT,trigger:"axis"},xAxis:{type:"category",data:["股票","債券","匯率","合計"],...axis()},yAxis:{type:"value",...axis()},series:[{type:"bar",data:[...parts,p].map((x,j)=>({value:+x.toFixed(0),itemStyle:{color:x>=0?"#4ADE80":j===3?"#EF4444":"#F59E0B"}})),label:{show:true,position:"top",color:"#F8FAFC"}}]})
}e.forEach(x=>x.addEventListener("input",calc));calc()
}
function show(i){
i=Math.max(0,Math.min(5,i));
nav.querySelectorAll("button").forEach(b=>{let on=+b.dataset.i===i;b.classList.toggle("on",on);b.setAttribute("aria-current",on?"page":"false")});
document.getElementById("vt").textContent=MOD[i][2];document.getElementById("vd").textContent=MOD[i][3];document.getElementById("badge").textContent=BADGE[i];view.innerHTML=`<div class="view on" data-i="${i}">${SCREENS[i]()}</div>`;requestAnimationFrame(()=>draw(i))
}
function fromHash(){let m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?+m[1]:0)}
addEventListener("hashchange",fromHash);addEventListener("resize",()=>charts.forEach(c=>c.resize()),{passive:true});fromHash();
</script>
</body>
</html>
