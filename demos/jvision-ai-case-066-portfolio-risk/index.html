<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>投資風險羅盤 · Portfolio Risk Compass</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--accent:#38bdf8;--accent2:#0ea5e9;--bg:#0b1220;--panel:#111c31;--panel2:#0d1728;--line:#1d2c44;--ink:#e6eef8;--mut:#8296b3;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--vio:#a78bfa}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.top{background:linear-gradient(90deg,#0a1526,#12213a);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:11px 20px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:900;color:#031321;flex:none;box-shadow:0 0 20px rgba(56,189,248,.5)}
.brand b{font-size:15px;font-weight:800;display:block;font-family:"Noto Sans TC"}
.brand span{font-size:10px;color:var(--accent);letter-spacing:2px}
.tick{margin-left:14px;display:flex;align-items:center;gap:7px;background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.3);padding:5px 11px;border-radius:8px;font-size:11.5px;font-weight:700;color:#7dd3fc;white-space:nowrap;min-width:0}
.tick i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;animation:bl 1.6s infinite}
@keyframes bl{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(34,197,94,.5)}50%{opacity:.4;box-shadow:0 0 0 5px rgba(34,197,94,0)}}
.nav{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap;min-width:0}
.nav button{border:0;background:transparent;color:var(--mut);font:inherit;font-weight:600;font-size:13px;padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:#182640;color:var(--ink)}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#031321}
.wrap{max-width:1300px;margin:0 auto;padding:20px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:20px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.pill{background:rgba(56,189,248,.18);color:#7dd3fc;border:1px solid rgba(56,189,248,.4);padding:6px 13px;border-radius:8px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:7px;white-space:nowrap}
.view{display:none;animation:f .3s}
.view.on{display:block}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 15px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,rgba(56,189,248,.16),transparent 70%)}
.kpi .l{font-size:11.5px;color:var(--mut);font-weight:600}
.kpi .v{font-size:24px;font-weight:800;margin-top:3px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.up{color:#86efac}.dn{color:#fca5a5}
.grid{display:grid;gap:15px}.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .9fr}
.g11{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px}
.card h3{margin:0 0 12px;font-size:13.5px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap;color:var(--ink)}
.card h3 .material-symbols-outlined{color:var(--accent)}
.chart{height:230px}
.tag{font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;white-space:nowrap}
.t-r{background:rgba(239,68,68,.2);color:#fca5a5}.t-a{background:rgba(245,158,11,.2);color:#fcd34d}.t-b{background:rgba(56,189,248,.2);color:#7dd3fc}.t-g{background:rgba(34,197,94,.2);color:#86efac}.t-v{background:rgba(167,139,250,.2);color:#c4b5fd}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px}
table.data tr:hover td{background:var(--panel2)}
.num{font-family:Inter;font-weight:700;text-align:right}
.scroll{overflow-x:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:6px}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.bars{display:flex;flex-direction:column;gap:11px}
.br{display:grid;grid-template-columns:96px 1fr 60px;align-items:center;gap:10px;font-size:12px}
.br b{font-family:"Noto Sans TC";font-weight:700}
.br .track{height:12px;background:#16233b;border-radius:6px;overflow:hidden}
.br .track i{display:block;height:100%;border-radius:6px}
.br .val{font-family:Inter;font-weight:800;text-align:right}
.prod{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:13px}
.pc{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:14px;position:relative;overflow:hidden}
.pc .top2{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pc b{font-family:"Noto Sans TC";font-size:14px}
.pc .sku{font-size:10.5px;color:var(--mut);font-family:Inter}
.pc .mg{font-family:Inter;font-size:22px;font-weight:900}
.pc small{color:var(--mut);font-size:11px;display:block;margin-top:4px}
.pc .bar{height:6px;background:#16233b;border-radius:4px;overflow:hidden;margin-top:9px}
.pc .bar i{display:block;height:100%}
.sim{display:grid;grid-template-columns:1fr 1.2fr;gap:15px}.sim>*{min-width:0}
.ctrl{display:flex;flex-direction:column;gap:14px}
.cz{border:1px solid var(--line);border-radius:11px;padding:12px 13px;background:var(--panel2)}
.cz .lab{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px}
.cz .lab b{font-family:"Noto Sans TC"}
.cz .lab span{font-family:Inter;font-weight:800;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}
.rangewrap small{display:flex;justify-content:space-between;color:var(--mut);font-size:10px;margin-top:3px}
.simout{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:12px}
.so{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px}
.so .l{font-size:11px;color:var(--mut)}
.so .v{font-size:20px;font-weight:900;font-family:Inter;margin-top:3px}
.kc{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:14px}
.kb{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:13px}
.kc .material-symbols-outlined{color:var(--accent);font-size:24px}
.kc b{display:block;font-family:"Noto Sans TC";font-size:14px;margin:7px 0 5px}
.kc p{margin:0;font-size:12px;color:var(--mut);line-height:1.6}
.kc .mt{margin-top:9px;font-size:11px;color:var(--accent);font-weight:700}
.fi{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:9px;background:var(--panel2);border-left:3px solid var(--accent);margin-bottom:9px}
.fi .material-symbols-outlined{font-size:18px;flex:none;color:var(--accent)}
.fi.r{border-color:var(--bad)}.fi.r .material-symbols-outlined{color:var(--bad)}
.fi.a{border-color:var(--warn)}.fi.a .material-symbols-outlined{color:var(--warn)}
.fi b{font-size:12.5px;font-family:"Noto Sans TC"}
.fi small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.gauge{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:13px}
.gz{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:14px;text-align:center}
.gz .gl{font-size:11.5px;color:var(--mut);font-weight:600}
.gz .gv{font-size:28px;font-weight:900;font-family:Inter;margin-top:5px}
.gz .gs{font-size:11px;font-weight:700;margin-top:3px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g11,.g3,.sim{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:14px}.tick{display:none}.nav button span:not(.material-symbols-outlined){display:none}.nav button{padding:9px}}
</style>
</head>

var simChart=null;
function bindSim(){
 var re=document.getElementById('r_eq'),rr=document.getElementById('r_rt'),rc=document.getElementById('r_cr'),rf=document.getElementById('r_fx');
 simChart=echarts.init(document.getElementById('c_sim'));
 var MV=4820; // 百萬
 function calc(){
  var eq=(+re.value)/100, rt=(+rr.value), cr=(+rc.value), fx=(+rf.value)/100;
  var eqExp=0.61, bondExp=0.235, fxExp=0.42; // 股票+ETF+另類 敏感, 債券, 海外
  var eqPnl=MV*eqExp*eq;
  var bondPnl=MV*bondExp*(-(rt/100+cr/100)*0.06);
  var fxPnl=MV*fxExp*fx;
  var pnl=eqPnl+bondPnl+fxPnl;
  var ret=pnl/MV*100;
  var stressVar=96*(1+Math.abs(eq)*2.2+Math.abs(rt)/300);
  document.getElementById('l_eq').textContent=(re.value>=0?'+':'')+re.value+'%';
  document.getElementById('l_rt').textContent=(rr.value>=0?'+':'')+rr.value+'bp';
  document.getElementById('l_cr').textContent='+'+rc.value+'bp';
  document.getElementById('l_fx').textContent=(rf.value>=0?'+':'')+rf.value+'%';
  var col=ret>=-3?'#86efac':ret>=-10?'#fcd34d':'#fca5a5';
  document.getElementById('o_pnl').innerHTML='<span style="color:'+col+'">NT$ '+(pnl>=0?'+':'')+pnl.toFixed(0)+'M</span>';
  document.getElementById('o_ret').innerHTML='<span style="color:'+col+'">'+(ret>=0?'+':'')+ret.toFixed(1)+'%</span>';
  document.getElementById('o_var').textContent='NT$ '+stressVar.toFixed(0)+'M';
  var adv=ret<-15?'嚴重 · 建議啟動避險':ret<-8?'中度 · 提高現金部位':ret<-3?'可承受 · 密切監控':'風險可控';
  document.getElementById('o_adv').innerHTML='<span style="color:'+col+'">'+adv+'</span>';
  simChart.setOption({grid:{left:44,right:12,top:16,bottom:24},tooltip:Object.assign({trigger:'axis',axisPointer:{type:'shadow'},formatter:'{b}：{c} M'},TT),
   xAxis:Object.assign({type:'category',data:['股票','債券','匯率','合計']},ax()),
   yAxis:Object.assign({type:'value',name:'損益(M)',nameTextStyle:{color:AX}},ax()),
   series:[{type:'bar',barWidth:'52%',itemStyle:{borderRadius:3},label:{show:true,position:'top',color:'#cfe4f5',fontSize:10},data:[
    {value:+eqPnl.toFixed(0),itemStyle:{color:eqPnl>=0?'#22c55e':'#38bdf8'}},
    {value:+bondPnl.toFixed(0),itemStyle:{color:bondPnl>=0?'#22c55e':'#7dd3fc'}},
    {value:+fxPnl.toFixed(0),itemStyle:{color:fxPnl>=0?'#22c55e':'#a78bfa'}},
    {value:+pnl.toFixed(0),itemStyle:{color:pnl>=0?'#22c55e':'#ef4444'}}]}]});
 }
 [re,rr,rc,rf].forEach(function(el){el.addEventListener('input',calc);});
 calc();
}
