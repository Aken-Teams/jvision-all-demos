<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>證照資格到期管理 · HRIS 人力資源系統</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Sans+TC:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#99E8DD;
  --ok:#047857;
  --warn:#A54B08;
  --bad:#B91C1C;
  --info:#1D4ED8;
  --paper:#FFF;
  --shadow:0 10px 30px rgba(19,78,74,.07);
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-width:320px;
  background:
    linear-gradient(rgba(13,148,136,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(13,148,136,.035) 1px,transparent 1px),
    var(--color-background);
  background-size:40px 40px;
  color:var(--ink);
  font-family:"Crimson Pro","Noto Sans TC",serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
h1,h2,h3,b,.nav button,.chip,.tag,th{
  font-family:"Cinzel","Noto Sans TC",sans-serif
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle
}
:focus-visible{
  outline:3px solid var(--color-ring)!important;
  outline-offset:3px
}
.app{min-height:100vh}
.sidebar{
  position:sticky;
  z-index:30;
  top:0;
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  align-items:center;
  gap:28px;
  min-height:76px;
  padding:12px clamp(18px,4vw,64px);
  color:#ECFEFF;
  background:rgba(19,78,74,.97);
  border-bottom:3px solid var(--color-secondary);
  box-shadow:0 8px 26px rgba(15,23,42,.14);
  backdrop-filter:blur(14px)
}
.brand{display:flex;align-items:center;gap:12px;white-space:nowrap}
.brand-logo{
  display:grid;
  place-items:center;
  width:42px;
  height:42px;
  color:#042F2E;
  background:var(--color-secondary);
  border:1px solid #99F6E4;
  border-radius:4px;
  box-shadow:5px 5px 0 rgba(45,212,191,.18)
}
.brand-logo .material-symbols-outlined{font-size:24px}
.brand-txt b{display:block;font-size:15px;letter-spacing:.07em}
.brand-txt span{
  display:block;
  margin-top:1px;
  color:#A7F3D0;
  font-family:"Cinzel",sans-serif;
  font-size:9px;
  letter-spacing:.15em
}
.nav{
  display:flex;
  justify-content:center;
  gap:5px;
  min-width:0;
  overflow-x:auto;
  scrollbar-width:none
}
.nav::-webkit-scrollbar{display:none}
.nav button{
  position:relative;
  display:flex;
  flex:0 0 auto;
  align-items:center;
  gap:8px;
  min-height:44px;
  padding:9px 14px;
  color:#CCFBF1;
  background:transparent;
  border:1px solid transparent;
  border-radius:3px;
  font-size:12px;
  font-weight:600;
  letter-spacing:.03em;
  transition:background-color .22s,border-color .22s,color .22s,transform .22s
}
.nav button:hover{
  color:#FFF;
  background:rgba(255,255,255,.08);
  border-color:rgba(153,246,228,.3);
  transform:translateY(-1px)
}
.nav button.on{
  color:#042F2E;
  background:var(--color-secondary);
  border-color:#99F6E4
}
.nav button .material-symbols-outlined{font-size:19px}
.nav .idx{
  padding-left:7px;
  border-left:1px solid currentColor;
  font-family:var(--mono);
  font-size:9px;
  opacity:.65
}
.side-foot{
  color:#A7F3D0;
  font-size:10px;
  line-height:1.45;
  text-align:right
}
.side-foot b{color:#FFF}
.main{
  width:min(1540px,100%);
  margin:auto;
  padding:clamp(22px,3vw,44px) clamp(16px,4vw,64px) 72px
}
.topbar{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:24px;
  margin-bottom:22px;
  padding-bottom:20px;
  border-bottom:1px solid var(--line)
}
.topbar h1{
  display:flex;
  align-items:center;
  gap:12px;
  margin:0;
  color:#0F4C48;
  font-size:clamp(23px,3vw,34px);
  font-weight:600;
  letter-spacing:.015em
}
.topbar h1 .material-symbols-outlined{
  display:grid;
  place-items:center;
  width:42px;
  height:42px;
  color:#FFF;
  background:var(--color-primary);
  border-radius:3px;
  font-size:23px
}
.topbar .sub{
  margin:6px 0 0 54px;
  color:var(--muted);
  font-size:14px
}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:36px;
  padding:7px 11px;
  color:#334155;
  background:#FFF;
  border:1px solid var(--line);
  border-radius:3px;
  font-size:11px;
  font-weight:600
}
.chip .dot{
  width:8px;
  height:8px;
  background:var(--ok);
  border:2px solid #FFF;
  border-radius:50%;
  box-shadow:0 0 0 2px #6EE7B7
}
.avatar{
  display:grid;
  place-items:center;
  width:38px;
  height:38px;
  color:#FFF;
  background:#115E59;
  border:1px solid #5EEAD4;
  border-radius:50%;
  font-family:"Cinzel","Noto Sans TC",sans-serif;
  font-size:12px;
  font-weight:600
}
.grid{display:grid;gap:15px}
.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(300px,1fr)}
.g32{grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr)}
.card,.kpi{
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:5px;
  box-shadow:var(--shadow)
}
.card{
  padding:20px;
  transition:border-color .22s,box-shadow .22s,transform .22s
}
.card:hover{
  border-color:var(--color-primary);
  box-shadow:0 14px 34px rgba(19,78,74,.11);
  transform:translateY(-2px)
}
.card.pad0{padding:0;overflow:hidden}
.card-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:15px;
  flex-wrap:wrap
}
.card-h h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0;
  font-size:14px;
  font-weight:600;
  letter-spacing:.025em
}
.card-h h3 .material-symbols-outlined{
  color:var(--color-primary);
  font-size:20px
}
.card-h .hint{color:var(--muted);font-size:12px}
.kpi{
  position:relative;
  min-height:164px;
  padding:18px;
  overflow:hidden;
  transition:border-color .22s,transform .22s
}
.kpi::before{
  content:"";
  position:absolute;
  top:0;
  right:0;
  width:46px;
  height:4px;
  background:var(--color-accent)
}
.kpi:hover{border-color:var(--color-primary);transform:translateY(-2px)}
.kpi .ico{
  display:grid;
  place-items:center;
  width:38px;
  height:38px;
  color:#075E57;
  background:#CCFBF1;
  border:1px solid #99F6E4;
  border-radius:3px
}
.kpi .ico .material-symbols-outlined{font-size:21px}
.kpi .lbl{
  margin-top:14px;
  color:var(--muted);
  font-size:13px;
  font-weight:600
}
.kpi .val{
  margin-top:1px;
  font-family:"Cinzel","Noto Sans TC",sans-serif;
  font-size:30px;
  font-weight:600;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.04em
}
.kpi .val small{
  margin-left:5px;
  color:var(--muted);
  font-family:"Noto Sans TC",sans-serif;
  font-size:12px;
  font-weight:600;
  letter-spacing:0
}
.kpi .delta{
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin-top:4px;
  font-size:12px;
  font-weight:600
}
.delta.up{color:var(--ok)}
.delta.down{color:var(--bad)}
.delta.flat{color:var(--muted)}
.delta .material-symbols-outlined{font-size:15px}
.table-wrap{
  width:100%;
  overflow-x:auto;
  scrollbar-color:var(--color-primary) var(--color-muted)
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
  font-variant-numeric:tabular-nums
}
th{
  padding:12px 14px;
  color:#164E49;
  background:#DDF8F3;
  border-bottom:2px solid var(--color-primary);
  font-size:11px;
  font-weight:600;
  letter-spacing:.06em;
  text-align:left;
  white-space:nowrap
}
td{
  padding:12px 14px;
  border-bottom:1px solid #CDEDE8;
  white-space:nowrap
}
th:nth-child(n+3),td:nth-child(n+3){text-align:right}
td:first-child,td:has(.tag){text-align:left}
tbody tr{transition:background-color .2s}
tbody tr:hover{background:#F0FDFA}
tbody tr:last-child td{border-bottom:0}
.mono{
  font-family:var(--mono);
  font-size:12px;
  font-weight:600;
  letter-spacing:.01em
}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 8px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:10px;
  font-weight:700;
  letter-spacing:.02em;
  white-space:nowrap
}
.tag::before{
  content:"";
  width:5px;
  height:5px;
  background:currentColor;
  border-radius:50%
}
.t-ok{color:#05603A;background:#ECFDF5}
.t-warn{color:#92400E;background:#FFFBEB}
.t-bad{color:#991B1B;background:#FEF2F2}
.t-info{color:#1E40AF;background:#EFF6FF}
.t-gray{color:#475569;background:#F1F5F9}
.chk{
  display:grid;
  grid-template-columns:22px minmax(125px,1fr) minmax(140px,auto);
  align-items:center;
  gap:10px;
  min-height:48px;
  padding:9px 1px;
  border-bottom:1px solid #CDEDE8;
  font-size:13px
}
.chk:last-of-type{border-bottom:0}
.chk .material-symbols-outlined{font-size:20px}
.chk .ok{color:var(--ok)}
.chk .wait{color:#64748B}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{font-weight:600}
.chk small{color:var(--muted);font-size:11px;text-align:right}
.note{
  margin-top:15px;
  padding:13px 14px;
  color:#334155;
  background:#FFF7E6;
  border-left:4px solid var(--color-accent);
  font-size:12px;
  line-height:1.7
}
.tl{position:relative;padding-left:27px}
.tl::before{
  content:"";
  position:absolute;
  top:5px;
  bottom:5px;
  left:7px;
  width:1px;
  background:var(--line)
}
.tl-item{position:relative;padding-bottom:19px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{
  position:absolute;
  top:4px;
  left:-26px;
  width:13px;
  height:13px;
  background:#FFF;
  border:3px solid var(--color-primary);
  border-radius:50%
}
.tl-dot.ok{border-color:var(--ok)}
.tl-dot.warn{border-color:var(--warn)}
.tl-dot.bad{border-color:var(--bad)}
.tl-time{
  color:var(--muted);
  font-family:var(--mono);
  font-size:10px;
  font-weight:600
}
.tl-item b{display:block;margin:2px 0;font-size:13px}
.tl-item p{margin:0;color:var(--muted);font-size:12px}
.reveal{animation:reveal .36s ease-out both}
@keyframes reveal{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:none}
}
@media(max-width:1100px){
  .sidebar{grid-template-columns:auto minmax(0,1fr)}
  .side-foot{display:none}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:820px){
  .sidebar{position:static;display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:12px 16px}
  .nav{order:2;justify-content:flex-start;width:100%}
  .nav button{padding:9px 12px}
  .main{padding:22px 16px 48px}
  .topbar{align-items:flex-start;flex-direction:column}
  .topbar .sub{margin-left:0}
  .g2,.g3,.g23,.g32{grid-template-columns:1fr}
}
@media(max-width:560px){
  .brand-txt span,.nav .idx{display:none}
  .nav button .txt{display:inline}
  .nav button{min-height:42px;font-size:11px}
  .g4{grid-template-columns:1fr 1fr}
  .kpi{min-height:150px;padding:14px}
  .kpi .val{font-size:25px}
  .top-right{width:100%}
  .chip{flex:1;justify-content:center}
  .chk{grid-template-columns:22px 1fr}
  .chk small{grid-column:2;text-align:left}
}
@media(max-width:390px){
  .g4{grid-template-columns:1fr}
  .nav button .material-symbols-outlined{display:none}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation:none!important;
    transition:none!important;
    scroll-behavior:auto!important
  }
  .reveal{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">workspace_premium</span></div>
      <div class="brand-txt"><b>證照效期站</b><span>LICENSE &amp; CERT EXPIRY</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
    <div class="side-foot">台中一廠 · 人資部<br>版本 <b>v1.0.0</b> · 純 UI 展示</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1><span class="material-symbols-outlined" id="th-ico"></span><span id="th-title"></span></h1>
        <div class="sub" id="th-sub"></div>
      </div>
      <div class="top-right">
        <span class="chip"><span class="dot" aria-hidden="true"></span>系統連線正常</span>
        <span class="chip"><span class="material-symbols-outlined" style="font-size:16px;color:var(--color-accent)">calendar_today</span><span class="mono">2026/08/20</span></span>
        <div class="avatar" aria-label="人資使用者">資</div>
      </div>
    </div>
    <div id="screen" aria-live="polite"></div>
  </main>
</div>

<script>
var charts=[];

function killCharts(){
  for(var i=0;i<charts.length;i++){
    try{charts[i].destroy()}catch(e){}
  }
  charts=[];
}
function esc(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}
function stats(items){
  return '<div class="grid g4">'+items.map(function(k){
    var icon=k.cls==="up"?"trending_up":k.cls==="down"?"trending_down":"trending_flat";
    return '<article class="kpi">'+
      '<div class="ico"><span class="material-symbols-outlined">'+k.ico+'</span></div>'+
      '<div class="lbl">'+esc(k.lbl)+'</div>'+
      '<div class="val">'+k.val+(k.u?'<small>'+esc(k.u)+'</small>':'')+'</div>'+
      '<div class="delta '+k.cls+'"><span class="material-symbols-outlined">'+icon+'</span>'+esc(k.d)+'</div>'+
    '</article>';
  }).join("")+'</div>';
}
function tbl(headers,rows){
  return '<div class="table-wrap"><table><thead><tr>'+
    headers.map(function(x){return '<th>'+esc(x)+'</th>';}).join("")+
    '</tr></thead><tbody>'+
    rows.map(function(row){
      return '<tr>'+row.map(function(cell,index){
        return '<td'+(index===0?' class="mono"':'')+'>'+cell+'</td>';
      }).join("")+'</tr>';
    }).join("")+
    '</tbody></table></div>';
}
function timeline(items){
  return '<div class="tl">'+items.map(function(item){
    return '<div class="tl-item">'+
      '<div class="tl-dot '+(item.k||"")+'"></div>'+
      '<div class="tl-time">'+esc(item.t)+'</div>'+
      '<b>'+esc(item.b)+'</b>'+
      '<p>'+esc(item.p)+'</p>'+
    '</div>';
  }).join("")+'</div>';
}
function card(title,icon,body,hint){
  return '<section class="card"><div class="card-h"><h3>'+
    '<span class="material-symbols-outlined">'+icon+'</span>'+title+
    '</h3>'+(hint?'<span class="hint">'+hint+'</span>':'')+
    '</div>'+body+'</section>';
}
function cardT(title,icon,body,hint){
  return '<section class="card pad0"><div class="card-h" style="padding:20px 20px 0"><h3>'+
    '<span class="material-symbols-outlined">'+icon+'</span>'+title+
    '</h3>'+(hint?'<span class="hint">'+hint+'</span>':'')+
    '</div>'+body+'</section>';
}

var chartText={colors:"#475569",fontSize:"11px",fontFamily:'"Crimson Pro","Noto Sans TC",serif'};
var chartBase={
  redrawOnParentResize:false,
  redrawOnWindowResize:false,
  animations:{enabled:false},
  toolbar:{show:false},
  fontFamily:'"Crimson Pro","Noto Sans TC",serif'
};
function push(id,options){
  var node=document.getElementById(id);
  if(!node)return;
  var chart=new ApexCharts(node,options);
  chart.render();
  charts.push(chart);
}
function mkArea(id,data,categories,name){
  push(id,{
    chart:Object.assign({},chartBase,{type:"area",height:230}),
    series:[{name:name,data:data}],
    xaxis:{categories:categories,labels:{style:chartText}},
    yaxis:{labels:{style:chartText}},
    grid:{borderColor:"#B7E9E2",strokeDashArray:3},
    dataLabels:{enabled:false},
    stroke:{curve:"straight",width:2},
    colors:["#0D9488"],
    fill:{type:"gradient",gradient:{shadeIntensity:.2,opacityFrom:.3,opacityTo:.03,stops:[0,95]}},
    markers:{size:3,strokeWidth:0},
    tooltip:{theme:"light"}
  });
}
function mkDonut(id,labels,data){
  push(id,{
    chart:Object.assign({},chartBase,{type:"donut",height:240}),
    series:data,
    labels:labels,
    colors:["#0D9488","#14B8A6","#2DD4BF","#D97706","#0F766E","#94A3B8"],
    legend:{position:"bottom",fontSize:"12px"},
    dataLabels:{enabled:false},
    plotOptions:{pie:{donut:{size:"68%"}}},
    stroke:{width:3,colors:["#FFF"]},
    tooltip:{theme:"light"}
  });
}

var MODULES=[
  {icon:"inventory_2",name:"證照清冊",sub:"全廠法定證照與資格的持有現況"},
  {icon:"notifications_active",name:"到期預警",sub:"依剩餘天數分級，逾期即停止該項作業"},
  {icon:"event_repeat",name:"換證排程",sub:"複訓梯次、報名與外訓機構安排"},
  {icon:"gavel",name:"法遵稽核",sub:"對應法規條文的持證覆蓋率與稽核準備"}
];

var CERTS=[
  ["堆高機操作","職安署","18","2 人","<span class='tag t-bad'>逾期 1</span>","職安法 §32"],
  ["固定式起重機操作","職安署","6","1 人","<span class='tag t-warn'>90 天內</span>","職安法 §32"],

var RENDER=[v0,v1,v2,v3];

function buildNav(){
  var nav=document.getElementById("nav");
  nav.innerHTML=MODULES.map(function(module,index){
    return '<button type="button" data-i="'+index+'" aria-label="'+esc(module.name)+'">'+
      '<span class="material-symbols-outlined">'+module.icon+'</span>'+
      '<span class="txt">'+module.name+'</span>'+
      '<span class="idx">0'+(index+1)+'</span>'+
    '</button>';
  }).join("");

  Array.prototype.forEach.call(nav.querySelectorAll("[data-i]"),function(button){
    button.addEventListener("click",function(){
      location.hash="go="+button.getAttribute("data-i");
    });
  });
}

function show(index){
  killCharts();

  var module=MODULES[index];
  var screen=document.getElementById("screen");

  document.getElementById("th-ico").textContent=module.icon;
  document.getElementById("th-title").textContent=module.name;
  document.getElementById("th-sub").textContent=module.sub;

  Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(button){
    var active=Number(button.getAttribute("data-i"))===index;
    button.classList.toggle("on",active);
    button.setAttribute("aria-current",active?"page":"false");
  });

  RENDER[index](screen);
  screen.classList.remove("reveal");
  void screen.offsetWidth;
  screen.classList.add("reveal");
}

function fromHash(){
  var match=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  var index=match?Math.min(Number(match[1]),MODULES.length-1):0;
  show(index);
  try{window.scrollTo({top:0,behavior:"auto"});}catch(e){window.scrollTo(0,0);}
}

buildNav();
window.addEventListener("hashchange",fromHash);
fromHash();
