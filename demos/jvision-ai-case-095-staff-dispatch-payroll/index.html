<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>派遣工時計薪台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#a16207; --accent2:#eab308;
  --bg:#f7f4ec; --panel:#ffffff; --ink:#2a2113; --muted:#7c7156;
  --line:#e7dfcc; --soft:#faf7ef;
  --ok:#15803d; --okbg:#dcfce7; --warn:#b45309; --warnbg:#fef3c7; --bad:#b91c1c; --badbg:#fee2e2;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.navwrap{background:linear-gradient(120deg,#78500a,#a16207);position:sticky;top:0;z-index:49}
.topbar{color:#fff;border-bottom:1px solid rgba(255,255,255,.12)}
.topbar-inner{max-width:1360px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .logo{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.3);flex:none}
.brand .logo .material-symbols-outlined{font-size:24px;color:#fff}
.brand h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.5px;white-space:nowrap}
.brand p{font-size:11px;margin:0;color:#fbe9c2;white-space:nowrap}
.spacer{flex:1 1 auto;min-width:0}
.who{display:flex;gap:7px;align-items:center;font-size:12px;color:#fbe9c2;white-space:nowrap}
.who .av{width:30px;height:30px;border-radius:50%;background:var(--accent2);color:#4a3406;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
nav.tabs{max-width:1360px;margin:0 auto;padding:0 12px;display:flex;gap:6px;flex-wrap:wrap}
.tabbtn{
  flex:none;white-space:nowrap;cursor:pointer;border:none;
  background:rgba(255,255,255,.08);color:#fbe9c2;
  padding:9px 14px;border-radius:10px 10px 0 0;margin-top:6px;
  font-family:inherit;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;
  transition:background .15s,color .15s;
}
.tabbtn .material-symbols-outlined{font-size:19px}
.tabbtn:hover{background:rgba(255,255,255,.18);color:#fff}
.tabbtn.on{background:var(--bg);color:var(--accent)}
.tabbtn.on .material-symbols-outlined{color:var(--accent2)}
main{max-width:1360px;margin:0 auto;padding:20px 18px 60px}
.screen-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.screen-head .sh-icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;flex:none}
.screen-head .sh-icon .material-symbols-outlined{color:#fff;font-size:26px}
.screen-head h2{margin:0;font-size:21px;font-weight:800}
.screen-head p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.screen-head .tag{margin-left:auto;background:var(--warnbg);color:var(--warn);font-size:12px;font-weight:700;padding:5px 12px;border-radius:20px;border:1px solid #f6e3b0;white-space:nowrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
.panel h3{margin:0 0 12px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel h3 .material-symbols-outlined{font-size:20px;color:var(--accent)}
.sub{font-size:12px;color:var(--muted);font-weight:500}
.grid{display:grid;gap:14px;min-width:0}
.kpis{grid-template-columns:repeat(4,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1fr 2fr}
@media(max-width:820px){
  .kpis,.g23,.g32{grid-template-columns:1fr}
}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 15px;min-width:0;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent2)}
.kpi .kl{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .kl .material-symbols-outlined{font-size:17px;color:var(--accent)}
.kpi .kv{font-size:25px;font-weight:800;margin-top:6px;letter-spacing:.5px}
.kpi .kv small{font-size:13px;font-weight:600;color:var(--muted)}
.kpi .kd{font-size:11px;margin-top:4px;font-weight:600}
.up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.4px;background:var(--soft)}
tbody tr:hover{background:var(--soft)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.pill .material-symbols-outlined{font-size:14px}
.p-ok{background:var(--okbg);color:var(--ok)} .p-warn{background:var(--warnbg);color:var(--warn)} .p-bad{background:var(--badbg);color:var(--bad)}
.p-info{background:#e0edff;color:#1d4ed8} .p-neu{background:#f1ede0;color:var(--muted)}
.avatar{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex:none}
.mb14{margin-bottom:14px}
.bar-track{height:8px;background:#f0ead9;border-radius:6px;overflow:hidden;min-width:60px}
.bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0}
@media(max-width:820px){.board{grid-template-columns:1fr;min-width:520px}}
.col{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
.col-h{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:800;margin-bottom:9px;padding:2px 4px}
.col-h .cnt{background:var(--accent);color:#fff;font-size:11px;border-radius:20px;padding:1px 8px}
.card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent2);border-radius:10px;padding:9px 10px;margin-bottom:8px;font-size:12px}
.card .ct{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;margin-bottom:4px}
.card .cm{color:var(--muted);font-size:11px;display:flex;align-items:center;gap:5px;margin-top:3px}
.card .cm .material-symbols-outlined{font-size:14px}
.cal{display:grid;grid-template-columns:120px repeat(7,1fr);gap:5px;min-width:660px}
.cal .ch{font-size:11px;color:var(--muted);font-weight:700;text-align:center;padding:5px 0}
.cal .cname{font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;padding:6px 2px}
.cell{border-radius:8px;padding:7px 4px;text-align:center;font-size:11px;font-weight:700;border:1px solid transparent}
.c-work{background:var(--okbg);color:var(--ok)} .c-ot{background:#ffedd5;color:#c2410c;border-color:#fdba74}
.c-off{background:#f1ede0;color:var(--muted)} .c-leave{background:#e0edff;color:#1d4ed8} .c-abs{background:var(--badbg);color:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block}
.aud{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.aud:last-child{border-bottom:none}
.aud .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.aud .ic .material-symbols-outlined{font-size:20px}
.aud .at{font-weight:700;font-size:13px}
.aud .ad{font-size:12px;color:var(--muted);margin-top:2px}
.chart{width:100%;min-height:20px}
.note{font-size:12px;color:var(--muted);margin-top:12px;display:flex;align-items:flex-start;gap:6px}
.note .material-symbols-outlined{font-size:16px;color:var(--accent);flex:none}
.miniStat{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.miniStat:last-child{border-bottom:none}
.miniStat b{font-weight:800}
@media(max-width:560px){
  .tabbtn span.lbl{display:none}
  .tabbtn{padding:9px 11px}
  .brand p{display:none}
}
</style>
</head>
<body>
<div class="navwrap">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">badge</span></div>
        <div style="min-width:0">
          <h1>派遣工時計薪台</h1>
          <p>派工 · 打卡 · 工時 · 計薪 · 請款</p>
        </div>
      </div>
      <div class="spacer"></div>
      <div class="who">
        <span>調度專員 · 林孟潔</span>
        <span class="av">潔</span>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</div>
<main id="app"></main>

<script>
"use strict";
var ACCENT="#a16207",ACCENT2="#eab308";
var TABS=[
  {icon:"assignment_ind",name:"派工調度"},
  {icon:"punch_clock",name:"工時打卡"},
  {icon:"receipt_long",name:"工時計薪"},
  {icon:"verified_user",name:"勞健保級距"},
  {icon:"request_quote",name:"客戶請款"},
  {icon:"gavel",name:"法遵稽核"}
];
var app=document.getElementById("app");
var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function num(n){try{return Number(n).toLocaleString("en-US");}catch(e){return String(n);}}
function avColor(s){var c=["#a16207","#b45309","#65a30d","#0891b2","#7c3aed","#be185d","#0369a1","#c2410c"];var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return c[h%c.length];}
function av(name){var ch=String(name).charAt(0);return '<span class="avatar" style="background:'+avColor(String(name))+'">'+esc(ch)+'</span>';}

function buildTabs(){
  var h="";
  for(var i=0;i<TABS.length;i++){
    h+='<button class="tabbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+TABS[i].icon+'</span><span class="lbl">'+TABS[i].name+'</span></button>';
  }
  document.getElementById("tabs").innerHTML=h;
  var btns=document.querySelectorAll(".tabbtn");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){show(+this.getAttribute("data-i"));});
  }
}
function head(icon,title,sub,tag){
  return '<div class="screen-head"><div class="sh-icon"><span class="material-symbols-outlined">'+icon+'</span></div>'
    +'<div style="min-width:0"><h2>'+title+'</h2><p>'+sub+'</p></div>'
    +(tag?'<span class="tag">'+tag+'</span>':'')+'</div>';
}
function kpiRow(kp){
  var h="";
  for(var i=0;i<kp.length;i++){var k=kp[i];
    h+='<div class="kpi"><div class="kl"><span class="material-symbols-outlined">'+k.i+'</span>'+k.l+'</div>'
      +'<div class="kv">'+k.v+(k.u?' <small>'+k.u+'</small>':'')+'</div>'
      +(k.d?'<div class="kd '+(k.c||"flat")+'">'+k.d+'</div>':'')+'</div>';
  }
  return '<div class="grid kpis mb14">'+h+'</div>';
}

/* ============ SCREEN 0: 派工調度 ============ */
function s0(){
  var kp=[
    {l:"今日待派工",v:"14",u:"筆",d:"較昨日 -3",c:"up",i:"pending_actions"},
    {l:"已上工人數",v:"186",u:"人",d:"到勤率 96.4%",c:"up",i:"groups"},
    {l:"缺工站點",v:"3",u:"站",d:"需緊急補派",c:"down",i:"warning"},
    {l:"平均媒合時間",v:"8.2",u:"分",d:"較上週 -2.1 分",c:"up",i:"timer"}
  ];
  var cols=[
    {t:"待派工",cnt:4,cards:[
      {n:"O鴻物流 · 新莊倉",m:"揀貨員 ×2 · 早班 08:00",tag:"急件",tc:"p-bad",role:"揀貨"},
      {n:"O華飯店 · 客房部",m:"房務員 ×3 · 中班 14:00",tag:"待確認",tc:"p-warn",role:"房務"},
      {n:"O晶建廠 · 南科A區",m:"清潔工 ×4 · 早班 07:30",tag:"技能符合",tc:"p-info",role:"清潔"},
      {n:"O豐量販 · 內湖店",m:"理貨員 ×2 · 晚班 17:00",tag:"待確認",tc:"p-warn",role:"理貨"}
    ]},
    {t:"媒合中",cnt:3,cards:[
      {n:"宏達展場 · 世貿一館",m:"接待員 ×6 · 全日",tag:"面談中",tc:"p-info",role:"接待"},
      {n:"聯O食品 · 桃園廠",m:"包裝員 ×5 · 早班",tag:"技能符合",tc:"p-info",role:"包裝"},
      {n:"O曜倉儲 · 五股",m:"堆高機 ×1 · 中班",tag:"待證照",tc:"p-warn",role:"堆高"}
    ]},
    {t:"已指派",cnt:3,cards:[
      {n:"常O超商 · 物流中心",m:"分揀員 ×8 · 大夜班",tag:"已通知",tc:"p-ok",role:"分揀"},
      {n:"漢神百貨 · 專櫃",m:"銷售員 ×3 · 週末班",tag:"已通知",tc:"p-ok",role:"銷售"},
      {n:"和O汽車 · 保修廠",m:"技工助手 ×2 · 早班",tag:"已通知",tc:"p-ok",role:"技工"}
    ]},
    {t:"已上工",cnt:3,cards:[
      {n:"O利量販 · 北投店",m:"補貨員 ×6 · 早班",tag:"打卡完成",tc:"p-ok",role:"補貨"},
      {n:"長O航勤 · 桃機",m:"地勤助理 ×10 · 早班",tag:"打卡完成",tc:"p-ok",role:"地勤"},
      {n:"O佳超市 · 中和配送",m:"司機助手 ×2 · 中班",tag:"打卡完成",tc:"p-ok",role:"配送"}
    ]}
  ];
  var bh="";
  for(var c=0;c<cols.length;c++){var col=cols[c];
    bh+='<div class="col"><div class="col-h">'+col.t+'<span class="cnt">'+col.cnt+'</span></div>';
    for(var d=0;d<col.cards.length;d++){var cd=col.cards[d];
      bh+='<div class="card"><div class="ct">'+av(cd.role)+esc(cd.n)+'</div>'
        +'<div class="cm"><span class="material-symbols-outlined">schedule</span>'+esc(cd.m)+'</div>'
        +'<div style="margin-top:6px"><span class="pill '+cd.tc+'">'+esc(cd.tag)+'</span></div></div>';
    }
    bh+='</div>';
  }
  return head("assignment_ind","派工調度看板","依客戶站點需求與人員技能媒合派工，指派上工班別","即時 · 8 站點")
    +kpiRow(kp)
    +'<div class="panel"><h3><span class="material-symbols-outlined">view_kanban</span>派工看板 <span class="sub">· 狀態流轉（示意）</span></h3>'
    +'<div style="overflow-x:auto"><div class="board">'+bh+'</div></div>'
    +'<div class="note"><span class="material-symbols-outlined">bolt</span>系統依技能標籤、證照與距離自動排序候選人員，急件站點置頂提示。</div></div>';
}

/* ============ SCREEN 1: 工時打卡 ============ */
function s1(){
  var days=["一","二","三","四","五","六","日"];
  var people=[
    {n:"陳建志",role:"揀貨",row:["work","work","ot","work","work","off","off"]},
    {n:"王思穎",role:"房務",row:["work","leave","work","work","ot","work","off"]},
    {n:"李冠廷",role:"清潔",row:["work","work","work","abs","work","work","off"]},
    {n:"張雅涵",role:"理貨",row:["off","work","work","work","ot","ot","work"]},
    {n:"黃俊傑",role:"分揀",row:["work","work","work","work","work","off","off"]},
    {n:"吳佩珊",role:"包裝",row:["work","ot","work","leave","work","work","off"]}
  ];
  var lbl={work:"8.0",ot:"10.5",off:"休",leave:"假",abs:"曠"};
  var cls={work:"c-work",ot:"c-ot",off:"c-off",leave:"c-leave",abs:"c-abs"};
  var ch='<div class="cal"><div class="ch"></div>';
  for(var d=0;d<7;d++)ch+='<div class="ch">週'+days[d]+'</div>';
  for(var p=0;p<people.length;p++){var pe=people[p];
    ch+='<div class="cname">'+av(pe.role)+esc(pe.n)+'</div>';
    for(var q=0;q<7;q++){var st=pe.row[q];ch+='<div class="cell '+cls[st]+'">'+lbl[st]+'</div>';}
  }
  ch+='</div>';
  var kp=[
    {l:"本週總工時",v:"1,284",u:"時",i:"schedule"},
    {l:"加班時數",v:"96.5",u:"時",i:"more_time"},
    {l:"異常打卡",v:"7",u:"筆",i:"error"},
    {l:"平均到勤率",v:"96.4",u:"%",i:"how_to_reg"}
  ];
  return head("punch_clock","現場工時打卡","派遣人員於客戶站點定位打卡，系統認列上下班工時、加班與缺勤例外","本週 W33")
    +kpiRow(kp)
    +'<div class="grid g23"><div class="panel"><h3><span class="material-symbols-outlined">calendar_view_week</span>週工時打卡日曆 <span class="sub">· 每格為當日認列工時</span></h3>'
    +'<div style="overflow-x:auto">'+ch+'</div>'
    +'<div class="legend"><span><i class="dot" style="background:#22c55e"></i>正常出勤</span><span><i class="dot" style="background:#fb923c"></i>加班</span>'
    +'<span><i class="dot" style="background:#3b82f6"></i>請假</span><span><i class="dot" style="background:#ef4444"></i>曠職</span><span><i class="dot" style="background:#cbb998"></i>休息日</span></div></div>'
    +'<div class="panel"><h3><span class="material-symbols-outlined">insights</span>逐日出勤趨勢</h3><div id="c1a" class="chart"></div>'
    +'<div class="miniStat"><span>準時打卡率</span><b class="up">98.1%</b></div>'
    +'<div class="miniStat"><span>遲到 / 早退</span><b class="down">11 人次</b></div>'
    +'<div class="miniStat"><span>補打卡申請</span><b>4 筆</b></div></div></div>';
}
function draw1(){
  var o={chart:{type:"area",height:230,toolbar:{show:false},animations:{enabled:false},redrawOnParentResize:false,redrawOnWindowResize:false},
    series:[{name:"出勤人數",data:[172,186,181,178,184,120,64]},{name:"加班人數",data:[24,31,28,19,33,22,8]}],
    colors:[ACCENT,ACCENT2],dataLabels:{enabled:false},stroke:{curve:"smooth",width:2},
    fill:{type:"gradient",gradient:{opacityFrom:.4,opacityTo:.05}},
    xaxis:{categories:["週一","週二","週三","週四","週五","週六","週日"],labels:{style:{fontSize:"11px"}}},
    yaxis:{labels:{style:{fontSize:"11px"}}},legend:{fontSize:"12px",position:"top"},grid:{borderColor:"#eee"}};
  var c=new ApexCharts(document.getElementById("c1a"),o);c.render();charts.push(c);
}

/* ============ SCREEN 2: 工時計薪 ============ */
function s2(){
  var kp=[
    {l:"本期應付薪資",v:"NT$ 4.82",u:"百萬",d:"186 名派遣人員",c:"flat",i:"payments"},
