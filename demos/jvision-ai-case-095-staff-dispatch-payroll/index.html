<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>派遣工時計薪台</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --ok:#166534;
  --ok-bg:#DCFCE7;
  --warn:#92400E;
  --warn-bg:#FEF3C7;
  --bad:#B91C1C;
  --bad-bg:#FEE2E2;
  --info:#1E40AF;
  --info-bg:#DBEAFE;
  --shadow:0 12px 28px rgba(15,118,110,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-width:320px;
  background:
    linear-gradient(rgba(13,148,136,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(13,148,136,.035) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Crimson Pro","Noto Serif TC",serif;
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,a,[role=button]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.shell{min-height:100vh}
.navwrap{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(255,255,255,.94);
  border-bottom:1px solid var(--line);
  box-shadow:0 5px 22px rgba(15,118,110,.08);
  backdrop-filter:blur(14px);
}
.topbar{
  max-width:1400px;
  margin:auto;
  padding:13px 24px 0;
}
.identity{
  display:flex;
  align-items:center;
  gap:14px;
  padding-bottom:12px;
}
.logo,.screen-icon{
  display:grid;
  place-items:center;
  flex:none;
  color:#fff;
  background:var(--color-primary);
  border:1px solid #0F766E;
  box-shadow:5px 5px 0 rgba(45,212,191,.24);
}
.logo{width:43px;height:43px;border-radius:8px}
.logo svg{width:23px}
.brand{min-width:0}
.brand h1{
  margin:0;
  font-family:"Cinzel","Crimson Pro",serif;
  font-size:18px;
  font-weight:600;
  letter-spacing:.045em;
}
.brand p{margin:1px 0 0;color:var(--muted);font-size:13px}
.spacer{flex:1}
.account{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.account strong{color:var(--ink);font-weight:600}
.avatar{
  display:inline-grid;
  place-items:center;
  flex:none;
  width:30px;
  height:30px;
  border:1px solid rgba(19,78,74,.18);
  border-radius:50%;
  color:#fff;
  font-family:"Cinzel",serif;
  font-size:11px;
  font-weight:600;
}
.account .avatar{width:36px;height:36px;background:var(--color-accent);color:#111827}
.tabs{
  display:flex;
  gap:2px;
  overflow-x:auto;
  scrollbar-width:thin;
}
.tab{
  position:relative;
  display:flex;
  align-items:center;
  gap:8px;
  flex:none;
  min-height:45px;
  padding:10px 14px;
  border:0;
  border-radius:7px 7px 0 0;
  background:transparent;
  color:var(--muted);
  font-weight:600;
  transition:color .2s ease,background .2s ease,transform .2s ease;
}
.tab svg{width:18px;height:18px}
.tab:hover{background:var(--color-muted);color:var(--ink);transform:translateY(-1px)}
.tab.on{background:var(--color-background);color:#0F766E}
.tab.on:after{
  content:"";
  position:absolute;
  right:12px;
  bottom:0;
  left:12px;
  height:3px;
  background:var(--color-accent);
}
main{max-width:1400px;margin:auto;padding:30px 24px 70px}
.screen-head{
  display:flex;
  align-items:center;
  gap:16px;
  margin-bottom:22px;
}
.screen-icon{width:50px;height:50px;border-radius:9px}
.screen-icon svg{width:26px;height:26px}
.screen-title{min-width:0}
.screen-title h2{
  margin:0;
  color:var(--ink);
  font-family:"Cormorant Garamond",serif;
  font-size:31px;
  line-height:1;
  font-weight:700;
  letter-spacing:.005em;
}
.screen-title p{margin:7px 0 0;color:var(--muted);font-size:15px}
.tag{
  margin-left:auto;
  padding:6px 11px;
  border:1px solid #F59E0B;
  border-radius:999px;
  background:var(--warn-bg);
  color:var(--warn);
  font-size:13px;
  font-weight:600;
  white-space:nowrap;
}
.grid{display:grid;gap:15px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:15px}
.layout-21{grid-template-columns:minmax(0,2fr) minmax(290px,1fr)}
.layout-12{grid-template-columns:minmax(290px,1fr) minmax(0,2fr)}
.panel,.kpi{
  min-width:0;
  border:1px solid rgba(13,148,136,.35);
  border-radius:10px;
  background:var(--color-card);
  box-shadow:var(--shadow);
}
.panel{padding:19px}
.panel h3{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0 0 15px;
  color:var(--ink);
  font-family:"Cormorant Garamond",serif;
  font-size:21px;
  line-height:1.2;
}
.panel h3 svg{width:20px;color:var(--color-primary)}
.sub{color:var(--muted);font-family:"Crimson Pro",serif;font-size:14px;font-weight:400}
.kpi{
  position:relative;
  overflow:hidden;
  padding:18px;
  transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
}
.kpi:before{
  content:"";
  position:absolute;
  top:0;
  right:0;
  left:0;
  height:3px;
  background:var(--color-primary);
}
.kpi:hover{transform:translateY(-3px);border-color:var(--color-primary);box-shadow:0 16px 32px rgba(15,118,110,.13)}
.k-label{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:14px;font-weight:600}
.k-label svg{width:18px;color:var(--color-primary)}
.k-value{
  margin-top:8px;
  color:var(--ink);
  font-family:"Cinzel","Crimson Pro",serif;
  font-size:26px;
  font-weight:600;
  font-variant-numeric:tabular-nums;
}
.k-value small{color:var(--muted);font-family:"Crimson Pro",serif;font-size:14px}
.delta{margin-top:6px;font-size:13px;font-weight:600}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
.scroll{overflow-x:auto}
table{width:100%;min-width:580px;border-collapse:separate;border-spacing:0;font-size:14px}
th,td{
  padding:11px 12px;
  border-bottom:1px solid rgba(13,148,136,.19);
  text-align:left;
  white-space:nowrap;
}
th{
  background:var(--color-muted);
  color:#334155;
  font-family:"Cinzel","Crimson Pro",serif;
  font-size:11px;
  font-weight:600;
  letter-spacing:.055em;
}
th:first-child{border-radius:6px 0 0}
th:last-child{border-radius:0 6px 0 0}
tbody tr{transition:background .2s ease}
tbody tr:hover{background:#F0FDFA}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td:first-child b,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 9px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
  line-height:1;
}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)}
.p-info{background:var(--info-bg);color:var(--info)}
.p-neu{background:#F1F5F9;color:#475569}
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;min-width:920px}
.column{padding:11px;border:1px solid rgba(13,148,136,.25);border-radius:8px;background:#F8FFFE}
.column-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:2px 3px 9px;
  font-weight:600;
}
.count{min-width:25px;padding:2px 8px;border-radius:999px;background:var(--color-primary);color:#fff;text-align:center;font-size:12px}
.job-card{
  margin-bottom:9px;
  padding:11px;
  border:1px solid rgba(13,148,136,.24);
  border-left:3px solid var(--color-accent);
  border-radius:7px;
  background:#fff;
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.job-card:hover{transform:translateY(-2px);border-color:var(--color-primary);box-shadow:0 8px 18px rgba(15,118,110,.1)}
.job-title{display:flex;align-items:center;gap:7px;font-weight:600}
.job-meta{display:flex;align-items:center;gap:5px;margin:7px 0;color:var(--muted);font-size:13px}
.job-meta svg{width:15px}
.calendar{display:grid;grid-template-columns:125px repeat(7,minmax(62px,1fr));gap:5px;min-width:680px}
.cal-head{padding:5px;text-align:center;color:var(--muted);font-weight:600}
.person{display:flex;align-items:center;gap:7px;padding:6px 2px;font-weight:600}
.cell{
  padding:9px 4px;
  border:1px solid transparent;
  border-radius:6px;
  text-align:center;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12px;
  font-weight:700;
}
.work{background:var(--ok-bg);color:var(--ok)}
.overtime{background:#FFEDD5;color:#9A3412;border-color:#FB923C}
.off{background:#E2E8F0;color:#475569}
.leave{background:var(--info-bg);color:var(--info)}
.absent{background:var(--bad-bg);color:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:13px;color:var(--muted);font-size:13px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border:1px solid currentColor;border-radius:2px}
.note{
  display:flex;
  align-items:flex-start;
  gap:7px;
  margin-top:14px;
  padding:10px 12px;
  border-left:3px solid var(--color-primary);
  background:var(--color-muted);
  color:#334155;
  font-size:13px;
}
.note svg{flex:none;width:17px;color:var(--color-primary)}
.mini{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:10px 0;
  border-bottom:1px dashed rgba(13,148,136,.35);
}
.mini:last-child{border:0}
.mini b{font-variant-numeric:tabular-nums}
.bar{height:8px;overflow:hidden;border-radius:0;background:#DCEDEA}
.bar span{display:block;height:100%;background:var(--color-primary)}
.audit{
  display:flex;
  align-items:flex-start;
  gap:11px;
  padding:13px 0;
  border-bottom:1px solid rgba(13,148,136,.2);
}
.audit:last-child{border:0}
.audit-icon{display:grid;place-items:center;flex:none;width:36px;height:36px;border-radius:7px}
.audit-icon svg{width:20px}
.audit-copy{flex:1;min-width:0}
.audit-copy strong{display:block}
.audit-copy p{margin:4px 0 0;color:var(--muted);font-size:14px}
.chart{min-height:20px}
.enter{animation:enter .42s cubic-bezier(.2,.85,.32,1.2) both}
.kpi:nth-child(2){animation-delay:.05s}
.kpi:nth-child(3){animation-delay:.1s}
.kpi:nth-child(4){animation-delay:.15s}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@media(max-width:900px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .layout-21,.layout-12{grid-template-columns:1fr}
}
@media(max-width:600px){
  .topbar{padding:10px 14px 0}
  main{padding:22px 14px 55px}
  .account strong{display:none}
  .brand p{display:none}
  .tab{padding:10px 12px}
  .tab span{display:none}
  .screen-head{align-items:flex-start;gap:12px}
  .screen-icon{width:44px;height:44px}
  .screen-title h2{font-size:26px}
  .tag{margin-left:0}
  .kpis{grid-template-columns:1fr}
  .panel{padding:15px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="shell">
<header class="navwrap">

</div>

chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10m6 10V4m6 16v-7m4 7H2"/></svg>',
calendar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6m10-6v6M3 10h18"/></svg>',
check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>'
};
document.getElementById("brandIcon").innerHTML=icons.badge;
var TABS=[
 ["dispatch","派工調度"],["clock","工時打卡"],["receipt","工時計薪"],
 ["shield","勞健保級距"],["invoice","客戶請款"],["gavel","法遵稽核"]
];
var app=document.getElementById("app"),charts=[];
function esc(v){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function num(v){return Number(v).toLocaleString("en-US")}
function kill(){charts.forEach(function(c){try{c.destroy()}catch(e){}});charts=[]}
function color(s){var c=["#0F766E","#B45309","#166534","#1D4ED8","#6D28D9","#BE185D"];var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return c[h%c.length]}
function avatar(s){return '<span class="avatar" style="background:'+color(s)+'">'+esc(s.charAt(0))+'</span>'}
function pill(t,c){return '<span class="pill '+c+'">'+esc(t)+'</span>'}
function header(icon,title,sub,tag){
 return '<div class="screen-head enter"><div class="screen-icon">'+icons[icon]+'</div><div class="screen-title"><h2>'+title+'</h2><p>'+sub+'</p></div><span class="tag">'+tag+'</span></div>'
}
function kpis(items){
 return '<section class="grid kpis">'+items.map(function(k){return '<article class="kpi enter"><div class="k-label">'+icons[k[0]]+k[1]+'</div><div class="k-value">'+k[2]+(k[3]?' <small>'+k[3]+'</small>':'')+'</div>'+(k[4]?'<div class="delta '+(k[5]||"flat")+'">'+k[4]+'</div>':'')+'</article>'}).join("")+'</section>'
}
function panel(title,icon,body,sub){
 return '<section class="panel enter"><h3>'+icons[icon]+title+(sub?' <span class="sub">'+sub+'</span>':'')+'</h3>'+body+'</section>'
}
function buildTabs(){
 document.getElementById("tabs").innerHTML=TABS.map(function(t,i){return '<button class="tab" type="button" data-i="'+i+'" aria-label="'+t[1]+'">'+icons[t[0]]+'<span>'+t[1]+'</span></button>'}).join("");
 document.querySelectorAll(".tab").forEach(function(b){b.addEventListener("click",function(){location.hash="v"+this.dataset.i})})
}
