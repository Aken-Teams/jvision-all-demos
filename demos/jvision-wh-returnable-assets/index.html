<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>包材、棧板與循環容器管理 · WMS 倉儲物流系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#334155;
  --color-on-primary:#fff;
  --color-secondary:#475569;
  --color-on-secondary:#fff;
  --color-accent:#059669;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#0f172a;
  --color-card:#fff;
  --color-card-foreground:#0f172a;
  --color-muted:#f2f3f4;
  --color-muted-foreground:#475569;
  --color-border:#e6e8ea;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#334155;
  --blue:#334155;
  --ink:#0f172a;
  --muted:#475569;
  --line:#e6e8ea;
  --accent:#059669;
  --accent2:#047857;
  --accent-soft:#d1fae5;
  --accent-soft2:#ecfdf5;
  --bg:#f8fafc;
  --panel:#fff;
  --th:#f2f3f4;
  --hov:#f1f5f9;
  --track:#e2e8f0;
  --sidebar:#334155;
  --sidebar2:#334155;
  --side-edge:#475569;
  --ok:#047857;
  --warn:#b45309;
  --bad:#dc2626;
  --info:#2563eb;
  --r:10px;
  --glow:transparent;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  background:var(--color-background);
  color:var(--color-foreground);
  font-family:"Open Sans",sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font:inherit}
button,[role="button"],a{cursor:pointer}
h1,h2,h3,h4,.brand-txt b,.col-h,.pcard b,.lane-row .body b,.rep-row .sku b{
  margin:0;
  font-family:"Poppins","Open Sans",sans-serif;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}

.app{display:flex;min-height:100vh}
.sidebar{
  position:sticky;
  top:0;
  display:flex;
  flex:none;
  flex-direction:column;
  width:252px;
  height:100vh;
  min-width:0;
  padding:24px 16px;
  overflow-y:auto;
  color:#f8fafc;
  background:var(--sidebar);
  border-right:1px solid var(--side-edge);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  padding:2px 8px 24px;
  border-bottom:1px solid #475569;
}
.brand-logo{
  display:flex;
  flex:none;
  align-items:center;
  justify-content:center;
  width:42px;
  height:42px;
  color:#fff;
  background:var(--accent);
  border:1px solid #34d399;
  border-radius:9px;
}
.brand-logo .material-symbols-outlined{font-size:23px}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-size:15px;font-weight:600;letter-spacing:.01em}
.brand-txt span{display:block;margin-top:2px;color:#cbd5e1;font-size:10px;letter-spacing:.12em}
.nav{display:flex;flex-direction:column;gap:6px;min-width:0;margin-top:20px}
.nav button{
  display:flex;
  align-items:center;
  gap:11px;
  min-height:44px;
  min-width:0;
  padding:10px 12px;
  color:#e2e8f0;
  text-align:left;
  white-space:nowrap;
  background:transparent;
  border:1px solid transparent;
  border-radius:8px;
  transition:background-color 150ms ease,color 150ms ease,border-color 150ms ease;
}
.nav button .material-symbols-outlined{flex:none;font-size:20px}
.nav button:hover{color:#fff;background:#475569;border-color:#64748b}
.nav button.on{color:#fff;background:#047857;border-color:#34d399;font-weight:700}
.nav button.on::before{content:"";width:3px;height:18px;margin-left:-6px;background:#fff;border-radius:2px}
.nav .idx{margin-left:auto;color:inherit;font-family:"Poppins",sans-serif;font-size:10px;font-weight:600;opacity:.72}
.side-foot{
  margin-top:auto;
  padding:16px 9px 2px;
  color:#cbd5e1;
  border-top:1px solid #475569;
  font-size:11px;
  line-height:1.7;
}
.side-foot b{color:#fff}
.main{flex:1;min-width:0;padding:28px clamp(18px,3vw,40px) 64px}
.topbar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
  margin-bottom:22px;
}
.topbar h1{display:flex;align-items:center;gap:10px;font-size:clamp(20px,2vw,27px);font-weight:600;letter-spacing:-.02em}
.topbar h1 .material-symbols-outlined{color:var(--accent);font-size:28px}
.topbar .sub{margin-top:5px;color:var(--muted);font-size:13px}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:36px;
  padding:7px 11px;
  color:var(--muted);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:8px;
  font-size:11.5px;
  font-weight:600;
}
.chip .dot{width:8px;height:8px;background:var(--ok);border:2px solid #a7f3d0;border-radius:50%;animation:status-pulse 2s ease-in-out infinite}
.avatar{display:flex;flex:none;align-items:center;justify-content:center;width:36px;height:36px;color:#fff;background:var(--color-primary);border:1px solid #64748b;border-radius:8px;font-weight:700}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{
  min-width:0;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:var(--r);
}
.card,.sec{padding:18px}
.sec{margin-bottom:16px}
.card,.sec,.kpi,.stat,.tile,.pcard,.lane-row{
  transition:border-color 150ms ease,background-color 150ms ease,transform 150ms ease;
}
.card:hover,.sec:hover,.kpi:hover,.stat:hover,.tile:hover{border-color:#94a3b8}
.sec>h3,.card-h{
  display:flex;
  align-items:center;
  gap:9px;
  padding-bottom:12px;
  margin-bottom:15px;
  border-bottom:1px solid var(--line);
}
.sec>h3{font-size:14px;font-weight:600}
.sec>h3 .material-symbols-outlined,.card-h h3 .material-symbols-outlined{color:var(--accent);font-size:19px}
.sec>p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.75}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{justify-content:space-between;flex-wrap:wrap}
.card.pad0 .card-h,.card.p0 .card-h{margin:0;padding:17px 18px 14px}
.card-h h3{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px;font-weight:600;letter-spacing:.01em}
.card-h .hint{color:var(--muted);font-size:11.5px}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0;font-size:13px}
.dl dt{color:var(--muted);font-size:12px;font-weight:600}
.dl dd{margin:0;line-height:1.7}

.kpi,.stat{position:relative;overflow:hidden;padding:17px}
.kpi::before,.tile::before{content:"";position:absolute;top:0;right:0;left:0;height:3px;background:var(--accent)}
.kpi::after{display:none}
.kpi .ico,.tile .ti{
  display:flex;
  align-items:center;
  justify-content:center;
  width:38px;
  height:38px;
  color:#065f46;
  background:var(--accent-soft);
  border:1px solid #a7f3d0;
  border-radius:8px;
}
.kpi .ico .material-symbols-outlined,.tile .ti .material-symbols-outlined{font-size:20px}
.kpi .lbl,.stat .lbl{display:flex;align-items:center;gap:5px;margin-top:12px;color:var(--muted);font-size:12px;font-weight:600}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{color:var(--accent);font-size:15px}
.kpi .val,.stat .val,.tile .tv{
  margin-top:4px;
  font-family:"Poppins","Open Sans",sans-serif;
  font-size:26px;
  font-weight:600;
  letter-spacing:-.03em;
  line-height:1.25;
  font-variant-numeric:tabular-nums;
}
.kpi .val small,.stat .val small{margin-left:4px;color:var(--muted);font-size:12px;font-weight:600}
.kpi .delta,.stat .d{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:11.5px;font-weight:700}
.delta.up,.d.up{color:var(--ok)}
.delta.down,.d.down{color:var(--bad)}
.delta.flat,.d.flat{color:var(--muted)}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:15px}

.card.pad0>div:last-child,.card.p0>div:last-child{scrollbar-width:thin;scrollbar-color:#94a3b8 var(--th)}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{
  padding:12px 14px;
  color:#334155;
  text-align:left;
  white-space:nowrap;
  background:var(--th);
  border-top:1px solid var(--line);
  border-bottom:1px solid #cbd5e1;
  font-size:11px;
  font-weight:700;
  letter-spacing:.03em;
}
td{padding:12px 14px;white-space:nowrap;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background-color 150ms ease}
tbody tr:hover{background:var(--hov)}
td:nth-child(n+2),th:nth-child(n+2){text-align:right}
.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-weight:600;letter-spacing:.01em}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border:1px solid currentColor;border-radius:6px;font-size:11px;font-weight:700;line-height:1.2;white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;background:currentColor;border-radius:50%}
.t-ok{color:#047857;background:#ecfdf5}
.t-warn{color:#92400e;background:#fffbeb}
.t-bad{color:#b91c1c;background:#fef2f2}
.t-info{color:#1d4ed8;background:#eff6ff}
.t-gray{color:#475569;background:#f1f5f9}
.t-acc,.t-pink{color:#047857;background:#ecfdf5}

.bar{height:7px;min-width:56px;overflow:hidden;background:var(--track);border-radius:3px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:3px}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{flex:none;width:38px;color:var(--muted);font-size:11px;font-weight:600;text-align:right}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;top:4px;bottom:4px;left:7px;width:2px;background:var(--line)}
.tl-item,.tl-i{position:relative;padding:0 0 18px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;top:3px;left:-25px;width:14px;height:14px;background:#fff;border:3px solid var(--accent);border-radius:50%}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font-family:ui-monospace,Consolas,monospace;font-size:11px;font-weight:600}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:12.5px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:11.5px}
.chk{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:12.5px}
.chk:last-child{border-bottom:none}
.chk .material-symbols-outlined{font-size:19px}
.chk .ok{color:var(--ok)}
.chk .wait{color:var(--muted)}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--muted);font-size:11px}
.note{margin-top:13px;padding-top:12px;color:var(--muted);border-top:1px solid var(--line);font-size:11.5px;line-height:1.7}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.col{display:flex;flex-direction:column;gap:9px;min-width:0;padding:11px;background:var(--th);border:1px solid var(--line);border-radius:9px}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 6px;font-size:12.5px;font-weight:600}
.col-h .cnt{padding:2px 8px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:6px;font-size:11px}
.pcard{padding:11px 12px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:7px}
.pcard:hover{border-color:#94a3b8;border-left-color:var(--accent)}
.pcard b{font-size:12.5px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--muted);font-size:11px}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:8px;color:var(--ink);font-size:11px}
.mini-av,.av{display:inline-flex;flex:none;align-items:center;justify-content:center;color:#065f46;background:var(--accent-soft);border:1px solid #a7f3d0;border-radius:7px;font-weight:700}
.mini-av{width:20px;height:20px;font-size:9px}
.av{width:27px;height:27px;font-size:11px}
.who{display:inline-flex;align-items:center;gap:6px}

.lane{display:flex;flex-direction:column;gap:11px}
.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:8px}
.lane-row:hover{border-color:#94a3b8;background:#f8fafc}
.lane-row .num{display:flex;flex:none;align-items:center;justify-content:center;width:32px;height:32px;color:#065f46;background:var(--accent-soft);border:1px solid #a7f3d0;border-radius:7px;font-family:"Poppins",sans-serif;font-weight:700}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:13px}
.lane-row .body p{margin:3px 0 0;color:var(--muted);font-size:11.5px}
.steps{display:flex;flex:none;align-items:center}
.steps .s{z-index:1;display:flex;align-items:center;justify-content:center;width:23px;height:23px;color:#64748b;background:#fff;border:2px solid var(--line);border-radius:50%;font-size:11px}
.steps .ln{width:20px;height:2px;background:var(--line)}
.steps .s.done{color:#fff;background:var(--accent);border-color:var(--accent)}
.steps .s.cur{color:var(--accent);border-color:var(--accent);animation:status-pulse 1.6s ease-in-out infinite}
.steps .ln.done{background:var(--accent)}
.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 4px;border-bottom:1px solid var(--line)}
.rep-row:last-child{border-bottom:none}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:13px}
.rep-row .sku span{color:var(--muted);font-size:11px}
.gauge{flex:none;width:110px}
.gauge .track{position:relative;height:8px;overflow:hidden;background:var(--track);border-radius:3px}
.gauge .track i{display:block;height:100%;background:var(--accent);border-radius:3px}
.gauge small{display:block;margin-top:3px;color:var(--muted);font-size:10px;text-align:right}
.band{position:relative;min-width:150px;height:26px;background:var(--track);border-radius:5px}
.band .rng{position:absolute;top:0;bottom:0;background:var(--accent-soft);border-radius:5px}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
.band .me{position:absolute;top:3px;width:12px;height:20px;background:var(--accent);border-radius:3px}
.tile{position:relative;display:flex;flex-direction:column;gap:8px;padding:17px;overflow:hidden}
.tile b{font-size:13.5px;font-weight:600}
.tile p{margin:0;color:var(--muted);font-size:11.8px;line-height:1.6}

#screen{display:grid;grid-template-columns:400px minmax(0,1fr);grid-auto-rows:min-content;gap:16px;align-items:start}
#screen>*{grid-column:1/-1;margin-top:0!important}
#screen>.grid.g4:first-child{grid-column:1;grid-row:1;display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px;background:none!important;border:0!important;padding:0!important}
#screen>.grid.g4:first-child>*{border-radius:var(--r)!important}
#screen>*:nth-child(2){grid-column:2;grid-row:1}
#screen>*:nth-child(2).grid{grid-template-columns:minmax(0,1fr)}
#screen>*:nth-child(2)>.card:first-child{min-height:320px}
#screen>.grid.g4:first-child>*{animation:grid-in 400ms cubic-bezier(.2,.8,.2,1) both}
#screen>.grid.g4:first-child>*:nth-child(2){animation-delay:60ms}
#screen>.grid.g4:first-child>*:nth-child(3){animation-delay:120ms}
#screen>.grid.g4:first-child>*:nth-child(4){animation-delay:180ms}
#screen>*:nth-child(n+2){animation:grid-in 400ms cubic-bezier(.2,.8,.2,1) both;animation-delay:160ms}

@keyframes grid-in{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes status-pulse{0%,100%{opacity:1}50%{opacity:.45}}

@media(max-width:1180px){
  #screen{grid-template-columns:minmax(0,1fr)}
  #screen>*,#screen>.grid.g4:first-child,#screen>*:nth-child(2){grid-column:1;grid-row:auto}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:900px){
  .app{flex-direction:column}
  .sidebar{position:static;flex-direction:row;align-items:center;flex-wrap:wrap;width:100%;height:auto;padding:12px 14px;overflow:visible;border-right:0;border-bottom:1px solid #475569}
  .brand{padding:0 14px 0 2px;border:0}
  .brand-logo{width:38px;height:38px}
  .side-foot{display:none}
  .nav{flex:1;flex-direction:row;flex-wrap:wrap;gap:6px;margin-top:0}
  .nav button{padding:9px 11px}
  .nav button.on::before,.nav .idx{display:none}
  .main{padding:22px 18px 48px}
  .g23,.g32{grid-template-columns:1fr}
}
@media(max-width:700px){
  .topbar{align-items:flex-start;flex-direction:column}
  .top-right{justify-content:flex-start}
  .g2,.g3{grid-template-columns:1fr}
  .dl{grid-template-columns:1fr;gap:2px}
  .dl dt{margin-top:9px}
}
@media(max-width:520px){
  .main{padding:18px 12px 40px}
  .brand{width:100%;padding-bottom:10px}
  .nav{display:grid;grid-template-columns:repeat(4,minmax(44px,1fr));width:100%}
  .nav button{justify-content:center;min-height:46px;padding:9px}
  .nav button .txt{display:none}
  #screen>.grid.g4:first-child,.g4{grid-template-columns:1fr!important}
  .board{grid-template-columns:1fr}
  .chip{min-height:34px}
  .topbar h1{font-size:20px}
  .tile .tv,.kpi .val,.stat .val{font-size:23px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">recycling</span></div>
      <div class="brand-txt"><b>循環容器台</b><span>RETURNABLE ASSETS</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">2026/08 當期<br/>在管容器 48,600 只<br/>版本 <b>v1.0.0</b> · 純 UI 展示</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1><span class="material-symbols-outlined" id="th-ico"></span><span id="th-title"></span></h1>
        <div class="sub" id="th-sub"></div>
      </div>
      <div class="top-right">
        <span class="chip"><span class="dot"></span>系統連線正常</span>
        <span class="chip"><span class="material-symbols-outlined" style="font-size:16px;color:var(--accent)">calendar_today</span>2026/08/20</span>
        <div class="avatar">資</div>
      </div>
    </div>
