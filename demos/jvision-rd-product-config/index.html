<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>產品組態與變型管理（150% BOM）· PLM 研發管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700;800;900&family=Roboto+Mono:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#15803D;
  --color-on-primary:#FFFFFF;
  --color-secondary:#22C55E;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDF4;
  --color-foreground:#14532D;
  --color-card:#FFFFFF;
  --color-card-foreground:#14532D;
  --color-muted:#E8F0F1;
  --color-muted-foreground:#475569;
  --color-border:#86D9A3;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#15803D;

  --blue:#15803D;
  --ink:#14532D;
  --muted:#475569;
  --line:#86D9A3;
  --accent:#D97706;
  --accent2:#22C55E;
  --accent-soft:#DCFCE7;
  --accent-soft2:#FEF3C7;
  --bg:#F0FDF4;
  --panel:#FFFFFF;
  --th:#DCFCE7;
  --hov:#ECFDF3;
  --track:#D1FAE5;
  --sidebar:#052E16;
  --sidebar2:#14532D;
  --side-edge:#22C55E;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#1D4ED8;
  --r:0px;
  --glow:rgba(20,83,45,.18);
  --border-strong:#14532D;
  --shadow:6px 6px 0 #14532D;
}

*{box-sizing:border-box}
html{scroll-behavior:auto}
html,body{margin:0;padding:0;min-width:320px}
body{
  font-family:"Exo",system-ui,sans-serif;
  background-color:var(--bg);
  background-image:
    linear-gradient(rgba(21,128,61,.09) 1px,transparent 1px),
    linear-gradient(90deg,rgba(21,128,61,.09) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--ink);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,[role="button"],a{cursor:pointer}
h1,h2,h3,h4{font-family:"Exo",sans-serif;margin:0;font-weight:800;letter-spacing:.02em}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px;box-shadow:0 0 0 2px var(--color-on-primary)}
::selection{background:var(--color-secondary);color:var(--color-on-secondary)}

.app{display:flex;min-height:100vh}
.sidebar{
  width:258px;flex:none;min-width:0;background:var(--sidebar);color:#F0FDF4;
  display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;
  border-right:4px solid var(--color-secondary);z-index:10;
}
.brand{display:flex;align-items:center;gap:12px;padding:2px 6px 22px;min-width:0;border-bottom:2px solid rgba(187,247,208,.38)}
.brand-logo{
  width:46px;height:46px;flex:none;border:2px solid #FFFFFF;background:var(--color-primary);
  display:flex;align-items:center;justify-content:center;color:#FFFFFF;box-shadow:4px 4px 0 var(--color-secondary);
}
.brand-logo .material-symbols-outlined{font-size:25px}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-weight:900;font-size:16px;letter-spacing:.06em}
.brand-txt span{display:block;margin-top:2px;font-family:"Roboto Mono",monospace;font-size:9px;color:#BBF7D0;letter-spacing:.08em;white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:8px;margin-top:18px;min-width:0}
.nav button{
  min-height:48px;display:flex;align-items:center;gap:11px;min-width:0;background:transparent;
  border:2px solid rgba(187,247,208,.42);color:#DCFCE7;padding:10px 11px;font-size:13px;
  font-weight:700;text-align:left;white-space:nowrap;transition:background-color 180ms ease,color 180ms ease,transform 180ms ease,box-shadow 180ms ease;
}
.nav button .material-symbols-outlined{font-size:20px;flex:none}
.nav button:hover{background:#14532D;color:#FFFFFF;transform:translate(-2px,-2px);box-shadow:3px 3px 0 #22C55E}
.nav button.on{background:var(--color-secondary);border-color:#FFFFFF;color:var(--color-on-secondary);box-shadow:4px 4px 0 #FFFFFF;position:relative}
.nav button.on::before{content:"";position:absolute;left:-16px;top:8px;bottom:8px;width:6px;background:var(--color-accent)}
.nav .idx{margin-left:auto;font-family:"Roboto Mono",monospace;font-size:10px;font-weight:700;opacity:.78}
.side-foot{margin-top:auto;padding:14px 7px 2px;border-top:2px solid rgba(187,247,208,.38);font-family:"Roboto Mono",monospace;font-size:10px;color:#BBF7D0;line-height:1.75}
.side-foot b{color:#FFFFFF}

.main{flex:1;min-width:0;padding:24px 30px 60px}
.topbar{
  display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px;
  padding:18px 20px;background:var(--color-card);border:3px solid var(--border-strong);box-shadow:var(--shadow);
}
.topbar h1{font-size:clamp(20px,2vw,28px);font-weight:900;display:flex;align-items:center;gap:10px;line-height:1.2;text-transform:uppercase}
.topbar h1 .material-symbols-outlined{width:42px;height:42px;display:grid;place-items:center;background:var(--color-primary);color:#FFFFFF;font-size:24px}
.topbar .sub{font-family:"Roboto Mono",monospace;font-size:12px;color:var(--muted);margin-top:8px}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:36px;background:var(--color-muted);border:2px solid var(--border-strong);padding:6px 10px;font-family:"Roboto Mono",monospace;font-size:10px;font-weight:700;color:var(--ink)}
.chip .dot{width:9px;height:9px;background:var(--ok);border:2px solid #FFFFFF;box-shadow:0 0 0 2px var(--ok);animation:pulse 2s steps(2,end) infinite}
.avatar{width:38px;height:38px;border:2px solid var(--border-strong);background:var(--color-accent);color:var(--color-on-accent);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;box-shadow:3px 3px 0 var(--border-strong)}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{background:var(--panel);border:2px solid var(--border-strong);border-radius:0;min-width:0}
.card,.sec{padding:16px}
.sec{margin-bottom:14px}
.card:hover,.sec:hover,.tile:hover,.kpi:hover,.stat:hover{box-shadow:4px 4px 0 var(--color-secondary)}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h,.sec>h3{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid var(--border-strong);flex-wrap:wrap}
.card-h h3,.sec>h3{font-size:14px;font-weight:900;display:flex;align-items:center;gap:8px;min-width:0;text-transform:uppercase}
.card-h h3 .material-symbols-outlined,.sec>h3 .material-symbols-outlined{width:28px;height:28px;display:grid;place-items:center;background:var(--color-primary);color:#FFFFFF;font-size:17px}
.card-h .hint{padding:3px 7px;background:var(--color-accent);border:1px solid #000;color:#000;font-family:"Roboto Mono",monospace;font-size:10px;font-weight:700}
.sec>p{margin:0 0 13px;font-size:13px;color:var(--muted);line-height:1.75}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;font-size:13px;margin:0}
.dl dt{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase}
.dl dd{margin:0;line-height:1.8}

.kpi,.stat{padding:15px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-1px;top:-1px;width:34px;height:34px;background:var(--color-secondary);clip-path:polygon(100% 0,100% 100%,0 0)}
.kpi .ico{width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:var(--color-primary);color:#FFFFFF;position:relative;z-index:1}
.kpi .ico .material-symbols-outlined{font-size:20px}
.kpi .lbl,.stat .lbl{font-size:11px;color:var(--muted);margin-top:10px;font-weight:700;display:flex;align-items:center;gap:5px;text-transform:uppercase;letter-spacing:.04em}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{font-size:15px;color:var(--color-primary)}
.kpi .val,.stat .val{font-family:"Roboto Mono",monospace;font-size:25px;font-weight:700;letter-spacing:-.06em;margin-top:4px;font-variant-numeric:tabular-nums lining-nums}
.kpi .val small,.stat .val small{font-size:12px;font-weight:600;color:var(--muted);margin-left:4px;letter-spacing:0}
.kpi .delta,.stat .d{font-family:"Roboto Mono",monospace;font-size:10px;font-weight:700;margin-top:6px;display:inline-flex;align-items:center;gap:3px;padding:2px 5px;border:1px solid currentColor}
.delta.up,.d.up{color:#166534}.delta.down,.d.down{color:#B91C1C}.delta.flat,.d.flat{color:var(--muted)}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:14px}

.card.pad0 .card-h,.card.p0 .card-h{margin:0;padding:15px 16px 12px;border-bottom:2px solid var(--border-strong)}
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums lining-nums}
th{text-align:left;font-weight:800;color:#FFFFFF;font-size:10px;padding:10px 12px;border-right:1px solid #86D9A3;border-bottom:3px solid var(--color-accent);background:var(--color-primary);letter-spacing:.05em;white-space:nowrap;text-transform:uppercase}
th:last-child{border-right:0}
td{padding:10px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
td:last-child{border-right:0}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#F7FEF9}
tbody tr:hover{background:#D1FAE5}
td:nth-child(n+3){font-variant-numeric:tabular-nums}
td b{font-weight:800}
.mono{font-family:"Roboto Mono",monospace;font-weight:600;letter-spacing:.01em}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border:1px solid currentColor;font-size:10px;font-weight:800;white-space:nowrap}
.t-ok{background:#DCFCE7;color:#166534}.t-warn{background:#FEF3C7;color:#92400E}.t-bad{background:#FEE2E2;color:#B91C1C}.t-info{background:#DBEAFE;color:#1E40AF}.t-gray{background:#E8F0F1;color:#475569}.t-acc,.t-pink{background:#FEF3C7;color:#92400E}

.bar{height:10px;background:var(--track);border:1px solid var(--border-strong);overflow:hidden;min-width:56px}
.bar>i{display:block;height:100%;background:var(--color-primary)}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{font-family:"Roboto Mono",monospace;font-size:10px;color:var(--ink);font-weight:700;width:40px;flex:none;text-align:right;font-variant-numeric:tabular-nums}

.tl{position:relative;padding-left:28px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:3px;background:var(--border-strong)}
.tl-item,.tl-i{position:relative;padding:0 0 17px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;left:-28px;top:3px;width:17px;height:17px;background:#FFFFFF;border:4px solid var(--color-primary)}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{font-family:"Roboto Mono",monospace;font-size:10px;color:var(--muted);font-weight:700}
.tl-item b,.tl-i b{font-size:12px;display:block;margin:2px 0}
.tl-item p,.tl-i p{margin:0;font-size:11px;color:var(--muted)}

.chk{display:flex;align-items:center;gap:9px;font-size:12px;padding:9px 2px;border-bottom:1px dashed var(--border-strong)}
.chk:last-child{border-bottom:0}.chk .material-symbols-outlined{font-size:19px}.chk .ok{color:var(--ok)}.chk .wait{color:var(--muted)}.chk .bad{color:var(--bad)}.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}.chk small{color:var(--muted);font-size:10px}
.note{font-size:11px;color:var(--muted);line-height:1.7;margin-top:13px;padding-top:12px;border-top:1px dashed var(--border-strong)}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.board>*{min-width:0}
.col{background:var(--color-muted);border:2px solid var(--border-strong);padding:10px;display:flex;flex-direction:column;gap:9px}
.col-h{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:800;padding:2px 3px 6px;text-transform:uppercase}
.col-h .cnt{background:#FFFFFF;border:2px solid var(--border-strong);padding:1px 7px;font-family:"Roboto Mono",monospace;font-size:10px;color:var(--ink)}
.pcard{background:#FFFFFF;border:2px solid var(--border-strong);padding:10px;border-left:7px solid var(--color-primary)}
.pcard b{font-size:12px}.pcard .meta{font-size:10px;color:var(--muted);margin-top:5px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:10px;color:var(--ink)}
.mini-av,.av{background:var(--color-primary);color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.mini-av{width:19px;height:19px;font-size:9px}.av{width:27px;height:27px;font-size:10px}

.lane{display:flex;flex-direction:column;gap:10px}
.lane-row{display:flex;align-items:center;gap:13px;padding:11px 13px;border:2px solid var(--border-strong);background:#FFFFFF;min-width:0}
.lane-row .num{width:32px;height:32px;flex:none;background:var(--color-primary);color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-family:"Roboto Mono",monospace;font-weight:700;font-size:12px}
.lane-row .body{flex:1;min-width:0}.lane-row .body b{font-size:13px}.lane-row .body p{margin:2px 0 0;font-size:11px;color:var(--muted)}
.steps{display:flex;align-items:center;flex:none}.steps .s{width:23px;height:23px;border:2px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-family:"Roboto Mono",monospace;font-size:10px;color:var(--muted);background:#FFFFFF;z-index:1}.steps .ln{width:19px;height:3px;background:var(--line)}.steps .s.done{background:var(--color-primary);border-color:var(--color-primary);color:#FFFFFF}.steps .s.cur{border-color:var(--color-accent);background:#FEF3C7;color:#000;animation:pulse 1.6s steps(2,end) infinite}.steps .ln.done{background:var(--color-primary)}

.rep-row{display:flex;align-items:center;gap:13px;padding:11px 3px;border-bottom:1px dashed var(--border-strong);min-width:0}.rep-row:last-child{border-bottom:0}.rep-row .sku{flex:1;min-width:0}.rep-row .sku b{font-size:12px;display:block}.rep-row .sku span{font-family:"Roboto Mono",monospace;font-size:10px;color:var(--muted)}
.gauge{width:110px;flex:none}.gauge .track{height:10px;background:var(--track);border:1px solid var(--border-strong);position:relative;overflow:hidden}.gauge .track i{display:block;height:100%;background:var(--color-primary)}.gauge small{font-family:"Roboto Mono",monospace;font-size:9px;color:var(--muted);display:block;margin-top:3px;text-align:right}
.band{position:relative;height:27px;background:var(--track);border:1px solid var(--border-strong);min-width:150px}.band .rng{position:absolute;top:0;bottom:0;background:#BBF7D0}.band .mid{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--muted)}.band .me{position:absolute;top:3px;width:12px;height:19px;background:var(--color-accent);border:1px solid #000}

.tile{padding:15px;display:flex;flex-direction:column;gap:7px;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;right:0;top:0;width:28px;height:28px;background:var(--color-secondary)}
.tile:nth-child(even)::before{background:var(--color-accent)}
.tile .ti{width:38px;height:38px;background:var(--color-primary);color:#FFFFFF;display:flex;align-items:center;justify-content:center}
.tile .ti .material-symbols-outlined{font-size:20px}.tile b{font-size:13px;font-weight:800;text-transform:uppercase}.tile p{margin:0;font-size:11px;color:var(--muted);line-height:1.55}.tile .tv{font-family:"Roboto Mono",monospace;font-size:23px;font-weight:700;letter-spacing:-.05em;font-variant-numeric:tabular-nums lining-nums}.who{display:inline-flex;align-items:center;gap:6px}

#screen{display:grid;grid-template-columns:380px minmax(0,1fr);grid-auto-rows:min-content;gap:14px;align-items:start}
#screen>*{grid-column:1/-1;margin-top:0!important}
#screen>.grid.g4:first-child{grid-column:1;grid-row:1;display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px;background:transparent!important;border:0!important;padding:0!important}
#screen>.grid.g4:first-child>*{border:2px solid var(--border-strong)!important;padding:14px!important}
#screen>*:nth-child(2){grid-column:2;grid-row:1}
#screen>*:nth-child(2).grid{grid-template-columns:minmax(0,1fr)}
#screen>*:nth-child(2)>.card:first-child{min-height:306px;box-shadow:5px 5px 0 var(--color-secondary)}
#screen>*:nth-child(n+3){margin-top:2px!important}

.apexcharts-canvas text,.apexcharts-legend-text{font-family:"Roboto Mono",monospace!important}
.apexcharts-gridline{stroke:#86D9A3!important}
.apexcharts-tooltip,.apexcharts-xaxistooltip{border:2px solid var(--border-strong)!important;border-radius:0!important;box-shadow:4px 4px 0 var(--border-strong)!important}

#screen>.grid,#screen>.card{animation:chapter-in 420ms cubic-bezier(.34,1.56,.64,1) both}
#screen>*:nth-child(2){animation-delay:70ms}
#screen>*:nth-child(3){animation-delay:140ms}
#screen>*:nth-child(4){animation-delay:210ms}
@keyframes chapter-in{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

@media(max-width:1180px){
  #screen{grid-template-columns:minmax(0,1fr)}
  #screen>*,#screen>.grid.g4:first-child,#screen>*:nth-child(2){grid-column:1;grid-row:auto}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}.board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:900px){
  .app{flex-direction:column}.sidebar{width:100%;height:auto;position:static;flex-direction:row;align-items:center;flex-wrap:wrap;padding:12px 14px;border-right:0;border-bottom:4px solid var(--color-secondary)}
  .brand{padding:0 14px 0 2px;border-bottom:0}.brand-logo{width:40px;height:40px}.side-foot{display:none}.nav{flex-direction:row;flex-wrap:wrap;gap:7px;margin:0;flex:1}.nav button{min-height:42px;padding:8px 10px}.nav button.on::before{display:none}.nav .idx{display:none}.main{padding:18px 15px 44px}.topbar{padding:15px}
}
@media(max-width:768px){
  .g2,.g3,.g23,.g32{grid-template-columns:1fr}.topbar{align-items:stretch;flex-direction:column}.top-right{justify-content:flex-start}.board{grid-template-columns:1fr}.lane-row{align-items:flex-start;flex-wrap:wrap}.steps{width:100%}
}
@media(max-width:560px){
  body{font-size:13px;background-size:24px 24px}.main{padding:14px 10px 38px}.sidebar{padding:10px}.brand{width:100%}.brand-txt span{font-size:8px}.nav{display:grid;grid-template-columns:repeat(4,1fr);width:100%}.nav button{justify-content:center;min-width:44px}.nav button .txt{display:none}.topbar{margin-bottom:16px;box-shadow:4px 4px 0 var(--border-strong)}.topbar h1{font-size:18px}.topbar h1 .material-symbols-outlined{width:36px;height:36px}.top-right{display:grid;grid-template-columns:1fr auto}.top-right .chip:first-child{grid-column:1/-1}.chip{justify-content:center}.g4,#screen>.grid.g4:first-child{grid-template-columns:1fr 1fr!important}.tile{padding:12px!important}.tile .tv{font-size:19px}.tile .ti{width:34px;height:34px}.card{padding:12px}.card-h h3{font-size:12px}th,td{padding:9px 10px}.dl{grid-template-columns:1fr;gap:2px}.dl dt{margin-top:9px}
}
@media(max-width:390px){
  .g4,#screen>.grid.g4:first-child{grid-template-columns:1fr!important}.top-right{grid-template-columns:1fr auto}.chip{font-size:9px}.avatar{width:36px;height:36px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  #screen>.grid,#screen>.card{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">account_tree</span></div>
