<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>揀貨路徑優化系統（Pick Path Optimization）</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#334155;
  --color-on-primary:#ffffff;
  --color-secondary:#475569;
  --color-on-secondary:#ffffff;
  --color-accent:#059669;
  --color-on-accent:#ffffff;
  --color-background:#f8fafc;
  --color-foreground:#0f172a;
  --color-card:#ffffff;
  --color-card-foreground:#0f172a;
  --color-muted:#f2f3f4;
  --color-muted-foreground:#475569;
  --color-border:#e6e8ea;
  --color-destructive:#dc2626;
  --color-on-destructive:#ffffff;
  --color-ring:#334155;
  --blue:#334155;
  --ink:#0f172a;
  --muted:#475569;
  --line:#e6e8ea;
  --accent:#059669;
  --accent2:#10b981;
  --sub:#475569;
  --bg:#f8fafc;
  --card:#ffffff;
  --soft:#ecfdf5;
  --ok:#047857;
  --warn:#a16207;
  --bad:#dc2626;
  --info:#334155;
  --radius:8px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  background:var(--color-background);
  color:var(--color-foreground);
  font-family:"Open Sans",sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:2px;
}
.topbar{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(255,255,255,.98);
  border-bottom:1px solid var(--line);
}
.topbar-in{
  width:min(100%,1440px);
  min-height:64px;
  margin:0 auto;
  padding:8px 20px;
  display:flex;
  align-items:center;
  gap:16px;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:232px;
}
.brand .logo{
  width:38px;
  height:38px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--color-primary);
  border-radius:7px;
  background:var(--color-primary);
  color:var(--color-on-primary);
}
.brand .logo .material-symbols-outlined{font-size:21px}
.brand h1{
  margin:0;
  overflow:hidden;
  color:var(--ink);
  font-family:"Poppins","Open Sans",sans-serif;
  font-size:15px;
  font-weight:600;
  letter-spacing:.01em;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.brand .sub{
  color:var(--muted);
  font-family:"Poppins","Open Sans",sans-serif;
  font-size:10px;
  font-weight:500;
  letter-spacing:.06em;
  white-space:nowrap;
}
.nav{
  min-width:0;
  margin-left:auto;
  display:flex;
  justify-content:flex-end;
  gap:4px;
}
.nav button{
  min-height:40px;
  padding:7px 10px;
  display:flex;
  align-items:center;
  gap:6px;
  border:1px solid transparent;
  border-radius:6px;
  background:transparent;
  color:var(--muted);
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  transition:background-color 150ms ease,border-color 150ms ease,color 150ms ease;
}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{
  border-color:var(--line);
  background:var(--color-muted);
  color:var(--ink);
}
.nav button.active{
  border-color:var(--color-primary);
  background:var(--color-primary);
  color:var(--color-on-primary);
}
main{
  width:min(100%,1440px);
  min-height:calc(100vh - 125px);
  margin:0 auto;
  padding:18px 20px 44px;
}
.shead{
  margin-bottom:14px;
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  border:1px solid var(--line);
  border-left:4px solid var(--color-accent);
  border-radius:var(--radius);
  background:var(--card);
}
.shead .ic{
  width:38px;
  height:38px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #a7f3d0;
  border-radius:6px;
  background:var(--soft);
  color:var(--color-accent);
}
.shead .ic .material-symbols-outlined{font-size:22px}
.shead h2{
  margin:0;
  color:var(--ink);
  font-family:"Poppins","Open Sans",sans-serif;
  font-size:18px;
  font-weight:600;
  line-height:1.3;
}
.shead p{
  max-width:720px;
  margin:3px 0 0;
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}
.pill{
  min-height:28px;
  padding:4px 9px;
  display:inline-flex;
  align-items:center;
  gap:5px;
  border:1px solid #a7f3d0;
  border-radius:999px;
  background:var(--soft);
  color:#047857;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(300px,1fr)}
.g32{grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr)}
.kanban{grid-template-columns:repeat(4,minmax(0,1fr))}
.g4agv{grid-template-columns:minmax(0,1.3fr) minmax(300px,1fr)}
.card,.kpi,.opt,.rob{
  min-width:0;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:var(--card);
  color:var(--color-card-foreground);
}
.card{padding:14px}
.card h3{
  margin:0 0 10px;
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--ink);
  font-family:"Poppins","Open Sans",sans-serif;
  font-size:13px;
  font-weight:600;
}
.card h3 .material-symbols-outlined{
  color:var(--color-accent);
  font-size:18px;
}
.card .cap{
  margin-left:auto;
  color:var(--muted);
  font-family:"Open Sans",sans-serif;
  font-size:10px;
  font-weight:600;
  letter-spacing:.03em;
}
.kpi{
  position:relative;
  overflow:hidden;
  padding:13px 14px 13px 16px;
  transition:border-color 150ms ease,background-color 150ms ease;
}
.kpi::before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:3px;
  background:var(--color-accent);
}
.kpi:hover{
  border-color:#94a3b8;
  background:#fcfdfd;
}
.kpi .lab{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--muted);
  font-size:11px;
  font-weight:600;
}
.kpi .lab .material-symbols-outlined{
  color:var(--color-accent);
  font-size:16px;
}
.kpi .val{
  margin-top:4px;
  color:var(--ink);
  font-family:"Poppins","Open Sans",sans-serif;
  font-size:25px;
  font-weight:600;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.03em;
  line-height:1.25;
}
.kpi .val small{
  margin-left:3px;
  color:var(--muted);
  font-family:"Open Sans",sans-serif;
  font-size:11px;
  font-weight:600;
  letter-spacing:0;
}
.kpi .delta{
  min-height:19px;
  margin-top:3px;
  display:inline-flex;
  align-items:center;
  gap:3px;
  font-size:10px;
  font-weight:700;
}
.kpi .delta.up{color:#047857}
.kpi .delta.down{color:#b91c1c}
.kpi .delta .material-symbols-outlined{font-size:14px}
.chart{width:100%;height:280px;overflow:hidden}
.chart.sm{height:220px}
.tbl-wrap{
  width:100%;
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:6px;
}
table{
  width:100%;
  min-width:100%;
  border-collapse:collapse;
  color:var(--ink);
  font-size:12px;
  font-variant-numeric:tabular-nums;
}
th,td{
  height:38px;
  padding:7px 9px;
  border-bottom:1px solid var(--line);
  text-align:left;
  white-space:nowrap;
}
th{
  background:#f1f5f9;
  color:#334155;
  font-size:10px;
  font-weight:700;
  letter-spacing:.04em;
}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background-color 150ms ease}
tbody tr:hover{background:#f0fdf4}
td:first-child,
.kt,
.mv,
.tm{
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
  font-variant-numeric:tabular-nums;
}
td:nth-child(n+4){font-variant-numeric:tabular-nums}
.tag{
  min-height:21px;
  padding:2px 7px;
  display:inline-flex;
  align-items:center;
  gap:4px;
  border:1px solid currentColor;
  border-radius:4px;
  font-size:10px;
  font-weight:700;
  line-height:1.3;
}
.t-ok{background:#ecfdf5;color:#047857}
.t-warn{background:#fffbeb;color:#92400e}
.t-bad{background:#fef2f2;color:#b91c1c}
.t-info{background:#f1f5f9;color:#334155}
.t-gray{background:#f8fafc;color:#475569}
.bar-mini{
  min-width:60px;
  height:6px;
  overflow:hidden;
  border-radius:2px;
  background:#e2e8f0;
}
.bar-mini>span{
  display:block;
  height:100%;
  background:var(--color-accent);
}
.kcol{
  min-width:0;
  padding:9px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#f8fafc;
}
.kcol .khd{
  min-height:28px;
  margin-bottom:8px;
  padding:0 2px;
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--ink);
  font-size:12px;
  font-weight:700;
}
.kcol .khd .dot{
  width:8px;
  height:8px;
  flex:none;
  border:1px solid rgba(15,23,42,.25);
  border-radius:2px;
}
.kcol .khd .cnt{
  min-width:24px;
  margin-left:auto;
  padding:1px 7px;
  border:1px solid var(--line);
  border-radius:999px;
  background:#fff;
  color:var(--muted);
  font-size:10px;
  text-align:center;
}
.kcard{
  margin-bottom:7px;
  padding:9px;
  border:1px solid var(--line);
  border-radius:6px;
  background:#fff;
  transition:border-color 150ms ease,background-color 150ms ease;
}
.kcard:hover{
  border-color:#94a3b8;
  background:#f8fafc;
}
.kcard:last-child{margin-bottom:0}
.kcard .kt{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  color:var(--ink);
  font-size:12px;
  font-weight:700;
}
.kcard .km{
  margin-top:5px;
  display:flex;
  flex-wrap:wrap;
  gap:5px 9px;
  color:var(--muted);
  font-size:10px;
}
.kcard .km b{color:var(--ink)}
.kcard .kbar{margin-top:7px}
.opt{
  position:relative;
  padding:13px;
  transition:border-color 150ms ease,background-color 150ms ease;
}
.opt:hover{border-color:#94a3b8}
.opt.sel{
  border:2px solid var(--color-accent);
  background:#f0fdf4;
}
.opt .ot{
  display:flex;
  align-items:center;
  gap:7px;
  padding-right:48px;
  color:var(--ink);
  font-family:"Poppins","Open Sans",sans-serif;
  font-size:13px;
  font-weight:600;
}
.opt .ot .material-symbols-outlined{
  color:var(--color-accent);
  font-size:19px;
}
.opt .od{
  margin:6px 0 8px;
  color:var(--muted);
  font-size:11px;
  line-height:1.55;
}
.opt .obadge{
  position:absolute;
  top:10px;
  right:10px;
  padding:2px 7px;
  border-radius:4px;
  background:var(--color-accent);
  color:var(--color-on-accent);
  font-size:9px;
  font-weight:700;
}
.opt ul{
  margin:0;
  padding-left:17px;
  color:var(--muted);
  font-size:11px;
  line-height:1.65;
}
.wh{
  display:grid;
  grid-template-columns:repeat(12,minmax(0,1fr));
  gap:4px;
}
.cell{
  aspect-ratio:1/1;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(51,65,85,.12);
  border-radius:2px;
  font-size:8px;
  font-weight:700;
}
.legend{
  margin-top:10px;
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:7px;
  color:var(--muted);
  font-size:10px;
}
.legend .sw{display:inline-flex;align-items:center;gap:4px}
.legend .sw i{
  width:13px;
  height:13px;
  display:inline-block;
  border:1px solid rgba(51,65,85,.18);
  border-radius:2px;
}
.wk{
  min-height:58px;
  padding:8px 0;
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid var(--line);
}
.wk:last-child{border-bottom:0}
.av{
  width:34px;
  height:34px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:6px;
  background:var(--color-primary);
  color:var(--color-on-primary);
  font-family:"Poppins","Open Sans",sans-serif;
  font-size:12px;
  font-weight:600;
}
.wk .wi{min-width:0;flex:1}
.wk .wi .n{color:var(--ink);font-size:12px;font-weight:700}
.wk .wi .z{color:var(--muted);font-size:10px}
.wk .load{width:112px;min-width:86px}
.wk .load .bar-mini{margin-top:4px}
.wk .load .lv{
  font-size:10px;
  font-weight:700;
  text-align:right;
  font-variant-numeric:tabular-nums;
}
.tl{position:relative;padding-left:20px}
.tl::before{
  content:"";
  position:absolute;
  top:4px;
  bottom:4px;
  left:6px;
  width:1px;
  background:#cbd5e1;
}
.tl .ev{position:relative;padding:0 0 13px}
.tl .ev:last-child{padding-bottom:0}
.tl .ev .dot{
  position:absolute;
  top:3px;
  left:-18px;
  width:9px;
  height:9px;
  border:2px solid #fff;
  border-radius:50%;
  background:var(--color-accent);
  outline:1px solid var(--color-accent);
}
.tl .ev .tt{color:var(--ink);font-size:12px;font-weight:700}
.tl .ev .td{margin-top:1px;color:var(--muted);font-size:10px}
.tl .ev .tm{color:#047857;font-size:10px;font-weight:700}
.rob{padding:11px}
.rob .rh{display:flex;align-items:center;gap:8px}
.rob .rh .ri{
  width:34px;
  height:34px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid currentColor;
  border-radius:6px;
}
.rob .rh .ri .material-symbols-outlined{font-size:20px}
.rob .rh .rn{
  color:var(--ink);
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  font-size:12px;
  font-weight:700;
}
.rob .rh .rs{color:var(--muted);font-size:10px}
.rob .rmeta{margin-top:9px;display:flex;flex-wrap:wrap;gap:10px 14px}
.rob .rmeta .m{min-width:0}
.rob .rmeta .m .mk{color:var(--muted);font-size:9px;font-weight:600}
.rob .rmeta .m .mv{color:var(--ink);font-size:11px;font-weight:700}
.batt{
  height:6px;
  margin-top:8px;
  overflow:hidden;
  border-radius:2px;
  background:#e2e8f0;
}
.batt>span{display:block;height:100%}
.flexbtwn{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:8px;
}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{
  min-height:28px;
  padding:4px 9px;
  border:1px solid var(--line);
  border-radius:5px;
  background:#fff;
  color:var(--muted);
  font-size:11px;
  font-weight:600;
}
.chip.on{
  border-color:var(--color-primary);
  background:var(--color-primary);
  color:var(--color-on-primary);
}
.note{
  padding:9px 11px;
  border:1px solid #a7f3d0;
  border-left:3px solid var(--color-accent);
  border-radius:5px;
  background:#f0fdf4;
  color:#334155;
  font-size:11px;
  line-height:1.55;
}
.note b{color:#047857}
.footer{
  width:min(100%,1440px);
  margin:0 auto;
  padding:16px 20px 28px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:11px;
  line-height:1.6;
}
main>*,.card,.kpi,.opt{
  animation:reveal .35s ease-out both;
}
@keyframes reveal{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}
@media(max-width:1100px){
  .topbar-in{align-items:flex-start;flex-wrap:wrap}
  .brand{min-height:40px}
  .nav{
    width:100%;
    margin-left:0;
    justify-content:flex-start;
    overflow-x:auto;
    padding-bottom:2px;
    scrollbar-width:thin;
  }
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kanban{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:820px){
  .g3,.g2,.g23,.g32,.g4agv{grid-template-columns:1fr}
  .shead{align-items:flex-start}
  .chart{height:250px}
  .chart.sm{height:210px}
}
@media(max-width:560px){
  .topbar-in{padding:8px 12px}
  .brand{min-width:0}
  .brand .sub{display:none}
  .nav button{min-width:40px;justify-content:center;padding:8px}
  .nav button span.lbl{display:none}
  main{padding:12px 12px 32px}
  .shead{padding:12px}
  .shead .ic{width:34px;height:34px}
  .shead h2{font-size:16px}
  .shead p{font-size:11px}
  .shead>div:last-child{width:100%;margin-left:46px!important}
  .g4,.kanban{grid-template-columns:1fr}
  .card{padding:12px}
  .kpi{padding:12px 13px 12px 15px}
  .kpi .val{font-size:23px}
  .wh{grid-template-columns:repeat(8,minmax(0,1fr))}
  .wk{align-items:flex-start;flex-wrap:wrap}
  .wk .load{width:100%;padding-left:44px}
  .footer{padding:14px 12px 24px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  main>*,.card,.kpi,.opt{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">route</span></div>
      <div style="min-width:0">
        <h1>揀貨路徑優化系統</h1>
        <div class="sub">Pick Path Optimization · WMS</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</div>
<main id="app"></main>
<div class="footer">
  本頁為純 UI 系統展示（無後端），畫面與資料皆為擬真示範。揀貨路徑優化系統（Pick Path Optimization）· 倉儲物流 / WMS 倉儲管理系統。
</div>

<script>
(function(){
  "use strict";
  var app=document.getElementById("app");
  var nav=document.getElementById("nav");

  function show(i){
    disposeCharts();
    var sc=SCREENS[i]||SCREENS[0];
    app.innerHTML=sc.r();
    var btns=document.querySelectorAll("[data-i]");
    for(var b=0;b<btns.length;b++){
      btns[b].classList.toggle("active",+btns[b].getAttribute("data-i")===i);
    }
    void app.offsetHeight;

  function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
