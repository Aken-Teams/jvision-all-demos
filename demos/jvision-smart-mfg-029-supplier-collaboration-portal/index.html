<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>供應商協同管理平台 · Supplier Collaboration Portal</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --bg:#F8FAFC;
  --card:#FFFFFF;
  --soft:#F1F5F9;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#2563EB;
  --shadow:0 8px 24px rgba(15,23,42,.06);
  --shadow-hover:0 12px 28px rgba(37,99,235,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-width:320px;
  font-family:"Fira Sans",sans-serif;
  background:var(--color-background);
  color:var(--color-foreground);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,a{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid rgba(37,99,235,.28);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-size:20px;
  line-height:1;
  vertical-align:middle;
  font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;
}
.shell{display:flex;min-height:100vh}
.shell>*{min-width:0}
.side{
  width:244px;
  flex:none;
  position:sticky;
  top:0;
  height:100vh;
  z-index:30;
  display:flex;
  flex-direction:column;
  background:#fff;
  border-right:1px solid var(--line);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  padding:24px 20px 20px;
  border-bottom:1px solid var(--line);
}
.logo{
  width:42px;
  height:42px;
  flex:none;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--blue);
  border-radius:8px;
  box-shadow:0 7px 16px rgba(37,99,235,.22);
}
.logo .material-symbols-outlined{font-size:23px}
.brand b{display:block;font-size:15px;font-weight:700;letter-spacing:.01em}
.brand span:not(.material-symbols-outlined){
  display:block;
  margin-top:1px;
  color:var(--blue);
  font-family:"Fira Code",monospace;
  font-size:9px;
  font-weight:600;
  letter-spacing:.12em;
}
.nav{
  display:flex;
  flex-direction:column;
  gap:4px;
  min-width:0;
  padding:16px 12px;
}
.nav button{
  width:100%;
  min-height:44px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px 12px;
  border:1px solid transparent;
  border-radius:7px;
  background:transparent;
  color:var(--muted);
  font-weight:500;
  font-size:13px;
  text-align:left;
  white-space:nowrap;
  transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .2s ease;
}
.nav button:hover{
  color:var(--blue);
  background:#EFF6FF;
  border-color:#BFDBFE;
  transform:translateX(2px);
}
.nav button.on{
  color:#fff;
  background:var(--blue);
  border-color:var(--blue);
  box-shadow:0 5px 13px rgba(37,99,235,.18);
}
.nav button.on .material-symbols-outlined{font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 24}
.side .foot{
  margin-top:auto;
  padding:16px 20px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:11px;
  display:flex;
  align-items:center;
  gap:8px;
}
.dot{
  width:8px;
  height:8px;
  flex:none;
  border-radius:50%;
  background:var(--ok);
  box-shadow:0 0 0 3px rgba(21,128,61,.12);
  animation:pulse 2s ease-in-out infinite;
}
.main{
  flex:1;
  width:100%;
  max-width:1440px;
  padding:28px 30px 48px;
}
.vh{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:18px;
  margin-bottom:20px;
  padding-bottom:16px;
  border-bottom:1px solid var(--line);
}
.vh h2{
  margin:0;
  color:var(--ink);
  font-size:24px;
  line-height:1.2;
  font-weight:700;
  letter-spacing:-.02em;
}
.vh p{margin:6px 0 0;color:var(--muted);font-size:13px}
.live{
  min-height:34px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  flex:none;
  padding:7px 12px;
  color:#1E40AF;
  background:#EFF6FF;
  border:1px solid #BFDBFE;
  border-radius:6px;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
}
.kpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
  margin-bottom:16px;
}
.kpi{
  position:relative;
  min-width:0;
  overflow:hidden;
  padding:16px 16px 15px 18px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:8px;
  box-shadow:0 1px 2px rgba(15,23,42,.03);
  transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.kpi:hover{border-color:#BFDBFE;box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.kpi::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:3px;
  height:100%;
  background:var(--blue);
}
.kpi .l{color:var(--muted);font-size:11px;font-weight:500}
.kpi .v{
  margin-top:4px;
  color:var(--ink);
  font-family:"Fira Code",monospace;
  font-size:24px;
  line-height:1.25;
  font-weight:700;
  letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;
}
.kpi .d{margin-top:4px;font-size:11px;font-weight:600}
.kpi .ic{
  position:absolute;
  top:14px;
  right:14px;
  color:var(--blue);
  opacity:.22;
  font-size:23px;
}
.up{color:#166534}.down{color:#B91C1C}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:1.15fr .85fr}
.g21{grid-template-columns:.85fr 1.15fr}
.g11{grid-template-columns:1fr 1fr}
.card{
  min-width:0;
  padding:17px 18px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:8px;
  box-shadow:var(--shadow);
  transition:border-color .2s ease,box-shadow .2s ease;
}
.card:hover{border-color:#CBD5E1;box-shadow:0 10px 30px rgba(15,23,42,.08)}
.card h3{
  min-height:24px;
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin:0 0 14px;
  color:var(--ink);
  font-size:14px;
  line-height:1.4;
  font-weight:600;
}
.card h3 .material-symbols-outlined{color:var(--blue);font-size:19px}
.card h3 .r{margin-left:auto;color:var(--muted);font-size:10.5px;font-weight:500}
.tag{
  display:inline-flex;
  align-items:center;
  min-height:24px;
  padding:3px 9px;
  border:1px solid transparent;
  border-radius:999px;
  font-size:10.5px;
  line-height:1.2;
  font-weight:600;
  white-space:nowrap;
}
.t-ok{color:#166534;background:#F0FDF4;border-color:#BBF7D0}
.t-warn{color:#92400E;background:#FFFBEB;border-color:#FDE68A}
.t-bad{color:#991B1B;background:#FEF2F2;border-color:#FECACA}
.t-info{color:#1E40AF;background:#EFF6FF;border-color:#BFDBFE}
.t-mut{color:#475569;background:#F1F5F9;border-color:#CBD5E1}
.scroll{overflow-x:auto;scrollbar-color:#CBD5E1 transparent}
table.data{
  width:100%;
  min-width:520px;
  border-collapse:separate;
  border-spacing:0;
  color:var(--ink);
  font-size:12px;
}
table.data th,table.data td{
  padding:10px 11px;
  border-bottom:1px solid var(--line);
  text-align:left;
  vertical-align:middle;
}
table.data th{
  color:#334155;
  background:#F1F5F9;
  font-size:10.5px;
  font-weight:600;
  letter-spacing:.02em;
  white-space:nowrap;
}
table.data thead th:first-child{border-radius:5px 0 0 5px}
table.data thead th:last-child{border-radius:0 5px 5px 0}
table.data tbody tr{transition:background-color .18s ease}
table.data tbody tr:hover{background:#F8FAFC}
table.data tr:last-child td{border-bottom:0}
.chart{width:100%;min-height:240px}
.mono{
  font-family:"Fira Code",monospace;
  font-weight:600;
  font-variant-numeric:tabular-nums;
}
.bar{height:7px;min-width:60px;overflow:hidden;background:#E2E8F0;border-radius:2px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:2px}
.alist{display:flex;flex-direction:column;gap:8px}
.al{
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:10px 11px;
  background:#FFFBEB;
  border:1px solid #FDE68A;
  border-left:3px solid var(--warn);
  border-radius:5px;
}
.al.bad{background:#FEF2F2;border-color:#FECACA;border-left-color:var(--bad)}
.al.info{background:#EFF6FF;border-color:#BFDBFE;border-left-color:var(--info)}
.al .material-symbols-outlined{flex:none;color:var(--warn);font-size:18px}
.al.bad .material-symbols-outlined{color:var(--bad)}
.al.info .material-symbols-outlined{color:var(--info)}
.al b{font-size:12px;font-weight:600}
.al small{display:block;margin-top:2px;color:var(--muted);font-size:10.5px}
.al .tm{
  flex:none;
  margin-left:auto;
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:9.5px;
  white-space:nowrap;
}
.qgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.qc{
  position:relative;
  padding:15px;
  border:1px solid var(--line);
  border-radius:7px;
  transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.qc:hover{border-color:#93C5FD;box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.qc.best{border:2px solid var(--blue);background:#F8FBFF}
.qc .best-tag{
  position:absolute;
  top:-12px;
  left:13px;
  padding:4px 9px;
  color:#fff;
  background:var(--blue);
  border-radius:4px;
  font-size:9.5px;
  font-weight:600;
}
.qc .nm{font-size:14px;font-weight:600}
.qc .price{
  margin:8px 0 2px;
  color:var(--ink);
  font-family:"Fira Code",monospace;
  font-size:23px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.qc .rowk{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:6px 0;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:11px;
}
.qc .rowk b{color:var(--ink);font-family:"Fira Code",monospace}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.col{min-height:150px;padding:10px;background:#EEF2F7;border:1px solid var(--line);border-radius:7px}
.col>.h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:3px 5px 10px;
  color:#334155;
  font-size:12px;
  font-weight:600;
}
.col .cnt{
  min-width:24px;
  padding:2px 7px;
  color:#334155;
  background:#fff;
  border:1px solid #CBD5E1;
  border-radius:999px;
  font-family:"Fira Code",monospace;
  font-size:9.5px;
  text-align:center;
}
.tk{
  margin-bottom:8px;
  padding:9px 10px;
  background:#fff;
  border:1px solid var(--line);
  border-left:3px solid var(--warn);
  border-radius:5px;
  box-shadow:0 1px 2px rgba(15,23,42,.03);
  transition:border-color .2s ease,transform .2s ease;
}
.tk:hover{border-color:#93C5FD;transform:translateY(-1px)}
.tk b{font-size:11.5px;font-weight:600}
.tk .m{display:flex;justify-content:space-between;gap:6px;margin-top:4px;color:var(--muted);font-size:10px}
.tk.g{border-left-color:var(--ok)}
.tk.r{border-left-color:var(--bad)}
.tk.b{border-left-color:var(--info)}
.tl{position:relative;padding-left:23px}
.tl::before{
  content:"";
  position:absolute;
  top:5px;
  bottom:5px;
  left:7px;
  width:1px;
  background:#CBD5E1;
}
.tl .ev{position:relative;padding:0 0 17px}
.tl .ev:last-child{padding-bottom:0}
.tl .ev::before{
  content:"";
  position:absolute;
  top:3px;
  left:-21px;
  width:11px;
  height:11px;
  background:#94A3B8;
  border:2px solid #fff;
  border-radius:50%;
  box-shadow:0 0 0 2px #CBD5E1;
}
.tl .ev.done::before{background:var(--ok)}
.tl .ev.now::before{background:var(--warn);animation:pulse 1.6s ease-in-out infinite}
.tl .ev b{font-size:12.5px;font-weight:600}
.tl .ev small{display:block;margin-top:2px;color:var(--muted);font-size:10.5px}
.tl .ev .t{
  color:#1D4ED8;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:600;
}
.steps{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.stp{
  flex:1;
  min-width:92px;
  padding:9px 10px;
  color:var(--muted);
  background:#F1F5F9;
  border:1px solid var(--line);
  border-radius:6px;
  font-family:"Fira Code",monospace;
  font-size:10px;
  text-align:center;
}
.stp b{display:block;margin-top:2px;color:var(--ink);font-family:"Fira Sans",sans-serif;font-size:11.5px}
.stp.done{color:#166534;background:#F0FDF4;border-color:#BBF7D0}
.stp.done b{color:#166534}
.stp.now{color:#fff;background:var(--blue);border-color:var(--blue)}
.stp.now b{color:#fff}
.leaf{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.sc{
  min-width:0;
  overflow:hidden;
  padding:14px;
  border:1px solid var(--line);
  border-top:3px solid var(--blue);
  border-radius:7px;
  background:#fff;
  transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.sc:hover{border-color:#93C5FD;box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.sc .g{
  float:right;
  color:var(--blue);
  font-family:"Fira Code",monospace;
  font-size:26px;
  line-height:1;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.sc .gr{
  float:right;
  clear:right;
  margin-top:5px;
  padding:2px 7px;
  color:#fff;
  background:#1D4ED8;
  border-radius:3px;
  font-size:9.5px;
  font-weight:600;
}
.sc b{font-size:13.5px;font-weight:600}
.sc small{display:block;margin-top:3px;color:var(--muted);font-size:10.5px}
.sc .mt{display:flex;justify-content:space-between;margin-top:10px;color:var(--muted);font-size:10.5px}
.sc .mt b{color:var(--ink);font-family:"Fira Code",monospace;font-size:11px}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.minik{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.mk{
  padding:13px 14px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:7px;
  box-shadow:0 1px 2px rgba(15,23,42,.03);
}
.mk .l{color:var(--muted);font-size:10.5px;font-weight:500}
.mk .v{
  margin-top:3px;
  color:var(--ink);
  font-family:"Fira Code",monospace;
  font-size:20px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.reveal{animation:reveal .35s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.42}}
@media(max-width:1080px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .qgrid{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:860px){
  .shell{flex-direction:column}
  .side{
    width:auto;
    height:auto;
    position:sticky;
    flex-direction:column;
    border-right:0;
    border-bottom:1px solid var(--line);
    box-shadow:0 4px 12px rgba(15,23,42,.06);
  }
  .brand{padding:11px 15px 8px;border-bottom:0}
  .logo{width:36px;height:36px}
  .nav{flex-direction:row;overflow-x:auto;padding:0 10px 10px}
  .nav button{width:auto;flex:none}
  .nav button:hover{transform:none}
  .side .foot{display:none}
  .main{padding:20px 16px 36px}
  .g2,.g21,.g11{grid-template-columns:1fr}
}
@media(max-width:560px){
  .main{padding:18px 12px 30px}
  .vh{align-items:flex-start;margin-bottom:16px}
  .vh h2{font-size:21px}
  .vh p{font-size:12px}
  .live{min-height:30px;padding:5px 8px;font-size:10.5px}
  .kpis{gap:8px}
  .kpi{padding:13px 11px 12px 14px}
  .kpi .v{font-size:20px}
  .kpi .ic{display:none}
  .board{grid-template-columns:1fr}
  .nav button{min-width:42px;min-height:42px;padding:9px 10px}
  .nav button span:not(.material-symbols-outlined){display:none}
  .minik{grid-template-columns:1fr}
  .card{padding:14px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  .reveal{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">hub</span></div>
      <div><b>供應協同平台</b><span>SUPPLIER PORTAL</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
    <div class="foot"><span class="dot" aria-hidden="true"></span>與 ERP · WMS 即時同步</div>
  </aside>
  <main class="main" id="view" tabindex="-1"></main>
</div>
<script>
var CH=[];
var C={
  blue:"#2563EB",secondary:"#3B82F6",accent:"#EA580C",ok:"#15803D",
  warn:"#B45309",bad:"#DC2626",ink:"#1E293B",muted:"#475569",line:"#E2E8F0"
};
function destroyCharts(){CH.forEach(function(c){try{c.destroy();}catch(e){}});CH=[]}
function mk(el,opt){
  opt.chart=opt.chart||{};
  opt.chart.redrawOnParentResize=false;
  opt.chart.redrawOnWindowResize=false;
  opt.chart.animations={enabled:false};
  opt.chart.fontFamily='"Fira Sans",sans-serif';
  opt.chart.foreColor=C.muted;
  opt.tooltip=opt.tooltip||{};
  opt.tooltip.theme="light";
  var node=document.getElementById(el);
  if(!node)return;
  var c=new ApexCharts(node,opt);
  c.render();
  CH.push(c);
}
var NAV=[
  {i:"dashboard",t:"協同總覽"},
  {i:"request_quote",t:"詢比議價"},
  {i:"event_available",t:"訂單交期確認"},
  {i:"local_shipping",t:"出貨到貨追蹤"},
  {i:"fact_check",t:"品質異常協同"},
  {i:"leaderboard",t:"供應商績效"}
];

function kpi(l,v,ic,d,cls){return '<div class="kpi"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="d '+(cls||'')+'">'+d+'</div><span class="material-symbols-outlined ic" aria-hidden="true">'+ic+'</span></div>'}

function al(cls,ic,t,s,tm){return '<div class="al '+cls+'"><span class="material-symbols-outlined" aria-hidden="true">'+ic+'</span><div><b>'+t+'</b><small>'+s+'</small></div><span class="tm">'+tm+'</span></div>'}
function sr(nm,n,ot,rt,cls,st){var m={ok:"t-ok",warn:"t-warn",bad:"t-bad"};return '<tr><td><b>'+nm+'</b></td><td class="mono">'+n+'</td><td class="mono">'+ot+'</td><td class="mono">'+rt+'</td><td><span class="tag '+m[cls]+'">'+st+'</span></td></tr>'}
function qc(best,nm,price,q,lt,gr,note){return '<div class="qc'+(best?' best':'')+'">'+(best?'<span class="best-tag">建議下單</span>':'')+'<div class="nm">'+nm+'</div><div class="price">NT$ '+price+'</div><div style="font-size:10.5px;color:var(--muted);margin-bottom:7px">每 kg · 交期 '+lt+' 天</div><div class="rowk">品質分 <b>'+q+'</b></div><div class="rowk">交期(天) <b>'+lt+'</b></div><div class="rowk">合作等級 <b>'+gr+'</b></div><div style="font-size:10.5px;color:#1D4ED8;font-weight:600;margin-top:8px">'+note+'</div></div>'}
function ev(cls,t,s,tm){return '<div class="ev '+cls+'"><b>'+t+'</b><small>'+s+'</small><span class="t">'+tm+'</span></div>'}
function po(id,sup,part,need,promise,slack,cls,st){var m={ok:"t-ok",warn:"t-warn",bad:"t-bad",mut:"t-mut"};return '<tr><td class="mono">'+id+'</td><td>'+sup+'</td><td class="mono">'+part+'</td><td class="mono">'+need+'</td><td class="mono">'+promise+'</td><td class="mono">'+slack+'</td><td><span class="tag '+m[cls]+'">'+st+'</span></td></tr>'}
function col(h,items){return '<div class="col"><div class="h">'+h+'<span class="cnt">'+items.length+'</span></div>'+items.join('')+'</div>'}
function tk(cls,t,s,tag){return '<div class="tk '+cls+'"><b>'+t+'</b><div class="m"><span>'+s+'</span><span>'+tag+'</span></div></div>'}
function stp(cls,n,t){return '<div class="stp '+cls+'">'+n+'<b>'+t+'</b></div>'}
function kv(k,v){return '<tr><td style="color:var(--muted);width:38%">'+k+'</td><td><b>'+v+'</b></td></tr>'}
function scc(nm,g,gr,sub,pk,pv){return '<div class="sc"><span class="g">'+g+'</span><span class="gr">'+gr+'級</span><b>'+nm+'</b><small>'+sub+'</small><div class="mt"><span>'+pk+'</span><b>'+pv+'</b></div><div class="bar" style="margin-top:8px"><i style="width:'+g+'%"></i></div></div>'}
function pf(nm,dl,ql,sc,cls,gr,rec){var m={ok:"t-ok",info:"t-info",bad:"t-bad"};return '<tr><td><b>'+nm+'</b></td><td class="mono">'+dl+'</td><td class="mono">'+ql+'</td><td class="mono">'+sc+'</td><td><span class="tag '+m[cls]+'">'+gr+'</span></td><td>'+rec+'</td></tr>'}
var SCREENS=[s0,s1,s2,s3,s4,s5];
var DRAW=[drawS0,drawS1,drawS2,drawS3,drawS4,drawS5];
var cur=-1;
function show(i){
  if(i===cur)return;
  cur=i;
  destroyCharts();
  var view=document.getElementById("view");
  view.innerHTML=SCREENS[i]();
  view.classList.remove("reveal");
  void view.offsetWidth;
  view.classList.add("reveal");
  document.querySelectorAll("#nav button").forEach(function(b){
    var on=+b.getAttribute("data-i")===i;
    b.classList.toggle("on",on);
    b.setAttribute("aria-current",on?"page":"false");
  });
  void view.offsetHeight;
  DRAW[i]();
}
(function initNav(){
  var nav=document.getElementById("nav");
  nav.innerHTML=NAV.map(function(n,idx){
    return '<button type="button" data-i="'+idx+'" aria-label="'+n.t+'"><span class="material-symbols-outlined" aria-hidden="true">'+n.i+'</span><span>'+n.t+'</span></button>';
  }).join("");
  nav.querySelectorAll("button").forEach(function(b){
    b.addEventListener("click",function(){
      var i=+b.getAttribute("data-i");
      var next="#v"+i;
      if(location.hash===next)show(i);
      else location.hash=next;
    });
  });
})();
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return}
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
