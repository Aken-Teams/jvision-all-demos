<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>供應商協同管理平台 · Supplier Collaboration Portal</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{--accent:#b45309;--accent2:#f59e0b;--ink:#2a2016;--bg:#faf7f2;--card:#fff;--line:#ece3d5;--mut:#8a7960;--soft:#fbf5ea;--ok:#15803d;--warn:#d97706;--bad:#dc2626;--info:#2563eb}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.shell{display:flex;min-height:100vh}
.shell>*{min-width:0}
.side{width:236px;flex:none;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;min-width:0}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 8px 18px rgba(180,83,9,.3)}
.brand b{font-size:15px;font-weight:800;display:block;font-family:"Noto Sans TC"}
.brand span{font-size:9.5px;color:var(--accent);letter-spacing:1.5px;font-weight:700}
.nav{display:flex;flex-direction:column;gap:3px;padding:6px 12px;min-width:0}
.nav button{border:0;background:transparent;color:var(--mut);font:inherit;font-weight:600;font-size:13.5px;padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:11px;flex:none;white-space:nowrap;font-family:"Noto Sans TC";text-align:left;width:100%}
.nav button .material-symbols-outlined{font-size:20px;flex:none}
.nav button:hover{background:var(--soft);color:var(--accent)}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 14px rgba(180,83,9,.28)}
.side .foot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--mut);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite;flex:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.main{flex:1;min-width:0;padding:22px 26px 40px;max-width:1320px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.vh h2{margin:0;font-size:22px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:4px 0 0;color:var(--mut);font-size:13px}
.live{background:#fef3c7;color:var(--accent);padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpis>*{min-width:0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px 15px 20px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--accent),var(--accent2))}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:3px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.24}
.up{color:var(--ok)}.down{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.15fr .85fr}
.g21{grid-template-columns:.85fr 1.15fr}
.g11{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14.5px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent);font-size:20px}
.card h3 .r{margin-left:auto;font-size:11px;color:var(--mut);font-weight:600}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap;display:inline-block}
.t-ok{background:#dcfce7;color:#15803d}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#dbeafe;color:#1d4ed8}.t-mut{background:#f1ece3;color:#8a7960}
.scroll{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:var(--soft)}
table.data tr:last-child td{border-bottom:0}
.chart{width:100%}
.mono{font-family:Inter;font-weight:700}
.bar{height:8px;border-radius:6px;background:#f1ece3;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.alist{display:flex;flex-direction:column;gap:9px}
.al{display:flex;gap:11px;align-items:flex-start;border-left:3px solid var(--warn);background:#fffbeb;border-radius:0 10px 10px 0;padding:10px 12px}
.al.bad{border-color:var(--bad);background:#fef2f2}.al.info{border-color:var(--info);background:#eff6ff}
.al .material-symbols-outlined{font-size:19px;color:var(--warn);flex:none}
.al.bad .material-symbols-outlined{color:var(--bad)}.al.info .material-symbols-outlined{color:var(--info)}
.al b{font-size:12.5px;font-family:"Noto Sans TC"}
.al small{display:block;color:var(--mut);font-size:11px;margin-top:1px}
.al .tm{margin-left:auto;color:var(--mut);font-size:10.5px;white-space:nowrap;flex:none}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.qgrid>*{min-width:0}
.qc{border:1px solid var(--line);border-radius:14px;padding:14px;position:relative}
.qc.best{border-color:var(--accent);box-shadow:0 8px 20px rgba(180,83,9,.14)}
.qc .best-tag{position:absolute;top:-10px;left:14px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px}
.qc .nm{font-family:"Noto Sans TC";font-weight:800;font-size:14px}
.qc .price{font-family:Inter;font-weight:800;font-size:24px;margin:8px 0 2px}
.qc .rowk{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-top:1px dashed var(--line);color:var(--mut)}
.qc .rowk b{color:var(--ink)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.board>*{min-width:0}
.col{background:var(--soft);border-radius:14px;padding:10px;min-height:120px}
.col>.h{font-size:12.5px;font-weight:800;font-family:"Noto Sans TC";padding:2px 6px 9px;display:flex;justify-content:space-between;align-items:center}
.col .cnt{background:#fff;border:1px solid var(--line);border-radius:20px;font-size:10.5px;padding:1px 8px;color:var(--mut)}
.tk{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;padding:9px 10px;margin-bottom:8px}
.tk b{font-size:12px;font-family:"Noto Sans TC"}
.tk .m{font-size:10.5px;color:var(--mut);margin-top:3px;display:flex;justify-content:space-between;gap:6px}
.tk.g{border-left-color:var(--ok)}.tk.r{border-left-color:var(--bad)}.tk.b{border-left-color:var(--info)}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:0 0 16px}
.tl .ev:last-child{padding-bottom:0}
.tl .ev::before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--line)}
.tl .ev.done::before{background:var(--ok)}.tl .ev.now::before{background:var(--warn);animation:pulse 1.6s infinite}
.tl .ev b{font-size:13px;font-family:"Noto Sans TC"}
.tl .ev small{display:block;color:var(--mut);font-size:11px;margin-top:1px}
.tl .ev .t{font-size:10.5px;color:var(--accent);font-weight:700}
.steps{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.stp{flex:1;min-width:88px;background:var(--soft);border-radius:11px;padding:9px 10px;text-align:center;font-size:11px;color:var(--mut)}
.stp b{display:block;font-size:12px;color:var(--ink);font-family:"Noto Sans TC";margin-top:2px}
.stp.done{background:#dcfce7;color:#15803d}.stp.done b{color:#15803d}
.stp.now{background:var(--accent);color:#fff}.stp.now b{color:#fff}
.leaf{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:13px}.leaf>*{min-width:0}
.sc{border:1px solid var(--line);border-radius:14px;padding:14px;border-top:4px solid var(--accent);overflow:hidden}
.sc .g{font-size:26px;font-weight:900;font-family:Inter;float:right;line-height:1}
.sc .gr{font-size:10px;color:#fff;background:var(--accent);border-radius:6px;padding:1px 7px;font-weight:800;float:right;clear:right;margin-top:4px}
.sc b{font-family:"Noto Sans TC";font-size:14px}
.sc small{color:var(--mut);font-size:11px;display:block;margin-top:2px}
.sc .mt{display:flex;justify-content:space-between;font-size:11px;margin-top:9px;color:var(--mut)}
.sc .mt b{font-family:Inter;font-size:12px;color:var(--ink)}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.minik{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}.minik>*{min-width:0}
.mk{border:1px solid var(--line);border-radius:12px;padding:12px 13px}
.mk .l{font-size:11px;color:var(--mut);font-weight:600}
.mk .v{font-size:21px;font-weight:800;font-family:Inter;margin-top:2px}
@media(max-width:1080px){.kpis{grid-template-columns:repeat(2,1fr)}.qgrid{grid-template-columns:1fr}.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
  .shell{flex-direction:column}
  .side{width:auto;height:auto;position:sticky;top:0;z-index:30;flex-direction:column;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:12px 16px 8px}
  .nav{flex-direction:row;flex-wrap:wrap;padding:0 10px 10px}
  .nav button{width:auto;flex:none}
  .side .foot{display:none}
  .main{padding:18px 16px 34px}
  .g2,.g21,.g11{grid-template-columns:1fr}
}
@media(max-width:560px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .board{grid-template-columns:1fr}
  .nav button span:not(.material-symbols-outlined){display:none}
  .nav button{padding:9px}
  .minik{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">hub</span></div>
      <div><b>供應協同平台</b><span>SUPPLIER PORTAL</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot"><span class="dot"></span>與 ERP · WMS 即時同步</div>
  </aside>
  <main class="main" id="view"></main>
</div>
<script>
var CH=[];
function destroyCharts(){CH.forEach(function(c){try{c.destroy();}catch(e){}});CH=[];}
function mk(el,opt){opt.chart=opt.chart||{};opt.chart.redrawOnParentResize=false;opt.chart.redrawOnWindowResize=false;opt.chart.animations={enabled:false};opt.chart.fontFamily='Inter,"Noto Sans TC",sans-serif';var node=document.getElementById(el);if(!node)return;var c=new ApexCharts(node,opt);c.render();CH.push(c);}

var NAV=[
 {i:"dashboard",t:"協同總覽"},
 {i:"request_quote",t:"詢比議價"},
 {i:"event_available",t:"訂單交期確認"},
 {i:"local_shipping",t:"出貨到貨追蹤"},
 {i:"fact_check",t:"品質異常協同"},
 {i:"leaderboard",t:"供應商績效"}
];

function s0(){
  return '<div class="vh"><div><h2>協同總覽</h2><p>供應商協同即時看板 · 待辦事項與交期健康度</p></div><span class="live"><span class="dot"></span>即時作業中</span></div>'
  +'<div class="kpis">'
    +kpi('進行中採購單','142','local_mall','+8 較昨日','up')
    +kpi('準時到貨率','99.1%','schedule','+2.3%','up')
    +kpi('待確認交期','17','pending_actions','需 24h 內回覆','down')
    +kpi('品質異常件','4','report','SCAR 處理中','')
  +'</div>'
  +'<div class="grid g2">'
    +'<div class="card"><h3><span class="material-symbols-outlined">insights</span>近 8 週準時到貨率趨勢<span class="r">目標 98%</span></h3><div id="c0a" class="chart"></div></div>'
    +'<div class="card"><h3><span class="material-symbols-outlined">notifications_active</span>待處理協同事項</h3><div class="alist">'
      +al('bad','error','O達精密 PO-24118 交期逾期','承諾 08/10 到貨，目前仍未出貨','逾 2 天')
      +al('','pending','鴻運金屬 3 筆訂單待確認交期','需於今日 18:00 前回覆','2 小時前')
      +al('info','request_quote','鋁擠型-6063 詢價已收 5 家報價','可進入比價作業','30 分前')
      +al('bad','science','進料檢驗批 IQC-0912 不良率 4.2%','已自動開立 SCAR-0058','1 小時前')
      +al('','local_shipping','O群電子 ASN 已建立','預計 08/14 到貨 · 在途中','剛剛')
    +'</div></div>'
  +'</div>'
  +'<div class="grid g11" style="margin-top:16px">'
    +'<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>採購單狀態分布</h3><div id="c0b" class="chart"></div></div>'
    +'<div class="card"><h3><span class="material-symbols-outlined">groups</span>核心供應商協同活躍度<span class="r">本月</span></h3><div class="scroll"><table class="data"><thead><tr><th>供應商</th><th>在單數</th><th>準時率</th><th>回覆時效</th><th>狀態</th></tr></thead><tbody>'

      +sr('O群電子','29','98.5%','2.1h','ok','協同順暢')
      +sr('O達精密','21','91.0%','5.8h','bad','交期落後')
      +sr('昇O特殊鋼','17','97.8%','3.0h','warn','需關注')
      +sr('永信塑膠','12','100%','0.9h','ok','協同順暢')
    +'</tbody></table></div></div>'
  +'</div>';
}
function drawS0(){
  mk('c0a',{series:[{name:'準時到貨率',data:[92,93,94,95.5,96,97,98.2,99.1]}],chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:'area',height:260,toolbar:{show:false}},colors:['#b45309'],dataLabels:{enabled:false},stroke:{curve:'smooth',width:3},fill:{type:'gradient',gradient:{shadeIntensity:1,opacityFrom:.4,opacityTo:.05}},grid:{borderColor:'#ece3d5'},xaxis:{categories:['W1','W2','W3','W4','W5','W6','W7','W8']},yaxis:{min:88,max:100,labels:{formatter:function(v){return v.toFixed(0)+'%';}}}});
  mk('c0b',{series:[52,38,17,4],labels:['已確認交期','出貨在途','待確認','異常處理'],chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:'donut',height:260},colors:['#15803d','#f59e0b','#b45309','#dc2626'],legend:{position:'bottom'},dataLabels:{enabled:true,formatter:function(v){return Math.round(v)+'%';}},plotOptions:{pie:{donut:{size:'62%'}}}});
}

function s1(){
  return '<div class="vh"><div><h2>詢比議價</h2><p>詢價單 RFQ-2408-06 · 鋁擠型-6063 T5 · 需求 8,000 kg</p></div><span class="live">比價中</span></div>'
  +'<div class="minik">'
    +mkn('參考價（前次）','NT$ 96.5 /kg')
    +mkn('最低報價','NT$ 91.0 /kg')

  +'</div>'
  +'<div class="card" style="margin-bottom:16px"><h3><span class="material-symbols-outlined">compare</span>供應商報價比較<span class="r">5 家已回覆</span></h3>'
    +'<div class="qgrid">'
      +qc(true,'鴻運金屬','91.0','98','14','A','綜合最佳，建議下單')
      +qc(false,'昇O特殊鋼','92.5','96','18','A','品質佳、交期稍長')
      +qc(false,'永信金屬','94.0','92','12','B','價格偏高')
    +'</div></div>'
  +'<div class="grid g21">'
    +'<div class="card"><h3><span class="material-symbols-outlined">bar_chart</span>各家報價 vs 參考價</h3><div id="c1a" class="chart"></div></div>'
    +'<div class="card"><h3><span class="material-symbols-outlined">forum</span>議價協商紀錄</h3><div class="tl">'
      +ev('done','發出 RFQ 詢價','系統推播給 6 家合格供應商','08/06 09:12')
      +ev('done','收到首輪報價','平均 95.8 /kg · 高於參考價','08/07 14:30')
      +ev('done','發起二輪議價','要求對標最低價並提前交期','08/08 10:05')

  +'</div>';
}
function drawS1(){
  mk('c1a',{series:[{name:'報價 /kg',data:[91.0,92.5,94.0,95.5,97.0]}],chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:'bar',height:280,toolbar:{show:false}},colors:['#b45309'],plotOptions:{bar:{borderRadius:6,columnWidth:'52%',dataLabels:{position:'top'}}},dataLabels:{enabled:true,offsetY:-18,style:{colors:['#2a2016'],fontWeight:700},formatter:function(v){return v.toFixed(1);}},grid:{borderColor:'#ece3d5'},xaxis:{categories:['鴻運','昇O','永信','金鼎','O茂']},yaxis:{labels:{formatter:function(v){return v.toFixed(0);}}},annotations:{yaxis:[{y:96.5,borderColor:'#dc2626',strokeDashArray:5,label:{text:'參考價 96.5',style:{background:'#dc2626',color:'#fff'}}}]},legend:{show:false}});
}

function s2(){
  return '<div class="vh"><div><h2>訂單交期確認</h2><p>供應商線上確認訂單並承諾交期 · 系統比對需求交期標記缺料風險</p></div><span class="live">17 筆待確認</span></div>'
  +'<div class="kpis">'
    +kpi('本週應交訂單','64','event','—','')
    +kpi('已確認交期','47','task_alt','73% 完成','up')
    +kpi('交期不足告警','5','warning','需協商拉料','down')
    +kpi('平均確認時效','2.4h','timer','優於 SLA 4h','up')
  +'</div>'
  +'<div class="card"><h3><span class="material-symbols-outlined">rule</span>採購訂單交期確認清單<span class="r">RULE-01：需求日在標準交期內列為缺料風險</span></h3>'
  +'<div class="scroll"><table class="data"><thead><tr><th>採購單</th><th>供應商</th><th>料號</th><th>需求交期</th><th>承諾交期</th><th>裕度</th><th>狀態</th></tr></thead><tbody>'
    +po('PO-24211','鴻運金屬','SUS304-2.0t','08/16','08/15','+1 天','ok','已確認')
    +po('PO-24212','O群電子','PCB-4L-A1','08/18','08/18','0 天','warn','已確認·緊')
    +po('PO-24213','O達精密','CNC-BRK-07','08/17','08/20','-3 天','bad','缺料風險')
    +po('PO-24214','昇O特殊鋼','SKD11-Rod','08/22','08/21','+1 天','ok','已確認')

function al(cls,ic,t,s,tm){return '<div class="al '+cls+'"><span class="material-symbols-outlined">'+ic+'</span><div><b>'+t+'</b><small>'+s+'</small></div><span class="tm">'+tm+'</span></div>';}
function sr(nm,n,ot,rt,cls,st){var m={ok:'t-ok',warn:'t-warn',bad:'t-bad'};return '<tr><td><b>'+nm+'</b></td><td class="mono">'+n+'</td><td class="mono">'+ot+'</td><td class="mono">'+rt+'</td><td><span class="tag '+m[cls]+'">'+st+'</span></td></tr>';}
function qc(best,nm,price,q,lt,gr,note){return '<div class="qc'+(best?' best':'')+'">'+(best?'<span class="best-tag">建議下單</span>':'')+'<div class="nm">'+nm+'</div><div class="price">NT$ '+price+'</div><div style="font-size:11px;color:var(--mut);margin-bottom:6px">每 kg · 交期 '+lt+' 天</div><div class="rowk">品質分 <b>'+q+'</b></div><div class="rowk">交期(天) <b>'+lt+'</b></div><div class="rowk">合作等級 <b>'+gr+'</b></div><div style="font-size:11px;color:var(--accent);font-weight:700;margin-top:8px">'+note+'</div></div>';}
function ev(cls,t,s,tm){return '<div class="ev '+cls+'"><b>'+t+'</b><small>'+s+'</small><span class="t">'+tm+'</span></div>';}
function po(id,sup,part,need,promise,slack,cls,st){var m={ok:'t-ok',warn:'t-warn',bad:'t-bad',mut:'t-mut'};return '<tr><td class="mono">'+id+'</td><td>'+sup+'</td><td class="mono">'+part+'</td><td>'+need+'</td><td>'+promise+'</td><td class="mono">'+slack+'</td><td><span class="tag '+m[cls]+'">'+st+'</span></td></tr>';}

function stp(cls,n,t){return '<div class="stp '+cls+'">'+n+'<b>'+t+'</b></div>';}
function kv(k,v){return '<tr><td style="color:var(--mut);width:38%">'+k+'</td><td><b>'+v+'</b></td></tr>';}
function scc(nm,g,gr,sub,pk,pv){return '<div class="sc"><span class="g">'+g+'</span><span class="gr">'+gr+'級</span><b>'+nm+'</b><small>'+sub+'</small><div class="mt"><span>'+pk+'</span><b>'+pv+'</b></div><div class="bar" style="margin-top:8px"><i style="width:'+g+'%"></i></div></div>';}
function pf(nm,dl,ql,sc,cls,gr,rec){var m={ok:'t-ok',info:'t-info',bad:'t-bad'};return '<tr><td><b>'+nm+'</b></td><td class="mono">'+dl+'</td><td class="mono">'+ql+'</td><td class="mono">'+sc+'</td><td><span class="tag '+m[cls]+'">'+gr+'</span></td><td>'+rec+'</td></tr>';}

var SCREENS=[s0,s1,s2,s3,s4,s5];
var DRAW=[drawS0,drawS1,drawS2,drawS3,drawS4,drawS5];
var cur=-1;
function show(i){
  if(i===cur)return;
  cur=i;
  destroyCharts();
  var view=document.getElementById('view');
  view.innerHTML=SCREENS[i]();
  var btns=document.querySelectorAll('#nav button');
  btns.forEach(function(b){b.classList.toggle('on',+b.getAttribute('data-i')===i);});
  void view.offsetHeight;
  DRAW[i]();
}
(function initNav(){
  var nav=document.getElementById('nav');
  nav.innerHTML=NAV.map(function(n,idx){return '<button data-i="'+idx+'"><span class="material-symbols-outlined">'+n.i+'</span><span>'+n.t+'</span></button>';}).join('');
  nav.querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){show(+b.getAttribute('data-i'));});});
})();
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
