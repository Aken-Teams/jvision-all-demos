<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>預測性維護系統（PdM）｜Jvision 系統 Demo</title>
<meta name="description" content="振動/溫度/電流感測監控、故障風險評分、剩餘壽命預測（RUL）與維護排程" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400&family=Playfair+Display:ital@1&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#16A34A;
  --color-on-primary:#000000;
  --color-secondary:#22C55E;
  --color-on-secondary:#0F172A;
  --color-accent:#DC2626;
  --color-on-accent:#FFFFFF;
  --color-background:#0F172A;
  --color-foreground:#F8FAFC;
  --color-card:#111827;
  --color-card-foreground:#F8FAFC;
  --color-muted:#1E293B;
  --color-muted-foreground:#CBD5E1;
  --color-border:#334155;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#16A34A;
  --amber:#F59E0B;
  --amber-soft:#FCD34D;
  --info:#38BDF8;
  --blue:#38BDF8;
  --ink:#F8FAFC;
  --muted:#CBD5E1;
  --line:#334155;
  --bg:#0F172A;
  --panel:#111827;
  --panel2:#172033;
  --txt:#F8FAFC;
  --mut:#CBD5E1;
  --mut2:#94A3B8;
  --ok:#22C55E;
  --warn:#F59E0B;
  --bad:#EF4444;
}
*{box-sizing:border-box}
html{color-scheme:dark;scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  color:var(--color-foreground);
  background:
    radial-gradient(circle at 82% -12%,rgba(22,163,74,.18),transparent 32rem),
    radial-gradient(circle at 10% 30%,rgba(56,189,248,.055),transparent 28rem),
    var(--color-background);
  font-family:"Inter","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,a,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
  vertical-align:middle;
}
.topnav{
  position:sticky;
  top:0;
  z-index:30;
  border-bottom:1px solid rgba(51,65,85,.9);
  background:rgba(8,15,29,.94);
  box-shadow:0 12px 32px rgba(0,0,0,.22);
  backdrop-filter:blur(14px);
}
.topnav-in{
  max-width:1440px;
  min-height:64px;
  margin:auto;
  padding:9px 20px;
  display:flex;
  align-items:center;
  gap:18px;
}
.brand{display:flex;align-items:center;gap:11px;min-width:max-content}
.logo{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border:1px solid rgba(34,197,94,.55);
  border-radius:10px;
  color:#86EFAC;
  background:linear-gradient(145deg,#12351f,#0b2014);
  box-shadow:0 0 20px rgba(22,163,74,.22),inset 0 1px rgba(255,255,255,.05);
}
.logo .material-symbols-outlined{font-size:22px}
.brand b{display:block;font-size:14px;letter-spacing:.02em}
.brand span{display:block;color:var(--mut2);font-size:10px;letter-spacing:.09em;text-transform:uppercase}
.nav{
  display:flex;
  align-items:center;
  gap:3px;
  min-width:0;
  overflow-x:auto;
  scrollbar-width:none;
}
.nav::-webkit-scrollbar{display:none}
.nav button{
  min-height:42px;
  flex:none;
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px 10px;
  border:1px solid transparent;
  border-radius:8px;
  color:var(--mut);
  background:transparent;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  transition:background-color .18s ease,color .18s ease,border-color .18s ease;
}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{color:#fff;background:#1E293B}
.nav button.on{
  color:#BBF7D0;
  border-color:rgba(34,197,94,.38);
  background:rgba(22,163,74,.14);
  box-shadow:inset 0 -2px var(--color-primary);
}
.live{
  margin-left:auto;
  min-width:max-content;
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--mut);
  font-size:11px;
}
.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--ok);
  box-shadow:0 0 10px rgba(34,197,94,.72);
}
.wrap{width:min(100%,1440px);margin:auto;padding:22px 20px}
.head{
  margin:0 0 16px;
  padding:0 2px 14px;
  border-bottom:1px solid rgba(51,65,85,.64);
}
.head h1{
  margin:0;
  display:flex;
  align-items:center;
  gap:9px;
  font-size:clamp(19px,2vw,25px);
  line-height:1.25;
  letter-spacing:-.025em;
}
.head h1 .material-symbols-outlined{color:#4ADE80}
.head p{max-width:850px;margin:6px 0 0;color:var(--mut);font-size:12.5px}
.grid{display:grid;gap:12px;min-width:0}
.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:minmax(0,2fr) minmax(320px,1fr)}
.g32{grid-template-columns:minmax(320px,1fr) minmax(0,2fr)}
.card,.kpi{
  border:1px solid var(--color-border);
  background:linear-gradient(160deg,rgba(17,24,39,.98),rgba(12,19,32,.98));
  box-shadow:0 10px 30px rgba(0,0,0,.16),inset 0 1px rgba(255,255,255,.025);
}
.card{min-width:0;padding:15px;border-radius:10px}
.card h3{
  min-height:24px;
  margin:0 0 11px;
  display:flex;
  align-items:center;
  gap:8px;
  color:#F8FAFC;
  font-size:13px;
  font-weight:700;
  letter-spacing:.005em;
}
.card h3 .material-symbols-outlined{color:#4ADE80;font-size:18px}
.card h3 .sub{
  margin-left:auto;
  color:var(--mut2);
  font-family:"JetBrains Mono",monospace;
  font-size:10px;
  font-weight:400;
}
.kpi{
  position:relative;
  min-height:122px;
  overflow:hidden;
  padding:14px 15px;
  border-radius:10px;
}
.kpi::before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:3px;
  background:var(--color-primary);
}
.kpi::after{
  content:"";
  position:absolute;
  width:72px;
  height:72px;
  top:-40px;
  right:-30px;
  border-radius:50%;
  background:rgba(34,197,94,.13);
  filter:blur(2px);
}
.kpi .lab{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--mut);
  font-size:11px;
  font-weight:600;
}
.kpi .lab .material-symbols-outlined{color:#86EFAC;font-size:16px}
.kpi .val{
  margin:7px 0 3px;
  color:#fff;
  font-size:28px;
  font-weight:800;
  line-height:1.12;
  letter-spacing:-.04em;
  text-shadow:0 0 10px rgba(248,250,252,.12);
}
.kpi .val small{margin-left:4px;color:var(--mut);font-size:11px;font-weight:500}
.delta{display:flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600}
.delta .material-symbols-outlined{font-size:14px}
.up{color:#86EFAC}.down{color:#FCA5A5}.flat{color:#CBD5E1}
.chart{width:100%;height:260px}
.chart.sm{height:210px}
.chart.lg{height:320px}
.ovx{overflow-x:auto;scrollbar-color:#475569 #111827}
.tbl{width:100%;min-width:560px;border-collapse:collapse;font-size:12px}
.tbl th{
  padding:9px 10px;
  border-bottom:1px solid #475569;
  color:#CBD5E1;
  background:#0D1626;
  font-size:10px;
  font-weight:700;
  letter-spacing:.045em;
  text-align:left;
  text-transform:uppercase;
  white-space:nowrap;
}
.tbl td{
  padding:10px;
  border-bottom:1px solid rgba(51,65,85,.62);
  color:#E2E8F0;
  white-space:nowrap;
}
.tbl td.mono,.tbl td:nth-last-child(1){font-variant-numeric:tabular-nums}
.tbl tr:hover td{background:rgba(30,41,59,.65)}
.tbl tr:last-child td{border-bottom:0}
.mono{
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.03em;
}
.pill{
  display:inline-flex;
  align-items:center;
  gap:4px;
  min-height:22px;
  padding:2px 8px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:10px;
  font-weight:700;
  white-space:nowrap;
}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.p-ok{color:#86EFAC;background:rgba(22,101,52,.26)}
.p-warn{color:#FCD34D;background:rgba(146,64,14,.25)}
.p-bad{color:#FCA5A5;background:rgba(153,27,27,.28)}
.p-info{color:#7DD3FC;background:rgba(3,105,161,.22)}
.p-mut{color:#CBD5E1;background:#1E293B}
.bar{height:6px;min-width:64px;overflow:hidden;border-radius:4px;background:#263449}
.bar>i{display:block;height:100%;border-radius:inherit}
.sensor,.rul,.alerts{display:flex;flex-direction:column;gap:8px}
.sens-row,.rul-item{
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px;
  border:1px solid rgba(51,65,85,.9);
  border-radius:8px;
  background:#151F30;
}
.sens-ic{
  width:36px;
  height:36px;
  flex:none;
  display:grid;
  place-items:center;
  border:1px solid #334155;
  border-radius:8px;
  color:#86EFAC;
  background:#101827;
}
.sens-ic .material-symbols-outlined{font-size:19px}
.sens-info{min-width:0;flex:1}
.sens-info b{font-size:12px}
.sens-info div{color:var(--mut2);font-size:10.5px}
.sens-val{flex:none;text-align:right}
.sens-val b{font-size:15px}
.sens-val>span:not(.pill){display:block;color:var(--mut2);font-size:10px}
.matrix{
  min-width:480px;
  display:grid;
  grid-template-columns:54px repeat(5,1fr);
  gap:4px;
}
.mx-cell,.mx-lab{
  min-height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:6px;
  text-align:center;
  font-size:10px;
  font-weight:800;
}
.mx-cell{border:1px solid rgba(255,255,255,.19);color:#07110A}
.mx-lab{color:#CBD5E1}
.rul-ring{flex:none}
.rul-body{min-width:0;flex:1}
.rul-body b{font-size:12px}
.rul-body .meta{margin-top:2px;color:var(--mut2);font-size:10.5px}
.rul-track{height:6px;margin-top:7px;overflow:hidden;border-radius:4px;background:#263449}
.rul-track>i{display:block;height:100%;border-radius:inherit}
.alert{
  display:flex;
  gap:11px;
  padding:11px;
  border:1px solid #334155;
  border-left:4px solid var(--mut2);
  border-radius:8px;
  background:#151F30;
}
.alert.sev-crit{border-left-color:var(--bad)}
.alert.sev-warn{border-left-color:var(--warn)}
.alert.sev-info{border-left-color:var(--info)}
.alert .ai{
  width:34px;
  height:34px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:7px;
  background:#0F1828;
}
.alert.sev-crit .ai{color:#FCA5A5}
.alert.sev-warn .ai{color:#FCD34D}
.alert.sev-info .ai{color:#7DD3FC}
.alert .ab{min-width:0;flex:1}
.alert .t{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12px;font-weight:700}
.alert .d{margin-top:3px;color:var(--mut);font-size:10.5px}
.alert .at{flex:none;color:var(--mut2);font-family:"JetBrains Mono",monospace;font-size:9.5px;text-align:right}
.gantt{min-width:680px}
.gt-head,.gt-row{display:grid;grid-template-columns:178px 1fr;gap:10px}
.gt-head{margin-bottom:4px}
.gt-row{align-items:center;padding:7px 0;border-bottom:1px solid rgba(51,65,85,.56)}
.gt-row:last-child{border:0}
.gt-lab b{font-size:11px}
.gt-lab div{color:var(--mut2);font-size:10px}
.gt-days{display:grid;grid-template-columns:repeat(7,1fr);color:var(--mut2);font-family:"JetBrains Mono",monospace;font-size:9.5px;text-align:center}
.gt-track{position:relative;height:25px;overflow:hidden;border-radius:5px;background:#0D1625}
.gt-grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr)}
.gt-grid>i{border-right:1px dashed #334155}
.gt-bar{
  position:absolute;
  top:4px;
  height:17px;
  overflow:hidden;
  padding:1px 7px;
  border-radius:4px;
  color:#07110A;
  font-size:9px;
  font-weight:800;
  white-space:nowrap;
}
.legend{display:flex;gap:13px;flex-wrap:wrap;color:var(--mut);font-size:10.5px}
.legend i,.stat-list i.d{
  width:9px;
  height:9px;
  display:inline-block;
  margin-right:5px;
  border-radius:2px;
  border:1px solid rgba(255,255,255,.22);
  vertical-align:middle;
}
.donut-wrap{display:flex;align-items:center;gap:12px}
.stat-list{min-width:0;flex:1;display:flex;flex-direction:column;gap:8px}
.stat-list .sl{display:flex;align-items:center;font-size:11px}
.stat-list .sl b{margin-left:auto}
.foot{padding:22px 0 8px;color:#94A3B8;font-size:10.5px;text-align:center}
.reveal{animation:reveal .35s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1100px){
  .topnav-in{align-items:flex-start;flex-wrap:wrap}
  .nav{order:3;width:100%}
  .live{padding-top:10px}
  .g4{grid-template-columns:repeat(2,1fr)}
  .g23,.g32{grid-template-columns:1fr}
}
@media(max-width:768px){
  .wrap{padding:16px 12px}
  .topnav-in{padding:8px 12px}
  .g2,.g3{grid-template-columns:1fr}
  .chart.lg{height:280px}
}
@media(max-width:560px){
  .brand span,.live{display:none}
  .nav button{min-width:42px;justify-content:center;padding:8px}
  .nav button .lbl{display:none}
  .g4{grid-template-columns:1fr 1fr;gap:8px}
  .kpi{min-height:112px;padding:12px}
  .kpi .val{font-size:23px}
  .card{padding:12px}
  .head p{font-size:12px}
  .alert{align-items:flex-start}
  .alert .at{display:none}
  .rul-item{align-items:flex-start}
}
@media(max-width:390px){
  .g4{grid-template-columns:1fr}
  .kpi{min-height:auto}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
    transition-duration:.01ms!important;
  }
  .reveal{animation:none;opacity:1;transform:none}
}
</style>
</head>
<body>
<header class="topnav">
  <div class="topnav-in">
    <div class="brand">
      <div class="logo" aria-hidden="true"><span class="material-symbols-outlined">precision_manufacturing</span></div>
      <div><b>PdM 預測維護中控</b><span>Predictive Maintenance Terminal</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="系統功能"></nav>
    <div class="live" aria-label="連線狀態：128 台設備連線">
      <span class="dot" aria-hidden="true"></span>
      <span>連線正常 · 128 台設備 · 快照 10:52</span>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="view" aria-live="polite"></div>
  <footer class="foot">Jvision PdM Demo · 純前端假資料展示 · 感測數據收集 → 特徵擷取 → 故障預測 → 剩餘壽命 → 風險告警 → 維護排程</footer>
</main>

<script>
var NAV=[
  {ic:"sensors",t:"感測監控"},
  {ic:"scatter_plot",t:"特徵擷取"},
  {ic:"online_prediction",t:"故障預測"},
  {ic:"hourglass_bottom",t:"剩餘壽命"},
  {ic:"notifications_active",t:"風險告警"},
  {ic:"event_available",t:"維護排程"}
];
var view=document.getElementById("view");
var charts=[];
var C={
  green:"#22C55E",green2:"#4ADE80",red:"#EF4444",amber:"#F59E0B",
  blue:"#38BDF8",purple:"#A78BFA",axis:"#475569",muted:"#CBD5E1",
  grid:"#253247",tip:"#0B1220",border:"#334155",text:"#F8FAFC"
};
var AXIS={
  axisLine:{lineStyle:{color:C.axis}},
  axisLabel:{color:C.muted,fontFamily:"Inter",fontSize:10},
  splitLine:{lineStyle:{color:C.grid}},
  axisTick:{lineStyle:{color:C.axis}}
};
var GRID={left:40,right:18,top:28,bottom:28,containLabel:true};

function disposeCharts(){
  for(var i=0;i<charts.length;i++){
    try{charts[i].dispose()}catch(e){}
  }
  charts=[];
}
function mk(el,opt){
  if(!el)return;
  var c=echarts.init(el);
  c.setOption(opt);
  charts.push(c);
  return c;
}
function tip(extra){
  return Object.assign({
    trigger:"axis",
    backgroundColor:C.tip,
    borderColor:C.border,
    textStyle:{color:C.text,fontSize:11}
  },extra||{});
}
function esc(s){
  return String(s).replace(/[&<>"]/g,function(c){
    return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}
function kpi(ic,lab,val,unit,dir,note){
  var cls=dir==="up"?"up":dir==="down"?"down":"flat";
  var arw=dir==="up"?"trending_up":dir==="down"?"trending_down":"trending_flat";
  return '<article class="kpi"><div class="lab"><span class="material-symbols-outlined" aria-hidden="true">'+ic+'</span>'+lab+'</div>'+
    '<div class="val mono">'+val+'<small>'+unit+'</small></div>'+
    '<div class="delta '+cls+'"><span class="material-symbols-outlined" aria-hidden="true">'+arw+'</span>'+note+'</div></article>';
}
function statLine(c,n,v){
  return '<div class="sl"><i class="d" style="background:'+c+'" aria-hidden="true"></i>'+esc(n)+'<b class="mono">'+v+'%</b></div>';
}
function ring(pct,color){
  var r=18,circ=2*Math.PI*r,off=circ*(1-pct/100);
  return '<svg width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="健康度 '+pct+'%">'+
    '<circle cx="24" cy="24" r="'+r+'" fill="none" stroke="#263449" stroke-width="5"/>'+
    '<circle cx="24" cy="24" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+circ+'" stroke-dashoffset="'+off+'" transform="rotate(-90 24 24)"/>'+
    '<text x="24" y="28" text-anchor="middle" fill="#F8FAFC" font-family="JetBrains Mono" font-size="11">'+pct+'</text></svg>';
}
function wo(id,eq,part,inv,cls,st){
  return '<tr><td class="mono"><b>'+id+'</b><div style="font:10px Inter;color:var(--mut2)">'+eq+'</div></td>'+
    '<td>'+esc(part)+'</td><td class="mono" style="text-align:right">'+inv+'</td><td><span class="pill '+cls+'">'+st+'</span></td></tr>';
}
function head(ic,title,desc){
  return '<section class="head"><h1><span class="material-symbols-outlined" aria-hidden="true">'+ic+'</span>'+title+'</h1><p>'+desc+'</p></section>';
}

/* SCREEN 0：感測監控 */
function s0(){
  var sensors=[
    {ic:"vibration",n:"CNC-01 主軸振動",loc:"精加工線 A",v:"4.8",u:"mm/s",st:"warn",bar:62},
    {ic:"device_thermostat",n:"CNC-01 軸承溫度",loc:"精加工線 A",v:"71.2",u:"°C",st:"warn",bar:71},
    {ic:"bolt",n:"PUMP-07 馬達電流",loc:"冷卻循環站",v:"18.4",u:"A",st:"ok",bar:41},

var SCREENS=[s0,s1,s2,s3,s4,s5];

function show(i){
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  disposeCharts();
  var btns=document.querySelectorAll("#nav button");
  for(var b=0;b<btns.length;b++){
    var active=b===i;
    btns[b].classList.toggle("on",active);
    btns[b].setAttribute("aria-current",active?"page":"false");
  }
  SCREENS[i]();
}
(function initNav(){
  var html="";
  for(var i=0;i<NAV.length;i++){
    html+='<button type="button" data-i="'+i+'" aria-label="'+NAV[i].t+'"><span class="material-symbols-outlined" aria-hidden="true">'+NAV[i].ic+'</span><span class="lbl">'+NAV[i].t+'</span></button>';
  }
  document.getElementById("nav").innerHTML=html;
  var btns=document.querySelectorAll("#nav button");
  for(var k=0;k<btns.length;k++){
    (function(idx){
      btns[idx].addEventListener("click",function(){
        try{location.hash="v"+idx}catch(e){show(idx)}
      });
    })(k);
  }
})();
window.addEventListener("resize",function(){
  for(var i=0;i<charts.length;i++){
    try{charts[i].resize()}catch(e){}
  }
});
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  var n=document.querySelectorAll("[data-i]").length||6;
  show(m?Math.min(+m[1],n-1):0);
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
