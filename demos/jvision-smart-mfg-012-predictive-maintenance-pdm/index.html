<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>預測性維護系統（PdM）｜Jvision 系統 Demo</title>
<meta name="description" content="振動/溫度/電流感測監控、故障風險評分、剩餘壽命預測（RUL）與維護排程" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#be185d; --accent2:#fb7185;
  --bg:#0b0f16; --panel:#121824; --panel2:#171f2e; --line:#26304260;
  --line2:#2a3446; --txt:#e6ecf5; --mut:#8b97ab; --mut2:#5f6c82;
  --ok:#34d399; --warn:#fbbf24; --bad:#fb7185; --info:#60a5fa;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:radial-gradient(1200px 600px at 80% -10%,#1a1024 0%,transparent 60%),var(--bg);
  color:var(--txt); min-height:100vh; -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle}
/* NAV */
.topnav{
  position:sticky;top:0;z-index:30;background:rgba(9,12,19,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line2);
}
.topnav-in{display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;flex:none;
  box-shadow:0 4px 14px #be185d55;
}
.brand .logo .material-symbols-outlined{font-size:20px}
.brand b{font-size:15px;letter-spacing:.2px;white-space:nowrap}
.brand span{display:block;font-size:11px;color:var(--mut);font-weight:500}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:6px}
.nav button{
  flex:none;white-space:nowrap;cursor:pointer;border:1px solid transparent;
  background:transparent;color:var(--mut);font-family:inherit;font-weight:600;font-size:13px;
  padding:8px 12px;border-radius:9px;display:flex;align-items:center;gap:7px;transition:.15s;
}
.nav button .material-symbols-outlined{font-size:19px}
.nav button:hover{color:var(--txt);background:#1c2332}
.nav button.on{color:#fff;background:linear-gradient(135deg,var(--accent),#9f1250);border-color:#be185d55;box-shadow:0 4px 14px #be185d40}
@media(max-width:560px){.nav button .lbl{display:none}.nav button{padding:8px 9px}.live{display:none}.brand span{display:none}}
.live{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);white-space:nowrap}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 #34d39980;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #34d39980}70%{box-shadow:0 0 0 7px #34d39900}100%{box-shadow:0 0 0 0 #34d39900}}
/* LAYOUT */
.wrap{max-width:1360px;margin:0 auto;padding:18px}
.head{margin:2px 2px 14px}
.head h1{margin:0;font-size:20px;font-weight:800;display:flex;align-items:center;gap:9px}
.head h1 .material-symbols-outlined{color:var(--accent2);font-size:24px}
.head p{margin:5px 0 0;color:var(--mut);font-size:13px}
.grid{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1fr 1fr}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1fr 2fr}
.grid>*{min-width:0}
@media(max-width:820px){.g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,var(--panel),#0f141d);border:1px solid var(--line2);border-radius:14px;padding:16px;min-width:0}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent2)}
.card h3 .sub{margin-left:auto;font-size:11px;color:var(--mut);font-weight:500}
/* KPI */
.kpi{background:linear-gradient(180deg,var(--panel2),#10151f);border:1px solid var(--line2);border-radius:14px;padding:15px 16px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,#be185d33,transparent 70%)}
.kpi .lab{font-size:12px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--accent2)}
.kpi .val{font-size:27px;font-weight:800;margin:6px 0 2px;letter-spacing:.3px}
.kpi .val small{font-size:13px;color:var(--mut);font-weight:600;margin-left:3px}
.kpi .delta{font-size:12px;font-weight:700;display:flex;align-items:center;gap:3px}
.kpi .delta .material-symbols-outlined{font-size:15px}
.up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--mut)}
/* CHART */
.chart{width:100%;height:260px}
.chart.sm{height:210px}
.chart.lg{height:320px}
/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
.tbl th{text-align:left;color:var(--mut);font-weight:600;font-size:11.5px;letter-spacing:.4px;padding:9px 10px;border-bottom:1px solid var(--line2);text-transform:uppercase;white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid #1c2432;white-space:nowrap}
.tbl tr:hover td{background:#161d2a}
.tbl tr:last-child td{border-bottom:none}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.ovx{overflow-x:auto}
/* BADGE / PILL */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill .material-symbols-outlined{font-size:14px}
.p-bad{background:#4c1622;color:#fda4af}
.p-warn{background:#4a3611;color:#fcd34d}
.p-ok{background:#123a2c;color:#6ee7b7}
.p-info{background:#12304c;color:#93c5fd}
.p-mut{background:#232c3c;color:#9aa6ba}
.bar{height:7px;border-radius:6px;background:#232c3c;overflow:hidden;min-width:64px}
.bar>i{display:block;height:100%;border-radius:6px}
/* GAUGE ROW */
.sensor{display:flex;flex-direction:column;gap:10px}
.sens-row{display:flex;align-items:center;gap:12px;padding:11px 12px;background:var(--panel2);border:1px solid var(--line2);border-radius:11px}
.sens-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;background:#1c2332;color:var(--accent2)}
.sens-ic .material-symbols-outlined{font-size:21px}
.sens-info{min-width:0;flex:1}
.sens-info b{font-size:13.5px}
.sens-info div{font-size:11.5px;color:var(--mut)}
.sens-val{text-align:right;flex:none}
.sens-val b{font-size:17px}
.sens-val span{font-size:11px;color:var(--mut);display:block}
/* RISK MATRIX */
.matrix{display:grid;grid-template-columns:auto repeat(5,1fr);grid-auto-rows:1fr;gap:5px;min-width:460px}
.mx-cell{border-radius:8px;padding:8px 6px;min-height:52px;position:relative;font-size:11px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:#0b0f16;font-weight:800}
.mx-lab{background:transparent;color:var(--mut);font-weight:700;display:flex;align-items:center;justify-content:center;min-height:auto;font-size:11px}
.mx-tag{position:absolute;top:3px;right:4px;font-size:10px;background:#00000030;padding:1px 5px;border-radius:6px}
/* TIMELINE / RUL cards */
.rul{display:flex;flex-direction:column;gap:11px}
.rul-item{display:flex;gap:12px;align-items:center;padding:12px;background:var(--panel2);border:1px solid var(--line2);border-radius:12px}
.rul-ring{flex:none}
.rul-body{flex:1;min-width:0}
.rul-body b{font-size:14px}
.rul-body .meta{font-size:11.5px;color:var(--mut);margin-top:2px}
.rul-track{height:8px;border-radius:6px;background:#232c3c;margin-top:9px;overflow:hidden;position:relative}
.rul-track>i{display:block;height:100%;border-radius:6px}
/* ALERT board */
.alerts{display:flex;flex-direction:column;gap:10px}
.alert{display:flex;gap:12px;padding:13px;border-radius:12px;background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--mut2)}
.alert.sev-crit{border-left-color:var(--bad)}
.alert.sev-warn{border-left-color:var(--warn)}
.alert.sev-info{border-left-color:var(--info)}
.alert .ai{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:#1c2332}
.alert.sev-crit .ai{color:var(--bad)} .alert.sev-warn .ai{color:var(--warn)} .alert.sev-info .ai{color:var(--info)}
.alert .ab{flex:1;min-width:0}
.alert .ab .t{font-size:13.5px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.alert .ab .d{font-size:12px;color:var(--mut);margin-top:3px}
.alert .at{font-size:11px;color:var(--mut2);white-space:nowrap;text-align:right;flex:none}
/* GANTT */
.gantt{min-width:680px}
.gt-row{display:grid;grid-template-columns:170px 1fr;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #1c2432}
.gt-row:last-child{border-bottom:none}
.gt-lab{font-size:12.5px;min-width:0}
.gt-lab b{font-size:12.5px}
.gt-lab div{font-size:11px;color:var(--mut)}
.gt-track{position:relative;height:26px;background:#141b27;border-radius:7px;overflow:hidden}
.gt-grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr)}
.gt-grid>i{border-right:1px dashed #23303f}
.gt-bar{position:absolute;top:4px;height:18px;border-radius:6px;display:flex;align-items:center;padding:0 8px;font-size:10.5px;font-weight:700;color:#fff;overflow:hidden;white-space:nowrap}
.gt-head{display:grid;grid-template-columns:170px 1fr;gap:10px;margin-bottom:4px}
.gt-days{display:grid;grid-template-columns:repeat(7,1fr);font-size:10.5px;color:var(--mut);text-align:center}
/* SEG / feature legend */
.seg{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:9px;background:#1c2332;color:var(--mut);border:1px solid var(--line2)}
.chip.on{background:linear-gradient(135deg,var(--accent),#9f1250);color:#fff;border-color:transparent}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
.foot{text-align:center;color:var(--mut2);font-size:11.5px;padding:22px 0 8px}
.donut-wrap{display:flex;align-items:center;gap:14px}
.stat-list{display:flex;flex-direction:column;gap:9px;flex:1;min-width:0}
.stat-list .sl{display:flex;align-items:center;gap:8px;font-size:12.5px}
.stat-list .sl b{margin-left:auto;font-variant-numeric:tabular-nums}
.stat-list .sl i.d{width:9px;height:9px;border-radius:3px;flex:none}
</style>
</head>
<body>
<div class="topnav"><div class="topnav-in">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">precision_manufacturing</span></div>
    <div><b>PdM 預測維護中控</b><span>Predictive Maintenance Terminal</span></div>
  </div>
  <div class="nav" id="nav"></div>
  <div class="live"><span class="dot"></span>即時串流 · 128 台設備連線</div>
</div></div>
<div class="wrap"><div id="view"></div>
  <div class="foot">Jvision PdM Demo · 純前端假資料展示 · 感測數據收集 → 特徵擷取 → 故障預測 → 剩餘壽命 → 風險告警 → 維護排程</div>
</div>

<script>
var NAV=[
  {ic:"sensors",t:"感測監控"},
  {ic:"scatter_plot",t:"特徵擷取"},
  {ic:"online_prediction",t:"故障預測"},
  {ic:"hourglass_bottom",t:"剩餘壽命"},
  {ic:"notifications_active",t:"風險告警"},
  {ic:"event_available",t:"維護排程"}
];
var view=document.getElementById("view");
var charts=[];
function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
function mk(el,opt){var c=echarts.init(el);c.setOption(opt);charts.push(c);return c;}
var AXIS={axisLine:{lineStyle:{color:"#3a465c"}},axisLabel:{color:"#8b97ab"},splitLine:{lineStyle:{color:"#1e2734"}},axisTick:{lineStyle:{color:"#3a465c"}}};
var GRID={left:44,right:18,top:26,bottom:30,containLabel:true};
function tip(extra){return Object.assign({trigger:"axis",backgroundColor:"#0f141d",borderColor:"#2a3446",textStyle:{color:"#e6ecf5",fontSize:12}},extra||{});}

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

/* ============ SCREEN 0 : 感測監控 ============ */
function s0(){
  var sensors=[
    {ic:"vibration",n:"CNC-01 主軸振動",loc:"精加工線 A",v:"4.8",u:"mm/s",st:"warn",bar:62},
    {ic:"device_thermostat",n:"CNC-01 軸承溫度",loc:"精加工線 A",v:"71.2",u:"°C",st:"warn",bar:71},
    {ic:"bolt",n:"PUMP-07 馬達電流",loc:"冷卻循環站",v:"18.4",u:"A",st:"ok",bar:41},
    {ic:"vibration",n:"FAN-12 風機振動",loc:"排氣機房",v:"2.1",u:"mm/s",st:"ok",bar:28},
    {ic:"device_thermostat",n:"COMP-03 壓縮機溫",loc:"氣壓站",v:"88.6",u:"°C",st:"bad",bar:90},
    {ic:"bolt",n:"ROBOT-05 伺服電流",loc:"焊接單元 B",v:"12.7",u:"A",st:"ok",bar:38}
  ];
  var stMap={ok:["p-ok","正常","var(--ok)"],warn:["p-warn","注意","var(--warn)"],bad:["p-bad","異常","var(--bad)"]};
  var rows=sensors.map(function(s){var m=stMap[s.st];
    return '<div class="sens-row"><div class="sens-ic"><span class="material-symbols-outlined">'+s.ic+'</span></div>'+
      '<div class="sens-info"><b>'+esc(s.n)+'</b><div>'+esc(s.loc)+'</div>'+
      '<div class="bar" style="margin-top:6px"><i style="width:'+s.bar+'%;background:'+m[2]+'"></i></div></div>'+
      '<div class="sens-val"><b class="mono">'+s.v+'</b><span>'+s.u+'</span>'+
      '<span class="pill '+m[0]+'" style="margin-top:4px">'+m[1]+'</span></div></div>';
  }).join("");

  view.innerHTML=
  '<div class="head"><h1><span class="material-symbols-outlined">sensors</span>感測即時監控牆</h1>'+
  '<p>邊緣閘道器持續採集振動 / 溫度 / 電流三軸訊號，回傳中控牆即時判讀。</p></div>'+
  '<div class="grid g4" style="margin-bottom:14px">'+
    kpi("monitor_heart","連線設備","128","台","up","+3 今日上線")+
    kpi("warning","異常設備","5","台","down","2 需即刻處理")+
    kpi("swap_vert","訊號採樣率","10","kHz","flat","邊緣端下採樣")+
    kpi("cloud_done","資料完整率","99.6","%","up","+0.4% 週")+
  '</div>'+
  '<div class="grid g23">'+
    '<div class="card"><h3><span class="material-symbols-outlined">show_chart</span>CNC-01 主軸振動趨勢（近 60 分鐘）<span class="sub">mm/s · 門檻 5.0</span></h3><div id="c0a" class="chart"></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">list_alt</span>設備感測讀值</h3><div class="sensor">'+rows+'</div></div>'+
  '</div>'+
  '<div class="grid g2" style="margin-top:14px">'+
    '<div class="card"><h3><span class="material-symbols-outlined">thermostat</span>三軸溫度熱力對比<span class="sub">°C</span></h3><div id="c0b" class="chart sm"></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">electric_bolt</span>馬達電流波形（單週期）<span class="sub">A</span></h3><div id="c0c" class="chart sm"></div></div>'+
  '</div>';
  void view.offsetHeight;

  var t=[],vib=[],thr=[];for(var i=0;i<60;i++){t.push((i-59)+"′");var base=3.6+Math.sin(i/6)*0.5+i*0.018;vib.push(+(base+(i>50?0.5:0)).toFixed(2));thr.push(5.0);}
  mk(document.getElementById("c0a"),{tooltip:tip(),grid:GRID,legend:{data:["振動 RMS","警戒門檻"],textStyle:{color:"#8b97ab"},right:10,top:0},
    xAxis:Object.assign({type:"category",data:t},AXIS),yAxis:Object.assign({type:"value",min:2,max:6},AXIS),
    series:[
      {name:"振動 RMS",type:"line",data:vib,smooth:true,symbol:"none",lineStyle:{width:2.5,color:"#fb7185"},areaStyle:{color:"rgba(251,113,133,.14)"}},
      {name:"警戒門檻",type:"line",data:thr,symbol:"none",lineStyle:{width:1.5,color:"#fbbf24",type:"dashed"}}
    ]});

  mk(document.getElementById("c0b"),{tooltip:tip(),grid:GRID,legend:{data:["軸承","電機","環境"],textStyle:{color:"#8b97ab"},top:0},
    xAxis:Object.assign({type:"category",data:["10:00","10:10","10:20","10:30","10:40","10:50"]},AXIS),yAxis:Object.assign({type:"value"},AXIS),
    series:[
      {name:"軸承",type:"line",data:[64,66,68,69,70,71],smooth:true,symbol:"none",lineStyle:{color:"#be185d",width:2}},
      {name:"電機",type:"line",data:[52,53,54,55,56,58],smooth:true,symbol:"none",lineStyle:{color:"#fb7185",width:2}},
      {name:"環境",type:"line",data:[28,28,29,29,30,30],smooth:true,symbol:"none",lineStyle:{color:"#60a5fa",width:2}}
    ]});

  var cur=[];for(var k=0;k<50;k++){cur.push(+(18.4*Math.sin(k/50*Math.PI*2)+ (Math.random()*0.6-0.3)).toFixed(2));}
  mk(document.getElementById("c0c"),{tooltip:tip(),grid:GRID,xAxis:Object.assign({type:"category",data:cur.map(function(_,i){return i;}),show:false},AXIS),
    yAxis:Object.assign({type:"value",min:-22,max:22},AXIS),
    series:[{type:"line",data:cur,symbol:"none",smooth:true,lineStyle:{width:2,color:"#fb7185"},areaStyle:{color:"rgba(190,24,93,.16)"}}]});
}

/* ============ SCREEN 1 : 特徵擷取 ============ */
function s1(){
  var feats=[
    {n:"RMS 均方根",v:"4.82",tr:"+8%",st:"warn",imp:82},
    {n:"峰度 Kurtosis",v:"6.14",tr:"+21%",st:"bad",imp:94},
    {n:"波峰因數 Crest",v:"3.7",tr:"+4%",st:"warn",imp:61},
    {n:"1x 轉頻幅值",v:"0.42",tr:"+2%",st:"ok",imp:33},
    {n:"BPFO 外環頻",v:"0.58",tr:"+35%",st:"bad",imp:97},
    {n:"諧波總失真",v:"12.4%",tr:"+6%",st:"warn",imp:55},
    {n:"包絡能量",v:"8.9",tr:"+18%",st:"warn",imp:73},
    {n:"偏度 Skewness",v:"0.31",tr:"-1%",st:"ok",imp:22}
  ];
  var stM={ok:"p-ok",warn:"p-warn",bad:"p-bad"};
  var trs=feats.map(function(f){
    return '<tr><td><b>'+esc(f.n)+'</b></td><td class="mono">'+f.v+'</td>'+
      '<td class="mono">'+f.tr+'</td>'+
      '<td><span class="pill '+stM[f.st]+'">'+(f.st==="bad"?"顯著":f.st==="warn"?"偏移":"穩定")+'</span></td>'+
      '<td><div class="bar"><i style="width:'+f.imp+'%;background:linear-gradient(90deg,#be185d,#fb7185)"></i></div></td>'+
      '<td class="mono">'+f.imp+'</td></tr>';
  }).join("");

  view.innerHTML=
  '<div class="head"><h1><span class="material-symbols-outlined">scatter_plot</span>特徵擷取工作台</h1>'+
  '<p>對原始波形做 FFT 頻譜與統計特徵工程，萃取模型可判讀的健康指標與重要度。</p></div>'+
  '<div class="grid g4" style="margin-bottom:14px">'+

function wo(id,eq,part,inv,cls,st){
  return '<tr><td class="mono"><b>'+id+'</b><div style="font-size:11px;color:var(--mut)">'+eq+'</div></td>'+
    '<td>'+esc(part)+'</td><td class="mono">'+inv+'</td><td><span class="pill '+cls+'">'+st+'</span></td></tr>';
}

/* ============ helpers ============ */
function kpi(ic,lab,val,unit,dir,note){
  var cls=dir==="up"?"up":dir==="down"?"down":"flat";
  var arw=dir==="up"?"trending_up":dir==="down"?"trending_down":"trending_flat";
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+ic+'</span>'+lab+'</div>'+
    '<div class="val mono">'+val+'<small>'+unit+'</small></div>'+
    '<div class="delta '+cls+'"><span class="material-symbols-outlined">'+arw+'</span>'+note+'</div></div>';
}
function statLine(c,n,v){
  return '<div class="sl"><i class="d" style="background:'+c+'"></i>'+esc(n)+'<b class="mono">'+v+'%</b></div>';
}
function ring(pct,color){
  var r=18,circ=2*Math.PI*r,off=circ*(1-pct/100);
  return '<svg width="48" height="48" viewBox="0 0 48 48"><circle cx="24" cy="24" r="'+r+'" fill="none" stroke="#232c3c" stroke-width="5"/>'+
    '<circle cx="24" cy="24" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+circ+'" stroke-dashoffset="'+off+'" transform="rotate(-90 24 24)"/>'+
    '<text x="24" y="28" text-anchor="middle" fill="#e6ecf5" font-size="12" font-weight="700">'+pct+'</text></svg>';
}

var SCREENS=[s0,s1,s2,s3,s4,s5];
function show(i){
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  disposeCharts();
  var btns=document.querySelectorAll("#nav button");
  for(var b=0;b<btns.length;b++)btns[b].classList.toggle("on",b===i);
  SCREENS[i]();
}
(function initNav(){
  var html="";for(var i=0;i<NAV.length;i++){
    html+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+NAV[i].ic+'</span><span class="lbl">'+NAV[i].t+'</span></button>';
  }
  document.getElementById("nav").innerHTML=html;
  var btns=document.querySelectorAll("#nav button");
  for(var k=0;k<btns.length;k++){(function(idx){btns[idx].addEventListener("click",function(){show(idx);try{history.replaceState(null,"","#v"+idx);}catch(e){}});})(k);}
})();
window.addEventListener("resize",function(){for(var i=0;i<charts.length;i++){try{charts[i].resize();}catch(e){}}});
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m)return;var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
