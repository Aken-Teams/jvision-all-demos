<style>
:root{

}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{

}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;vertical-align:middle;}
.ms{font-size:20px;}
.topbar{position:sticky;top:0;z-index:40;background:linear-gradient(100deg,var(--accent-d),var(--accent));color:#fff;border-bottom:3px solid var(--accent2);}

.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand .logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.brand .logo .material-symbols-outlined{font-size:24px;color:#eafff2;}
.brand h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.3px;line-height:1.2;}
.brand p{font-size:11px;margin:0;opacity:.82;font-weight:500;}
.top-meta{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:5px;}
.navrow{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:60px;z-index:35;}
.navrow-in{max-width:1360px;margin:0 auto;padding:8px 14px;display:flex;gap:8px;flex-wrap:wrap;}
.navbtn{border:1px solid var(--line);background:#fff;color:var(--mut);border-radius:10px;padding:8px 13px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:7px;min-width:0;transition:.15s;}
.navbtn .material-symbols-outlined{font-size:19px;}
.navbtn:hover{border-color:var(--accent2);color:var(--accent-d);}
.navbtn.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 12px rgba(21,128,61,.28);}
.navbtn .idx{font-size:10px;opacity:.7;font-weight:700;}
.wrap{max-width:1360px;margin:0 auto;padding:20px 18px 60px;}
.screen-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.screen-head .t{min-width:0;}
.screen-head h2{margin:0;font-size:21px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:9px;}
.screen-head h2 .material-symbols-outlined{font-size:26px;color:var(--accent);}
.screen-head p{margin:3px 0 0;color:var(--mut);font-size:13px;}
.tagchip{margin-left:auto;background:var(--soft);color:var(--accent-d);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700;}
.grid{display:grid;gap:14px;}
.g-kpi{grid-template-columns:repeat(4,1fr);}
.g-2{grid-template-columns:1fr 1fr;}
.g-3{grid-template-columns:repeat(3,1fr);}
.g-2-1{grid-template-columns:1.6fr 1fr;}
@media(max-width:820px){

}
.min0{min-width:0;}

.tl-item{position:relative;padding:0 0 16px 8px;}

.prow{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
.prow:last-child{margin-bottom:0;}
.prow .lbl{width:104px;flex:0 0 auto;font-size:12.5px;font-weight:600;min-width:0;}
.prow .track{flex:1;height:12px;border-radius:8px;background:var(--soft);overflow:hidden;min-width:0;}
.prow .track>span{display:block;height:100%;border-radius:8px;}
.prow .pv{width:56px;text-align:right;font-size:12px;font-weight:800;flex:0 0 auto;font-variant-numeric:tabular-nums;}
.opt{border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff;position:relative;min-width:0;}

.opt .m{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;border-bottom:1px dashed var(--line);}
.opt .m:last-child{border-bottom:none;}
.opt .m b{font-variant-numeric:tabular-nums;}
.strip{display:flex;gap:10px;flex-wrap:wrap;}
.strip .s{flex:1;min-width:130px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:11px 13px;}
.strip .s .l{font-size:11.5px;color:var(--mut);font-weight:600;}
.strip .s .v{font-size:19px;font-weight:800;margin-top:3px;}
.foot{max-width:1360px;margin:0 auto;padding:18px;color:var(--mut);font-size:11.5px;text-align:center;}
.note{font-size:12px;color:var(--mut);background:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:9px 12px;display:flex;gap:7px;align-items:flex-start;}
.note .material-symbols-outlined{font-size:18px;color:var(--accent);flex:0 0 auto;}
@media(max-width:560px){
  .nav-tx{display:none;}
  .navbtn{padding:9px 11px;}
  .brand p{display:none;}
}
</style>

function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function head(icon,title,sub,tag){

/* SCREEN 0 : 庫齡總覽儀表 */
function s0(){
  var totAmt=0;BRACKETS.forEach(function(b){totAmt+=b.amount;});
  var obs=BRACKETS[2].amount+BRACKETS[3].amount;
  var obsRatio=(obs/totAmt*100).toFixed(1);
  var h=head("monitoring","庫齡總覽儀表","呆滯金額、庫齡結構與趨勢即時掌握","中壢配銷倉 · 即時");

  h+=kpi("","庫存總金額",money(totAmt),"inventory_2","本月 +2.1%","up");
  h+=kpi("k-amber","呆滯料金額",money(obs),"warning","占比 "+obsRatio+"%","down");
  h+=kpi("k-red","365 天以上","208 項","hourglass_bottom","$274 萬積壓","down");
  h+=kpi("k-blue","本月去化率","24.3%","recycling","較上月 +2.7pt","up");
  h+='</div>';
  h+='<div class="grid g-2-1" style="margin-bottom:14px">';
  h+='<div class="card"><div class="card-h"><span class="material-symbols-outlined">bar_chart</span><h3>各庫齡區間金額分布</h3><span class="sub">單位：新台幣</span></div><div class="chart-box" style="height:260px"><canvas id="c0bar"></canvas></div></div>';
  h+='<div class="card"><div class="card-h"><span class="material-symbols-outlined">donut_large</span><h3>庫齡結構占比</h3></div><div class="chart-box" style="height:260px"><canvas id="c0pie"></canvas></div></div>';
  h+='</div>';
  h+='<div class="card"><div class="card-h"><span class="material-symbols-outlined">insights</span><h3>呆滯金額 6 個月趨勢</h3><span class="sub">目標線：$400 萬</span></div><div class="chart-box" style="height:220px"><canvas id="c0line"></canvas></div></div>';
  return h;
}

function buildNav(){
  var nav=document.getElementById("nav"),html="";
  SCREENS.forEach(function(s,i){
    html+='<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+s.icon+'</span><span class="nav-tx">'+s.label+'</span><span class="idx">'+i+'</span></button>';
  });
  nav.innerHTML=html;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    (function(b){b.addEventListener("click",function(){show(+b.getAttribute("data-i"));try{window.scrollTo(0,0);}catch(e){}});})(btns[j]);
  }
}

function show(i){
  var sc=SCREENS[i]||SCREENS[0];
  var cont=document.getElementById("screen");
  killCharts();
  cont.innerHTML=sc.render();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){btns[k].classList.toggle("active",+btns[k].getAttribute("data-i")===i);}
  void cont.offsetHeight;
  if(sc.charts){try{sc.charts();}catch(e){}}
}

buildNav();

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
