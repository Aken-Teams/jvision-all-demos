body{

}

.wrap{max-width:1440px;margin:auto;padding:34px 24px 72px}
.screen-head{
  margin-bottom:22px;

  gap:16px;

.g-kpi{grid-template-columns:repeat(4,1fr)}

.card,.kpi,.opt,.strip .s,.kcol{

.card{padding:18px;box-shadow:5px 5px 0 #cbd5e1}

.strip .v{margin-top:4px;font:700 20px/1.25 "Poppins","Open Sans",sans-serif;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow:auto;border:2px solid var(--color-primary)}

.bar-td{min-width:150px}
.mini-bar,.kbar,.track{overflow:hidden;background:#e2e8f0;border:1px solid #94a3b8}

.b-red{color:#991b1b;background:#fee2e2}
.b-blue{color:#075985;background:#e0f2fe}
.b-grey{color:#334155;background:#e2e8f0}

.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kcol{padding:12px;background:var(--color-muted)}

.dot{width:12px;height:12px;border:2px solid #fff}

.kcard{margin-bottom:10px;padding:11px;background:#fff;border:2px solid var(--color-primary)}
.kcard:last-child{margin-bottom:0}
.code{color:#075985;font-size:12px;font-weight:700}
.nm{margin:2px 0 7px;font-weight:700}
.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:11px}
.amt{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.kbar{height:7px;margin-top:8px}
.opt{position:relative;padding:16px;border-top:8px solid var(--grey)}
.opt.best{border-top-color:var(--green);box-shadow:6px 6px 0 #6ee7b7}
.rec{position:absolute;right:10px;top:8px;padding:3px 7px;color:#fff;background:var(--green);border:1px solid var(--ink);font-size:10px;font-weight:700}
.opt h4{margin:0 0 10px;display:flex;align-items:center;gap:7px;font:700 15px "Poppins",sans-serif}
.opt h4 span{color:var(--green)}
.opt .m{padding:5px 0;display:flex;justify-content:space-between;border-bottom:1px dashed #94a3b8;font-size:12px}
.opt .m b{font-variant-numeric:tabular-nums}
.tl{position:relative;padding-left:27px}
.tl:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:3px;background:var(--color-primary)}
.tl-item{position:relative;padding:0 0 17px 7px}
.tl-item:last-child{padding-bottom:0}
.node{position:absolute;left:-26px;top:1px;width:16px;height:16px;border:3px solid #fff;outline:2px solid var(--color-primary)}
.tl-item h4{margin:0;display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:13px}
.when{color:var(--muted);font-size:11px}
.tl-item p{margin:2px 0 0;color:var(--muted);font-size:12px}
.prow{margin-bottom:13px;display:flex;align-items:center;gap:10px}
.prow:last-child{margin-bottom:0}
.lbl{width:120px;font-size:12px;font-weight:700}
.track{height:14px;flex:1}
.pv{width:48px;text-align:right;font:700 12px ui-monospace,monospace}
.note{
  padding:11px 13px;
  display:flex;
  align-items:flex-start;
  gap:8px;
  color:#334155;
  background:#fefce8;
  border:2px dashed var(--color-primary);
  font-size:12px;
}
.note>span{color:var(--green);font-size:19px}
.foot{
  padding:20px;
  color:#e2e8f0;
  background:var(--color-primary);
  border-top:6px solid var(--color-accent);
  text-align:center;
  font-size:11px;
}
.grid-item{animation:arrive .4s both cubic-bezier(.18,.89,.32,1.28)}
.grid-item:nth-child(2){animation-delay:.06s}
.grid-item:nth-child(3){animation-delay:.12s}
.grid-item:nth-child(4){animation-delay:.18s}
@keyframes arrive{from{opacity:0;transform:translateY(16px) scale(.92)}to{opacity:1;transform:none}}
@media(max-width:1024px){
  .g-kpi{grid-template-columns:repeat(2,1fr)}
  .kanban{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:768px){
  .topbar-in{padding:10px 16px}
  .top-meta{margin-left:0;width:100%}
  .navrow{top:122px}
  .navrow-in{padding:0 16px}
  .wrap{padding:28px 16px 56px}
  .g-2,.g-3,.g-2-1{grid-template-columns:1fr}
  .screen-head{box-shadow:5px 5px 0 var(--color-accent)}
}
@media(max-width:520px){
  .brand p,.top-meta .pill:last-child,.nav-tx{display:none}
  .topbar-in{min-height:68px}
  .top-meta{width:auto;margin-left:auto}
  .navrow{top:74px}
  .navbtn{min-width:50px;justify-content:center;padding:10px}
  .g-kpi,.kanban{grid-template-columns:1fr}
  .screen-head{padding:17px}
  .tagchip{margin-left:0}
  .card-h{align-items:flex-start}
  .card-h .sub{max-width:42%;text-align:right}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
