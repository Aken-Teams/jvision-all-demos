<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>司機工時排班所 · TMS｜Jvision 系統 Demo</title>
<meta name="description" content="司機班表編排、工時累計、休息合規到換班補位的排班管理（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Josefin+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#00FF41;
  --color-on-primary:#0F172A;
  --color-secondary:#008F11;
  --color-on-secondary:#000000;
  --color-accent:#FF3333;
  --color-on-accent:#000000;
  --color-background:#0D1117;
  --color-foreground:#E6EDF3;
  --color-card:#182424;
  --color-card-foreground:#E6EDF3;
  --color-muted:#25292F;
  --color-muted-foreground:#A8B4C4;
  --color-border:#30363D;
  --color-destructive:#EF4444;
  --color-on-destructive:#000000;
  --color-ring:#00FF41;

  --blue:#00FF41;
  --ink:#E6EDF3;
  --muted:#A8B4C4;
  --line:#30363D;

  --green:#00FF41;
  --amber:#FFD166;
  --red:#FF5B5B;
  --sky:#63B3FF;
  --violet:#B39DFF;
  --surface:#12191E;
  --surface-2:#182424;
  --surface-3:#202D2D;
  --grid:rgba(0,255,65,.075);
  --glow:0 0 22px rgba(0,255,65,.12);
  --font-display:"Cinzel","Noto Serif TC",serif;
  --font-body:"Josefin Sans","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --font-mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{color-scheme:dark;scroll-behavior:smooth}
html,body{margin:0;min-width:320px}
body{
  font-family:var(--font-body);
  background:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px),
    radial-gradient(circle at 82% 0,rgba(0,255,65,.08),transparent 34rem),
    var(--color-background);
  background-size:32px 32px,32px 32px,auto,auto;
  color:var(--color-foreground);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
button,.tk{cursor:pointer}
.material-symbols-outlined{
  font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
  line-height:1;
}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{
  position:sticky;top:0;height:100vh;z-index:30;
  display:flex;flex-direction:column;overflow-y:auto;
  padding:18px 14px;
  color:var(--color-foreground);
  background:
    linear-gradient(180deg,rgba(0,255,65,.055),transparent 28%),
    rgba(10,15,19,.97);
  border-right:1px solid var(--color-border);
}
.side::after{
  content:"";position:absolute;inset:0 0 auto;height:2px;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--color-primary),transparent);
  box-shadow:0 0 14px var(--color-primary);
}
.brand{
  display:flex;align-items:center;gap:11px;min-width:0;
  margin-bottom:20px;padding:7px 7px 17px;
  border-bottom:1px solid var(--color-border);
}
.brand .logo{
  width:42px;height:42px;flex:none;display:grid;place-content:center;
  color:var(--color-primary);background:#0B1511;
  border:1px solid rgba(0,255,65,.65);
  border-radius:3px;box-shadow:inset 0 0 14px rgba(0,255,65,.08),var(--glow);
  clip-path:polygon(0 8px,8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%);
}
.brand .logo .material-symbols-outlined{font-size:25px}
.brand b{
  display:block;color:#fff;font-family:var(--font-display);
  font-size:14px;font-weight:700;letter-spacing:.08em;white-space:nowrap;
}
.brand span{font-size:10px;color:var(--color-primary);font-weight:600;letter-spacing:.15em}
.nav{display:flex;flex-direction:column;gap:5px;min-width:0}
.nav button{
  position:relative;display:flex;align-items:center;gap:11px;width:100%;min-height:44px;
  padding:10px 12px;border:1px solid transparent;border-radius:2px;
  background:transparent;color:#B7C2CE;font-size:13px;font-weight:600;
  text-align:left;letter-spacing:.035em;transition:background .18s,border-color .18s,color .18s,box-shadow .18s;
}
.nav button::before{
  content:"";width:2px;height:0;position:absolute;left:0;top:50%;
  background:var(--color-primary);box-shadow:0 0 8px var(--color-primary);
  transform:translateY(-50%);transition:height .18s;
}
.nav button:hover{background:rgba(0,255,65,.055);border-color:#284335;color:#fff}
.nav button.on{
  color:var(--color-primary);background:rgba(0,255,65,.09);
  border-color:rgba(0,255,65,.38);box-shadow:inset 0 0 18px rgba(0,255,65,.035);
}
.nav button.on::before{height:64%}
.nav button .material-symbols-outlined{font-size:20px;flex:none}
.nav button .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .foot{
  margin-top:auto;padding-top:18px;font-family:var(--font-mono);
  font-size:10px;color:#82909E;line-height:1.65;
}
.side .foot .u{
  display:flex;align-items:center;gap:9px;margin-bottom:10px;padding:10px;
  background:rgba(24,36,36,.72);border:1px solid var(--color-border);border-radius:2px;
}
.side .foot .u .av,.tk .av{
  display:grid;place-content:center;flex:none;color:var(--color-on-primary);
  background:var(--color-primary);font-weight:700;
}
.side .foot .u .av{width:31px;height:31px;border-radius:2px;font-size:12px}
.side .foot .u b{display:block;color:#fff;font-size:12px}
.side .foot .u span{font-size:10px;color:var(--color-muted-foreground)}
.main{min-width:0;display:flex;flex-direction:column}
.top{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  min-height:72px;padding:12px 24px;background:rgba(13,17,23,.88);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--color-border);
}
.top::after{
  content:"";position:absolute;left:0;bottom:-1px;width:28%;height:1px;
  background:linear-gradient(90deg,var(--color-primary),transparent);
}
.top h1{
  margin:0;color:#fff;font-family:var(--font-display);font-size:17px;
  font-weight:600;letter-spacing:.08em;
}
.top .sub{font-size:11px;color:var(--color-muted-foreground);letter-spacing:.06em}
.top .r{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.live{
  display:inline-flex;align-items:center;gap:7px;padding:5px 10px;
  color:#D9FFE3;background:rgba(0,255,65,.08);border:1px solid rgba(0,255,65,.3);
  border-radius:2px;font-family:var(--font-mono);font-size:10.5px;font-weight:700;
}
.live .dot{
  width:7px;height:7px;border:1px solid var(--color-primary);
  background:var(--color-primary);box-shadow:0 0 8px var(--color-primary);
  animation:pulse 2.2s ease-in-out infinite;
}
.body{padding:21px 24px 44px;min-width:0}
.vh{
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  margin-bottom:16px;flex-wrap:wrap;
}
.vh h2{
  display:flex;align-items:center;gap:9px;margin:0;color:#fff;
  font-family:var(--font-display);font-size:20px;font-weight:600;letter-spacing:.045em;
}
.vh h2 .material-symbols-outlined,.card>h3 .material-symbols-outlined{color:var(--color-primary)}
.vh p{max-width:720px;margin:5px 0 0;color:#B3BFCC;font-size:12.5px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;
  padding:0 15px;border:1px solid var(--color-primary);border-radius:2px;
  color:var(--color-on-primary);background:var(--color-primary);
  box-shadow:0 0 13px rgba(0,255,65,.14);font-size:12px;font-weight:700;
  letter-spacing:.035em;transition:transform .18s,box-shadow .18s,background .18s,color .18s;
}
.btn:hover{background:#6AFF8F;box-shadow:0 0 20px rgba(0,255,65,.3);transform:translateY(-1px)}
.btn.ghost{color:#D8FFE2;background:rgba(0,255,65,.035);border-color:#356546;box-shadow:none}
.btn.ghost:hover{color:var(--color-primary);background:rgba(0,255,65,.09);border-color:var(--color-primary)}
.btn .material-symbols-outlined{font-size:18px}
button:focus-visible,.tk:focus-visible,a:focus-visible{
  outline:2px solid var(--color-ring);outline-offset:3px;box-shadow:0 0 0 5px rgba(0,255,65,.16);
}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin-bottom:17px}
.kpi{
  position:relative;min-width:0;padding:13px 15px;
  background:linear-gradient(135deg,rgba(24,36,36,.94),rgba(18,25,30,.96));
  border:1px solid var(--color-border);border-radius:3px;overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,.17);
}
.kpi::before{
  content:"";position:absolute;left:0;top:0;width:34px;height:1px;background:var(--color-primary);
  box-shadow:0 0 9px var(--color-primary);
}
.kpi::after{
  content:"";position:absolute;right:7px;top:7px;width:5px;height:5px;
  border-top:1px solid #587065;border-right:1px solid #587065;
}
.kpi .l{
  display:flex;align-items:center;gap:6px;color:#ADB9C6;
  font-size:11px;font-weight:600;letter-spacing:.04em;
}
.kpi .l .material-symbols-outlined{font-size:16px;color:var(--color-primary)}
.kpi .v{
  margin-top:4px;color:#fff;font-family:var(--font-mono);
  font-size:24px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums;
}
.kpi .v small{font-family:var(--font-body);font-size:11px;color:#A8B4C4;font-weight:600}
.kpi .d{margin-top:4px;font-size:10.5px;font-weight:700}
.up{color:#68FF8C}.dn{color:#FF8585}.fl{color:#B2BDCA}
.grid{display:grid;gap:15px}.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.g2b{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{
  position:relative;min-width:0;padding:16px 18px;
  background:linear-gradient(145deg,rgba(24,36,36,.97),rgba(17,25,29,.97));
  border:1px solid var(--color-border);border-radius:3px;
  box-shadow:0 12px 30px rgba(0,0,0,.19);
}
.card::before,.pc::before,.col::before{
  content:"";position:absolute;left:-1px;top:-1px;width:20px;height:20px;
  border-left:1px solid var(--color-primary);border-top:1px solid var(--color-primary);pointer-events:none;
}
.card>h3{
  display:flex;align-items:center;gap:8px;margin:0 0 13px;padding-bottom:10px;
  color:#F4F8FB;border-bottom:1px solid var(--color-border);
  font-size:13px;font-weight:700;letter-spacing:.045em;
}
.card>h3 .material-symbols-outlined{font-size:19px}
.card>h3 .grow{margin-left:auto;color:var(--color-primary);font-family:var(--font-mono);font-size:10px}
.chart{width:100%}
.apexcharts-text,.apexcharts-legend-text{fill:#B6C2CE!important;color:#B6C2CE!important;font-family:var(--font-body)!important}
.apexcharts-gridline{stroke:#35413F!important}
.apexcharts-tooltip,.apexcharts-xaxistooltip{
  color:#E6EDF3!important;background:#111A1D!important;border-color:#40504B!important;
}
.tblwrap{overflow-x:auto;scrollbar-color:#496154 #12191E}
.tbl{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.tbl th{
  padding:9px 10px;color:#C1CCD6;background:#111B1D;border-bottom:1px solid #456052;
  font-size:10px;font-weight:700;text-align:left;white-space:nowrap;letter-spacing:.05em;
}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--color-border);white-space:nowrap}
.tbl tbody tr:hover td{background:rgba(0,255,65,.035)}
.tbl td b{color:#F2F7FA}
.tbl th:nth-child(n+2):not(:last-child),.tbl td:nth-child(n+2):not(:last-child){font-variant-numeric:tabular-nums}
.tbl td[style*="text-align:center"],.tbl th[style*="text-align:center"]{text-align:center!important}
.tag{
  display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border:1px solid;
  border-radius:2px;font-size:10px;font-weight:700;line-height:1.2;white-space:nowrap;
}
.t-ok{color:#8BFFA5;background:rgba(0,255,65,.09);border-color:#347648}
.t-warn{color:#FFE08A;background:rgba(255,209,102,.1);border-color:#766633}
.t-bad{color:#FF9999;background:rgba(255,51,51,.11);border-color:#793E42}
.t-info{color:#9FCDFF;background:rgba(99,179,255,.1);border-color:#3B6383}
.t-pink{color:#8BFFA5;background:rgba(0,143,17,.13);border-color:#32713A}
.t-grey{color:#C0C9D2;background:rgba(148,163,184,.09);border-color:#4A535E}
.bar{height:6px;min-width:70px;overflow:hidden;background:#2A3437;border:1px solid #3A4647;border-radius:0}
.bar span{display:block;height:100%}
.cal,.mtx,.tl{overflow-x:auto;scrollbar-color:#496154 #12191E}
.cal-grid{
  display:grid;grid-template-columns:118px repeat(7,minmax(96px,1fr));min-width:820px;
  overflow:hidden;border:1px solid var(--color-border);border-radius:2px;
}
.cal-grid .hd{
  padding:9px 8px;color:#CFFFD9;background:#101C19;border-bottom:1px solid #3E584B;
  font-family:var(--font-mono);font-size:10px;font-weight:700;text-align:center;
}
.cal-grid .hd.dvr{text-align:left}
.cal-grid .drv{
  display:flex;flex-direction:column;gap:2px;padding:9px;color:#F0F5F7;background:#152023;
  border-right:1px solid var(--color-border);border-bottom:1px solid var(--color-border);
  font-size:11.5px;font-weight:700;
}
.cal-grid .drv small{color:#A6B2BF;font-family:var(--font-mono);font-size:9.5px;font-weight:500}
.cal-grid .cell{
  min-height:54px;padding:5px;display:flex;align-items:stretch;
  border-right:1px solid var(--color-border);border-bottom:1px solid var(--color-border);
}
.shift{
  display:flex;flex-direction:column;gap:2px;width:100%;padding:6px;
  border:1px solid;border-left-width:3px;border-radius:2px;
  font-size:10px;font-weight:700;line-height:1.2;
}
.shift small{font-family:var(--font-mono);font-size:9px;font-weight:500;opacity:.9}
.s-day{color:#A8FFBC;background:rgba(0,255,65,.08);border-color:#27843E}
.s-night{color:#C6BBFF;background:rgba(179,157,255,.09);border-color:#6758A7}
.s-off{color:#C1CBD5;background:rgba(148,163,184,.08);border-color:#56616D}
.s-ot{color:#FFE18D;background:rgba(255,209,102,.09);border-color:#8B7332}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:11px;color:#B9C4CF;font-size:10.5px;font-weight:600}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:12px;height:12px;display:inline-block;border:1px solid rgba(255,255,255,.25);border-radius:1px}
.mtx table{width:100%;min-width:620px;border-collapse:collapse;font-size:11.5px}
.mtx th{
  padding:8px;color:#C1CCD6;background:#111B1D;border-bottom:1px solid #456052;
  font-size:9.5px;font-weight:700;text-align:center;white-space:nowrap;
}
.mtx th:first-child{text-align:left}
.mtx td{padding:7px;border-bottom:1px solid var(--color-border);text-align:center}
.mtx td:first-child{text-align:left;color:#EFF5F7;font-weight:700}
.dot2{
  width:25px;height:25px;display:inline-grid;place-content:center;
  border:1px solid;border-radius:2px;
}
.d-ok{color:#76FF96;background:rgba(0,255,65,.09);border-color:#347648}
.d-warn{color:#FFE08A;background:rgba(255,209,102,.1);border-color:#766633}
.d-bad{color:#FF9292;background:rgba(255,51,51,.11);border-color:#793E42}
.tl-head{display:grid;grid-template-columns:96px repeat(12,1fr);min-width:760px;border-bottom:1px solid #496052}
.tl-head div{
  padding:5px 2px;color:#AEBAC6;font-family:var(--font-mono);
  font-size:9px;font-weight:600;text-align:center;
}
.tl-head div:first-child{text-align:left}
.tl-row{
  display:grid;grid-template-columns:96px 1fr;min-width:760px;
  align-items:center;border-bottom:1px solid var(--color-border);
}
.tl-lbl{padding:9px 4px;color:#F0F5F7;font-size:11.5px;font-weight:700}
.tl-track{
  position:relative;height:34px;
  background:repeating-linear-gradient(90deg,transparent,transparent calc(8.333% - 1px),#34413E calc(8.333% - 1px),#34413E 8.333%);
}
.tl-seg{
  position:absolute;top:7px;height:20px;display:flex;align-items:center;justify-content:center;
  overflow:hidden;border:1px solid rgba(255,255,255,.2);border-radius:1px;
  color:#07110A;font-family:var(--font-mono);font-size:9px;font-weight:700;white-space:nowrap;
}
.seg-drive{background:#00DB39}
.seg-rest{background:#63B3FF;color:#07111C}
.seg-break{background:#94A3B8;color:#101820}
.seg-viol{background:#FF5B5B;color:#160505}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
.col{
  position:relative;min-width:0;padding:10px;background:#121D20;
  border:1px solid var(--color-border);border-radius:2px;
}
.col>h4{
  display:flex;align-items:center;gap:6px;margin:0 0 9px;color:#F1F6F8;
  font-size:11.5px;font-weight:700;
}
.col>h4 .n{
  margin-left:auto;padding:1px 7px;color:var(--color-on-primary);background:var(--color-primary);
  border-radius:1px;font-family:var(--font-mono);font-size:9px;
}
.tk{
  margin-bottom:8px;padding:10px;background:#192629;border:1px solid #354541;
  border-radius:2px;transition:border-color .18s,background .18s,transform .18s;
}
.tk:hover{background:#1D2D2D;border-color:#4D7C5B;transform:translateY(-1px)}
.tk b{display:block;color:#F1F6F8;font-size:11.5px}
.tk .meta{
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:5px;
  color:#AEB9C4;font-family:var(--font-mono);font-size:9.5px;
}
.tk .who{display:flex;align-items:center;gap:6px;margin-top:8px;color:#C4CED7;font-size:10.5px;font-weight:600}
.tk .av{width:22px;height:22px;border-radius:1px;font-size:9px}
.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.pc{
  position:relative;min-width:0;padding:13px;background:#142023;
  border:1px solid var(--color-border);border-radius:2px;
}
.pc-h{display:flex;align-items:center;gap:10px}
.pc-h .av{
  width:43px;height:43px;display:grid;place-content:center;flex:none;
  color:var(--color-primary);background:#0B1511;border:1px solid #3B754A;
  border-radius:2px;font-family:var(--font-display);font-size:16px;font-weight:700;
}
.pc-h b{display:block;color:#F5F8FA;font-size:13px}
.pc-h span{color:#A8B4C1;font-family:var(--font-mono);font-size:9.5px;font-weight:500}
.pc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:11px}
.pc-stats div{padding:7px;text-align:center;background:#101A1D;border:1px solid #303F3D;border-radius:1px}
.pc-stats b{
  display:block;color:var(--color-primary);font-family:var(--font-mono);
  font-size:14px;font-variant-numeric:tabular-nums;
}
.pc-stats small{color:#A9B5C0;font-size:9px;font-weight:600}
.pc-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.alist .al{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--color-border)}
.alist .al:first-child{border-top:0}
.al-ic{
  width:34px;height:34px;display:grid;place-content:center;flex:none;
  border:1px solid;border-radius:2px;
}
.al-ic .material-symbols-outlined{font-size:19px}
.a-red{color:#FF8888;background:rgba(255,51,51,.1);border-color:#784044}
.a-amber{color:#FFE08A;background:rgba(255,209,102,.09);border-color:#746334}
.a-pink{color:#7FFF9B;background:rgba(0,255,65,.08);border-color:#347648}

function buildNav(){
  var nav=document.getElementById("nav"),h="";
  for(var i=0;i<MODS.length;i++){
    h+='<button type="button" data-i="'+i+'" onclick="show('+i+')" aria-label="'+MODS[i].n+'"><span class="material-symbols-outlined">'+MODS[i].i+'</span><span class="txt">'+MODS[i].n+'</span></button>';
  }
  nav.innerHTML=h;
}
function show(i){
  i=Math.max(0,Math.min(SCREENS.length-1,i|0));
  killCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    var active=+btns[b].getAttribute("data-i")===i;
    btns[b].classList.toggle("on",active);
    if(active)btns[b].setAttribute("aria-current","page");
    else btns[b].removeAttribute("aria-current");
  }
  document.getElementById("tt").textContent=MODS[i].n;
  document.getElementById("ts").textContent=MODS[i].d;
  var container=document.getElementById("view");
  container.innerHTML=SCREENS[i].r();
  void container.offsetHeight;
  SCREENS[i].i();
}
buildNav();
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return;}
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0);}catch(e){}
}
window.addEventListener("hashchange",fromHash);
