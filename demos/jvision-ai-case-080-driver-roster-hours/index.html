<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>司機工時排班所 · TMS｜Jvision 系統 Demo</title>
<meta name="description" content="司機班表編排、工時累計、休息合規到換班補位的排班管理（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
  :root{
    --pink:#db2777; --pink2:#f472b6; --pink-d:#9d174d;
    --ink:#3a0b23; --body:#4b3a44; --muted:#8b7480; --line:#f0dbe6; --bg:#fbf4f8;
    --green:#16a34a; --amber:#f59e0b; --red:#dc2626; --sky:#2563eb;
  }
  *{ box-sizing:border-box; } html,body{ margin:0; }
  body{ font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--body); -webkit-font-smoothing:antialiased; }
  .material-symbols-outlined{ font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; line-height:1; }
  .shell{ display:grid; grid-template-columns:238px 1fr; min-height:100vh; }
  /* ===== left dark sidebar ===== */
  .side{ background:linear-gradient(185deg,#4a0c2b,#2a0617); color:#f3d9e6; display:flex; flex-direction:column; padding:20px 16px; position:sticky; top:0; height:100vh; overflow-y:auto; }
  .brand{ display:flex; align-items:center; gap:11px; margin-bottom:22px; min-width:0; }
  .brand .logo{ width:44px; height:44px; border-radius:13px; background:linear-gradient(135deg,var(--pink),var(--pink2)); display:grid; place-content:center; color:#fff; flex:none; box-shadow:0 6px 18px rgba(219,39,119,.45); }
  .brand .logo .material-symbols-outlined{ font-size:26px; }
  .brand b{ font-size:16px; font-weight:900; color:#fff; display:block; letter-spacing:.5px; }
  .brand span{ font-size:11px; color:#e6a9c6; font-weight:700; }
  .nav{ display:flex; flex-direction:column; gap:5px; min-width:0; }
  .nav button{ display:flex; align-items:center; gap:12px; padding:11px 13px; border:0; background:none; color:#e7b9cf; border-radius:12px; font:inherit; font-size:13.5px; font-weight:700; cursor:pointer; text-align:left; width:100%; min-width:0; }
  .nav button .material-symbols-outlined{ font-size:21px; flex:none; }
  .nav button .txt{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav button:hover{ background:rgba(255,255,255,.08); color:#fff; }
  .nav button.on{ background:linear-gradient(135deg,var(--pink),var(--pink2)); color:#fff; box-shadow:0 6px 16px rgba(219,39,119,.4); }
  .side .foot{ margin-top:auto; padding-top:18px; font-size:11px; color:#c98cab; line-height:1.6; }
  .side .foot .u{ display:flex; align-items:center; gap:9px; padding:10px; background:rgba(255,255,255,.06); border-radius:12px; margin-bottom:10px; }
  .side .foot .u .av{ width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,var(--pink2),#fff); color:var(--pink-d); font-weight:900; display:grid; place-content:center; flex:none; font-size:13px; }
  .side .foot .u b{ color:#fff; font-size:12.5px; display:block; } .side .foot .u span{ font-size:10.5px; color:#e6a9c6; }
  /* ===== main ===== */
  .main{ min-width:0; display:flex; flex-direction:column; }
  .top{ position:sticky; top:0; z-index:20; background:rgba(255,255,255,.9); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:14px 26px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .top h1{ margin:0; font-size:18px; font-weight:900; color:var(--ink); }
  .top .sub{ font-size:12px; color:var(--muted); }
  .top .r{ margin-left:auto; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .live{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:800; color:var(--pink-d); background:#fce7f0; border-radius:999px; padding:5px 11px; }
  .live .dot{ width:7px; height:7px; border-radius:50%; background:var(--pink); animation:pulse 2s infinite; } @keyframes pulse{50%{opacity:.25;}}
  .body{ padding:22px 26px 48px; min-width:0; }
  .vh{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:18px; flex-wrap:wrap; }
  .vh h2{ margin:0; font-size:21px; font-weight:900; color:var(--ink); display:flex; align-items:center; gap:9px; } .vh h2 .material-symbols-outlined{ color:var(--pink); }
  .vh p{ margin:5px 0 0; font-size:13px; color:var(--muted); max-width:640px; }
  .btn{ display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 15px; border-radius:10px; border:0; background:linear-gradient(135deg,var(--pink),var(--pink2)); color:#fff; font:inherit; font-weight:800; font-size:12.5px; cursor:pointer; }
  .btn.ghost{ background:#fff; color:var(--pink); border:1px solid var(--line); }
  .btn .material-symbols-outlined{ font-size:18px; }
  /* kpis */
  .kpis{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px; }
  .kpi{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:15px 17px; border-left:4px solid var(--pink); min-width:0; }
  .kpi .l{ font-size:12px; font-weight:700; color:var(--muted); display:flex; gap:6px; align-items:center; } .kpi .l .material-symbols-outlined{ font-size:18px; color:var(--pink); }
  .kpi .v{ font-size:25px; font-weight:900; color:var(--ink); margin-top:6px; } .kpi .v small{ font-size:13px; color:var(--muted); font-weight:700; }
  .kpi .d{ font-size:11.5px; font-weight:800; margin-top:4px; } .up{ color:var(--green); } .dn{ color:var(--red); } .fl{ color:var(--muted); }
  .grid{ display:grid; gap:18px; } .grid>*{ min-width:0; }
  .g2{ grid-template-columns:1.5fr 1fr; } .g2b{ grid-template-columns:1fr 1fr; } .g3{ grid-template-columns:repeat(3,1fr); }
  .card{ background:#fff; border:1px solid var(--line); border-radius:18px; padding:18px 20px; min-width:0; }
  .card>h3{ margin:0 0 14px; font-size:15px; font-weight:800; color:var(--ink); display:flex; align-items:center; gap:8px; }
  .card>h3 .material-symbols-outlined{ color:var(--pink); font-size:20px; } .card>h3 .grow{ margin-left:auto; font-size:12px; font-weight:700; color:var(--pink); }
  .chart{ width:100%; }
  /* table */
  .tblwrap{ overflow-x:auto; }
  .tbl{ width:100%; border-collapse:collapse; font-size:13px; }
  .tbl th{ text-align:left; font-size:11px; color:var(--muted); font-weight:800; padding:11px 12px; border-bottom:2px solid var(--line); background:#fdf2f8; white-space:nowrap; }
  .tbl td{ padding:11px 12px; border-bottom:1px solid var(--line); white-space:nowrap; } .tbl tr:hover td{ background:#fdf2f8; }
  .tbl td b{ color:var(--ink); }
  .tag{ font-size:11px; font-weight:800; border-radius:999px; padding:2px 9px; display:inline-block; }
  .t-ok{ background:#dcfce7; color:#166534; } .t-warn{ background:#fef3c7; color:#92400e; } .t-bad{ background:#fee2e2; color:#991b1b; } .t-info{ background:#dbeafe; color:#1e40af; } .t-pink{ background:#fce7f0; color:var(--pink-d); } .t-grey{ background:#f1f5f9; color:#64748b; }
  .bar{ height:7px; border-radius:999px; background:#f0e0e8; overflow:hidden; min-width:70px; } .bar span{ display:block; height:100%; border-radius:999px; }
  /* ===== calendar / roster board (signature) ===== */
  .cal{ overflow-x:auto; }
  .cal-grid{ display:grid; grid-template-columns:118px repeat(7,minmax(96px,1fr)); min-width:820px; border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .cal-grid .hd{ background:#fdf2f8; font-size:11.5px; font-weight:800; color:var(--pink-d); padding:10px 8px; text-align:center; border-bottom:1px solid var(--line); }
  .cal-grid .hd.dvr{ text-align:left; }
  .cal-grid .drv{ padding:10px; font-size:12.5px; font-weight:800; color:var(--ink); border-bottom:1px solid var(--line); border-right:1px solid var(--line); background:#fff; display:flex; flex-direction:column; gap:2px; }
  .cal-grid .drv small{ font-weight:700; color:var(--muted); font-size:10.5px; }
  .cal-grid .cell{ border-bottom:1px solid var(--line); border-right:1px solid var(--line); padding:6px; min-height:56px; display:flex; align-items:stretch; }
  .shift{ border-radius:9px; padding:6px 7px; font-size:10.5px; font-weight:800; width:100%; display:flex; flex-direction:column; gap:2px; line-height:1.2; }
  .shift small{ font-weight:700; opacity:.85; font-size:10px; }
  .s-day{ background:#fce7f0; color:var(--pink-d); border-left:3px solid var(--pink); }
  .s-night{ background:#e0e7ff; color:#3730a3; border-left:3px solid #4f46e5; }
  .s-off{ background:#f1f5f9; color:#64748b; border-left:3px solid #94a3b8; }
  .s-ot{ background:#fef3c7; color:#92400e; border-left:3px solid var(--amber); }
  /* legend */
  .leg{ display:flex; gap:16px; flex-wrap:wrap; margin-top:12px; font-size:12px; font-weight:700; color:var(--body); }
  .leg span{ display:inline-flex; align-items:center; gap:6px; } .leg i{ width:13px; height:13px; border-radius:4px; display:inline-block; }
  /* ===== compliance matrix ===== */
  .mtx{ overflow-x:auto; }
  .mtx table{ border-collapse:collapse; width:100%; min-width:620px; font-size:12.5px; }
  .mtx th{ padding:9px 8px; font-size:11px; font-weight:800; color:var(--muted); border-bottom:2px solid var(--line); text-align:center; } .mtx th:first-child{ text-align:left; }
  .mtx td{ padding:8px; border-bottom:1px solid var(--line); text-align:center; } .mtx td:first-child{ text-align:left; font-weight:800; color:var(--ink); }
  .dot2{ width:26px; height:26px; border-radius:8px; display:inline-grid; place-content:center; }
  .d-ok{ background:#dcfce7; color:#16a34a; } .d-warn{ background:#fef3c7; color:#d97706; } .d-bad{ background:#fee2e2; color:#dc2626; }
  /* ===== timeline (rest/driving) ===== */
  .tl{ overflow-x:auto; }
  .tl-head{ display:grid; grid-template-columns:96px repeat(12,1fr); min-width:760px; border-bottom:2px solid var(--line); }
  .tl-head div{ font-size:10.5px; font-weight:800; color:var(--muted); padding:6px 2px; text-align:center; } .tl-head div:first-child{ text-align:left; }
  .tl-row{ display:grid; grid-template-columns:96px 1fr; min-width:760px; border-bottom:1px solid var(--line); align-items:center; }
  .tl-lbl{ font-size:12.5px; font-weight:800; color:var(--ink); padding:10px 4px; }
  .tl-track{ position:relative; height:36px; background:repeating-linear-gradient(90deg,transparent,transparent calc(8.333% - 1px),#f6e6ef calc(8.333% - 1px),#f6e6ef 8.333%); }
  .tl-seg{ position:absolute; top:7px; height:22px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; color:#fff; overflow:hidden; white-space:nowrap; }
  .seg-drive{ background:linear-gradient(90deg,var(--pink),var(--pink2)); } .seg-rest{ background:linear-gradient(90deg,#0ea5e9,#38bdf8); } .seg-break{ background:linear-gradient(90deg,#94a3b8,#cbd5e1); color:#334155; } .seg-viol{ background:linear-gradient(90deg,#b91c1c,#ef4444); }
  /* ===== swap board (kanban) ===== */
  .board{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .col{ background:#fdf2f8; border:1px solid var(--line); border-radius:14px; padding:12px; min-width:0; }
  .col>h4{ margin:0 0 10px; font-size:12.5px; font-weight:900; color:var(--ink); display:flex; align-items:center; gap:6px; }
  .col>h4 .n{ margin-left:auto; background:var(--pink); color:#fff; font-size:11px; border-radius:999px; padding:1px 8px; }
  .tk{ background:#fff; border:1px solid var(--line); border-radius:11px; padding:11px 12px; margin-bottom:10px; box-shadow:0 1px 3px rgba(157,23,77,.06); }
  .tk b{ font-size:13px; color:var(--ink); display:block; } .tk .meta{ font-size:11px; color:var(--muted); margin-top:5px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .tk .who{ display:flex; align-items:center; gap:6px; margin-top:9px; font-size:11.5px; font-weight:700; color:var(--body); } .tk .av{ width:24px; height:24px; border-radius:50%; background:var(--pink2); color:#fff; font-weight:900; font-size:11px; display:grid; place-content:center; flex:none; }
  /* ===== driver profile cards ===== */
  .people{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
  .pc{ background:#fdf7fb; border:1px solid var(--line); border-radius:16px; padding:15px; min-width:0; }
  .pc-h{ display:flex; align-items:center; gap:12px; } .pc-h .av{ width:46px; height:46px; border-radius:14px; background:linear-gradient(135deg,var(--pink),var(--pink2)); color:#fff; font-weight:900; font-size:18px; display:grid; place-content:center; flex:none; }
  .pc-h b{ font-size:14.5px; color:var(--ink); display:block; } .pc-h span{ font-size:11px; color:var(--muted); font-weight:700; }
  .pc-stats{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:13px; }
  .pc-stats div{ background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px; text-align:center; } .pc-stats b{ font-size:16px; color:var(--pink-d); display:block; } .pc-stats small{ font-size:10px; color:var(--muted); font-weight:700; }
  .pc-tags{ display:flex; gap:6px; flex-wrap:wrap; margin-top:11px; }
  /* alerts list */
  .alist .al{ display:flex; gap:12px; padding:12px 0; border-top:1px solid var(--line); } .alist .al:first-child{ border-top:0; }
  .al-ic{ width:36px; height:36px; border-radius:10px; display:grid; place-content:center; flex:none; }
  .a-red{ background:#fee2e2; color:#dc2626; } .a-amber{ background:#fef3c7; color:#d97706; } .a-pink{ background:#fce7f0; color:var(--pink); }
  .al p{ margin:0; font-size:13px; line-height:1.45; } .al b{ color:var(--ink); } .al small{ font-size:11px; color:var(--muted); display:block; margin-top:2px; }
  .mini{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .stat{ background:#fdf2f8; border-radius:12px; padding:13px 14px; } .stat .l{ font-size:11.5px; color:var(--muted); font-weight:700; } .stat .v{ font-size:22px; font-weight:900; color:var(--pink-d); margin-top:3px; }
  @media (max-width:1100px){ .g2,.g2b,.g3{ grid-template-columns:1fr; } .board{ grid-template-columns:1fr 1fr; } }
  @media (max-width:860px){
    .shell{ grid-template-columns:1fr; }
    .side{ position:static; height:auto; flex-direction:row; flex-wrap:wrap; align-items:center; padding:12px 14px; }
    .brand{ margin-bottom:0; margin-right:6px; }
    .nav{ flex-direction:row; flex-wrap:wrap; gap:6px; }
    .nav button{ width:auto; padding:8px 12px; flex:none; white-space:nowrap; }
    .side .foot{ display:none; }
  }
  @media (max-width:820px){
    .kpis{ grid-template-columns:1fr 1fr; }
    .people,.board{ grid-template-columns:1fr; }
    .body{ padding:16px 14px 34px; }
  }
  @media (max-width:560px){
    .nav button .txt{ display:none; }
    .nav button{ padding:9px; }
    .kpis{ grid-template-columns:1fr 1fr; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">local_taxi</span></div>
      <div><b>司機工時排班所</b><span>TMS 運輸調度</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <div class="u"><div class="av">陳</div><div><b>陳依婷</b><span>站務調度</span></div></div>
      純 UI 展示 · 假資料<br/>Jvision Demo v080
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <div>
        <h1 id="tt">班表編排</h1>
        <div class="sub" id="ts">月週班表拖拉排班</div>
      </div>
      <div class="r">
        <span class="live"><span class="dot"></span>本週班表 · 排班中</span>
        <button class="btn ghost"><span class="material-symbols-outlined">notifications</span>提醒 4</button>
        <button class="btn"><span class="material-symbols-outlined">save</span>儲存班表</button>
      </div>
    </header>
    <div class="body" id="view"></div>
  </div>
</div>

<script>
"use strict";
var MODS=[
  {i:"calendar_month",n:"班表編排",d:"月週班表拖拉排班"},
  {i:"schedule",n:"工時累計",d:"駕駛工時與加班統計"},
  {i:"bedtime",n:"休息合規",d:"連續駕駛與休息稽核"},
  {i:"swap_horiz",n:"換班調度",d:"請假換班補位處理"},
  {i:"gavel",n:"法規預警",d:"工時法規違規提醒"},
  {i:"groups",n:"駕駛檔案",d:"駕駛資格與勤惰"}
];
var PINK="#db2777", PINK2="#f472b6";

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?"":s); }
function kpi(l,ic,v,u,d,cls){ return '<div class="kpi"><div class="l"><span class="material-symbols-outlined">'+ic+'</span>'+l+'</div><div class="v">'+v+(u?' <small>'+u+'</small>':'')+'</div><div class="d '+(cls||'fl')+'">'+esc(d)+'</div></div>'; }
function barrow(pct,color){ var p=Math.max(0,Math.min(100,pct)); return '<div class="bar"><span style="width:'+p+'%;background:'+color+'"></span></div>'; }

var _charts=[];
function killCharts(){ for(var k=0;k<_charts.length;k++){ try{ _charts[k].destroy(); }catch(e){} } _charts=[]; }
function mkChart(el,opt){ if(!el) return; opt.chart=opt.chart||{}; opt.chart.redrawOnParentResize=false; opt.chart.redrawOnWindowResize=false; opt.chart.animations={enabled:false}; opt.chart.fontFamily='Inter,"Noto Sans TC",sans-serif'; try{ var c=new ApexCharts(el,opt); c.render(); _charts.push(c); }catch(e){} }

/* =================== SCREEN 0 : 班表編排 (calendar roster) =================== */
function v0(){
  var drivers=[
    {n:"林建志",c:"D-01 · 甲類職照",s:["day","night","off","day","day","ot","off"]},
    {n:"王俊傑",c:"D-02 · 甲類職照",s:["night","off","day","day","night","off","day"]},
    {n:"張美玲",c:"D-03 · 大客車",s:["day","day","off","night","night","day","off"]},
    {n:"李國華",c:"D-04 · 大客車",s:["off","day","day","ot","off","night","day"]},
    {n:"周雅雯",c:"D-05 · 聯結車",s:["day","night","night","off","day","day","off"]},
    {n:"吳承翰",c:"D-06 · 甲類職照",s:["night","day","off","day","off","ot","night"]}
  ];
  var days=["週一 10","週二 11","週三 12","週四 13","週五 14","週六 15","週日 16"];
  var meta={day:{t:"早班",h:"06:00–14:00",c:"s-day"},night:{t:"晚班",h:"14:00–22:00",c:"s-night"},off:{t:"休息",h:"排休",c:"s-off"},ot:{t:"加班",h:"22:00–06:00",c:"s-ot"}};
  var head='<div class="hd dvr">駕駛 / 日期</div>';
  for(var d=0;d<days.length;d++) head+='<div class="hd">'+days[d]+'</div>';
  var rows="";
  for(var r=0;r<drivers.length;r++){
    var dv=drivers[r];
    rows+='<div class="drv">'+dv.n+'<small>'+dv.c+'</small></div>';
    for(var c=0;c<7;c++){ var m=meta[dv.s[c]]; rows+='<div class="cell"><div class="shift '+m.c+'">'+m.t+'<small>'+m.h+'</small></div></div>'; }
  }
  return ''+
  '<div class="vh"><div><h2><span class="material-symbols-outlined">calendar_month</span>本週班表編排</h2>'+
  '<p>拖拉指派早／晚／加班與排休班次，系統即時校驗人力缺口與工時上限。目前週別：8/10–8/16。</p></div>'+
  '<div><button class="btn ghost"><span class="material-symbols-outlined">auto_awesome</span>智慧補班</button> <button class="btn"><span class="material-symbols-outlined">check</span>送出核定</button></div></div>'+
  '<div class="kpis">'+
    kpi("本週班次","event",'238',"班","已排 226 · 缺 12","dn")+
    kpi("出勤駕駛","groups",'24',"人","可調度 6 人","up")+
    kpi("人力覆蓋率","insights",'94.9',"%","目標 98%","dn")+

function buildNav(){
  var nav=document.getElementById("nav"), h="";
  for(var i=0;i<MODS.length;i++){ h+='<button data-i="'+i+'" onclick="show('+i+')"><span class="material-symbols-outlined">'+MODS[i].i+'</span><span class="txt">'+MODS[i].n+'</span></button>'; }
  nav.innerHTML=h;
}
function show(i){
  i=Math.max(0,Math.min(SCREENS.length-1,i|0));
  killCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){ btns[b].classList.toggle("on", +btns[b].getAttribute("data-i")===i); }
  document.getElementById("tt").textContent=MODS[i].n;
  document.getElementById("ts").textContent=MODS[i].d;
  var container=document.getElementById("view");
  container.innerHTML=SCREENS[i].r();
  void container.offsetHeight;
  SCREENS[i].i();
}
buildNav();
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
