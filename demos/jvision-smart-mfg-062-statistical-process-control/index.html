<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SPC 統計製程管制中心 · Control Room</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#be185d;--accent2:#fb7185;
  --bg:#0b0e17;--bg2:#111524;--panel:#151a2c;--panel2:#1b2136;
  --line:#252c44;--txt:#e7ebf5;--muted:#93a0bd;--dim:#66728f;
  --ok:#34d399;--warn:#fbbf24;--bad:#fb7185;--info:#60a5fa;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",sans-serif;
  background:radial-gradient(1200px 600px at 80% -10%,rgba(190,24,93,.15),transparent 60%),var(--bg);
  color:var(--txt);min-height:100vh;overflow-x:hidden;
}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'opsz' 24;vertical-align:middle}
/* NAV */
.nav{
  position:sticky;top:0;z-index:50;background:rgba(11,14,23,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;flex:none;min-width:0}
.brand .logo{
  width:38px;height:38px;border-radius:10px;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 6px 18px rgba(190,24,93,.4);
}
.brand .t1{font-weight:800;font-size:15px;letter-spacing:.5px;white-space:nowrap}
.brand .t2{font-size:11px;color:var(--muted);white-space:nowrap}
.navspace{flex:1;min-width:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.tab{
  flex:none;white-space:nowrap;cursor:pointer;border:1px solid var(--line);
  background:var(--panel);color:var(--muted);border-radius:999px;
  padding:8px 14px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px;
  font-family:inherit;transition:.15s;min-width:0;
}
.tab .material-symbols-outlined{font-size:18px}
.tab:hover{color:var(--txt);border-color:var(--accent2)}
.tab.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(190,24,93,.4);
}
.pill{
  flex:none;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);
  background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 11px;white-space:nowrap;
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
/* LAYOUT */
.wrap{padding:20px;max-width:1400px;margin:0 auto}
.scr-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.scr-ic{
  width:46px;height:46px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;
  background:rgba(190,24,93,.16);color:var(--accent2);border:1px solid rgba(251,113,133,.3);
}
.scr-ic .material-symbols-outlined{font-size:26px}
.scr-tt h2{margin:0;font-size:19px;font-weight:800}
.scr-tt p{margin:3px 0 0;font-size:12.5px;color:var(--muted);max-width:640px}
.tag{font-size:10.5px;font-weight:700;color:var(--accent2);background:rgba(251,113,133,.12);border:1px solid rgba(251,113,133,.28);padding:3px 9px;border-radius:6px;white-space:nowrap}
/* GRID helpers */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g32{grid-template-columns:2fr 1fr}
.g23{grid-template-columns:1fr 2fr}
@media(max-width:820px){
  .g4,.g3,.g2,.g32,.g23{grid-template-columns:1fr}
}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h3{margin:0;font-size:13.5px;font-weight:700}
.card-h .sub{font-size:11px;color:var(--dim)}
/* KPI */
.kpi{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0}
.kpi .lab{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--accent2)}
.kpi .val{font-size:26px;font-weight:800;margin-top:8px;line-height:1;font-family:"Inter"}
.kpi .val small{font-size:13px;color:var(--muted);font-weight:600}
.kpi .delta{font-size:11px;margin-top:7px;display:flex;align-items:center;gap:4px}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
.chart{width:100%;height:300px}
.chart.sm{height:230px}
.chart.lg{height:340px}
/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px}
.tbl th{text-align:left;color:var(--dim);font-weight:600;font-size:11px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.4px}
.tbl td{padding:10px 12px;border-bottom:1px solid rgba(37,44,68,.55);white-space:nowrap}
.tbl tr:hover td{background:rgba(190,24,93,.06)}
.mono{font-family:"Inter";font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-ok{background:rgba(52,211,153,.14);color:var(--ok)}
.b-warn{background:rgba(251,191,36,.14);color:var(--warn)}
.b-bad{background:rgba(251,113,133,.16);color:var(--bad)}
.b-info{background:rgba(96,165,250,.14);color:var(--info)}
.b-mut{background:rgba(147,160,189,.12);color:var(--muted)}
/* progress bar */
.bar{height:7px;border-radius:99px;background:var(--panel2);overflow:hidden;min-width:60px}
.bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
/* board columns */
.board{display:grid;gap:12px;grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.board{grid-template-columns:1fr}}
.col{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px;min-width:0}
.col-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:12px;font-weight:700}
.col-h .cnt{font-size:11px;color:var(--dim);background:var(--panel);border-radius:99px;padding:1px 8px}
.tk{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:9px;padding:10px;margin-bottom:9px}
.tk:last-child{margin-bottom:0}
.tk .id{font-size:10.5px;color:var(--dim);font-family:"Inter"}
.tk .ti{font-size:12.5px;font-weight:600;margin:3px 0 6px}
.tk .mt{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--muted)}
/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-i{position:relative;padding:0 0 16px 4px}
.tl-i:last-child{padding-bottom:0}
.tl-i::before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);box-shadow:0 0 0 2px var(--accent)}
.tl-i.warn::before{background:var(--warn);box-shadow:0 0 0 2px var(--warn)}
.tl-i.bad::before{background:var(--bad);box-shadow:0 0 0 2px var(--bad)}
.tl-i.ok::before{background:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.tl-t{font-size:12.5px;font-weight:600}
.tl-m{font-size:10.5px;color:var(--dim);font-family:"Inter";margin-top:1px}
.tl-d{font-size:11.5px;color:var(--muted);margin-top:3px}
/* matrix */
.mtx{border-collapse:separate;border-spacing:4px;width:100%;min-width:560px}
.mtx td,.mtx th{text-align:center;font-size:11px;padding:0}
.mtx th{color:var(--dim);font-weight:600;padding-bottom:4px}
.mtx .rh{text-align:left;color:var(--muted);font-weight:600;padding-right:8px;white-space:nowrap;font-size:11.5px}
.cell{border-radius:7px;height:34px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;font-family:"Inter"}
/* instrument tiles */
.inst{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:12px;min-width:0}
.inst .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.inst .nm{font-size:12.5px;font-weight:700}
.inst .rd{font-size:22px;font-weight:800;font-family:"Inter";margin:8px 0 2px}
.inst .sub{font-size:10.5px;color:var(--dim)}
.spark{height:36px;margin-top:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.foot{color:var(--dim);font-size:11px;text-align:center;padding:22px 12px 34px}
.ocap{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.ocap .step{display:flex;gap:10px;margin-bottom:11px}
.ocap .step:last-child{margin-bottom:0}
.ocap .n{width:22px;height:22px;border-radius:50%;flex:none;background:rgba(190,24,93,.2);color:var(--accent2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;border:1px solid rgba(251,113,133,.3)}
.ocap .sc{font-size:12px}
.ocap .sc b{font-weight:700}
.ocap .sc div{color:var(--muted);font-size:11px;margin-top:1px}
.hl{color:var(--accent2);font-weight:700}
@media(max-width:560px){
  .tab .txt{display:none}
  .tab{padding:9px 11px}
  .brand .t2{display:none}
}
</style>
</head>
<body>
<div class="nav">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">monitoring</span></div>
    <div>
      <div class="t1">SPC 統計製程管制中心</div>
      <div class="t2">Statistical Process Control · Control Room</div>
    </div>
  </div>
  <div class="navspace"></div>
  <div class="tabs" id="tabs"></div>
  <div class="pill"><span class="dot"></span> 即時連線 · 12 台儀器</div>
</div>
<div class="wrap" id="app"></div>
<div class="foot">SPC 統計製程管制中心 · 純 UI 展示（無後端），所有數據皆為擬真示範資料。</div>

<script>
"use strict";
var C={accent:"#be185d",accent2:"#fb7185",ok:"#34d399",warn:"#fbbf24",bad:"#fb7185",info:"#60a5fa",line:"#252c44",muted:"#93a0bd",dim:"#66728f",txt:"#e7ebf5"};

var SCREENS=[
  {ic:"sensors",tt:"數據自動採集",sub:"量測儀器與 AOI 依取樣計畫自動上傳特性值，即時彙整為子群樣本。",tag:"v0 · 採集"},
  {ic:"show_chart",tt:"管制圖繪製",sub:"即時計算子群均值與全距，繪製 X-bar / R 管制圖並標示中心線與管制界線。",tag:"v1 · 管制圖"},
  {ic:"speed",tt:"製程能力分析",sub:"以規格界線評估 Cp / Cpk / Pp / Ppk，判定製程能力等級。",tag:"v2 · 能力分析"},
  {ic:"gpp_maybe",tt:"異常判讀",sub:"套用 Nelson 八大異常法則自動判讀點位，標記失控訊號。",tag:"v3 · 判讀"},
  {ic:"notifications_active",tt:"警報通知",sub:"偵測失控訊號即時推播，依嚴重度升級並鎖定受影響批次。",tag:"v4 · 警報"},
  {ic:"engineering",tt:"工程師處理",sub:"依 OCAP 對策卡派工處置，回填處理紀錄並追蹤 Cpk 回復。",tag:"v5 · 處理"}
];

var _charts={};
function el(id){return document.getElementById(id);}
function mk(id,opt){
  var node=el(id);if(!node)return;
  if(_charts[id]){try{_charts[id].dispose();}catch(e){}delete _charts[id];}
  var ch=echarts.init(node,null,{renderer:"canvas"});
  ch.setOption(opt);_charts[id]=ch;
}
function disposeAll(){for(var k in _charts){try{_charts[k].dispose();}catch(e){}}_charts={};}
function tip(extra){return Object.assign({trigger:"axis",backgroundColor:"#151a2c",borderColor:C.line,textStyle:{color:C.txt,fontSize:12}},extra||{});}

var SUBGROUPS=["07:00","07:30","08:00","08:30","09:00","09:30","10:00","10:30","11:00","11:30","13:00","13:30","14:00","14:30","15:00","15:30"];
var XBAR=[25.02,24.97,25.05,25.01,24.99,25.08,25.11,25.04,24.96,25.00,25.09,25.19,25.14,25.06,24.98,25.03];
var RVAL=[0.18,0.22,0.15,0.26,0.19,0.24,0.31,0.20,0.17,0.23,0.28,0.42,0.35,0.25,0.19,0.21];

// =================================================================== SCREEN 0
function s0(){
  var instruments=[
    {nm:"CMM 三次元 #A1",st:"連線",rd:"25.03",u:"mm",sub:"外徑 · 取樣 n=5",cl:"ok",sp:[25.0,25.02,24.98,25.05,25.03,25.01,25.04,25.03]},
    {nm:"雷射測厚 #L2",st:"連線",rd:"1.482",u:"mm",sub:"板厚 · 取樣 n=5",cl:"ok",sp:[1.48,1.49,1.47,1.48,1.482,1.485,1.48,1.482]},
    {nm:"AOI 光學檢測 #V3",st:"連線",rd:"312",u:"點/min",sub:"焊點掃描率",cl:"ok",sp:[300,308,312,305,318,310,316,312]},
    {nm:"扭力測試 #T4",st:"警示",rd:"8.9",u:"N·m",sub:"鎖付扭力 · 逼近上限",cl:"warn",sp:[8.2,8.4,8.6,8.7,8.5,8.8,8.9,8.9]},
    {nm:"表面粗糙 #R5",st:"連線",rd:"0.42",u:"Ra",sub:"研磨面 Ra",cl:"ok",sp:[0.4,0.41,0.43,0.42,0.4,0.42,0.41,0.42]},
    {nm:"溫度探針 #H6",st:"離線",rd:"—",u:"℃",sub:"迴焊爐 · 校正中",cl:"bad",sp:[0,0,0,0,0,0,0,0]}
  ];
  var feed=[
    {t:"15:30:12",dev:"CMM #A1",lot:"LOT-A2418",ch:"外徑 D1",v:"25.03",r:"OK",cl:"b-ok"},
    {t:"15:30:04",dev:"AOI #V3",lot:"LOT-A2418",ch:"焊點覆蓋",v:"98.6%",r:"OK",cl:"b-ok"},
    {t:"15:29:51",dev:"扭力 #T4",lot:"LOT-B7702",ch:"鎖付扭力",v:"8.90",r:"逼近UCL",cl:"b-warn"},
    {t:"15:29:38",dev:"測厚 #L2",lot:"LOT-A2418",ch:"板厚",v:"1.482",r:"OK",cl:"b-ok"},
    {t:"15:29:22",dev:"粗糙 #R5",lot:"LOT-C3390",ch:"Ra",v:"0.42",r:"OK",cl:"b-ok"},
    {t:"15:29:05",dev:"CMM #A1",lot:"LOT-B7702",ch:"孔徑 D2",v:"12.014",r:"OK",cl:"b-ok"},
    {t:"15:28:47",dev:"扭力 #T4",lot:"LOT-B7702",ch:"鎖付扭力",v:"8.72",r:"OK",cl:"b-ok"}
  ];
  var frows=feed.map(function(f){
    return '<tr><td class="mono" style="color:var(--dim)">'+f.t+'</td><td>'+f.dev+'</td><td class="mono">'+f.lot+'</td><td>'+f.ch+'</td><td class="mono">'+f.v+'</td><td><span class="badge '+f.cl+'">'+f.r+'</span></td></tr>';
  }).join("");
  var insts=instruments.map(function(d,i){
    var bcl=d.cl==="ok"?"b-ok":d.cl==="warn"?"b-warn":"b-bad";
    return '<div class="inst"><div class="top"><div class="nm">'+d.nm+'</div><span class="badge '+bcl+'">'+d.st+'</span></div>'+
      '<div class="rd">'+d.rd+' <span style="font-size:12px;color:var(--dim);font-weight:600">'+d.u+'</span></div>'+
      '<div class="sub">'+d.sub+'</div><div class="spark" id="sp'+i+'"></div></div>';
  }).join("");

  el("app").innerHTML=
    header(0)+
    '<div class="grid g4" style="margin-bottom:14px">'+
      kpi("sensors","線上儀器","11 / 12","台","+1 台今日上線","up")+
      kpi("acute","今日取樣子群","1,284","組","取樣達成率 99.2%","up")+
      kpi("done_all","有效樣本率","99.4","%","去除離群 8 點","flat")+
      kpi("cloud_sync","MES 同步延遲","1.8","秒","平均端到端","up")+
    '</div>'+
    '<div class="grid g32">'+
      '<div class="card"><div class="card-h"><h3>量測儀器即時狀態</h3><span class="sub">自動採集 · n=5 子群</span></div>'+
        '<div class="grid g3" style="gap:11px">'+insts+'</div></div>'+
      '<div class="card"><div class="card-h"><h3>採集來源占比</h3><span class="sub">近 4 小時</span></div>'+
        '<div class="chart sm" id="s0pie"></div>'+
        '<div class="legend"><span><i style="background:'+C.accent+'"></i>CMM 三次元</span><span><i style="background:'+C.accent2+'"></i>AOI 光學</span><span><i style="background:'+C.info+'"></i>量測儀表</span><span><i style="background:'+C.warn+'"></i>手動輸入</span></div>'+
      '</div>'+
    '</div>'+
    '<div class="card" style="margin-top:14px"><div class="card-h"><h3>即時數據串流</h3><span class="sub">自動採集 Feed · 最新在上</span></div>'+
      '<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>時間</th><th>來源儀器</th><th>批號</th><th>量測特性</th><th>數值</th><th>判定</th></tr></thead><tbody>'+frows+'</tbody></table></div></div>';

  void el("app").offsetHeight;
  instruments.forEach(function(d,i){
    var col=d.cl==="warn"?C.warn:d.cl==="bad"?C.dim:C.accent2;
    mk("sp"+i,{grid:{left:2,right:2,top:4,bottom:2},xAxis:{type:"category",show:false,data:d.sp.map(function(_,k){return k;})},yAxis:{type:"value",show:false,scale:true},
      series:[{type:"line",data:d.sp,smooth:true,symbol:"none",lineStyle:{color:col,width:2},areaStyle:{color:"rgba(251,113,133,.12)"}}]});
  });
  mk("s0pie",{tooltip:{trigger:"item",backgroundColor:"#151a2c",borderColor:C.line,textStyle:{color:C.txt}},
    series:[{type:"pie",radius:["48%","74%"],center:["50%","52%"],label:{color:C.muted,fontSize:11},labelLine:{lineStyle:{color:C.line}},
      data:[{value:48,name:"CMM 三次元",itemStyle:{color:C.accent}},{value:27,name:"AOI 光學",itemStyle:{color:C.accent2}},{value:19,name:"量測儀表",itemStyle:{color:C.info}},{value:6,name:"手動輸入",itemStyle:{color:C.warn}}]}]});
}

// =================================================================== SCREEN 1
function s1(){
  el("app").innerHTML=
    header(1)+
    '<div class="grid g4" style="margin-bottom:14px">'+
      kpi("straighten","目標中心值","25.00","mm","外徑 D1 · CL","flat")+
      kpi("vertical_align_top","UCL / LCL","25.18 / 24.82","","±3σ 管制界線","flat")+
      kpi("timeline","本班子群數","16","組","07:00–15:30","flat")+
      kpi("report","失控點","1","點","子群 #12 超 UCL","down")+
    '</div>'+
    '<div class="card"><div class="card-h"><h3>X-bar 管制圖 · 外徑 D1（mm）</h3><span class="tag">SPC-Chart</span></div>'+
      '<div style="overflow-x:auto"><div class="chart lg" id="xbar" style="min-width:640px"></div></div>'+

// ---------- shared render bits ----------
function header(i){
  var s=SCREENS[i];
  return '<div class="scr-head"><div class="scr-ic"><span class="material-symbols-outlined">'+s.ic+'</span></div>'+
    '<div class="scr-tt"><h2>'+s.tt+'</h2><p>'+s.sub+'</p></div>'+
    '<div style="flex:1;min-width:0"></div><span class="tag">'+s.tag+'</span></div>';
}
function kpi(ic,lab,val,unit,delta,dir){
  var dic=dir==="up"?"trending_up":dir==="down"?"trending_down":"trending_flat";
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+ic+'</span>'+lab+'</div>'+
    '<div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div>'+
    '<div class="delta '+dir+'"><span class="material-symbols-outlined" style="font-size:15px">'+dic+'</span>'+delta+'</div></div>';
}
function paramRow(k,v){
  return '<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-bottom:1px solid rgba(37,44,68,.5);font-size:12.5px"><span style="color:var(--muted)">'+k+'</span><span class="mono" style="font-weight:700">'+v+'</span></div>';
}
function ocapStep(n,t,d){
  return '<div class="step"><div class="n">'+n+'</div><div class="sc"><b>'+t+'</b><div>'+d+'</div></div></div>';
}

// ---------- router ----------
var RENDER=[s0,s1,s2,s3,s4,s5];
function buildTabs(){
  var h=SCREENS.map(function(s,i){
    return '<button class="tab" data-i="'+i+'"><span class="material-symbols-outlined">'+s.ic+'</span><span class="txt">'+s.tt+'</span></button>';
  }).join("");
  el("tabs").innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){
    b.addEventListener("click",function(){show(+b.getAttribute("data-i"));});
  });
}
function show(i){
  disposeAll();
  Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){
    b.classList.toggle("active",+b.getAttribute("data-i")===i);
  });
  RENDER[i]();
}
buildTabs();

window.addEventListener("resize",function(){for(var k in _charts){try{_charts[k].resize();}catch(e){}}});
show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
