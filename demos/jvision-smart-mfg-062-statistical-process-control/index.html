<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>製程品質統計管制系統</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#CBD5E1;
  --ok:#047857;
  --warn:#9A3412;
  --bad:#B91C1C;
  --info:#1D4ED8;
  --shadow:6px 6px 0 #0F172A;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{
  margin:0;
  min-width:320px;
  min-height:100vh;
  color:var(--color-foreground);
  background-color:var(--color-background);
  background-image:
    linear-gradient(rgba(37,99,235,.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(37,99,235,.07) 1px,transparent 1px);
  background-size:28px 28px;
  font-family:"Fira Sans",sans-serif;
}
button{font:inherit}
button,a{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.skip{
  position:fixed;z-index:200;left:12px;top:-80px;
  padding:10px 14px;color:#fff;background:#0F172A;border:2px solid #fff;
}
.skip:focus{top:12px}
.nav{
  position:sticky;top:0;z-index:100;
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:20px;
  padding:12px 18px;background:#fff;border-bottom:3px solid #0F172A;
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{
  display:grid;place-items:center;width:44px;height:44px;flex:none;
  color:#fff;background:var(--color-primary);border:3px solid #0F172A;
  box-shadow:4px 4px 0 var(--color-accent);
}
.icon{width:22px;height:22px;display:block;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter}
.brand-title{font-weight:700;font-size:15px;letter-spacing:.02em;white-space:nowrap}
.brand-sub{margin-top:2px;color:var(--muted);font:500 10px/1.25 "Fira Code",monospace}
.tabs{display:flex;justify-content:center;gap:6px;min-width:0;overflow-x:auto;padding:4px}
.tab{
  display:flex;align-items:center;gap:7px;flex:none;padding:9px 11px;
  color:var(--ink);background:#fff;border:2px solid #0F172A;border-radius:0;
  font-size:12px;font-weight:700;box-shadow:2px 2px 0 transparent;
  transition:background-color .18s,color .18s,box-shadow .18s,transform .18s;
}
.tab:hover{background:var(--color-muted);box-shadow:3px 3px 0 #0F172A;transform:translate(-1px,-1px)}
.tab.active{color:#fff;background:var(--color-primary);box-shadow:3px 3px 0 var(--color-accent)}
.tab .icon{width:17px;height:17px}
.live{
  display:flex;align-items:center;gap:7px;white-space:nowrap;
  padding:8px 10px;border:2px solid #0F172A;background:#DCFCE7;
  font:600 10px "Fira Code",monospace;
}
.dot{width:9px;height:9px;background:var(--ok);border:2px solid #0F172A}
.wrap{width:min(1440px,100%);margin:auto;padding:24px 20px 40px}
.screen{animation:reveal .35s ease-out both}
.scr-head{
  position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:start;
  margin-bottom:20px;padding:20px;background:#fff;border:3px solid #0F172A;box-shadow:var(--shadow);
}
.scr-head:after{
  content:"";position:absolute;right:0;bottom:0;width:32%;height:8px;background:var(--color-accent);
}
.scr-icon{
  display:grid;place-items:center;width:50px;height:50px;
  color:#fff;background:var(--color-primary);border:3px solid #0F172A;
}
.scr-title{margin:0;font-size:clamp(22px,3vw,34px);line-height:1;font-weight:700}
.scr-desc{max-width:760px;margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.6}
.tag{
  align-self:start;padding:6px 9px;color:#fff;background:#0F172A;border:2px solid #0F172A;
  font:700 10px "Fira Code",monospace;text-transform:uppercase;white-space:nowrap;
}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g32{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g23{grid-template-columns:minmax(280px,1fr) minmax(0,2fr)}
.mb{margin-bottom:14px}.mt{margin-top:14px}
.card,.kpi{
  min-width:0;background:var(--color-card);border:2px solid #0F172A;border-radius:0;
}
.card{padding:16px}
.card.raised{box-shadow:5px 5px 0 #94A3B8}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px}
.card-h h3{margin:0;font-size:14px;font-weight:700}
.sub{color:var(--muted);font:500 10px "Fira Code",monospace}
.kpi{position:relative;padding:15px;overflow:hidden}
.kpi:before{content:"";position:absolute;top:0;left:0;width:8px;height:100%;background:var(--color-primary)}
.kpi:nth-child(2n):before{background:var(--color-accent)}
.kpi-label{display:flex;align-items:center;gap:7px;padding-left:5px;color:var(--muted);font-size:11px;font-weight:600}
.kpi-label .icon{width:17px;height:17px;color:var(--color-primary)}
.kpi-value{
  margin:10px 0 7px;padding-left:5px;color:#0F172A;
  font:700 27px/1 "Fira Code",monospace;font-variant-numeric:tabular-nums;
}
.kpi-value small{font-size:12px;color:var(--muted)}
.delta{display:flex;align-items:center;gap:5px;padding-left:5px;font-size:10.5px;font-weight:600}
.delta .icon{width:14px;height:14px}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
.chart{width:100%;height:300px}.chart.sm{height:230px}.chart.lg{height:340px}
.scroll{overflow-x:auto;scrollbar-color:#0F172A var(--color-muted)}
.tbl{width:100%;min-width:560px;border-collapse:collapse;font-size:12px}
.tbl th{
  padding:10px 12px;text-align:left;color:#fff;background:#0F172A;
  border:1px solid #fff;font:600 10px "Fira Code",monospace;letter-spacing:.03em;white-space:nowrap;
}
.tbl td{padding:10px 12px;border:1px solid var(--line);white-space:nowrap}
.tbl tbody tr:nth-child(even){background:#F1F5F9}
.tbl tbody tr:hover{background:#DBEAFE}
.tbl td:nth-child(n+2){font-variant-numeric:tabular-nums}
.mono,.num{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.num{text-align:right}
.badge{
  display:inline-flex;align-items:center;gap:6px;padding:4px 8px;
  border:1px solid currentColor;font-size:10px;font-weight:700;white-space:nowrap;
}
.badge:before{content:"";width:7px;height:7px;background:currentColor}
.b-ok{color:#065F46;background:#D1FAE5}
.b-warn{color:#9A3412;background:#FFEDD5}
.b-bad{color:#991B1B;background:#FEE2E2}
.b-info{color:#1E40AF;background:#DBEAFE}
.b-mut{color:#475569;background:#E2E8F0}
.inst{min-width:0;padding:12px;background:#F8FAFC;border:2px solid #0F172A}
.inst-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.inst-name{font-size:12px;font-weight:700}
.inst-reading{margin:10px 0 2px;font:700 21px "Fira Code",monospace}
.inst-unit,.inst-sub{color:var(--muted);font-size:10px}
.spark{height:38px;margin-top:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;color:var(--muted);font-size:10px}
.legend i{display:inline-block;width:11px;height:11px;margin-right:5px;border:1px solid #0F172A;vertical-align:-1px}
.bar{height:9px;min-width:70px;background:#E2E8F0;border:1px solid #0F172A}
.bar i{display:block;height:100%;background:var(--color-primary)}
.param{display:flex;justify-content:space-between;gap:16px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:12px}
.param span:first-child{color:var(--muted)}
.mtx{width:100%;min-width:560px;border-collapse:separate;border-spacing:4px}
.mtx th{padding:7px;color:#fff;background:#0F172A;font:600 10px "Fira Code",monospace}
.mtx td{text-align:center}
.mtx .rh{text-align:left;white-space:nowrap}
.cell{display:grid;place-items:center;height:34px;border:1px solid #0F172A;font:700 10px "Fira Code",monospace}
.timeline{position:relative;padding-left:27px}
.timeline:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:3px;background:#0F172A}
.tl-item{position:relative;padding:0 0 20px 5px}
.tl-item:last-child{padding-bottom:0}
.tl-item:before{
  content:"";position:absolute;left:-25px;top:2px;width:14px;height:14px;
  background:var(--info);border:3px solid #0F172A;
}
.tl-item.bad:before{background:var(--bad)}.tl-item.warn:before{background:#F97316}.tl-item.ok:before{background:var(--ok)}
.tl-title{font-size:12px;font-weight:700}.tl-time{margin-top:2px;color:var(--muted);font:500 10px "Fira Code",monospace}
.tl-desc{margin-top:4px;color:var(--muted);font-size:11px;line-height:1.5}
.board{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:11px;min-width:760px}
.column{padding:10px;background:var(--color-muted);border:2px solid #0F172A}
.column-head{display:flex;justify-content:space-between;margin-bottom:10px;font-size:12px;font-weight:700}
.count{padding:1px 7px;color:#fff;background:#0F172A;font:600 10px "Fira Code",monospace}
.ticket{margin-bottom:9px;padding:10px;background:#fff;border:2px solid #0F172A;border-left:7px solid var(--color-primary)}
.ticket:last-child{margin-bottom:0}
.ticket-id{color:var(--muted);font:500 9px "Fira Code",monospace}
.ticket-title{margin:5px 0 8px;font-size:12px;font-weight:700}
.ticket-meta{display:flex;justify-content:space-between;align-items:center;gap:6px;color:var(--muted);font-size:10px}
.ocap{border:2px solid #0F172A}
.ocap-step{display:grid;grid-template-columns:32px 1fr;gap:10px;padding:12px;border-bottom:1px solid var(--line)}
.ocap-step:last-child{border-bottom:0}
.ocap-n{display:grid;place-items:center;width:28px;height:28px;color:#fff;background:var(--color-primary);border:2px solid #0F172A;font:700 11px "Fira Code",monospace}
.ocap-copy{font-size:12px}.ocap-copy b{display:block}.ocap-copy div{margin-top:3px;color:var(--muted);font-size:11px;line-height:1.45}
.hl{color:var(--color-accent);font-weight:700}
.footer{
  padding:22px 14px;text-align:center;color:#334155;background:#E2E8F0;border-top:3px solid #0F172A;
  font:500 10px "Fira Code",monospace;
}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1100px){
  .nav{grid-template-columns:1fr auto}.tabs{grid-column:1/-1;justify-content:flex-start;order:3}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:820px){
  .g3,.g2,.g32,.g23{grid-template-columns:1fr}
  .wrap{padding:18px 14px 32px}
}
@media(max-width:560px){
  .nav{padding:10px}.brand-sub,.tab-text,.live span:last-child{display:none}
  .tab{padding:9px}.live{padding:8px}
  .scr-head{grid-template-columns:auto 1fr;padding:15px;box-shadow:4px 4px 0 #0F172A}
  .scr-head .tag{grid-column:2}.scr-title{font-size:22px}
  .g4{grid-template-columns:1fr}
  .card{padding:13px}.kpi{padding:13px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<a class="skip" href="#app">跳至主要內容</a>
<header class="nav">
  <div class="brand">
    <div class="logo" id="brandIcon" aria-hidden="true"></div>
    <div>
      <div class="brand-title">製程品質統計管制系統</div>
      <div class="brand-sub">STATISTICAL PROCESS CONTROL</div>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="主要畫面"></nav>
  <div class="live"><i class="dot" aria-hidden="true"></i><span>即時連線 · 12 台儀器</span></div>
</header>
<main class="wrap" id="app" tabindex="-1"></main>
<footer class="footer">SPC 統計製程管制中心 · 純 UI 展示（無後端），所有數據皆為擬真示範資料。</footer>
<script>
"use strict";
var C={
  primary:"#2563EB",secondary:"#3B82F6",accent:"#EA580C",ok:"#047857",
  warn:"#C2410C",bad:"#DC2626",info:"#1D4ED8",line:"#CBD5E1",
  muted:"#475569",dim:"#64748B",txt:"#1E293B",panel:"#FFFFFF"
};
var ICONS={
  monitoring:'<svg class="icon" viewBox="0 0 24 24"><path d="M3 20h18M5 17l4-5 4 3 6-9M19 6v5M19 6h-5"/></svg>',

  bell:'<svg class="icon" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>',
  engineer:'<svg class="icon" viewBox="0 0 24 24"><path d="M14 6a4 4 0 0 0-5 5L3 17l4 4 6-6a4 4 0 0 0 5-5l-3 3-3-3 2-4Z"/></svg>',
  check:'<svg class="icon" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>',
  trend:'<svg class="icon" viewBox="0 0 24 24"><path d="m4 16 5-5 4 4 7-8M15 7h5v5"/></svg>',
  down:'<svg class="icon" viewBox="0 0 24 24"><path d="m4 8 5 5 4-4 7 7M15 16h5v-5"/></svg>',
  flat:'<svg class="icon" viewBox="0 0 24 24"><path d="M4 12h16M16 8l4 4-4 4"/></svg>',
  clock:'<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  box:'<svg class="icon" viewBox="0 0 24 24"><path d="m4 7 8-4 8 4-8 4-8-4ZM4 7v10l8 4 8-4V7M12 11v10"/></svg>',
  percent:'<svg class="icon" viewBox="0 0 24 24"><path d="m5 19 14-14"/><circle cx="7" cy="7" r="2"/><circle cx="17" cy="17" r="2"/></svg>'
};
function icon(n){return ICONS[n]||ICONS.chart}
document.getElementById("brandIcon").innerHTML=icon("monitoring");

var SCREENS=[
  {ic:"sensors",tt:"數據自動採集",sub:"量測儀器與 AOI 依取樣計畫自動上傳特性值，即時彙整為子群樣本。",tag:"v0 · 採集"},
  {ic:"chart",tt:"管制圖繪製",sub:"即時計算子群均值與全距，繪製 X-bar / R 管制圖並標示中心線與管制界線。",tag:"v1 · 管制圖"},
  {ic:"speed",tt:"製程能力分析",sub:"以規格界線評估 Cp / Cpk / Pp / Ppk，判定製程能力等級。",tag:"v2 · 能力分析"},
  {ic:"inspect",tt:"異常判讀",sub:"套用 Nelson 八大異常法則自動判讀點位，標記失控訊號。",tag:"v3 · 判讀"},
  {ic:"bell",tt:"警報通知",sub:"偵測失控訊號即時推播，依嚴重度升級並鎖定受影響批次。",tag:"v4 · 警報"},
  {ic:"engineer",tt:"工程師處理",sub:"依 OCAP 對策卡派工處置，回填處理紀錄並追蹤 Cpk 回復。",tag:"v5 · 處理"}
];
var SUBGROUPS=["07:00","07:30","08:00","08:30","09:00","09:30","10:00","10:30","11:00","11:30","13:00","13:30","14:00","14:30","15:00","15:30"];
var XBAR=[25.02,24.97,25.05,25.01,24.99,25.08,25.11,25.04,24.96,25.00,25.09,25.19,25.14,25.06,24.98,25.03];
var RVAL=[0.18,0.22,0.15,0.26,0.19,0.24,0.31,0.20,0.17,0.23,0.28,0.42,0.35,0.25,0.19,0.21];
var charts={};
function el(id){return document.getElementById(id)}
function mk(id,opt){
  var node=el(id);if(!node)return;
  if(charts[id])charts[id].dispose();
  var ch=echarts.init(node,null,{renderer:"canvas"});
  ch.setOption(opt);charts[id]=ch;
}
function disposeAll(){Object.keys(charts).forEach(function(k){try{charts[k].dispose()}catch(e){}});charts={}}
function tip(extra){
  return Object.assign({trigger:"axis",backgroundColor:"#FFFFFF",borderColor:"#0F172A",borderWidth:2,textStyle:{color:C.txt,fontFamily:"Fira Code",fontSize:11}},extra||{});
}
function axisX(data){
  return {type:"category",data:data,axisLabel:{color:C.muted,fontFamily:"Fira Code",fontSize:9},axisLine:{lineStyle:{color:"#0F172A"}}};
}
function axisY(min,max){
  return {type:"value",min:min,max:max,axisLabel:{color:C.muted,fontFamily:"Fira Code",fontSize:9},splitLine:{lineStyle:{color:"#E2E8F0"}},axisLine:{show:true,lineStyle:{color:"#0F172A"}}};
}
function header(i){
  var s=SCREENS[i];
  return '<section class="scr-head"><div class="scr-icon" aria-hidden="true">'+icon(s.ic)+'</div><div><h1 class="scr-title">'+s.tt+'</h1><p class="scr-desc">'+s.sub+'</p></div><span class="tag">'+s.tag+'</span></section>';
}
function kpi(ic,lab,val,unit,delta,dir){
  var di=dir==="up"?"trend":dir==="down"?"down":"flat";
  return '<article class="kpi"><div class="kpi-label">'+icon(ic)+lab+'</div><div class="kpi-value">'+val+(unit?' <small>'+unit+'</small>':'')+'</div><div class="delta '+dir+'">'+icon(di)+delta+'</div></article>';
}
function badge(text,cls){return '<span class="badge '+cls+'">'+text+'</span>'}
function paramRow(k,v){return '<div class="param"><span>'+k+'</span><span class="mono"><b>'+v+'</b></span></div>'}
function legend(items){return '<div class="legend">'+items.map(function(x){return '<span><i style="background:'+x[0]+'"></i>'+x[1]+'</span>'}).join("")+'</div>'}

function s0(){
  var instruments=[
    ["CMM 三次元 #A1","連線","25.03","mm","外徑 · 取樣 n=5","b-ok",[25,25.02,24.98,25.05,25.03,25.01,25.04,25.03]],
    ["雷射測厚 #L2","連線","1.482","mm","板厚 · 取樣 n=5","b-ok",[1.48,1.49,1.47,1.48,1.482,1.485,1.48,1.482]],
    ["AOI 光學檢測 #V3","連線","312","點/min","焊點掃描率","b-ok",[300,308,312,305,318,310,316,312]],
    ["扭力測試 #T4","警示","8.9","N·m","鎖付扭力 · 逼近上限","b-warn",[8.2,8.4,8.6,8.7,8.5,8.8,8.9,8.9]],
    ["表面粗糙 #R5","連線","0.42","Ra","研磨面 Ra","b-ok",[.4,.41,.43,.42,.4,.42,.41,.42]],
    ["溫度探針 #H6","離線","—","℃","迴焊爐 · 校正中","b-bad",[0,0,0,0,0,0,0,0]]
  ];
  var feed=[
    ["15:30:12","CMM #A1","LOT-A2418","外徑 D1","25.03","OK","b-ok"],
    ["15:30:04","AOI #V3","LOT-A2418","焊點覆蓋","98.6%","OK","b-ok"],

}
var RENDER=[s0,s1,s2,s3,s4,s5];
function buildTabs(){
  el("tabs").innerHTML=SCREENS.map(function(s,i){
    return '<button type="button" class="tab" data-i="'+i+'" aria-controls="app">'+icon(s.ic)+'<span class="tab-text">'+s.tt+'</span></button>';
  }).join("");
  Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){
    b.addEventListener("click",function(){
      var i=+b.getAttribute("data-i");
      if(location.hash!=="#v"+i)location.hash="v"+i;else show(i);
    });
  });
}
function show(i){
  i=Math.max(0,Math.min(5,i||0));
  disposeAll();
  Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){
    var active=+b.getAttribute("data-i")===i;
    b.classList.toggle("active",active);
    b.setAttribute("aria-current",active?"page":"false");
  });
  RENDER[i]();
}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  show(m?+m[1]:0);
  try{window.scrollTo(0,0)}catch(e){}
}
buildTabs();
window.addEventListener("resize",function(){Object.keys(charts).forEach(function(k){try{charts[k].resize()}catch(e){}})});
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
