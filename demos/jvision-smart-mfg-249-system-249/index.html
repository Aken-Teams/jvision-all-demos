<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>可靠度驗證管理系統</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#db2777; --accent2:#f472b6; --bg:#f6f4f7; --card:#ffffff;
  --ink:#1f1720; --muted:#7a6c78; --line:#eadfe7; --sidebar:#2a0f22; --sidebar2:#3d1531;
  --good:#16a34a; --warn:#d97706; --bad:#dc2626;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",sans-serif; background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; line-height:1.5;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:20px;line-height:1;vertical-align:middle;}
.app{display:flex; min-height:100vh;}
.sidebar{
  width:250px; flex:0 0 250px; background:linear-gradient(180deg,var(--sidebar),var(--sidebar2));
  color:#f4e8ef; display:flex; flex-direction:column; padding:20px 14px; position:sticky; top:0; height:100vh;
}
.brand{display:flex; align-items:center; gap:11px; padding:6px 8px 16px;}
.brand .logo{
  width:40px; height:40px; border-radius:11px; background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex; align-items:center; justify-content:center; color:#fff; flex:0 0 40px;
}
.brand .logo .material-symbols-outlined{font-size:24px;}
.brand .txt{min-width:0;}
.brand .txt b{display:block; font-size:15px; font-weight:800; letter-spacing:.2px; white-space:nowrap;}
.brand .txt span{font-size:11px; color:#d9a9c4;}
.nav{display:flex; flex-direction:column; gap:4px; margin-top:6px;}
.nav button{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left; cursor:pointer;
  background:transparent; border:0; color:#e7c9db; padding:11px 12px; border-radius:10px;
  font-family:inherit; font-size:13.5px; font-weight:600; transition:.15s; min-width:0;
}
.nav button .material-symbols-outlined{font-size:21px; flex:0 0 auto;}
.nav button .lbl{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.nav button:hover{background:rgba(255,255,255,.08); color:#fff;}
.nav button.active{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; box-shadow:0 6px 16px rgba(219,39,119,.35);}
.side-foot{margin-top:auto; padding:12px 10px 2px; font-size:11px; color:#c78fb0; border-top:1px solid rgba(255,255,255,.09);}
.main{flex:1 1 auto; min-width:0; padding:26px 30px 48px;}
.topbar{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
.topbar h1{font-size:22px; margin:0 0 4px; font-weight:800; letter-spacing:.3px;}
.topbar .sub{color:var(--muted); font-size:13px;}
.chip{display:inline-flex; align-items:center; gap:6px; background:#fff; border:1px solid var(--line); border-radius:999px; padding:7px 13px; font-size:12.5px; font-weight:600; color:var(--accent);}
.chip .material-symbols-outlined{font-size:17px;}

.grid{display:grid; gap:16px; min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g21{grid-template-columns:2fr 1fr;}
.g12{grid-template-columns:1fr 2fr;}
.g3-2{grid-template-columns:1.3fr 1fr;}
@media(max-width:820px){
  .g4,.g3,.g2,.g21,.g12,.g3-2{grid-template-columns:1fr;}
}
.card{background:var(--card); border:1px solid var(--line); border-radius:15px; padding:17px 18px; min-width:0;}
.card h3{margin:0 0 3px; font-size:14.5px; font-weight:700;}
.card .cap{font-size:11.5px; color:var(--muted); margin-bottom:12px;}
.kpi .val{font-size:27px; font-weight:800; letter-spacing:.5px; line-height:1.1;}
.kpi .lab{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; margin-bottom:9px;}
.kpi .lab .material-symbols-outlined{font-size:18px; color:var(--accent);}
.kpi .delta{font-size:11.5px; font-weight:600; margin-top:6px;}
.up{color:var(--good);} .down{color:var(--bad);} .flat{color:var(--muted);}
.bar-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#fce7f3,#fbcfe8);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:0 0 36px;}
.bar-icon .material-symbols-outlined{font-size:21px;}

table{width:100%; border-collapse:collapse; font-size:12.8px; min-width:520px;}
.tbl-wrap{overflow-x:auto; border-radius:10px;}
th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); font-weight:700; padding:9px 12px; border-bottom:2px solid var(--line); white-space:nowrap; background:#faf6f9;}
td{padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap;}
tr:last-child td{border-bottom:0;}
.tag{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px;}
.t-run{background:#fdf2f8;color:#be185d;} .t-ok{background:#dcfce7;color:#15803d;} .t-warn{background:#fef3c7;color:#b45309;} .t-bad{background:#fee2e2;color:#b91c1c;} .t-idle{background:#eef2f6;color:#64748b;} .t-wait{background:#ede9fe;color:#6d28d9;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}

.prog{height:7px; background:#f0e6ee; border-radius:99px; overflow:hidden;}
.prog i{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--accent),var(--accent2));}

.chart-box{overflow:hidden; min-width:0;}
.legend{display:flex; flex-wrap:wrap; gap:12px; margin-top:10px; font-size:11.5px; color:var(--muted);}
.legend span{display:inline-flex; align-items:center; gap:6px;}

.chambers{display:grid; grid-template-columns:repeat(3,1fr); gap:13px; min-width:0;}
@media(max-width:820px){.chambers{grid-template-columns:1fr;}}
.chamber{border:1px solid var(--line); border-radius:13px; padding:13px 14px; background:linear-gradient(180deg,#fff,#fdf7fa); min-width:0;}
.chamber .ch-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:9px;}
.chamber .ch-top b{font-size:13.5px;}
.gauge{display:flex; align-items:baseline; gap:5px; margin:2px 0;}
.gauge .g-v{font-size:24px; font-weight:800;}
.gauge .g-u{font-size:12px; color:var(--muted);}
.mini-row{display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted); margin-top:7px;}

.tl{position:relative; padding-left:6px;}
.tl-item{display:flex; gap:13px; padding:2px 0 16px; position:relative;}
.tl-item:not(:last-child):before{content:"";position:absolute;left:8px;top:20px;bottom:-2px;width:2px;background:var(--line);}
.tl-node{width:18px;height:18px;border-radius:50%;flex:0 0 18px;margin-top:2px;background:#fff;border:3px solid var(--accent);}
.tl-node.done{background:var(--accent);border-color:var(--accent);}
.tl-node.warn{border-color:var(--warn);}
.tl-body{min-width:0;}
.tl-body b{font-size:13px;}
.tl-body .tl-meta{font-size:11.5px; color:var(--muted);}

.sched{display:flex; flex-direction:column; gap:9px;}
.sched-row{display:grid; grid-template-columns:110px 1fr; gap:12px; align-items:center; min-width:0;}
@media(max-width:560px){.sched-row{grid-template-columns:1fr;}}
.sched-name{font-size:12.5px; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.track{position:relative; height:26px; background:#f6eef3; border-radius:7px; overflow:hidden;}
.slot{position:absolute; top:3px; bottom:3px; border-radius:6px; display:flex; align-items:center; padding:0 8px; font-size:10.5px; font-weight:700; color:#fff; overflow:hidden; white-space:nowrap;}

.fmea{display:flex; flex-direction:column; gap:11px;}
.fm{border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; min-width:0;}
.fm .fm-l{min-width:0;}
.fm .fm-l b{font-size:13px;}
.fm .fm-l p{margin:2px 0 0; font-size:11.5px; color:var(--muted);}
.rpn{text-align:center; flex:0 0 auto;}
.rpn .n{font-size:22px; font-weight:800; line-height:1;}
.rpn .c{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px;}

.report-doc{border:1px solid var(--line); border-radius:14px; overflow:hidden;}
.rd-head{background:linear-gradient(135deg,var(--sidebar),var(--sidebar2)); color:#fff; padding:18px 20px;}
.rd-head h2{margin:0; font-size:17px;}
.rd-head .rd-sub{font-size:12px; color:#e0b3cd; margin-top:4px;}
.rd-body{padding:18px 20px;}
.kv{display:grid; grid-template-columns:1fr 1fr; gap:11px 26px; margin-bottom:16px;}
@media(max-width:560px){.kv{grid-template-columns:1fr;}}
.kv .k{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px;}
.kv .v{font-size:14px; font-weight:700; margin-top:1px;}
.verdict{display:flex; align-items:center; gap:12px; background:#dcfce7; border:1px solid #bbf7d0; border-radius:12px; padding:14px 16px;}
.verdict.reject{background:#fee2e2;border-color:#fecaca;}
.verdict .material-symbols-outlined{font-size:34px; color:var(--good);}
.verdict.reject .material-symbols-outlined{color:var(--bad);}
.verdict b{font-size:16px;}
.sign{display:flex; gap:22px; margin-top:16px; flex-wrap:wrap;}
.sign .s{font-size:12px;}
.sign .s .nm{border-top:1px solid var(--ink); padding-top:5px; margin-top:22px; font-weight:700;}

.section-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;margin:2px 0 4px;}
.section-title .material-symbols-outlined{color:var(--accent);font-size:20px;}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;}
.pill{background:#fdf2f8;color:#be185d;border:1px solid #fbcfe8;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;}
.note{font-size:11.5px;color:var(--muted);margin-top:10px;}

.mnav{display:none;}
@media(max-width:860px){
  .app{flex-direction:column;}
  .sidebar{width:auto; flex:none; height:auto; position:static; flex-direction:row; align-items:center; padding:12px 14px; gap:10px;}
  .brand{padding:0; flex:1 1 auto;}
  .side-foot{display:none;}
  .nav{display:none;}
  .mnav{display:flex; flex-wrap:wrap; gap:6px; padding:10px 14px 4px; background:var(--sidebar2);}
  .mnav button{display:flex;align-items:center;gap:6px;border:0;cursor:pointer;background:rgba(255,255,255,.08);color:#e7c9db;padding:8px 11px;border-radius:9px;font-family:inherit;font-size:12.5px;font-weight:600;min-width:0;}
  .mnav button.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;}
  .mnav button .material-symbols-outlined{font-size:18px;}
  .main{padding:18px 15px 40px;}
}
@media(max-width:560px){
  .mnav button .lbl{display:none;}
  .mnav button{padding:9px 12px;}
  .topbar h1{font-size:19px;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">verified</span></div>
      <div class="txt"><b>可靠度驗證</b><span>Reliability Verification MES</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">v249 · 純 UI 展示<br/>資料為擬真示範</div>
  </aside>
  <div style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column;">
    <div class="mnav" id="mnav"></div>
    <main class="main">
      <div class="topbar">
        <div>
          <h1 id="scr-title">—</h1>
          <div class="sub" id="scr-sub">—</div>
        </div>
        <div class="chip"><span class="material-symbols-outlined">factory</span>可靠度實驗室 · 第 32 週</div>
      </div>
      <div id="view"></div>
    </main>
  </div>
</div>
<script>
"use strict";
var MODS=[
  {icon:"science",name:"驗證計畫排程",sub:"溫循、老化、振動試項計畫與腔體排程"},
  {icon:"thermostat",name:"試驗即時監控",sub:"腔體溫濕度、振動與樣品通電狀態即時看板"},
  {icon:"monitoring",name:"測試數據採集",sub:"量測數據自動擷取、規格超限自動標記"},
  {icon:"insights",name:"Weibull 壽命分析",sub:"壽命分布擬合、B10/MTTF 與信賴區間估算"},
  {icon:"warning",name:"失效模式分析",sub:"失效模式分類、FMEA 連動與根因追蹤"},
  {icon:"fact_check",name:"驗證報告核發",sub:"判定結果彙整、簽核與可靠度報告核發"}
];
var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function el(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}

function s0(){
  var plans=[
    {id:"RV-2408-011",prod:"BMS 電池管理板",item:"溫度循環 -40~85℃",cyc:"500 循環",chamber:"TC-A2",owner:"林郁婷",due:"08/22",st:"執行中",stc:"t-run",p:62},
    {id:"RV-2408-009",prod:"車載電源模組",item:"高溫老化 85℃/85%RH",cyc:"1000 hrs",chamber:"HAST-1",owner:"陳彥廷",due:"08/25",st:"執行中",stc:"t-run",p:41},
    {id:"RV-2408-014",prod:"馬達控制器",item:"隨機振動 X/Y/Z",cyc:"6 grms",chamber:"VIB-3",owner:"王思涵",due:"08/19",st:"排隊中",stc:"t-wait",p:0},
    {id:"RV-2408-007",prod:"感測器模組",item:"溫濕度循環",cyc:"200 循環",chamber:"TC-A1",owner:"林郁婷",due:"08/18",st:"待審核",stc:"t-warn",p:100},
    {id:"RV-2408-016",prod:"LED 驅動板",item:"熱衝擊 -55/125℃",cyc:"300 循環",chamber:"TS-2",owner:"張家豪",due:"08/28",st:"規劃中",stc:"t-idle",p:0}
  ];
  var rows=plans.map(function(p){
    return '<tr><td><b>'+esc(p.id)+'</b></td><td>'+esc(p.prod)+'</td><td>'+esc(p.item)+'</td><td>'+esc(p.cyc)+'</td><td><span class="tag t-wait">'+esc(p.chamber)+'</span></td><td>'+esc(p.owner)+'</td><td>'+esc(p.due)+'</td>'+
    '<td><span class="tag '+p.stc+'">'+esc(p.st)+'</span></td>'+
    '<td style="min-width:120px;"><div class="prog"><i style="width:'+p.p+'%"></i></div><div style="font-size:10.5px;color:var(--muted);margin-top:3px;">'+p.p+'%</div></td></tr>';
  }).join("");
  var sched=[
    {n:"TC-A1",slots:[{l:8,w:26,c:"#db2777",t:"RV-007 溫濕循環"},{l:40,w:22,c:"#a3a3a3",t:"清機"}]},
    {n:"TC-A2",slots:[{l:2,w:60,c:"#db2777",t:"RV-011 溫循 500cyc"}]},
    {n:"HAST-1",slots:[{l:5,w:44,c:"#f472b6",t:"RV-009 老化"},{l:52,w:30,c:"#c084fc",t:"RV-020 老化(排隊)"}]},
    {n:"VIB-3",slots:[{l:20,w:24,c:"#9333ea",t:"RV-014 振動"}]},
    {n:"TS-2",slots:[{l:60,w:28,c:"#e879a8",t:"RV-016 熱衝擊"}]}
  ];
  var schedHtml=sched.map(function(r){
    var s=r.slots.map(function(x){return '<div class="slot" style="left:'+x.l+'%;width:'+x.w+'%;background:'+x.c+';">'+esc(x.t)+'</div>';}).join("");
    return '<div class="sched-row"><div class="sched-name">'+esc(r.n)+'</div><div class="track">'+s+'</div></div>';
  }).join("");
  el("view").innerHTML=
  '<div class="grid g4" style="margin-bottom:16px;">'+
    kpi("pending_actions","進行中計畫","12","本週新增 4","up","+4")+
    kpi("event_upcoming","本週到期","5","含 2 件逾期風險","down","2 逾期")+
    kpi("deployed_code","腔體稼動率","78%","目標 80%","flat","-2%")+
    kpi("checklist","試項完成率","64%","累計 320/500 循環","up","+8%")+
  '</div>'+
  '<div class="grid g21">'+
    '<div class="card"><h3>驗證計畫清單</h3><div class="cap">依可量產承諾日排序（RULE-01 影響設計凍結者優先）</div><div class="tbl-wrap"><table>'+
      '<thead><tr><th>計畫編號</th><th>產品</th><th>試項</th><th>目標</th><th>腔體</th><th>負責人</th><th>到期</th><th>狀態</th><th>進度</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
    '<div class="card"><h3>試項分布</h3><div class="cap">依試驗類型統計進行中計畫</div><div id="c0a" class="chart-box"></div>'+
      '<div class="legend"><span><span class="dot" style="background:#db2777;"></span>溫度循環</span><span><span class="dot" style="background:#f472b6;"></span>高溫老化</span><span><span class="dot" style="background:#9333ea;"></span>振動</span><span><span class="dot" style="background:#c084fc;"></span>熱衝擊</span></div></div>'+
  '</div>'+
  '<div class="card" style="margin-top:16px;"><h3>本週腔體排程甘特</h3><div class="cap">試驗腔體上機時段（RULE-03：共享設備衝突依量產承諾日排序）</div><div style="overflow-x:auto"><div style="min-width:520px;"><div class="sched">'+schedHtml+'</div></div></div></div>';
  void el("view").offsetHeight;
  mkDonut("c0a",[5,3,2,2],["溫度循環","高溫老化","振動","熱衝擊"],["#db2777","#f472b6","#9333ea","#c084fc"]);
}

function s1(){
  var chambers=[
    {n:"TC-A2 溫循腔",st:"執行中",stc:"t-run",big:"84.6",bu:"℃",set:"設定 85℃",cyc:"循環 312/500",rh:"—",vib:"—"},
    {n:"HAST-1 老化",st:"執行中",stc:"t-run",big:"85.0",bu:"℃",set:"85℃ / 85%RH",cyc:"已運行 412 hrs",rh:"84.8 %RH",vib:"—"},
    {n:"VIB-3 振動台",st:"執行中",stc:"t-run",big:"5.9",bu:"grms",set:"設定 6.0 grms",cyc:"Z 軸 · 22/60 min",rh:"—",vib:"位移 1.8 mm"},
    {n:"TC-A1 溫濕循環",st:"告警",stc:"t-bad",big:"91.2",bu:"℃",set:"設定 85℃ 超溫",cyc:"循環 88/200",rh:"46 %RH",vib:"—"},
    {n:"TS-2 熱衝擊",st:"待機",stc:"t-idle",big:"25.0",bu:"℃",set:"待上機",cyc:"—",rh:"—",vib:"—"},
    {n:"HAST-2 老化",st:"停機",stc:"t-idle",big:"—",bu:"",set:"歲修中",cyc:"—",rh:"—",vib:"—"}
  ];
  var chHtml=chambers.map(function(c){
    return '<div class="chamber"><div class="ch-top"><b>'+esc(c.n)+'</b><span class="tag '+c.stc+'">'+esc(c.st)+'</span></div>'+
      '<div class="gauge"><span class="g-v">'+esc(c.big)+'</span><span class="g-u">'+esc(c.bu)+'</span></div>'+
      '<div style="font-size:11.5px;color:var(--muted);">'+esc(c.set)+'</div>'+
      '<div class="mini-row"><span>'+esc(c.cyc)+'</span></div>'+
      '<div class="mini-row"><span>濕度 '+esc(c.rh)+'</span><span>'+esc(c.vib)+'</span></div></div>';
  }).join("");
  var alerts=[
    {t:"14:02",m:"TC-A1 腔內溫度 91.2℃ 超出設定 +6.2℃",lv:"t-bad"},

function baseOpts(h){return {chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:'Inter,"Noto Sans TC",sans-serif',height:h},grid:{borderColor:"#f0e6ee",strokeDashArray:4},dataLabels:{enabled:false}};}
function render(id,opts){var box=el(id);if(!box)return;try{var c=new ApexCharts(box,opts);c.render();charts.push(c);}catch(e){}}
function mkLine(id,cats,series){
  var o=baseOpts(280);
  o.chart.type="line";o.series=series;o.colors=series.map(function(s){return s.color;});
  o.stroke={width:2,curve:"smooth"};
  o.xaxis={categories:cats,labels:{style:{fontSize:"10px"},rotate:0,hideOverlappingLabels:true},tickAmount:6};
  o.yaxis={labels:{style:{fontSize:"10px"}}};
  o.legend={show:false};o.markers={size:0};
  o.tooltip={shared:true,intersect:false};
  render(id,o);
}
function mkBar(id,cats,series,color,h,horiz){
  var o=baseOpts(h);
  o.chart.type="bar";o.series=series;o.colors=[color];
  o.plotOptions={bar:{horizontal:!!horiz,columnWidth:"58%",borderRadius:4,distributed:false}};
  o.xaxis={categories:cats,labels:{style:{fontSize:"10px"}}};
  o.yaxis={labels:{style:{fontSize:"10px"}}};
  o.legend={show:false};
  o.tooltip={shared:false,intersect:true};
  render(id,o);
}
function mkDonut(id,data,labels,colors){
  var o=baseOpts(240);
  o.chart.type="donut";o.series=data;o.labels=labels;o.colors=colors;
  o.legend={show:false};
  o.plotOptions={pie:{donut:{size:"66%",labels:{show:true,total:{show:true,label:"合計",fontSize:"12px",color:"#7a6c78"}}}}};
  o.stroke={width:2,colors:["#fff"]};
  render(id,o);
}
function mkPareto(id,cats,vals){
  var o=baseOpts(280);
  var total=0;for(var i=0;i<vals.length;i++)total+=vals[i];
  var cum=[],run=0;
  for(var j=0;j<vals.length;j++){run+=vals[j];cum.push(+((run/total)*100).toFixed(1));}
  o.chart.type="line";
  o.series=[{name:"次數",type:"column",data:vals},{name:"累積 %",type:"line",data:cum}];
  o.colors=["#db2777","#9333ea"];
  o.stroke={width:[0,2],curve:"smooth"};
  o.plotOptions={bar:{columnWidth:"55%",borderRadius:4}};
  o.xaxis={categories:cats,labels:{style:{fontSize:"10px"}}};
  o.yaxis=[{labels:{style:{fontSize:"10px"}}},{opposite:true,max:100,labels:{style:{fontSize:"10px"},formatter:function(v){return Math.round(v)+"%";}}}];
  o.legend={show:false};
  o.markers={size:0};
  o.tooltip={shared:false,intersect:false};
  render(id,o);
}

  el("scr-title").textContent=MODS[i].name;
  el("scr-sub").textContent=MODS[i].sub;
  var c=el("view");c.innerHTML="";
  void c.offsetHeight;
  SCREENS[i]();

}
