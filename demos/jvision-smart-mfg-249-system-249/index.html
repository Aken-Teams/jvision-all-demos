<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>可靠度驗證管理系統</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700&family=Roboto+Mono:wght@300;400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#15803D;
  --color-on-primary:#FFFFFF;
  --color-secondary:#22C55E;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDF4;
  --color-foreground:#14532D;
  --color-card:#FFFFFF;
  --color-card-foreground:#14532D;
  --color-muted:#E8F0F1;
  --color-muted-foreground:#475569;
  --color-border:#BBF7D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#15803D;
  --blue:#15803D;
  --ink:#14532D;
  --muted:#475569;
  --line:#BBF7D0;
  --good:#15803D;
  --warn:#B45309;
  --bad:#B91C1C;
  --shadow:6px 6px 0 #14532D;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{
  margin:0;
  min-width:320px;
  background:
    linear-gradient(rgba(21,128,61,.075) 1px,transparent 1px),
    linear-gradient(90deg,rgba(21,128,61,.075) 1px,transparent 1px),
    var(--color-background);
  background-size:28px 28px;
  color:var(--ink);
  font-family:"Exo",system-ui,sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,a{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-size:20px;
  font-style:normal;
  font-weight:normal;
  line-height:1;
  vertical-align:middle;
}
.mono,td:first-child,.val,.g-v,.rpn .n,.kv .v,.delta,.chip{
  font-family:"Roboto Mono",monospace;
  font-variant-numeric:tabular-nums;
}
.app{display:flex;min-height:100vh}
.sidebar{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  width:276px;
  height:100vh;
  flex:0 0 276px;
  flex-direction:column;
  padding:20px 16px;
  border-right:4px solid var(--ink);
  background:var(--ink);
  color:#fff;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:4px 2px 22px;
  border-bottom:2px solid #86EFAC;
}
.logo{
  display:grid;
  width:46px;
  height:46px;
  flex:0 0 46px;
  place-items:center;
  border:2px solid #fff;
  background:var(--color-secondary);
  color:#052E16;
  box-shadow:4px 4px 0 #fff;
}
.logo .material-symbols-outlined{font-size:27px;font-variation-settings:"FILL" 1}
.brand b{
  display:block;
  font-size:16px;
  font-weight:700;
  letter-spacing:.04em;
}
.brand span{font:10px "Roboto Mono",monospace;color:#BBF7D0}
.nav{display:flex;flex-direction:column;gap:7px;margin-top:18px}
.nav button,.mnav button{
  display:flex;
  min-height:46px;
  align-items:center;
  gap:11px;
  border:2px solid transparent;
  border-radius:0;
  background:transparent;
  color:#DCFCE7;
  text-align:left;
  transition:background-color .18s,color .18s,transform .18s;
}
.nav button{width:100%;padding:10px 11px}
.nav button:hover,.mnav button:hover{background:#166534;color:#fff}
.nav button.active,.mnav button.active{
  border-color:#fff;
  background:var(--color-secondary);
  color:#052E16;
  font-weight:700;
  box-shadow:4px 4px 0 #fff;
  transform:translate(-2px,-2px);
}
.nav .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot{
  margin-top:auto;
  padding-top:14px;
  border-top:2px solid #86EFAC;
  color:#BBF7D0;
  font:11px/1.7 "Roboto Mono",monospace;
}
.shell{display:flex;min-width:0;flex:1;flex-direction:column}
.mnav{display:none}
.main{min-width:0;padding:28px clamp(16px,3vw,42px) 56px}
.topbar{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:20px;
  align-items:start;
  margin-bottom:24px;
  padding-bottom:18px;
  border-bottom:4px solid var(--ink);
}
.eyebrow{
  margin-bottom:6px;
  color:var(--color-primary);
  font:700 11px "Roboto Mono",monospace;
  letter-spacing:.16em;
  text-transform:uppercase;
}
.topbar h1{
  margin:0 0 5px;
  font-size:clamp(24px,3vw,40px);
  font-weight:700;
  letter-spacing:-.035em;
  line-height:1.05;
}
.sub{max-width:760px;color:var(--muted);font-size:13px}
.chip{
  display:inline-flex;
  min-height:42px;
  align-items:center;
  gap:7px;
  padding:8px 12px;
  border:2px solid var(--ink);
  background:#fff;
  color:var(--ink);
  font-size:11px;
  font-weight:700;
  box-shadow:4px 4px 0 var(--color-accent);
}
.progress-rail{
  position:fixed;
  top:0;
  right:0;
  z-index:30;
  width:6px;
  height:100vh;
  background:#DCFCE7;
}
.progress-rail i{
  display:block;
  width:100%;
  height:16.666%;
  background:var(--color-accent);
  transition:transform .3s ease;
  transform-origin:top;
}
.grid{display:grid;gap:16px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g12{grid-template-columns:minmax(300px,1fr) minmax(0,2fr)}
.g32{grid-template-columns:minmax(0,1.3fr) minmax(280px,1fr)}
.card{
  min-width:0;
  padding:18px;
  border:2px solid var(--ink);
  border-radius:0;
  background:var(--color-card);
  color:var(--color-card-foreground);
}
.card.feature{box-shadow:var(--shadow)}
.card h3{
  margin:0 0 3px;
  font-size:15px;
  font-weight:700;
  letter-spacing:.01em;
}
.cap{margin-bottom:13px;color:var(--muted);font-size:11.5px}
.kpi{position:relative;overflow:hidden;padding:16px}
.kpi:after{
  position:absolute;
  right:-22px;
  bottom:-35px;
  width:90px;
  height:90px;
  border:14px solid #DCFCE7;
  content:"";
  transform:rotate(20deg);
}
.kpi:nth-child(even){background:#ECFDF5}
.kpi .row{position:relative;z-index:1;display:flex;justify-content:space-between;gap:10px}
.lab{
  display:flex;
  align-items:center;
  gap:6px;
  margin-bottom:9px;
  color:var(--muted);
  font-size:11px;
  font-weight:600;
}
.lab .material-symbols-outlined{color:var(--color-primary)}
.val{font-size:clamp(24px,2.6vw,31px);font-weight:700;line-height:1}
.delta{position:relative;z-index:1;margin-top:10px;font-size:10.5px;font-weight:700}
.bar-icon{
  display:grid;
  width:39px;
  height:39px;
  flex:0 0 39px;
  place-items:center;
  border:2px solid var(--ink);
  background:var(--color-secondary);
  color:#052E16;
}
.up{color:#166534}.down{color:#991B1B}.flat{color:#475569}
.tbl-wrap{overflow-x:auto;border:2px solid var(--ink)}
table{width:100%;min-width:540px;border-collapse:collapse;font-size:12px}
th{
  padding:10px 11px;
  border-right:1px solid #86EFAC;
  border-bottom:2px solid var(--ink);
  background:var(--ink);
  color:#fff;
  font:700 10px "Roboto Mono",monospace;
  letter-spacing:.06em;
  text-align:left;
  white-space:nowrap;
}
td{
  padding:10px 11px;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  white-space:nowrap;
}
th:last-child,td:last-child{border-right:0}
tbody tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#F0FDF4}
tbody tr:hover{background:#DCFCE7}
td:nth-last-child(1){font-variant-numeric:tabular-nums}
.tag{
  display:inline-flex;
  min-height:24px;
  align-items:center;
  gap:5px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:0;
  font-size:10.5px;
  font-weight:700;
}
.tag:before{font-family:"Material Symbols Outlined";font-size:14px}
.t-run{background:#DCFCE7;color:#166534}.t-run:before{content:"play_circle"}
.t-ok{background:#DCFCE7;color:#166534}.t-ok:before{content:"check_circle"}
.t-warn{background:#FEF3C7;color:#92400E}.t-warn:before{content:"warning"}
.t-bad{background:#FEE2E2;color:#991B1B}.t-bad:before{content:"error"}
.t-idle{background:#E2E8F0;color:#334155}.t-idle:before{content:"pause_circle"}
.t-wait{background:#E0F2FE;color:#075985}.t-wait:before{content:"schedule"}
.prog{height:10px;border:1px solid var(--ink);background:#fff}
.prog i{display:block;height:100%;background:var(--color-primary)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;color:var(--muted);font-size:11px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{display:inline-block;width:9px;height:9px;border:1px solid var(--ink)}
.chambers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.chamber{
  min-width:0;
  padding:14px;
  border:2px solid var(--ink);
  background:#fff;
}
.chamber:nth-child(2n){background:#F0FDF4}
.ch-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ch-top b{font-size:13px}
.gauge{display:flex;align-items:baseline;gap:5px;margin:9px 0 2px}
.g-v{font-size:27px;font-weight:700}.g-u{color:var(--muted);font-size:11px}
.mini-row{display:flex;justify-content:space-between;margin-top:7px;color:var(--muted);font-size:11px}
.section-title{
  display:flex;
  align-items:center;
  gap:8px;
  margin:2px 0 10px;
  font-size:15px;
  font-weight:700;
  text-transform:uppercase;
}
.section-title:after{height:3px;flex:1;background:var(--ink);content:""}
.section-title .material-symbols-outlined{color:var(--color-primary)}
.sched{display:flex;flex-direction:column;gap:9px}
.sched-row{display:grid;grid-template-columns:105px 1fr;gap:12px;align-items:center}
.sched-name{overflow:hidden;font:700 11px "Roboto Mono",monospace;text-overflow:ellipsis;white-space:nowrap}
.track{position:relative;height:28px;border:1px solid var(--ink);background:#E8F0F1;overflow:hidden}
.slot{
  position:absolute;
  top:3px;
  bottom:3px;
  display:flex;
  align-items:center;
  overflow:hidden;
  padding:0 7px;
  color:#fff;
  font:700 9.5px "Roboto Mono",monospace;
  white-space:nowrap;
}
.fmea{display:flex;flex-direction:column;gap:10px}
.fm{
  display:grid;
  min-width:0;
  grid-template-columns:1fr auto;
  gap:10px;
  align-items:center;
  padding:12px 14px;
  border:2px solid var(--ink);
  background:#fff;
}
.fm:nth-child(odd){background:#F0FDF4}
.fm-l{min-width:0}.fm-l b{font-size:13px}
.fm-l p{margin:2px 0 0;color:var(--muted);font-size:11px}
.pill-row{display:flex;flex-wrap:wrap;gap:6px}
.pill{
  padding:3px 8px;
  border:1px solid var(--ink);
  background:#DCFCE7;
  color:#14532D;
  font:700 10px "Roboto Mono",monospace;
}
.rpn{text-align:center}.rpn .n{font-size:23px;font-weight:700}.rpn .c{color:var(--muted);font-size:9px}
.report-doc{border:2px solid var(--ink)}
.rd-head{padding:18px 20px;background:var(--ink);color:#fff}
.rd-head h2{margin:0;font-size:17px}.rd-sub{margin-top:4px;color:#BBF7D0;font-size:11px}
.rd-body{padding:18px 20px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;margin-bottom:17px}
.kv .k{color:var(--muted);font:700 10px "Roboto Mono",monospace;text-transform:uppercase}
.kv .v{margin-top:2px;font-size:12px;font-weight:700}
.verdict{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  border:3px solid var(--color-primary);
  background:#DCFCE7;
}
.verdict .material-symbols-outlined{color:var(--color-primary);font-size:34px}
.verdict b{font-size:16px}
.sign{display:flex;flex-wrap:wrap;gap:25px;margin-top:18px}
.sign .s{font-size:11px}.sign .nm{margin-top:22px;padding-top:5px;border-top:1px solid var(--ink);font-weight:700}
.tl{padding-left:4px}.tl-item{position:relative;display:flex;gap:12px;padding:2px 0 16px}
.tl-item:not(:last-child):before{position:absolute;top:19px;bottom:-2px;left:8px;width:2px;background:var(--ink);content:""}
.tl-node{z-index:1;width:18px;height:18px;flex:0 0 18px;border:3px solid var(--color-primary);background:#fff}
.tl-node.done{background:var(--color-primary)}.tl-node.warn{border-color:var(--color-accent);background:#FEF3C7}
.tl-body b{font-size:12px}.tl-meta{color:var(--muted);font:10.5px "Roboto Mono",monospace}
.note{margin-top:11px;padding:10px;border-left:5px solid var(--color-accent);background:#FEF3C7;color:#78350F;font-size:11px}
.param{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.param .pv{color:var(--color-primary);font:700 15px "Roboto Mono",monospace;text-align:right}
.chapter-cta{
  display:flex;
  justify-content:flex-end;
  margin-top:16px;
}
.chapter-cta button{
  min-height:42px;
  padding:8px 14px;
  border:2px solid var(--ink);
  border-radius:0;
  background:var(--color-accent);
  color:#000;
  font-weight:700;
  box-shadow:4px 4px 0 var(--ink);
  transition:transform .18s,box-shadow .18s,background-color .18s;
}
.chapter-cta button:hover{background:#F59E0B;transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.grid-item{animation:enter .4s both}
.grid-item:nth-child(2){animation-delay:.06s}.grid-item:nth-child(3){animation-delay:.12s}.grid-item:nth-child(4){animation-delay:.18s}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.92)}to{opacity:1;transform:none}}
@media(max-width:1050px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g21,.g12,.g32{grid-template-columns:1fr}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{position:static;width:auto;height:auto;flex:none;padding:12px 14px;border-right:0;border-bottom:4px solid var(--ink)}
  .brand{padding:0;border:0}.nav,.side-foot{display:none}
  .mnav{display:flex;overflow-x:auto;gap:7px;padding:10px 14px 14px;background:var(--ink)}
  .mnav button{min-width:46px;justify-content:center;padding:9px 11px}
  .mnav .lbl{display:none}
  .main{padding:20px 15px 44px}
  .chambers{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:560px){
  .topbar{grid-template-columns:1fr}.chip{justify-self:start}
  .g4,.g3,.g2,.chambers{grid-template-columns:1fr}
  .sched-row{grid-template-columns:1fr;gap:4px}
  .kv{grid-template-columns:1fr}
  .card{padding:14px}
  .progress-rail{width:4px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    scroll-behavior:auto!important;
    animation:none!important;
    transition:none!important;
  }
  .grid-item{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="progress-rail" aria-hidden="true"><i id="screen-progress"></i></div>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">verified</span></div>
      <div><b>可靠度驗證</b><span>RELIABILITY VERIFICATION MES</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
    <div class="side-foot">SYSTEM / v249<br>STATUS / DEMO DATA</div>
  </aside>
  <div class="shell">
    <nav class="mnav" id="mnav" aria-label="行動版功能"></nav>
    <main class="main">
      <header class="topbar">
        <div>
          <div class="eyebrow">Reliability Operations / Chapter <span id="chapter">01</span></div>
          <h1 id="scr-title">—</h1>
          <div class="sub" id="scr-sub">—</div>
        </div>
        <div class="chip"><span class="material-symbols-outlined">factory</span>可靠度實驗室 · 第 32 週</div>
      </header>
      <div id="view"></div>
    </main>
  </div>
</div>
<script>
"use strict";
var MODS=[
 {icon:"science",name:"驗證計畫排程",sub:"溫循、老化、振動試項計畫與腔體排程"},
 {icon:"thermostat",name:"試驗即時監控",sub:"腔體溫濕度、振動與樣品通電狀態即時看板"},
 {icon:"monitoring",name:"測試數據採集",sub:"量測數據自動擷取、規格超限自動標記"},
 {icon:"insights",name:"Weibull 壽命分析",sub:"壽命分布擬合、B10/MTTF 與信賴區間估算"},
 {icon:"warning",name:"失效模式分析",sub:"失效模式分類、FMEA 連動與根因追蹤"},
 {icon:"fact_check",name:"驗證報告核發",sub:"判定結果彙整、簽核與可靠度報告核發"}
];
var charts=[];
function el(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function killCharts(){charts.forEach(function(c){try{c.destroy()}catch(e){}});charts=[]}
function tag(t,c){return'<span class="tag '+c+'">'+esc(t)+'</span>'}
function kpi(icon,lab,val,sub,dir,delta){
 return'<div class="card kpi grid-item"><div class="row"><div><div class="lab"><span class="material-symbols-outlined">'+icon+'</span>'+esc(lab)+'</div><div class="val">'+esc(val)+'</div></div><div class="bar-icon"><span class="material-symbols-outlined">'+icon+'</span></div></div><div class="delta '+dir+'">'+esc(delta?delta+" "+sub:sub)+'</div></div>'
}
function cta(i){
 if(i>=5)return'<div class="chapter-cta"><button type="button" onclick="show(0)">返回驗證計畫 <span class="material-symbols-outlined">restart_alt</span></button></div>';
 return'<div class="chapter-cta"><button type="button" onclick="show('+(i+1)+')">下一章：'+esc(MODS[i+1].name)+' <span class="material-symbols-outlined">arrow_forward</span></button></div>'
}
function s0(){
 var plans=[
 ["RV-2408-011","BMS 電池管理板","溫度循環 -40~85℃","500 循環","TC-A2","林郁婷","08/22","執行中","t-run",62],
 ["RV-2408-009","車載電源模組","高溫老化 85℃/85%RH","1000 hrs","HAST-1","陳彥廷","08/25","執行中","t-run",41],
 ["RV-2408-014","馬達控制器","隨機振動 X/Y/Z","6 grms","VIB-3","王思涵","08/19","排隊中","t-wait",0],
 ["RV-2408-007","感測器模組","溫濕度循環","200 循環","TC-A1","林郁婷","08/18","待審核","t-warn",100],
 ["RV-2408-016","LED 驅動板","熱衝擊 -55/125℃","300 循環","TS-2","張家豪","08/28","規劃中","t-idle",0]
