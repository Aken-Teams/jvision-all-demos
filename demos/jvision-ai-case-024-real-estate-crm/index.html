<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>建案銷售追客艙 · Real-Estate Sales CRM</title>
<meta name="description" content="從來客登記、戶別銷控到議價成交與交屋的建案銷售 CRM（純 UI 展示）。"/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400&family=Playfair+Display:ital@1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#64748b;
  --color-on-primary:#fff;
  --color-secondary:#94a3b8;
  --color-on-secondary:#0f172a;
  --color-accent:#ea580c;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#334155;
  --color-card:#fff;
  --color-card-foreground:#334155;
  --color-muted:#ebf0f5;
  --color-muted-foreground:#475569;
  --color-border:#e2e8f0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#64748b;
  --blue:#64748b;
  --ink:#0f172a;
  --muted:#475569;
  --line:#e2e8f0;
  --sold:#b91c1c;
  --book:#b45309;
  --hold:#5b21b6;
  --avail:#047857;
  --ok:#047857;
  --warn:#b45309;
  --bad:#b91c1c;
  --shadow:0 18px 50px rgba(15,23,42,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0}
body{
  min-width:320px;
  background:
    linear-gradient(rgba(100,116,139,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(100,116,139,.035) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--color-foreground);
  font-family:Inter,"Microsoft JhengHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,a,[role=button],.unit,.lead,.grow{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible,.unit:focus-visible,.lead:focus-visible{
  outline:3px solid rgba(234,88,12,.35);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;
  font-size:20px;line-height:1;vertical-align:middle
}
.top{
  position:sticky;top:0;z-index:40;
  border-bottom:1px solid rgba(226,232,240,.9);
  background:rgba(248,250,252,.9);
  backdrop-filter:blur(18px);
}
.topin{
  max-width:1440px;margin:auto;padding:11px 28px;
  display:flex;align-items:center;gap:18px;min-width:0
}
.brand{display:flex;align-items:center;gap:12px;min-width:max-content}
.logo{
  width:42px;height:42px;border-radius:8px;display:grid;place-items:center;
  color:#fff;background:#334155;position:relative;overflow:hidden;
  box-shadow:7px 7px 0 #cbd5e1
}
.logo:after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:5px;
  background:var(--color-accent)
}
.logo .material-symbols-outlined{font-size:24px}
.brand b{display:block;color:var(--ink);font-size:15px;font-weight:800;letter-spacing:.02em}
.brand span{display:block;color:var(--muted);font-size:9px;font-weight:700;letter-spacing:.18em}
.nav{
  display:flex;gap:4px;margin-left:auto;overflow-x:auto;
  scrollbar-width:none
}
.nav::-webkit-scrollbar{display:none}
.nav button{
  min-height:42px;padding:0 11px;border:1px solid transparent;border-radius:8px;
  display:flex;align-items:center;gap:6px;white-space:nowrap;
  background:transparent;color:var(--muted);font:700 12px Inter,sans-serif;
  transition:background .2s,color .2s,border-color .2s,transform .2s
}
.nav button:hover{background:#fff;border-color:var(--line);color:var(--ink)}
.nav button.on{
  background:var(--ink);border-color:var(--ink);color:#fff;
  box-shadow:0 8px 20px rgba(15,23,42,.13)
}
.nav button.on .material-symbols-outlined{color:#fb923c}
.who{
  display:flex;align-items:center;gap:9px;padding-left:16px;
  border-left:1px solid var(--line);white-space:nowrap
}
.ava,.av2{
  display:grid;place-items:center;background:#e2e8f0;color:var(--ink);
  border:1px solid #cbd5e1;font-weight:800
}
.ava{width:36px;height:36px;border-radius:8px;font-size:13px}
.who b{display:block;color:var(--ink);font-size:12px}
.who small{display:block;color:var(--muted);font-size:10px}

.wrap{max-width:1440px;margin:auto;padding:28px 28px 64px}
.view{display:none}
.view.on{display:block}
.ph{
  min-height:190px;margin-bottom:20px;padding:32px 36px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:28px;
  position:relative;overflow:hidden;border-radius:16px;
  color:#fff;background:#1e293b;
  box-shadow:var(--shadow)
}
.ph:before{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(100deg,rgba(15,23,42,.98) 0%,rgba(15,23,42,.88) 52%,rgba(15,23,42,.22) 100%),
    repeating-linear-gradient(90deg,transparent 0 79px,rgba(255,255,255,.04) 80px),
    repeating-linear-gradient(0deg,transparent 0 39px,rgba(255,255,255,.04) 40px)
}
.ph:after{
  content:"";position:absolute;width:390px;height:270px;right:4%;top:28px;
  background:
    linear-gradient(30deg,transparent 43%,rgba(255,255,255,.17) 44% 45%,transparent 46%),
    linear-gradient(150deg,transparent 43%,rgba(255,255,255,.15) 44% 45%,transparent 46%),
    linear-gradient(90deg,transparent 48%,rgba(234,88,12,.95) 49% 51%,transparent 52%);
  transform:perspective(600px) rotateX(57deg) rotateZ(-29deg);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:inset 0 0 50px rgba(255,255,255,.06)
}
.ph>div{position:relative;z-index:2}
.ph h1{
  margin:0;display:flex;align-items:center;gap:12px;
  color:#fff;font-size:clamp(27px,3vw,44px);line-height:1.08;
  font-weight:800;letter-spacing:-.045em
}
.ph h1 .bar{width:5px;height:38px;background:var(--color-accent)}
.ph p{max-width:640px;margin:12px 0 0 17px;color:#cbd5e1;font-size:13px;line-height:1.7}
.ph p:after{
  content:" — sales intelligence";
  font-family:"Playfair Display",serif;font-style:italic;color:#fb923c
}
.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{
  min-height:36px;padding:0 12px;border:1px solid rgba(255,255,255,.2);
  border-radius:7px;display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.1);color:#fff;font-size:11px;font-weight:700;
  backdrop-filter:blur(8px)
}
.pill.gold{background:var(--color-accent);border-color:var(--color-accent);color:#fff}
.pill .material-symbols-outlined{font-size:16px}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi,.card{
  min-width:0;border:1px solid var(--line);background:var(--color-card);
  color:var(--color-card-foreground);border-radius:12px;
  box-shadow:0 1px 2px rgba(15,23,42,.03)
}
.kpi{
  min-height:132px;padding:18px;position:relative;overflow:hidden;
  transition:transform .22s,box-shadow .22s,border-color .22s
}
.kpi:hover,.card:hover{border-color:#cbd5e1}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.kpi:before{
  content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;
  background:var(--color-accent)
}
.kpi:after{
  content:"";position:absolute;width:82px;height:82px;right:-28px;top:-28px;
  border:16px solid var(--color-muted);transform:rotate(18deg)
}
.kpi .l{
  display:flex;align-items:center;gap:7px;color:var(--muted);
  font-size:11px;font-weight:700
}
.kpi .l .material-symbols-outlined{color:var(--blue);font-size:18px}
.kpi .v{
  margin-top:10px;color:var(--ink);font-size:28px;font-weight:800;
  font-variant-numeric:tabular-nums
}
.kpi .v small{color:var(--muted);font-size:12px;font-weight:600}
.kpi .d{margin-top:5px;font-size:11px;font-weight:700}
.up{color:var(--ok)}.up:before{content:"↑ "}
.dn{color:var(--bad)}.dn:before{content:"↓ "}

.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:1.5fr 1fr}
.g11{grid-template-columns:1fr 1fr}
.g21{grid-template-columns:1.35fr 1fr}
.card{padding:18px}
.card h3{
  margin:0 0 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  color:var(--ink);font-size:14px;font-weight:800;letter-spacing:-.01em
}
.card h3:after{
  content:"";height:1px;flex:1;min-width:20px;background:var(--line)
}
.card h3 .material-symbols-outlined{color:var(--color-accent)}
.card h3 .grow{
  order:3;margin-left:auto;color:#c2410c;font-size:11px;font-weight:700;
  text-decoration:underline;text-underline-offset:3px
}
.chart{width:100%;height:270px}
.leg{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:11px;font-weight:700}
.leg span{display:inline-flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;border-radius:2px;display:inline-block}
.d-sold{background:var(--sold)}.d-book{background:var(--book)}
.d-hold{background:var(--hold)}.d-avail{background:var(--avail)}

.gridwrap,.tblwrap,.pipe{overflow-x:auto;scrollbar-color:#cbd5e1 transparent}
.unitgrid{min-width:680px;border-collapse:separate;border-spacing:7px}
.unitgrid th{
  padding:3px 5px;color:var(--muted);font-size:10px;font-weight:800;
  text-align:center;white-space:nowrap
}
.unitgrid th.fl,.floorlab{text-align:right;color:var(--ink)}
.floorlab{padding-right:8px;font:800 12px "JetBrains Mono",monospace;white-space:nowrap}
.unit{
  width:91px;height:64px;padding:8px;color:#fff;border-radius:6px;
  position:relative;border:1px solid rgba(255,255,255,.22);
  box-shadow:5px 5px 0 rgba(15,23,42,.12);
  transition:transform .2s,box-shadow .2s
}
.unit:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 rgba(15,23,42,.15)}
.unit .u-no,.unit .u-price,.unit .u-sz{font-family:"JetBrains Mono",monospace}
.unit .u-no{font-size:11px;font-weight:700}
.unit .u-price{position:absolute;bottom:7px;left:8px;font-size:10px}
.unit .u-sz{position:absolute;right:8px;top:8px;font-size:9px}
.u-sold{background:#991b1b}.u-book{background:#a16207}
.u-hold{background:#5b21b6}.u-avail{background:#047857}

.pipe{
  display:grid;grid-auto-flow:column;grid-auto-columns:minmax(235px,1fr);
  gap:12px;padding:2px 2px 8px
}
.pcol{padding:11px;background:#f1f5f9;border:1px solid var(--line);border-radius:9px}
.pch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.pch b{color:var(--ink);font-size:12px}
.pch .sum{
  padding:3px 8px;border:1px solid #cbd5e1;border-radius:5px;
  background:#fff;color:var(--ink);font:10px "JetBrains Mono",monospace
}
.lead{
  margin-bottom:9px;padding:11px;border:1px solid var(--line);
  border-left:3px solid var(--color-accent);border-radius:7px;background:#fff;
  box-shadow:0 2px 5px rgba(15,23,42,.04);
  transition:transform .2s,box-shadow .2s
}
.lead:hover{transform:translateX(3px);box-shadow:0 8px 18px rgba(15,23,42,.09)}
.lead .lt{display:flex;align-items:center;justify-content:space-between;gap:6px}
.lead b{color:var(--ink);font-size:12px}
.lead .need{margin:6px 0 3px;color:#c2410c;font-size:11px;font-weight:800}
.lead small{display:block;color:var(--muted);font-size:10px}
.lead .lf{display:flex;align-items:center;gap:6px;margin-top:8px}
.av2{width:23px;height:23px;border-radius:5px;font-size:9px}
.heat,.tag{
  display:inline-flex;align-items:center;gap:4px;padding:3px 7px;
  border-radius:4px;font-size:10px;font-weight:800;white-space:nowrap
}
.heat:before,.tag:before{font-size:8px}
.h-hot{background:#fee2e2;color:#991b1b}.h-hot:before{content:"▲"}
.h-warm{background:#fef3c7;color:#92400e}.h-warm:before{content:"●"}
.h-cold{background:#e2e8f0;color:#334155}.h-cold:before{content:"■"}

.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{
  padding:11px 12px;border-bottom:2px solid #cbd5e1;background:#f1f5f9;
  color:#334155;font-size:10px;font-weight:800;text-align:left;white-space:nowrap
}
.tbl td{padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tbody tr:hover td{background:#f8fafc}
.tbl td:nth-child(n+2){font-variant-numeric:tabular-nums}
.tbl td[style*="font-weight:800;color:var(--navy)"],
.tbl td[style*="font-weight:800;color:var(--gold)"]{font-family:"JetBrains Mono",monospace}
.tag:before{content:"●"}
.t-ok{background:#d1fae5;color:#065f46}
.t-wait{background:#fef3c7;color:#92400e}
.t-rej{background:#fee2e2;color:#991b1b}
.t-info{background:#e2e8f0;color:#334155}

.visit{
  display:flex;gap:12px;align-items:center;padding:13px 0;
  border-top:1px solid var(--line)
}
.visit:first-of-type{border-top:0}
.vtime{width:62px;flex:none;text-align:center}
.vtime b{display:block;color:var(--ink);font:700 14px "JetBrains Mono",monospace}
.vtime small,.vmid small{color:var(--muted);font-size:10px}
.vmid{flex:1;min-width:0}
.vmid b{color:var(--ink);font-size:12px}
.vmid small{display:block;margin-top:3px}
.prog,.tbar{
  overflow:hidden;background:#e2e8f0;border-radius:2px
}
.prog{height:6px;margin-top:7px}
.prog span,.tbar span{display:block;height:100%;background:var(--color-accent)}
.cstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.cs{
  padding:13px;text-align:center;background:#f1f5f9;border:1px solid var(--line);
  border-radius:7px
}
.cs b{display:block;color:var(--ink);font:800 19px Inter,sans-serif}
.cs span{color:var(--muted);font-size:10px}
.cs.gold b{color:#c2410c}

.tl-i{display:flex;gap:11px;padding:12px 0;border-top:1px solid var(--line)}
.tl-i:first-of-type{border-top:0}
.tl-ic{
  width:32px;height:32px;border-radius:6px;display:grid;place-items:center;flex:none;
  background:#f1f5f9;color:var(--blue);border:1px solid var(--line)
}
.tl-ic .material-symbols-outlined{font-size:17px}
.tl-i b{color:var(--ink);font-size:12px}
.tl-i small{display:block;margin-top:2px;color:var(--muted);font-size:10px;line-height:1.5}
.tl-i .when{margin-left:auto;color:var(--muted);font:10px "JetBrains Mono",monospace;white-space:nowrap}
.alert{padding:14px 15px;border:1px solid;border-left-width:4px;border-radius:7px}
.alert h4{margin:0 0 6px;display:flex;align-items:center;gap:6px;font-size:12px}
.alert p{margin:0;font-size:11px;line-height:1.65}
.a-red{background:#fff7f7;border-color:#dc2626;color:#7f1d1d}
.a-amber{background:#fffbeb;border-color:#d97706;color:#78350f}
.a-navy{background:#f1f5f9;border-color:#64748b;color:#1e293b}

.ai-row{
  display:flex;gap:11px;margin-bottom:10px;padding:12px;
  border:1px solid var(--line);border-left:4px solid var(--blue);
  border-radius:7px;background:#f8fafc
}
.ai-ic{
  width:32px;height:32px;border-radius:5px;display:grid;place-items:center;
  flex:none;background:var(--ink);color:#fff
}
.ai-ic.g{background:var(--color-accent)}
.ai-row p{margin:0;color:var(--color-foreground);font-size:11px;line-height:1.6}
.ai-row b{color:var(--ink)}
.trow{
  display:grid;grid-template-columns:110px 1fr 120px;gap:12px;
  align-items:center;padding:13px 0;border-top:1px solid var(--line)
}
.trow:first-of-type{border-top:0}
.trow .nm{color:var(--ink);font-size:12px;font-weight:800}
.trow .nm small{display:block;color:var(--muted);font-size:10px;font-weight:500}
.tbar{height:10px}
.trow .pct{text-align:right;color:var(--ink);font:800 13px Inter,sans-serif}
.trow .pct small{display:block;color:var(--muted);font:10px "JetBrains Mono",monospace}

@keyframes reveal{
  from{opacity:0;transform:translateY(16px) scale(.96)}
  to{opacity:1;transform:none}
}
.view.on .kpi,.view.on .card{
  animation:reveal .42s cubic-bezier(.2,.8,.2,1) both
}
.view.on .kpi:nth-child(2),.view.on .grid>.card:nth-child(2){animation-delay:.06s}
.view.on .kpi:nth-child(3){animation-delay:.12s}
.view.on .kpi:nth-child(4){animation-delay:.18s}

@media(max-width:1100px){
  .topin{align-items:flex-start;flex-wrap:wrap}
  .nav{order:3;width:100%;margin:0}
  .who{margin-left:auto}
}
@media(max-width:900px){
  .kpis{grid-template-columns:1fr 1fr}
  .g2,.g11,.g21{grid-template-columns:1fr!important}
  .ph{min-height:180px;padding:28px}
}
@media(max-width:560px){
  .topin{padding:10px 14px;gap:10px}
  .wrap{padding:16px 14px 36px}
  .who small{display:none}
  .who{padding-left:10px}
  .brand b{font-size:13px}
  .brand span{font-size:8px}
  .logo{width:38px;height:38px}
  .ph{min-height:220px;padding:24px 20px;align-items:flex-start;flex-direction:column}
  .ph:after{right:-130px;top:70px}
  .ph h1{font-size:28px}
  .ph p{margin-left:17px}
  .pills{justify-content:flex-start}
  .kpis{grid-template-columns:1fr}
  .trow{grid-template-columns:82px 1fr 82px}
  .card{padding:15px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important
  }
}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <div class="brand">
      <span class="logo"><span class="material-symbols-outlined">apartment</span></span>
      <div><b>建案銷售追客艙</b><span>ESTATE SALES CRM</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
    <div class="who"><span class="ava">昀</span><div><b>林品昀</b><small>案場主管 · 富硯建設</small></div></div>
  </div>
</header>
<main class="wrap" id="views"></main>
<script>
var NAV=[
  ["space_dashboard","銷售總覽"],["grid_view","戶別銷控"],["person_add","來客追蹤"],
  ["directions_walk","帶看跟進"],["handshake","成交簽約"],["flag","業績目標"]
];
var NAMES=NAV.map(function(n){return n[1]});
var DESC=[
  "去化率、業績戰報與案場銷售脈動一次掌握",
  "樓層×戶別銷控表，顏色標示已售/已訂/保留/待售與價格牌",
  "來客登記、需求配對與客戶分級跟進看板",
  "帶看排程、回饋記錄與依熱度排序的跟進提醒",
  "議價核價、訂簽開進度與貸款交屋追蹤",
  "個人與案場業績目標達成率與獎金試算"
];
var FLOORS=["14F","13F","12F","11F","10F","9F","8F","7F","6F","5F"];
var COLS=["A","B","C","D","E","F"];
var UNITS=[
 ["a","h","a","b","s","a"],["s","a","b","a","a","h"],["a","s","a","h","b","a"],
 ["b","a","s","a","a","s"],["s","b","a","a","h","a"],["a","a","h","s","a","b"],
 ["s","a","b","a","s","a"],["a","s","a","b","a","h"],["b","a","a","s","h","a"],
 ["s","a","b","a","a","s"]
];
