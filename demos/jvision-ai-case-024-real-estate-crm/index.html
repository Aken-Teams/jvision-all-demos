<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>建案銷售追客艙 · Real-Estate Sales CRM</title>
<meta name="description" content="從來客登記、戶別銷控到議價成交與交屋的建案銷售 CRM（純 UI 展示）。"/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --navy:#1e3a8a; --navy-d:#152a63; --gold:#b8860b; --gold-l:#d9a83a;
  --ink:#111827; --body:#374151; --mut:#6b7280; --line:#e5e7eb; --bg:#f4f5f8; --card:#fff;
  --sold:#dc2626; --book:#d97706; --hold:#7c3aed; --avail:#16a34a;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--body);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;font-size:20px;vertical-align:middle;line-height:1}

/* top nav (light, premium) */
.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(30,58,138,.04)}
.topin{max-width:1360px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:12px 24px;flex-wrap:wrap;min-width:0}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--navy),var(--navy-d));display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 6px 16px rgba(30,58,138,.28);position:relative;overflow:hidden}
.logo::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 55%,rgba(184,134,11,.55) 100%)}
.logo .material-symbols-outlined{font-size:24px;position:relative;z-index:1}
.brand b{font-size:16px;font-weight:900;color:var(--ink);display:block;font-family:"Noto Sans TC"}
.brand span{font-size:11px;color:var(--gold);letter-spacing:2px;font-weight:700}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap;min-width:0}
.nav button{border:0;background:transparent;color:var(--mut);font:inherit;font-weight:700;font-size:13px;padding:9px 13px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:19px}
.nav button:hover{background:#eef1f8;color:var(--navy)}
.nav button.on{background:linear-gradient(135deg,var(--navy),var(--navy-d));color:#fff;box-shadow:0 5px 14px rgba(30,58,138,.32)}
.nav button.on .material-symbols-outlined{color:var(--gold-l)}
.who{display:flex;align-items:center;gap:9px;padding-left:8px;border-left:1px solid var(--line);flex:none}
.ava{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-l));color:#fff;font-weight:900;display:grid;place-items:center;font-size:14px}
.who small{font-size:11px;color:var(--mut);display:block}
.who b{font-size:12.5px;color:var(--ink)}

.wrap{max-width:1360px;margin:0 auto;padding:22px 24px 48px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.ph h1{margin:0;font-size:22px;font-family:"Noto Sans TC";font-weight:900;color:var(--ink);display:flex;align-items:center;gap:10px}
.ph h1 .bar{width:5px;height:24px;border-radius:3px;background:linear-gradient(180deg,var(--navy),var(--gold))}
.ph p{margin:5px 0 0 15px;color:var(--mut);font-size:13px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:#eef1f8;color:var(--navy);padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:5px}
.pill.gold{background:#fbf3e0;color:var(--gold)}
.pill .material-symbols-outlined{font-size:16px}

.view{display:none}
.view.on{display:block;animation:f .28s ease}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--navy),var(--gold))}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:66px;height:66px;border-radius:50%;background:radial-gradient(circle,rgba(184,134,11,.12),transparent 70%)}
.kpi .l{font-size:12px;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:6px}
.kpi .l .material-symbols-outlined{font-size:17px;color:var(--navy)}
.kpi .v{font-size:27px;font-weight:900;margin-top:6px;color:var(--ink);font-family:Inter}
.kpi .v small{font-size:13px;color:var(--mut);font-weight:700}
.kpi .d{font-size:11.5px;font-weight:800;margin-top:3px}
.up{color:var(--ok)}.dn{color:var(--bad)}

.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:1.5fr 1fr}
.g11{grid-template-columns:1fr 1fr}
.g21{grid-template-columns:1.35fr 1fr}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px 18px;min-width:0}
.card h3{margin:0 0 14px;font-size:14.5px;font-family:"Noto Sans TC";font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--navy);font-size:20px}
.card h3 .grow{margin-left:auto;font-size:12px;font-weight:800;color:var(--gold);cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px;border-radius:10px;border:0;background:var(--navy);color:#fff;font:inherit;font-weight:800;font-size:13px;cursor:pointer;font-family:"Noto Sans TC"}
.btn .material-symbols-outlined{font-size:18px}

.chart{width:100%;height:270px}

/* legend */
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--body)}
.leg span{display:inline-flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;border-radius:4px;display:inline-block}
.d-sold{background:var(--sold)}.d-book{background:var(--book)}.d-hold{background:var(--hold)}.d-avail{background:var(--avail)}

/* ===== signature 1: 戶別銷控表 ===== */
.gridwrap{overflow-x:auto;padding-bottom:4px}
.unitgrid{border-collapse:separate;border-spacing:6px;min-width:640px}
.unitgrid th{font-size:11px;font-weight:800;color:var(--mut);padding:2px 4px;text-align:center;white-space:nowrap}
.unitgrid th.fl{text-align:right;padding-right:8px;color:var(--navy)}
.floorlab{font-size:13px;font-weight:900;color:var(--navy);text-align:right;padding-right:8px;white-space:nowrap}
.unit{width:88px;height:60px;border-radius:11px;padding:7px 8px;color:#fff;position:relative;cursor:pointer;transition:.15s;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.unit:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.16)}
.unit .u-no{font-size:12px;font-weight:900}
.unit .u-price{font-size:11px;font-weight:700;position:absolute;bottom:6px;left:8px;opacity:.95}
.unit .u-sz{font-size:9.5px;position:absolute;top:8px;right:8px;opacity:.85}
.u-sold{background:linear-gradient(135deg,#dc2626,#b91c1c)}
.u-book{background:linear-gradient(135deg,#ea9412,#d97706)}
.u-hold{background:linear-gradient(135deg,#8b5cf6,#7c3aed)}
.u-avail{background:linear-gradient(135deg,#16a34a,#15803d)}

/* ===== signature 2: pipeline ===== */
.pipe{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:12px;overflow-x:auto;padding-bottom:4px}
.pcol{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:11px;min-width:0}
.pch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.pch b{color:var(--ink);font-size:13px;font-family:"Noto Sans TC"}
.pch .sum{font-size:11px;font-weight:800;color:var(--navy);background:#e6ebf7;border-radius:999px;padding:2px 9px}
.lead{background:#fff;border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:11px;padding:11px 12px;margin-bottom:9px;box-shadow:0 1px 3px rgba(17,24,39,.05);cursor:pointer;transition:.15s}
.lead:hover{transform:translateX(3px);box-shadow:0 5px 14px rgba(17,24,39,.1)}
.lead .lt{display:flex;align-items:center;justify-content:space-between;gap:6px}
.lead b{color:var(--ink);font-size:13px;font-family:"Noto Sans TC"}
.lead .need{color:var(--gold);font-weight:900;font-size:12.5px;margin:5px 0 2px}
.lead small{color:var(--mut);font-size:11px;display:block}
.lead .lf{display:flex;align-items:center;gap:6px;margin-top:7px}
.av2{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--navy-d));color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;flex:none}
.lf small{color:var(--mut);font-size:11px}
.heat{font-size:10px;font-weight:800;border-radius:6px;padding:1px 7px;white-space:nowrap}
.h-hot{background:#fee2e2;color:#dc2626}.h-warm{background:#fef3c7;color:#b45309}.h-cold{background:#e0e7ff;color:#4338ca}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--mut);font-weight:800;padding:11px 12px;border-bottom:2px solid var(--line);background:var(--bg);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:hover td{background:#f8f9fc}
.tblwrap{overflow-x:auto}
.tag{font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px;white-space:nowrap}
.t-ok{background:#dcfce7;color:#166534}.t-wait{background:#fef3c7;color:#92400e}.t-rej{background:#fee2e2;color:#991b1b}.t-info{background:#e0e7ff;color:#3730a3}

/* visit rows */
.visit{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.visit:first-of-type{border-top:0}
.vtime{width:58px;flex:none;text-align:center}
.vtime b{display:block;font-size:15px;color:var(--navy);font-weight:900;font-family:Inter}
.vtime small{font-size:10.5px;color:var(--mut)}
.vmid{flex:1;min-width:0}
.vmid b{font-size:13.5px;color:var(--ink);font-family:"Noto Sans TC"}
.vmid small{display:block;color:var(--mut);font-size:11.5px}
.prog{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:6px}
.prog span{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--gold))}

/* stat chips */
.cstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.cs{background:var(--bg);border-radius:12px;padding:13px;text-align:center;border:1px solid var(--line)}
.cs b{display:block;font-size:20px;color:var(--ink);font-weight:900;font-family:Inter}
.cs span{font-size:11px;color:var(--mut)}
.cs.gold b{color:var(--gold)}

/* timeline */
.tl-i{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.tl-i:first-of-type{border-top:0}
.tl-ic{width:32px;height:32px;border-radius:9px;background:#eef1f8;color:var(--navy);display:grid;place-items:center;flex:none}
.tl-ic .material-symbols-outlined{font-size:18px}
.tl-i b{color:var(--ink);font-size:13px;font-family:"Noto Sans TC"}
.tl-i small{display:block;color:var(--mut);font-size:12px}
.tl-i .when{margin-left:auto;font-size:11px;color:#9aa1ad;white-space:nowrap}

/* alert cards */
.alert{border-radius:14px;padding:15px 16px;border:1px solid}
.alert h4{margin:0 0 6px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px}
.alert p{margin:0;font-size:12.5px;line-height:1.6}
.a-red{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
.a-amber{background:#fffbeb;border-color:#fde68a;color:#b45309}
.a-navy{background:#eef2ff;border-color:#c7d2fe;color:#3730a3}

/* AI */
.ai-row{display:flex;gap:11px;background:linear-gradient(135deg,#eef2ff,#faf5e9);border:1px solid #e3e8f5;border-radius:13px;padding:12px 13px;margin-bottom:10px}
.ai-ic{width:32px;height:32px;border-radius:9px;background:var(--navy);color:#fff;display:grid;place-items:center;flex:none}
.ai-ic.g{background:var(--gold)}
.ai-row p{margin:0;font-size:13px;color:var(--body);line-height:1.55}
.ai-row b{color:var(--ink)}

/* target rows */
.trow{display:grid;grid-template-columns:110px 1fr 120px;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.trow .nm{font-size:13px;font-weight:800;color:var(--ink);font-family:"Noto Sans TC"}
.trow .nm small{display:block;color:var(--mut);font-weight:600;font-size:11px}
.tbar{height:12px;border-radius:999px;background:var(--line);overflow:hidden;position:relative}
.tbar span{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--gold))}
.trow .pct{text-align:right;font-size:14px;font-weight:900;color:var(--navy);font-family:Inter}
.trow .pct small{display:block;font-size:11px;color:var(--mut);font-weight:600}

@media (max-width:900px){
  .kpis{grid-template-columns:1fr 1fr}
  .g2,.g11,.g21{grid-template-columns:1fr !important}
}
@media (max-width:560px){
  .topin{padding:10px 14px}
  .wrap{padding:16px 14px 34px}
  .kpis{grid-template-columns:1fr 1fr}
  .who small{display:none}
  .trow{grid-template-columns:88px 1fr 78px}
}
</style>
</head>

  <div class="topin">
    <div class="brand">
      <span class="logo"><span class="material-symbols-outlined">apartment</span></span>
      <div><b>建案銷售追客艙</b><span>ESTATE SALES CRM</span></div>

    <nav class="nav" id="nav"></nav>

<main class="wrap" id="views"></main>

<script>

  ["space_dashboard","銷售總覽"],

  ["王美玲","1,180","對保排程","審核中","待對保","wait"]
];

var TARGETS=[
  ["王詩涵","資深銷售",4,3,"1,320"],

/* ===================== HELPERS ===================== */
function av(n){return '<span class="av2">'+n.slice(-1)+'</span>';}

function kpiRow(list){
  return '<div class="kpis">'+list.map(function(k){
    return '<div class="kpi"><div class="l"><span class="material-symbols-outlined">'+k[4]+'</span>'+k[0]+'</div>'
      +'<div class="v">'+k[1]+'<small> '+k[2]+'</small></div>'
      +'<div class="d '+(k[3].charAt(0)==='-'?'dn':'up')+'">'+k[3]+'</div></div>';
  }).join('')+'</div>';
}

function unitGrid(){
  var thead='<tr><th class="fl">樓層</th>'+COLS.map(function(c){return '<th>'+c+' 戶</th>';}).join('')+'</tr>';
  var rows=UNITS.map(function(row,fi){
    var tds=row.map(function(st,ci){
      var pr=priceOf(fi,ci), sz=(SIZES[ci]+(fi%2?0.3:0)).toFixed(1);
      return '<td><div class="unit u-'+({s:'sold',b:'book',h:'hold',a:'avail'})[st]+'" title="'+FLOORS[fi]+'-'+COLS[ci]+' · '+SLABEL[st]+' · '+sz+'坪 · '+pr+'萬">'
        +'<div class="u-no">'+FLOORS[fi].replace('F','')+COLS[ci]+'</div>'
        +'<div class="u-sz">'+sz+'坪</div>'
        +'<div class="u-price">'+(st==='s'?'售出':pr+'萬')+'</div></div></td>';
    }).join('');
    return '<tr><td class="floorlab">'+FLOORS[fi]+'</td>'+tds+'</tr>';
  }).join('');
  return '<div class="gridwrap"><table class="unitgrid"><thead>'+thead+'</thead><tbody>'+rows+'</tbody></table></div>';
}

function pipeline(){
  return '<div class="pipe">'+STAGES.map(function(s){
    var it=LEADS.filter(function(d){return d[2]===s;});
    return '<div class="pcol"><div class="pch"><b>'+s+' · '+it.length+'</b><span class="sum">'+it.length+' 組</span></div>'
      +it.map(function(d){
        return '<div class="lead"><div class="lt"><b>'+d[0]+'</b><span class="heat h-'+d[4]+'">'+HEAT[d[4]]+'</span></div>'
          +'<div class="need">'+d[1]+'</div><small>'+d[5]+'</small>'
          +'<div class="lf">'+av(d[3])+'<small>'+d[3]+'</small></div></div>';
      }).join('')+'</div>';
  }).join('')+'</div>';
}

function legend(){
  return '<div class="leg">'
    +'<span><i class="dot d-sold"></i>已售</span>'
    +'<span><i class="dot d-book"></i>已訂</span>'

function initChart(id){var el=document.getElementById(id);if(!el)return null;var c=echarts.init(el);charts.push(c);return c;}

function draw(i){
  charts.forEach(function(c){try{c.dispose();}catch(e){}});charts=[];
  if(!window.echarts)return;

  if(i===0){
    var c=initChart('cTrend');
    if(c)c.setOption({grid:{left:8,right:16,top:34,bottom:8,containLabel:true},tooltip:{trigger:'axis'},legend:{data:['新來客','帶看','成交'],top:0,textStyle:{color:'#374151'}},
      xAxis:Object.assign({type:'category',data:['第1週','第2週','第3週','第4週','第5週','第6週']},AX),
      yAxis:Object.assign({type:'value'},AX,SL),
      series:[
        {name:'新來客',type:'line',smooth:true,data:[28,34,31,40,43,46],itemStyle:{color:NAVY},lineStyle:{width:3,color:NAVY},areaStyle:{color:'rgba(30,58,138,.10)'}},
        {name:'帶看',type:'line',smooth:true,data:[16,21,19,25,27,30],itemStyle:{color:GOLDL},lineStyle:{width:3,color:GOLDL}},
        {name:'成交',type:'bar',data:[3,4,3,5,6,7],itemStyle:{color:GOLD,borderRadius:[5,5,0,0]},barWidth:14}
      ]});
    var d=initChart('cDona');
    if(d)d.setOption({tooltip:{trigger:'item',formatter:'{b}: {c} 戶 ({d}%)'},
      series:[{type:'pie',radius:['48%','74%'],center:['50%','48%'],itemStyle:{borderColor:'#fff',borderWidth:2},label:{show:false},
        data:[{name:'已售',value:20,itemStyle:{color:'#dc2626'}},{name:'已訂',value:9,itemStyle:{color:'#d97706'}},{name:'保留',value:8,itemStyle:{color:'#7c3aed'}},{name:'待售',value:23,itemStyle:{color:'#16a34a'}}]}]});
    var r=initChart('cRank');
    if(r)r.setOption({grid:{left:8,right:20,top:12,bottom:8,containLabel:true},tooltip:{trigger:'axis'},
      xAxis:Object.assign({type:'value'},AX,SL),
      yAxis:Object.assign({type:'category',data:['陳映辰','李孟哲','王詩涵']},AX),
      series:[{type:'bar',data:[1010,940,1320],barWidth:18,itemStyle:{color:function(p){return[NAVY,GOLDL,GOLD][p.dataIndex];},borderRadius:[0,6,6,0]},label:{show:true,position:'right',formatter:'{c}萬',color:'#374151',fontWeight:700}}]});
  }
  if(i===2){
    var s=initChart('cSrc');
    if(s)s.setOption({tooltip:{trigger:'item',formatter:'{b}: {c} 組 ({d}%)'},legend:{bottom:0,textStyle:{fontSize:11,color:'#374151'}},
      series:[{type:'pie',radius:['42%','70%'],center:['50%','44%'],itemStyle:{borderColor:'#fff',borderWidth:2},label:{show:false},
        data:[{name:'網路預約',value:38,itemStyle:{color:NAVY}},{name:'代銷名單',value:22,itemStyle:{color:GOLD}},{name:'舊客轉介',value:18,itemStyle:{color:GOLDL}},{name:'路過來客',value:14,itemStyle:{color:'#60a5fa'}},{name:'廣告來電',value:8,itemStyle:{color:'#a5b4fc'}}]}]});
  }
  if(i===3){
    var v=initChart('cVisit');
    if(v)v.setOption({grid:{left:8,right:16,top:34,bottom:8,containLabel:true},tooltip:{trigger:'axis'},legend:{data:['帶看場次','成交'],top:0,textStyle:{color:'#374151'}},
      xAxis:Object.assign({type:'category',data:['一','二','三','四','五','六','日']},AX),
      yAxis:Object.assign({type:'value'},AX,SL),
      series:[
        {name:'帶看場次',type:'bar',data:[5,7,6,8,9,12,10],itemStyle:{color:NAVY,borderRadius:[5,5,0,0]},barWidth:16},
        {name:'成交',type:'line',smooth:true,data:[1,1,2,1,2,3,2],itemStyle:{color:GOLD},lineStyle:{width:3,color:GOLD}}
      ]});
  }
  if(i===5){
    var g=initChart('cGoal');
    if(g)g.setOption({grid:{left:8,right:16,top:34,bottom:8,containLabel:true},tooltip:{trigger:'axis'},legend:{data:['目標戶','實際成交'],top:0,textStyle:{color:'#374151'}},
      xAxis:Object.assign({type:'category',data:['3月','4月','5月','6月','7月','8月']},AX),
      yAxis:Object.assign({type:'value'},AX,SL),
      series:[
        {name:'目標戶',type:'bar',data:[10,10,11,11,12,12],itemStyle:{color:'#c7d2fe',borderRadius:[5,5,0,0]},barWidth:16},
        {name:'實際成交',type:'bar',data:[8,9,10,11,9,7],itemStyle:{color:GOLD,borderRadius:[5,5,0,0]},barWidth:16}
      ]});
  }
}

/* ===================== RENDER ===================== */
var nav=document.getElementById('nav'), views=document.getElementById('views');
nav.innerHTML=NAV.map(function(m,i){return '<button data-i="'+i+'" class="'+(i===0?'on':'')+'"><span class="material-symbols-outlined">'+m[0]+'</span>'+m[1]+'</button>';}).join('');

views.innerHTML=NAV.map(function(m,i){
  return '<section class="view'+(i===0?' on':'')+'" data-view="'+i+'">'
    +'<div class="ph"><div><h1><span class="bar"></span>'+NAMES[i]+'</h1><p>'+DESC[i]+'</p></div>'
    +'<div class="pills"><span class="pill"><span class="material-symbols-outlined">apartment</span>富硯・沐光 B棟</span><span class="pill gold"><span class="material-symbols-outlined">calendar_month</span>2026/08/13</span></div></div>'
    +'<div class="vbody"></div></section>';
}).join('');
var vbodies=views.querySelectorAll('.vbody');
var built=[];

function show(i){
  nav.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',+b.dataset.i===i);});
  views.querySelectorAll('.view').forEach(function(v){v.classList.toggle('on',+v.dataset.view===i);});
  if(!built[i]){ vbodies[i].innerHTML=SCREENS[i](); built[i]=true; }
  draw(i);
}
nav.addEventListener('click',function(e){var b=e.target.closest('button[data-i]');if(b)show(+b.dataset.i);});
window.addEventListener('resize',function(){charts.forEach(function(c){try{c.resize();}catch(e){}});});
show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
