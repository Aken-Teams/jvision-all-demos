<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>經營計畫管理系統｜純 UI 展示</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Sans+TC:wght@400;500;600;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --accent:#0D9488;
  --accent2:#2DD4BF;
  --bg:#F0FDFA;
  --card:#FFFFFF;
  --soft:#CCFBF1;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#0369A1;
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:14px;
  --font-display:"Cormorant Garamond","Noto Sans TC",serif;
  --font-body:"Crimson Pro","Noto Sans TC",serif;
  --font-code:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
html,body{margin:0;padding:0;min-height:100%;}
body{
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.55;
  color:var(--color-foreground);
  background:var(--color-background);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,a,[data-i]{cursor:pointer;}
a{color:inherit;text-decoration:none;}
button,input,select,textarea{font:inherit;}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.msy{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
.topbar{
  position:sticky;
  top:0;
  z-index:50;
  color:#042F2E;
  background:var(--color-secondary);
  border-bottom:3px solid var(--color-foreground);
}
.topbar-inner{
  max-width:1440px;
  min-height:72px;
  margin:0 auto;
  padding:10px 24px;
  display:flex;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0;}
.brand .logo{
  width:44px;
  height:44px;
  flex:0 0 44px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#FFFFFF;
  background:var(--color-foreground);
  border:2px solid var(--color-foreground);
  border-radius:var(--radius-sm);
}
.brand .logo .msy{font-size:25px;}
.brand .tt{min-width:0;}
.brand .tt b{
  display:block;
  font-family:var(--font-display);
  font-size:20px;
  font-weight:700;
  line-height:1.1;
  letter-spacing:.02em;
  white-space:nowrap;
}
.brand .tt span{
  display:block;
  margin-top:3px;
  font-family:"Cinzel",var(--font-body);
  font-size:9px;
  font-weight:600;
  letter-spacing:.08em;
  color:#134E4A;
}
.nav{
  display:flex;
  gap:5px;
  min-width:0;
  margin-left:auto;
  padding:4px;
  flex-wrap:wrap;
  background:rgba(255,255,255,.55);
  border:1px solid #0F766E;
  border-radius:var(--radius-md);
}
.nav button{
  min-height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:8px 12px;
  color:#134E4A;
  background:transparent;
  border:1px solid transparent;
  border-radius:var(--radius-sm);
  font-family:"Noto Sans TC",var(--font-body);
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
  transition:background-color 180ms ease,color 180ms ease,border-color 180ms ease;
}
.nav button .msy{font-size:18px;}
.nav button:hover{background:#FFFFFF;border-color:#0F766E;}
.nav button.active{
  color:#FFFFFF;
  background:var(--color-foreground);
  border-color:var(--color-foreground);
}
.wrap{max-width:1440px;margin:0 auto;padding:32px 24px 64px;}
#app{animation:screen-enter 350ms ease both;}
.screen-head{
  position:relative;
  display:grid;
  grid-template-columns:auto auto 1fr;
  align-items:end;
  gap:8px 14px;
  margin-bottom:22px;
  padding:0 0 16px 18px;
  border-bottom:1px solid var(--color-border);
}
.screen-head::before{
  content:"";
  position:absolute;
  left:0;
  top:4px;
  bottom:16px;
  width:5px;
  background:var(--color-accent);
}
.screen-head h1{
  margin:0;
  font-family:var(--font-display);
  font-size:clamp(26px,2.6vw,36px);
  font-weight:700;
  line-height:1;
  letter-spacing:.01em;
  color:#134E4A;
}
.screen-head .sub{
  align-self:center;
  color:var(--color-muted-foreground);
  font-family:"Noto Sans TC",var(--font-body);
  font-size:13px;
}
.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  width:max-content;
  min-height:28px;
  padding:3px 9px;
  color:#134E4A;
  background:#CCFBF1;
  border:1px solid #0F766E;
  border-radius:999px;
  font-family:"Cinzel",var(--font-body);
  font-size:10px;
  font-weight:600;
  letter-spacing:.05em;
}
.pill .msy{font-size:15px;}
.card{
  min-width:0;
  padding:20px;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:var(--radius-md);
  transition:border-color 180ms ease,background-color 180ms ease,transform 180ms ease;
}
.card:hover{border-color:var(--color-primary);}
.card h3{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0 0 16px;
  padding-bottom:10px;
  border-bottom:1px solid var(--color-muted);
  font-family:var(--font-display);
  font-size:19px;
  font-weight:700;
  line-height:1.2;
  color:#134E4A;
}
.card h3 .msy{font-size:20px;color:var(--color-primary);}
.muted{color:var(--color-muted-foreground);}
.grid{display:grid;gap:16px;min-width:0;}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g23{grid-template-columns:minmax(0,2fr) minmax(280px,1fr);}
.g32{grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr);}
.kpi{
  position:relative;
  overflow:hidden;
  min-height:148px;
  border-top:5px solid var(--color-primary);
}
.kpi:nth-child(4n+2){border-top-color:var(--color-secondary);}
.kpi:nth-child(4n+3){border-top-color:var(--color-accent);}
.kpi:nth-child(4n+4){border-top-color:var(--color-foreground);}
.kpi .lbl{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--color-muted-foreground);
  font-family:"Noto Sans TC",var(--font-body);
  font-size:12px;
  font-weight:700;
}
.kpi .val{
  position:relative;
  z-index:1;
  margin:8px 0 5px;
  color:#134E4A;
  font-family:var(--font-code);
  font-size:30px;
  font-weight:800;
  line-height:1.1;
  letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;
}
.kpi .val small{font-family:"Noto Sans TC",sans-serif;font-size:13px;font-weight:700;color:var(--color-muted-foreground);}
.kpi .dt{position:relative;z-index:1;font-size:12px;font-weight:700;}
.kpi .dt.up{color:#166534;}
.kpi .dt.down{color:#B91C1C;}
.kpi .msy.bg{
  position:absolute;
  right:10px;
  bottom:8px;
  z-index:0;
  font-size:62px;
  color:#99F6E4;
  opacity:.48;
}
.tscroll{overflow-x:auto;border:1px solid var(--color-border);border-radius:var(--radius-sm);}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:13px;}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid #CDEAE6;white-space:nowrap;}
th{
  position:sticky;
  top:0;
  z-index:1;
  color:#134E4A;
  background:#CCFBF1;
  font-family:"Noto Sans TC",var(--font-body);
  font-size:11px;
  font-weight:800;
  letter-spacing:.04em;
}
tbody tr{transition:background-color 160ms ease;}
tbody tr:hover{background:#F0FDFA;}
tbody tr:last-child td{border-bottom:0;}
td:first-child,td:last-child{
  font-family:var(--font-code);
  font-variant-numeric:tabular-nums;
}
td:last-child{text-align:right;}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:3px 9px;
  border:1px solid currentColor;
  border-radius:999px;
  font-family:"Noto Sans TC",var(--font-body);
  font-size:11px;
  font-weight:800;
  line-height:1.45;
  white-space:nowrap;
}
.t-ok{color:#166534;background:#DCFCE7;}
.t-warn{color:#92400E;background:#FEF3C7;}
.t-bad{color:#991B1B;background:#FEE2E2;}
.t-info{color:#075985;background:#E0F2FE;}
.t-grey{color:#334155;background:#E2E8F0;}
.t-cyan{color:#115E59;background:#CCFBF1;}
.bar{height:8px;overflow:hidden;background:#D5E7E8;border:1px solid #99D8D2;border-radius:2px;}
.bar>i{display:block;height:100%;background:var(--color-primary);border-radius:0;}
.chartbox{position:relative;width:100%;overflow:hidden;}
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;min-width:0;}
.col{min-width:0;padding:12px;background:#F3FAF9;border:1px solid var(--color-border);border-radius:var(--radius-md);}
.col-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;font-size:13px;font-weight:800;}
.col-h .cnt{
  min-width:28px;
  padding:2px 8px;
  color:var(--color-muted-foreground);
  background:#FFFFFF;
  border:1px solid var(--color-border);
  border-radius:999px;
  font-family:var(--font-code);
  font-size:12px;
  text-align:center;
}
.ticket{
  margin-bottom:10px;
  padding:12px;
  background:#FFFFFF;
  border:1px solid #99D8D2;
  border-left:4px solid var(--color-primary);
  border-radius:var(--radius-sm);
  transition:border-color 180ms ease,background-color 180ms ease,transform 180ms ease;
}
.ticket:hover{background:#F0FDFA;border-color:var(--color-primary);transform:translateY(-2px);}
.ticket .tk-t{margin-bottom:7px;font-family:"Noto Sans TC",var(--font-body);font-size:13px;font-weight:700;}
.ticket .tk-m{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--color-muted-foreground);font-size:11.5px;flex-wrap:wrap;}
.ava{
  width:24px;
  height:24px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  color:#FFFFFF;
  background:var(--color-foreground);
  border-radius:50%;
  font-family:"Noto Sans TC",sans-serif;
  font-size:10px;
  font-weight:800;
}
.tl{position:relative;padding-left:26px;}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--color-secondary);}
.tl .ev{position:relative;margin-bottom:18px;}
.tl .ev .dot{position:absolute;left:-24px;top:3px;width:14px;height:14px;background:#FFFFFF;border:3px solid var(--color-primary);border-radius:50%;}
.tl .ev .tm{color:var(--color-muted-foreground);font-family:var(--font-code);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;}
.tl .ev .ti{margin:2px 0;font-size:13.5px;font-weight:800;}
.tl .ev .de{color:var(--color-muted-foreground);font-size:12.5px;}
.okr-node{margin-bottom:10px;padding:13px 14px;background:#FFFFFF;border:1px solid #99D8D2;border-radius:var(--radius-sm);}
.okr-node.dept{margin-left:20px;background:#F0FDFA;border-left:5px solid var(--color-secondary);}
.okr-node .on-t{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:"Noto Sans TC",var(--font-body);font-size:13px;font-weight:800;}
.okr-node .on-m{display:flex;gap:16px;margin-top:6px;color:var(--color-muted-foreground);font-size:12px;flex-wrap:wrap;}
.okr-node .on-m span:last-child{font-family:var(--font-code);font-variant-numeric:tabular-nums;}
.milestone{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed #99D8D2;}
.milestone .ms-ic{width:32px;height:32px;display:flex;align-items:center;justify-content:center;flex:0 0 32px;color:#115E59;background:#CCFBF1;border:1px solid #5EEAD4;border-radius:var(--radius-sm);}
.milestone .ms-ic .msy{font-size:18px;}
.scoretile{border-top:5px solid var(--color-accent);text-align:center;}
.ring{--p:0;width:108px;height:108px;margin:0 auto;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--color-primary) calc(var(--p)*1%),#D5E7E8 0);border-radius:50%;}
.ring .inner{width:78px;height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#FFFFFF;border:1px solid var(--color-border);border-radius:50%;}
.ring .inner b{font-family:var(--font-code);font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;}
.ring .inner span{color:var(--color-muted-foreground);font-size:10px;}
.insight{display:flex;gap:12px;margin-bottom:11px;padding:13px;background:#FFFFFF;border:1px solid #99D8D2;border-radius:var(--radius-sm);}
.insight .ii{width:38px;height:38px;display:flex;align-items:center;justify-content:center;flex:0 0 38px;border-radius:var(--radius-sm);}
.insight .it{margin-bottom:3px;font-family:"Noto Sans TC",var(--font-body);font-size:13px;font-weight:800;}
.insight .id{color:var(--color-muted-foreground);font-size:12.5px;}
.list-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #CDEAE6;}
.list-row:last-child{border-bottom:0;}
.list-row .lr-main{flex:1;min-width:0;}
.list-row .lr-t{font-family:"Noto Sans TC",var(--font-body);font-size:13px;font-weight:700;}
.list-row .lr-s{color:var(--color-muted-foreground);font-size:12px;}
.foot{max-width:1440px;margin:0 auto;padding:20px 24px 40px;color:var(--color-muted-foreground);font-size:12px;text-align:center;}
@keyframes screen-enter{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:1100px){
  .topbar-inner{align-items:flex-start;}
  .nav{width:100%;margin-left:0;overflow-x:auto;flex-wrap:nowrap;justify-content:flex-start;scrollbar-width:thin;}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));}
  .g23,.g32{grid-template-columns:minmax(0,1fr);}
}
@media(max-width:768px){
  .wrap{padding:24px 16px 52px;}
  .topbar-inner{padding:10px 16px;}
  .g3,.g2{grid-template-columns:1fr;}
  .board{grid-template-columns:repeat(4,minmax(245px,1fr));min-width:1020px;}
  .screen-head{grid-template-columns:1fr auto;align-items:center;}
  .screen-head .sub{grid-column:1/-1;}
  .card{padding:16px;}
}
@media(max-width:480px){
  .topbar-inner{gap:10px;}
  .brand .logo{width:40px;height:40px;flex-basis:40px;}
  .brand .tt b{font-size:17px;}
  .brand .tt span{display:none;}
  .nav button{min-width:44px;padding:9px 11px;}
  .nav button .txt{display:none;}
  .g4{grid-template-columns:1fr;}
  .kpi{min-height:132px;}
  .screen-head h1{font-size:27px;}
  .screen-head .sub{font-size:12px;}
  .okr-node.dept{margin-left:10px;}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important;}
  #app{animation:none;}
  .ticket:hover{transform:none;}
}
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="logo"><span class="msy">account_tree</span></div>
        <div class="tt"><b>經營計畫管理系統</b><span>Business Plan Management ｜ 純 UI 展示</span></div>
      </div>
      <nav class="nav" id="nav"></nav>
    </div>
  </header>

  <main class="wrap"><div id="app"></div></main>
  <div class="foot">本頁為純 UI 系統展示（無後端），畫面與資料皆為擬真示範。｜ /demos/jvision-smart-mfg-296-system-296/</div>

<script>
(function(){
  "use strict";

  var NAV=[
    {i:0,ic:"account_tree",t:"目標展開分解"},
    {i:1,ic:"checklist",t:"行動方案規劃"},
    {i:2,ic:"task_alt",t:"任務分派看板"},
    {i:3,ic:"monitoring",t:"執行進度儀表板"},
    {i:4,ic:"groups",t:"定期檢討會議"},
    {i:5,ic:"history",t:"計畫修正稽核"}
  ];

  var chartRegistry={};
  function destroyCharts(){
    for(var k in chartRegistry){ if(chartRegistry[k]){try{chartRegistry[k].destroy();}catch(e){} chartRegistry[k]=null;} }
    chartRegistry={};
  }
  function mkChart(id,cfg){
    var el=document.getElementById(id);
    if(!el) return;
    if(chartRegistry[id]){try{chartRegistry[id].destroy();}catch(e){}}
    chartRegistry[id]=new Chart(el.getContext("2d"),cfg);
  }
  var GRID={color:"#eef2f6"};
  var FONT={family:"'Inter','Noto Sans TC',sans-serif"};

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function bar(p){return '<div class="bar"><i style="width:'+Math.max(0,Math.min(100,p))+'%"></i></div>';}
  function tag(cls,txt){return '<span class="tag '+cls+'">'+esc(txt)+'</span>';}

  // ---------- SCREEN 0 : 目標展開分解 ----------
  function s0(){
    var kpis=[
      {l:"年度營收目標",v:"48.6",u:"億",dt:"+8.4% YoY",up:1,ic:"trending_up"},
      {l:"已展開部門目標",v:"32",u:"項",dt:"覆蓋 6 事業處",up:1,ic:"account_tree"},
      {l:"目標達成率",v:"71",u:"%",dt:"+5.2pt",up:1,ic:"insights"},
      {l:"未對齊指標",v:"4",u:"項",dt:"需複核",up:0,ic:"rule"}
    ];
    var okr=[
      {lv:"corp",t:"2026 年度｜營收成長 8%、營業利益率 12%",owner:"總經理室",dl:"2026 全年",p:71},
      {lv:"dept",t:"業務事業處｜新客戶營收 +6 億",owner:"業務處 王經理",dl:"Q4",p:64},
      {lv:"dept",t:"生產事業處｜單位成本 -4.5%",owner:"生產處 林經理",dl:"Q3",p:78},
      {lv:"dept",t:"研發中心｜新品上市 5 案",owner:"研發 陳副理",dl:"Q4",p:52},
      {lv:"dept",t:"營運支援處｜人均產值 +7%",owner:"營運 黃經理",dl:"Q4",p:69}
    ];
    var html=''

     + act.map(function(a){return '<div class="list-row"><div class="lr-main"><div class="lr-t">'+esc(a.t)+'</div><div class="lr-s">'+esc(a.own)+' ｜ 期限 '+esc(a.dl)+'</div></div>'+tag(a.cls,a.st)+'</div>';}).join('')

    return {html:html,init:function(){
      mkChart("c4a",{type:"doughnut",data:{labels:["已結案","進行中","待啟動","逾期"],datasets:[{data:[17,4,1,1],backgroundColor:["#16a34a","#0891b2","#94a3b8","#dc2626"],borderWidth:2,borderColor:"#fff"}]},options:{responsive:true,maintainAspectRatio:false,cutout:"58%",plugins:{legend:{position:"right",labels:{font:FONT,boxWidth:12,padding:8}}}}});
    }};
  }

     +'  <div class="card kpi"><span class="msy bg">rule</span><div class="lbl">決策規則</div><div class="val">3 <small>條</small></div><div class="dt up">已套用</div></div>'
     +'  <div class="card kpi"><span class="msy bg">verified</span><div class="lbl">稽核合規率</div><div class="val">98 <small>%</small></div><div class="dt up">▲ +2pt</div></div>'
     +'</div>'

     +'    <div class="tscroll"><table><thead><tr><th>版本</th><th>修正內容</th><th>類型</th><th>修改人</th><th>時間</th></tr></thead><tbody>'
     + logs.map(function(l){return '<tr><td><b>'+esc(l.ver)+'</b></td><td>'+esc(l.t)+'</td><td>'+tag(l.cls,l.ty)+'</td><td>'+esc(l.who)+'</td><td class="muted">'+esc(l.tm)+'</td></tr>';}).join('')
     +'    </tbody></table></div>'
     +'    <h3 style="margin-top:18px"><span class="msy">gavel</span>決策規則（套用於檢討與追蹤）</h3>'
     + rules.map(function(r){return '<div class="insight"><div class="ii" style="background:var(--soft);color:#0e7490"><span class="msy">gavel</span></div><div style="min-width:0"><div class="it">'+esc(r.id)+'</div><div class="id">'+esc(r.r)+'</div><div class="id" style="margin-top:3px;color:#0e7490">佐證：'+esc(r.e)+'</div></div></div>';}).join('')
     +'  </div>'
     +'  <div class="card"><h3><span class="msy">insights</span>AI 洞察與異常提示</h3>'
     +'    <div class="insight"><div class="ii" style="background:#fee2e2;color:#dc2626"><span class="msy">warning</span></div><div style="min-width:0"><div class="it">研發中心連兩週偏離目標</div><div class="id">觸發 RULE-02，建議指派改善責任人並展延里程碑。</div></div></div>'
     +'    <div class="insight"><div class="ii" style="background:#fef3c7;color:#b45309"><span class="msy">request_quote</span></div><div style="min-width:0"><div class="it">生產處成本超標之現金流風險</div><div class="id">金額逾 50 萬觸發 RULE-01，已列本月優先追蹤。</div></div></div>'
     +'    <div class="insight"><div class="ii" style="background:#dbeafe;color:#1d4ed8"><span class="msy">trending_up</span></div><div style="min-width:0"><div class="it">業務處達成率領先</div><div class="id">預估提前 3 週達標，可釋出資源支援研發。</div></div></div>'

  var SCREENS=[s0,s1,s2,s3,s4,s5];

  function buildNav(){
    var nav=document.getElementById("nav");
    nav.innerHTML=NAV.map(function(n){return '<button data-i="'+n.i+'"><span class="msy">'+n.ic+'</span><span class="txt">'+n.t+'</span></button>';}).join('');
    var btns=nav.querySelectorAll("[data-i]");
    for(var j=0;j<btns.length;j++){
      btns[j].addEventListener("click",function(){ location.hash="go="+this.getAttribute("data-i"); });
    }
  }

  function show(i){
    destroyCharts();
    var container=document.getElementById("app");
    var built=SCREENS[i]();
    container.innerHTML=built.html;
    var btns=document.querySelectorAll("[data-i]");
    for(var j=0;j<btns.length;j++){ btns[j].classList.toggle("active", +btns[j].getAttribute("data-i")===i); }
    void container.offsetHeight;
    if(built.init){ built.init(); }
  }

  buildNav();

  function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
})();
</script>
