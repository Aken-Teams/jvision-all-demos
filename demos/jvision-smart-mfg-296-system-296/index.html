<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>經營計畫管理系統｜純 UI 展示</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --accent:#0891b2; --accent2:#22d3ee; --ink:#0f172a; --muted:#64748b;
    --bg:#f1f5f9; --card:#ffffff; --line:#e2e8f0; --soft:#ecfeff;
    --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .msy{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
  a{color:inherit;text-decoration:none;}

  .topbar{
    position:sticky;top:0;z-index:50;
    background:linear-gradient(100deg,#083344,#0891b2);
    color:#fff;box-shadow:0 2px 14px rgba(8,51,68,.28);
  }
  .topbar-inner{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#22d3ee,#0e7490);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);}
  .brand .logo .msy{font-size:24px;color:#fff;}
  .brand .tt{min-width:0;}
  .brand .tt b{font-size:16px;font-weight:800;letter-spacing:.4px;display:block;white-space:nowrap;}
  .brand .tt span{font-size:11px;opacity:.82;}
  .nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0;}
  .nav button{
    display:flex;align-items:center;gap:7px;cursor:pointer;
    background:rgba(255,255,255,.08);color:#e0f2fe;border:1px solid rgba(255,255,255,.14);
    padding:8px 13px;border-radius:10px;font-size:13px;font-weight:600;font-family:inherit;
    transition:.15s;white-space:nowrap;
  }
  .nav button .msy{font-size:19px;}
  .nav button:hover{background:rgba(255,255,255,.2);}
  .nav button.active{background:#fff;color:#0e7490;border-color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.18);}

  .wrap{max-width:1360px;margin:0 auto;padding:22px 18px 60px;}
  .screen-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
  .screen-head h1{font-size:22px;margin:0;font-weight:900;letter-spacing:.3px;}
  .screen-head .sub{color:var(--muted);font-size:13px;}
  .pill{display:inline-flex;align-items:center;gap:5px;background:var(--soft);color:#0e7490;border:1px solid #a5f3fc;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700;}
  .pill .msy{font-size:15px;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 1px 3px rgba(15,23,42,.05);min-width:0;}
  .card h3{margin:0 0 14px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;}
  .card h3 .msy{font-size:20px;color:var(--accent);}
  .muted{color:var(--muted);}

  .grid{display:grid;gap:16px;min-width:0;}
  .g4{grid-template-columns:repeat(4,1fr);}
  .g3{grid-template-columns:repeat(3,1fr);}
  .g2{grid-template-columns:repeat(2,1fr);}
  .g23{grid-template-columns:2fr 1fr;}
  .g32{grid-template-columns:1.4fr 1fr;}

  .kpi{position:relative;overflow:hidden;}
  .kpi .lbl{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;}
  .kpi .val{font-size:30px;font-weight:900;letter-spacing:.5px;margin:6px 0 2px;}
  .kpi .val small{font-size:14px;font-weight:700;color:var(--muted);}
  .kpi .dt{font-size:12px;font-weight:700;}
  .kpi .dt.up{color:var(--ok);} .kpi .dt.down{color:var(--bad);}
  .kpi .msy.bg{position:absolute;right:-6px;bottom:-10px;font-size:74px;color:var(--soft);z-index:0;}
  .kpi .lbl,.kpi .val,.kpi .dt{position:relative;z-index:1;}

  table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
  th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;background:#f8fafc;position:sticky;top:0;}
  tbody tr:hover{background:#f8fdff;}
  .tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;}

  .tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;}
  .t-ok{background:#dcfce7;color:#15803d;} .t-warn{background:#fef3c7;color:#b45309;}
  .t-bad{background:#fee2e2;color:#b91c1c;} .t-info{background:#dbeafe;color:#1d4ed8;}
  .t-grey{background:#f1f5f9;color:#475569;} .t-cyan{background:#cffafe;color:#0e7490;}

  .bar{height:8px;border-radius:999px;background:#e2e8f0;overflow:hidden;}
  .bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#0891b2,#22d3ee);}

  .chartbox{position:relative;width:100%;overflow:hidden;}

  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;min-width:0;}
  .col{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0;}
  .col-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:800;font-size:13.5px;}
  .col-h .cnt{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--muted);}
  .ticket{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:11px;padding:11px;margin-bottom:10px;box-shadow:0 1px 2px rgba(15,23,42,.05);}
  .ticket .tk-t{font-weight:700;font-size:13px;margin-bottom:6px;}
  .ticket .tk-m{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--muted);gap:8px;flex-wrap:wrap;}
  .ava{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#22d3ee,#0e7490);color:#fff;font-size:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;}

  .tl{position:relative;padding-left:24px;}
  .tl:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:linear-gradient(#22d3ee,#e2e8f0);}
  .tl .ev{position:relative;margin-bottom:16px;}
  .tl .ev .dot{position:absolute;left:-22px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--accent);}
  .tl .ev .tm{font-size:11.5px;color:var(--muted);font-weight:700;}
  .tl .ev .ti{font-weight:700;font-size:13.5px;margin:1px 0 2px;}
  .tl .ev .de{font-size:12.5px;color:var(--muted);}

  .okr-node{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
  .okr-node.dept{border-left:4px solid var(--accent2);margin-left:20px;background:#f8fdff;}
  .okr-node .on-t{font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .okr-node .on-m{font-size:12px;color:var(--muted);margin-top:5px;display:flex;gap:16px;flex-wrap:wrap;}

  .milestone{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);}
  .milestone .ms-ic{width:30px;height:30px;border-radius:9px;background:var(--soft);color:#0e7490;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .milestone .ms-ic .msy{font-size:18px;}

  .scoretile{border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;}
  .ring{--p:0;width:104px;height:104px;border-radius:50%;margin:0 auto;background:conic-gradient(var(--accent) calc(var(--p)*1%),#e2e8f0 0);display:flex;align-items:center;justify-content:center;}
  .ring .inner{width:76px;height:76px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring .inner b{font-size:20px;font-weight:900;} .ring .inner span{font-size:10.5px;color:var(--muted);}

  .insight{display:flex;gap:12px;padding:13px;border:1px solid var(--line);border-radius:13px;margin-bottom:11px;background:#fff;}
  .insight .ii{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .insight .it{font-weight:800;font-size:13.5px;margin-bottom:3px;}
  .insight .id{font-size:12.5px;color:var(--muted);}

  .list-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);}
  .list-row:last-child{border-bottom:none;}
  .list-row .lr-main{flex:1;min-width:0;}
  .list-row .lr-t{font-weight:700;font-size:13.5px;}
  .list-row .lr-s{font-size:12px;color:var(--muted);}

  .foot{max-width:1360px;margin:0 auto;padding:20px 18px 40px;color:var(--muted);font-size:12px;text-align:center;}

  @media(max-width:820px){
    .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
    .board{grid-template-columns:1fr;}
  }
  @media(max-width:860px){
    .nav{width:100%;margin-left:0;overflow-x:auto;flex-wrap:nowrap;}
  }
  @media(max-width:560px){
    .nav button .txt{display:none;}
    .nav button{padding:9px 11px;}
    .brand .tt span{display:none;}
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="logo"><span class="msy">account_tree</span></div>
        <div class="tt"><b>經營計畫管理系統</b><span>Business Plan Management ｜ 純 UI 展示</span></div>
      </div>
      <nav class="nav" id="nav"></nav>
    </div>
  </header>

  <main class="wrap"><div id="app"></div></main>
  <div class="foot">本頁為純 UI 系統展示（無後端），畫面與資料皆為擬真示範。｜ /demos/jvision-smart-mfg-296-system-296/</div>

<script>
(function(){
  "use strict";

  var NAV=[
    {i:0,ic:"account_tree",t:"目標展開分解"},
    {i:1,ic:"checklist",t:"行動方案規劃"},
    {i:2,ic:"task_alt",t:"任務分派看板"},
    {i:3,ic:"monitoring",t:"執行進度儀表板"},
    {i:4,ic:"groups",t:"定期檢討會議"},
    {i:5,ic:"history",t:"計畫修正稽核"}
  ];

  var chartRegistry={};
  function destroyCharts(){
    for(var k in chartRegistry){ if(chartRegistry[k]){try{chartRegistry[k].destroy();}catch(e){} chartRegistry[k]=null;} }
    chartRegistry={};
  }
  function mkChart(id,cfg){
    var el=document.getElementById(id);
    if(!el) return;
    if(chartRegistry[id]){try{chartRegistry[id].destroy();}catch(e){}}
    chartRegistry[id]=new Chart(el.getContext("2d"),cfg);
  }
  var GRID={color:"#eef2f6"};
  var FONT={family:"'Inter','Noto Sans TC',sans-serif"};

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function bar(p){return '<div class="bar"><i style="width:'+Math.max(0,Math.min(100,p))+'%"></i></div>';}
  function tag(cls,txt){return '<span class="tag '+cls+'">'+esc(txt)+'</span>';}

  // ---------- SCREEN 0 : 目標展開分解 ----------
  function s0(){
    var kpis=[
      {l:"年度營收目標",v:"48.6",u:"億",dt:"+8.4% YoY",up:1,ic:"trending_up"},
      {l:"已展開部門目標",v:"32",u:"項",dt:"覆蓋 6 事業處",up:1,ic:"account_tree"},
      {l:"目標達成率",v:"71",u:"%",dt:"+5.2pt",up:1,ic:"insights"},
      {l:"未對齊指標",v:"4",u:"項",dt:"需複核",up:0,ic:"rule"}
    ];
    var okr=[
      {lv:"corp",t:"2026 年度｜營收成長 8%、營業利益率 12%",owner:"總經理室",dl:"2026 全年",p:71},
      {lv:"dept",t:"業務事業處｜新客戶營收 +6 億",owner:"業務處 王經理",dl:"Q4",p:64},
      {lv:"dept",t:"生產事業處｜單位成本 -4.5%",owner:"生產處 林經理",dl:"Q3",p:78},
      {lv:"dept",t:"研發中心｜新品上市 5 案",owner:"研發 陳副理",dl:"Q4",p:52},
      {lv:"dept",t:"營運支援處｜人均產值 +7%",owner:"營運 黃經理",dl:"Q4",p:69}
    ];
    var html=''
     +'<div class="screen-head"><h1>目標展開分解</h1><span class="pill"><span class="msy">looks_one</span>STAGE v0</span><span class="sub">年度經營目標逐層拆解至各事業處，形成可衡量 KPI</span></div>'
     +'<div class="grid g4" style="margin-bottom:16px">'
     + kpis.map(function(k){return '<div class="card kpi"><span class="msy bg">'+k.ic+'</span><div class="lbl"><span class="msy" style="font-size:16px;color:var(--accent)">'+k.ic+'</span>'+k.l+'</div><div class="val">'+k.v+' <small>'+k.u+'</small></div><div class="dt '+(k.up?'up':'down')+'">'+(k.up?'▲ ':'● ')+k.dt+'</div></div>';}).join('')
     +'</div>'
     +'<div class="grid g23">'
     +'  <div class="card"><h3><span class="msy">account_tree</span>目標展開樹（企業 → 部門）</h3>'
     + okr.map(function(n){
         return '<div class="okr-node '+(n.lv==="dept"?"dept":"")+'"><div class="on-t">'+(n.lv==="corp"?'<span class="msy" style="color:var(--accent);font-size:18px">flag</span>':'<span class="msy" style="color:var(--accent2);font-size:16px">subdirectory_arrow_right</span>')+esc(n.t)+'</div><div class="on-m"><span>負責：'+esc(n.owner)+'</span><span>期限：'+esc(n.dl)+'</span><span>進度：'+n.p+'%</span></div><div style="margin-top:7px">'+bar(n.p)+'</div></div>';
       }).join('')
     +'  </div>'
     +'  <div class="card"><h3><span class="msy">donut_large</span>各事業處目標貢獻</h3><div class="chartbox" style="height:230px"><canvas id="c0a"></canvas></div>'
     +'    <div style="margin-top:14px" class="muted">目標對齊檢核</div>'
     +'    <div class="milestone"><div class="ms-ic"><span class="msy">check_circle</span></div><div style="flex:1;min-width:0"><div class="lr-t">財務面 5 項指標</div><div class="lr-s">全數對齊母目標</div></div>'+tag("t-ok","已對齊")+'</div>'
     +'    <div class="milestone"><div class="ms-ic"><span class="msy">warning</span></div><div style="flex:1;min-width:0"><div class="lr-t">客戶面 2 項指標</div><div class="lr-s">權重待總經理室確認</div></div>'+tag("t-warn","待複核")+'</div>'
     +'    <div class="milestone" style="border-bottom:none"><div class="ms-ic"><span class="msy">rule</span></div><div style="flex:1;min-width:0"><div class="lr-t">流程面 2 項指標</div><div class="lr-s">缺少衡量基準值</div></div>'+tag("t-bad","未對齊")+'</div>'
     +'  </div>'
     +'</div>';
    return {html:html,init:function(){
      mkChart("c0a",{type:"doughnut",data:{labels:["業務處","生產處","研發中心","營運支援","財務處","品保處"],datasets:[{data:[32,24,14,12,10,8],backgroundColor:["#0891b2","#22d3ee","#0e7490","#67e8f9","#155e75","#a5f3fc"],borderWidth:2,borderColor:"#fff"}]},options:{responsive:true,maintainAspectRatio:false,cutout:"60%",plugins:{legend:{position:"right",labels:{font:FONT,boxWidth:12,padding:9}}}}});
    }};
  }

  // ---------- SCREEN 1 : 行動方案規劃 ----------
  function s1(){
    var plans=[
      {c:"P-2601",n:"重點客戶深耕方案",dept:"業務處",own:"王志明",ms:"5 / 8",st:"進行中",cls:"t-info",p:63,dl:"11/30"},
      {c:"P-2602",n:"產線自動化改善",dept:"生產處",own:"林佩珊",ms:"6 / 6",st:"已完成",cls:"t-ok",p:100,dl:"08/20"},
      {c:"P-2603",n:"新品 A 上市計畫",dept:"研發中心",own:"陳建宏",ms:"3 / 7",st:"落後",cls:"t-bad",p:38,dl:"10/15"},
      {c:"P-2604",n:"人才梯隊培育",dept:"營運支援",own:"黃思婷",ms:"4 / 5",st:"進行中",cls:"t-info",p:74,dl:"12/10"},
      {c:"P-2605",n:"供應鏈成本優化",dept:"生產處",own:"張家豪",ms:"2 / 6",st:"風險",cls:"t-warn",p:41,dl:"09/28"}
    ];
    var mss=[
      {t:"客戶拜訪 TOP20 完成",d:"業務處｜08/05",ic:"handshake",ok:1},
      {t:"自動化設備驗收",d:"生產處｜08/18",ic:"precision_manufacturing",ok:1},
      {t:"新品 A 試產評估",d:"研發中心｜09/02",ic:"science",ok:0},
      {t:"培訓課程第二梯次",d:"營運支援｜09/20",ic:"groups",ok:0},
      {t:"供應商議價會議",d:"生產處｜09/28",ic:"request_quote",ok:0}
    ];
    var html=''
     +'<div class="screen-head"><h1>行動方案規劃</h1><span class="pill"><span class="msy">looks_two</span>STAGE v1</span><span class="sub">依部門目標擬定行動方案、里程碑與時程</span></div>'
     +'<div class="grid g4" style="margin-bottom:16px">'
     +'  <div class="card kpi"><span class="msy bg">checklist</span><div class="lbl">行動方案總數</div><div class="val">24 <small>案</small></div><div class="dt up">▲ 本季新增 6 案</div></div>'
     +'  <div class="card kpi"><span class="msy bg">flag</span><div class="lbl">里程碑總數</div><div class="val">148 <small>個</small></div><div class="dt up">已完成 96</div></div>'
     +'  <div class="card kpi"><span class="msy bg">schedule</span><div class="lbl">準時完成率</div><div class="val">82 <small>%</small></div><div class="dt up">▲ +3.1pt</div></div>'
     +'  <div class="card kpi"><span class="msy bg">warning</span><div class="lbl">落後方案</div><div class="val">3 <small>案</small></div><div class="dt down">● 需介入</div></div>'
     +'</div>'
     +'<div class="grid g32">'
     +'  <div class="card"><h3><span class="msy">checklist</span>部門行動方案清單</h3>'
     +'    <div class="tscroll"><table><thead><tr><th>代碼</th><th>方案名稱</th><th>部門</th><th>負責人</th><th>里程碑</th><th>進度</th><th>狀態</th><th>期限</th></tr></thead><tbody>'
     + plans.map(function(r){return '<tr><td><b>'+esc(r.c)+'</b></td><td>'+esc(r.n)+'</td><td>'+esc(r.dept)+'</td><td>'+esc(r.own)+'</td><td>'+esc(r.ms)+'</td><td style="min-width:120px">'+bar(r.p)+'<span class="muted" style="font-size:11px">'+r.p+'%</span></td><td>'+tag(r.cls,r.st)+'</td><td>'+esc(r.dl)+'</td></tr>';}).join('')
     +'    </tbody></table></div>'
     +'    <h3 style="margin-top:18px"><span class="msy">monitoring</span>各部門方案進度</h3><div class="chartbox" style="height:220px"><canvas id="c1a"></canvas></div>'
     +'  </div>'

      btns[j].addEventListener("click",function(){ location.hash="go="+this.getAttribute("data-i"); });
    }
  }

  function show(i){
    destroyCharts();
    var container=document.getElementById("app");
    var built=SCREENS[i]();
    container.innerHTML=built.html;
    var btns=document.querySelectorAll("[data-i]");
    for(var j=0;j<btns.length;j++){ btns[j].classList.toggle("active", +btns[j].getAttribute("data-i")===i); }
    void container.offsetHeight;
    if(built.init){ built.init(); }
  }

  buildNav();

  function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
})();
</script>
<script src="/shared/jv-agent-bridge.js" defer></script>
</body>
