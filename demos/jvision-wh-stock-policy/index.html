<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>安全庫存與 ABC／XYZ 分級 · WMS 倉儲物流系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#334155;
  --color-on-primary:#FFFFFF;
  --color-secondary:#475569;
  --color-on-secondary:#FFFFFF;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#0F172A;
  --color-card:#FFFFFF;
  --color-card-foreground:#0F172A;
  --color-muted:#F2F3F4;
  --color-muted-foreground:#475569;
  --color-border:#E6E8EA;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#334155;

  --blue:#334155;
  --ink:#0F172A;
  --muted:#475569;
  --line:#E6E8EA;

  --accent:#059669;
  --accent2:#047857;
  --accent-soft:#D1FAE5;
  --accent-soft2:#ECFDF5;
  --bg:#F8FAFC;
  --panel:#FFFFFF;
  --th:#F2F3F4;
  --hov:#F0FDF4;
  --track:#E2E8F0;
  --sidebar:#1E293B;
  --sidebar2:#334155;
  --side-edge:rgba(255,255,255,.12);
  --ok:#047857;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#1D4ED8;
  --r:4px;
  --glow:rgba(15,23,42,.12);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-width:320px}
body{
  font-family:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--ink);
  font-size:13px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font:inherit}
button,[role="button"],a{cursor:pointer}
h1,h2,h3,h4,.brand-txt b,.nav button,.tile b,.pcard b,.lane-row .body b,.rep-row .sku b,.tl-item b,.tl-i b{
  font-family:"Poppins","Open Sans",system-ui,sans-serif;
  margin:0;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
  border-radius:2px;
}
::selection{background:#A7F3D0;color:#052E24}

.app{display:flex;min-height:100vh}
.sidebar{
  width:224px;
  flex:none;
  min-width:0;
  background:var(--sidebar);
  color:#F8FAFC;
  display:flex;
  flex-direction:column;
  padding:22px 14px 18px;
  position:sticky;
  top:0;
  height:100vh;
  border-right:1px solid #0F172A;
}
.brand{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
  padding:0 8px 22px;
  border-bottom:1px solid var(--side-edge);
}
.brand-logo{
  width:38px;
  height:38px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#FFFFFF;
  background:var(--accent);
  border:1px solid rgba(255,255,255,.22);
  border-radius:3px;
}
.brand-logo .material-symbols-outlined{font-size:22px}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-size:14px;font-weight:600;letter-spacing:.02em}
.brand-txt span{display:block;margin-top:1px;color:#CBD5E1;font-size:9.5px;font-weight:700;letter-spacing:.14em}
.nav{display:flex;flex-direction:column;gap:3px;min-width:0;margin-top:18px}
.nav button{
  position:relative;
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  min-height:42px;
  min-width:0;
  padding:9px 10px;
  color:#CBD5E1;
  background:transparent;
  border:1px solid transparent;
  border-radius:3px;
  text-align:left;
  font-size:12.5px;
  font-weight:500;
  white-space:nowrap;
  transition:background-color .2s ease,color .2s ease,border-color .2s ease;
}
.nav button .material-symbols-outlined{font-size:19px;flex:none}
.nav button:hover{color:#FFFFFF;background:#334155;border-color:#475569}
.nav button.on{
  color:#FFFFFF;
  background:#334155;
  border-color:#64748B;
  box-shadow:none;
}
.nav button.on::before{
  content:"";
  position:absolute;
  left:-15px;
  top:7px;
  bottom:7px;
  width:3px;
  background:#34D399;
}
.nav .idx{
  margin-left:auto;
  color:#94A3B8;
  font-family:"Open Sans",monospace;
  font-size:10px;
  font-weight:700;
}
.nav button.on .idx{color:#D1FAE5}
.side-foot{
  margin-top:auto;
  padding:15px 8px 0;
  border-top:1px solid var(--side-edge);
  color:#CBD5E1;
  font-family:"Open Sans",monospace;
  font-size:10.5px;
  line-height:1.7;
}
.side-foot b{color:#FFFFFF}

.main{flex:1;min-width:0;max-width:1600px;padding:22px 28px 52px}
.topbar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:18px;
  margin-bottom:18px;
  padding-bottom:17px;
  border-bottom:1px solid var(--line);
}
.topbar h1{
  display:flex;
  align-items:center;
  gap:9px;
  color:var(--ink);
  font-size:20px;
  font-weight:600;
  letter-spacing:-.02em;
}
.topbar h1 .material-symbols-outlined{color:var(--accent);font-size:23px}
.topbar .sub{margin-top:4px;color:var(--muted);font-size:12px}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:32px;
  padding:5px 10px;
  color:var(--muted);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:3px;
  font-size:10.5px;
  font-weight:600;
}
.chip .dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--ok);
  border:2px solid #A7F3D0;
  animation:pulse 2s ease-in-out infinite;
}
.avatar{
  width:32px;
  height:32px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#FFFFFF;
  background:var(--color-primary);
  border:1px solid #1E293B;
  border-radius:3px;
  font-family:"Poppins",sans-serif;
  font-size:11px;
  font-weight:600;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

#screen{animation:screen-in .35s ease-out both}
@keyframes screen-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--r);
  box-shadow:0 1px 2px rgba(15,23,42,.04);
  transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.card:hover,.sec:hover,.kpi:hover,.stat:hover,.tile:hover{
  border-color:#CBD5E1;
  box-shadow:0 3px 8px rgba(15,23,42,.07);
}
.card,.sec{min-width:0;padding:15px}
.sec{margin-bottom:12px}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
  padding-bottom:10px;
  border-bottom:1px solid var(--line);
  flex-wrap:wrap;
}
.card.pad0 .card-h,.card.p0 .card-h{border-bottom:none}
.card-h h3,.sec>h3{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--ink);
  font-size:13px;
  font-weight:600;
  letter-spacing:.01em;
}
.sec>h3{margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.card-h h3 .material-symbols-outlined,.sec>h3 .material-symbols-outlined{color:var(--accent);font-size:18px}
.card-h .hint{color:var(--muted);font-size:10.5px;font-weight:600}
.sec>p{margin:0 0 12px;color:var(--muted);font-size:12px;line-height:1.7}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:9px 18px;margin:0;font-size:12px}
.dl dt{color:var(--muted);font-size:11px;font-weight:600}
.dl dd{margin:0;line-height:1.7}

.kpi,.stat{position:relative;min-width:0;overflow:hidden;padding:14px 15px}
.kpi::after{
  content:"";
  position:absolute;
  top:0;
  right:0;
  width:4px;
  height:100%;
  background:#CBD5E1;
}
.kpi:hover::after{background:var(--accent)}
.kpi .ico{
  position:relative;
  z-index:1;
  width:34px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#065F46;
  background:var(--accent-soft2);
  border:1px solid #A7F3D0;
  border-radius:3px;
}
.kpi .ico .material-symbols-outlined{font-size:19px}
.kpi .lbl,.stat .lbl{
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:9px;
  color:var(--muted);
  font-size:11px;
  font-weight:600;
}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{color:var(--accent);font-size:15px}
.kpi .val,.stat .val{
  margin-top:2px;
  color:var(--ink);
  font-family:"Poppins","Open Sans",sans-serif;
  font-size:24px;
  font-weight:600;
  letter-spacing:-.04em;
  line-height:1.25;
  font-variant-numeric:tabular-nums;
}
.kpi .val small,.stat .val small{margin-left:3px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:0}
.kpi .delta,.stat .d{
  display:inline-flex;
  align-items:center;
  gap:3px;
  margin-top:5px;
  font-size:10.5px;
  font-weight:700;
}
.delta.up,.d.up{color:var(--ok)}
.delta.down,.d.down{color:#B91C1C}
.delta.flat,.d.flat{color:var(--muted)}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:14px}

.card.pad0>div:last-child,.card.p0>div:last-child{scrollbar-width:thin;scrollbar-color:#94A3B8 #F1F5F9}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:11.5px;font-variant-numeric:tabular-nums}
th{
  padding:9px 11px;
  color:#334155;
  background:var(--th);
  border-top:1px solid var(--line);
  border-bottom:1px solid #D8DDE3;
  text-align:left;
  font-size:10px;
  font-weight:700;
  letter-spacing:.035em;
  line-height:1.35;
  white-space:nowrap;
}
td{
  padding:9px 11px;
  color:var(--ink);
  border-bottom:1px solid var(--line);
  line-height:1.45;
  white-space:nowrap;
  transition:background-color .18s ease;
}
th:not(:first-child),td:not(:first-child){text-align:right}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--hov)}
.mono{
  font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  font-weight:600;
  letter-spacing:.01em;
  font-variant-numeric:tabular-nums;
}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  min-height:22px;
  padding:2px 8px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:10px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
}
.t-ok{color:#166534;background:#F0FDF4}
.t-warn{color:#92400E;background:#FFFBEB}
.t-bad{color:#B91C1C;background:#FEF2F2}
.t-info{color:#1E40AF;background:#EFF6FF}
.t-gray{color:#475569;background:#F1F5F9}
.t-acc,.t-pink{color:#065F46;background:#ECFDF5}

.bar{height:7px;min-width:56px;overflow:hidden;background:var(--track);border-radius:2px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:2px}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{width:38px;flex:none;color:var(--muted);font-size:10px;font-weight:600;text-align:right}

.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:1px;background:#CBD5E1}
.tl-item,.tl-i{position:relative;padding:0 0 16px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{
  position:absolute;
  left:-23px;
  top:3px;
  width:14px;
  height:14px;
  background:#FFFFFF;
  border:3px solid var(--accent);
  border-radius:50%;
}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font-family:"SFMono-Regular",Consolas,monospace;font-size:10px;font-weight:600}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:11.5px;font-weight:600}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:10.5px}

.chk{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px dashed #CBD5E1;font-size:11.5px}
.chk:last-child{border-bottom:none}
.chk .material-symbols-outlined{font-size:18px}
.chk .ok{color:var(--ok)}
.chk .wait{color:var(--muted)}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--muted);font-size:10px}
.note{margin-top:12px;padding-top:11px;border-top:1px dashed #CBD5E1;color:var(--muted);font-size:10.5px;line-height:1.65}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
.board>*{min-width:0}
.col{display:flex;flex-direction:column;gap:8px;padding:10px;background:#F1F5F9;border:1px solid var(--line);border-radius:3px}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 3px 6px;color:var(--ink);font-size:11.5px;font-weight:700}
.col-h .cnt{padding:1px 7px;color:var(--muted);background:#FFFFFF;border:1px solid #CBD5E1;border-radius:999px;font-size:10px}
.pcard{padding:10px 11px;background:#FFFFFF;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:3px;transition:border-color .2s ease,transform .2s ease}
.pcard:hover{border-color:#94A3B8;transform:translateY(-1px)}
.pcard b{font-size:11.5px;font-weight:600}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--muted);font-size:10px}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:7px;color:var(--ink);font-size:10px}
.mini-av,.av{display:flex;align-items:center;justify-content:center;flex:none;background:var(--accent-soft);color:#065F46;font-weight:700}
.mini-av{width:18px;height:18px;border:1px solid #A7F3D0;border-radius:2px;font-size:8px}
.av{width:25px;height:25px;border:1px solid #A7F3D0;border-radius:2px;font-size:10px}
.who{display:inline-flex;align-items:center;gap:6px}

.lane{display:flex;flex-direction:column;gap:9px}
.lane-row{display:flex;align-items:center;gap:12px;min-width:0;padding:11px 12px;background:#FFFFFF;border:1px solid var(--line);border-radius:3px}
.lane-row .num{width:29px;height:29px;flex:none;display:flex;align-items:center;justify-content:center;color:#065F46;background:#ECFDF5;border:1px solid #A7F3D0;border-radius:2px;font-family:"SFMono-Regular",Consolas,monospace;font-size:12px;font-weight:700}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:12px;font-weight:600}
.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:10.5px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{position:relative;z-index:1;width:21px;height:21px;display:flex;align-items:center;justify-content:center;color:#64748B;background:#FFFFFF;border:2px solid #CBD5E1;border-radius:50%;font-size:10px}
.steps .ln{width:18px;height:2px;background:#CBD5E1}
.steps .s.done{color:#FFFFFF;background:var(--accent);border-color:var(--accent)}
.steps .s.cur{color:#065F46;border-color:var(--accent);animation:pulse 1.6s ease-in-out infinite}
.steps .ln.done{background:var(--accent)}

.rep-row{display:flex;align-items:center;gap:12px;min-width:0;padding:11px 3px;border-bottom:1px dashed #CBD5E1}
.rep-row:last-child{border-bottom:none}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:12px;font-weight:600}
.rep-row .sku span{color:var(--muted);font-size:10px}
.gauge{width:110px;flex:none}
.gauge .track{position:relative;height:7px;overflow:hidden;background:var(--track);border-radius:2px}
.gauge .track i{display:block;height:100%;background:var(--accent);border-radius:2px}
.gauge small{display:block;margin-top:3px;color:var(--muted);font-size:9.5px;text-align:right}
.band{position:relative;height:25px;min-width:150px;background:var(--track);border-radius:2px}
.band .rng{position:absolute;top:0;bottom:0;background:#A7F3D0;border-radius:2px}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
.band .me{position:absolute;top:3px;width:11px;height:19px;background:var(--accent);border:1px solid #065F46;border-radius:2px}

.tile{display:flex;flex-direction:column;gap:6px;min-width:0;padding:14px 15px}
.tile .ti{width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:#065F46;background:#ECFDF5;border:1px solid #A7F3D0;border-radius:3px}
.tile .ti .material-symbols-outlined{font-size:19px}
.tile b{color:var(--muted);font-size:11px;font-weight:600}
.tile p{margin:0;color:var(--muted);font-size:10.5px;line-height:1.55}
.tile .tv{color:var(--ink);font-family:"Poppins","Open Sans",sans-serif;font-size:21px;font-weight:600;letter-spacing:-.035em;font-variant-numeric:tabular-nums}

.apexcharts-tooltip,.apexcharts-menu{font-family:"Open Sans",sans-serif!important}
.apexcharts-legend-text,.apexcharts-text{font-family:"Open Sans",sans-serif!important}

@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{position:static;width:100%;height:auto;padding:10px 14px;flex-direction:row;align-items:center;gap:10px;border-right:none;border-bottom:1px solid #0F172A}
  .brand{padding:0 12px 0 0;border:0;border-right:1px solid var(--side-edge)}
  .brand-logo{width:34px;height:34px}
  .side-foot{display:none}
  .nav{flex:1;flex-direction:row;flex-wrap:wrap;gap:5px;margin:0}
  .nav button{width:auto;min-height:38px;padding:8px 10px}
  .nav button.on::before{left:8px;right:8px;top:auto;bottom:-11px;width:auto;height:3px}
  .nav .idx{display:none}
  .main{width:100%;padding:19px 16px 44px}
}
@media(max-width:820px){
  .g2,.g3,.g23,.g32{grid-template-columns:1fr}
  .topbar{align-items:flex-start;flex-direction:column}
  .top-right{justify-content:flex-start}
}
@media(max-width:700px){
  .dl{grid-template-columns:1fr;gap:2px 0}
  .dl dt{margin-top:8px}
}
@media(max-width:560px){
  body{font-size:12px}
  .sidebar{align-items:flex-start;flex-wrap:wrap}
  .brand{width:100%;padding:0 0 9px;border-right:0;border-bottom:1px solid var(--side-edge)}
  .nav{width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
  .nav button{width:100%;justify-content:center;padding:9px 7px}
  .nav button .txt{display:none}
  .nav button.on::before{bottom:-1px}
  .main{padding:16px 12px 38px}
  .topbar{margin-bottom:14px;padding-bottom:14px}
