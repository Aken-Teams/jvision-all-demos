<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>供應商稽核管理系統｜Jvision 系統 Demo</title>
<meta name="description" content="稽核排程、現場查核、缺失分級到矯正措施追蹤的單一稽核平台" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#0891b2;--accent2:#22d3ee;--ink:#0f172a;--muted:#64748b;
  --line:#e2e8f0;--bg:#f1f5f9;--card:#ffffff;--soft:#ecfeff;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#2563eb;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;line-height:1.5;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;vertical-align:middle}
/* top nav */
.topbar{position:sticky;top:0;z-index:40;background:linear-gradient(100deg,#083344,#0891b2);color:#fff;box-shadow:0 2px 14px rgba(8,51,68,.25)}
.topbar-inner{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.brand .logo .material-symbols-outlined{font-size:24px;color:var(--accent2)}
.brand h1{font-size:16px;margin:0;font-weight:800;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{font-size:11px;margin:0;color:#a5f3fc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-spacer{flex:1 1 auto;min-width:0}
.top-meta{display:flex;align-items:center;gap:14px;min-width:0}
.top-meta .chip{display:flex;align-items:center;gap:6px;font-size:12px;color:#cffafe;white-space:nowrap}
.top-meta .chip .material-symbols-outlined{font-size:16px}
.top-user{display:flex;align-items:center;gap:8px}
.top-user .av{width:32px;height:32px;border-radius:50%;background:var(--accent2);color:#083344;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.top-user span{font-size:12px;color:#e0f2fe}
/* nav row */
.nav{background:#06222e;position:sticky;top:58px;z-index:39}
.nav-inner{max-width:1360px;margin:0 auto;padding:0 12px;display:flex;gap:4px;flex-wrap:wrap;min-width:0}
.nav button{appearance:none;border:0;background:transparent;color:#94d5e4;padding:12px 14px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:7px;border-bottom:3px solid transparent;min-width:0}
.nav button .material-symbols-outlined{font-size:19px}
.nav button:hover{color:#fff}
.nav button.active{color:#fff;border-bottom-color:var(--accent2)}
/* layout */
main{max-width:1360px;margin:0 auto;padding:20px 18px 60px;min-width:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap;min-width:0}
.page-head h2{margin:0;font-size:21px;font-weight:800}
.page-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 13px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn .material-symbols-outlined{font-size:17px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:var(--soft);border-color:#a5f3fc;color:#0e7490}
/* cards / grid */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.card h3{margin:0 0 2px;font-size:14px;font-weight:800}
.card .sub{color:var(--muted);font-size:12px;margin:0 0 12px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid-32{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
.grid-23{display:grid;grid-template-columns:1fr 1.7fr;gap:14px}
.mb14{margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;position:relative;overflow:hidden;min-width:0}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--accent)}
.kpi .val{font-size:27px;font-weight:900;margin-top:6px;letter-spacing:-.5px}
.kpi .val small{font-size:14px;font-weight:700;color:var(--muted)}
.kpi .delta{font-size:11px;font-weight:700;margin-top:4px;display:inline-flex;align-items:center;gap:3px}
.kpi .delta.up{color:var(--ok)}.kpi .delta.down{color:var(--bad)}
/* tables */
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th{text-align:left;color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:#f8fafc}
.tw{overflow-x:auto}
/* badges */
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.tag .material-symbols-outlined{font-size:14px}
.t-ok{background:#dcfce7;color:#15803d}
.t-warn{background:#fef3c7;color:#b45309}
.t-bad{background:#fee2e2;color:#b91c1c}
.t-info{background:#e0f2fe;color:#0369a1}
.t-cyan{background:#cffafe;color:#0e7490}
.t-gray{background:#e2e8f0;color:#475569}
.t-purple{background:#ede9fe;color:#6d28d9}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
/* kanban board */
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:start}
.col{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
.col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;padding:0 3px}
.col-head .ct{font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:6px}
.col-head .cn{font-size:11px;font-weight:800;background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
.kcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:9px;cursor:default;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.kcard:last-child{margin-bottom:0}
.kcard .kid{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.3px}
.kcard .kt{font-size:13px;font-weight:700;margin:3px 0 6px}
.kcard .kmeta{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.kcard .who{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.kcard .who .av{width:20px;height:20px;border-radius:50%;background:var(--soft);color:#0e7490;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.sev-bar{height:4px;border-radius:3px;margin-top:8px;background:var(--line);overflow:hidden}
.sev-bar>i{display:block;height:100%}
/* timeline */
.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 16px 6px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-20px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.tl-item.done::before{background:var(--accent)}
.tl-item.warn::before{border-color:var(--warn)}
.tl-time{font-size:11px;color:var(--muted);font-weight:700}
.tl-title{font-size:13.5px;font-weight:700;margin:2px 0}
.tl-desc{font-size:12px;color:var(--muted)}
/* progress */
.pbar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.pbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.mini{font-size:11px;color:var(--muted)}
/* checklist rows */
.chk{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.chk .cbox{width:22px;height:22px;border-radius:6px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800}
.chk .cbox.pass{background:#dcfce7;color:#15803d}
.chk .cbox.fail{background:#fee2e2;color:#b91c1c}
.chk .cbox.na{background:#e2e8f0;color:#64748b}
.chk .cmain{min-width:0;flex:1}
.chk .cq{font-size:13px;font-weight:600}
.chk .cd{font-size:11.5px;color:var(--muted)}
.chk .cscore{font-size:13px;font-weight:800;flex:0 0 auto}
/* star */
.stars{color:var(--warn);letter-spacing:2px;font-size:13px}
.chartbox{width:100%;overflow:hidden}
.list-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row .rk{width:26px;height:26px;border-radius:8px;background:var(--soft);color:#0e7490;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:8px;padding:5px 11px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.donut-center{text-align:center}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
.stat-row:last-child{border-bottom:0}
.stat-row b{font-weight:800}
@media(max-width:1080px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .board{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:820px){
  .grid-2,.grid-3,.grid-32,.grid-23{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .page-head h2{font-size:19px}
}
@media(max-width:560px){
  .kpi-grid{grid-template-columns:1fr 1fr}
  .nav button span:not(.material-symbols-outlined){display:none}
  .nav button{padding:12px}
  .top-meta{display:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">verified</span></div>
      <div style="min-width:0">
        <h1>供應商稽核管理系統</h1>
        <p>稽核排程 · 現場查核 · 缺失分級 · 矯正追蹤</p>
      </div>
    </div>
    <div class="topbar-spacer"></div>
    <div class="top-meta">
      <div class="chip"><span class="material-symbols-outlined">calendar_month</span><span>2026 稽核年度</span></div>
      <div class="chip"><span class="material-symbols-outlined">factory</span><span>供應商 128 家</span></div>
    </div>
    <div class="top-user">
      <div class="av">品</div>
      <span>品保部 · 陳立群</span>
    </div>
  </div>
</header>
<nav class="nav"><div class="nav-inner" id="nav"></div></nav>
<main id="view"></main>

<script>
(function(){
"use strict";
var view=document.getElementById("view");
var nav=document.getElementById("nav");
var charts=[];
var current=-1;

var MODS=[
  {icon:"calendar_month",name:"稽核排程"},
  {icon:"checklist",name:"查檢表範本"},
  {icon:"fact_check",name:"現場查核"},
  {icon:"warning",name:"缺失分級"},
  {icon:"build",name:"矯正追蹤"},
  {icon:"insights",name:"稽核成效"}
];

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function ico(n){return '<span class="material-symbols-outlined">'+n+'</span>';}

/* ---------- nav ---------- */
MODS.forEach(function(m,i){
  var b=document.createElement("button");
  b.setAttribute("data-i",i);
  b.innerHTML=ico(m.icon)+'<span>'+esc(m.name)+'</span>';
  b.addEventListener("click",function(){location.hash="v"+i;});
  nav.appendChild(b);
});
function setActive(i){
  var bs=nav.querySelectorAll("button");
  for(var k=0;k<bs.length;k++){bs[k].classList.toggle("active",+bs[k].getAttribute("data-i")===i);}
}

/* ---------- chart helper ---------- */
function mkChart(id,opt){
  var el=document.getElementById(id);
  if(!el)return;
  opt.chart=opt.chart||{};
  opt.chart.redrawOnParentResize=false;
  opt.chart.redrawOnWindowResize=false;
  opt.chart.animations={enabled:false};
  opt.chart.fontFamily='Inter,"Noto Sans TC",sans-serif';
  opt.chart.toolbar={show:false};
  try{var c=new ApexCharts(el,opt);c.render();charts.push(c);}catch(e){}
}
function destroyCharts(){
  for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}
  charts=[];
}

/* ================= SCREEN 0 : 稽核排程 (KPI + calendar-ish list + chart) ================= */
function screen0(){
  var sched=[
    {sup:"晶鼎精密 CNC",type:"年度定期稽核",date:"08/18",risk:"高",auditor:"王思婷",status:"待執行",cover:"機械加工"},
    {sup:"宏昇電子組裝",type:"新供應商認證",date:"08/20",risk:"高",auditor:"李承恩",status:"待執行",cover:"PCBA"},
    {sup:"永達沖壓",type:"追蹤稽核",date:"08/21",risk:"中",auditor:"王思婷",status:"排程中",cover:"沖壓件"},
    {sup:"合鑫表面處理",type:"重大缺失複核",date:"08/22",risk:"高",auditor:"陳冠宇",status:"待執行",cover:"電鍍"},
    {sup:"泰昌塑膠射出",type:"年度定期稽核",date:"08/25",risk:"中",auditor:"李承恩",status:"排程中",cover:"塑膠射出"},
    {sup:"利豐五金",type:"文件稽核",date:"08/26",risk:"低",auditor:"陳冠宇",status:"排程中",cover:"五金"},
    {sup:"欣良包裝材料",type:"追蹤稽核",date:"08/28",risk:"低",auditor:"王思婷",status:"排程中",cover:"包材"}
  ];
  function riskTag(r){return r==="高"?'<span class="tag t-bad">'+ico("priority_high")+'高風險</span>':r==="中"?'<span class="tag t-warn">中風險</span>':'<span class="tag t-ok">低風險</span>';}
  function stTag(s){return s==="待執行"?'<span class="tag t-info">'+ico("event_upcoming")+'待執行</span>':'<span class="tag t-gray">排程中</span>';}
  var rows=sched.map(function(r){
    return '<tr><td><b>'+esc(r.sup)+'</b><div class="mini">'+esc(r.cover)+'</div></td><td>'+esc(r.type)+'</td><td><b>'+esc(r.date)+'</b></td><td>'+riskTag(r.risk)+'</td><td>'+esc(r.auditor)+'</td><td>'+stTag(r.status)+'</td></tr>';
  }).join("");

  view.innerHTML=
  '<div class="page-head"><div><h2>稽核排程</h2><p>依供應商風險等級與到期日排定年度稽核計畫，指派稽核員並發出通知。</p></div>'+
  '<div class="seg"><button class="btn ghost">'+ico("download")+'匯出計畫</button><button class="btn primary">'+ico("add")+'新增排程</button></div></div>'+
  '<div class="kpi-grid">'+
    kpi("event_available","本月排定稽核","18","家",'up','+4 vs 上月')+
    kpi("pending_actions","待執行","6","場",'','逾期 0 場')+
    kpi("shield","高風險供應商","14","家",'down','-2 vs 上季')+
    kpi("verified","年度稽核覆蓋率","86","%",'up','+11 pt')+
  '</div>'+
  '<div class="grid-32">'+
    '<div class="card"><h3>近期稽核排程</h3><p class="sub">未來 14 天已排定與待指派場次</p><div class="tw"><table>'+
      '<thead><tr><th>供應商</th><th>稽核類型</th><th>日期</th><th>風險</th><th>稽核員</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
    '<div class="card"><h3>年度稽核達成</h3><p class="sub">2026 各季計畫 vs 實際完成</p><div id="c0a" class="chartbox"></div>'+
      '<div class="legend"><span><span class="dot" style="background:#0891b2"></span>計畫場次</span><span><span class="dot" style="background:#22d3ee"></span>已完成</span></div></div>'+
  '</div>';

  void view.offsetHeight;
  mkChart("c0a",{
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"bar",height:300,stacked:false},
    series:[{name:"計畫場次",data:[24,26,22,20]},{name:"已完成",data:[24,25,19,7]}],
    colors:["#0891b2","#22d3ee"],
    plotOptions:{bar:{columnWidth:"55%",borderRadius:5}},
    dataLabels:{enabled:false},
    xaxis:{categories:["Q1","Q2","Q3","Q4"]},
    yaxis:{labels:{style:{fontSize:"11px"}}},
    grid:{borderColor:"#eef2f7"},
    legend:{show:false},
    tooltip:{shared:true,intersect:false}
  });
}

/* ================= SCREEN 1 : 查檢表範本 (list + checklist preview + weight donut) ================= */
function screen1(){
  var tpls=[
    {name:"機械加工廠稽核表",ver:"v4.2",items:42,cat:"CNC / 加工",used:38,on:true},
    {name:"PCBA 組裝廠稽核表",ver:"v3.1",items:56,cat:"電子組裝",used:22,on:true},
    {name:"表面處理稽核表",ver:"v2.0",items:48,cat:"電鍍 / 塗裝",used:14,on:true},
    {name:"塑膠射出稽核表",ver:"v2.5",items:39,cat:"塑膠成型",used:19,on:false},
    {name:"通用文件系統稽核表",ver:"v5.0",items:28,cat:"QMS 文件",used:61,on:true}
  ];
  var rows=tpls.map(function(t){
    return '<div class="list-row"><div class="rk">'+ico("description")+'</div><div style="flex:1;min-width:0"><div style="font-weight:700;font-size:13.5px">'+esc(t.name)+' <span class="tag t-cyan">'+esc(t.ver)+'</span></div><div class="mini">'+esc(t.cat)+' · '+t.items+' 項 · 套用 '+t.used+' 家</div></div>'+(t.on?'<span class="tag t-ok">'+ico("check")+'啟用</span>':'<span class="tag t-gray">草稿</span>')+'</div>';
  }).join("");
  var chk=[
    {q:"進料檢驗紀錄完整且可追溯",st:"pass",sc:"5/5",cat:"品質系統"},
    {q:"量測儀器校驗在期效內",st:"pass",sc:"5/5",cat:"量測管理"},
    {q:"作業標準書 (SOP) 現場張貼一致",st:"fail",sc:"2/5",cat:"文件管制"},
    {q:"不良品隔離區標示清楚",st:"pass",sc:"4/5",cat:"製程管制"},
    {q:"員工教育訓練紀錄齊備",st:"na",sc:"—",cat:"人員"},
    {q:"環安衛防護具配戴落實",st:"pass",sc:"5/5",cat:"環安衛"}
  ];

/* ---------- small html helpers ---------- */
function kpi(icon,lab,val,unit,dir,note){
  var d=dir==="up"?'<div class="delta up">'+ico("trending_up")+esc(note)+'</div>':dir==="down"?'<div class="delta down">'+ico("trending_down")+esc(note)+'</div>':'<div class="mini" style="margin-top:4px">'+esc(note)+'</div>';
  return '<div class="kpi"><div class="lab">'+ico(icon)+esc(lab)+'</div><div class="val">'+esc(val)+' <small>'+esc(unit)+'</small></div>'+d+'</div>';
}
function tl(cls,time,title,desc){
  return '<div class="tl-item '+cls+'"><div class="tl-time">'+esc(time)+'</div><div class="tl-title">'+esc(title)+'</div><div class="tl-desc">'+esc(desc)+'</div></div>';
}
function statRow(k,v){return '<div class="stat-row"><span>'+esc(k)+'</span><b>'+esc(v)+'</b></div>';}

/* ---------- router ---------- */
var SCREENS=[screen0,screen1,screen2,screen3,screen4,screen5];
function show(i){
  if(i===current)return;
  destroyCharts();
  current=i;
  setActive(i);
  SCREENS[i]();
}
window.__show=show;

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
})();
</script>
