<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>供應商稽核管理系統｜Jvision 系統 Demo</title>
<meta name="description" content="稽核排程、現場查核、缺失分級到矯正措施追蹤的單一稽核平台" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#fff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000;
  --color-accent:#ea580c;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#1e293b;
  --color-card:#fff;
  --color-card-foreground:#1e293b;
  --color-muted:#e9eff8;
  --color-muted-foreground:#475569;
  --color-border:#cbd5e1;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#1e293b;
  --muted:#475569;
  --line:#cbd5e1;
  --ok:#15803d;
  --warn:#a14308;
  --bad:#b91c1c;
  --info:#1d4ed8;
  --shadow:6px 6px 0 #1e293b;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{
  margin:0;
  min-width:320px;
  background:
    linear-gradient(var(--line) 1px,transparent 1px),
    linear-gradient(90deg,var(--line) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Fira Sans",sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,a{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.icon{
  width:1.15em;height:1.15em;display:inline-block;flex:0 0 auto;
  fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter;
}
.mono,.id,time,.val,.mini,.tl-time,.kid,.cn,td:nth-child(3),td:nth-child(5){
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
.topbar{
  position:sticky;top:0;z-index:40;
  color:#fff;background:var(--ink);
  border-bottom:4px solid var(--color-accent);
}
.topbar-inner{
  max-width:1440px;margin:auto;padding:12px 20px;
  display:flex;align-items:center;gap:18px;min-height:70px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  width:42px;height:42px;display:grid;place-items:center;flex:none;
  color:#fff;background:var(--blue);border:2px solid #fff;
}
.brand h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.02em}
.brand p{margin:1px 0 0;color:#dbeafe;font-size:11px}
.top-spacer{flex:1}
.top-meta,.top-user{display:flex;align-items:center;gap:10px}
.top-meta{font-size:12px}
.top-meta span{padding:5px 8px;border:1px solid #94a3b8}
.avatar{
  width:34px;height:34px;display:grid;place-items:center;
  color:#000;background:#fb923c;border:2px solid #fff;font-weight:700;
}
.top-user small{color:#e2e8f0}
.nav{
  position:sticky;top:70px;z-index:35;background:#fff;
  border-bottom:2px solid var(--ink);
}
.nav-inner{
  max-width:1440px;margin:auto;padding:0 20px;
  display:flex;overflow-x:auto;scrollbar-width:thin;
}
.nav button{
  min-height:54px;padding:10px 16px;white-space:nowrap;
  display:flex;align-items:center;gap:8px;
  color:var(--muted);background:#fff;border:0;border-right:1px solid var(--line);
  font-size:13px;font-weight:600;
}
.nav button:first-child{border-left:1px solid var(--line)}
.nav button:hover{color:var(--ink);background:var(--color-muted)}
.nav button.active{
  color:#fff;background:var(--blue);
  box-shadow:inset 0 -5px 0 #fb923c;
}
main{max-width:1440px;margin:auto;padding:28px 20px 72px}
.page-head{
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:20px;margin-bottom:22px;padding:20px;
  background:#fff;border:2px solid var(--ink);box-shadow:var(--shadow);
}
.page-head h2{
  margin:0;font-size:clamp(24px,3vw,42px);line-height:1;
  font-weight:700;letter-spacing:-.04em;
}
.page-head p{max-width:720px;margin:10px 0 0;color:var(--muted);font-size:13px}
.actions,.seg{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  min-height:44px;padding:9px 14px;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  color:var(--ink);background:#fff;border:2px solid var(--ink);
  font-weight:700;font-size:13px;box-shadow:3px 3px 0 var(--ink);
}
.btn:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{color:#fff;background:var(--color-accent);border-color:var(--ink)}
.btn.ghost{color:#fff;background:var(--blue)}
.card,.kpi{
  min-width:0;background:var(--color-card);
  border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);
}
.card{padding:18px}
.card h3{
  margin:0 0 3px;font-size:15px;font-weight:700;
  text-transform:uppercase;letter-spacing:.025em;
}
.sub{margin:0 0 16px;color:var(--muted);font-size:12px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpi{position:relative;padding:17px;border-top:8px solid var(--blue)}
.kpi:nth-child(2n){border-top-color:var(--color-accent)}
.kpi .lab{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:600}
.kpi .val{margin-top:8px;font-size:29px;font-weight:700;letter-spacing:-.06em}
.kpi .val small{font-family:"Fira Sans",sans-serif;font-size:13px;color:var(--muted)}
.delta,.mini{margin-top:5px;font-size:11px;font-weight:600}
.delta{display:flex;align-items:center;gap:4px}
.up{color:var(--ok)}.down{color:var(--bad)}
.grid-2,.grid-32,.grid-23{display:grid;gap:18px}
.grid-2{grid-template-columns:1fr 1fr}
.grid-32{grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr)}
.grid-23{grid-template-columns:minmax(300px,1fr) minmax(0,1.7fr)}
.mb{margin-bottom:18px}
.tw{overflow-x:auto;border:1px solid var(--ink)}
table{width:100%;min-width:620px;border-collapse:collapse;font-size:13px}
th{
  padding:10px;text-align:left;white-space:nowrap;
  color:#fff;background:var(--ink);border-right:1px solid #64748b;
  font-size:11px;font-weight:700;letter-spacing:.04em;
}
td{padding:11px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
tbody tr:nth-child(even){background:#f1f5f9}
tbody tr:hover{background:#dbeafe}
.num{text-align:right;font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.tag{
  display:inline-flex;align-items:center;gap:4px;padding:3px 7px;
  border:1px solid currentColor;font-size:11px;font-weight:700;white-space:nowrap;
}
.t-ok{color:#166534;background:#dcfce7}
.t-warn{color:#92400e;background:#fef3c7}
.t-bad{color:#991b1b;background:#fee2e2}
.t-info{color:#1e40af;background:#dbeafe}
.t-blue{color:#1e3a8a;background:#dbeafe}
.t-gray{color:#334155;background:#e2e8f0}
.list-row,.check{
  display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);
}
.list-row:last-child,.check:last-child{border-bottom:0}
.rank,.check-mark{
  width:30px;height:30px;display:grid;place-items:center;flex:none;
  color:#fff;background:var(--blue);border:1px solid var(--ink);
  font-family:"Fira Code",monospace;font-size:11px;font-weight:700;
}
.check-mark.fail{background:var(--bad)}
.check-mark.na{color:var(--ink);background:#cbd5e1}
.grow{flex:1;min-width:0}
.title{font-weight:700;font-size:13px}
.score{flex:none;text-align:right;font-weight:700}
.progress{height:10px;background:#dbe2eb;border:1px solid var(--ink);overflow:hidden}
.progress i{display:block;height:100%;background:var(--blue)}
.board{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:12px;min-width:1020px}
.column{padding:9px;background:#e9eff8;border:2px solid var(--ink)}
.column-head{display:flex;justify-content:space-between;gap:8px;margin-bottom:9px;font-size:12px;font-weight:700}
.cn{padding:1px 7px;background:#fff;border:1px solid var(--ink)}
.kanban-card{padding:10px;margin-bottom:9px;background:#fff;border:2px solid var(--ink)}
.kanban-card:last-child{margin-bottom:0}
.kid{color:var(--muted);font-size:10px}
.kt{margin:4px 0 8px;font-size:13px;font-weight:700}
.kmeta{display:flex;align-items:center;justify-content:space-between;gap:5px}
.who{font-size:11px;color:var(--muted)}
.severity{height:6px;margin-top:8px;background:#cbd5e1;border:1px solid var(--ink)}
.severity i{display:block;height:100%}
.timeline{position:relative;padding-left:25px}
.timeline:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;border-left:3px solid var(--ink)}
.tl-item{position:relative;padding:0 0 19px 5px}
.tl-item:last-child{padding-bottom:0}
.tl-item:before{
  content:"";position:absolute;left:-24px;top:2px;width:13px;height:13px;
  background:#fff;border:3px solid var(--blue);
}
.tl-item.done:before{background:var(--blue)}
.tl-item.warn:before{background:#fb923c;border-color:#9a3412}
.tl-time{color:var(--muted);font-size:10px;font-weight:700}
.tl-title{margin:2px 0;font-weight:700;font-size:13px}
.tl-desc{color:var(--muted);font-size:12px}
.chartbox{width:100%;overflow:hidden}
.legend{display:flex;gap:15px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:11px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.swatch{width:12px;height:12px;border:1px solid var(--ink)}
.stat-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px dashed #94a3b8;font-size:13px}
.stat-row b{font-family:"Fira Code",monospace}
.stars{color:#9a3412;font-family:"Fira Code",monospace;letter-spacing:1px}
.reveal{opacity:1;transform:none}
@media(prefers-reduced-motion:no-preference){
  .btn,.nav button{transition:transform .18s ease,box-shadow .18s ease,background-color .18s ease,color .18s ease}
  .reveal{animation:reveal .35s ease-out both}
  @keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}
  .reveal{opacity:1!important;transform:none!important}
}
@media(max-width:1024px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .grid-32,.grid-23{grid-template-columns:1fr}
}
@media(max-width:768px){
  .top-meta{display:none}
  .grid-2{grid-template-columns:1fr}
  .page-head{align-items:flex-start;flex-direction:column}
  .actions,.seg{width:100%}.actions .btn,.seg .btn{flex:1}
}
@media(max-width:520px){
  .topbar-inner,main{padding-left:12px;padding-right:12px}
  .top-user small,.brand p{display:none}
  .nav-inner{padding:0 12px}
  .nav button{min-width:52px;justify-content:center;padding:10px}
  .nav button .nav-label{display:none}
  .kpi-grid{grid-template-columns:1fr}
  .page-head{padding:15px;box-shadow:4px 4px 0 var(--ink)}
  .card{padding:14px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 3 20 7v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7l8-4Z"/><path d="m8.5 12 2.2 2.2 4.8-5"/></svg>
      </div>
      <div><h1>供應商稽核管理系統</h1><p>稽核排程 · 現場查核 · 缺失分級 · 矯正追蹤</p></div>
    </div>
    <div class="top-spacer"></div>
    <div class="top-meta"><span>2026 稽核年度</span><span>供應商 128 家</span></div>
    <div class="top-user"><div class="avatar">品</div><small>品保部 · 陳立群</small></div>
  </div>
</header>
<nav class="nav" aria-label="主要功能"><div class="nav-inner" id="nav"></div></nav>
<main id="view" tabindex="-1"></main>
<script>
(function(){
"use strict";
var view=document.getElementById("view"),nav=document.getElementById("nav"),charts=[],current=-1;
var MODS=[
["calendar","稽核排程"],["list","查檢表範本"],["check","現場查核"],
["alert","缺失分級"],["tool","矯正追蹤"],["chart","稽核成效"]
];
var PATHS={
calendar:'<rect x="3" y="5" width="18" height="16"/><path d="M8 3v4M16 3v4M3 10h18M8 14h2M14 14h2M8 18h2"/>',
list:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="m3 6 1 1 2-2m-3 7 1 1 2-2m-3 7 1 1 2-2"/>',
check:'<path d="M9 11 12 14 21 5"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h10"/>',
alert:'<path d="M12 3 2 21h20L12 3Z"/><path d="M12 9v5m0 3v.01"/>',
tool:'<path d="M14.7 6.3a4 4 0 0 0-5-5l2.1 2.1-8.4 8.4a2.1 2.1 0 0 0 3 3l8.4-8.4 2.1 2.1a4 4 0 0 0-2.2-2.2Z"/><path d="m13 13 8 8"/>',
chart:'<path d="M4 20V10m6 10V4m6 16v-7m5 7H2"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
download:'<path d="M12 3v12m0 0 5-5m-5 5-5-5M4 21h16"/>',
filter:'<path d="M4 5h16M7 12h10m-7 7h4"/>',
report:'<path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h6m-6 4h6"/>',
sync:'<path d="M20 7h-5V2M4 17h5v5M20 7a8 8 0 0 0-14-2L4 7m0 10a8 8 0 0 0 14 2l2-2"/>'
};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ico(n){return '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">'+(PATHS[n]||PATHS.check)+'</svg>'}
MODS.forEach(function(m,i){
  var b=document.createElement("button");
  b.type="button";b.dataset.i=i;b.setAttribute("aria-label",m[1]);
  b.innerHTML=ico(m[0])+'<span class="nav-label">'+m[1]+'</span>';
  b.onclick=function(){location.hash="v"+i};nav.appendChild(b)
});
function setActive(i){
  nav.querySelectorAll("button").forEach(function(b){
    var active=+b.dataset.i===i;b.classList.toggle("active",active);
    if(active)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")
  })
}
function destroyCharts(){charts.forEach(function(c){try{c.destroy()}catch(e){}});charts=[]}
function mkChart(id,opt){
  var el=document.getElementById(id);if(!el||typeof ApexCharts==="undefined")return;
  opt.chart=opt.chart||{};opt.chart.animations={enabled:false};opt.chart.toolbar={show:false};
  opt.chart.fontFamily='"Fira Sans",sans-serif';opt.chart.foreColor="#475569";
  opt.grid=opt.grid||{};opt.grid.borderColor="#cbd5e1";
  try{var c=new ApexCharts(el,opt);c.render();charts.push(c)}catch(e){}
}
function btn(icon,text,primary){return '<button class="btn '+(primary||"")+'" type="button">'+ico(icon)+text+'</button>'}
function tag(text,type,icon){return '<span class="tag '+type+'">'+(icon?ico(icon):"")+text+'</span>'}
function kpi(icon,label,value,unit,note,dir){
  return '<article class="kpi reveal"><div class="lab">'+ico(icon)+label+'</div><div class="val">'+value+' <small>'+unit+'</small></div><div class="'+(dir?"delta "+dir:"mini")+'">'+(dir?ico(dir==="up"?"chart":"alert"):"")+note+'</div></article>'
}
function head(title,desc,actions){return '<header class="page-head reveal"><div><h2>'+title+'</h2><p>'+desc+'</p></div><div class="actions">'+actions+'</div></header>'}
function card(title,sub,content,extra){return '<section class="card reveal '+(extra||"")+'"><h3>'+title+'</h3><p class="sub">'+sub+'</p>'+content+'</section>'}
function tl(cls,time,title,desc){return '<div class="tl-item '+cls+'"><div class="tl-time">'+time+'</div><div class="tl-title">'+title+'</div><div class="tl-desc">'+desc+'</div></div>'}
function stat(k,v){return '<div class="stat-row"><span>'+k+'</span><b>'+v+'</b></div>'}

function screen0(){
var data=[
["O鼎精密 CNC","年度定期稽核","08/18","高","王思婷","待執行","機械加工"],
["O昇電子組裝","新供應商認證","08/20","高","李承恩","待執行","PCBA"],
["O達沖壓","追蹤稽核","08/21","中","王思婷","排程中","沖壓件"],
["O鑫表面處理","重大缺失複核","08/22","高","陳冠宇","待執行","電鍍"],
["O昌塑膠射出","年度定期稽核","08/25","中","李承恩","排程中","塑膠射出"],
["O豐五金","文件稽核","08/26","低","陳冠宇","排程中","五金"],
["O良包裝材料","追蹤稽核","08/28","低","王思婷","排程中","包材"]
];
var rows=data.map(function(r){
var risk=r[3]==="高"?tag("高風險","t-bad","alert"):r[3]==="中"?tag("中風險","t-warn","alert"):tag("低風險","t-ok","check");
var st=r[5]==="待執行"?tag("待執行","t-info","calendar"):tag("排程中","t-gray","sync");
return '<tr><td><b>'+r[0]+'</b><div class="mini">'+r[6]+'</div></td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+risk+'</td><td>'+r[4]+'</td><td>'+st+'</td></tr>'
}).join("");
view.innerHTML=head("稽核排程","依供應商風險等級與到期日排定年度稽核計畫，指派稽核員並發出通知。",btn("download","匯出計畫","ghost")+btn("plus","新增排程","primary"))+
'<div class="kpi-grid">'+kpi("calendar","本月排定稽核","18","家","+4 vs 上月","up")+kpi("sync","待執行","6","場","逾期 0 場")+kpi("alert","高風險供應商","14","家","-2 vs 上季","down")+kpi("check","年度稽核覆蓋率","86","%","+11 pt","up")+'</div>'+
'<div class="grid-32">'+card("近期稽核排程","未來 14 天已排定與待指派場次",'<div class="tw"><table><thead><tr><th>供應商</th><th>稽核類型</th><th>日期</th><th>風險</th><th>稽核員</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div>')+
card("年度稽核達成","2026 各季計畫 vs 實際完成",'<div id="c0" class="chartbox"></div><div class="legend"><span><i class="swatch" style="background:#2563eb"></i>計畫場次</span><span><i class="swatch" style="background:#ea580c"></i>已完成</span></div>')+'</div>';
mkChart("c0",{chart:{type:"bar",height:310},series:[{name:"計畫場次",data:[24,26,22,20]},{name:"已完成",data:[24,25,19,7]}],colors:["#2563eb","#ea580c"],plotOptions:{bar:{columnWidth:"58%",borderRadius:0}},dataLabels:{enabled:false},xaxis:{categories:["Q1","Q2","Q3","Q4"]}})
}

function screen1(){
var templates=[
["機械加工廠稽核表","v4.2","42","CNC / 加工","38","啟用"],
["PCBA 組裝廠稽核表","v3.1","56","電子組裝","22","啟用"],
["表面處理稽核表","v2.0","48","電鍍 / 塗裝","14","啟用"],
["塑膠射出稽核表","v2.5","39","塑膠成型","19","草稿"],
