<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>設計選品採購板 · Interior Selection & Procurement</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--accent:#9a3412;--accent2:#c2410c;--sage:#5f6b52;--ink:#2b2019;--bg:#f6f1ea;--card:#fffdfb;--line:#e8ddce;--mut:#8a7862;--ok:#4d7c4d;--warn:#c2410c;--bad:#b91c1c}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.top{background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:11px 22px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#fff;flex:none;box-shadow:0 8px 18px rgba(154,52,18,.32);font-family:"Noto Sans TC"}
.brand b{font-size:15px;font-weight:800;display:block;font-family:"Noto Sans TC"}
.brand span{font-size:10px;color:var(--accent);letter-spacing:2px}
.nav{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap;min-width:0}
.nav button{border:0;background:transparent;color:var(--mut);font:inherit;font-weight:600;font-size:13px;padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:#f3ece1;color:var(--accent)}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.wrap{max-width:1280px;margin:0 auto;padding:22px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.live{background:#fbe8dc;color:var(--accent);padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--accent2);display:inline-block;animation:p 1.5s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.3}
.up{color:var(--ok)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.15fr .85fr}
.g11{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#dcecdc;color:#3d6b3d}.t-warn{background:#fbe8dc;color:#9a3412}.t-bad{background:#fbe0e0;color:#a52020}.t-info{background:#e6e9df;color:#4f5a42}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#f7f0e6}
.chart{height:250px}
/* signature gallery board */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:16px}.board>*{min-width:0}
.pc{border:1px solid var(--line);border-radius:15px;background:var(--card);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 3px 10px rgba(154,52,18,.05)}
.pc .ph{height:118px;border:2px dashed var(--accent2);border-radius:11px 11px 0 0;background:repeating-linear-gradient(45deg,#faf3ea,#faf3ea 9px,#f3e7d6 9px,#f3e7d6 18px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--accent);border-bottom:none}
.pc .ph .material-symbols-outlined{font-size:28px;opacity:.7}
.pc .ph small{font-size:10.5px;font-weight:700;letter-spacing:1px;color:var(--accent2)}
.pc .bd{padding:11px 13px 13px;display:flex;flex-direction:column;gap:5px;flex:1}
.pc .bd .cat{font-size:10px;font-weight:800;letter-spacing:1px;color:var(--sage)}
.pc .bd b{font-size:13.5px;font-family:"Noto Sans TC"}
.pc .bd .meta{font-size:11px;color:var(--mut);display:flex;flex-wrap:wrap;gap:4px 8px}
.pc .bd .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px;padding-top:6px}
.pc .bd .price{font-family:Inter;font-weight:800;font-size:15px;color:var(--accent)}
.sw{display:inline-block;width:13px;height:13px;border-radius:4px;border:1px solid rgba(0,0,0,.12);vertical-align:-2px;margin-right:3px}
/* compare */
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.cmp>*{min-width:0}
.cc{border:1px solid var(--line);border-radius:14px;padding:0 0 13px;overflow:hidden;background:var(--card)}
.cc.pick{border:2px solid var(--accent);box-shadow:0 6px 16px rgba(154,52,18,.14)}
.cc .ph{height:88px;border:2px dashed var(--accent2);border-bottom:none;border-radius:12px 12px 0 0;background:repeating-linear-gradient(45deg,#faf3ea,#faf3ea 9px,#f3e7d6 9px,#f3e7d6 18px);display:grid;place-items:center;color:var(--accent2)}
.cc .hd{padding:11px 13px 4px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.cc .hd b{font-size:13.5px;font-family:"Noto Sans TC"}
.cc dl{margin:0;padding:0 13px;font-size:12px}
.cc dl div{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.cc dl dt{color:var(--mut)}.cc dl dd{margin:0;font-weight:700;text-align:right}
/* approval */
.appr{display:flex;flex-direction:column;gap:10px}
.ap{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.ap .th{width:44px;height:44px;border-radius:9px;border:2px dashed var(--accent2);display:grid;place-items:center;color:var(--accent2);flex:none}
.ap .mid b{font-size:13px;font-family:"Noto Sans TC"}
.ap .mid small{color:var(--mut);font-size:11px;display:block}
.ap .rt{text-align:right;flex:none;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
/* po / rfq list */
.rfq{display:flex;flex-direction:column;gap:10px}
.rq{border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.rq .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rq .hd b{font-size:13px;font-family:"Noto Sans TC"}
.rq .hd code{background:#f3ece1;color:var(--accent);font-weight:700;padding:2px 7px;border-radius:5px;font-size:11px}
.quotes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:9px}
.q{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:11.5px}
.q.best{border-color:var(--accent);background:#fbe8dc}
.q b{display:block;font-family:"Noto Sans TC";font-size:12px}
.q .pr{font-family:Inter;font-weight:800;color:var(--accent);font-size:14px;margin-top:2px}
/* gantt */
.gantt{display:flex;flex-direction:column;gap:8px}
.gr{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;font-size:12px}
.gr .lab{font-family:"Noto Sans TC"}
.gr .track{position:relative;height:22px;background:#f5ede1;border-radius:6px;overflow:hidden}
.gr .track i{position:absolute;top:3px;height:16px;border-radius:5px;display:flex;align-items:center;padding:0 7px;color:#fff;font-size:10px;font-weight:700;white-space:nowrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.two>*{min-width:0}
.scroll{overflow-x:auto}
.bar{height:8px;background:#f0e6d6;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g11,.two,.cmp{grid-template-columns:1fr}.gr{grid-template-columns:110px 1fr}}
@media(max-width:560px){.wrap{padding:14px}.nav button span:not(.material-symbols-outlined){display:none}.nav button{padding:9px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo">選</div><div><b>設計選品採購板</b><span>SELECTION &amp; PROCUREMENT</span></div></div>
  <nav class="nav" id="nav"></nav>
</header>
<main class="wrap">
  <div class="vh"><div><h2 id="vt">選品總覽</h2><p id="vd"></p></div><div class="live"><i></i>3 案進行中 · 7 品項待客戶確認</div></div>
  <div id="view"></div>
</main>
<script>
const MOD=[["選品總覽","dashboard","選品總覽","各空間選品進度、預算控管與待辦戰情"],
["選品板","grid_view","選品板","材質、傢俱、燈具選品卡與情境板"],
["品項比選","compare","品項比選","同類選品材質、品牌、單價並列比較"],
["客戶確認","how_to_reg","客戶確認","選品送審、客戶簽核與意見回饋"],
["採購下單","shopping_cart_checkout","採購下單","確認品項詢價比價與請購下單"],
["交期到貨","local_shipping","交期到貨","交期承諾、到貨追蹤與安裝排程"]];
const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span><span>'+m[0]+'</span>';b.onclick=()=>show(i);nav.appendChild(b);});

// 選品卡：類別,名稱,品牌,材質,單價,色票,狀態,狀態tag,icon
const PROD=[
["石材","義大利卡拉拉大理石 60×60","Marmi Rossi","天然大理石 · 亮面","NT$ 4,800/㎡","#e9e4dc","已確認","t-ok","landscape"],
["木皮","北歐橡木人字拼地板","Kährs","實木複合 · 霧面","NT$ 3,650/㎡","#c19a6b","客戶確認中","t-warn","texture"],
["傢俱","三人絨布沙發 Bardo","BoConcept","義大利絨布 · 岩灰","NT$ 68,000/組","#6b6f63","比選中","t-info","weekend"],
["燈具","黃銅球形吊燈 Orbit","Menu","黃銅 · 霧面玻璃","NT$ 12,400/盞","#b8860b","已確認","t-ok","lightbulb"],
["五金","極簡隱藏把手","FSB","陽極鋁 · 香檳金","NT$ 980/支","#cdb891","詢價中","t-warn","tune"],
["布藝","亞麻半透光窗簾","Kvadrat","100% 亞麻 · 米白","NT$ 2,200/碼","#efe8da","已確認","t-ok","curtains"],
["磁磚","手工窯變壁磚 10×20","Bisazza","陶質釉面 · 赤陶","NT$ 1,650/㎡","#9a3412","客戶確認中","t-warn","grid_on"],
["傢俱","橡木餐桌 200cm","Carl Hansen","實木橡木 · 自然油","NT$ 92,000/張","#c9a876","比選中","t-info","table_restaurant"]
];
// 比選候選：名稱,品牌,材質,單價,交期,保固,說明,pick
const CMP=[
["卡拉拉大理石","Marmi Rossi","天然大理石","NT$ 4,800/㎡","6 週","—","石材紋理自然，單價偏高",false],
["賽麗石灰霧","Silestone","石英複合","NT$ 3,200/㎡","3 週","10 年","耐污好保養，CP 值佳",true],
["微水泥抹面","Topciment","礦物塗料","NT$ 2,400/㎡","2 週","2 年","無縫一體感，需師傅工藝",false]
];
// 客戶確認：類別,名稱,空間,狀態,tag,icon
const APPR=[
["石材","卡拉拉大理石檯面","主衛浴","已簽核 8/10","t-ok","done_all"],
["木皮","橡木人字拼地板","客廳","待客戶確認","t-warn","hourglass_top"],
["磁磚","窯變赤陶壁磚","玄關","待客戶確認","t-warn","hourglass_top"],
["傢俱","絨布沙發 Bardo","客廳","客戶退回 · 換色","t-bad","undo"],
["燈具","黃銅球形吊燈","餐廳","已簽核 8/11","t-ok","done_all"],
["布藝","亞麻窗簾","主臥","待客戶確認","t-warn","hourglass_top"]
];
// RFQ：單號,品項,報價陣列[名稱,價,best]
const RFQ=[
["RFQ-2508","橡木人字拼地板 45㎡",[["O豐建材","162,000",false],["歐德進口","158,500",true],["方寸選材","171,000",false]]],
["RFQ-2507","黃銅球形吊燈 ×6",[["北歐燈飾","74,400",true],["丹麥直送","78,900",false]]],
["RFQ-2506","窯變赤陶壁磚 18㎡",[["義磚坊","29,700",true],["磚語","32,400",false],["進口磁磚","31,200",false]]]
];
// PO：單號,供應商,品項,金額,交期,狀態,tag
const PO=[
["PO-3120","歐德進口","橡木人字拼地板 45㎡","NT$ 158,500","9/12","備貨中","t-warn"],
["PO-3119","北歐燈飾","黃銅球形吊燈 ×6","NT$ 74,400","8/28","已出貨","t-ok"],
["PO-3118","Marmi Rossi","卡拉拉大理石檯面","NT$ 143,000","9/20","進口海運","t-warn"],
["PO-3117","義磚坊","窯變赤陶壁磚 18㎡","NT$ 29,700","8/24","已到貨","t-ok"]
];
// 甘特：品項,start%,end%,color,label
const GANTT=[
["黃銅吊燈 已到貨",4,26,"#4d7c4d","到貨"],
["赤陶壁磚 已到貨",6,30,"#4d7c4d","到貨"],
["絨布沙發 訂製中",22,62,"#c2410c","訂製"],
["橡木地板 備貨中",34,58,"#c2410c","備貨"],
["大理石 海運進口",40,80,"#b91c1c","海運"]
];

function priceRow(p){return `<div class="pc"><div class="ph"><span class="material-symbols-outlined">${p[8]}</span><small>照片 / 材質樣品</small></div><div class="bd"><span class="cat">${p[0]}</span><b>${p[1]}</b><div class="meta"><span><span class="sw" style="background:${p[5]}"></span>${p[3]}</span></div><div class="meta">品牌 · ${p[2]}</div><div class="foot"><span class="price">${p[4]}</span><span class="tag ${p[7]}">${p[6]}</span></div></div></div>`;}

const SCREENS=[
// 0 選品總覽
()=>`<div class="kpis">
 <div class="kpi"><span class="material-symbols-outlined ic">inventory_2</span><div class="l">選品品項</div><div class="v">148</div><div class="d up">▲ 本週新增 12</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">how_to_reg</span><div class="l">客戶確認率</div><div class="v">76<small style="font-size:12px">%</small></div><div class="d up">▲ 較上週 +9%</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">savings</span><div class="l">預算使用</div><div class="v">82<small style="font-size:12px">%</small></div><div class="d" style="color:var(--mut)">NT$ 3.68M / 4.5M</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">pending_actions</span><div class="l">待確認品項</div><div class="v" style="color:var(--warn)">7</div><div class="d" style="color:var(--mut)">1 退回 · 6 待簽</div></div>
</div>
<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">donut_large</span>各空間選品進度</h3><div class="chart" id="c_prog" style="height:280px"></div></div>
 <div class="card"><h3><span class="material-symbols-outlined">account_balance_wallet</span>類別預算控管</h3>
  ${[["石材／磁磚","NT$ 620K","NT$ 750K",83],["傢俱","NT$ 1.24M","NT$ 1.4M",89],["燈具","NT$ 286K","NT$ 400K",72],["布藝軟裝","NT$ 198K","NT$ 320K",62],["五金收邊","NT$ 96K","NT$ 180K",53]].map(b=>`<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px"><b style="font-family:Noto Sans TC">${b[0]}</b><span style="color:var(--mut)">${b[1]} / ${b[2]}</span></div><div class="bar"><i style="width:${b[3]}%"></i></div></div>`).join('')}
 </div>
</div>`,
// 1 選品板 (signature gallery)
()=>`<div class="card" style="margin-bottom:16px"><h3><span class="material-symbols-outlined">palette</span>竹北陳宅｜現代侘寂情境板 <span class="tag t-info" style="margin-left:auto">主色調 岩灰 × 赤陶</span></h3><p style="font-size:12px;color:var(--mut);margin:0">每張選品卡登錄品牌、材質與單價，附照片／樣品欄位；虛線框為現場拍攝或供應商樣品置放區。</p></div>
<div class="board">${PROD.map(priceRow).join('')}</div>`,
// 2 品項比選
()=>`<div class="card" style="margin-bottom:16px"><h3><span class="material-symbols-outlined">compare</span>比選群組：客廳地坪材質（3 候選）<span class="tag t-warn" style="margin-left:auto">建議 賽麗石灰霧</span></h3><p style="font-size:12px;color:var(--mut);margin:0">同類選品以材質、單價、交期、保固並列比較，圈選推薦方案供客戶抉擇。</p></div>
<div class="cmp">${CMP.map(c=>`<div class="cc${c[7]?' pick':''}"><div class="ph"><span class="material-symbols-outlined">texture</span></div><div class="hd"><b>${c[0]}</b>${c[7]?'<span class="tag t-ok">推薦</span>':''}</div><dl><div><dt>品牌</dt><dd>${c[1]}</dd></div><div><dt>材質</dt><dd>${c[2]}</dd></div><div><dt>單價</dt><dd style="color:var(--accent)">${c[3]}</dd></div><div><dt>交期</dt><dd>${c[4]}</dd></div><div><dt>保固</dt><dd>${c[5]}</dd></div></dl><p style="font-size:11.5px;color:var(--mut);padding:8px 13px 0;margin:0">${c[6]}</p></div>`).join('')}</div>`,
// 3 客戶確認
()=>`<div class="grid g2"><div class="card"><h3><span class="material-symbols-outlined">how_to_reg</span>選品簽核清單</h3><div class="appr">${APPR.map(a=>`<div class="ap"><div class="th"><span class="material-symbols-outlined">${a[5]}</span></div><div class="mid"><b>${a[1]}</b><small>${a[0]} · ${a[2]}</small></div><div class="rt"><span class="tag ${a[4]}">${a[3]}</span></div></div>`).join('')}</div></div>
<div class="card"><h3><span class="material-symbols-outlined">forum</span>客戶意見回饋</h3>
 <div style="display:flex;flex-direction:column;gap:11px">
