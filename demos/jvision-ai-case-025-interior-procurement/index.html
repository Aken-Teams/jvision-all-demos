<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>設計選品採購板 · Interior Selection &amp; Procurement</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Noto+Sans+TC:wght@400;500;600;700;800;900&amp;family=Playfair+Display:ital,wght@1,600;1,700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#64748B;
  --color-on-primary:#FFFFFF;
  --color-secondary:#94A3B8;
  --color-on-secondary:#0F172A;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#334155;
  --color-card:#FFFFFF;
  --color-card-foreground:#334155;
  --color-muted:#EBF0F5;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#64748B;
  --blue:#64748B;
  --ink:#334155;
  --muted:#475569;
  --line:#E2E8F0;
  --accent:#EA580C;
  --accent-soft:#FFF0E8;
  --bg:#F8FAFC;
  --card:#FFFFFF;
  --ok:#28744F;
  --ok-soft:#E7F5ED;
  --warn:#B9470B;
  --warn-soft:#FFF0E8;
  --bad:#B91C1C;
  --bad-soft:#FDEBEC;
  --info:#475569;
  --info-soft:#EDF2F7;
  --shadow-sm:0 1px 2px rgba(15,23,42,.04),0 6px 18px rgba(15,23,42,.04);
  --shadow-md:0 16px 40px rgba(15,23,42,.09);
  --radius:18px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-width:320px;
  background:
    linear-gradient(rgba(100,116,139,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(100,116,139,.045) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--color-foreground);
  font-family:Inter,"Noto Sans TC",sans-serif;
  line-height:1.5;
}
button,a,[role="button"]{cursor:pointer}
button{font:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid rgba(100,116,139,.42);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-size:20px;
  line-height:1;
  vertical-align:middle;
  font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;
}
.top{
  position:sticky;
  top:0;
  z-index:30;
  display:flex;
  align-items:center;
  gap:24px;
  min-height:72px;
  padding:10px clamp(16px,3vw,42px);
  border-bottom:1px solid rgba(226,232,240,.92);
  background:rgba(248,250,252,.93);
  box-shadow:0 1px 0 rgba(255,255,255,.8);
  backdrop-filter:blur(18px);
}
.brand{display:flex;align-items:center;gap:12px;min-width:max-content}
.logo{
  position:relative;
  display:grid;
  place-items:center;
  width:42px;
  height:42px;
  flex:none;
  overflow:hidden;
  border-radius:12px;
  background:#1E293B;
  color:#FFF;
  font-family:"Noto Sans TC",sans-serif;
  font-size:16px;
  font-weight:900;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.13),0 8px 20px rgba(15,23,42,.16);
}
.logo::after{
  position:absolute;
  right:-7px;
  bottom:-7px;
  width:20px;
  height:20px;
  border-radius:3px;
  background:var(--color-accent);
  content:"";
  transform:rotate(18deg);
}
.brand b{
  display:block;
  color:#0F172A;
  font-family:"Noto Sans TC",sans-serif;
  font-size:15px;
  font-weight:900;
  letter-spacing:.01em;
}
.brand span{
  display:block;
  margin-top:1px;
  color:var(--color-muted-foreground);
  font-family:"JetBrains Mono",monospace;
  font-size:9px;
  letter-spacing:.13em;
}
.nav{
  display:flex;
  align-items:center;
  gap:4px;
  margin-left:auto;
  overflow-x:auto;
  scrollbar-width:none;
}
.nav::-webkit-scrollbar{display:none}
.nav button{
  display:flex;
  align-items:center;
  gap:7px;
  flex:none;
  min-height:42px;
  padding:9px 12px;
  border:1px solid transparent;
  border-radius:10px;
  background:transparent;
  color:var(--color-muted-foreground);
  font-family:"Noto Sans TC",sans-serif;
  font-size:12.5px;
  font-weight:700;
  white-space:nowrap;
  transition:background .2s ease,color .2s ease,border-color .2s ease,transform .2s ease;
}
.nav button:hover{
  border-color:var(--color-border);
  background:var(--color-card);
  color:#0F172A;
}
.nav button.on{
  border-color:#CBD5E1;
  background:#1E293B;
  color:#FFF;
  box-shadow:0 7px 18px rgba(15,23,42,.15);
}
.nav button.on::after{
  width:5px;
  height:5px;
  margin-left:1px;
  border-radius:50%;
  background:var(--color-accent);
  content:"";
}
.wrap{
  width:min(100%,1440px);
  margin:0 auto;
  padding:clamp(20px,3vw,42px);
}
.vh{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:22px;
}
.vh h2{
  margin:0;
  color:#0F172A;
  font-family:"Noto Sans TC",sans-serif;
  font-size:clamp(25px,3vw,38px);
  font-weight:900;
  letter-spacing:-.035em;
}
.vh p{
  max-width:720px;
  margin:5px 0 0;
  color:var(--color-muted-foreground);
  font-size:13px;
}
.live{
  display:flex;
  align-items:center;
  gap:8px;
  flex:none;
  padding:8px 13px;
  border:1px solid #FED7AA;
  border-radius:999px;
  background:#FFF7ED;
  color:#9A3412;
  font-size:11.5px;
  font-weight:800;
}
.live i{
  position:relative;
  width:9px;
  height:9px;
  border:2px solid #FFF;
  border-radius:50%;
  background:var(--color-accent);
  box-shadow:0 0 0 2px rgba(234,88,12,.23);
}
.hero{
  position:relative;
  display:grid;
  grid-template-columns:minmax(0,1.03fr) minmax(360px,.97fr);
  min-height:390px;
  margin-bottom:18px;
  overflow:hidden;
  border:1px solid #CBD5E1;
  border-radius:24px;
  background:#1E293B;
  color:#FFF;
  box-shadow:var(--shadow-md);
}
.hero::before{
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:34px 34px;
  content:"";
  mask-image:linear-gradient(90deg,#000,transparent 75%);
}
.hero-copy{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:clamp(28px,5vw,68px);
}
.eyebrow{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:18px;
  color:#FDBA74;
  font-family:"JetBrains Mono",monospace;
  font-size:10px;
  font-weight:600;
  letter-spacing:.14em;
  text-transform:uppercase;
}
.eyebrow::before{width:28px;height:2px;background:var(--color-accent);content:""}
.hero h1{
  max-width:660px;
  margin:0;
  font-family:"Noto Sans TC",sans-serif;
  font-size:clamp(34px,5vw,66px);
  font-weight:900;
  letter-spacing:-.065em;
  line-height:1.06;
}
.hero h1 em{
  color:#FDBA74;
  font-family:"Playfair Display","Noto Sans TC",serif;
  font-weight:600;
}
.hero-copy>p{
  max-width:550px;
  margin:19px 0 25px;
  color:#CBD5E1;
  font-size:13px;
  line-height:1.75;
}
.hero-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.primary-cta{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:46px;
  padding:10px 18px;
  border:0;
  border-radius:11px;
  background:var(--color-accent);
  color:#111827;
  font-weight:900;
  box-shadow:0 9px 24px rgba(234,88,12,.28);
  transition:background .2s ease,transform .2s ease,box-shadow .2s ease;
}
.primary-cta:hover{background:#F97316;transform:translateY(-2px);box-shadow:0 13px 28px rgba(234,88,12,.35)}
.hero-note{color:#CBD5E1;font-size:11px}
.model-stage{
  position:relative;
  min-height:390px;
  overflow:hidden;
  perspective:900px;
  background:linear-gradient(135deg,#E2E8F0,#F8FAFC 52%,#CBD5E1);
}
.model-stage::after{
  position:absolute;
  inset:auto 8% 8% auto;
  color:#64748B;
  content:"INTERIOR / 3D MATERIAL VIEW";
  font-family:"JetBrains Mono",monospace;
  font-size:9px;
  letter-spacing:.13em;
}
.room{
  position:absolute;
  left:50%;
  top:49%;
  width:330px;
  height:245px;
  transform:translate(-50%,-50%) rotateX(61deg) rotateZ(-33deg);
  transform-style:preserve-3d;
  animation:room-in .75s cubic-bezier(.2,.75,.2,1) both;
}
.floor{
  position:absolute;
  inset:0;
  border:1px solid rgba(71,85,105,.28);
  background:
    repeating-linear-gradient(90deg,rgba(100,116,139,.14) 0 1px,transparent 1px 32px),
    repeating-linear-gradient(0deg,rgba(100,116,139,.12) 0 1px,transparent 1px 32px),
    #E9E6DE;
  box-shadow:28px 34px 45px rgba(15,23,42,.22);
}
.wall-a,.wall-b{
  position:absolute;
  border:1px solid rgba(71,85,105,.22);
  background:#F8FAFC;
  transform-origin:bottom;
}
.wall-a{left:0;bottom:0;width:100%;height:140px;transform:rotateX(-90deg)}
.wall-b{right:0;top:0;width:145px;height:100%;transform-origin:right;transform:rotateY(90deg)}
.sofa{
  position:absolute;
  left:54px;
  top:72px;
  width:142px;
  height:58px;
  border-radius:8px;
  background:#64748B;
  box-shadow:0 16px 0 #475569,9px 22px 15px rgba(15,23,42,.24);
  transform:translateZ(20px);
}
.sofa::before,.sofa::after{
  position:absolute;
  top:7px;
  width:63px;
  height:42px;
  border-radius:6px;
  background:#94A3B8;
  content:"";
}
.sofa::before{left:6px}.sofa::after{right:6px}
.table-3d{
  position:absolute;
  right:51px;
  bottom:48px;
  width:88px;
  height:48px;
  border-radius:50%;
  background:#B68A60;
  box-shadow:0 12px 0 #795B43,7px 19px 14px rgba(15,23,42,.22);
  transform:translateZ(24px);
}
.rug{
  position:absolute;
  left:88px;
  bottom:42px;
  width:150px;
  height:84px;
  border:1px solid rgba(100,116,139,.22);
  background:repeating-linear-gradient(45deg,#E2E8F0,#E2E8F0 6px,#F8FAFC 6px,#F8FAFC 12px);
}
.sample-pin{
  position:absolute;
  right:22px;
  top:22px;
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px 10px;
  border:1px solid rgba(255,255,255,.8);
  border-radius:9px;
  background:rgba(255,255,255,.78);
  color:#334155;
  font-size:10px;
  font-weight:800;
  backdrop-filter:blur(8px);
}
.sample-pin i{width:12px;height:12px;border-radius:3px;background:var(--color-accent)}
.value-strip{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  margin-bottom:18px;
  overflow:hidden;
  border:1px solid var(--color-border);
  border-radius:15px;
  background:var(--color-card);
  box-shadow:var(--shadow-sm);
}
.value-strip div{padding:14px 18px;border-right:1px solid var(--color-border)}
.value-strip div:last-child{border-right:0}
.value-strip strong{display:block;color:#0F172A;font-size:12px}
.value-strip span{display:block;margin-top:2px;color:var(--color-muted-foreground);font-size:10.5px}
.kpis{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:18px;
}
.kpi{
  position:relative;
  min-height:132px;
  overflow:hidden;
  padding:18px;
  border:1px solid var(--color-border);
  border-radius:var(--radius);
  background:var(--color-card);
  box-shadow:var(--shadow-sm);
}
.kpi::after{
  position:absolute;
  right:-24px;
  bottom:-31px;
  width:90px;
  height:90px;
  border:1px solid #E2E8F0;
  border-radius:50%;
  content:"";
}
.kpi .l{color:var(--color-muted-foreground);font-size:11.5px;font-weight:700}
.kpi .v{
  margin-top:8px;
  color:#0F172A;
  font-size:30px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.04em;
}
.kpi .d{margin-top:4px;font-size:10.5px;font-weight:700}
.kpi .ic{
  position:absolute;
  right:15px;
  top:15px;
  display:grid;
  place-items:center;
  width:34px;
  height:34px;
  border-radius:9px;
  background:var(--color-muted);
  color:var(--color-primary);
}
.up{color:var(--ok)}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:1.15fr .85fr}
.g11,.two{grid-template-columns:1fr 1fr}
.card{
  min-width:0;
  padding:18px;
  border:1px solid var(--color-border);
  border-radius:var(--radius);
  background:var(--color-card);
  box-shadow:var(--shadow-sm);
}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin:0 0 15px;
  color:#0F172A;
  font-family:"Noto Sans TC",sans-serif;
  font-size:14px;
  font-weight:900;
}
.card h3>.material-symbols-outlined{
  display:grid;
  place-items:center;
  width:30px;
  height:30px;
  border-radius:8px;
  background:var(--accent-soft);
  color:var(--color-accent);
}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  min-height:22px;
  padding:3px 9px;
  border:1px solid transparent;
  border-radius:999px;
  font-size:10px;
  font-weight:800;
  line-height:1.2;
  white-space:nowrap;
}
.tag::before{
  width:6px;
  height:6px;
  border:1px solid currentColor;
  border-radius:50%;
  content:"";
}
.t-ok{border-color:#B7DFC8;background:var(--ok-soft);color:#17633F}
.t-warn{border-color:#FED7AA;background:var(--warn-soft);color:#9A3412}
.t-bad{border-color:#FECACA;background:var(--bad-soft);color:#991B1B}
.t-info{border-color:#CBD5E1;background:var(--info-soft);color:#334155}
.scroll{max-width:100%;overflow-x:auto}
table.data{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  font-size:12px;
  font-variant-numeric:tabular-nums;
}
table.data th,table.data td{
  padding:11px 10px;
  border-bottom:1px solid var(--color-border);
  text-align:left;
  white-space:nowrap;
}
table.data th{
  background:#F1F5F9;
  color:#334155;
  font-size:10.5px;
  font-weight:800;
  letter-spacing:.035em;
}
table.data th:first-child{border-radius:8px 0 0 8px}
table.data th:last-child{border-radius:0 8px 8px 0}
table.data tr:last-child td{border-bottom:0}
table.data tbody tr:hover td,table.data tr:not(:first-child):hover td{background:#F8FAFC}
table.data td:nth-child(1),table.data td:nth-child(4),table.data td:nth-child(5){
  font-family:"JetBrains Mono",monospace;
}
table.data td:nth-child(4){text-align:right}
.chart{height:250px}
.board{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(226px,1fr));
  gap:16px;
}
.board>*{min-width:0}
.pc{
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border:1px solid var(--color-border);
  border-radius:16px;
  background:var(--color-card);
  box-shadow:var(--shadow-sm);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.pc:hover{border-color:#CBD5E1;box-shadow:var(--shadow-md);transform:translateY(-4px)}
.pc .ph,.cc .ph{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border-bottom:1px solid #CBD5E1;
  background:
    linear-gradient(135deg,transparent 49.5%,rgba(100,116,139,.15) 50%,transparent 50.5%),
    linear-gradient(45deg,#E9EDF1,#F8FAFC);
  color:#475569;
}
.pc .ph{height:128px;flex-direction:column;gap:5px}
.pc .ph::before,.cc .ph::before{
  position:absolute;
  inset:10px;
  border:1px dashed #94A3B8;
  border-radius:9px;
  content:"";
}
.pc .ph .material-symbols-outlined,.cc .ph .material-symbols-outlined{z-index:1;font-size:30px}
.pc .ph small{
  z-index:1;
  color:#475569;
  font-family:"JetBrains Mono",monospace;
  font-size:9px;
  font-weight:600;
  letter-spacing:.08em;
}
.pc .bd{display:flex;flex:1;flex-direction:column;gap:6px;padding:14px}
.pc .bd .cat{
  color:var(--color-accent);
  font-family:"JetBrains Mono",monospace;
  font-size:9px;
  font-weight:800;
  letter-spacing:.12em;
}
.pc .bd b{color:#0F172A;font-family:"Noto Sans TC",sans-serif;font-size:13.5px}
.pc .bd .meta{display:flex;flex-wrap:wrap;gap:4px 8px;color:var(--color-muted-foreground);font-size:10.5px}
.pc .bd .foot{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:7px;
  margin-top:auto;
  padding-top:8px;
}
.pc .bd .price{
  color:#0F172A;
  font-family:"JetBrains Mono",monospace;
  font-size:13px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
}
.sw{
  display:inline-block;
  width:13px;
  height:13px;
  margin-right:4px;
  border:1px solid rgba(15,23,42,.18);
  border-radius:3px;
  vertical-align:-2px;
}
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cmp>*{min-width:0}
.cc{
  overflow:hidden;
  padding-bottom:14px;
  border:1px solid var(--color-border);
  border-radius:16px;
  background:var(--color-card);
  box-shadow:var(--shadow-sm);
}
.cc.pick{border:2px solid var(--color-accent);box-shadow:0 14px 34px rgba(234,88,12,.14)}
.cc .ph{height:104px}
.cc.pick .ph{background:linear-gradient(135deg,#FFF7ED,#F1F5F9)}
.cc .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 14px 5px}
.cc .hd b{color:#0F172A;font-family:"Noto Sans TC",sans-serif;font-size:13.5px}
.cc dl{margin:0;padding:0 14px;font-size:11.5px}
.cc dl div{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--color-border)}
.cc dl dt{color:var(--color-muted-foreground)}
.cc dl dd{margin:0;color:#0F172A;font-weight:700;text-align:right}
.cc dl div:nth-child(3) dd,.cc dl div:nth-child(4) dd{font-family:"JetBrains Mono",monospace}
.appr,.rfq{display:flex;flex-direction:column;gap:10px}
.ap{
  display:grid;
  grid-template-columns:44px minmax(0,1fr) auto;
  align-items:center;
  gap:12px;
  padding:11px 12px;
  border:1px solid var(--color-border);
  border-radius:12px;
  transition:background .2s ease,border-color .2s ease;
}
.ap:hover{border-color:#CBD5E1;background:#F8FAFC}
.ap .th{
  display:grid;
  place-items:center;
  width:44px;
  height:44px;
  border:1px dashed #94A3B8;
  border-radius:9px;
  background:#F1F5F9;
  color:#475569;
}
.ap .mid{min-width:0}
.ap .mid b{display:block;overflow:hidden;color:#0F172A;font-family:"Noto Sans TC",sans-serif;font-size:13px;text-overflow:ellipsis;white-space:nowrap}
.ap .mid small{display:block;color:var(--color-muted-foreground);font-size:10.5px}
.ap .rt{display:flex;align-items:flex-end;flex-direction:column;gap:4px;text-align:right}
.rq{padding:12px;border:1px solid var(--color-border);border-radius:12px}
.rq .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rq .hd b{color:#0F172A;font-family:"Noto Sans TC",sans-serif;font-size:12.5px}
.rq .hd code{
  padding:3px 7px;
  border-radius:5px;
  background:#1E293B;
  color:#FFF;
  font-family:"JetBrains Mono",monospace;
  font-size:10px;
  font-weight:700;
}
.quotes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.q{padding:9px 10px;border:1px solid var(--color-border);border-radius:9px;background:#FFF;font-size:11px}
.q.best{border-color:#FDBA74;background:#FFF7ED}
.q b{display:block;color:#334155;font-family:"Noto Sans TC",sans-serif;font-size:11.5px}
.q.best b::before{margin-right:4px;color:#9A3412;content:"推薦 · "}
.q .pr{display:block;margin-top:3px;color:#0F172A;font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:800}
.gantt{display:flex;flex-direction:column;gap:10px}
.gr{display:grid;grid-template-columns:160px 1fr;align-items:center;gap:12px;font-size:11.5px}
.gr .lab{color:#334155;font-family:"Noto Sans TC",sans-serif;font-weight:600}
.gr .track{
  position:relative;
  height:25px;
  overflow:hidden;
  border:1px solid #E2E8F0;
  border-radius:7px;
  background:
    linear-gradient(90deg,transparent 24.7%,#CBD5E1 25%,transparent 25.3%,transparent 49.7%,#CBD5E1 50%,transparent 50.3%,transparent 74.7%,#CBD5E1 75%,transparent 75.3%),
    #F1F5F9;
}
.gr .track i{
  position:absolute;
  top:3px;
  display:flex;
  align-items:center;
  height:17px;
  padding:0 7px;
  overflow:hidden;
  border-radius:4px;
  color:#FFF;
  font-family:"JetBrains Mono",monospace;
  font-size:9px;
  font-style:normal;
  font-weight:700;
  white-space:nowrap;
}
.bar{height:8px;overflow:hidden;border-radius:999px;background:#E2E8F0}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#64748B,#EA580C)}
.timeline-intro{
  position:relative;
  padding-left:19px;
}
.timeline-intro::before{
  position:absolute;
  left:5px;
  top:4px;
  bottom:4px;
  width:1px;
  background:#CBD5E1;
  content:"";
}
.timeline-intro::after{
  position:absolute;
  left:1px;
  top:5px;
  width:9px;
  height:9px;
  border:2px solid #FFF;
  border-radius:50%;
  background:var(--color-accent);
  box-shadow:0 0 0 1px var(--color-accent);
  content:"";
}
.grid-item{animation:item-in .42s cubic-bezier(.34,1.56,.64,1) both}
.grid-item:nth-child(2){animation-delay:.06s}
.grid-item:nth-child(3){animation-delay:.12s}
.grid-item:nth-child(4){animation-delay:.18s}
.grid-item:nth-child(5){animation-delay:.24s}
.grid-item:nth-child(6){animation-delay:.3s}
.grid-item:nth-child(7){animation-delay:.36s}
.grid-item:nth-child(8){animation-delay:.42s}
@keyframes item-in{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes room-in{from{opacity:0;transform:translate(-50%,-43%) rotateX(65deg) rotateZ(-38deg) scale(.9)}to{opacity:1;transform:translate(-50%,-50%) rotateX(61deg) rotateZ(-33deg) scale(1)}}

()=>`<div class="card" style="margin-bottom:16px"><h3><span class="material-symbols-outlined" aria-hidden="true">calendar_month</span>到貨交期甘特（8–10 月）<span class="tag t-bad" style="margin-left:auto">1 海運需留意</span></h3><div class="gantt"><div class="gr"><b></b><div style="display:flex;justify-content:space-between;font-family:'JetBrains Mono';font-size:9px;color:var(--muted)"><span>8月</span><span>9月初</span><span>9月底</span><span>10月</span></div></div>${GANTT.map(g=>`<div class="gr grid-item"><span class="lab">${g[0]}</span><div class="track"><i style="left:${g[1]}%;width:${g[2]-g[1]+8}%;background:${g[3]}">${g[4]}</i></div></div>`).join("")}</div><p style="font-size:11px;color:var(--muted);margin:14px 0 0">綠色為已到貨、橘色為訂製／備貨、紅色為進口海運；系統於進場安裝前 7 天自動提醒。</p></div>
<div class="two">
<div class="card"><h3><span class="material-symbols-outlined" aria-hidden="true">event</span>進場安裝排程</h3><div class="scroll"><table class="data"><tr><th>日期</th><th>工項</th><th>空間</th><th>狀態</th></tr>${[["8/26","壁磚泥作","玄關","t-ok","可進場"],["9/02","燈具安裝","餐廳","t-ok","可進場"],["9/16","木地板鋪設","客廳","t-warn","待到貨"],["9/24","大理石檯面","主衛","t-warn","待海運"]].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td><span class="tag ${r[3]}">${r[4]}</span></td></tr>`).join("")}</table></div></div>
<div class="card"><h3><span class="material-symbols-outlined" aria-hidden="true">insights</span>準時到貨率趨勢</h3><div class="chart" style="height:230px" id="c_arr"></div></div>
</div>`
];

function clearCharts(){
  chartInstances.forEach(c=>{try{c.dispose()}catch(e){}});
  chartInstances=[];
}
function draw(i){
  if(i===0){
    const el=document.getElementById("c_prog");
    if(el){
      const c=echarts.init(el);
      chartInstances.push(c);
      c.setOption({
        color:["#EA580C","#64748B","#94A3B8","#C6A47E"],
        tooltip:{trigger:"item"},
        legend:{bottom:0,textStyle:{fontFamily:"Inter",fontSize:10,color:"#475569"}},
        series:[{
          type:"pie",radius:["47%","70%"],center:["50%","43%"],avoidLabelOverlap:true,
          itemStyle:{borderColor:"#FFFFFF",borderWidth:3},
          label:{fontFamily:"Inter",fontSize:10,color:"#334155"},
          data:[
            {value:38,name:"客廳"},
            {value:26,name:"主臥"},
            {value:22,name:"廚衛"},
            {value:18,name:"玄關餐廳"}
          ]
        }]
      });
    }
  }
  if(i===5){
    const el=document.getElementById("c_arr");
    if(el){
      const c=echarts.init(el);
      chartInstances.push(c);
      c.setOption({
        grid:{left:42,right:15,top:20,bottom:27},
        tooltip:{trigger:"axis"},
        xAxis:{type:"category",boundaryGap:false,data:["5月","6月","7月","8月","9月","10月"],axisLine:{lineStyle:{color:"#CBD5E1"}},axisLabel:{fontFamily:"Inter",fontSize:10,color:"#475569"}},
        yAxis:{type:"value",min:60,max:100,splitLine:{lineStyle:{color:"#E2E8F0"}},axisLabel:{fontFamily:"Inter",fontSize:10,color:"#475569",formatter:"{value}%"}},
        series:[{
          name:"準時到貨率",type:"line",smooth:true,data:[71,78,83,88,91,94],
          symbolSize:7,
          areaStyle:{color:"rgba(234,88,12,.10)"},
          lineStyle:{color:"#EA580C",width:3},
          itemStyle:{color:"#EA580C",borderColor:"#FFFFFF",borderWidth:2}
        }]
      });
    }
  }
}
function show(i){
  clearCharts();
  nav.querySelectorAll("button").forEach(b=>{
    const active=+b.dataset.i===i;
    b.classList.toggle("on",active);
    b.setAttribute("aria-current",active?"page":"false");
  });
  vt.textContent=MOD[i][2];
  vd.textContent=MOD[i][3];
  view.innerHTML=SCREENS[i]();
  draw(i);
}
function fromHash(){
  const m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return}
  const n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
window.addEventListener("resize",()=>{
  chartInstances.forEach(c=>{try{c.resize()}catch(e){}});
});
fromHash();
</script>
</body>
