<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>獎懲考核管理系統 · 純 UI 展示</title>
<meta name="description" content="獎懲考核管理系統純 UI 展示：事件通報、簽核審理、點數規則、違規調查與統計分析。">
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --ok:#08786f;
  --warn:#a45304;
  --danger:#b91c1c;
  --info:#075985;
  --shadow:8px 8px 0 #134e4a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto}
body{
  min-width:320px;
  min-height:100vh;
  overflow-x:hidden;
  color:var(--ink);
  background-color:var(--color-background);
  background-image:
    linear-gradient(rgba(13,148,136,.1) 1px,transparent 1px),
    linear-gradient(90deg,rgba(13,148,136,.1) 1px,transparent 1px);
  background-size:32px 32px;
  font-family:"Crimson Pro","Noto Serif TC",Georgia,serif;
  font-size:17px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased
}
button{font:inherit}
button,[role=button],.tb,.badge{cursor:pointer}
button:focus-visible,[role=button]:focus-visible,.tb:focus-visible{
  outline:4px solid var(--color-accent);
  outline-offset:3px
}
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.sb{
  position:sticky;top:0;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;
  padding:20px 14px;
  color:#fff;
  background:var(--color-foreground);
  border-right:4px solid #000
}
.brand{
  display:flex;align-items:center;gap:12px;
  margin:0 0 22px;padding:0 4px 20px;
  border-bottom:2px solid var(--color-secondary)
}
.logo{
  width:46px;height:46px;flex:0 0 46px;
  display:grid;place-items:center;
  color:#000;background:var(--color-secondary);
  border:2px solid #000;box-shadow:4px 4px 0 #000
}
.logo svg{width:26px;height:26px}
.bt{font-family:Cinzel,"Crimson Pro",serif;font-size:16px;font-weight:600;letter-spacing:.04em}
.bs{margin-top:2px;color:#ccfbf1;font-family:"Cormorant Garamond",serif;font-size:13px;font-style:italic}
.nav{display:flex;flex-direction:column;gap:8px;list-style:none}
.nav button{
  width:100%;min-height:48px;
  display:flex;align-items:center;gap:11px;
  padding:10px 12px;
  color:#ecfeff;background:transparent;
  border:2px solid transparent;
  text-align:left;font-weight:600
}
.nav button svg{width:20px;height:20px;flex:0 0 auto}
.nav button:hover{color:#000;background:var(--color-secondary);border-color:#000}
.nav button.on{
  color:#000;background:var(--color-secondary);
  border-color:#000;box-shadow:4px 4px 0 #000
}
.idx{
  margin-left:auto;color:#99f6e4;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:12px;font-weight:700
}
.nav button:hover .idx,.nav button.on .idx{color:#000}
.sbfoot{
  margin-top:auto;padding:18px 6px 4px;
  color:#ccfbf1;border-top:2px solid var(--color-secondary);
  font-size:13px
}
.main{min-width:0}
.top{
  position:sticky;top:0;z-index:20;
  min-height:82px;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:14px 28px;
  background:#fff;border-bottom:4px solid var(--ink)
}
.top h1{
  font-family:Cinzel,"Crimson Pro",serif;
  font-size:22px;line-height:1.1;font-weight:600
}
.crumb{margin-top:5px;color:var(--muted);font-size:14px}
.rt{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill,.who{
  min-height:42px;display:flex;align-items:center;gap:8px;
  padding:6px 11px;background:var(--color-muted);
  border:2px solid var(--ink)
}
.pill{color:var(--ink);font-size:14px;font-weight:700}
.pill svg{width:18px;height:18px}
.av,.avatar{
  display:inline-grid;place-items:center;flex:0 0 auto;
  color:#000;background:var(--color-secondary);
  border:2px solid var(--ink);font-weight:700
}
.av{width:31px;height:31px}.avatar{width:30px;height:30px;font-size:13px}
.wn{font-weight:700;font-size:14px}.wr{color:var(--muted);font-size:12px}
.wrap{padding:28px 28px 56px}
.screen{animation:reveal .35s ease-out both}
.scr-h{
  position:relative;margin:0 0 24px;padding:20px 22px 20px 72px;
  color:#fff;background:var(--ink);
  border:3px solid #000;box-shadow:var(--shadow)
}
.scr-h:before{
  content:attr(data-n);position:absolute;left:16px;top:13px;
  color:var(--color-secondary);
  font-family:Cinzel,serif;font-size:38px;font-weight:600
}
.scr-h h2{
  display:flex;align-items:center;gap:10px;
  font-family:Cinzel,"Crimson Pro",serif;font-size:25px;font-weight:600
}
.scr-h h2 svg{width:25px;height:25px;color:var(--color-secondary)}
.scr-h p{max-width:830px;margin-top:5px;color:#ccfbf1;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.kpi{
  position:relative;min-width:0;padding:16px 16px 14px;
  background:#fff;border:3px solid var(--ink)
}
.kpi:nth-child(even){transform:translateY(7px)}
.kpi:before{content:"";position:absolute;right:-3px;bottom:-3px;width:34px;height:9px;background:var(--color-secondary);border:2px solid var(--ink)}
.kl{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:14px;font-weight:600}
.kl svg{width:18px;height:18px;color:var(--color-primary)}
.kv{
  margin-top:6px;font-family:Cinzel,"Crimson Pro",serif;
  font-size:34px;line-height:1;font-weight:600;
  font-variant-numeric:tabular-nums
}
.kv small{margin-left:4px;color:var(--muted);font-family:"Crimson Pro",serif;font-size:15px}
.kd{display:flex;align-items:center;gap:4px;margin-top:9px;font-size:13px;font-weight:700}
.kd svg{width:15px;height:15px}.up{color:var(--ok)}.down{color:var(--danger)}.flat{color:var(--muted)}
.g2,.g3,.g-side,.split,.board{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr)}
.g-side{grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr)}
.split{grid-template-columns:minmax(0,1.25fr) minmax(300px,1fr)}
.board{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{
  min-width:0;padding:18px;background:var(--color-card);
  border:3px solid var(--ink);box-shadow:5px 5px 0 rgba(19,78,74,.2)
}
.card:nth-child(even){border-top-color:var(--color-accent)}
.card.pad0{padding:0;overflow:hidden}
.ch{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.ch svg{width:20px;height:20px;color:var(--color-primary)}
.ch h3{font-family:Cinzel,"Crimson Pro",serif;font-size:16px;font-weight:600}
.tag{margin-left:auto;color:var(--muted);font-size:13px;font-weight:600}
.chart{width:100%;height:270px}.chart.sm{height:220px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{
  padding:11px 13px;color:#fff;background:var(--ink);
  border:1px solid #fff;text-align:left;white-space:nowrap;
  font-family:"Crimson Pro",serif;font-size:13px;font-weight:600;letter-spacing:.04em
}
td{padding:11px 13px;border:1px solid var(--line);white-space:nowrap}
tbody tr:nth-child(even){background:#f0fdfa}
tbody tr:hover{background:#ccfbf1}
td:first-child,.mono{
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-variant-numeric:tabular-nums
}
th:nth-child(n+3),td.num{text-align:right;font-variant-numeric:tabular-nums}
.badge{
  display:inline-flex;align-items:center;gap:5px;
  min-height:25px;padding:2px 8px;
  color:var(--ink);background:var(--color-muted);
  border:1px solid currentColor;font-size:12px;font-weight:700
}
.badge:before{content:"•";font-size:15px;line-height:1}
.b-ok{color:#065f46;background:#d1fae5}.b-ok:before{content:"✓"}
.b-warn{color:#78350f;background:#fef3c7}.b-warn:before{content:"!"}
.b-danger{color:#991b1b;background:#fee2e2}.b-danger:before{content:"×"}
.b-info{color:#075985;background:#e0f2fe}.b-info:before{content:"i"}
.b-mute{color:#334155;background:#e2e8f0}
.reward{color:#047857;font-weight:700}.penal{color:#b91c1c;font-weight:700}
.person{display:flex;align-items:center;gap:9px}
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:3px;background:var(--ink)}
.tli{position:relative;padding:0 0 20px 7px}
.tli:last-child{padding-bottom:0}
.tli:before{
  content:"";position:absolute;left:-24px;top:3px;width:14px;height:14px;
  background:#fff;border:3px solid var(--color-primary)
}
.tli.pn:before{border-color:var(--danger)}.tli.wn:before{border-color:var(--color-accent)}
.tt{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-weight:700;font-size:15px}
.td,.ttime{color:var(--muted)}.td{margin-top:3px;font-size:14px}.ttime{font:12px ui-monospace,monospace}
.field{margin-bottom:15px}
.fl{margin-bottom:4px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.fv{font-size:15px;font-weight:600}
.evbox{
  display:flex;align-items:center;gap:10px;padding:11px;
  color:var(--muted);background:var(--color-muted);
  border:2px dashed var(--ink);font-size:14px
}
.evbox svg{width:23px;height:23px;color:var(--color-primary);flex:0 0 auto}
.step-row{display:flex;margin:9px 0 18px}
.step{position:relative;flex:1;min-width:75px;padding-top:29px;text-align:center}
.step:before{content:"";position:absolute;top:10px;left:50%;width:100%;height:3px;background:var(--line)}
.step:last-child:before{display:none}
.sc{
  position:absolute;z-index:1;top:1px;left:calc(50% - 11px);
  width:23px;height:23px;display:grid;place-items:center;
  color:var(--muted);background:#fff;border:2px solid var(--ink);
  font:700 11px ui-monospace,monospace
}
.step.done .sc{color:#000;background:var(--color-secondary)}
.step.cur .sc{color:#000;background:var(--color-accent);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ink)}
.st{color:var(--muted);font-size:12px;font-weight:700}.done .st,.cur .st{color:var(--ink)}
.rule-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:2px solid var(--line)}
.rule-item:last-child{border-bottom:0}
.rule-ic{
  width:40px;height:40px;display:grid;place-items:center;flex:0 0 40px;
  color:#000;background:var(--color-secondary);border:2px solid var(--ink)
}
.rule-ic.pn{color:#fff;background:var(--danger)}.rule-ic svg{width:21px;height:21px}
.rule-tt{font-weight:700}.rule-dd{color:var(--muted);font-size:14px}.pts{font-weight:700;white-space:nowrap}
.miniList{display:flex;flex-direction:column;gap:9px;list-style:none}
.miniList li{display:flex;align-items:center;gap:9px;font-size:14px}
.miniList li svg{width:20px;height:20px;color:var(--color-primary);flex:0 0 auto}
.mn{margin-left:auto}
.pbar{width:120px;height:12px;background:#cbd5e1;border:1px solid var(--ink)}
.pbar span{display:block;height:100%;background:var(--color-primary)}
.pbar.pn span{background:var(--danger)}
.klane{min-width:0;padding:12px;background:var(--color-muted);border:3px solid var(--ink)}
.klane:nth-child(even){transform:translateY(12px)}
.lh{display:flex;align-items:center;gap:7px;margin-bottom:12px;font-weight:700}
.lh svg{width:20px;height:20px}.cnt{margin-left:auto;padding:1px 8px;background:#fff;border:2px solid var(--ink)}
.kcard{margin-bottom:10px;padding:11px;background:#fff;border:2px solid var(--ink);border-left:8px solid var(--color-primary)}
.kcard:last-child{margin-bottom:0}.kcard.pn{border-left-color:var(--danger)}.kcard.wn{border-left-color:var(--color-accent)}.kcard.rw{border-left-color:var(--color-secondary)}
.kt{font-weight:700;font-size:14px}.km{margin-top:4px;color:var(--muted);font-size:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:13px}
.legend span{display:flex;align-items:center;gap:5px}.dot{width:10px;height:10px;border:2px solid var(--ink)}
.tabbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:17px}
.tb{
  min-height:40px;padding:7px 14px;color:var(--ink);
  background:#fff;border:2px solid var(--ink);font-weight:700
}
.tb:hover,.tb.on{color:#000;background:var(--color-secondary);box-shadow:3px 3px 0 var(--ink)}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1100px){
  .kpis,.board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3,.g-side{grid-template-columns:1fr}
}
@media(max-width:860px){
  .app{display:block}
  .sb{position:static;width:100%;height:auto;padding:12px;border-right:0;border-bottom:4px solid #000}
  .brand{margin-bottom:10px;padding-bottom:12px}
  .nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .sbfoot{display:none}
  .top{position:static;padding:13px 16px}
  .wrap{padding:20px 16px 44px}
}
@media(max-width:700px){
  .g2,.split{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .klane:nth-child(even),.kpi:nth-child(even){transform:none}
}
@media(max-width:520px){
  .nav{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nav button{padding:9px}
  .idx{display:none}
  .rt{width:100%;margin-left:0}.pill{flex:1}
  .scr-h{padding:18px}.scr-h:before{display:none}
  .scr-h h2{font-size:21px}
  .kpis{grid-template-columns:1fr 1fr;gap:9px}
  .kpi{padding:13px}.kv{font-size:27px}
}
@media(max-width:375px){
  .kpis{grid-template-columns:1fr}
  .nav button{font-size:14px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>
<div class="app">
<aside class="sb">
  <div class="brand">
    <div class="logo" id="brandIcon"></div>
    <div><div class="bt">獎懲考核平台</div><div class="bs">Rewards &amp; Disciplinary</div></div>
  </div>
  <nav aria-label="主要導覽"><ul class="nav" id="nav"></ul></nav>
  <div class="sbfoot">純 UI 展示 · 擬真資料<br>© 2026 智慧製造 HR 平台</div>
</aside>
<main class="main">
  <header class="top">
    <div><h1 id="tTitle">獎懲總覽</h1><div class="crumb" id="tCrumb">獎懲考核管理系統 / 總覽</div></div>
    <div class="rt">
      <span class="pill"><span data-icon="shield"></span>稽核軌跡已啟用</span>
      <div class="who"><div class="av">陳</div><div><div class="wn">陳婉如</div><div class="wr">人資經理</div></div></div>
    </div>
  </header>
  <div class="wrap"><div id="screen" class="screen"></div></div>
</main>
</div>
<script>
"use strict";
var ICONS={
 balance:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M5 6h14M7 6l-4 8h8L7 6Zm10 0-4 8h8l-4-8ZM8 21h8" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
 dashboard:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v7H4V4Zm10 0h6v4h-6V4ZM4 15h6v5H4v-5Zm10-3h6v8h-6v-8Z" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
 file:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6V3Zm9 0v5h4M9 12h7M9 16h7" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
 check:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4V4Zm4 8 3 3 6-7" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
 award:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="m8 14-2 7 6-3 6 3-2-7M9 9l2 2 4-4" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
 gavel:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 5 6 6M10 8l6 6M4 20l9-9M3 21h10" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
 chart:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10m6 10V4m6 16v-7m4 7H2" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
 shield:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 20 6v6c0 5-3 8-8 10-5-2-8-5-8-10V6l8-3Zm-4 9 3 3 5-6" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
 clock:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v6l4 2" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
 alert:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 21h20L12 3Zm0 6v5m0 3v2" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
 people:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 20v-2c0-3 2-5 6-5s6 2 6 5v2M16 5a3 3 0 0 1 0 6m1 3c3 0 4 2 4 5" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
 search:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15 15 6 6" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
 trend:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 17 6-6 4 4 8-9m-6 0h6v6" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
 image:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="10" r="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="m4 18 5-5 3 3 3-3 5 5" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
 tool:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 6a5 5 0 0 0-6 6L3 17l4 4 5-5a5 5 0 0 0 6-6l-3 3-3-3 2-4Z" fill="none" stroke="currentColor" stroke-width="2"/></svg>'
};
function icon(n){return ICONS[n]||ICONS.dashboard}
document.getElementById("brandIcon").innerHTML=icon("balance");
document.querySelectorAll("[data-icon]").forEach(function(x){x.innerHTML=icon(x.dataset.icon)});

var MODS=[
 {icon:"dashboard",name:"獎懲總覽",crumb:"總覽"},
 {icon:"file",name:"事件通報",crumb:"事件通報"},
 {icon:"check",name:"簽核審理",crumb:"簽核審理"},
 {icon:"award",name:"點數規則",crumb:"點數規則"},
 {icon:"gavel",name:"違規調查",crumb:"違規調查"},
 {icon:"chart",name:"統計分析",crumb:"統計分析"}
];
var CUR=-1,charts=[];
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function disposeCharts(){charts.forEach(function(c){try{c.dispose()}catch(e){}});charts=[]}
function mkChart(id,opt){var n=document.getElementById(id);if(!n)return;try{var c=echarts.init(n);c.setOption(opt);charts.push(c)}catch(e){}}

function ch(ic,title,tag){return '<div class="ch">'+icon(ic)+'<h3>'+title+'</h3>'+(tag?'<span class="tag">'+tag+'</span>':'')+'</div>'}
function badge(type,text){return '<span class="badge '+type+'">'+text+'</span>'}
function kpi(ic,label,val,unit,delta,dir){
 return '<div class="kpi"><div class="kl">'+icon(ic)+label+'</div><div class="kv">'+val+'<small>'+unit+'</small></div>'+
 (delta?'<div class="kd '+dir+'">'+icon("trend")+delta+'</div>':'')+'</div>'
}
function timeline(kind,title,desc,time){
 var cls=kind==="danger"?"pn":kind==="warn"?"wn":"";
 var bm={ok:"b-ok",danger:"b-danger",warn:"b-warn",info:"b-info"}[kind]||"b-mute";

}

function show(i){

 disposeCharts();CUR=i;
 var m=MODS[i]||MODS[0];
 document.getElementById("tTitle").textContent=m.name;

 document.querySelectorAll("[data-i]").forEach(function(b){
  var on=Number(b.dataset.i)===i;b.classList.toggle("on",on);b.setAttribute("aria-current",on?"page":"false")
 });
