<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>獎懲考核管理系統 · 純 UI 展示</title>
<meta name="description" content="獎懲考核管理系統純 UI 展示：事件通報、簽核審理、點數規則、違規調查與統計分析。"/>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#15803d; --accent2:#4ade80; --bg:#f1f5f4; --card:#ffffff;
  --ink:#14201a; --sub:#5c6b64; --line:#e2ebe6; --side:#0f2a1c; --side2:#173d2a;
  --warn:#d97706; --danger:#dc2626; --ok:#15803d; --info:#0369a1;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:'Inter','Noto Sans TC',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh;align-items:stretch}
.sb{width:248px;flex:0 0 248px;background:linear-gradient(180deg,var(--side),var(--side2));color:#e8f5ee;display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px 18px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:16px}
.brand .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#06210f;flex:0 0 40px}
.brand .logo .material-symbols-outlined{font-size:24px}
.brand .bt{font-weight:900;font-size:15px;letter-spacing:.3px}
.brand .bs{font-size:11px;color:#8fbfa4;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:5px;list-style:none}
.nav button{width:100%;display:flex;align-items:center;gap:12px;padding:11px 13px;border:0;background:transparent;color:#cfe6da;font-family:inherit;font-size:14px;font-weight:600;border-radius:10px;cursor:pointer;text-align:left;transition:.15s;min-width:0}
.nav button .material-symbols-outlined{font-size:21px;flex:0 0 auto}
.nav button .idx{margin-left:auto;font-size:11px;color:#6f9a82;font-weight:700}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:linear-gradient(135deg,var(--accent),#1a9748);color:#fff;box-shadow:0 6px 16px -6px rgba(21,128,61,.7)}
.nav button.on .idx{color:#c7f5d8}
.sbfoot{margin-top:auto;padding:14px 8px 4px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:#7ba98d}
.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:16px 26px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.top h1{font-size:18px;font-weight:800;letter-spacing:.2px}
.top .crumb{font-size:12px;color:var(--sub);margin-top:3px}
.top .rt{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:#e7f5ec;color:var(--accent);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700}
.pill .material-symbols-outlined{font-size:16px}
.who{display:flex;align-items:center;gap:9px;background:#f4f8f6;border:1px solid var(--line);padding:5px 12px 5px 6px;border-radius:999px}
.who .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06210f;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.who .wn{font-size:12px;font-weight:700}.who .wr{font-size:11px;color:var(--sub)}
.wrap{padding:24px 26px 48px;min-width:0}
.scr-h{margin-bottom:20px}
.scr-h h2{font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px}
.scr-h h2 .material-symbols-outlined{color:var(--accent);font-size:24px}
.scr-h p{color:var(--sub);font-size:13px;margin-top:5px;max-width:760px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.g-side{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.split{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;min-width:0}
.card.pad0{padding:0;overflow:hidden}
.ch{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.ch h3{font-size:14px;font-weight:800}
.ch .material-symbols-outlined{font-size:19px;color:var(--accent)}
.ch .tag{margin-left:auto;font-size:11px;color:var(--sub);font-weight:600}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;min-width:0;position:relative;overflow:hidden}
.kpi .kl{font-size:12px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .kl .material-symbols-outlined{font-size:17px;color:var(--accent)}
.kpi .kv{font-size:27px;font-weight:800;margin-top:9px;letter-spacing:-.5px}
.kpi .kv small{font-size:13px;color:var(--sub);font-weight:600;margin-left:3px}
.kpi .kd{font-size:11px;margin-top:6px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.kd.up{color:var(--ok)}.kd.down{color:var(--danger)}.kd.flat{color:var(--sub)}
.kpi .kbar{position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent),var(--accent2))}
.chart{width:100%;height:270px;overflow:hidden}
.chart.sm{height:220px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:10px 14px;border-bottom:2px solid var(--line);white-space:nowrap;background:#fafcfb}
td{padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f6faf8}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.b-ok{background:#e7f5ec;color:var(--ok)}
.b-warn{background:#fef3e2;color:var(--warn)}
.b-danger{background:#fde8e8;color:var(--danger)}
.b-info{background:#e4f1f9;color:var(--info)}
.b-mute{background:#eef2f0;color:var(--sub)}
.b-purple{background:#efe7fb;color:#7c3aed}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.reward{color:var(--ok);font-weight:800}
.penal{color:var(--danger);font-weight:800}
.avatar{width:28px;height:28px;border-radius:50%;background:#dcefe4;color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:0 0 28px}
.person{display:flex;align-items:center;gap:9px}
.klane{background:#f6faf8;border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.klane .lh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;margin-bottom:11px}
.klane .lh .cnt{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11px;color:var(--sub)}
.kcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:10px;border-left:3px solid var(--accent)}
.kcard:last-child{margin-bottom:0}
.kcard .kt{font-size:13px;font-weight:700;margin-bottom:5px}
.kcard .km{font-size:11px;color:var(--sub);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kcard.rw{border-left-color:var(--accent2)}
.kcard.pn{border-left-color:var(--danger)}
.kcard.wn{border-left-color:var(--warn)}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tli{position:relative;padding:0 0 20px 6px}
.tli:last-child{padding-bottom:0}
.tli::before{content:"";position:absolute;left:-22px;top:3px;width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.tli.pn::before{border-color:var(--danger)}
.tli.wn::before{border-color:var(--warn)}
.tli .tt{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tli .td{font-size:12px;color:var(--sub);margin-top:3px}
.tli .ttime{font-size:11px;color:#9aa8a1;margin-top:3px}
.pbar{height:8px;background:#eef2f0;border-radius:6px;overflow:hidden}
.pbar>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:6px}
.pbar.pn>span{background:linear-gradient(90deg,#ef4444,#f87171)}
.rule-item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.rule-item:last-child{border-bottom:0}
.rule-ic{width:38px;height:38px;border-radius:11px;background:#e7f5ec;color:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 38px}
.rule-ic.pn{background:#fde8e8;color:var(--danger)}
.rule-tt{font-size:13px;font-weight:700}
.rule-dd{font-size:12px;color:var(--sub);margin-top:2px}
.pts{font-size:13px;font-weight:800;white-space:nowrap}
.field{margin-bottom:13px}
.field .fl{font-size:11px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
.field .fv{font-size:13px;font-weight:600}
.evbox{background:#f6faf8;border:1px dashed var(--line);border-radius:11px;padding:11px;font-size:12px;color:var(--sub);display:flex;align-items:center;gap:9px}
.evbox .material-symbols-outlined{color:var(--accent);font-size:22px;flex:0 0 auto}
.step-row{display:flex;gap:0;margin:6px 0 18px;flex-wrap:wrap}
.step{flex:1 1 0;min-width:88px;text-align:center;position:relative;padding-top:26px}
.step::before{content:"";position:absolute;top:9px;left:50%;width:100%;height:2px;background:var(--line);z-index:0}
.step:last-child::before{display:none}
.step .sc{position:absolute;top:2px;left:calc(50% - 10px);width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--sub);z-index:1}
.step.done .sc{background:var(--accent);border-color:var(--accent);color:#fff}
.step.cur .sc{background:#fff;border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px #dcefe4}
.step .st{font-size:11px;font-weight:700;color:var(--sub)}
.step.done .st,.step.cur .st{color:var(--ink)}
.miniList{list-style:none;display:flex;flex-direction:column;gap:10px}
.miniList li{display:flex;align-items:center;gap:10px;font-size:13px}
.miniList .mn{margin-left:auto;font-weight:800;flex:0 0 auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tabbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabbar .tb{padding:7px 14px;border:1px solid var(--line);background:#fff;border-radius:999px;font-size:12px;font-weight:700;color:var(--sub)}
.tabbar .tb.on{background:var(--accent);color:#fff;border-color:var(--accent)}
@media(max-width:1100px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .board{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .sb{width:100%;flex:0 0 auto;height:auto;position:static;flex-direction:column;padding:12px}
  .brand{padding-bottom:12px;margin-bottom:10px}
  .nav{flex-direction:row;flex-wrap:wrap;gap:7px}
  .nav button{width:auto;flex:0 0 auto;padding:9px 13px}
  .nav button .idx{display:none}
  .sbfoot{display:none}
}
@media(max-width:820px){
  .g2,.g3,.g-side,.split{grid-template-columns:1fr}
}
@media(max-width:560px){
  .kpis{grid-template-columns:1fr 1fr}
  .board{grid-template-columns:1fr 1fr}
  .nav button .ntx{display:none}
  .nav button{padding:9px 11px}
  .wrap{padding:16px 14px 40px}
  .top{padding:13px 16px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sb">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">balance</span></div>
      <div>
        <div class="bt">獎懲考核平台</div>
        <div class="bs">Rewards &amp; Disciplinary</div>
      </div>
    </div>
    <nav><ul class="nav" id="nav"></ul></nav>
    <div class="sbfoot">
      純 UI 展示 · 擬真資料<br/>© 2026 智慧製造 HR 平台
    </div>
  </aside>
  <div class="main">
    <div class="top">
      <div>
        <h1 id="tTitle">獎懲總覽</h1>
        <div class="crumb" id="tCrumb">獎懲考核管理系統 / 總覽</div>
      </div>
      <div class="rt">
        <span class="pill"><span class="material-symbols-outlined">verified_user</span> 稽核軌跡已啟用</span>
        <div class="who">
          <div class="av">陳</div>
          <div><div class="wn">陳婉如</div><div class="wr">人資經理</div></div>
        </div>
      </div>
    </div>
    <div class="wrap"><div id="screen"></div></div>
  </div>
</div>
<script>
"use strict";
var MODS=[
  {icon:"dashboard",name:"獎懲總覽",crumb:"總覽"},
  {icon:"description",name:"事件通報",crumb:"事件通報"},
  {icon:"fact_check",name:"簽核審理",crumb:"簽核審理"},
  {icon:"verified",name:"點數規則",crumb:"點數規則"},
  {icon:"gavel",name:"違規調查",crumb:"違規調查"},
  {icon:"insights",name:"統計分析",crumb:"統計分析"}
];
var CUR=-1, chartReg=[];
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function disposeCharts(){for(var i=0;i<chartReg.length;i++){try{chartReg[i].dispose();}catch(e){}}chartReg=[];}
function mkChart(id,opt){var node=document.getElementById(id);if(!node)return;try{var ch=echarts.init(node);ch.setOption(opt);chartReg.push(ch);}catch(e){}}

function kpi(ic,label,val,unit,delta,dir){
  var dd=delta?'<div class="kd '+dir+'"><span class="material-symbols-outlined" style="font-size:14px">'+(dir==="up"?"trending_up":dir==="down"?"trending_down":"trending_flat")+'</span>'+delta+'</div>':'';
  return '<div class="kpi"><span class="kbar"></span><div class="kl"><span class="material-symbols-outlined">'+ic+'</span>'+label+'</div>'
    +'<div class="kv">'+val+'<small>'+unit+'</small></div>'+dd+'</div>';
}
function tli(kind,tt,td,tm){
  var cls=kind==="danger"?"pn":kind==="warn"?"wn":"";
  var bm={ok:"b-ok",danger:"b-danger",warn:"b-warn",info:"b-info"}[kind]||"b-mute";
  return '<div class="tli '+cls+'"><div class="tt">'+esc(tt)+' <span class="badge '+bm+'">'+tm+'</span></div><div class="td">'+esc(td)+'</div></div>';
}
function step(state,n,t){return '<div class="step '+state+'"><div class="sc">'+(state==="done"?"✓":n)+'</div><div class="st">'+t+'</div></div>';}

/* SCREEN 0 : 獎懲總覽 */
function s0(c){
  c.innerHTML=
  '<div class="scr-h"><h2><span class="material-symbols-outlined">dashboard</span>獎懲總覽</h2><p>本月獎懲案件即時看板，聚焦處理時效、點數異動與待簽核事項。</p></div>'
  +'<div class="kpis">'
    +kpi("military_tech","本月獎勵案","62","件","+8 較上月","up")
    +kpi("gavel","本月懲處案","19","件","-5 較上月","up")
    +kpi("timer","平均處理時效","2.1","天","-0.7 天","up")
    +kpi("campaign","申訴成立率","11.4","%","-2.1%","up")
  +'</div>'
  +'<div class="g3">'
    +'<div class="card"><div class="ch"><span class="material-symbols-outlined">stacked_bar_chart</span><h3>近 6 個月獎懲件數趨勢</h3><span class="tag">獎勵 / 懲處</span></div><div id="c0a" class="chart"></div></div>'
    +'<div class="card"><div class="ch"><span class="material-symbols-outlined">donut_large</span><h3>案件類別占比</h3></div><div id="c0b" class="chart"></div></div>'
  +'</div>'
  +'<div class="g-side" style="margin-top:16px">'
    +'<div class="card pad0"><div class="ch" style="padding:16px 18px 0"><span class="material-symbols-outlined">pending_actions</span><h3>待處理案件</h3><span class="tag">依時效排序</span></div>'
      +'<div style="overflow-x:auto"><table><thead><tr><th>案號</th><th>對象</th><th>類型</th><th>階段</th><th>剩餘時效</th></tr></thead><tbody>'
      +row0("RD-2409-118","黃志明 / 沖壓一課","懲處","主管簽核","warn","即將逾期 6h")
      +row0("RD-2409-121","林佩珊 / 品保課","獎勵","人資審核","ok","1.8 天")
      +row0("RD-2409-124","吳建豪 / 組裝二課","懲處","事件通報","danger","已逾期 4h")
      +row0("RD-2409-127","張雅婷 / 物流課","獎勵","人資審核","ok","2.4 天")
      +row0("RD-2409-130","王大維 / 沖壓二課","懲處","員工申訴","info","申訴審理中")
      +'</tbody></table></div></div>'
    +'<div class="card"><div class="ch"><span class="material-symbols-outlined">notifications_active</span><h3>異常提醒</h3></div>'
      +'<div class="tl">'
      +tli("danger","懲處案逾期未簽","組裝二課 RD-2409-124 已逾標準時效，請主管盡速處理。","10 分鐘前")
      +tli("warn","點數即將扣抵升遷","黃志明累計懲處點數達 -8，觸及升遷凍結門檻。","1 小時前")
      +tli("ok","獎勵案批次核定","品保課 5 件提案改善獎勵已完成建檔。","3 小時前")
      +tli("warn","申訴期限提醒","王大維申訴案將於明日到期，須完成覆核。","今天 09:20")
      +'</div></div>'
  +'</div>';
  void c.offsetHeight;
  mkChart("c0a",barTrend());
  mkChart("c0b",pieCat());
}
function row0(no,who,type,stage,st,tm){
  var tb=type==="獎勵"?'<span class="badge b-ok">獎勵</span>':'<span class="badge b-danger">懲處</span>';
  var sm={ok:"b-ok",warn:"b-warn",danger:"b-danger",info:"b-info"}[st]||"b-mute";
  return '<tr><td style="font-weight:700">'+no+'</td><td>'+who+'</td><td>'+tb+'</td><td>'+stage+'</td><td><span class="badge '+sm+'">'+tm+'</span></td></tr>';
}

/* SCREEN 1 : 事件通報 */
function s1(c){
  c.innerHTML=
  '<div class="scr-h"><h2><span class="material-symbols-outlined">description</span>事件通報</h2><p>提報獎勵或違規事件：填寫對象、事由與適用條款，上傳佐證後系統自動歸類獎懲類別並產生案號。</p></div>'
  +'<div class="split">'

/* router */
var SCR=[s0,s1,s2,s3,s4,s5];
function buildNav(){
  var nav=document.getElementById("nav");
  var h="";
  for(var i=0;i<MODS.length;i++){
    var idx=(i+1<10?"0":"")+(i+1);
    h+='<li><button data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span>'
      +'<span class="ntx">'+MODS[i].name+'</span><span class="idx">'+idx+'</span></button></li>';
  }
  nav.innerHTML=h;
  var btns=nav.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){window.location.hash="go="+this.getAttribute("data-i");});
  }
}
function show(i){
  if(i===CUR)return;
  disposeCharts();
  CUR=i;
  var m=MODS[i]||MODS[0];
  document.getElementById("tTitle").textContent=m.name;
  document.getElementById("tCrumb").textContent="獎懲考核管理系統 / "+m.crumb;
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i);}
  var cnt=document.getElementById("screen");
  (SCR[i]||s0)(cnt);
}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
