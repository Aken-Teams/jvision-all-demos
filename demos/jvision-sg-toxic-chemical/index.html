<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>毒性化學物質運作與申報 · ESG 永續管理系統</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000;
  --color-secondary:#10b981;
  --color-on-secondary:#0f172a;
  --color-accent:#059669;
  --color-on-accent:#000;
  --color-background:#ecfdf5;
  --color-foreground:#064e3b;
  --color-card:#fff;
  --color-card-foreground:#064e3b;
  --color-muted:#e8f1f3;
  --color-muted-foreground:#475569;
  --color-border:#a7f3d0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#059669;
  --blue:#059669;
  --ink:#064e3b;
  --muted:#475569;
  --line:#a7f3d0;
  --gold:#b45309;
  --gold-soft:#fef3c7;
  --green-soft:#d1fae5;
  --red-soft:#fee2e2;
  --slate-soft:#f1f5f9;
  --shadow:0 12px 34px rgba(6,78,59,.08);
  --shadow-hover:0 17px 42px rgba(6,78,59,.13);
  --radius:20px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  color:var(--ink);
  background:
    radial-gradient(circle at 92% 4%,rgba(16,185,129,.13),transparent 24rem),
    radial-gradient(circle at 4% 86%,rgba(5,150,105,.08),transparent 27rem),
    var(--color-background);
  font:400 14px/1.55 "Fira Sans","Noto Sans TC",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;font-family:"Fira Sans","Noto Sans TC",sans-serif}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
  border-radius:10px;
}
.app{display:flex;min-height:100vh}
.sidebar{
  position:sticky;
  top:0;
  z-index:30;
  width:264px;
  height:100vh;
  flex:none;
  display:flex;
  flex-direction:column;
  padding:24px 16px;
  color:#ecfdf5;
  overflow:hidden;
  background:
    radial-gradient(circle at 15% 5%,rgba(167,243,208,.18),transparent 13rem),
    linear-gradient(165deg,#053d31 0%,#064e3b 47%,#03392e 100%);
  border-right:1px solid rgba(167,243,208,.22);
}
.sidebar::after{
  content:"";
  position:absolute;
  right:-90px;
  bottom:-80px;
  width:240px;
  height:190px;
  border:1px solid rgba(167,243,208,.16);
  border-radius:55% 45% 68% 32%;
  transform:rotate(-18deg);
  pointer-events:none;
}
.brand{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  gap:12px;
  padding:4px 8px 24px;
}
.brand-logo{
  width:44px;
  height:44px;
  flex:none;
  display:grid;
  place-items:center;
  color:#02382c;
  background:linear-gradient(145deg,#a7f3d0,#34d399);
  border:1px solid rgba(255,255,255,.35);
  border-radius:15px 22px 15px 22px;
  box-shadow:0 10px 25px rgba(0,0,0,.18);
}
.brand-logo .material-symbols-outlined{font-size:24px}
.brand-txt{min-width:0}
.brand-txt b{
  display:block;
  font-size:16px;
  font-weight:800;
  letter-spacing:.03em;
  white-space:nowrap;
}
.brand-txt span{
  display:block;
  margin-top:2px;
  color:#a7f3d0;
  font:600 10px/1.2 "Fira Code",monospace;
  letter-spacing:.14em;
}
.nav{
  position:relative;
  z-index:1;
  display:flex;
  flex-direction:column;
  gap:7px;
}
.nav button{
  position:relative;
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  min-height:45px;
  padding:10px 12px;
  color:#d1fae5;
  text-align:left;
  background:transparent;
  border:1px solid transparent;
  border-radius:12px 18px 12px 18px;
  transition:background-color .2s,border-color .2s,transform .2s,color .2s;
}
.nav button:hover{
  color:#fff;
  background:rgba(255,255,255,.09);
  border-color:rgba(167,243,208,.18);
  transform:translateX(2px);
}
.nav button.on{
  color:#022c22;
  background:linear-gradient(135deg,#d1fae5,#6ee7b7);
  border-color:#a7f3d0;
  box-shadow:0 10px 24px rgba(0,0,0,.16);
}
.nav button .material-symbols-outlined{font-size:20px;flex:none}
.nav .txt{min-width:0;font-weight:600}
.nav .idx{
  margin-left:auto;
  font:600 10px/1 "Fira Code",monospace;
  opacity:.7;
}
.side-foot{
  position:relative;
  z-index:1;
  margin-top:auto;
  padding:16px 10px 4px;
  color:#a7f3d0;
  border-top:1px solid rgba(167,243,208,.18);
  font-size:11px;
  line-height:1.75;
}
.side-foot b{color:#fff;font-family:"Fira Code",monospace}
.main{flex:1;min-width:0;padding:28px 30px 64px}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  max-width:1540px;
  margin:0 auto 20px;
  padding:5px 2px 17px;
  border-bottom:1px solid rgba(5,150,105,.18);
}
.topbar h1{
  display:flex;
  align-items:center;
  gap:10px;
  color:#053d31;
  font-size:23px;
  font-weight:800;
  letter-spacing:-.02em;
}
.topbar h1 .material-symbols-outlined{
  display:grid;
  place-items:center;
  width:36px;
  height:36px;
  color:#047857;
  background:#d1fae5;
  border:1px solid var(--line);
  border-radius:11px 16px 11px 16px;
  font-size:21px;
}
.topbar .sub{margin:5px 0 0 46px;color:var(--muted);font-size:12.5px}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:9px;flex-wrap:wrap}
.chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:34px;
  padding:6px 11px;
  color:#334155;
  background:rgba(255,255,255,.85);
  border:1px solid rgba(5,150,105,.2);
  border-radius:999px;
  box-shadow:0 4px 14px rgba(6,78,59,.04);
  font-size:11.5px;
  font-weight:600;
}
.chip .dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#059669;
  border:2px solid #d1fae5;
  box-shadow:0 0 0 2px #059669;
  animation:pulse 2.2s ease-in-out infinite;
}
.avatar{
  width:36px;
  height:36px;
  display:grid;
  place-items:center;
  flex:none;
  color:#fff;
  background:linear-gradient(145deg,#047857,#059669);
  border:2px solid #a7f3d0;
  border-radius:50%;
  font-weight:700;
}
#screen{max-width:1540px;margin:auto}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.tile,.kpi,.stat{
  color:var(--color-card-foreground);
  background:rgba(255,255,255,.94);
  border:1px solid rgba(5,150,105,.2);
  box-shadow:var(--shadow);
}
.card,.sec{
  min-width:0;
  padding:18px;
  border-radius:18px 24px 18px 24px;
}
.card{transition:box-shadow .2s,border-color .2s,transform .2s}
.card:hover{border-color:rgba(5,150,105,.36);box-shadow:var(--shadow-hover)}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  min-height:32px;
  margin-bottom:14px;
  padding-bottom:11px;
  border-bottom:1px solid rgba(5,150,105,.14);
}
.card.pad0 .card-h,.card.p0 .card-h{border-bottom:0}
.card-h h3,.sec>h3{
  display:flex;
  align-items:center;
  gap:8px;
  color:#064e3b;
  font-size:14px;
  font-weight:700;
}
.card-h h3 .material-symbols-outlined,.sec>h3 .material-symbols-outlined{
  color:#059669;
  font-size:19px;
}
.card-h .hint{color:var(--muted);font-size:11px}
.sec{margin-bottom:16px}
.sec>h3{margin-bottom:13px}
.sec>p{margin:0 0 13px;color:var(--muted)}
.tile{
  position:relative;
  min-width:0;
  min-height:150px;
  display:grid;
  grid-template-columns:42px 1fr;
  grid-template-rows:auto auto 1fr;
  gap:5px 12px;
  padding:17px;
  overflow:hidden;
  border-radius:18px 27px 18px 27px;
  transition:transform .2s,box-shadow .2s,border-color .2s;
}
.tile::after{
  content:"";
  position:absolute;
  right:-27px;
  bottom:-32px;
  width:100px;
  height:85px;
  background:linear-gradient(145deg,rgba(167,243,208,.5),rgba(209,250,229,.1));
  border-radius:60% 40% 68% 32%;
  transform:rotate(-18deg);
}
.tile:hover{
  transform:translateY(-2px);
  border-color:rgba(5,150,105,.4);
  box-shadow:var(--shadow-hover);
}
.tile .ti{
  grid-row:1/3;
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  color:#047857;
  background:linear-gradient(145deg,#d1fae5,#ecfdf5);
  border:1px solid #a7f3d0;
  border-radius:13px 19px 13px 19px;
}
.tile .ti .material-symbols-outlined{font-size:21px}
.tile b{align-self:end;font-size:13px;font-weight:700}
.tile .tv{
  position:relative;
  z-index:1;
  align-self:start;
  color:#053d31;
  font:700 24px/1.2 "Fira Code",monospace;
  letter-spacing:-.04em;
}
.tile .tv b{font:inherit}
.tile p{
  position:relative;
  z-index:1;
  grid-column:1/-1;
  align-self:end;
  margin:10px 0 0;
  color:var(--muted);
  font-size:11.5px;
}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
th{
  padding:12px 14px;
  color:#334155;
  text-align:left;
  white-space:nowrap;
  background:#effaf5;
  border-top:1px solid rgba(5,150,105,.1);
  border-bottom:1px solid rgba(5,150,105,.2);
  font-size:11px;
  font-weight:700;
  letter-spacing:.03em;
}
td{
  padding:12px 14px;
  white-space:nowrap;
  background:#fff;
  border-bottom:1px solid #e2eee9;
}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#f2fbf7}
td:first-child,.mono{
  font-family:"Fira Code","Noto Sans TC",monospace;
  font-variant-numeric:tabular-nums;
}
td:nth-child(n+3){font-variant-numeric:tabular-nums}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:23px;
  padding:3px 9px;
  border:1px solid transparent;
  border-radius:999px;
  font-size:10.5px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
}
.tag::before{
  content:"";
  width:6px;
  height:6px;
  flex:none;
  border-radius:50%;
  background:currentColor;
}
.t-ok{color:#047857;background:#d1fae5;border-color:#a7f3d0}
.t-warn{color:#92400e;background:#fef3c7;border-color:#fde68a}
.t-bad{color:#b91c1c;background:#fee2e2;border-color:#fecaca}
.t-info{color:#1d4ed8;background:#dbeafe;border-color:#bfdbfe}
.t-gray{color:#475569;background:#f1f5f9;border-color:#e2e8f0}
.t-acc,.t-pink{color:#065f46;background:#d1fae5;border-color:#a7f3d0}
.prog{display:flex;align-items:center;gap:8px;min-width:112px}
.bar{height:8px;min-width:62px;overflow:hidden;background:#dcebe6;border-radius:999px}
.bar>i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,#047857,#34d399);
  border-radius:999px;
}
.prog small{
  width:34px;
  flex:none;
  color:#334155;
  text-align:right;
  font:600 10.5px/1 "Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0}
.dl dt{color:var(--muted);font-size:12px;font-weight:600}
.dl dd{margin:0}
.tl{position:relative;padding-left:25px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item,.tl-i{position:relative;padding-bottom:17px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;left:-23px;top:3px;width:13px;height:13px;background:#fff;border:3px solid #059669;border-radius:50%}
.tl-dot.warn,.tl-d.warn{border-color:#b45309}
.tl-dot.bad,.tl-d.bad{border-color:#dc2626}
.tl-dot.ok,.tl-d.ok{border-color:#059669}
.tl-time,.tl-t{color:var(--muted);font:600 11px/1.4 "Fira Code",monospace}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:12.5px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:11.5px}
.chk{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px dashed var(--line);font-size:12.5px}
.chk:last-child{border-bottom:0}
.chk .material-symbols-outlined{font-size:19px}
.chk .ok{color:#047857}.chk .wait{color:#64748b}.chk .bad{color:#dc2626}.chk .warn{color:#b45309}
.chk .n{flex:1;min-width:0}.chk small{color:var(--muted);font-size:11px}
.note{margin-top:13px;padding-top:12px;color:var(--muted);border-top:1px dashed var(--line);font-size:11.5px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#screen>.grid{animation:reveal .36s ease-out both}
#screen>.grid:nth-child(2){animation-delay:.05s}
#screen>.grid:nth-child(3){animation-delay:.1s}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g32,.g23{grid-template-columns:1fr}
}
@media(max-width:900px){
  .app{display:block}
  .sidebar{
    position:sticky;
    width:100%;
    height:auto;
    padding:10px 14px;
    flex-direction:row;
    align-items:center;
    gap:12px;
  }
  .sidebar::after,.side-foot,.brand-txt span{display:none}
  .brand{padding:0;flex:none}
  .brand-logo{width:38px;height:38px;border-radius:12px 17px 12px 17px}
  .brand-txt b{font-size:14px}
  .nav{
    flex:1;
    flex-direction:row;
    gap:5px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .nav::-webkit-scrollbar{display:none}
  .nav button{width:auto;min-height:40px;flex:none;padding:8px 11px}
  .nav .idx{display:none}
  .main{padding:20px 18px 48px}
}
@media(max-width:768px){
  .topbar{align-items:flex-start;flex-direction:column}
  .topbar .sub{margin-left:0}
  .top-right{justify-content:flex-start}
  .g2,.g3,.g32,.g23{grid-template-columns:1fr}
}
@media(max-width:560px){
  .brand-txt{display:none}
  .nav button{padding:9px 10px}
  .nav button .txt{display:none}
  .topbar h1{font-size:19px}
  .chip:nth-child(2){display:none}
  .g4{grid-template-columns:1fr 1fr;gap:11px}
  .tile{min-height:146px;padding:14px}
}
@media(max-width:390px){
  .g4{grid-template-columns:1fr}
  .tile{min-height:132px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  #screen>.grid{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">science</span></div>
      <div class="brand-txt"><b>毒化物管制台</b><span>TOXIC CHEMICAL</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
    <div class="side-foot">列管物質 14 種<br>運作場所 6 處<br>版本 <b>v1.0.0</b> · 純 UI 展示</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1><span class="material-symbols-outlined" id="th-ico"></span><span id="th-title"></span></h1>
        <div class="sub" id="th-sub"></div>
      </div>
      <div class="top-right">
        <span class="chip"><span class="dot" aria-hidden="true"></span>系統連線正常</span>
        <span class="chip"><span class="material-symbols-outlined" style="font-size:16px;color:var(--color-primary)">calendar_today</span><span class="mono">2026/08/20</span></span>
        <div class="avatar" aria-label="資安管理員">資</div>
      </div>
    </div>
    <div id="screen"></div>
  </main>
</div>
<script>
var charts=[];
function killCharts(){
  for(var i=0;i<charts.length;i++){
    try{charts[i].destroy()}catch(e){}
  }
  charts=[];
}
function esc(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}
function tbl(h,r){
  return '<div style="overflow-x:auto"><table><thead><tr>'+
    h.map(function(x){return '<th>'+esc(x)+'</th>'}).join("")+
    '</tr></thead><tbody>'+
    r.map(function(x){
      return '<tr>'+x.map(function(c,i){
        return '<td'+(i===0?' class="mono"':'')+'>'+c+'</td>';
      }).join("")+'</tr>';
    }).join("")+
    '</tbody></table></div>';
}
function pg(p){
  return '<div class="prog" aria-label="使用率 '+p+'%"><div class="bar" style="flex:1"><i style="width:'+p+'%"></i></div><small>'+p+'%</small></div>';
}
function card(t,ic,body,hint){
  return '<div class="card"><div class="card-h"><h3><span class="material-symbols-outlined">'+ic+'</span>'+t+'</h3>'+
    (hint?'<span class="hint">'+hint+'</span>':'')+'</div>'+body+'</div>';
}
function cardT(t,ic,body,hint){
  return '<div class="card pad0"><div class="card-h" style="padding:17px 17px 0"><h3><span class="material-symbols-outlined">'+ic+'</span>'+t+'</h3>'+
    (hint?'<span class="hint">'+hint+'</span>':'')+'</div>'+body+'</div>';
}
var AX={style:{colors:"#475569",fontSize:"11px",fontFamily:"Fira Code"}};
var CB={
  redrawOnParentResize:false,
  redrawOnWindowResize:false,
  animations:{enabled:false},
  toolbar:{show:false},
  fontFamily:'Fira Sans,"Noto Sans TC",sans-serif',
  foreColor:"#475569"
};
function push(el,opt){
  var n=document.getElementById(el);
  if(!n)return;
  var c=new ApexCharts(n,opt);
  c.render();
  charts.push(c);
}
function mkArea(el,data,cats,name){
  push(el,{
    chart:Object.assign({},CB,{type:"area",height:230}),
    series:[{name:name,data:data}],
    xaxis:{categories:cats,labels:AX},
    yaxis:{labels:{style:AX.style}},
    grid:{borderColor:"#d7eee5",strokeDashArray:4},
    dataLabels:{enabled:false},
    stroke:{curve:"smooth",width:3},
    colors:["#059669"],
    fill:{type:"gradient",gradient:{shadeIntensity:.3,opacityFrom:.38,opacityTo:.04,stops:[0,90]}},
    tooltip:{theme:"light"}
  });
}
function mkBar(el,cats,data,name,horiz){
  push(el,{
    chart:Object.assign({},CB,{type:"bar",height:230}),
    series:[{name:name||"數值",data:data}],
    xaxis:{categories:cats,labels:AX},
    yaxis:{labels:{style:AX.style}},
    grid:{borderColor:"#d7eee5",strokeDashArray:4},
    dataLabels:{enabled:false},
    plotOptions:{bar:{borderRadius:7,horizontal:!!horiz,columnWidth:"54%",barHeight:"60%"}},
    colors:["#059669"],
    tooltip:{theme:"light"}
  });
}
function mkStack(el,cats,series){
  push(el,{
    chart:Object.assign({},CB,{type:"bar",height:245,stacked:true}),
    series:series,
    xaxis:{categories:cats,labels:AX},
    yaxis:{labels:{style:AX.style}},
    grid:{borderColor:"#d7eee5",strokeDashArray:4},
    dataLabels:{enabled:false},
    plotOptions:{bar:{borderRadius:5,columnWidth:"55%"}},
    legend:{position:"bottom",fontSize:"11.5px"},
    colors:["#059669","#6ee7b7","#fbbf24","#047857","#a7f3d0","#065f46"],
    tooltip:{theme:"light"}
  });
}
function mkDonut(el,labels,data){
  push(el,{
    chart:Object.assign({},CB,{type:"donut",height:240}),
    series:data,
    labels:labels,
    colors:["#059669","#fbbf24","#34d399","#047857","#a7f3d0","#065f46"],
    legend:{position:"bottom",fontSize:"11.5px"},
    dataLabels:{enabled:false},
    plotOptions:{pie:{donut:{size:"66%"}}},
    stroke:{width:3,colors:["#fff"]},
    tooltip:{theme:"light"}
  });
}
function mkRadar(el,cats,data,name){
  push(el,{
    chart:Object.assign({},CB,{type:"radar",height:270}),
    series:[{name:name||"分數",data:data}],
    xaxis:{categories:cats},
    yaxis:{show:false},
    colors:["#059669"],
    fill:{opacity:.18},
    markers:{size:4,strokeWidth:2,strokeColors:"#fff"},
    dataLabels:{enabled:false},
    tooltip:{theme:"light"}
  });
}

var RENDER=[v0,v1,v2,v3];
function buildNav(){
  var n=document.getElementById("nav");
  n.innerHTML=MODULES.map(function(m,i){
    return '<button type="button" data-i="'+i+'" aria-label="'+esc(m.name)+'">'+
      '<span class="material-symbols-outlined">'+m.icon+'</span>'+
      '<span class="txt">'+m.name+'</span>'+
      '<span class="idx">0'+(i+1)+'</span>'+
    '</button>';
  }).join("");
  Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){
    b.addEventListener("click",function(){
      location.hash="go="+b.getAttribute("data-i");
    });
  });
}
function show(i){
  killCharts();
  var m=MODULES[i];
  document.getElementById("th-ico").textContent=m.icon;
  document.getElementById("th-title").textContent=m.name;
  document.getElementById("th-sub").textContent=m.sub;
  Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){
    var active=+b.getAttribute("data-i")===i;
    b.classList.toggle("on",active);
    b.setAttribute("aria-current",active?"page":"false");
  });
  RENDER[i](document.getElementById("screen"));
}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  show(m?Math.min(+m[1],MODULES.length-1):0);
  try{window.scrollTo(0,0)}catch(e){}
}
buildNav();
window.addEventListener("hashchange",fromHash);
fromHash();
