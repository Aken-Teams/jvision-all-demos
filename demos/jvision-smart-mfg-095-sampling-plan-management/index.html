<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>抽樣計畫管理 Sampling Plan Management</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#15803d; --accent2:#4ade80; --accent-soft:#dcfce7;
  --ink:#0f271a; --sub:#5b6f64; --line:#e2ece6; --bg:#f4f8f5; --card:#ffffff;
  --amber:#d97706; --amber-soft:#fef3c7; --red:#dc2626; --red-soft:#fee2e2;
  --blue:#2563eb; --blue-soft:#dbeafe;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
button{font-family:inherit;cursor:pointer}
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(100deg,#0f5132,#15803d 55%,#1e9e4f);color:#fff;box-shadow:0 2px 14px rgba(15,83,50,.28)}
.topbar-inner{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.brand .logo .ms{font-size:24px;color:#eafff2}
.brand-txt{min-width:0}
.brand-txt b{font-size:16px;font-weight:800;letter-spacing:.3px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-txt span{font-size:11px;opacity:.82;letter-spacing:2px}
.top-meta{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0}
.top-pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.top-pill .ms{font-size:16px}
.top-user{display:flex;align-items:center;gap:8px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent2);color:#0f5132;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
.nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.nav-inner{max-width:1360px;margin:0 auto;padding:0 12px;display:flex;gap:4px;flex-wrap:wrap;overflow-x:auto}
.nav button{border:none;background:transparent;padding:13px 14px;font-size:14px;font-weight:600;color:var(--sub);border-bottom:3px solid transparent;display:flex;align-items:center;gap:7px;white-space:nowrap;min-width:0}
.nav button .ms{font-size:20px}
.nav button:hover{color:var(--accent)}
.nav button.active{color:var(--accent);border-bottom-color:var(--accent)}
main{max-width:1360px;margin:0 auto;padding:22px 18px 60px}
.screen-head{margin-bottom:18px}
.screen-head h1{font-size:22px;font-weight:800;margin:0 0 4px;display:flex;align-items:center;gap:10px}
.screen-head h1 .ms{font-size:26px;color:var(--accent)}
.screen-head p{margin:0;color:var(--sub);font-size:13.5px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(4,1fr)}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-2{grid-template-columns:repeat(2,1fr)}
.split-2-1{grid-template-columns:2fr 1fr}
.split-1-2{grid-template-columns:1fr 2fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h3{margin:0 0 12px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .ms{font-size:19px;color:var(--accent)}
.card h3 .tag{margin-left:auto;font-size:11px;font-weight:600;color:var(--sub)}
.kpi{position:relative;overflow:hidden}
.kpi .lbl{font-size:12.5px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .lbl .ms{font-size:17px;color:var(--accent)}
.kpi .val{font-size:28px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.kpi .val small{font-size:14px;font-weight:600;color:var(--sub)}
.kpi .delta{font-size:12px;font-weight:700;margin-top:2px}
.kpi .delta.up{color:var(--accent)}
.kpi .delta.down{color:var(--red)}
.kpi::after{content:"";position:absolute;right:-14px;bottom:-14px;width:64px;height:64px;border-radius:50%;background:var(--accent-soft);opacity:.5}
.chart-wrap{position:relative;width:100%;overflow:hidden}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--sub);font-weight:700;background:#f8fbf9}
tbody tr:hover{background:#f5faf7}
td.num{font-variant-numeric:tabular-nums;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;line-height:1.6}
.chip .ms{font-size:14px}
.c-green{background:var(--accent-soft);color:#166534}
.c-amber{background:var(--amber-soft);color:#92400e}
.c-red{background:var(--red-soft);color:#991b1b}
.c-blue{background:var(--blue-soft);color:#1e40af}
.c-gray{background:#eef2f0;color:#475b52}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start}
.bcol{background:#eef4f0;border-radius:12px;padding:10px;min-width:0}
.bcol-head{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13px;margin-bottom:9px;padding:0 3px}
.bcol-head .cnt{margin-left:auto;background:#fff;border-radius:999px;padding:1px 9px;font-size:12px;color:var(--sub)}
.bcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:9px;border-left:4px solid var(--accent)}
.bcard.warn{border-left-color:var(--amber)}
.bcard.rej{border-left-color:var(--red)}
.bcard .bt{font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.bcard .bm{font-size:11.5px;color:var(--sub);margin-top:5px;display:flex;flex-wrap:wrap;gap:4px 10px}
.bcard .bprog{height:6px;background:#eef2f0;border-radius:4px;margin-top:9px;overflow:hidden}
.bcard .bprog span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.risk-card{border-radius:14px;padding:16px;color:#fff;position:relative;overflow:hidden;min-width:0}
.risk-card .rl{font-size:12px;opacity:.9;font-weight:600}
.risk-card .rv{font-size:34px;font-weight:800;margin-top:4px}
.risk-card .rd{font-size:12px;opacity:.92;margin-top:6px}
.risk-card .ms.big{position:absolute;right:-6px;top:-6px;font-size:74px;opacity:.16}
.r-high{background:linear-gradient(135deg,#b91c1c,#ef4444)}
.r-mid{background:linear-gradient(135deg,#b45309,#f59e0b)}
.r-low{background:linear-gradient(135deg,#166534,#22c55e)}
.matrix{border-collapse:separate;border-spacing:4px;min-width:520px}
.matrix td{border:none;border-radius:8px;text-align:center;font-weight:700;font-size:12px;color:#fff;padding:12px 8px}
.matrix th{background:transparent;border:none;text-align:center}
.mx-lo{background:#22c55e}.mx-md{background:#f59e0b}.mx-hi{background:#ef4444}.mx-vlo{background:#4ade80}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 16px 6px}
.tl-item::before{content:"";position:absolute;left:-22px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent-soft)}
.tl-item.amber::before{background:var(--amber);box-shadow:0 0 0 2px var(--amber-soft)}
.tl-item.red::before{background:var(--red);box-shadow:0 0 0 2px var(--red-soft)}
.tl-item .tt{font-weight:700;font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl-item .tm{font-size:11.5px;color:var(--sub)}
.tl-item .td{font-size:12.5px;color:#3d4d45;margin-top:3px}
.sev-track{display:flex;gap:0;margin:8px 0 4px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.sev-seg{flex:1;text-align:center;padding:12px 6px;font-weight:700;font-size:13px;background:#f4f8f5;color:var(--sub);position:relative;min-width:0}
.sev-seg.on{color:#fff}
.sev-seg.on.tight{background:var(--red)}
.sev-seg.on.normal{background:var(--accent)}
.sev-seg.on.reduced{background:var(--blue)}
.sev-seg small{display:block;font-weight:500;font-size:10.5px;opacity:.85;margin-top:2px}
.rulebox{background:#f8fbf9;border:1px dashed var(--accent2);border-radius:10px;padding:12px 14px;font-size:12.5px;color:#2f4a3a;display:flex;gap:10px;align-items:flex-start}
.rulebox .ms{color:var(--accent);font-size:20px;flex:0 0 auto}
.pbar{height:9px;background:#eef2f0;border-radius:6px;overflow:hidden}
.pbar span{display:block;height:100%;border-radius:6px}
.pbar.g span{background:linear-gradient(90deg,var(--accent),var(--accent2))}
.pbar.a span{background:linear-gradient(90deg,#d97706,#fbbf24)}
.pbar.r span{background:linear-gradient(90deg,#dc2626,#f87171)}
.mini-row{display:flex;align-items:center;gap:10px;margin:10px 0}
.mini-row .ml{font-size:12.5px;font-weight:600;width:120px;flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-row .mv{font-size:12.5px;font-weight:700;width:52px;text-align:right;flex:0 0 auto}
.mini-row .pbar{flex:1;min-width:0}
.calc{background:linear-gradient(135deg,#0f5132,#166534);color:#fff;border-radius:14px;padding:18px}
.calc h3{color:#fff}
.calc h3 .ms{color:var(--accent2)}
.calc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px}
.calc-cell{background:rgba(255,255,255,.1);border-radius:10px;padding:11px 13px}
.calc-cell .cl{font-size:11.5px;opacity:.85}
.calc-cell .cv{font-size:22px;font-weight:800;margin-top:3px}
.calc-cell .cv small{font-size:12px;opacity:.8;font-weight:600}
.acre{display:flex;gap:10px;margin-top:12px}
.acre .ac,.acre .re{flex:1;text-align:center;border-radius:10px;padding:12px;font-weight:800}
.acre .ac{background:rgba(74,222,128,.22);border:1px solid rgba(74,222,128,.5)}
.acre .re{background:rgba(248,113,113,.22);border:1px solid rgba(248,113,113,.5)}
.acre .lbl{font-size:11px;font-weight:600;opacity:.85;display:block}
.acre .n{font-size:26px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--sub)}
.legend b{color:var(--ink)}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
.note{font-size:12px;color:var(--sub);margin-top:10px;display:flex;gap:6px;align-items:flex-start}
.note .ms{font-size:15px;color:var(--accent);flex:0 0 auto}
@media(max-width:1000px){
  .split-2-1,.split-1-2{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:820px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .cols-3{grid-template-columns:1fr}
  .cols-2{grid-template-columns:1fr}
  .calc-grid{grid-template-columns:1fr}
}
@media(max-width:560px){
  .board{grid-template-columns:1fr}
  .nav button span.lbl-t{display:none}
  .top-meta .top-pill span.pt{display:none}
  main{padding:16px 12px 50px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo"><span class="ms">rule</span></div>
      <div class="brand-txt">
        <b>抽樣計畫管理</b>
        <span>SAMPLING PLAN MGMT</span>
      </div>
    </div>
    <div class="top-meta">
      <div class="top-pill"><span class="ms">verified</span><span class="pt">ISO 2859-1 / MIL-STD-105E</span></div>
      <div class="top-pill"><span class="ms">factory</span><span class="pt">JVISION 智慧製造廠</span></div>
      <div class="top-user">
        <div class="avatar">QA</div>
      </div>
    </div>
  </div>
</header>
<nav class="nav">
  <div class="nav-inner" id="navInner"></div>
</nav>
<main id="app"></main>

<script>
"use strict";
var accent="#15803d", accent2="#4ade80", amber="#d97706", red="#dc2626", blue="#2563eb";
var charts={};

var NAV=[
  {icon:"rule",       t:"AQL 標準庫"},
  {icon:"shield",     t:"風險分級"},
  {icon:"checklist",  t:"計畫設定"},
  {icon:"fact_check", t:"檢驗看板"},
  {icon:"trending_up",t:"嚴格度調整"},
  {icon:"monitoring", t:"合規稽核"}
];

function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}

/* ---------- screen 0 : AQL standard library ---------- */
function screen0(){
  var lots=[
    {rng:"2 – 8",code:"A"},{rng:"9 – 15",code:"B"},{rng:"16 – 25",code:"C"},
    {rng:"26 – 50",code:"D"},{rng:"51 – 90",code:"E"},{rng:"91 – 150",code:"F"},
    {rng:"151 – 280",code:"G"},{rng:"281 – 500",code:"H"},{rng:"501 – 1200",code:"J"},
    {rng:"1201 – 3200",code:"K"},{rng:"3201 – 10000",code:"L"}
  ];
  var aqlCols=["0.65","1.0","1.5","2.5","4.0"];
  var ss={A:2,B:3,C:5,D:8,E:13,F:20,G:32,H:50,J:80,K:125,L:200};
  var acTbl={
    A:[0,0,0,0,0], B:[0,0,0,0,1], C:[0,0,0,1,1], D:[0,0,1,1,2],
    E:[0,1,1,2,3], F:[0,1,2,3,5], G:[1,2,3,5,7], H:[1,3,5,7,10],
    J:[2,5,7,10,14], K:[3,7,10,14,21], L:[5,10,14,21,21]
  };
  var rows=lots.map(function(l){
    var cells=aqlCols.map(function(a,i){
      var ac=acTbl[l.code][i]; var re=ac+1;
      var hot=(l.code==="J"&&i===2);
      return '<td class="num" style="text-align:center'+(hot?';background:var(--accent-soft);border-radius:6px;font-weight:800;color:#166534':'')+'">'+ac+' / '+re+'</td>';
    }).join("");
    return '<tr><td style="font-weight:800;color:var(--accent);text-align:center">'+l.code+'</td><td>'+l.rng+'</td><td class="num" style="text-align:center">'+ss[l.code]+'</td>'+cells+'</tr>';
  }).join("");
  var header='<th style="text-align:center">代字</th><th>批量 Lot Size</th><th style="text-align:center">樣本量 n</th>'+
    aqlCols.map(function(a){return '<th style="text-align:center">AQL '+a+'</th>';}).join("");

  return ''+
  head("rule","AQL 抽樣標準庫","集中管理 ISO 2859-1 / MIL-STD-105E 抽樣表，依批量與檢驗水準查得樣本代字、樣本量與允收數 Ac／拒收數 Re。")+
  '<div class="grid kpis" style="margin-bottom:14px">'+
    kpi("dataset","收錄抽樣表","6","<small> 套</small>","up","+2 本季新增")+
    kpi("rule","AQL 等級","12","<small> 級</small>","up","0.010–10")+
    kpi("category","樣本代字","15","<small> 碼</small>","","A–R")+
    kpi("schedule","平均查表耗時","4.2","<small> 秒</small>","up","↓96% vs 人工")+
  '</div>'+
  '<div class="grid split-2-1">'+
    '<div class="card"><h3><span class="ms">table_chart</span>單次抽樣主表（一般檢驗水準 II · 正常檢驗）<span class="tag">Ac / Re</span></h3>'+
      '<div class="tbl-scroll"><table><thead><tr>'+header+'</tr></thead><tbody>'+rows+'</tbody></table></div>'+
      '<div class="note"><span class="ms">info</span>綠底格為目前作用中查詢：批量 501–1200（代字 J）× AQL 1.5 → 樣本量 80、Ac 7 / Re 8。</div>'+
    '</div>'+
    '<div class="grid" style="align-content:start">'+
      '<div class="card"><h3><span class="ms">bar_chart</span>各標準收錄筆數</h3>'+
        '<div class="chart-wrap" style="height:200px"><canvas id="c0a"></canvas></div></div>'+
      '<div class="card"><h3><span class="ms">tune</span>檢驗水準對照</h3>'+
        levelRow("S-1 / S-2","破壞性檢測",25)+
        levelRow("S-3 / S-4","中量抽樣",45)+
        levelRow("水準 I","放寬檢驗",70)+
        levelRow("水準 II（預設）","一般",92)+
        levelRow("水準 III","加嚴檢驗",60)+
      '</div>'+
    '</div>'+
  '</div>';
}
function levelRow(a,c,pct){
  return '<div class="mini-row"><div class="ml" title="'+esc(a)+'">'+esc(a)+'</div>'+
    '<div class="pbar g" style="flex:1"><span style="width:'+pct+'%"></span></div>'+
    '<div class="mv">'+pct+'%</div></div>';
}

/* ---------- screen 1 : product risk grading (v1) ---------- */
function screen1(){
  var items=[
    {p:"BMS 電池保護板",cat:"安全關鍵",risk:"高",lvl:"水準 III / 加嚴",aql:"0.65",cust:3},
    {p:"車用連接器端子",cat:"功能關鍵",risk:"高",lvl:"水準 II / 加嚴",aql:"1.0",cust:2},
    {p:"控制板 SMT 組件",cat:"功能重要",risk:"中",lvl:"水準 II / 正常",aql:"1.5",cust:1},
    {p:"外殼金屬件",cat:"外觀/尺寸",risk:"中",lvl:"水準 II / 正常",aql:"2.5",cust:1},
    {p:"線材束線帶",cat:"一般耗材",risk:"低",lvl:"水準 I / 減量",aql:"4.0",cust:0},
    {p:"包裝紙箱",cat:"外觀輔材",risk:"低",lvl:"水準 I / 減量",aql:"4.0",cust:0}
  ];
  var rows=items.map(function(it){
    var chip=it.risk==="高"?'c-red':it.risk==="中"?'c-amber':'c-green';
    var ic=it.risk==="高"?"gpp_maybe":it.risk==="中"?"warning":"verified";
    return '<tr><td style="font-weight:700">'+esc(it.p)+'</td><td>'+esc(it.cat)+'</td>'+
      '<td><span class="chip '+chip+'"><span class="ms">'+ic+'</span>'+it.risk+'風險</span></td>'+
      '<td>'+esc(it.lvl)+'</td><td class="num" style="text-align:center">'+it.aql+'</td>'+
      '<td class="num" style="text-align:center">'+it.cust+'</td></tr>';
  }).join("");

  return ''+
  head("shield","產品風險分級","依產品安全性、關鍵尺寸權重與歷史客訴頻率，將品項分為高/中/低風險，決定檢驗水準與目標 AQL。")+
  '<div class="grid cols-3" style="margin-bottom:14px">'+
    '<div class="risk-card r-high"><span class="ms big">gpp_maybe</span><div class="rl">高風險品項</div><div class="rv">18</div><div class="rd">安全/功能關鍵 · 加嚴檢驗 · AQL ≤ 1.0</div></div>'+
    '<div class="risk-card r-mid"><span class="ms big">warning</span><div class="rl">中風險品項</div><div class="rv">57</div><div class="rd">功能重要 · 正常檢驗 · AQL 1.5–2.5</div></div>'+
    '<div class="risk-card r-low"><span class="ms big">verified</span><div class="rl">低風險品項</div><div class="rv">129</div><div class="rd">一般/外觀 · 可減量檢驗 · AQL 4.0</div></div>'+
  '</div>'+
  '<div class="grid split-2-1">'+
    '<div class="card"><h3><span class="ms">list_alt</span>品項風險分級清單<span class="tag">共 204 品項</span></h3>'+

function riskMatrix(){

  var grid=[
    ["mx-md","mx-hi","mx-hi","mx-hi"],
    ["mx-md","mx-md","mx-hi","mx-hi"],
    ["mx-lo","mx-md","mx-md","mx-hi"],
    ["mx-vlo","mx-lo","mx-md","mx-md"]
  ];
  var txt={"mx-hi":"高","mx-md":"中","mx-lo":"低","mx-vlo":"極低"};

function kpi(ic,lbl,val,unit,dir,delta){

/* ---------- charts ---------- */
function mkChart(id,cfg){
  var el=document.getElementById(id);
  if(!el) return;
  if(charts[id]){try{charts[id].destroy();}catch(e){}}
  charts[id]=new Chart(el.getContext("2d"),cfg);
}
var gridClr="rgba(15,39,26,.07)";
function baseOpts(extra){
  var o={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
    scales:{x:{grid:{display:false},ticks:{font:{size:11}}},y:{grid:{color:gridClr},ticks:{font:{size:11}},beginAtZero:true}}};
  if(extra){for(var k in extra){o[k]=extra[k];}}
  return o;
}
function initCharts(i){
  if(i===0){
    mkChart("c0a",{type:"bar",data:{labels:["ISO 2859-1","MIL-STD-105E","ISO 2859-2","GB/T 2828","JIS Z 9015","ANSI/ASQ Z1.4"],
      datasets:[{data:[130,120,64,128,120,118],backgroundColor:accent,borderRadius:6,maxBarThickness:22}]},
      options:baseOpts({indexAxis:"y",scales:{x:{grid:{color:gridClr},ticks:{font:{size:10}},beginAtZero:true},y:{grid:{display:false},ticks:{font:{size:10}}}}})});
  }else if(i===1){
    mkChart("c1a",{type:"radar",data:{labels:["安全性","功能影響","關鍵尺寸","客訴頻率","製程能力","供應商績效"],
      datasets:[
        {label:"高風險品項",data:[9,8,8,7,5,6],borderColor:red,backgroundColor:"rgba(220,38,38,.15)",pointBackgroundColor:red},
        {label:"低風險品項",data:[3,3,4,2,7,8],borderColor:accent,backgroundColor:"rgba(21,128,61,.15)",pointBackgroundColor:accent}
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,position:"bottom",labels:{font:{size:11},boxWidth:12}}},
        scales:{r:{suggestedMin:0,suggestedMax:10,grid:{color:gridClr},angleLines:{color:gridClr},pointLabels:{font:{size:11}},ticks:{display:false}}}}});
  }else if(i===2){
    var pd=[0.5,1,1.5,2,2.5,3,4,5,6,8,10];
    var oc=pd.map(function(p){return ocProb(80,2,p/100);});
    var oc2=pd.map(function(p){return ocProb(80,1,p/100);});
    mkChart("c2a",{type:"line",data:{labels:pd.map(function(p){return p+"%";}),

        {label:"Ac=2",data:oc,borderColor:accent,backgroundColor:"rgba(21,128,61,.10)",fill:true,tension:.35,pointRadius:2},
        {label:"Ac=1",data:oc2,borderColor:amber,borderDash:[5,4],fill:false,tension:.35,pointRadius:0}
      ]},
      options:baseOpts({scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{grid:{color:gridClr},ticks:{font:{size:11},callback:function(v){return Math.round(v*100)+"%";}},min:0,max:1}}})});
  }else if(i===4){
    var wk=["W1","W2","W3","W4","W5","W6","W7","W8"];
    mkChart("c4a",{type:"bar",data:{labels:wk,datasets:[
      {label:"加嚴",data:[4,4,3,3,2,3,2,2],backgroundColor:red,stack:"s",borderRadius:3,maxBarThickness:24},
      {label:"正常",data:[40,41,42,42,43,41,42,41],backgroundColor:accent,stack:"s",borderRadius:3,maxBarThickness:24},
      {label:"減量",data:[5,5,6,7,7,8,8,9],backgroundColor:blue,stack:"s",borderRadius:3,maxBarThickness:24}
    ]},
      options:baseOpts({plugins:{legend:{display:true,position:"bottom",labels:{font:{size:11},boxWidth:12}}},scales:{x:{stacked:true,grid:{display:false},ticks:{font:{size:11}}},y:{stacked:true,grid:{color:gridClr},ticks:{font:{size:11}},beginAtZero:true}}})});
  }else if(i===5){
    mkChart("c5a",{type:"line",data:{labels:["第1週","第2週","第3週","第4週","第5週","第6週"],
      datasets:[{label:"合規率 %",data:[89,91,92,94,95.5,96.8],borderColor:accent,backgroundColor:"rgba(21,128,61,.12)",fill:true,tension:.35,pointRadius:3,pointBackgroundColor:accent}]},
      options:baseOpts({scales:{x:{grid:{display:false},ticks:{font:{size:11}}},y:{grid:{color:gridClr},ticks:{font:{size:11},callback:function(v){return v+"%";}},min:80,max:100}}})});
    mkChart("c5b",{type:"doughnut",data:{labels:["樣本量不足","隨機性佐證缺失","版本過期標準","記錄遺漏"],
      datasets:[{data:[42,28,18,12],backgroundColor:[red,amber,"#f59e0b",accent2],borderWidth:2,borderColor:"#fff"}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:"58%",plugins:{legend:{display:true,position:"bottom",labels:{font:{size:11},boxWidth:12,padding:10}}}}});
  }
}
function ocProb(n,ac,p){
  var s=0;
  for(var k=0;k<=ac;k++){ s+= binom(n,k)*Math.pow(p,k)*Math.pow(1-p,n-k); }
  return s;
}
function binom(n,k){
  if(k<0||k>n) return 0;
  var r=1;
  for(var j=0;j<k;j++){ r=r*(n-j)/(j+1); }
  return r;
}

/* ---------- render ---------- */
var SCREENS=[screen0,screen1,screen2,screen3,screen4,screen5];
function show(i){
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  var app=document.getElementById("app");
  app.innerHTML=SCREENS[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){ btns[b].classList.toggle("active", (+btns[b].getAttribute("data-i"))===i); }
  void app.offsetHeight;
  initCharts(i);
}

    btns[b].addEventListener("click",function(){ var n=+this.getAttribute("data-i"); location.hash="v"+n; });
  }
})();

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
