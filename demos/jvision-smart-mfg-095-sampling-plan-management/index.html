<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>抽樣計畫管理 Sampling Plan Management</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#ffffff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000000;
  --color-accent:#ea580c;
  --color-on-accent:#000000;
  --color-background:#f8fafc;
  --color-foreground:#1e293b;
  --color-card:#ffffff;
  --color-card-foreground:#1e293b;
  --color-muted:#e9eff8;
  --color-muted-foreground:#475569;
  --color-border:#e2e8f0;
  --color-destructive:#dc2626;
  --color-on-destructive:#ffffff;
  --color-ring:#2563eb;

  --blue:#2563eb;
  --ink:#1e293b;
  --muted:#475569;
  --line:#e2e8f0;

  --accent:#2563eb;
  --accent2:#60a5fa;
  --accent-soft:#dbeafe;
  --sub:#475569;
  --bg:#f8fafc;
  --card:#ffffff;
  --amber:#b45309;
  --amber-soft:#fef3c7;
  --red:#dc2626;
  --red-soft:#fee2e2;
  --blue-soft:#dbeafe;
  --green:#15803d;
  --green-soft:#dcfce7;
  --shadow-xs:0 1px 2px rgba(15,23,42,.05);
  --shadow-sm:0 3px 10px rgba(15,23,42,.06);
  --shadow-md:0 10px 24px rgba(15,23,42,.09);
  --radius-sm:4px;
  --radius-md:8px;
  --radius-lg:12px;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  min-height:100vh;
  font-family:"Fira Sans","Noto Sans TC",sans-serif;
  color:var(--ink);
  background:
    linear-gradient(rgba(37,99,235,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(37,99,235,.025) 1px,transparent 1px),
    var(--bg);
  background-size:32px 32px;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
button{font:inherit;cursor:pointer}
button,a,[role="button"]{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.ms{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}

.topbar{
  position:sticky;
  top:0;
  z-index:30;
  color:var(--color-on-primary);
  background:#172554;
  border-bottom:1px solid rgba(255,255,255,.16);
  box-shadow:0 4px 16px rgba(15,23,42,.18);
}
.topbar::after{
  content:"";
  position:absolute;
  right:0;
  bottom:0;
  left:0;
  height:3px;
  background:linear-gradient(90deg,var(--color-primary) 0 74%,var(--color-accent) 74% 100%);
}
.topbar-inner{
  max-width:1440px;
  min-height:70px;
  margin:0 auto;
  padding:10px 24px 13px;
  display:flex;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{
  width:40px;
  height:40px;
  border:1px solid rgba(255,255,255,.34);
  border-radius:var(--radius-sm);
  background:var(--color-primary);
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
}
.brand .logo .ms{font-size:24px;color:#fff}
.brand-txt{min-width:0}
.brand-txt b{
  display:block;
  overflow:hidden;
  font-size:16px;
  font-weight:700;
  letter-spacing:.02em;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.brand-txt span{
  display:block;
  margin-top:1px;
  color:#bfdbfe;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:500;
  letter-spacing:.14em;
}
.top-meta{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  min-width:0;
}
.top-pill{
  min-height:34px;
  padding:6px 10px;
  border:1px solid rgba(255,255,255,.22);
  border-radius:var(--radius-sm);
  background:rgba(255,255,255,.08);
  display:flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  font-weight:600;
  letter-spacing:.01em;
}
.top-pill .ms{font-size:16px;color:#bfdbfe}
.top-user{display:flex;align-items:center;gap:8px}
.avatar{
  width:34px;
  height:34px;
  border:2px solid rgba(255,255,255,.7);
  border-radius:50%;
  background:#fff;
  color:#1e3a8a;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Fira Code",monospace;
  font-size:12px;
  font-weight:700;
}

.nav{
  position:sticky;
  top:70px;
  z-index:20;
  background:rgba(255,255,255,.97);
  border-bottom:1px solid var(--line);
  box-shadow:var(--shadow-xs);
  backdrop-filter:blur(10px);
}
.nav-inner{
  max-width:1440px;
  margin:0 auto;
  padding:0 20px;
  display:flex;
  gap:0;
  overflow-x:auto;
  scrollbar-width:thin;
}
.nav button{
  position:relative;
  min-width:0;
  min-height:52px;
  padding:13px 16px;
  border:0;
  border-right:1px solid var(--line);
  border-bottom:3px solid transparent;
  background:transparent;
  color:var(--sub);
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  font-weight:600;
  white-space:nowrap;
  transition:color .2s ease,background-color .2s ease,border-color .2s ease;
}
.nav button:first-child{border-left:1px solid var(--line)}
.nav button .ms{font-size:19px}
.nav button:hover{color:#1d4ed8;background:#eff6ff}
.nav button.active{
  color:#1d4ed8;
  border-bottom-color:var(--color-primary);
  background:#eff6ff;
}

main{max-width:1440px;margin:0 auto;padding:26px 24px 64px}
.screen-head{
  position:relative;
  margin-bottom:18px;
  padding:18px 20px 18px 24px;
  border:1px solid var(--line);
  border-left:5px solid var(--color-primary);
  border-radius:var(--radius-md);
  background:rgba(255,255,255,.94);
  box-shadow:var(--shadow-xs);
}
.screen-head::after{
  content:"QUALITY / COMPLIANCE";
  position:absolute;
  top:16px;
  right:18px;
  color:#64748b;
  font-family:"Fira Code",monospace;
  font-size:9px;
  font-weight:600;
  letter-spacing:.12em;
}
.screen-head h1{
  margin:0 160px 5px 0;
  display:flex;
  align-items:center;
  gap:10px;
  color:#0f172a;
  font-size:22px;
  font-weight:700;
  letter-spacing:-.02em;
}
.screen-head h1 .ms{font-size:25px;color:var(--color-primary)}
.screen-head p{max-width:980px;margin:0;color:var(--sub);font-size:13px;line-height:1.65}

.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split-2-1{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.split-1-2{grid-template-columns:minmax(280px,1fr) minmax(0,2fr)}
.card{
  min-width:0;
  padding:16px;
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  background:var(--card);
  color:var(--ink);
  box-shadow:var(--shadow-xs);
  transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.card:hover{border-color:#bfdbfe;box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.card h3{
  min-height:24px;
  margin:0 0 12px;
  padding-bottom:10px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:8px;
  color:#0f172a;
  font-size:14px;
  font-weight:700;
}
.card h3 .ms{font-size:19px;color:var(--color-primary)}
.card h3 .tag{
  margin-left:auto;
  color:#64748b;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:500;
  letter-spacing:.02em;
}

.kpi{position:relative;overflow:hidden;padding:15px 16px 14px;border-top:3px solid var(--color-primary)}
.kpi::after{
  content:"";
  position:absolute;
  right:0;
  bottom:0;
  width:56px;
  height:5px;
  background:var(--color-muted);
}
.kpi .lbl{
  color:var(--sub);
  display:flex;
  align-items:center;
  gap:7px;
  font-size:12px;
  font-weight:600;
}
.kpi .lbl .ms{font-size:17px;color:var(--color-primary)}
.kpi .val{
  margin-top:8px;
  color:#0f172a;
  font-family:"Fira Code",monospace;
  font-size:27px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.05em;
}
.kpi .val small{color:var(--sub);font-family:"Fira Sans",sans-serif;font-size:12px;font-weight:600;letter-spacing:0}
.kpi .delta{min-height:18px;margin-top:3px;font-size:11px;font-weight:600}
.kpi .delta.up{color:#166534}
.kpi .delta.down{color:#b91c1c}

.chart-wrap{position:relative;width:100%;overflow:hidden}
.tbl-scroll{
  width:100%;
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  -webkit-overflow-scrolling:touch;
}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:12px}
th,td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{
  position:relative;
  background:#eef2f7;
  color:#334155;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.045em;
  text-transform:uppercase;
}
thead th{border-bottom:1px solid #cbd5e1}
tbody tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#fbfdff}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#eff6ff}
td{color:#334155}
td.num{
  text-align:right!important;
  font-family:"Fira Code",monospace;
  font-weight:600;
  font-variant-numeric:tabular-nums;
}
td:first-child,.bcard .bt,.calc-cell .cv,.acre .n,.risk-card .rv,.mini-row .mv{
  font-variant-numeric:tabular-nums;
}

.chip{
  min-height:24px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:999px;
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:10.5px;
  font-weight:700;
  line-height:1.35;
}
.chip .ms{font-size:14px}
.c-green{background:var(--green-soft);color:#166534}
.c-amber{background:var(--amber-soft);color:#92400e}
.c-red{background:var(--red-soft);color:#991b1b}
.c-blue{background:var(--blue-soft);color:#1e40af}
.c-gray{background:#f1f5f9;color:#475569}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:start}
.bcol{
  min-width:0;
  padding:9px;
  border:1px solid var(--line);
  border-radius:var(--radius-sm);
  background:#f1f5f9;
}
.bcol-head{
  margin-bottom:8px;
  padding:3px 3px 8px;
  border-bottom:1px solid #cbd5e1;
  display:flex;
  align-items:center;
  gap:7px;
  color:#334155;
  font-size:12px;
  font-weight:700;
}
.bcol-head .cnt{
  margin-left:auto;
  min-width:25px;
  padding:1px 7px;
  border:1px solid var(--line);
  border-radius:999px;
  background:#fff;
  color:var(--sub);
  text-align:center;
  font-family:"Fira Code",monospace;
  font-size:10px;
}
.bcard{
  margin-bottom:8px;
  padding:10px;
  border:1px solid var(--line);
  border-left:4px solid var(--color-primary);
  border-radius:var(--radius-sm);
  background:#fff;
  box-shadow:var(--shadow-xs);
  transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.bcard:last-child{margin-bottom:0}
.bcard:hover{box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.bcard.warn{border-left-color:var(--amber)}
.bcard.rej{border-left-color:var(--red)}
.bcard .bt{display:flex;align-items:center;justify-content:space-between;gap:6px;font-family:"Fira Code",monospace;font-size:11.5px;font-weight:700}
.bcard .bm{margin-top:5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:4px 10px;font-size:10.5px}
.bcard .bprog{height:5px;margin-top:9px;overflow:hidden;border-radius:0;background:#dbe3ee}
.bcard .bprog span{display:block;height:100%;background:var(--color-primary)}

.risk-card{
  position:relative;
  min-width:0;
  overflow:hidden;
  padding:17px;
  border:1px solid transparent;
  border-radius:var(--radius-md);
  color:#fff;
  box-shadow:var(--shadow-sm);
}
.risk-card::after{content:"RISK";position:absolute;right:13px;bottom:10px;font-family:"Fira Code",monospace;font-size:9px;font-weight:700;letter-spacing:.14em;opacity:.72}
.risk-card .rl{font-size:12px;font-weight:600}
.risk-card .rv{margin-top:4px;font-family:"Fira Code",monospace;font-size:32px;font-weight:700}
.risk-card .rd{max-width:85%;margin-top:5px;font-size:11px;line-height:1.55}
.risk-card .ms.big{position:absolute;right:8px;top:8px;font-size:48px;opacity:.22}
.r-high{background:#991b1b;border-color:#7f1d1d}
.r-mid{background:#92400e;border-color:#78350f}
.r-low{background:#166534;border-color:#14532d}

.matrix{min-width:520px;border-collapse:separate;border-spacing:3px}
.matrix td{
  padding:11px 8px;
  border:2px solid rgba(15,23,42,.18);
  border-radius:var(--radius-sm);
  color:#fff;
  text-align:center;
  font-size:11px;
  font-weight:700;
}
.matrix th{border:0;background:transparent;text-align:center}
.mx-lo{background:#15803d}.mx-md{background:#a16207}.mx-hi{background:#b91c1c}.mx-vlo{background:#166534}

.tl{position:relative;padding-left:25px}
.tl::before{content:"";position:absolute;top:4px;bottom:4px;left:8px;width:2px;background:#cbd5e1}
.tl-item{position:relative;padding:0 0 16px 7px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{
  content:"";
  position:absolute;
  top:3px;
  left:-22px;
  width:10px;
  height:10px;
  border:2px solid #fff;
  border-radius:50%;
  background:var(--color-primary);
  box-shadow:0 0 0 2px #93c5fd;
}
.tl-item.amber::before{background:var(--amber);box-shadow:0 0 0 2px #fcd34d}
.tl-item.red::before{background:var(--red);box-shadow:0 0 0 2px #fca5a5}
.tl-item .tt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:#1e293b;font-size:12.5px;font-weight:700}
.tl-item .tm{color:#64748b;font-family:"Fira Code",monospace;font-size:10px}
.tl-item .td{margin-top:3px;color:#475569;font-size:11.5px;line-height:1.55}

.sev-track{margin:8px 0 4px;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-sm);display:flex}
.sev-seg{
  position:relative;
  min-width:0;
  flex:1;
  padding:11px 6px;
  border-right:1px solid var(--line);
  background:#f1f5f9;
  color:#475569;
  text-align:center;
  font-size:11px;
  font-weight:700;
}
.sev-seg:last-child{border-right:0}
.sev-seg.on{color:#fff}
.sev-seg.on.tight{background:#b91c1c}
.sev-seg.on.normal{background:#1d4ed8}
.sev-seg.on.reduced{background:#166534}
.sev-seg small{display:block;margin-top:2px;font-size:9px;font-weight:500;opacity:.92}
.rulebox{
  padding:11px 12px;
  border:1px solid #93c5fd;
  border-left:4px solid var(--color-primary);
  border-radius:var(--radius-sm);
  background:#eff6ff;
  color:#334155;
  display:flex;
  align-items:flex-start;
  gap:9px;
  font-size:11.5px;
  line-height:1.6;
}
.rulebox .ms{color:var(--color-primary);font-size:19px;flex:0 0 auto}

.pbar{height:7px;overflow:hidden;border-radius:0;background:#dbe3ee}
.pbar span{display:block;height:100%}
.pbar.g span{background:#2563eb}
.pbar.a span{background:#b45309}
.pbar.r span{background:#dc2626}
.mini-row{margin:9px 0;display:flex;align-items:center;gap:10px}
.mini-row .ml{width:120px;flex:0 0 auto;overflow:hidden;color:#334155;font-size:11.5px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}
.mini-row .mv{width:52px;flex:0 0 auto;color:#334155;text-align:right;font-family:"Fira Code",monospace;font-size:11px;font-weight:600}
.mini-row .pbar{min-width:0;flex:1}

.calc{
  position:relative;
  padding:18px;
  overflow:hidden;
  border:1px solid #1e40af;
  border-radius:var(--radius-md);
  background:#172554;
  color:#fff;
  box-shadow:var(--shadow-md);
}
.calc::after{content:"AQL / CALC";position:absolute;right:15px;top:14px;color:#93c5fd;font-family:"Fira Code",monospace;font-size:9px;font-weight:600;letter-spacing:.13em}
.calc h3{margin:0 90px 12px 0;color:#fff;display:flex;align-items:center;gap:8px;font-size:14px}
.calc h3 .ms{color:#93c5fd}
.calc-grid{margin-top:6px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.calc-cell{padding:10px 11px;border:1px solid rgba(255,255,255,.2);border-radius:var(--radius-sm);background:rgba(255,255,255,.07)}
.calc-cell .cl{color:#dbeafe;font-size:10.5px}
.calc-cell .cv{margin-top:3px;font-family:"Fira Code",monospace;font-size:20px;font-weight:700}
.calc-cell .cv small{color:#bfdbfe;font-family:"Fira Sans",sans-serif;font-size:10px;font-weight:600}
.acre{margin-top:10px;display:flex;gap:8px}
.acre .ac,.acre .re{flex:1;padding:10px 6px;border-radius:var(--radius-sm);text-align:center;font-weight:700}
.acre .ac{border:1px solid #86efac;background:rgba(22,101,52,.62)}
.acre .re{border:1px solid #fca5a5;background:rgba(153,27,27,.7)}
.acre .lbl{display:block;color:#fff;font-size:10px;font-weight:600}
.acre .n{font-family:"Fira Code",monospace;font-size:24px}

.legend{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px 13px;color:var(--sub);font-size:11px}
.legend b{color:var(--ink)}
.dot{width:10px;height:10px;margin-right:5px;border:1px solid rgba(15,23,42,.25);border-radius:2px;display:inline-block;vertical-align:middle}
.note{margin-top:10px;color:var(--sub);display:flex;align-items:flex-start;gap:6px;font-size:11px;line-height:1.55}
.note .ms{color:var(--color-primary);font-size:15px;flex:0 0 auto}

@media(max-width:1000px){
  .split-2-1,.split-1-2{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nav{top:70px}
}
@media(max-width:820px){
  .topbar-inner{padding-inline:16px}
  .top-meta{width:100%;margin-left:52px}
  .nav{position:relative;top:auto}
  .nav-inner{padding-inline:12px}
  main{padding:20px 16px 56px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols-3,.cols-2{grid-template-columns:1fr}
  .calc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:560px){
  .topbar{position:relative}
  .topbar-inner{min-height:auto;gap:10px;padding:10px 12px 13px}
  .brand .logo{width:36px;height:36px}
  .brand-txt b{font-size:14px}
  .top-meta{margin-left:0;gap:6px}
  .top-pill{min-height:32px;padding:5px 8px}
  .top-meta .top-pill span.pt{display:none}
  .avatar{width:32px;height:32px}
  .nav button{min-height:48px;padding:11px 14px}
  .nav button span.lbl-t{display:none}
  main{padding:14px 12px 48px}
  .screen-head{padding:15px 14px 15px 17px}
  .screen-head::after{display:none}
  .screen-head h1{margin-right:0;font-size:19px}
  .screen-head p{font-size:12px}

function riskMatrix(){
  var sev=["致命","嚴重","一般","輕微"];
  var occ=["罕見","偶發","常見","頻繁"];
  var grid=[
    ["mx-md","mx-hi","mx-hi","mx-hi"],
    ["mx-md","mx-md","mx-hi","mx-hi"],
    ["mx-lo","mx-md","mx-md","mx-hi"],
    ["mx-vlo","mx-lo","mx-md","mx-md"]
  ];
  var txt={"mx-hi":"高","mx-md":"中","mx-lo":"低","mx-vlo":"極低"};
  var rows=grid.map(function(r,i){
    var cells=r.map(function(c){return '<td class="'+c+'">'+txt[c]+'</td>';}).join("");
    return '<tr><th style="font-size:12px;color:var(--sub)">'+sev[i]+'</th>'+cells+'</tr>';
  }).join("");
  return '<table class="matrix"><thead><tr><th></th>'+occ.map(function(o){return '<th style="font-size:12px;color:var(--sub)">'+o+'</th>';}).join("")+'</tr></thead><tbody>'+rows+'</tbody></table>';
}

/* ---------- shared builders ---------- */
function head(ic,t,p){return '<div class="screen-head"><h1><span class="ms">'+ic+'</span>'+esc(t)+'</h1><p>'+esc(p)+'</p></div>';}
function kpi(ic,lbl,val,unit,dir,delta){
  var d=delta?'<div class="delta '+(dir==="down"?"down":"up")+'">'+(dir==="down"?'▼ ':'▲ ')+esc(delta)+'</div>':'<div class="delta">&nbsp;</div>';
  return '<div class="card kpi"><div class="lbl"><span class="ms">'+ic+'</span>'+esc(lbl)+'</div><div class="val">'+val+(unit||"")+'</div>'+d+'</div>';
}

/* ---------- charts ---------- */
function mkChart(id,cfg){
  var el=document.getElementById(id);
  if(!el) return;
  if(charts[id]){try{charts[id].destroy();}catch(e){}}
  charts[id]=new Chart(el.getContext("2d"),cfg);
}
var gridClr="rgba(15,39,26,.07)";
function baseOpts(extra){
  var o={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
    scales:{x:{grid:{display:false},ticks:{font:{size:11}}},y:{grid:{color:gridClr},ticks:{font:{size:11}},beginAtZero:true}}};
  if(extra){for(var k in extra){o[k]=extra[k];}}
  return o;
}
function initCharts(i){
  if(i===0){
    mkChart("c0a",{type:"bar",data:{labels:["ISO 2859-1","MIL-STD-105E","ISO 2859-2","GB/T 2828","JIS Z 9015","ANSI/ASQ Z1.4"],
      datasets:[{data:[130,120,64,128,120,118],backgroundColor:accent,borderRadius:6,maxBarThickness:22}]},
      options:baseOpts({indexAxis:"y",scales:{x:{grid:{color:gridClr},ticks:{font:{size:10}},beginAtZero:true},y:{grid:{display:false},ticks:{font:{size:10}}}}})});
  }else if(i===1){
    mkChart("c1a",{type:"radar",data:{labels:["安全性","功能影響","關鍵尺寸","客訴頻率","製程能力","供應商績效"],
      datasets:[
        {label:"高風險品項",data:[9,8,8,7,5,6],borderColor:red,backgroundColor:"rgba(220,38,38,.15)",pointBackgroundColor:red},
        {label:"低風險品項",data:[3,3,4,2,7,8],borderColor:accent,backgroundColor:"rgba(21,128,61,.15)",pointBackgroundColor:accent}
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,position:"bottom",labels:{font:{size:11},boxWidth:12}}},
        scales:{r:{suggestedMin:0,suggestedMax:10,grid:{color:gridClr},angleLines:{color:gridClr},pointLabels:{font:{size:11}},ticks:{display:false}}}}});
  }else if(i===2){
    var pd=[0.5,1,1.5,2,2.5,3,4,5,6,8,10];
    var oc=pd.map(function(p){return ocProb(80,2,p/100);});
    var oc2=pd.map(function(p){return ocProb(80,1,p/100);});
    mkChart("c2a",{type:"line",data:{labels:pd.map(function(p){return p+"%";}),
      datasets:[
        {label:"Ac=2",data:oc,borderColor:accent,backgroundColor:"rgba(21,128,61,.10)",fill:true,tension:.35,pointRadius:2},
        {label:"Ac=1",data:oc2,borderColor:amber,borderDash:[5,4],fill:false,tension:.35,pointRadius:0}
      ]},
      options:baseOpts({scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{grid:{color:gridClr},ticks:{font:{size:11},callback:function(v){return Math.round(v*100)+"%";}},min:0,max:1}}})});
  }else if(i===4){
    var wk=["W1","W2","W3","W4","W5","W6","W7","W8"];
    mkChart("c4a",{type:"bar",data:{labels:wk,datasets:[
      {label:"加嚴",data:[4,4,3,3,2,3,2,2],backgroundColor:red,stack:"s",borderRadius:3,maxBarThickness:24},
      {label:"正常",data:[40,41,42,42,43,41,42,41],backgroundColor:accent,stack:"s",borderRadius:3,maxBarThickness:24},
      {label:"減量",data:[5,5,6,7,7,8,8,9],backgroundColor:blue,stack:"s",borderRadius:3,maxBarThickness:24}
    ]},
      options:baseOpts({plugins:{legend:{display:true,position:"bottom",labels:{font:{size:11},boxWidth:12}}},scales:{x:{stacked:true,grid:{display:false},ticks:{font:{size:11}}},y:{stacked:true,grid:{color:gridClr},ticks:{font:{size:11}},beginAtZero:true}}})});
  }else if(i===5){
    mkChart("c5a",{type:"line",data:{labels:["第1週","第2週","第3週","第4週","第5週","第6週"],
      datasets:[{label:"合規率 %",data:[89,91,92,94,95.5,96.8],borderColor:accent,backgroundColor:"rgba(21,128,61,.12)",fill:true,tension:.35,pointRadius:3,pointBackgroundColor:accent}]},
      options:baseOpts({scales:{x:{grid:{display:false},ticks:{font:{size:11}}},y:{grid:{color:gridClr},ticks:{font:{size:11},callback:function(v){return v+"%";}},min:80,max:100}}})});
    mkChart("c5b",{type:"doughnut",data:{labels:["樣本量不足","隨機性佐證缺失","版本過期標準","記錄遺漏"],
      datasets:[{data:[42,28,18,12],backgroundColor:[red,amber,"#f59e0b",accent2],borderWidth:2,borderColor:"#fff"}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:"58%",plugins:{legend:{display:true,position:"bottom",labels:{font:{size:11},boxWidth:12,padding:10}}}}});
  }
}
function ocProb(n,ac,p){
  var s=0;
  for(var k=0;k<=ac;k++){ s+= binom(n,k)*Math.pow(p,k)*Math.pow(1-p,n-k); }
  return s;
}
function binom(n,k){
  if(k<0||k>n) return 0;
  var r=1;
  for(var j=0;j<k;j++){ r=r*(n-j)/(j+1); }
  return r;
}

/* ---------- render ---------- */
var SCREENS=[screen0,screen1,screen2,screen3,screen4,screen5];
function show(i){
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  var app=document.getElementById("app");
  app.innerHTML=SCREENS[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){ btns[b].classList.toggle("active", (+btns[b].getAttribute("data-i"))===i); }
  void app.offsetHeight;
  initCharts(i);
}
(function(){
  var nav=document.getElementById("navInner");
  nav.innerHTML=NAV.map(function(x,i){
    return '<button data-i="'+i+'"><span class="ms">'+x.icon+'</span><span class="lbl-t">'+x.t+'</span></button>';
  }).join("");
  var btns=nav.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    btns[b].addEventListener("click",function(){ var n=+this.getAttribute("data-i"); location.hash="v"+n; });
  }
})();

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
