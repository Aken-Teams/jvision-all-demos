<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>物業管理 — 營運管理主控台</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --accent:#0f766e; --accent2:#5eead4; --accent-soft:#e6fffb;
    --ink:#0f2b28; --muted:#5f7c78; --line:#e2eeeb; --bg:#f3f8f7; --card:#ffffff;
    --ok:#0f766e; --warn:#c2820b; --bad:#c0392b; --info:#2563eb;
    --shadow:0 1px 2px rgba(15,118,110,.06),0 8px 24px rgba(15,118,110,.07);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); font-size:14px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .msi{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;font-feature-settings:'liga';-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;vertical-align:middle}
  .app{display:flex;min-height:100vh}
  /* sidebar */
  .side{
    width:236px;flex:none;background:#fff;border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:18px 14px;gap:6px;position:sticky;top:0;height:100vh;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;margin-bottom:4px;border-bottom:1px solid var(--line)}
  .brand .logo{width:38px;height:38px;flex:none;border-radius:11px;background:linear-gradient(135deg,var(--accent),#0d5f58);color:#fff;display:flex;align-items:center;justify-content:center}
  .brand .logo .msi{font-size:22px}
  .brand h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.5px}
  .brand p{margin:2px 0 0;font-size:11px;color:var(--muted)}
  .navbtn{
    display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;border:none;
    background:transparent;color:var(--muted);cursor:pointer;font:inherit;font-size:13.5px;text-align:left;width:100%;
    transition:background .15s,color .15s;font-weight:500;
  }
  .navbtn .msi{font-size:21px}
  .navbtn:hover{background:var(--accent-soft);color:var(--accent)}
  .navbtn.on{background:var(--accent);color:#fff}
  .navbtn .sub{display:block;font-size:10.5px;font-weight:400;opacity:.75;margin-top:1px}
  .side-foot{margin-top:auto;padding:12px 10px 2px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .side-foot .dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 3px var(--accent-soft);animation:pulse 2.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  /* main */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{
    display:flex;align-items:center;gap:14px;padding:16px 26px;background:rgba(255,255,255,.85);
    backdrop-filter:blur(6px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
  }
  .topbar .t-title{font-size:17px;font-weight:700;margin:0}
  .topbar .t-sub{font-size:12px;color:var(--muted);margin:2px 0 0}
  .topbar .spacer{flex:1;min-width:0}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600}
  .pill .msi{font-size:16px}
  .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#0d5f58,var(--accent2));color:#083b37;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
  .wrap{padding:22px 26px 40px;max-width:1240px;width:100%}
  /* generic */
  .grid{display:grid;gap:16px}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g23{grid-template-columns:1.6fr 1fr}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
  .card h3{margin:0 0 3px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
  .card h3 .msi{font-size:18px;color:var(--accent)}
  .card .csub{font-size:11.5px;color:var(--muted);margin:0 0 14px}
  .kpi .kv{font-size:26px;font-weight:700;letter-spacing:-.5px;margin:6px 0 2px}
  .kpi .kl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .kpi .kd{font-size:11.5px;font-weight:600;margin-top:8px;display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px}
  .kd.up{background:#e6fffb;color:var(--ok)} .kd.down{background:#fdecea;color:var(--bad)} .kd.flat{background:#f1f5f4;color:var(--muted)}
  .kpi .ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);float:right}
  .kpi .ic .msi{font-size:22px}
  .chartbox{position:relative;height:260px}
  .chartbox.sm{height:210px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:11px;letter-spacing:.4px;color:var(--muted);font-weight:600;text-transform:uppercase;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:11px 12px;border-bottom:1px solid #eef5f3;white-space:nowrap}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#f7fbfa}
  .tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600}
  .t-ok{background:#e6fffb;color:var(--ok)} .t-warn{background:#fdf3e0;color:var(--warn)} .t-bad{background:#fdecea;color:var(--bad)} .t-info{background:#e8f0fe;color:var(--info)} .t-mut{background:#f1f5f4;color:var(--muted)}
  .bar{height:7px;border-radius:5px;background:#eef5f3;overflow:hidden;min-width:52px}
  .bar > i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .av{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
  .hr{height:1px;background:var(--line);margin:14px 0;border:0}
  /* board */
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .col{background:#f6faf9;border:1px solid var(--line);border-radius:13px;padding:12px;min-width:0}
  .col-h{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:10px}
  .col-h .cnt{font-size:11px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
  .ticket{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:11px;margin-bottom:10px;box-shadow:0 1px 2px rgba(15,118,110,.04)}
  .ticket.p-hi{border-left-color:var(--bad)} .ticket.p-md{border-left-color:var(--warn)} .ticket.p-lo{border-left-color:var(--info)}
  .ticket .tt{font-size:12.5px;font-weight:600;margin-bottom:4px;white-space:normal}
  .ticket .tm{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  /* timeline */
  .tl{position:relative;padding-left:26px}
  .tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
  .tl-item{position:relative;padding:0 0 18px}
  .tl-item:last-child{padding-bottom:0}
  .tl-dot{position:absolute;left:-22px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
  .tl-dot.done{background:var(--accent)} .tl-dot.warn{border-color:var(--warn)} .tl-dot.bad{border-color:var(--bad)}
  .tl-time{font-size:11px;color:var(--muted);font-weight:600}
  .tl-txt{font-size:13px;margin-top:2px}
  /* condition */
  .cond-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .cond{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .cond .ph{height:96px;background:linear-gradient(135deg,#d9f2ee,#f0fbf9);display:flex;align-items:center;justify-content:center;color:var(--accent);position:relative}
  .cond .ph .msi{font-size:40px;opacity:.5}
  .cond .ph .score{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.92);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700}
  .cond .cb{padding:11px}
  .cond .cb .cn{font-size:12.5px;font-weight:600}
  .cond .cb .cm{font-size:11px;color:var(--muted);margin-top:3px}
  .legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--muted);margin-top:12px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dotc{width:10px;height:10px;border-radius:3px;display:inline-block}
  .split-num{font-variant-numeric:tabular-nums}
  .amt{font-weight:700;font-variant-numeric:tabular-nums}
  /* calendar */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal .cd{border:1px solid var(--line);border-radius:9px;min-height:64px;padding:6px;font-size:11px;background:#fff;min-width:0}
  .cal .cd .dn{font-weight:700;color:var(--muted);font-size:11px}
  .cal .cd.dim{background:#fafcfb;color:#b9cdc9}
  .cal .cd.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .ev{margin-top:4px;font-size:10px;padding:2px 5px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ev.a{background:#e6fffb;color:var(--ok)} .ev.b{background:#fdf3e0;color:var(--warn)} .ev.c{background:#e8f0fe;color:var(--info)}
  /* mobile nav */
  .mnav{display:none}
  @media(max-width:860px){
    .app{flex-direction:column}
    .side{display:none}
    .mnav{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
    .mnav .navbtn{width:auto;flex:none;white-space:nowrap;padding:9px 13px;border:1px solid var(--line)}
    .mnav .navbtn .sub{display:none}
    .mnav .navbtn.on{border-color:var(--accent)}
    .topbar{padding:14px 16px}
    .wrap{padding:16px 16px 34px}
  }
  @media(max-width:820px){
    .g4,.g3,.g2,.g23{grid-template-columns:1fr}
    .board{grid-template-columns:1fr 1fr}
    .cond-grid{grid-template-columns:1fr 1fr}
  }
  @media(max-width:560px){
    .mnav .navbtn .lbl{display:none}
    .mnav .navbtn{padding:9px 11px}
    .board{grid-template-columns:1fr}
    .cond-grid{grid-template-columns:1fr}
    .cal .cd{min-height:52px}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="msi">holiday_village</span></div>
      <div><h1>物業管理</h1><p>營運管理主控台</p></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot"><span class="dot"></span>資料即時同步 · 12 棟社區</div>
  </aside>
  <div class="main">
    <nav class="mnav" id="mnav"></nav>
    <header class="topbar">
      <div>
        <p class="t-title" id="scr-title">房源總覽</p>
        <p class="t-sub" id="scr-sub">物件狀態與出租率</p>
      </div>
      <div class="spacer"></div>
      <span class="pill"><span class="msi">calendar_today</span>2026 年 8 月</span>
      <div class="avatar">陳</div>
    </header>
    <main class="wrap"><div id="screen"></div></main>
  </div>
</div>

<script>
var MODULES = [
  {icon:"apartment",     name:"房源總覽",    sub:"物件狀態與出租率"},
  {icon:"description",   name:"租約管理",    sub:"到期與續約排程"},
  {icon:"receipt_long",  name:"帳單租金對帳", sub:"開立與入帳核銷"},
  {icon:"handyman",      name:"修繕派工",    sub:"報修工單與進度"},
  {icon:"fact_check",    name:"點交驗屋",    sub:"AI 現況與缺失清單"},
  {icon:"insights",      name:"營運洞察",    sub:"收益、逾期與缺失"}
];

function nt(n){return (n||0).toLocaleString("en-US");}

var CHARTS=[];
function killCharts(){for(var i=0;i<CHARTS.length;i++){try{CHARTS[i].destroy();}catch(e){}}CHARTS=[];}
var C={accent:"#0f766e",accent2:"#5eead4",warn:"#c2820b",bad:"#c0392b",info:"#2563eb",grid:"#e2eeeb",muted:"#5f7c78"};
Chart.defaults.font.family="Inter, 'Noto Sans TC', sans-serif";
Chart.defaults.font.size=12;
Chart.defaults.color=C.muted;
Chart.defaults.plugins.legend.labels.boxWidth=12;
Chart.defaults.plugins.legend.labels.usePointStyle=true;

/* ============ SCREEN 0 : 房源總覽 ============ */
function s0(){
  var kpis=[
    {l:"管理物件",v:"842",u:"戶",d:"+18 本月",up:1,ic:"apartment"},
    {l:"整體出租率",v:"92.4",u:"%",d:"+2.1%",up:1,ic:"trending_up"},
    {l:"空置待租",v:"64",u:"戶",d:"-9 戶",up:1,ic:"meeting_room"},
    {l:"本月租金收入",v:"NT$ 3.28",u:"M",d:"+6.4%",up:1,ic:"payments"}
  ];
  var k="";
  for(var i=0;i<kpis.length;i++){var x=kpis[i];
    k+='<div class="card kpi"><div class="ic"><span class="msi">'+x.ic+'</span></div>'+
       '<div class="kl">'+x.l+'</div><div class="kv">'+x.v+' <span style="font-size:14px;color:var(--muted);font-weight:600">'+x.u+'</span></div>'+
       '<div class="kd '+(x.up?'up':'down')+'"><span class="msi" style="font-size:14px">'+(x.up?'arrow_upward':'arrow_downward')+'</span>'+x.d+'</div></div>';
  }
  var communities=[
    {n:"和光帝景社區",addr:"台北市信義區",tot:120,rented:114,rate:95},
    {n:"青田水岸大廈",addr:"新北市板橋區",tot:96,rented:87,rate:91},
    {n:"松江名邸",addr:"台北市中山區",tot:84,rented:80,rate:95},
    {n:"文心森林苑",addr:"台中市西屯區",tot:150,rented:132,rate:88},
    {n:"美術東方",addr:"高雄市鼓山區",tot:72,rented:69,rate:96},
    {n:"竹科學府會館",addr:"新竹市東區",tot:110,rented:96,rate:87}
  ];
  var rows="";
  for(var j=0;j<communities.length;j++){var c=communities[j];
    var cls=c.rate>=93?"t-ok":c.rate>=88?"t-warn":"t-bad";
    rows+='<tr><td><b>'+c.n+'</b><div style="font-size:11px;color:var(--muted)">'+c.addr+'</div></td>'+
      '<td class="split-num">'+c.tot+'</td><td class="split-num">'+c.rented+'</td>'+
      '<td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i style="width:'+c.rate+'%"></i></div><span class="split-num" style="font-size:12px">'+c.rate+'%</span></div></td>'+
      '<td><span class="tag '+cls+'">'+(c.rate>=93?"良好":c.rate>=88?"注意":"待招租")+'</span></td></tr>';
  }
  var html=
  '<div class="grid g4">'+k+'</div>'+
  '<div style="height:16px"></div>'+
  '<div class="grid g23">'+
    '<div class="card"><h3><span class="msi">real_estate_agent</span>各社區出租概況</h3><p class="csub">共 12 棟社區 · 依出租率排序</p>'+
      '<div style="overflow-x:auto"><table><thead><tr><th>社區</th><th>總戶數</th><th>已出租</th><th>出租率</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
    '<div class="card"><h3><span class="msi">donut_large</span>物件狀態分布</h3><p class="csub">842 戶即時狀態</p>'+
      '<div class="chartbox sm"><canvas id="c0a"></canvas></div>'+
      '<div class="legend"><span><i class="dotc" style="background:#0f766e"></i>出租中 778</span><span><i class="dotc" style="background:#5eead4"></i>待租 64</span><span><i class="dotc" style="background:#c2820b"></i>整修中 21</span><span><i class="dotc" style="background:#e2eeeb"></i>保留 9</span></div></div>'+
  '</div>'+
  '<div style="height:16px"></div>'+
  '<div class="grid g2">'+
    '<div class="card"><h3><span class="msi">show_chart</span>近 6 月出租率趨勢</h3><p class="csub">整體 vs 標竿社區</p><div class="chartbox sm"><canvas id="c0b"></canvas></div></div>'+
    '<div class="card"><h3><span class="msi">stacked_bar_chart</span>各房型平均租金（NT$/月）</h3><p class="csub">依坪數區間</p><div class="chartbox sm"><canvas id="c0c"></canvas></div></div>'+
  '</div>';
  return {html:html,init:function(){
    CHARTS.push(new Chart(document.getElementById("c0a"),{type:"doughnut",
      data:{labels:["出租中","待租","整修中","保留"],datasets:[{data:[778,64,21,9],backgroundColor:["#0f766e","#5eead4","#c2820b","#e2eeeb"],borderWidth:0}]},
      options:{cutout:"64%",plugins:{legend:{display:false}},maintainAspectRatio:false}}));
    CHARTS.push(new Chart(document.getElementById("c0b"),{type:"line",
      data:{labels:["3月","4月","5月","6月","7月","8月"],datasets:[
        {label:"整體出租率",data:[88,89,90,90.5,91.6,92.4],borderColor:C.accent,backgroundColor:"rgba(15,118,110,.10)",fill:true,tension:.4,borderWidth:2.5,pointRadius:3},
        {label:"標竿社區",data:[93,94,94,95,95,96],borderColor:C.warn,backgroundColor:"transparent",tension:.4,borderWidth:2,pointRadius:2,borderDash:[5,4]}]},
      options:{maintainAspectRatio:false,scales:{y:{min:82,max:100,grid:{color:C.grid},ticks:{callback:function(v){return v+"%"}}},x:{grid:{display:false}}}}}));
    CHARTS.push(new Chart(document.getElementById("c0c"),{type:"bar",
      data:{labels:["套房","1房","2房","3房","4房以上"],datasets:[{label:"平均租金",data:[16800,24500,32800,41200,58600],backgroundColor:"#0f766e",borderRadius:6,barThickness:34}]},
      options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{grid:{color:C.grid},ticks:{callback:function(v){return (v/1000)+"k"}}},x:{grid:{display:false}}}}}));
  }};
}

/* ============ SCREEN 1 : 租約管理 ============ */
function s1(){
  var stats=[
    {n:"128",l:"有效租約",c:"var(--accent)"},
    {n:"17",l:"90 天內到期",c:"var(--warn)"},
    {n:"6",l:"逾期未續",c:"var(--bad)"},
    {n:"84%",l:"續約成功率",c:"var(--info)"}
  ];
  var ms="";
  for(var i=0;i<stats.length;i++){ms+='<div class="card" style="text-align:center"><div style="font-size:28px;font-weight:700;color:'+stats[i].c+'">'+stats[i].n+'</div><div class="kl" style="justify-content:center">'+stats[i].l+'</div></div>';}
  var leases=[
    {u:"陳彥廷",unit:"和光帝景 A-1203",end:"2026/08/22",left:9,rent:38000,st:"到期在即",cls:"t-bad",prog:96},
    {u:"林思妤",unit:"青田水岸 B-0705",end:"2026/09/15",left:33,rent:29500,st:"續約洽談",cls:"t-warn",prog:78},

/* ---------- controller ---------- */
var SCREENS=[s0,s1,s2,s3,s4,s5];
var cur=-1;
var container=document.getElementById("screen");

function buildNav(){
  var nav=document.getElementById("nav"), mnav=document.getElementById("mnav");
  var h="";
  for(var i=0;i<MODULES.length;i++){var m=MODULES[i];
    h+='<button class="navbtn" data-i="'+i+'"><span class="msi">'+m.icon+'</span><span class="lbl"><span>'+m.name+'</span><span class="sub">'+m.sub+'</span></span></button>';
  }
  nav.innerHTML=h; mnav.innerHTML=h;
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    btns[b].addEventListener("click",function(){show(+this.getAttribute("data-i"));});
  }
}

function show(i){
  if(i===cur)return;
  killCharts();
  cur=i;
  var m=MODULES[i];
  document.getElementById("scr-title").textContent=m.name;
  document.getElementById("scr-sub").textContent=m.sub;
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    if(+btns[b].getAttribute("data-i")===i)btns[b].classList.add("on");
    else btns[b].classList.remove("on");
  }
  var res=SCREENS[i]();
  container.innerHTML=res.html;
  void container.offsetHeight;
  if(res.init)res.init();
}

buildNav();
show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m)return;var n=(typeof SCREENS!=="undefined"?SCREENS.length:6);show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
