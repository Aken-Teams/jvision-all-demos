<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>物業管理 — 營運管理主控台</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Josefin+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#0F766E;
  --color-on-primary:#FFFFFF;
  --color-secondary:#14B8A6;
  --color-on-secondary:#0F172A;
  --color-accent:#0369A1;
  --color-on-accent:#FFFFFF;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F0F3;
  --color-muted-foreground:#475569;
  --color-border:#99F6E4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0F766E;
  --blue:#0369A1;
  --ink:#134E4A;
  --muted:#475569;
  --line:#99F6E4;
  --accent:#0F766E;
  --accent2:#14B8A6;
  --accent-soft:#CCFBF1;
  --bg:#F0FDFA;
  --card:rgba(255,255,255,.76);
  --ok:#0F766E;
  --warn:#9A6700;
  --bad:#B91C1C;
  --info:#0369A1;
  --shadow:0 1px 2px rgba(15,118,110,.07),0 14px 38px rgba(15,118,110,.10);
  --shadow-hover:0 2px 5px rgba(15,118,110,.08),0 20px 46px rgba(3,105,161,.13);
}
*{box-sizing:border-box}
html{min-width:320px;scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  font-family:"Josefin Sans","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 10% 5%,rgba(20,184,166,.19),transparent 29rem),
    radial-gradient(circle at 92% 12%,rgba(3,105,161,.12),transparent 31rem),
    linear-gradient(145deg,#ecfdf9 0%,var(--color-background) 48%,#e7f8f7 100%);
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,a,[role="button"]{cursor:pointer}
button,input,select,textarea{font:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
::selection{color:var(--color-on-primary);background:var(--color-primary)}
.msi{
  display:inline-block;
  font-family:"Material Symbols Outlined";
  font-weight:400;
  font-style:normal;
  font-size:1em;
  line-height:1;
  letter-spacing:normal;
  text-transform:none;
  white-space:nowrap;
  word-wrap:normal;
  direction:ltr;
  font-feature-settings:'liga';
  -webkit-font-feature-settings:'liga';
  -webkit-font-smoothing:antialiased;
  vertical-align:middle;
}
.app{display:flex;min-height:100vh}
.side{
  position:sticky;
  top:0;
  z-index:40;
  display:flex;
  flex:none;
  flex-direction:column;
  gap:7px;
  width:252px;
  height:100vh;
  padding:20px 16px;
  overflow-y:auto;
  color:#E6FFFB;
  background:linear-gradient(165deg,rgba(8,66,62,.96),rgba(15,118,110,.91));
  border-right:1px solid rgba(255,255,255,.22);
  box-shadow:14px 0 42px rgba(15,78,74,.14);
  backdrop-filter:blur(18px) saturate(145%);
  -webkit-backdrop-filter:blur(18px) saturate(145%);
}
.side::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.12),transparent 35%);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:7px;
  padding:7px 7px 18px;
  border-bottom:1px solid rgba(255,255,255,.18);
}
.brand .logo{
  display:flex;
  flex:none;
  align-items:center;
  justify-content:center;
  width:43px;
  height:43px;
  color:#FFFFFF;
  background:linear-gradient(145deg,rgba(255,255,255,.24),rgba(20,184,166,.18));
  border:1px solid rgba(255,255,255,.35);
  border-radius:14px;
  box-shadow:inset 0 1px rgba(255,255,255,.25),0 9px 24px rgba(2,44,42,.22);
  backdrop-filter:blur(12px);
}
.brand .logo .msi{font-size:24px}
.brand h1{
  margin:0;
  color:#FFFFFF;
  font-family:"Cinzel","PingFang TC",serif;
  font-size:16px;
  font-weight:600;
  letter-spacing:.07em;
}
.brand p{margin:3px 0 0;color:#CCFBF1;font-size:11px;letter-spacing:.08em}
.navbtn{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  min-height:48px;
  padding:10px 12px;
  color:#D7FFFA;
  background:transparent;
  border:1px solid transparent;
  border-radius:13px;
  font-size:13.5px;
  font-weight:500;
  text-align:left;
  transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s ease,box-shadow .2s ease;
}
.navbtn .msi{flex:none;font-size:21px}
.navbtn:hover{
  color:#FFFFFF;
  background:rgba(255,255,255,.12);
  border-color:rgba(255,255,255,.21);
  transform:translateX(2px);
}
.navbtn.on{
  color:#083F3B;
  background:linear-gradient(135deg,rgba(255,255,255,.97),rgba(204,251,241,.91));
  border-color:rgba(255,255,255,.7);
  box-shadow:0 9px 25px rgba(3,53,50,.22),inset 0 1px rgba(255,255,255,.8);
}
.navbtn .sub{display:block;margin-top:1px;font-size:10.5px;font-weight:400;opacity:.78}
.side-foot{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:auto;
  padding:14px 10px 3px;
  color:#CCFBF1;
  border-top:1px solid rgba(255,255,255,.18);
  font-size:11px;
}
.side-foot .dot{
  width:9px;
  height:9px;
  flex:none;
  background:#5EEAD4;
  border:2px solid #083F3B;
  border-radius:50%;
  box-shadow:0 0 0 3px rgba(94,234,212,.25);
}
.main{display:flex;flex:1;min-width:0;flex-direction:column}
.topbar{
  position:sticky;
  top:0;
  z-index:30;
  display:flex;
  align-items:center;
  gap:15px;
  min-height:78px;
  padding:15px clamp(18px,3vw,34px);
  background:rgba(240,253,250,.74);
  border-bottom:1px solid rgba(153,246,228,.8);
  box-shadow:0 9px 30px rgba(15,118,110,.06);
  backdrop-filter:blur(18px) saturate(150%);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
}
.topbar::after{
  content:"";
  position:absolute;
  right:0;
  bottom:-1px;
  left:0;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);
}
.topbar .t-title{
  margin:0;
  color:#0F4F4A;
  font-family:"Cinzel","PingFang TC",serif;
  font-size:clamp(18px,2vw,22px);
  font-weight:600;
  letter-spacing:.035em;
}
.topbar .t-sub{margin:2px 0 0;color:var(--muted);font-size:12px;letter-spacing:.025em}
.topbar .spacer{flex:1;min-width:0}
.pill{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:36px;
  padding:6px 13px;
  color:#0F5D57;
  background:rgba(255,255,255,.65);
  border:1px solid rgba(153,246,228,.95);
  border-radius:999px;
  box-shadow:inset 0 1px rgba(255,255,255,.9);
  font-size:12px;
  font-weight:600;
  backdrop-filter:blur(12px);
}
.pill .msi{font-size:17px}
.avatar{
  display:flex;
  flex:none;
  align-items:center;
  justify-content:center;
  width:38px;
  height:38px;
  color:#FFFFFF;
  background:linear-gradient(135deg,var(--color-primary),var(--color-accent));
  border:2px solid rgba(255,255,255,.8);
  border-radius:50%;
  box-shadow:0 5px 14px rgba(3,105,161,.2);
  font-weight:700;
}
.wrap{width:100%;max-width:1440px;padding:24px clamp(16px,3vw,34px) 48px}
#screen{animation:screenReveal .38s ease-out both}
@keyframes screenReveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr)}
.card{
  position:relative;
  min-width:0;
  padding:18px;
  overflow:hidden;
  color:var(--color-card-foreground);
  background:linear-gradient(145deg,rgba(255,255,255,.88),rgba(255,255,255,.68));
  border:1px solid rgba(255,255,255,.85);
  border-radius:18px;
  box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.96);
  backdrop-filter:blur(16px) saturate(135%);
  -webkit-backdrop-filter:blur(16px) saturate(135%);
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.card::before{
  content:"";
  position:absolute;
  top:0;
  right:12%;
  left:12%;
  height:1px;
  pointer-events:none;
  background:linear-gradient(90deg,transparent,#FFFFFF,transparent);
}
.card:hover{border-color:rgba(153,246,228,.95);box-shadow:var(--shadow-hover),inset 0 1px #FFFFFF;transform:translateY(-2px)}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 3px;
  color:#104F4B;
  font-family:"Cinzel","PingFang TC",serif;
  font-size:14px;
  font-weight:600;
  letter-spacing:.025em;
}
.card h3 .msi{color:var(--color-primary);font-size:19px}
.card .csub{margin:0 0 14px;color:var(--muted);font-size:11.5px}
.kpi{min-height:139px}
.kpi::after{
  content:"";
  position:absolute;
  right:-28px;
  bottom:-38px;
  width:100px;
  height:100px;
  pointer-events:none;
  background:radial-gradient(circle,rgba(20,184,166,.14),transparent 70%);
}
.kpi .kv{
  margin:7px 0 2px;
  color:#103F3C;
  font-family:"Cinzel","Josefin Sans",serif;
  font-size:clamp(24px,2.4vw,29px);
  font-weight:600;
  letter-spacing:-.035em;
  line-height:1.25;
  font-variant-numeric:tabular-nums lining-nums;
}
.kpi .kl,.kl{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.kpi .kd{
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin-top:9px;
  padding:4px 9px;
  border:1px solid transparent;
  border-radius:999px;
  font-size:11.5px;
  font-weight:600;
}
.kd.up{color:#0B625A;background:#D6FAF2;border-color:#99F6E4}
.kd.down{color:#A51616;background:#FEF2F2;border-color:#FECACA}
.kd.flat{color:#475569;background:#F1F5F9;border-color:#CBD5E1}
.kpi .ic{
  display:flex;
  float:right;
  align-items:center;
  justify-content:center;
  width:43px;
  height:43px;
  color:var(--color-primary);
  background:linear-gradient(145deg,rgba(204,251,241,.92),rgba(255,255,255,.72));
  border:1px solid rgba(153,246,228,.9);
  border-radius:14px;
  box-shadow:inset 0 1px #FFFFFF,0 7px 18px rgba(15,118,110,.09);
}
.kpi .ic .msi{font-size:23px}
.chartbox{position:relative;height:260px}
.chartbox.sm{height:210px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
th{
  padding:9px 12px;
  color:#3E5965;
  background:rgba(232,240,243,.72);
  border-top:1px solid rgba(153,246,228,.6);
  border-bottom:1px solid var(--line);
  font-size:10.5px;
  font-weight:600;
  letter-spacing:.07em;
  text-align:left;
  text-transform:uppercase;
  white-space:nowrap;
}
th:first-child{border-radius:9px 0 0 0}
th:last-child{border-radius:0 9px 0 0}
td{
  padding:11px 12px;
  border-bottom:1px solid rgba(153,246,228,.44);
  white-space:nowrap;
  vertical-align:middle;
}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:rgba(204,251,241,.38)}
.amt{text-align:right;font-weight:700;font-variant-numeric:tabular-nums lining-nums}
.split-num{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-variant-numeric:tabular-nums lining-nums}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 9px;
  border:1px solid transparent;
  border-radius:999px;
  font-size:11.5px;
  font-weight:600;
  line-height:1.2;
}
.t-ok{color:#0B625A;background:#D6FAF2;border-color:#75E6D3}
.t-warn{color:#805300;background:#FFF7D6;border-color:#F4D06F}
.t-bad{color:#A51616;background:#FEF2F2;border-color:#FCA5A5}
.t-info{color:#075985;background:#E0F2FE;border-color:#7DD3FC}
.t-mut{color:#475569;background:#F1F5F9;border-color:#CBD5E1}
.bar{height:8px;min-width:52px;overflow:hidden;background:#DDE9E8;border:1px solid rgba(153,246,228,.7);border-radius:999px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--color-primary),var(--color-secondary));border-radius:999px}
.av{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:29px;
  height:29px;
  color:#0F625B;
  background:#CCFBF1;
  border:1px solid #99F6E4;
  border-radius:10px;
  font-weight:700;
}
.hr{height:1px;margin:15px 0;background:linear-gradient(90deg,transparent,var(--line),transparent);border:0}
.board{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:13px}
.col{min-width:0;padding:12px;background:rgba(232,240,243,.5);border:1px solid rgba(153,246,228,.75);border-radius:15px}
.col-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;color:#164E49;font-size:12.5px;font-weight:700}
.col-h .cnt{padding:2px 8px;color:var(--muted);background:rgba(255,255,255,.78);border:1px solid var(--line);border-radius:999px;font-size:11px}
.ticket{
  margin-bottom:10px;
  padding:11px;
  background:rgba(255,255,255,.86);
  border:1px solid rgba(153,246,228,.8);
  border-left:4px solid var(--color-primary);
  border-radius:11px;
  box-shadow:0 4px 13px rgba(15,118,110,.06);
}
.ticket.p-hi{border-left-color:var(--bad)}
.ticket.p-md{border-left-color:var(--warn)}
.ticket.p-lo{border-left-color:var(--info)}
.ticket .tt{margin-bottom:5px;font-size:12.5px;font-weight:600;white-space:normal}
.ticket .tm{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:11px}
.tl{position:relative;padding-left:27px}
.tl::before{content:"";position:absolute;top:4px;bottom:4px;left:9px;width:2px;background:linear-gradient(var(--color-primary),var(--line))}
.tl-item{position:relative;padding:0 0 18px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;top:2px;left:-23px;width:15px;height:15px;background:#FFFFFF;border:3px solid var(--color-primary);border-radius:50%}
.tl-dot.done{background:var(--color-primary);box-shadow:0 0 0 3px rgba(20,184,166,.16)}
.tl-dot.warn{border-color:var(--warn)}
.tl-dot.bad{border-color:var(--bad)}
.tl-time{color:var(--muted);font-family:"SFMono-Regular",Consolas,monospace;font-size:10.5px;font-weight:600}
.tl-txt{margin-top:2px;font-size:13px}
.cond-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.cond{overflow:hidden;background:rgba(255,255,255,.76);border:1px solid rgba(153,246,228,.85);border-radius:15px;box-shadow:0 6px 18px rgba(15,118,110,.06)}
.cond .ph{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  height:104px;
  color:var(--color-primary);
  background:radial-gradient(circle at 50% 20%,rgba(255,255,255,.9),transparent 38%),linear-gradient(135deg,#CFF8F0,#E5F3FA);
  border-bottom:1px solid rgba(153,246,228,.7);
}
.cond .ph .msi{font-size:42px;opacity:.72}
.cond .ph .score{position:absolute;top:9px;right:9px;padding:4px 9px;background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.95);border-radius:999px;box-shadow:0 3px 10px rgba(15,78,74,.09);font-size:12px;font-weight:700;backdrop-filter:blur(10px)}
.cond .cb{padding:12px}
.cond .cb .cn{font-size:12.5px;font-weight:600}
.cond .cb .cm{margin-top:4px;color:var(--muted);font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:8px 13px;margin-top:12px;color:var(--muted);font-size:11.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dotc{display:inline-block;width:10px;height:10px;border:1px solid rgba(19,78,74,.18);border-radius:3px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(70px,1fr));gap:6px;min-width:560px}
.cal .cd{min-width:0;min-height:66px;padding:7px;background:rgba(255,255,255,.74);border:1px solid rgba(153,246,228,.8);border-radius:10px;font-size:11px}
.cal .cd .dn{color:var(--muted);font-family:"SFMono-Regular",Consolas,monospace;font-size:11px;font-weight:700}
.cal .cd.dim{color:#78908E;background:rgba(232,240,243,.52)}
.cal .cd.today{border-color:var(--color-primary);box-shadow:0 0 0 2px rgba(15,118,110,.18)}
.ev{margin-top:4px;padding:2px 5px;overflow:hidden;border:1px solid transparent;border-radius:5px;font-size:10px;text-overflow:ellipsis;white-space:nowrap}
.ev.a{color:#0B625A;background:#D6FAF2;border-color:#99F6E4}
.ev.b{color:#805300;background:#FFF7D6;border-color:#F4D06F}
.ev.c{color:#075985;background:#E0F2FE;border-color:#7DD3FC}
.mnav{display:none}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23{grid-template-columns:minmax(0,1.45fr) minmax(280px,1fr)}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{display:none}
  .mnav{
    position:sticky;
    top:0;
    z-index:50;
    display:flex;
    gap:8px;
    padding:10px 16px;
    overflow-x:auto;
    color:var(--ink);
    background:rgba(240,253,250,.88);
    border-bottom:1px solid var(--line);
    box-shadow:0 8px 25px rgba(15,118,110,.08);
    backdrop-filter:blur(18px);
    scrollbar-width:thin;
  }
  .mnav .navbtn{width:auto;min-height:44px;flex:none;padding:8px 12px;color:var(--muted);background:rgba(255,255,255,.55);border:1px solid rgba(153,246,228,.8);white-space:nowrap}
  .mnav .navbtn:hover{color:var(--color-primary);background:#FFFFFF;transform:translateY(-1px)}
  .mnav .navbtn.on{color:#FFFFFF;background:linear-gradient(135deg,var(--color-primary),#0B635C);border-color:var(--color-primary);box-shadow:0 7px 18px rgba(15,118,110,.2)}
  .mnav .navbtn .sub{display:none}
  .topbar{top:65px;min-height:70px;padding:13px 16px}
  .wrap{padding:17px 16px 36px}
  .g23{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(4,minmax(230px,1fr))}
}
@media(max-width:768px){
  .g3,.g2{grid-template-columns:1fr}
  .cond-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chartbox{height:240px}
}
@media(max-width:560px){
  body{font-size:13px}
  .mnav{padding:9px 12px}
  .mnav .navbtn{min-width:44px;justify-content:center;padding:9px 11px}
  .mnav .navbtn .lbl{display:none}
  .topbar{top:63px;gap:9px;padding:12px}
  .topbar .t-sub{display:none}
  .pill{padding:6px 9px;font-size:11px}
  .avatar{width:35px;height:35px}
  .wrap{padding:14px 12px 30px}
  .grid{gap:12px}
  .g4{grid-template-columns:1fr}
  .card{padding:15px;border-radius:15px}
  .kpi{min-height:128px}
  .cond-grid{grid-template-columns:1fr}
  .cal .cd{min-height:54px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}

/* ---------- controller ---------- */
var SCREENS=[s0,s1,s2,s3,s4,s5];
var cur=-1;
var container=document.getElementById("screen");

function buildNav(){
  var nav=document.getElementById("nav"), mnav=document.getElementById("mnav");
  var h="";
  for(var i=0;i<MODULES.length;i++){var m=MODULES[i];
    h+='<button class="navbtn" data-i="'+i+'"><span class="msi">'+m.icon+'</span><span class="lbl"><span>'+m.name+'</span><span class="sub">'+m.sub+'</span></span></button>';
  }
  nav.innerHTML=h; mnav.innerHTML=h;
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    btns[b].addEventListener("click",function(){show(+this.getAttribute("data-i"));});
  }
}

function show(i){
  if(i===cur)return;
  killCharts();
  cur=i;
  var m=MODULES[i];
  document.getElementById("scr-title").textContent=m.name;
  document.getElementById("scr-sub").textContent=m.sub;
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){
    if(+btns[b].getAttribute("data-i")===i)btns[b].classList.add("on");
    else btns[b].classList.remove("on");
  }
  var res=SCREENS[i]();
  container.innerHTML=res.html;
  void container.offsetHeight;
  if(res.init)res.init();
}

buildNav();
show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m)return;var n=(typeof SCREENS!=="undefined"?SCREENS.length:6);show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
