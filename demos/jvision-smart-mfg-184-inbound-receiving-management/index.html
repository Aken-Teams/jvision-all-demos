<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>進貨收料管理系統 Inbound Receiving Management</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#334155;
  --color-on-primary:#fff;
  --color-secondary:#475569;
  --color-on-secondary:#fff;
  --color-accent:#059669;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#0f172a;
  --color-card:#fff;
  --color-card-foreground:#0f172a;
  --color-muted:#f2f3f4;
  --color-muted-foreground:#475569;
  --color-border:#e6e8ea;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#334155;
  --blue:#334155;
  --ink:#0f172a;
  --muted:#475569;
  --line:#e6e8ea;
  --accent:#059669;
  --accent-dark:#047857;
  --background:#f8fafc;
  --card:#fff;
  --good:#047857;
  --warn:#a15c00;
  --bad:#b91c1c;
  --info:#1d4ed8;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  min-width:320px;
  max-width:100%;
  overflow-x:hidden;
  background:var(--background);
  color:var(--ink);
  font-family:"Open Sans",sans-serif;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,a,[onclick]{cursor:pointer}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:400;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
  font-feature-settings:"liga";
}
.topbar{
  position:sticky;
  top:0;
  z-index:30;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-bottom:1px solid #1e293b;
}
.topwrap{
  width:min(100%,1400px);
  min-height:68px;
  margin:auto;
  padding:10px 24px;
  display:flex;
  align-items:center;
  gap:24px;
}
.brand{display:flex;align-items:center;gap:11px;min-width:max-content}
.logo{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  border:1px solid #64748b;
  border-radius:8px;
  background:#475569;
}
.logo .material-symbols-outlined{font-size:23px}
.brand b{
  display:block;
  font:600 15px/1.35 "Poppins","Open Sans",sans-serif;
  letter-spacing:.01em;
}
.brand small{display:block;margin-top:1px;color:#dbe3eb;font-size:10.5px}
.mainnav{
  margin-left:auto;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:4px;
}
.mainnav button{
  min-height:44px;
  padding:8px 10px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:#e2e8f0;
  background:transparent;
  border:1px solid transparent;
  border-radius:7px;
  font-size:12.5px;
  font-weight:600;
  white-space:nowrap;
  transition:background-color .15s,color .15s,border-color .15s;
}
.mainnav button:hover{background:#475569;color:#fff}
.mainnav button.on{color:#fff;background:#047857;border-color:#34d399}
:focus-visible{outline:3px solid #a7f3d0;outline-offset:3px}
main{width:min(100%,1400px);margin:auto;padding:30px 24px 64px}
.screen-head{
  margin-bottom:20px;
  padding-bottom:18px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;
  border-bottom:1px solid var(--line);
}
.screen-head h1{
  display:flex;
  align-items:center;
  gap:10px;
  font:600 clamp(21px,2vw,27px)/1.25 "Poppins","Open Sans",sans-serif;
  letter-spacing:-.025em;
}
.screen-head h1 .material-symbols-outlined{color:var(--accent);font-size:29px}
.screen-head p{max-width:700px;margin-top:5px;color:var(--muted);font-size:13.5px}
.tag{
  min-height:34px;
  padding:6px 11px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:#065f46;
  background:#ecfdf5;
  border:1px solid #a7f3d0;
  border-radius:7px;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
}
.tag .material-symbols-outlined{font-size:17px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr)}
.card,.kpi{
  min-width:0;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:10px;
}
.card{padding:18px}
.card h3{
  margin-bottom:14px;
  display:flex;
  align-items:center;
  gap:8px;
  color:#1e293b;
  font:600 14px/1.4 "Poppins","Open Sans",sans-serif;
}
.card h3 .material-symbols-outlined{color:var(--accent);font-size:19px}
.card h3 .sub{margin-left:auto;color:var(--muted);font:600 11.5px/1.4 "Open Sans",sans-serif}
.kpi{
  min-height:132px;
  padding:16px 17px;
  position:relative;
  border-top:3px solid var(--color-primary);
  transition:border-color .15s,background-color .15s;
}
.kpi:hover{border-top-color:var(--accent);background:#fcfffd}
.kpi .lab{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:12.5px;
  font-weight:600;
}
.kpi .lab .material-symbols-outlined{color:#475569;font-size:18px}
.kpi .val{
  margin-top:8px;
  color:#0f172a;
  font:600 28px/1.2 "Poppins","Open Sans",sans-serif;
  letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;
}
.kpi .val small{margin-left:4px;color:var(--muted);font:600 12.5px/1 "Open Sans",sans-serif}
.kpi .dt{
  margin-top:8px;
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-size:11.5px;
  font-weight:700;
}
.kpi .dt .material-symbols-outlined{font-size:15px}
.up{color:#047857}.down{color:#b91c1c}.flat{color:#475569}
.chartbox{position:relative;width:100%;overflow:hidden}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
thead th{
  padding:10px 12px;
  text-align:left;
  color:#334155;
  background:#f1f5f9;
  border-top:1px solid var(--line);
  border-bottom:1px solid #cbd5e1;
  font-size:11.5px;
  font-weight:700;
  letter-spacing:.03em;
  white-space:nowrap;
}
thead th:first-child{border-left:1px solid var(--line);border-radius:7px 0 0 0}
thead th:last-child{border-right:1px solid var(--line);border-radius:0 7px 0 0}
tbody td{
  padding:11px 12px;
  border-bottom:1px solid var(--line);
  color:#1e293b;
  white-space:nowrap;
}
tbody tr{transition:background-color .15s}
tbody tr:hover{background:#f1f5f9}
table th:nth-last-child(-n+3),table td:nth-last-child(-n+3){font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.pill{
  min-height:25px;
  padding:3px 8px;
  display:inline-flex;
  align-items:center;
  gap:5px;
  border:1px solid currentColor;
  border-radius:6px;
  font-size:11.5px;
  font-weight:700;
  white-space:nowrap;
}
.pill::before{content:"";width:6px;height:6px;border:2px solid currentColor;border-radius:50%}
.p-good{color:#047857;background:#ecfdf5}
.p-warn{color:#92400e;background:#fffbeb}
.p-bad{color:#b91c1c;background:#fef2f2}
.p-info{color:#1d4ed8;background:#eff6ff}
.p-mut{color:#475569;background:#f1f5f9}
.meter{height:8px;min-width:70px;overflow:hidden;background:#e2e8f0;border-radius:3px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.dockgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.dock{
  min-width:0;
  padding:14px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:8px;
  transition:border-color .15s,background-color .15s;
}
.dock:hover{border-color:#94a3b8;background:#f8fafc}
.dock .dh{margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.dock .dh b{font:600 15px/1 "Poppins",sans-serif}
.dock .truck{color:var(--ink);font-size:12.5px;font-weight:700}
.dock .truck small{display:block;margin-top:3px;color:var(--muted);font-size:11.5px;font-weight:500}
.dock.free{background:#f8fafc;border-style:dashed}
.dock.busy{border-left:3px solid var(--accent)}
.tl{position:relative;padding-left:27px}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:1px;background:#cbd5e1}
.tl .ev{position:relative;padding-bottom:17px}
.tl .ev:last-child{padding-bottom:0}
.tl .dot{
  position:absolute;
  left:-23px;
  top:3px;
  width:10px;
  height:10px;
  background:#fff;
  border:3px solid var(--accent);
  border-radius:50%;
}
.tl .tm{color:var(--muted);font:600 11.5px/1.3 var(--mono)}
.tl .ti{margin:3px 0;color:#1e293b;font-size:13px;font-weight:700}
.tl .de{color:var(--muted);font-size:12px}
.aprow{
  min-width:0;
  margin-bottom:8px;
  padding:11px 12px;
  display:flex;
  align-items:center;
  gap:12px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:8px;
  transition:background-color .15s,border-color .15s;
}
.aprow:hover{background:#f8fafc;border-color:#cbd5e1}
.aprow:last-child{margin-bottom:0}
.aprow .tslot{width:58px;flex:none;color:#065f46;font:600 14px/1 var(--mono)}
.aprow .info{min-width:0;flex:1}
.aprow .info b{display:block;overflow:hidden;color:#1e293b;font-size:13px;text-overflow:ellipsis}
.aprow .info small{color:var(--muted);font-size:11.5px}
.sampbar{display:flex;gap:4px;flex-wrap:wrap}
.samp{width:15px;height:15px;background:#d1fae5;border:1px solid #6ee7b7;border-radius:2px}
.samp.def{position:relative;background:#fee2e2;border-color:#ef4444}
.samp.def::after{content:"×";position:absolute;inset:-3px 0 0;text-align:center;color:#991b1b;font-size:12px;font-weight:700}
.legend{margin-top:11px;display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;display:inline-block;border:1px solid rgba(15,23,42,.2);border-radius:2px}
.slotmap{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.slot{
  aspect-ratio:1;
  min-width:0;
  padding:3px;
  display:grid;
  place-items:center;
  text-align:center;
  color:#fff;
  border:1px solid transparent;
  border-radius:5px;
  font:700 10.5px/1.2 var(--mono);
}
.slot small{display:block;font:600 8.5px/1.1 "Open Sans",sans-serif}
.s-empty{color:#334155;background:#e2e8f0;border-style:dashed;border-color:#94a3b8}
.s-fill{background:#047857}
.s-new{color:#422006;background:#fbbf24;border-color:#92400e}
.s-lock{background:#64748b}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{
  padding:5px 9px;
  color:#334155;
  background:#f1f5f9;
  border:1px solid #cbd5e1;
  border-radius:6px;
  font-size:11.5px;
  font-weight:600;
}
.mini{margin-top:9px;color:var(--muted);font-size:11.5px}
.foot{
  width:min(100%,1400px);
  margin:auto;
  padding:20px 24px 38px;
  color:var(--muted);
  border-top:1px solid var(--line);
  text-align:center;
  font-size:11.5px;
}
.reveal{animation:reveal .35s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1100px){
  .topwrap{align-items:flex-start;flex-direction:column;gap:8px}
  .mainnav{width:100%;margin-left:0;justify-content:flex-start;overflow-x:auto;padding-bottom:2px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:820px){
  main{padding:22px 16px 48px}
  .topwrap{padding:9px 16px}
  .g2,.g3,.g23{grid-template-columns:1fr}
  .dockgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .slotmap{grid-template-columns:repeat(6,minmax(0,1fr))}
}
@media(max-width:560px){
  .mainnav button{min-width:44px;justify-content:center;padding:9px}
  .mainnav button .lbl{display:none}
  .screen-head{align-items:flex-start;flex-direction:column}
  .g4{grid-template-columns:1fr}
  .dockgrid{grid-template-columns:1fr}
  .slotmap{grid-template-columns:repeat(4,minmax(0,1fr))}
  .aprow{align-items:flex-start;flex-wrap:wrap}
  .aprow .info{flex-basis:calc(100% - 72px)}
  .kpi{min-height:118px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .reveal{animation:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topwrap">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">local_shipping</span></div>
      <div><b>進貨收料管理系統</b><small>Inbound Receiving Management · WMS</small></div>
    </div>
    <nav class="mainnav" id="nav" aria-label="主要功能"></nav>
  </div>
</header>
<main id="app"></main>
<footer class="foot">進貨收料管理系統（Inbound Receiving Management）· 示範資料為模擬產生，僅供介面展示 · 倉儲部 / 採購部 / 品保部</footer>
<script>
"use strict";
var C={accent:"#059669",accent2:"#34d399",good:"#047857",warn:"#a15c00",bad:"#dc2626",info:"#1d4ed8",grid:"#e6e8ea",sub:"#475569"};
var MODS=[
  {icon:"calendar_month",name:"到貨預約排程"},
  {icon:"factory",name:"月台卸貨看板"},
  {icon:"receipt_long",name:"掃碼收料比對"},
  {icon:"science",name:"來料檢驗 IQC"},
  {icon:"inventory_2",name:"合格上架儲位"},
  {icon:"monitoring",name:"收料績效稽核"}
];
var app=document.getElementById("app"),charts={};
function destroyCharts(){for(var k in charts){if(charts[k]){try{charts[k].destroy()}catch(e){}charts[k]=null}}}
function mkChart(id,cfg){
  var el=document.getElementById(id);
  if(!el)return;
  if(charts[id]){try{charts[id].destroy()}catch(e){}}
  cfg.options=cfg.options||{};
  cfg.options.animation=matchMedia("(prefers-reduced-motion: reduce)").matches?false:{duration:350};
  cfg.options.color=C.sub;
  cfg.options.font={family:"Open Sans"};
  charts[id]=new Chart(el,cfg);
}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function finish(h){
  app.innerHTML=h;
  app.classList.remove("reveal");
  void app.offsetHeight;
  app.classList.add("reveal");
}
function kpHTML(kp){
  return '<div class="grid g4">'+kp.map(function(k){
    return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+k.i+'</span>'+k.l+'</div><div class="val">'+k.v+(k.u?'<small>'+k.u+'</small>':'')+'</div>'+(k.d?'<div class="dt '+k.dc+'"><span class="material-symbols-outlined">'+(k.dc==="up"?"trending_up":k.dc==="down"?"trending_down":"remove")+'</span>'+k.d+'</div>':'')+'</div>'
  }).join("")+'</div>'
}
function s0(){
  var appts=[
    {t:"08:00",sup:"O鋼金屬股份",po:"PO-24019",items:"冷軋鋼捲 ×12",dock:"D1",st:"已確認",cls:"p-good"},
    {t:"08:40",sup:"O達電子零件",po:"PO-24022",items:"連接器 ×3400",dock:"D2",st:"已確認",cls:"p-good"},
    {t:"09:20",sup:"O盛塑膠原料",po:"PO-24025",items:"PP 粒料 ×20",dock:"D1",st:"待確認",cls:"p-warn"},
    {t:"10:00",sup:"台O扣件工業",po:"PO-24030",items:"螺絲組件 ×88箱",dock:"D3",st:"已確認",cls:"p-good"},
    {t:"10:40",sup:"O發包裝材料",po:"PO-24031",items:"棧板/紙箱",dock:"D4",st:"改期申請",cls:"p-info"},
    {t:"13:30",sup:"O鋼金屬股份",po:"PO-24035",items:"不鏽鋼板 ×6",dock:"D2",st:"待確認",cls:"p-warn"}
  ];
  var kp=[
    {l:"今日預約車次",v:"14",u:"車",i:"local_shipping",d:"較昨 +3",dc:"up"},
    {l:"月台使用率",v:"78",u:"%",i:"factory",d:"尖峰 08–10 時",dc:"flat"},
    {l:"待確認預約",v:"3",u:"筆",i:"pending_actions",d:"需 30 分內回覆",dc:"down"},
    {l:"平均等待時間",v:"11",u:"分",i:"schedule",d:"較上週 -6",dc:"up"}
  ];
  var h='<div class="screen-head"><div><h1><span class="material-symbols-outlined">calendar_month</span>到貨預約排程</h1><p>供應商到貨預約與月台時段分配，避免尖峰月台壅塞</p></div><span class="tag"><span class="material-symbols-outlined">event_available</span>2026-08-14（四）</span></div>'+kpHTML(kp);
  h+='<div class="grid g23" style="margin-top:14px"><div class="card"><h3><span class="material-symbols-outlined">event_note</span>今日到貨時段表<span class="sub">共 6 個時段</span></h3>';
  appts.forEach(function(a){h+='<div class="aprow"><div class="tslot">'+a.t+'</div><div class="info"><b>'+esc(a.sup)+'</b><small><span class="mono">'+a.po+'</span> · '+esc(a.items)+'</small></div><span class="chip">'+a.dock+'</span><span class="pill '+a.cls+'">'+a.st+'</span></div>'});
  h+='</div><div class="card"><h3><span class="material-symbols-outlined">bar_chart</span>每小時到貨車次分佈</h3><div class="chartbox" style="height:230px"><canvas id="c0a"></canvas></div><div class="mini">尖峰時段集中於 08–10 時，建議引導部分車次改約下午時段。</div></div></div>';
  h+='<div class="card" style="margin-top:14px"><h3><span class="material-symbols-outlined">rule</span>排程規則</h3><div class="chips"><span class="chip">同月台時段間隔 ≥ 40 分</span><span class="chip">大宗料件優先分配 D1/D2</span><span class="chip">冷鏈料件限 D4</span><span class="chip">尖峰上限 4 車/時</span></div></div>';
  finish(h);
  mkChart("c0a",{type:"bar",data:{labels:["08","09","10","11","13","14","15","16"],datasets:[{label:"車次",data:[4,3,2,1,3,2,2,1],backgroundColor:function(x){return x.raw>=3?C.warn:C.accent},borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:C.grid},ticks:{stepSize:1}},x:{grid:{display:false}}}}});
}
function s1(){
  var docks=[
    {n:"D1",busy:true,truck:"精鋼金屬 KMH-2718",po:"PO-24019",prog:72,eta:"約 12 分",st:"卸貨中",cls:"p-good"},
    {n:"D2",busy:true,truck:"O達電子 BQL-5540",po:"PO-24022",prog:35,eta:"約 24 分",st:"卸貨中",cls:"p-good"},
    {n:"D3",busy:true,truck:"台O扣件 RMT-0091",po:"PO-24030",prog:96,eta:"約 3 分",st:"收尾中",cls:"p-warn"},
    {n:"D4",busy:false,truck:"—",po:"下一車 10:40",prog:0,eta:"閒置",st:"可用",cls:"p-mut"}
  ];
  var kp=[
