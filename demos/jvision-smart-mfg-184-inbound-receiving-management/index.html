<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>進貨收料管理系統 Inbound Receiving Management</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#0d9488;--accent2:#2dd4bf;--ink:#0f2c2a;--sub:#5a7370;
  --bg:#f2f7f6;--card:#ffffff;--line:#dce8e6;--soft:#e6f4f2;
  --warn:#d97706;--bad:#dc2626;--good:#059669;--info:#2563eb;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(90deg,#0d9488,#0f766e);color:#fff;box-shadow:0 2px 14px rgba(13,148,136,.28)}
.topwrap{max-width:1360px;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.brand .logo .material-symbols-outlined{font-size:22px;color:#fff}
.brand b{font-size:16px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-size:11px;opacity:.82;font-weight:500;white-space:nowrap}
nav.mainnav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto;min-width:0}
nav.mainnav button{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:#e9fffb;font-family:inherit;font-size:13.5px;font-weight:600;padding:8px 12px;border-radius:9px;cursor:pointer;transition:.15s;white-space:nowrap}
nav.mainnav button:hover{background:rgba(255,255,255,.14)}
nav.mainnav button.on{background:#fff;color:#0d7469}
nav.mainnav button .material-symbols-outlined{font-size:19px}
main{max-width:1360px;margin:0 auto;padding:22px 18px 60px}
.screen-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.screen-head h1{font-size:22px;font-weight:800;display:flex;align-items:center;gap:9px}
.screen-head h1 .material-symbols-outlined{color:var(--accent);font-size:26px}
.screen-head p{color:var(--sub);font-size:13.5px;margin-top:3px}
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--soft);color:#0d7469;font-size:12px;font-weight:700;padding:5px 11px;border-radius:20px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:1.6fr 1fr}
@media(max-width:820px){.g4,.g3,.g2,.g23{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:12px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.card h3 .sub{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--sub)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;position:relative;overflow:hidden;min-width:0}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.kpi .lab{font-size:12.5px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--accent)}
.kpi .val{font-size:27px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.kpi .val small{font-size:13px;font-weight:600;color:var(--sub);margin-left:3px}
.kpi .dt{font-size:11.5px;font-weight:700;margin-top:5px;display:inline-flex;align-items:center;gap:3px}
.kpi .dt .material-symbols-outlined{font-size:15px}
.up{color:var(--good)}.down{color:var(--bad)}.flat{color:var(--sub)}
.chartbox{position:relative;width:100%;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;font-size:11.5px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.4px;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
tbody td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:hover{background:var(--soft)}
tbody tr:last-child td{border-bottom:0}
.mono{font-family:"Inter",monospace;font-weight:600;font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.p-good{background:#dcfce7;color:#15803d}
.p-warn{background:#fef3c7;color:#b45309}
.p-bad{background:#fee2e2;color:#b91c1c}
.p-info{background:#dbeafe;color:#1d4ed8}
.p-mut{background:#eef2f2;color:#556}
.meter{height:8px;border-radius:6px;background:#eef3f2;overflow:hidden;min-width:70px}
.meter i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.dockgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:820px){.dockgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.dockgrid{grid-template-columns:1fr}}
.dock{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fbfdfd;min-width:0}
.dock .dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.dock .dh b{font-size:14px;font-weight:800}
.dock .truck{font-size:12.5px;font-weight:700;color:var(--ink)}
.dock .truck small{display:block;color:var(--sub);font-weight:500;font-size:11.5px;margin-top:2px}
.dock.free{background:#f4faf9;border-style:dashed}
.dock.busy{border-color:#0d9488;box-shadow:0 0 0 2px rgba(13,148,136,.12)}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:0 0 16px 0}
.tl .ev:last-child{padding-bottom:0}
.tl .ev .dot{position:absolute;left:-22px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.tl .ev .tm{font-size:11.5px;color:var(--sub);font-weight:700}
.tl .ev .ti{font-size:13.5px;font-weight:700;margin:2px 0}
.tl .ev .de{font-size:12.5px;color:var(--sub)}
.aprow{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;margin-bottom:9px;background:#fbfdfd;min-width:0}
.aprow:last-child{margin-bottom:0}
.aprow .tslot{font-weight:800;font-size:15px;color:#0d7469;flex:none;width:60px}
.aprow .info{min-width:0;flex:1}
.aprow .info b{font-size:13.5px;font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis}
.aprow .info small{font-size:12px;color:var(--sub)}
.sampbar{display:flex;gap:3px;flex-wrap:wrap}
.samp{width:15px;height:15px;border-radius:3px;background:#dcfce7;border:1px solid #bbf7d0}
.samp.def{background:#fee2e2;border-color:#fecaca}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.slotmap{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
@media(max-width:820px){.slotmap{grid-template-columns:repeat(5,1fr)}}
@media(max-width:480px){.slotmap{grid-template-columns:repeat(4,1fr)}}
.slot{aspect-ratio:1;border-radius:7px;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;min-width:0;text-align:center}
.slot small{font-size:8.5px;opacity:.85}
.s-empty{background:#cbd6d4;color:#4a5a58}
.s-fill{background:#0d9488}
.s-new{background:#f59e0b;box-shadow:0 0 0 2px #fef3c7}
.s-lock{background:#94a3b8}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:8px;background:var(--soft);color:#0d7469}
.mini{font-size:11.5px;color:var(--sub);margin-top:8px}
.foot{max-width:1360px;margin:0 auto;padding:20px 18px 40px;color:var(--sub);font-size:12px;text-align:center}
</style>
</head>
<body>
<header class="topbar">
  <div class="topwrap">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">local_shipping</span></div>
      <div><b>進貨收料管理系統</b><small>Inbound Receiving Management · WMS</small></div>
    </div>
    <nav class="mainnav" id="nav"></nav>
  </div>
</header>
<main id="app"></main>
<div class="foot">進貨收料管理系統（Inbound Receiving Management）· 示範資料為模擬產生，僅供介面展示 · 倉儲部 / 採購部 / 品保部</div>

<script>
"use strict";
var C={accent:"#0d9488",accent2:"#2dd4bf",good:"#059669",warn:"#d97706",bad:"#dc2626",info:"#2563eb",grid:"#e2ecea",sub:"#5a7370"};
var MODS=[
  {icon:"calendar_month",name:"到貨預約排程"},
  {icon:"factory",name:"月台卸貨看板"},
  {icon:"receipt_long",name:"掃碼收料比對"},
  {icon:"science",name:"來料檢驗 IQC"},
  {icon:"inventory_2",name:"合格上架儲位"},
  {icon:"monitoring",name:"收料績效稽核"}
];
var app=document.getElementById("app");
var charts={};
function destroyCharts(){for(var k in charts){if(charts[k]){try{charts[k].destroy();}catch(e){}charts[k]=null;}}}
function mkChart(id,cfg){var el=document.getElementById(id);if(!el)return;if(charts[id]){try{charts[id].destroy();}catch(e){}}charts[id]=new Chart(el,cfg);}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}

function s0(){
  var appts=[
    {t:"08:00",sup:"O鋼金屬股份",po:"PO-24019",items:"冷軋鋼捲 ×12",dock:"D1",st:"已確認",cls:"p-good"},
    {t:"08:40",sup:"O達電子零件",po:"PO-24022",items:"連接器 ×3400",dock:"D2",st:"已確認",cls:"p-good"},
    {t:"09:20",sup:"O盛塑膠原料",po:"PO-24025",items:"PP 粒料 ×20",dock:"D1",st:"待確認",cls:"p-warn"},
    {t:"10:00",sup:"台O扣件工業",po:"PO-24030",items:"螺絲組件 ×88箱",dock:"D3",st:"已確認",cls:"p-good"},
    {t:"10:40",sup:"O發包裝材料",po:"PO-24031",items:"棧板/紙箱",dock:"D4",st:"改期申請",cls:"p-info"},
    {t:"13:30",sup:"O鋼金屬股份",po:"PO-24035",items:"不鏽鋼板 ×6",dock:"D2",st:"待確認",cls:"p-warn"}
  ];
  var kp=[
    {l:"今日預約車次",v:"14",u:"車",i:"local_shipping",d:"較昨 +3",dc:"up"},
    {l:"月台使用率",v:"78",u:"%",i:"factory",d:"尖峰 08–10 時",dc:"flat"},
    {l:"待確認預約",v:"3",u:"筆",i:"pending_actions",d:"需 30 分內回覆",dc:"down"},
    {l:"平均等待時間",v:"11",u:"分",i:"schedule",d:"較上週 -6",dc:"up"}
  ];
  var h='<div class="screen-head"><div><h1><span class="material-symbols-outlined">calendar_month</span>到貨預約排程</h1><p>供應商到貨預約與月台時段分配，避免尖峰月台壅塞</p></div><span class="tag"><span class="material-symbols-outlined">event_available</span>2026-08-14（四）</span></div>';
  h+='<div class="grid g4">'+kp.map(function(k){return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+k.i+'</span>'+k.l+'</div><div class="val">'+k.v+'<small>'+k.u+'</small></div><div class="dt '+k.dc+'"><span class="material-symbols-outlined">'+(k.dc==="up"?"trending_up":k.dc==="down"?"trending_down":"remove")+'</span>'+k.d+'</div></div>';}).join('')+'</div>';
  h+='<div class="grid g23" style="margin-top:14px">';
  h+='<div class="card"><h3><span class="material-symbols-outlined">event_note</span>今日到貨時段表<span class="sub">共 6 個時段</span></h3>';
  appts.forEach(function(a){
    h+='<div class="aprow"><div class="tslot">'+a.t+'</div><div class="info"><b>'+esc(a.sup)+'</b><small>'+a.po+' · '+esc(a.items)+'</small></div><span class="chip">'+a.dock+'</span><span class="pill '+a.cls+'">'+a.st+'</span></div>';
  });
  h+='</div>';
  h+='<div class="card"><h3><span class="material-symbols-outlined">bar_chart</span>每小時到貨車次分佈</h3><div class="chartbox" style="height:230px"><canvas id="c0a"></canvas></div><div class="mini">尖峰時段集中於 08–10 時，建議引導部分車次改約下午時段。</div></div>';
  h+='</div>';
  h+='<div class="card" style="margin-top:14px"><h3><span class="material-symbols-outlined">rule</span>排程規則</h3><div class="chips"><span class="chip">同月台時段間隔 ≥ 40 分</span><span class="chip">大宗料件優先分配 D1/D2</span><span class="chip">冷鏈料件限 D4</span><span class="chip">尖峰上限 4 車/時</span></div></div>';
  app.innerHTML=h;void app.offsetHeight;
  mkChart("c0a",{type:"bar",data:{labels:["08","09","10","11","13","14","15","16"],datasets:[{label:"車次",data:[4,3,2,1,3,2,2,1],backgroundColor:function(ctx){return ctx.raw>=3?C.warn:C.accent;},borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:C.grid},ticks:{stepSize:1}},x:{grid:{display:false}}}}});
}

function s1(){
  var docks=[
    {n:"D1",busy:true,truck:"精鋼金屬 KMH-2718",po:"PO-24019",prog:72,eta:"約 12 分",st:"卸貨中",cls:"p-good"},
    {n:"D2",busy:true,truck:"O達電子 BQL-5540",po:"PO-24022",prog:35,eta:"約 24 分",st:"卸貨中",cls:"p-good"},
    {n:"D3",busy:true,truck:"台O扣件 RMT-0091",po:"PO-24030",prog:96,eta:"約 3 分",st:"收尾中",cls:"p-warn"},
    {n:"D4",busy:false,truck:"—",po:"下一車 10:40",prog:0,eta:"閒置",st:"可用",cls:"p-mut"}
  ];
  var kp=[
    {l:"作業中月台",v:"3 / 4",i:"factory"},
    {l:"平均卸貨時間",v:"27 分",i:"timer"},
    {l:"今日已卸車次",v:"9 車",i:"done_all"},
    {l:"待卸候車",v:"2 車",i:"pending"}
  ];
  var log=[
    {tm:"09:48",ti:"D3 台O扣件 開始收尾",de:"88 箱螺絲組件，掃碼 84/88"},
    {tm:"09:31",ti:"D1 精鋼金屬 進場卸貨",de:"冷軋鋼捲 12 捲，堆高機 FL-02 支援"},
    {tm:"09:12",ti:"D2 O達電子 報到分配",de:"連接器 3400 pcs，指派 D2 月台"},
    {tm:"08:55",ti:"D4 順發包裝 卸貨完成",de:"耗時 22 分，轉入掃碼收料"}
  ];
  var h='<div class="screen-head"><div><h1><span class="material-symbols-outlined">factory</span>月台卸貨看板</h1><p>即時掌握各月台佔用、卸貨進度與候車狀態</p></div><span class="tag"><span class="material-symbols-outlined">sensors</span>即時看板</span></div>';
  h+='<div class="grid g4">'+kp.map(function(k){return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+k.i+'</span>'+k.l+'</div><div class="val">'+k.v+'</div></div>';}).join('')+'</div>';
  h+='<div class="card" style="margin-top:14px"><h3><span class="material-symbols-outlined">dock</span>月台即時狀態</h3><div class="dockgrid">';
  docks.forEach(function(d){
    h+='<div class="dock '+(d.busy?"busy":"free")+'"><div class="dh"><b>'+d.n+'</b><span class="pill '+d.cls+'">'+d.st+'</span></div>'+
       '<div class="truck">'+esc(d.truck)+'<small>'+d.po+'</small></div>'+
       '<div style="margin-top:10px"><div class="meter"><i style="width:'+d.prog+'%"></i></div>'+
       '<div style="display:flex;justify-content:space-between;margin-top:5px;font-size:11.5px;color:var(--sub);font-weight:600"><span>'+d.prog+'%</span><span>'+d.eta+'</span></div></div></div>';
  });
  h+='</div></div>';
  h+='<div class="grid g23" style="margin-top:14px">';
  h+='<div class="card"><h3><span class="material-symbols-outlined">show_chart</span>月台卸貨負載（近 8 小時）</h3><div class="chartbox" style="height:230px"><canvas id="c1a"></canvas></div></div>';
  h+='<div class="card"><h3><span class="material-symbols-outlined">history</span>作業動態</h3><div class="tl">';
  log.forEach(function(e){h+='<div class="ev"><div class="dot"></div><div class="tm">'+e.tm+'</div><div class="ti">'+esc(e.ti)+'</div><div class="de">'+esc(e.de)+'</div></div>';});
  h+='</div></div></div>';
  app.innerHTML=h;void app.offsetHeight;
  mkChart("c1a",{type:"line",data:{labels:["08","09","10","11","12","13","14","15"],datasets:[
    {label:"進行中車次",data:[2,3,4,2,1,3,3,2],borderColor:C.accent,backgroundColor:"rgba(13,148,136,.14)",fill:true,tension:.35,borderWidth:2,pointRadius:3},
    {label:"候車數",data:[1,2,3,1,0,1,2,1],borderColor:C.warn,backgroundColor:"transparent",tension:.35,borderWidth:2,borderDash:[5,4],pointRadius:2}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:11}}}},scales:{y:{beginAtZero:true,grid:{color:C.grid},ticks:{stepSize:1}},x:{grid:{display:false}}}}});
}

function s2(){
  var rows=[
    {item:"冷軋鋼捲 SPCC-1.0",po:"PO-24019",ord:12,rcv:12,st:"相符",cls:"p-good"},
    {item:"連接器 CN-4P-BK",po:"PO-24022",ord:3400,rcv:3380,st:"短收 20",cls:"p-warn"},
    {item:"PP 粒料 PP-3040",po:"PO-24025",ord:20,rcv:20,st:"相符",cls:"p-good"},
    {item:"六角螺絲 M8×25",po:"PO-24030",ord:8800,rcv:8800,st:"相符",cls:"p-good"},
    {item:"不鏽鋼板 SUS304",po:"PO-24035",ord:6,rcv:7,st:"超收 1",cls:"p-bad"},
    {item:"棧板 EUR-1200",po:"PO-24031",ord:60,rcv:60,st:"相符",cls:"p-good"}
  ];
  var kp=[
    {l:"今日掃碼筆數",v:"1,284",u:"筆",i:"qr_code_scanner"},
    {l:"單據吻合率",v:"96.4",u:"%",i:"fact_check"},
    {l:"差異攔截",v:"3",u:"筆",i:"report_problem"},
    {l:"平均收料耗時",v:"6.2",u:"分/單",i:"timer"}
  ];
  var h='<div class="screen-head"><div><h1><span class="material-symbols-outlined">receipt_long</span>掃碼收料比對</h1><p>PDA 掃碼收料，即時比對採購單數量與規格，差異當場攔截</p></div><span class="tag"><span class="material-symbols-outlined">barcode_scanner</span>PDA 連線 6 台</span></div>';
