<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>試產與量產轉移管理 · PLM 研發管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700&family=Roboto+Mono:wght@300;400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#15803D;
  --color-on-primary:#FFFFFF;
  --color-secondary:#22C55E;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDF4;
  --color-foreground:#14532D;
  --color-card:#FFFFFF;
  --color-card-foreground:#14532D;
  --color-muted:#E8F0F1;
  --color-muted-foreground:#475569;
  --color-border:#BBF7D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#15803D;
  --blue:#15803D;
  --ink:#14532D;
  --muted:#475569;
  --line:#BBF7D0;
  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --accent-soft:#DCFCE7;
  --accent-soft2:#ECFDF3;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --th:#EAF8EE;
  --hov:#F4FCF6;
  --track:#D9F2E1;
  --sidebar:#FFFFFF;
  --sidebar2:#F4FCF6;
  --side-edge:var(--color-border);
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#0369A1;
  --r:20px;
  --glow:rgba(21,128,61,.2);
  --shadow-sm:0 4px 14px rgba(20,83,45,.06);
  --shadow-md:0 14px 34px rgba(20,83,45,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:"Exo",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 88% 7%,rgba(34,197,94,.13),transparent 24rem),
    radial-gradient(circle at 28% 100%,rgba(217,119,6,.07),transparent 28rem),
    var(--bg);
  color:var(--ink);
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,[role="button"],a{cursor:pointer}
h1,h2,h3,h4{font-family:"Exo",system-ui,sans-serif;margin:0;color:var(--ink)}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px;border-radius:8px}
::selection{background:#BBF7D0;color:#052E16}

.app{display:flex;min-height:100vh;position:relative}
.sidebar{
  width:260px;flex:none;min-width:0;height:100vh;position:sticky;top:0;z-index:20;
  display:flex;flex-direction:column;padding:22px 16px;
  color:var(--ink);background:rgba(255,255,255,.9);border-right:1px solid var(--line);
  box-shadow:8px 0 30px rgba(20,83,45,.04);backdrop-filter:blur(16px)
}
.sidebar::before{
  content:"";position:absolute;inset:0 0 auto;height:130px;z-index:-1;pointer-events:none;
  background:linear-gradient(145deg,rgba(34,197,94,.16),rgba(240,253,244,0));
  border-radius:0 0 58% 28%
}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 24px;min-width:0}
.brand-logo{
  width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;
  color:var(--color-on-primary);background:linear-gradient(145deg,var(--color-primary),var(--color-secondary));
  border-radius:15px 22px 15px 21px;box-shadow:0 9px 22px var(--glow)
}
.brand-logo .material-symbols-outlined{font-size:24px}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-weight:700;font-size:16px;letter-spacing:.4px;color:var(--ink)}
.brand-txt span{display:block;margin-top:1px;color:var(--muted);font-family:"Roboto Mono",monospace;font-size:10px;letter-spacing:1.4px}
.nav{display:flex;flex-direction:column;gap:7px;margin-top:3px;min-width:0}
.nav button{
  min-height:44px;min-width:0;display:flex;align-items:center;gap:11px;padding:10px 12px;
  color:var(--muted);background:transparent;border:1px solid transparent;border-radius:12px 19px 12px 18px;
  text-align:left;font-weight:600;white-space:nowrap;transition:background-color .2s,color .2s,border-color .2s,transform .2s,box-shadow .2s
}
.nav button .material-symbols-outlined{font-size:20px;flex:none}
.nav button:hover{color:var(--ink);background:#F0FDF4;border-color:var(--line);transform:translateX(2px)}
.nav button.on{color:var(--color-primary);background:#DCFCE7;border-color:#86EFAC;box-shadow:inset 3px 0 0 var(--color-primary);font-weight:700}
.nav .idx{margin-left:auto;color:#166534;font-family:"Roboto Mono",monospace;font-size:10px;font-weight:700;opacity:.72}
.side-foot{margin-top:auto;padding:15px 10px 3px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.8}
.side-foot b{color:var(--ink);font-family:"Roboto Mono",monospace}
.main{flex:1;min-width:0;padding:28px clamp(18px,3vw,42px) 64px;position:relative}
.main::before{
  content:"";position:fixed;right:-90px;bottom:-120px;width:340px;height:340px;z-index:-1;pointer-events:none;
  border:1px solid rgba(34,197,94,.2);border-radius:42% 58% 35% 65%;transform:rotate(18deg)
}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px;flex-wrap:wrap}
.topbar h1{display:flex;align-items:center;gap:10px;font-size:clamp(21px,2vw,28px);font-weight:700;letter-spacing:-.4px}
.topbar h1 .material-symbols-outlined{font-size:28px;color:var(--accent)}
.topbar .sub{margin-top:5px;color:var(--muted);font-size:12.5px}
.top-right{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.chip{
  min-height:36px;display:inline-flex;align-items:center;gap:7px;padding:7px 12px;
  color:var(--muted);background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:999px;
  box-shadow:var(--shadow-sm);font-size:11.5px;font-weight:600
}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(21,128,61,.14);animation:pulse 2s ease-in-out infinite}
.avatar{width:38px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;border:2px solid #fff;border-radius:48% 52% 43% 57%;color:#fff;background:linear-gradient(145deg,var(--color-primary),var(--color-secondary));box-shadow:var(--shadow-sm);font-weight:700}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.84)}}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
#screen>.grid{animation:rise .4s cubic-bezier(.2,.75,.25,1) both}
#screen>.grid:nth-child(2){animation-delay:.06s}
#screen>.grid:nth-child(3){animation-delay:.12s}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{
  color:var(--color-card-foreground);background:rgba(255,255,255,.94);border:1px solid var(--line);
  box-shadow:var(--shadow-sm);transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease
}
.card:hover,.sec:hover,.kpi:hover,.stat:hover,.tile:hover{border-color:#86EFAC;box-shadow:var(--shadow-md);transform:translateY(-2px)}
.card,.sec{min-width:0;padding:18px;border-radius:20px 26px 20px 24px}
.sec{margin-bottom:16px}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px;padding-bottom:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card.pad0 .card-h,.card.p0 .card-h{border-bottom:none}
.card-h h3,.sec>h3{display:flex;align-items:center;gap:8px;min-width:0;font-size:14.5px;font-weight:700}
.card-h h3 .material-symbols-outlined,.sec>h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.card-h .hint{color:var(--muted);font-family:"Roboto Mono",monospace;font-size:11px}
.sec>h3{margin-bottom:14px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.sec>p{margin:0 0 13px;color:var(--muted);font-size:13px;line-height:1.8}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0;font-size:13px}
.dl dt{color:var(--muted);font-size:12px;font-weight:600}
.dl dd{margin:0;line-height:1.8}

.kpi,.stat{position:relative;overflow:hidden;min-width:0;padding:17px 18px;border-radius:18px 25px 18px 24px}
.kpi::after{content:"";position:absolute;right:-24px;top:-26px;width:92px;height:82px;border-radius:45% 55% 38% 62%;background:linear-gradient(135deg,#DCFCE7,#ECFDF3);transform:rotate(18deg)}
.kpi .ico{position:relative;z-index:1;width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--accent);background:#DCFCE7;border:1px solid #BBF7D0;border-radius:44% 56% 48% 52%}
.kpi .ico .material-symbols-outlined{font-size:21px}
.kpi .lbl,.stat .lbl{display:flex;align-items:center;gap:5px;margin-top:12px;color:var(--muted);font-size:12px;font-weight:600}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{font-size:15px;color:var(--accent)}
.kpi .val,.stat .val,.tile .tv{margin-top:4px;color:#14532D;font-family:"Roboto Mono",monospace;font-size:26px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.kpi .val small,.stat .val small{margin-left:4px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:0}
.kpi .delta,.stat .d{display:inline-flex;align-items:center;gap:3px;margin-top:6px;font-size:11.5px;font-weight:700}
.delta.up,.d.up{color:#166534}.delta.down,.d.down{color:#B91C1C}.delta.flat,.d.flat{color:var(--muted)}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:14px}

table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;font-variant-numeric:tabular-nums}
th{padding:12px 14px;color:#3F555F;background:var(--th);border-top:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;font-size:11px;font-weight:700;letter-spacing:.35px;white-space:nowrap}
th:first-child{border-left:1px solid var(--line);border-radius:12px 0 0 12px}
th:last-child{border-right:1px solid var(--line);border-radius:0 12px 12px 0}
td{padding:12px 14px;border-bottom:1px solid #DDF3E4;white-space:nowrap;vertical-align:middle}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:var(--hov)}
tbody tr:last-child td{border-bottom:none}
.mono{font-family:"Roboto Mono",monospace;font-weight:600;letter-spacing:.1px;font-variant-numeric:tabular-nums}
td .mono,time,.tl-time,.tl-t{font-family:"Roboto Mono",monospace}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border:1px solid transparent;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.t-ok{color:#14532D;background:#DCFCE7;border-color:#86EFAC}
.t-warn{color:#78350F;background:#FEF3C7;border-color:#FCD34D}
.t-bad{color:#991B1B;background:#FEE2E2;border-color:#FCA5A5}
.t-info{color:#075985;background:#E0F2FE;border-color:#7DD3FC}
.t-gray{color:#475569;background:#F1F5F9;border-color:#CBD5E1}
.t-acc,.t-pink{color:#14532D;background:#ECFDF3;border-color:#86EFAC}

.bar{height:8px;min-width:56px;overflow:hidden;background:var(--track);border-radius:999px}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--color-primary),var(--color-secondary))}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{width:40px;flex:none;color:var(--muted);font-family:"Roboto Mono",monospace;font-size:11px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}

.tl{position:relative;padding-left:27px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:linear-gradient(var(--color-primary),var(--line))}
.tl-item,.tl-i{position:relative;padding:0 0 18px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;left:-26px;top:3px;width:15px;height:15px;border:4px solid var(--accent);border-radius:42% 58% 46% 54%;background:#fff}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font-size:10.5px;font-weight:600}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:12.5px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:11.5px}
.chk{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:12.5px}
.chk:last-child{border-bottom:none}
.chk .material-symbols-outlined{font-size:19px}
.chk .ok{color:var(--ok)}.chk .wait{color:var(--muted)}.chk .bad{color:var(--bad)}.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}.chk small{color:var(--muted);font-size:11px}
.note{margin-top:13px;padding-top:12px;border-top:1px dashed var(--line);color:var(--muted);font-size:11.5px;line-height:1.7}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.col{display:flex;flex-direction:column;gap:10px;padding:12px;background:#EAF8EE;border:1px solid var(--line);border-radius:18px 24px 18px 22px}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 7px;font-size:12.5px;font-weight:700}
.col-h .cnt{padding:2px 9px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;font-family:"Roboto Mono",monospace;font-size:10.5px}
.pcard{padding:12px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px 18px 12px 17px;box-shadow:0 3px 10px rgba(20,83,45,.05)}
.pcard b{font-size:12.5px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--muted);font-size:11px}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:8px;color:var(--ink);font-size:11px}
.mini-av,.av{flex:none;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);background:var(--accent-soft);font-weight:700}
.mini-av{width:19px;height:19px;border-radius:45% 55% 48% 52%;font-size:9px}
.av{width:28px;height:28px;border-radius:44% 56% 46% 54%;font-size:11px}
.who{display:inline-flex;align-items:center;gap:6px}

.lane{display:flex;flex-direction:column;gap:11px}
.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:13px 14px;background:#fff;border:1px solid var(--line);border-radius:14px 21px 14px 20px}
.lane-row .num{width:33px;height:33px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--accent);background:var(--accent-soft);border-radius:42% 58% 45% 55%;font-family:"Roboto Mono",monospace;font-weight:700}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:13.5px}
.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:11.5px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{width:24px;height:24px;z-index:1;display:flex;align-items:center;justify-content:center;color:#64748B;background:#fff;border:2px solid var(--line);border-radius:50%;font-family:"Roboto Mono",monospace;font-size:10px}
.steps .ln{width:20px;height:2px;background:var(--line)}
.steps .s.done{color:#fff;background:var(--accent);border-color:var(--accent)}
.steps .s.cur{color:var(--accent);border-color:var(--accent);animation:pulse 1.8s ease-in-out infinite}
.steps .ln.done{background:var(--accent)}

.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 4px;border-bottom:1px dashed var(--line)}
.rep-row:last-child{border-bottom:none}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:13px}
.rep-row .sku span{color:var(--muted);font-family:"Roboto Mono",monospace;font-size:11px}
.gauge{width:110px;flex:none}
.gauge .track{height:8px;overflow:hidden;background:var(--track);border-radius:999px}
.gauge .track i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--color-secondary));border-radius:999px}
.gauge small{display:block;margin-top:3px;color:var(--muted);font-family:"Roboto Mono",monospace;font-size:10px;text-align:right}
.band{position:relative;height:26px;min-width:150px;background:var(--track);border-radius:999px}
.band .rng{position:absolute;inset-block:0;background:var(--accent-soft);border-radius:999px}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
.band .me{position:absolute;top:3px;width:12px;height:20px;background:var(--accent);border-radius:6px;box-shadow:0 2px 6px var(--glow)}

.tile{display:flex;flex-direction:column;gap:8px;min-width:0;padding:18px;border-radius:19px 27px 19px 25px;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;right:-34px;bottom:-42px;width:105px;height:95px;background:#ECFDF3;border-radius:42% 58% 38% 62%;transform:rotate(-18deg)}
.tile .ti{position:relative;z-index:1;width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--accent);background:var(--accent-soft);border:1px solid var(--line);border-radius:43% 57% 47% 53%}
.tile .ti .material-symbols-outlined{font-size:21px}
.tile b{position:relative;z-index:1;font-size:13.5px;font-weight:700}
.tile p{position:relative;z-index:1;margin:0;color:var(--muted);font-size:11.8px;line-height:1.65}
.tile .tv{position:relative;z-index:1;font-size:23px}

.apexcharts-text,.apexcharts-legend-text{font-family:"Exo",system-ui,sans-serif!important}
.apexcharts-tooltip{border:1px solid var(--line)!important;border-radius:12px!important;box-shadow:var(--shadow-md)!important}

@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;flex-direction:row;align-items:center;flex-wrap:wrap;padding:12px 14px;gap:7px;border-right:0;border-bottom:1px solid var(--line)}
  .sidebar::before{height:100%;border-radius:0}
  .brand{padding:0 12px 0 4px}
  .brand-logo{width:40px;height:40px}
  .side-foot{display:none}
  .nav{flex:1;flex-direction:row;flex-wrap:wrap;gap:6px;margin:0}
  .nav button{min-height:42px;padding:9px 11px}
  .nav .idx{display:none}
  .main{padding:22px 16px 48px}
}
@media(max-width:820px){
  .g2,.g3,.g23,.g32{grid-template-columns:1fr}
}
@media(max-width:560px){
  body{font-size:13px}
  .g4{grid-template-columns:1fr 1fr;gap:11px}
  .board{grid-template-columns:1fr}
  .nav button .txt{display:none}
  .nav button{width:42px;justify-content:center;padding:8px}
  .topbar{align-items:flex-start;margin-bottom:18px}
  .topbar h1{font-size:20px}
  .top-right{width:100%}
  .chip{min-height:34px;padding:6px 10px}
  .card,.sec{padding:15px}
  .tile{padding:15px}
  .tile .tv{font-size:20px}
}
@media(max-width:390px){
  .g4{grid-template-columns:1fr}
  .brand-txt span{display:none}
  .top-right .chip:nth-child(2){display:none}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  #screen>.grid{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><span class="material-symbols-outlined">precision_manufacturing</span></div>
      <div class="brand-txt"><b>量產轉移台</b><span>NPI TRANSFER</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
