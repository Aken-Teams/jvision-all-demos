<style>
:root{

}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--color-background);color:var(--ink);font:14px/1.55 "Open Sans",sans-serif}
button,a{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible{outline:4px solid var(--color-ring);outline-offset:3px}
.topbar{position:sticky;top:0;z-index:20;background:var(--black);color:#fff;border-bottom:4px solid var(--color-accent)}
.topbar-in{max-width:1440px;margin:auto;min-height:70px;padding:10px 20px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;display:grid;place-items:center;background:var(--color-accent);color:#001b12;border:2px solid #fff}
.logo svg{width:27px}
.brand b{font:700 17px/1.2 Poppins,sans-serif;letter-spacing:.03em}
.brand small{display:block;color:#cbd5e1;font-size:11px}
.meta{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px}
.pill,.tag,.badge,.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid currentColor;border-radius:0;font-weight:700}
.pill{padding:5px 9px;color:#fff;font-size:11px}
.dot{width:9px;height:9px;background:#34d399;border:1px solid #fff}
.nav{position:sticky;top:70px;z-index:19;background:#fff;border-bottom:3px solid var(--ink)}
.nav-in{max-width:1440px;margin:auto;padding:0 20px;display:flex;overflow-x:auto}
.nav button{min-height:52px;padding:8px 14px;border:0;border-right:1px solid var(--line);background:#fff;color:var(--muted);font-weight:700;white-space:nowrap}
.nav button:hover{background:var(--color-muted);color:var(--ink)}
.nav button.on{background:var(--color-accent);color:#001b12;box-shadow:inset 0 -5px 0 #001b12}
main{max-width:1440px;margin:auto;padding:28px 20px 64px}
.screen-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end;margin-bottom:20px;padding-bottom:14px;border-bottom:4px solid var(--ink)}
.screen-head h1{margin:0;font:700 clamp(24px,3vw,40px)/1.08 Poppins,sans-serif;letter-spacing:-.04em}
.screen-head p{margin:8px 0 0;color:var(--muted)}
.tag{padding:7px 10px;background:#d1fae5;color:#065f46;font-size:12px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.g-kanban{grid-template-columns:repeat(4,minmax(185px,1fr))}
.card,.kpi,.eqcard,.kcol{background:var(--color-card);border:2px solid var(--ink);border-radius:0;min-width:0}
.card{padding:17px}
.card h3{margin:0 0 14px;padding-bottom:9px;border-bottom:2px solid var(--ink);font:700 15px Poppins,sans-serif}
.sub{float:right;color:var(--muted);font:600 11px "Open Sans",sans-serif}
.kpi{position:relative;padding:16px;border-left:9px solid var(--color-accent)}
.kpi.amber{border-left-color:#ca8a04}.kpi.red{border-left-color:var(--color-destructive)}
.kt{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.kv{margin-top:6px;font:700 29px/1.15 Poppins,sans-serif;font-variant-numeric:tabular-nums}
.kv small{font:600 12px "Open Sans",sans-serif;color:var(--muted)}
.kd{margin-top:6px;font-weight:700;font-size:11px}.up{color:#047857}.down{color:#b91c1c}
table{width:100%;min-width:560px;border-collapse:collapse;font-size:12.5px}
th,td{padding:10px;border:1px solid var(--ink);white-space:nowrap}
th{background:var(--color-primary);color:#fff;text-align:left;font-size:11px}

td:nth-child(n+5){text-align:right}
.mono,.kid,.num{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums}
.badge,.chip{padding:2px 7px;font-size:10.5px;border-width:1px}
.b-ok{background:#d1fae5;color:#065f46}.b-run{background:#e0f2fe;color:#075985}
.b-wait{background:#fef3c7;color:#854d0e}.b-err{background:#fee2e2;color:#991b1b}

.kcol{padding:10px;background:var(--color-muted)}

.swatch{width:12px;height:12px;border:1px solid var(--ink)}.cnt{margin-left:auto}
.kcard{margin-bottom:9px;padding:10px;background:#fff;border:2px solid var(--ink);border-left:7px solid var(--color-accent)}
.kcard.pri-h{border-left-color:#dc2626}.kcard.pri-m{border-left-color:#ca8a04}

.ktt{margin:7px 0;font-weight:700}.kmeta{flex-wrap:wrap;gap:5px}.prog{gap:8px;margin-top:8px;font-size:11px}
.prog .bar{flex:1}
.eqcard{padding:13px}.eh{gap:10px}.avt{width:44px;height:44px;display:grid;place-items:center;background:var(--color-primary);color:#fff;border:2px solid var(--ink);font-weight:700}
.en{font:700 14px Poppins,sans-serif}.ei{font-size:11px;color:var(--muted)}.estat{margin-left:auto}
.eqrow{justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--ink);font-size:11.5px}
.wgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;min-width:520px}
.wcell{aspect-ratio:1;display:grid;place-items:center;border:1px solid #94a3b8;background:#fff;font:700 9px ui-monospace}
.rack{background:#cbd5e1}.aisle{background:#fff}.node{background:#a7f3d0}.path{background:#34d399}

.tl{border-left:4px solid var(--ink);padding-left:16px}.tli{position:relative;padding:0 0 17px 4px}
.tli:before{content:"";position:absolute;left:-24px;top:4px;width:12px;height:12px;background:var(--color-accent);border:2px solid var(--ink)}
.tli.warn:before{background:#eab308}.tli.err:before{background:#dc2626}
.tt{font:700 11px ui-monospace;color:var(--muted)}.th{font-weight:700}.td{color:var(--muted);font-size:12px}
.lane{display:flex;align-items:center;gap:10px;margin-bottom:8px;padding:9px;border:2px solid var(--ink)}
.ln{width:36px;height:36px;display:grid;place-items:center;background:#d1fae5;border:2px solid var(--ink);font:700 13px ui-monospace}.lbar{flex:1}.lt{justify-content:space-between;gap:10px;margin-bottom:4px;font-size:11px}
.flowline{gap:7px;flex-wrap:wrap;padding:12px;background:var(--color-muted);border:2px dashed var(--ink)}
.fnode{padding:8px 10px;background:#fff;border:2px solid var(--ink);font-weight:700}.farrow{font-weight:700;color:#047857}
.qitem{align-items:flex-start;gap:10px;padding:10px 0;border-bottom:2px solid var(--line)}
.qico{width:34px;height:34px;display:grid;place-items:center;background:var(--color-primary);color:#fff;border:2px solid var(--ink);font-weight:700}
.qbody{flex:1}.qh{font-weight:700}.tm{float:right;color:var(--muted);font-family:ui-monospace}.qd,.note{color:var(--muted);font-size:11.5px}.note{margin-top:12px;padding:9px;border-left:5px solid var(--color-accent);background:var(--color-muted)}
.chart{min-height:260px}
.enter{animation:enter .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.g23,.g32{grid-template-columns:1fr}}
@media(max-width:700px){.topbar-in{align-items:flex-start}.meta{display:none}.nav{top:70px}.nav-in{padding:0}.nav button{flex:1;padding:8px 10px}.nav .lbl{display:none}main{padding:20px 12px 50px}.screen-head{grid-template-columns:1fr}.g4,.g3,.g2{grid-template-columns:1fr}.card{padding:13px}}
</style>
</head>
