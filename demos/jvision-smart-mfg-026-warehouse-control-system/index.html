<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WCS 倉儲控制系統｜自動化設備任務調度</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#16a34a; --accent2:#4ade80; --accent-d:#15803d;
  --bg:#f1f5f4; --card:#ffffff; --ink:#0f172a; --mut:#64748b; --line:#e2e8f0;
  --ok:#16a34a; --warn:#f59e0b; --bad:#ef4444; --info:#0ea5e9;
  --shadow:0 1px 3px rgba(15,23,42,.06),0 6px 20px rgba(15,23,42,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;font-size:20px}
.topbar{position:sticky;top:0;z-index:40;background:linear-gradient(100deg,#0b3d24,#134e2e 55%,#166534);color:#fff;box-shadow:0 2px 14px rgba(11,61,36,.28)}
.topbar-in{max-width:1440px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent2),var(--accent));display:flex;align-items:center;justify-content:center;color:#06301b;flex:none;box-shadow:0 4px 12px rgba(74,222,128,.35)}
.brand .logo .material-symbols-outlined{font-size:24px}
.brand b{font-size:16px;font-weight:800;letter-spacing:.5px;white-space:nowrap}
.brand span{display:block;font-size:11px;color:#bbf7d0;font-weight:500}
.topmeta{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.55)}70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:58px;z-index:30}
.nav-in{max-width:1440px;margin:0 auto;padding:8px 14px;display:flex;gap:8px;flex-wrap:wrap}
.nav button{flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;color:var(--mut);padding:9px 15px;border-radius:11px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.nav button .material-symbols-outlined{font-size:19px}
.nav button:hover{border-color:var(--accent2);color:var(--accent-d)}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;border-color:transparent;box-shadow:0 5px 14px rgba(22,163,74,.32)}
main{max-width:1440px;margin:0 auto;padding:20px 18px 60px}
.screen-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.screen-head h1{margin:0;font-size:21px;font-weight:800;display:flex;align-items:center;gap:10px}
.screen-head h1 .material-symbols-outlined{font-size:26px;color:var(--accent)}
.screen-head p{margin:4px 0 0;color:var(--mut);font-size:13px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:#dcfce7;color:var(--accent-d)}
.grid{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.g-kanban{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32,.g-kanban{grid-template-columns:1fr}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.card h3 .sub{margin-left:auto;font-size:11px;color:var(--mut);font-weight:500}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:var(--shadow);position:relative;overflow:hidden;min-width:0}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.kpi .kt{font-size:12px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .kt .material-symbols-outlined{font-size:17px;color:var(--accent)}
.kpi .kv{font-size:27px;font-weight:800;margin-top:8px;letter-spacing:-.5px}
.kpi .kv small{font-size:13px;font-weight:600;color:var(--mut)}
.kpi .kd{font-size:11.5px;margin-top:6px;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.kpi .up{color:var(--ok)} .kpi .down{color:var(--bad)}
.kpi.amber::before{background:var(--warn)} .kpi.amber .kt .material-symbols-outlined{color:var(--warn)}
.kpi.red::before{background:var(--bad)} .kpi.red .kt .material-symbols-outlined{color:var(--bad)}
.kpi.blue::before{background:var(--info)} .kpi.blue .kt .material-symbols-outlined{color:var(--info)}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
thead th{text-align:left;color:var(--mut);font-weight:600;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap;font-size:11.5px}
tbody td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:hover{background:#f0fdf4}
.mono{font-variant-numeric:tabular-nums;font-family:"Inter";font-weight:600}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.b-ok{background:#dcfce7;color:#15803d} .b-run{background:#dbeafe;color:#1d4ed8}
.b-wait{background:#fef3c7;color:#b45309} .b-err{background:#fee2e2;color:#b91c1c}
.b-idle{background:#e2e8f0;color:#475569}
.bar{height:7px;border-radius:6px;background:#e2e8f0;overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.kcol{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:11px;min-width:0;display:flex;flex-direction:column}
.kcol-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.kcol-h .cnt{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11px;color:var(--mut)}
.kcol-h .swatch{width:10px;height:10px;border-radius:3px}
.kcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(15,23,42,.05);border-left:3px solid var(--accent)}
.kcard:last-child{margin-bottom:0}
.kcard .kh{display:flex;align-items:center;justify-content:space-between;gap:6px}
.kcard .kid{font-size:11px;color:var(--mut);font-weight:700;font-family:"Inter"}
.kcard .ktt{font-size:13px;font-weight:700;margin:5px 0 4px}
.kcard .kmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.chip{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:#f1f5f9;color:#475569;display:inline-flex;align-items:center;gap:3px}
.chip .material-symbols-outlined{font-size:13px}
.kcard.pri-h{border-left-color:var(--bad)} .kcard.pri-m{border-left-color:var(--warn)} .kcard.pri-l{border-left-color:var(--accent)}
.prog{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:11px;color:var(--mut);font-weight:600}
.eqcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:var(--shadow);min-width:0}
.eqcard .eh{display:flex;align-items:center;gap:10px}
.eqcard .avt{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.eqcard .avt .material-symbols-outlined{font-size:24px}
.eqcard .en{font-weight:800;font-size:14px}
.eqcard .ei{font-size:11px;color:var(--mut);font-weight:600}
.eqcard .estat{margin-left:auto}
.eqrow{display:flex;justify-content:space-between;font-size:11.5px;padding:5px 0;border-bottom:1px dashed var(--line)}
.eqrow:last-child{border-bottom:none}
.eqrow b{font-family:"Inter";font-variant-numeric:tabular-nums}
.wgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;min-width:520px}
.wcell{aspect-ratio:1;border-radius:5px;background:#eef2f7;display:flex;align-items:center;justify-content:center;font-size:10px;color:#94a3b8;font-weight:700;position:relative}
.wcell.rack{background:#e2e8f0;color:#64748b}
.wcell.aisle{background:#f8fafc}
.wcell.node{background:#dcfce7;color:#15803d}
.wcell.path{background:var(--accent2);color:#06301b}
.wcell.agv{background:var(--accent);color:#fff;box-shadow:0 0 0 2px #bbf7d0}
.wcell.block{background:#fecaca;color:#b91c1c}
.wcell.dock{background:#bfdbfe;color:#1e40af}
.leg{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:11.5px;color:var(--mut)}
.leg span{display:inline-flex;align-items:center;gap:5px}
.leg i{width:13px;height:13px;border-radius:4px;display:inline-block}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tli{position:relative;padding:0 0 15px 8px}
.tli::before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.tli.warn::before{border-color:var(--warn)} .tli.err::before{border-color:var(--bad)}
.tli .tt{font-size:11px;color:var(--mut);font-weight:700;font-family:"Inter"}
.tli .th{font-size:13px;font-weight:700;margin:2px 0 2px}
.tli .td{font-size:12px;color:var(--mut)}
.lane{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;background:#fff}
.lane:last-child{margin-bottom:0}
.lane .ln{width:34px;height:34px;border-radius:9px;background:#dcfce7;color:var(--accent-d);display:flex;align-items:center;justify-content:center;font-weight:800;font-family:"Inter";flex:none}
.lane .lbar{flex:1;min-width:0}
.lane .lbar .lt{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:4px}
.flowline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px;background:#f8fafc;border:1px dashed var(--line);border-radius:12px}
.fnode{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:12px;font-weight:700}
.fnode .material-symbols-outlined{font-size:18px;color:var(--accent)}
.farrow{color:var(--accent);font-weight:800}
.qitem{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.qitem:last-child{border-bottom:none}
.qico{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.qico .material-symbols-outlined{font-size:18px}
.qbody{flex:1;min-width:0}
.qbody .qh{display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:700;flex-wrap:wrap}
.qbody .qh .tm{margin-left:auto;font-size:11px;color:var(--mut);font-weight:600}
.qbody .qd{font-size:11.5px;color:var(--mut);margin-top:2px}
.split{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700}
.split .s1,.split .s2{padding:3px 8px}
.split .s1{background:#e0f2fe;color:#0369a1;border-radius:8px 0 0 8px}
.split .s2{background:#dcfce7;color:#15803d;border-radius:0 8px 8px 0}
.note{font-size:11px;color:var(--mut);margin-top:10px;display:flex;align-items:center;gap:6px}
.note .material-symbols-outlined{font-size:15px;color:var(--accent)}
@media(max-width:560px){
  .nav button .lbl{display:none}
  .nav button{padding:9px 12px}
  .brand span{display:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">precision_manufacturing</span></div>
      <div><b>WCS 倉儲控制系統</b><span>Warehouse Control System</span></div>
    </div>
    <div class="topmeta">
      <span class="pill"><span class="dot"></span>設備連線 18/18</span>
      <span class="pill"><span class="material-symbols-outlined" style="font-size:16px">bolt</span>今日吞吐 4,872</span>
      <span class="pill"><span class="material-symbols-outlined" style="font-size:16px">person</span>物流工程 · 王建豪</span>
    </div>
  </div>
</header>
<nav class="nav">
  <div class="nav-in" id="nav"></div>
</nav>
<main>
  <div id="app"></div>
</main>
<script>
"use strict";
var NAV=[
  {icon:"assignment",label:"任務調度看板"},
  {icon:"precision_manufacturing",label:"設備狀態監控"},
  {icon:"route",label:"搬運路徑控制"},
  {icon:"conveyor_belt",label:"輸送分揀調度"},
  {icon:"hub",label:"系統協同介接"},
  {icon:"insights",label:"執行績效分析"}
];
var app=document.getElementById("app");
var charts=[];
function clearCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function base(o){o.chart=o.chart||{};o.chart.redrawOnParentResize=false;o.chart.redrawOnWindowResize=false;o.chart.animations={enabled:false};o.chart.toolbar={show:false};o.chart.fontFamily='Inter, "Noto Sans TC", sans-serif';return o;}
function mk(el,opt){if(!el)return;var c=new ApexCharts(el,base(opt));c.render();charts.push(c);return c;}

(function(){
  var n=document.getElementById("nav"),h="";
  for(var i=0;i<NAV.length;i++){
    h+='<button data-i="'+i+'" onclick="show('+i+')"><span class="material-symbols-outlined">'+NAV[i].icon+'</span><span class="lbl">'+NAV[i].label+'</span></button>';
  }
  n.innerHTML=h;
})();

function kpi(icon,title,val,unit,delta,dir,alertLvl,forceCls){
  var cls=forceCls?forceCls:(alertLvl===1?"amber":alertLvl===2?"red":"");
  var vs=val;if(unit&&unit.length<=4&&unit!=="today"&&unit!=="24h"){vs=val+' <small>'+unit+'</small>';}
  var d="";
  if(delta){d='<div class="kd '+(dir==="up"?"up":"down")+'"><span class="material-symbols-outlined" style="font-size:14px">'+(dir==="up"?"trending_up":"trending_down")+'</span>'+delta+'</div>';}
  else if(unit==="today"||unit==="24h"){d='<div class="kd" style="color:#94a3b8">'+unit+'</div>';}
  return '<div class="kpi '+cls+'"><div class="kt"><span class="material-symbols-outlined">'+icon+'</span>'+title+'</div><div class="kv">'+vs+'</div>'+d+'</div>';
}
function tli(cls,tm,h,d){
  return '<div class="tli '+cls+'"><div class="tt">'+tm+'</div><div class="th">'+h+'</div><div class="td">'+d+'</div></div>';
}

/* ================= SCREEN 0 : 任務調度看板 (KANBAN) ================= */
function s0(){
  var cols=[
    {t:"待分解",c:"#94a3b8",items:[
      {id:"T-4821",tt:"入庫上架 · PLT收貨",pri:"m",eq:"待派",qty:"棧板×3",eta:"09:42",p:0},
      {id:"T-4822",tt:"補貨移轉 · A區→揀貨面",pri:"l",eq:"待派",qty:"箱×24",eta:"09:55",p:0},
      {id:"T-4826",tt:"退貨回倉 · 品檢暫存",pri:"l",eq:"待派",qty:"箱×6",eta:"10:10",p:0}
    ]},
    {t:"已派工",c:"#f59e0b",items:[
      {id:"T-4815",tt:"出庫揀選 · SO-77120",pri:"h",eq:"AGV-07",qty:"箱×18",eta:"09:30",p:15},
      {id:"T-4818",tt:"整棧入儲 · 立庫3F",pri:"m",eq:"SRM-02",qty:"棧板×2",eta:"09:38",p:8}
    ]},
    {t:"執行中",c:"#0ea5e9",items:[
      {id:"T-4808",tt:"出庫搬運 · 月台D2",pri:"h",eq:"AGV-03",qty:"箱×32",eta:"09:26",p:62},
      {id:"T-4811",tt:"深巷取貨 · 立庫2F",pri:"m",eq:"SRM-01",qty:"棧板×1",eta:"09:33",p:40},
      {id:"T-4813",tt:"跨區調撥 · B區→C區",pri:"l",eq:"AGV-11",qty:"箱×12",eta:"09:44",p:28}
    ]},
    {t:"已完成",c:"#16a34a",items:[
      {id:"T-4801",tt:"入庫上架 · A-12-03",pri:"m",eq:"AGV-05",qty:"棧板×2",eta:"09:12",p:100},
      {id:"T-4803",tt:"補貨移轉 · 揀貨面G7",pri:"l",eq:"CONV-1",qty:"箱×20",eta:"09:18",p:100},
      {id:"T-4806",tt:"出庫覆核 · 月台D1",pri:"h",eq:"AGV-09",qty:"箱×15",eta:"09:22",p:100}
    ]}
  ];
  var kb="";
  for(var i=0;i<cols.length;i++){
    var col=cols[i],ci="";
    for(var j=0;j<col.items.length;j++){
      var it=col.items[j];
      var eqIcon=it.eq.indexOf("AGV")>=0?"smart_toy":it.eq.indexOf("SRM")>=0?"warehouse":it.eq.indexOf("CONV")>=0?"conveyor_belt":"schedule";
      ci+='<div class="kcard pri-'+it.pri+'">'+
        '<div class="kh"><span class="kid">'+it.id+'</span><span class="chip"><span class="material-symbols-outlined">'+eqIcon+'</span>'+it.eq+'</span></div>'+
        '<div class="ktt">'+it.tt+'</div>'+
        '<div class="kmeta"><span class="chip"><span class="material-symbols-outlined">inventory_2</span>'+it.qty+'</span><span class="chip"><span class="material-symbols-outlined">timer</span>'+it.eta+'</span></div>'+
        '<div class="prog"><div class="bar" style="flex:1"><i style="width:'+it.p+'%"></i></div>'+it.p+'%</div>'+
        '</div>';
    }
    kb+='<div class="kcol"><div class="kcol-h"><span class="swatch" style="background:'+col.c+'"></span>'+col.t+'<span class="cnt">'+col.items.length+'</span></div>'+ci+'</div>';
  }
  app.innerHTML=
  '<div class="screen-head"><div><h1><span class="material-symbols-outlined">assignment</span>任務調度看板</h1><p>WMS 指令分解為設備子任務，依優先序在各狀態欄流轉派工</p></div><span class="tag"><span class="material-symbols-outlined" style="font-size:14px">bolt</span>即時佇列 · 11 筆</span></div>'+
  '<div class="grid g4" style="margin-bottom:14px">'+
    kpi("assignment_turned_in","進行中任務","5","today","+2","up")+
    kpi("bolt","分解成功率","99.2%","24h","+0.4%","up")+
    kpi("hourglass_top","平均排隊","1.8","min","-0.6","up")+
    kpi("priority_high","高優先待辦","2","筆","","",1)+
  '</div>'+
  '<div class="card" style="margin-bottom:14px"><h3><span class="material-symbols-outlined">view_kanban</span>設備任務看板<span class="sub">依 RULE 自動排序</span></h3>'+
    '<div style="overflow-x:auto"><div class="grid g-kanban" style="min-width:760px">'+kb+'</div></div>'+
    '<div class="note"><span class="material-symbols-outlined">rule</span>RULE-02：WMS 指令依料號、儲位、緊急度拆解為堆垛機／AGV／輸送線子任務並排定優先序</div>'+

function perfRow(n,done,succ,util,avg,err,barv){
  var errBadge=err==="0"?'<span class="badge b-ok">0</span>':'<span class="badge '+(parseInt(err,10)>5?"b-err":"b-wait")+'">'+err+'</span>';
  return '<tr><td><b>'+n+'</b></td><td class="mono">'+done+'</td><td class="mono" style="color:#15803d">'+succ+'</td><td><div style="display:flex;align-items:center;gap:7px"><div class="bar" style="width:60px"><i style="width:'+barv+'%"></i></div><span class="mono">'+util+'</span></div></td><td class="mono">'+avg+'</td><td>'+errBadge+'</td></tr>';
}

/* ---------- controller ---------- */
var RENDER=[s0,s1,s2,s3,s4,s5];
function show(i){
  i=Math.max(0,Math.min(i,RENDER.length-1));
  clearCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i);}
  RENDER[i]();
}
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
