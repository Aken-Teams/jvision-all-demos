<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>出貨管理系統（Outbound Shipping Management）</title>
<meta name="description" content="出貨訂單分批、波次規劃、揀貨派工、複核裝箱到交運承運商的單一作業平台"/>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#db2777; --accent2:#f472b6; --accent-d:#9d174d;
  --bg:#f5f3f6; --panel:#ffffff; --ink:#1b1420; --muted:#6b6472;
  --line:#e8e2ec; --soft:#faf7fb; --chip:#fce7f3;
  --amber:#d97706; --red:#dc2626; --green:#16a34a; --blue:#2563eb; --slate:#475569;
  --side:#2a1523; --side2:#3d1f31;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5;}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.app{display:flex;min-height:100vh;align-items:stretch;}

/* ===== sidebar ===== */
.side{width:236px;flex:0 0 236px;background:linear-gradient(185deg,var(--side),var(--side2));color:#f5e9f0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden;}
.side-brand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px;}
.side-brand .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:0 6px 16px rgba(219,39,119,.4);}
.side-brand .logo .ms{font-size:24px;color:#fff;}
.side-brand .bt{min-width:0;}
.side-brand .bt h1{font-size:15px;margin:0;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.side-brand .bt p{font-size:11px;margin:2px 0 0;opacity:.62;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.side-nav{padding:8px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;flex:1;}
.side-nav .grp{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.4;padding:12px 10px 5px;font-weight:700;}
.side-nav button{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:#e7d3de;padding:10px 12px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;text-align:left;width:100%;transition:.15s;min-width:0;}
.side-nav button .ms{font-size:20px;flex:0 0 auto;opacity:.85;}
.side-nav button .st{margin-left:auto;font-size:10px;font-weight:700;background:rgba(255,255,255,.12);padding:1px 7px;border-radius:10px;flex:0 0 auto;}
.side-nav button:hover{background:rgba(255,255,255,.08);color:#fff;}
.side-nav button.on{background:linear-gradient(100deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(219,39,119,.38);}
.side-nav button.on .st{background:rgba(255,255,255,.24);}
.side-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.09);display:flex;align-items:center;gap:10px;}
.side-foot .av{width:32px;height:32px;border-radius:50%;background:var(--accent2);color:#2a1523;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:0 0 auto;}
.side-foot .fi{min-width:0;}
.side-foot .fi b{font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.side-foot .fi span{font-size:10.5px;opacity:.6;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topline{display:flex;align-items:center;gap:14px;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 22px;position:sticky;top:0;z-index:20;}
.topline .crumb{font-size:12.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.topline .crumb b{color:var(--ink);}
.topline .tmeta{margin-left:auto;display:flex;align-items:center;gap:16px;}
.topline .tstat{text-align:right;}
.topline .tstat b{font-size:15px;font-weight:800;display:block;color:var(--accent-d);}
.topline .tstat span{font-size:10px;color:var(--muted);}
.topline .pill{display:flex;align-items:center;gap:6px;background:var(--chip);color:var(--accent-d);font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:20px;}
.topline .pill .ms{font-size:15px;}
.wrap{padding:22px;max-width:1320px;margin:0 auto;width:100%;}
.screen-head{margin-bottom:16px;}
.screen-head h2{font-size:21px;margin:0;font-weight:800;display:flex;align-items:center;gap:9px;}
.screen-head h2 .ms{color:var(--accent);font-size:25px;}
.screen-head p{margin:5px 0 0;color:var(--muted);font-size:13px;}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px;}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px;position:relative;overflow:hidden;min-width:0;}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--accent),var(--accent2));}
.kpi .kl{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;}
.kpi .kl .ms{font-size:17px;color:var(--accent);}
.kpi .kv{font-size:25px;font-weight:800;margin-top:7px;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kpi .kv small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px;}
.kpi .kd{font-size:11.5px;margin-top:5px;font-weight:600;display:flex;align-items:center;gap:3px;}
.up{color:var(--green);} .down{color:var(--red);} .warn{color:var(--amber);} .flat{color:var(--slate);}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0;}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;}
.card-h .ms{font-size:19px;color:var(--accent);}
.card-h .badge{margin-left:auto;font-size:11px;font-weight:700;background:var(--chip);color:var(--accent-d);padding:3px 9px;border-radius:20px;white-space:nowrap;}
.card-b{padding:14px 16px;}
.split{display:grid;grid-template-columns:342px 1fr;gap:16px;align-items:start;}
.filter-row{display:flex;gap:7px;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.filter-row .fchip{font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:16px;background:var(--soft);border:1px solid var(--line);color:var(--muted);cursor:pointer;}
.filter-row .fchip.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.list{max-height:560px;overflow-y:auto;}
.li{padding:12px 15px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:11px;align-items:flex-start;transition:.12s;min-width:0;}
.li:hover{background:var(--soft);}
.li.on{background:var(--chip);border-left:3px solid var(--accent);padding-left:12px;}
.li .ico{width:36px;height:36px;border-radius:9px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.li .ico .ms{font-size:20px;color:var(--accent);}
.li .mid{min-width:0;flex:1;}
.li .mid b{font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.li .mid span{font-size:11.5px;color:var(--muted);}
.li .rt{text-align:right;flex:0 0 auto;}
.li .rt b{font-size:14px;font-weight:800;}
.li .rt span{font-size:10.5px;color:var(--muted);display:block;}

.dp-top{display:flex;align-items:flex-start;gap:14px;padding:16px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.dp-top .dpi{width:52px;height:52px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.dp-top .dpi .ms{font-size:28px;color:#fff;}
.dp-top .dph{min-width:0;flex:1;}
.dp-top .dph h3{margin:0;font-size:17px;font-weight:800;}
.dp-top .dph p{margin:3px 0 0;font-size:12.5px;color:var(--muted);}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;padding:16px;}
.st{background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:11px 12px;min-width:0;}
.st .l{font-size:11px;color:var(--muted);font-weight:600;}
.st .v{font-size:17px;font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.chart{width:100%;overflow:hidden;}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px;}
th{text-align:left;padding:10px 13px;background:var(--soft);color:var(--muted);font-weight:700;font-size:11.5px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:10px 13px;border-bottom:1px solid var(--line);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--soft);}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:14px;}
.t-ok{background:#dcfce7;color:#15803d;} .t-warn{background:#fef3c7;color:#b45309;}
.t-red{background:#fee2e2;color:#b91c1c;} .t-blue{background:#dbeafe;color:#1d4ed8;}
.t-slate{background:#e2e8f0;color:#475569;} .t-pink{background:#fce7f3;color:#9d174d;}
.mono{font-variant-numeric:tabular-nums;font-weight:700;}

.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.two-32{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start;}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;}
.col{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:11px;min-width:0;}
.col-h{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;margin-bottom:10px;}
.col-h .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
.col-h .cnt{margin-left:auto;font-size:11px;background:#fff;border:1px solid var(--line);padding:1px 8px;border-radius:12px;color:var(--muted);}
.tk{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 11px;margin-bottom:9px;}
.tk b{font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tk .tkm{font-size:11px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:6px;}
.tk .prog{height:6px;border-radius:4px;background:#f0e7ee;margin-top:8px;overflow:hidden;}
.tk .prog > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));}

.tl{position:relative;padding-left:24px;}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tli{position:relative;padding:0 0 16px 4px;}
.tli::before{content:"";position:absolute;left:-21px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent2);}
.tli.mut::before{background:#cbb7c4;box-shadow:0 0 0 2px #e8e2ec;}
.tli .tt{font-size:13px;font-weight:700;}
.tli .tm{font-size:11.5px;color:var(--muted);margin-top:2px;}
.tli .td{font-size:12px;margin-top:4px;color:#4a3f47;}

.bar{height:10px;border-radius:6px;background:#efe6ec;overflow:hidden;}
.bar > i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.bar.warn > i{background:linear-gradient(90deg,#d97706,#fbbf24);}
.bar.green > i{background:linear-gradient(90deg,#16a34a,#4ade80);}
.gwrap{background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:13px 15px;margin-top:10px;}
.gwrap .gt{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:7px;gap:8px;}
.note{font-size:11.5px;color:var(--muted);padding:11px 16px;background:var(--soft);border-top:1px dashed var(--line);display:flex;align-items:center;gap:7px;}
.note .ms{font-size:16px;color:var(--accent);flex:0 0 auto;}
.mb16{margin-bottom:16px;}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12px;color:var(--muted);}
.legend span{display:flex;align-items:center;gap:6px;}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}

/* signature scan element (screen 3) */
.scan{background:linear-gradient(160deg,#2a1523,#4a1f38);border-radius:14px;padding:18px;color:#f5e9f0;position:relative;overflow:hidden;}
.scan .scan-h{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px;margin-bottom:14px;}
.scan .scan-h .ms{font-size:22px;color:var(--accent2);}
.scan-box{background:rgba(255,255,255,.05);border:1px dashed rgba(244,114,182,.5);border-radius:12px;padding:20px;text-align:center;margin-bottom:14px;}
.scan-box .code{font-size:22px;font-weight:800;letter-spacing:2px;font-variant-numeric:tabular-nums;}
.scan-box .sub{font-size:12px;opacity:.7;margin-top:5px;}
.scan-line{display:flex;align-items:center;gap:11px;background:rgba(255,255,255,.05);border-radius:10px;padding:10px 13px;margin-bottom:8px;}
.scan-line .qi{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.scan-line .qi.ok{background:rgba(22,163,74,.25);color:#4ade80;}
.scan-line .qi.wait{background:rgba(217,119,6,.22);color:#fbbf24;}
.scan-line .qm{min-width:0;flex:1;}
.scan-line .qm b{font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.scan-line .qm span{font-size:10.5px;opacity:.6;}
.scan-line .qq{font-size:13px;font-weight:800;flex:0 0 auto;}

@media(max-width:1080px){ .split{grid-template-columns:300px 1fr;} .two-32{grid-template-columns:1fr;} }
@media(max-width:860px){
  .app{flex-direction:column;}
  .side{width:100%;flex:0 0 auto;height:auto;position:static;flex-direction:column;}
  .side-brand{padding:14px 16px;}
  .side-nav{flex-direction:row;flex-wrap:wrap;overflow-x:auto;padding:8px 12px;}
  .side-nav .grp{display:none;}
  .side-nav button{width:auto;flex:0 0 auto;}
  .side-nav button .st{display:none;}
  .side-foot{display:none;}
  .split{grid-template-columns:1fr;}
  .board{grid-template-columns:repeat(2,1fr);}
  .list{max-height:340px;}
}
@media(max-width:820px){
  .kpis{grid-template-columns:repeat(2,1fr);}
  .two{grid-template-columns:1fr;}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:560px){
  .side-nav button span.lbl{display:none;}
  .side-nav button{padding:10px 12px;}
  .topline .tstat{display:none;}
  .board{grid-template-columns:1fr;}
  .wrap{padding:14px;}
}
@media(max-width:430px){
  .kpis{grid-template-columns:1fr 1fr;}
  .stat-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="side-brand">
      <div class="logo"><span class="ms">local_shipping</span></div>
      <div class="bt"><h1>出貨管理系統</h1><p>Outbound Shipping Management</p></div>
    </div>
    <nav class="side-nav" id="nav"></nav>
    <div class="side-foot">
      <div class="av">郁</div>
      <div class="fi"><b>物流部 · 郭郁婷</b><span>出貨排程主管</span></div>
    </div>
  </aside>
  <div class="main">
    <div class="topline">
      <div class="crumb"><b id="crumb">出貨訂單管理</b></div>
      <div class="tmeta">
        <div class="tstat"><b>98.1%</b><span>今日出貨準時率</span></div>
        <div class="tstat"><b>0.4%</b><span>出貨錯誤率</span></div>
        <div class="pill"><span class="ms">calendar_today</span>2026-08-14</div>
      </div>
    </div>
    <main class="wrap"><div id="screen"></div></main>
  </div>
</div>

<script>
(function(){
"use strict";
var scr=document.getElementById("screen");
var navEl=document.getElementById("nav");
var crumbEl=document.getElementById("crumb");
var charts=[];
function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function mk(id,opt){
  var el=document.getElementById(id);
  if(!el)return;
  var c=new ApexCharts(el,opt);
  c.render();
  charts.push(c);
}
var PINK="#db2777",PINK2="#f472b6",AMBER="#d97706",RED="#dc2626",GREEN="#16a34a",BLUE="#2563eb",SLATE="#64748b";
var baseChart={chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},fontFamily:'Inter,"Noto Sans TC",sans-serif',toolbar:{show:false},redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false}}};

var NAV=[
  {i:0,ic:"receipt_long",t:"出貨訂單管理",st:"42"},
  {i:1,ic:"account_tree",t:"波次規劃",st:"6"},
  {i:2,ic:"inventory_2",t:"揀貨派工",st:"18"},
  {i:3,ic:"fact_check",t:"複核裝箱",st:"9"},
  {i:4,ic:"local_shipping",t:"單據與交運",st:"5"},
  {i:5,ic:"monitoring",t:"出貨績效分析",st:""}
];
navEl.innerHTML='<div class="grp">出貨作業流程</div>'+NAV.map(function(n){
  return '<button data-i="'+n.i+'"><span class="ms">'+n.ic+'</span><span class="lbl">'+n.t+'</span>'+(n.st?'<span class="st">'+n.st+'</span>':'')+'</button>';
}).join("");
navEl.addEventListener("click",function(e){
  var b=e.target.closest("[data-i]");if(!b)return;
  location.hash="v"+b.getAttribute("data-i");
});
function setNav(i){
  var bs=navEl.querySelectorAll("[data-i]");
  for(var k=0;k<bs.length;k++){bs[k].className=(+bs[k].getAttribute("data-i")===i)?"on":"";}
  crumbEl.textContent=NAV[i].t;
}

/* ================= SCREEN 0 : 出貨訂單管理 ================= */
var ORDERS=[
  {no:"SO-260814-018",cust:"宏達電子",region:"北區",items:6,qty:1240,due:"2026-08-14",pri:"急單",carrier:"O光物流",st:"crit",amt:486000,addr:"新北市土城區中山路 120 號",note:"客戶指定當日出"},
  {no:"SO-260814-017",cust:"O昇零件",region:"中區",items:4,qty:860,due:"2026-08-14",pri:"一般",carrier:"O宏大運",st:"warn",amt:312400,addr:"台中市西屯區工業區 8 路 15 號",note:""},
  {no:"SO-260814-015",cust:"O辰光封測",region:"南區",items:9,qty:2380,due:"2026-08-15",pri:"一般",carrier:"O捷速運",st:"ok",amt:928500,addr:"高雄市楠梓區加工出口區 5 街",note:"分兩批出貨"},
  {no:"SO-260814-012",cust:"O暘光電",region:"中區",items:3,qty:540,due:"2026-08-15",pri:"一般",carrier:"O宏大運",st:"ok",amt:207600,addr:"台中市后里區三豐路 88 號",note:""},
  {no:"SO-260814-010",cust:"研O科技",region:"北區",items:7,qty:1620,due:"2026-08-14",pri:"急單",carrier:"O光物流",st:"crit",amt:544300,addr:"台北市內湖區瑞光路 26 巷",note:"含冷鏈品項"},
  {no:"SO-260813-041",cust:"O宸電腦",region:"北區",items:5,qty:980,due:"2026-08-16",pri:"一般",carrier:"O捷速運",st:"ok",amt:361200,addr:"桃園市龜山區文化二路",note:""},
  {no:"SO-260813-038",cust:"O翊聯合",region:"北區",items:8,qty:2040,due:"2026-08-16",pri:"一般",carrier:"O光物流",st:"ok",amt:715800,addr:"新北市汐止區大同路一段",note:""}
];
var sel0=0;
function priTag(p){return p==="急單"?'<span class="tag t-red">急單</span>':'<span class="tag t-slate">一般</span>';}
function screen0(){
  var kpi='<div class="kpis">'+

/* ============ helpers ============ */
function headEl(ic,t,p){
  return '<div class="screen-head"><h2><span class="ms">'+ic+'</span>'+t+'</h2><p>'+p+'</p></div>';
}
function kpiC(ic,l,v,u,cls,d){
  var arrow=cls==="down"?"trending_down":(cls==="warn"?"priority_high":(cls==="flat"?"trending_flat":"trending_up"));
  return '<div class="kpi"><div class="kl"><span class="ms">'+ic+'</span>'+l+'</div>'+
    '<div class="kv">'+v+(u?'<small>'+u+'</small>':'')+'</div>'+
    '<div class="kd '+cls+'"><span class="ms" style="font-size:14px">'+arrow+'</span>'+d+'</div></div>';
}
function st(l,v){return '<div class="st"><div class="l">'+l+'</div><div class="v">'+v+'</div></div>';}
function tli(t,m,d,mut){
  return '<div class="tli'+(mut?' mut':'')+'"><div class="tt">'+t+'</div><div class="tm">'+m+'</div><div class="td">'+d+'</div></div>';
}

var SCREENS=[screen0,screen1,screen2,screen3,screen4,screen5];
function show(i){
  disposeCharts();
  setNav(i);
  SCREENS[i]();
  void scr.offsetHeight;
}
window.show=show;

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
})();
</script>
