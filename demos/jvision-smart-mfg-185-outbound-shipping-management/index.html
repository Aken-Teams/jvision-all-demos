<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>出貨管理系統（Outbound Shipping Management）</title>
<meta name="description" content="出貨訂單分批、波次規劃、揀貨派工、複核裝箱到交運承運商的單一作業平台">
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#334155;
  --color-on-primary:#fff;
  --color-secondary:#475569;
  --color-on-secondary:#fff;
  --color-accent:#059669;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#0f172a;
  --color-card:#fff;
  --color-card-foreground:#0f172a;
  --color-muted:#f2f3f4;
  --color-muted-foreground:#475569;
  --color-border:#e6e8ea;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#334155;
  --blue:#2563eb;
  --ink:#0f172a;
  --muted:#475569;
  --line:#e6e8ea;
  --green:#047857;
  --amber:#b45309;
  --red:#b91c1c;
  --surface:#fff;
  --soft:#f2f3f4;
  --radius:10px;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  color:var(--ink);
  background:var(--color-background);
  font-family:"Open Sans",sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,[data-r0],[data-r3],[data-r4],.fchip{cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.ms{
  font-family:"Material Symbols Outlined";
  font-size:20px;
  font-weight:400;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{
  position:sticky;
  top:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  color:#e2e8f0;
  background:var(--color-primary);
  border-right:1px solid #1e293b;
}
.side-brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-height:76px;
  padding:16px 18px;
  border-bottom:1px solid rgba(255,255,255,.12);
}
.logo{
  display:grid;
  place-items:center;
  width:42px;
  height:42px;
  flex:0 0 auto;
  border:1px solid #34d399;
  border-radius:9px;
  color:#fff;
  background:var(--color-accent);
}
.logo .ms{font-size:24px}
.bt{min-width:0}
.bt h1{
  margin:0;
  overflow:hidden;
  color:#fff;
  font-family:"Poppins",sans-serif;
  font-size:15px;
  font-weight:600;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.bt p{
  margin:2px 0 0;
  overflow:hidden;
  color:#cbd5e1;
  font-size:10px;
  letter-spacing:.02em;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.side-nav{
  display:flex;
  flex:1;
  flex-direction:column;
  gap:4px;
  overflow:auto;
  padding:14px 12px;
}
.grp{
  padding:5px 10px 8px;
  color:#94a3b8;
  font-family:"Poppins",sans-serif;
  font-size:10px;
  font-weight:600;
  letter-spacing:.1em;
  text-transform:uppercase;
}
.side-nav button{
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  min-height:44px;
  padding:10px 12px;
  color:#cbd5e1;
  text-align:left;
  background:transparent;
  border:1px solid transparent;
  border-radius:8px;
  transition:color 150ms ease,background-color 150ms ease,border-color 150ms ease;
}
.side-nav button:hover{
  color:#fff;
  background:#475569;
  border-color:#64748b;
}
.side-nav button.on{
  color:#fff;
  background:#0f766e;
  border-color:#34d399;
}
.side-nav button.on::before{
  width:3px;
  height:18px;
  margin-left:-7px;
  content:"";
  background:#a7f3d0;
  border-radius:2px;
}
.side-nav .lbl{font-size:13px;font-weight:600}
.side-nav .st{
  min-width:25px;
  margin-left:auto;
  padding:1px 7px;
  color:#e2e8f0;
  text-align:center;
  background:rgba(255,255,255,.12);
  border-radius:999px;
  font-family:var(--mono);
  font-size:10px;
}
.side-foot{
  display:flex;
  align-items:center;
  gap:10px;
  padding:15px 17px;
  border-top:1px solid rgba(255,255,255,.12);
}
.av{
  display:grid;
  place-items:center;
  width:34px;
  height:34px;
  flex:0 0 auto;
  color:#052e2b;
  background:#6ee7b7;
  border-radius:50%;
  font-weight:700;
}
.fi{min-width:0}
.fi b{display:block;color:#fff;font-size:12px}
.fi span{color:#cbd5e1;font-size:10px}
.main{min-width:0}
.topline{
  position:sticky;
  z-index:20;
  top:0;
  display:flex;
  align-items:center;
  min-height:64px;
  padding:10px 24px;
  background:rgba(255,255,255,.97);
  border-bottom:1px solid var(--line);
}
.crumb{
  overflow:hidden;
  color:var(--muted);
  font-size:12px;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.crumb::before{content:"出貨作業 / ";color:#64748b}
.crumb b{color:var(--ink);font-weight:700}
.tmeta{display:flex;align-items:center;gap:20px;margin-left:auto}
.tstat{text-align:right}
.tstat b{
  display:block;
  color:var(--green);
  font-family:"Poppins",sans-serif;
  font-size:15px;
  font-variant-numeric:tabular-nums;
}
.tstat span{color:var(--muted);font-size:10px}
.pill{
  display:flex;
  align-items:center;
  gap:6px;
  min-height:34px;
  padding:6px 11px;
  color:#334155;
  background:#f1f5f9;
  border:1px solid var(--line);
  border-radius:7px;
  font-family:var(--mono);
  font-size:11px;
}
.pill .ms{font-size:16px}
.wrap{width:100%;max-width:1440px;margin:auto;padding:26px}
.screen-head{
  display:flex;
  align-items:flex-end;
  gap:20px;
  justify-content:space-between;
  margin-bottom:20px;
  padding-bottom:16px;
  border-bottom:1px solid var(--line);
}
.screen-head h2{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0;
  color:var(--ink);
  font-family:"Poppins",sans-serif;
  font-size:23px;
  font-weight:600;
  letter-spacing:-.02em;
}
.screen-head h2 .ms{
  display:grid;
  place-items:center;
  width:38px;
  height:38px;
  color:#fff;
  background:var(--color-primary);
  border-radius:8px;
}
.screen-head p{max-width:720px;margin:0;color:var(--muted);font-size:12.5px;text-align:right}
.kpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
  margin-bottom:16px;
}
.kpi,.card{
  min-width:0;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
}
.kpi{
  position:relative;
  overflow:hidden;
  padding:16px;
  transition:border-color 150ms ease,background-color 150ms ease,transform 150ms ease;
}
.kpi:hover{
  background:#f8fffc;
  border-color:#6ee7b7;
  transform:translateY(-2px);
}
.kpi::after{
  position:absolute;
  right:0;
  bottom:0;
  width:34px;
  height:3px;
  content:"";
  background:var(--color-accent);
}
.kl{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11.5px;font-weight:600}
.kl .ms{color:var(--color-secondary);font-size:18px}
.kv{
  margin-top:8px;
  overflow:hidden;
  color:var(--ink);
  font-family:"Poppins",sans-serif;
  font-size:25px;
  font-weight:600;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.03em;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.kv small{margin-left:4px;color:var(--muted);font-size:12px;font-weight:500}
.kd{display:flex;align-items:center;gap:4px;margin-top:5px;font-size:11px;font-weight:600}
.up{color:#047857}.down{color:#b91c1c}.warn{color:#92400e}.flat{color:#475569}
.card{overflow:hidden}
.card-h{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:48px;
  padding:12px 15px;
  color:#1e293b;
  border-bottom:1px solid var(--line);
  font-family:"Poppins",sans-serif;
  font-size:13px;
  font-weight:600;
}
.card-h .ms{color:var(--color-accent);font-size:19px}
.badge{
  margin-left:auto;
  padding:3px 8px;
  color:#065f46;
  background:#d1fae5;
  border:1px solid #a7f3d0;
  border-radius:999px;
  font-family:var(--mono);
  font-size:10px;
  white-space:nowrap;
}
.card-b{padding:15px}
.split{display:grid;grid-template-columns:350px minmax(0,1fr);gap:16px;align-items:start}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.two-32{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
.mb16{margin-bottom:16px}
.filter-row{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  padding:10px 13px;
  border-bottom:1px solid var(--line);
}
.fchip{
  min-height:32px;
  padding:6px 11px;
  color:var(--muted);
  background:#fff;
  border:1px solid var(--line);
  border-radius:7px;
  font-size:11px;
  font-weight:600;
  transition:color 150ms ease,background-color 150ms ease,border-color 150ms ease;
}
.fchip:hover{color:#065f46;background:#ecfdf5;border-color:#6ee7b7}
.fchip.on{color:#fff;background:var(--color-accent);border-color:var(--color-accent)}
.list{max-height:570px;overflow:auto}
.li{
  display:flex;
  align-items:flex-start;
  gap:11px;
  min-width:0;
  padding:13px 14px;
  border-bottom:1px solid var(--line);
  transition:background-color 150ms ease,border-color 150ms ease;
}
.li:last-child{border-bottom:0}
.li:hover{background:#f8fafc}
.li.on{
  padding-left:10px;
  background:#ecfdf5;
  border-left:4px solid var(--color-accent);
}
.ico{
  display:grid;
  place-items:center;
  width:36px;
  height:36px;
  flex:0 0 auto;
  color:#334155;
  background:#f1f5f9;
  border:1px solid var(--line);
  border-radius:7px;
}
.ico .ms{font-size:19px}
.li.on .ico{color:#065f46;background:#d1fae5;border-color:#a7f3d0}
.mid{min-width:0;flex:1}
.mid b{display:block;overflow:hidden;font-size:13px;text-overflow:ellipsis;white-space:nowrap}
.mid span{color:var(--muted);font-size:10.5px}
.rt{flex:0 0 auto;text-align:right}
.rt b{display:block;font-family:var(--mono);font-size:13px}
.rt span{display:block;color:var(--muted);font-size:10px}
.dp-top{
  display:flex;
  align-items:flex-start;
  gap:13px;
  padding:16px;
  border-bottom:1px solid var(--line);
}
.dpi{
  display:grid;
  place-items:center;
  width:48px;
  height:48px;
  flex:0 0 auto;
  color:#fff;
  background:var(--color-primary);
  border-radius:8px;
}
.dpi .ms{font-size:25px}
.dph{min-width:0;flex:1}
.dph h3{margin:0;font-family:"Poppins",sans-serif;font-size:16px;font-weight:600}
.dph p{margin:4px 0 0;color:var(--muted);font-size:11.5px}
.stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:15px}
.st{min-width:0;padding:10px 11px;background:#f8fafc;border:1px solid var(--line);border-radius:7px}
.st .l{color:var(--muted);font-size:10.5px;font-weight:600}
.st .v{margin-top:3px;overflow:hidden;font-family:var(--mono);font-size:15px;font-weight:700;text-overflow:ellipsis;white-space:nowrap}
.gwrap{margin-top:8px;padding:12px 13px;background:#f8fafc;border:1px solid var(--line);border-radius:7px}
.gt{display:flex;justify-content:space-between;gap:8px;margin-bottom:7px;font-size:11.5px;font-weight:600}
.bar,.prog{overflow:hidden;background:#e2e8f0;border-radius:3px}
.bar{height:8px}
.prog{height:5px;margin-top:7px}
.bar i,.prog i{display:block;height:100%;background:var(--color-accent)}
.bar.warn i{background:#d97706}
.bar.green i{background:#059669}
.note{
  display:flex;
  align-items:flex-start;
  gap:7px;
  padding:10px 15px;
  color:var(--muted);
  background:#f8fafc;
  border-top:1px solid var(--line);
  font-size:11px;
}
.note .ms{flex:0 0 auto;color:var(--color-accent);font-size:17px}
.tbl-wrap{overflow-x:auto}
table{width:100%;min-width:540px;border-collapse:collapse;font-size:12px}
th{
  padding:10px 12px;
  color:#334155;
  text-align:left;
  background:#f1f5f9;
  border-bottom:1px solid #cbd5e1;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.02em;
  white-space:nowrap;
}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background-color 150ms ease}
tbody tr:hover{background:#f8fafc}
td:nth-child(n+3):not(:last-child){font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:10px;
  font-weight:700;
  white-space:nowrap;
}
.tag::before{width:6px;height:6px;content:"";background:currentColor;border-radius:50%}
.t-ok{color:#047857;background:#ecfdf5}
.t-warn{color:#92400e;background:#fffbeb}
.t-red{color:#b91c1c;background:#fef2f2}
.t-blue{color:#1d4ed8;background:#eff6ff}
.t-slate{color:#475569;background:#f1f5f9}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.col{min-width:0;padding:10px;background:#f1f5f9;border:1px solid var(--line);border-radius:8px}
.col-h{display:flex;align-items:center;gap:7px;margin-bottom:9px;font-size:11.5px;font-weight:700}
.dot{width:8px;height:8px;flex:0 0 auto;border-radius:50%}
.cnt{margin-left:auto;padding:1px 7px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;font-family:var(--mono);font-size:10px}
.tk{margin-bottom:8px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:7px;transition:border-color 150ms ease,transform 150ms ease}
.tk:hover{border-color:#94a3b8;transform:translateY(-1px)}
.tk:last-child{margin-bottom:0}
.tk b{display:block;overflow:hidden;font-size:11.5px;text-overflow:ellipsis;white-space:nowrap}
.tkm{display:flex;justify-content:space-between;gap:6px;margin-top:4px;color:var(--muted);font-size:9.5px}
.chart{width:100%;overflow:hidden}
.scan{
  position:relative;
  overflow:hidden;
  padding:17px;
  color:#e2e8f0;
  background:#1e293b;
  border:1px solid #334155;
  border-radius:9px;
}
.scan::before{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:3px;
  content:"";
  background:var(--color-accent);
}
.scan-h{display:flex;align-items:center;gap:8px;margin-bottom:13px;color:#fff;font-size:13px;font-weight:700}
.scan-h .ms{color:#6ee7b7}
.scan-box{
  margin-bottom:12px;
  padding:18px;
  text-align:center;
  background:#334155;
  border:1px dashed #6ee7b7;
  border-radius:7px;
}
.code{font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:.12em}
.sub{margin-top:4px;color:#cbd5e1;font-size:10.5px}
.scan-line{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:7px;
  padding:9px 10px;
  background:#334155;
  border:1px solid #475569;
  border-radius:7px;
}
.scan-line:last-child{margin-bottom:0}
.qi{display:grid;place-items:center;width:28px;height:28px;flex:0 0 auto;border-radius:6px}
.qi.ok{color:#a7f3d0;background:#065f46}
.qi.wait{color:#fde68a;background:#78350f}
.qi .ms{font-size:17px}
.qm{min-width:0;flex:1}
.qm b{display:block;overflow:hidden;color:#fff;font-size:11.5px;text-overflow:ellipsis;white-space:nowrap}
.qm span{color:#cbd5e1;font-size:9.5px}
.qq{flex:0 0 auto;color:#fff;font-family:var(--mono);font-weight:700}
.tl{position:relative;padding-left:23px}
.tl::before{position:absolute;top:4px;bottom:4px;left:6px;width:2px;content:"";background:#cbd5e1}
.tli{position:relative;padding:0 0 16px 4px}
.tli:last-child{padding-bottom:0}
.tli::before{
  position:absolute;
  top:3px;
  left:-21px;
  width:10px;
  height:10px;
  content:"";
  background:var(--color-accent);
  border:2px solid #fff;
  border-radius:50%;
  outline:2px solid var(--color-accent);
}
.tli.mut::before{background:#94a3b8;outline-color:#cbd5e1}
.tt{font-size:12px;font-weight:700}
.tm{margin-top:2px;color:var(--muted);font-family:var(--mono);font-size:10px}
.td{margin-top:3px;color:#334155;font-size:11px}
.grid-item{animation:grid-in 400ms cubic-bezier(.2,.9,.3,1.25) both}
.grid-item:nth-child(2){animation-delay:60ms}
.grid-item:nth-child(3){animation-delay:120ms}
.grid-item:nth-child(4){animation-delay:180ms}
.grid-item:nth-child(5){animation-delay:240ms}
.grid-item:nth-child(6){animation-delay:300ms}
@keyframes grid-in{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@media(max-width:1100px){
  .split{grid-template-columns:310px minmax(0,1fr)}
  .two-32{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:860px){
  .app{display:block}
  .side{position:static;width:100%;height:auto}
  .side-brand{min-height:64px}
  .side-nav{flex:none;flex-direction:row;padding:8px 12px;overflow-x:auto}
  .side-nav .grp,.side-foot,.side-nav .st{display:none}
  .side-nav button{width:auto;min-width:max-content}
  .side-nav button.on::before{display:none}
  .split{grid-template-columns:1fr}
  .list{max-height:330px}
}
@media(max-width:768px){
  .wrap{padding:18px}
  .topline{padding:10px 18px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two{grid-template-columns:1fr}
  .screen-head{display:block}
  .screen-head p{margin-top:8px;text-align:left}
  .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:520px){
  .side-nav .lbl{font-size:11px}
  .side-nav button{min-height:42px;padding:9px}
  .side-nav button .ms{font-size:19px}
  .topline .tstat{display:none}
  .wrap{padding:14px}
  .screen-head h2{font-size:19px}
  .kpis{gap:8px}
  .kpi{padding:12px}
  .kv{font-size:21px}
  .board{grid-template-columns:1fr}
  .dp-top{flex-wrap:wrap}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    animation-delay:0ms!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">

mk("c5line",Object.assign({},baseChart,{chart:Object.assign({},baseChart.chart,{type:"line",height:290}),series:[{name:"出貨準時率 %",data:[93.8,94.6,95.3,96.1,96.8,97.4,97.9,98.1]},{name:"出貨錯誤率 %",data:[2.5,2.1,1.7,1.3,1,.7,.5,.4]}],xaxis:{categories:["W1","W2","W3","W4","W5","W6","W7","W8"]},yaxis:[{min:90,max:100,title:{text:"準時率"}},{opposite:true,min:0,max:3,title:{text:"錯誤率"}}],colors:[GREEN,AMBER],stroke:{width:3,curve:"smooth"},markers:{size:4},dataLabels:{enabled:false},legend:{position:"top"},grid:{borderColor:"#e6e8ea"}}));

mk("c5bar",Object.assign({},baseChart,{chart:Object.assign({},baseChart.chart,{type:"bar",height:300}),series:[{name:"準時出貨單",data:[186,142,118,96]},{name:"延遲單",data:[4,3,2,1]}],xaxis:{categories:["北區","中區","南區","其他"]},plotOptions:{bar:{borderRadius:3,columnWidth:"48%"}},colors:[GREEN,AMBER],dataLabels:{enabled:false},legend:{position:"top"},grid:{borderColor:"#e6e8ea"},tooltip:{shared:true,intersect:false}}))
}
function headEl(ic,t,p){return '<header class="screen-head"><h2><span class="ms">'+ic+'</span>'+t+'</h2><p>'+p+'</p></header>'}
function kpiC(ic,l,v,u,cls,d){var icon=cls==="down"?"trending_down":cls==="warn"?"priority_high":cls==="flat"?"trending_flat":"trending_up";return '<article class="kpi grid-item"><div class="kl"><span class="ms">'+ic+'</span>'+l+'</div><div class="kv">'+v+(u?'<small>'+u+'</small>':'')+'</div><div class="kd '+cls+'"><span class="ms" style="font-size:14px">'+icon+'</span>'+d+'</div></article>'}
function st(l,v){return '<div class="st"><div class="l">'+l+'</div><div class="v">'+v+'</div></div>'}
function tli(t,m,d,mut){return '<div class="tli'+(mut?' mut':'')+'"><div class="tt">'+t+'</div><div class="tm">'+m+'</div><div class="td">'+d+'</div></div>'}
function bindRows(id,attr,fn){var el=document.getElementById(id);function go(e){var r=e.target.closest("["+attr+"]");if(r)fn(+r.getAttribute(attr))}el.addEventListener("click",go);el.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();go(e)}})}
var SCREENS=[screen0,screen1,screen2,screen3,screen4,screen5];
function show(i){disposeCharts();setNav(i);SCREENS[i]()}
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/),i=m?Math.min(+m[1],5):0;show(i);try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);
fromHash()
})();
</script>
