<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>研發知識管理系統</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700&family=Roboto+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#15803D;
  --color-on-primary:#FFFFFF;
  --color-secondary:#22C55E;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDF4;
  --color-foreground:#14532D;
  --color-card:#FFFFFF;
  --color-card-foreground:#14532D;
  --color-muted:#E8F0F1;
  --color-muted-foreground:#475569;
  --color-border:#BBF7D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#15803D;
  --blue:#15803D;
  --ink:#14532D;
  --muted:#475569;
  --line:#BBF7D0;
  --panel:#FFFFFF;
  --soft:#F7FCF8;
  --ok:#15803D;
  --warn:#A65405;
  --bad:#B91C1C;
  --info:#166534;
  --shadow:0 10px 28px rgba(20,83,45,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Exo",sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;font-feature-settings:"liga";vertical-align:middle}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:24px 16px 18px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 22px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.logo{display:grid;place-items:center;width:44px;height:44px;flex:0 0 44px;background:var(--color-primary);color:#fff;border-radius:4px;box-shadow:6px 6px 0 #DCFCE7}
.logo .material-symbols-outlined{font-size:25px}
.brand b{display:block;font-size:15px;letter-spacing:.02em}
.brand span:not(.material-symbols-outlined){display:block;margin-top:2px;color:var(--muted);font:10px "Roboto Mono",monospace;letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:5px}
.nav .lbl{padding:7px 12px;color:var(--muted);font:10px "Roboto Mono",monospace;letter-spacing:.12em;text-transform:uppercase}
.navbtn{position:relative;width:100%;display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid transparent;border-radius:4px;background:transparent;color:var(--ink);text-align:left;transition:background .22s ease,border-color .22s ease,color .22s ease,transform .22s ease}
.navbtn:hover{background:#F0FDF4;border-color:var(--line);transform:translateX(2px)}
.navbtn.on{background:var(--color-primary);border-color:var(--color-primary);color:#fff;box-shadow:4px 4px 0 #BBF7D0}
.navbtn .material-symbols-outlined{flex:0 0 20px;color:var(--color-primary)}
.navbtn.on .material-symbols-outlined,.navbtn.on small{color:#fff}
.navbtn .txt{min-width:0}
.navbtn b{display:block;font-size:13px;font-weight:600}
.navbtn small{display:block;margin-top:1px;color:var(--muted);font-size:10.5px}
.side .foot{margin-top:auto;padding:15px 10px 0;border-top:1px solid var(--line);color:var(--muted);font:10px/1.7 "Roboto Mono",monospace}
.main{min-width:0;padding:30px clamp(18px,3vw,44px) 52px}
.progress{position:fixed;top:0;left:264px;right:0;height:3px;background:#DCFCE7;z-index:40}
.progress span{display:block;width:16.666%;height:100%;background:var(--color-accent);transition:width .3s ease}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:22px;padding-bottom:19px;border-bottom:1px solid var(--line)}
.eyebrow{margin-bottom:7px;color:var(--color-primary);font:10px "Roboto Mono",monospace;letter-spacing:.14em;text-transform:uppercase}
.top h1{display:flex;align-items:center;gap:10px;margin:0;font-size:clamp(21px,2.4vw,30px);line-height:1.2;letter-spacing:-.025em}
.top h1 .material-symbols-outlined{font-size:28px;color:var(--color-primary)}
.top .sub{max-width:720px;margin-top:7px;color:var(--muted);font-size:12.5px}
.meta{display:flex;justify-content:flex-end;gap:7px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;background:#fff;border:1px solid var(--line);border-radius:3px;color:var(--muted);font-size:10.5px;white-space:nowrap}
.chip b{color:var(--ink)}
.chip .material-symbols-outlined{font-size:15px;color:var(--color-primary)}
.dot{display:inline-block;width:8px;height:8px;border:2px solid currentColor;border-radius:50%}
.screen{animation:reveal .35s ease both}
.grid{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(260px,1fr)}
.g32{grid-template-columns:minmax(260px,1fr) minmax(0,2fr)}
.card,.kpi{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:5px;box-shadow:var(--shadow);transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease}
.card:hover,.kpi:hover{border-color:#86EFAC;box-shadow:0 14px 34px rgba(20,83,45,.1);transform:translateY(-2px)}
.card{padding:17px}
.card h3{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:13px;letter-spacing:.01em}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--color-primary)}
.tag{margin-left:auto;padding:3px 7px;border:1px solid var(--line);border-radius:3px;background:var(--soft);color:var(--muted);font:9.5px "Roboto Mono",monospace}
.kpi{position:relative;padding:16px;border-top:3px solid var(--color-primary)}
.kpi::after{content:"";position:absolute;top:12px;right:12px;width:5px;height:5px;background:var(--color-secondary)}
.k-t{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px}
.k-t .material-symbols-outlined{font-size:17px;color:var(--color-primary)}
.k-v{margin-top:9px;font:600 26px/1.1 "Roboto Mono",monospace;letter-spacing:-.04em;color:var(--ink)}
.k-v small{margin-left:4px;color:var(--muted);font:500 11px "Exo",sans-serif;letter-spacing:0}
.k-d{display:flex;align-items:center;gap:4px;margin-top:7px;font-size:10.5px;font-weight:600}
.k-d .material-symbols-outlined{font-size:15px}
.up{color:#166534}.down{color:#B91C1C}.flat{color:#475569}
.tw{max-width:100%;overflow-x:auto;border:1px solid #DCFCE7}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:11.5px}
th{padding:10px;text-align:left;white-space:nowrap;background:#ECFDF3;border-bottom:2px solid var(--color-primary);color:#166534;font-size:10px;font-weight:700;letter-spacing:.04em}
td{padding:10px;border-bottom:1px solid #DCFCE7;vertical-align:middle}
tbody tr{transition:background .2s ease}
tbody tr:hover{background:#F7FCF8}
tbody tr:last-child td{border-bottom:0}
td:first-child,td:last-child,.mini,.tg{font-family:"Roboto Mono",monospace}
td:last-child,th:last-child{text-align:right}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border:1px solid currentColor;border-radius:3px;font-size:9.5px;font-weight:700;white-space:nowrap}
.badge::before{content:"";width:5px;height:5px;background:currentColor;border-radius:50%}
.b-ok{background:#ECFDF3;color:#166534}
.b-warn{background:#FFF7ED;color:#9A4B06}
.b-bad{background:#FEF2F2;color:#B91C1C}
.b-info{background:#F0FDF4;color:#166534}
.b-mut{background:#F1F5F9;color:#475569}
.av{display:inline-grid;place-items:center;width:27px;height:27px;flex:0 0 27px;border:1px solid #86EFAC;border-radius:3px;background:#DCFCE7;color:#14532D;font-size:10px;font-weight:700}
.chart{width:100%;min-width:0;overflow:hidden}
.divi{height:1px;margin:13px 0;background:var(--line)}
.bar-row{display:flex;flex-direction:column;gap:11px}
.br{min-width:0}
.bl{display:flex;justify-content:space-between;margin-bottom:5px;font-size:11px}
.bl b{font-family:"Roboto Mono",monospace}
.bt{height:7px;background:#E8F0F1;overflow:hidden}
.bf{height:100%;background:var(--color-primary);transition:width .35s ease}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:flex-start;gap:10px;min-width:0;padding:10px;border:1px solid var(--line);background:#FBFEFC;border-radius:4px;transition:border-color .2s ease,transform .2s ease}
.li:hover{border-color:#4ADE80;transform:translateX(2px)}
.ic{display:grid;place-items:center;width:32px;height:32px;flex:0 0 32px;background:#ECFDF3;border:1px solid var(--line);border-radius:3px}
.ic .material-symbols-outlined{font-size:18px;color:var(--color-primary)}
.lt{min-width:0}
.lt b{display:block;font-size:11.5px}
.lt span{color:var(--muted);font-size:10.5px}
.lr{margin-left:auto;text-align:right}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tg{display:inline-block;padding:3px 7px;border:1px solid var(--line);border-radius:2px;background:#F7FCF8;color:#166534;font-size:9.5px}
.tg.a{background:var(--color-primary);border-color:var(--color-primary);color:#fff}
.pill-nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:6px 11px;border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--muted);font-size:10.5px}
.tab.on{background:var(--color-primary);border-color:var(--color-primary);color:#fff}
.qcard{padding:12px;border-left:3px solid var(--color-primary);background:#FBFEFC;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:3px}
.q-t{margin-bottom:8px;font-size:12.5px;font-weight:600}
.q-m{display:flex;align-items:center;gap:7px;flex-wrap:wrap;color:var(--muted);font-size:10.5px}
.q-s{display:flex;align-items:center;gap:11px;margin-left:auto}
.st{display:flex;align-items:center;gap:3px;font-family:"Roboto Mono",monospace}
.st .material-symbols-outlined{font-size:15px;color:var(--color-primary)}
.hot{color:#9A4B06}
.rowb{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
.rowb:last-child{border-bottom:0}
.rt{min-width:0;flex:1}
.rt b{display:block;font-size:11.5px}
.rt span,.mini{color:var(--muted);font-size:9.5px}
.tl{position:relative;padding-left:21px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:1px;background:var(--color-primary)}
.ti{position:relative;padding:0 0 16px 4px}
.ti:last-child{padding-bottom:0}
.ti::before{content:"";position:absolute;left:-20px;top:3px;width:9px;height:9px;background:#fff;border:2px solid var(--color-primary)}
.th{font-size:11.5px;font-weight:600}
.tm{margin-top:3px;color:var(--muted);font:9.5px "Roboto Mono",monospace}
.board{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:10px;min-width:800px}
.col{min-width:0;padding:10px;background:#F7FCF8;border-top:3px solid var(--color-primary)}
.col-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;color:#166534;font-size:11px;font-weight:700}
.n{padding:1px 6px;background:#fff;border:1px solid var(--line);font-family:"Roboto Mono",monospace}
.tk{padding:9px;margin-bottom:7px;background:#fff;border:1px solid var(--line);border-radius:3px}
.tk:last-child{margin-bottom:0}
.brd{height:3px;margin-bottom:7px}
.t-t{font-size:11.5px;font-weight:600;line-height:1.4}
.t-m{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:6px;color:var(--muted);font-size:9.5px}
.step{display:flex;align-items:center;gap:9px;min-width:0;padding:10px;border:1px solid var(--line);border-radius:3px;background:#fff}
.sn{display:grid;place-items:center;width:25px;height:25px;flex:0 0 25px;background:#475569;color:#fff;font:700 10px "Roboto Mono",monospace}
.step.done .sn{background:var(--color-primary)}
.st-b{min-width:0}
.st-b b{display:block;font-size:11.5px}
.st-b span{color:var(--muted);font-size:9.5px}
.step>.material-symbols-outlined{margin-left:auto;color:var(--color-primary);font-size:18px}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.g32{grid-template-columns:1fr}
}
@media(max-width:860px){
  .app{display:block}
  .side{position:static;width:100%;height:auto;padding:13px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0 3px 12px;margin-bottom:10px}
  .logo{width:38px;height:38px;flex-basis:38px;box-shadow:4px 4px 0 #DCFCE7}
  .nav{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;overflow-x:auto}
  .nav .lbl,.side .foot{display:none}
  .navbtn{justify-content:center;min-width:52px;padding:9px}
  .navbtn:hover{transform:none}
  .navbtn .txt{display:none}
  .progress{left:0}
  .main{padding:20px 14px 36px}
  .top{align-items:flex-start;flex-direction:column}
  .meta{justify-content:flex-start}
}
@media(max-width:680px){
  .g4,.g3,.g2{grid-template-columns:1fr}
  .top h1{font-size:21px}
  .card,.kpi{padding:14px}
  .meta .chip:nth-child(2){display:none}
}
@media(max-width:400px){
  .main{padding-left:10px;padding-right:10px}
  .navbtn{min-width:46px}
  .top .sub{font-size:11.5px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .screen,.card,.kpi,.li,.navbtn{transform:none!important}
}
</style>
</head>
<body>
<div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
<div class="app">
<aside class="side">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">science</span></div>
    <div><b>研發知識管理</b><span>Knowledge Mgmt</span></div>
  </div>
  <nav class="nav" id="nav" aria-label="功能模組">
    <div class="lbl">功能模組</div>
    <button class="navbtn" data-i="0"><span class="material-symbols-outlined">history</span><span class="txt"><b>經驗與失敗案例</b><small>Lessons Learned 建檔</small></span></button>
    <button class="navbtn" data-i="1"><span class="material-symbols-outlined">account_tree</span><span class="txt"><b>知識分類標籤</b><small>知識樹與標籤搜尋</small></span></button>
    <button class="navbtn" data-i="2"><span class="material-symbols-outlined">groups</span><span class="txt"><b>專家社群問答</b><small>社群與問答討論</small></span></button>
    <button class="navbtn" data-i="3"><span class="material-symbols-outlined">science</span><span class="txt"><b>研發知識庫</b><small>技術文件沉澱</small></span></button>
    <button class="navbtn" data-i="4"><span class="material-symbols-outlined">insights</span><span class="txt"><b>知識運用分析</b><small>傳承成效分析</small></span></button>
    <button class="navbtn" data-i="5"><span class="material-symbols-outlined">verified</span><span class="txt"><b>知識審核治理</b><small>審核發布與版本</small></span></button>
  </nav>
  <div class="foot">純 UI 展示 · 擬真資料<br>研發管理 · 協作平台</div>
</aside>
<main class="main">
  <header class="top">
    <div>
      <div class="eyebrow">Research intelligence / 研發知識鏈</div>
      <h1><span class="material-symbols-outlined" id="tIco">history</span><span id="tTitle">經驗與失敗案例</span></h1>
      <div class="sub" id="tSub"></div>
    </div>
    <div class="meta">
      <span class="chip"><span class="material-symbols-outlined">groups</span>研發團隊 <b>48 人</b></span>
      <span class="chip"><span class="material-symbols-outlined">inventory_2</span>知識條目 <b>1,284</b></span>
      <span class="chip"><span class="dot" style="color:var(--ok)"></span>資料同步中</span>
    </div>
  </header>
  <div id="screen" class="screen"></div>
</main>
</div>
<script>
(function(){
"use strict";
var charts=[];
var ACC="#15803D",AC2="#22C55E",A3="#65A30D",A4="#BBF7D0";
var META=[
["history","經驗與失敗案例","技術經驗與 Lessons Learned 建檔 · 記錄背景、根因與對策"],
["account_tree","知識分類標籤","依知識樹分類並掛上技術標籤 · 讓知識可被精準搜尋與關聯"],
["groups","專家社群問答","專家社群與問答討論區 · 讓經驗在專案間被重複運用"],
["science","研發知識庫","技術文件與研發知識沉澱 · 版本化的知識資產"],
["insights","知識運用分析","知識查閱、貢獻與傳承成效 · 掌握關鍵人員知識風險"],
["verified","知識審核治理","知識審核發布與版本治理 · 確保正確性與敏感度控管"]
];
function el(id){return document.getElementById(id)}
function destroyCharts(){charts.forEach(function(c){try{c.destroy()}catch(e){}});charts=[]}
function mk(id,opt){
 var node=el(id);if(!node)return;
 var chart={redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:"Exo, sans-serif"};
 Object.keys(opt.chart||{}).forEach(function(k){chart[k]=opt.chart[k]});opt.chart=chart;
 try{var c=new ApexCharts(node,opt);c.render();charts.push(c)}catch(e){}
}
function ico(n){return'<span class="material-symbols-outlined">'+n+"</span>"}
function badge(t,c){return'<span class="badge '+c+'">'+t+"</span>"}
function av(n){return'<span class="av">'+n+"</span>"}
function kpi(t,i,v,u,d,c,di){return'<div class="kpi"><div class="k-t">'+ico(i)+t+'</div><div class="k-v">'+v+(u?'<small>'+u+"</small>":"")+'</div><div class="k-d '+c+'">'+ico(di)+d+"</div></div>"}
function bar(l,v,c,max){var w=Math.min(v/(max||100)*100,100);return'<div class="br"><div class="bl"><span>'+l+"</span><b>"+v+'</b></div><div class="bt"><div class="bf" style="width:'+w+"%;background:"+c+'"></div></div></div>'}
function stat(l,v,c){return'<div style="text-align:center;padding:8px"><div style="font:600 21px Roboto Mono,monospace;color:'+c+'">'+v+'</div><div class="mini">'+l+"</div></div>"}
function head(icon,title,tag){return"<h3>"+ico(icon)+title+(tag?'<span class="tag">'+tag+"</span>":"")+"</h3>"}
function s0(){
 var rows=[
 ["LL-2038","注塑模具冷卻不均致縮水","模具設計","failure","王志明","高","2026-07-28"],
 ["LL-2037","高頻PCB阻抗匹配優化經驗","電路設計","exp","陳怡君","中","2026-07-25"],
 ["LL-2035","鋰電池熱失控測試失敗案例","電池安全","failure","林建宏","高","2026-07-21"],
 ["LL-2031","伺服馬達扭矩補償演算法","控制韌體","exp","黃美玲","中","2026-07-18"],
 ["LL-2028","雷射焊接氣孔缺陷根因分析","製程工藝","failure","張家豪","高","2026-07-14"],
