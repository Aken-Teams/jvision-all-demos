<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>研發知識管理系統</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#334155;--accent2:#64748b;--bg:#f1f5f9;--panel:#ffffff;
  --line:#e2e8f0;--ink:#1e293b;--muted:#64748b;--soft:#f8fafc;
  --ok:#0f766e;--warn:#b45309;--bad:#b91c1c;--info:#3b5b8c;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;vertical-align:middle}
.app{display:flex;min-height:100vh;max-width:100%}
.side{width:248px;flex:0 0 248px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh;min-width:0}
.brand{display:flex;gap:11px;align-items:center;padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 40px}
.brand .logo .material-symbols-outlined{font-size:24px;color:#fff}
.brand b{font-size:15px;font-weight:700;display:block;line-height:1.3}
.brand span{font-size:11.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:4px;min-width:0}
.nav .lbl{font-size:11px;color:var(--muted);letter-spacing:.06em;padding:8px 10px 4px;font-weight:600}
.navbtn{display:flex;gap:11px;align-items:center;padding:10px 11px;border-radius:9px;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:13.5px;color:var(--ink);text-align:left;width:100%;min-width:0;transition:background .12s}
.navbtn .material-symbols-outlined{font-size:20px;color:var(--accent2);flex:0 0 20px}
.navbtn small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.navbtn .txt{min-width:0;overflow:hidden}
.navbtn .txt b{font-weight:600;font-size:13.5px}
.navbtn:hover{background:var(--soft)}
.navbtn.on{background:var(--accent);color:#fff}
.navbtn.on .material-symbols-outlined{color:#fff}
.navbtn.on small,.navbtn.on .txt b{color:#fff}
.side .foot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.main{flex:1;min-width:0;padding:22px 26px 40px;max-width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:20px;font-weight:700;display:flex;align-items:center;gap:9px}
.top h1 .material-symbols-outlined{font-size:24px;color:var(--accent)}
.top .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.top .meta{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:11.5px;padding:5px 11px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--muted);display:flex;gap:5px;align-items:center;white-space:nowrap}
.chip b{color:var(--accent);font-weight:600}
.grid{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1fr 2fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h3{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px;margin-bottom:12px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent2)}
.card h3 .tag{margin-left:auto;font-size:11px;font-weight:500;color:var(--muted);padding:3px 9px;background:var(--soft);border-radius:99px;border:1px solid var(--line)}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px;min-width:0}
.kpi .k-t{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .k-t .material-symbols-outlined{font-size:17px;color:var(--accent2)}
.kpi .k-v{font-size:26px;font-weight:700;margin-top:7px;letter-spacing:-.01em}
.kpi .k-v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:3px}
.kpi .k-d{font-size:11.5px;margin-top:4px;display:flex;align-items:center;gap:4px}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
.kpi .k-d .material-symbols-outlined{font-size:15px}
.tw{overflow-x:auto;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
th{text-align:left;font-weight:600;color:var(--muted);padding:9px 11px;border-bottom:2px solid var(--line);white-space:nowrap;background:var(--soft)}
td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
.badge{font-size:11px;padding:3px 9px;border-radius:99px;font-weight:500;white-space:nowrap;display:inline-block}
.b-ok{background:#ccfbf1;color:#0f766e}
.b-warn{background:#fef3c7;color:#b45309}
.b-bad{background:#fee2e2;color:#b91c1c}
.b-info{background:#e0e7ff;color:#3b5b8c}
.b-mut{background:#e2e8f0;color:#475569}
.av{width:28px;height:28px;border-radius:50%;background:var(--accent2);color:#fff;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex:0 0 28px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0}
.col{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:11px;min-width:0}
.col .col-h{font-size:12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;color:var(--muted)}
.col .col-h .n{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:11px}
.tk{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:8px}
.tk:last-child{margin-bottom:0}
.tk .t-t{font-size:12.5px;font-weight:600;margin-bottom:5px;line-height:1.35}
.tk .t-m{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tk .brd{height:3px;border-radius:99px;margin-bottom:8px}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .ti{position:relative;padding:0 0 16px 4px}
.tl .ti:last-child{padding-bottom:0}
.tl .ti::before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.tl .ti .th{font-size:12.5px;font-weight:600}
.tl .ti .tm{font-size:11px;color:var(--muted);margin-top:2px}
.chart{width:100%;overflow:hidden;min-width:0}
.list{display:flex;flex-direction:column;gap:9px}
.li{display:flex;gap:11px;align-items:flex-start;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--soft);min-width:0}
.li .ic{width:32px;height:32px;border-radius:9px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 32px}
.li .ic .material-symbols-outlined{font-size:18px;color:var(--accent)}
.li .lt{min-width:0}
.li .lt b{font-size:12.5px;font-weight:600;display:block}
.li .lt span{font-size:11.5px;color:var(--muted)}
.li .lr{margin-left:auto;text-align:right;flex:0 0 auto}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tg{font-size:11px;padding:3px 9px;border-radius:7px;background:var(--soft);border:1px solid var(--line);color:var(--accent);font-weight:500}
.tg.a{background:var(--accent);color:#fff;border-color:var(--accent)}
.bar-row{display:flex;flex-direction:column;gap:11px}
.bar-row .br{min-width:0}
.bar-row .br .bl{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.bar-row .br .bl b{font-weight:600}
.bar-row .br .bt{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar-row .br .bf{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.pill-nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.tab{font-size:12px;padding:6px 13px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:default}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.qcard{border:1px solid var(--line);border-radius:11px;padding:13px 14px;background:var(--panel)}
.qcard .q-t{font-size:13.5px;font-weight:600;line-height:1.4;margin-bottom:7px}
.qcard .q-m{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.qcard .q-s{margin-left:auto;display:flex;gap:12px;align-items:center}
.qcard .q-s .st{display:flex;gap:4px;align-items:center;font-size:11.5px}
.qcard .q-s .st .material-symbols-outlined{font-size:16px;color:var(--accent2)}
.qcard .q-s .st.hot{color:var(--warn)}.qcard .q-s .st.hot .material-symbols-outlined{color:var(--warn)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 8px}
.mini{font-size:11px;color:var(--muted)}
.divi{height:1px;background:var(--line);margin:12px 0}
.rowb{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
.rowb:last-child{border-bottom:none}
.rowb .rt{min-width:0;flex:1}
.rowb .rt b{font-size:12.5px;font-weight:600;display:block}
.rowb .rt span{font-size:11px;color:var(--muted)}
.step{display:flex;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--panel);min-width:0}
.step .sn{width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 26px}
.step.done .sn{background:var(--ok)}
.step .st-b{min-width:0}
.step .st-b b{font-size:12.5px;display:block;font-weight:600}
.step .st-b span{font-size:11px;color:var(--muted)}
.step .material-symbols-outlined{margin-left:auto;font-size:19px;color:var(--accent2)}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{position:static;width:100%;height:auto;flex:none;flex-direction:column;border-right:none;border-bottom:1px solid var(--line);padding:12px}
  .side .foot{display:none}
  .nav{flex-direction:row;flex-wrap:wrap;gap:6px}
  .nav .lbl{display:none}
  .navbtn{width:auto;flex:0 0 auto;padding:8px 12px}
  .navbtn small{display:none}
  .main{padding:16px 14px 32px}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .board{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){
  .navbtn .txt{display:none}
  .navbtn{padding:9px 11px}
  .board{grid-template-columns:1fr}
  .top h1{font-size:17px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">science</span></div>
      <div><b>研發知識管理</b><span>Knowledge Mgmt</span></div>
    </div>
    <nav class="nav" id="nav">
      <div class="lbl">功能模組</div>
      <button class="navbtn" data-i="0"><span class="material-symbols-outlined">history</span><span class="txt"><b>經驗與失敗案例</b><small>Lessons Learned 建檔</small></span></button>
      <button class="navbtn" data-i="1"><span class="material-symbols-outlined">account_tree</span><span class="txt"><b>知識分類標籤</b><small>知識樹與標籤搜尋</small></span></button>
      <button class="navbtn" data-i="2"><span class="material-symbols-outlined">groups</span><span class="txt"><b>專家社群問答</b><small>社群與問答討論</small></span></button>
      <button class="navbtn" data-i="3"><span class="material-symbols-outlined">science</span><span class="txt"><b>研發知識庫</b><small>技術文件沉澱</small></span></button>
      <button class="navbtn" data-i="4"><span class="material-symbols-outlined">insights</span><span class="txt"><b>知識運用分析</b><small>傳承成效分析</small></span></button>
      <button class="navbtn" data-i="5"><span class="material-symbols-outlined">verified</span><span class="txt"><b>知識審核治理</b><small>審核發布與版本</small></span></button>
    </nav>
    <div class="foot">純 UI 展示 · 擬真資料<br/>研發管理 · 協作平台</div>
  </aside>
  <main class="main">
    <div class="top">
      <div>
        <h1><span class="material-symbols-outlined" id="tIco">history</span><span id="tTitle">經驗與失敗案例</span></h1>
        <div class="sub" id="tSub"></div>
      </div>
      <div class="meta">
        <span class="chip"><span class="material-symbols-outlined" style="font-size:15px;color:var(--accent2)">groups</span>研發團隊 <b>48 人</b></span>
        <span class="chip"><span class="material-symbols-outlined" style="font-size:15px;color:var(--accent2)">inventory_2</span>知識條目 <b>1,284</b></span>
        <span class="chip"><span class="dot" style="background:var(--ok)"></span>資料同步中</span>
      </div>
    </div>
    <div id="screen"></div>
  </main>
</div>
<script>
(function(){
"use strict";
var charts=[];
function destroyCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function el(id){return document.getElementById(id);}
function mk(id,opt){var node=document.getElementById(id);if(!node)return;var base={redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:'inherit'};var cc=opt.chart||{};for(var k in cc){base[k]=cc[k];}opt.chart=base;try{var c=new ApexCharts(node,opt);c.render();charts.push(c);}catch(e){}}
var ACC="#334155",AC2="#64748b",A3="#94a3b8",A4="#cbd5e1";

var META=[
 {ico:"history",title:"經驗與失敗案例",sub:"技術經驗與 Lessons Learned 建檔 · 記錄背景、根因與對策"},
 {ico:"account_tree",title:"知識分類標籤",sub:"依知識樹分類並掛上技術標籤 · 讓知識可被精準搜尋與關聯"},
 {ico:"groups",title:"專家社群問答",sub:"專家社群與問答討論區 · 讓經驗在專案間被重複運用"},
 {ico:"science",title:"研發知識庫",sub:"技術文件與研發知識沉澱 · 版本化的知識資產"},
 {ico:"insights",title:"知識運用分析",sub:"知識查閱、貢獻與傳承成效 · 掌握關鍵人員知識風險"},
 {ico:"verified",title:"知識審核治理",sub:"知識審核發布與版本治理 · 確保正確性與敏感度控管"}
];

function kpi(t,ic,v,u,d,cls,di){
 return '<div class="kpi"><div class="k-t"><span class="material-symbols-outlined">'+ic+'</span>'+t+'</div><div class="k-v">'+v+(u?'<small>'+u+'</small>':'')+'</div><div class="k-d '+cls+'"><span class="material-symbols-outlined">'+di+'</span>'+d+'</div></div>';
}
function badge(txt,cls){return '<span class="badge '+cls+'">'+txt+'</span>';}
function av(n){return '<span class="av">'+n+'</span>';}
function barRow(l,v,c){return '<div class="br"><div class="bl"><span>'+l+'</span><b>'+v+'</b></div><div class="bt"><div class="bf" style="width:'+Math.min(v,100)+'%;background:'+c+'"></div></div></div>';}
function miniStat(l,v,c){return '<div style="text-align:center;padding:6px"><div style="font-size:22px;font-weight:700;color:'+c+'">'+v+'</div><div class="mini">'+l+'</div></div>';}

/* SCREEN 0 : 經驗與失敗案例 */
function s0(){
 var rows=[
  ["LL-2038","注塑模具冷卻不均致縮水","模具設計","failure","王志明","高","2026-07-28"],
  ["LL-2037","高頻PCB阻抗匹配優化經驗","電路設計","exp","陳怡君","中","2026-07-25"],
  ["LL-2035","鋰電池熱失控測試失敗案例","電池安全","failure","林建宏","高","2026-07-21"],
  ["LL-2031","伺服馬達扭矩補償演算法","控制韌體","exp","黃美玲","中","2026-07-18"],
  ["LL-2028","雷射焊接氣孔缺陷根因分析","製程工藝","failure","張家豪","高","2026-07-14"],
  ["LL-2024","射出成型翹曲改善對策","模具設計","exp","王志明","低","2026-07-09"]
 ];
 var tbody="";
 for(var i=0;i<rows.length;i++){var r=rows[i];
  var tp=r[3]==="failure"?badge("失敗案例","b-bad"):badge("技術經驗","b-info");
  var pr=r[5]==="高"?badge("高","b-bad"):(r[5]==="中"?badge("中","b-warn"):badge("低","b-mut"));
  tbody+='<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+tp+'</td><td>'+r[2]+'</td><td>'+av(r[4].charAt(0))+' '+r[4]+'</td><td>'+pr+'</td><td class="mini">'+r[6]+'</td></tr>';
 }
 var h='';
 h+='<div class="grid g4" style="margin-bottom:14px">';
 h+=kpi("累計建檔","inventory_2","1,284","篇","本月 +36","up","trending_up");
 h+=kpi("失敗案例","warning","318","篇","占 24.8%","flat","remove");
 h+=kpi("避免重工工時","engineering","2,410","hrs","估算節省","up","trending_up");
 h+=kpi("待補根因","fact_check","12","篇","需補完","down","priority_high");
 h+='</div>';
 h+='<div class="grid g23">';
 h+='<div class="card"><h3><span class="material-symbols-outlined">history</span>最新建檔案例<span class="tag">依日期</span></h3><div class="tw"><table><thead><tr><th>編號</th><th>案例主題</th><th>類型</th><th>領域</th><th>建檔人</th><th>影響</th><th>日期</th></tr></thead><tbody>'+tbody+'</tbody></table></div></div>';
 h+='<div class="card"><h3><span class="material-symbols-outlined">insights</span>建檔類型分布</h3><div id="c0a" class="chart"></div><div class="divi"></div><div class="bar-row">'+
   barRow("模具設計 84 篇",84,ACC)+barRow("電路設計 67 篇",67,AC2)+barRow("製程工藝 58 篇",58,A3)+'</div></div>';
 h+='</div>';
 h+='<div class="card" style="margin-top:14px"><h3><span class="material-symbols-outlined">rule</span>建檔品質檢核（自動）</h3><div class="grid g4">'+
   miniStat("含根因分析","89%",ACC)+miniStat("含對策措施","82%",AC2)+miniStat("已關聯標籤","94%",A3)+miniStat("附驗證數據","71%","#3b5b8c")+'</div></div>';
 return h;
}
function s0charts(){
 mk("c0a",{chart:{type:"donut",height:220},series:[318,466,312,188],labels:["失敗案例","製程經驗","設計經驗","測試經驗"],colors:[ACC,AC2,A3,A4],legend:{position:"bottom",fontSize:"12px"},dataLabels:{enabled:false},plotOptions:{pie:{donut:{size:"64%",labels:{show:true,total:{show:true,label:"總篇數",fontSize:"12px",formatter:function(){return "1,284";}}}}}}});
}

/* SCREEN 1 : 知識分類標籤 */
