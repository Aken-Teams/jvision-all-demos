<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ESG 報告彙整室</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#b45309; --accent2:#f59e0b; --accent-soft:#fef3c7;
  --bg:#f6f5f2; --panel:#ffffff; --ink:#1f2430; --muted:#6b7280;
  --line:#e7e4de; --side:#1c2530; --side2:#141b24; --sideink:#c7cdd6;
  --good:#16a34a; --warn:#d97706; --bad:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:236px;flex:none;background:linear-gradient(180deg,var(--side),var(--side2));color:var(--sideink);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;min-width:0}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px}
.brand .logo{width:40px;height:40px;flex:none;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px rgba(180,83,9,.4)}
.brand .logo .material-symbols-outlined{font-size:24px}
.brand b{display:block;font-size:15px;color:#fff;font-weight:800;letter-spacing:.3px}
.brand span{font-size:11px;color:#8b95a3}
.nav{display:flex;flex-direction:column;gap:5px;min-width:0}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 13px;border:0;background:transparent;color:var(--sideink);border-radius:11px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;text-align:left;width:100%;transition:.15s;min-width:0}
.nav button .material-symbols-outlined{font-size:21px;flex:none;opacity:.85}
.nav button .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(180,83,9,.35)}
.nav button.on .material-symbols-outlined{opacity:1}
.side .foot{margin-top:auto;padding:12px 10px 4px;font-size:11px;color:#7c8695;border-top:1px solid rgba(255,255,255,.07)}
.side .foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px;box-shadow:0 0 0 3px rgba(22,163,74,.18);animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(22,163,74,.18)}50%{box-shadow:0 0 0 6px rgba(22,163,74,.05)}}
/* main */
.main{flex:1;min-width:0;padding:26px 30px 60px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:23px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:11px}
.top h1 .material-symbols-outlined{font-size:26px;color:var(--accent)}
.top .sub{font-size:13px;color:var(--muted);margin-top:4px}
.chiprow{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);display:flex;align-items:center;gap:6px}
.chip .material-symbols-outlined{font-size:15px;color:var(--accent)}
.chip b{color:var(--ink)}
/* generic */
.grid{display:grid;gap:16px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1fr 1.6fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.card h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.card h3 .tag{margin-left:auto;font-size:11px;font-weight:600;color:var(--muted);background:var(--bg);padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
/* kpi */
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--accent),var(--accent2))}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--accent)}
.kpi .val{font-size:27px;font-weight:800;margin-top:8px;letter-spacing:.5px}
.kpi .val small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px}
.kpi .dlt{font-size:12px;font-weight:700;margin-top:5px;display:flex;align-items:center;gap:3px}
.kpi .dlt .material-symbols-outlined{font-size:15px}
.up{color:var(--good)} .down{color:var(--bad)} .neu{color:var(--muted)}
/* table */
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th{text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:9px 12px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#faf8f4}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px}
.pill .material-symbols-outlined{font-size:14px}
.p-good{background:#dcfce7;color:#15803d} .p-warn{background:#fef3c7;color:#b45309} .p-bad{background:#fee2e2;color:#b91c1c} .p-info{background:#e0f2fe;color:#0369a1} .p-mut{background:#eef0f2;color:#4b5563}
.bar{height:7px;border-radius:5px;background:var(--line);overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.mono{font-variant-numeric:tabular-nums;font-weight:700}
/* chart */
.chartbox{position:relative;width:100%;height:250px;min-width:0}
.chartbox.sm{height:200px}
/* scope cards (screen1) */
.scope{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:14px;padding:15px;background:linear-gradient(180deg,#fff,#fbfaf7);min-width:0}
.scope .sh{display:flex;align-items:center;gap:9px}
.scope .sh .ic{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;color:#fff}
.scope .sh b{font-size:13px}
.scope .sh span{font-size:11px;color:var(--muted);display:block}
.scope .big{font-size:24px;font-weight:800}
.scope .big small{font-size:12px;color:var(--muted);font-weight:600}
.scope .rows{display:flex;flex-direction:column;gap:7px;font-size:12px;color:var(--muted)}
.scope .rows div{display:flex;justify-content:space-between}
.scope .rows b{color:var(--ink)}
/* energy meter (screen2) */
.mt{display:flex;flex-direction:column;gap:9px;border:1px solid var(--line);border-radius:13px;padding:14px;min-width:0}
.mt .r1{display:flex;align-items:center;justify-content:space-between}
.mt .r1 b{font-size:13px}
.mt .r1 .st{font-size:11px;font-weight:700}
.mt .load{font-size:22px;font-weight:800}
.mt .load small{font-size:12px;color:var(--muted);font-weight:600}
.gauge{height:9px;border-radius:6px;background:var(--line);overflow:hidden}
.gauge>i{display:block;height:100%;border-radius:6px}
.mt .sub{font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
/* target roadmap (screen3) */
.road{position:relative;padding-left:26px;min-width:0}
.road::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line)}
.mile{position:relative;padding:0 0 20px 0;min-width:0}
.mile:last-child{padding-bottom:0}
.mile::before{content:"";position:absolute;left:-21px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.mile.done::before{background:var(--accent);border-color:var(--accent)}
.mile.now::before{border-color:var(--accent2);box-shadow:0 0 0 4px rgba(245,158,11,.18)}
.mile .yr{font-size:12px;font-weight:800;color:var(--accent)}
.mile .ti{font-size:14px;font-weight:700;margin:2px 0}
.mile .de{font-size:12px;color:var(--muted)}
.proj{display:flex;flex-direction:column;gap:10px;min-width:0}
.projrow{display:flex;align-items:center;gap:12px;padding:11px;border:1px solid var(--line);border-radius:12px;min-width:0}
.projrow .ic{width:36px;height:36px;flex:none;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.projrow .in{flex:1;min-width:0}
.projrow .in b{font-size:13px;display:block}
.projrow .in span{font-size:11px;color:var(--muted)}
.projrow .pc{font-size:16px;font-weight:800;flex:none}
/* audit board (screen4) */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;min-width:0}
.col{background:#faf8f4;border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0;display:flex;flex-direction:column;gap:10px}
.col .ch{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800}
.col .ch .cnt{margin-left:auto;font-size:11px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-weight:700;color:var(--muted)}
.col .ch .d{width:9px;height:9px;border-radius:3px;flex:none}
.tk{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;display:flex;flex-direction:column;gap:7px;min-width:0;transition:.15s;border-left:3px solid var(--line)}
.tk:hover{box-shadow:0 5px 14px rgba(0,0,0,.06);transform:translateY(-1px)}
.tk.pri{border-left-color:var(--bad)} .tk.mid{border-left-color:var(--accent2)}
.tk .tt{font-size:12.5px;font-weight:700;line-height:1.4}
.tk .mm{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.tk .av{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;flex:none}
/* report chapters (screen5) */
.chapters{display:flex;flex-direction:column;gap:9px;min-width:0}
.chp{display:flex;align-items:center;gap:13px;padding:13px 15px;border:1px solid var(--line);border-radius:13px;min-width:0}
.chp .no{width:30px;height:30px;flex:none;border-radius:9px;background:var(--side);color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center}
.chp .cin{flex:1;min-width:0}
.chp .cin b{font-size:13.5px;display:block}
.chp .cin span{font-size:11.5px;color:var(--muted)}
.chp .prog{width:120px;flex:none}
.chp .prog .pt{font-size:11px;color:var(--muted);text-align:right;margin-bottom:4px;font-weight:600}
/* lists */
.alist{display:flex;flex-direction:column;gap:11px;min-width:0}
.arow{display:flex;gap:12px;align-items:flex-start;padding-bottom:11px;border-bottom:1px solid var(--line);min-width:0}
.arow:last-child{border-bottom:0;padding-bottom:0}
.arow .ai{width:32px;height:32px;flex:none;border-radius:9px;display:grid;place-items:center}
.arow .at{flex:1;min-width:0}
.arow .at b{font-size:13px;display:block}
.arow .at span{font-size:11.5px;color:var(--muted)}
.arow .aw{font-size:11px;color:var(--muted);white-space:nowrap;flex:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.hint{font-size:11.5px;color:var(--muted);margin-top:10px;display:flex;align-items:flex-start;gap:6px}
.hint .material-symbols-outlined{font-size:15px;color:var(--accent);flex:none}
/* responsive */
@media(max-width:860px){
  .app{flex-direction:column}
  .side{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 16px;gap:8px}
  .brand{border-bottom:0;margin-bottom:0;padding:0;flex:none}
  .nav{flex-direction:row;flex-wrap:wrap;flex:1;justify-content:flex-end}
  .nav button{width:auto;flex:none;white-space:nowrap;padding:9px 13px}
  .side .foot{display:none}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .board{grid-template-columns:1fr 1fr}
  .main{padding:20px 16px 50px}
}
@media(max-width:560px){
  .nav button .lbl{display:none}
  .nav button{padding:9px 11px}
  .board{grid-template-columns:1fr}
  .top h1{font-size:20px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">eco</span></div>
      <div><b>ESG 報告彙整室</b><span>Sustainability Report Hub</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot"><span class="dot"></span>資料同步正常 · 更新於 08:42</div>
  </aside>
  <main class="main">
    <div id="screen"></div>
  </main>
</div>

<script>
"use strict";
var C={accent:"#b45309",accent2:"#f59e0b",good:"#16a34a",warn:"#d97706",bad:"#dc2626",ink:"#1f2430",muted:"#6b7280",line:"#e7e4de"};
var MODS=[
  {icon:"dashboard",name:"永續總覽",sub:"碳排、能耗與目標達成一頁掌握"},
  {icon:"co2",name:"碳盤查",sub:"範疇一、二、三活動數據與排放係數"},
  {icon:"bolt",name:"能源監控",sub:"各廠用電/用能負載即時趨勢"},
  {icon:"flag",name:"減碳目標",sub:"SBTi 減碳路徑與專案進度追蹤"},
  {icon:"fact_check",name:"佐證審核",sub:"活動數據佐證蒐集與查證流程"},
  {icon:"description",name:"報告產出",sub:"GRI/ISO 永續報告章節彙整揭露"}
];
var chart=null;
function destroyChart(){ if(chart){ try{chart.destroy();}catch(e){} chart=null; } }
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

/* ---------- nav ---------- */
var nav=document.getElementById("nav");
nav.innerHTML=MODS.map(function(m,i){
  return '<button data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="lbl">'+esc(m.name)+'</span></button>';
}).join("");
nav.addEventListener("click",function(e){
  var b=e.target.closest("button[data-i]"); if(!b)return;
  show(+b.getAttribute("data-i"));
  try{window.scrollTo(0,0);}catch(_){}
});

/* ---------- header helper ---------- */
function head(i,chips){
  var m=MODS[i];
  return '<div class="top"><div><h1><span class="material-symbols-outlined">'+m.icon+'</span>'+esc(m.name)+'</h1>'+
    '<div class="sub">'+esc(m.sub)+'</div></div><div class="chiprow">'+chips+'</div></div>';
}
function chip(ic,lab,val){return '<span class="chip"><span class="material-symbols-outlined">'+ic+'</span>'+lab+' <b>'+val+'</b></span>';}

/* ================= SCREEN 0 : 永續總覽 ================= */
function s0(){
  var kpis=[
    {lab:"本年碳排放量",ic:"co2",val:"18,420",u:"tCO₂e",dlt:"-11.3%",dir:"up"},
    {lab:"數據完整率",ic:"verified",val:"89",u:"%",dlt:"+6.4%",dir:"up"},
    {lab:"減碳目標達成",ic:"flag",val:"83",u:"%",dlt:"+8.0%",dir:"up"},
    {lab:"用能異常反應",ic:"bolt",val:"1.9",u:"小時",dlt:"-21.1h",dir:"up"}
  ];
  var k=kpis.map(function(x){
    var cls=x.dir==="up"?"up":x.dir==="down"?"down":"neu";
    var ar=x.dir==="up"?"trending_up":x.dir==="down"?"trending_down":"trending_flat";
    return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+x.ic+'</span>'+x.lab+'</div>'+
      '<div class="val">'+x.val+'<small>'+x.u+'</small></div>'+
      '<div class="dlt '+cls+'"><span class="material-symbols-outlined">'+ar+'</span>'+x.dlt+' vs 去年</div></div>';
  }).join("");
  var alerts=[
    {ic:"warning",bg:"#fee2e2",cl:"#b91c1c",t:"三廠 6 月用電量較前月 +24%",s:"超過 20% 複核門檻 · RULE-02",w:"12 分鐘前"},
    {ic:"inventory_2",bg:"#fef3c7",cl:"#b45309",t:"物流碳排缺原始運費單佐證",s:"範疇三 · 待供應商回覆",w:"1 小時前"},
    {ic:"schedule",bg:"#e0f2fe",cl:"#0369a1",t:"永續報告揭露倒數 18 天",s:"GRI 305 章節尚未完稿",w:"今日 08:10"},
    {ic:"check_circle",bg:"#dcfce7",cl:"#15803d",t:"一廠太陽能自發自用數據已查證",s:"範疇二減量 320 tCO₂e",w:"昨日 17:22"}
  ].map(function(a){
    return '<div class="arow"><div class="ai" style="background:'+a.bg+';color:'+a.cl+'"><span class="material-symbols-outlined">'+a.ic+'</span></div>'+
      '<div class="at"><b>'+a.t+'</b><span>'+a.s+'</span></div><div class="aw">'+a.w+'</div></div>';
  }).join("");
  var html=head(0,chip("calendar_today","報告年度","2025")+chip("factory","盤查廠區","4 廠")+chip("groups","權責單位","6 單位"))+
    '<div class="grid g4">'+k+'</div>'+
    '<div class="grid g23" style="margin-top:16px">'+
      '<div class="card"><h3><span class="material-symbols-outlined">insights</span>月碳排放趨勢與目標線<span class="tag">tCO₂e</span></h3><div class="chartbox"><canvas id="c0a"></canvas></div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>排放範疇占比</h3><div class="chartbox sm"><canvas id="c0b"></canvas></div>'+
        '<div class="legend"><span><i style="background:'+C.accent+'"></i>範疇一 直接</span><span><i style="background:'+C.accent2+'"></i>範疇二 外購能源</span><span><i style="background:#fcd34d"></i>範疇三 其他間接</span></div></div>'+
    '</div>'+
    '<div class="card" style="margin-top:16px"><h3><span class="material-symbols-outlined">notifications_active</span>永續待辦與異常提醒<span class="tag">4 則</span></h3><div class="alist">'+alerts+'</div></div>';
  return {html:html,init:function(){
    chart=new Chart(document.getElementById("c0a"),{type:"line",
      data:{labels:["1月","2月","3月","4月","5月","6月","7月","8月"],
        datasets:[
          {label:"實際排放",data:[2480,2360,2410,2290,2210,2340,2160,2090],borderColor:C.accent,backgroundColor:"rgba(180,83,9,.10)",fill:true,tension:.35,borderWidth:2.5,pointRadius:3},
          {label:"目標上限",data:[2500,2450,2400,2350,2300,2250,2200,2150],borderColor:C.accent2,borderDash:[6,5],fill:false,tension:0,borderWidth:2,pointRadius:0}
        ]},
      options:baseOpts({legend:true})});
    window._c0b=new Chart(document.getElementById("c0b"),{type:"doughnut",
      data:{labels:["範疇一","範疇二","範疇三"],datasets:[{data:[4820,9760,3840],backgroundColor:[C.accent,C.accent2,"#fcd34d"],borderWidth:2,borderColor:"#fff"}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:"62%",plugins:{legend:{display:false}}}});
  },cleanup:function(){ if(window._c0b){try{window._c0b.destroy();}catch(e){} window._c0b=null;} }};
}

/* ================= SCREEN 1 : 碳盤查 ================= */
function s1(){
  var scopes=[

/* ---------- chart base options ---------- */
function baseOpts(o){
  return {responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:o.legend,position:"bottom",labels:{font:{family:"Inter",size:11},boxWidth:12,padding:14}},
      tooltip:{backgroundColor:"#1f2430",padding:10,cornerRadius:8,titleFont:{family:"'Noto Sans TC'"},bodyFont:{family:"Inter"}}},
    scales:{
      x:{grid:{display:false},ticks:{font:{family:"Inter",size:10},color:C.muted,maxRotation:0,autoSkip:true,maxTicksLimit:12}},
      y:{grid:{color:"#f0eee9"},border:{display:false},ticks:{font:{family:"Inter",size:10},color:C.muted}}
    }};
}

/* ---------- controller ---------- */
var SCREENS=[s0,s1,s2,s3,s4,s5];
var container=document.getElementById("screen");
var current=null;
function show(i){
  if(current&&current.cleanup){try{current.cleanup();}catch(e){}}
  destroyChart();
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  var s=SCREENS[i]();
  current=s;
  container.innerHTML=s.html;
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){ btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i); }
  void container.offsetHeight;
  if(s.init){try{s.init();}catch(e){}}
}
show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
