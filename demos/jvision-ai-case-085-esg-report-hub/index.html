<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESG 報告彙整室</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000;
  --color-secondary:#10b981;
  --color-on-secondary:#0f172a;
  --color-accent:#059669;
  --color-on-accent:#000;
  --color-background:#ecfdf5;
  --color-foreground:#064e3b;
  --color-card:#fff;
  --color-card-foreground:#064e3b;
  --color-muted:#e8f1f3;
  --color-muted-foreground:#475569;
  --color-border:#a7f3d0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#059669;
  --blue:#059669;
  --ink:#064e3b;
  --muted:#475569;
  --line:#a7f3d0;
  --bg:#ecfdf5;
  --panel:#fff;
  --primary:#059669;
  --secondary:#10b981;
  --primary-dark:#047857;
  --primary-soft:#d1fae5;
  --sidebar:#053e32;
  --sidebar-2:#032d25;
  --good:#047857;
  --warn:#a16207;
  --bad:#b91c1c;
  --info:#075985;
  --shadow:0 12px 32px rgba(6,78,59,.08);
  --shadow-hover:0 18px 42px rgba(6,78,59,.13);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:
  radial-gradient(circle at 88% 2%,rgba(16,185,129,.15),transparent 26rem),
  radial-gradient(circle at 38% 100%,rgba(167,243,208,.42),transparent 28rem),
  var(--bg);color:var(--ink);font-family:"Fira Sans",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:21px;line-height:1;vertical-align:middle}
.app{display:flex;min-height:100vh}
.side{position:sticky;top:0;z-index:20;width:264px;height:100vh;flex:none;display:flex;flex-direction:column;padding:22px 16px;background:
  radial-gradient(circle at 10% 12%,rgba(16,185,129,.25),transparent 14rem),
  linear-gradient(165deg,var(--sidebar),var(--sidebar-2));color:#d1fae5;overflow:hidden}
.side:after{content:"";position:absolute;right:-90px;bottom:70px;width:210px;height:210px;border:1px solid rgba(167,243,208,.13);border-radius:42% 58% 68% 32%/50% 35% 65% 50%;transform:rotate(20deg);pointer-events:none}
.brand{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:4px 8px 21px;margin-bottom:15px;border-bottom:1px solid rgba(209,250,229,.15)}
.logo{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:42% 58% 56% 44%/48% 42% 58% 52%;color:#022c22;background:linear-gradient(145deg,#6ee7b7,#10b981);box-shadow:0 9px 24px rgba(16,185,129,.25)}
.logo .material-symbols-outlined{font-size:25px}
.brand b{display:block;color:#fff;font-size:15px;letter-spacing:.02em}
.brand small{display:block;margin-top:2px;color:#a7f3d0;font-size:10px}
.nav{position:relative;z-index:1;display:flex;flex-direction:column;gap:6px}
.nav button{width:100%;min-height:46px;display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid transparent;border-radius:14px;background:transparent;color:#d1fae5;text-align:left;font-weight:600;transition:background .2s,color .2s,border-color .2s,transform .2s}
.nav button:hover{background:rgba(255,255,255,.08);border-color:rgba(167,243,208,.16);color:#fff;transform:translateX(2px)}
.nav button.on{background:#ecfdf5;color:#064e3b;border-color:#a7f3d0;box-shadow:0 10px 24px rgba(0,0,0,.17)}
.nav button.on .material-symbols-outlined{color:var(--primary)}
.nav .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot{position:relative;z-index:1;margin-top:auto;padding:15px 10px 4px;border-top:1px solid rgba(209,250,229,.13);font:11px "Fira Code",monospace;color:#a7f3d0}
.dot{display:inline-grid;place-items:center;width:14px;height:14px;margin-right:7px;border:1px solid #6ee7b7;border-radius:50%;vertical-align:-3px}
.dot:after{content:"";width:6px;height:6px;border-radius:50%;background:#6ee7b7}
.main{flex:1;min-width:0;padding:30px clamp(18px,3vw,42px) 64px}
.top{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:21px;padding:22px 24px;border:1px solid rgba(167,243,208,.8);border-radius:24px 24px 24px 9px;background:rgba(255,255,255,.78);box-shadow:var(--shadow);backdrop-filter:blur(12px);overflow:hidden}
.top:after{content:"";position:absolute;right:-36px;top:-68px;width:190px;height:140px;border-radius:46% 54% 33% 67%/54% 37% 63% 46%;background:rgba(16,185,129,.1);pointer-events:none}
.top h1{position:relative;z-index:1;display:flex;align-items:center;gap:11px;margin:0;color:var(--ink);font-size:clamp(22px,2.2vw,29px);line-height:1.2;letter-spacing:-.025em}
.top h1 .material-symbols-outlined{display:grid;place-items:center;width:39px;height:39px;border-radius:14px 14px 14px 5px;background:var(--primary-soft);color:var(--primary-dark)}
.top .sub{position:relative;z-index:1;margin-top:7px;color:var(--muted);font-size:13px}
.chiprow{position:relative;z-index:1;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);font-size:11px;box-shadow:0 3px 10px rgba(6,78,59,.04)}
.chip .material-symbols-outlined{font-size:16px;color:var(--primary)}
.chip b{color:var(--ink)}
.grid{display:grid;gap:16px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g32{grid-template-columns:minmax(280px,1fr) minmax(0,1.6fr)}
.card,.kpi,.scope,.mt{border:1px solid var(--line);background:rgba(255,255,255,.94);box-shadow:var(--shadow)}
.card{min-width:0;padding:19px;border-radius:20px 20px 20px 8px}
.card h3{display:flex;align-items:center;gap:8px;margin:0 0 15px;color:var(--ink);font-size:14px}
.card h3>.material-symbols-outlined{color:var(--primary);font-size:20px}
.tag{margin-left:auto;padding:3px 9px;border:1px solid var(--line);border-radius:999px;background:var(--primary-soft);color:var(--primary-dark);font:600 10px "Fira Code",monospace}
.kpi{position:relative;min-width:0;min-height:134px;padding:17px 18px;overflow:hidden;border-radius:18px 18px 18px 7px;transition:transform .2s,box-shadow .2s}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
.kpi:after{content:"";position:absolute;right:-30px;bottom:-42px;width:105px;height:96px;border-radius:48% 52% 38% 62%/45% 38% 62% 55%;background:rgba(16,185,129,.1)}
.kpi .lab{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:600}
.kpi .lab .material-symbols-outlined{color:var(--primary);font-size:18px}
.kpi .val{position:relative;z-index:1;margin-top:10px;font:700 27px "Fira Code",monospace;letter-spacing:-.04em}
.kpi .val small{margin-left:4px;color:var(--muted);font:500 12px "Fira Sans",sans-serif}
.dlt{display:flex;align-items:center;gap:4px;margin-top:4px;font:600 11px "Fira Code",monospace}
.dlt .material-symbols-outlined{font-size:15px}
.up{color:var(--good)}.down{color:var(--bad)}.neu{color:var(--muted)}
table{width:100%;min-width:520px;border-spacing:0;border-collapse:separate;font-size:12px}
th{padding:10px 12px;border-bottom:2px solid var(--line);background:#f0fdf8;color:#365d52;font-size:10px;font-weight:700;letter-spacing:.04em;text-align:left;white-space:nowrap}
th:first-child{border-radius:10px 0 0}
th:last-child{border-radius:0 10px 0 0}
td{padding:11px 12px;border-bottom:1px solid #d5f5e6;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .18s}
tbody tr:hover{background:#f0fdf8}
td:nth-last-child(2),td.mono{text-align:right}
.mono,.val,.big,.load,.pc,.yr,.aw,.pt{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border:1px solid currentColor;border-radius:999px;font-size:10px;font-weight:700}
.pill .material-symbols-outlined{font-size:13px}
.p-good{background:#d1fae5;color:#05603f}.p-warn{background:#fef3c7;color:#854d0e}.p-bad{background:#fee2e2;color:#991b1b}.p-info{background:#e0f2fe;color:#075985}.p-mut{background:#eef2f3;color:#475569}
.bar,.gauge{height:8px;overflow:hidden;border-radius:999px;background:#d8e9e4}
.bar>i,.gauge>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--primary),var(--secondary))}
.chartbox{position:relative;width:100%;height:250px}.chartbox.sm{height:205px}
.scope{display:flex;flex-direction:column;gap:11px;min-width:0;padding:16px;border-radius:20px 20px 20px 8px}
.scope .sh{display:flex;align-items:center;gap:10px}.scope .ic,.projrow .ic{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:14px 14px 14px 5px;color:#fff}
.scope .sh b{font-size:13px}.scope .sh span,.scope .big small{display:block;color:var(--muted);font-size:11px}
.scope .big{font-size:23px;font-weight:700}
.scope .rows{display:flex;flex-direction:column;gap:7px;color:var(--muted);font-size:11px}
.scope .rows div{display:flex;justify-content:space-between;gap:10px}.scope .rows b{color:var(--ink);font-family:"Fira Code",monospace}
.mt{display:flex;flex-direction:column;gap:9px;min-width:0;padding:15px;border-radius:20px 20px 20px 8px}
.mt .r1,.mt .sub{display:flex;justify-content:space-between;gap:9px}
.mt .r1 b{font-size:12px}.mt .st{font-size:10px;font-weight:700}.mt .load{font-size:21px;font-weight:700}.mt .load small,.mt .sub{color:var(--muted);font-size:10px}
.road{position:relative;padding-left:28px}.road:before{content:"";position:absolute;left:9px;top:7px;bottom:7px;width:2px;background:var(--line)}
.mile{position:relative;padding-bottom:20px}.mile:last-child{padding-bottom:0}.mile:before{content:"";position:absolute;left:-25px;top:4px;width:13px;height:13px;border:3px solid var(--primary);border-radius:50%;background:#fff}
.mile.done:before{background:var(--primary)}.mile.now:before{border-color:#a16207;box-shadow:0 0 0 5px #fef3c7}
.mile .yr{color:var(--primary-dark);font-size:11px;font-weight:700}.mile .ti{margin:2px 0;font-size:13px;font-weight:700}.mile .de{color:var(--muted);font-size:11px}
.proj{display:flex;flex-direction:column;gap:9px}.projrow{display:flex;align-items:center;gap:11px;padding:10px;border:1px solid var(--line);border-radius:15px 15px 15px 6px;background:#fbfffd}
.projrow .ic{background:var(--primary-soft);color:var(--primary-dark)}.projrow .in{flex:1;min-width:0}.projrow .in b{display:block;font-size:12px}.projrow .in span{color:var(--muted);font-size:10px}.projrow .pc{font-size:14px;font-weight:700}
.board{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:12px}
.col{display:flex;flex-direction:column;gap:9px;min-width:0;padding:11px;border:1px solid var(--line);border-radius:17px 17px 17px 7px;background:#f0fdf8}
.col .ch{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700}.col .d{width:9px;height:9px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px currentColor}.col .cnt{margin-left:auto;padding:1px 7px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);font:600 10px "Fira Code"}
.tk{display:flex;flex-direction:column;gap:7px;padding:10px;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:13px 13px 13px 5px;background:#fff;transition:transform .2s,box-shadow .2s}
.tk:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(6,78,59,.1)}.tk.pri{border-left-color:var(--bad)}.tk.mid{border-left-color:#a16207}.tk .tt{font-size:11px;font-weight:700}.tk .mm{display:flex;align-items:center;gap:5px;flex-wrap:wrap;color:var(--muted);font-size:9px}.tk .av{width:21px;height:21px;display:grid;place-items:center;border-radius:50%;background:var(--primary-dark);color:#fff;font-size:9px}
.chapters,.alist{display:flex;flex-direction:column;gap:9px}.chp{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:15px 15px 15px 6px;background:#fbfffd}.chp .no{width:31px;height:31px;flex:none;display:grid;place-items:center;border-radius:12px 12px 12px 4px;background:var(--sidebar);color:#fff;font:700 12px "Fira Code"}.chp .cin{flex:1;min-width:0}.chp .cin b{display:block;font-size:12px}.chp .cin span{color:var(--muted);font-size:10px}.chp .prog{width:120px;flex:none}.chp .pt{margin-bottom:4px;text-align:right;font-size:10px;font-weight:700}
.arow{display:flex;align-items:flex-start;gap:11px;min-width:0;padding-bottom:10px;border-bottom:1px solid #d5f5e6}.arow:last-child{padding-bottom:0;border:0}.arow .ai{width:33px;height:33px;flex:none;display:grid;place-items:center;border-radius:13px 13px 13px 5px}.arow .at{flex:1;min-width:0}.arow .at b{display:block;font-size:12px}.arow .at span,.arow .aw{color:var(--muted);font-size:10px}.arow .aw{white-space:nowrap}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:10px}.legend span{display:flex;align-items:center;gap:5px}.legend i{width:10px;height:10px;border-radius:50%}
.hint{display:flex;align-items:flex-start;gap:6px;margin-top:10px;padding:9px 10px;border-left:3px solid var(--primary);border-radius:0 10px 10px 0;background:#f0fdf8;color:var(--muted);font-size:10px}.hint .material-symbols-outlined{flex:none;color:var(--primary);font-size:15px}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
  .app{display:block}.side{position:relative;width:100%;height:auto;padding:13px 16px}.brand{padding:0 0 12px;margin-bottom:10px}.nav{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.nav button{justify-content:center;padding:10px 7px}.nav .lbl{display:none}.foot{display:none}.main{padding-top:18px}
}
@media(max-width:700px){.g3,.g2,.g23,.g32{grid-template-columns:1fr}.top{align-items:flex-start;padding:19px}.chiprow{width:100%}.board{grid-template-columns:1fr}.chp .prog{width:86px}}
@media(max-width:480px){.main{padding:14px 12px 45px}.g4{grid-template-columns:1fr}.card{padding:15px}.top{border-radius:20px 20px 20px 8px}.top h1{font-size:21px}.chip{flex:1;justify-content:center}.arow .aw{display:none}}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media(prefers-reduced-motion:no-preference){
  #screen>.top,#screen>.grid,#screen>.card{animation:rise .42s both}
  #screen>.grid{animation-delay:.06s}#screen>.card{animation-delay:.12s}
  @keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">eco</span></div>
      <div><b>ESG 報告彙整室</b><small>SUSTAINABILITY REPORT HUB</small></div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
    <div class="foot"><span class="dot" aria-hidden="true"></span>資料同步正常 · 更新於 08:42</div>
  </aside>
  <main class="main"><div id="screen"></div></main>
</div>
<script>
"use strict";
var C={accent:"#059669",accent2:"#10b981",good:"#047857",warn:"#a16207",bad:"#b91c1c",ink:"#064e3b",muted:"#475569",line:"#a7f3d0"};
var MODS=[
  {icon:"dashboard",name:"永續總覽",sub:"碳排、能耗與目標達成一頁掌握"},
  {icon:"co2",name:"碳盤查",sub:"範疇一、二、三活動數據與排放係數"},
  {icon:"bolt",name:"能源監控",sub:"各廠用電/用能負載即時趨勢"},
  {icon:"flag",name:"減碳目標",sub:"SBTi 減碳路徑與專案進度追蹤"},
  {icon:"fact_check",name:"佐證審核",sub:"活動數據佐證蒐集與查證流程"},
  {icon:"description",name:"報告產出",sub:"GRI/ISO 永續報告章節彙整揭露"}
];
var chart=null,extras=[];
function destroyCharts(){
  if(chart){try{chart.destroy()}catch(e){} chart=null}
  extras.forEach(function(x){try{x.destroy()}catch(e){}});
  extras=[];
}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
var nav=document.getElementById("nav");
nav.innerHTML=MODS.map(function(m,i){
  return '<button type="button" data-i="'+i+'" aria-label="'+esc(m.name)+'"><span class="material-symbols-outlined" aria-hidden="true">'+m.icon+'</span><span class="lbl">'+esc(m.name)+'</span></button>'
}).join("");
nav.addEventListener("click",function(e){
  var b=e.target.closest("button[data-i]");if(!b)return;
  location.hash="v"+b.getAttribute("data-i")
});
function head(i,chips){
  var m=MODS[i];
  return '<div class="top"><div><h1><span class="material-symbols-outlined" aria-hidden="true">'+m.icon+'</span>'+esc(m.name)+'</h1><div class="sub">'+esc(m.sub)+'</div></div><div class="chiprow">'+chips+'</div></div>'
}
function chip(ic,lab,val){return '<span class="chip"><span class="material-symbols-outlined" aria-hidden="true">'+ic+'</span>'+lab+' <b>'+val+'</b></span>'}
function kpi(x,delta){
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined" aria-hidden="true">'+x.ic+'</span>'+x.lab+'</div><div class="val">'+x.val+'<small>'+x.u+'</small></div>'+(delta||"")+'</div>'
}
function pill(type,icon,text){return '<span class="pill p-'+type+'"><span class="material-symbols-outlined" aria-hidden="true">'+icon+'</span>'+text+'</span>'}
function baseOpts(o){
  return {responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:o.legend,position:"bottom",labels:{font:{family:"Fira Sans",size:11},color:C.muted,boxWidth:12,padding:14}},
      tooltip:{backgroundColor:"#032d25",padding:10,cornerRadius:10,titleFont:{family:"Fira Sans"},bodyFont:{family:"Fira Code"}}},
    scales:{x:{grid:{display:false},ticks:{font:{family:"Fira Code",size:9},color:C.muted,maxRotation:0,autoSkip:true,maxTicksLimit:12}},
      y:{grid:{color:"#d5f5e6"},border:{display:false},ticks:{font:{family:"Fira Code",size:9},color:C.muted}}}}
}
function s0(){
  var ks=[
    {lab:"本年碳排放量",ic:"co2",val:"18,420",u:"tCO₂e",d:"-11.3%"},
    {lab:"數據完整率",ic:"verified",val:"89",u:"%",d:"+6.4%"},
    {lab:"減碳目標達成",ic:"flag",val:"83",u:"%",d:"+8.0%"},
    {lab:"用能異常反應",ic:"bolt",val:"1.9",u:"小時",d:"-21.1h"}
  ].map(function(x){return kpi(x,'<div class="dlt up"><span class="material-symbols-outlined" aria-hidden="true">trending_up</span>'+x.d+' vs 去年</div>')}).join("");
  var alerts=[
    ["warning","#fee2e2","#991b1b","三廠 6 月用電量較前月 +24%","超過 20% 複核門檻 · RULE-02","12 分鐘前"],
    ["inventory_2","#fef3c7","#854d0e","物流碳排缺原始運費單佐證","範疇三 · 待供應商回覆","1 小時前"],

function show(i){

  destroyCharts();

  container.innerHTML=s.html;
  document.querySelectorAll("[data-i]").forEach(function(b){
    var on=+b.getAttribute("data-i")===i;
