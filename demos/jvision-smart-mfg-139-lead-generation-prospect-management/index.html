<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>潛在客戶開發管理 Lead Generation & Prospect Management</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#0369a1;--accent2:#38bdf8;--ink:#0f172a;--muted:#64748b;
  --bg:#f1f5f9;--card:#ffffff;--line:#e2e8f0;--soft:#f8fafc;
  --a:#16a34a;--b:#d97706;--c:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:'Inter','Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle}
header{position:sticky;top:0;z-index:50;background:linear-gradient(100deg,#075985,#0369a1);color:#fff;box-shadow:0 2px 14px rgba(3,105,161,.25)}
.bar{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.brand .logo .material-symbols-outlined{font-size:24px}
.brand b{font-size:15px;font-weight:800;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-weight:400;font-size:11px;opacity:.8}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto;min-width:0}
.nb{display:flex;align-items:center;gap:6px;background:transparent;border:0;color:#e0f2fe;padding:8px 12px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;transition:.15s;white-space:nowrap}
.nb .material-symbols-outlined{font-size:19px}
.nb:hover{background:rgba(255,255,255,.12);color:#fff}
.nb.on{background:#fff;color:var(--accent)}
main{max-width:1360px;margin:0 auto;padding:22px 18px 60px}
.head{margin-bottom:18px}
.head h1{font-size:21px;font-weight:800}
.head p{color:var(--muted);font-size:13px;margin-top:3px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;background:#e0f2fe;color:#075985;padding:3px 10px;border-radius:999px}
.grid{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
@media(max-width:820px){.g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:12px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.card h3 .r{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;position:relative;overflow:hidden;min-width:0}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--accent2)}
.kpi .val{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.kpi .val span{font-size:13px;font-weight:600;color:var(--muted)}
.kpi .sub{font-size:11.5px;margin-top:4px;font-weight:600}
.up{color:var(--a)}.dn{color:var(--c)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:2px solid var(--line);background:var(--soft);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:hover{background:var(--soft)}
.ovf{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}
.bg{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.bg.a{background:#dcfce7;color:#15803d}
.bg.b{background:#fef3c7;color:#b45309}
.bg.c{background:#fee2e2;color:#b91c1c}
.bg.i{background:#e0f2fe;color:#0369a1}
.bg.g{background:#f1f5f9;color:#475569}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.src{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.src .material-symbols-outlined{font-size:17px}
.pbar{height:7px;border-radius:6px;background:#e2e8f0;overflow:hidden;min-width:70px}
.pbar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.score{font-weight:800;font-size:14px}
.chart{width:100%;height:280px;overflow:hidden}
.chart.sm{height:220px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0}
@media(max-width:820px){.board{grid-template-columns:1fr}}
.col{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.col .ch{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;margin-bottom:9px}
.col .ch .cnt{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:999px;font-size:11px;padding:1px 8px}
.tk{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;border-left:3px solid var(--accent)}
.tk .co{font-weight:700;font-size:13px}
.tk .mt{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.tk .amt{font-weight:800;color:var(--accent);font-size:13px}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tli{position:relative;padding-bottom:15px}
.tli::before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent2)}
.tli .tt{font-weight:700;font-size:13px}
.tli .td{font-size:11.5px;color:var(--muted);margin-top:2px}
.tli .tm{font-size:11px;color:var(--accent);font-weight:600}
.flow{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.fs{flex:1;min-width:140px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.fs .n{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.fs b{font-size:12.5px}
.fs p{font-size:11px;color:var(--muted);margin-top:3px}
.prof{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}
.av{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.field{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.field b{color:var(--muted);font-weight:600}
.rule{display:flex;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:9px;background:var(--soft)}
.rule .material-symbols-outlined{color:var(--accent);font-size:20px;flex:0 0 auto}
.rule .rt{font-weight:700;font-size:13px}
.rule .rd{font-size:11.5px;color:var(--muted);margin-top:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
@media(max-width:560px){.nb .t{display:none}.nb{padding:8px}.brand small{display:none}}
</style>
</head>
<body>
<header>

function s0(){
  var rows=LEADS.map(function(l){
    return '<tr><td><b>'+esc(l.co)+'</b></td>'

function head(t,d,chip){return '<div class="head"><span class="chip"><span class="material-symbols-outlined" style="font-size:15px">bolt</span>'+esc(chip)+'</span><h1 style="margin-top:8px">'+esc(t)+'</h1><p>'+esc(d)+'</p></div>';}
function kpi(ic,lab,val,unit,dir,sub){
  var di=dir=='up'?'<span class="material-symbols-outlined" style="font-size:15px">arrow_upward</span>':dir=='dn'?'<span class="material-symbols-outlined" style="font-size:15px">arrow_downward</span>':'';
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+ic+'</span>'+esc(lab)+'</div>'
    +'<div class="val">'+esc(val)+(unit?' <span>'+esc(unit)+'</span>':'')+'</div>'
    +'<div class="sub '+(dir||'')+'">'+di+esc(sub)+'</div></div>';
}
function pbar(v){return '<div style="display:flex;align-items:center;gap:8px"><div class="pbar"><i style="width:'+v+'%"></i></div><span style="font-size:12px;font-weight:700;color:var(--muted)">'+v+'</span></div>';}
function fstep(n,t,d){return '<div class="fs"><div class="n">'+n+'</div><b>'+esc(t)+'</b><p>'+esc(d)+'</p></div>';}
function tli(t,d,m){return '<div class="tli"><div class="tt">'+t+'</div><div class="td">'+d+'</div><div class="tm">'+m+'</div></div>';}

function show(i){
  disposeCharts();
  var app=document.getElementById('app');
  app.innerHTML=SCR[i]();
  var nb=document.querySelectorAll('.nb');
  for(var k=0;k<nb.length;k++){nb[k].classList.toggle('on',+nb[k].getAttribute('data-i')===i);}
  void app.offsetHeight;
  CH[i]();
}

(function(){
  var nav=document.getElementById('nav');
  var html='';
  for(var i=0;i<NAV.length;i++){
    html+='<button class="nb" data-i="'+NAV[i].i+'"><span class="material-symbols-outlined">'+NAV[i].ic+'</span><span class="t">'+NAV[i].t+'</span></button>';
  }
  nav.innerHTML=html;
  var btns=nav.querySelectorAll('.nb');
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener('click',function(){location.hash='v'+this.getAttribute('data-i');});
  }
})();

window.show=show;
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
})();
