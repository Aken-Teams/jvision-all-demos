<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#2563EB"/>
<title>潛在客戶開發管理 Lead Generation &amp; Prospect Management</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#0F172A;
  --color-card:#FFFFFF;
  --color-card-foreground:#0F172A;
  --color-muted:#F1F5FD;
  --color-muted-foreground:#475569;
  --color-border:#E4ECFC;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#0F172A;
  --muted:#475569;
  --line:#E4ECFC;
  --green:#047857;
  --amber:#9A5200;
  --red:#B91C1C;
  --black:#050B18;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto}
html,body{max-width:100%;overflow-x:hidden}
body{
  min-width:320px;
  background:
    linear-gradient(var(--line) 1px,transparent 1px),
    linear-gradient(90deg,var(--line) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Fira Sans",sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,.nb{cursor:pointer}
.material-symbols-outlined{
  vertical-align:middle;
  font-variation-settings:"FILL" 0,"wght" 600,"GRAD" 0,"opsz" 24;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.skip{
  position:fixed;
  left:12px;
  top:-80px;
  z-index:200;
  padding:10px 14px;
  border:2px solid var(--black);
  background:var(--color-card);
  color:var(--ink);
  font-weight:700;
}
.skip:focus{top:12px}
header{
  position:sticky;
  top:0;
  z-index:50;
  border-bottom:3px solid var(--black);
  background:var(--color-primary);
  color:var(--color-on-primary);
}
.bar{
  width:100%;
  max-width:1440px;
  min-width:0;
  margin:0 auto;
  padding:0 20px;
  display:flex;
  align-items:stretch;
  gap:20px;
}
.brand{
  min-width:265px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 0;
}
.brand .logo{
  width:44px;
  height:44px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  border:2px solid var(--color-on-primary);
  background:var(--black);
}
.brand .logo .material-symbols-outlined{font-size:25px}
.brand b{
  display:block;
  font-size:15px;
  font-weight:800;
  letter-spacing:.04em;
  line-height:1.25;
}
.brand small{
  display:block;
  margin-top:2px;
  color:#DBEAFE;
  font-family:"Fira Code",monospace;
  font-size:10px;
}
nav{
  min-width:0;
  margin-left:auto;
  display:flex;
  align-items:stretch;
}
.nb{
  min-width:76px;
  border:0;
  border-left:1px solid rgba(255,255,255,.35);
  padding:10px 12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  background:transparent;
  color:#EFF6FF;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
  transition:background-color .18s ease,color .18s ease;
}
.nb:last-child{border-right:1px solid rgba(255,255,255,.35)}
.nb .material-symbols-outlined{font-size:20px}
.nb:hover{background:#1D4ED8;color:#fff}
.nb.on{
  background:var(--color-card);
  color:var(--color-primary);
  box-shadow:inset 0 -5px 0 var(--color-accent);
}
.nb:focus-visible{position:relative;z-index:2;outline-color:#fff;outline-offset:-5px}
main{
  max-width:1440px;
  margin:0 auto;
  padding:26px 20px 64px;
}
#app{animation:reveal .36s ease-out both}
.head{
  position:relative;
  min-height:114px;
  margin-bottom:18px;
  padding:19px 230px 18px 20px;
  border:3px solid var(--black);
  background:var(--color-card);
}
.head::after{
  content:"LEAD / OPS";
  position:absolute;
  right:-3px;
  top:-3px;
  bottom:-3px;
  width:200px;
  display:grid;
  place-items:center;
  border-left:3px solid var(--black);
  background:var(--color-primary);
  color:#fff;
  font-family:"Fira Code",monospace;
  font-size:24px;
  font-weight:700;
  letter-spacing:.04em;
}
.head h1{
  margin-top:9px;
  font-size:clamp(22px,2vw,30px);
  font-weight:800;
  line-height:1.16;
  letter-spacing:-.025em;
}
.head p{
  max-width:850px;
  margin-top:7px;
  color:var(--muted);
  font-size:13px;
}
.chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:2px solid var(--black);
  padding:3px 9px;
  background:#DBEAFE;
  color:#1E40AF;
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
}
.grid{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(300px,1fr)}
.g32{grid-template-columns:minmax(0,1.4fr) minmax(320px,1fr)}
.card,.kpi{
  min-width:0;
  border:2px solid var(--black);
  background:var(--color-card);
  color:var(--color-card-foreground);
}
.card{padding:16px}
.card h3{
  min-height:28px;
  margin:-16px -16px 15px;
  padding:9px 12px;
  border-bottom:2px solid var(--black);
  display:flex;
  align-items:center;
  gap:7px;
  background:var(--color-muted);
  font-size:13px;
  font-weight:800;
  letter-spacing:.01em;
}
.card h3 .material-symbols-outlined{
  color:var(--color-primary);
  font-size:19px;
}
.card h3 .r{
  margin-left:auto;
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:10.5px;
  font-weight:600;
}
.kpi{
  position:relative;
  overflow:hidden;
  min-height:128px;
  padding:15px 15px 13px 19px;
}
.kpi::before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:7px;
  background:var(--color-primary);
}
.kpi:nth-child(2n)::before{background:var(--color-secondary)}
.kpi .lab{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}
.kpi .lab .material-symbols-outlined{
  color:var(--color-primary);
  font-size:18px;
}
.kpi .val{
  margin-top:5px;
  color:var(--ink);
  font-family:"Fira Code",monospace;
  font-size:29px;
  font-weight:700;
  letter-spacing:-.05em;
  line-height:1.2;
  font-variant-numeric:tabular-nums;
}
.kpi .val span{
  color:var(--muted);
  font-family:"Fira Sans",sans-serif;
  font-size:12px;
  font-weight:700;
  letter-spacing:0;
}
.kpi .sub{
  margin-top:7px;
  display:flex;
  align-items:center;
  gap:2px;
  color:var(--muted);
  font-size:11.5px;
  font-weight:700;
}
.up{color:var(--green)!important}
.dn{color:var(--red)!important}
.ovf{
  max-width:100%;
  overflow:auto;
  border:1px solid var(--black);
  scrollbar-color:var(--color-primary) var(--color-muted);
}
table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  font-size:12.5px;
}
th{
  padding:9px 11px;
  border-right:1px solid #CBD5E1;
  border-bottom:2px solid var(--black);
  background:#E8EFFE;
  color:#27364B;
  text-align:left;
  font-size:11px;
  font-weight:800;
  letter-spacing:.03em;
  white-space:nowrap;
}
th:last-child{border-right:0}
td{
  padding:10px 11px;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
td:last-child{border-right:0}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#F0F6FF}
table td:nth-last-child(-n+3){font-family:"Fira Code",monospace}
.score{text-align:right;font-family:"Fira Code",monospace;font-weight:700;font-size:14px}
.bg{
  display:inline-flex;
  align-items:center;
  gap:5px;
  border:1px solid currentColor;
  padding:2px 7px;
  font-size:11px;
  font-weight:800;
  line-height:1.35;
  white-space:nowrap;
}
.bg::before{
  content:"";
  width:6px;
  height:6px;
  flex:0 0 auto;
  border:1px solid currentColor;
  background:currentColor;
}
.bg.a{background:#DDF8EC;color:#066B50}
.bg.b{background:#FFF2CB;color:#854600}
.bg.c{background:#FEE2E2;color:#A71818}
.bg.i{background:#DBEAFE;color:#1E40AF}
.bg.g{background:#EEF2F7;color:#3F4D61}
.dot{
  width:9px;
  height:9px;
  display:inline-block;
  border:1px solid var(--black);
}
.src{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-weight:700;
}
.src .material-symbols-outlined{font-size:17px;color:var(--color-primary)}
.pbar{
  height:9px;
  min-width:70px;
  overflow:hidden;
  border:1px solid #8EA0BA;
  background:#E8EEF7;
}
.pbar>i{
  display:block;
  height:100%;
  background:var(--color-primary);
}
.chart{width:100%;height:280px;overflow:hidden}
.chart.sm{height:220px}
.legend{
  display:flex;
  flex-wrap:wrap;
  gap:7px 14px;
  margin-top:8px;
  color:var(--muted);
  font-size:11px;
}
.legend span{display:inline-flex;align-items:center;gap:5px}
.board{
  min-width:0;
  display:grid;
  grid-template-columns:repeat(4,minmax(160px,1fr));
  gap:0;
  border:1px solid var(--black);
}
.col{
  min-width:0;
  padding:10px;
  border-right:2px solid var(--black);
  background:var(--color-muted);
}
.col:last-child{border-right:0}
.col .ch{
  margin:-10px -10px 10px;
  padding:8px 9px;
  border-bottom:2px solid var(--black);
  display:flex;
  align-items:center;
  gap:7px;
  background:#DBEAFE;
  font-size:12px;
  font-weight:800;
}
.col .ch .cnt{
  margin-left:auto;
  min-width:23px;
  padding:1px 6px;
  border:1px solid var(--black);
  background:#fff;
  font-family:"Fira Code",monospace;
  font-size:10px;
  text-align:center;
}
.tk{
  margin-bottom:9px;
  padding:9px;
  border:1px solid var(--black);
  border-left:5px solid var(--color-primary);
  background:#fff;
}
.tk:last-child{margin-bottom:0}
.tk .co{font-size:12.5px;font-weight:800}
.tk .mt{
  margin-top:5px;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:5px;
  color:var(--muted);
  font-size:10.5px;
}
.tk .amt{
  color:#066B50;
  font-family:"Fira Code",monospace;
  font-size:12px;
  font-weight:700;
}
.tl{position:relative;padding-left:25px}
.tl::before{
  content:"";
  position:absolute;
  left:7px;
  top:4px;
  bottom:4px;
  width:3px;
  background:var(--black);
}
.tli{position:relative;padding:0 0 17px}
.tli:last-child{padding-bottom:0}
.tli::before{
  content:"";
  position:absolute;
  left:-22px;
  top:3px;
  width:11px;
  height:11px;
  border:2px solid var(--black);
  background:var(--color-primary);
}
.tli .tt{font-size:12.5px;font-weight:800}
.tli .td{margin-top:2px;color:var(--muted);font-size:11.5px}
.tli .tm{
  margin-top:3px;
  color:#1D4ED8;
  font-family:"Fira Code",monospace;
  font-size:10.5px;
  font-weight:700;
}
.flow{
  display:flex;
  align-items:stretch;
  gap:0;
  border:1px solid var(--black);
}
.fs{
  position:relative;
  flex:1;
  min-width:140px;
  padding:12px;
  border-right:2px solid var(--black);
  background:#fff;
}
.fs:last-child{border-right:0}
.fs .n{
  width:25px;
  height:25px;
  margin-bottom:8px;
  display:grid;
  place-items:center;
  border:2px solid var(--black);
  background:var(--color-primary);
  color:#fff;
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:700;
}
.fs b{font-size:12.5px}
.fs p{margin-top:4px;color:var(--muted);font-size:11px}
.prof{
  min-width:0;
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
.av{
  width:50px;
  height:50px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  border:2px solid var(--black);
  background:var(--color-primary);
  color:#fff;
  font-family:"Fira Code",monospace;
  font-size:16px;
  font-weight:700;
}
.field{
  display:flex;
  justify-content:space-between;
  gap:14px;
  padding:9px 2px;
  border-bottom:1px dashed #9AA9BC;
  font-size:12.5px;
}
.field b{color:var(--muted);font-weight:700}
.field span{
  text-align:right;
  font-variant-numeric:tabular-nums;
}
.rule{
  margin-bottom:9px;
  padding:10px;
  border:1px solid var(--black);
  display:flex;
  gap:10px;
  background:var(--color-muted);
}
.rule .material-symbols-outlined{
  flex:0 0 auto;
  color:var(--color-primary);
  font-size:20px;
}
.rule .rt{font-size:12.5px;font-weight:800}
.rule .rd{margin-top:2px;color:var(--muted);font-size:11px}
@keyframes reveal{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}
@media(max-width:1100px){
  .bar{padding:0 14px}
  .brand{min-width:230px}
  .nb{min-width:62px;padding:9px 7px}
  .nb .t{font-size:11px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:820px){
  header{position:relative}
  .bar{padding:0;display:block}
  .brand{min-width:0;padding:10px 14px}
  nav{
    width:100%;
    overflow-x:auto;
    border-top:2px solid rgba(255,255,255,.45);
  }
  .nb{
    min-width:82px;
    flex:1 0 82px;
    border-bottom:0;
    padding:8px 6px;
  }
  main{padding:18px 12px 48px}
  .head{padding:17px 18px}
  .head::after{display:none}
  .g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .flow{overflow-x:auto}
  .fs{flex:0 0 190px}
  .board{grid-template-columns:repeat(4,minmax(170px,1fr))}
}
@media(max-width:560px){
  body{background-size:24px 24px}
  .brand b{font-size:14px}
  .brand small{font-size:9px}
  .nb{min-width:58px;flex-basis:58px}
  .nb .t{display:none}
  .nb .material-symbols-outlined{font-size:22px}
  main{padding-inline:9px}
  .head{min-height:0;border-width:2px}
  .head h1{font-size:21px}
  .g4{grid-template-columns:1fr}
  .card{padding:12px}
  .card h3{margin:-12px -12px 12px}
  .kpi{min-height:112px}
  .field{display:block}
  .field span{display:block;margin-top:3px;text-align:left}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  #app{animation:none}
}
</style>
</head>

</header>
<main>

</main>

var SCR=[s0,s1,s2,s3,s4,s5];
var CH=[charts0,charts1,charts2,charts3,charts4,charts5];
function show(i){
  disposeCharts();
  var app=document.getElementById("app");
  app.innerHTML=SCR[i]();
  app.setAttribute("aria-label",NAV[i].t);
  var nb=document.querySelectorAll(".nb");
  for(var k=0;k<nb.length;k++){
    var active=+nb[k].getAttribute("data-i")===i;
    nb[k].classList.toggle("on",active);
    nb[k].setAttribute("aria-current",active?"page":"false");
  }
  void app.offsetHeight;
  CH[i]();
}
(function(){
  var nav=document.getElementById("nav");
  var html="";
  for(var i=0;i<NAV.length;i++){
    html+='<button type="button" class="nb" data-i="'+NAV[i].i+'" aria-label="'+NAV[i].t+'"><span class="material-symbols-outlined" aria-hidden="true">'+NAV[i].ic+'</span><span class="t">'+NAV[i].t+'</span></button>';
  }
  nav.innerHTML=html;
  var btns=nav.querySelectorAll(".nb");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){
      location.hash="v"+this.getAttribute("data-i");
    });
  }
})();
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){
    show(0);
    return;
  }
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0);}catch(e){}
}
window.addEventListener("hashchange",fromHash);
window.addEventListener("resize",function(){
  for(var i=0;i<charts.length;i++){
    try{charts[i].resize();}catch(e){}
  }
});
fromHash();
})();
