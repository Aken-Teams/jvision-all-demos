<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>營業秘密與競業限制管理 · 經營治理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --accent:#0D9488;
  --accent2:#2DD4BF;
  --accent-soft:#CCFBF1;
  --accent-soft2:#99F6E4;
  --bg:#F0FDFA;
  --panel:#FFFFFF;
  --th:#CCFBF1;
  --hov:#F0FDFA;
  --track:#D8E8EA;
  --sidebar:#042F2E;
  --sidebar2:#134E4A;
  --side-edge:#2DD4BF;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#0F766E;
  --r:0px;
  --glow:rgba(13,148,136,.22);
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  background-color:var(--bg);
  background-image:linear-gradient(rgba(13,148,136,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(13,148,136,.09) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Crimson Pro","Noto Sans TC",serif;
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,[data-i]{cursor:pointer}
h1,h2,h3,h4{margin:0;color:var(--ink);font-family:"Cormorant Garamond","Noto Sans TC",serif;font-weight:700;line-height:1.1}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
:focus-visible{outline:4px solid var(--color-ring);outline-offset:3px}
::selection{background:var(--color-secondary);color:#042F2E}

.app{display:flex;min-height:100vh}
.sidebar{
  position:sticky;top:0;z-index:20;
  display:flex;flex:none;flex-direction:column;
  width:264px;height:100vh;padding:0 16px 18px;
  overflow:hidden;
  color:#F0FDFA;background:var(--sidebar);
  border-right:4px solid var(--color-secondary);
}
.sidebar::after{content:"CONFIDENTIAL / GOVERNANCE";position:absolute;right:-93px;bottom:135px;transform:rotate(-90deg);color:#5EEAD4;font:500 10px/1 "Cinzel",serif;letter-spacing:3px;opacity:.7}
.brand{display:flex;align-items:center;gap:12px;margin:0 -16px 18px;padding:18px 16px;border-bottom:4px solid var(--color-secondary);min-width:0}
.brand-logo{display:flex;align-items:center;justify-content:center;flex:none;width:48px;height:48px;color:#000;background:var(--color-secondary);border:2px solid #000;box-shadow:6px 6px 0 var(--color-accent)}
.brand-logo .material-symbols-outlined{font-size:27px}
.brand-txt{min-width:0}
.brand-txt b{display:block;color:#FFF;font-family:"Noto Sans TC",sans-serif;font-size:16px;font-weight:900;letter-spacing:.06em}
.brand-txt span{display:block;margin-top:4px;color:#99F6E4;font:500 10px/1 "Cinzel",serif;letter-spacing:.18em}
.nav{display:flex;flex-direction:column;gap:8px;min-width:0;margin-top:2px}
.nav button{position:relative;display:flex;align-items:center;gap:11px;min-width:0;min-height:48px;padding:10px 11px;color:#CCFBF1;background:transparent;border:2px solid rgba(94,234,212,.48);border-radius:0;text-align:left;font-family:"Noto Sans TC",sans-serif;font-size:13px;font-weight:700}
.nav button .material-symbols-outlined{flex:none;font-size:21px}
.nav button .txt{overflow:hidden;text-overflow:ellipsis}
.nav button .idx{margin-left:auto;color:#99F6E4;font:600 10px/1 "Cinzel",serif;letter-spacing:.12em}
.nav button:hover{color:#000;background:var(--color-secondary);border-color:#000;transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--color-accent);transition:transform 180ms ease,box-shadow 180ms ease,background-color 180ms ease}
.nav button.on{color:#000;background:var(--color-secondary);border-color:#000;box-shadow:6px 6px 0 var(--color-accent)}
.nav button.on::before{content:"";position:absolute;left:-18px;top:7px;bottom:7px;width:7px;background:var(--color-accent);border:2px solid #000}
.nav button.on .idx{color:#042F2E}
.side-foot{margin-top:auto;padding:15px 34px 2px 3px;border-top:2px solid rgba(94,234,212,.6);color:#CCFBF1;font-family:"Crimson Pro","Noto Sans TC",serif;font-size:12px;line-height:1.7}
.side-foot b{color:#FFF;font-family:"Cinzel",serif}

.main{flex:1;min-width:0;padding:0 30px 60px;overflow:hidden}
.topbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:18px;margin:0 -30px 24px;padding:18px 30px 16px;background:rgba(240,253,250,.96);border-bottom:4px solid var(--ink);flex-wrap:wrap}
.topbar::after{content:"";position:absolute;left:30px;bottom:-4px;width:28%;height:4px;background:var(--color-accent)}
.topbar h1{display:flex;align-items:center;gap:10px;font-size:clamp(25px,2.4vw,38px);font-weight:700;letter-spacing:-.03em}
.topbar h1 .material-symbols-outlined{display:grid;place-items:center;width:42px;height:42px;color:#000;background:var(--color-secondary);border:2px solid var(--ink);font-size:24px}
.topbar .sub{margin:5px 0 0 52px;color:var(--muted);font-family:"Noto Sans TC",sans-serif;font-size:12px;font-weight:500}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:7px 11px;color:var(--ink);background:var(--panel);border:2px solid var(--ink);border-radius:0;font-family:"Noto Sans TC",sans-serif;font-size:11px;font-weight:700;box-shadow:3px 3px 0 var(--color-border)}
.chip .dot{position:relative;width:10px;height:10px;background:var(--ok);border:2px solid #052E16;border-radius:50%}
.chip .dot::after{content:"";position:absolute;inset:2px;background:#FFF;border-radius:50%;animation:pulse 1.8s steps(2,end) infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.15}}
.avatar{display:flex;align-items:center;justify-content:center;flex:none;width:38px;height:38px;color:#000;background:var(--color-accent);border:2px solid #000;border-radius:0;font-family:"Noto Sans TC",sans-serif;font-size:13px;font-weight:900;box-shadow:3px 3px 0 var(--ink)}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g32{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
.grid>*{min-width:0}
.grid.g4>*:nth-child(even){transform:translateY(8px)}
.card,.sec,.kpi,.stat,.tile{color:var(--card-foreground);background:var(--panel);border:2px solid var(--ink);border-radius:0;box-shadow:5px 5px 0 var(--color-border)}
.card,.sec{min-width:0;padding:16px}
.sec{margin-bottom:15px}
.sec>h3,.card-h h3{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700}
.sec>h3{margin-bottom:12px}
.sec>h3 .material-symbols-outlined,.card-h h3 .material-symbols-outlined{color:#000;background:var(--color-secondary);border:1px solid var(--ink);padding:4px;font-size:18px}
.sec>p{margin:0 0 13px;color:var(--muted);font-size:14px;line-height:1.7}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0;font-size:14px}
.dl dt{color:var(--muted);font-family:"Noto Sans TC",sans-serif;font-size:12px;font-weight:700}
.dl dd{margin:0;line-height:1.7}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px;flex-wrap:wrap}
.card-h .hint{padding:3px 7px;color:#042F2E;background:var(--color-muted);border-left:4px solid var(--color-accent);font-family:"Noto Sans TC",sans-serif;font-size:11px;font-weight:700}

.kpi,.stat{position:relative;min-width:0;padding:15px 16px;overflow:hidden}
.kpi::before,.stat::before{content:"";position:absolute;left:0;top:0;width:54%;height:5px;background:var(--color-primary)}
.kpi:nth-child(even)::before,.stat:nth-child(even)::before{width:78%;background:var(--color-accent)}
.kpi::after{content:"";position:absolute;right:-22px;top:-28px;width:84px;height:84px;background:var(--accent-soft);border:2px solid var(--ink);transform:rotate(18deg)}
.kpi .ico{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;width:39px;height:39px;color:#000;background:var(--color-secondary);border:2px solid var(--ink);border-radius:0;box-shadow:3px 3px 0 var(--color-accent)}
.kpi .ico .material-symbols-outlined{font-size:21px}
.kpi .lbl,.stat .lbl{display:flex;align-items:center;gap:5px;margin-top:12px;color:var(--muted);font-family:"Noto Sans TC",sans-serif;font-size:11px;font-weight:700;letter-spacing:.03em}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{color:var(--accent);font-size:15px}
.kpi .val,.stat .val,.tile .tv{margin-top:2px;color:var(--ink);font-family:"Cinzel","Noto Sans TC",serif;font-size:27px;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums lining-nums}
.kpi .val small,.stat .val small{margin-left:4px;color:var(--muted);font-family:"Noto Sans TC",sans-serif;font-size:12px;font-weight:700}
.kpi .delta,.stat .d{display:inline-flex;align-items:center;gap:3px;margin-top:6px;padding:2px 5px;border:1px solid currentColor;font-family:"Noto Sans TC",sans-serif;font-size:11px;font-weight:900}
.delta.up,.d.up{color:#166534;background:#DCFCE7}
.delta.down,.d.down{color:#991B1B;background:#FEE2E2}
.delta.flat,.d.flat{color:#334155;background:#E2E8F0}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:14px}

.card>div[style*="overflow-x:auto"],.card.p0>div[style*="overflow-x:auto"]{scrollbar-color:var(--color-primary) var(--color-muted)}
table{width:100%;border-collapse:collapse;color:var(--ink);font-family:"Noto Sans TC",sans-serif;font-size:12px;font-variant-numeric:tabular-nums lining-nums}
th{padding:10px 12px;color:#042F2E;background:var(--th);border-right:1px solid var(--ink);border-bottom:2px solid var(--ink);text-align:left;font-family:"Cinzel","Noto Sans TC",serif;font-size:10px;font-weight:600;letter-spacing:.05em;white-space:nowrap}
th:last-child{border-right:0}
td{padding:10px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
td:last-child{border-right:0}
tbody tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#F8FFFE}
tbody tr:hover{background:#CCFBF1;box-shadow:inset 5px 0 0 var(--color-accent)}
td:nth-child(n+3){font-variant-numeric:tabular-nums lining-nums}
td:has(.prog),td:has(.band){min-width:130px}
.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border:1px solid currentColor;border-radius:0;font-family:"Noto Sans TC",sans-serif;font-size:10px;font-weight:900;line-height:1.35;white-space:nowrap}
.t-ok{color:#14532D;background:#DCFCE7}
.t-warn{color:#78350F;background:#FEF3C7}
.t-bad{color:#7F1D1D;background:#FEE2E2}
.t-info{color:#0C4A6E;background:#E0F2FE}
.t-gray{color:#334155;background:#E2E8F0}
.t-acc,.t-pink{color:#134E4A;background:#CCFBF1}

.bar{height:9px;min-width:56px;overflow:hidden;background:var(--track);border:1px solid var(--ink);border-radius:0}
.bar>i{display:block;height:100%;background:var(--color-primary);border-radius:0}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{flex:none;width:38px;color:var(--ink);font:700 10px/1 ui-monospace,"SFMono-Regular",Consolas,monospace;text-align:right}

.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:7px;top:3px;bottom:3px;width:3px;background:var(--ink)}
.tl-item,.tl-i{position:relative;padding:0 0 17px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;left:-25px;top:2px;width:15px;height:15px;background:#FFF;border:4px solid var(--accent);border-radius:0;transform:rotate(45deg)}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font:600 10px/1.3 ui-monospace,"SFMono-Regular",Consolas,monospace}
.tl-item b,.tl-i b{display:block;margin:3px 0;font-family:"Noto Sans TC",sans-serif;font-size:13px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:12px}
.chk{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px dashed var(--ink);font-family:"Noto Sans TC",sans-serif;font-size:12px}
.chk:last-child{border-bottom:0}
.chk .material-symbols-outlined{font-size:19px}
.chk .ok{color:var(--ok)}.chk .wait{color:var(--muted)}.chk .bad{color:var(--bad)}.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}.chk small{color:var(--muted);font-size:11px}
.note{margin-top:13px;padding-top:11px;color:var(--muted);border-top:2px dashed var(--line);font-size:12px;line-height:1.65}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.board>*{min-width:0}
.col{display:flex;flex-direction:column;gap:9px;padding:10px;background:var(--color-muted);border:2px solid var(--ink);border-radius:0}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 3px 6px;font-family:"Noto Sans TC",sans-serif;font-size:12px;font-weight:900}
.col-h .cnt{padding:2px 7px;color:var(--ink);background:#FFF;border:1px solid var(--ink);border-radius:0;font:700 10px/1.3 ui-monospace,"SFMono-Regular",Consolas,monospace}
.pcard{padding:10px 11px;background:#FFF;border:2px solid var(--ink);border-left:7px solid var(--accent);border-radius:0;box-shadow:3px 3px 0 var(--color-border)}
.pcard b{font-family:"Noto Sans TC",sans-serif;font-size:12px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;color:var(--muted);font-size:11px}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:8px;color:var(--ink);font-size:11px}
.mini-av,.av{display:inline-flex;align-items:center;justify-content:center;flex:none;color:#000;background:var(--color-secondary);border:1px solid var(--ink);border-radius:0;font-weight:900}
.mini-av{width:19px;height:19px;font-size:9px}.av{width:27px;height:27px;font-size:11px}

.lane{display:flex;flex-direction:column;gap:10px}
.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:11px 13px;background:#FFF;border:2px solid var(--ink);border-radius:0;box-shadow:4px 4px 0 var(--color-border)}
.lane-row .num{display:flex;align-items:center;justify-content:center;flex:none;width:33px;height:33px;color:#000;background:var(--color-secondary);border:2px solid var(--ink);border-radius:0;font:600 12px/1 "Cinzel",serif}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-family:"Noto Sans TC",sans-serif;font-size:13px}
.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:12px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{z-index:1;display:flex;align-items:center;justify-content:center;width:24px;height:24px;color:#475569;background:#FFF;border:2px solid #64748B;border-radius:0;font:700 10px/1 ui-monospace,monospace}
.steps .ln{width:18px;height:3px;background:#94A3B8}
.steps .s.done{color:#000;background:var(--color-secondary);border-color:var(--ink)}
.steps .s.cur{color:#000;background:#FEF3C7;border-color:var(--color-accent);animation:pulse 1.6s steps(2,end) infinite}
.steps .ln.done{background:var(--color-primary)}

.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:11px 3px;border-bottom:2px dashed var(--line)}
.rep-row:last-child{border-bottom:0}.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-family:"Noto Sans TC",sans-serif;font-size:13px}.rep-row .sku span{color:var(--muted);font-size:11px}
.gauge{flex:none;width:110px}.gauge .track{position:relative;height:9px;overflow:hidden;background:var(--track);border:1px solid var(--ink);border-radius:0}.gauge .track i{display:block;height:100%;background:var(--accent)}
.gauge small{display:block;margin-top:3px;color:var(--muted);font:600 10px/1.2 ui-monospace,monospace;text-align:right}
.band{position:relative;min-width:150px;height:27px;background:var(--track);border:1px solid var(--ink);border-radius:0}.band .rng{position:absolute;top:0;bottom:0;background:var(--accent-soft);border-radius:0}.band .mid{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--muted)}.band .me{position:absolute;top:2px;width:12px;height:21px;background:var(--accent);border:1px solid #000;border-radius:0}

.tile{position:relative;display:flex;flex-direction:column;gap:7px;min-width:0;padding:15px 16px;overflow:hidden}
.tile::after{content:"";position:absolute;right:-28px;bottom:-32px;width:86px;height:76px;background:var(--color-secondary);border:2px solid var(--ink);transform:rotate(-18deg);opacity:.55}
.tile:nth-child(2n)::after{background:var(--color-accent);opacity:.4}
.tile .ti{z-index:1;display:flex;align-items:center;justify-content:center;width:39px;height:39px;color:#000;background:var(--color-secondary);border:2px solid var(--ink);border-radius:0;box-shadow:3px 3px 0 var(--color-accent)}
.tile .ti .material-symbols-outlined{font-size:21px}.tile b{z-index:1;font-family:"Noto Sans TC",sans-serif;font-size:13px;font-weight:900}.tile p{z-index:1;margin:0;color:var(--muted);font-family:"Noto Sans TC",sans-serif;font-size:11px;line-height:1.55}.tile .tv{z-index:1;font-size:25px}.who{display:inline-flex;align-items:center;gap:6px}

.apexcharts-text,.apexcharts-legend-text{font-family:"Crimson Pro","Noto Sans TC",serif!important;fill:var(--muted)!important;color:var(--muted)!important}
.apexcharts-gridline{stroke:var(--line)!important;stroke-dasharray:0!important}
.apexcharts-xaxis line,.apexcharts-yaxis line{stroke:var(--ink)!important}
.apexcharts-tooltip{border:2px solid var(--ink)!important;border-radius:0!important;box-shadow:4px 4px 0 var(--color-border)!important}
.apexcharts-tooltip-title{background:var(--accent-soft)!important;border-bottom:1px solid var(--ink)!important}

#screen>.grid{animation:enter 380ms cubic-bezier(.2,.85,.3,1.25) both}
#screen>.grid:nth-child(2){animation-delay:60ms}
#screen>.grid:nth-child(3){animation-delay:120ms}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}

@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:860px){
  .app{flex-direction:column}.sidebar{position:relative;width:100%;height:auto;padding:10px 14px 13px;border-right:0;border-bottom:4px solid var(--color-secondary);overflow:visible}.sidebar::after,.side-foot{display:none}.brand{margin:-10px 0 8px;padding:13px 0 10px;border-bottom:2px solid var(--color-secondary)}.brand-logo{width:40px;height:40px;box-shadow:4px 4px 0 var(--color-accent)}.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.nav button{justify-content:center;min-height:46px;padding:8px}.nav button.on::before{left:7px;right:7px;top:auto;bottom:-7px;width:auto;height:5px;border-width:1px}.nav button .idx{display:none}.main{padding:0 16px 44px}.topbar{position:relative;top:auto;margin:0 -16px 18px;padding:15px 16px}.topbar::after{left:16px}.topbar .sub{margin-left:0}.grid.g4>*:nth-child(even){transform:none}
}

/* ── 導覽 ── */
function buildNav(){var n=document.getElementById("nav");
 n.innerHTML=MODULES.map(function(m,i){return '<button type="button" data-i="'+i+'"><span class="material-symbols-outlined">'+m.icon+'</span><span class="txt">'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'}).join("");
 Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})})}
function show(i){killCharts();var m=MODULES[i];
 document.getElementById("th-ico").textContent=m.icon;
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i)});
 RENDER[i](document.getElementById("screen"))}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);show(m?Math.min(+m[1],MODULES.length-1):0);try{window.scrollTo(0,0)}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
