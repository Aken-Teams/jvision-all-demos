<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>道路救援調度 · 拖吊派遣平台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Josefin+Sans:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#00FF41;
  --color-on-primary:#0F172A;
  --color-secondary:#008F11;
  --color-on-secondary:#000000;
  --color-accent:#FF3333;
  --color-on-accent:#000000;
  --color-background:#0D1117;
  --color-foreground:#E6EDF3;
  --color-card:#182424;
  --color-card-foreground:#E6EDF3;
  --color-muted:#25292F;
  --color-muted-foreground:#94A3B8;
  --color-border:#30363D;
  --color-destructive:#EF4444;
  --color-on-destructive:#000000;
  --color-ring:#00FF41;

  --blue:#00FF41;
  --ink:#E6EDF3;
  --muted:#94A3B8;
  --line:#30363D;

  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --accent-soft:#12361F;
  --bg:var(--color-background);
  --panel:var(--color-card);
  --mut:var(--color-muted-foreground);
  --ok:#00FF41;
  --warn:#FFD43B;
  --bad:#FF5C5C;
  --info:#70B7FF;
  --mono:"Josefin Sans","Noto Sans TC",sans-serif;
}

*{box-sizing:border-box;}
html{color-scheme:dark;scrollbar-color:var(--color-primary) var(--color-background);}
html,body{margin:0;padding:0;min-height:100%;}
body{
  font-family:"Josefin Sans","Noto Sans TC",sans-serif;
  background-color:var(--color-background);
  background-image:
    linear-gradient(rgba(48,54,61,.32) 1px,transparent 1px),
    linear-gradient(90deg,rgba(48,54,61,.32) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--color-foreground);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  line-height:1.5;
}
button,input,select,textarea{font:inherit;}
button{cursor:pointer;}
::selection{background:var(--color-primary);color:var(--color-on-primary);}

.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
  font-variation-settings:"FILL" 0,"wght" 500,"GRAD" 0,"opsz" 24;
}

:where(button,a,[tabindex]):focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
  box-shadow:0 0 0 2px var(--color-background);
}

.app{display:flex;min-height:100vh;align-items:stretch;}
.side{
  width:264px;
  flex:0 0 264px;
  background:#10171A;
  border-right:3px solid var(--color-primary);
  padding:18px 14px;
  display:flex;
  flex-direction:column;
  gap:8px;
  position:sticky;
  top:0;
  height:100vh;
  overflow:auto;
  z-index:10;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-height:78px;
  padding:8px 6px 18px;
  border-bottom:1px solid var(--color-border);
  margin-bottom:6px;
}
.brand .logo{
  width:48px;
  height:48px;
  flex:0 0 48px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border:2px solid var(--color-foreground);
  box-shadow:6px 6px 0 #000;
  transform:rotate(-3deg);
}
.brand .logo .material-symbols-outlined{font-size:27px;font-weight:700;}
.brand b{
  display:block;
  font-family:"Cinzel","Noto Sans TC",serif;
  font-size:16px;
  font-weight:700;
  letter-spacing:.04em;
  color:#fff;
}
.brand span:not(.material-symbols-outlined){font-size:12px;color:var(--color-muted-foreground);}
.navwrap{display:flex;flex-direction:column;gap:7px;}
.nav{
  position:relative;
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  min-width:0;
  min-height:54px;
  padding:10px 12px;
  border:1px solid var(--color-border);
  border-left:4px solid var(--color-border);
  background:var(--color-muted);
  color:var(--color-foreground);
  text-align:left;
  font-size:14px;
  font-weight:700;
  letter-spacing:.025em;
  border-radius:0;
  transition:background-color .18s ease,color .18s ease,border-color .18s ease,transform .18s ease;
}
.nav .material-symbols-outlined{font-size:21px;color:var(--color-muted-foreground);flex:0 0 auto;}
.nav small{display:block;font-size:11px;color:var(--color-muted-foreground);font-weight:500;letter-spacing:.03em;}
.nav .lab{min-width:0;}
.nav:hover{background:#30383D;border-color:var(--color-primary);transform:translateX(3px);}
.nav.on{
  background:var(--color-primary);
  color:var(--color-on-primary);
  border-color:var(--color-primary);
  box-shadow:5px 5px 0 #000;
  transform:translate(-2px,-2px);
}
.nav.on::after{content:"ACTIVE";margin-left:auto;font-size:8px;letter-spacing:.12em;font-weight:700;}
.nav.on .material-symbols-outlined,.nav.on small{color:var(--color-on-primary);}
.sidefoot{
  margin-top:auto;
  padding:14px 8px 4px;
  border-top:1px solid var(--color-border);
  color:var(--color-muted-foreground);
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.04em;
}

.main{flex:1 1 auto;min-width:0;padding:28px clamp(18px,3vw,46px) 52px;}
.head{
  position:relative;
  max-width:1100px;
  margin:0 0 22px;
  padding:18px 20px 19px;
  background:#10171A;
  border:1px solid var(--color-border);
  border-left:8px solid var(--color-primary);
  box-shadow:8px 8px 0 rgba(0,0,0,.55);
}
.head::after{
  content:"OPS / CONTROL";
  position:absolute;
  top:10px;
  right:14px;
  color:#758190;
  font-family:var(--mono);
  font-size:9px;
  font-weight:700;
  letter-spacing:.16em;
}
.head .kick{
  color:var(--color-primary);
  font-family:var(--mono);
  font-weight:700;
  font-size:12px;
  letter-spacing:.18em;
  text-transform:uppercase;
}
.head h1{
  margin:5px 0 4px;
  font-family:"Cinzel","Noto Sans TC",serif;
  font-size:clamp(24px,3vw,36px);
  font-weight:700;
  line-height:1.18;
  letter-spacing:.01em;
  color:#fff;
}
.head p{margin:0;max-width:760px;color:#B6C0CB;font-size:14px;line-height:1.65;}

.grid{display:grid;gap:14px;min-width:0;}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
.kpi-row{grid-template-columns:repeat(4,minmax(0,1fr));}
.span2{grid-column:span 2;min-width:0;}
.split{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(290px,1fr);gap:14px;min-width:0;}

.card,.kpi{
  min-width:0;
  background:var(--color-card);
  color:var(--color-card-foreground);
  border:1px solid var(--color-border);
  border-radius:0;
  box-shadow:5px 5px 0 rgba(0,0,0,.45);
}
.card{padding:17px;}
.card:hover,.kpi:hover{border-color:#50605F;}
.card h3{
  margin:0 0 4px;
  display:flex;
  align-items:center;
  gap:8px;
  color:#fff;
  font-size:15px;
  font-weight:700;
  letter-spacing:.035em;
}
.card h3::after{content:"";height:1px;flex:1;background:var(--color-border);margin-left:5px;}
.card h3 .material-symbols-outlined{font-size:20px;color:var(--color-primary);}
.card .sub{margin:0 0 14px;color:#AAB5C2;font-size:12px;letter-spacing:.025em;}

.kpi{
  position:relative;
  overflow:hidden;
  min-height:156px;
  padding:15px;
  border-top:4px solid var(--color-primary);
}
.kpi::after{
  content:"";
  position:absolute;
  right:-22px;
  bottom:-22px;
  width:72px;
  height:72px;
  border:1px solid #3D494D;
  transform:rotate(45deg);
}
.kpi:nth-child(even){border-top-color:var(--color-foreground);transform:translateY(8px);}
.kpi .ic{
  width:36px;
  height:36px;
  margin-bottom:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border:1px solid #77FF98;
  border-radius:0;
}
.kpi:nth-child(even) .ic{color:var(--color-primary);background:#10171A;border-color:var(--color-primary);}
.kpi .ic .material-symbols-outlined{font-size:20px;}
.kpi .v{
  position:relative;
  z-index:1;
  color:#fff;
  font-family:var(--mono);
  font-size:28px;
  font-weight:700;
  line-height:1;
  letter-spacing:-.025em;
  font-variant-numeric:tabular-nums;
}
.kpi .l{position:relative;z-index:1;margin-top:7px;color:#B7C1CD;font-size:12.5px;font-weight:600;}
.kpi .d{
  position:relative;
  z-index:1;
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin-top:9px;
  padding:2px 6px;
  border:1px solid currentColor;
  font-size:11px;
  font-weight:700;
  line-height:1.5;
}
.kpi .d.up{color:#5AFF7F;}.kpi .d.dn{color:#FF7A7A;}.kpi .d.fl{color:#C4CDD7;}

.chart{width:100%;overflow:hidden;min-width:0;color:var(--color-foreground);}
.apexcharts-canvas text{fill:#B8C2CD!important;font-family:"Josefin Sans","Noto Sans TC",sans-serif!important;}
.apexcharts-gridline{stroke:#30363D!important;}
.apexcharts-legend-text{color:#C8D1DB!important;}
.apexcharts-tooltip,.apexcharts-xaxistooltip{
  color:var(--color-foreground)!important;
  background:#10171A!important;
  border:1px solid var(--color-primary)!important;
  border-radius:0!important;
  box-shadow:4px 4px 0 #000!important;
}
.apexcharts-tooltip-title{background:var(--color-muted)!important;border-bottom-color:var(--color-border)!important;}

.tbl-wrap{overflow-x:auto;border:1px solid var(--color-border);border-radius:0;scrollbar-color:var(--color-primary) #10171A;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;font-variant-numeric:tabular-nums;}
th{
  padding:10px 12px;
  color:#D0D7DF;
  background:#10171A;
  border-right:1px solid var(--color-border);
  border-bottom:2px solid var(--color-primary);
  text-align:left;
  white-space:nowrap;
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:.09em;
  text-transform:uppercase;
}
th:last-child{border-right:0;}
td{
  padding:11px 12px;
  border-right:1px solid #293034;
  border-bottom:1px solid var(--color-border);
  white-space:nowrap;
  color:#DCE3EA;
}
td:last-child{border-right:0;}
tr:last-child td{border-bottom:0;}
tbody tr:nth-child(even){background:#151E20;}
tbody tr[style]{background:#183524!important;}
tbody tr:hover{background:#243032;}
td:first-child,td:first-child b{
  font-family:var(--mono);
  font-weight:700;
  letter-spacing:.035em;
  font-variant-numeric:tabular-nums;
}
td[style*="font-family"],.money,.stat .n,.kpi .v,.ti .no,.tl .tm{
  font-family:var(--mono)!important;
  font-variant-numeric:tabular-nums;
}
.money,.stat .n{text-align:right;}

.tag,.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:24px;
  padding:2px 8px;
  border:1px solid currentColor;
  border-radius:0;
  font-size:11px;
  font-weight:700;
  line-height:1.45;
  letter-spacing:.025em;
}
.tag::before{content:"■";font-size:7px;line-height:1;}
.pill::before{content:"//";font-family:var(--mono);font-size:10px;}
.t-ok{background:#11371C;color:#6CFF8F;}
.t-warn{background:#392F0C;color:#FFE266;}
.t-bad{background:#3C1717;color:#FF8D8D;}
.t-info{background:#132D43;color:#8BCBFF;}
.t-mut{background:#25292F;color:#C1CAD4;}
.t-pk{background:#123A20;color:#66FF89;}
.pill{background:#102F1A;color:#65FF89;}

.bar{height:9px;min-width:60px;overflow:hidden;background:#0D1117;border:1px solid #3B444C;border-radius:0;}
.bar>i{display:block;height:100%;background:var(--color-primary);border-radius:0;}

.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:10px;min-width:900px;}
.col{min-width:0;padding:10px;background:#11191B;border:1px solid var(--color-border);border-top:4px solid var(--color-primary);border-radius:0;}
.col:nth-child(even){border-top-color:#E6EDF3;}
.col .ch{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:1px 2px 10px;
  color:#fff;
  font-size:12.5px;
  font-weight:700;
  letter-spacing:.04em;
}
.col .ch .cnt{padding:1px 8px;background:var(--color-primary);border:1px solid var(--color-primary);border-radius:0;color:var(--color-on-primary);font-family:var(--mono);font-size:11px;}
.ti{margin-bottom:9px;padding:10px;background:var(--color-card);border:1px solid #3A4548;border-radius:0;box-shadow:3px 3px 0 #050708;}
.ti:last-child{margin-bottom:0;}
.ti .no{font-size:13px;color:#fff;}
.ti .meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:5px;color:#AEB8C3;font-size:11.5px;}
.lb{width:100%;height:4px;margin-bottom:9px;border-radius:0;}

.tl{position:relative;padding-left:30px;}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:3px;background:var(--color-border);}
.tl .ev{position:relative;padding:0 0 19px 5px;}
.tl .ev:last-child{padding-bottom:0;}
.tl .dot{position:absolute;left:-28px;top:2px;width:17px;height:17px;background:#10171A;border:3px solid var(--color-primary);border-radius:0;transform:rotate(45deg);}
.tl .ev.done .dot{background:var(--color-primary);box-shadow:0 0 0 2px #10171A inset;}
.tl .ev.wait .dot{border-color:#69747F;}
.tl .tt{color:#F5F7FA;font-size:13.5px;font-weight:700;}
.tl .tm{color:#AEB8C3;font-size:11.5px;letter-spacing:.04em;}
.tl .tx{margin-top:3px;color:#C0CAD4;font-size:12.5px;}

.mapbox{
  position:relative;
  height:280px;
  overflow:hidden;
  background-color:#11191B;
  background-image:
    linear-gradient(rgba(0,255,65,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,65,.08) 1px,transparent 1px);
  background-size:22px 22px;
  border:1px solid var(--color-border);
  border-radius:0;
}
.mapbox::after{content:"SPATIAL SNAPSHOT";position:absolute;right:8px;bottom:6px;color:#92A0AD;font-family:var(--mono);font-size:9px;letter-spacing:.12em;}
.mapbox .road{background:rgba(230,237,243,.14)!important;border:1px dashed rgba(230,237,243,.25);}
.pin{position:absolute;transform:translate(-50%,-100%);text-align:center;z-index:2;}
.pin .b{width:32px;height:32px;margin:0 auto;display:flex;align-items:center;justify-content:center;color:#000!important;border:2px solid #fff;border-radius:0!important;box-shadow:4px 4px 0 #000;transform:rotate(45deg)!important;}
.pin .b .material-symbols-outlined{font-size:16px;transform:rotate(-45deg)!important;}
.pin .cap{display:inline-block;margin-top:7px;padding:2px 5px;white-space:nowrap;background:#0D1117;color:#fff;border:1px solid #AEB8C3;border-radius:0;font-family:var(--mono);font-size:10px;font-weight:700;}

.stat{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--color-border);color:#D5DDE5;font-size:13px;}
.stat:last-child{border-bottom:0;}
.stat .n{margin-left:auto;color:#fff;font-weight:700;}
.dot-s{width:11px;height:11px;flex:0 0 auto;border:2px solid #fff;border-radius:0;}
.feebox{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--color-border);}
.feerow{display:flex;justify-content:space-between;gap:16px;padding:9px 5px;border-bottom:1px dashed #536069;color:#D6DEE6;font-size:13px;}
.feerow.tot{margin-top:5px;padding:13px 5px 8px;border-top:3px solid var(--color-primary);border-bottom:0;color:#fff;font-size:17px;font-weight:700;}
.feerow .money{margin-left:auto;font-weight:700;white-space:nowrap;}

.ai{
  position:relative;
  overflow:hidden;
  background:#102A18;
  color:#fff;
  border:2px solid var(--color-primary);
  box-shadow:8px 8px 0 #001B07;
}
.ai::before{content:"SYSTEM ANALYSIS";display:inline-block;margin-bottom:13px;padding:3px 7px;background:var(--color-primary);color:var(--color-on-primary);font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.13em;}
.ai h3,.ai h3 .material-symbols-outlined{color:#fff;}
.ai h3::after{background:#387248;}
.ai .sub{color:#BEE7C9;}
.ai .li{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;color:#E7F8EB;font-size:13px;line-height:1.6;}
.ai .li .material-symbols-outlined{flex:0 0 auto;margin-top:2px;color:var(--color-primary);font-size:18px;}
.ai .li:last-child{margin-bottom:0;}

@media (prefers-reduced-motion:no-preference){
  .kpi,.card,.col{
    animation:ops-in .42s cubic-bezier(.2,.9,.25,1.35) both;
  }
  .kpi:nth-child(2),.card:nth-child(2),.col:nth-child(2){animation-delay:.06s;}
  .kpi:nth-child(3),.card:nth-child(3),.col:nth-child(3){animation-delay:.12s;}
  .kpi:nth-child(4),.card:nth-child(4),.col:nth-child(4){animation-delay:.18s;}
  @keyframes ops-in{
    from{opacity:0;transform:translateY(16px) scale(.92);}
    to{opacity:1;transform:translateY(0) scale(1);}
  }
  .kpi:nth-child(even){animation-name:ops-in-offset;}
  @keyframes ops-in-offset{
    from{opacity:0;transform:translateY(24px) scale(.92);}
    to{opacity:1;transform:translateY(8px) scale(1);}
  }
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important;}
  .nav:hover{transform:none;}
}

@media(max-width:1100px){
  .g4,.kpi-row{grid-template-columns:repeat(2,minmax(0,1fr));}
  .split{grid-template-columns:1fr;}
}
@media(max-width:860px){
  .app{flex-direction:column;}
  .side{
    width:auto;
    height:auto;
    position:static;
    flex:none;
    padding:12px;
    border-right:0;
    border-bottom:3px solid var(--color-primary);
  }
  .brand{min-height:0;padding:2px 4px 12px;}
  .brand .logo{width:42px;height:42px;flex-basis:42px;}
  .navwrap{flex-direction:row;flex-wrap:nowrap;gap:7px;overflow-x:auto;padding:2px 2px 8px;scrollbar-color:var(--color-primary) #10171A;}
  .nav{width:auto;min-width:146px;flex:0 0 auto;padding:9px 11px;}
  .nav:hover{transform:none;}
  .nav.on{transform:none;box-shadow:3px 3px 0 #000;}
  .sidefoot{display:none;}
  .main{padding:19px 16px 40px;}
  .head{box-shadow:5px 5px 0 rgba(0,0,0,.55);}
}
@media(max-width:768px){
  .g2,.g3,.split{grid-template-columns:1fr;}
  .span2{grid-column:span 1;}
  .board{grid-template-columns:repeat(4,minmax(210px,1fr));}
  .head::after{display:none;}
}
@media(max-width:560px){
  body{background-size:24px 24px;}
  .main{padding-inline:12px;}
  .nav{min-width:52px;min-height:48px;justify-content:center;padding:10px;}
  .nav .lab,.nav.on::after{display:none;}
  .g4,.kpi-row{grid-template-columns:1fr;}
  .kpi:nth-child(even){transform:none;}
  .head{padding:15px;border-left-width:5px;}
  .head h1{font-size:23px;}
  .card{padding:14px;}
  .kpi{min-height:142px;}
  .kpi .v{font-size:25px;}
  .mapbox{height:240px;}
}
@media(max-width:375px){
  .main{padding-inline:9px;}
  .card{padding:12px;}
  .head p{font-size:13px;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">emergency</span></div>
      <div><b>拖吊派遣</b><span>道路救援調度平台</span></div>
    </div>
    <div class="navwrap" id="nav"></div>
    <div class="sidefoot">純 UI 展示 · 擬真資料<br/>© 2026 JVision Demo</div>
  </aside>
  <main class="main">

var SCREENS=[s0,s1,s2,s3,s4,s5];

function buildNav(){
  var nav=document.getElementById("nav");
  nav.innerHTML=MODS.map(function(m,i){
    return '<button class="nav" data-i="'+i+'"><span class="material-symbols-outlined">'+m.ic+'</span><span class="lab"><span>'+m.name+'</span><small>'+m.sub+'</small></span></button>';
  }).join("");
  var btns=nav.querySelectorAll("[data-i]");
  for(var i=0;i<btns.length;i++){
    btns[i].addEventListener("click",function(){show(+this.getAttribute("data-i"));});
  }
}

function show(i){
  clearCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i);}
  var h=HEADS[i];
  document.getElementById("head").innerHTML='<div class="kick">'+h.k+'</div><h1>'+h.t+'</h1><p>'+h.p+'</p>';
  var c=document.getElementById("screen");
  c.innerHTML="";
  void c.offsetHeight;
  SCREENS[i](c);
  try{window.scrollTo(0,0);}catch(e){}
}

buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
