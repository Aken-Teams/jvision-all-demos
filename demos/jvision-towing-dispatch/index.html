<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>道路救援調度 · 拖吊派遣平台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#db2777; --accent2:#f472b6; --accent-soft:#fce7f3;
  --bg:#f7f5f7; --panel:#ffffff; --ink:#1e1720; --mut:#8a7f88; --line:#efe7ee;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",sans-serif;
  background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.app{display:flex; min-height:100vh; align-items:stretch;}
.side{
  width:250px; flex:0 0 250px; background:var(--panel);
  border-right:1px solid var(--line); padding:20px 16px;
  display:flex; flex-direction:column; gap:6px; position:sticky; top:0; height:100vh; overflow:auto;
}
.brand{display:flex; align-items:center; gap:11px; padding:6px 8px 16px;}
.brand .logo{
  width:42px;height:42px;border-radius:12px;flex:0 0 42px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 16px rgba(219,39,119,.35);
}
.brand .logo .material-symbols-outlined{font-size:24px;}
.brand b{font-size:16px;font-weight:800;letter-spacing:.3px;display:block;}
.brand span{font-size:11.5px;color:var(--mut);}
.navwrap{display:flex;flex-direction:column;gap:4px;}
.nav{
  display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;
  cursor:pointer;color:#5c5460;font-weight:600;font-size:14px;border:1px solid transparent;
  background:none;text-align:left;width:100%;min-width:0;transition:background .12s;
}
.nav .material-symbols-outlined{font-size:21px;color:var(--mut);flex:0 0 auto;}
.nav small{display:block;font-size:11px;color:var(--mut);font-weight:500;}
.nav .lab{min-width:0;}
.nav:hover{background:var(--accent-soft);}
.nav.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 6px 14px rgba(219,39,119,.3);}
.nav.on .material-symbols-outlined,.nav.on small{color:#fff;}
.sidefoot{margin-top:auto;padding:12px 10px 4px;font-size:11px;color:var(--mut);border-top:1px solid var(--line);}
.main{flex:1 1 auto;min-width:0;padding:26px 30px 46px;}
.head{margin-bottom:20px;}
.head .kick{color:var(--accent);font-weight:700;font-size:12.5px;letter-spacing:1px;text-transform:uppercase;}
.head h1{margin:4px 0 5px;font-size:23px;font-weight:800;}
.head p{margin:0;color:var(--mut);font-size:13.5px;max-width:640px;}
.grid{display:grid;gap:16px;min-width:0;}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
.kpi-row{grid-template-columns:repeat(4,minmax(0,1fr));}
.span2{grid-column:span 2;min-width:0;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;}
.card h3{margin:0 0 3px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
.card .sub{color:var(--mut);font-size:12px;margin:0 0 14px;}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;position:relative;overflow:hidden;min-width:0;}
.kpi .ic{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
.kpi .ic .material-symbols-outlined{font-size:21px;}
.kpi .v{font-size:26px;font-weight:800;line-height:1;font-family:"Inter";}
.kpi .l{font-size:12.5px;color:var(--mut);margin-top:6px;}
.kpi .d{font-size:11.5px;font-weight:700;margin-top:8px;display:inline-flex;align-items:center;gap:3px;}
.kpi .d.up{color:var(--ok);}.kpi .d.dn{color:var(--bad);}.kpi .d.fl{color:var(--mut);}
.chart{width:100%;overflow:hidden;min-width:0;}
.tbl-wrap{overflow-x:auto;border-radius:12px;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
th{text-align:left;padding:10px 12px;color:var(--mut);font-weight:700;font-size:11.5px;letter-spacing:.4px;border-bottom:2px solid var(--line);white-space:nowrap;text-transform:uppercase;}
td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;line-height:1.5;}
.t-ok{background:#dcfce7;color:#15803d;}
.t-warn{background:#fef3c7;color:#b45309;}
.t-bad{background:#fee2e2;color:#b91c1c;}
.t-info{background:#dbeafe;color:#1d4ed8;}
.t-mut{background:#f1f0f2;color:#6b6470;}
.t-pk{background:var(--accent-soft);color:var(--accent);}
.pill{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;background:var(--accent-soft);color:var(--accent);}
.bar{height:7px;border-radius:5px;background:var(--line);overflow:hidden;min-width:60px;}
.bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;min-width:0;}
.col{background:#faf7f9;border:1px solid var(--line);border-radius:14px;padding:11px;min-width:0;}
.col .ch{font-size:12.5px;font-weight:800;margin:2px 4px 10px;display:flex;justify-content:space-between;align-items:center;}
.col .ch .cnt{background:#fff;border:1px solid var(--line);color:var(--mut);border-radius:20px;padding:0 8px;font-size:11px;}
.ti{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(0,0,0,.02);}
.ti .no{font-weight:800;font-size:13px;}
.ti .meta{font-size:11.5px;color:var(--mut);margin-top:4px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.lb{width:100%;height:4px;border-radius:4px;margin-bottom:9px;}
.tl{position:relative;padding-left:26px;}
.tl:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl .ev{position:relative;padding:0 0 18px 4px;}
.tl .ev:last-child{padding-bottom:0;}
.tl .dot{position:absolute;left:-24px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;border:3px solid var(--accent);}
.tl .ev.done .dot{background:var(--accent);}
.tl .ev.wait .dot{border-color:var(--line);}
.tl .tt{font-weight:700;font-size:13.5px;}
.tl .tm{font-size:11.5px;color:var(--mut);}
.tl .tx{font-size:12.5px;color:#655d69;margin-top:3px;}
.mapbox{position:relative;background:linear-gradient(135deg,#fdf2f8,#f5f3ff);border:1px solid var(--line);border-radius:14px;height:280px;overflow:hidden;}
.mapbox .road{position:absolute;background:rgba(219,39,119,.12);}
.pin{position:absolute;transform:translate(-50%,-100%);text-align:center;}
.pin .b{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.2);margin:0 auto;}
.pin .b .material-symbols-outlined{transform:rotate(45deg);font-size:16px;}
.pin .cap{font-size:10px;font-weight:700;background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 5px;margin-top:3px;white-space:nowrap;display:inline-block;}
.stat{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
.stat:last-child{border-bottom:none;}
.stat .n{margin-left:auto;font-weight:800;font-family:"Inter";}
.dot-s{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
.feebox{display:flex;flex-direction:column;gap:9px;}
.feerow{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line);}
.feerow.tot{border-bottom:none;border-top:2px solid var(--ink);margin-top:4px;padding-top:11px;font-weight:800;font-size:16px;}
.feerow .money{font-family:"Inter";font-weight:700;}
.ai{background:linear-gradient(135deg,#831843,#db2777);color:#fff;border:none;}
.ai h3,.ai h3 .material-symbols-outlined{color:#fff;}
.ai .sub{color:#fbcfe8;}
.ai .li{display:flex;gap:10px;align-items:flex-start;font-size:13px;margin-bottom:12px;line-height:1.55;}
.ai .li .material-symbols-outlined{font-size:18px;color:#fbcfe8;flex:0 0 auto;margin-top:1px;}
.ai .li:last-child{margin-bottom:0;}
.split{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;min-width:0;}
@media(max-width:860px){
  .app{flex-direction:column;}
  .side{width:auto;flex:none;height:auto;position:static;flex-direction:column;border-right:none;border-bottom:1px solid var(--line);}
  .navwrap{flex-direction:row;flex-wrap:wrap;gap:8px;}
  .nav{width:auto;flex:0 0 auto;padding:9px 13px;}
  .nav small{display:none;}
  .sidefoot{display:none;}
  .brand{padding-bottom:12px;}
  .main{padding:20px 18px 40px;}
}
@media(max-width:820px){
  .g2,.g3,.g4,.kpi-row,.split{grid-template-columns:1fr;}
  .span2{grid-column:span 1;}
  .board{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media(max-width:560px){
  .nav .lab{display:none;}
  .nav{padding:10px;}
  .board{grid-template-columns:1fr;}
  .head h1{font-size:20px;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">emergency</span></div>
      <div><b>拖吊派遣</b><span>道路救援調度平台</span></div>
    </div>
    <div class="navwrap" id="nav"></div>
    <div class="sidefoot">純 UI 展示 · 擬真資料<br/>© 2026 JVision Demo</div>
  </aside>
  <main class="main">
    <div class="head" id="head"></div>
    <div id="screen"></div>
  </main>
</div>
<script>
"use strict";
var charts=[];
function clearCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function mk(id,opt){
  var elm=document.getElementById(id); if(!elm)return;
  opt.chart=opt.chart||{}; opt.chart.redrawOnParentResize=false; opt.chart.redrawOnWindowResize=false;
  opt.chart.animations={enabled:false}; opt.chart.fontFamily='Inter,"Noto Sans TC",sans-serif';
  opt.chart.toolbar={show:false};
  try{var ch=new ApexCharts(elm,opt);ch.render();charts.push(ch);}catch(e){}
}
var PINK="#db2777",PINK2="#f472b6";

var MODS=[
  {ic:"receipt_long",name:"救援接單",sub:"報案受理 · 案件建立"},
  {ic:"account_tree",name:"智慧派遣",sub:"就近派車 · 拖吊指派"},
  {ic:"engineering",name:"司機任務",sub:"現場任務 · 拖回進度"},
  {ic:"monitoring",name:"車隊看板",sub:"拖吊車狀態 · 定位"},
  {ic:"gavel",name:"扣車管理",sub:"入場放行 · 停置費"},
  {ic:"request_quote",name:"帳務收款",sub:"計費對帳 · 收款結案"}
];
var HEADS=[
  {k:"CASE INTAKE",t:"救援接單",p:"接聽求援電話，記錄事故位置、車型與故障狀況，建立救援案件並判定拖吊等級。"},
  {k:"DISPATCH",t:"智慧派遣",p:"依定位、車型與到場時效，從空閒車隊中指派最適拖吊車與司機並推播任務單。"},
  {k:"DRIVER TASK",t:"司機任務",p:"司機到場執行拖吊，回報現場照片、里程與拖回進度，即時更新任務狀態。"},
  {k:"FLEET LIVE",t:"車隊即時看板",p:"監控全隊拖吊車在線狀態、位置分布與負載，掌握可派遣量能。"},
  {k:"IMPOUND",t:"扣車管理",p:"拖回車輛入場登記、計算停置費，控管放行條件與滯留天數。"},
  {k:"BILLING",t:"帳務收款",p:"彙整拖吊費、停置費與保險分攤，完成對帳收款並產出結案紀錄。"}
];

function kpi(ic,v,l,d,dir){
  return '<div class="kpi"><div class="ic"><span class="material-symbols-outlined">'+ic+'</span></div>'+
  '<div class="v">'+v+'</div><div class="l">'+l+'</div>'+
  (d?'<div class="d '+dir+'"><span class="material-symbols-outlined" style="font-size:15px">'+(dir==="up"?"trending_up":dir==="dn"?"trending_down":"remove")+'</span>'+d+'</div>':'')+'</div>';
}

/* SCREEN 0 : 救援接單 */
function s0(c){
  var cases=[
    {no:"RS-4821",t:"09:12",loc:"國道1號北向 62.4K",car:"自小客 · 拋錨",lv:"一般拖吊",src:"保險受理",st:"待派遣",cls:"t-warn"},
    {no:"RS-4820",t:"09:05",loc:"市民大道 3 段",car:"休旅車 · 電瓶",lv:"路邊搭電",src:"會員專線",st:"已派遣",cls:"t-info"},
    {no:"RS-4819",t:"08:51",loc:"環東大道匝道",car:"貨車 · 事故",lv:"重型拖吊",src:"110轉介",st:"救援中",cls:"t-pk"},
    {no:"RS-4818",t:"08:33",loc:"信義路五段",car:"自小客 · 爆胎",lv:"換胎服務",src:"會員專線",st:"已完成",cls:"t-ok"},
    {no:"RS-4817",t:"08:20",loc:"辛亥路隧道口",car:"機車 · 故障",lv:"機車拖運",src:"路人報案",st:"已完成",cls:"t-ok"}
  ];
  var rows=cases.map(function(x){
    return '<tr><td><b>'+x.no+'</b></td><td>'+x.t+'</td><td>'+x.loc+'</td><td>'+x.car+'</td><td><span class="pill">'+x.lv+'</span></td><td>'+x.src+'</td><td><span class="tag '+x.cls+'">'+x.st+'</span></td></tr>';
  }).join("");
  c.innerHTML=
  '<div class="grid kpi-row" style="margin-bottom:16px">'+
    kpi("call","38","今日受理案件","+12%","up")+
    kpi("timer","1.8 分","平均受理時長","-24s","up")+
    kpi("pending_actions","6","待派遣案件","需關注","fl")+
    kpi("verified","98.2%","報案完整率","+1.4%","up")+
  '</div>'+
  '<div class="grid split">'+
    '<div class="card"><h3><span class="material-symbols-outlined">receipt_long</span>今日報案受理清單</h3><p class="sub">依受理時間排序 · 拖吊等級自動判定</p>'+
      '<div class="tbl-wrap"><table><thead><tr><th>案件</th><th>時間</th><th>事故地點</th><th>車型/狀況</th><th>拖吊等級</th><th>來源</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>報案來源占比</h3><p class="sub">近 7 日彙整</p><div id="c0" class="chart"></div></div>'+
  '</div>'+
  '<div class="grid g2" style="margin-top:16px">'+
    '<div class="card"><h3><span class="material-symbols-outlined">insights</span>每小時進線量</h3><p class="sub">今日 06:00–12:00</p><div id="c0b" class="chart"></div></div>'+
    '<div class="card ai"><h3><span class="material-symbols-outlined">smart_toy</span>AI 受理摘要</h3><p class="sub">依即時進線自動彙整</p>'+
      '<div class="li"><span class="material-symbols-outlined">priority_high</span>國道 1 號北向連 3 起拋錨，建議預派 1 台重型拖吊至楊梅駐點待命。</div>'+
      '<div class="li"><span class="material-symbols-outlined">schedule</span>尖峰進線落在 08:00–09:00，本時段人力已達 92% 負載。</div>'+
      '<div class="li"><span class="material-symbols-outlined">shield</span>保險受理案件占 41%，均已自動帶入保單分攤比例。</div></div>'+
  '</div>';
  void c.offsetHeight;
  mk("c0",{chart:{type:"donut",height:250},labels:["會員專線","保險受理","110轉介","路人報案"],series:[42,31,15,12],
    colors:[PINK,PINK2,"#a855f7","#fbcfe8"],legend:{position:"bottom"},dataLabels:{enabled:true},stroke:{width:0},
    plotOptions:{pie:{donut:{size:"64%"}}}});
  mk("c0b",{chart:{type:"area",height:250},series:[{name:"進線量",data:[9,14,22,31,26,18]}],colors:[PINK],
    stroke:{curve:"smooth",width:2},fill:{type:"gradient",gradient:{opacityFrom:.4,opacityTo:.05}},dataLabels:{enabled:false},
    xaxis:{categories:["06","07","08","09","10","11"]},grid:{borderColor:"#f0eaef"}});
}

/* SCREEN 1 : 智慧派遣 */
function s1(c){
  var cand=[
    {v:"拖-A12",dr:"陳志明",type:"重型拖吊",eta:"6 分",dist:"2.1 km",load:"空閒",sc:96,best:true},
    {v:"拖-B07",dr:"林建宏",type:"一般拖吊",eta:"9 分",dist:"3.8 km",load:"空閒",sc:88,best:false},
    {v:"拖-C21",dr:"王大偉",type:"重型拖吊",eta:"14 分",dist:"6.2 km",load:"任務中",sc:71,best:false},
    {v:"拖-A05",dr:"張家豪",type:"平板拖車",eta:"18 分",dist:"8.0 km",load:"空閒",sc:64,best:false}
  ];
  var rows=cand.map(function(x){
    return '<tr'+(x.best?' style="background:#fdf2f8"':'')+'><td><b>'+x.v+'</b>'+(x.best?' <span class="tag t-pk">建議</span>':'')+'</td><td>'+x.dr+'</td><td>'+x.type+'</td><td>'+x.eta+'</td><td>'+x.dist+'</td><td><span class="tag '+(x.load==="空閒"?"t-ok":"t-warn")+'">'+x.load+'</span></td>'+
    '<td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i style="width:'+x.sc+'%"></i></div><b style="font-family:Inter">'+x.sc+'</b></div></td></tr>';
  }).join("");
  var pins=[
    {x:52,y:40,c:PINK,ic:"emergency",cap:"報案 RS-4821"},
    {x:38,y:58,c:"#16a34a",ic:"local_shipping",cap:"拖-A12"},
    {x:66,y:30,c:"#2563eb",ic:"local_shipping",cap:"拖-B07"},
    {x:74,y:66,c:"#d97706",ic:"local_shipping",cap:"拖-C21"}
  ];
  var pinHtml=pins.map(function(p){
    return '<div class="pin" style="left:'+p.x+'%;top:'+p.y+'%"><div class="b" style="background:'+p.c+'"><span class="material-symbols-outlined">'+p.ic+'</span></div><div class="cap">'+p.cap+'</div></div>';
  }).join("");
  c.innerHTML=
  '<div class="grid kpi-row" style="margin-bottom:16px">'+
    kpi("bolt","4.2 分","平均派遣決策","-38%","up")+
    kpi("near_me","6.4 km","平均到場距離","-1.1km","up")+
    kpi("directions_car","23","可派遣車輛","即時","fl")+
    kpi("target","94%","時效達成率","+6%","up")+
  '</div>'+
  '<div class="grid split">'+

var SCREENS=[s0,s1,s2,s3,s4,s5];

function buildNav(){
  var nav=document.getElementById("nav");
  nav.innerHTML=MODS.map(function(m,i){
    return '<button class="nav" data-i="'+i+'"><span class="material-symbols-outlined">'+m.ic+'</span><span class="lab"><span>'+m.name+'</span><small>'+m.sub+'</small></span></button>';
  }).join("");
  var btns=nav.querySelectorAll("[data-i]");
  for(var i=0;i<btns.length;i++){
    btns[i].addEventListener("click",function(){show(+this.getAttribute("data-i"));});
  }
}

function show(i){
  clearCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i);}
  var h=HEADS[i];
  document.getElementById("head").innerHTML='<div class="kick">'+h.k+'</div><h1>'+h.t+'</h1><p>'+h.p+'</p>';
  var c=document.getElementById("screen");
  c.innerHTML="";
  void c.offsetHeight;
  SCREENS[i](c);
  try{window.scrollTo(0,0);}catch(e){}
}

buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
