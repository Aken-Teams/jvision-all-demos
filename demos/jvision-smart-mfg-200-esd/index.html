<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ESD 靜電敏感元件倉儲管理系統｜Jvision 系統 Demo</title>
<meta name="description" content="ESD 料件建檔、防靜電包裝管控、儲區靜電監控、搬運稽核與合規報表" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#a16207;--accent2:#eab308;--ink:#1c1917;--mut:#78716c;--line:#e7e5e4;
  --bg:#faf9f7;--card:#ffffff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--soft:#fef9ec;
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;padding:0}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
a{color:inherit;text-decoration:none}

/* top nav */
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(90deg,#3f2d0a,#5a3f0e);color:#fff;border-bottom:3px solid var(--accent2)}
.tb-inner{max-width:1360px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent2),var(--accent));display:flex;align-items:center;justify-content:center;color:#3f2d0a;flex:0 0 auto}
.brand .logo .material-symbols-outlined{font-size:24px}
.brand b{font-size:15px;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;color:#f5e6bf;font-size:11px;font-weight:500}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.tab{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:9px;color:#f0e6cf;font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;background:transparent;line-height:1}
.tab .material-symbols-outlined{font-size:19px}
.tab:hover{background:rgba(255,255,255,.09)}
.tab.on{background:var(--accent2);color:#3f2d0a;border-color:var(--accent2)}

main{max-width:1360px;margin:0 auto;padding:22px 18px 60px}
.screen-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.screen-head h1{font-size:20px;margin:0 0 4px;font-weight:800}
.screen-head p{margin:0;color:var(--mut);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--accent);border:1px solid #f3e2b6;padding:6px 12px;border-radius:99px;font-size:12px;font-weight:700}
.pill .material-symbols-outlined{font-size:16px}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1fr 2fr}
@media(max-width:820px){.g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{margin:0 0 12px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.sub{color:var(--mut);font-size:12px;font-weight:500}

/* KPI */
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent2)}
.kpi .k-top{display:flex;align-items:center;justify-content:space-between}
.kpi .k-ic{width:34px;height:34px;border-radius:9px;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.kpi .k-ic .material-symbols-outlined{font-size:20px}
.kpi .k-val{font-size:26px;font-weight:900;margin:8px 0 2px;letter-spacing:-.5px}
.kpi .k-lab{font-size:12px;color:var(--mut);font-weight:600}
.kpi .k-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.t-ok{background:#dcfce7;color:#15803d}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}

/* table */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.5px;color:var(--mut);text-transform:uppercase;font-weight:700;background:#fbfaf8}
tbody tr:hover{background:#fdfaf2}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700}
.b-ok{background:#dcfce7;color:#15803d}.b-warn{background:#fef3c7;color:#b45309}.b-bad{background:#fee2e2;color:#b91c1c}.b-info{background:#e0e7ff;color:#4338ca}.b-mut{background:#f1f0ee;color:#57534e}
.lv{font-weight:800;padding:2px 8px;border-radius:6px;font-size:12px}
.lv1{background:#fee2e2;color:#b91c1c}.lv2{background:#ffedd5;color:#c2410c}.lv3{background:#fef3c7;color:#b45309}

.chart{width:100%;overflow:hidden}

/* progress bar */
.bar{height:8px;border-radius:99px;background:#f1efec;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}

/* board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:820px){.board{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.board{grid-template-columns:1fr}}
.col{background:#fbfaf8;border:1px solid var(--line);border-radius:12px;padding:10px}
.col>.col-h{font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;color:var(--ink)}
.col>.col-h span.cnt{background:#fff;border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:11px;color:var(--mut)}
.tk{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;padding:9px 10px;margin-bottom:8px}
.tk b{font-size:12.5px;display:block}
.tk .m{font-size:11px;color:var(--mut);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:0 0 16px 6px}
.tl .ev::before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.tl .ev.warn::before{border-color:var(--warn)}.tl .ev.bad::before{border-color:var(--bad)}
.tl .ev .tt{font-size:12.5px;font-weight:700}
.tl .ev .dd{font-size:11.5px;color:var(--mut);margin-top:2px}
.tl .ev .tm{font-size:11px;color:var(--accent);font-weight:700}

/* meter row (env monitor) */
.meter{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.meter:last-child{border-bottom:none}
.meter .mn{font-size:13px;font-weight:700;width:120px;flex:0 0 auto}
.meter .mv{font-size:16px;font-weight:900;width:96px;flex:0 0 auto;text-align:right}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.d-ok{background:var(--ok)}.d-warn{background:var(--warn)}.d-bad{background:var(--bad)}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}

.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:26px}
.rowflex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:#f4f2ef;color:#57534e}

@media(max-width:560px){.tab span.txt{display:none}.tab{padding:8px 10px}}
</style>
</head>
<body>
<div class="topbar">
  <div class="tb-inner">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">bolt</span></div>
      <div><b>ESD 靜電敏感元件倉儲管理</b><small>ESD Sensitive Device Storage Management</small></div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</div>
<main><div id="view"></div>
<div class="foot">Jvision 系統 Demo · 純前端展示 · 模擬資料</div>
</main>
<script>
(function(){
"use strict";
var accent="#a16207",accent2="#eab308",gridc="#eee9df";
var MODS=[
  {ic:"inventory_2",name:"ESD 料件建檔"},
  {ic:"shield",name:"防靜電包裝管控"},
  {ic:"thermostat",name:"儲區靜電監控"},
  {ic:"fact_check",name:"搬運稽核"},
  {ic:"warning",name:"靜電異常通報"},
  {ic:"verified",name:"合規報表"}
];
var view=document.getElementById("view");
var charts=[];
function clearCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function el(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}

/* build nav */
(function(){
  var h="";
  for(var i=0;i<MODS.length;i++){
    h+='<button class="tab" data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].ic+'</span><span class="txt">'+MODS[i].name+'</span></button>';
  }
  el("tabs").innerHTML=h;
  var b=el("tabs").querySelectorAll(".tab");
  for(var j=0;j<b.length;j++){(function(k){b[k].addEventListener("click",function(){location.hash="v"+k;});})(j);}
})();

function baseChart(extra){
  var o={chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:'Inter,"Noto Sans TC",sans-serif'},
    grid:{borderColor:gridc},dataLabels:{enabled:false},legend:{labels:{colors:"#57534e"}}};
  for(var k in extra)o[k]=extra[k];
  return o;
}
function mk(id,opt){var n=el(id);if(!n)return;var c=new ApexCharts(n,opt);c.render();charts.push(c);}

/* ================= SCREEN 0 : ESD 料件建檔 ================= */
function s0(){
  var rows=[
    {p:"MLCC-0402-X7R",n:"多層陶瓷電容",cls:"HBM Class 1A",v:"250V",loc:"D-ESD-A12",qty:"18,400",unit:"顆",pkg:"防靜電乾燥",st:"已建檔"},
    {p:"IC-MCU-STM32",n:"32 位元微控制器",cls:"HBM Class 2",v:"1000V",loc:"D-ESD-B07",qty:"3,260",unit:"顆",pkg:"屏蔽袋",st:"已建檔"},
    {p:"LED-SMD-0603",n:"表面貼裝 LED",cls:"HBM Class 3A",v:"6000V",loc:"D-ESD-C21",qty:"42,800",unit:"顆",pkg:"防靜電捲盤",st:"待標示"},
    {p:"MOSFET-N-30V",n:"N 通道功率電晶體",cls:"CDM Class C1",v:"200V",loc:"D-ESD-A03",qty:"7,150",unit:"顆",pkg:"導電托盤",st:"已建檔"},
    {p:"CONN-BTB-40P",n:"板對板連接器",cls:"HBM Class 3B",v:"8000V",loc:"D-ESD-D14",qty:"1,920",unit:"組",pkg:"屏蔽袋",st:"待標示"},
    {p:"SENSOR-IMU-6X",n:"六軸慣性感測器",cls:"CDM Class C3",v:"500V",loc:"D-ESD-B18",qty:"2,540",unit:"顆",pkg:"防靜電乾燥",st:"複核中"}
  ];
  var kh=function(ic,val,lab,tag,tc){return '<div class="kpi"><div class="k-top"><div class="k-ic"><span class="material-symbols-outlined">'+ic+'</span></div><span class="k-tag '+tc+'">'+tag+'</span></div><div class="k-val">'+val+'</div><div class="k-lab">'+lab+'</div></div>';};
  var tr="";
  for(var i=0;i<rows.length;i++){var r=rows[i];
    var lc=r.cls.indexOf("1")>-1?"lv1":(r.cls.indexOf("2")>-1||r.cls.indexOf("C1")>-1?"lv2":"lv3");
    var sb=r.st==="已建檔"?"b-ok":(r.st==="待標示"?"b-warn":"b-info");
    tr+='<tr><td><b>'+r.p+'</b><br><span class="sub">'+r.n+'</span></td><td><span class="lv '+lc+'">'+r.cls+'</span></td><td>'+r.v+'</td><td>'+r.loc+'</td><td style="text-align:right">'+r.qty+' <span class="sub">'+r.unit+'</span></td><td>'+r.pkg+'</td><td><span class="badge '+sb+'">'+r.st+'</span></td></tr>';
  }
  view.innerHTML=
   head("ESD 料件建檔","收貨後標示靜電敏感等級並完成分類建檔，指定專屬防靜電儲區","inventory_2","入庫標示 · 階段 v0")
  +'<div class="grid g4">'
   +kh("inventory_2","1,286","ESD 料號總數","+24 本月","t-ok")
   +kh("label","94.6%","標示建檔完成率","達標","t-ok")
   +kh("hourglass_top","18","待標示料件","需處理","t-warn")
   +kh("bolt","3","高敏感 Class 1","嚴管","t-bad")
  +'</div>'
  +'<div class="grid g23" style="margin-top:14px">'
   +'<div class="card"><h3><span class="material-symbols-outlined">table_rows</span>ESD 料件分類建檔清單</h3><div class="tbl-wrap"><table><thead><tr><th>料號 / 品名</th><th>敏感等級</th><th>耐壓門檻</th><th>儲位</th><th>庫存</th><th>包裝型式</th><th>狀態</th></tr></thead><tbody>'+tr+'</tbody></table></div></div>'
   +'<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>敏感等級分布</h3><div id="c0a" class="chart"></div><div class="legend"><span><i style="background:'+accent+'"></i>HBM 人體放電</span><span><i style="background:'+accent2+'"></i>CDM 元件放電</span><span><i style="background:#d97706"></i>MM 機器放電</span></div></div>'
  +'</div>';
  void view.offsetHeight;
  mk("c0a",baseChart({chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"donut",height:250},series:[642,468,176],labels:["HBM 人體放電模型","CDM 元件充電模型","MM 機器放電模型"],colors:[accent,accent2,"#d97706"],legend:{show:false},plotOptions:{pie:{donut:{size:"62%",labels:{show:true,total:{show:true,label:"ESD 料號",formatter:function(){return"1,286";}}}}}}}));
}

/* ================= SCREEN 1 : 防靜電包裝管控 ================= */
function s1(){
  var rules=[
    {r:"RULE-P01",d:"HBM Class 1 須雙層屏蔽袋＋濕度指示卡",pass:98},
    {r:"RULE-P02",d:"含濕料件須附乾燥劑並標示開封效期",pass:92},
    {r:"RULE-P03",d:"捲盤料件僅可用防靜電（表面電阻 10⁶–10⁹Ω）",pass:96},
    {r:"RULE-P04",d:"托盤料件禁用一般 PS，須導電 ESD 托盤",pass:88}
  ];
  var chk=[
    {b:"PKG-24081201",p:"IC-MCU-STM32",pkg:"屏蔽袋雙層",hum:"32%RH",st:"合格"},
    {b:"PKG-24081202",p:"MLCC-0402-X7R",pkg:"防靜電乾燥",hum:"28%RH",st:"合格"},
    {b:"PKG-24081203",p:"CONN-BTB-40P",pkg:"單層屏蔽袋",hum:"48%RH",st:"退回"},
    {b:"PKG-24081204",p:"MOSFET-N-30V",pkg:"導電托盤",hum:"—",st:"合格"},
    {b:"PKG-24081205",p:"LED-SMD-0603",pkg:"一般 PE 袋",hum:"52%RH",st:"退回"},
    {b:"PKG-24081206",p:"SENSOR-IMU-6X",pkg:"屏蔽袋＋乾燥",hum:"25%RH",st:"複檢"}
  ];
  var rl="";
  for(var i=0;i<rules.length;i++){var x=rules[i];var tc=x.pass>=95?accent:(x.pass>=90?"#d97706":"#dc2626");
    rl+='<div style="margin-bottom:13px"><div class="rowflex" style="justify-content:space-between"><b style="font-size:12.5px">'+x.r+'</b><span class="sub" style="font-weight:700;color:'+tc+'">'+x.pass+'%</span></div><div class="sub" style="margin:4px 0 6px">'+x.d+'</div><div class="bar"><i style="width:'+x.pass+'%"></i></div></div>';
  }
  var cr="";
  for(var j=0;j<chk.length;j++){var c=chk[j];var sb=c.st==="合格"?"b-ok":(c.st==="退回"?"b-bad":"b-warn");
    cr+='<tr><td><b>'+c.b+'</b></td><td>'+c.p+'</td><td>'+c.pkg+'</td><td>'+c.hum+'</td><td><span class="badge '+sb+'">'+c.st+'</span></td></tr>';
  }
  view.innerHTML=
   head("防靜電包裝管控","依料件等級套用防靜電包裝規則，檢核屏蔽袋、乾燥劑與封裝合規性","shield","包裝檢核 · 階段 v1")
  +'<div class="grid g4">'
   +kpi("shield","93.6%","包裝合規率","+2.1%","t-ok")
   +kpi("inventory","642","本週檢核批次","累計","t-ok")
   +kpi("assignment_return","23","退回重工批次","關注","t-warn")
   +kpi("water_drop","36%RH","平均封裝濕度","正常","t-ok")
  +'</div>'
  +'<div class="grid g32" style="margin-top:14px">'
   +'<div class="card"><h3><span class="material-symbols-outlined">rule</span>包裝規則合規率</h3>'+rl+'</div>'
   +'<div class="card"><h3><span class="material-symbols-outlined">fact_check</span>封裝檢核批次紀錄</h3><div class="tbl-wrap"><table><thead><tr><th>批次號</th><th>料號</th><th>包裝型式</th><th>封裝濕度</th><th>檢核</th></tr></thead><tbody>'+cr+'</tbody></table></div>'
   +'<div id="c1a" class="chart" style="margin-top:6px"></div></div>'
  +'</div>';
  void view.offsetHeight;
  mk("c1a",baseChart({chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"bar",height:210,stacked:true},series:[{name:"合格",data:[118,132,126,140,138,148]},{name:"退回重工",data:[9,7,11,5,6,4]}],xaxis:{categories:["第1週","第2週","第3週","第4週","第5週","第6週"],labels:{style:{colors:"#78716c"}}},yaxis:{labels:{style:{colors:"#78716c"}}},colors:[accent,"#dc2626"],plotOptions:{bar:{columnWidth:"55%"}},tooltip:{shared:true,intersect:false},legend:{position:"top"}}));
}

/* ================= SCREEN 2 : 儲區靜電監控 ================= */
function s2(){
  var meters=[
    {n:"溫度",v:"22.4 ℃",st:"d-ok",note:"標準 20–24℃"},
    {n:"相對濕度",v:"41%RH",st:"d-ok",note:"標準 40–60%"},
    {n:"離子風機平衡",v:"+38V",st:"d-warn",note:"門檻 ±50V"},
    {n:"接地電阻",v:"0.62Ω",st:"d-ok",note:"門檻 <1Ω"},
    {n:"地板表面電阻",v:"3.1×10⁷Ω",st:"d-ok",note:"10⁶–10⁹Ω"},
    {n:"空氣落塵",v:"Class 8","st":"d-warn",note:"目標 Class 7"}
  ];
  var zones=[
    {z:"A 區 · 高敏感料","t":"22.1","h":"43","io":"+22","st":"正常"},
    {z:"B 區 · IC 專區","t":"22.6","h":"39","io":"-31","st":"正常"},
    {z:"C 區 · 捲盤料","t":"23.1","h":"58","io":"+61","st":"警示"},
    {z:"D 區 · 連接器","t":"21.8","h":"41","io":"+18","st":"正常"}
  ];
  var mr="";
  for(var i=0;i<meters.length;i++){var m=meters[i];
    mr+='<div class="meter"><span class="dot '+m.st+'"></span><span class="mn">'+m.n+'</span><span class="sub" style="flex:1">'+m.note+'</span><span class="mv">'+m.v+'</span></div>';
  }
  var zr="";

/* helpers */
function head(title,desc,ic,tag){
  return '<div class="screen-head"><div><h1>'+esc(title)+'</h1><p>'+esc(desc)+'</p></div>'+(tag?'<span class="pill"><span class="material-symbols-outlined">'+ic+'</span>'+esc(tag)+'</span>':'')+'</div>';
}
function kpi(ic,val,lab,tag,tc){
  return '<div class="kpi"><div class="k-top"><div class="k-ic"><span class="material-symbols-outlined">'+ic+'</span></div><span class="k-tag '+tc+'">'+tag+'</span></div><div class="k-val">'+val+'</div><div class="k-lab">'+lab+'</div></div>';
}

var SCR=[s0,s1,s2,s3,s4,s5];
function show(i){
  clearCharts();
  var tabs=document.querySelectorAll("[data-i]");
  for(var t=0;t<tabs.length;t++){tabs[t].classList.toggle("on",+tabs[t].getAttribute("data-i")===i);}
  SCR[i]();
}

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
})();
</script>
