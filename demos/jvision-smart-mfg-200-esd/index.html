<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ESD 靜電敏感元件倉儲管理系統｜Jvision 系統 Demo</title>
<meta name="description" content="ESD 料件建檔、防靜電包裝管控、儲區靜電監控、搬運稽核與合規報表" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#334155;
  --color-on-primary:#fff;
  --color-secondary:#475569;
  --color-on-secondary:#fff;
  --color-accent:#059669;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#0f172a;
  --color-card:#fff;
  --color-card-foreground:#0f172a;
  --color-muted:#f2f3f4;
  --color-muted-foreground:#475569;
  --color-border:#e6e8ea;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#334155;
  --blue:#334155;
  --ink:#0f172a;
  --muted:#475569;
  --line:#e6e8ea;
  --ok:#047857;
  --warn:#b45309;
  --bad:#dc2626;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:auto}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  background:var(--color-background);
  color:var(--ink);
  font-family:"Open Sans",sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,a{touch-action:manipulation}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.topbar{
  position:sticky;
  top:0;
  z-index:30;
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-bottom:5px solid var(--color-accent);
}
.tb-inner{
  max-width:1440px;
  margin:auto;
  display:grid;
  grid-template-columns:minmax(280px,.8fr) minmax(650px,1.7fr);
  align-items:stretch;
  padding:0 24px;
}
.brand{
  display:flex;
  align-items:center;
  gap:13px;
  padding:14px 20px 14px 0;
  border-right:2px solid rgba(255,255,255,.34);
}
.logo{
  width:46px;
  height:46px;
  display:grid;
  place-items:center;
  flex:0 0 auto;
  color:#001c13;
  background:var(--color-accent);
  border:2px solid #001c13;
}
.logo .material-symbols-outlined{font-size:27px}
.brand b{
  display:block;
  font-family:"Poppins","Open Sans",sans-serif;
  font-size:15px;
  font-weight:700;
  letter-spacing:.01em;
}
.brand small{
  display:block;
  margin-top:2px;
  color:#e2e8f0;
  font-size:10px;
  font-weight:600;
  letter-spacing:.04em;
}
.tabs{
  display:grid;
  grid-template-columns:repeat(6,1fr);
}
.tab{
  min-height:74px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:9px 8px;
  border:0;
  border-right:1px solid rgba(255,255,255,.25);
  color:#f8fafc;
  background:transparent;
  font-size:11px;
  font-weight:700;
  line-height:1.25;
}
.tab:first-child{border-left:1px solid rgba(255,255,255,.25)}
.tab .material-symbols-outlined{font-size:19px}
.tab:hover{color:#001c13;background:#6ee7b7}
.tab.on{
  color:var(--color-on-accent);
  background:var(--color-accent);
  box-shadow:inset 0 -5px 0 #022c22;
}
main{
  max-width:1440px;
  margin:auto;
  padding:30px 24px 64px;
}
.screen-head{
  position:relative;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:end;
  gap:20px;
  min-height:128px;
  margin-bottom:18px;
  padding:24px;
  color:#fff;
  background:var(--color-primary);
  border:2px solid var(--ink);
}
.screen-head::after{
  content:"ESD / OPERATIONS";
  position:absolute;
  top:12px;
  right:18px;
  color:#cbd5e1;
  font-family:var(--mono);
  font-size:10px;
  font-weight:700;
  letter-spacing:.12em;
}
.screen-head h1{
  max-width:760px;
  margin:0 0 8px;
  font-family:"Poppins","Open Sans",sans-serif;
  font-size:clamp(24px,3vw,42px);
  font-weight:700;
  line-height:1.08;
  letter-spacing:-.035em;
}
.screen-head p{
  max-width:780px;
  margin:0;
  color:#e2e8f0;
  font-size:13px;
  font-weight:500;
}
.pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  align-self:end;
  padding:11px 14px;
  color:#001c13;
  background:var(--color-accent);
  border:2px solid #001c13;
  font-size:12px;
  font-weight:700;
}
.pill .material-symbols-outlined{font-size:18px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1fr 2fr}
.card,.kpi{
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:2px solid var(--ink);
  border-radius:0;
  box-shadow:5px 5px 0 #cbd5e1;
}
.card{padding:18px}
.card h3{
  display:flex;
  align-items:center;
  gap:9px;
  margin:-18px -18px 16px;
  padding:12px 16px;
  color:#fff;
  background:var(--color-secondary);
  border-bottom:2px solid var(--ink);
  font-family:"Poppins","Open Sans",sans-serif;
  font-size:13px;
  font-weight:700;
  letter-spacing:.01em;
}
.card h3 .material-symbols-outlined{
  color:#6ee7b7;
  font-size:20px;
}
.sub{
  color:var(--muted);
  font-size:12px;
  font-weight:500;
}
.kpi{
  position:relative;
  min-height:150px;
  padding:16px;
  overflow:hidden;
}
.kpi::before{
  content:"";
  position:absolute;
  top:0;
  right:0;
  width:28px;
  height:28px;
  background:var(--color-accent);
  border-left:2px solid var(--ink);
  border-bottom:2px solid var(--ink);
}
.kpi .k-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
  padding-right:23px;
}
.kpi .k-ic{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--color-primary);
  border:2px solid var(--ink);
}
.kpi .k-ic .material-symbols-outlined{font-size:21px}
.kpi .k-val{
  margin:13px 0 0;
  font-family:"Poppins","Open Sans",sans-serif;
  font-size:28px;
  font-weight:700;
  line-height:1;
  letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;
}
.kpi .k-lab{
  margin-top:7px;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}
.k-tag,.badge,.lv,.chip{
  display:inline-flex;
  align-items:center;
  gap:5px;
  border:1px solid currentColor;
  border-radius:0;
  font-size:11px;
  font-weight:700;
  line-height:1.2;
}
.k-tag{padding:4px 7px}
.badge{padding:4px 8px}
.badge::before,.k-tag::before{
  content:"";
  width:6px;
  height:6px;
  flex:0 0 auto;
  background:currentColor;
}
.t-ok,.b-ok{color:#065f46;background:#d1fae5}
.t-warn,.b-warn{color:#92400e;background:#fef3c7}
.t-bad,.b-bad{color:#991b1b;background:#fee2e2}
.b-info{color:#1e3a8a;background:#dbeafe}
.b-mut{color:#334155;background:#e2e8f0}
.tbl-wrap{
  width:100%;
  overflow-x:auto;
  border:1px solid var(--ink);
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
  font-variant-numeric:tabular-nums;
}
th,td{
  padding:11px 12px;
  border-right:1px solid #cbd5e1;
  border-bottom:1px solid #cbd5e1;
  text-align:left;
  white-space:nowrap;
}
th:last-child,td:last-child{border-right:0}
tbody tr:last-child td{border-bottom:0}
th{
  color:#fff;
  background:var(--color-primary);
  font-size:11px;
  font-weight:700;
  letter-spacing:.04em;
}
tbody tr:nth-child(even){background:#f1f5f9}
tbody tr:hover{background:#d1fae5}
td b,td:first-child{
  font-variant-numeric:tabular-nums;
}
td b{font-family:var(--mono);font-size:12px}
td:nth-last-child(2):has(+ td),td[style*="text-align:right"]{
  font-variant-numeric:tabular-nums;
}
.lv{padding:3px 7px}
.lv1{color:#991b1b;background:#fee2e2}
.lv2{color:#9a3412;background:#ffedd5}
.lv3{color:#854d0e;background:#fef9c3}
.chart{width:100%;overflow:hidden}
.bar{
  height:12px;
  background:#e2e8f0;
  border:1px solid var(--ink);
  overflow:hidden;
}
.bar>i{
  display:block;
  height:100%;
  background:var(--color-accent);
  border-right:1px solid var(--ink);
}
.board{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}
.col{
  padding:10px;
  background:var(--color-muted);
  border:2px solid var(--ink);
}
.col-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:34px;
  margin:-10px -10px 10px;
  padding:8px 10px;
  color:#fff;
  background:var(--color-primary);
  border-bottom:2px solid var(--ink);
  font-size:12px;
  font-weight:700;
}
.col-h .cnt{
  min-width:25px;
  padding:2px 6px;
  color:#001c13;
  background:#6ee7b7;
  border:1px solid #001c13;
  text-align:center;
  font-family:var(--mono);
  font-size:11px;
}
.tk{
  margin-bottom:8px;
  padding:10px;
  background:#fff;
  border:1px solid var(--ink);
  border-left:6px solid var(--color-accent);
}
.tk:last-child{margin-bottom:0}
.tk b{
  display:block;
  font-family:var(--mono);
  font-size:12px;
}
.tk .m{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:8px;
}
.chip{
  padding:3px 6px;
  color:#334155;
  background:#f1f5f9;
  font-family:var(--mono);
}
.tl{
  position:relative;
  padding-left:27px;
}
.tl::before{
  content:"";
  position:absolute;
  top:3px;
  bottom:4px;
  left:8px;
  width:3px;
  background:var(--ink);
}
.ev{
  position:relative;
  padding:0 0 18px 8px;
}
.ev::before{
  content:"✓";
  position:absolute;
  top:0;
  left:-27px;
  width:19px;
  height:19px;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--ok);
  border:2px solid var(--ink);
  font-size:10px;
  font-weight:700;
}
.ev.warn::before{content:"!";background:#d97706}
.ev.bad::before{content:"!";background:var(--bad)}
.ev .tm{
  color:#334155;
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
}
.ev .tt{font-size:12.5px;font-weight:700}
.ev .dd{margin-top:3px;color:var(--muted);font-size:11.5px}
.meter{
  display:grid;
  grid-template-columns:14px 120px 1fr auto;
  align-items:center;
  gap:10px;
  min-height:52px;
  border-bottom:1px solid var(--line);
}
.meter:last-child{border-bottom:0}
.meter .mn{font-size:13px;font-weight:700}
.meter .mv{
  min-width:100px;
  text-align:right;
  font-family:var(--mono);
  font-size:15px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.dot{
  width:12px;
  height:12px;
  border:2px solid var(--ink);
}
.d-ok{background:var(--ok)}
.d-warn{background:#f59e0b}
.d-bad{background:var(--bad)}
.legend{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:8px;
  color:var(--muted);
  font-size:12px;
}
.legend i{
  display:inline-block;
  width:11px;
  height:11px;
  margin-right:5px;
  border:1px solid var(--ink);
  vertical-align:middle;
}
.rowflex{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.foot{
  margin-top:30px;
  padding:14px;
  color:#475569;
  border-top:2px solid var(--ink);
  text-align:center;
  font-family:var(--mono);
  font-size:11px;
}
.reveal{animation:reveal .36s ease-out both}
@keyframes reveal{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:none}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}
@media(max-width:1100px){
  .tb-inner{grid-template-columns:1fr;padding:0}
  .brand{padding:12px 18px;border-right:0;border-bottom:1px solid rgba(255,255,255,.3)}
  .tab{min-height:52px}
  .g4{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:820px){
  main{padding:20px 14px 48px}
  .screen-head{grid-template-columns:1fr;padding:20px}
  .screen-head::after{display:none}
  .pill{justify-self:start}
  .g3,.g2,.g23,.g32{grid-template-columns:1fr}
  .board{grid-template-columns:1fr 1fr}
  .tabs{overflow-x:auto;grid-template-columns:repeat(6,minmax(115px,1fr))}
}
@media(max-width:520px){
  .brand small{white-space:normal}
  .tab{min-width:54px}
  .tab .txt{display:none}
  .tab .material-symbols-outlined{font-size:22px}
  .g4,.board{grid-template-columns:1fr}
  .screen-head{min-height:0}
  .screen-head h1{font-size:25px}
  .card,.kpi{box-shadow:3px 3px 0 #cbd5e1}
  .meter{grid-template-columns:14px 1fr auto}
  .meter .sub{grid-column:2/4}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="tb-inner">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined" aria-hidden="true">bolt</span></div>
      <div><b>ESD 靜電敏感元件倉儲管理</b><small>ESD Sensitive Device Storage Management</small></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="系統功能"></nav>
  </div>
</div>
<main>
  <div id="view" aria-live="polite"></div>
  <div class="foot">Jvision 系統 Demo · 純前端展示 · 模擬資料</div>
</main>
<script>
(function(){
"use strict";
var accent="#059669",accent2="#334155",gridc="#cbd5e1";
var MODS=[
  {ic:"inventory_2",name:"ESD 料件建檔"},
  {ic:"shield",name:"防靜電包裝管控"},
  {ic:"thermostat",name:"儲區靜電監控"},
  {ic:"fact_check",name:"搬運稽核"},
  {ic:"warning",name:"靜電異常通報"},
  {ic:"verified",name:"合規報表"}
];
var view=document.getElementById("view"),charts=[];
function clearCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[]}
function el(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
(function(){
  var h="";
  for(var i=0;i<MODS.length;i++){
    h+='<button type="button" class="tab" data-i="'+i+'" aria-label="'+MODS[i].name+'"><span class="material-symbols-outlined" aria-hidden="true">'+MODS[i].ic+'</span><span class="txt">'+MODS[i].name+'</span></button>';
  }
  el("tabs").innerHTML=h;
  var b=el("tabs").querySelectorAll(".tab");
  for(var j=0;j<b.length;j++){(function(k){b[k].addEventListener("click",function(){location.hash="v"+k})})(j)}
})();
function baseChart(extra){
  var o={
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:'"Open Sans",sans-serif'},
    grid:{borderColor:gridc},
    dataLabels:{enabled:false},
    legend:{labels:{colors:"#334155"}},
    tooltip:{theme:"light"}
  };
  for(var k in extra)o[k]=extra[k];
  return o
}
function mk(id,opt){var n=el(id);if(!n)return;var c=new ApexCharts(n,opt);c.render();charts.push(c)}
function s0(){
  var rows=[
    {p:"MLCC-0402-X7R",n:"多層陶瓷電容",cls:"HBM Class 1A",v:"250V",loc:"D-ESD-A12",qty:"18,400",unit:"顆",pkg:"防靜電乾燥",st:"已建檔"},
    {p:"IC-MCU-STM32",n:"32 位元微控制器",cls:"HBM Class 2",v:"1000V",loc:"D-ESD-B07",qty:"3,260",unit:"顆",pkg:"屏蔽袋",st:"已建檔"},
    {p:"LED-SMD-0603",n:"表面貼裝 LED",cls:"HBM Class 3A",v:"6000V",loc:"D-ESD-C21",qty:"42,800",unit:"顆",pkg:"防靜電捲盤",st:"待標示"},
    {p:"MOSFET-N-30V",n:"N 通道功率電晶體",cls:"CDM Class C1",v:"200V",loc:"D-ESD-A03",qty:"7,150",unit:"顆",pkg:"導電托盤",st:"已建檔"},
    {p:"CONN-BTB-40P",n:"板對板連接器",cls:"HBM Class 3B",v:"8000V",loc:"D-ESD-D14",qty:"1,920",unit:"組",pkg:"屏蔽袋",st:"待標示"},
    {p:"SENSOR-IMU-6X",n:"六軸慣性感測器",cls:"CDM Class C3",v:"500V",loc:"D-ESD-B18",qty:"2,540",unit:"顆",pkg:"防靜電乾燥",st:"複核中"}
  ],tr="";
  for(var i=0;i<rows.length;i++){
    var r=rows[i],lc=r.cls.indexOf("1")>-1?"lv1":(r.cls.indexOf("2")>-1||r.cls.indexOf("C1")>-1?"lv2":"lv3"),sb=r.st==="已建檔"?"b-ok":(r.st==="待標示"?"b-warn":"b-info");
    tr+='<tr><td><b>'+r.p+'</b><br><span class="sub">'+r.n+'</span></td><td><span class="lv '+lc+'">'+r.cls+'</span></td><td>'+r.v+'</td><td><b>'+r.loc+'</b></td><td style="text-align:right">'+r.qty+' <span class="sub">'+r.unit+'</span></td><td>'+r.pkg+'</td><td><span class="badge '+sb+'">'+r.st+'</span></td></tr>'
  }
  view.innerHTML=head("ESD 料件建檔","收貨後標示靜電敏感等級並完成分類建檔，指定專屬防靜電儲區","inventory_2","入庫標示 · 階段 v0")

}
function head(title,desc,ic,tag){
  return '<div class="screen-head"><div><h1>'+esc(title)+'</h1><p>'+esc(desc)+'</p></div>'+(tag?'<span class="pill"><span class="material-symbols-outlined" aria-hidden="true">'+ic+'</span>'+esc(tag)+'</span>':'')+'</div>'
}
function kpi(ic,val,lab,tag,tc){
  return '<div class="kpi"><div class="k-top"><div class="k-ic"><span class="material-symbols-outlined" aria-hidden="true">'+ic+'</span></div><span class="k-tag '+tc+'">'+tag+'</span></div><div class="k-val">'+val+'</div><div class="k-lab">'+lab+'</div></div>'
}
function activate(){
  void view.offsetHeight;
  if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches)view.classList.add("reveal")
}
var SCR=[s0,s1,s2,s3,s4,s5];
function show(i){
  clearCharts();
  view.classList.remove("reveal");
  var tabs=document.querySelectorAll("[data-i]");
  for(var t=0;t<tabs.length;t++){
    var active=+tabs[t].getAttribute("data-i")===i;
    tabs[t].classList.toggle("on",active);
    tabs[t].setAttribute("aria-current",active?"page":"false")
  }
  SCR[i]()
}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return}
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash()
})();
