<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>復健排程追蹤台 · Rehab Therapy Plan</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{--accent:#0d9488;--accent2:#2dd4bf;--ink:#0c2b28;--bg:#eff7f5;--card:#fff;--line:#d6ebe7;--mut:#5c817c;--ok:#0f9d70;--warn:#f59e0b;--bad:#e11d48;--info:#6366f1;--pt:#0ea5e9;--ot:#8b5cf6;--st:#f97316}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
/* TOP NAV */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,#0d9488,#0f766e);color:#fff;box-shadow:0 4px 18px rgba(13,148,136,.28)}
.topbar{display:flex;align-items:center;gap:16px;padding:11px 22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;flex:none}
.brand .lg{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:900;font-family:"Noto Sans TC";font-size:17px;flex:none}
.brand b{font-size:16px;font-weight:800;font-family:"Noto Sans TC";display:block;line-height:1.2}
.brand span{font-size:9px;letter-spacing:2px;opacity:.82}
.nav{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.nav button{display:flex;align-items:center;gap:7px;background:transparent;border:0;color:rgba(255,255,255,.86);font:inherit;font-weight:600;font-size:13px;padding:8px 13px;border-radius:10px;cursor:pointer;font-family:"Noto Sans TC";white-space:nowrap}
.nav button .material-symbols-outlined{font-size:19px}
.nav button:hover{background:rgba(255,255,255,.13)}
.nav button.on{background:#fff;color:var(--accent);font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.live{background:rgba(255,255,255,.16);color:#fff;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;flex:none}
.live i{width:8px;height:8px;border-radius:50%;background:var(--accent2);display:inline-block;animation:p 1.4s infinite}
@keyframes p{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(45,212,191,.6)}50%{opacity:.4;box-shadow:0 0 0 6px rgba(45,212,191,0)}}
.main{padding:22px 24px;max-width:1360px;margin:0 auto}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.crumb{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:5px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpis>*{min-width:0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.24}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .85fr}
.g11{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#d3f4e7;color:#0f7a52}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#ffe1e6;color:#be123c}.t-info{background:#e0e7ff;color:#4338ca}.t-teal{background:#cff3ee;color:#0b7d70}
.t-pt{background:#e0f2fe;color:#0369a1}.t-ot{background:#ede9fe;color:#6d28d9}.t-st{background:#ffedd5;color:#c2410c}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#eef9f7}
table.data tr:hover td{background:#f3fbfa}
.scroll{overflow-x:auto}
.bar{height:8px;background:#e0f0ed;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart{height:250px}
.ava{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:inline-grid;place-items:center;font-size:11px;font-weight:800;font-family:"Noto Sans TC";flex:none}
/* SCHEDULE grid: 治療師 × 時段 */
.schwrap{overflow-x:auto}
.sched{display:grid;grid-template-columns:78px repeat(4,minmax(120px,1fr));gap:6px;min-width:640px}
.sched .hd{font-size:11.5px;font-weight:800;text-align:center;padding:7px 4px;font-family:"Noto Sans TC";border-radius:8px}
.sched .hd small{display:block;font-size:9.5px;color:var(--mut);font-weight:600}
.hd.h-pt{background:#e0f2fe;color:#0369a1}.hd.h-ot{background:#ede9fe;color:#6d28d9}.hd.h-st{background:#ffedd5;color:#c2410c}.hd.h-pt2{background:#cff3ee;color:#0b7d70}
.sched .tm{font-size:11px;color:var(--mut);font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center}
.slot{border:1px solid var(--line);border-radius:9px;padding:7px 8px;font-size:11px;min-height:50px}
.slot.bk{border-left:3px solid var(--accent)}
.slot.bk.pt{border-left-color:var(--pt);background:#f0f9ff}
.slot.bk.ot{border-left-color:var(--ot);background:#f6f4ff}
.slot.bk.st{border-left-color:var(--st);background:#fff7ed}
.slot.bk b{font-family:"Noto Sans TC";font-size:11.5px;display:block}
.slot.bk small{color:var(--mut);font-size:10px}
.slot.free{background:#fbfefe;color:#9ac9c3;display:grid;place-items:center;cursor:pointer}
.slot.blk{background:#f4f6f6;color:#b8c4c2;display:grid;place-items:center;font-size:10.5px}
/* case list */
.clist{display:flex;flex-direction:column;gap:10px}
.cc{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:13px;padding:12px 14px;background:#fff}
.cc.warn{border-left-color:var(--warn);background:linear-gradient(90deg,#fffbeb,#fff)}
.cc.bad{border-left-color:var(--bad);background:linear-gradient(90deg,#fff5f7,#fff)}
.cc.ok{border-left-color:var(--ok)}
.cc .ct{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.cc .ct b{font-size:13.5px;font-family:"Noto Sans TC"}
.cc .day{font-family:Inter;font-weight:900;color:var(--accent);font-size:12px;background:#dbf3ef;padding:2px 9px;border-radius:8px}
.cc .meta{color:var(--mut);font-size:11.5px;margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
.cc .meta span{display:flex;align-items:center;gap:4px}
.cc .meta .material-symbols-outlined{font-size:14px}
.stat{margin-left:auto;text-align:right;flex:none}
.stat .num{font-family:"Noto Sans TC";font-weight:800;font-size:12.5px}
.stat small{font-size:9.5px;color:var(--mut);display:block}
/* assessment gauges */
.rom{display:flex;flex-direction:column;gap:12px}
.romr{display:grid;grid-template-columns:96px 1fr 62px;gap:10px;align-items:center}
.romr .nm{font-size:12px;font-family:"Noto Sans TC";font-weight:600}
.romr .vv{font-size:12px;font-weight:800;font-family:Inter;text-align:right}
.romr .vv small{color:var(--mut);font-weight:600;font-size:10px}
.barw{height:9px;background:#e6f2ef;border-radius:6px;overflow:hidden;position:relative}
.barw i{display:block;height:100%;border-radius:6px}
.plan{display:flex;flex-direction:column;gap:10px}
.pi{border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.pi .ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.pi .ph b{font-size:12.5px;font-family:"Noto Sans TC"}
.pi small{color:var(--mut);font-size:11.5px;line-height:1.6}
.goalrow{display:flex;align-items:center;gap:8px;font-size:11.5px;margin-top:6px}
.goalrow .gb{flex:1;height:7px;background:#e6f2ef;border-radius:5px;overflow:hidden}
.goalrow .gb i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.sug{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#eefaf8;margin-bottom:10px}
.sug b{font-size:12.5px;font-family:"Noto Sans TC";display:block;margin-bottom:4px}
.sug small{color:var(--mut);font-size:11.5px;line-height:1.6}
.btn{font-size:11.5px;font-weight:700;padding:6px 13px;border-radius:9px;border:0;cursor:pointer;font-family:"Noto Sans TC"}
.btn.ok{background:var(--accent);color:#fff}.btn.gh{background:#fff;border:1px solid var(--line);color:var(--mut)}
.mini{display:flex;gap:6px}
/* timeline */
.tl{display:flex;flex-direction:column;gap:0}
.tli{display:flex;gap:12px;position:relative;padding-bottom:16px}
.tli:before{content:"";position:absolute;left:13px;top:26px;bottom:-2px;width:2px;background:#d7ebe8}
.tli:last-child:before{display:none}
.tli .dotm{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;z-index:1}
.tli .dotm .material-symbols-outlined{font-size:16px}
.tli.ok .dotm{background:var(--ok)}.tli.now .dotm{background:var(--accent);box-shadow:0 0 0 4px rgba(13,148,136,.2)}.tli.warn .dotm{background:var(--warn)}.tli.wait .dotm{background:#cbd5cf}
.tli .tc b{font-size:13px;font-family:"Noto Sans TC"}
.tli .tc small{display:block;color:var(--mut);font-size:11.5px;margin-top:2px;line-height:1.5}
.tli .tt{margin-left:auto;color:var(--mut);font-size:11px;white-space:nowrap;flex:none}
/* home exercise cards */
.exs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.exs>*{min-width:0}
.ex{border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:#fbfefe}
.ex .eh{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.ex .ei{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;flex:none}
.ex .ei .material-symbols-outlined{font-size:17px}
.ex b{font-size:12.5px;font-family:"Noto Sans TC"}
.ex p{margin:3px 0 6px;font-size:11.5px;color:var(--mut);line-height:1.5}
.ex .em{font-size:11px;color:var(--accent);font-weight:700}
.nps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.nps>*{min-width:0}
.npc{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.npc .v{font-family:Inter;font-weight:900;font-size:24px}
.npc .l{font-size:11px;color:var(--mut);margin-top:2px}
@media(max-width:1000px){.nav button span.lb{display:inline}}
@media(max-width:820px){.g2,.g11{grid-template-columns:1fr}.exs{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.nav button span.lb{display:none}.nav button{padding:8px 10px}}
@media(max-width:430px){.kpis{grid-template-columns:1fr}.main{padding:16px 14px}.nps{grid-template-columns:1fr}.romr{grid-template-columns:80px 1fr 54px}}
</style>
</head>
<body>
<header class="top">
  <div class="topbar">
    <div class="brand"><div class="lg">復</div><div><b>復健排程追蹤台</b><span>REHAB THERAPY PLAN</span></div></div>

  </div>
</header>
<main class="main">
  <div class="vh"><div><div class="crumb"><span class="material-symbols-outlined" style="font-size:14px">home_health</span>復健醫學部 · 治療排程</div><h2 id="vt">復健總覽</h2><p id="vd"></p></div></div>

<script>

["復健排程","calendar_month","復健排程","治療師 × 時段排程與治療室配置"],
["進度追蹤","trending_up","進度追蹤","ROM、疼痛與肌力進步趨勢追蹤"],

MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span><span class="lb">'+m[0]+'</span>';b.onclick=()=>show(i);nav.appendChild(b);});

const PLAN=[
["物理治療 PT","t-pt","恢復右膝關節活動度與股四頭肌肌力，回復正常步態","每週 3 次 · 共 12 週",62],
["職能治療 OT","t-ot","訓練日常生活動作（上下樓梯、蹲站轉位）獨立性","每週 2 次 · 共 8 週",40],
["居家運動處方 HEP","t-teal","直膝抬腿、靠牆深蹲、彈力帶阻力訓練","每日 2 回 · 每回 15 分",75]];

["股四頭肌肌力達 5/5","目前 4-",70],
["10 公尺步行 < 12 秒","目前 15 秒",64],
["單腳站立 > 30 秒","目前 18 秒",55]];

const THERAPISTS=[["王怡君 PT","物理治療","h-pt"],["李承恩 PT","物理治療","h-pt2"],["周雅婷 OT","職能治療","h-ot"],["蔡明哲 ST","語言治療","h-st"]];
const SLOTS=[

["10:00",["bk|pt|吳美玲|肩關節鬆動","free","bk|ot|劉家瑜|手功能","bk|st|張志成|構音訓練"]],

["R-3071","吳美玲","五十肩","建議 續約 8 次","物理","t-pt"]];

const PROG=[
["ok","初評 · 建立基線","膝屈曲 82° · 疼痛 6/10 · 股四頭肌 3-/5，擬定 12 週療程。","第 1 週"],

["warn","停滯預警","近兩次 ROM 增幅 < 3°，系統標記進步停滯，建議醫師複評處方。","待處理"],
["wait","第 9 週 · 回復步態","目標回復正常步態與上下樓梯，尚未進入。","預定"]];

/* home exercise */
const EX=[
["directions_walk","直膝抬腿 SLR","仰臥伸直患肢抬離床面 20 公分停 5 秒","3 組 × 15 下 · 每日 2 回"],
["fitness_center","靠牆深蹲","背靠牆下蹲至膝 60° 維持穩定","3 組 × 30 秒 · 每日 2 回"],
["sports_gymnastics","彈力帶伸膝","坐姿以彈力帶阻力伸直膝關節","3 組 × 12 下 · 每日 2 回"],
["self_improvement","關節活動 ROM","坐姿滑板輔助膝關節屈曲伸直","10 分鐘 · 每日 3 回"]];
const FBK=[
["陳文豪 · ACL 術後","治療師會依進度即時調整運動處方，居家影片很清楚，複健很有方向。"],
["林淑惠 · 中風復健","職能課程訓練我自己穿衣、拿筷子，家屬也能看到進步報告很安心。"]];

const SCREENS=[

/* ===== ApexCharts ===== */
let CH=[];
function dispose(){CH.forEach(c=>{try{c.destroy();}catch(e){}});CH=[];}
function mk(id,opt){const el=document.getElementById(id);if(!el)return;const c=new ApexCharts(el,opt);c.render();CH.push(c);}
const TEAL='#0d9488',TEAL2='#2dd4bf',INFO='#6366f1',OKG='#0f9d70',WARN='#f59e0b',BAD='#e11d48',PT='#0ea5e9',OT='#8b5cf6',ST='#f97316';
const CBASE={redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},fontFamily:'Inter,"Noto Sans TC",sans-serif',toolbar:{show:false}};
const BASE={dataLabels:{enabled:false},grid:{borderColor:'#e2f0ed',strokeDashArray:4},tooltip:{style:{fontSize:'12px'}}};
function draw(i){
 dispose();
 if(i==0){
  mk('c_type',Object.assign({},BASE,{chart:Object.assign({type:'bar',height:240},CBASE),series:[{name:'療程數',type:'column',data:[128,86,44]},{name:'目標達成率%',type:'line',data:[88,90,84]}],stroke:{width:[0,3],curve:'smooth'},colors:[TEAL,INFO],plotOptions:{bar:{columnWidth:'42%',borderRadius:6}},xaxis:{categories:['物理治療','職能治療','語言治療'],labels:{style:{fontSize:'11px'}}},yaxis:[{labels:{style:{fontSize:'10px'}}},{opposite:true,max:100,labels:{style:{fontSize:'10px'}}}],legend:{fontSize:'11px'},markers:{size:4}}));
  mk('c_sig',Object.assign({},BASE,{chart:Object.assign({type:'line',height:200},CBASE),series:[{name:'膝屈曲 ROM',data:[82,88,96,100,104,108]},{name:'疼痛指數',data:[6,5,4,4,3,3]},{name:'股四頭肌肌力%',data:[45,52,60,66,70,74]}],colors:[TEAL,BAD,INFO],stroke:{curve:'smooth',width:[3,3,3]},xaxis:{categories:['第1週','第2週','第4週','第5週','第6週','本週'],labels:{style:{fontSize:'10px'}}},yaxis:{labels:{style:{fontSize:'10px'}}},legend:{show:false},markers:{size:4}}));
 }
 if(i==2){
  mk('c_goal',Object.assign({},BASE,{chart:Object.assign({type:'radialBar',height:180},CBASE),series:[72,70,64,55],labels:['ROM','肌力','步行','站立'],colors:[TEAL,TEAL2,INFO,WARN],plotOptions:{radialBar:{hollow:{size:'34%'},dataLabels:{name:{fontSize:'10px'},value:{fontSize:'12px'},total:{show:true,label:'平均',fontSize:'11px',formatter:function(){return '65%';}}}}},legend:{show:true,position:'bottom',fontSize:'10px'}}));
 }
 if(i==4){
  mk('c_prog',Object.assign({},BASE,{chart:Object.assign({type:'line',height:250},CBASE),series:[{name:'膝屈曲 ROM',data:[82,88,96,100,104,108,109,110]},{name:'疼痛',data:[6,5,4,4,3,3,3,2]},{name:'股四頭肌肌力%',data:[45,52,60,66,70,74,75,77]}],colors:[TEAL,BAD,INFO],stroke:{curve:'smooth',width:[3,3,3]},xaxis:{categories:['1','2','3','4','5','6','7','8'],title:{text:'治療次數',style:{fontSize:'10px',fontWeight:600}},labels:{style:{fontSize:'10px'}}},yaxis:{labels:{style:{fontSize:'10px'}}},legend:{show:false},markers:{size:4},annotations:{xaxis:[{x:'6',borderColor:WARN,label:{text:'停滯',style:{fontSize:'10px',background:WARN,color:'#fff'}}}]}}));
 }
 if(i==5){
  mk('c_donut',Object.assign({},BASE,{chart:Object.assign({type:'donut',height:230},CBASE),series:[88,90,84],labels:['物理治療','職能治療','語言治療'],colors:[PT,OT,ST],legend:{position:'bottom',fontSize:'11px'},plotOptions:{pie:{donut:{size:'62%',labels:{show:true,total:{show:true,label:'平均達成',fontSize:'12px',formatter:function(){return '88%';}}}}}}}));
 }
}
function show(i){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));vt.textContent=MOD[i][2];vd.textContent=MOD[i][3];view.innerHTML=SCREENS[i]();draw(i);}
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
</body>
