<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>復健排程追蹤台 · Rehab Therapy Plan</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,500,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0891B2;
  --color-on-primary:#000000;
  --color-secondary:#22D3EE;
  --color-on-secondary:#0F172A;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#ECFEFF;
  --color-foreground:#164E63;
  --color-card:#FFFFFF;
  --color-card-foreground:#164E63;
  --color-muted:#E8F1F6;
  --color-muted-foreground:#475569;
  --color-border:#A5F3FC;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0891B2;
  --blue:#0891B2;
  --ink:#164E63;
  --muted:#475569;
  --line:#A5F3FC;
  --bg:#ECFEFF;
  --card:#FFFFFF;
  --ok:#047857;
  --warn:#A16207;
  --bad:#DC2626;
  --info:#0369A1;
  --pt:#0369A1;
  --ot:#6D28D9;
  --st:#C2410C;
  --shadow-out:-5px -5px 15px rgba(255,255,255,.92),5px 5px 15px rgba(14,116,144,.12);
  --shadow-in:inset 2px 2px 5px rgba(14,116,144,.12),inset -2px -2px 5px rgba(255,255,255,.9);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--color-background);
  color:var(--color-foreground);
  font-family:"Atkinson Hyperlegible",sans-serif;
  font-size:15px;
  line-height:1.45;
}
button{font:inherit}
button,[role="button"],.slot.free{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{font-size:20px;line-height:1;vertical-align:middle}
.mono,.v,.day,.tt,table.data td:nth-child(n+2),.goalrow b,.em{
  font-variant-numeric:tabular-nums;
  font-family:"Atkinson Hyperlegible",ui-monospace,SFMono-Regular,Consolas,monospace;
}
.top{
  position:sticky;
  top:0;
  z-index:30;
  padding:10px 18px 0;
  background:rgba(236,254,255,.94);
  backdrop-filter:blur(12px);
}
.topbar{
  max-width:1420px;
  margin:auto;
  min-height:66px;
  display:flex;
  align-items:center;
  gap:18px;
  padding:10px 14px;
  border:1px solid rgba(165,243,252,.92);
  border-radius:16px;
  background:linear-gradient(145deg,#f8ffff,#ddf8fb);
  box-shadow:var(--shadow-out);
}
.brand{display:flex;align-items:center;gap:11px;flex:none}
.brand .lg{
  width:42px;height:42px;display:grid;place-items:center;
  border-radius:14px;color:#042F3E;background:var(--color-secondary);
  font-size:20px;font-weight:700;
  box-shadow:-3px -3px 8px #fff,3px 3px 8px rgba(8,145,178,.24);
}
.brand b{display:block;font-size:16px;line-height:1.15}
.brand small{display:block;margin-top:3px;color:var(--muted);font-size:9px;letter-spacing:1.5px}
.nav{display:flex;align-items:center;gap:5px;flex:1;min-width:0;overflow-x:auto;padding:3px}
.nav button{
  min-height:42px;display:flex;align-items:center;gap:6px;
  padding:8px 11px;border:1px solid transparent;border-radius:12px;
  color:#315E6D;background:transparent;font-weight:700;font-size:13px;
  white-space:nowrap;transition:background .18s ease,color .18s ease,box-shadow .18s ease,transform .15s ease;
}
.nav button:hover{color:#075B70;background:#DDF8FB;box-shadow:var(--shadow-in)}
.nav button:active{transform:translateY(1px)}
.nav button.on{
  color:#003B49;background:#BAF3FA;border-color:#67E8F9;
  box-shadow:inset 2px 2px 5px rgba(8,145,178,.17),inset -2px -2px 5px rgba(255,255,255,.8);
}
.live{
  display:flex;align-items:center;gap:7px;flex:none;
  padding:8px 11px;border-radius:12px;background:#D1FAE5;
  border:1px solid #6EE7B7;color:#065F46;font-size:12px;font-weight:700;
}
.live i{width:9px;height:9px;border-radius:50%;background:#047857}
.main{max-width:1420px;margin:auto;padding:22px 24px 40px}
.vh{
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:16px;margin-bottom:18px;padding:18px 20px;
  border:1px solid var(--color-border);border-radius:16px;
  background:linear-gradient(145deg,#f8ffff,#e1f8fb);box-shadow:var(--shadow-out);
}
.vh h1{margin:4px 0 0;font-size:clamp(23px,3vw,31px);line-height:1.15;letter-spacing:-.02em}
.vh p{margin:6px 0 0;color:var(--muted);font-size:13px}
.crumb{display:flex;align-items:center;gap:6px;color:#075E73;font-size:11px;font-weight:700;letter-spacing:.07em}
.hero-state{
  display:flex;align-items:center;gap:8px;min-height:38px;padding:8px 12px;
  border-radius:12px;background:#fff;border:1px solid var(--line);
  color:#315E6D;font-size:12px;font-weight:700;box-shadow:var(--shadow-in);
}
.hero-state .material-symbols-outlined{color:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi,.card,.npc{
  border:1px solid var(--color-border);border-radius:16px;
  background:linear-gradient(145deg,#fff,#f5fdfe);box-shadow:var(--shadow-out);
}
.kpi{position:relative;overflow:hidden;padding:16px 17px}
.kpi:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--color-primary)}
.kpi .l{color:var(--muted);font-size:12px;font-weight:700}
.kpi .v{margin-top:4px;color:#0E4F62;font-size:28px;font-weight:700;line-height:1.1}
.kpi .v small{font-size:12px}
.kpi .d{margin-top:5px;font-size:11px;font-weight:700}
.kpi .ic{position:absolute;right:14px;top:14px;color:#087E99;opacity:.3;font-size:25px}
.up{color:#047857}.dn{color:#B91C1C}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.35fr) minmax(320px,.85fr)}
.g11{grid-template-columns:1fr 1fr}
.card{padding:17px 18px}
.card h3{
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  margin:0 0 14px;color:#103F4D;font-size:15px;line-height:1.3;
}
.card h3>.material-symbols-outlined{color:var(--color-primary)}
.tag{
  display:inline-flex;align-items:center;min-height:23px;
  padding:2px 9px;border:1px solid transparent;border-radius:999px;
  font-size:11px;font-weight:700;line-height:1.2;white-space:nowrap;
}
.t-ok{color:#065F46;background:#D1FAE5;border-color:#6EE7B7}
.t-warn{color:#713F12;background:#FEF3C7;border-color:#FCD34D}
.t-bad{color:#991B1B;background:#FEE2E2;border-color:#FCA5A5}
.t-info{color:#1E3A8A;background:#DBEAFE;border-color:#93C5FD}
.t-teal{color:#075985;background:#CFFAFE;border-color:#67E8F9}
.t-pt{color:#075985;background:#E0F2FE;border-color:#7DD3FC}
.t-ot{color:#5B21B6;background:#EDE9FE;border-color:#C4B5FD}
.t-st{color:#9A3412;background:#FFEDD5;border-color:#FDBA74}
.scroll,.schwrap{overflow-x:auto;scrollbar-color:#67E8F9 transparent}
table.data{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.data th,table.data td{padding:10px 11px;border-bottom:1px solid #CBEFF4;text-align:left;white-space:nowrap}
table.data th{
  color:#315E6D;background:#DDF7FA;font-size:12px;font-weight:700;
}
table.data th:first-child{border-radius:10px 0 0 0}
table.data th:last-child{border-radius:0 10px 0 0}
table.data tbody tr:hover td,table.data tr:not(:first-child):hover td{background:#F0FCFD}
table.data td:nth-child(3),table.data td:nth-child(4),table.data td:nth-child(5){text-align:right}
.chart{height:250px}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:11px;color:var(--muted);font-size:12px}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;display:inline-block;border-radius:4px;border:1px solid rgba(15,23,42,.18)}
.ava{
  width:29px;height:29px;display:inline-grid;place-items:center;flex:none;
  border:1px solid #67E8F9;border-radius:50%;background:#CFFAFE;color:#075985;
  font-weight:700;box-shadow:-2px -2px 5px #fff,2px 2px 5px rgba(8,145,178,.15);
}
.sched{display:grid;grid-template-columns:78px repeat(4,minmax(124px,1fr));gap:7px;min-width:660px}
.sched .hd{
  padding:8px 5px;border:1px solid transparent;border-radius:11px;
  text-align:center;font-size:12px;font-weight:700;
}
.sched .hd small{display:block;margin-top:2px;color:inherit;font-size:10px;font-weight:400;opacity:.82}
.hd.h-pt{color:#075985;background:#E0F2FE;border-color:#7DD3FC}
.hd.h-pt2{color:#075E73;background:#CFFAFE;border-color:#67E8F9}
.hd.h-ot{color:#5B21B6;background:#EDE9FE;border-color:#C4B5FD}
.hd.h-st{color:#9A3412;background:#FFEDD5;border-color:#FDBA74}
.sched .tm{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;font-weight:700}
.slot{
  min-height:54px;padding:8px 9px;border:1px solid #B8E8EF;border-radius:11px;
  background:#F8FFFF;font-size:11px;
}
.slot.bk{border-left:4px solid var(--color-primary)}
.slot.bk.pt{background:#F0F9FF;border-left-color:var(--pt)}
.slot.bk.ot{background:#F7F4FF;border-left-color:var(--ot)}
.slot.bk.st{background:#FFF7ED;border-left-color:var(--st)}
.slot.bk b{display:block;font-size:12px}
.slot.bk small{color:var(--muted);font-size:10px}
.slot.free{
  display:grid;place-items:center;color:#075E73;background:#E8FAFC;
  border-style:dashed;transition:background .18s ease,box-shadow .18s ease;
}
.slot.free:hover{background:#CFFAFE;box-shadow:var(--shadow-in)}
.slot.blk{display:grid;place-items:center;color:#64748B;background:#E8EEF1}
.clist,.rom,.plan{display:flex;flex-direction:column;gap:10px}
.cc,.pi,.ex,.sug{
  border:1px solid #B8E8EF;border-radius:13px;background:#F9FFFF;
}
.cc{padding:12px 13px;border-left:5px solid var(--color-primary)}
.cc.warn{border-left-color:#A16207;background:#FFFCED}
.cc.bad{border-left-color:#DC2626;background:#FFF5F5}
.cc.ok{border-left-color:#047857}
.cc .ct{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.cc .ct b{font-size:14px}
.cc .day{
  padding:2px 8px;border-radius:7px;background:#DDF7FA;color:#075E73;
  font-size:12px;font-weight:700;
}
.cc .meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:7px;color:var(--muted);font-size:12px}
.cc .meta span{display:flex;align-items:center;gap:4px}
.cc .meta .material-symbols-outlined{font-size:15px}
.romr{display:grid;grid-template-columns:104px 1fr 68px;gap:10px;align-items:center}
.romr .nm{font-size:13px;font-weight:700}
.romr .vv{text-align:right;font-size:12px;font-weight:700}
.romr .vv small{color:var(--muted);font-size:10px}
.barw,.goalrow .gb{
  overflow:hidden;border-radius:999px;background:#DCEEF2;box-shadow:var(--shadow-in);
}
.barw{height:10px}
.barw i,.goalrow .gb i{display:block;height:100%;border-radius:999px}
.pi{padding:11px 13px}
.pi .ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.pi .ph b{font-size:13px}
.pi small{color:var(--muted);font-size:12px;line-height:1.55}
.goalrow{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:12px}
.goalrow .gb{flex:1;height:8px}
.goalrow .gb i{background:linear-gradient(90deg,#0891B2,#22D3EE)}
.sug{margin-bottom:10px;padding:11px 13px;background:#E9F9FB;box-shadow:var(--shadow-in)}
.sug b{display:block;margin-bottom:4px;font-size:13px}
.sug small{color:#3D5E69;font-size:12px;line-height:1.55}
.btn{
  min-height:38px;padding:7px 14px;border-radius:11px;border:1px solid transparent;
  font-size:12px;font-weight:700;transition:transform .15s ease,box-shadow .18s ease,background .18s ease;
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px);box-shadow:var(--shadow-in)}
.btn.ok{
  color:#001F18;background:#6EE7B7;border-color:#059669;
  box-shadow:-3px -3px 8px #fff,3px 3px 8px rgba(5,150,105,.2);
}
.btn.ok:hover{background:#34D399}
.btn.gh{color:#164E63;background:#F8FFFF;border-color:#8DEAF5;box-shadow:var(--shadow-out)}
.mini{display:flex;gap:8px}
.tl{display:flex;flex-direction:column}
.tli{display:flex;gap:12px;position:relative;padding-bottom:16px}
.tli:before{content:"";position:absolute;left:14px;top:29px;bottom:-2px;width:2px;background:#BDE7EC}
.tli:last-child:before{display:none}
.tli .dotm{
  width:30px;height:30px;display:grid;place-items:center;flex:none;z-index:1;
  border-radius:50%;color:#fff;border:2px solid #fff;box-shadow:0 2px 7px rgba(14,78,98,.2);
}
.tli .dotm .material-symbols-outlined{font-size:16px}
.tli.ok .dotm{background:#047857}.tli.now .dotm{background:#0891B2;outline:3px solid #A5F3FC}
.tli.warn .dotm{background:#A16207}.tli.wait .dotm{background:#64748B}
.tli .tc b{font-size:13px}
.tli .tc small{display:block;margin-top:3px;color:var(--muted);font-size:12px;line-height:1.5}
.tli .tt{margin-left:auto;flex:none;color:var(--muted);font-size:11px;white-space:nowrap}
.exs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.ex{padding:12px 13px}
.ex .eh{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.ex .ei{
  width:32px;height:32px;display:grid;place-items:center;flex:none;border-radius:10px;
  color:#064E3B;background:#A7F3D0;box-shadow:-2px -2px 6px #fff,2px 2px 6px rgba(5,150,105,.16);
}
.ex .ei .material-symbols-outlined{font-size:18px}
.ex b{font-size:13px}
.ex p{margin:4px 0 7px;color:var(--muted);font-size:12px;line-height:1.5}
.ex .em{color:#075E73;font-size:11px;font-weight:700}
.nps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.npc{padding:15px;text-align:center}
.npc .v{color:#0E4F62;font-size:27px;font-weight:700}
.npc .l{margin-top:3px;color:var(--muted);font-size:12px}
.reveal{animation:reveal .36s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1040px){
  .topbar{align-items:flex-start;flex-wrap:wrap}
  .nav{order:3;width:100%;flex-basis:100%}
  .live{margin-left:auto}
}
@media(max-width:820px){
  .g2,.g11{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .exs{grid-template-columns:1fr}
}
@media(max-width:560px){
  .top{padding:7px 8px 0}
  .topbar{gap:8px;padding:9px}
  .brand .lg{width:38px;height:38px}
  .brand b{font-size:14px}
  .live{padding:7px;font-size:11px}
  .nav button{padding:8px 10px}
  .nav button .lb{display:none}
  .main{padding:16px 12px 30px}
  .vh{align-items:flex-start;padding:15px;flex-direction:column}
  .hero-state{width:100%}
  .card{padding:14px}
  .romr{grid-template-columns:89px 1fr 60px}
}
@media(max-width:430px){
  .kpis,.nps{grid-template-columns:1fr}
  .live{display:none}
  .tli .tt{display:none}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation:none!important;transition:none!important}
  .reveal{opacity:1;transform:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="topbar">
    <div class="brand">
      <div class="lg" aria-hidden="true">復</div>
      <div><b>復健排程追蹤台</b><small>REHAB THERAPY PLAN</small></div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
    <div class="live"><i aria-hidden="true"></i><span>狀態：復健療程進行中</span></div>
  </div>
</header>
<main class="main">
  <section class="vh">
    <div>
      <div class="crumb"><span class="material-symbols-outlined" aria-hidden="true">home_health</span>復健醫學部 · 治療排程</div>
      <h1 id="vt">復健總覽</h1>
      <p id="vd"></p>
    </div>
    <div class="hero-state"><span class="material-symbols-outlined" aria-hidden="true">verified_user</span>臨床資料同步完成</div>
  </section>
  <div id="view" aria-live="polite"></div>
</main>
<script>
const MOD=[
["復健總覽","monitoring","復健總覽","治療戰情、當日排程負載與復健進步趨勢"],
["個案評估","assignment_ind","個案評估","ROM 關節活動度、徒手肌力與疼痛量表初評"],
["療程計畫","clinical_notes","療程計畫","物理／職能／語言治療目標與處方"],
["復健排程","calendar_month","復健排程","治療師 × 時段排程與治療室配置"],
["進度追蹤","trending_up","進度追蹤","ROM、疼痛與肌力進步趨勢追蹤"],
["成效報告","summarize","成效報告","居家運動處方與復健成效結案報告"]
];
const nav=document.getElementById("nav"),view=document.getElementById("view"),vt=document.getElementById("vt"),vd=document.getElementById("vd");
MOD.forEach((m,i)=>{
  const b=document.createElement("button");
  b.type="button";b.dataset.i=i;b.className=i===0?"on":"";
  b.setAttribute("aria-current",i===0?"page":"false");
  b.innerHTML=`<span class="material-symbols-outlined" aria-hidden="true">${m[1]}</span><span class="lb">${m[0]}</span>`;
  b.onclick=()=>{location.hash=`v${i}`};
  nav.appendChild(b);
});
const CASES=[
["R-3082","陳文豪","陳","右膝前十字韌帶重建術後","第 6/12 次","warn","物理","t-pt","ROM 進步停滯，需調整處方"],
["R-3079","林淑惠","林","腦中風後右側偏癱","第 9/24 次","ok","職能","t-ot","上肢動作恢復良好"],
["R-3075","黃國榮","黃","下背痛 · 腰椎椎間盤突出","第 4/10 次","ok","物理","t-pt","疼痛下降至 3/10"],
["R-3071","吳美玲","吳","五十肩 · 沾黏性關節囊炎","第 8/16 次","warn","物理","t-pt","肩關節外展仍受限"],
["R-3066","張志成","張","構音障礙 · 中風後","第 5/20 次","ok","語言","t-st","口語清晰度提升"],
["R-3060","劉家瑜","劉","橈骨遠端骨折術後","第 2/8 次","bad","職能","t-ot","初評 · 疼痛與腫脹偏高"]
];
const TYPELABEL={"物理":"物理治療","職能":"職能治療","語言":"語言治療"};
const ROMD=[
["肩關節屈曲",118,180,"var(--pt)"],["肩關節外展",96,180,"var(--pt)"],
["膝關節屈曲",108,135,"var(--color-primary)"],["膝關節伸直",-8,0,"var(--warn)"],
["踝關節背屈",12,20,"var(--info)"]
];
const MMT=[["股四頭肌","4-"],["腿後肌群","4"],["脛前肌","3+"],["臀中肌","3"]];

function show(i){
  nav.querySelectorAll("button").forEach(b=>{
    const on=Number(b.dataset.i)===i;
    b.classList.toggle("on",on);
    b.setAttribute("aria-current",on?"page":"false");
  });
  vt.textContent=MOD[i][2];vd.textContent=MOD[i][3];
  view.innerHTML=SCREENS[i]();
  draw(i);
}
function fromHash(){
  const m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
