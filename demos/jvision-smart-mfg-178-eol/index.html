<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>料件停產與生命週期管理系統（EOL）｜Jvision 系統 Demo</title>
  <meta name="description" content="EOL/PCN 公告監控、影響 BOM 分析、末次下單與替代料轉換的單一平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root{
      --color-primary:#2563EB;
      --color-on-primary:#FFFFFF;
      --color-secondary:#3B82F6;
      --color-on-secondary:#000000;
      --color-accent:#EA580C;
      --color-on-accent:#000000;
      --color-background:#F8FAFC;
      --color-foreground:#1E293B;
      --color-card:#FFFFFF;
      --color-card-foreground:#1E293B;
      --color-muted:#E9EFF8;
      --color-muted-foreground:#475569;
      --color-border:#E2E8F0;
      --color-destructive:#DC2626;
      --color-on-destructive:#FFFFFF;
      --color-ring:#2563EB;
      --blue:#2563EB;
      --ink:#1E293B;
      --muted:#475569;
      --line:#E2E8F0;
      --ok:#15803D;
      --warn:#B45309;
      --bad:#DC2626;
      --radius:6px;
      --shadow:0 2px 8px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.05);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Fira Sans",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
    button{font:inherit}
    button,[data-i],[data-n0],[data-n3]{cursor:pointer}
    button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:2px}
    .ms{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;line-height:1;font-feature-settings:"liga";vertical-align:middle}
    .mono,.code,.val,.n,td.num,th.num,time{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
    .app{width:min(100%,1440px);min-height:100vh;margin:auto;background:var(--color-background)}
    .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;min-height:72px;padding:12px 24px;color:#fff;background:#163D87;border-bottom:4px solid var(--color-accent)}
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .logo{display:grid;place-items:center;width:42px;height:42px;flex:0 0 42px;border:1px solid rgba(255,255,255,.42);border-radius:4px;background:rgba(255,255,255,.1)}
    .logo .ms{font-size:25px}
    .brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.01em}
    .brand p{margin:2px 0 0;color:#DBEAFE;font-size:12px}
    .spacer{flex:1}
    .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid rgba(255,255,255,.32);border-radius:3px;background:rgba(255,255,255,.08);font-size:12px;white-space:nowrap}
    nav{position:sticky;top:72px;z-index:20;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(15,23,42,.05)}
    .navbtn{position:relative;display:flex;align-items:center;justify-content:center;gap:7px;min-height:52px;padding:9px 10px;border:0;border-right:1px solid var(--line);background:#fff;color:var(--muted);font-size:12.5px;font-weight:600;transition:color .2s,background .2s,box-shadow .2s}
    .navbtn:last-child{border-right:0}
    .navbtn:hover{background:#EFF6FF;color:#1D4ED8}
    .navbtn.active{color:#1D4ED8;background:#EFF6FF;box-shadow:inset 0 -3px 0 var(--blue)}
    .navbtn .ms{font-size:19px}
    .navidx{display:grid;place-items:center;width:20px;height:20px;border:1px solid #CBD5E1;border-radius:2px;color:#64748B;font:600 10px "Fira Code",monospace}
    .navbtn.active .navidx{color:#fff;border-color:var(--blue);background:var(--blue)}
    main{padding:22px 24px 40px}
    .screen-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
    .screen-head .ic{display:grid;place-items:center;width:42px;height:42px;flex:0 0 42px;color:#fff;background:var(--blue);border-radius:4px}
    .screen-head .ic .ms{font-size:24px}
    .screen-head h2{margin:0;font-size:21px;line-height:1.2}
    .screen-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
    .tag{margin-left:auto;padding:5px 9px;border:1px solid #86EFAC;border-radius:3px;color:#166534;background:#F0FDF4;font-size:11.5px;font-weight:700;white-space:nowrap}
    .tag::before{content:"✓";margin-right:5px}
    .card,.kpi{min-width:0;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
    .pad{padding:16px}
    .card-title{display:flex;align-items:center;gap:7px;margin:0 0 13px;font-size:14px;font-weight:700}
    .card-title .ms{color:var(--blue);font-size:19px}
    .muted{color:var(--muted)}
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
    .kpi{position:relative;padding:14px 15px;border-top:3px solid var(--blue);transition:transform .2s,box-shadow .2s}
    .kpi:hover{transform:translateY(-2px);box-shadow:0 7px 18px rgba(15,23,42,.09)}
    .kpi .lbl{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:600}
    .kpi .lbl .ms{color:var(--blue);font-size:17px}
    .kpi .val{margin-top:5px;font-size:25px;font-weight:700;letter-spacing:-.04em}
    .kpi .val small{margin-left:4px;color:var(--muted);font:600 12px "Fira Sans",sans-serif}
    .delta{margin-top:4px;font-size:11.5px;font-weight:700}
    .delta::before{display:inline-block;margin-right:5px}
    .delta.up{color:var(--ok)}.delta.up::before{content:"↑"}
    .delta.down{color:var(--bad)}.delta.down::before{content:"!"}
    .delta.warn{color:var(--warn)}.delta.warn::before{content:"△"}
    .split{display:grid;grid-template-columns:330px minmax(0,1fr);gap:14px;align-items:start}
    .split3{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:14px;align-items:start}
    .col2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
    .board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:start}
    .statrow{display:flex;gap:10px;flex-wrap:wrap}
    .stat{flex:1 1 125px;min-width:0;padding:11px 12px;background:#F8FAFC;border:1px solid var(--line);border-radius:4px}
    .stat .l{color:var(--muted);font-size:11.5px;font-weight:600}
    .stat .l .ms{margin-right:4px;color:var(--blue);font-size:15px}
    .stat .n{margin-top:3px;font-size:20px;font-weight:700}
    .listpane{max-height:560px;overflow:auto}
    .litem{display:block;width:100%;padding:12px 14px;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;color:var(--ink);transition:background .2s,box-shadow .2s}
    .litem:hover{background:#F8FAFC}
    .litem.sel{background:#EFF6FF;box-shadow:inset 4px 0 0 var(--blue)}
    .litem .r1{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .litem .code{font-size:12.5px;font-weight:700}
    .litem .sub2{margin-top:3px;color:var(--muted);font-size:11.5px}
    .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border:1px solid currentColor;border-radius:3px;font-size:10.5px;font-weight:700;white-space:nowrap}
    .badge::before{font-size:9px}
    .b-red{color:#B91C1C;background:#FEF2F2}.b-red::before{content:"!"}
    .b-amber{color:#92400E;background:#FFFBEB}.b-amber::before{content:"△"}
    .b-green{color:#166534;background:#F0FDF4}.b-green::before{content:"✓"}
    .b-blue{color:#1D4ED8;background:#EFF6FF}.b-blue::before{content:"i"}
    .b-purple{color:#6D28D9;background:#F5F3FF}.b-purple::before{content:"◆"}
    .b-gray{color:#475569;background:#F8FAFC}.b-gray::before{content:"•"}
    .tablewrap{max-width:100%;overflow:auto}
    table{width:100%;border-collapse:collapse;font-size:12px}
    th,td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
    th{position:sticky;top:0;z-index:1;color:#334155;background:#E9EFF8;font-size:11px;font-weight:700;letter-spacing:.02em}
    tbody tr:nth-child(even){background:#FBFDFF}
    tbody tr:hover{background:#EFF6FF}
    td.num,th.num{text-align:right}
    .bar{height:7px;min-width:62px;overflow:hidden;background:#E2E8F0;border-radius:2px}
    .bar>i{display:block;height:100%;background:var(--blue);border-radius:2px}
    .progwrap{display:flex;align-items:center;gap:7px}
    .dfield{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed #CBD5E1;font-size:12.5px}
    .dfield .k{color:var(--muted);font-weight:600}
    .dfield .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
    .chartbox{width:100%;height:280px;overflow:hidden}.chartbox.sm{height:230px}
    .alert{display:flex;align-items:flex-start;gap:9px;padding:11px 12px;border:1px solid #FDBA74;border-left:4px solid var(--color-accent);border-radius:4px;background:#FFF7ED}
    .alert .ms{flex:0 0 auto;color:#C2410C;font-size:20px}
    .alert .t{font-size:12.5px;font-weight:700}.alert .d{margin-top:2px;color:#7C2D12;font-size:11.5px}
    .btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
    .btn{display:inline-flex;align-items:center;gap:5px;min-height:38px;padding:7px 12px;border:1px solid #94A3B8;border-radius:4px;background:#fff;color:#334155;font-size:12px;font-weight:700;transition:background .2s,border-color .2s,transform .2s}
    .btn:hover{background:#F1F5F9;border-color:#64748B;transform:translateY(-1px)}
    .btn.pri{color:#fff;background:#C2410C;border-color:#9A3412}
    .btn.pri:hover{background:#9A3412}
    .btn .ms{font-size:17px}
    .lcbar{display:flex;gap:4px;margin:0 0 6px}
    .lcseg{flex:1;min-width:0;padding:8px 4px;color:#fff;text-align:center;border-radius:3px;font-size:10.5px;font-weight:700}
    .bcol{min-width:0;padding:9px;background:#F1F5F9;border:1px solid var(--line);border-radius:4px}
    .bcol h4{display:flex;align-items:center;justify-content:space-between;gap:5px;margin:1px 2px 9px;font-size:11.5px}
    .cnt{padding:1px 6px;border:1px solid #CBD5E1;border-radius:2px;background:#fff;color:var(--muted);font:600 10px "Fira Code"}
    .risk-dot{display:inline-block;width:9px;height:9px;margin-right:5px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 3px currentColor}
    .bcard{min-width:0;margin-bottom:8px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:3px;box-shadow:0 1px 3px rgba(15,23,42,.05);transition:transform .2s,border-color .2s}
    .bcard:hover{transform:translateY(-2px);border-color:#93C5FD}
    .bcard .t{font-size:11.5px;font-weight:700}.bcard .m{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
    .tl{position:relative;padding-left:25px}
    .tl::before{content:"";position:absolute;top:4px;bottom:4px;left:8px;width:2px;background:#CBD5E1}
    .tlitem{position:relative;padding-bottom:17px}
    .tlitem::before{content:"";position:absolute;top:3px;left:-22px;width:10px;height:10px;border:3px solid #64748B;border-radius:50%;background:#fff}
    .tlitem.done::before{border-color:var(--ok);background:var(--ok)}.tlitem.warn::before{border-color:var(--warn)}
    .tlitem .tt{font-size:12.5px;font-weight:700}.tlitem .td{margin-top:2px;color:var(--muted);font-size:11.5px}.tlitem .tm{margin-top:3px;color:#1D4ED8;font:700 10.5px "Fira Code"}
    .footer{padding:20px;text-align:center;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}
    .grid-item{animation:item-in .4s both}
    .grid-item:nth-child(2){animation-delay:.06s}.grid-item:nth-child(3){animation-delay:.12s}.grid-item:nth-child(4){animation-delay:.18s}
    @keyframes item-in{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
    @media(max-width:1024px){
      nav{grid-template-columns:repeat(3,1fr)}
      .split{grid-template-columns:290px minmax(0,1fr)}
      .board{grid-template-columns:repeat(2,1fr)}
    }
    @media(max-width:820px){
      .topbar,nav{position:static}
      .kpis{grid-template-columns:repeat(2,1fr)}
      .split,.split3,.col2{grid-template-columns:1fr}
      .listpane{max-height:330px}
    }
    @media(max-width:560px){
      .topbar{padding:11px 14px}.brand p,.chip .txt{display:none}
      .brand h1{font-size:14px}.chip{padding:6px}
      nav{grid-template-columns:repeat(6,1fr)}
      .navbtn{min-height:48px;padding:7px 3px;border-bottom:0}
      .navbtn .txt,.navidx{display:none}
      main{padding:16px 12px 30px}
      .screen-head{align-items:flex-start}.screen-head h2{font-size:18px}.tag{display:none}
      .kpis{gap:8px}.kpi{padding:12px}.kpi .val{font-size:21px}
      .board{grid-template-columns:1fr}
      .lcbar{display:grid;grid-template-columns:1fr 1fr}
    }
    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*::before,*::after{animation:none!important;transition:none!important;transform:none!important}
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true"><span class="ms">history</span></div>
        <div>
          <h1>料件停產與生命週期管理系統（EOL）</h1>
          <p>EOL/PCN 公告監控 · 影響 BOM 分析 · 末次下單 · 替代料轉換</p>
        </div>
      </div>
      <div class="spacer"></div>
      <span class="chip"><span class="ms" aria-hidden="true">factory</span><span class="txt">O翊精密製造廠</span></span>
      <span class="chip"><span class="ms" aria-hidden="true">calendar_month</span><time class="txt" datetime="2026-08-14">2026-08-14</time></span>
    </header>
    <nav id="nav" aria-label="系統模組"></nav>
    <main id="screen"></main>
    <footer class="footer">Jvision 系統 Demo · 純前端展示 · 假資料僅供介面示意</footer>
  </div>
  <script>
  (function(){
    "use strict";
    var BLUE="#2563EB",BLUE2="#3B82F6",PALE="#93C5FD",ORANGE="#EA580C";
    var chartReg={};
    var MODULES=[
      {icon:"monitoring",name:"EOL/PCN 公告監控",desc:"自動蒐集停產與變更公告"},
      {icon:"account_tree",name:"影響 BOM 分析",desc:"反查受影響機種與料號"},
      {icon:"history",name:"生命週期看板",desc:"料件各階段狀態一覽"},
      {icon:"inventory_2",name:"末次下單 (LTB)",desc:"最後採購量與時程試算"},
      {icon:"build",name:"替代料轉換",desc:"替代料驗證與轉換追蹤"},
      {icon:"insights",name:"風險儀表板",desc:"EOL 風險排序與 KPI"}
    ];
    var NOTICES=[
      {id:"PCN-2609-118",part:"MCU STM32F407VGT6",mfr:"STMicro",type:"EOL",issue:"2026-07-28",ltb:"2026-11-30",lst:"2027-05-30",boms:7,risk:"高",status:"待分析",repl:"STM32F407VGT7",note:"0.8mm 封裝製程停產，建議轉新料號"},
      {id:"PCN-2608-204",part:"DDR4 4Gb K4A4G085WF",mfr:"Sunmax",type:"PCN",issue:"2026-08-02",ltb:"2027-01-15",lst:"2027-07-15",boms:4,risk:"中",status:"分析中",repl:"K4A4G085WG",note:"晶圓製程微縮，電性相容需驗證"},
      {id:"PCN-2608-231",part:"LDO AMS1117-3.3",mfr:"AMS",type:"EOL",issue:"2026-08-05",ltb:"2026-10-31",lst:"2027-02-28",boms:12,risk:"高",status:"對策中",repl:"AP2112K-3.3",note:"引腳相容替代料已列入送測"},
      {id:"PCN-2607-090",part:"連接器 DF13-10P",mfr:"Hirose",type:"EOL",issue:"2026-07-18",ltb:"2026-09-30",lst:"2026-12-31",boms:3,risk:"高",status:"末次下單",repl:"DF13A-10P",note:"末次下單時程緊迫，已提報 LTB"},
      {id:"PCN-2606-055",part:"MOSFET AO3400A",mfr:"AOS",type:"PCN",issue:"2026-06-22",ltb:"2027-03-31",lst:"2027-09-30",boms:9,risk:"低",status:"追蹤中",repl:"同料號製程變更",note:"僅製程變更，電性不變"},
      {id:"PCN-2605-012",part:"晶振 8.000MHz HC-49",mfr:"Epson",type:"EOL",issue:"2026-05-30",ltb:"2026-09-15",lst:"2026-11-30",boms:5,risk:"中",status:"已結案",repl:"FA-238 8MHz",note:"替代料驗證通過，BOM 已切換"}
    ];
    var STATUS_BADGE={"待分析":"b-gray","分析中":"b-blue","對策中":"b-amber","末次下單":"b-red","追蹤中":"b-purple","已結案":"b-green","待核准":"b-red","試算完成":"b-green","評估中":"b-blue"};
    var RISK_BADGE={"高":"b-red","中":"b-amber","低":"b-green"};
    function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
    function el(id){return document.getElementById(id)}
    function badge(c,t){return'<span class="badge '+c+'">'+esc(t)+'</span>'}
    function riskB(r){return badge(RISK_BADGE[r]||"b-gray",r+"風險")}
    function statB(s){return badge(STATUS_BADGE[s]||"b-gray",s)}
    function disposeCharts(){Object.keys(chartReg).forEach(function(k){try{chartReg[k].dispose()}catch(e){}});chartReg={}}
    function mkChart(id,opt){var n=el(id);if(!n)return;var c=echarts.init(n,null,{renderer:"canvas"});c.setOption(opt);chartReg[id]=c}
    function grid(){return{left:48,right:16,top:28,bottom:32}}
    window.addEventListener("resize",function(){Object.keys(chartReg).forEach(function(k){try{chartReg[k].resize()}catch(e){}})});
    function kpiCard(icon,lbl,val,unit,dcls,dtxt){return'<div class="kpi grid-item"><div class="lbl"><span class="ms">'+icon+'</span>'+esc(lbl)+'</div><div class="val">'+esc(val)+(unit?'<small>'+esc(unit)+'</small>':'')+'</div><div class="delta '+dcls+'">'+esc(dtxt)+'</div></div>'}
    function statBox(l,n,icon){return'<div class="stat"><div class="l"><span class="ms">'+icon+'</span>'+esc(l)+'</div><div class="n">'+esc(n)+'</div></div>'}
    var sel0=0;
    function screen0(){
      var list=NOTICES.map(function(n,i){return'<button class="litem'+(i===sel0?' sel':'')+'" data-n0="'+i+'" aria-pressed="'+(i===sel0)+'"><div class="r1"><span class="code">'+esc(n.id)+'</span>'+badge(n.type==="EOL"?"b-red":"b-blue",n.type)+'</div><div class="sub2">'+esc(n.part)+'</div><div class="r1" style="margin-top:6px">'+riskB(n.risk)+statB(n.status)+'</div></button>'}).join("");
      return'<div class="kpis">'+kpiCard("monitoring","本月新增公告",18,"件","up","較上月 +5")+kpiCard("warning","高風險案件",3,"件","warn","需優先處理")+kpiCard("schedule","30 天內末次下單",2,"件","down","時程緊迫")+kpiCard("task_alt","已結案",1,"件","up","轉換完成")+'</div><div class="split"><section class="card"><div class="pad" style="padding-bottom:6px"><div class="card-title"><span class="ms">notifications_active</span>公告收件匣</div></div><div class="listpane" id="l0">'+list+'</div></section><section class="card pad" id="d0"></section></div>'
    }
    function render0detail(){
