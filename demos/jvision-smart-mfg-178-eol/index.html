<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>料件停產與生命週期管理系統（EOL）｜Jvision 系統 Demo</title>
  <meta name="description" content="EOL/PCN 公告監控、影響 BOM 分析、末次下單與替代料轉換的單一平台" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    :root{
      --accent:#7c3aed; --accent2:#a78bfa; --accent-soft:#f3edff;
      --ink:#1e1b2e; --sub:#6b6787; --line:#e9e5f4; --bg:#f6f4fb; --card:#ffffff;
      --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
      --radius:16px; --shadow:0 6px 24px rgba(80,50,160,.08);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.55}
    .ms{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;line-height:1;vertical-align:middle;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
    .app{max-width:1360px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
    /* Top bar */
    .topbar{display:flex;align-items:center;gap:14px;padding:16px 22px;background:linear-gradient(115deg,#5b21b6,#7c3aed 55%,#8b5cf6);color:#fff;position:sticky;top:0;z-index:30;flex-wrap:wrap;min-width:0}
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .brand .logo{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:24px;flex:0 0 auto}
    .brand h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.2px;white-space:nowrap}
    .brand p{font-size:12px;margin:2px 0 0;opacity:.82;white-space:nowrap}
    .topbar .spacer{flex:1 1 auto}
    .topbar .chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;white-space:nowrap}
    .topbar .chip .ms{font-size:16px}
    /* Nav */
    nav{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:74px;z-index:20;min-width:0}
    .navbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;color:var(--sub);padding:9px 14px;border-radius:11px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;min-width:0}
    .navbtn .ms{font-size:19px;color:var(--accent2)}
    .navbtn:hover{border-color:var(--accent2);color:var(--accent)}
    .navbtn.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(124,58,237,.32)}
    .navbtn.active .ms{color:#fff}
    .navidx{font-size:11px;font-weight:800;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 6px}
    .navbtn.active .navidx{background:rgba(255,255,255,.25);color:#fff}
    /* Screen */
    main{padding:20px 22px 40px;min-width:0}
    .screen-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap;min-width:0}
    .screen-head .ic{width:48px;height:48px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:26px;flex:0 0 auto}
    .screen-head h2{margin:0;font-size:20px;font-weight:800}
    .screen-head p{margin:3px 0 0;color:var(--sub);font-size:13.5px}
    .screen-head .tag{margin-left:auto;background:#eef7ee;color:var(--ok);border:1px solid #cfeccf;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;white-space:nowrap}
    /* generic cards */
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
    .pad{padding:16px 18px}
    .card-title{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14.5px;margin:0 0 12px}
    .card-title .ms{font-size:19px;color:var(--accent)}
    .muted{color:var(--sub)}
    /* KPI grid */
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
    .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow);min-width:0}
    .kpi .lbl{font-size:12.5px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:6px}
    .kpi .lbl .ms{font-size:17px;color:var(--accent2)}
    .kpi .val{font-size:26px;font-weight:900;margin-top:6px;letter-spacing:.3px}
    .kpi .val small{font-size:13px;font-weight:700;color:var(--sub);margin-left:3px}
    .kpi .delta{font-size:12px;font-weight:700;margin-top:4px}
    .kpi .delta.up{color:var(--ok)} .kpi .delta.down{color:var(--bad)} .kpi .delta.warn{color:var(--warn)}
    /* split layout */
    .split{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
    .split3{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:start}
    .col2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
    .col3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    /* list pane */
    .listpane{max-height:560px;overflow:auto}
    .litem{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:13px 16px;cursor:pointer;font-family:inherit;transition:.12s;min-width:0}
    .litem:hover{background:var(--accent-soft)}
    .litem.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
    .litem .r1{display:flex;align-items:center;gap:8px;justify-content:space-between}
    .litem .code{font-weight:800;font-size:13.5px}
    .litem .sub2{font-size:12px;color:var(--sub);margin-top:3px}
    /* badges */
    .badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
    .b-red{background:#fdeaea;color:var(--bad)}
    .b-amber{background:#fdf3e3;color:var(--warn)}
    .b-green{background:#e9f7ec;color:var(--ok)}
    .b-blue{background:#e8f0fe;color:var(--info)}
    .b-purple{background:var(--accent-soft);color:var(--accent)}
    .b-gray{background:#eef0f4;color:#64748b}
    /* table */
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
    th{font-size:11.5px;color:var(--sub);font-weight:700;text-transform:none;background:#faf9fe;position:sticky;top:0}
    tbody tr:hover{background:#faf9fe}
    td.num,th.num{text-align:right}
    .bar{height:7px;border-radius:5px;background:#eee6fb;overflow:hidden;min-width:60px}
    .bar > i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
    /* detail pane */
    .dfield{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
    .dfield:last-child{border-bottom:0}
    .dfield .k{color:var(--sub);font-weight:600}
    .dfield .v{font-weight:700;text-align:right}
    .chartbox{width:100%;height:280px;overflow:hidden}
    .chartbox.sm{height:230px}
    /* board */
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start}
    .bcol{background:#faf9fe;border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
    .bcol h4{margin:2px 4px 10px;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
    .bcol h4 .cnt{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--sub)}
    .bcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin-bottom:9px;box-shadow:0 2px 6px rgba(80,50,160,.05);min-width:0}
    .bcard .t{font-weight:800;font-size:12.5px}
    .bcard .m{font-size:11.5px;color:var(--sub);margin-top:4px;display:flex;flex-wrap:wrap;gap:5px}
    /* timeline */
    .tl{position:relative;padding-left:26px}
    .tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
    .tlitem{position:relative;padding:0 0 18px}
    .tlitem::before{content:"";position:absolute;left:-21px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--accent2)}
    .tlitem.done::before{background:var(--accent);border-color:var(--accent)}
    .tlitem.warn::before{border-color:var(--warn)}
    .tlitem .tt{font-weight:800;font-size:13.5px}
    .tlitem .td{font-size:12.5px;color:var(--sub);margin-top:2px}
    .tlitem .tm{font-size:11.5px;color:var(--accent);font-weight:700;margin-top:3px}
    /* stepper / gauge stat */
    .statrow{display:flex;gap:14px;flex-wrap:wrap}
    .stat{flex:1 1 120px;background:#faf9fe;border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
    .stat .n{font-size:22px;font-weight:900}
    .stat .l{font-size:12px;color:var(--sub);font-weight:600;margin-top:2px}
    /* lifecycle stages */
    .lcbar{display:flex;gap:6px;margin:14px 0 4px}
    .lcseg{flex:1;text-align:center;padding:9px 4px;border-radius:9px;font-size:11.5px;font-weight:700;background:#eef0f4;color:#64748b;min-width:0}
    .lcseg.on{color:#fff}
    .risk-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
    .alert{display:flex;gap:10px;align-items:flex-start;background:#fff8ef;border:1px solid #f6e2c2;border-radius:12px;padding:12px 14px}
    .alert .ms{color:var(--warn);font-size:22px;flex:0 0 auto}
    .alert .t{font-weight:800;font-size:13px}
    .alert .d{font-size:12.5px;color:var(--sub);margin-top:2px}
    .progwrap{display:flex;align-items:center;gap:8px}
    .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
    .btn{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:10px;padding:8px 13px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
    .btn .ms{font-size:17px}
    .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
    .footer{padding:22px;text-align:center;color:var(--sub);font-size:12px}
    /* responsive */
    @media(max-width:1024px){ .split{grid-template-columns:300px 1fr} }
    @media(max-width:860px){
      nav{top:0;position:static}
      .board{grid-template-columns:1fr 1fr}
    }
    @media(max-width:820px){
      .kpis{grid-template-columns:1fr 1fr}
      .split,.split3,.col2,.col3{grid-template-columns:1fr}
      .listpane{max-height:340px}
    }
    @media(max-width:560px){
      .kpis{grid-template-columns:1fr 1fr}
      .board{grid-template-columns:1fr}
      .navbtn .txt{display:none}
      .navbtn{padding:9px 11px}
      .brand p{display:none}
      .topbar .chip .txt{display:none}
    }
  /*ovfix178*/@media(max-width:820px){.two,.g2,.g3,.g11,.g23,.g13,[class*="grid"],[class*="split"],[class*="cols"]{grid-template-columns:1fr !important}}.card,.pad,.two>*,[class*="grid"]>*{min-width:0}table{max-width:100%}.chart,.chartbox,.chart-box,[class*="chart"]{overflow:hidden;max-width:100%}</style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="logo"><span class="ms">history</span></div>
        <div>
          <h1>料件停產與生命週期管理系統（EOL）</h1>
          <p>EOL/PCN 公告監控 · 影響 BOM 分析 · 末次下單 · 替代料轉換</p>
        </div>
      </div>
      <div class="spacer"></div>
      <span class="chip"><span class="ms">factory</span><span class="txt">O翊精密製造廠</span></span>
      <span class="chip"><span class="ms">calendar_month</span><span class="txt">2026-08-14</span></span>
    </div>
    <nav id="nav"></nav>
    <main id="screen"></main>
    <div class="footer">Jvision 系統 Demo · 純前端展示 · 假資料僅供介面示意</div>
  </div>

<script>
(function(){
  "use strict";
  var COLORS=["#7c3aed","#a78bfa","#c4b5fd","#8b5cf6","#6d28d9","#5b21b6"];
  var chartReg={}; // id -> echarts instance

  var MODULES=[
    {icon:"monitoring",name:"EOL/PCN 公告監控",desc:"自動蒐集停產與變更公告"},
    {icon:"account_tree",name:"影響 BOM 分析",desc:"反查受影響機種與料號"},
    {icon:"history",name:"生命週期看板",desc:"料件各階段狀態一覽"},
    {icon:"inventory_2",name:"末次下單 (LTB)",desc:"最後採購量與時程試算"},
    {icon:"build",name:"替代料轉換",desc:"替代料驗證與轉換追蹤"},
    {icon:"insights",name:"風險儀表板",desc:"EOL 風險排序與 KPI"}
  ];

  // ---------- fake data ----------
  var NOTICES=[
    {id:"PCN-2609-118",part:"MCU STM32F407VGT6",mfr:"STMicro",type:"EOL",issue:"2026-07-28",ltb:"2026-11-30",lst:"2027-05-30",boms:7,risk:"高",status:"待分析",repl:"STM32F407VGT7",note:"0.8mm 封裝製程停產，建議轉新料號"},
    {id:"PCN-2608-204",part:"DDR4 4Gb K4A4G085WF",mfr:"Sunmax",type:"PCN",issue:"2026-08-02",ltb:"2027-01-15",lst:"2027-07-15",boms:4,risk:"中",status:"分析中",repl:"K4A4G085WG",note:"晶圓製程微縮，電性相容需驗證"},
    {id:"PCN-2608-231",part:"LDO AMS1117-3.3",mfr:"AMS",type:"EOL",issue:"2026-08-05",ltb:"2026-10-31",lst:"2027-02-28",boms:12,risk:"高",status:"對策中",repl:"AP2112K-3.3",note:"引腳相容替代料已列入送測"},
    {id:"PCN-2607-090",part:"連接器 DF13-10P",mfr:"Hirose",type:"EOL",issue:"2026-07-18",ltb:"2026-09-30",lst:"2026-12-31",boms:3,risk:"高",status:"末次下單",repl:"DF13A-10P",note:"末次下單時程緊迫，已提報 LTB"},
    {id:"PCN-2606-055",part:"MOSFET AO3400A",mfr:"AOS",type:"PCN",issue:"2026-06-22",ltb:"2027-03-31",lst:"2027-09-30",boms:9,risk:"低",status:"追蹤中",repl:"同料號製程變更",note:"僅製程變更，電性不變"},
    {id:"PCN-2605-012",part:"晶振 8.000MHz HC-49",mfr:"Epson",type:"EOL",issue:"2026-05-30",ltb:"2026-09-15",lst:"2026-11-30",boms:5,risk:"中",status:"已結案",repl:"FA-238 8MHz",note:"替代料驗證通過，BOM 已切換"}
  ];
  var STATUS_BADGE={"待分析":"b-gray","分析中":"b-blue","對策中":"b-amber","末次下單":"b-red","追蹤中":"b-purple","已結案":"b-green"};
  var RISK_BADGE={"高":"b-red","中":"b-amber","低":"b-green"};

  // ---------- helpers ----------
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
  function el(id){return document.getElementById(id);}
  function badge(cls,txt){return '<span class="badge '+cls+'">'+esc(txt)+'</span>';}
  function riskB(r){return badge(RISK_BADGE[r]||"b-gray",r);}
  function statB(s){return badge(STATUS_BADGE[s]||"b-gray",s);}

  function disposeCharts(){
    for(var k in chartReg){ if(chartReg[k]){ try{chartReg[k].dispose();}catch(e){} } }
    chartReg={};
  }
  function mkChart(id,opt){
    var node=el(id); if(!node) return;
    if(chartReg[id]){ try{chartReg[id].dispose();}catch(e){} }
    var c=echarts.init(node,null,{renderer:"canvas"});
    c.setOption(opt);
    chartReg[id]=c;
  }
  window.addEventListener("resize",function(){ for(var k in chartReg){ if(chartReg[k]){ try{chartReg[k].resize();}catch(e){} } } });

  function baseGrid(){return {left:44,right:16,top:26,bottom:30};}

  // ---------- SCREEN 0: EOL/PCN 公告監控 (split two-pane) ----------
  var sel0=0;
  function screen0(){
    var kpis=''+
      kpiCard("monitoring","本月新增公告",18,"件","up","較上月 +5")+
      kpiCard("warning","高風險案件",3,"件","warn","需優先處理")+
      kpiCard("schedule","30 天內末次下單",2,"件","down","時程緊迫")+
      kpiCard("task_alt","已結案",1,"件","up","轉換完成");
    var list=NOTICES.map(function(n,i){
      return '<button class="litem'+(i===sel0?' sel':'')+'" data-n0="'+i+'">'+
        '<div class="r1"><span class="code">'+esc(n.id)+'</span>'+badge(n.type==="EOL"?"b-red":"b-blue",n.type)+'</div>'+
        '<div class="sub2">'+esc(n.part)+'</div>'+
        '<div class="r1" style="margin-top:6px">'+riskB(n.risk)+statB(n.status)+'</div>'+
      '</button>';
    }).join("");
    return '<div class="kpis">'+kpis+'</div>'+
      '<div class="split">'+
        '<div class="card"><div class="pad" style="padding-bottom:8px"><div class="card-title"><span class="ms">notifications_active</span>公告收件匣</div></div>'+
          '<div class="listpane" id="l0">'+list+'</div></div>'+
        '<div class="card pad" id="d0"></div>'+
      '</div>';
  }
  function render0detail(){
    var n=NOTICES[sel0]; if(!n)return;
    el("d0").innerHTML=''+
      '<div class="screen-head" style="margin-bottom:12px"><div class="ic"><span class="ms">description</span></div>'+
        '<div style="min-width:0"><h2 style="font-size:18px">'+esc(n.id)+'</h2><p>'+esc(n.mfr)+' · '+esc(n.part)+'</p></div>'+
        '<span class="tag" style="background:var(--accent-soft);color:var(--accent);border-color:var(--accent2)">'+esc(n.type)+' 公告</span></div>'+
      '<div class="alert" style="margin-bottom:14px"><span class="ms">'+(n.risk==="高"?"error":"info")+'</span><div><div class="t">'+esc(n.note)+'</div><div class="d">建議替代：'+esc(n.repl)+'</div></div></div>'+
      '<div class="col2">'+
        '<div>'+
          '<div class="dfield"><span class="k">公告發布日</span><span class="v">'+esc(n.issue)+'</span></div>'+
          '<div class="dfield"><span class="k">末次下單日 (LTB)</span><span class="v" style="color:var(--bad)">'+esc(n.ltb)+'</span></div>'+
          '<div class="dfield"><span class="k">末次交貨日 (LST)</span><span class="v">'+esc(n.lst)+'</span></div>'+
        '</div>'+
        '<div>'+
          '<div class="dfield"><span class="k">風險等級</span><span class="v">'+riskB(n.risk)+'</span></div>'+
          '<div class="dfield"><span class="k">處理狀態</span><span class="v">'+statB(n.status)+'</span></div>'+
          '<div class="dfield"><span class="k">受影響 BOM</span><span class="v">'+n.boms+' 個機種</span></div>'+
        '</div>'+
      '</div>'+
      '<div class="card-title" style="margin:16px 0 6px"><span class="ms">insights</span>公告來源趨勢（近 6 個月）</div>'+
      '<div class="chartbox sm" id="c0"></div>'+
      '<div class="btnrow"><button class="btn pri"><span class="ms">account_tree</span>展開影響 BOM 分析</button>'+
      '<button class="btn"><span class="ms">forward_to_inbox</span>指派負責人</button></div>';
    void el("d0").offsetHeight;
    mkChart("c0",{
      grid:baseGrid(),tooltip:{trigger:"axis"},
      legend:{data:["EOL","PCN"],right:0,top:0,textStyle:{fontSize:11}},
      xAxis:{type:"category",data:["3月","4月","5月","6月","7月","8月"],axisLine:{lineStyle:{color:"#ddd"}},axisLabel:{color:"#6b6787"}},

      cb(+b.getAttribute("data-"+attr));
    });

  function refreshSel(listId){
    var lp=el(listId); if(!lp)return;
    var attr=listId==="l0"?"n0":"n3";
    var sel=listId==="l0"?sel0:sel3;
    var btns=lp.querySelectorAll("[data-"+attr+"]");
    for(var i=0;i<btns.length;i++){
      if(+btns[i].getAttribute("data-"+attr)===sel) btns[i].classList.add("sel");
      else btns[i].classList.remove("sel");
    }
  }

  // ---------- nav ----------
  function buildNav(){
    var nav=el("nav");
    nav.innerHTML=MODULES.map(function(m,i){
      return '<button class="navbtn" data-i="'+i+'"><span class="navidx">'+i+'</span><span class="ms">'+m.icon+'</span><span class="txt">'+esc(m.name)+'</span></button>';
    }).join("");
    nav.addEventListener("click",function(ev){
      var b=ev.target.closest("[data-i]"); if(!b)return;
      var i=+b.getAttribute("data-i");
      location.hash="v"+i;
    });
  }

  function setActiveNav(i){
    var btns=document.querySelectorAll("[data-i]");
    for(var k=0;k<btns.length;k++){
      if(+btns[k].getAttribute("data-i")===i) btns[k].classList.add("active");
      else btns[k].classList.remove("active");
    }
  }

  function show(i){
    disposeCharts();
    var m=MODULES[i]||MODULES[0];
    var sc=SCREENS[i]||SCREENS[0];
    var container=el("screen");
    container.innerHTML=''+
      '<div class="screen-head"><div class="ic"><span class="ms">'+m.icon+'</span></div>'+
        '<div style="min-width:0"><h2>'+esc(m.name)+'</h2><p>'+esc(m.desc)+'</p></div>'+
        '<span class="tag">模組 '+i+' / 5 · 即時運作中</span></div>'+
      sc.build();
    void container.offsetHeight;
    setActiveNav(i);
    if(sc.after) sc.after();
  }
  window.show=show;

  buildNav();

  function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
  window.addEventListener("hashchange",fromHash);fromHash();
})();
</script>
</body>
</html>
