<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>業務外勤管理 Field Sales Management</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --accent:#4f46e5;--accent2:#818cf8;--bg:#f5f6fb;--card:#ffffff;
  --ink:#1e293b;--muted:#64748b;--line:#e6e8f2;--soft:#eef0fb;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#0ea5e9;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",sans-serif;
  background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.app{display:flex;min-height:100vh;align-items:stretch;}
.sidebar{
  width:248px;flex:0 0 248px;background:var(--card);
  border-right:1px solid var(--line);padding:20px 14px;
  display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;}
.brand .logo{
  width:40px;height:40px;border-radius:11px;flex:0 0 40px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 16px rgba(79,70,229,.32);
}
.brand .logo .material-symbols-outlined{font-size:24px;}
.brand b{font-size:15px;font-weight:800;letter-spacing:.2px;}
.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:2px;}
.nav{display:flex;flex-direction:column;gap:4px;min-width:0;}
.nav button{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  border:none;background:transparent;color:var(--muted);
  padding:11px 12px;border-radius:11px;cursor:pointer;font-size:13.5px;
  font-family:inherit;font-weight:600;transition:.15s;min-width:0;
}
.nav button .material-symbols-outlined{font-size:21px;flex:0 0 auto;}
.nav button .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nav button:hover{background:var(--soft);color:var(--accent);}
.nav button.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 15px rgba(79,70,229,.28);}
.side-foot{margin-top:auto;padding:12px 10px 2px;color:var(--muted);font-size:11px;line-height:1.6;border-top:1px solid var(--line);}
.main{flex:1 1 auto;min-width:0;padding:26px 30px 60px;}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px;}
.topbar h1{font-size:22px;margin:0 0 4px;font-weight:800;}
.topbar .sub{color:var(--muted);font-size:13px;margin:0;}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--accent);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;}
.pill .material-symbols-outlined{font-size:17px;}
.grid{display:grid;gap:16px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:1.7fr 1fr;}
.g32{grid-template-columns:1fr 1.6fr;}
.grid>*{min-width:0;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;}
.card h3{margin:0 0 14px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:20px;color:var(--accent);}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0;position:relative;overflow:hidden;}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:64px;height:64px;border-radius:50%;background:var(--soft);}
.kpi .k-ico{width:38px;height:38px;border-radius:11px;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:12px;position:relative;z-index:1;}
.kpi .k-ico .material-symbols-outlined{font-size:21px;}
.kpi .k-label{color:var(--muted);font-size:12.5px;font-weight:600;position:relative;z-index:1;}
.kpi .k-val{font-size:26px;font-weight:800;margin-top:3px;position:relative;z-index:1;letter-spacing:-.5px;}
.kpi .k-val small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px;}
.kpi .k-delta{font-size:11.5px;font-weight:700;margin-top:6px;position:relative;z-index:1;display:inline-flex;align-items:center;gap:3px;}
.kpi .k-delta .material-symbols-outlined{font-size:15px;}
.up{color:var(--ok);}.down{color:var(--bad);}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
th{color:var(--muted);font-weight:700;font-size:11.5px;letter-spacing:.4px;background:#fafbff;}
tbody tr:hover{background:#fafbff;}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;}
.t-ok{background:#dcfce7;color:#15803d;}
.t-warn{background:#fef3c7;color:#b45309;}
.t-bad{background:#fee2e2;color:#b91c1c;}
.t-info{background:#e0f2fe;color:#0369a1;}
.t-mut{background:#eef0fb;color:#4f46e5;}
.chart{width:100%;height:280px;overflow:hidden;}
.chart.sm{height:230px;}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0;}
.board>*{min-width:0;}
.col{background:#fafbff;border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0;}
.col .col-h{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:800;margin-bottom:10px;padding:0 4px;}
.col .col-h .cnt{background:var(--soft);color:var(--accent);border-radius:999px;padding:1px 9px;font-size:11px;}
.tk{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin-bottom:9px;box-shadow:0 1px 2px rgba(30,41,59,.04);}
.tk .tk-t{font-weight:700;font-size:12.5px;margin-bottom:5px;}
.tk .tk-m{color:var(--muted);font-size:11px;display:flex;align-items:center;gap:5px;margin-bottom:3px;}
.tk .tk-m .material-symbols-outlined{font-size:14px;}
.tk .bar{height:5px;border-radius:3px;background:var(--soft);margin-top:8px;overflow:hidden;}
.tk .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;}
.tl{position:relative;padding-left:8px;}
.tl-item{position:relative;padding:0 0 20px 26px;border-left:2px solid var(--line);}
.tl-item:last-child{border-left-color:transparent;padding-bottom:0;}
.tl-item .dot{position:absolute;left:-9px;top:0;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--accent);}
.tl-item.done .dot{background:var(--accent);}
.tl-item .tm{font-size:11.5px;color:var(--accent);font-weight:800;}
.tl-item .ti{font-size:13.5px;font-weight:700;margin:2px 0 3px;}
.tl-item .td{font-size:12px;color:var(--muted);line-height:1.55;}
.map{position:relative;background:linear-gradient(135deg,#eef0fb,#f7f8fd);border:1px solid var(--line);border-radius:16px;height:320px;overflow:hidden;}
.map .route{position:absolute;inset:0;}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;cursor:pointer;}
.pin .head{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(79,70,229,.4);border:2px solid #fff;}
.pin .head .num{transform:rotate(45deg);color:#fff;font-weight:800;font-size:13px;}
.pin.ok .head{background:var(--ok);}
.pin.now .head{background:var(--warn);}
.pin .lbl{margin-top:5px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:10.5px;font-weight:700;white-space:nowrap;box-shadow:0 2px 6px rgba(30,41,59,.08);}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted);}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:11px;height:11px;border-radius:50%;display:inline-block;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;}
.fbox{border:1px solid var(--line);background:#fafbff;border-radius:10px;padding:11px 13px;font-size:13px;line-height:1.6;}
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chip{background:var(--soft);color:var(--accent);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;}
.gps-badge{display:inline-flex;align-items:center;gap:6px;background:#dcfce7;color:#15803d;border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:700;}
.gps-badge .material-symbols-outlined{font-size:18px;}
.rev{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.rev:last-child{border-bottom:none;}
.rev .av{width:40px;height:40px;border-radius:11px;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 auto;}
.rev .rev-b{flex:1 1 180px;min-width:0;}
.rev .rev-b b{font-size:13.5px;}
.rev .rev-b p{margin:2px 0 0;color:var(--muted);font-size:12px;}
.btn{border:none;border-radius:9px;padding:7px 14px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn.ok{background:var(--accent);color:#fff;}
.btn.gh{background:var(--soft);color:var(--accent);}
.rank{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);}
.rank:last-child{border-bottom:none;}
.rank .no{width:26px;height:26px;border-radius:8px;background:var(--soft);color:var(--accent);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.rank .no.top{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;}
.rank .rk-b{flex:1 1 auto;min-width:0;}
.rank .rk-b b{font-size:13px;}
.rank .rk-bar{height:7px;border-radius:4px;background:var(--soft);margin-top:5px;overflow:hidden;}
.rank .rk-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.rank .rk-v{font-weight:800;font-size:14px;flex:0 0 auto;}
.mini-note{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.6;}
.flowline{display:flex;align-items:center;gap:0;flex-wrap:wrap;}
.flowline .fstep{flex:1 1 auto;min-width:0;text-align:center;position:relative;padding:0 4px;}
.flowline .fstep .fs-ico{width:44px;height:44px;border-radius:13px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--accent);border:2px solid var(--line);}
.flowline .fstep.on .fs-ico{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;}
.flowline .fstep .fs-t{font-size:12px;font-weight:700;}
.flowline .fstep .fs-r{font-size:10.5px;color:var(--muted);margin-top:2px;}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr);}.board{grid-template-columns:repeat(2,1fr);}}
@media(max-width:860px){
  .app{flex-direction:column;}
  .sidebar{width:100%;flex:none;height:auto;position:static;border-right:none;border-bottom:1px solid var(--line);padding:14px;}
  .brand{padding:2px 4px 12px;}
  .side-foot{display:none;}
  .nav{flex-direction:row;flex-wrap:wrap;gap:8px;}
  .nav button{width:auto;flex:0 0 auto;padding:9px 13px;}
  .main{padding:20px 16px 50px;}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
}
@media(max-width:560px){
  .nav button .txt{display:none;}
  .nav button{padding:10px;}
  .board{grid-template-columns:1fr;}
  .topbar h1{font-size:19px;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">directions_car</span></div>
      <div>
        <b>外勤業務管理</b>
        <small>Field Sales Management</small>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      純 UI 展示 · 擬真資料<br/>與專案詳細頁模組／流程一致
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="scr-title">拜訪行程規劃</h1>
        <p class="sub" id="scr-sub">依客戶與路線排定每日外勤行程與拜訪目標</p>
      </div>
      <div class="pill"><span class="material-symbols-outlined">event_available</span><span>2026-08-14　週四</span></div>
    </div>
    <div id="screen"></div>
  </main>
</div>

<script>
(function(){
"use strict";

var MODULES=[
  {icon:"calendar_month",name:"拜訪行程規劃",desc:"依客戶與路線排定每日外勤行程與拜訪目標"},
  {icon:"task_alt",name:"GPS 定位簽到",desc:"現場定位打卡驗證到訪真實性與停留時間"},
  {icon:"description",name:"現場拜訪報告",desc:"填寫拜訪結果、商談重點與後續跟進事項"},
  {icon:"fact_check",name:"主管審閱簽核",desc:"主管檢視拜訪報告並核准或退回補正"},
  {icon:"monitoring",name:"外勤績效統計",desc:"拜訪達成率、每日拜訪數與人員排行"},
  {icon:"account_tree",name:"客戶與商機同步",desc:"拜訪紀錄回寫 CRM 商機與銷售管線"}
];

var chartReg={};
function disposeCharts(){
  for(var k in chartReg){ if(chartReg[k]){ try{chartReg[k].dispose();}catch(e){} chartReg[k]=null; } }
  chartReg={};
}
function mkChart(id,opt){
  var el=document.getElementById(id);
  if(!el) return;
  var c=echarts.init(el);
  c.setOption(opt);
  chartReg[id]=c;
}

var PALETTE=["#4f46e5","#818cf8","#a5b4fc","#c7d2fe","#6366f1"];
var FONT={fontFamily:"Inter, Noto Sans TC, sans-serif"};
function merge(o){ o.color=o.color||PALETTE; o.textStyle=FONT; return o; }

var VISITS=[
  {no:1,cust:"O達精機股份有限公司",time:"09:00",area:"新北 · 五股",goal:"新品導入簡報",stat:"已簽到",x:22,y:30,lat:25.083,lng:121.438},
  {no:2,cust:"O睿自動化科技",time:"10:30",area:"新北 · 三重",goal:"設備報價回訪",stat:"已簽到",x:40,y:52,lat:25.072,lng:121.488},
  {no:3,cust:"永O五金工業",time:"13:30",area:"桃園 · 龜山",goal:"合約續約洽談",stat:"進行中",x:58,y:38,lat:25.037,lng:121.348},
  {no:4,cust:"O詠模具廠",time:"15:00",area:"桃園 · 中壢",goal:"售後保養跟進",stat:"未到訪",x:74,y:62,lat:24.953,lng:121.225},
  {no:5,cust:"O豐機械有限公司",time:"16:30",area:"桃園 · 平鎮",goal:"新客戶開發",stat:"未到訪",x:86,y:34,lat:24.920,lng:121.205}
];

function s0(){
  var rows=VISITS.map(function(v){
    var t=v.stat==="已簽到"?"t-ok":v.stat==="進行中"?"t-warn":"t-mut";
    return "<tr><td><b>"+v.no+"</b></td><td>"+v.cust+"</td><td>"+v.time+"</td><td>"+v.area+"</td><td>"+v.goal+"</td><td><span class='tag "+t+"'>"+v.stat+"</span></td></tr>";
  }).join("");
  var pins=VISITS.map(function(v){
    var cls=v.stat==="已簽到"?"ok":v.stat==="進行中"?"now":"";
    return "<div class='pin "+cls+"' style='left:"+v.x+"%;top:"+v.y+"%'><div class='head'><span class='num'>"+v.no+"</span></div><div class='lbl'>"+v.time+" "+v.cust.slice(0,4)+"</div></div>";
  }).join("");
  return ""
  +"<div class='grid g4' style='margin-bottom:16px'>"
    +kpi("route","今日排定拜訪","5","家","up","較昨日 +1")
    +kpi("check_circle","已完成到訪","2","家","up","達成率 40%")
    +kpi("directions_car","預估里程","62","km","","5 個站點")
    +kpi("timer","平均停留","41","分","up","目標 35 分")
  +"</div>"
  +"<div class='grid g23'>"
    +"<div class='card'><h3><span class='material-symbols-outlined'>map</span>今日拜訪路線圖</h3>"
      +"<div class='map'><div id='visitmap' style='height:100%;width:100%'></div></div>"
      +"<div class='legend'><span><i style='background:var(--ok)'></i>已簽到</span><span><i style='background:var(--warn)'></i>進行中</span><span><i style='background:var(--accent)'></i>待拜訪</span></div>"
    +"</div>"
    +"<div class='card'><h3><span class='material-symbols-outlined'>flag</span>當日目標與提醒</h3>"
      +"<div class='field'><label>拜訪目標</label><div class='fbox'>本日聚焦新品導入與續約洽談，優先完成O達精機簡報與永O五金續約。</div></div>"
      +"<div class='field'><label>路線類型</label><div class='chips'><span class='chip'>五股→三重→龜山</span><span class='chip'>中壢→平鎮</span></div></div>"
      +"<div class='field'><label>系統提醒</label>"
        +"<div class='fbox' style='border-color:#fde68a;background:#fffbeb;color:#92400e'>永O五金合約 8/25 到期，續約報價需今日確認決策者。</div></div>"
      +"<div class='mini-note'>RULE-01 · 報價期限 2026-08-25 前且未確認決策者者優先排入行程。</div>"
    +"</div>"
  +"</div>"
  +"<div class='card' style='margin-top:16px'><h3><span class='material-symbols-outlined'>list_alt</span>行程明細</h3>"
    +"<div class='scroll'><table><thead><tr><th>#</th><th>客戶</th><th>時間</th><th>區域</th><th>拜訪目的</th><th>狀態</th></tr></thead><tbody>"+rows+"</tbody></table></div></div>";
}
function svgRoute(){
  return "<svg viewBox='0 0 100 100' preserveAspectRatio='none' style='width:100%;height:100%;position:absolute;inset:0'>"
    +"<polyline points='22,30 40,52 58,38 74,62 86,34' fill='none' stroke='#818cf8' stroke-width='0.8' stroke-dasharray='2 1.5' stroke-linejoin='round'/></svg>";
}

function s1(){
  var log=[
    {t:"09:02",c:"O達精機股份有限公司",act:"進場簽到",gps:"25.083, 121.436",acc:"±8m",st:"已驗證"},
    {t:"09:50",c:"O達精機股份有限公司",act:"離場打卡",gps:"25.083, 121.436",acc:"±6m",st:"已驗證"},
    {t:"10:34",c:"O睿自動化科技",act:"進場簽到",gps:"25.061, 121.494",acc:"±11m",st:"已驗證"},
    {t:"11:09",c:"O睿自動化科技",act:"離場打卡",gps:"25.060, 121.495",acc:"±9m",st:"已驗證"},
    {t:"13:31",c:"永O五金工業",act:"進場簽到",gps:"25.020, 121.360",acc:"±34m",st:"待複核"}
  ];
  var rows=log.map(function(l){
    var t=l.st==="已驗證"?"t-ok":"t-warn";
    return "<tr><td>"+l.t+"</td><td>"+l.c+"</td><td>"+l.act+"</td><td>"+l.gps+"</td><td>"+l.acc+"</td><td><span class='tag "+t+"'>"+l.st+"</span></td></tr>";
  }).join("");

  return "<div class='kpi'><div class='k-ico'><span class='material-symbols-outlined'>"+icon+"</span></div>"
    +"<div class='k-label'>"+label+"</div><div class='k-val'>"+val+(unit?"<small>"+unit+"</small>":"")+"</div>"+d+"</div>";

  }).join("");
  var btns=nav.querySelectorAll("button");
  for(var j=0;j<btns.length;j++){
    (function(b){ b.addEventListener("click",function(){ location.hash="go="+b.getAttribute("data-i"); }); })(btns[j]);
  }
}

function show(i){
  disposeCharts();
  var m=MODULES[i]||MODULES[0];
  document.getElementById("scr-title").textContent=m.name;
  document.getElementById("scr-sub").textContent=m.desc;
  var btns=document.querySelectorAll("#nav button");
  for(var j=0;j<btns.length;j++){ btns[j].classList.toggle("active",+btns[j].getAttribute("data-i")===i); }
  var cont=document.getElementById("screen");
  cont.innerHTML=(SCREENS[i]||s0)();
  void cont.offsetHeight;
  if(CHARTS[i]) CHARTS[i]();
  if(i===0){ initVisitMap(); } else if(window.__VMAP){ try{window.__VMAP.remove();}catch(e){} window.__VMAP=null; }
}
function initVisitMap(){
  var el=document.getElementById("visitmap"); if(!el||typeof L==="undefined") return;
  if(window.__VMAP){ try{window.__VMAP.remove();}catch(e){} }
  var mp=L.map(el,{zoomControl:true,scrollWheelZoom:false,attributionControl:false}); window.__VMAP=mp;
  L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",{maxZoom:19}).addTo(mp);
  var ll=[];
  VISITS.forEach(function(v){ var c=v.stat==="已簽到"?"#16a34a":v.stat==="進行中"?"#f59e0b":"#4f46e5"; ll.push([v.lat,v.lng]);
    var ic=L.divIcon({className:"",iconSize:[28,28],iconAnchor:[14,28],html:"<div style='background:"+c+";width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 3px 8px rgba(30,41,59,.35);display:flex;align-items:center;justify-content:center'><span style='transform:rotate(45deg);color:#fff;font-weight:800;font-size:12px'>"+v.no+"</span></div>"});
    L.marker([v.lat,v.lng],{icon:ic}).addTo(mp).bindPopup("<b>"+v.time+" "+v.cust+"</b><br>"+v.area+" · "+v.goal+"<br>狀態："+v.stat);
  });
  L.polyline(ll,{color:"#6366f1",weight:3,dashArray:"6 7",opacity:.75}).addTo(mp);
  try{ mp.fitBounds(ll,{padding:[38,38]}); }catch(e){ mp.setView([25.0,121.34],11); }
  requestAnimationFrame(function(){ if(window.__VMAP) window.__VMAP.invalidateSize(); });
}

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
