<html lang="zh-Hant">
<head>

<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
--color-primary:#2563eb;--color-on-primary:#fff;--color-secondary:#3b82f6;--color-on-secondary:#000;
--color-accent:#059669;--color-on-accent:#000;--color-background:#f8fafc;--color-foreground:#0f172a;
--color-card:#fff;--color-card-foreground:#0f172a;--color-muted:#f1f5fd;--color-muted-foreground:#475569;
--color-border:#e4ecfc;--color-destructive:#dc2626;--color-on-destructive:#fff;--color-ring:#2563eb;
--blue:#2563eb;--ink:#0f172a;--muted:#475569;--line:#e4ecfc;
--ok:#047857;--warn:#a16207;--bad:#dc2626;--info:#0369a1;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{background:var(--color-background);color:var(--ink);font-family:"Fira Sans",sans-serif;-webkit-font-smoothing:antialiased}
button,a,[role=button],.leaflet-control-zoom a{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible,.leaflet-interactive:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.app{display:flex;min-height:100vh}
.sidebar{width:260px;flex:0 0 260px;background:#fff;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.logo{width:42px;height:42px;display:grid;place-items:center;background:var(--blue);color:#fff;border-radius:8px}
.logo .material-symbols-outlined{font-size:24px}
.brand b{display:block;font-size:15px;line-height:1.25}
.brand small{display:block;margin-top:3px;color:var(--muted);font:500 10px/1.3 "Fira Code",monospace;letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:5px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;min-height:44px;padding:10px 12px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--muted);font:600 13px "Fira Sans",sans-serif;text-align:left;transition:background-color .18s ease,color .18s ease,border-color .18s ease}
.nav button:hover{background:var(--color-muted);color:var(--blue);border-color:var(--line)}
.nav button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.nav button .material-symbols-outlined{font-size:20px}
.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.65}
.main{flex:1;min-width:0;padding:28px 32px 56px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.topbar h1{margin:0 0 5px;font-size:25px;line-height:1.2;letter-spacing:-.02em}
.sub{margin:0;color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:8px 12px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--blue);font:600 12px "Fira Code",monospace;white-space:nowrap}
.grid{display:grid;gap:16px;min-width:0}.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr)}.g32{grid-template-columns:minmax(280px,1fr) minmax(0,1.6fr)}
.card,.kpi{background:#fff;border:1px solid var(--line);border-radius:10px}
.card{padding:19px}.card h3{display:flex;align-items:center;gap:8px;margin:0 0 16px;font-size:15px}
.card h3 .material-symbols-outlined{color:var(--blue);font-size:20px}
.kpi{position:relative;padding:16px 17px;border-top:3px solid var(--blue);overflow:hidden}
.kpi:nth-child(2n){border-top-color:var(--color-accent)}
.k-ico{width:34px;height:34px;display:grid;place-items:center;margin-bottom:13px;border-radius:6px;background:var(--color-muted);color:var(--blue)}
.k-ico .material-symbols-outlined{font-size:19px}
.k-label{color:var(--muted);font-size:12px;font-weight:600}
.k-val{margin-top:4px;font:700 27px/1.15 "Fira Code",monospace;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.k-val small{margin-left:4px;color:var(--muted);font:600 12px "Fira Sans",sans-serif}
.k-delta{display:inline-flex;align-items:center;gap:3px;margin-top:8px;font-size:11.5px;font-weight:600}.k-delta .material-symbols-outlined{font-size:15px}
.up{color:var(--ok)}.down{color:var(--bad)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:13px}
th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--color-muted);color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.04em}
td:first-child,td:nth-child(3),td:nth-child(4),td:nth-child(5){font-variant-numeric:tabular-nums}
tbody tr{transition:background-color .18s ease}tbody tr:hover{background:#f8fbff}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border:1px solid currentColor;border-radius:5px;font-size:11px;font-weight:700}
.tag:before{content:"";width:6px;height:6px;border:2px solid currentColor;border-radius:50%}
.t-ok{background:#ecfdf5;color:#047857}.t-warn{background:#fffbeb;color:#92400e}.t-bad{background:#fef2f2;color:#b91c1c}
.t-info{background:#eff6ff;color:#1d4ed8}.t-mut{background:#f1f5f9;color:#475569}
.chart{width:100%;height:280px}.chart.sm{height:230px}
.map{height:320px;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:var(--color-muted)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;color:var(--muted);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:2px}
.field{margin-bottom:14px}.field label{display:block;margin-bottom:6px;color:var(--muted);font-size:12px;font-weight:700}
.fbox{padding:11px 12px;border:1px solid var(--line);border-radius:7px;background:var(--color-background);font-size:13px;line-height:1.65}
.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:5px 10px;border:1px solid #bfdbfe;border-radius:5px;background:#eff6ff;color:#1d4ed8;font-size:12px;font-weight:600}
.gps-badge{display:inline-flex;align-items:center;gap:6px;padding:8px 11px;border:1px solid #6ee7b7;border-radius:6px;background:#ecfdf5;color:#047857;font-size:12px;font-weight:700}
.gps-badge:before{content:"已驗證";font-size:9px;padding:2px 4px;background:#047857;color:#fff;border-radius:3px}
.rev{display:flex;align-items:center;gap:11px;padding:13px 2px;border-bottom:1px solid var(--line);flex-wrap:wrap}.rev:last-child{border-bottom:0}
.av,.no{display:grid;place-items:center;flex:0 0 auto;background:var(--color-muted);color:var(--blue);font-weight:700}
.av{width:38px;height:38px;border-radius:6px}.rev-b{flex:1 1 180px}.rev-b b{font-size:13px}.rev-b p{margin:3px 0 0;color:var(--muted);font-size:11.5px}
.btn{min-height:36px;padding:7px 13px;border:1px solid var(--line);border-radius:6px;font:700 12px "Fira Sans",sans-serif;transition:background-color .18s ease,color .18s ease}
.btn.ok{border-color:var(--color-accent);background:var(--color-accent);color:#fff}.btn.ok:hover{background:#047857}
.btn.gh{background:#fff;color:var(--blue)}.btn.gh:hover{background:var(--color-muted)}
.tl{padding-left:7px}.tl-item{position:relative;padding:0 0 20px 25px;border-left:2px solid var(--line)}.tl-item:last-child{padding-bottom:0;border-left-color:transparent}
.dot{position:absolute;left:-8px;top:1px;width:14px;height:14px;border:3px solid var(--blue);border-radius:50%;background:#fff}.done .dot{background:var(--blue)}
.tm{color:var(--blue);font:700 11px "Fira Code",monospace}.ti{margin:3px 0;font-size:13px;font-weight:700}.td{color:var(--muted);font-size:12px;line-height:1.55}
.rank{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.rank:last-child{border-bottom:0}
.no{width:27px;height:27px;border-radius:5px;font:700 12px "Fira Code",monospace}.no.top{background:var(--blue);color:#fff}
.rk-b{flex:1;min-width:0}.rk-b b{font-size:13px}.rk-bar,.bar{height:6px;margin-top:6px;overflow:hidden;border-radius:2px;background:var(--color-muted)}
.rk-bar i,.bar i{display:block;height:100%;background:var(--blue)}.rk-v{font:700 14px "Fira Code",monospace}
.mini-note{margin-top:10px;color:var(--muted);font-size:11.5px;line-height:1.6}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.col{padding:10px;border:1px solid var(--line);border-radius:7px;background:var(--color-background)}
.col-h{display:flex;justify-content:space-between;padding:2px 3px 10px;font-size:12px;font-weight:700}.cnt{padding:2px 7px;border-radius:4px;background:var(--blue);color:#fff;font:700 10px "Fira Code",monospace}
.tk{margin-bottom:8px;padding:10px;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:6px;background:#fff}.tk-t{margin-bottom:5px;font-size:12px;font-weight:700}
.tk-m{display:flex;align-items:center;gap:4px;color:var(--muted);font:500 10.5px "Fira Code",monospace}.tk-m .material-symbols-outlined{font-size:13px}
.flowline{display:flex;align-items:flex-start}.fstep{position:relative;flex:1;text-align:center}.fstep:not(:last-child):after{content:"";position:absolute;top:20px;left:63%;width:74%;border-top:2px solid var(--line)}
.fs-ico{position:relative;z-index:1;width:42px;height:42px;display:grid;place-items:center;margin:0 auto 8px;border:2px solid var(--line);border-radius:7px;background:#fff;color:var(--blue)}
.fstep.on .fs-ico{border-color:var(--blue);background:var(--blue);color:#fff}.fs-t{font-size:11.5px;font-weight:700}.fs-r{margin-top:3px;color:var(--muted);font:500 10px "Fira Code",monospace}
.reveal{animation:reveal .35s ease both}@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){.app{display:block}.sidebar{position:static;width:100%;height:auto;padding:14px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:0}.side-foot{display:none}.nav{flex-direction:row;overflow-x:auto;padding-bottom:3px}.nav button{width:auto;flex:0 0 auto}.main{padding:22px 16px 48px}}
@media(max-width:768px){.g2,.g3,.g23,.g32{grid-template-columns:1fr}.topbar{align-items:flex-start}.flowline{overflow-x:auto}.fstep{min-width:105px}.card{padding:16px}}
@media(max-width:560px){.g4,.board{grid-template-columns:1fr}.nav .txt{display:none}.nav button{padding:10px}.topbar{display:block}.pill{margin-top:13px}.topbar h1{font-size:21px}.main{padding-inline:12px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="brand"><div class="logo"><span class="material-symbols-outlined">directions_car</span></div><div><b>外勤業務管理</b><small>Field Sales Management</small></div></div>

</aside>
<main class="main">
<div class="topbar"><div><h1 id="scr-title">拜訪行程規劃</h1><p class="sub" id="scr-sub">依客戶與路線排定每日外勤行程與拜訪目標</p></div><div class="pill"><span class="material-symbols-outlined">event_available</span><span>2026-08-14　週四</span></div></div>
<div id="screen" aria-live="polite"></div>
</main>
</div>
<script>
(function(){
"use strict";
var MODULES=[
{icon:"calendar_month",name:"拜訪行程規劃",desc:"依客戶與路線排定每日外勤行程與拜訪目標"},
{icon:"task_alt",name:"GPS 定位簽到",desc:"現場定位打卡驗證到訪真實性與停留時間"},
{icon:"description",name:"現場拜訪報告",desc:"填寫拜訪結果、商談重點與後續跟進事項"},

{icon:"account_tree",name:"客戶與商機同步",desc:"拜訪紀錄回寫 CRM 商機與銷售管線"}];
var charts={},BLUE="#2563eb",GREEN="#059669",WARN="#a16207",GRID="#e4ecfc",MUTED="#475569";
function dispose(){for(var k in charts)try{charts[k].dispose()}catch(e){}charts={}}
function chart(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);opt.color=opt.color||[BLUE,GREEN,"#60a5fa","#93c5fd","#0f766e"];opt.textStyle={fontFamily:"Fira Sans"};c.setOption(opt);charts[id]=c}
function kpi(icon,label,val,unit,dir,delta){var d=dir==="up"?"<span class='k-delta up'><span class='material-symbols-outlined'>trending_up</span>"+delta+"</span>":dir==="down"?"<span class='k-delta down'><span class='material-symbols-outlined'>trending_down</span>"+delta+"</span>":delta?"<span class='k-delta' style='color:var(--muted)'>"+delta+"</span>":"";return "<div class='kpi'><div class='k-ico'><span class='material-symbols-outlined'>"+icon+"</span></div><div class='k-label'>"+label+"</div><div class='k-val'>"+val+(unit?"<small>"+unit+"</small>":"")+"</div>"+d+"</div>"}
var VISITS=[
{no:1,cust:"O達精機股份有限公司",time:"09:00",area:"新北 · 五股",goal:"新品導入簡報",stat:"已簽到",lat:25.083,lng:121.438},
{no:2,cust:"O睿自動化科技",time:"10:30",area:"新北 · 三重",goal:"設備報價回訪",stat:"已簽到",lat:25.072,lng:121.488},
{no:3,cust:"永O五金工業",time:"13:30",area:"桃園 · 龜山",goal:"合約續約洽談",stat:"進行中",lat:25.037,lng:121.348},
{no:4,cust:"O詠模具廠",time:"15:00",area:"桃園 · 中壢",goal:"售後保養跟進",stat:"未到訪",lat:24.953,lng:121.225},
{no:5,cust:"O豐機械有限公司",time:"16:30",area:"桃園 · 平鎮",goal:"新客戶開發",stat:"未到訪",lat:24.920,lng:121.205}];
