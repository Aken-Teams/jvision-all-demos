<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>校驗管理系統（Calibration Management System）｜Jvision 系統 Demo</title>
<meta name="description" content="量測儀器校驗週期、到期提醒、證書歸檔與逾期攔截的單一管理平台" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#9333ea; --accent2:#c084fc; --accent-d:#6b21a8;
  --bg:#f6f4fb; --card:#ffffff; --ink:#1e1633; --sub:#6b6580; --line:#ece7f5;
  --ok:#16a34a; --warn:#f59e0b; --bad:#dc2626; --info:#2563eb;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Noto Sans TC","Inter",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
/* top nav */
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(100deg,#4c1d95,#7e22ce 55%,#9333ea);color:#fff;box-shadow:0 4px 18px rgba(76,29,149,.28)}
.topbar-in{max-width:1360px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:none}
.brand .logo .material-symbols-outlined{font-size:24px}
.brand b{font-size:16px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.brand span{font-size:11px;opacity:.8;display:block}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0}
.nav button{flex:none;white-space:nowrap;display:flex;align-items:center;gap:6px;border:none;cursor:pointer;background:rgba(255,255,255,.1);color:#fff;padding:8px 13px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;transition:.15s}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:rgba(255,255,255,.22)}
.nav button.on{background:#fff;color:var(--accent-d)}
.usr{display:flex;align-items:center;gap:8px;flex:none;padding-left:6px}
.usr .av{width:32px;height:32px;border-radius:50%;background:var(--accent2);color:#3b0764;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
.usr small{font-size:12px;opacity:.9}
.wrap{max-width:1360px;margin:0 auto;padding:22px 20px 60px}
.screen-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.screen-head h1{margin:0;font-size:22px;font-weight:800;display:flex;align-items:center;gap:9px}
.screen-head h1 .material-symbols-outlined{color:var(--accent);font-size:26px}
.screen-head p{margin:4px 0 0;color:var(--sub);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px}
.pill.ok{background:#dcfce7;color:#15803d}.pill.warn{background:#fef3c7;color:#b45309}.pill.bad{background:#fee2e2;color:#b91c1c}.pill.info{background:#dbeafe;color:#1d4ed8}.pill.mut{background:#f1edf9;color:var(--accent-d)}
/* generic grids */
.grid{display:grid;gap:16px}
.kpi4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:2fr 1fr}
.g23{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;min-width:0}
.card h3{margin:0 0 12px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.card .sub{font-size:12px;color:var(--sub);font-weight:500}
.kpi{position:relative;overflow:hidden}
.kpi .lab{font-size:12.5px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .num{font-size:30px;font-weight:900;margin-top:6px;letter-spacing:-.5px}
.kpi .num small{font-size:14px;font-weight:700;color:var(--sub)}
.kpi .dt{font-size:12px;font-weight:700;margin-top:5px}
.kpi .ic{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.kpi .ic .material-symbols-outlined{font-size:22px}
.up{color:var(--ok)}.down{color:var(--bad)}
/* table */
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th{text-align:left;font-size:11.5px;color:var(--sub);font-weight:700;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap;background:#faf8fe}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
.mono{font-family:"Inter",monospace;font-weight:700;font-size:12.5px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:7px}
.tag.g{background:#dcfce7;color:#15803d}.tag.y{background:#fef3c7;color:#b45309}.tag.r{background:#fee2e2;color:#b91c1c}.tag.b{background:#e9d5ff;color:#7e22ce}.tag.gr{background:#f1f0f5;color:#575368}
.bar{height:7px;border-radius:6px;background:#eee6f7;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.chart-box{position:relative;height:260px}
.chart-sm{position:relative;height:200px}
/* kanban board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.col{background:#f4f0fb;border:1px solid var(--line);border-radius:14px;padding:11px;min-width:0}
.col-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:800;font-size:13px}
.col-h .cnt{font-size:11px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--sub)}
.col.c0 .col-h{color:#7e22ce}.col.c1 .col-h{color:#2563eb}.col.c2 .col-h{color:#b45309}.col.c3 .col-h{color:#15803d}
.kb{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px;box-shadow:0 1px 3px rgba(76,29,149,.05);border-left:4px solid var(--accent)}
.kb:last-child{margin-bottom:0}
.kb.crit{border-left-color:var(--bad)}.kb.warnb{border-left-color:var(--warn)}.kb.okb{border-left-color:var(--ok)}.kb.infob{border-left-color:var(--info)}
.kb .id{font-size:11px;color:var(--sub);font-weight:700;font-family:"Inter"}
.kb .nm{font-size:13.5px;font-weight:700;margin:3px 0 6px}
.kb .mt{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--sub)}
.kb .mt .material-symbols-outlined{font-size:14px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.blink{animation:bl 1.6s ease-in-out infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.3}}
/* timeline */
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 18px}
.tl-item:last-child{padding-bottom:0}
.tl-item .dotmk{position:absolute;left:-22px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.tl-item.done .dotmk{background:var(--accent);border-color:var(--accent)}
.tl-item.bad .dotmk{border-color:var(--bad)}
.tl-item .tt{font-weight:700;font-size:13.5px}
.tl-item .ds{font-size:12px;color:var(--sub);margin-top:2px}
/* alert list */
.alert{display:flex;gap:11px;align-items:flex-start;padding:12px;border-radius:12px;border:1px solid var(--line);margin-bottom:10px;background:#fff}
.alert:last-child{margin-bottom:0}
.alert .ai{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.alert .ai .material-symbols-outlined{font-size:20px}
.alert.r{background:#fff5f5}.alert.r .ai{background:#fee2e2;color:#b91c1c}
.alert.y{background:#fffaf0}.alert.y .ai{background:#fef3c7;color:#b45309}
.alert.b .ai{background:#dbeafe;color:#1d4ed8}
.alert .txt{min-width:0;flex:1}
.alert .txt b{font-size:13.5px}
.alert .txt p{margin:3px 0 0;font-size:12px;color:var(--sub)}
.alert .rt{font-size:11px;color:var(--sub);white-space:nowrap;font-weight:700}
/* cert cards */
.certgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.cert{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.cert-top{padding:12px 14px;background:linear-gradient(120deg,#faf5ff,#f3e8ff);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.cert-top .material-symbols-outlined{font-size:30px;color:var(--accent)}
.cert-b{padding:12px 14px}
.cert-b .row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px dashed var(--line)}
.cert-b .row:last-child{border-bottom:none}
.cert-b .row .k{color:var(--sub)}
.cert-b .row .v{font-weight:700}
/* gauge stat rows */
.stat-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.stat-row:last-child{border-bottom:none}
.stat-row .nm{width:120px;font-weight:600;flex:none}
.stat-row .bar{flex:1}
.stat-row .vl{width:52px;text-align:right;font-weight:800;font-size:12.5px;flex:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.callo{background:linear-gradient(120deg,#faf5ff,#f5edff);border:1px solid #e9d5ff;border-radius:14px;padding:13px 15px;display:flex;gap:11px;align-items:flex-start}
.callo .material-symbols-outlined{color:var(--accent);font-size:22px;flex:none}
.callo b{font-size:13px}.callo p{margin:3px 0 0;font-size:12.5px;color:#5b4a70;line-height:1.6}
.mini{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mini div{flex:1;min-width:88px;background:#faf8fe;border:1px solid var(--line);border-radius:11px;padding:9px 11px}
.mini .m-l{font-size:11px;color:var(--sub);font-weight:600}
.mini .m-v{font-size:18px;font-weight:900;margin-top:2px}
@media(max-width:820px){
  .kpi4{grid-template-columns:1fr 1fr}
  .g2,.g3,.g23{grid-template-columns:1fr}
  .board{grid-template-columns:1fr 1fr}
  .certgrid{grid-template-columns:1fr}
}
@media(max-width:560px){
  .nav button span.t{display:none}
  .nav button{padding:8px 10px}
  .kpi4{grid-template-columns:1fr 1fr}
  .board{grid-template-columns:1fr}
  .brand span{display:none}
  .usr small{display:none}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">straighten</span></div>
      <div><b>校驗管理系統</b><span>Calibration Management System · 計量室平台</span></div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="usr">
      <div class="av">品</div>
      <small>品保 · 陳彥伶</small>
    </div>
  </div>
</div>
<div class="wrap"><div id="view"></div></div>

<script>
"use strict";
var chartRefs=[];
function killCharts(){for(var i=0;i<chartRefs.length;i++){try{chartRefs[i].destroy();}catch(e){}}chartRefs=[];}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

var NAV=[
  {i:0,ic:"inventory_2",t:"儀器台帳"},
  {i:1,ic:"view_kanban",t:"校驗看板"},
  {i:2,ic:"notifications_active",t:"到期提醒"},
  {i:3,ic:"science",t:"校驗執行"},
  {i:4,ic:"workspace_premium",t:"證書歸檔"},
  {i:5,ic:"block",t:"逾期管制"}
];

/* ---------- fake data ---------- */
var INSTR=[
  {id:"CAL-2041",nm:"數位卡尺 0-150mm",cat:"長度量測",loc:"CNC 二廠",cyc:"12 月",due:"2026-09-02",status:"合格",left:20,acc:"±0.02mm",own:"計量室"},
  {id:"CAL-2088",nm:"電子秤 6kg／0.1g",cat:"質量量測",loc:"包裝線 A",cyc:"6 月",due:"2026-08-18",status:"即將到期",left:5,acc:"±0.1g",own:"品保"},
  {id:"CAL-1975",nm:"扭力扳手 20-100N·m",cat:"力／扭力",loc:"組裝線 3",cyc:"12 月",due:"2026-08-09",status:"逾期",left:-4,acc:"±3%",own:"設備工程"},
  {id:"CAL-2103",nm:"紅外測溫槍",cat:"溫度量測",loc:"熱處理區",cyc:"6 月",due:"2026-10-11",status:"合格",left:59,acc:"±1.5℃",own:"品保"},
  {id:"CAL-2019",nm:"三次元量床 CMM",cat:"長度量測",loc:"計量室",cyc:"12 月",due:"2026-08-26",status:"即將到期",left:13,acc:"±1.8µm",own:"計量室"},
  {id:"CAL-2056",nm:"壓力錶 0-10bar",cat:"壓力量測",loc:"氣壓站",cyc:"12 月",due:"2026-11-04",status:"合格",left:83,acc:"±0.25%",own:"設備工程"},
  {id:"CAL-1990",nm:"針規組 φ1-10mm",cat:"長度量測",loc:"品保室",cyc:"24 月",due:"2026-08-06",status:"逾期",left:-7,acc:"±0.001mm",own:"品保"},
  {id:"CAL-2120",nm:"表面粗度儀",cat:"表面量測",loc:"計量室",cyc:"12 月",due:"2026-09-20",status:"合格",left:38,acc:"Ra ±5%",own:"計量室"}
];

/* ---------- screens ---------- */
function scr0(){
  var total=248, ok=201, soon=27, over=20;
  var rows=INSTR.map(function(r){
    var st=r.status==="合格"?"g":r.status==="即將到期"?"y":"r";
    var lf=r.left<0?('逾期 '+(-r.left)+' 天'):(r.left+' 天');
    var lc=r.left<0?'var(--bad)':r.left<=14?'var(--warn)':'var(--sub)';
    return '<tr><td class="mono">'+r.id+'</td><td><b>'+esc(r.nm)+'</b><div class="sub" style="font-size:11px">'+r.acc+'</div></td>'+
      '<td>'+esc(r.cat)+'</td><td>'+esc(r.loc)+'</td><td>'+r.cyc+'</td><td class="mono">'+r.due+'</td>'+
      '<td style="color:'+lc+';font-weight:700;font-size:12px">'+lf+'</td>'+
      '<td><span class="tag '+st+'">'+r.status+'</span></td></tr>';
  }).join("");
  return sh("inventory_2","儀器台帳","量測儀器建檔、分類、位置與校驗週期的單一台帳",'<span class="pill mut">共 '+total+' 台儀器</span>')+
  '<div class="grid kpi4" style="margin-bottom:16px">'+
    kpi("儀器總數","inventory_2",total,"台","#f3e8ff","var(--accent)","本月新增 6 台","up")+
    kpi("校驗合格","verified",ok,"台","#dcfce7","var(--ok)","合格率 81.0%","up")+
    kpi("即將到期","hourglass_top",soon,"台","#fef3c7","var(--warn)","30 天內到期","")+
    kpi("已逾期","block",over,"台","#fee2e2","var(--bad)","逾期率 8.1%","down")+
  '</div>'+
  '<div class="grid g3">'+
    '<div class="card"><h3><span class="material-symbols-outlined">list_alt</span>儀器清單 <span class="sub">（依到期日排序）</span></h3>'+
      '<div style="overflow-x:auto"><table><thead><tr><th>編號</th><th>儀器名稱</th><th>分類</th><th>放置位置</th><th>週期</th><th>下次到期</th><th>剩餘</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>儀器分類占比</h3><div class="chart-sm"><canvas id="c0"></canvas></div>'+
      '<div class="legend"><span><i style="background:#9333ea"></i>長度</span><span><i style="background:#c084fc"></i>質量</span><span><i style="background:#a855f7"></i>溫度／壓力</span><span><i style="background:#d8b4fe"></i>力／扭力</span><span><i style="background:#e9d5ff"></i>其他</span></div>'+
      '<div class="mini"><div><div class="m-l">內校比例</div><div class="m-v">62%</div></div><div><div class="m-l">送外校</div><div class="m-v">38%</div></div></div></div>'+
  '</div>';
}

function scr1(){
  var cols=[
    {c:"c0",t:"待排程",ic:"pending",cards:[
      {cl:"warnb",id:"CAL-2088",nm:"電子秤 6kg／0.1g",mt:["包裝線 A","到期 08-18","品保"]},
      {cl:"okb",id:"CAL-2120",nm:"表面粗度儀",mt:["計量室","到期 09-20","內校"]},
      {cl:"infob",id:"CAL-2056",nm:"壓力錶 0-10bar",mt:["氣壓站","到期 11-04","送外校"]}
    ]},
    {c:"c1",t:"已排定",ic:"event_available",cards:[
      {cl:"infob",id:"CAL-2019",nm:"三次元量床 CMM",mt:["計量室","預定 08-15","王志明"]},
      {cl:"okb",id:"CAL-2103",nm:"紅外測溫槍",mt:["熱處理區","預定 08-14","李佩珊"]}
    ]},
    {c:"c2",t:"校驗中",ic:"science",cards:[
      {cl:"warnb",id:"CAL-2041",nm:"數位卡尺 0-150mm",mt:["內校台","進行中","張家豪"]},
      {cl:"crit",id:"CAL-1975",nm:"扭力扳手 20-100N·m",mt:["外校 · TAF","待報告","逾期"]}
    ]},
    {c:"c3",t:"已完成",ic:"task_alt",cards:[
      {cl:"okb",id:"CAL-2001",nm:"游標卡尺 0-200mm",mt:["合格","證書已歸檔","08-11"]},
      {cl:"okb",id:"CAL-1988",nm:"角度規",mt:["合格","證書已歸檔","08-10"]},
      {cl:"okb",id:"CAL-2077",nm:"雷射測距儀",mt:["合格","證書已歸檔","08-09"]}
    ]}
  ];
  var board=cols.map(function(col){
    var cards=col.cards.map(function(k){
      var mts=k.mt.map(function(m){return '<span>'+esc(m)+'</span>';}).join('<span>·</span>');
      return '<div class="kb '+k.cl+'"><div class="id">'+k.id+'</div><div class="nm">'+esc(k.nm)+'</div><div class="mt">'+mts+'</div></div>';
    }).join("");
    return '<div class="col '+col.c+'"><div class="col-h"><span><span class="material-symbols-outlined" style="font-size:16px;vertical-align:-3px">'+col.ic+'</span> '+col.t+'</span><span class="cnt">'+col.cards.length+'</span></div>'+cards+'</div>';
  }).join("");
  return sh("view_kanban","校驗排程看板","依到期日排定送校／內校，拖曳卡片推進校驗狀態",'<span class="pill info">本週待處理 8 件</span>')+
  '<div class="grid kpi4" style="margin-bottom:16px">'+
    kpi("待排程","pending",3,"件","#f3e8ff","var(--accent)","含 1 件即將到期","")+
    kpi("已排定","event_available",2,"件","#dbeafe","var(--info)","已指派負責人","up")+
    kpi("校驗中","science",2,"件","#fef3c7","var(--warn)","1 件送外校","")+
    kpi("本週完成","task_alt",3,"件","#dcfce7","var(--ok)","全數合格","up")+

/* ---------- helpers ---------- */
function sh(ic,t,d,extra){
  return '<div class="screen-head"><div><h1><span class="material-symbols-outlined">'+ic+'</span>'+t+'</h1><p>'+d+'</p></div>'+(extra||"")+'</div>';
}
function kpi(lab,ic,num,unit,bg,col,dt,dir){
  var dc=dir==="up"?"up":dir==="down"?"down":"";
  var arrow=dir==="up"?'<span class="material-symbols-outlined" style="font-size:14px;vertical-align:-2px">trending_up</span>':dir==="down"?'<span class="material-symbols-outlined" style="font-size:14px;vertical-align:-2px">trending_down</span>':'';
  return '<div class="card kpi"><div class="ic" style="background:'+bg+'"><span class="material-symbols-outlined" style="color:'+col+'">'+ic+'</span></div>'+
    '<div class="lab">'+lab+'</div><div class="num">'+num+' <small>'+unit+'</small></div>'+
    '<div class="dt '+dc+'">'+arrow+' '+dt+'</div></div>';
}
function statRow(nm,v,col){
  var pct=Math.round(v/20*100);
  return '<div class="stat-row"><div class="nm">'+nm+'</div><div class="bar"><i style="width:'+pct+'%;background:'+col+'"></i></div><div class="vl">'+v+' 台</div></div>';
}

function show(i){

  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
