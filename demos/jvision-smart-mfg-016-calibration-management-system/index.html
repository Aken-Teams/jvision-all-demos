<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>校驗管理系統（Calibration Management System）｜Jvision 系統 Demo</title>
<meta name="description" content="量測儀器校驗週期、到期提醒、證書歸檔與逾期攔截的單一管理平台" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;--color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;--color-on-secondary:#000000;
  --color-accent:#EA580C;--color-on-accent:#000000;
  --color-background:#F8FAFC;--color-foreground:#1E293B;
  --color-card:#FFFFFF;--color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;--color-muted-foreground:#475569;
  --color-border:#E2E8F0;--color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;--color-ring:#2563EB;
  --blue:#2563EB;--ink:#1E293B;--muted:#475569;--line:#E2E8F0;
  --ok:#16733A;--warn:#9A4500;--bad:#B91C1C;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Fira Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,a{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible{outline:4px solid var(--color-ring);outline-offset:3px}
.topbar{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;border-bottom:4px solid var(--color-accent)}
.topbar-in{max-width:1440px;margin:auto;min-height:78px;padding:10px 24px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:12px;min-width:235px}
.logo{width:44px;height:44px;display:grid;place-items:center;background:var(--color-primary);border:2px solid #fff}
.logo svg{width:25px;height:25px}
.brand b{display:block;font-size:16px;font-weight:700;letter-spacing:.02em}
.brand small{display:block;margin-top:3px;color:#CBD5E1;font:10px/1.3 "Fira Code",monospace}
.nav{display:flex;gap:0;margin-left:auto;overflow-x:auto}
.nav button{min-height:46px;padding:9px 13px;border:1px solid #64748B;border-right:0;background:transparent;color:#E2E8F0;font-weight:600;white-space:nowrap}
.nav button:last-child{border-right:1px solid #64748B}
.nav button:hover{background:#334155;color:#fff}
.nav button.on{background:var(--color-accent);color:#000;border-color:var(--color-accent);box-shadow:inset 0 -4px 0 #000}
.nav svg{width:17px;height:17px;vertical-align:-4px;margin-right:5px}
.usr{display:flex;align-items:center;gap:8px;white-space:nowrap}
.av{width:36px;height:36px;display:grid;place-items:center;background:#fff;color:var(--ink);border:2px solid var(--color-accent);font-weight:700}
.usr small{font-size:12px}
.wrap{max-width:1440px;margin:auto;padding:34px 24px 72px}
.screen-head{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px;padding:28px;background:var(--color-primary);color:#fff;border:3px solid var(--ink);box-shadow:10px 10px 0 var(--ink)}
.screen-head:before{content:"CALIBRATION / OPERATIONS";position:absolute;right:24px;top:17px;color:#DBEAFE;font:600 10px "Fira Code",monospace;letter-spacing:.14em}
.screen-head h1{margin:0;font-size:clamp(25px,3vw,42px);line-height:1;font-weight:700;letter-spacing:-.04em}
.screen-head p{margin:11px 0 0;max-width:760px;color:#EFF6FF;font-size:14px}
.head-code{font:700 12px "Fira Code",monospace;color:#BFDBFE;margin-bottom:8px}
.pill,.tag{display:inline-flex;align-items:center;gap:6px;border:2px solid currentColor;font-weight:700}
.pill{padding:7px 10px;background:#fff;color:var(--ink);white-space:nowrap;font-size:12px}
.tag{padding:3px 7px;font-size:11px}
.tag:before,.pill:before{content:"";width:7px;height:7px;background:currentColor}
.tag.g{color:#12612F;background:#EAF8EF}.tag.y{color:#854000;background:#FFF4DF}
.tag.r{color:#A11212;background:#FFF0F0}.tag.b{color:#174EA6;background:#EFF6FF}
.grid{display:grid;gap:16px}.kpi4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:2fr 1fr}.g2{grid-template-columns:1fr 1fr}
.card{min-width:0;background:var(--color-card);border:2px solid var(--ink);padding:18px;box-shadow:5px 5px 0 var(--line)}
.card h2{margin:0 0 15px;font-size:15px;text-transform:uppercase;letter-spacing:.035em}
.kpi{position:relative;min-height:145px;padding-top:54px}
.kpi:nth-child(even){transform:translateY(8px)}
.kpi-icon{position:absolute;left:17px;top:16px;width:28px;height:28px;color:var(--blue)}
.kpi-label{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase}
.kpi-value{margin-top:4px;font:700 31px "Fira Code",monospace;letter-spacing:-.05em}
.kpi-value small{font:600 13px "Fira Sans",sans-serif;color:var(--muted)}
.kpi-note{margin-top:8px;font-size:12px;font-weight:600}.up{color:var(--ok)}.down{color:var(--bad)}
.section-gap{margin-top:22px}.scroll{overflow:auto}
table{width:100%;min-width:620px;border-collapse:collapse;font-size:13px}
th{padding:11px 10px;text-align:left;background:var(--ink);color:#fff;border:1px solid #475569;font:600 11px "Fira Code",monospace;white-space:nowrap}
td{padding:11px 10px;border:1px solid var(--line);vertical-align:middle}
tbody tr:nth-child(even){background:#F8FAFC}tbody tr:hover{background:#EFF6FF}
td.num{text-align:right;font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.mono{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:11px}.chart{height:230px;position:relative}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:11px}
.legend span{display:flex;align-items:center;gap:5px}.legend i{width:12px;height:12px;border:2px solid var(--ink)}
.mini{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
.mini>div{padding:11px;background:var(--color-muted);border:1px solid var(--ink)}
.mini small{display:block;color:var(--muted);font-size:10px}.mini b{display:block;margin-top:3px;font:700 18px "Fira Code",monospace}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.col{min-width:0;padding:10px;background:var(--color-muted);border:2px solid var(--ink)}
.col-head{display:flex;justify-content:space-between;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--ink);font-weight:700}
.count{padding:1px 7px;background:#fff;border:1px solid var(--ink);font-family:"Fira Code",monospace}
.kb{margin-bottom:9px;padding:11px;background:#fff;border:2px solid var(--ink);border-left:8px solid var(--blue)}
.kb:last-child{margin-bottom:0}.kb.warn{border-left-color:var(--color-accent)}.kb.bad{border-left-color:var(--bad)}.kb.ok{border-left-color:var(--ok)}
.kb .id{color:var(--muted);font:600 11px "Fira Code",monospace}.kb b{display:block;margin:5px 0 7px;font-size:13px}.kb small{color:var(--muted)}
.callout{display:flex;gap:12px;margin-top:14px;padding:14px;background:#FFF7ED;border:2px solid var(--color-accent);border-left-width:9px}
.callout svg{width:22px;height:22px;flex:none;color:var(--color-accent)}.callout b{font-size:13px}.callout p{margin:4px 0 0;color:#4B5563;font-size:12px;line-height:1.6}
.alert{display:grid;grid-template-columns:34px 1fr auto;gap:11px;align-items:start;margin-bottom:9px;padding:12px;border:2px solid var(--ink);background:#fff}
.alert:last-child{margin:0}.alert svg{width:24px;height:24px}.alert.r{border-left:9px solid var(--bad)}.alert.y{border-left:9px solid var(--color-accent)}.alert.b{border-left:9px solid var(--blue)}
.alert b{font-size:13px}.alert p{margin:3px 0 0;color:var(--muted);font-size:12px}.alert .rt{font:700 11px "Fira Code",monospace}
.certgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.cert{border:2px solid var(--ink);background:#fff}.cert-head{padding:12px;background:var(--color-primary);color:#fff;border-bottom:2px solid var(--ink)}
.cert-head b{display:block;margin-top:4px;font-size:13px}.cert-body{padding:10px}.cert-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed #94A3B8;font-size:11px}.cert-row:last-child{border:0}.cert-row span:first-child{color:var(--muted)}.cert-row span:last-child{font-weight:600;text-align:right}
.stat{display:grid;grid-template-columns:95px 1fr 48px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}.bar{height:12px;background:var(--color-muted);border:1px solid var(--ink)}.bar i{display:block;height:100%;background:var(--blue)}
[data-animate]{animation:enter .4s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@media(max-width:1024px){.topbar-in{align-items:flex-start;flex-wrap:wrap}.nav{order:3;width:100%;margin:0}.kpi4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.wrap{padding:24px 16px 60px}.screen-head{padding:24px 18px;align-items:flex-start;flex-direction:column}.screen-head:before{display:none}.g2{grid-template-columns:1fr}.certgrid{grid-template-columns:1fr}.usr{display:none}}
@media(max-width:520px){.brand{min-width:0}.brand small{display:none}.nav button{padding:9px 11px}.nav .label{display:none}.kpi4,.board{grid-template-columns:1fr}.kpi:nth-child(even){transform:none}.screen-head{box-shadow:6px 6px 0 var(--ink)}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo" id="brandIcon"></div>
      <div><b>測量儀器校正管理系統</b><small>CALIBRATION MANAGEMENT / 計量室平台</small></div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
    <div class="usr"><div class="av">品</div><small>品保 · 陳彥伶</small></div>
  </div>
</header>
<main class="wrap"><div id="view" aria-live="polite"></div></main>
<script>
"use strict";
var chartRefs=[];
var ICONS={
straighten:'<path d="M4 19 19 4l2 2L6 21H4v-2Zm3-1 2-2m1 0-2-2m5-1 2-2m1 0-2-2m5-1 2-2"/>',
inventory:'<path d="M4 7h16v13H4zM3 4h18v3H3zm5 7h8"/>',
board:'<path d="M4 4h7v16H4zm9 0h7v9h-7zm0 11h7v5h-7z"/>',
bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Zm-8 12h4"/>',
science:'<path d="M9 3h6m-5 0v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3M8 15h8"/>',
cert:'<path d="M6 3h12v18l-6-3-6 3V3Zm3 5h6m-6 4h6"/>',
block:'<circle cx="12" cy="12" r="9"/><path d="m6 6 12 12"/>',
chart:'<path d="M4 20V10m6 10V4m6 16v-7m5 7H2"/>',
rule:'<path d="M4 6h16M4 12h10M4 18h16"/>',
error:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6m0 4h.01"/>',
check:'<path d="m4 13 5 5L20 6"/>'
};
function icon(n){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">'+(ICONS[n]||ICONS.rule)+'</svg>'}
document.getElementById("brandIcon").innerHTML=icon("straighten");
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function killCharts(){chartRefs.forEach(function(c){try{c.destroy()}catch(e){}});chartRefs=[]}
var NAV=[["inventory","儀器台帳"],["board","校驗看板"],["bell","到期提醒"],["science","校驗執行"],["cert","證書歸檔"],["block","逾期管制"]];
var INSTR=[
["CAL-2041","數位卡尺 0-150mm","長度量測","CNC 二廠","12 月","2026-09-02","20 天","合格","±0.02mm"],
["CAL-2088","電子秤 6kg／0.1g","質量量測","包裝線 A","6 月","2026-08-18","5 天","即將到期","±0.1g"],
["CAL-1975","扭力扳手 20-100N·m","力／扭力","組裝線 3","12 月","2026-08-09","逾期 4 天","逾期","±3%"],
["CAL-2103","紅外測溫槍","溫度量測","熱處理區","6 月","2026-10-11","59 天","合格","±1.5℃"],
["CAL-2019","三次元量床 CMM","長度量測","計量室","12 月","2026-08-26","13 天","即將到期","±1.8µm"],
["CAL-2056","壓力錶 0-10bar","壓力量測","氣壓站","12 月","2026-11-04","83 天","合格","±0.25%"],
["CAL-1990","針規組 φ1-10mm","長度量測","品保室","24 月","2026-08-06","逾期 7 天","逾期","±0.001mm"],
["CAL-2120","表面粗度儀","表面量測","計量室","12 月","2026-09-20","38 天","合格","Ra ±5%"]
];
function head(code,title,desc,pill,cls){
return '<section class="screen-head"><div><div class="head-code">MODULE / 0'+code+'</div><h1>'+title+'</h1><p>'+desc+'</p></div><span class="pill '+(cls||"")+'">'+pill+'</span></section>'
}
function kpi(label,value,unit,note,dir,ic){
return '<article class="card kpi" data-animate>'+icon(ic||"chart")+'<div class="kpi-label">'+label+'</div><div class="kpi-value">'+value+' <small>'+unit+'</small></div><div class="kpi-note '+(dir||"")+'">'+note+'</div></article>'
}
function section(title,content){return '<section class="card" data-animate><h2>'+title+'</h2>'+content+'</section>'}
function callout(title,text){return '<div class="callout">'+icon("rule")+'<div><b>'+title+'</b><p>'+text+'</p></div></div>'}
function tag(status){var c=status==="合格"?"g":status==="逾期"||status==="超差"||status==="已封鎖"?"r":status==="即將到期"||status==="待排程"?"y":"b";return '<span class="tag '+c+'">'+status+'</span>'}
function screen0(){
var rows=INSTR.map(function(r){return '<tr><td class="mono">'+r[0]+'</td><td><b>'+r[1]+'</b><div class="sub">'+r[8]+'</div></td><td>'+r[2]+'</td><td>'+r[3]+'</td><td>'+r[4]+'</td><td class="num">'+r[5]+'</td><td class="num">'+r[6]+'</td><td>'+tag(r[7])+'</td></tr>'}).join("");
return head(1,"儀器台帳","量測儀器建檔、分類、位置與校驗週期的單一台帳","共 248 台儀器")+
'<div class="grid kpi4">'+kpi("儀器總數","248","台","本月新增 6 台","up","inventory")+kpi("校驗合格","201","台","合格率 81.0%","up","check")+kpi("即將到期","27","台","30 天內到期","","bell")+kpi("已逾期","20","台","逾期率 8.1%","down","error")+'</div>'+
'<div class="grid g3 section-gap">'+section("儀器清單／依到期日排序",'<div class="scroll"><table><thead><tr><th>編號</th><th>儀器名稱</th><th>分類</th><th>放置位置</th><th>週期</th><th>下次到期</th><th>剩餘</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div>')+
section("儀器分類占比",'<div class="chart"><canvas id="c0"></canvas></div><div class="legend"><span><i style="background:#2563EB"></i>長度</span><span><i style="background:#EA580C"></i>質量</span><span><i style="background:#0F766E"></i>溫度／壓力</span><span><i style="background:#7C3AED"></i>力／扭力</span></div><div class="mini"><div><small>內校比例</small><b>62%</b></div><div><small>送外校</small><b>38%</b></div></div>')+'</div>'
}
function screen1(){
var cols=[
["待排程",[["CAL-2088","電子秤 6kg／0.1g","包裝線 A · 到期 08-18 · 品保","warn"],["CAL-2120","表面粗度儀","計量室 · 到期 09-20 · 內校","ok"],["CAL-2056","壓力錶 0-10bar","氣壓站 · 到期 11-04 · 送外校",""]]],
["已排定",[["CAL-2019","三次元量床 CMM","計量室 · 預定 08-15 · 王志明",""],["CAL-2103","紅外測溫槍","熱處理區 · 預定 08-14 · 李佩珊","ok"]]],
["校驗中",[["CAL-2041","數位卡尺 0-150mm","內校台 · 進行中 · 張家豪","warn"],["CAL-1975","扭力扳手 20-100N·m","外校 · TAF · 待報告 · 逾期","bad"]]],
["已完成",[["CAL-2001","游標卡尺 0-200mm","合格 · 證書已歸檔 · 08-11","ok"],["CAL-1988","角度規","合格 · 證書已歸檔 · 08-10","ok"],["CAL-2077","雷射測距儀","合格 · 證書已歸檔 · 08-09","ok"]]]
];
var board=cols.map(function(c){return '<div class="col"><div class="col-head"><span>'+c[0]+'</span><span class="count">'+c[1].length+'</span></div>'+c[1].map(function(x){return '<article class="kb '+x[3]+'"><div class="id">'+x[0]+'</div><b>'+x[1]+'</b><small>'+x[2]+'</small></article>'}).join("")+'</div>'}).join("");
return head(2,"校驗排程看板","依到期日排定送校／內校，拖曳卡片推進校驗狀態","本週待處理 8 件")+
'<div class="grid kpi4">'+kpi("待排程","3","件","含 1 件即將到期","","board")+kpi("已排定","2","件","已指派負責人","up","check")+kpi("校驗中","2","件","1 件送外校","","science")+kpi("本週完成","3","件","全數合格","up","check")+'</div>'+
'<div class="section-gap">'+section("校驗流程看板",'<div class="scroll"><div class="board">'+board+'</div></div>'+callout("RULE-01 · 排程優先序","距到期日 30 天內之關鍵量測儀器優先排入校驗計畫；扭力扳手 CAL-1975 已逾期 4 天，系統標紅提示應立即送外校。"))+'</div>'
}
function screen2(){
var alerts=[
["r","CAL-1975 扭力扳手已逾期 4 天","組裝線 3 · 週期 12 月 · 應於 2026-08-09 前完成校驗，現已封鎖使用","逾期"],
["r","CAL-1990 針規組已逾期 7 天","品保室 · 週期 24 月 · 到期日 2026-08-06，證書尚未更新","逾期"],
["y","CAL-2088 電子秤 5 天內到期","包裝線 A · 到期日 2026-08-18 · 建議本週排入送校","即將"],
["y","CAL-2019 三次元量床 13 天內到期","計量室 · 到期日 2026-08-26 · 已排定 08-15 內校","即將"],
["b","CAL-2120 表面粗度儀 38 天後到期","計量室 · 到期日 2026-09-20 · 尚未排程","提前"]
].map(function(a){return '<div class="alert '+a[0]+'">'+icon(a[0]==="r"?"error":"bell")+'<div><b>'+a[1]+'</b><p>'+a[2]+'</p></div><span class="rt">'+a[3]+'</span></div>'}).join("");
return head(3,"到期提醒","到期前分級推播提醒，品保確認清單並催辦即將逾期儀器","2 件逾期")+
'<div class="grid kpi4">'+kpi("7 天內到期","4","件","含 2 件未排程","","bell")+kpi("30 天內到期","27","件","建議提前排程","","bell")+kpi("已逾期","20","件","全數自動封鎖","down","error")+kpi("本月已催辦","14","件","回覆率 92%","up","check")+'</div>'+
'<div class="grid g3 section-gap">'+section("提醒清單／依緊急度排序",alerts)+section("未來 6 週到期分布",'<div class="chart"><canvas id="c2"></canvas></div>'+callout("分級推播規則","逾期→紅色即時封鎖；7 天內→橙色催辦；30 天內→藍色提前排程。提醒同步至品保、計量室與設備工程。"))+'</div>'
}
function screen3(){
