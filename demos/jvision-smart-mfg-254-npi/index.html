<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>新產品導入管理系統（NPI）</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#b45309;--accent2:#f59e0b;--bg:#f6f4f1;--panel:#ffffff;
  --ink:#211b12;--muted:#7a6f61;--line:#ece6dd;--side:#241d13;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--blue:#2563eb;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Inter','Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;}
.app{display:flex;min-height:100vh;}
.side{width:250px;flex:0 0 250px;background:var(--side);color:#f3ece1;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand{padding:22px 20px;border-bottom:1px solid rgba(255,255,255,.08);}
.brand .lg{display:flex;align-items:center;gap:10px;}
.brand .ic{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;color:#fff;flex:0 0 38px;}
.brand h1{font-size:15px;margin:0;line-height:1.35;font-weight:700;}
.brand p{margin:2px 0 0;font-size:11px;color:#b8ad9c;}
.nav{padding:12px 10px;display:flex;flex-direction:column;gap:4px;flex:1;}
.navbtn{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;border:0;
  background:transparent;color:#cdc3b3;cursor:pointer;font-family:inherit;font-size:13.5px;text-align:left;
  width:100%;min-width:0;transition:.15s;font-weight:500;}
.navbtn:hover{background:rgba(255,255,255,.06);color:#fff;}
.navbtn.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 14px rgba(180,83,9,.35);}
.navbtn .material-symbols-outlined{font-size:21px;flex:0 0 auto;}
.navbtn .tx{display:flex;flex-direction:column;min-width:0;}
.navbtn .tx b{font-weight:600;}
.navbtn .tx small{font-size:10.5px;opacity:.75;font-weight:400;}
.sfoot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#9a8f7d;}
.main{flex:1;min-width:0;padding:26px 30px 60px;}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px;}
.top h2{margin:0;font-size:22px;font-weight:700;}
.top p{margin:5px 0 0;color:var(--muted);font-size:13px;max-width:640px;}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff5e6;color:var(--accent);
  border:1px solid #f6e2c1;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;}
.grid{display:grid;gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:2fr 1fr;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0;}
.card h3{margin:0 0 4px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
.card .sub{font-size:11.5px;color:var(--muted);margin-bottom:14px;}
.kpi .val{font-size:28px;font-weight:700;line-height:1;margin:8px 0 2px;}
.kpi .lb{font-size:12px;color:var(--muted);font-weight:500;}
.kpi .dt{font-size:11px;margin-top:8px;display:inline-flex;align-items:center;gap:3px;font-weight:600;}
.up{color:var(--ok);} .down{color:var(--bad);} .neu{color:var(--muted);}
.chartbox{position:relative;width:100%;overflow:hidden;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600;background:#faf7f3;}
tbody tr:hover{background:#fdfaf5;}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;}
.t-ok{background:#e7f6ec;color:#15803d;}
.t-warn{background:#fef3e2;color:#b45309;}
.t-bad{background:#fdeaea;color:#c02626;}
.t-info{background:#e8effd;color:#1d4ed8;}
.t-mut{background:#eee9e1;color:#6b6153;}
.bar{height:7px;border-radius:6px;background:#efe9df;overflow:hidden;min-width:60px;flex:1;}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.col{background:#faf7f2;border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0;}
.col h4{margin:0 0 10px;font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center;}
.col h4 span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:10.5px;color:var(--muted);}
.ticket{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;padding:10px 11px;margin-bottom:9px;}
.ticket b{font-size:12.5px;display:block;margin-bottom:5px;}
.ticket .m{font-size:10.5px;color:var(--muted);display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;}
.gate{display:flex;gap:0;align-items:stretch;overflow-x:auto;padding-bottom:4px;}
.gnode{flex:1;min-width:120px;text-align:center;position:relative;padding:0 6px;}
.gnode .dot{width:34px;height:34px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;
  color:#fff;font-weight:700;font-size:13px;position:relative;z-index:2;}
.gnode .ln{position:absolute;top:17px;left:50%;width:100%;height:3px;background:var(--line);z-index:1;}
.gnode:last-child .ln{display:none;}
.gnode .gt{font-size:12px;font-weight:600;}
.gnode .gs{font-size:10.5px;color:var(--muted);margin-top:2px;}
.tl{position:relative;padding-left:22px;}
.tl:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tli{position:relative;padding:0 0 16px 4px;}
.tli:last-child{padding-bottom:0;}
.tli .d{position:absolute;left:-20px;top:2px;width:12px;height:12px;border-radius:50%;
  border:2px solid var(--accent);background:#fff;}
.tli .h{font-size:12.5px;font-weight:600;}
.tli .s{font-size:11px;color:var(--muted);margin-top:2px;}
.tli .tm{font-size:10.5px;color:var(--accent);font-weight:600;}
.stats{display:flex;flex-direction:column;gap:12px;}
.strow{display:flex;align-items:center;gap:10px;}
.strow .lb{width:96px;flex:0 0 96px;font-size:12px;font-weight:500;min-width:0;}
.strow .num{width:44px;flex:0 0 44px;text-align:right;font-size:12px;font-weight:600;}
.risk{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:11px;margin-bottom:10px;background:#fff;}
.risk .sev{width:6px;align-self:stretch;border-radius:6px;flex:0 0 6px;}
.risk .bd{flex:1;min-width:0;}
.risk .bd b{font-size:13px;}
.risk .bd p{margin:3px 0 0;font-size:11.5px;color:var(--muted);}
.risk .sc{text-align:center;flex:0 0 auto;}
.risk .sc .n{font-size:20px;font-weight:700;}
.risk .sc .l{font-size:10px;color:var(--muted);}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.dotc{width:9px;height:9px;border-radius:50%;display:inline-block;}
.deci{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#fff8ef,#fff);
  border:1px solid #f2dcb8;border-radius:14px;padding:16px;flex-wrap:wrap;}
.deci .big{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;color:#fff;flex:0 0 56px;}
.deci .tx{min-width:0;}
.deci .tx b{font-size:15px;} .deci .tx p{margin:3px 0 0;font-size:12px;color:var(--muted);}
.mini{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;}
.mtag{font-size:11px;background:#faf7f2;border:1px solid var(--line);border-radius:8px;padding:6px 10px;}
.mtag b{color:var(--ink);}
@media(max-width:860px){
  .app{flex-direction:column;}
  .side{width:100%;flex:none;height:auto;position:static;}
  .nav{flex-direction:row;flex-wrap:wrap;padding:10px;}
  .navbtn{width:auto;flex:1 1 auto;justify-content:center;}
  .navbtn .tx small{display:none;}
  .sfoot{display:none;}
  .main{padding:20px 16px 48px;}
}
@media(max-width:820px){
  .g4,.g3,.g23,.g2{grid-template-columns:1fr;}
  .board{grid-template-columns:1fr 1fr;}
}
@media(max-width:560px){
  .navbtn .tx{display:none;}
  .navbtn{padding:10px 12px;}
  .board{grid-template-columns:1fr;}
  .top h2{font-size:19px;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="lg">
        <div class="ic"><span class="material-symbols-outlined">account_tree</span></div>
        <div>
          <h1>新產品導入管理系統</h1>
          <p>NPI · Stage-Gate 全流程</p>
        </div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sfoot">研發管理 · MES 整合<br/>資料為示範用假資料</div>
  </aside>
  <main class="main">
    <div id="screen"></div>
  </main>
</div>
<script>
"use strict";
var NAV=[
  {i:"account_tree",t:"階段關卡流程",s:"Stage-Gate"},
  {i:"checklist",t:"跨部門任務",s:"任務追蹤"},
  {i:"description",t:"交付物與版本",s:"版次簽核"},
  {i:"precision_manufacturing",t:"試產排程",s:"EVT/DVT/PVT"},
  {i:"science",t:"良率與測試",s:"良率追蹤"},
  {i:"gavel",t:"決策室與風險",s:"放行決策"}
];
var HEAD=[
  {h:"階段關卡流程",p:"以 Stage-Gate 掌握各專案在關卡的進度、凍結點與放行門檻。",pill:"6 個進行中專案"},
  {h:"跨部門任務追蹤",p:"研發、品保、採購任務指派、逾期與相依關係一覽。",pill:"38 項待辦"},
  {h:"交付物與版本管理",p:"規格、圖面、測試報告的版次與簽核狀態，確保凍結前文件到齊。",pill:"12 份交付物"},
  {h:"試產排程",p:"EVT / DVT / PVT 與 PP / MP 試產批次排程與產線佔用。",pill:"5 條試產線"},
  {h:"良率與測試",p:"試產良率趨勢、DVT 測試項目通過率與失效追蹤。",pill:"最新批次 PVT-03"},
  {h:"決策室與風險",p:"里程碑風險排序、放行決策與稽核紀錄。",pill:"Gate 3 待放行"}
];

var charts={};
function destroyCharts(){for(var k in charts){if(charts[k]){try{charts[k].destroy();}catch(e){}charts[k]=null;}}}
function mk(id,cfg){var el=document.getElementById(id);if(!el)return;if(charts[id]){try{charts[id].destroy();}catch(e){}}charts[id]=new Chart(el.getContext("2d"),cfg);}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return c==="&"?"&amp;":c==="<"?"&lt;":"&gt;";});}
function tagCls(k){return k==="ok"?"t-ok":k==="warn"?"t-warn":k==="bad"?"t-bad":k==="info"?"t-info":"t-mut";}

function kpi(lb,val,dt,dir,ic){
  var cls=dir==="up"?"up":dir==="down"?"down":"neu";
  var ar=dir==="up"?"arrow_upward":dir==="down"?"arrow_downward":"remove";
  return '<div class="card kpi"><h3><span class="material-symbols-outlined">'+ic+'</span></h3>'+
    '<div class="lb">'+lb+'</div><div class="val">'+val+'</div>'+
    '<div class="dt '+cls+'"><span class="material-symbols-outlined" style="font-size:15px">'+ar+'</span>'+dt+'</div></div>';
}

/* ---------- SCREEN 0 : Stage-Gate ---------- */
function s0(){
  var gates=[
    {n:"G0",t:"概念立項",s:"已通過",c:"ok"},
    {n:"G1",t:"可行性",s:"已通過",c:"ok"},
    {n:"G2",t:"設計凍結",s:"進行中",c:"warn"},
    {n:"G3",t:"試產放行",s:"待評估",c:"info"},
    {n:"G4",t:"量產放行",s:"未開始",c:"mut"}
  ];
  var col={ok:"#16a34a",warn:"#d97706",info:"#2563eb",mut:"#c9bfb0"};
  var proj=[
    {id:"NP-2401",nm:"智慧溫控閥 V2",gate:"G2",own:"林昱辰",pr:72,st:"warn",dd:"08/22"},
    {id:"NP-2402",nm:"車用感測模組",gate:"G3",own:"陳映築",pr:88,st:"info",dd:"09/05"},
    {id:"NP-2403",nm:"工業手持終端",gate:"G1",own:"黃士豪",pr:41,st:"ok",dd:"09/18"},
    {id:"NP-2404",nm:"高壓連接器 X",gate:"G2",own:"吳庭萱",pr:64,st:"warn",dd:"08/29"},
    {id:"NP-2405",nm:"低功耗閘道器",gate:"G4",own:"蔡承恩",pr:95,st:"ok",dd:"08/16"},
    {id:"NP-2406",nm:"精密齒輪組 S",gate:"G0",own:"周雅琪",pr:18,st:"mut",dd:"10/02"}
  ];
  var rows=proj.map(function(p){
    return '<tr><td><b>'+p.id+'</b></td><td>'+esc(p.nm)+'</td><td><span class="tag '+tagCls(p.st)+'">'+p.gate+'</span></td>'+
      '<td>'+esc(p.own)+'</td><td style="min-width:130px"><div style="display:flex;align-items:center;gap:8px"><div class="bar"><i style="width:'+p.pr+'%"></i></div><span style="font-size:11px;color:var(--muted)">'+p.pr+'%</span></div></td>'+
      '<td>'+p.dd+'</td></tr>';
  }).join("");
  var gnodes=gates.map(function(g){
    return '<div class="gnode"><div class="ln"></div><div class="dot" style="background:'+col[g.c]+'">'+g.n+'</div><div class="gt">'+g.t+'</div><div class="gs">'+g.s+'</div></div>';
  }).join("");
  return ''+
  '<div class="card" style="margin-bottom:16px"><h3><span class="material-symbols-outlined">timeline</span>Stage-Gate 關卡進程 — NP-2401 智慧溫控閥 V2</h3>'+
  '<div class="sub">凍結點 G2 設計凍結進行中，剩餘 8 天。</div><div class="gate">'+gnodes+'</div></div>'+
  '<div class="grid g23">'+
    '<div class="card"><h3><span class="material-symbols-outlined">folder_open</span>進行中專案</h3><div class="sub">依關卡與交期排序</div>'+
      '<div style="overflow-x:auto"><table><thead><tr><th>編號</th><th>產品</th><th>關卡</th><th>負責人</th><th>完成度</th><th>凍結日</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>關卡分布</h3><div class="sub">6 專案所在關卡</div>'+
      '<div class="chartbox" style="height:220px"><canvas id="c0a"></canvas></div></div>'+
  '</div>';
}
function s0c(){
  mk("c0a",{type:"doughnut",data:{labels:["G0 概念","G1 可行性","G2 設計凍結","G3 試產","G4 量產"],
    datasets:[{data:[1,1,2,1,1],backgroundColor:["#d9b98a","#b45309","#f59e0b","#2563eb","#16a34a"],borderWidth:2,borderColor:"#fff"}]},
    options:{maintainAspectRatio:false,responsive:true,cutout:"58%",plugins:{legend:{position:"bottom",labels:{boxWidth:11,font:{size:11}}}}}});
}

/* ---------- SCREEN 1 : Cross-dept tasks ---------- */
function s1(){
  var cols=[
    {h:"研發",n:3,items:[
      {t:"完成 V2 主板 Layout 修訂",m:"林昱辰",d:"08/16",st:"warn"},
      {t:"韌體低功耗模式驗證",m:"蔡承恩",d:"08/18",st:"info"},
      {t:"結構件干涉檢查",m:"吳庭萱",d:"08/20",st:"info"}
    ]},
    {h:"品保",n:2,items:[
      {t:"DVT 溫升測試複測",m:"陳映築",d:"08/15",st:"bad"},
      {t:"IQC 進料抽樣計畫",m:"周雅琪",d:"08/19",st:"info"}
    ]},
    {h:"採購",n:2,items:[
      {t:"連接器二階供應商認證",m:"黃士豪",d:"08/17",st:"warn"},
      {t:"長交期料件 PCBA 下單",m:"黃士豪",d:"08/14",st:"bad"}
    ]},
    {h:"完成",n:2,items:[
      {t:"G1 可行性報告簽核",m:"研發經理",d:"08/09",st:"ok"},
      {t:"BOM 初版凍結",m:"林昱辰",d:"08/07",st:"ok"}
    ]}
  ];
  var board=cols.map(function(c){
    var its=c.items.map(function(x){
      var bc=x.st==="bad"?"#dc2626":x.st==="warn"?"#d97706":x.st==="ok"?"#16a34a":"#2563eb";
      return '<div class="ticket" style="border-left-color:'+bc+'">'+
        '<b>'+esc(x.t)+'</b><div class="m"><span>'+esc(x.m)+'</span><span>'+x.d+'</span></div></div>';
    }).join("");
    return '<div class="col"><h4>'+c.h+'<span>'+c.n+'</span></h4>'+its+'</div>';
  }).join("");
  return ''+
  '<div class="grid g4" style="margin-bottom:16px">'+
    kpi("待辦任務","38","+5 本週","down","checklist")+
    kpi("逾期任務","4","須關注","neu","warning")+
    kpi("本週到期","11","3 部門","neu","calendar_month")+
    kpi("完成率","82%","+6%","up","task_alt")+
  '</div>'+
  '<div class="card"><h3><span class="material-symbols-outlined">view_kanban</span>跨部門任務看板</h3><div class="sub">依部門分欄，紅色為逾期或高風險</div>'+
    '<div style="overflow-x:auto"><div class="board">'+board+'</div></div></div>';
}

/* ---------- SCREEN 2 : Deliverables & versions ---------- */
function s2(){
  var d=[
    {nm:"產品規格書 PRD",ver:"v3.2",own:"林昱辰",st:"已簽核",c:"ok",up:"08/09"},
    {nm:"機構 3D 圖面",ver:"v2.4",own:"吳庭萱",st:"審核中",c:"warn",up:"08/12"},
    {nm:"電路原理圖",ver:"v4.1",own:"蔡承恩",st:"已簽核",c:"ok",up:"08/08"},
    {nm:"BOM 表",ver:"v3.0",own:"黃士豪",st:"待更新",c:"bad",up:"08/05"},
    {nm:"DVT 測試計畫",ver:"v1.5",own:"陳映築",st:"審核中",c:"warn",up:"08/13"},
    {nm:"安規認證報告",ver:"v1.0",own:"周雅琪",st:"草稿",c:"mut",up:"08/11"},
    {nm:"包裝設計稿",ver:"v2.0",own:"周雅琪",st:"已簽核",c:"ok",up:"08/10"},
    {nm:"量產作業指導書",ver:"v0.9",own:"林昱辰",st:"草稿",c:"mut",up:"08/13"}
  ];
  var rows=d.map(function(x){
    return '<tr><td><b>'+esc(x.nm)+'</b></td><td><span class="tag t-info">'+x.ver+'</span></td><td>'+esc(x.own)+'</td>'+
      '<td><span class="tag '+tagCls(x.c)+'">'+x.st+'</span></td><td>'+x.up+'</td></tr>';
  }).join("");
  var hist=[
    {h:"DVT 測試計畫 v1.5 送審",s:"陳映築 · 待研發經理簽核",t:"今天 10:24"},
    {h:"BOM 表 v3.0 標記待更新",s:"連接器料號變更，等採購回覆",t:"昨天 16:40"},

/* ---------- SCREEN 3 : Trial production schedule ---------- */
function s3(){
  var lines=["L1 SMT","L2 組裝","L3 測試","L4 老化","L5 包裝"];
  var wk=["W32","W33","W34","W35","W36","W37"];
  var plan=[
    {b:"EVT-02",ph:"EVT",start:0,len:1,line:0,c:"#2563eb"},
    {b:"DVT-01",ph:"DVT",start:1,len:2,line:1,c:"#b45309"},
    {b:"DVT-02",ph:"DVT",start:2,len:1,line:2,c:"#b45309"},
    {b:"PVT-03",ph:"PVT",start:3,len:2,line:3,c:"#f59e0b"},
    {b:"PP-01",ph:"PP",start:4,len:1,line:0,c:"#16a34a"},
    {b:"MP-預備",ph:"MP",start:5,len:1,line:4,c:"#7c3aed"}
  ];
  var head='<tr><th style="min-width:78px">產線</th>'+wk.map(function(w){return '<th style="text-align:center">'+w+'</th>';}).join("")+'</tr>';
  var body=lines.map(function(ln,li){
    var cells="";
    for(var w=0;w<wk.length;w++){
      var hit=null,k;
      for(k=0;k<plan.length;k++){if(plan[k].line===li&&plan[k].start===w){hit=plan[k];break;}}
      var mid=false;
      for(k=0;k<plan.length;k++){var p=plan[k];if(p.line===li&&w>p.start&&w<p.start+p.len){mid=true;}}
      if(hit){cells+='<td style="padding:6px" colspan="'+hit.len+'"><div style="background:'+hit.c+';color:#fff;border-radius:7px;padding:6px 8px;font-size:11px;font-weight:600;text-align:center;white-space:nowrap">'+hit.b+' · '+hit.ph+'</div></td>';w+=hit.len-1;}
      else if(mid){}
      else{cells+='<td style="text-align:center;color:#d8cfc0">·</td>';}
    }
    return '<tr><td><b>'+ln+'</b></td>'+cells+'</tr>';
  }).join("");
  var batch=[
    {b:"EVT-02",qty:30,ph:"EVT",st:"完成",c:"ok"},
    {b:"DVT-01",qty:80,ph:"DVT",st:"進行中",c:"warn"},
    {b:"DVT-02",qty:80,ph:"DVT",st:"排定",c:"info"},
    {b:"PVT-03",qty:200,ph:"PVT",st:"排定",c:"info"}
  ];
  var brow=batch.map(function(x){return '<tr><td><b>'+x.b+'</b></td><td>'+x.ph+'</td><td>'+x.qty+' pcs</td><td><span class="tag '+tagCls(x.c)+'">'+x.st+'</span></td></tr>';}).join("");
  return ''+
  '<div class="grid g4" style="margin-bottom:16px">'+
    kpi("試產批次","6","W32–W37","neu","precision_manufacturing")+
    kpi("產線佔用","5 線","峰值 W34","neu","factory")+
    kpi("PVT 承諾日","W36","量產前置","neu","event")+
    kpi("試產總量","470 pcs","含老化樣品","neu","inventory_2")+
  '</div>'+
  '<div class="card" style="margin-bottom:16px"><h3><span class="material-symbols-outlined">calendar_view_week</span>試產排程甘特 — 產線 × 週次</h3>'+
    '<div class="sub">EVT 工程驗證 · DVT 設計驗證 · PVT 量產驗證 · PP/MP 試量產</div>'+
    '<div style="overflow-x:auto"><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>'+
    '<div class="legend"><span><i class="dotc" style="background:#2563eb"></i>EVT</span><span><i class="dotc" style="background:#b45309"></i>DVT</span><span><i class="dotc" style="background:#f59e0b"></i>PVT</span><span><i class="dotc" style="background:#16a34a"></i>PP</span><span><i class="dotc" style="background:#7c3aed"></i>MP</span></div></div>'+
  '<div class="grid g2">'+
    '<div class="card"><h3><span class="material-symbols-outlined">receipt_long</span>試產批次清單</h3><div class="sub">批號、數量與狀態</div>'+
      '<div style="overflow-x:auto"><table><thead><tr><th>批號</th><th>階段</th><th>數量</th><th>狀態</th></tr></thead><tbody>'+brow+'</tbody></table></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">bolt</span>各週產線佔用率</h3><div class="sub">試產線負載</div>'+
      '<div class="chartbox" style="height:200px"><canvas id="c3a"></canvas></div></div>'+
  '</div>';
}
function s3c(){
  mk("c3a",{type:"bar",data:{labels:["W32","W33","W34","W35","W36","W37"],
    datasets:[{label:"佔用率 %",data:[40,60,80,60,40,20],backgroundColor:"#b45309",borderRadius:6,barPercentage:.6}]},
    options:{maintainAspectRatio:false,responsive:true,scales:{y:{beginAtZero:true,max:100,ticks:{callback:function(v){return v+"%";}}}},plugins:{legend:{display:false}}}});
}

  '<div class="grid g23">'+
    '<div class="card"><h3><span class="material-symbols-outlined">trending_up</span>各試產批次良率趨勢</h3><div class="sub">EVT → DVT → PVT</div>'+
      '<div class="chartbox" style="height:230px"><canvas id="c4a"></canvas></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">checklist</span>DVT 測試項目通過率</h3><div class="sub">6 大驗證項目</div><div class="stats" style="margin-top:6px">'+st+'</div></div>'+
  '</div>'+
  '<div class="card" style="margin-top:16px"><h3><span class="material-symbols-outlined">warning</span>失效追蹤（Failure Tracking）</h3><div class="sub">DVT/PVT 失效項目與改善狀態</div>'+
    '<div style="overflow-x:auto"><table><thead><tr><th>編號</th><th>項目</th><th>描述</th><th>負責人</th><th>狀態</th></tr></thead><tbody>'+frow+'</tbody></table></div></div>';
}
function s4c(){
  mk("c4a",{type:"line",data:{labels:["EVT-01","EVT-02","DVT-01","DVT-02","PVT-03"],
    datasets:[{label:"良率 %",data:[78,84,87,90,93.5],borderColor:"#b45309",backgroundColor:"rgba(245,158,11,.15)",fill:true,tension:.35,pointBackgroundColor:"#b45309",pointRadius:4},
    {label:"目標線 %",data:[90,90,90,90,90],borderColor:"#9ca3af",borderDash:[6,5],pointRadius:0,fill:false}]},
    options:{maintainAspectRatio:false,responsive:true,scales:{y:{min:60,max:100,ticks:{callback:function(v){return v+"%";}}}},plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:11}}}}}});
}

/* ---------- SCREEN 5 : Decision room & risk ---------- */
function s5(){
  var risks=[
    {t:"DVT 溫升超標可能影響 G2 設計凍結",p:"若下週未收斂散熱方案，凍結日恐延後 5 天。",sev:"#dc2626",sc:92,lv:"高"},

  ];
  var rk=risks.map(function(r){return '<div class="risk"><div class="sev" style="background:'+r.sev+'"></div><div class="bd"><b>'+esc(r.t)+'</b><p>'+esc(r.p)+'</p></div><div class="sc"><div class="n" style="color:'+r.sev+'">'+r.sc+'</div><div class="l">'+r.lv+'風險</div></div></div>';}).join("");

  '<div class="deci" style="margin-bottom:16px"><div class="big"><span class="material-symbols-outlined">gavel</span></div>'+
    '<div class="tx"><b>Gate 3 試產放行 — 條件式通過</b><p>NP-2401 智慧溫控閥 V2 · 主席：技術長 蔡承恩 · 08/22 決策會</p>'+
    '<div class="mini"><span class="mtag">量產承諾日 <b>W36</b></span><span class="mtag">未結風險 <b>2</b></span><span class="mtag">待補交付物 <b>3</b></span><span class="mtag">決策 <b>條件式放行</b></span></div></div></div>'+
  '<div class="grid g23">'+
    '<div class="card"><h3><span class="material-symbols-outlined">warning</span>里程碑風險排序</h3><div class="sub">依影響凍結 / 承諾日之風險分數排序</div>'+rk+'</div>'+

  '</div>'+

    '<div style="overflow-x:auto"><table><thead><tr><th>關卡</th><th>日期</th><th>決策</th><th>主席</th><th>備註</th></tr></thead><tbody>'+

    '<tr><td>G1 可行性</td><td>07/02</td><td><span class="tag t-ok">通過</span></td><td>研發經理</td><td>技術風險可控</td></tr>'+
    '<tr><td>G2 設計凍結</td><td>08/22</td><td><span class="tag t-warn">進行中</span></td><td>研發經理</td><td>散熱方案收斂中</td></tr>'+
    '<tr><td>G3 試產放行</td><td>08/22</td><td><span class="tag t-info">條件式</span></td><td>技術長</td><td>2 風險列管追蹤</td></tr>'+
    '</tbody></table></div></div>';
}
function s5c(){
  mk("c5a",{type:"radar",data:{labels:["設計成熟度","測試通過","供應鏈","良率","文件完整","風險控管"],
    datasets:[{label:"目前",data:[82,78,65,93,70,60],borderColor:"#b45309",backgroundColor:"rgba(245,158,11,.2)",pointBackgroundColor:"#b45309"},
    {label:"放行門檻",data:[85,85,80,90,85,80],borderColor:"#9ca3af",borderDash:[5,4],pointRadius:0,backgroundColor:"rgba(0,0,0,0)"}]},
    options:{maintainAspectRatio:false,responsive:true,scales:{r:{min:0,max:100,ticks:{display:false},pointLabels:{font:{size:10}}}},plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:11}}}}}});
}

var SCR=[s0,s1,s2,s3,s4,s5];
var CB=[s0c,null,null,s3c,s4c,s5c];

function buildNav(){
  var n=document.getElementById("nav");
  n.innerHTML=NAV.map(function(x,i){
    return '<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+x.i+'</span><span class="tx"><b>'+x.t+'</b><small>'+x.s+'</small></span></button>';
  }).join("");
  Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){
    b.addEventListener("click",function(){show(+b.getAttribute("data-i"));});
  });
}

function show(i){
  destroyCharts();
  var btns=document.querySelectorAll("[data-i]");
  Array.prototype.forEach.call(btns,function(b){b.classList.toggle("on",+b.getAttribute("data-i")===i);});
  var h=HEAD[i];
  var container=document.getElementById("screen");
  container.innerHTML='<div class="top"><div><h2>'+h.h+'</h2><p>'+h.p+'</p></div><span class="pill"><span class="material-symbols-outlined" style="font-size:16px">bolt</span>'+h.pill+'</span></div>'+SCR[i]();
  void container.offsetHeight;
  if(CB[i])CB[i]();
  try{window.scrollTo(0,0);}catch(e){}
}

buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
