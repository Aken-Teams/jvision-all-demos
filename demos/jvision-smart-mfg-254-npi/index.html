<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>新產品導入管理系統（NPI）</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700&family=Roboto+Mono:wght@300;400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#15803D;
  --color-on-primary:#FFFFFF;
  --color-secondary:#22C55E;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDF4;
  --color-foreground:#14532D;
  --color-card:#FFFFFF;
  --color-card-foreground:#14532D;
  --color-muted:#E8F0F1;
  --color-muted-foreground:#475569;
  --color-border:#BBF7D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#15803D;
  --blue:#2563EB;
  --ink:#14532D;
  --muted:#475569;
  --line:#BBF7D0;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#B91C1C;
  --info:#1D4ED8;
  --surface-soft:#F7FCF8;
  --shadow:0 1px 2px rgba(20,83,45,.05),0 10px 30px rgba(20,83,45,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  background:var(--color-background);
  color:var(--ink);
  font-family:"Exo","Noto Sans TC","PingFang TC",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,a{font:inherit}
button,[data-i]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.side{
  position:sticky;top:0;height:100vh;overflow:auto;
  display:flex;flex-direction:column;
  background:#0F3D24;color:#fff;
  border-right:1px solid rgba(255,255,255,.12);
}
.brand{padding:28px 22px 22px;border-bottom:1px solid rgba(255,255,255,.13)}
.brand .lg{display:flex;align-items:center;gap:13px}
.brand .ic{
  width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;
  background:var(--color-secondary);color:#082F1B;border-radius:5px;
  box-shadow:5px 5px 0 rgba(255,255,255,.12);
}
.brand h1{margin:0;font-size:15px;line-height:1.4;font-weight:700;letter-spacing:.02em}
.brand p{margin:4px 0 0;color:#C7E9D1;font:10px/1.4 "Roboto Mono",monospace;letter-spacing:.08em}
.nav{display:flex;flex:1;flex-direction:column;gap:5px;padding:18px 12px}
.navbtn{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;
  min-height:52px;padding:10px 12px;border:1px solid transparent;border-radius:4px;
  background:transparent;color:#D7EBDD;text-align:left;
  transition:background-color .22s ease,color .22s ease,border-color .22s ease,transform .22s ease;
}
.navbtn:hover{background:rgba(255,255,255,.08);color:#fff;transform:translateX(2px)}
.navbtn.on{background:#fff;color:#14532D;border-color:#fff}
.navbtn.on:before{
  content:"";position:absolute;left:-13px;top:8px;bottom:8px;width:4px;background:var(--color-secondary)
}
.navbtn .material-symbols-outlined{font-size:21px}
.navbtn .tx{display:flex;flex-direction:column;min-width:0}
.navbtn b{font-size:13px;font-weight:600}
.navbtn small{margin-top:2px;color:inherit;opacity:.7;font:10px "Roboto Mono",monospace}
.sfoot{padding:17px 22px;border-top:1px solid rgba(255,255,255,.13);color:#B8D8C2;font-size:10.5px;line-height:1.7}
.main{min-width:0;padding:0 34px 64px}
.progress{
  position:sticky;z-index:20;top:0;height:4px;margin:0 -34px 28px;
  background:#DCEEE1;
}
.progress i{display:block;height:100%;width:16.666%;background:var(--color-accent);transition:width .35s ease}
.top{
  display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
  margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--line);
}
.eyebrow{
  display:block;margin-bottom:7px;color:var(--color-primary);
  font:600 10px "Roboto Mono",monospace;letter-spacing:.14em;text-transform:uppercase
}
.top h2{margin:0;font-size:clamp(23px,2.5vw,32px);line-height:1.15;letter-spacing:-.025em}
.top p{max-width:680px;margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.65}
.pill,.tag{
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  border-radius:999px;font-weight:600
}
.pill{padding:7px 12px;border:1px solid #F3C98B;background:#FFF8E8;color:#92400E;font-size:11px}
.grid{display:grid;gap:15px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(270px,1fr)}
.card{
  min-width:0;padding:19px;background:var(--color-card);color:var(--color-card-foreground);
  border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);
  transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.card:hover{border-color:#86D99E;box-shadow:0 2px 3px rgba(20,83,45,.06),0 16px 35px rgba(20,83,45,.09)}
.card h3{display:flex;align-items:center;gap:8px;margin:0 0 5px;font-size:13px;line-height:1.45}
.card h3 .material-symbols-outlined{color:var(--color-primary);font-size:19px}
.card .sub{margin-bottom:15px;color:var(--muted);font-size:11.5px;line-height:1.55}
.kpi{position:relative;overflow:hidden}
.kpi:after{content:"";position:absolute;right:0;top:0;width:4px;height:100%;background:var(--color-secondary)}
.kpi h3{margin:0}
.kpi .lb{margin-top:10px;color:var(--muted);font-size:11.5px;font-weight:500}
.kpi .val{margin:5px 0 2px;font:700 27px/1.15 "Roboto Mono",monospace;letter-spacing:-.04em}
.kpi .dt{display:inline-flex;align-items:center;gap:3px;margin-top:8px;font-size:10.5px;font-weight:600}
.up{color:var(--ok)}.down{color:var(--bad)}.neu{color:var(--muted)}
.chartbox{position:relative;width:100%;overflow:hidden}
.table-wrap{overflow-x:auto;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th,td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{
  background:#EAF8EE;color:#355C43;text-align:left;
  font:600 10px "Roboto Mono",monospace;letter-spacing:.07em;text-transform:uppercase
}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background-color .2s ease}
tbody tr:hover{background:#F1FAF3}
td:nth-last-child(1){font-variant-numeric:tabular-nums}
.num-cell{text-align:right;font-family:"Roboto Mono",monospace}
.code,td:first-child b,.tm,.val{font-family:"Roboto Mono",monospace}
.tag{padding:4px 9px;border:1px solid transparent;font-size:10.5px}
.tag:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-ok{background:#E7F7EC;color:#146C34;border-color:#A7E4B8}
.t-warn{background:#FFF4DE;color:#92400E;border-color:#F1C77E}
.t-bad{background:#FDECEC;color:#A61B1B;border-color:#F4B4B4}
.t-info{background:#EDF3FF;color:#1E4FAA;border-color:#B8CDF7}
.t-mut{background:#EEF3F1;color:#475569;border-color:#D4DFDA}
.bar{height:7px;min-width:60px;overflow:hidden;flex:1;background:#DCE9E0;border-radius:2px}
.bar>i{display:block;height:100%;background:var(--color-primary);border-radius:2px}
.board{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:12px}
.col{min-width:0;padding:12px;background:#F4FAF6;border:1px solid var(--line);border-radius:5px}
.col h4{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px;font-size:12px}
.col h4 span{padding:2px 7px;background:#fff;border:1px solid var(--line);border-radius:999px;color:var(--muted);font:10px "Roboto Mono",monospace}
.ticket{
  margin-bottom:9px;padding:11px;background:#fff;border:1px solid var(--line);
  border-left:4px solid var(--color-primary);border-radius:3px;
  transition:transform .2s ease,box-shadow .2s ease
}
.ticket:hover{transform:translateY(-2px);box-shadow:0 7px 18px rgba(20,83,45,.08)}
.ticket b{display:block;margin-bottom:7px;font-size:12px;line-height:1.45}
.ticket .m{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;color:var(--muted);font:10px "Roboto Mono",monospace}
.gate{display:flex;align-items:stretch;overflow-x:auto;padding:8px 0 3px}
.gnode{position:relative;min-width:120px;flex:1;padding:0 6px;text-align:center}
.gnode .dot{
  position:relative;z-index:2;display:grid;place-items:center;width:36px;height:36px;margin:0 auto 9px;
  border:3px solid #fff;border-radius:50%;color:#fff;font:700 11px "Roboto Mono",monospace;
  box-shadow:0 0 0 1px var(--line)
}
.gnode .ln{position:absolute;z-index:1;top:18px;left:50%;width:100%;height:2px;background:var(--line)}
.gnode:last-child .ln{display:none}
.gnode .gt{font-size:11.5px;font-weight:600}
.gnode .gs{margin-top:3px;color:var(--muted);font-size:10px}
.tl{position:relative;padding-left:23px}
.tl:before{content:"";position:absolute;left:6px;top:5px;bottom:5px;width:2px;background:var(--line)}
.tli{position:relative;padding:0 0 17px 5px}
.tli:last-child{padding-bottom:0}
.tli .d{position:absolute;left:-21px;top:3px;width:12px;height:12px;background:#fff;border:3px solid var(--color-primary);border-radius:50%}
.tli .tm{color:var(--color-primary);font-size:9.5px;font-weight:600}
.tli .h{margin-top:2px;font-size:12px;font-weight:600}
.tli .s{margin-top:3px;color:var(--muted);font-size:10.5px;line-height:1.45}
.stats{display:flex;flex-direction:column;gap:13px}
.strow{display:flex;align-items:center;gap:10px}
.strow .lb{width:100px;flex:0 0 100px;font-size:11px;font-weight:500}
.strow .num{width:43px;flex:0 0 43px;text-align:right;font:600 11px "Roboto Mono",monospace}
.risk{
  display:flex;align-items:center;gap:12px;margin-bottom:10px;padding:12px;
  background:#fff;border:1px solid var(--line);border-radius:4px
}
.risk .sev{width:5px;align-self:stretch;flex:0 0 5px;border-radius:1px}
.risk .bd{min-width:0;flex:1}
.risk .bd b{font-size:12.5px}
.risk .bd p{margin:4px 0 0;color:var(--muted);font-size:11px;line-height:1.5}
.risk .sc{flex:0 0 auto;text-align:center}
.risk .sc .n{font:700 19px "Roboto Mono",monospace}
.risk .sc .l{color:var(--muted);font-size:9.5px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:11px;color:var(--muted);font-size:10.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dotc{display:inline-block;width:9px;height:9px;border-radius:2px}
.deci{
  display:flex;align-items:center;gap:15px;flex-wrap:wrap;padding:18px;
  background:linear-gradient(120deg,#E9F9EE,#fff 62%);border:1px solid #8EDAA4;border-radius:6px;
  box-shadow:var(--shadow)
}
.deci .big{
  display:grid;place-items:center;width:58px;height:58px;flex:0 0 58px;
  background:var(--color-primary);color:#fff;border-radius:4px;box-shadow:5px 5px 0 #A7E4B8
}
.deci .tx{min-width:0;flex:1}
.deci .tx>b{font-size:15px}
.deci .tx p{margin:4px 0 0;color:var(--muted);font-size:11.5px;line-height:1.5}
.mini{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.mtag{padding:6px 9px;background:#fff;border:1px solid var(--line);border-radius:3px;color:var(--muted);font-size:10.5px}
.mtag b{color:var(--ink);font-family:"Roboto Mono",monospace}
.reveal{animation:enter .42s cubic-bezier(.2,.75,.25,1) both}
.grid-item{animation:stagger .4s cubic-bezier(.2,1.25,.3,1) both}
.grid-item:nth-child(2){animation-delay:.06s}
.grid-item:nth-child(3){animation-delay:.12s}
.grid-item:nth-child(4){animation-delay:.18s}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes stagger{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
@media(max-width:1024px){
  .app{grid-template-columns:220px minmax(0,1fr)}
  .main{padding-left:22px;padding-right:22px}
  .progress{margin-left:-22px;margin-right:-22px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23{grid-template-columns:1fr}
}
@media(max-width:768px){
  .app{display:block}
  .side{position:relative;width:100%;height:auto}
  .brand{padding:16px}
  .nav{flex-direction:row;overflow-x:auto;padding:10px 12px}
  .navbtn{width:auto;min-width:52px;flex:0 0 auto;justify-content:center;padding:10px}
  .navbtn.on:before{left:8px;right:8px;top:auto;bottom:-11px;width:auto;height:3px}
  .navbtn .tx small{display:none}
  .sfoot{display:none}
  .main{padding:0 16px 44px}
  .progress{top:0;margin:0 -16px 22px}
  .top{align-items:flex-start}
  .board{grid-template-columns:repeat(4,230px)}
}
@media(max-width:560px){
  .navbtn .tx{display:none}
  .top{display:block}
  .pill{margin-top:13px}
  .g4,.g3,.g2,.g23{grid-template-columns:1fr}
  .card{padding:15px}
  .top h2{font-size:23px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="lg">
        <div class="ic"><span class="material-symbols-outlined" aria-hidden="true">account_tree</span></div>
        <div><h1>新產品導入管理系統</h1><p>NPI · STAGE-GATE 全流程</p></div>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="主要畫面"></nav>
    <div class="sfoot">研發管理 · MES 整合<br>資料為示範用假資料</div>
  </aside>
  <main class="main">
    <div class="progress" aria-hidden="true"><i id="progressBar"></i></div>
    <div id="screen" aria-live="polite"></div>
  </main>
</div>
<script>
"use strict";
var NAV=[
{i:"account_tree",t:"階段關卡流程",s:"Stage-Gate"},
{i:"checklist",t:"跨部門任務",s:"任務追蹤"},
{i:"description",t:"交付物與版本",s:"版次簽核"},
{i:"precision_manufacturing",t:"試產排程",s:"EVT/DVT/PVT"},
{i:"science",t:"良率與測試",s:"良率追蹤"},
{i:"gavel",t:"決策室與風險",s:"放行決策"}
];
var HEAD=[
{h:"階段關卡流程",p:"以 Stage-Gate 掌握各專案在關卡的進度、凍結點與放行門檻。",pill:"6 個進行中專案"},
{h:"跨部門任務追蹤",p:"研發、品保、採購任務指派、逾期與相依關係一覽。",pill:"38 項待辦"},
{h:"交付物與版本管理",p:"規格、圖面、測試報告的版次與簽核狀態，確保凍結前文件到齊。",pill:"12 份交付物"},
{h:"試產排程",p:"EVT / DVT / PVT 與 PP / MP 試產批次排程與產線佔用。",pill:"5 條試產線"},
{h:"良率與測試",p:"試產良率趨勢、DVT 測試項目通過率與失效追蹤。",pill:"最新批次 PVT-03"},
{h:"決策室與風險",p:"里程碑風險排序、放行決策與稽核紀錄。",pill:"Gate 3 待放行"}
];
var charts={};
function destroyCharts(){for(var k in charts){if(charts[k]){try{charts[k].destroy()}catch(e){}charts[k]=null}}}
function mk(id,cfg){var el=document.getElementById(id);if(!el)return;if(charts[id])try{charts[id].destroy()}catch(e){}charts[id]=new Chart(el.getContext("2d"),cfg)}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return c==="&"?"&amp;":c==="<"?"&lt;":"&gt;"})}
function tagCls(k){return k==="ok"?"t-ok":k==="warn"?"t-warn":k==="bad"?"t-bad":k==="info"?"t-info":"t-mut"}
function wrapTable(x){return '<div class="table-wrap">'+x+'</div>'}
function kpi(lb,val,dt,dir,ic){
var cls=dir==="up"?"up":dir==="down"?"down":"neu";
var ar=dir==="up"?"arrow_upward":dir==="down"?"arrow_downward":"remove";
return '<div class="card kpi grid-item"><h3><span class="material-symbols-outlined" aria-hidden="true">'+ic+'</span></h3><div class="lb">'+lb+'</div><div class="val">'+val+'</div><div class="dt '+cls+'"><span class="material-symbols-outlined" style="font-size:15px" aria-hidden="true">'+ar+'</span>'+dt+'</div></div>'
}
function s0(){
var gates=[{n:"G0",t:"概念立項",s:"已通過",c:"ok"},{n:"G1",t:"可行性",s:"已通過",c:"ok"},{n:"G2",t:"設計凍結",s:"進行中",c:"warn"},{n:"G3",t:"試產放行",s:"待評估",c:"info"},{n:"G4",t:"量產放行",s:"未開始",c:"mut"}];
var col={ok:"#15803D",warn:"#B45309",info:"#1D4ED8",mut:"#64748B"};
var proj=[
{id:"NP-2401",nm:"智慧溫控閥 V2",gate:"G2",own:"林昱辰",pr:72,st:"warn",dd:"08/22"},
{id:"NP-2402",nm:"車用感測模組",gate:"G3",own:"陳映築",pr:88,st:"info",dd:"09/05"},
{id:"NP-2403",nm:"工業手持終端",gate:"G1",own:"黃士豪",pr:41,st:"ok",dd:"09/18"},
{id:"NP-2404",nm:"高壓連接器 X",gate:"G2",own:"吳庭萱",pr:64,st:"warn",dd:"08/29"},
{id:"NP-2405",nm:"低功耗閘道器",gate:"G4",own:"蔡承恩",pr:95,st:"ok",dd:"08/16"},
{id:"NP-2406",nm:"精密齒輪組 S",gate:"G0",own:"周雅琪",pr:18,st:"mut",dd:"10/02"}];
var rows=proj.map(function(p){return '<tr><td><b>'+p.id+'</b></td><td>'+esc(p.nm)+'</td><td><span class="tag '+tagCls(p.st)+'">'+p.gate+'</span></td><td>'+esc(p.own)+'</td><td style="min-width:140px"><div style="display:flex;align-items:center;gap:8px"><div class="bar" role="progressbar" aria-label="'+esc(p.nm)+' 完成度" aria-valuenow="'+p.pr+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+p.pr+'%"></i></div><span class="code">'+p.pr+'%</span></div></td><td class="code">'+p.dd+'</td></tr>'}).join("");
var nodes=gates.map(function(g){return '<div class="gnode"><div class="ln"></div><div class="dot" style="background:'+col[g.c]+'">'+g.n+'</div><div class="gt">'+g.t+'</div><div class="gs">'+g.s+'</div></div>'}).join("");
