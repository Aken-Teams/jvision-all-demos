<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>品質問題矯正與預防管理系統</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --ok:#047857;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#2563EB;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.055);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-width:320px;
  background:var(--color-background);
  color:var(--ink);
  font-family:"Fira Sans",sans-serif;
  line-height:1.5;
}
button,a,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid rgba(37,99,235,.3);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-size:20px;
  line-height:1;
  vertical-align:middle;
  font-variation-settings:"FILL" 0,"wght" 450,"GRAD" 0,"opsz" 24;
}
.shell{display:flex;min-height:100vh}
.shell>*{min-width:0}
.side{
  position:sticky;
  top:0;
  z-index:30;
  width:252px;
  height:100vh;
  flex:none;
  display:flex;
  flex-direction:column;
  background:var(--color-card);
  border-right:1px solid var(--line);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-height:82px;
  padding:18px;
  border-bottom:1px solid var(--line);
}
.logo{
  width:42px;
  height:42px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:8px;
  background:var(--blue);
  color:#fff;
  font:700 18px/1 "Fira Sans",sans-serif;
  box-shadow:0 6px 14px rgba(37,99,235,.2);
}
.brand b{display:block;font-size:14px;line-height:1.25;letter-spacing:.01em}
.brand span{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font:500 9px/1.3 "Fira Code",monospace;
  letter-spacing:.08em;
}
.nav{display:flex;flex-direction:column;gap:4px;padding:16px 12px}
.nav button{
  width:100%;
  min-height:44px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px 11px;
  border:1px solid transparent;
  border-radius:7px;
  background:transparent;
  color:var(--muted);
  font:600 13px/1.25 "Fira Sans",sans-serif;
  text-align:left;
  white-space:nowrap;
  transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .2s ease;
}
.nav button:hover{
  color:var(--blue);
  background:#EFF6FF;
  border-color:#BFDBFE;
  transform:translateX(2px);
}
.nav button.on{
  color:var(--color-on-primary);
  background:var(--blue);
  border-color:var(--blue);
  box-shadow:0 4px 12px rgba(37,99,235,.18);
}
.nav button .material-symbols-outlined{flex:none}
.nav button .st{
  margin-left:auto;
  padding:3px 6px;
  border-radius:4px;
  background:var(--color-muted);
  color:var(--muted);
  font:600 9px/1.2 "Fira Code",monospace;
}
.nav button.on .st{background:rgba(255,255,255,.18);color:#fff}
.sfoot{
  margin-top:auto;
  padding:16px 18px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:11px;
}
.sfoot b{color:var(--ink);font-weight:600}
.main{flex:1;display:flex;flex-direction:column}
.hd{
  position:sticky;
  top:0;
  z-index:20;
  min-height:82px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  padding:15px clamp(18px,3vw,36px);
  background:rgba(255,255,255,.94);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(12px);
}
.hd h2{margin:0;font-size:clamp(18px,2vw,23px);line-height:1.25;letter-spacing:-.02em}
.hd p{margin:4px 0 0;color:var(--muted);font-size:12px}
.pill{
  flex:none;
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px 11px;
  border:1px solid #BFDBFE;
  border-radius:6px;
  background:#EFF6FF;
  color:#1E40AF;
  font-size:11px;
  font-weight:600;
}
.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--ok);
  box-shadow:0 0 0 3px rgba(4,120,87,.12);
  animation:pulse 1.8s ease-in-out infinite;
}
.wrap{width:100%;max-width:1500px;margin:0 auto;padding:24px clamp(16px,3vw,36px) 40px;flex:1}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{
  position:relative;
  min-height:132px;
  overflow:hidden;
  padding:18px;
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:10px;
  box-shadow:var(--shadow);
  transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
}
.kpi:hover{transform:translateY(-2px);border-color:#BFDBFE;box-shadow:0 12px 28px rgba(15,23,42,.08)}
.kpi::before{
  content:"";
  position:absolute;
  top:0;
  right:0;
  left:0;
  height:3px;
  background:var(--blue);
}
.kpi .l{color:var(--muted);font-size:12px;font-weight:600}
.kpi .v{
  margin-top:7px;
  color:var(--ink);
  font:700 29px/1.15 "Fira Code",monospace;
  letter-spacing:-.04em;
}
.kpi .v small{color:var(--muted);font:500 12px/1 "Fira Sans",sans-serif;letter-spacing:0}
.kpi .d{margin-top:8px;font-size:11px;font-weight:600}
.kpi .ic{position:absolute;right:16px;top:17px;color:var(--blue);font-size:28px;opacity:.2}
.up{color:var(--ok)}
.down{color:var(--bad)}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.35fr) minmax(0,.95fr)}
.g11{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
.card{
  padding:18px;
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:10px;
  box-shadow:var(--shadow);
  transition:border-color .22s ease,box-shadow .22s ease;
}
.card:hover{border-color:#CBD5E1;box-shadow:0 10px 26px rgba(15,23,42,.07)}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin:0 0 15px;
  color:var(--ink);
  font-size:14px;
  line-height:1.35;
}
.card h3 .material-symbols-outlined{color:var(--blue);font-size:19px}
.card h3 .r{margin-left:auto;color:var(--muted);font:500 10px/1.3 "Fira Code",monospace}
.tag{
  display:inline-flex;
  align-items:center;
  min-height:23px;
  padding:3px 8px;
  border:1px solid transparent;
  border-radius:4px;
  font-size:10px;
  font-weight:600;
  white-space:nowrap;
}
.t-open{background:#FEF2F2;border-color:#FECACA;color:#991B1B}
.t-prog{background:#EFF6FF;border-color:#BFDBFE;color:#1D4ED8}
.t-hold{background:#FFFBEB;border-color:#FDE68A;color:#92400E}
.t-done{background:#ECFDF5;border-color:#A7F3D0;color:#065F46}
.t-mut{background:#F1F5F9;border-color:#CBD5E1;color:#334155}
.scroll{
  max-width:100%;
  overflow-x:auto;
  scrollbar-width:thin;
  scrollbar-color:#CBD5E1 transparent;
}
table.data{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
table.data th,table.data td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{
  position:sticky;
  top:0;
  z-index:1;
  background:#F1F5F9;
  color:#334155;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.025em;
}
table.data th:first-child{border-radius:6px 0 0}
table.data th:last-child{border-radius:0 6px 0 0}
table.data tbody tr{transition:background-color .18s ease}
table.data tbody tr:hover{background:#F8FAFC}
table.data tbody tr:last-child td{border-bottom:0}
table.data b{color:#1D4ED8;font-family:"Fira Code",monospace;font-weight:600}
table.data td:first-child,
table.data td:nth-child(4){font-family:"Fira Code",monospace}
table.data td:nth-last-child(1):has(.tag),
table.data td:nth-last-child(2):has(.tag){text-align:left}
.chart{position:relative;height:250px}
.chart canvas{max-width:100%}
.seg{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:17px}
.seg .s{
  flex:1;
  min-width:100px;
  padding:13px;
  background:#F8FAFC;
  border:1px solid var(--line);
  border-radius:7px;
}
.seg .s b{display:block;font:700 22px/1.2 "Fira Code",monospace}
.seg .s small{color:var(--muted);font-size:10px}
.sev{display:flex;flex-direction:column;gap:11px}
.sv{display:flex;align-items:center;gap:10px;font-size:12px}
.sv .bar{height:8px;flex:1;overflow:hidden;border-radius:2px;background:var(--color-muted)}
.sv .bar i{display:block;height:100%;border-radius:2px}
.sv .n{width:34px;text-align:right;font:700 12px/1 "Fira Code",monospace}
.fish{display:block;width:100%;height:auto}
.why{display:flex;flex-direction:column;gap:9px}
.wr{
  display:flex;
  align-items:flex-start;
  gap:11px;
  padding:11px 12px;
  background:#F8FAFC;
  border:1px solid var(--line);
  border-left:3px solid var(--blue);
  border-radius:6px;
}
.wr .n{
  width:24px;
  height:24px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:4px;
  background:var(--blue);
  color:#fff;
  font:700 10px/1 "Fira Code",monospace;
}
.wr b{font-size:12px}
.wr small{display:block;margin-top:3px;color:var(--muted);font-size:10.5px;line-height:1.5}
.root{border-left-color:var(--ok);background:#F0FDF4}
.root b{color:#065F46}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.col{padding:10px;background:#F1F5F9;border:1px solid var(--line);border-radius:8px}
.col .ch{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
  padding:2px 3px;
  font-size:11px;
  font-weight:700;
}
.col .ch .cnt{
  min-width:22px;
  padding:2px 6px;
  border-radius:4px;
  background:#DBEAFE;
  color:#1D4ED8;
  font:700 9px/1.3 "Fira Code",monospace;
  text-align:center;
}
.ac{
  margin-bottom:8px;
  padding:11px;
  background:#fff;
  border:1px solid var(--line);
  border-top:3px solid var(--blue);
  border-radius:6px;
  box-shadow:0 1px 2px rgba(15,23,42,.04);
  transition:transform .2s ease,box-shadow .2s ease;
}
.ac:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(15,23,42,.08)}
.ac.od{border-color:#FCA5A5;border-top-color:var(--bad)}
.ac b{display:block;font-size:11px;line-height:1.45}
.ac small{display:block;margin-top:6px;color:var(--muted);font-size:10px}
.ac.od small{color:#991B1B;font-weight:600}
.ac .who{display:flex;align-items:center;gap:6px;margin-top:8px;color:#1D4ED8;font-size:10px}
.av{
  width:20px;
  height:20px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:var(--blue);
  color:#fff;
  font-size:9px;
  font-weight:700;
}
.vf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.vc{padding:13px;background:#F8FAFC;border:1px solid var(--line);border-radius:7px}
.vc .h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700}
.vc .bx{width:25px;height:25px;flex:none;display:grid;place-items:center;border-radius:4px;color:#fff}
.vc small{display:block;margin-top:8px;color:var(--muted);font-size:10.5px;line-height:1.5}
.vc .rt{margin-top:8px;font-size:10.5px;font-weight:700}
.trace{position:relative;padding-left:23px}
.trace::before{content:"";position:absolute;left:6px;top:5px;bottom:5px;width:2px;background:var(--line)}
.ti{position:relative;padding:0 0 17px 7px}
.ti::before{
  content:"";
  position:absolute;
  left:-22px;
  top:2px;
  width:12px;
  height:12px;
  border:3px solid #fff;
  border-radius:50%;
  background:var(--blue);
  box-shadow:0 0 0 1px var(--blue);
}
.ti.ok::before{background:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.ti .tt{font-size:12px;font-weight:700}
.ti small{display:block;margin-top:3px;color:var(--muted);font:400 10px/1.45 "Fira Code",monospace}
.note{margin:14px 0 0;color:var(--muted);font-size:10.5px;line-height:1.65}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:10px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@media(max-width:1080px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.g11,.g21{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .vf{grid-template-columns:1fr}
}
@media(max-width:820px){
  .shell{display:block}
  .side{position:static;width:100%;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .brand{min-height:68px;padding:12px 16px}
  .nav{display:grid;grid-template-columns:repeat(6,minmax(72px,1fr));gap:5px;overflow-x:auto;padding:9px 12px}
  .nav button{justify-content:center;padding:9px 7px}
  .nav button:hover{transform:none}
  .nav button .st{display:none}
  .nav button>span:nth-child(2){font-size:11px}
  .sfoot{display:none}
  .hd{position:static;min-height:74px}
}
@media(max-width:600px){
  .nav{grid-template-columns:repeat(6,82px)}
  .nav button{flex-direction:column;gap:5px;min-height:57px}
  .hd{align-items:flex-start;padding:14px 16px}
  .hd p{max-width:230px}
  .pill{padding:6px 8px}
  .wrap{padding:16px 12px 28px}
  .kpis,.kpis[style]{grid-template-columns:1fr!important}
  .kpi{min-height:118px}
  .card{padding:14px}
  .board{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
  <div class="brand"><div class="logo">品</div><div><b>品質問題矯正與預防</b><span>QUALITY · CAPA SYSTEM</span></div></div>
  <nav class="nav" id="nav" aria-label="主要功能"></nav>
  <div class="sfoot"><b>品保部 · 製程工程部</b><br/>本月開案 34 · 結案 27 · 逾期 4</div>
</aside>
<div class="main">
  <header class="hd"><div><h2 id="vt"></h2><p id="vd"></p></div><div class="pill"><span class="dot" aria-hidden="true"></span><span id="vp"></span></div></header>
  <main class="wrap"><div id="view"></div></main>
</div>
</div>
<script>
const MOD=[
["CAPA 戰情室","dashboard","案件量、逾期率與結案天數總覽","本月結案率 79%","戰情"],
["問題登錄分類","assignment_add","異常立案、來源分類與嚴重度分級","本日新登 6 件","登錄"],
["根因分析","account_tree","魚骨圖與 5-Why 結構化追因","CAPA-2409 追因中","追因"],
["對策擬定","checklist","矯正與預防對策指派與到期追蹤","進行中對策 18 項","對策"],
["成效驗證","verified","對策有效性驗證與重複不良監控","驗證通過率 91%","驗證"],
["結案稽核","gavel","結案審核、追溯紀錄與稽核軌跡","待審核 5 件","稽核"]
];
const nav=document.getElementById("nav"),view=document.getElementById("view"),vt=document.getElementById("vt"),vd=document.getElementById("vd"),vp=document.getElementById("vp");
MOD.forEach((m,i)=>{
  const b=document.createElement("button");
  b.type="button";b.dataset.i=i;b.setAttribute("aria-label",m[0]);
  b.innerHTML=`<span class="material-symbols-outlined" aria-hidden="true">${m[1]}</span><span>${m[0]}</span><span class="st">${m[4]}</span>`;
  b.addEventListener("click",()=>{location.hash=`v${i}`;show(i)});
  nav.appendChild(b);
});
const CASES=[
["CAPA-2412","電鍍層剝離","客訴","高","對策擬定","t-prog","王品保","製程工程部"],
["CAPA-2411","尺寸超差 +0.08","製程稽核","中","根因分析","t-hold","陳工程","製程工程部"],
["CAPA-2409","焊點空洞率偏高","客訴","高","成效驗證","t-prog","黃品保","研發部"],
["CAPA-2408","來料鍍層厚度不足","進料檢驗","中","對策擬定","t-prog","李品保","品保部"],
["CAPA-2405","外殼色差","客訴","低","結案稽核","t-done","王品保","製程工程部"],
["CAPA-2403","漏鎖固定螺絲","出貨檢驗","中","已結案","t-mut","陳工程","製程工程部"]
];
const SRC=[["客訴",41,"#DC2626"],["製程稽核",23,"#B45309"],["進料檢驗",18,"#2563EB"],["出貨檢驗",12,"#047857"],["內部提報",6,"#64748B"]];
const SEV=[["S1 重大",5,"#DC2626"],["S2 主要",13,"#B45309"],["S3 次要",21,"#2563EB"],["S4 輕微",8,"#047857"]];
const INTAKE=[
["08:04","焊點空洞率偏高","客訴","LOT-C7781","S1","已立案"],
["08:22","電鍍層剝離","客訴","LOT-A2208","S1","已立案"],
["09:10","尺寸超差 +0.08","製程稽核","LOT-B1904","S2","待分派"],
["10:36","來料鍍層厚度不足","進料檢驗","RM-CU0821","S2","待分派"],
["11:15","外殼輕微色差","客訴","LOT-D5520","S4","已立案"],
["13:48","包裝標籤錯貼","出貨檢驗","LOT-E3310","S3","待分派"]
];
const WHY=[
["為何焊點出現空洞？","回焊爐溫曲線峰值不足，助焊劑揮發不全"],
["為何峰值不足？","第 4 溫區加熱管功率衰退未被發現"],
["為何未被發現？","溫區溫度僅每班紙本抄錄、無趨勢監控"],
["為何無趨勢監控？","爐溫資料未串接 SPC 系統"],
["為何未串接？","舊爐控制器缺乏數據輸出介面"]
