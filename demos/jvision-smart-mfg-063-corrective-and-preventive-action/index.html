<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CAPA 矯正預防改善平台 · Corrective &amp; Preventive Action</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--accent:#334155;--accent2:#64748b;--ink:#1e293b;--bg:#f1f5f9;--card:#fff;--line:#e2e8f0;--mut:#64748b;--soft:#f8fafc;--ok:#0d9488;--warn:#d97706;--bad:#dc2626;--info:#2563eb}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.shell{display:flex;min-height:100vh}
.shell>*{min-width:0}
.side{width:236px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex:none;min-width:0}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#fff;flex:none;box-shadow:0 8px 18px rgba(51,65,85,.28);font-family:"Noto Sans TC"}
.brand b{font-size:15px;font-weight:800;display:block;font-family:"Noto Sans TC";line-height:1.2}
.brand span{font-size:9.5px;color:var(--accent2);letter-spacing:1.5px;font-weight:700}
.nav{display:flex;flex-direction:column;gap:3px;padding:6px 10px;min-width:0}
.nav button{border:0;background:transparent;color:var(--mut);font:inherit;font-weight:600;font-size:13px;padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:10px;flex:none;white-space:nowrap;text-align:left;font-family:"Noto Sans TC";min-width:0}
.nav button .material-symbols-outlined{font-size:20px;flex:none}
.nav button .st{font-size:9px;margin-left:auto;background:#eef2f7;color:var(--accent2);padding:2px 6px;border-radius:20px;font-weight:800;flex:none}
.nav button:hover{background:var(--soft);color:var(--accent)}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.nav button.on .st{background:rgba(255,255,255,.22);color:#fff}
.sfoot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--mut)}
.sfoot b{color:var(--accent);font-family:"Noto Sans TC"}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.hd{background:var(--card);border-bottom:1px solid var(--line);padding:15px 24px;display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:15}
.hd h2{margin:0;font-size:20px;font-family:"Noto Sans TC";font-weight:900}
.hd p{margin:3px 0 0;color:var(--mut);font-size:12.5px}
.pill{background:#e2e8f0;color:var(--accent);padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:bl 1.6s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.3}}
.wrap{padding:22px 24px;flex:1}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpis>*{min-width:0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px 15px 20px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:26px;font-weight:800;margin-top:5px;font-family:Inter}
.kpi .v small{font-size:12px;font-weight:600;color:var(--mut)}
.kpi .d{font-size:11px;font-weight:700;margin-top:3px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.16;font-size:30px}
.up{color:var(--ok)}.down{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .95fr}
.g11{grid-template-columns:1fr 1fr}
.g21{grid-template-columns:1fr 1.5fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent);font-size:19px}
.card h3 .r{margin-left:auto;font-size:11px;font-weight:700;color:var(--mut)}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap;display:inline-block}
.t-open{background:#fee2e2;color:#b91c1c}.t-prog{background:#dbeafe;color:#1d4ed8}.t-hold{background:#fef3c7;color:#b45309}.t-done{background:#ccfbf1;color:#0f766e}.t-mut{background:#eef2f7;color:#475569}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:var(--soft)}
table.data tr:last-child td{border-bottom:0}
table.data b{color:var(--accent)}
.scroll{overflow-x:auto}
.chart{position:relative;height:250px}
.chart canvas{max-width:100%}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.seg .s{border:1px solid var(--line);border-radius:11px;padding:11px 14px;background:var(--soft);flex:1;min-width:100px}
.seg .s b{font-size:20px;font-family:Inter;display:block}
.seg .s small{font-size:11px;color:var(--mut)}
.sev{display:flex;flex-direction:column;gap:9px}
.sv{display:flex;align-items:center;gap:10px;font-size:12.5px}
.sv .bar{flex:1;height:9px;background:#eef2f7;border-radius:5px;overflow:hidden}
.sv .bar i{display:block;height:100%;border-radius:5px}
.sv .n{width:34px;text-align:right;font-weight:800;font-family:Inter}
.fish{width:100%;height:auto;display:block}
.why{display:flex;flex-direction:column;gap:9px}
.wr{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--soft);border-left:3px solid var(--accent)}
.wr .n{width:22px;height:22px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.wr b{font-size:12.5px;font-family:"Noto Sans TC"}
.wr small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.root{border-left:3px solid var(--ok);background:#f0fdfa}
.root b{color:var(--ok)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.board>*{min-width:0}
.col{background:var(--soft);border:1px solid var(--line);border-radius:13px;padding:10px}
.col .ch{font-size:12px;font-weight:800;font-family:"Noto Sans TC";display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;padding:0 3px}
.col .ch .cnt{background:#e2e8f0;color:var(--accent);border-radius:20px;font-size:10px;padding:1px 8px}
.ac{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;border-top:3px solid var(--accent2)}
.ac.od{border-top-color:var(--bad)}
.ac b{font-size:12px;font-family:"Noto Sans TC";display:block;line-height:1.35}
.ac small{color:var(--mut);font-size:10.5px;display:block;margin-top:5px}
.ac .who{display:flex;align-items:center;gap:5px;margin-top:7px;font-size:10.5px;color:var(--accent)}
.av{width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:9px;font-weight:800;flex:none}
.vf{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.vf>*{min-width:0}
.vc{border:1px solid var(--line);border-radius:13px;padding:13px;background:var(--soft)}
.vc .h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-family:"Noto Sans TC";font-weight:700}
.vc .bx{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
.vc small{display:block;color:var(--mut);font-size:11px;margin-top:8px;line-height:1.5}
.vc .rt{margin-top:9px;font-size:11px;font-weight:700}
.trace{position:relative;padding-left:22px}
.trace::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.ti{position:relative;padding:0 0 15px 6px}
.ti::before{content:"";position:absolute;left:-20px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.ti.ok::before{background:var(--ok)}
.ti .tt{font-size:12.5px;font-family:"Noto Sans TC";font-weight:700}
.ti small{color:var(--mut);font-size:11px;display:block;margin-top:2px}
.note{font-size:11.5px;color:var(--mut);margin:13px 0 0;line-height:1.6}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
@media(max-width:1080px){.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g11,.g21{grid-template-columns:1fr}.board{grid-template-columns:repeat(2,1fr)}.vf{grid-template-columns:1fr}}
@media(max-width:860px){.shell{flex-direction:column}.side{width:auto;position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:12px 16px}.nav{flex-direction:row;flex-wrap:wrap;margin-left:auto;padding:8px 12px}.nav button .st{display:none}.sfoot{display:none}.hd{position:static}}
@media(max-width:560px){.wrap{padding:16px 14px}.nav button span:not(.material-symbols-outlined){display:none}.nav button{padding:9px}.board{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><div class="logo">改</div><div><b>CAPA 改善平台</b><span>CORRECTIVE &amp; PREVENTIVE</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="sfoot"><b>品保部 · 製程工程部</b><br/>本月開案 34 · 結案 27 · 逾期 4</div>
  </aside>
  <div class="main">
    <header class="hd"><div><h2 id="vt"></h2><p id="vd"></p></div><div class="pill"><span class="dot"></span><span id="vp"></span></div></header>
    <main class="wrap"><div id="view"></div></main>
  </div>
</div>
<script>
const MOD=[
["CAPA 戰情室","dashboard","案件量、逾期率與結案天數總覽","本月結案率 79%","戰情"],
["問題登錄分類","assignment_add","異常立案、來源分類與嚴重度分級","本日新登 6 件","登錄"],
["根因分析","account_tree","魚骨圖與 5-Why 結構化追因","CAPA-2409 追因中","追因"],
["對策擬定","checklist","矯正與預防對策指派與到期追蹤","進行中對策 18 項","對策"],
["成效驗證","verified","對策有效性驗證與重複不良監控","驗證通過率 91%","驗證"],
["結案稽核","gavel","結案審核、追溯紀錄與稽核軌跡","待審核 5 件","稽核"]
];
const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd'),vp=document.getElementById('vp');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span><span>'+m[0]+'</span><span class="st">'+m[4]+'</span>';b.onclick=()=>show(i);nav.appendChild(b);});

const CASES=[
["CAPA-2412","電鍍層剝離","客訴","高","對策擬定","t-prog","王品保","製程工程部"],
["CAPA-2411","尺寸超差 +0.08","製程稽核","中","根因分析","t-hold","陳工程","製程工程部"],
["CAPA-2409","焊點空洞率偏高","客訴","高","成效驗證","t-prog","黃品保","研發部"],
["CAPA-2408","來料鍍層厚度不足","進料檢驗","中","對策擬定","t-prog","李品保","品保部"],
["CAPA-2405","外殼色差","客訴","低","結案稽核","t-done","王品保","製程工程部"],
["CAPA-2403","漏鎖固定螺絲","出貨檢驗","中","已結案","t-mut","陳工程","製程工程部"]
];
const SRC=[["客訴",41,"#dc2626"],["製程稽核",23,"#d97706"],["進料檢驗",18,"#2563eb"],["出貨檢驗",12,"#0d9488"],["內部提報",6,"#64748b"]];
const SEV=[["S1 重大",5,"#dc2626"],["S2 主要",13,"#d97706"],["S3 次要",21,"#2563eb"],["S4 輕微",8,"#0d9488"]];
const INTAKE=[
["08:04","焊點空洞率偏高","客訴","LOT-C7781","S1","已立案"],
["08:22","電鍍層剝離","客訴","LOT-A2208","S1","已立案"],
["09:10","尺寸超差 +0.08","製程稽核","LOT-B1904","S2","待分派"],
["10:36","來料鍍層厚度不足","進料檢驗","RM-CU0821","S2","待分派"],
["11:15","外殼輕微色差","客訴","LOT-D5520","S4","已立案"],
["13:48","包裝標籤錯貼","出貨檢驗","LOT-E3310","S3","待分派"]
];
const WHY=[
["為何焊點出現空洞？","回焊爐溫曲線峰值不足，助焊劑揮發不全"],
["為何峰值不足？","第 4 溫區加熱管功率衰退未被發現"],
["為何未被發現？","溫區溫度僅每班紙本抄錄、無趨勢監控"],
["為何無趨勢監控？","爐溫資料未串接 SPC 系統"],
["為何未串接？","舊爐控制器缺乏數據輸出介面"]
];
const BOARD=[
["待執行",[["CAPA-2411 · 修訂脫脂槽 SOP","陳工程","到期 08/18","陳",0],["CAPA-2408 · 供應商鍍層稽核","李品保","到期 08/20","李",0]]],
["執行中",[["CAPA-2412 · 加裝線上濃度感測","王品保","到期 08/16","王",0],["CAPA-2409 · 爐溫串接 SPC","黃品保","到期 08/15","黃",1],["CAPA-2408 · 首件加測膜厚","李品保","到期 08/19","李",0]]],
["待驗證",[["CAPA-2409 · 回焊加熱管更換","黃品保","到期 08/14","黃",1],["CAPA-2405 · 塗裝配比標準化","王品保","到期 08/13","王",0]]],
["已完成",[["CAPA-2403 · 鎖付扭力防呆治具","陳工程","完成 08/07","陳",0],["CAPA-2405 · 色差 CIELAB 管制","王品保","完成 08/10","王",0]]]
];
const VERIFY=[
["CAPA-2409 焊點空洞","連續 5 批空洞率 0.4%→0.05%，達標","有效 · 可結案","#0d9488","check"],
["CAPA-2412 電鍍剝離","已驗證 3/5 批，剝離率 0%","驗證中 · 待補 2 批","#2563eb","sync"],
["CAPA-2405 外殼色差","ΔE 由 2.4 降至 0.9，客戶確認","有效 · 已結案","#0d9488","check"],
["CAPA-2408 鍍層厚度","首批仍有 2 件偏薄，對策待強化","無效 · 退回對策","#d97706","priority_high"]
];
const AUDIT=[
["問題登錄 · CAPA-2409","08/09 09:12 · 黃品保 · 客訴來源，判定 S1 重大",1],
["根因分析完成","08/10 14:30 · 製程工程部 · 5-Why 鎖定爐溫峰值不足",1],
["對策核准","08/11 10:05 · 品保主管 · 核准更換加熱管並串接 SPC",1],
["成效驗證通過","08/13 16:40 · 品保專員 · 連續 5 批空洞率達標",1],
["結案審核","08/14 09:00 · 品保主管 · 證據齊備，待正式結案",0]
];
const CLOSE=[
["CAPA-2409","焊點空洞率偏高","5.2 天","通過","待簽核"],
["CAPA-2405","外殼色差","8.0 天","通過","待簽核"],
["CAPA-2403","漏鎖固定螺絲","4.1 天","通過","已結案"],
["CAPA-2398","電容極性錯置","12.5 天","通過","已結案"],
["CAPA-2391","標籤錯貼","3.3 天","通過","已結案"]
];

let chA=null,chB=null;
function killCharts(){if(chA){chA.destroy();chA=null;}if(chB){chB.destroy();chB=null;}}

const SCREENS=[
/* 0 戰情室 */
()=>`<div class="kpis">
 <div class="kpi"><span class="material-symbols-outlined ic">folder_open</span><div class="l">進行中案件</div><div class="v">18</div><div class="d down">▲ 較上月 +3</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">event_available</span><div class="l">平均結案天數</div><div class="v">9.5<small> 天</small></div><div class="d up">▼ 較 21 天</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">schedule</span><div class="l">逾期率</div><div class="v">11<small>%</small></div><div class="d up">▼ 較 24%</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">replay</span><div class="l">重複不良率</div><div class="v">1.9<small>%</small></div><div class="d up">▼ 較 6.2%</div></div>
</div>
<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">monitoring</span>CAPA 案件量與結案趨勢<span class="r">近 6 週</span></h3><div class="chart"><canvas id="c0a"></canvas></div></div>
 <div class="card"><h3><span class="material-symbols-outlined">donut_small</span>異常來源分布</h3><div class="chart"><canvas id="c0b"></canvas></div></div>
</div>
<div class="card" style="margin-top:16px"><h3><span class="material-symbols-outlined">format_list_bulleted</span>近期 CAPA 案件<span class="r">共 6 件</span></h3><div class="scroll"><table class="data"><thead><tr><th>案號</th><th>問題</th><th>來源</th><th>嚴重度</th><th>階段</th><th>主責單位</th><th>負責人</th></tr></thead><tbody>${CASES.map(c=>`<tr><td><b>${c[0]}</b></td><td>${c[1]}</td><td>${c[2]}</td><td><span class="tag ${c[3]=='高'?'t-open':c[3]=='中'?'t-hold':'t-mut'}">${c[3]}</span></td><td><span class="tag ${c[5]}">${c[4]}</span></td><td>${c[7]}</td><td>${c[6]}</td></tr>`).join('')}</tbody></table></div></div>`,

/* 1 問題登錄分類 */
()=>`<div class="grid g21">
 <div class="card"><h3><span class="material-symbols-outlined">assignment_add</span>今日登錄摘要</h3>
  <div class="seg"><div class="s"><b>6</b><small>本日新登</small></div><div class="s"><b>2</b><small>S1／S2</small></div><div class="s"><b>4</b><small>待分派</small></div></div>
  <h3 style="margin-top:4px"><span class="material-symbols-outlined">bar_chart</span>嚴重度分級</h3>
  <div class="sev">${SEV.map(s=>`<div class="sv"><span style="width:58px">${s[0]}</span><div class="bar"><i style="width:${Math.round(s[1]/21*100)}%;background:${s[2]}"></i></div><span class="n">${s[1]}</span></div>`).join('')}</div>
  <p class="note">S1 重大異常自動通知品保主管，須於 4 小時內指派負責人並開立 CAPA 案件。</p>
 </div>
 <div class="card"><h3><span class="material-symbols-outlined">inbox</span>異常登錄佇列<span class="r">依 SLA 排序</span></h3>
 <div class="scroll"><table class="data"><thead><tr><th>登錄時間</th><th>問題描述</th><th>來源</th><th>影響批次</th><th>嚴重度</th><th>狀態</th></tr></thead><tbody>
 ${INTAKE.map(r=>`<tr><td>${r[0]}</td><td><b>${r[1]}</b></td><td>${r[2]}</td><td>${r[3]}</td><td><span class="tag ${r[4]=='S1'?'t-open':r[4]=='S2'?'t-hold':'t-mut'}">${r[4]}</span></td><td><span class="tag ${r[5]=='已立案'?'t-done':'t-prog'}">${r[5]}</span></td></tr>`).join('')}
 </tbody></table></div>
 <p class="note">每筆異常自動比對歷史案件，若 90 天內重複發生將標記為「重複不良」並升級處理層級。</p></div>
</div>`,

/* 2 根因分析 */
()=>`<div class="grid g11">
 <div class="card"><h3><span class="material-symbols-outlined">account_tree</span>魚骨圖 · CAPA-2409 焊點空洞</h3>${fishSVG()}<div class="legend"><span><i style="background:var(--accent)"></i>主骨</span><span><i style="background:var(--accent2)"></i>大骨（6M）</span><span><i style="background:var(--bad)"></i>疑似主因</span></div></div>
 <div class="card"><h3><span class="material-symbols-outlined">psychology_alt</span>5-Why 結構化追因</h3>
  <div class="why">${WHY.map((w,i)=>`<div class="wr"><span class="n">${i+1}</span><div><b>${w[0]}</b><small>${w[1]}</small></div></div>`).join('')}
  <div class="wr root"><span class="n" style="background:var(--ok)">根</span><div><b>根本原因</b><small>舊回焊爐控制器無數據輸出介面，爐溫未串接 SPC，溫區衰退無法即時察覺。</small></div></div></div>
 </div>
</div>`,

/* 3 對策擬定 */
()=>`<div class="card" style="margin-bottom:16px"><h3><span class="material-symbols-outlined">insights</span>對策執行進度<span class="r">矯正 vs 預防</span></h3><div class="chart" style="height:210px"><canvas id="c3a"></canvas></div></div>
<div class="scroll"><div class="board" style="min-width:640px">${BOARD.map(col=>`<div class="col"><div class="ch">${col[0]}<span class="cnt">${col[1].length}</span></div>${col[1].map(a=>`<div class="ac ${a[4]?'od':''}"><b>${a[0]}</b><small>${a[2]}${a[4]?' · 逾期風險':''}</small><div class="who"><span class="av">${a[3]}</span>${a[1]}</div></div>`).join('')}</div>`).join('')}</div></div>
<p class="note">看板依到期日排序，逾期風險對策自動紅框提醒；每項對策須註明「矯正（消除現象）」或「預防（消除根因）」分類，避免對策流於形式。</p>`,

/* 4 成效驗證 */
()=>`<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">show_chart</span>重複不良率驗證趨勢<span class="r">對策上線後</span></h3><div class="chart"><canvas id="c4a"></canvas></div><p class="note">紅色虛線為 2% 管制目標；CAPA-2409 對策上線後連續 5 批低於目標，判定有效。</p></div>
 <div class="card"><h3><span class="material-symbols-outlined">rule</span>驗證結果判定</h3><div class="vf" style="grid-template-columns:1fr">${VERIFY.map(v=>`<div class="vc"><div class="h"><span class="bx" style="background:${v[3]}"><span class="material-symbols-outlined" style="font-size:15px">${v[4]}</span></span>${v[0]}</div><small>${v[1]}</small><div class="rt" style="color:${v[3]}">${v[2]}</div></div>`).join('')}</div></div>
</div>`,

/* 5 結案稽核 */
()=>`<div class="kpis" style="grid-template-columns:repeat(3,1fr)">
 <div class="kpi"><span class="material-symbols-outlined ic">task_alt</span><div class="l">本月結案</div><div class="v">27</div><div class="d up">▲ 結案率 79%</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">pending_actions</span><div class="l">待審核</div><div class="v">5</div><div class="d">品保主管覆核中</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">history</span><div class="l">追溯完整率</div><div class="v">100<small>%</small></div><div class="d up">稽核軌跡齊備</div></div>
</div>
<div class="grid g21" style="margin-top:2px">
 <div class="card"><h3><span class="material-symbols-outlined">timeline</span>CAPA-2409 稽核軌跡</h3><div class="trace">${AUDIT.map(a=>`<div class="ti ${a[2]?'ok':''}"><div class="tt">${a[0]}</div><small>${a[1]}</small></div>`).join('')}</div></div>
 <div class="card"><h3><span class="material-symbols-outlined">fact_check</span>結案審核佇列<span class="r">待簽核 5</span></h3><div class="scroll"><table class="data"><thead><tr><th>案號</th><th>問題</th><th>結案天數</th><th>驗證</th><th>審核</th></tr></thead><tbody>
 ${CLOSE.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td><span class="tag t-done">${r[3]}</span></td><td><span class="tag ${r[4]=='待簽核'?'t-hold':'t-mut'}">${r[4]}</span></td></tr>`).join('')}
 </tbody></table></div><p class="note">結案須具備：根因確認、對策驗證證據、追溯紀錄三要件；結案後統計平均結案天數與逾期率回饋管理層。</p></div>
</div>`
];

function fishSVG(){return `<div class="scroll"><svg viewBox="0 0 470 240" class="fish" style="min-width:420px">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#334155"/></marker></defs>
<line x1="18" y1="120" x2="405" y2="120" stroke="#334155" stroke-width="3" marker-end="url(#ah)"/>
<rect x="402" y="98" width="62" height="44" rx="9" fill="#334155"/><text x="433" y="116" fill="#fff" font-size="10" text-anchor="middle">焊點</text><text x="433" y="130" fill="#fff" font-size="10" text-anchor="middle">空洞</text>
${[["人 Man",70,58,1,"抄錄疏漏"],["機 Machine",180,58,1,"加熱管衰退"],["料 Material",290,58,1,"助焊劑受潮"],["法 Method",70,182,0,"溫曲線未優化"],["環 Environment",180,182,0,"濕度偏高"],["量測 Measure",290,182,0,"無趨勢監控"]].map(b=>{const y0=b[2];const y1=b[3]?y0+10:y0-10;const bad=(b[0].indexOf('機')>-1||b[0].indexOf('量測')>-1);const col=bad?'#dc2626':'#64748b';return `<line x1="${b[1]}" y1="${y1}" x2="${b[1]+34}" y2="120" stroke="${col}" stroke-width="2"/><text x="${b[1]}" y="${y0}" fill="${bad?'#dc2626':'#334155'}" font-size="11" font-weight="700" text-anchor="middle">${b[0]}</text><text x="${b[1]}" y="${y0+16}" fill="#64748b" font-size="9" text-anchor="middle">${b[4]}</text>`;}).join('')}
</svg></div>`;}

function baseOpt(o){const opt={responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{labels:{font:{family:'Inter',size:11},boxWidth:12,padding:10}}},scales:{x:{grid:{display:false},ticks:{font:{family:'Inter',size:11}},stacked:!!o.stacked},y:{beginAtZero:true,grid:{color:'#eef2f7'},ticks:{font:{family:'Inter',size:11}},stacked:!!o.stacked}}};if(o.y1){opt.scales.y1={position:'right',beginAtZero:true,grid:{display:false},ticks:{font:{family:'Inter',size:11},callback:function(v){return v+'%';}}};}return opt;}

function draw(i){
 if(i==0){
  const e1=document.getElementById('c0a');if(e1){chA=new Chart(e1,{data:{labels:['第1週','第2週','第3週','第4週','第5週','第6週'],datasets:[{type:'bar',label:'新開案',data:[9,11,8,12,7,10],backgroundColor:'#94a3b8',borderRadius:5,order:2},{type:'bar',label:'結案',data:[6,8,9,10,9,11],backgroundColor:'#334155',borderRadius:5,order:2},{type:'line',label:'逾期率 %',data:[24,20,17,15,13,11],borderColor:'#dc2626',backgroundColor:'#dc2626',yAxisID:'y1',tension:.35,order:1,pointRadius:3}]},options:baseOpt({y1:true})});}
  const e2=document.getElementById('c0b');if(e2){chB=new Chart(e2,{type:'doughnut',data:{labels:SRC.map(s=>s[0]),datasets:[{data:SRC.map(s=>s[1]),backgroundColor:SRC.map(s=>s[2]),borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,cutout:'58%',plugins:{legend:{position:'right',labels:{font:{family:'Inter',size:11},boxWidth:12,padding:8}}}}});}
 }
 if(i==3){const e=document.getElementById('c3a');if(e){chA=new Chart(e,{type:'bar',data:{labels:['問題登錄','根因分析','對策擬定','執行中','待驗證','已完成'],datasets:[{label:'矯正對策',data:[0,0,4,6,3,5],backgroundColor:'#334155',borderRadius:4,stack:'s'},{label:'預防對策',data:[0,0,2,4,2,4],backgroundColor:'#94a3b8',borderRadius:4,stack:'s'}]},options:baseOpt({stacked:true})});}}
 if(i==4){const e=document.getElementById('c4a');if(e){chA=new Chart(e,{type:'line',data:{labels:['第1批','第2批','第3批','第4批','第5批','第6批','第7批','第8批'],datasets:[{label:'重複不良率 %',data:[6.2,5.4,4.1,3.0,1.8,0.9,0.5,0.4],borderColor:'#334155',backgroundColor:'rgba(51,65,85,.10)',fill:true,tension:.35,pointRadius:3,pointBackgroundColor:'#334155'},{label:'管制目標 2%',data:[2,2,2,2,2,2,2,2],borderColor:'#dc2626',borderDash:[6,5],pointRadius:0,fill:false}]},options:baseOpt({})});}}
}

function show(i){
 nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));
 vt.textContent=MOD[i][0];vd.textContent=MOD[i][2];vp.textContent=MOD[i][3];
 killCharts();
 view.innerHTML=SCREENS[i]();
 void view.offsetHeight;
 draw(i);
}
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
