<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VMI 供應商管理庫存系統</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#9333ea;--accent2:#c084fc;--accent-soft:#f5edff;
  --bg:#f6f4fb;--panel:#ffffff;--ink:#1e1633;--muted:#6b6480;--line:#ece7f5;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#2563eb;
  --radius:14px;--shadow:0 6px 24px rgba(70,30,120,.08);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{max-width:100%;overflow-x:hidden;}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.app{display:flex;min-height:100vh;min-width:0;}
.side{width:238px;flex-shrink:0;background:linear-gradient(180deg,#2b1150,#1c0b39);color:#fff;display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh;}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;}
.brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand .logo .material-symbols-outlined{font-size:22px;color:#fff;}
.brand b{font-size:15px;font-weight:800;display:block;letter-spacing:.3px;}
.brand span{font-size:11px;color:#c9b8e6;}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:6px;}
.nav button{display:flex;align-items:center;gap:11px;background:transparent;border:none;color:#d7cbee;padding:11px 12px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13.5px;text-align:left;width:100%;transition:.15s;min-width:0;}
.nav button .material-symbols-outlined{font-size:20px;flex-shrink:0;}
.nav button .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff;}
.nav button.active{background:linear-gradient(135deg,var(--accent),#7c22ce);color:#fff;box-shadow:0 6px 16px rgba(147,51,234,.4);}
.nav .idx{margin-left:auto;font-size:10px;opacity:.6;}
.side-foot{margin-top:auto;padding:12px 10px;font-size:11px;color:#a998cc;border-top:1px solid rgba(255,255,255,.09);}
.side-foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4ade80;margin-right:6px;}
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20;}
.topbar h1{font-size:16px;font-weight:800;min-width:0;}
.topbar .sub{font-size:12px;color:var(--muted);}
.topbar .spacer{flex:1;}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;}
.pill .material-symbols-outlined{font-size:15px;}
.chip-user{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);}
.chip-user .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}
.wrap{padding:20px 22px 40px;min-width:0;}
.grid{display:grid;gap:14px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.split{grid-template-columns:340px 1fr;}
.split2{grid-template-columns:1fr 360px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0;box-shadow:var(--shadow);}
.card h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.card h3 .material-symbols-outlined{font-size:18px;color:var(--accent);}
.card h3 .tag{margin-left:auto;font-size:11px;font-weight:600;color:var(--muted);}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow);min-width:0;position:relative;overflow:hidden;}
.kpi::after{content:"";position:absolute;right:-16px;top:-16px;width:64px;height:64px;border-radius:50%;background:var(--accent-soft);}
.kpi .ic{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;position:relative;z-index:1;}
.kpi .ic .material-symbols-outlined{font-size:20px;}
.kpi .lb{font-size:12px;color:var(--muted);margin-top:10px;}
.kpi .vl{font-size:23px;font-weight:800;letter-spacing:-.5px;position:relative;z-index:1;}
.kpi .dt{font-size:11px;margin-top:3px;font-weight:600;}
.up{color:var(--ok);}.down{color:var(--bad);}.flat{color:var(--muted);}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap;}
td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--accent-soft);}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;}
.b-ok{background:#dcfce7;color:#15803d;}
.b-warn{background:#fef3c7;color:#b45309;}
.b-bad{background:#fee2e2;color:#b91c1c;}
.b-info{background:#dbeafe;color:#1d4ed8;}
.b-mut{background:#f1eef7;color:#6b6480;}
.bar{height:7px;border-radius:6px;background:#eee6f7;overflow:hidden;min-width:60px;}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.chartbox{width:100%;overflow:hidden;min-width:0;}
.muted{color:var(--muted);}
.mini{font-size:11px;color:var(--muted);}
.hd{display:flex;align-items:center;gap:8px;margin:2px 0 14px;flex-wrap:wrap;}
.hd .material-symbols-outlined{color:var(--accent);}
.hd h2{font-size:18px;font-weight:800;min-width:0;}
.hd .desc{font-size:12.5px;color:var(--muted);flex-basis:100%;}
.listpane{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;min-width:0;}
.listpane .lp-h{padding:13px 15px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;}
.lp-item{padding:12px 15px;border-bottom:1px solid var(--line);cursor:pointer;transition:.12s;min-width:0;}
.lp-item:hover{background:var(--accent-soft);}
.lp-item.sel{background:var(--accent-soft);border-left:3px solid var(--accent);}
.lp-item .r1{display:flex;align-items:center;gap:8px;justify-content:space-between;}
.lp-item .nm{font-size:13px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lp-item .r2{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:8px;}
.drow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px;}
.drow:last-child{border-bottom:none;}
.drow .k{color:var(--muted);}
.drow .v{font-weight:600;text-align:right;}
.tl{position:relative;padding-left:22px;}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl .ev{position:relative;padding:0 0 16px 6px;}
.tl .ev::before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent-soft);}
.tl .ev .t{font-size:13px;font-weight:700;}
.tl .ev .m{font-size:11.5px;color:var(--muted);}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0;}
.col{background:#faf8fe;border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0;}
.col .ch{font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;padding:2px 4px;}
.col .cnt{background:#fff;border-radius:8px;padding:2px 8px;font-size:11px;color:var(--muted);}
.ticket{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.03);}
.ticket .tt{font-size:12.5px;font-weight:600;}
.ticket .tm{font-size:11px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:6px;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px;}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle;}
.stat-line{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:12.5px;}
.stat-line .nm{width:90px;flex-shrink:0;color:var(--muted);}
.note{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px;font-size:12px;color:#5b3a86;}
.hamb{display:none;background:none;border:1px solid var(--line);border-radius:9px;width:38px;height:38px;align-items:center;justify-content:center;cursor:pointer;}
@media(max-width:1180px){.split{grid-template-columns:290px 1fr;}.split2{grid-template-columns:1fr 300px;}}
@media(max-width:1024px){.g4{grid-template-columns:repeat(2,1fr);}.board{grid-template-columns:repeat(2,1fr);}}
@media(max-width:860px){
  .side{position:fixed;left:-260px;z-index:60;transition:.25s;height:100vh;box-shadow:0 0 40px rgba(0,0,0,.4);}
  .side.open{left:0;}
  .hamb{display:flex;}
}
@media(max-width:820px){
  .g4,.g3,.g2,.split,.split2{grid-template-columns:1fr;}
  .board{grid-template-columns:1fr;}
}
@media(max-width:560px){
  .wrap{padding:14px;}
  .topbar{padding:12px 14px;}
  .topbar .sub{display:none;}
  .chip-user .nm{display:none;}
}
.scrim{display:none;position:fixed;inset:0;background:rgba(20,8,40,.4);z-index:55;}
.scrim.on{display:block;}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">inventory_2</span></div>
      <div><b>VMI Hub</b><span>供應商管理庫存系統</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><span class="dot"></span>系統連線正常 · ERP／WMS 同步中</div>
  </aside>
  <div class="scrim" id="scrim" onclick="closeSide()"></div>
  <div class="main">
    <div class="topbar">
      <button class="hamb" onclick="openSide()"><span class="material-symbols-outlined">menu</span></button>
      <div>
        <h1 id="scrTitle">庫存用量同步</h1>
        <div class="sub" id="scrSub">即時共享料號庫存與消耗</div>
      </div>
      <div class="spacer"></div>
      <span class="pill"><span class="material-symbols-outlined">sync</span>ERP · WMS · SRM</span>
      <div class="chip-user"><span class="nm">採購部 · 林采潔</span><span class="av">林</span></div>
    </div>
    <div class="wrap"><div id="screen"></div></div>
  </div>
</div>
<script>
(function(){
"use strict";
var C=document.getElementById("screen");
var charts=[];
function destroyCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var base={redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:'Inter, "Noto Sans TC", sans-serif'};
  if(opt.chart){for(var k in opt.chart){base[k]=opt.chart[k];}}
  opt.chart=base;
  try{var ch=new ApexCharts(el,opt);ch.render();charts.push(ch);}catch(e){}}
var PURP="#9333ea",PURP2="#c084fc",OKC="#16a34a",WARNC="#d97706",BADC="#dc2626",INFOC="#2563eb";

var NAV=[
  {ic:"inventory_2",t:"庫存用量同步"},
  {ic:"monitoring",t:"供應商庫存監控"},
  {ic:"insights",t:"補貨建議產生"},
  {ic:"fact_check",t:"補貨確認排程"},
  {ic:"receipt_long",t:"寄售到貨入庫"},
  {ic:"request_quote",t:"用量結算對帳"}
];
var SUB=["即時共享料號庫存與消耗","安全水位與再訂購點看板","用量預測與建議補貨量","供應商確認與交期排定","Consignment 收貨與入帳","領用轉銷與月結對帳"];

(function(){var n=document.getElementById("nav"),h="";
for(var i=0;i<NAV.length;i++){h+='<button data-i="'+i+'" onclick="__go('+i+')"><span class="material-symbols-outlined">'+NAV[i].ic+'</span><span class="txt">'+NAV[i].t+'</span><span class="idx">v'+i+'</span></button>';}
n.innerHTML=h;})();

var ITEMS=[
 {sku:"RM-A101",nm:"鋁擠型 6063-T5",sup:"永O金屬",loc:"A-03",on:820,rop:600,max:2000,dz:5.2,use:158,unit:"kg",st:"low"},
 {sku:"RM-B204",nm:"不鏽鋼螺絲 M6×20",sup:"O鎖精密",loc:"B-11",on:14200,rop:8000,max:30000,dz:12.8,use:1120,unit:"pcs",st:"ok"},
 {sku:"RM-C330",nm:"矽膠密封墊 Φ40",sup:"O橡工業",loc:"C-07",on:2600,rop:3000,max:9000,dz:6.1,use:430,unit:"pcs",st:"crit"},
 {sku:"RM-D045",nm:"PCB 基板 FR4",sup:"O板電子",loc:"D-02",on:5400,rop:4000,max:12000,dz:8.9,use:610,unit:"pcs",st:"ok"},
 {sku:"RM-E512",nm:"環氧樹脂膠 AB",sup:"O盟材料",loc:"E-09",on:340,rop:500,max:1500,dz:4.5,use:76,unit:"L",st:"crit"},
 {sku:"RM-F118",nm:"銅箔膠帶 25mm",sup:"O橡工業",loc:"F-04",on:1880,rop:1500,max:5000,dz:7.4,use:255,unit:"卷",st:"ok"},
 {sku:"RM-G077",nm:"軸承 6202-2RS",sup:"永O金屬",loc:"G-06",on:940,rop:1200,max:4000,dz:3.8,use:248,unit:"pcs",st:"low"},
 {sku:"RM-H260",nm:"線束連接器 6P",sup:"O板電子",loc:"H-01",on:7300,rop:5000,max:16000,dz:9.6,use:760,unit:"pcs",st:"ok"}
];
function stBadge(s){if(s==="crit")return '<span class="badge b-bad">缺料風險</span>';if(s==="low")return '<span class="badge b-warn">接近水位</span>';return '<span class="badge b-ok">充足</span>';}
function stText(s){return s==="crit"?"缺料風險":s==="low"?"接近水位":"充足";}

function s0(){
  var sel=(typeof s0.sel==="number")?s0.sel:0;
  var list="";
  for(var i=0;i<ITEMS.length;i++){var itm=ITEMS[i];
    list+='<div class="lp-item'+(i===sel?' sel':'')+'" onclick="__s0sel('+i+')"><div class="r1"><span class="nm">'+itm.sku+'</span>'+stBadge(itm.st)+'</div><div class="r2"><span>'+itm.nm+'</span><span>'+itm.on+' '+itm.unit+'</span></div></div>';
  }
  var it=ITEMS[sel];
  var pct=Math.min(100,Math.round(it.on/it.max*100));
  var ropPct=Math.round(it.rop/it.max*100);
  var html=''+
  '<div class="hd"><span class="material-symbols-outlined">inventory_2</span><h2>庫存用量同步</h2><span class="pill" style="margin-left:auto"><span class="material-symbols-outlined">schedule</span>最後同步 3 分鐘前</span><div class="desc">WMS 即時回拋各料號現有量與領用消耗，供應商與採購共享同一庫存視圖。</div></div>'+
  '<div class="grid g4" style="margin-bottom:14px">'+
    kpi("database","同步料號","8","項","up","全數即時")+
    kpi("trending_down","缺料風險","2","項","down","需優先補貨")+
    kpi("autorenew","平均周轉","6.4","次/月","up","+0.8")+
    kpi("bolt","同步延遲","3","分鐘","flat","WMS 連線")+
  '</div>'+
  '<div class="grid split">'+
    '<div class="listpane"><div class="lp-h"><span class="material-symbols-outlined" style="color:var(--accent);font-size:18px">list</span>料號清單（8）</div>'+list+'</div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">description</span>'+it.sku+' · '+it.nm+'<span class="tag">'+stText(it.st)+'</span></h3>'+
      '<div class="grid g2" style="gap:12px">'+
        '<div>'+
          '<div class="drow"><span class="k">供應商</span><span class="v">'+it.sup+'</span></div>'+
          '<div class="drow"><span class="k">儲位</span><span class="v">'+it.loc+'</span></div>'+
          '<div class="drow"><span class="k">現有量</span><span class="v">'+it.on+' '+it.unit+'</span></div>'+
          '<div class="drow"><span class="k">再訂購點 (ROP)</span><span class="v">'+it.rop+' '+it.unit+'</span></div>'+
          '<div class="drow"><span class="k">最高水位</span><span class="v">'+it.max+' '+it.unit+'</span></div>'+
          '<div class="drow"><span class="k">日均用量</span><span class="v">'+it.use+' '+it.unit+'/日</span></div>'+
          '<div class="drow"><span class="k">可用天數</span><span class="v" style="color:'+(it.dz<5?"var(--bad)":"var(--ink)")+'">'+it.dz+' 天</span></div>'+
        '</div>'+
        '<div>'+
          '<div class="mini" style="margin-bottom:6px">水位狀態（現有量 '+pct+'%）</div>'+
          '<div style="position:relative;margin-bottom:14px"><div class="bar" style="height:12px"><i style="width:'+pct+'%"></i></div><div style="position:absolute;top:-3px;left:'+ropPct+'%;width:2px;height:18px;background:var(--bad)"></div><div class="mini" style="margin-top:5px">紅線 = 再訂購點</div></div>'+
          '<div class="chartbox"><div id="c0"></div></div>'+
        '</div>'+
      '</div>'+
      '<div class="note" style="margin-top:6px"><b>RULE-01</b>：現有量低於再訂購點且可用天數少於前置期者列為缺料風險，優先補貨。</div>'+
    '</div>'+
  '</div>';
  C.innerHTML=html;
  void C.offsetHeight;
  var days=["週一","週二","週三","週四","週五","週六","週日"];
  var d=[];for(var j=0;j<7;j++){d.push(Math.round(it.use*(0.7+((j*37)%40)/100)));}
  mk("c0",{series:[{name:"領用量",data:d}],chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"area",height:180},colors:[PURP],dataLabels:{enabled:false},stroke:{curve:"smooth",width:2},fill:{type:"gradient",gradient:{shadeIntensity:.4,opacityFrom:.35,opacityTo:.05}},xaxis:{categories:days,labels:{style:{fontSize:"10px"}}},yaxis:{labels:{style:{fontSize:"10px"}}},grid:{borderColor:"#eee6f7"}});
}

function s1(){
  var html=''+
  '<div class="hd"><span class="material-symbols-outlined">monitoring</span><h2>供應商庫存監控</h2><div class="desc">供應商窗口監看低於再訂購點與安全水位的料號，鎖定需補貨對象。</div></div>'+
  '<div class="grid g4" style="margin-bottom:14px">'+
    kpi("warning","低於 ROP","3","項","down","即時警示")+
    kpi("shield","安全水位達標","62","%","up","+9%")+
    kpi("groups","監控供應商","4","家","flat","寄售協議")+
    kpi("event_available","本週補貨窗","2","次","up","已排定")+
  '</div>'+

function board(){
