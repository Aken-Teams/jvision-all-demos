<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VMI 供應商管理庫存系統</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#ffffff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000000;
  --color-accent:#ea580c;
  --color-on-accent:#000000;
  --color-background:#f8fafc;
  --color-foreground:#1e293b;
  --color-card:#ffffff;
  --color-card-foreground:#1e293b;
  --color-muted:#e9eff8;
  --color-muted-foreground:#475569;
  --color-border:#e2e8f0;
  --color-destructive:#dc2626;
  --color-on-destructive:#ffffff;
  --color-ring:#2563eb;
  --blue:#2563eb;
  --ink:#1e293b;
  --muted:#475569;
  --line:#e2e8f0;
  --accent:#2563eb;
  --accent2:#3b82f6;
  --accent-soft:#eff6ff;
  --bg:#f8fafc;
  --panel:#ffffff;
  --ok:#15803d;
  --warn:#b45309;
  --bad:#dc2626;
  --info:#2563eb;
  --radius:6px;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 4px 12px rgba(15,23,42,.04);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{max-width:100%;overflow-x:hidden;background:var(--bg);scroll-behavior:smooth;}
body{max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:"Fira Sans","Noto Sans TC",system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
button,input,select,textarea{font:inherit;}
button,[onclick]{cursor:pointer;}
button:focus-visible,[onclick]:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px;}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.app{display:flex;min-width:0;min-height:100vh;}
.side{position:sticky;top:0;display:flex;flex:0 0 248px;flex-direction:column;width:248px;height:100vh;padding:18px 14px;background:#0f172a;color:#fff;border-right:1px solid #1e293b;}
.brand{display:flex;align-items:center;gap:11px;padding:3px 5px 19px;border-bottom:1px solid rgba(255,255,255,.12);}
.brand .logo{display:flex;flex:0 0 auto;align-items:center;justify-content:center;width:38px;height:38px;border:1px solid rgba(255,255,255,.18);border-radius:4px;background:var(--color-primary);box-shadow:0 5px 14px rgba(37,99,235,.25);}
.brand .logo .material-symbols-outlined{font-size:21px;color:#fff;}
.brand b{display:block;font-size:15px;font-weight:700;letter-spacing:.02em;}
.brand span{font-size:11px;color:#cbd5e1;}
.brand .logo span{color:#fff;}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:16px;}
.nav button{position:relative;display:flex;align-items:center;gap:11px;width:100%;min-width:0;min-height:44px;padding:10px 11px;border:1px solid transparent;border-radius:4px;background:transparent;color:#cbd5e1;text-align:left;font-size:13px;font-weight:500;transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s ease;}
.nav button:hover{background:#1e293b;border-color:#334155;color:#fff;transform:translateX(2px);}
.nav button.active{background:var(--color-primary);border-color:#60a5fa;color:#fff;box-shadow:inset 3px 0 0 #fff,0 5px 14px rgba(37,99,235,.2);}
.nav button .material-symbols-outlined{flex-shrink:0;font-size:19px;}
.nav button .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nav .idx{margin-left:auto;color:inherit;font-family:"Fira Code",monospace;font-size:9px;opacity:.72;}
.side-foot{margin-top:auto;padding:14px 7px 3px;border-top:1px solid rgba(255,255,255,.12);color:#cbd5e1;font-size:11px;line-height:1.55;}
.side-foot .dot{display:inline-block;width:8px;height:8px;margin-right:7px;border:2px solid #bbf7d0;border-radius:50%;background:#16a34a;vertical-align:-1px;box-shadow:0 0 0 2px rgba(22,163,74,.2);}
.main{display:flex;flex:1;flex-direction:column;min-width:0;}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;min-height:68px;padding:11px 24px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.96);box-shadow:0 1px 0 rgba(15,23,42,.03);backdrop-filter:blur(12px);}
.topbar h1{min-width:0;color:#0f172a;font-size:16px;font-weight:700;letter-spacing:-.01em;}
.topbar .sub{margin-top:1px;color:var(--muted);font-size:11.5px;}
.topbar .spacer{flex:1;}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:5px 10px;border:1px solid #bfdbfe;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-size:11px;font-weight:600;white-space:nowrap;}
.pill .material-symbols-outlined{font-size:15px;}
.chip-user{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:11.5px;}
.chip-user .av{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border:1px solid #bfdbfe;border-radius:4px;background:#dbeafe;color:#1e40af;font-weight:700;}
.wrap{min-width:0;padding:22px 24px 42px;}
.grid{display:grid;gap:12px;min-width:0;}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.split{grid-template-columns:326px minmax(0,1fr);}
.split2{grid-template-columns:minmax(0,1fr) 350px;}
.card,.kpi,.listpane{min-width:0;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow);}
.card{padding:16px;transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;}
.card:hover{border-color:#cbd5e1;box-shadow:0 2px 4px rgba(15,23,42,.06),0 8px 22px rgba(15,23,42,.05);}
.card h3{display:flex;align-items:center;gap:8px;margin-bottom:13px;padding-bottom:10px;border-bottom:1px solid var(--line);color:#0f172a;font-size:13px;font-weight:700;letter-spacing:.01em;}
.card h3 .material-symbols-outlined{font-size:18px;color:var(--blue);}
.card h3 .tag{margin-left:auto;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;font-weight:500;}
.kpi{position:relative;overflow:hidden;padding:14px 15px 13px;border-top:3px solid var(--color-primary);transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;}
.kpi:hover{border-color:#93c5fd;transform:translateY(-2px);box-shadow:0 7px 18px rgba(15,23,42,.08);}
.kpi::after{content:"";position:absolute;right:-23px;top:-30px;width:74px;height:74px;border:1px solid #dbeafe;border-radius:50%;background:#eff6ff;}
.kpi .ic{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;width:32px;height:32px;border:1px solid #bfdbfe;border-radius:4px;background:#eff6ff;color:#1d4ed8;}
.kpi .ic .material-symbols-outlined{font-size:18px;}
.kpi .lb{margin-top:9px;color:var(--muted);font-size:11px;font-weight:500;}
.kpi .vl{position:relative;z-index:1;margin-top:1px;color:#0f172a;font-family:"Fira Code",monospace;font-size:22px;font-weight:700;line-height:1.3;letter-spacing:-.04em;font-variant-numeric:tabular-nums;}
.kpi .dt{margin-top:4px;font-size:10.5px;font-weight:600;}
.up{color:#15803d;}.down{color:#b91c1c;}.flat{color:var(--muted);}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;font-variant-numeric:tabular-nums;}
th{padding:9px 10px;border-top:1px solid var(--line);border-bottom:1px solid #cbd5e1;background:#f1f5f9;color:#334155;text-align:left;font-size:10px;font-weight:700;letter-spacing:.055em;text-transform:uppercase;white-space:nowrap;}
th:first-child{border-left:1px solid var(--line);border-radius:4px 0 0 0;}
th:last-child{border-right:1px solid var(--line);border-radius:0 4px 0 0;}
td{height:42px;padding:8px 10px;border-bottom:1px solid var(--line);color:#334155;white-space:nowrap;}
td:not(:first-child){font-family:"Fira Code","Noto Sans TC",monospace;font-size:11px;}
td:nth-child(n+3){text-align:right;}
th:nth-child(n+3){text-align:right;}
td:last-child,th:last-child{text-align:left;}
tbody tr{transition:background-color .18s ease,box-shadow .18s ease;}
tbody tr:hover{background:#eff6ff;box-shadow:inset 3px 0 0 var(--blue);}
td b{color:#0f172a;font-family:"Fira Code",monospace;font-weight:600;}
.badge{display:inline-flex;align-items:center;gap:5px;min-height:23px;padding:3px 8px;border:1px solid currentColor;border-radius:999px;font-size:10px;font-weight:600;line-height:1;white-space:nowrap;}
.badge::before{content:"";width:5px;height:5px;border:1px solid currentColor;border-radius:50%;background:currentColor;}
.b-ok{background:#f0fdf4;color:#166534;}
.b-warn{background:#fffbeb;color:#92400e;}
.b-bad{background:#fef2f2;color:#b91c1c;}
.b-info{background:#eff6ff;color:#1d4ed8;}
.b-mut{background:#f1f5f9;color:#475569;}
.bar{height:7px;min-width:60px;overflow:hidden;border:1px solid #dbe3ee;border-radius:999px;background:#edf2f7;}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--color-primary),var(--color-secondary));}
.chartbox{width:100%;min-width:0;overflow:hidden;}
.muted{color:var(--muted);}
.mini{color:var(--muted);font-size:10.5px;line-height:1.45;}
.hd{display:grid;grid-template-columns:auto auto 1fr;align-items:center;gap:8px;margin:0 0 15px;padding:0 0 13px;border-bottom:1px solid var(--line);}
.hd>.material-symbols-outlined{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid #bfdbfe;border-radius:4px;background:#eff6ff;color:var(--blue);font-size:19px;}
.hd h2{min-width:0;color:#0f172a;font-size:18px;font-weight:700;letter-spacing:-.025em;}
.hd>.pill{justify-self:end;}
.hd .desc{grid-column:2/-1;color:var(--muted);font-size:12px;}
.listpane{overflow:hidden;}
.listpane .lp-h{display:flex;align-items:center;gap:8px;min-height:45px;padding:11px 14px;border-bottom:1px solid var(--line);background:#f8fafc;color:#0f172a;font-size:12px;font-weight:700;}
.lp-item{min-width:0;min-height:62px;padding:10px 13px;border-bottom:1px solid var(--line);cursor:pointer;transition:background-color .18s ease,border-color .18s ease,box-shadow .18s ease;}
.lp-item:last-child{border-bottom:0;}
.lp-item:hover{background:#f8fafc;box-shadow:inset 3px 0 0 #93c5fd;}
.lp-item.sel{border-left:3px solid var(--blue);background:#eff6ff;box-shadow:inset 0 0 0 1px #dbeafe;}
.lp-item .r1{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.lp-item .nm{min-width:0;overflow:hidden;color:#0f172a;font-family:"Fira Code",monospace;font-size:11.5px;font-weight:600;text-overflow:ellipsis;white-space:nowrap;}
.lp-item .r2{display:flex;justify-content:space-between;gap:8px;margin-top:4px;color:var(--muted);font-size:10.5px;}
.lp-item .r2 span:last-child{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums;}
.drow{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px dashed #cbd5e1;font-size:12px;}
.drow:last-child{border-bottom:0;}
.drow .k{color:var(--muted);}
.drow .v{color:#0f172a;font-family:"Fira Code","Noto Sans TC",monospace;font-weight:500;text-align:right;font-variant-numeric:tabular-nums;}
.tl{position:relative;padding-left:23px;}
.tl::before{content:"";position:absolute;top:4px;bottom:5px;left:6px;width:2px;background:#cbd5e1;}
.tl .ev{position:relative;padding:0 0 15px 7px;}
.tl .ev::before{content:"";position:absolute;top:3px;left:-20px;width:10px;height:10px;border:2px solid #fff;border-radius:50%;background:var(--blue);box-shadow:0 0 0 2px #93c5fd;}
.tl .ev .t{color:#0f172a;font-size:12px;font-weight:600;}
.tl .ev .m{margin-top:2px;color:var(--muted);font-family:"Fira Code","Noto Sans TC",monospace;font-size:10px;}
.board{display:grid;grid-template-columns:repeat(4,minmax(178px,1fr));gap:9px;min-width:760px;}
.col{min-width:0;padding:9px;border:1px solid var(--line);border-radius:4px;background:#f8fafc;}
.col .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:2px 2px 7px;border-bottom:1px solid var(--line);color:#334155;font-size:11px;font-weight:700;}
.col .cnt{min-width:23px;padding:2px 6px;border:1px solid #cbd5e1;border-radius:999px;background:#fff;color:var(--muted);font-family:"Fira Code",monospace;font-size:9px;text-align:center;}
.ticket{margin-bottom:7px;padding:9px;border:1px solid var(--line);border-radius:3px;background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.04);transition:transform .18s ease,box-shadow .18s ease;}
.ticket:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(15,23,42,.08);}
.ticket .tt{color:#0f172a;font-family:"Fira Code",monospace;font-size:10.5px;font-weight:600;}
.ticket .tm{display:flex;justify-content:space-between;gap:6px;margin-top:4px;color:var(--muted);font-size:9.5px;}
.legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:9px;color:var(--muted);font-size:10.5px;}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;border:1px solid currentColor;border-radius:2px;vertical-align:-1px;}
.stat-line{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:11.5px;font-variant-numeric:tabular-nums;}
.stat-line .nm{flex-shrink:0;width:88px;color:var(--muted);}
.stat-line b{font-family:"Fira Code",monospace;}
.note{padding:10px 12px;border:1px solid #bfdbfe;border-left:4px solid var(--blue);border-radius:4px;background:#eff6ff;color:#1e3a5f;font-size:11.5px;line-height:1.55;}
.note b{font-family:"Fira Code",monospace;}
.hamb{display:none;align-items:center;justify-content:center;width:40px;height:40px;border:1px solid var(--line);border-radius:4px;background:#fff;color:#0f172a;cursor:pointer;transition:background-color .18s ease,border-color .18s ease;}
.hamb:hover{border-color:#93c5fd;background:#eff6ff;}
.scrim{display:none;position:fixed;inset:0;z-index:55;background:rgba(15,23,42,.55);backdrop-filter:blur(2px);}
.scrim.on{display:block;}
#screen>.hd,#screen>.grid>.kpi,#screen>.grid>.card,#screen>.grid>.listpane{animation:enter .4s both cubic-bezier(.2,.8,.2,1);}
#screen>.grid>:nth-child(2){animation-delay:.05s;}
#screen>.grid>:nth-child(3){animation-delay:.1s;}
#screen>.grid>:nth-child(4){animation-delay:.15s;}
@keyframes enter{from{opacity:0;transform:translateY(12px) scale(.985);}to{opacity:1;transform:none;}}
@media(max-width:1180px){.split{grid-template-columns:286px minmax(0,1fr);}.split2{grid-template-columns:minmax(0,1fr) 304px;}.wrap{padding-inline:18px;}}
@media(max-width:1024px){.g4{grid-template-columns:repeat(2,minmax(0,1fr));}.split2{grid-template-columns:1fr;}.board{grid-template-columns:repeat(4,minmax(170px,1fr));}.topbar{padding-inline:18px;}}
@media(max-width:860px){.side{position:fixed;left:-270px;z-index:60;width:252px;box-shadow:16px 0 36px rgba(15,23,42,.25);transition:left .24s ease;}.side.open{left:0;}.hamb{display:flex;}.split{grid-template-columns:1fr;}.listpane{max-height:370px;overflow:auto;}}
@media(max-width:768px){.g3,.g2{grid-template-columns:1fr;}.hd{grid-template-columns:auto 1fr;}.hd>.pill{grid-column:1/-1;grid-row:3;justify-self:start;}.hd .desc{grid-column:1/-1;}.card{padding:14px;}.wrap{padding:17px 14px 34px;}}
@media(max-width:560px){.topbar{min-height:62px;padding:10px 12px;gap:10px;}.topbar .sub,.chip-user .nm,.topbar>.pill{display:none;}.g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;}.kpi{padding:12px;}.kpi .vl{font-size:19px;}.hd h2{font-size:16px;}.card h3{align-items:flex-start;flex-wrap:wrap;}.card h3 .tag{width:100%;margin-left:26px;}.drow{gap:8px;}.drow .k{max-width:48%;}.drow .v{max-width:52%;overflow-wrap:anywhere;}.chip-user .av{width:30px;height:30px;}}
@media(max-width:390px){.g4{grid-template-columns:1fr 1fr;}.kpi .ic{width:29px;height:29px;}.kpi .lb{font-size:10px;}.kpi .vl{font-size:17px;}.wrap{padding-inline:11px;}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto;}*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important;}#screen>.hd,#screen>.grid>*{opacity:1!important;transform:none!important;}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">inventory_2</span></div>
      <div><b>VMI Hub</b><span>供應商管理庫存系統</span></div>

</div>
<script>
(function(){
"use strict";
var C=document.getElementById("screen");
var charts=[];

function mk(id,opt){var el=document.getElementById(id);if(!el)return;var base={redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:'"Fira Sans", "Noto Sans TC", sans-serif'};

var PURP="#2563eb",PURP2="#ea580c",OKC="#15803d",WARNC="#b45309",BADC="#dc2626",INFOC="#2563eb";

];
var SUB=["即時共享料號庫存與消耗","安全水位與再訂購點看板","用量預測與建議補貨量","供應商確認與交期排定","Consignment 收貨與入帳","領用轉銷與月結對帳"];

for(var i=0;i<NAV.length;i++){h+='<button data-i="'+i+'" onclick="__go('+i+')"><span class="material-symbols-outlined">'+NAV[i].ic+'</span><span class="txt">'+NAV[i].t+'</span><span class="idx">v'+i+'</span></button>';}
n.innerHTML=h;})();

var ITEMS=[
 {sku:"RM-A101",nm:"鋁擠型 6063-T5",sup:"永O金屬",loc:"A-03",on:820,rop:600,max:2000,dz:5.2,use:158,unit:"kg",st:"low"},
 {sku:"RM-B204",nm:"不鏽鋼螺絲 M6×20",sup:"O鎖精密",loc:"B-11",on:14200,rop:8000,max:30000,dz:12.8,use:1120,unit:"pcs",st:"ok"},
 {sku:"RM-C330",nm:"矽膠密封墊 Φ40",sup:"O橡工業",loc:"C-07",on:2600,rop:3000,max:9000,dz:6.1,use:430,unit:"pcs",st:"crit"},

    rows+='<tr><td><b>'+l.sku+'</b></td><td>'+l.sup+'</td><td>'+l.open+'</td><td>'+l.inb+'</td><td>'+l.used+'</td><td>'+l.close+'</td><td>NT$ '+l.amt+'</td><td>'+db+'</td></tr>';
  }
  var html=''+
  '<div class="hd"><span class="material-symbols-outlined">request_quote</span><h2>用量結算對帳</h2><div class="desc">寄售品領用轉銷後，與供應商進行月結對帳並產出結算紀錄。</div></div>'+
  '<div class="grid g4" style="margin-bottom:14px">'+
    kpi("payments","本月結算額","1.11","M","up","NT$ +8.2%")+
    kpi("difference","對帳差異","1","項","down","待釐清")+
    kpi("autorenew","庫存周轉率","6.4","次/月","up","+0.8")+
    kpi("warning_amber","缺料次數","2","次","down","-5")+
  '</div>'+
  '<div class="grid split2">'+
    '<div class="card"><h3><span class="material-symbols-outlined">fact_check</span>用量結算明細<span class="tag">2026-07 月結</span></h3><div style="overflow-x:auto"><table><thead><tr><th>料號</th><th>供應商</th><th>期初</th><th>入庫</th><th>領用轉銷</th><th>期末</th><th>結算金額</th><th>對帳</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
      '<div class="note" style="margin-top:8px">RM-B204 因退料未沖轉產生 20 單位差異，已通知供應商窗口釐清。</div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>結算金額占比</h3><div class="chartbox"><div id="c5"></div></div>'+
      '<div class="stat-line"><span class="nm">準時到貨率</span><div class="bar" style="flex:1"><i style="width:99%"></i></div><b>99%</b></div>'+
      '<div class="stat-line"><span class="nm">結算準確率</span><div class="bar" style="flex:1"><i style="width:96%"></i></div><b>96%</b></div>'+
    '</div>'+
  '</div>';
  C.innerHTML=html;
  void C.offsetHeight;
  mk("c5",{series:[268800,119400,384000,92320,244000],chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"donut",height:260},colors:[PURP,PURP2,"#0f766e","#64748b","#93c5fd"],labels:["永O金屬","O橡工業","O盟材料","O鎖精密","O板電子"],dataLabels:{enabled:false},legend:{position:"bottom",fontSize:"11px"},plotOptions:{pie:{donut:{size:"62%"}}},stroke:{width:2}});
}

function kpi(ic,lb,vl,unit,dir,dt){
  var cls=dir==="up"?"up":dir==="down"?"down":"flat";
  var arrow=dir==="up"?"▲":dir==="down"?"▼":"•";
  return '<div class="kpi"><div class="ic"><span class="material-symbols-outlined">'+ic+'</span></div><div class="lb">'+lb+'</div><div class="vl">'+vl+(unit?' <span style="font-size:13px;font-weight:600;color:var(--muted)">'+unit+'</span>':'')+'</div><div class="dt '+cls+'">'+arrow+' '+dt+'</div></div>';
}

var SCREENS=[s0,s1,s2,s3,s4,s5];
function show(i){
  destroyCharts();
  i=Math.max(0,Math.min(i,SCREENS.length-1));
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("active",+btns[b].getAttribute("data-i")===i);}
  document.getElementById("scrTitle").textContent=NAV[i].t;
  document.getElementById("scrSub").textContent=SUB[i];
  SCREENS[i]();
}
window.__go=function(i){location.hash="v"+i;closeSide();};
window.__s0sel=function(i){s0.sel=i;s0();};
window.__s3sel=function(i){s3.sel=i;s3();};
window.openSide=function(){document.getElementById("side").classList.add("open");document.getElementById("scrim").classList.add("on");};
window.closeSide=function(){document.getElementById("side").classList.remove("open");document.getElementById("scrim").classList.remove("on");};
window.show=show;

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
})();
</script>
