<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EAP 設備自動化整合平台｜Jvision 系統 Demo</title>
<meta name="description" content="MES 指令下達、EAP 轉譯、配方自動下載、製程數據回傳與 MES 記錄比對的設備自動化整合平台" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#e11d48; --accent2:#fb7185; --ink:#1f2937; --mut:#6b7280;
  --bg:#f6f7f9; --card:#ffffff; --line:#e6e8ec; --soft:#fff1f3;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.mi{font-family:"Material Symbols Outlined";font-size:20px;line-height:1;vertical-align:middle}
/* top nav */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(100deg,#9f1239,#e11d48);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 2px 12px rgba(190,18,60,.25)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.logo .mi{font-size:24px;color:#fff}
.brand b{font-size:16px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.brand span{font-size:11px;opacity:.85;display:block;white-space:nowrap}
.top .env{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.chip{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 0 rgba(74,222,128,.7);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.6)}70%{box-shadow:0 0 0 7px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
/* nav bar */
.nav{background:#fff;border-bottom:1px solid var(--line);padding:8px 14px;display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:59px;z-index:15}
.nav button{flex:none;white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--mut);border-radius:10px;padding:8px 13px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.15s;min-width:0}
.nav button .mi{font-size:19px}
.nav button:hover{border-color:var(--accent2);color:var(--accent)}
.nav button.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(225,29,72,.28)}
main{padding:18px;max-width:1360px;margin:0 auto}
.head{margin:0 0 16px}
.head h2{margin:0;font-size:20px;font-weight:800;display:flex;align-items:center;gap:9px}
.head p{margin:4px 0 0;color:var(--mut);font-size:13px}
.head .mi{color:var(--accent);font-size:24px}
/* generic grids */
.grid{display:grid;gap:14px;min-width:0}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g23{grid-template-columns:1.7fr 1fr}
.g32{grid-template-columns:1fr 1.4fr}
.grid>*{min-width:0}
@media(max-width:820px){.g2,.g3,.g4,.g23,.g32{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h3{margin:0 0 12px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h3 .mi{font-size:19px;color:var(--accent)}
.card .sub{font-size:12px;color:var(--mut);font-weight:500;margin-left:auto}
/* KPI */
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.kpi .lab{font-size:12px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:26px;font-weight:900;margin-top:7px;letter-spacing:-.5px}
.kpi .val small{font-size:13px;font-weight:700;color:var(--mut)}
.kpi .delta{font-size:12px;font-weight:700;margin-top:5px;display:inline-flex;align-items:center;gap:3px}
.up{color:var(--ok)}.down{color:var(--bad)}
.kpi .mi.big{position:absolute;right:12px;top:12px;font-size:30px;color:var(--soft);opacity:1}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;font-weight:700;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:var(--soft)}
.mono{font-family:"Inter",monospace;font-variant-numeric:tabular-nums;font-weight:600}
/* badge */
.bd{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;line-height:1.5}
.bd .mi{font-size:14px}
.b-ok{background:#dcfce7;color:#15803d}
.b-warn{background:#fef3c7;color:#b45309}
.b-bad{background:#fee2e2;color:#b91c1c}
.b-info{background:#dbeafe;color:#1d4ed8}
.b-mut{background:#f1f5f9;color:#475569}
.b-run{background:#ffe4e6;color:#be123c}
/* kanban board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0}
@media(max-width:960px){.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.board{grid-template-columns:1fr}}
.col{background:#f9fafb;border:1px solid var(--line);border-radius:14px;padding:11px;min-width:0}
.col>.ch{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;margin-bottom:10px}
.col>.ch .cnt{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--mut)}
.col .stripe{width:9px;height:9px;border-radius:3px}
.eq{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:11px;padding:10px;margin-bottom:9px}
.eq:last-child{margin-bottom:0}
.eq .r1{display:flex;align-items:center;gap:7px}
.eq .r1 b{font-size:13px;font-weight:800}
.eq .r1 .id{font-size:11px;color:var(--mut);margin-left:auto}
.eq .r2{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.eq .meta{font-size:11px;color:var(--mut);margin-top:8px;display:flex;justify-content:space-between;gap:8px}
.eq .bar{height:5px;border-radius:999px;background:#eef0f3;margin-top:8px;overflow:hidden}
.eq .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.live{width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block;animation:pulse 2s infinite}
.live.off{background:#94a3b8;animation:none}
.live.err{background:#ef4444;box-shadow:0 0 0 0 rgba(239,68,68,.6)}
/* pipeline steps */
.steps{display:flex;gap:8px;flex-wrap:wrap;min-width:0}
.step{flex:1;min-width:130px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;position:relative}
.step .n{width:22px;height:22px;border-radius:50%;background:var(--soft);color:var(--accent);font-weight:800;font-size:12px;display:grid;place-items:center;margin-bottom:7px}
.step b{font-size:13px}
.step p{margin:3px 0 0;font-size:11px;color:var(--mut)}
.step.act{border-color:var(--accent);box-shadow:0 4px 12px rgba(225,29,72,.15)}
.step.act .n{background:var(--accent);color:#fff}
/* chart */
.ch-wrap{width:100%;height:280px;min-width:0}
.ch-sm{width:100%;height:230px;min-width:0}
/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .it{position:relative;padding:0 0 15px 8px}
.tl .it:last-child{padding-bottom:0}
.tl .it::before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.tl .it.g::before{border-color:var(--ok)}
.tl .it.w::before{border-color:var(--warn)}
.tl .it .tt{font-size:13px;font-weight:700}
.tl .it .td{font-size:11px;color:var(--mut);margin-top:2px}
.tl .it .tm{font-size:11px;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
/* recipe matrix */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.gauge-row{display:flex;gap:12px;flex-wrap:wrap}
.stat{flex:1;min-width:120px;text-align:center;background:#f9fafb;border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .v{font-size:24px;font-weight:900;color:var(--accent)}
.stat .l{font-size:11px;color:var(--mut);margin-top:3px}
.pbar{height:8px;background:#eef0f3;border-radius:999px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.foot{text-align:center;color:var(--mut);font-size:12px;padding:22px 10px 8px}
@media(max-width:560px){.nav button span.t{display:none}.brand span{display:none}}
</style>
</head>
<body>
<div class="top">
  <div class="brand">
    <div class="logo"><span class="mi">precision_manufacturing</span></div>
    <div><b>EAP 設備自動化整合平台</b><span>Equipment Automation Program · SECS/GEM</span></div>
  </div>
  <div class="env">
    <div class="chip"><span class="dot"></span>Fab A · 線上</div>
    <div class="chip"><span class="mi" style="font-size:15px">hub</span>MES 已連線</div>
    <div class="chip"><span class="mi" style="font-size:15px">schedule</span>2026-08-13 09:42</div>
  </div>
</div>
<nav class="nav" id="nav"></nav>
<main><div id="view"></div>
<div class="foot">EAP 設備自動化整合平台 · 純前端 UI Demo · 資料為模擬展示</div>
</main>
<script>
var NAV=[
  {i:0,ic:"view_kanban",t:"設備連線看板"},
  {i:1,ic:"swap_horiz",t:"MES 指令轉譯"},
  {i:2,ic:"science",t:"配方下載管理"},
  {i:3,ic:"upload_file",t:"製程資料回傳"},
  {i:4,ic:"rule",t:"MES 記錄比對"},
  {i:5,ic:"monitoring",t:"自動化 KPI"}
];
var _chart=null;
function disposeChart(){ if(_chart){ try{_chart.dispose();}catch(e){} _chart=null; } }
function mkChart(id,opt){ var el=document.getElementById(id); if(!el)return; var c=echarts.init(el); c.setOption(opt); _chart=c; }
function esc(s){return String(s);}
function h(html){var v=document.getElementById("view");v.innerHTML=html;}

/* ---------- data ---------- */
var AREAS=[
  {k:"薄膜 CVD 區",c:"#e11d48"},
  {k:"蝕刻 Etch 區",c:"#0ea5e9"},
  {k:"微影 Litho 區",c:"#8b5cf6"},
  {k:"擴散爐管區",c:"#f59e0b"}
];
var EQUIP=[
  {a:0,id:"CVD-01",name:"PECVD 沉積機",st:"run",lot:"LOT-A2431",rc:"OX-Nitride-v7",util:88,link:"線上",secs:"S6F11 回傳中"},
  {a:0,id:"CVD-02",name:"HDP-CVD",st:"run",lot:"LOT-A2418",rc:"HDP-Gap-v3",util:81,link:"線上",secs:"閒置待命"},
  {a:0,id:"CVD-03",name:"ALD 原子層",st:"off",lot:"—",rc:"—",util:0,link:"離線",secs:"未連線"},
  {a:1,id:"ETCH-11",name:"乾式電漿蝕刻",st:"run",lot:"LOT-B7702",rc:"Poly-Etch-v5",util:92,link:"線上",secs:"S6F11 回傳中"},
  {a:1,id:"ETCH-12",name:"金屬蝕刻機",st:"err",lot:"LOT-B7688",rc:"Metal-Etch-v2",util:34,link:"通訊異常",secs:"S9F1 逾時"},
  {a:1,id:"ETCH-13",name:"濕式蝕刻槽",st:"run",lot:"LOT-B7715",rc:"Wet-Clean-v1",util:76,link:"線上",secs:"S6F11 回傳中"},
  {a:2,id:"LITHO-21",name:"KrF 步進機",st:"run",lot:"LOT-C3390",rc:"Mask-KrF-v9",util:95,link:"線上",secs:"配方下載中"},
  {a:2,id:"LITHO-22",name:"塗佈顯影機",st:"idle",lot:"待派",rc:"Coat-Dev-v4",util:52,link:"線上",secs:"閒置待命"},
  {a:3,id:"DIFF-31",name:"氧化爐管",st:"run",lot:"LOT-D1120",rc:"WetOx-v6",util:84,link:"線上",secs:"S6F11 回傳中"},
  {a:3,id:"DIFF-32",name:"退火爐管",st:"idle",lot:"待派",rc:"RTA-Anneal-v2",util:47,link:"線上",secs:"閒置待命"},
  {a:3,id:"DIFF-33",name:"LPCVD 爐管",st:"run",lot:"LOT-D1108",rc:"Nitride-LP-v3",util:79,link:"線上",secs:"S6F11 回傳中"}
];
function stBd(st){
  if(st==="run")return '<span class="bd b-run"><span class="mi">bolt</span>執行中</span>';
  if(st==="idle")return '<span class="bd b-info"><span class="mi">pause</span>閒置待命</span>';
  if(st==="err")return '<span class="bd b-bad"><span class="mi">error</span>通訊異常</span>';
  return '<span class="bd b-mut"><span class="mi">power_off</span>離線</span>';
}
function liveDot(st){ if(st==="off")return '<span class="live off"></span>'; if(st==="err")return '<span class="live err"></span>'; return '<span class="live"></span>'; }

/* ---------- screen 0: kanban 設備連線看板 ---------- */
function s0(){
  var cols=AREAS.map(function(ar,ai){
    var eqs=EQUIP.filter(function(e){return e.a===ai;});
    var cards=eqs.map(function(e){
      return '<div class="eq" style="border-left-color:'+ar.c+'">'
        +'<div class="r1">'+liveDot(e.st)+'<b>'+e.id+'</b><span class="id">'+e.name+'</span></div>'
        +'<div class="r2">'+stBd(e.st)+'<span class="bd b-mut"><span class="mi">memory</span>'+e.secs+'</span></div>'
        +'<div class="meta"><span>Lot：'+e.lot+'</span><span>配方：'+e.rc+'</span></div>'
        +'<div class="bar"><i style="width:'+e.util+'%"></i></div>'
        +'<div class="meta"><span>稼動 '+e.util+'%</span><span>'+e.link+'</span></div>'
      +'</div>';
    }).join("");
    return '<div class="col">'
      +'<div class="ch"><span class="stripe" style="background:'+ar.c+'"></span>'+ar.k
      +'<span class="cnt">'+eqs.length+' 台</span></div>'+cards+'</div>';
  }).join("");
  var online=EQUIP.filter(function(e){return e.link==="線上";}).length;
  var running=EQUIP.filter(function(e){return e.st==="run";}).length;
  var err=EQUIP.filter(function(e){return e.st==="err"||e.link==="離線";}).length;
  var avg=Math.round(EQUIP.reduce(function(a,e){return a+e.util;},0)/EQUIP.length);
  h(
  '<div class="head"><h2><span class="mi">view_kanban</span>設備連線看板</h2>'
  +'<p>依製程區看板呈現各機台 SECS/GEM 連線狀態、執行 Lot 與稼動率，異常即時標紅。</p></div>'
  +'<div class="grid g4" style="margin-bottom:14px">'
  +kpi("連線機台","hub",online+' / '+EQUIP.length,"線上通訊正常","up","+2 較昨日")
  +kpi("執行中機台","bolt",running+' 台',"正在跑貨","up","稼動穩定")
  +kpi("平均稼動率","speed",avg+'%',"全廠加權","up","+3.1%")
  +kpi("異常/離線","error",err+' 台',"需工程介入","down","ETCH-12 通訊異常")
  +'</div>'
  +'<div style="overflow-x:auto"><div class="board">'+cols+'</div></div>'
  );
}

/* ---------- screen 1: MES 指令轉譯 ---------- */
var CMD=[
  {id:"CMD-88012",lot:"LOT-A2431",eq:"CVD-01",op:"PROCESS_START",rc:"OX-Nitride-v7",st:"done",ms:120,ts:"09:41:02"},
  {id:"CMD-88013",lot:"LOT-C3390",eq:"LITHO-21",op:"RECIPE_SELECT",rc:"Mask-KrF-v9",st:"run",ms:340,ts:"09:41:38"},
  {id:"CMD-88014",lot:"LOT-B7702",eq:"ETCH-11",op:"PROCESS_START",rc:"Poly-Etch-v5",st:"done",ms:98,ts:"09:42:05"},
  {id:"CMD-88015",lot:"LOT-D1120",eq:"DIFF-31",op:"TRACK_IN",rc:"WetOx-v6",st:"queue",ms:0,ts:"09:42:20"},
  {id:"CMD-88016",lot:"LOT-B7688",eq:"ETCH-12",op:"PROCESS_START",rc:"Metal-Etch-v2",st:"fail",ms:5000,ts:"09:40:51"},
  {id:"CMD-88017",lot:"LOT-A2418",eq:"CVD-02",op:"TRACK_OUT",rc:"HDP-Gap-v3",st:"done",ms:76,ts:"09:39:44"},
  {id:"CMD-88018",lot:"LOT-D1108",eq:"DIFF-33",op:"RECIPE_SELECT",rc:"Nitride-LP-v3",st:"queue",ms:0,ts:"09:42:31"}
];
function cmdBd(st){
  if(st==="done")return '<span class="bd b-ok"><span class="mi">check_circle</span>已完成</span>';
  if(st==="run")return '<span class="bd b-run"><span class="mi">sync</span>轉譯中</span>';
  if(st==="queue")return '<span class="bd b-info"><span class="mi">schedule</span>佇列中</span>';
  return '<span class="bd b-bad"><span class="mi">cancel</span>轉譯失敗</span>';
}
function s1(){
  var rows=CMD.map(function(c){
    return '<tr><td class="mono">'+c.id+'</td><td class="mono">'+c.lot+'</td><td><b>'+c.eq+'</b></td>'
      +'<td><span class="bd b-mut">'+c.op+'</span></td><td class="mono">'+c.rc+'</td>'
      +'<td class="mono">'+c.ms+' ms</td><td class="mono">'+c.ts+'</td><td>'+cmdBd(c.st)+'</td></tr>';
  }).join("");
  var done=CMD.filter(function(c){return c.st==="done";}).length;
  var q=CMD.filter(function(c){return c.st==="queue";}).length;
  var f=CMD.filter(function(c){return c.st==="fail";}).length;
  h(
  '<div class="head"><h2><span class="mi">swap_horiz</span>MES 指令轉譯</h2>'
  +'<p>MES 派工指令進入 EAP 轉譯佇列，轉為 SECS/GEM 訊息派送設備，追蹤轉譯延遲與成功率。</p></div>'
  +'<div class="grid g4" style="margin-bottom:14px">'
  +kpi("今日指令","receipt_long","1,284 筆","MES 下達","up","+6.2%")
  +kpi("轉譯成功率","task_alt","99.2%","EAP 派送","up","+0.4%")
  +kpi("佇列待處理","schedule",q+' 筆',"平均等待 0.8s","down","即時派送")
  +kpi("轉譯失敗","report",f+' 筆',"ETCH-12 逾時","down","已告警")
  +'</div>'
  +'<div class="card" style="margin-bottom:14px"><h3><span class="mi">account_tree</span>轉譯管線</h3>'
  +'<div class="steps">'
  +stp("1","MES 指令接收","解析 Lot / 機台 / 作業",false)
  +stp("2","EAP 轉譯","對映 SECS/GEM 訊息",true)
  +stp("3","連線檢查","確認機台線上",false)
  +stp("4","派送設備","下發 S2F41 遠端命令",false)
  +stp("5","回覆確認","接收 S2F42 ACK",false)
  +'</div></div>'
  +'<div class="grid g23">'

/* ---------- helpers ---------- */
function kpi(lab,ic,val,sub,dir,delta){
  return '<div class="kpi"><div class="lab"><span class="mi" style="font-size:16px;color:var(--accent)">'+ic+'</span>'+lab+'</div>'
    +'<div class="val">'+val+'</div>'
    +'<div class="delta '+(dir==="up"?"up":"down")+'"><span class="mi" style="font-size:14px">'+(dir==="up"?"trending_up":"trending_down")+'</span>'+delta+'</div>'
    +'<span class="mi big">'+ic+'</span></div>';
}
function stp(n,t,d,act){
  return '<div class="step'+(act?" act":"")+'"><div class="n">'+n+'</div><b>'+t+'</b><p>'+d+'</p></div>';
}
function cmpRow(lab,bw,aw,bl,al){
  return '<div style="margin:12px 0"><div style="display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:6px"><span>'+lab+'</span><span style="color:var(--mut)">導入前 <b style="color:#94a3b8">'+bl+'</b> → 導入後 <b style="color:var(--accent)">'+al+'</b></span></div>'
    +'<div style="display:flex;gap:8px;align-items:center"><div class="pbar" style="flex:1;background:#f1f5f9"><i style="width:'+bw+'%;background:#cbd5e1"></i></div><div class="pbar" style="flex:1"><i style="width:'+aw+'%"></i></div></div></div>';
}

var RENDER=[s0,s1,s2,s3,s4,s5];
function show(i){
  i=Math.max(0,Math.min(i,RENDER.length-1));
  disposeChart();
  var btns=document.querySelectorAll("#nav button");
  for(var k=0;k<btns.length;k++){ btns[k].className=(+btns[k].getAttribute("data-i")===i)?"on":""; }
  RENDER[i]();
}
(function initNav(){
  var nav=document.getElementById("nav");
  nav.innerHTML=NAV.map(function(n){
    return '<button data-i="'+n.i+'"><span class="mi">'+n.ic+'</span><span class="t">'+n.t+'</span></button>';
  }).join("");
  var btns=nav.querySelectorAll("button");
  for(var k=0;k<btns.length;k++){
    btns[k].addEventListener("click",function(){ show(+this.getAttribute("data-i")); });
  }
})();
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m)return;var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
