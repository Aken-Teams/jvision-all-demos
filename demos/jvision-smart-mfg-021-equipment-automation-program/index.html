<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EAP 設備自動化整合平台｜Jvision 系統 Demo</title>

<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400&family=Playfair+Display:ital@1&display=swap" rel="stylesheet" />

<style>
:root{
  --color-primary:#16a34a;
  --color-on-primary:#000;
  --color-secondary:#22c55e;
  --color-on-secondary:#0f172a;
  --color-accent:#dc2626;
  --color-on-accent:#fff;
  --color-background:#0f172a;
  --color-foreground:#f8fafc;
  --color-card:#111827;
  --color-card-foreground:#f8fafc;
  --color-muted:#1e293b;
  --color-muted-foreground:#cbd5e1;
  --color-border:#334155;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#16a34a;
  --blue:#16a34a;
  --ink:#f8fafc;
  --muted:#cbd5e1;
  --line:#334155;
  --bg:#0f172a;
  --card:#111827;
  --mut:#cbd5e1;
  --soft:#16251d;
  --ok:#4ade80;
  --warn:#fbbf24;
  --bad:#f87171;
  --info:#60a5fa;
  --shadow:0 18px 45px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html{color-scheme:dark;scroll-behavior:smooth}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:"Inter",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 12% -8%,rgba(22,163,74,.14),transparent 28rem),
    radial-gradient(circle at 95% 15%,rgba(34,197,94,.07),transparent 24rem),
    var(--color-background);
  color:var(--color-foreground);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,.eq{cursor:pointer}
.material-symbols-outlined,.mi{
  font-family:"Material Symbols Outlined";
  font-weight:normal;font-style:normal;line-height:1;vertical-align:middle
}
.mi{font-size:20px}
.top{
  position:sticky;top:0;z-index:20;
  min-height:66px;padding:12px clamp(14px,2.4vw,32px);
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  color:var(--ink);
  background:rgba(8,15,27,.94);
  border-bottom:1px solid rgba(74,222,128,.24);
  box-shadow:0 10px 30px rgba(0,0,0,.25);
  backdrop-filter:blur(18px);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  width:40px;height:40px;display:grid;place-items:center;flex:none;
  color:#052e16;background:linear-gradient(145deg,#4ade80,#16a34a);
  border:1px solid #86efac;border-radius:9px;
  box-shadow:0 0 20px rgba(34,197,94,.24);
}
.logo .mi{font-size:25px}
.brand b{display:block;font-size:15px;font-weight:800;letter-spacing:.04em;white-space:nowrap}
.brand span{display:block;margin-top:3px;color:#94a3b8;font:10px/1.2 "JetBrains Mono",monospace;letter-spacing:.08em;white-space:nowrap}
.env{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{
  display:flex;align-items:center;gap:7px;padding:6px 10px;
  border:1px solid var(--line);border-radius:7px;
  color:#dbe4ef;background:#111b2b;
  font-size:11px;font-weight:600;white-space:nowrap
}
.dot,.live{
  width:8px;height:8px;display:inline-block;flex:none;border-radius:50%;
  background:var(--ok);box-shadow:0 0 9px rgba(74,222,128,.75)
}
.nav{
  position:sticky;top:65px;z-index:15;
  display:flex;gap:7px;padding:8px clamp(12px,2.2vw,28px);overflow-x:auto;
  background:rgba(15,23,42,.96);border-bottom:1px solid var(--line);
  scrollbar-width:thin;
}
.nav button{
  flex:none;display:flex;align-items:center;gap:7px;
  min-height:40px;padding:8px 12px;
  color:#cbd5e1;background:transparent;border:1px solid transparent;border-radius:7px;
  font-size:12px;font-weight:700;white-space:nowrap;
  transition:color .18s ease,background .18s ease,border-color .18s ease,transform .18s ease
}
.nav button:hover{color:#f8fafc;background:#172033;border-color:#475569}
.nav button.on{
  color:#dcfce7;background:#12351f;border-color:#22c55e;
  box-shadow:inset 0 -2px 0 #4ade80,0 0 14px rgba(22,163,74,.12)
}
button:focus-visible,.eq:focus-visible{
  outline:3px solid var(--color-ring);outline-offset:3px
}
main{width:min(100%,1440px);margin:auto;padding:clamp(16px,2.2vw,28px)}
#view{animation:reveal .36s ease both}
.head{margin:0 0 18px;padding-left:14px;border-left:3px solid var(--color-primary)}
.head h2{
  margin:0;display:flex;align-items:center;gap:9px;
  font-size:clamp(19px,2vw,25px);font-weight:800;letter-spacing:-.025em
}
.head h2 .mi{color:#4ade80;font-size:25px;text-shadow:0 0 10px rgba(74,222,128,.4)}
.head p{max-width:850px;margin:6px 0 0;color:#cbd5e1;font-size:12px;line-height:1.7}
.grid{display:grid;gap:12px;min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr)}
.g32{grid-template-columns:minmax(300px,1fr) minmax(0,1.4fr)}
.grid>*{min-width:0}
.card,.kpi{
  position:relative;min-width:0;
  color:var(--color-card-foreground);
  background:linear-gradient(145deg,rgba(20,30,48,.98),rgba(12,20,34,.98));
  border:1px solid var(--line);border-radius:10px;
  box-shadow:0 8px 24px rgba(0,0,0,.17)
}
.card{padding:15px}
.card h3{
  margin:0 0 13px;display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:800;letter-spacing:.015em
}
.card h3 .mi{color:#4ade80;font-size:19px}
.card .sub{margin-left:auto;color:#aebdcd;font:10px "JetBrains Mono",monospace}
.kpi{padding:14px 15px 13px;overflow:hidden}
.kpi::before{
  content:"";position:absolute;left:0;top:0;width:100%;height:2px;
  background:linear-gradient(90deg,#16a34a,#4ade80,transparent 75%)
}
.kpi .lab{display:flex;align-items:center;gap:7px;color:#cbd5e1;font-size:11px;font-weight:700}
.kpi .lab .mi{color:#4ade80!important}
.kpi .val{
  margin-top:8px;color:#fff;font-size:clamp(23px,2.3vw,30px);font-weight:800;
  letter-spacing:-.045em;font-variant-numeric:tabular-nums;text-shadow:0 0 10px rgba(255,255,255,.08)
}
.kpi .val small{font-size:12px;color:#cbd5e1}
.kpi .delta{display:inline-flex;align-items:center;gap:4px;margin-top:5px;font-size:10px;font-weight:700}
.up{color:#86efac}.down{color:#fca5a5}
.kpi .mi.big{position:absolute;right:12px;top:12px;color:#86efac;font-size:30px;opacity:.09}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{
  padding:9px 10px;text-align:left;white-space:nowrap;
  color:#d4deea;background:#172033;border-bottom:1px solid #475569;
  font-size:10px;font-weight:700;letter-spacing:.055em;text-transform:uppercase
}
.tbl td{padding:10px;border-bottom:1px solid #263449;white-space:nowrap}
.tbl tbody tr{transition:background .18s ease}
.tbl tbody tr:hover{background:#15251d}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl th:nth-child(n+3),.tbl td:nth-child(n+3){font-variant-numeric:tabular-nums}
.mono{
  font-family:"JetBrains Mono",monospace!important;
  font-variant-numeric:tabular-nums;font-size:.92em
}
.bd{
  display:inline-flex;align-items:center;gap:4px;padding:3px 8px;
  border:1px solid transparent;border-radius:5px;
  font-size:10px;font-weight:700;line-height:1.5;white-space:nowrap
}
.bd .mi{font-size:13px}
.b-ok{color:#bbf7d0;background:#12351f;border-color:#237a3c}
.b-warn{color:#fde68a;background:#3a2b12;border-color:#8a6214}
.b-bad{color:#fecaca;background:#3c171b;border-color:#9f2c35}
.b-info{color:#bfdbfe;background:#132b49;border-color:#2d6093}
.b-mut{color:#d1dae6;background:#1e293b;border-color:#475569}
.b-run{color:#dcfce7;background:#153c23;border-color:#269447}
.board{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:11px;min-width:1030px}
.col{min-width:0;padding:10px;background:#0d1626;border:1px solid var(--line);border-radius:10px}
.col>.ch{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:12px;font-weight:800}
.col>.ch .cnt{
  margin-left:auto;padding:2px 7px;color:#cbd5e1;background:#172033;
  border:1px solid var(--line);border-radius:5px;font:10px "JetBrains Mono",monospace
}
.stripe{width:3px;height:15px;border-radius:2px}
.eq{
  margin-bottom:8px;padding:10px;background:#121d2e;border:1px solid #2d3c52;
  border-left:3px solid var(--color-primary);border-radius:8px;
  transition:transform .18s ease,border-color .18s ease,background .18s ease
}
.eq:hover{transform:translateY(-1px);background:#172337;border-color:#4b5d76}
.eq:last-child{margin-bottom:0}
.eq .r1,.eq .r2,.eq .meta{display:flex;align-items:center;gap:7px}
.eq .r1 b{font:700 12px "JetBrains Mono",monospace}
.eq .r1 .id{margin-left:auto;color:#b8c6d6;font-size:10px}
.eq .r2{margin-top:8px;flex-wrap:wrap}
.eq .meta{justify-content:space-between;margin-top:8px;color:#b6c3d2;font:9px "JetBrains Mono",monospace}
.eq .bar,.pbar{height:5px;overflow:hidden;background:#253247;border-radius:999px}
.eq .bar{margin-top:8px}
.eq .bar i,.pbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#15803d,#4ade80)}
.live.off{background:#94a3b8;box-shadow:none}
.live.err{background:#f87171;box-shadow:0 0 9px rgba(248,113,113,.7)}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.step{
  flex:1;min-width:130px;padding:11px;background:#101a2b;border:1px solid var(--line);
  border-radius:8px
}
.step .n{
  width:23px;height:23px;margin-bottom:7px;display:grid;place-items:center;
  color:#bbf7d0;background:#173921;border:1px solid #237a3c;border-radius:5px;
  font:700 10px "JetBrains Mono",monospace
}
.step b{font-size:12px}.step p{margin:4px 0 0;color:#b9c6d5;font-size:10px;line-height:1.5}
.step.act{background:#122a1b;border-color:#22c55e;box-shadow:0 0 16px rgba(34,197,94,.1)}
.step.act .n{color:#052e16;background:#4ade80}
.ch-wrap{width:100%;height:280px;min-width:0}
.ch-sm{width:100%;height:230px;min-width:0}
.tl{position:relative;padding-left:23px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:1px;background:#475569}
.tl .it{position:relative;padding:0 0 15px 8px}
.tl .it:last-child{padding-bottom:0}
.tl .it::before{
  content:"";position:absolute;left:-21px;top:3px;width:9px;height:9px;
  background:#0f172a;border:2px solid #60a5fa;border-radius:50%
}
.tl .it.g::before{border-color:#4ade80}.tl .it.w::before{border-color:#fbbf24}
.tl .tt{font-size:12px;font-weight:700}
.tl .td{margin-top:3px;color:#c0ccda;font-size:10px}
.tl .tm{color:#86efac;font:10px "JetBrains Mono",monospace}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:11px;color:#cbd5e1;font-size:10px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:2px;vertical-align:-1px}
.gauge-row{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1;min-width:120px;padding:12px;text-align:center;background:#0e1929;border:1px solid var(--line);border-radius:8px}
.stat .v{color:#4ade80;font-size:23px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .l{margin-top:3px;color:#bdc9d7;font-size:10px}
.foot{padding:24px 10px 5px;text-align:center;color:#94a3b8;font-size:10px}
@keyframes reveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:1024px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.g32{grid-template-columns:1fr}
}
@media(max-width:768px){
  .top{position:relative}.nav{top:0}
  .g2,.g3{grid-template-columns:1fr}
  main{padding:15px}
}
@media(max-width:560px){
  .env{width:100%;margin-left:0}.chip:last-child{display:none}
  .brand span,.nav button .t{display:none}
  .nav button{width:42px;justify-content:center;padding:8px}
  .g4{grid-template-columns:1fr}
  .card,.kpi{border-radius:8px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  #view{opacity:1;transform:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo"><span class="mi" aria-hidden="true">precision_manufacturing</span></div>
    <div><b>EAP 設備自動化整合平台</b><span>Equipment Automation Program · SECS/GEM</span></div>
  </div>
  <div class="env">
    <div class="chip"><span class="dot" aria-hidden="true"></span>Fab A · 線上</div>
    <div class="chip"><span class="mi" style="font-size:15px" aria-hidden="true">hub</span>MES 已連線</div>
    <div class="chip mono"><span class="mi" style="font-size:15px" aria-hidden="true">schedule</span>2026-08-13 09:42</div>
  </div>
</header>
<nav class="nav" id="nav" aria-label="系統功能"></nav>
<main>
  <div id="view"></div>
  <div class="foot">EAP 設備自動化整合平台 · 純前端 UI Demo · 資料為模擬展示</div>
</main>
<script>
var NAV=[
{i:0,ic:"view_kanban",t:"設備連線看板"},{i:1,ic:"swap_horiz",t:"MES 指令轉譯"},
{i:2,ic:"science",t:"配方下載管理"},{i:3,ic:"upload_file",t:"製程資料回傳"},
{i:4,ic:"rule",t:"MES 記錄比對"},{i:5,ic:"monitoring",t:"自動化 KPI"}
];
var _charts=[];
function disposeChart(){_charts.forEach(function(c){try{c.dispose()}catch(e){}});_charts=[]}
function mkChart(id,opt){
  var el=document.getElementById(id);if(!el)return;
  var c=echarts.init(el);c.setOption(opt);_charts.push(c)
}
function h(x){document.getElementById("view").innerHTML=x}
var AREAS=[
{k:"薄膜 CVD 區",c:"#22c55e"},{k:"蝕刻 Etch 區",c:"#38bdf8"},
{k:"微影 Litho 區",c:"#a78bfa"},{k:"擴散爐管區",c:"#fbbf24"}
];
var EQUIP=[
{a:0,id:"CVD-01",name:"PECVD 沉積機",st:"run",lot:"LOT-A2431",rc:"OX-Nitride-v7",util:88,link:"線上",secs:"S6F11 回傳中"},
{a:0,id:"CVD-02",name:"HDP-CVD",st:"run",lot:"LOT-A2418",rc:"HDP-Gap-v3",util:81,link:"線上",secs:"閒置待命"},
{a:0,id:"CVD-03",name:"ALD 原子層",st:"off",lot:"—",rc:"—",util:0,link:"離線",secs:"未連線"},
{a:1,id:"ETCH-11",name:"乾式電漿蝕刻",st:"run",lot:"LOT-B7702",rc:"Poly-Etch-v5",util:92,link:"線上",secs:"S6F11 回傳中"},
{a:1,id:"ETCH-12",name:"金屬蝕刻機",st:"err",lot:"LOT-B7688",rc:"Metal-Etch-v2",util:34,link:"通訊異常",secs:"S9F1 逾時"},
{a:1,id:"ETCH-13",name:"濕式蝕刻槽",st:"run",lot:"LOT-B7715",rc:"Wet-Clean-v1",util:76,link:"線上",secs:"S6F11 回傳中"},
{a:2,id:"LITHO-21",name:"KrF 步進機",st:"run",lot:"LOT-C3390",rc:"Mask-KrF-v9",util:95,link:"線上",secs:"配方下載中"},
{a:2,id:"LITHO-22",name:"塗佈顯影機",st:"idle",lot:"待派",rc:"Coat-Dev-v4",util:52,link:"線上",secs:"閒置待命"},
{a:3,id:"DIFF-31",name:"氧化爐管",st:"run",lot:"LOT-D1120",rc:"WetOx-v6",util:84,link:"線上",secs:"S6F11 回傳中"},
{a:3,id:"DIFF-32",name:"退火爐管",st:"idle",lot:"待派",rc:"RTA-Anneal-v2",util:47,link:"線上",secs:"閒置待命"},
{a:3,id:"DIFF-33",name:"LPCVD 爐管",st:"run",lot:"LOT-D1108",rc:"Nitride-LP-v3",util:79,link:"線上",secs:"S6F11 回傳中"}
];
function stBd(s){
 if(s==="run")return '<span class="bd b-run"><span class="mi">bolt</span>執行中</span>';
 if(s==="idle")return '<span class="bd b-info"><span class="mi">pause</span>閒置待命</span>';
 if(s==="err")return '<span class="bd b-bad"><span class="mi">error</span>通訊異常</span>';
 return '<span class="bd b-mut"><span class="mi">power_off</span>離線</span>'
}
function liveDot(s){
 var c=s==="off"?" off":s==="err"?" err":"";
 return '<span class="live'+c+'" aria-hidden="true"></span>'
}
function kpi(lab,ic,val,sub,dir,delta){
 return '<div class="kpi"><div class="lab"><span class="mi" style="font-size:16px;color:var(--color-primary)">'+ic+'</span>'+lab+'</div>'+
 '<div class="val">'+val+'</div><div class="delta '+(dir==="up"?"up":"down")+'"><span class="mi" style="font-size:14px">'+
 (dir==="up"?"trending_up":"trending_down")+'</span>'+delta+'</div><span class="mi big">'+ic+'</span></div>'
}
function stp(n,t,d,a){return '<div class="step'+(a?" act":"")+'"><div class="n">'+n+'</div><b>'+t+'</b><p>'+d+'</p></div>'}
function s0(){
 var cols=AREAS.map(function(ar,ai){
  var es=EQUIP.filter(function(e){return e.a===ai});
  return '<div class="col"><div class="ch"><span class="stripe" style="background:'+ar.c+'"></span>'+ar.k+
  '<span class="cnt">'+es.length+' 台</span></div>'+es.map(function(e){
   return '<div class="eq" tabindex="0" style="border-left-color:'+ar.c+'"><div class="r1">'+liveDot(e.st)+'<b>'+e.id+
   '</b><span class="id">'+e.name+'</span></div><div class="r2">'+stBd(e.st)+'<span class="bd b-mut"><span class="mi">memory</span>'+
   e.secs+'</span></div><div class="meta"><span>Lot：'+e.lot+'</span><span>配方：'+e.rc+'</span></div><div class="bar"><i style="width:'+
   e.util+'%"></i></div><div class="meta"><span>稼動 '+e.util+'%</span><span>'+e.link+'</span></div></div>'
  }).join("")+'</div>'
 }).join("");
 var online=EQUIP.filter(function(e){return e.link==="線上"}).length;
 var running=EQUIP.filter(function(e){return e.st==="run"}).length;
 var err=EQUIP.filter(function(e){return e.st==="err"||e.link==="離線"}).length;
 var avg=Math.round(EQUIP.reduce(function(a,e){return a+e.util},0)/EQUIP.length);
 h('<div class="head"><h2><span class="mi">view_kanban</span>設備連線看板</h2><p>依製程區看板呈現各機台 SECS/GEM 連線狀態、執行 Lot 與稼動率，異常即時標紅。</p></div>'+
 '<div class="grid g4" style="margin-bottom:14px">'+kpi("連線機台","hub",online+" / "+EQUIP.length,"線上通訊正常","up","+2 較昨日")+
 kpi("執行中機台","bolt",running+" 台","正在跑貨","up","稼動穩定")+kpi("平均稼動率","speed",avg+"%","全廠加權","up","+3.1%")+
 kpi("異常/離線","error",err+" 台","需工程介入","down","ETCH-12 通訊異常")+'</div><div style="overflow-x:auto"><div class="board">'+cols+'</div></div>')
