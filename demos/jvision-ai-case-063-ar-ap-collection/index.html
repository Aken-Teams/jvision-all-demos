<html lang="zh-Hant">
<head>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>

<style>
:root{
 --color-primary:#F59E0B;--color-on-primary:#0F172A;
 --color-secondary:#FBBF24;--color-on-secondary:#0F172A;
 --color-accent:#8B5CF6;--color-on-accent:#000;
 --color-background:#0F172A;--color-foreground:#F8FAFC;
 --color-card:#222735;--color-card-foreground:#F8FAFC;
 --color-muted:#272F42;--color-muted-foreground:#A8B5C8;
 --color-border:#334155;--color-destructive:#EF4444;
 --color-on-destructive:#000;--color-ring:#F59E0B;
 --blue:#8B5CF6;--ink:#F8FAFC;--muted:#A8B5C8;--line:#334155;
 --ok:#4ADE80;--warn:#FBBF24;--bad:#F87171;
 --radius:10px;--shadow:0 12px 32px rgba(2,6,23,.22)
}
*{box-sizing:border-box}
html{background:var(--color-background);color-scheme:dark}
body{margin:0;min-width:320px;background:var(--color-background);color:var(--ink);font-family:"IBM Plex Sans",sans-serif;font-variant-numeric:tabular-nums;line-height:1.5}
button,a{font:inherit}
button{cursor:pointer}
.material-symbols-outlined{font-size:20px;line-height:1;vertical-align:middle}
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.shell>*{min-width:0}
.side{
 position:sticky;top:0;height:100vh;overflow:auto;z-index:10;
 display:flex;flex-direction:column;gap:4px;padding:24px 16px;
 background:#121A2A;border-right:1px solid var(--line)
}
.bd{display:flex;align-items:center;gap:12px;padding:0 8px 26px}
.lg{
 width:42px;height:42px;flex:none;display:grid;place-items:center;
 background:var(--color-primary);color:var(--color-on-primary);
 border:1px solid #FCD34D;border-radius:8px;font-size:18px;font-weight:700;
 box-shadow:4px 4px 0 rgba(245,158,11,.16)
}
.bd b{display:block;color:#fff;font-size:15px;font-weight:700;letter-spacing:.02em}
.bd span{display:block;margin-top:2px;color:var(--color-primary);font-size:10px;font-weight:600;letter-spacing:.14em}
#nav{display:flex;flex-direction:column;gap:4px}
.side button{
 width:100%;min-height:44px;display:flex;align-items:center;gap:12px;
 padding:10px 12px;border:1px solid transparent;border-radius:8px;
 background:transparent;color:#C7D2E2;text-align:left;font-size:13.5px;
 font-weight:500;white-space:nowrap;transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s ease
}
.side button .material-symbols-outlined{color:#94A3B8;transition:color .2s ease}
.side button:hover{background:#1D2638;border-color:#334155;color:#fff;transform:translateX(2px)}
.side button.on{background:var(--color-primary);border-color:#FCD34D;color:var(--color-on-primary);font-weight:700}
.side button.on .material-symbols-outlined{color:var(--color-on-primary)}
.side button:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.foot{
 margin-top:auto;padding:18px 10px 0;border-top:1px solid var(--line);
 color:#A8B5C8;font-size:11px;line-height:1.75
}
.main{min-width:0;padding:28px clamp(18px,2.8vw,42px) 42px}
.vh{
 display:flex;align-items:flex-end;justify-content:space-between;gap:18px;
 margin:0 auto 22px;max-width:1440px
}
.vh h2{margin:0;color:#fff;font-size:clamp(22px,2.2vw,30px);font-weight:700;letter-spacing:-.025em}
.vh p{margin:5px 0 0;color:var(--muted);font-size:13px}
.live{
 min-height:36px;display:inline-flex;align-items:center;gap:8px;padding:7px 12px;
 border:1px solid #5B4824;border-radius:999px;background:#211E19;
 color:#FCD34D;font-size:12px;font-weight:600;white-space:nowrap
}
.live i{width:8px;height:8px;border-radius:50%;background:var(--color-primary);box-shadow:0 0 0 4px rgba(245,158,11,.12);animation:pulse 1.8s ease-in-out infinite}
#view{max-width:1440px;margin:auto;animation:reveal .35s ease-out both}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi,.card,.mk{
 border:1px solid var(--line);background:var(--color-card);color:var(--color-card-foreground);
 box-shadow:var(--shadow);transition:transform .22s ease,border-color .22s ease,background-color .22s ease
}
.kpi:hover,.card:hover,.mk:hover{border-color:#475569;transform:translateY(-2px)}
.kpi{position:relative;overflow:hidden;min-width:0;padding:18px;border-radius:var(--radius)}
.kpi:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--color-primary)}
.kpi .l,.mk .l{color:var(--muted);font-size:11.5px;font-weight:500;letter-spacing:.04em}
.kpi .v{margin-top:8px;color:#fff;font-size:27px;font-weight:700;letter-spacing:-.035em}
.kpi .d{margin-top:3px;font-size:11px;font-weight:600}
.kpi .ic{position:absolute;right:15px;top:15px;color:var(--color-primary);opacity:.68}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.35fr) minmax(320px,.9fr)}
.g11,.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{min-width:0;padding:18px;border-radius:var(--radius)}
.card h3{
 display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 15px;
 color:#F8FAFC;font-size:14px;font-weight:600;letter-spacing:.005em
}
.card h3>.material-symbols-outlined{color:var(--color-primary)}
.tag,.pill{
 display:inline-flex;align-items:center;gap:5px;border-radius:999px;
 font-size:10.5px;font-weight:600;line-height:1.4;white-space:nowrap
}
.tag{padding:3px 9px;border:1px solid transparent}
.pill{padding:5px 10px;border:1px solid #5B4824;background:#211E19;color:#FCD34D}
.t-ok{background:#112D25;border-color:#236348;color:#86EFAC}
.t-warn{background:#302714;border-color:#68501B;color:#FDE68A}
.t-bad{background:#341C23;border-color:#71303B;color:#FCA5A5}
.t-info{background:#24203A;border-color:#4D3E79;color:#C4B5FD}
.scroll{max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{background:#192131;color:#CBD5E1;font-size:11px;font-weight:600;letter-spacing:.025em}
table.data td{color:#E2E8F0}
table.data tr:last-child td{border-bottom:0}
table.data tr:hover td{background:#252C3B}
table.data th:nth-last-child(-n+3),table.data td:nth-last-child(-n+3){text-align:right}
table.data td:nth-child(2),table.data td:nth-child(3),table.data td:nth-child(4){font-family:"IBM Plex Sans",monospace}
code{padding:2px 6px;border:1px solid #4D3E79;border-radius:4px;background:#24203A;color:#C4B5FD;font-family:"IBM Plex Sans",monospace;font-weight:600}
.chart{position:relative;height:250px}
.rep,.queue,.aging,.tlog{display:flex;flex-direction:column}
.rep,.queue{gap:9px}
.ri{
 display:flex;align-items:center;gap:12px;padding:11px 13px;
 border:1px solid var(--line);border-left:3px solid var(--bad);
 border-radius:8px;background:#1D2433
}
.ri.w{border-left-color:var(--warn)}.ri.i{border-left-color:var(--color-primary)}.ri.g{border-left-color:var(--ok)}
.ri .mid{flex:1;min-width:0}
.ri .mid b{font-size:13px}.ri .mid small{display:block;color:var(--muted);font-size:11.5px}
.ri .qty{flex:none;text-align:right}.ri .qty b{font-size:15px}.ri .qty small{display:block;color:var(--muted);font-size:10px}
.aging{gap:12px}
.ab{display:grid;grid-template-columns:118px minmax(90px,1fr) 74px;align-items:center;gap:12px}
.ab .nm{font-size:12.5px;font-weight:600;white-space:nowrap}
.ab .nm small{display:block;color:var(--muted);font-size:10px;font-weight:400}
.abtrk{position:relative;height:23px;overflow:hidden;border:1px solid #334155;border-radius:5px;background:#161D2C}
.abtrk i{height:100%;display:flex;align-items:center;padding-left:8px;border-radius:4px;color:#07111F;font-size:10.5px;font-style:normal;font-weight:700;white-space:nowrap}
.ab .dd{text-align:right;font-size:13px;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;color:var(--muted);font-size:11px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px}
.wo{
 display:flex;align-items:center;gap:12px;padding:12px 13px;
 border:1px solid var(--line);border-radius:8px;background:#1D2433;
 transition:border-color .2s ease,background-color .2s ease,transform .2s ease
}
.wo:hover{border-color:#526078;background:#232B3B;transform:translateX(2px)}
.wo .pr{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:6px;color:#07111F;font-size:13px;font-weight:700}
.wo .info{flex:1;min-width:0}
.wo .info b{font-size:13px}.wo .info small{display:block;overflow:hidden;color:var(--muted);font-size:11px;text-overflow:ellipsis;white-space:nowrap}
.wo .amt{flex:none;text-align:right}.wo .amt b{color:#FCD34D;font-size:14px}.wo .amt small{display:block;color:var(--muted);font-size:10px}
.miniK{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.mk{padding:14px 16px;border-radius:8px;background:#1B2332}
.mk .v{margin-top:4px;color:#fff;font-size:21px;font-weight:700;letter-spacing:-.02em}
.dp{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.dp .nm{width:88px;flex:none;font-size:12px;font-weight:600}
.bar{height:8px;flex:1;overflow:hidden;border-radius:3px;background:#161D2C}
.bar i{display:block;height:100%;border-radius:3px;background:var(--color-primary)}
.dp .vv{width:56px;flex:none;text-align:right;font-size:12px;font-weight:700}
.te{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.te:last-child{border-bottom:0}
.te .ico{width:32px;height:32px;flex:none;display:grid;place-items:center;border-radius:6px;color:#07111F}
.te .body{flex:1;min-width:0}
.te .body b{font-size:12.5px}.te .body p{margin:2px 0 0;color:var(--muted);font-size:11.5px}
.te .tm{flex:none;color:var(--muted);font-family:"IBM Plex Sans",monospace;font-size:11px;text-align:right}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.42}}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1024px){
 .shell{grid-template-columns:220px minmax(0,1fr)}
 .main{padding-inline:20px}
 .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
 .g2{grid-template-columns:1fr}
}
@media(max-width:768px){
 .shell{display:block}
 .side{position:relative;height:auto;padding:14px;border-right:0;border-bottom:1px solid var(--line)}
 .bd{padding:2px 4px 12px}
 #nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
 .side button{justify-content:center;padding:9px 8px;font-size:12px}
 .side button:hover{transform:none}
 .foot{display:none}
 .main{padding:22px 16px 34px}
 .vh{align-items:flex-start}
 .g11,.two{grid-template-columns:1fr}
}
@media(max-width:480px){
 #nav{grid-template-columns:repeat(2,minmax(0,1fr))}
 .vh{display:block}.live{margin-top:13px}
 .kpis,.miniK{grid-template-columns:1fr}
 .kpi{padding:16px}
 .card{padding:14px}
 .ab{grid-template-columns:92px minmax(80px,1fr) 48px;gap:8px}
 .wo{align-items:flex-start}.wo .amt{margin-left:auto}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}
 #view{opacity:1;transform:none}
}
</style>
</head>
