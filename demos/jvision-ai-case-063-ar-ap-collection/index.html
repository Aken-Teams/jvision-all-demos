<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>應收應付催收站 · AR/AP Collection Ops</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--accent:#ea580c;--accent2:#fb923c;--ink:#26201b;--bg:#faf6f2;--card:#fff;--line:#efe4da;--mut:#8b7d70;--ok:#15803d;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.shell>*{min-width:0}
.side{background:linear-gradient(190deg,#9a3412,#7c2d12);color:#f7e8dd;padding:18px 14px;display:flex;flex-direction:column;gap:5px;position:sticky;top:0;height:100vh;overflow:auto}
.side .bd{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.side .lg{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent2),var(--accent));display:grid;place-items:center;font-weight:800;color:#fff;flex:none;box-shadow:0 6px 18px rgba(124,45,18,.55);font-family:"Noto Sans TC"}
.side .bd b{font-size:15px;font-weight:800;font-family:"Noto Sans TC";display:block;color:#fff}
.side .bd span{font-size:10px;color:var(--accent2);letter-spacing:1.2px}
.side button{display:flex;align-items:center;gap:11px;background:transparent;border:0;color:#f3ddce;font:inherit;font-weight:600;font-size:13.5px;padding:11px 12px;border-radius:10px;cursor:pointer;text-align:left;width:100%;font-family:"Noto Sans TC";flex:none;white-space:nowrap}
.side button .material-symbols-outlined{font-size:20px;color:#f0b48a}
.side button:hover{background:rgba(255,255,255,.07)}
.side button.on{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;font-weight:800}
.side button.on .material-symbols-outlined{color:#fff}
.side .foot{margin-top:auto;padding:12px 10px;font-size:11px;color:#e0b092;border-top:1px solid rgba(255,255,255,.12);line-height:1.7}
.main{padding:22px 24px;min-width:0}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.live{background:#fde3cf;color:#9a3412;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpis>*{min-width:0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.3}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .9fr}
.g11{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#dcfce7;color:#15803d}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#ffedd5;color:#9a3412}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#fbf3ec}
table.data td b{font-family:"Noto Sans TC"}
.scroll{overflow-x:auto}
code{background:#fff1e5;padding:1px 6px;border-radius:4px;color:var(--accent);font-weight:700}
.chart{position:relative;height:250px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.two>*{min-width:0}
.rep{display:flex;flex-direction:column;gap:9px}
.ri{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:11px;padding:10px 13px;display:flex;align-items:center;gap:12px}
.ri.w{border-left-color:var(--warn)}.ri.i{border-left-color:var(--accent)}.ri.g{border-left-color:var(--ok)}
.ri .mid{flex:1;min-width:0}
.ri .mid b{font-size:13px;font-family:"Noto Sans TC"}
.ri .mid small{color:var(--mut);font-size:11.5px;display:block}
.ri .qty{text-align:right;flex:none}
.ri .qty b{font-family:Inter;font-size:15px}
.ri .qty small{display:block;font-size:10px;color:var(--mut)}
.aging{display:flex;flex-direction:column;gap:11px}
.ab{display:grid;grid-template-columns:118px 1fr 96px;align-items:center;gap:12px}
.ab .nm{font-size:12.5px;font-weight:800;font-family:"Noto Sans TC";white-space:nowrap}
.ab .nm small{display:block;color:var(--mut);font-size:10px;font-weight:500}
.abtrk{height:22px;background:#f4ece3;border-radius:8px;overflow:hidden;position:relative}
.abtrk i{height:100%;border-radius:8px;display:flex;align-items:center;padding-left:8px;color:#fff;font-size:10.5px;font-weight:700}
.ab .dd{font-size:13px;font-weight:800;text-align:right;font-family:Inter}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:12px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.pill{display:inline-flex;align-items:center;gap:5px;background:#fff1e5;border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:11.5px;font-weight:700;color:var(--accent)}
.queue{display:flex;flex-direction:column;gap:10px}
.wo{border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:12px;background:#fffdfb}
.wo .pr{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none;font-family:"Noto Sans TC"}
.wo .info{flex:1;min-width:0}
.wo .info b{font-size:13px;font-family:"Noto Sans TC"}
.wo .info small{display:block;color:var(--mut);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wo .amt{text-align:right;flex:none}
.wo .amt b{font-family:Inter;font-size:14px;color:var(--accent)}
.wo .amt small{display:block;font-size:10px;color:var(--mut)}
.miniK{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.miniK>*{min-width:0}
.mk{background:#fbf3ec;border:1px solid var(--line);border-radius:13px;padding:12px 14px}
.mk .l{font-size:11.5px;color:var(--mut);font-weight:600}
.mk .v{font-size:21px;font-weight:800;font-family:Inter;margin-top:2px}
.dp{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dp .nm{width:88px;font-size:12px;font-weight:700;font-family:"Noto Sans TC";flex:none}
.bar{flex:1;height:9px;background:#f4ece3;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.dp .vv{width:56px;text-align:right;font-size:12px;font-weight:800;font-family:Inter;flex:none}
.tlog{display:flex;flex-direction:column;gap:0}
.te{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.te:last-child{border-bottom:0}
.te .ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;color:#fff}
.te .body{flex:1;min-width:0}
.te .body b{font-size:12.5px;font-family:"Noto Sans TC"}
.te .body p{margin:2px 0 0;font-size:11.5px;color:var(--mut)}
.te .tm{font-size:11px;color:var(--mut);flex:none;font-family:Inter;text-align:right}
@media(max-width:860px){
 .shell{grid-template-columns:1fr}
 .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;overflow:visible}
 .side .bd{width:100%;padding-bottom:8px}.side button{width:auto}.side .foot{display:none}
}
@media(max-width:820px){
 .kpis{grid-template-columns:repeat(2,1fr)}
 .g2,.g11,.two{grid-template-columns:1fr}
 .ab{grid-template-columns:96px 1fr 68px}
}
@media(max-width:480px){.miniK{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="bd"><div class="lg">催</div><div><b>應收應付催收站</b><span>AR/AP COLLECTION</span></div></div>
    <div id="nav"></div>
    <div class="foot">應收餘額 NT$ 4,820萬 · 逾期 1,236萬<br/>催收工單 42 · 承諾未兌 9<br/>90+ 呆帳風險 8 戶 · 回收率 87.2%</div>
  </aside>
  <main class="main">
    <div class="vh"><div><h2 id="vt">催收總覽</h2><p id="vd"></p></div><div class="live"><i></i>帳齡即時監控</div></div>
    <div id="view"></div>
  </main>
</div>
<script>
const MOD=[
["催收總覽","dashboard","催收總覽","應收應付與逾期關鍵指標即時儀表"],
["應收帳齡","stacked_bar_chart","應收帳齡","0-30 / 31-60 / 61-90 / 90+ 分層帳齡分析"],
["催收工單","assignment_late","催收工單","逾期案件工單佇列與優先派工"],
["催收紀錄","call_log","催收紀錄","電話 / 信函催收動作與付款承諾追蹤"],
["應付排程","event_repeat","應付排程","供應商付款到期排程與現金流控管"],
["呆帳報表","report","呆帳報表","呆帳風險評級與備抵提列報表"]];
const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span>'+m[0];b.onclick=()=>show(i);nav.appendChild(b);});

const BANDCOL=['#65a30d','#f59e0b','#ea580c','#dc2626'];
const BANDS=[
["0-30 天","未逾期/近期",3584,74,0],
["31-60 天","初期逾期",658,48,1],
["61-90 天","中期逾期",342,30,2],
["90+ 天","高風險逾期",236,22,3]];

const WO=[
[1,"宏達電子股份","INV-24081","112 天",188,"高","陳文彬"],
[2,"聯欣塑膠工業","INV-24063","96 天",142,"高","林佩儀"],
[3,"大鼎機械","INV-24099","74 天",96,"中","黃國豪"],
[4,"永O貿易","INV-24112","61 天",78,"中","陳文彬"],
[5,"泰昌五金","INV-24120","48 天",54,"中","林佩儀"],
[6,"O曜紡織","INV-24131","39 天",36,"低","王雅琪"]];
function prCol(p){return p==='高'?'#dc2626':p==='中'?'#ea580c':'#65a30d';}

const AGE=[
["宏達電子股份","C-1082","INV-24081","2026/04/23",112,188,"90+","t-bad"],
["聯欣塑膠工業","C-1044","INV-24063","2026/05/09",96,142,"90+","t-bad"],
["大鼎機械","C-1120","INV-24099","2026/05/31",74,96,"61-90","t-warn"],
["永O貿易","C-1067","INV-24112","2026/06/13",61,78,"61-90","t-warn"],
["泰昌五金","C-1093","INV-24120","2026/06/26",48,54,"31-60","t-warn"],
["O曜紡織","C-1150","INV-24131","2026/07/05",39,36,"31-60","t-warn"],
["日盛食品","C-1011","INV-24140","2026/07/28",16,120,"0-30","t-ok"]];

const ACTS=[
["11:20","call","宏達電子股份","第 3 次電話催收，財務承諾 8/20 前分期首付 60 萬","承諾付款"],
["10:55","mail","聯欣塑膠工業","寄發第二次催收信函（存證），要求 7 日內回覆","已寄出"],
["10:32","call","大鼎機械","電話聯繫採購窗口，對帳差異 12 萬待客戶確認","對帳中"],
["10:08","call","永O貿易","客戶確認 8/18 匯款全額 78 萬","承諾付款"],
["09:47","mail","泰昌五金","Email 寄送對帳單與逾期利息通知","已寄出"],
["09:20","visit","O曜紡織","業務拜訪，簽署還款計畫書，分 3 期","已協商"],
["08:58","call","日盛食品","提醒即將到期發票，客戶表示如期付款","一般提醒"]];
function actIco(t){return t==='call'?['call','#ea580c']:t==='mail'?['mail','#0284c7']:t==='visit'?['handshake','#15803d']:['note','#8b7d70'];}

const AP=[
["O塑石化原料","AP-5521","2026/08/16",245,"月結60","t-warn","本週到期"],
["鴻運物流","AP-5533","2026/08/18",68,"月結30","t-info","已排程"],
["O鋼鋼材","AP-5540","2026/08/22",412,"月結60","t-ok","備款中"],
["精工包裝","AP-5548","2026/08/25",53,"月結30","t-info","已排程"],
["昱誠電力設備","AP-5552","2026/08/29",188,"月結45","t-ok","備款中"]];

const BD=[
["宏達電子股份","90+ 天",188,"高風險",94,"t-bad"],
["聯欣塑膠工業","90+ 天",142,"高風險",71,"t-bad"],
["昇群國際","90+ 天",96,"高風險",48,"t-bad"],
["大鼎機械","61-90 天",96,"中風險",29,"t-warn"],
["永O貿易","61-90 天",78,"中風險",23,"t-warn"],
["泰昌五金","31-60 天",54,"低風險",8,"t-info"]];

function bandRows(){return BANDS.map(b=>`<div class="ab"><div class="nm">${b[0]}<small>${b[1]}</small></div><div class="abtrk"><i style="width:${b[3]}%;background:${BANDCOL[b[4]]}">${b[2].toLocaleString()} 萬</i></div><div class="dd" style="color:${BANDCOL[b[4]]}">${b[3]}%</div></div>`).join('');}
function woRows(){return WO.map(w=>`<div class="wo"><div class="pr" style="background:${prCol(w[5])}">${w[0]}</div><div class="info"><b>${w[1]}</b><small>${w[2]} · 逾期 ${w[3]} · 負責 ${w[6]}</small></div><div class="amt"><b>${w[4]} 萬</b><small>優先 ${w[5]}</small></div></div>`).join('');}
function resTag(r){return r==='承諾付款'||r==='已協商'?'t-ok':r==='對帳中'?'t-warn':'t-info';}

const SCREENS=[
()=>`<div class="kpis">
 <div class="kpi"><span class="material-symbols-outlined ic">account_balance_wallet</span><div class="l">應收餘額</div><div class="v">4,820<small style="font-size:12px"> 萬</small></div><div class="d" style="color:var(--mut)">未收發票 318 張</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">running_with_errors</span><div class="l">逾期應收</div><div class="v" style="color:var(--bad)">1,236<small style="font-size:12px"> 萬</small></div><div class="d dn">▲ 較上月 +182 萬</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">task_alt</span><div class="l">回收率</div><div class="v">87.2<small style="font-size:12px">%</small></div><div class="d up">▲ 較 79.5%</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">assignment_late</span><div class="l">在辦催收工單</div><div class="v" style="color:var(--accent)">42</div><div class="d" style="color:var(--mut)">承諾未兌 9</div></div>
</div>
<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">stacked_bar_chart</span>應收帳齡分層（0-30 / 31-60 / 61-90 / 90+）<span class="pill" style="margin-left:auto"><span class="material-symbols-outlined" style="font-size:15px">warning</span>紅=高風險</span></h3>
  <div class="aging">${bandRows()}</div>
  <div class="legend"><span><i style="background:#65a30d"></i>0-30 天</span><span><i style="background:#f59e0b"></i>31-60 天</span><span><i style="background:#ea580c"></i>61-90 天</span><span><i style="background:#dc2626"></i>90+ 天</span></div>
 </div>
 <div class="card"><h3><span class="material-symbols-outlined">donut_large</span>逾期金額佔比</h3><div class="chart" style="height:200px"><canvas id="c_dist"></canvas></div>
  <h3 style="margin-top:14px"><span class="material-symbols-outlined">trending_up</span>回收率趨勢（6 週）</h3><div class="chart" style="height:150px"><canvas id="c_trend"></canvas></div>
 </div>
</div>`,
()=>`<div class="miniK">
 <div class="mk"><div class="l">逾期戶數</div><div class="v" style="color:var(--bad)">36 戶</div></div>
 <div class="mk"><div class="l">平均帳齡 DSO</div><div class="v">52 天</div></div>
 <div class="mk"><div class="l">90+ 高風險</div><div class="v" style="color:var(--bad)">236 萬</div></div>
</div>
<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">table_rows</span>應收帳齡明細（依帳齡天數排序）<span class="tag t-bad" style="margin-left:auto">90+ 須催收</span></h3><div class="scroll"><table class="data"><tr><th>客戶</th><th>客戶碼</th><th>發票</th><th>到期日</th><th>帳齡</th><th>金額(萬)</th><th>級距</th></tr>${AGE.map(a=>`<tr><td><b>${a[0]}</b></td><td>${a[1]}</td><td><code>${a[2]}</code></td><td>${a[3]}</td><td style="font-weight:800;color:${a[4]>90?'var(--bad)':a[4]>60?'#ea580c':a[4]>30?'var(--warn)':'var(--ok)'}">${a[4]} 天</td><td style="font-weight:700">${a[5]}</td><td><span class="tag ${a[7]}">${a[6]}</span></td></tr>`).join('')}</table></div></div>
 <div class="card"><h3><span class="material-symbols-outlined">bar_chart</span>各帳齡級距金額</h3><div class="chart" style="height:220px"><canvas id="c_grade"></canvas></div>
  <p style="font-size:11.5px;color:var(--mut);margin:12px 0 0">系統每日重算帳齡，逾 60 天自動生成催收工單並推播財務主管。</p>
 </div>
</div>`,
()=>`<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">assignment_late</span>催收工單佇列（依優先序 · 金額 × 帳齡）<span class="tag t-bad" style="margin-left:auto">高優先 2</span></h3>
  <div class="queue">${woRows()}</div>
 </div>
 <div class="card"><h3><span class="material-symbols-outlined">groups</span>催收專員負荷</h3>
  <div class="dp"><div class="nm">陳文彬</div><div class="bar"><i style="width:86%"></i></div><div class="vv">14 單</div></div>
  <div class="dp"><div class="nm">林佩儀</div><div class="bar"><i style="width:74%"></i></div><div class="vv">12 單</div></div>
  <div class="dp"><div class="nm">黃國豪</div><div class="bar"><i style="width:56%"></i></div><div class="vv">9 單</div></div>
