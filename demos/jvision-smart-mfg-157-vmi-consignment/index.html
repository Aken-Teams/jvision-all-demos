<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>供應商寄售與入廠庫存管理系統（VMI/Consignment）</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --amber:#A14000;
  --red:#B91C1C;
  --green:#166534;
  --cyan:#03687A;
  --shadow:6px 6px 0 #1E293B;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{
  margin:0;
  min-width:320px;
  color:var(--ink);
  background-color:var(--color-background);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:32px 32px;
  font-family:"Fira Sans",sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased
}
button{font:inherit}
button,.li,.fchip{cursor:pointer}
button:focus-visible,.li:focus-visible,.fchip:focus-visible{
  outline:4px solid var(--color-ring);
  outline-offset:3px
}
.ms{
  font-family:"Material Symbols Outlined";
  font-weight:400;
  font-style:normal;
  font-size:1.25rem;
  line-height:1;
  vertical-align:middle
}
.app{min-height:100vh}
.topbar{
  position:sticky;
  top:0;
  z-index:30;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:24px;
  min-height:84px;
  padding:12px clamp(16px,3vw,44px);
  color:#fff;
  background:var(--color-primary);
  border-bottom:4px solid var(--ink)
}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{
  display:grid;
  place-items:center;
  width:48px;
  height:48px;
  flex:0 0 auto;
  color:var(--ink);
  background:#fff;
  border:3px solid var(--ink);
  box-shadow:4px 4px 0 var(--ink)
}
.logo .ms{font-size:27px}
.brand-t{min-width:0}
.brand-t h1{
  overflow:hidden;
  margin:0;
  font-size:clamp(15px,2vw,21px);
  font-weight:800;
  letter-spacing:-.02em;
  text-overflow:ellipsis;
  white-space:nowrap
}
.brand-t p{margin:2px 0 0;font:500 11px/1.4 "Fira Code",monospace;opacity:.9}
.top-meta{display:flex;align-items:center;gap:18px}
.top-stat{padding-left:14px;border-left:2px solid rgba(255,255,255,.55);text-align:right}
.top-stat b{display:block;font:700 16px/1.1 "Fira Code",monospace}
.top-stat span{font-size:10px}
.top-user{display:flex;align-items:center;gap:8px;padding:7px 10px;color:var(--ink);background:#fff;border:3px solid var(--ink)}
.av{display:grid;place-items:center;width:28px;height:28px;color:#fff;background:var(--color-accent);font-weight:800}
.top-user>span{font-size:12px;font-weight:700}
.nav{
  position:sticky;
  top:84px;
  z-index:20;
  display:flex;
  gap:0;
  overflow-x:auto;
  padding:0 clamp(16px,3vw,44px);
  background:#fff;
  border-bottom:3px solid var(--ink);
  scrollbar-width:thin
}
.nav button{
  display:flex;
  align-items:center;
  gap:7px;
  min-height:52px;
  padding:8px 14px;
  color:var(--muted);
  background:#fff;
  border:0;
  border-right:2px solid var(--ink);
  font-size:12px;
  font-weight:700;
  white-space:nowrap
}
.nav button:first-child{border-left:2px solid var(--ink)}
.nav button:hover{color:var(--color-primary);background:var(--color-muted)}
.nav button.on{color:#fff;background:var(--ink);box-shadow:inset 0 -6px 0 var(--color-accent)}
.wrap{width:min(100%,1440px);margin:auto;padding:clamp(18px,3vw,42px)}
.screen-head{
  position:relative;
  margin:0 0 28px;
  padding:24px clamp(18px,4vw,48px);
  color:#fff;
  background:var(--ink);
  border:3px solid var(--ink);
  box-shadow:var(--shadow)
}
.screen-head:after{
  position:absolute;
  top:-3px;
  right:7%;
  width:18%;
  height:calc(100% + 6px);
  content:"";
  background:var(--color-primary);
  border:3px solid var(--ink);
  transform:skew(-12deg);
  pointer-events:none
}
.screen-head h2{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  gap:10px;
  max-width:75%;
  margin:0;
  font-size:clamp(22px,3vw,34px);
  font-weight:800;
  line-height:1.12;
  letter-spacing:-.035em
}
.screen-head h2 .ms{color:#fff;font-size:1em}
.screen-head p{position:relative;z-index:1;max-width:74%;margin:8px 0 0;color:#DCE7F7;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kpi{
  position:relative;
  min-width:0;
  padding:18px;
  background:#fff;
  border:3px solid var(--ink)
}
.kpi:nth-child(odd){transform:translateY(6px)}
.kpi:before{
  position:absolute;
  top:-3px;
  left:-3px;
  width:42px;
  height:7px;
  content:"";
  background:var(--color-accent);
  border:3px solid var(--ink)
}
.kl{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:700}
.kl .ms{color:var(--blue)}
.kv{
  overflow:hidden;
  margin-top:8px;
  font:800 clamp(22px,3vw,30px)/1.15 "Fira Code",monospace;
  letter-spacing:-.07em;
  text-overflow:ellipsis;
  white-space:nowrap
}
.kv small{margin-left:6px;color:var(--muted);font:600 12px "Fira Sans",sans-serif;letter-spacing:0}
.kd{display:flex;align-items:center;gap:4px;margin-top:7px;font-size:11px;font-weight:700}
.up{color:var(--green)}.warn{color:var(--amber)}.down{color:var(--red)}
.split{display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr);gap:22px;align-items:start}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.card{min-width:0;overflow:hidden;background:#fff;border:3px solid var(--ink);box-shadow:var(--shadow)}
.card-h{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:48px;
  padding:11px 15px;
  background:var(--color-muted);
  border-bottom:3px solid var(--ink);
  font-size:13px;
  font-weight:800;
  letter-spacing:.01em
}
.card-h .ms{color:var(--blue)}
.badge,.cnt{
  margin-left:auto;
  padding:2px 8px;
  color:#fff;
  background:var(--ink);
  border:2px solid var(--ink);
  font:700 10px "Fira Code",monospace;
  white-space:nowrap
}
.card-b{padding:16px}
.filter-row{display:flex;flex-wrap:wrap;gap:7px;padding:11px;border-bottom:2px solid var(--ink)}
.fchip{
  padding:5px 9px;
  color:var(--muted);
  background:#fff;
  border:2px solid var(--ink);
  font-size:11px;
  font-weight:700
}
.fchip:hover,.fchip.on{color:#fff;background:var(--blue)}
.list{max-height:560px;overflow:auto}
.li{
  display:flex;
  align-items:flex-start;
  gap:10px;
  min-width:0;
  padding:12px;
  border-bottom:2px solid var(--line)
}
.li:last-child{border-bottom:0}
.li:hover{background:var(--color-muted)}
.li.on{padding-left:8px;background:#DBEAFE;border-left:7px solid var(--blue)}
.ico{
  display:grid;
  place-items:center;
  width:35px;
  height:35px;
  flex:0 0 auto;
  color:#fff;
  background:var(--blue);
  border:2px solid var(--ink)
}
.mid{min-width:0;flex:1}
.mid b{display:block;overflow:hidden;font-size:13px;text-overflow:ellipsis;white-space:nowrap}
.mid span,.rt span{color:var(--muted);font:500 10.5px "Fira Code",monospace}
.rt{flex:0 0 auto;text-align:right}
.rt b{display:block;font:700 13px "Fira Code",monospace}
.dp-top{display:flex;align-items:flex-start;gap:14px;padding:17px;border-bottom:3px solid var(--ink)}
.dpi{display:grid;place-items:center;width:52px;height:52px;flex:0 0 auto;color:#fff;background:var(--color-accent);border:3px solid var(--ink)}
.dpi .ms{font-size:28px}
.dph{min-width:0;flex:1}
.dph h3{margin:0;font-size:17px;font-weight:800}
.dph p{margin:3px 0 0;color:var(--muted);font:500 11px/1.5 "Fira Code",monospace}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:16px}
.st{min-width:0;padding:11px;background:var(--color-background);border:2px solid var(--ink);margin:-1px}
.st .l{color:var(--muted);font-size:10px;font-weight:700}
.st .v{overflow:hidden;margin-top:3px;font:700 15px "Fira Code",monospace;text-overflow:ellipsis;white-space:nowrap}
.gauge-row{padding:0 16px 16px}
.gwrap{padding:13px;background:var(--color-muted);border:2px solid var(--ink)}
.gt{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px;font:700 11px "Fira Code",monospace}
.bar,.prog{height:12px;overflow:hidden;background:#fff;border:2px solid var(--ink)}
.bar i,.prog i{display:block;height:100%;background:var(--blue)}
.bar.warn i{background:#D97706}.bar.red i{background:var(--red)}
.chart{width:100%;height:280px}.chart.sm{height:230px}
.tbl-wrap{overflow-x:auto}
table{width:100%;min-width:540px;border-collapse:collapse;font-size:12px}
th{
  padding:11px 13px;
  color:#fff;
  background:var(--ink);
  border-right:1px solid #64748B;
  font-size:11px;
  font-weight:700;
  text-align:left;
  white-space:nowrap
}
td{padding:11px 13px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:nth-child(even){background:#F1F5F9}
tbody tr:hover{background:#DBEAFE}
th:nth-child(n+2),td.mono{text-align:right}
td:last-child,th:last-child{text-align:left}
.mono{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 7px;
  border:2px solid currentColor;
  font-size:10px;
  font-weight:800
}
.tag:before{content:"●";font-size:8px}
.t-ok{color:#14532D;background:#DCFCE7}.t-warn{color:#854D0E;background:#FEF3C7}
.t-red{color:#991B1B;background:#FEE2E2}.t-blue{color:#1E40AF;background:#DBEAFE}
.t-slate{color:#334155;background:#E2E8F0}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.col{min-width:0;padding:11px;background:var(--color-muted);border:3px solid var(--ink)}
.col-h{display:flex;align-items:center;gap:7px;margin-bottom:10px;font-size:12px;font-weight:800}
.dot{width:11px;height:11px;flex:0 0 auto;border:2px solid var(--ink)}
.tk{margin-bottom:9px;padding:10px;background:#fff;border:2px solid var(--ink)}
.tk:last-child{margin-bottom:0}
.tk b{display:block;overflow:hidden;font-size:12px;text-overflow:ellipsis;white-space:nowrap}
.tkm{display:flex;justify-content:space-between;gap:7px;margin-top:4px;color:var(--muted);font:500 10px "Fira Code",monospace}
.tk .prog{height:8px;margin-top:8px}
.tl{position:relative;padding-left:28px}
.tl:before{position:absolute;top:3px;bottom:5px;left:8px;width:3px;content:"";background:var(--ink)}
.tli{position:relative;padding:0 0 18px 4px}
.tli:before{position:absolute;top:2px;left:-27px;width:14px;height:14px;content:"";background:var(--blue);border:3px solid var(--ink)}
.tli.mut:before{background:#CBD5E1}
.tt{font-size:13px;font-weight:800}
.tm{color:var(--muted);font:500 10px "Fira Code",monospace}
.td{margin-top:3px;font-size:11.5px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;color:var(--muted);font-size:11px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border:2px solid var(--ink)}
.note{display:flex;align-items:flex-start;gap:7px;padding:11px 15px;color:var(--muted);background:#F8FAFC;border-top:2px dashed var(--ink);font-size:11px}
.note .ms{flex:0 0 auto;color:var(--blue)}
.mb16{margin-bottom:22px}
.reveal{animation:reveal .35s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1050px){.board{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:300px minmax(0,1fr)}}
@media(max-width:820px){
  .top-meta .top-stat{display:none}
  .split,.two{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .list{max-height:330px}
}
@media(max-width:560px){
  .topbar{min-height:72px;padding:10px 14px}
  .brand-t p,.top-user>span{display:none}
  .logo{width:42px;height:42px}
  .nav{top:72px;padding:0}
  .nav button{min-width:52px;justify-content:center;padding:8px 13px}
  .nav .lbl{display:none}
  .wrap{padding:16px 12px 28px}
  .screen-head{padding:20px 15px}
  .screen-head:after{width:14%}
  .screen-head h2,.screen-head p{max-width:84%}
  .screen-head p{font-size:11.5px}
  .board{grid-template-columns:1fr}
  .kpis{gap:10px}
  .kpi{padding:15px 11px}
  .kpi:nth-child(odd){transform:none}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;scroll-behavior:auto!important;transition:none!important}
  .reveal{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand">
    <div class="logo"><span class="ms">inventory_2</span></div>
    <div class="brand-t">
      <h1>供應商寄售與入廠庫存管理系統</h1>
      <p>VMI / Consignment · 寄售庫存協同與結算平台</p>
    </div>
  </div>
  <div class="top-meta">
    <div class="top-stat"><b>12</b><span>寄售供應商</span></div>
    <div class="top-stat"><b>NT$3.8M</b><span>在廠寄售貨值</span></div>
    <div class="top-user"><div class="av">采</div><span>採購部 · 林采潔</span></div>
  </div>
</header>
<nav class="nav" id="nav" aria-label="主要功能"></nav>
<main class="wrap"><div id="screen" class="reveal"></div></main>
</div>
<script>
(function(){
"use strict";
var scr=document.getElementById("screen"),nav=document.getElementById("nav"),charts=[],sel0=0,sel1=0,sel3=0;
var BLUE="#2563EB",ORANGE="#EA580C",AMBER="#A14000",RED="#DC2626",CYAN="#03687A";
var axis={axisLine:{lineStyle:{color:"#1E293B",width:2}},axisTick:{lineStyle:{color:"#1E293B"}},axisLabel:{color:"#475569",fontFamily:"Fira Code",fontSize:10},splitLine:{lineStyle:{color:"#E2E8F0"}}};
var NAV=[
["inventory_2","寄售庫存看板"],["rule","庫存水位設定"],["local_shipping","補貨入廠"],
["fact_check","領用扣帳"],["receipt_long","結算對帳"],["monitoring","週轉與缺料分析"]
];
nav.innerHTML=NAV.map(function(n,i){return '<button type="button" data-i="'+i+'" aria-label="'+n[1]+'"><span class="ms">'+n[0]+'</span><span class="lbl">'+n[1]+'</span></button>'}).join("");
nav.addEventListener("click",function(e){var b=e.target.closest("[data-i]");if(b)location.hash="v"+b.dataset.i});
function dispose(){charts.forEach(function(c){try{c.dispose()}catch(e){}});charts=[]}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts.push(c)}
window.addEventListener("resize",function(){charts.forEach(function(c){c.resize()})});
function head(ic,t,p){return '<div class="screen-head"><h2><span class="ms">'+ic+'</span>'+t+'</h2><p>'+p+'</p></div>'}
function kpi(ic,l,v,u,cl,d){var a=cl==="warn"?"priority_high":cl==="down"?"trending_down":"trending_up";return '<div class="kpi"><div class="kl"><span class="ms">'+ic+'</span>'+l+'</div><div class="kv">'+v+(u?'<small>'+u+'</small>':'')+'</div><div class="kd '+cl+'"><span class="ms">'+a+'</span>'+d+'</div></div>'}
function st(l,v){return '<div class="st"><div class="l">'+l+'</div><div class="v">'+v+'</div></div>'}
function tag(s){return s==="ok"?'<span class="tag t-ok">水位正常</span>':s==="low"?'<span class="tag t-warn">接近補貨點</span>':'<span class="tag t-red">低於安全庫存</span>'}
function timeline(t,m,d,mut){return '<div class="tli'+(mut?' mut':'')+'"><div class="tt">'+t+'</div><div class="tm">'+m+'</div><div class="td">'+d+'</div></div>'}
var ITEMS=[
["CSN-A104","高扭力軸承 6205ZZ","O盛精密",820,600,1400,"pcs",400,"ok",38],
["CSN-B221","O-Ring 密封圈 NBR-70","O豐橡塑",280,500,2000,"pcs",350,"crit",4.2],
["CSN-C078","不鏽鋼螺絲 M6x20","O鑫扣件",9600,6000,20000,"pcs",4000,"ok",1.1],
["CSN-D310","導熱矽膠片 1.5mm","O碩材料",150,300,1200,"片",200,"crit",22],
["CSN-E145","精密齒輪 Mod1.5","O盛精密",540,400,900,"pcs",250,"ok",96],
["CSN-F502","鋁擠型散熱鰭片","O鎰金屬",410,450,1500,"pcs",300,"low",31],
["CSN-G019","連接器 4Pin 防水","O宇電子",2100,1200,5000,"pcs",800,"ok",8.6],
["CSN-H267","潤滑油脂 EP2 (桶)","O碩材料",18,24,80,"桶",16,"low",1250]
];
function screen0(){
 var list=ITEMS.map(function(x,i){return '<div class="li'+(i===sel0?' on':'')+'" tabindex="0" data-r0="'+i+'"><div class="ico"><span class="ms">widgets</span></div><div class="mid"><b>'+x[1]+'</b><span>'+x[0]+' · '+x[2]+'</span></div><div class="rt"><b>'+x[3].toLocaleString()+'</b><span>'+x[6]+'</span></div></div>'}).join("");
 scr.innerHTML=head("inventory_2","寄售庫存看板","即時掌握各料號寄售在廠庫存與水位狀態，貨權仍屬供應商，領用後才移轉")+
 '<div class="kpis">'+kpi("inventory_2","在廠寄售料號","48","項","up","供應商貨權未結")+kpi("warning","低於補貨點","5","項","warn","需觸發補貨")+kpi("payments","在廠寄售貨值","NT$3.82M","","up","+6.4% 週增")+kpi("autorenew","本月自動補貨","23","次","up","覆蓋率 92%")+'</div>'+
 '<div class="split"><section class="card"><div class="card-h"><span class="ms">list_alt</span>寄售料號清單<span class="badge">'+ITEMS.length+' 項</span></div><div class="filter-row"><span class="fchip on" tabindex="0">全部</span><span class="fchip" tabindex="0">低水位</span><span class="fchip" tabindex="0">O盛精密</span><span class="fchip" tabindex="0">O碩材料</span></div><div class="list" id="list0">'+list+'</div></section><section class="card" id="detail0"></section></div>';
 document.getElementById("list0").onclick=function(e){var r=e.target.closest("[data-r0]");if(r){sel0=+r.dataset.r0;screen0()}};
 detail0()
}
