<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>供應商寄售與入廠庫存管理系統（VMI/Consignment）</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#16a34a; --accent2:#4ade80; --accent-d:#15803d;
  --bg:#f0f4f1; --panel:#ffffff; --ink:#0f1c14; --muted:#5c6b60;
  --line:#e2e8e4; --soft:#f6faf7; --chip:#dcfce7;
  --amber:#d97706; --red:#dc2626; --blue:#2563eb; --slate:#475569;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5;}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.app{display:flex;min-height:100vh;flex-direction:column;}
.topbar{display:flex;align-items:center;gap:14px;background:linear-gradient(100deg,#14532d,#16a34a 65%,#22c55e);color:#fff;padding:12px 20px;position:sticky;top:0;z-index:30;}
.brand{display:flex;align-items:center;gap:11px;min-width:0;}
.logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.logo .ms{font-size:23px;color:#fff;}
.brand-t{min-width:0;}
.brand-t h1{font-size:15px;margin:0;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brand-t p{font-size:11.5px;margin:1px 0 0;opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.top-meta{margin-left:auto;display:flex;align-items:center;gap:16px;min-width:0;}
.top-stat{text-align:right;min-width:0;}
.top-stat b{font-size:16px;font-weight:800;display:block;}
.top-stat span{font-size:10.5px;opacity:.82;}
.top-user{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:22px;}
.top-user .av{width:26px;height:26px;border-radius:50%;background:var(--accent2);color:#14532d;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;}
.top-user span{font-size:12px;font-weight:600;}
.nav{display:flex;flex-wrap:wrap;gap:7px;background:var(--panel);padding:9px 20px;border-bottom:1px solid var(--line);position:sticky;top:62px;z-index:20;}
.nav button{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--soft);color:var(--muted);padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;min-width:0;}
.nav button .ms{font-size:19px;}
.nav button:hover{border-color:var(--accent2);color:var(--accent-d);}
.nav button.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(22,163,74,.28);}
.wrap{padding:20px;max-width:1400px;margin:0 auto;width:100%;}
.screen-head{margin-bottom:16px;}
.screen-head h2{font-size:20px;margin:0;font-weight:800;display:flex;align-items:center;gap:9px;}
.screen-head h2 .ms{color:var(--accent);font-size:24px;}
.screen-head p{margin:4px 0 0;color:var(--muted);font-size:13px;}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px;}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px;position:relative;overflow:hidden;min-width:0;}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);}
.kpi .kl{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;}
.kpi .kl .ms{font-size:17px;color:var(--accent);}
.kpi .kv{font-size:25px;font-weight:800;margin-top:7px;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kpi .kv small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px;}
.kpi .kd{font-size:11.5px;margin-top:5px;font-weight:600;display:flex;align-items:center;gap:3px;}
.up{color:var(--accent-d);} .down{color:var(--red);} .warn{color:var(--amber);}
.split{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0;}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;}
.card-h .ms{font-size:19px;color:var(--accent);}
.card-h .badge{margin-left:auto;font-size:11px;font-weight:700;background:var(--chip);color:var(--accent-d);padding:3px 9px;border-radius:20px;white-space:nowrap;}
.card-b{padding:14px 16px;}
.filter-row{display:flex;gap:7px;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.filter-row .fchip{font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:16px;background:var(--soft);border:1px solid var(--line);color:var(--muted);cursor:pointer;}
.filter-row .fchip.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.list{max-height:560px;overflow-y:auto;}
.li{padding:12px 15px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:11px;align-items:flex-start;transition:.12s;min-width:0;}
.li:hover{background:var(--soft);}
.li.on{background:var(--chip);border-left:3px solid var(--accent);padding-left:12px;}
.li .ico{width:36px;height:36px;border-radius:9px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.li .ico .ms{font-size:20px;color:var(--accent);}
.li .mid{min-width:0;flex:1;}
.li .mid b{font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.li .mid span{font-size:11.5px;color:var(--muted);}
.li .rt{text-align:right;flex:0 0 auto;}
.li .rt b{font-size:14px;font-weight:800;}
.li .rt span{font-size:10.5px;color:var(--muted);display:block;}
.dp-top{display:flex;align-items:flex-start;gap:14px;padding:16px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.dp-top .dpi{width:52px;height:52px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.dp-top .dpi .ms{font-size:28px;color:#fff;}
.dp-top .dph{min-width:0;flex:1;}
.dp-top .dph h3{margin:0;font-size:17px;font-weight:800;}
.dp-top .dph p{margin:3px 0 0;font-size:12.5px;color:var(--muted);}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;padding:16px;}
.st{background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:11px 12px;min-width:0;}
.st .l{font-size:11px;color:var(--muted);font-weight:600;}
.st .v{font-size:17px;font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gauge-row{padding:0 16px 16px;}
.gwrap{background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:13px 15px;margin-top:2px;}
.gwrap .gt{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:7px;gap:8px;}
.bar{height:10px;border-radius:6px;background:#e6ebe7;overflow:hidden;}
.bar > i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.bar.warn > i{background:linear-gradient(90deg,#d97706,#fbbf24);}
.bar.red > i{background:linear-gradient(90deg,#dc2626,#f87171);}
.chart{width:100%;height:280px;overflow:hidden;}
.chart.sm{height:230px;}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:480px;}
th{text-align:left;padding:10px 13px;background:var(--soft);color:var(--muted);font-weight:700;font-size:11.5px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:10px 13px;border-bottom:1px solid var(--line);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--soft);}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:14px;}
.t-ok{background:#dcfce7;color:#15803d;} .t-warn{background:#fef3c7;color:#b45309;}
.t-red{background:#fee2e2;color:#b91c1c;} .t-blue{background:#dbeafe;color:#1d4ed8;}
.t-slate{background:#e2e8f0;color:#475569;}
.mono{font-variant-numeric:tabular-nums;font-weight:700;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;}
.col{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:11px;min-width:0;}
.col-h{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;margin-bottom:10px;}
.col-h .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
.col-h .cnt{margin-left:auto;font-size:11px;background:#fff;border:1px solid var(--line);padding:1px 8px;border-radius:12px;color:var(--muted);}
.tk{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 11px;margin-bottom:9px;}
.tk b{font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tk .tkm{font-size:11px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:6px;}
.tk .prog{height:6px;border-radius:4px;background:#eef2ee;margin-top:8px;overflow:hidden;}
.tk .prog > i{display:block;height:100%;background:var(--accent);}
.tl{position:relative;padding-left:24px;}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tli{position:relative;padding:0 0 16px 4px;}
.tli::before{content:"";position:absolute;left:-21px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent2);}
.tli.mut::before{background:#cbd5c9;box-shadow:0 0 0 2px #e2e8e4;}
.tli .tt{font-size:13px;font-weight:700;}
.tli .tm{font-size:11.5px;color:var(--muted);margin-top:2px;}
.tli .td{font-size:12px;margin-top:4px;color:#37463b;}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12px;color:var(--muted);}
.legend span{display:flex;align-items:center;gap:6px;}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}
.mb16{margin-bottom:16px;}
.note{font-size:11.5px;color:var(--muted);padding:11px 16px;background:var(--soft);border-top:1px dashed var(--line);display:flex;align-items:center;gap:7px;}
.note .ms{font-size:16px;color:var(--accent);flex:0 0 auto;}
@media(max-width:1080px){ .split{grid-template-columns:300px 1fr;} }
@media(max-width:860px){
  .split{grid-template-columns:1fr;}
  .board{grid-template-columns:repeat(2,1fr);}
  .list{max-height:340px;}
}
@media(max-width:820px){
  .kpis{grid-template-columns:repeat(2,1fr);}
  .two{grid-template-columns:1fr;}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:560px){
  .nav button span.lbl{display:none;}
  .nav button{padding:9px 12px;}
  .board{grid-template-columns:1fr;}
  .top-stat{display:none;}
  .top-user span{display:none;}
}
@media(max-width:430px){
  .kpis{grid-template-columns:1fr 1fr;}
  .stat-grid{grid-template-columns:1fr 1fr;}
  .wrap{padding:14px;}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo"><span class="ms">inventory_2</span></div>
      <div class="brand-t">
        <h1>供應商寄售與入廠庫存管理系統</h1>
        <p>VMI / Consignment · 寄售庫存協同與結算平台</p>
      </div>
    </div>
    <div class="top-meta">
      <div class="top-stat"><b>12</b><span>寄售供應商</span></div>
      <div class="top-stat"><b>NT$3.8M</b><span>在廠寄售貨值</span></div>
      <div class="top-user"><div class="av">采</div><span>採購部 · 林采潔</span></div>
    </div>
  </header>

  <nav class="nav" id="nav"></nav>

  <main class="wrap"><div id="screen"></div></main>
</div>

<script>
(function(){
"use strict";
var scr=document.getElementById("screen");
var navEl=document.getElementById("nav");
var charts=[];
function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
function mk(id,opt){
  var el=document.getElementById(id);
  if(!el)return;
  var c=echarts.init(el);
  c.setOption(opt);
  charts.push(c);
}
window.addEventListener("resize",function(){for(var i=0;i<charts.length;i++){try{charts[i].resize();}catch(e){}}});

var GREEN="#16a34a",GREEN2="#4ade80",AMBER="#d97706",RED="#dc2626",BLUE="#2563eb";
var axisBase={axisLine:{lineStyle:{color:"#d5ddd7"}},axisLabel:{color:"#5c6b60",fontSize:11},splitLine:{lineStyle:{color:"#eef2ee"}}};

var NAV=[
  {i:0,ic:"inventory_2",t:"寄售庫存看板"},
  {i:1,ic:"rule",t:"庫存水位設定"},
  {i:2,ic:"local_shipping",t:"補貨入廠"},
  {i:3,ic:"fact_check",t:"領用扣帳"},
  {i:4,ic:"receipt_long",t:"結算對帳"},
  {i:5,ic:"monitoring",t:"週轉與缺料分析"}
];
navEl.innerHTML=NAV.map(function(n){
  return '<button data-i="'+n.i+'"><span class="ms">'+n.ic+'</span><span class="lbl">'+n.t+'</span></button>';
}).join("");
navEl.addEventListener("click",function(e){
  var b=e.target.closest("[data-i]");if(!b)return;
  location.hash="v"+b.getAttribute("data-i");
});
function setNav(i){
  var bs=navEl.querySelectorAll("[data-i]");
  for(var k=0;k<bs.length;k++){bs[k].className=(+bs[k].getAttribute("data-i")===i)?"on":"";}
}

/* ============ shared fake data ============ */
var ITEMS=[
  {sku:"CSN-A104",name:"高扭力軸承 6205ZZ",sup:"永盛精密",qty:820,rop:600,max:1400,unit:"pcs",safe:400,st:"ok",price:38},
  {sku:"CSN-B221",name:"O-Ring 密封圈 NBR-70",sup:"泰豐橡塑",qty:280,rop:500,max:2000,unit:"pcs",safe:350,st:"crit",price:4.2},
  {sku:"CSN-C078",name:"不鏽鋼螺絲 M6x20",sup:"鴻鑫扣件",qty:9600,rop:6000,max:20000,unit:"pcs",safe:4000,st:"ok",price:1.1},
  {sku:"CSN-D310",name:"導熱矽膠片 1.5mm",sup:"晶碩材料",qty:150,rop:300,max:1200,unit:"片",safe:200,st:"crit",price:22},
  {sku:"CSN-E145",name:"精密齒輪 Mod1.5",sup:"永盛精密",qty:540,rop:400,max:900,unit:"pcs",safe:250,st:"ok",price:96},
  {sku:"CSN-F502",name:"鋁擠型散熱鰭片",sup:"合鎰金屬",qty:410,rop:450,max:1500,unit:"pcs",safe:300,st:"low",price:31},
  {sku:"CSN-G019",name:"連接器 4Pin 防水",sup:"聯宇電子",qty:2100,rop:1200,max:5000,unit:"pcs",safe:800,st:"ok",price:8.6},
  {sku:"CSN-H267",name:"潤滑油脂 EP2 (桶)",sup:"晶碩材料",qty:18,rop:24,max:80,unit:"桶",safe:16,st:"low",price:1250}
];
function stTag(s){
  if(s==="ok")return '<span class="tag t-ok">水位正常</span>';
  if(s==="low")return '<span class="tag t-warn">接近補貨點</span>';
  return '<span class="tag t-red">低於安全庫存</span>';
}
function pct(v,m){var p=Math.round(v/m*100);return p>100?100:(p<0?0:p);}

/* ================= SCREEN 0 : 寄售庫存看板 ================= */
var sel0=0;
function screen0(){
  var kpi='<div class="kpis">'+
    kpiC("inventory_2","在廠寄售料號","48","項","up","供應商貨權未結")+
    kpiC("warning","低於補貨點","5","項","warn","需觸發補貨")+
    kpiC("payments","在廠寄售貨值","NT$3.82M","","up","+6.4% 週增")+
    kpiC("autorenew","本月自動補貨","23","次","up","覆蓋率 92%")+
    '</div>';
  var listHtml=ITEMS.map(function(it,idx){
    return '<div class="li'+(idx===sel0?' on':'')+'" data-r0="'+idx+'">'+
      '<div class="ico"><span class="ms">widgets</span></div>'+
      '<div class="mid"><b>'+it.name+'</b><span>'+it.sku+' · '+it.sup+'</span></div>'+
      '<div class="rt"><b>'+it.qty.toLocaleString()+'</b><span>'+it.unit+'</span></div>'+
    '</div>';
  }).join("");
  var html=kpi+
  '<div class="split">'+
    '<div class="card">'+
      '<div class="card-h"><span class="ms">list_alt</span>寄售料號清單<span class="badge">'+ITEMS.length+' 項</span></div>'+
      '<div class="filter-row"><span class="fchip on">全部</span><span class="fchip">低水位</span><span class="fchip">永盛精密</span><span class="fchip">晶碩材料</span></div>'+
      '<div class="list" id="l0">'+listHtml+'</div>'+
    '</div>'+
    '<div class="card" id="d0"></div>'+
  '</div>';
  scr.innerHTML=headEl("inventory_2","寄售庫存看板","即時掌握各料號寄售在廠庫存與水位狀態，貨權仍屬供應商，領用後才移轉")+html;
  document.getElementById("l0").addEventListener("click",function(e){
    var r=e.target.closest("[data-r0]");if(!r)return;
    sel0=+r.getAttribute("data-r0");screen0();
  });
  renderD0();
}
function renderD0(){
  var it=ITEMS[sel0];
  var d=document.getElementById("d0");
  var lv=pct(it.qty,it.max);
  var barc=it.st==="crit"?"red":(it.st==="low"?"warn":"");
  var daily=Math.max(1,Math.round(it.rop/8));
  d.innerHTML=
    '<div class="dp-top">'+
      '<div class="dpi"><span class="ms">widgets</span></div>'+
      '<div class="dph"><h3>'+it.name+'</h3><p>'+it.sku+' · 供應商：'+it.sup+' · 單價 NT$'+it.price+'/'+it.unit+'</p></div>'+
      stTag(it.st)+
    '</div>'+
    '<div class="stat-grid">'+
      st("目前寄售庫存",it.qty.toLocaleString()+" "+it.unit)+
      st("補貨點 ROP",it.rop.toLocaleString())+
      st("安全庫存",it.safe.toLocaleString())+
      st("最高存量",it.max.toLocaleString())+
    '</div>'+
    '<div class="gauge-row">'+
      '<div class="gwrap"><div class="gt"><span>庫存水位</span><span>'+lv+'% ／ 上限 '+it.max.toLocaleString()+'</span></div>'+
      '<div class="bar '+barc+'"><i style="width:'+lv+'%"></i></div>'+
      '<div style="font-size:11.5px;color:var(--muted);margin-top:8px">日均用量 '+daily+' '+it.unit+' · 預估可用 '+Math.round(it.qty/daily)+' 天</div>'+
      '</div>'+
    '</div>'+
    '<div class="card-h" style="border-top:1px solid var(--line)"><span class="ms">show_chart</span>近 14 日庫存 vs 補貨點</div>'+
    '<div class="card-b"><div class="chart sm" id="c0line"></div></div>'+
    '<div class="note"><span class="ms">verified</span>貨權標記：供應商寄售中尚未產生應付；領用當下自動移轉貨權並轉列結算。</div>';
  void d.offsetHeight;
  var labels=[],data=[],cur=it.max*0.85;
  for(var j=13;j>=0;j--){labels.push("D-"+j);}
  for(var k=0;k<14;k++){cur-=it.rop/9*(0.7+Math.random()*0.6);if(cur<it.rop*0.6){cur=it.max*0.8;}data.push(Math.round(cur));}
  data[13]=it.qty;
  mk("c0line",{
    grid:{left:46,right:16,top:24,bottom:26},

/* ============ helpers ============ */
function headEl(ic,t,p){
  return '<div class="screen-head"><h2><span class="ms">'+ic+'</span>'+t+'</h2><p>'+p+'</p></div>';
}
function kpiC(ic,l,v,u,cls,d){
  var arrow=cls==="down"?"trending_down":(cls==="warn"?"priority_high":"trending_up");
  return '<div class="kpi"><div class="kl"><span class="ms">'+ic+'</span>'+l+'</div>'+
    '<div class="kv">'+v+(u?'<small>'+u+'</small>':'')+'</div>'+
    '<div class="kd '+cls+'"><span class="ms" style="font-size:14px">'+arrow+'</span>'+d+'</div></div>';
}
function st(l,v){return '<div class="st"><div class="l">'+l+'</div><div class="v">'+v+'</div></div>';}
function tli(t,m,d,mut){
  return '<div class="tli'+(mut?' mut':'')+'"><div class="tt">'+t+'</div><div class="tm">'+m+'</div><div class="td">'+d+'</div></div>';
}

var SCREENS=[screen0,screen1,screen2,screen3,screen4,screen5];
function show(i){
  disposeCharts();
  setNav(i);
  SCREENS[i]();
  void scr.offsetHeight;
}
window.show=show;

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
})();
</script>
