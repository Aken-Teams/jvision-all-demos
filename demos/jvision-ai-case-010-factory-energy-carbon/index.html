<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>能源碳排透視儀 · Factory Energy & Carbon</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--accent:#16a34a;--accent2:#22c55e;--sky:#0ea5e9;--ink:#0f2417;--bg:#f1f8f2;--card:#fff;--line:#dcece0;--mut:#5f7a68;--ok:#16a34a;--warn:#f59e0b;--bad:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.top{background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:11px 22px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#fff;flex:none;box-shadow:0 8px 18px rgba(22,163,74,.32)}
.brand b{font-size:15px;font-weight:800;display:block;font-family:"Noto Sans TC"}
.brand span{font-size:10px;color:var(--accent);letter-spacing:2px}
.nav{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap;min-width:0}
.nav button{border:0;background:transparent;color:var(--mut);font:inherit;font-weight:600;font-size:13px;padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:#eafaee;color:var(--accent)}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.wrap{max-width:1280px;margin:0 auto;padding:22px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.live{background:#dcfce7;color:#15803d;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpis>*{min-width:0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.3}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.1fr .9fr}
.g21{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#dcfce7;color:#15803d}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#e0f2fe;color:#0369a1}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#f2faf4}
table.data td b{font-family:"Noto Sans TC"}
.chart{height:260px}
.scroll{overflow-x:auto}
.alist{display:flex;flex-direction:column;gap:9px}
.al{display:flex;gap:11px;align-items:flex-start;border-left:3px solid var(--warn);background:#fffbeb;border-radius:0 10px 10px 0;padding:10px 12px}
.al.bad{border-color:var(--bad);background:#fef2f2}
.al.info{border-color:var(--sky);background:#f0f9ff}
.al .material-symbols-outlined{font-size:19px;color:var(--warn);flex:none}
.al.bad .material-symbols-outlined{color:var(--bad)}.al.info .material-symbols-outlined{color:var(--sky)}
.al b{font-size:12.5px;font-family:"Noto Sans TC"}
.al small{display:block;color:var(--mut);font-size:11px;margin-top:1px}
.al .tm{margin-left:auto;color:var(--mut);font-size:10.5px;white-space:nowrap;flex:none}
.mtr{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mtr>*{min-width:0}
.mc{border:1px solid var(--line);border-radius:14px;padding:15px;position:relative;overflow:hidden}
.mc .ch{position:absolute;left:0;top:0;width:5px;height:100%}
.mc b{font-family:"Noto Sans TC";font-size:13px;display:flex;align-items:center;gap:6px}
.mc .big{font-family:Inter;font-weight:800;font-size:24px;margin-top:6px}
.mc small{color:var(--mut);font-size:11px;display:block;margin-top:2px}
.mc .bar{height:6px;border-radius:4px;background:#eef4f0;margin-top:9px;overflow:hidden}
.mc .bar i{display:block;height:100%;border-radius:4px}
.tgt{display:flex;flex-direction:column;gap:12px}
.tr{border:1px solid var(--line);border-radius:13px;padding:13px 15px}
.tr .th{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tr .th b{font-family:"Noto Sans TC";font-size:13.5px}
.tr .prog{height:9px;background:#eef4f0;border-radius:6px;margin-top:10px;overflow:hidden}
.tr .prog i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.tr .meta{display:flex;gap:16px;margin-top:8px;font-size:11px;color:var(--mut);flex-wrap:wrap}
.tr .meta b{color:var(--ink);font-family:Inter}
.leaf{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.lc{border:1px solid var(--line);border-radius:13px;padding:13px;border-top:4px solid var(--accent)}
.lc b{font-family:"Noto Sans TC";font-size:13px}
.lc .big{font-family:Inter;font-weight:800;font-size:22px;color:var(--accent);margin-top:4px}
.lc small{color:var(--mut);font-size:11px;display:block}
.rpt{display:flex;flex-direction:column;gap:10px}
.rr{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.rr .ri{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.rr .mid b{font-size:13px;font-family:"Noto Sans TC"}
.rr .mid small{color:var(--mut);font-size:11px}
.chk{display:flex;flex-direction:column;gap:8px}
.ck{display:flex;align-items:center;gap:10px;font-size:12.5px;padding:8px 11px;border:1px solid var(--line);border-radius:10px}
.ck .material-symbols-outlined{font-size:19px}
.ck.d .material-symbols-outlined{color:var(--ok)}.ck.p .material-symbols-outlined{color:var(--warn)}
.dq{display:flex;gap:12px;flex-wrap:wrap}
.dq .qi{flex:1;min-width:120px;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;background:var(--card)}
.dq .qi .n{font-family:Inter;font-weight:800;font-size:22px}
.dq .qi small{color:var(--mut);font-size:11px;display:block;margin-top:2px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g21{grid-template-columns:1fr}.mtr{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:14px}.nav button span:not(.material-symbols-outlined){display:none}.nav button{padding:9px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo">碳</div><div><b>能源碳排透視儀</b><span>ENERGY &amp; CARBON</span></div></div>
  <nav class="nav" id="nav"></nav>
</header>
<main class="wrap">
  <div class="vh"><div><h2 id="vt">碳盤查戰情</h2><p id="vd"></p></div><div class="live">3 廠即時監控 · 本月 -12% 碳排</div></div>
  <div id="view"></div>
</main>
<script>
const MOD=[["碳盤查","co2","碳盤查戰情","範疇一二三排放盤查與減碳全局儀表"],
["能源監控","bolt","能源監控","電、水、氣即時用能監控與趨勢"],
["減碳目標","flag","減碳目標","減量目標設定與 SBT 路徑追蹤"],
["排放源管理","factory","排放源管理","排放源清冊、活動數據與係數庫"],
["永續報告","description","永續報告","GRI／ISO 14064 報告產出與揭露"],
["需量告警","notifications_active","需量告警","用電尖峰需量預警與異常核對"]];
const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span><span>'+m[0]+'</span>';b.onclick=()=>show(i);nav.appendChild(b);});

const METER=[["電力","bolt","#f59e0b",428500,"kWh",78,"較上月 +4%","dn"],["用水","water_drop","#0ea5e9",6240,"m³",52,"較上月 -3%","up"],["天然氣","local_fire_department","#dc2626",18900,"m³",64,"較上月 +1%","dn"],["蒸氣","cloud","#7c3aed",3120,"t",41,"較上月 -6%","up"],["壓縮空氣","air","#16a34a",92400,"Nm³",58,"較上月 +2%","dn"],["再生能源","solar_power","#22c55e",64200,"kWh",83,"較上月 +11%","up"]];
const SRC=[["S1-01","柴油鍋爐","範疇一","2.68 kg/L","342.5","tCO₂e","已驗證","t-ok"],["S1-02","堆高機用油","範疇一","2.27 kg/L","86.2","tCO₂e","已驗證","t-ok"],["S1-03","製程逸散","範疇一","GWP 1430","124.8","tCO₂e","待複核","t-warn"],["S2-01","外購電力","範疇二","0.494 kg/kWh","2116.4","tCO₂e","已驗證","t-ok"],["S3-01","上游運輸","範疇三","0.062 kg/tkm","408.7","tCO₂e","待補件","t-bad"],["S3-02","員工通勤","範疇三","0.171 kg/km","96.3","tCO₂e","待複核","t-warn"]];
const RPT=[["GRI 305 排放揭露","2024 年度 · 範疇一二三","description","#16a34a","已產出","t-ok"],["ISO 14064-1 盤查報告","第三方查證用版本","verified","#0ea5e9","查證中","t-warn"],["CDP 氣候問卷","B 級 → 目標 A-","assignment","#7c3aed","填報中","t-warn"],["TCFD 情境分析","1.5°C 轉型風險","insights","#f59e0b","草稿","t-info"]];
const CHK=[["活動數據完整率 99.2%","d"],["範疇一二三係數更新","d"],["前期差異 <20% 複核","d"],["第三方查證意見回覆","p"],["董事會 ESG 委員核簽","p"]];
const ALERT=[["A廠 需量逼近契約容量","即時需量 4820kW / 契約 5000kW，達 96.4%","bad","即時"],["空壓機群尖峰重疊","14:00 三台同時滿載，建議錯峰啟動","warn","8 分鐘前"],["B廠 用電較產量增幅異常","用電 +18% 但產量 +6%，建議查抄表","warn","1 小時前"],["再生能源躉售達成日目標","太陽能發電 6.4MWh，抵減 3.2tCO₂e","info","2 小時前"]];
const DEM=[["A廠",4820,5000,96.4,"t-bad"],["B廠",3180,4200,75.7,"t-warn"],["C廠",1960,3000,65.3,"t-ok"]];

function bar(pct,color){return '<div class="bar"><i style="width:'+pct+'%;background:'+color+'"></i></div>';}

const SCREENS=[
()=>`<div class="kpis">
 <div class="kpi"><span class="material-symbols-outlined ic">co2</span><div class="l">本月總碳排</div><div class="v">3175<small style="font-size:12px"> tCO₂e</small></div><div class="d up">▼ 較基準 12%</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">bolt</span><div class="l">碳密集度</div><div class="v">0.42<small style="font-size:12px"> t/件</small></div><div class="d up">▼ 較去年 8%</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">fact_check</span><div class="l">數據完整率</div><div class="v">99<small style="font-size:12px">%</small></div><div class="d up">▲ 較 64%</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">flag</span><div class="l">減碳目標達成</div><div class="v">83<small style="font-size:12px">%</small></div><div class="d" style="color:var(--mut)">2030 淨零路徑</div></div>
</div>
<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">donut_large</span>各範疇碳排結構<span class="tag t-info" style="margin-left:auto">tCO₂e</span></h3><div class="chart" id="c_donut" style="height:290px"></div></div>
 <div class="card"><h3><span class="material-symbols-outlined">flag</span>2030 減碳目標進度</h3><div class="chart" id="c_gauge" style="height:210px"></div><div style="display:flex;justify-content:space-around;font-size:11.5px;color:var(--mut);margin-top:4px"><span>基準年 3608t</span><span>目標 2165t</span></div></div>
</div>
<div class="card" style="margin-top:16px"><h3><span class="material-symbols-outlined">monitoring</span>近 12 月能源用量與碳排趨勢</h3><div class="chart" id="c_trend" style="height:280px"></div></div>`,
()=>`<div class="card"><h3><span class="material-symbols-outlined">bolt</span>能源即時用量（本月累計）</h3><div class="mtr">${METER.map(m=>`<div class="mc"><span class="ch" style="background:${m[2]}"></span><b><span class="material-symbols-outlined" style="color:${m[2]}">${m[1]}</span>${m[0]}</b><div class="big">${m[3].toLocaleString()}<small style="font-size:12px;display:inline;color:var(--mut)"> ${m[4]}</small></div><small class="${m[7]}">${m[6]}</small>${bar(m[5],m[2])}</div>`).join('')}</div></div>
<div class="grid g21" style="margin-top:16px"><div class="card"><h3><span class="material-symbols-outlined">show_chart</span>本日逐時用電負載</h3><div class="chart" id="c_load" style="height:250px"></div></div><div class="card"><h3><span class="material-symbols-outlined">pie_chart</span>用電區域佔比</h3><div class="chart" id="c_area" style="height:250px"></div></div></div>`,
()=>`<div class="kpis">
 <div class="kpi"><span class="material-symbols-outlined ic">trending_down</span><div class="l">累計減量</div><div class="v">1195<small style="font-size:12px"> tCO₂e</small></div><div class="d up">▲ 對比基準年</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">route</span><div class="l">SBT 路徑偏差</div><div class="v" style="color:var(--ok)">+3<small style="font-size:12px">%</small></div><div class="d up">領先減量曲線</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">eco</span><div class="l">再生能源占比</div><div class="v">31<small style="font-size:12px">%</small></div><div class="d" style="color:var(--mut)">目標 2030 → 60%</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">savings</span><div class="l">減碳專案數</div><div class="v">14</div><div class="d" style="color:var(--mut)">9 執行中 · 5 已結案</div></div>
</div>
<div class="grid g2"><div class="card"><h3><span class="material-symbols-outlined">flag</span>減碳目標與專案進度</h3><div class="tgt">
 <div class="tr"><div class="th"><b>製程節能改善</b><span class="tag t-ok">達成 88%</span></div><div class="prog"><i style="width:88%"></i></div><div class="meta"><span>減量 <b>320 t</b></span><span>負責 廠務部</span><span>目標 2025Q4</span></div></div>
 <div class="tr"><div class="th"><b>屋頂太陽能建置</b><span class="tag t-warn">達成 62%</span></div><div class="prog"><i style="width:62%"></i></div><div class="meta"><span>減量 <b>480 t</b></span><span>負責 綠能小組</span><span>目標 2026Q2</span></div></div>
 <div class="tr"><div class="th"><b>LED 全廠汰換</b><span class="tag t-ok">達成 100%</span></div><div class="prog"><i style="width:100%"></i></div><div class="meta"><span>減量 <b>95 t</b></span><span>負責 設備課</span><span>已結案</span></div></div>
 <div class="tr"><div class="th"><b>綠電採購（RE30）</b><span class="tag t-warn">達成 54%</span></div><div class="prog"><i style="width:54%"></i></div><div class="meta"><span>減量 <b>300 t</b></span><span>負責 採購部</span><span>目標 2026Q4</span></div></div>
</div></div>
<div class="card"><h3><span class="material-symbols-outlined">route</span>SBT 減量路徑 vs 實績</h3><div class="chart" id="c_path" style="height:300px"></div></div></div>`,
()=>`<div class="dq" style="margin-bottom:16px">
 <div class="qi"><div class="n" style="color:var(--accent)">128</div><small>排放源總數</small></div>
 <div class="qi"><div class="n">3175 <span style="font-size:12px">t</span></div><small>盤查總碳排</small></div>
 <div class="qi"><div class="n" style="color:var(--warn)">6</div><small>待複核／補件</small></div>
 <div class="qi"><div class="n" style="color:var(--ok)">94%</div><small>已驗證比例</small></div>
</div>
<div class="card"><h3><span class="material-symbols-outlined">factory</span>排放源清冊與係數庫<span class="tag t-info" style="margin-left:auto">ISO 14064-1</span></h3><div class="scroll"><table class="data"><tr><th>編號</th><th>排放源</th><th>範疇</th><th>排放係數</th><th>年碳排</th><th>單位</th><th>狀態</th></tr>${SRC.map(s=>`<tr><td><b style="color:var(--accent)">${s[0]}</b></td><td>${s[1]}</td><td>${s[2]}</td><td>${s[3]}</td><td><b>${s[4]}</b></td><td>${s[5]}</td><td><span class="tag ${s[7]}">${s[6]}</span></td></tr>`).join('')}</table></div><p style="font-size:11.5px;color:var(--mut);margin:13px 0 0">依 RULE-01：無原始憑證之活動數據不得納入正式盤查；待補件項目需上傳帳單佐證。</p></div>`,
()=>`<div class="grid g2"><div class="card"><h3><span class="material-symbols-outlined">description</span>永續報告與揭露文件</h3><div class="rpt">${RPT.map(r=>`<div class="rr"><span class="ri" style="background:${r[3]}"><span class="material-symbols-outlined">${r[2]}</span></span><div class="mid"><b>${r[0]}</b><small>${r[1]}</small></div><span class="tag ${r[5]}">${r[4]}</span></div>`).join('')}</div></div>
<div class="card"><h3><span class="material-symbols-outlined">checklist</span>揭露前查核清單</h3><div class="chk">${CHK.map(c=>`<div class="ck ${c[1]}"><span class="material-symbols-outlined">${c[1]=='d'?'check_circle':'schedule'}</span>${c[0]}</div>`).join('')}</div><div class="leaf" style="margin-top:14px"><div class="lc"><b>報告完成度</b><div class="big">86%</div><small>3/5 章節定稿</small></div><div class="lc"><b>查證覆蓋</b><div class="big">100%</div><small>三範疇皆納入</small></div></div></div></div>`,
()=>`<div class="grid g2"><div class="card"><h3><span class="material-symbols-outlined">notifications_active</span>需量與異常告警<span class="tag t-bad" style="margin-left:auto">1 緊急</span></h3><div class="alist">${ALERT.map(a=>`<div class="al ${a[2]}"><span class="material-symbols-outlined">${a[2]=='bad'?'priority_high':a[2]=='info'?'eco':'warning'}</span><div><b>${a[0]}</b><small>${a[1]}</small></div><span class="tm">${a[3]}</span></div>`).join('')}</div></div>
<div class="card"><h3><span class="material-symbols-outlined">speed</span>各廠需量負載率</h3><div class="tgt">${DEM.map(d=>`<div class="tr"><div class="th"><b>${d[0]}</b><span class="tag ${d[4]}">${d[3]}%</span></div><div class="prog"><i style="width:${d[3]}%;background:${d[3]>90?'linear-gradient(90deg,#dc2626,#f87171)':d[3]>75?'linear-gradient(90deg,#f59e0b,#fbbf24)':'linear-gradient(90deg,#16a34a,#22c55e)'}"></i></div><div class="meta"><span>即時 <b>${d[1].toLocaleString()} kW</b></span><span>契約 <b>${d[2].toLocaleString()} kW</b></span></div></div>`).join('')}</div><p style="font-size:11.5px;color:var(--mut);margin:14px 0 0">依 RULE-02：與前月差異超過 20% 之用能數據自動觸發需量核對與抄表複查。</p></div></div>`
];
