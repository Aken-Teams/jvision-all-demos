<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>能源碳排透視儀 · Factory Energy &amp; Carbon</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000000;
  --color-secondary:#10B981;
  --color-on-secondary:#0F172A;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#ECFDF5;
  --color-foreground:#064E3B;
  --color-card:#FFFFFF;
  --color-card-foreground:#064E3B;
  --color-muted:#E8F1F3;
  --color-muted-foreground:#475569;
  --color-border:#A7F3D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#059669;
  --blue:#059669;
  --ink:#064E3B;
  --muted:#475569;
  --line:#A7F3D0;
  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --sky:#0369A1;
  --bg:var(--color-background);
  --card:var(--color-card);
  --mut:var(--color-muted-foreground);
  --ok:#047857;
  --warn:#92400E;
  --bad:#B91C1C;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{
  margin:0;
  min-width:320px;
  background:
    linear-gradient(var(--line) 1px,transparent 1px),
    linear-gradient(90deg,var(--line) 1px,transparent 1px),
    var(--bg);
  background-size:48px 48px;
  color:var(--ink);
  font-family:"Fira Sans",sans-serif;
  line-height:1.45;
}
button{font:inherit}
button,a,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-size:20px;
  line-height:1;
  vertical-align:middle;
}
.top{
  position:sticky;
  top:0;
  z-index:20;
  display:grid;
  grid-template-columns:minmax(240px,340px) 1fr;
  align-items:stretch;
  border-bottom:3px solid var(--ink);
  background:rgba(255,255,255,.97);
}
.brand{
  display:flex;
  align-items:center;
  gap:14px;
  min-width:0;
  padding:12px 20px;
  border-right:3px solid var(--ink);
}
.logo{
  display:grid;
  flex:none;
  width:44px;
  height:44px;
  place-items:center;
  border:3px solid var(--ink);
  border-radius:0;
  background:var(--color-primary);
  color:#001E16;
  font-family:"Fira Code",monospace;
  font-size:18px;
  font-weight:700;
  box-shadow:5px 5px 0 var(--ink);
}
.brand b{
  display:block;
  font-size:15px;
  font-weight:700;
  letter-spacing:.02em;
}
.brand span{
  display:block;
  margin-top:2px;
  color:#047857;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:600;
  letter-spacing:.13em;
}
.nav{
  display:flex;
  align-items:stretch;
  justify-content:flex-end;
  min-width:0;
  overflow-x:auto;
  scrollbar-width:thin;
}
.nav button{
  display:flex;
  flex:0 0 auto;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:68px;
  padding:10px 14px;
  border:0;
  border-left:1px solid var(--line);
  border-radius:0;
  background:#fff;
  color:var(--muted);
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  transition:background-color .18s ease,color .18s ease;
}
.nav button:hover{background:#D1FAE5;color:var(--ink)}
.nav button.on{
  background:var(--color-primary);
  color:#001E16;
  box-shadow:inset 0 -6px 0 var(--ink);
}
.nav button .material-symbols-outlined{font-size:19px}
.wrap{
  width:min(100%,1400px);
  margin:0 auto;
  padding:28px 28px 52px;
}
.vh{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:end;
  gap:24px;
  margin-bottom:20px;
  padding:20px 22px;
  border:3px solid var(--ink);
  background:#fff;
  box-shadow:8px 8px 0 rgba(6,78,59,.18);
}
.vh h2{
  margin:0;
  max-width:800px;
  font-size:clamp(25px,3vw,42px);
  font-weight:700;
  letter-spacing:-.04em;
  line-height:1.05;
}
.vh p{margin:8px 0 0;color:var(--muted);font-size:13px}
.live{
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 12px;
  border:2px solid var(--ink);
  border-radius:0;
  background:#D1FAE5;
  color:#064E3B;
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
.live::before{
  content:"";
  width:9px;
  height:9px;
  border:2px solid var(--ink);
  background:var(--color-secondary);
}
.kpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:0;
  margin-bottom:18px;
  border:3px solid var(--ink);
  background:var(--ink);
}
.kpi{
  position:relative;
  min-width:0;
  min-height:142px;
  padding:18px;
  overflow:hidden;
  border-right:1px solid var(--ink);
  background:#fff;
}
.kpi:last-child{border-right:0}
.kpi:nth-child(even){background:#F0FDFA}
.kpi .l{
  padding-right:34px;
  color:var(--muted);
  font-size:11px;
  font-weight:600;
  letter-spacing:.05em;
  text-transform:uppercase;
}
.kpi .v{
  margin-top:12px;
  font-family:"Fira Code",monospace;
  font-size:clamp(24px,2.5vw,34px);
  font-weight:700;
  letter-spacing:-.06em;
  line-height:1;
  font-variant-numeric:tabular-nums;
}
.kpi .v small{letter-spacing:0}
.kpi .d{margin-top:10px;font-size:11px;font-weight:700}
.kpi .ic{
  position:absolute;
  top:14px;
  right:14px;
  display:grid;
  width:32px;
  height:32px;
  place-items:center;
  border:2px solid currentColor;
  color:var(--accent);
  opacity:1;
}
.up{color:#047857}
.dn{color:#B91C1C}
.grid{display:grid;gap:18px}
.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.15fr) minmax(360px,.85fr)}
.g21{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{
  min-width:0;
  padding:18px;
  border:3px solid var(--ink);
  border-radius:0;
  background:var(--card);
  color:var(--color-card-foreground);
  box-shadow:7px 7px 0 rgba(6,78,59,.15);
}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 16px;
  padding-bottom:12px;
  border-bottom:2px solid var(--ink);
  font-size:14px;
  font-weight:700;
  letter-spacing:.01em;
}
.card h3 .material-symbols-outlined{
  display:grid;
  width:28px;
  height:28px;
  place-items:center;
  background:var(--accent);
  color:#001E16;
}
.tag{
  display:inline-flex;
  align-items:center;
  min-height:24px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:0;
  font-size:10px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
}
.t-ok{background:#D1FAE5;color:#065F46}
.t-warn{background:#FEF3C7;color:#78350F}
.t-bad{background:#FEE2E2;color:#991B1B}
.t-info{background:#E0F2FE;color:#075985}
.scroll{
  overflow-x:auto;
  border:2px solid var(--ink);
}
table.data{
  width:100%;
  min-width:760px;
  border-collapse:collapse;
  background:#fff;
  font-size:12px;
}
table.data th,table.data td{
  padding:11px 12px;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  text-align:left;
  vertical-align:middle;
}
table.data th:last-child,table.data td:last-child{border-right:0}
table.data tr:last-child td{border-bottom:0}
table.data th{
  position:sticky;
  top:0;
  background:var(--ink);
  color:#fff;
  font-size:11px;
  font-weight:700;
  letter-spacing:.04em;
  white-space:nowrap;
}
table.data tbody tr:nth-child(even){background:#F0FDFA}
table.data tbody tr:hover{background:#D1FAE5}
table.data td:first-child,
table.data td:nth-child(4),
table.data td:nth-child(5),
table.data td:nth-child(6){
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
table.data th:nth-child(5),table.data td:nth-child(5){text-align:right}
table.data td b{font-weight:700}
.chart{height:260px}
.alist{display:flex;flex-direction:column;gap:10px}
.al{
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  gap:12px;
  align-items:start;
  padding:12px;
  border:2px solid #92400E;
  border-left:8px solid #92400E;
  border-radius:0;
  background:#FFFBEB;
}
.al.bad{border-color:#991B1B;background:#FEF2F2}
.al.info{border-color:#075985;background:#F0F9FF}
.al .material-symbols-outlined{color:#92400E}
.al.bad .material-symbols-outlined{color:#991B1B}
.al.info .material-symbols-outlined{color:#075985}
.al b{font-size:12px}
.al small{display:block;margin-top:3px;color:var(--muted);font-size:11px}
.al .tm{
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:10px;
  white-space:nowrap;
}
.mtr{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}
.mc{
  position:relative;
  min-width:0;
  min-height:154px;
  overflow:hidden;
  padding:15px;
  border:2px solid var(--ink);
  border-radius:0;
  background:#fff;
}
.mc:nth-child(even){background:#F0FDFA}
.mc .ch{position:absolute;top:0;left:0;width:100%;height:6px}
.mc b{display:flex;align-items:center;gap:7px;font-size:12px}
.mc .big{
  margin-top:14px;
  font-family:"Fira Code",monospace;
  font-size:23px;
  font-weight:700;
  letter-spacing:-.05em;
  font-variant-numeric:tabular-nums;
}
.mc small{display:block;margin-top:5px;color:var(--muted);font-size:10px}
.bar{
  height:9px;
  margin-top:12px;
  overflow:hidden;
  border:1px solid var(--ink);
  border-radius:0;
  background:#fff;
}
.bar i{display:block;height:100%;border-right:2px solid var(--ink)}
.tgt{display:flex;flex-direction:column;gap:10px}
.tr{
  padding:13px;
  border:2px solid var(--ink);
  border-radius:0;
  background:#fff;
}
.tr:nth-child(even){background:#F0FDFA}
.tr .th{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.tr .th b{font-size:12px}
.tr .prog{
  height:11px;
  margin-top:11px;
  overflow:hidden;
  border:1px solid var(--ink);
  border-radius:0;
  background:#fff;
}
.tr .prog i{
  display:block;
  height:100%;
  border-right:2px solid var(--ink);
  background:var(--accent);
}
.tr .meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px 18px;
  margin-top:9px;
  color:var(--muted);
  font-size:10px;
}
.tr .meta b{
  color:var(--ink);
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
.leaf{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px;
}
.lc{
  padding:13px;
  border:2px solid var(--ink);
  border-top:8px solid var(--accent);
  border-radius:0;
}
.lc b{font-size:12px}
.lc .big{
  margin-top:6px;
  color:#047857;
  font-family:"Fira Code",monospace;
  font-size:24px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.lc small{display:block;color:var(--muted);font-size:10px}
.rpt{display:flex;flex-direction:column;gap:10px}
.rr{
  display:grid;
  grid-template-columns:42px minmax(0,1fr) auto;
  gap:12px;
  align-items:center;
  padding:11px;
  border:2px solid var(--ink);
  border-radius:0;
}
.rr:nth-child(even){background:#F0FDFA}
.rr .ri{
  display:grid;
  width:42px;
  height:42px;
  place-items:center;
  border:2px solid var(--ink);
  border-radius:0;
  color:#fff;
}
.rr .mid b{display:block;font-size:12px}
.rr .mid small{display:block;color:var(--muted);font-size:10px}
.chk{display:flex;flex-direction:column;gap:8px}
.ck{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:42px;
  padding:8px 10px;
  border:2px solid var(--ink);
  border-radius:0;
  font-size:12px;
}
.ck.d{background:#ECFDF5}
.ck.p{background:#FFFBEB}
.ck.d .material-symbols-outlined{color:#047857}
.ck.p .material-symbols-outlined{color:#92400E}
.dq{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:0;
  border:3px solid var(--ink);
  background:var(--ink);
}
.dq .qi{
  min-width:0;
  padding:16px 12px;
  border-right:1px solid var(--ink);
  border-radius:0;
  background:#fff;
  text-align:center;
}
.dq .qi:last-child{border-right:0}
.dq .qi:nth-child(even){background:#F0FDFA}
.dq .qi .n{
  font-family:"Fira Code",monospace;
  font-size:25px;
  font-weight:700;
  letter-spacing:-.05em;
  font-variant-numeric:tabular-nums;
}
.dq .qi small{display:block;margin-top:4px;color:var(--muted);font-size:10px}
#view>.card,#view>.grid,#view>.kpis,#view>.dq{
  animation:reveal .35s ease-out both;
}
@keyframes reveal{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:none}
}
@media(max-width:1024px){
  .top{grid-template-columns:1fr}
  .brand{border-right:0;border-bottom:2px solid var(--ink)}
  .nav{justify-content:flex-start}
  .nav button{min-height:52px}
  .g2,.g21{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(2){border-right:0}
  .kpi:nth-child(-n+2){border-bottom:1px solid var(--ink)}
}
@media(max-width:768px){
  .wrap{padding:18px 16px 40px}
  .vh{grid-template-columns:1fr;align-items:start}
  .live{justify-self:start;white-space:normal}
  .mtr{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dq{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dq .qi:nth-child(2){border-right:0}
  .dq .qi:nth-child(-n+2){border-bottom:1px solid var(--ink)}
}
@media(max-width:480px){
  .brand{padding:10px 14px}
  .logo{width:40px;height:40px;box-shadow:4px 4px 0 var(--ink)}
  .brand b{font-size:14px}
  .nav button{min-width:50px;padding:9px 12px}
  .nav button span:not(.material-symbols-outlined){display:none}
  .wrap{padding:14px 10px 32px}
  .vh{padding:16px;box-shadow:5px 5px 0 rgba(6,78,59,.18)}
  .vh h2{font-size:27px}
  .kpis{grid-template-columns:1fr}
  .kpi{border-right:0;border-bottom:1px solid var(--ink)!important}
  .kpi:last-child{border-bottom:0!important}
  .mtr{grid-template-columns:1fr}
  .card{padding:14px;box-shadow:5px 5px 0 rgba(6,78,59,.15)}
  .rr{grid-template-columns:42px minmax(0,1fr)}
  .rr>.tag{grid-column:2;justify-self:start}
  .al{grid-template-columns:auto minmax(0,1fr)}
  .al .tm{grid-column:2}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  #view>.card,#view>.grid,#view>.kpis,#view>.dq{animation:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">碳</div>
    <div><b>能源碳排透視儀</b><span>ENERGY &amp; CARBON</span></div>
  </div>
  <nav class="nav" id="nav" aria-label="主要功能"></nav>
</header>
<main class="wrap">
  <div class="vh">
    <div><h2 id="vt">碳盤查戰情</h2><p id="vd"></p></div>
    <div class="live">監控正常｜3 廠即時監控 · 本月 -12% 碳排</div>
  </div>
  <div id="view"></div>
</main>
<script>
const MOD=[
["碳盤查","co2","碳盤查戰情","範疇一二三排放盤查與減碳全局儀表"],
["能源監控","bolt","能源監控","電、水、氣即時用能監控與趨勢"],
["減碳目標","flag","減碳目標","減量目標設定與 SBT 路徑追蹤"],
["排放源管理","factory","排放源管理","排放源清冊、活動數據與係數庫"],
["永續報告","description","永續報告","GRI／ISO 14064 報告產出與揭露"],
["需量告警","notifications_active","需量告警","用電尖峰需量預警與異常核對"]
];
const nav=document.getElementById("nav");
const view=document.getElementById("view");
const vt=document.getElementById("vt");
const vd=document.getElementById("vd");
let charts=[];

MOD.forEach((m,i)=>{
  const b=document.createElement("button");
  b.type="button";
  b.dataset.i=i;
  b.className=i===0?"on":"";
  b.setAttribute("aria-current",i===0?"page":"false");
  b.innerHTML='<span class="material-symbols-outlined" aria-hidden="true">'+m[1]+'</span><span>'+m[0]+'</span>';
  b.onclick=()=>{location.hash="v"+i};
  nav.appendChild(b);
});

const METER=[
["電力","bolt","#D97706",428500,"kWh",78,"較上月 +4%","dn"],
["用水","water_drop","#0369A1",6240,"m³",52,"較上月 -3%","up"],
["天然氣","local_fire_department","#B91C1C",18900,"m³",64,"較上月 +1%","dn"],
["蒸氣","cloud","#6D28D9",3120,"t",41,"較上月 -6%","up"],
["壓縮空氣","air","#047857",92400,"Nm³",58,"較上月 +2%","dn"],
["再生能源","solar_power","#059669",64200,"kWh",83,"較上月 +11%","up"]
];
const SRC=[
["S1-01","柴油鍋爐","範疇一","2.68 kg/L","342.5","tCO₂e","已驗證","t-ok"],
["S1-02","堆高機用油","範疇一","2.27 kg/L","86.2","tCO₂e","已驗證","t-ok"],
["S1-03","製程逸散","範疇一","GWP 1430","124.8","tCO₂e","待複核","t-warn"],
["S2-01","外購電力","範疇二","0.494 kg/kWh","2116.4","tCO₂e","已驗證","t-ok"],
["S3-01","上游運輸","範疇三","0.062 kg/tkm","408.7","tCO₂e","待補件","t-bad"],
["S3-02","員工通勤","範疇三","0.171 kg/km","96.3","tCO₂e","待複核","t-warn"]
];
const RPT=[
["GRI 305 排放揭露","2024 年度 · 範疇一二三","description","#047857","已產出","t-ok"],
["ISO 14064-1 盤查報告","第三方查證用版本","verified","#0369A1","查證中","t-warn"],
["CDP 氣候問卷","B 級 → 目標 A-","assignment","#6D28D9","填報中","t-warn"],
["TCFD 情境分析","1.5°C 轉型風險","insights","#B45309","草稿","t-info"]
];
const CHK=[
["活動數據完整率 99.2%","d"],
["範疇一二三係數更新","d"],
["前期差異 <20% 複核","d"],
["第三方查證意見回覆","p"],
["董事會 ESG 委員核簽","p"]

function fromHash(){
  const m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);

}
