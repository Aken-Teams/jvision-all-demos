<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>語言口說練習艙 · Language Speaking Coach</title>
<meta name="description" content="口說練習主題、AI 發音評分、錄音回饋、每日打卡到成效追蹤（純 UI 展示）。"/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{--accent:#f43f5e;--accent2:#fb7185;--ink:#3f0a1a;--bg:#fdf2f5;--card:#fff;--line:#fbd8e1;--soft:#fff1f4;--mut:#9a6474;--ok:#16a34a;--warn:#f59e0b;--bad:#e11d48;--info:#7c3aed}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.shell{display:grid;grid-template-columns:242px 1fr;min-height:100vh}
.shell>*{min-width:0}
/* sidebar */
.side{background:linear-gradient(180deg,#fff,#fff5f7);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto;min-width:0}
.side .bd{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.side .lg{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 8px 20px rgba(244,63,94,.4)}
.side .lg .material-symbols-outlined{font-size:26px}
.side .bd b{font-size:15px;font-weight:800;font-family:"Noto Sans TC";display:block}
.side .bd span{font-size:9px;color:var(--accent);letter-spacing:1.5px}
.side button{display:flex;align-items:center;gap:11px;background:transparent;border:0;color:#7a4a58;font:inherit;font-weight:600;font-size:13.5px;padding:10px 12px;border-radius:11px;cursor:pointer;text-align:left;width:100%;font-family:"Noto Sans TC"}
.side button .material-symbols-outlined{font-size:20px;color:#e79bad}
.side button:hover{background:#ffe4ea}
.side button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(244,63,94,.32)}
.side button.on .material-symbols-outlined{color:#fff}
.side .streak{margin-top:14px;background:linear-gradient(135deg,#fff1f4,#ffe0e8);border:1px solid var(--line);border-radius:14px;padding:12px 13px}
.side .streak .fire{display:flex;align-items:center;gap:7px;font-weight:800;font-family:"Noto Sans TC";font-size:13px}
.side .streak .fire .material-symbols-outlined{color:#f97316;font-size:22px}
.side .streak .n{font-family:Inter;font-weight:900;font-size:26px;color:var(--accent);line-height:1.1;margin-top:4px}
.side .streak small{font-size:11px;color:var(--mut);display:block}
.side .foot{margin-top:auto;padding:12px 10px 2px;font-size:11px;color:var(--mut);border-top:1px solid var(--line);line-height:1.8}
/* main */
.main{padding:22px 24px;min-width:0}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.live{background:#ffe0e8;color:#be123c;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:p 1.4s infinite}
@keyframes p{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(244,63,94,.5)}50%{opacity:.35;box-shadow:0 0 0 6px rgba(244,63,94,0)}}
/* kpi */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden;min-width:0}
.kpi .l{font-size:12px;color:var(--mut);font-weight:700}
.kpi .v{font-size:25px;font-weight:900;margin-top:4px;font-family:Inter}
.kpi .v small{font-size:12px;color:var(--mut);font-weight:700}
.kpi .d{font-size:11px;font-weight:800;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.24}
.up{color:var(--ok)}.dn{color:var(--bad)}
/* grid */
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .95fr}
.g21{grid-template-columns:1.5fr 1fr}
.g11{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";font-weight:800;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.card h3 .grow{margin-left:auto;font-size:12px;font-weight:700;color:var(--accent)}
.tag{font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:20px;white-space:nowrap;display:inline-block}
.t-ok{background:#dcfce7;color:#15803d}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#ffe1e6;color:#be123c}.t-info{background:#ede9fe;color:#6d28d9}.t-rose{background:#ffe0e8;color:#be123c}
.chart{width:100%;min-height:60px}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:800;font-size:11px;background:var(--soft)}
table.data tr:hover td{background:var(--soft)}
.scroll{overflow-x:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.note{font-size:11.5px;color:var(--mut);margin:13px 0 0;line-height:1.6}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 15px;border-radius:10px;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font:inherit;font-weight:800;font-size:12.5px;cursor:pointer;font-family:"Noto Sans TC"}
.btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--line)}
.btn .material-symbols-outlined{font-size:18px}
/* practice topic cards */
.topics{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.topics>*{min-width:0}
.tp{border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:#fff;border-top:3px solid var(--accent);position:relative}
.tp.on{background:linear-gradient(135deg,#fff1f4,#fff);box-shadow:0 8px 20px rgba(244,63,94,.14)}
.tp .th{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.tp .ei{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#ffe0e8;color:var(--accent);flex:none}
.tp .ei .material-symbols-outlined{font-size:20px}
.tp b{font-size:13.5px;font-family:"Noto Sans TC"}
.tp small{color:var(--mut);font-size:11px;display:block}
.tp .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--mut)}
.tp .meta span{display:flex;align-items:center;gap:3px}
.tp .meta .material-symbols-outlined{font-size:14px}
.tp .pg{height:6px;background:#ffe0e8;border-radius:6px;overflow:hidden;margin-top:9px}
.tp .pg i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
/* practice card / recorder */
.rec{background:linear-gradient(135deg,#fff5f7,#fff);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.rec .scene{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--accent);font-weight:800;margin-bottom:8px}
.rec .sent{font-size:17px;font-weight:700;font-family:"Noto Sans TC";line-height:1.5;margin:4px 0}
.rec .ipa{color:var(--mut);font-size:12.5px;margin-top:3px}
.wave{display:flex;align-items:center;gap:2px;height:64px;margin:14px 0;padding:0 4px}
.wave i{flex:1;background:linear-gradient(180deg,var(--accent2),var(--accent));border-radius:2px;opacity:.85}
.recbar{display:flex;align-items:center;gap:12px;margin-top:6px}
.recbtn{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 8px 20px rgba(244,63,94,.4);border:0;cursor:pointer}
.recbtn .material-symbols-outlined{font-size:26px}
.recbar .rt{font-family:Inter;font-weight:900;font-size:18px}
.recbar .rt small{font-size:11px;color:var(--mut);font-weight:600;display:block}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--accent);display:grid;place-items:center;cursor:pointer;flex:none}
/* score ring */
.scorehero{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring{width:120px;height:120px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--accent) 0 87%,#ffe0e8 87% 100%)}
.ring .in{width:92px;height:92px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center}
.ring .in b{font-size:30px;font-weight:900;font-family:Inter;color:var(--accent);line-height:1}
.ring .in span{font-size:11px;color:var(--mut)}
.scols{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;flex:1;min-width:0}
.sc{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.sc .sl{font-size:11.5px;color:var(--mut);font-weight:700;display:flex;justify-content:space-between}
.sc .sv{font-size:19px;font-weight:900;font-family:Inter;margin-top:2px}
.sc .pg{height:6px;background:#ffe0e8;border-radius:6px;overflow:hidden;margin-top:6px}
.sc .pg i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
/* feedback line-by-line */
.fbk{display:flex;flex-direction:column;gap:11px}
.fl{border:1px solid var(--line);border-radius:13px;padding:12px 14px;border-left:4px solid var(--ok)}
.fl.warn{border-left-color:var(--warn);background:#fffdf5}
.fl.bad{border-left-color:var(--bad);background:#fffafb}
.fl .ft{font-size:14px;font-family:"Noto Sans TC";font-weight:700;line-height:1.5}
.fl .ft em{font-style:normal;background:#ffe0e8;color:var(--bad);border-radius:4px;padding:0 3px;font-weight:800}
.fl .ft em.ok{background:#dcfce7;color:#15803d}
.fl .fm{font-size:11.5px;color:var(--mut);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
.fl .fm span{display:flex;align-items:center;gap:4px}
.fl .fm b{color:var(--ink)}
.fl .adv{font-size:12px;color:#7a4a58;margin-top:6px;line-height:1.6;background:var(--soft);border-radius:9px;padding:8px 10px}
.fl .adv b{color:var(--accent)}
/* calendar heat */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .d{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#b98a97;background:#fdeef2}
.cal .d.l1{background:#fecdd8;color:#9f1239}.cal .d.l2{background:#fb7185;color:#fff}.cal .d.l3{background:#f43f5e;color:#fff}.cal .d.l4{background:#be123c;color:#fff}
.cal .hd{font-size:10.5px;color:var(--mut);text-align:center;font-weight:700}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.bg{border:1px solid var(--line);border-radius:13px;padding:12px;text-align:center;background:#fff}
.bg.lock{opacity:.5}
.bg .bi{width:44px;height:44px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.bg.lock .bi{background:#e5cfd6}
.bg b{font-size:12px;font-family:"Noto Sans TC";display:block}
.bg small{font-size:10.5px;color:var(--mut)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.stc{background:var(--soft);border-radius:13px;padding:13px;text-align:center}
.stc b{display:block;font-size:22px;font-weight:900;font-family:Inter;color:var(--ink)}
.stc span{font-size:11.5px;color:var(--mut)}
/* progress list rows */
.prow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}.prow:first-of-type{border-top:0}
.prow .av{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;font-family:"Noto Sans TC"}
.prow .in{flex:1;min-width:0}.prow .in b{font-size:13px;font-family:"Noto Sans TC"}.prow .in small{display:block;color:var(--mut);font-size:11.5px}
.prow .lv{font-family:Inter;font-weight:900;font-size:15px;flex:none}
@media(max-width:860px){
 .shell{grid-template-columns:1fr}
 .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;overflow:visible}
 .side .bd{width:100%;padding-bottom:8px}
 .side button{width:auto;flex:none}
 .side .streak,.side .foot{display:none}
 .kpis{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:820px){
 .g2,.g21,.g11{grid-template-columns:1fr}
 .topics{grid-template-columns:1fr}
}
@media(max-width:430px){
 .kpis{grid-template-columns:1fr}
 .main{padding:16px 14px}
}
</style>
</head>
<body>

MOD.forEach(function(m,i){var b=document.createElement('button');b.dataset.i=i;b.className=i===0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span>'+m[0];b.onclick=function(){show(i);};nav.appendChild(b);});

function wave(n,seed){var s='';for(var i=0;i<n;i++){var h=20+Math.abs(Math.sin((i+seed)*1.3)*70)+((i*7+seed)%13);h=Math.min(100,h);s+='<i style="height:'+h.toFixed(0)+'%"></i>';}return s;}

var SCREENS=[
// 0 學習總覽
function(){return '<div class="kpis">'+

function draw(i){
