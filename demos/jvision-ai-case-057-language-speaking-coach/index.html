<style>
:root{
 --color-primary:#4F46E5;--color-on-primary:#FFF;--color-secondary:#818CF8;
 --color-on-secondary:#0F172A;--color-accent:#EA580C;--color-on-accent:#000;
 --color-background:#EEF2FF;--color-foreground:#1E1B4B;--color-card:#FFF;
 --color-card-foreground:#1E1B4B;--color-muted:#EBEEF8;--color-muted-foreground:#475569;
 --color-border:#C7D2FE;--color-destructive:#DC2626;--color-on-destructive:#FFF;
 --color-ring:#4F46E5;--blue:#4F46E5;--ink:#1E1B4B;--muted:#475569;--line:#C7D2FE;
 --ok:#166534;--warn:#92400E;--bad:#B91C1C;--shadow:7px 7px 0 #1E1B4B
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Comic Neue",sans-serif;font-size:16px;line-height:1.45}
button,a{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible{outline:4px solid var(--color-accent);outline-offset:3px}
.shell{min-height:100vh;display:grid;grid-template-columns:260px minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;padding:18px;background:var(--color-primary);color:#FFF;border-right:4px solid var(--ink);overflow:auto;z-index:10}
.brand{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:10px;margin-bottom:24px}
.logo{width:52px;height:52px;display:grid;place-items:center;background:var(--color-accent);color:#000;border:3px solid #000;box-shadow:4px 4px 0 #000}
.logo svg{width:28px}
.brand b,.title h1,.card h2,.kpi strong{font-family:"Baloo 2",sans-serif}
.brand b{display:block;font-size:18px;line-height:1.1}
.brand small{font-size:11px;letter-spacing:.12em}
#nav{display:grid;gap:8px}
.navbtn{width:100%;min-height:48px;padding:10px 12px;display:flex;align-items:center;gap:10px;border:2px solid #FFF;background:transparent;color:#FFF;text-align:left;font-weight:700}
.navbtn svg{width:20px;flex:none}
.navbtn:hover{background:#3730A3}
.navbtn.on{background:#FFF;color:var(--ink);box-shadow:4px 4px 0 #000}
.streak{margin-top:28px;padding:14px;background:#FFF;color:var(--ink);border:3px solid #000;box-shadow:5px 5px 0 #000}
.streak span{display:flex;gap:8px;align-items:center;font-weight:700}
.streak svg{width:20px;color:var(--color-accent)}
.streak strong{display:block;color:var(--color-primary);font:800 34px/1 "Baloo 2";font-variant-numeric:tabular-nums}
.streak small{display:block;color:var(--muted)}
.profile{margin-top:22px;padding-top:14px;border-top:2px solid #A5B4FC;font-size:13px;line-height:1.7}
.main{min-width:0;padding:26px clamp(16px,3vw,44px) 60px;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:36px 36px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}
.title{max-width:720px;background:var(--color-background);padding-right:10px}
.title h1{margin:0;font-size:clamp(29px,4vw,48px);line-height:1;font-weight:800;letter-spacing:-.03em}
.title p{margin:8px 0 0;color:var(--muted);font-weight:700}
.live{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#FFF;border:2px solid var(--ink);font-weight:700;white-space:nowrap;box-shadow:4px 4px 0 var(--ink)}
.live i{width:10px;height:10px;background:#16A34A;border:2px solid var(--ink);animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(.65);opacity:.55}}
.grid{display:grid;gap:20px}.g2{grid-template-columns:1.35fr .85fr}.equal{grid-template-columns:1fr 1fr}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.card,.kpi{background:var(--color-card);border:3px solid var(--ink);box-shadow:var(--shadow)}
.card{padding:20px;min-width:0}
.kpi{padding:16px;min-height:140px;display:flex;flex-direction:column;justify-content:space-between}
.kpi:nth-child(2n){transform:translateY(7px)}
.kpi .label{color:var(--muted);font-weight:700}
.kpi strong{font-size:36px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
.kpi strong small{font:700 13px "Comic Neue";color:var(--muted)}
.delta{font-size:13px;font-weight:700}.up{color:var(--ok)}.risk{color:var(--bad)}
.card h2{margin:0 0 16px;display:flex;align-items:center;gap:9px;font-size:20px;line-height:1.2}
.card h2 svg{width:23px;color:var(--color-primary)}
.grow{margin-left:auto;color:var(--color-primary);font:700 12px "Comic Neue"}
.chart{width:100%;min-height:100px}
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:2px solid var(--line)}
.row:first-of-type{border-top:0}
.avatar{width:42px;height:42px;display:grid;place-items:center;flex:none;background:var(--color-secondary);border:2px solid var(--ink)}
.avatar svg{width:20px}
.rowmain{min-width:0;flex:1}.rowmain b{display:block}.rowmain small{color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border:2px solid currentColor;font-size:12px;font-weight:700;white-space:nowrap}
.tag:before{content:"✓";font-weight:900}.tag.warn:before{content:"!"}.tag.info:before{content:"i"}.tag.lock:before{content:"×"}
.ok{color:#166534;background:#DCFCE7}.warn{color:#854D0E;background:#FEF3C7}.info{color:#3730A3;background:#E0E7FF}.bad{color:#991B1B;background:#FEE2E2}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:9px;margin-top:14px}
.stat{padding:12px;background:var(--color-muted);border:2px solid var(--ink);text-align:center}
.stat b{display:block;font:800 25px "Baloo 2";font-variant-numeric:tabular-nums}.stat span{font-size:12px;color:var(--muted)}
.topics{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.topic{padding:14px;border:3px solid var(--ink);background:#FFF}
.topic:nth-child(3n+2){background:#E0E7FF;transform:translateY(5px)}
.topichead{display:flex;gap:10px;align-items:center}.topichead svg{width:24px;color:var(--color-primary)}
.topichead b{font-family:"Baloo 2";font-size:18px}.topic small{display:block;color:var(--muted)}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;font-size:12px}
.progress{height:12px;margin-top:10px;border:2px solid var(--ink);background:#FFF}.progress i{display:block;height:100%;background:var(--color-primary)}
.sentence{margin-bottom:14px;padding:14px;border:3px solid var(--ink);background:#F8FAFF}
.sentence .scene{color:var(--color-primary);font-weight:700}.sentence .english{margin:8px 0 2px;font:700 18px/1.45 "Comic Neue"}.ipa{color:var(--muted);font-family:monospace;font-size:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
.btn{min-height:44px;padding:8px 15px;display:inline-flex;align-items:center;gap:7px;border:3px solid #000;background:var(--color-accent);color:#000;font-weight:700;box-shadow:4px 4px 0 #000}
.btn:hover{background:#FB923C}.btn.secondary{background:#FFF;color:var(--ink)}.btn svg{width:19px}
.note{color:var(--muted);font-size:13px;line-height:1.65}
.scorehero{display:flex;gap:22px;align-items:center}
.ring{width:132px;height:132px;flex:none;display:grid;place-items:center;border:3px solid var(--ink);background:conic-gradient(var(--color-primary) 0 87%,var(--line) 87%)}
.ring div{width:91px;height:91px;display:grid;place-items:center;align-content:center;background:#FFF;border:3px solid var(--ink)}
.ring b{font:800 34px/1 "Baloo 2";color:var(--color-primary)}.ring span{font-size:12px}
.dimensions{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.dimension{padding:10px;border:2px solid var(--ink);background:var(--color-muted)}
.dimension b{display:block;font:800 22px "Baloo 2";font-variant-numeric:tabular-nums}
.wave{height:88px;display:flex;gap:3px;align-items:center;padding:8px;border:3px solid var(--ink);background:#FFF}
.wave i{flex:1;background:var(--color-primary);min-height:5px}
.player{padding:16px;background:#E0E7FF;border:3px solid var(--ink)}
.player+.player{margin-top:14px;background:#FFEDD5}
.play{width:50px;height:50px;padding:13px;border:3px solid #000;background:var(--color-accent);box-shadow:4px 4px 0 #000}.play svg{width:100%}
.feedback{display:grid;gap:12px}
.feedback article{padding:13px;border:3px solid var(--ink);border-left:12px solid var(--ok);background:#FFF}
.feedback article.warn{border-left-color:#D97706}.feedback article.bad{border-left-color:var(--bad)}
.feedback em{font-style:normal;background:#FEE2E2;color:#991B1B;border:2px solid currentColor;padding:0 3px}
.advice{margin-top:8px;padding:8px;background:var(--color-muted);font-size:13px}.advice b{color:var(--color-primary)}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{aspect-ratio:1;display:grid;place-items:center;border:2px solid var(--ink);background:#FFF;font-weight:700;font-variant-numeric:tabular-nums}
.day.head{aspect-ratio:auto;border:0;background:transparent;color:var(--muted)}
.day.l1{background:#C7D2FE}.day.l2{background:#A5B4FC}.day.l3{background:#6366F1;color:#FFF}.day.l4{background:#312E81;color:#FFF}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.badge{padding:12px;text-align:center;border:3px solid var(--ink);background:#FFF}.badge.locked{background:var(--color-muted)}
.badge svg{width:32px;color:var(--color-primary)}.badge b,.badge small{display:block}.badge small{color:var(--muted)}
.scroll{overflow-x:auto;border:3px solid var(--ink)}
table{width:100%;border-collapse:collapse;background:#FFF;font-size:14px}
th,td{padding:12px;border:1px solid var(--line);text-align:left}
th{background:var(--color-primary);color:#FFF;font-weight:700}
td:nth-child(3),td:nth-child(4){text-align:right;font-family:monospace;font-variant-numeric:tabular-nums}
tbody tr:nth-child(even){background:#EEF2FF}
.mono{font-family:monospace;font-variant-numeric:tabular-nums}
.grid-item{animation:enter .4s cubic-bezier(.2,.9,.3,1.3) both}
.grid-item:nth-child(2){animation-delay:.06s}.grid-item:nth-child(3){animation-delay:.12s}.grid-item:nth-child(4){animation-delay:.18s}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.92)}}
@media(max-width:1100px){.kpis{grid-template-columns:1fr 1fr}.dimensions{grid-template-columns:repeat(3,1fr)}}
@media(max-width:850px){
 .shell{display:block}.side{position:static;height:auto;border-right:0;border-bottom:4px solid var(--ink)}
 #nav{display:flex;overflow-x:auto;padding-bottom:8px}.navbtn{min-width:max-content}.streak,.profile{display:none}
 .g2,.equal{grid-template-columns:1fr}.topbar{align-items:flex-start}
}
@media(max-width:600px){
 .main{padding:20px 13px 50px}.topbar{display:block}.live{display:inline-flex;margin-top:15px}
 .kpis,.topics{grid-template-columns:1fr}.kpi:nth-child(2n),.topic:nth-child(3n+2){transform:none}
 .scorehero{display:block}.ring{margin:0 auto 18px}.dimensions{grid-template-columns:1fr 1fr}
 .badges{grid-template-columns:1fr 1fr}.card{padding:15px}.title h1{font-size:34px}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>

MOD.forEach(function(m,i){var b=document.createElement("button");b.className="navbtn";b.dataset.i=i;b.innerHTML=icon(m[1])+"<span>"+m[0]+"</span>";b.onclick=function(){location.hash="v"+i};nav.appendChild(b)});
