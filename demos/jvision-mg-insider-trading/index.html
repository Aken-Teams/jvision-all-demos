<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>內部人持股申報與短線交易防範 · 經營治理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&amp;family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&amp;family=Crimson+Pro:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&amp;family=Noto+Sans+TC:wght@400;500;600;700;900&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --accent:#0D9488;
  --accent2:#2DD4BF;
  --accent-soft:#CCFBF1;
  --accent-soft2:#99F6E4;
  --bg:#F0FDFA;
  --panel:#FFFFFF;
  --th:#CCFBF1;
  --hov:#E6FFFA;
  --track:#D6F5EF;
  --sidebar:#134E4A;
  --sidebar2:#0F766E;
  --side-edge:#000000;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#1D4ED8;
  --r:0px;
  --glow:rgba(13,148,136,.24);
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  font-family:"Crimson Pro","Noto Sans TC",serif;
  font-size:16px;
  line-height:1.5;
  color:var(--ink);
  background-color:var(--bg);
  background-image:linear-gradient(rgba(13,148,136,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(13,148,136,.09) 1px,transparent 1px);
  background-size:28px 28px;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,[role="button"],a{cursor:pointer}
h1,h2,h3,h4,b,strong{
  font-family:"Cormorant Garamond","Noto Sans TC",serif;
}
h1,h2,h3,h4{margin:0;color:var(--ink)}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:4px solid var(--color-ring)!important;
  outline-offset:3px!important;
  box-shadow:0 0 0 2px #fff!important;
}
::selection{color:#000;background:var(--color-secondary)}
.app{display:flex;min-height:100vh}
.sidebar{
  width:270px;
  flex:none;
  min-width:0;
  height:100vh;
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  flex-direction:column;
  padding:0;
  color:#fff;
  background:var(--sidebar);
  border-right:4px solid #000;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  padding:24px 18px;
  background:var(--color-secondary);
  color:#000;
  border-bottom:4px solid #000;
}
.brand-logo{
  width:46px;
  height:46px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#000;
  background:var(--color-accent);
  border:3px solid #000;
  border-radius:0;
  box-shadow:5px 5px 0 #000;
}
.brand-logo .material-symbols-outlined{font-size:25px}
.brand-txt{min-width:0}
.brand-txt b{
  display:block;
  font-size:18px;
  font-weight:700;
  line-height:1.1;
  color:#000;
}
.brand-txt span{
  display:block;
  margin-top:4px;
  font-family:"Cinzel",serif;
  font-size:9px;
  font-weight:600;
  letter-spacing:1.4px;
  color:#0F172A;
}
.nav{display:flex;flex-direction:column;gap:0;min-width:0;margin:0;padding:18px 0}
.nav button{
  min-height:54px;
  min-width:0;
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 17px;
  color:#DDFCF7;
  background:transparent;
  border:0;
  border-bottom:1px solid rgba(255,255,255,.24);
  border-left:8px solid transparent;
  border-radius:0;
  text-align:left;
  font-family:"Crimson Pro","Noto Sans TC",serif;
  font-size:16px;
  font-weight:600;
}
.nav button .material-symbols-outlined{font-size:22px;flex:none}
.nav button:hover{color:#000;background:var(--color-secondary)}
.nav button.on{
  color:#000;
  background:var(--color-accent);
  border-left-color:#000;
  box-shadow:inset 0 -3px 0 #000;
}
.nav .idx{
  margin-left:auto;
  font-family:"Cinzel",monospace;
  font-size:10px;
  font-weight:700;
  letter-spacing:1px;
  opacity:.8;
}
.side-foot{
  margin-top:auto;
  padding:17px 18px 20px;
  color:#CCFBF1;
  border-top:4px solid #000;
  font-size:12px;
  line-height:1.7;
}
.side-foot b{color:#fff;font-family:"Cinzel",serif}
.main{flex:1;min-width:0;padding:28px 34px 64px}
.topbar{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin:0 0 22px;
  padding:0 0 16px;
  border-bottom:4px solid #000;
}
.topbar h1{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:clamp(28px,3vw,43px);
  font-weight:700;
  line-height:1;
  letter-spacing:-.02em;
}
.topbar h1 .material-symbols-outlined{
  width:46px;
  height:46px;
  display:grid;
  place-items:center;
  flex:none;
  color:#000;
  background:var(--color-secondary);
  border:3px solid #000;
  font-size:27px;
}
.topbar .sub{margin-top:8px;color:var(--muted);font-size:15px;font-weight:600}
.top-right{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{
  min-height:38px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:7px 11px;
  color:var(--ink);
  background:#fff;
  border:2px solid #000;
  border-radius:0;
  font-size:13px;
  font-weight:700;
  box-shadow:3px 3px 0 var(--color-border);
}
.chip .dot{
  width:10px;
  height:10px;
  border-radius:0;
  background:var(--ok);
  border:2px solid #000;
  animation:pulse 2s steps(2,end) infinite;
}
.avatar{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  flex:none;
  color:#000;
  background:var(--color-accent);
  border:3px solid #000;
  border-radius:0;
  font-weight:900;
  box-shadow:4px 4px 0 #000;
}
@keyframes pulse{50%{opacity:.45}}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{
  min-width:0;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:3px solid #000;
  border-radius:0;
  box-shadow:7px 7px 0 var(--color-border);
}
.card,.sec{padding:18px}
.sec{margin-bottom:17px}
.card:hover,.sec:hover,.kpi:hover,.stat:hover,.tile:hover{box-shadow:7px 7px 0 var(--color-accent)}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h,.sec>h3{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:16px;
  padding-bottom:11px;
  border-bottom:3px solid #000;
}
.card.pad0 .card-h,.card.p0 .card-h{margin-bottom:0;padding:18px;border-bottom:3px solid #000!important}
.card-h h3,.sec>h3{
  font-size:20px;
  font-weight:700;
  line-height:1.15;
}
.card-h h3{display:flex;align-items:center;gap:8px;min-width:0}
.card-h h3 .material-symbols-outlined,.sec>h3 .material-symbols-outlined{
  color:#000;
  background:var(--color-secondary);
  border:2px solid #000;
  padding:4px;
  font-size:19px;
}
.card-h .hint{color:var(--muted);font-size:12px;font-weight:700}
.sec>p{margin:0 0 14px;color:var(--muted);font-size:15px;line-height:1.7}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0;font-size:15px}
.dl dt{color:var(--muted);font-size:13px;font-weight:700}
.dl dd{margin:0;line-height:1.7}
.kpi,.stat{position:relative;overflow:hidden;padding:16px 17px}
.kpi::after{
  content:"";
  position:absolute;
  right:-22px;
  top:-22px;
  width:76px;
  height:76px;
  background:var(--accent-soft);
  border:3px solid #000;
  transform:rotate(12deg);
}
.kpi .ico{
  width:42px;
  height:42px;
  position:relative;
  z-index:1;
  display:grid;
  place-items:center;
  color:#000;
  background:var(--color-secondary);
  border:2px solid #000;
  border-radius:0;
}
.kpi .ico .material-symbols-outlined{font-size:22px}
.kpi .lbl,.stat .lbl{
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:12px;
  color:var(--muted);
  font-size:13px;
  font-weight:700;
}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{color:var(--accent);font-size:16px}
.kpi .val,.stat .val,.tile .tv{
  margin-top:3px;
  color:var(--ink);
  font-family:"Cinzel","Noto Sans TC",serif;
  font-size:28px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.04em;
}
.kpi .val small,.stat .val small{margin-left:4px;color:var(--muted);font-size:14px;font-weight:700}
.kpi .delta,.stat .d{
  display:inline-flex;
  align-items:center;
  gap:3px;
  margin-top:6px;
  font-size:12px;
  font-weight:700;
}
.delta.up,.d.up{color:var(--ok)}
.delta.down,.d.down{color:var(--bad)}
.delta.flat,.d.flat{color:var(--muted)}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:15px}
table{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
th{
  padding:12px 14px;
  color:#0F172A;
  background:var(--color-secondary);
  border-right:2px solid #000;
  border-bottom:3px solid #000;
  font-family:"Crimson Pro","Noto Sans TC",serif;
  font-size:13px;
  font-weight:700;
  letter-spacing:.02em;
  text-align:left;
  white-space:nowrap;
}
th:last-child{border-right:0}
td{
  padding:12px 14px;
  color:var(--ink);
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
td:last-child{border-right:0}
tbody tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#F7FFFD}
tbody tr:hover{background:#CCFBF1}
th:nth-child(n+3),td:nth-child(n+3){text-align:right}
.mono,td:first-child{
  font-family:"Cinzel","Noto Sans TC",monospace;
  font-weight:600;
  font-variant-numeric:tabular-nums;
  letter-spacing:.01em;
}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:26px;
  padding:3px 8px;
  border:2px solid currentColor;
  border-radius:0;
  font-size:12px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
}
.tag::before{content:"■";font-size:8px;line-height:1}
.t-ok{color:#166534;background:#DCFCE7}
.t-warn{color:#92400E;background:#FEF3C7}
.t-bad{color:#991B1B;background:#FEE2E2}
.t-info{color:#1E3A8A;background:#DBEAFE}
.t-gray{color:#334155;background:#E2E8F0}
.t-acc,.t-pink{color:#115E59;background:#CCFBF1}
.bar{height:10px;min-width:56px;overflow:hidden;background:var(--track);border:1px solid #000;border-radius:0}
.bar>i{display:block;height:100%;background:var(--color-primary);border-right:2px solid #000;border-radius:0}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{width:42px;flex:none;color:var(--muted);font-family:"Cinzel",monospace;font-size:11px;font-weight:700;text-align:right}
.tl{position:relative;padding-left:30px}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:4px;background:#000}
.tl-item,.tl-i{position:relative;padding:0 0 20px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{
  position:absolute;
  left:-30px;
  top:3px;
  width:20px;
  height:20px;
  background:var(--color-secondary);
  border:4px solid #000;
  border-radius:0;
}
.tl-dot.warn,.tl-d.warn{background:#F59E0B}
.tl-dot.bad,.tl-d.bad{background:var(--bad)}
.tl-dot.ok,.tl-d.ok{background:#22C55E}
.tl-time,.tl-t{color:var(--muted);font-family:"Cinzel",monospace;font-size:11px;font-weight:700}
.tl-item b,.tl-i b{display:block;margin:3px 0;font-size:15px;font-weight:700}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:13px}
.chk{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:2px dashed var(--line);font-size:14px}
.chk:last-child{border-bottom:0}
.chk .material-symbols-outlined{font-size:21px}
.chk .ok{color:var(--ok)}
.chk .wait{color:var(--muted)}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--muted);font-size:12px}
.note{margin-top:14px;padding-top:13px;color:var(--muted);border-top:2px dashed var(--line);font-size:13px;line-height:1.7}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.board>*{min-width:0}
.col{display:flex;flex-direction:column;gap:10px;padding:12px;background:var(--color-muted);border:3px solid #000;border-radius:0}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:3px 3px 8px;font-size:15px;font-weight:700}
.col-h .cnt{padding:2px 8px;color:#000;background:var(--color-secondary);border:2px solid #000;border-radius:0;font-size:12px}
.pcard{padding:12px;color:var(--ink);background:#fff;border:2px solid #000;border-left:8px solid var(--color-primary);border-radius:0;box-shadow:3px 3px 0 var(--line)}
.pcard b{font-size:15px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;color:var(--muted);font-size:12px}
.pcard .who{display:inline-flex;align-items:center;gap:5px;margin-top:9px;color:var(--ink);font-size:12px}
.mini-av,.av{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:none;
  color:#000;
  background:var(--color-secondary);
  border:2px solid #000;
  border-radius:0;
  font-weight:800;
}
.mini-av{width:21px;height:21px;font-size:10px}
.av{width:29px;height:29px;font-size:11px}
.who{display:inline-flex;align-items:center;gap:7px}
.lane{display:flex;flex-direction:column;gap:12px}
.lane-row{display:flex;align-items:center;gap:14px;min-width:0;padding:13px 14px;background:#fff;border:2px solid #000;border-radius:0}
.lane-row .num{width:36px;height:36px;display:grid;place-items:center;flex:none;color:#000;background:var(--color-secondary);border:2px solid #000;border-radius:0;font-family:"Cinzel",monospace;font-size:13px;font-weight:800}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:16px}
.lane-row .body p{margin:3px 0 0;color:var(--muted);font-size:13px}
.steps{display:flex;align-items:center;flex:none}
.steps .s{width:25px;height:25px;display:grid;place-items:center;z-index:1;color:var(--muted);background:#fff;border:2px solid #000;border-radius:0;font-size:11px}
.steps .ln{width:20px;height:3px;background:#000}
.steps .s.done{color:#000;background:var(--color-secondary)}
.steps .s.cur{color:#000;background:var(--color-accent);animation:pulse 1.6s steps(2,end) infinite}
.steps .ln.done{background:var(--color-primary)}
.rep-row{display:flex;align-items:center;gap:14px;min-width:0;padding:13px 4px;border-bottom:2px dashed var(--line)}
.rep-row:last-child{border-bottom:0}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:15px}
.rep-row .sku span{color:var(--muted);font-size:12px}
.gauge{width:115px;flex:none}
.gauge .track{height:11px;position:relative;overflow:hidden;background:var(--track);border:1px solid #000;border-radius:0}
.gauge .track i{display:block;height:100%;background:var(--color-primary);border-right:2px solid #000;border-radius:0}
.gauge small{display:block;margin-top:4px;color:var(--muted);font-family:"Cinzel",monospace;font-size:10px;text-align:right}
.band{position:relative;height:29px;min-width:150px;background:var(--track);border:2px solid #000;border-radius:0}
.band .rng{position:absolute;top:0;bottom:0;background:var(--accent-soft);border-radius:0}
.band .mid{position:absolute;top:-3px;bottom:-3px;width:3px;background:#000}
.band .me{position:absolute;top:2px;width:13px;height:21px;background:var(--color-accent);border:2px solid #000;border-radius:0;box-shadow:none}
.tile{display:flex;flex-direction:column;gap:7px;padding:17px}
.tile:nth-child(2n){transform:translateY(8px)}
.tile .ti{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  color:#000;
  background:var(--color-secondary);
  border:2px solid #000;
  border-radius:0;
}
.tile:nth-child(3n) .ti{background:var(--color-accent)}
.tile .ti .material-symbols-outlined{font-size:22px}
.tile b{font-size:17px;font-weight:700}
.tile p{margin:0;color:var(--muted);font-size:13px;font-weight:600;line-height:1.5}
.tile .tv{font-size:27px}
#screen{
  display:grid;
  grid-template-columns:400px minmax(0,1fr);
  grid-auto-rows:min-content;
  gap:18px;
  align-items:start;
}
#screen>*{grid-column:1/-1;margin-top:0!important}
#screen>.grid.g4:first-child{
  grid-column:1;
  grid-row:1;
  display:grid!important;
  grid-template-columns:repeat(2,minmax(0,1fr))!important;
  gap:13px;
}
#screen>.grid.g4:first-child>*{margin:0!important}
#screen>*:nth-child(2){grid-column:2;grid-row:1}
#screen>*:nth-child(2).grid{grid-template-columns:minmax(0,1fr)}
#screen>*:nth-child(2)>.card:first-child{min-height:325px}
#screen>*:nth-child(3){margin-top:3px!important}
.apexcharts-canvas text{font-family:"Crimson Pro","Noto Sans TC",serif!important;fill:#475569!important}
.apexcharts-gridline{stroke:#99F6E4!important}
.apexcharts-tooltip,.apexcharts-xaxistooltip{border:2px solid #000!important;border-radius:0!important;box-shadow:4px 4px 0 var(--line)!important}
@media(max-width:1180px){
  #screen{grid-template-columns:340px minmax(0,1fr)}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:1024px){
  #screen{grid-template-columns:minmax(0,1fr)}
  #screen>*,#screen>.grid.g4:first-child,#screen>*:nth-child(2){grid-column:1;grid-row:auto}
  .topbar{align-items:flex-start}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;border-right:0;border-bottom:4px solid #000}
  .brand{padding:14px 16px}
  .brand-logo{width:40px;height:40px;box-shadow:3px 3px 0 #000}
  .nav{flex-direction:row;overflow-x:auto;padding:0;scrollbar-width:thin}
