<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>企業資訊設備資產管理系統｜資產維運控制台</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --success:#047857;
  --success-bg:#ECFDF5;
  --warning:#9A3412;
  --warning-bg:#FFF7ED;
  --danger:#B91C1C;
  --danger-bg:#FEF2F2;
  --info:#1D4ED8;
  --info-bg:#EFF6FF;
  --shadow-sm:0 1px 2px rgba(15,23,42,.05);
  --shadow-md:0 8px 24px rgba(37,99,235,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-width:320px;
  overflow-x:hidden;
  color:var(--color-foreground);
  background:
    radial-gradient(circle at 92% 2%,rgba(59,130,246,.1),transparent 26rem),
    var(--color-background);
  font:400 14px/1.6 "Work Sans",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,a,[role=button]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid rgba(37,99,235,.32);
  outline-offset:3px;
}
svg{display:block}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.topbar{
  position:sticky;
  top:0;
  z-index:50;
  min-height:72px;
  display:flex;
  align-items:center;
  gap:18px;
  padding:12px clamp(16px,3vw,40px);
  color:var(--color-card-foreground);
  background:rgba(255,255,255,.93);
  border-bottom:1px solid var(--color-border);
  backdrop-filter:blur(14px);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  width:42px;
  height:42px;
  flex:none;
  display:grid;
  place-items:center;
  color:var(--color-on-primary);
  background:linear-gradient(145deg,var(--color-primary),#1D4ED8);
  border-radius:12px;
  box-shadow:0 8px 18px rgba(37,99,235,.22);
}
.logo .icon{width:23px;height:23px}
.brand h1{
  margin:0;
  font:700 16px/1.25 "Outfit",sans-serif;
  letter-spacing:.01em;
}
.brand small{
  display:block;
  margin-top:3px;
  color:var(--color-muted-foreground);
  font-size:11px;
}
.livepill{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:8px;
  flex:none;
  padding:7px 11px;
  color:#065F46;
  background:var(--success-bg);
  border:1px solid #A7F3D0;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
}
.dot{
  position:relative;
  width:8px;
  height:8px;
  background:#059669;
  border-radius:50%;
}
.dot::after{
  content:"";
  position:absolute;
  inset:-4px;
  border:1px solid #059669;
  border-radius:50%;
  opacity:.35;
  animation:pulse 2s ease-out infinite;
}
.navwrap{
  position:sticky;
  top:72px;
  z-index:40;
  padding:0 clamp(12px,3vw,40px);
  background:rgba(248,250,252,.94);
  border-bottom:1px solid var(--color-border);
  backdrop-filter:blur(12px);
}
.nav{
  width:min(1380px,100%);
  margin:auto;
  display:flex;
  gap:6px;
  overflow-x:auto;
  scrollbar-width:none;
}
.nav::-webkit-scrollbar{display:none}
.nav button{
  position:relative;
  min-height:52px;
  flex:none;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 13px;
  color:var(--color-muted-foreground);
  background:transparent;
  border:0;
  font-weight:600;
  transition:color .2s ease,background .2s ease,transform .2s ease;
}
.nav button::after{
  content:"";
  position:absolute;
  right:13px;
  bottom:0;
  left:13px;
  height:3px;
  background:var(--color-primary);
  border-radius:3px 3px 0 0;
  transform:scaleX(0);
  transition:transform .2s ease;
}
.nav button:hover{color:var(--color-primary);background:rgba(37,99,235,.06)}
.nav button.active{color:var(--color-primary)}
.nav button.active::after{transform:scaleX(1)}
.wrap{width:min(1380px,100%);margin:auto;padding:28px clamp(16px,3vw,40px) 64px}
.screen-head{
  position:relative;
  display:flex;
  align-items:center;
  gap:16px;
  min-height:116px;
  margin-bottom:20px;
  padding:22px clamp(18px,3vw,30px);
  overflow:hidden;
  background:linear-gradient(115deg,#FFFFFF 0%,#EFF6FF 100%);
  border:1px solid #DBEAFE;
  border-radius:20px;
  box-shadow:var(--shadow-sm);
}
.screen-head::after{
  content:"";
  position:absolute;
  top:-65px;
  right:-45px;
  width:190px;
  height:190px;
  background:linear-gradient(135deg,rgba(37,99,235,.14),rgba(59,130,246,.02));
  border-radius:50%;
}
.screen-head .ic{
  position:relative;
  z-index:1;
  width:50px;
  height:50px;
  flex:none;
  display:grid;
  place-items:center;
  color:var(--color-primary);
  background:#FFFFFF;
  border:1px solid #BFDBFE;
  border-radius:14px;
  box-shadow:0 8px 20px rgba(37,99,235,.1);
}
.screen-head .ic .icon{width:25px;height:25px}
.screen-head h2{
  margin:0;
  font:700 clamp(21px,2vw,27px)/1.2 "Outfit",sans-serif;
  letter-spacing:-.02em;
}
.screen-head p{margin:5px 0 0;color:var(--color-muted-foreground)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g32{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.card{
  min-width:0;
  padding:18px;
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-radius:16px;
  box-shadow:var(--shadow-sm);
  transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
}
.card:hover{
  transform:translateY(-2px);
  border-color:#BFDBFE;
  box-shadow:var(--shadow-md);
}
.card.pad0{padding:0;overflow:hidden}
.card-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:14px;
}
.card-h h3{
  margin:0;
  font:600 15px/1.4 "Outfit",sans-serif;
}
.card-h>.icon{color:var(--color-primary)}
.kpi{position:relative;overflow:hidden;padding-left:20px}
.kpi::after{
  content:"";
  position:absolute;
  top:-30px;
  right:-30px;
  width:95px;
  height:95px;
  background:var(--kpi-soft,#EFF6FF);
  border-radius:50%;
  opacity:.7;
}
.kpi .bar{position:absolute;inset:0 auto 0 0;width:4px;background:var(--kpi,#2563EB)}
.kpi .lab{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--color-muted-foreground);
  font-size:12px;
  font-weight:600;
}
.kpi .lab .icon{width:17px;height:17px;color:var(--kpi,#2563EB)}
.kpi .val{
  position:relative;
  z-index:1;
  margin-top:7px;
  font:700 29px/1.18 "Outfit",sans-serif;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.025em;
}
.kpi .sub{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  gap:4px;
  margin-top:5px;
  font-size:12px;
  font-weight:600;
}
.kpi .sub .icon{width:14px;height:14px}
.up{color:var(--success)}
.down{color:var(--danger)}
.flat{color:var(--color-muted-foreground)}
.tblwrap{overflow:auto}
table{
  width:100%;
  min-width:560px;
  border-collapse:collapse;
  font-size:13px;
}
th{
  padding:11px 14px;
  color:#334155;
  background:#F1F5F9;
  border-bottom:1px solid var(--color-border);
  text-align:left;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
}
td{
  padding:11px 14px;
  border-bottom:1px solid var(--color-border);
  vertical-align:middle;
  white-space:nowrap;
}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .18s ease}
tbody tr:hover{background:#F8FAFC}
td:nth-last-child(2):not(:first-child),td.num{text-align:right}
.mono{
  font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  font-variant-numeric:tabular-nums;
  letter-spacing:.01em;
}
.muted{color:var(--color-muted-foreground);font-size:12px}
.bdg{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:25px;
  padding:3px 9px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  line-height:1;
  white-space:nowrap;
}
.bdg::before{
  content:"";
  width:6px;
  height:6px;
  flex:none;
  background:currentColor;
  border-radius:50%;
}
.b-ok{color:#047857;background:var(--success-bg)}
.b-warn{color:#9A3412;background:var(--warning-bg)}
.b-bad{color:#B91C1C;background:var(--danger-bg)}
.b-info{color:#1D4ED8;background:var(--info-bg)}
.b-mut{color:#475569;background:#F1F5F9}
.b-acc{color:#C2410C;background:#FFF7ED}
.prog{
  height:8px;
  min-width:72px;
  overflow:hidden;
  background:#E2E8F0;
  border-radius:99px;
}
.prog i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--color-primary),var(--color-secondary));
  border-radius:inherit;
}
.pctcell{display:flex;align-items:center;gap:9px;min-width:130px}
.chart{width:100%;height:286px;overflow:hidden}
.chart.sm{height:226px}
.pill-tabs{display:flex;gap:6px;flex-wrap:wrap}
.pill-tabs span{
  padding:5px 10px;
  color:var(--color-muted-foreground);
  background:#F8FAFC;
  border:1px solid var(--color-border);
  border-radius:999px;
  font-size:11px;
  font-weight:600;
}
.pill-tabs span.on{
  color:#1D4ED8;
  background:#EFF6FF;
  border-color:#93C5FD;
}
.strip{display:flex;gap:12px;flex-wrap:wrap}
.strip .s{
  flex:1;
  min-width:120px;
  padding:13px 14px;
  background:#F8FAFC;
  border:1px solid var(--color-border);
  border-radius:12px;
}
.strip .l{color:var(--color-muted-foreground);font-size:11px;font-weight:600}
.strip .v{margin-top:3px;font:700 20px/1.3 "Outfit",sans-serif}
.hint{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:14px;
  color:var(--color-muted-foreground);
  font-size:11px;
}
.hint .icon{width:15px;height:15px;color:var(--color-primary)}
.lane{display:flex;min-width:0;flex-direction:column;gap:10px}
.lane-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding-bottom:9px;
  color:#334155;
  border-bottom:1px dashed #CBD5E1;
  font-size:12px;
  font-weight:700;
}
.ticket{
  padding:11px 12px;
  background:#F8FAFC;
  border:1px solid var(--color-border);
  border-left:3px solid var(--color-primary);
  border-radius:10px;
  transition:background .2s ease,transform .2s ease;
}
.ticket:hover{background:#EFF6FF;transform:translateX(2px)}
.ticket .t1{font-size:12px;font-weight:700}
.ticket .t2{margin-top:3px;color:var(--color-muted-foreground);font-size:11px}
.tl{position:relative;padding-left:24px}
.tl::before{
  content:"";
  position:absolute;
  top:5px;
  bottom:5px;
  left:7px;
  width:2px;
  background:#DBEAFE;
}
.tl-item{position:relative;padding-bottom:17px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{
  content:"";
  position:absolute;
  top:4px;
  left:-22px;
  width:10px;
  height:10px;
  background:var(--color-primary);
  border:3px solid #FFFFFF;
  border-radius:50%;
  box-shadow:0 0 0 2px #93C5FD;
}
.tl-item .tt{font-size:13px;font-weight:700}
.tl-item .td{margin-top:2px;color:var(--color-muted-foreground);font-size:12px}
.tl-item .tm{
  margin-top:2px;
  color:#64748B;
  font-family:"SFMono-Regular",Consolas,monospace;
  font-size:11px;
}
#screen>.grid,#screen>.card{animation:rise .4s ease both}
#screen>.grid:nth-child(3),#screen>.card:nth-child(3){animation-delay:.06s}
#screen>.grid:nth-child(4),#screen>.card:nth-child(4){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{transform:scale(.65);opacity:.6}70%,100%{transform:scale(1.65);opacity:0}}
@media(max-width:1024px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g23,.g32{grid-template-columns:1fr}
}
@media(max-width:768px){
  .topbar{min-height:66px;padding:10px 16px}
  .navwrap{top:66px}
  .brand small{display:none}
  .livepill{padding:6px 9px}
  .wrap{padding-top:18px}
  .screen-head{min-height:100px}
  .g3,.g2{grid-template-columns:1fr}
}
@media(max-width:520px){
  .topbar{gap:10px}
  .logo{width:38px;height:38px}
  .brand h1{max-width:180px;font-size:14px;white-space:normal}
  .livepill{font-size:0}
  .livepill::after{content:"監控中";font-size:11px}
  .nav button{min-width:52px;justify-content:center;padding:0 14px}
  .nav .lbl{display:none}
  .screen-head{align-items:flex-start;padding:18px}
  .screen-head .ic{width:44px;height:44px}
  .screen-head h2{font-size:21px}
  .g4{grid-template-columns:1fr}
  .card{padding:16px}
  .kpi .val{font-size:27px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  #screen>.grid,#screen>.card{opacity:1;transform:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg class="icon" viewBox="0 0 24 24"><path d="M4 7.5 12 3l8 4.5-8 4.5-8-4.5Z"/><path d="m4 12 8 4.5 8-4.5M4 16.5l8 4.5 8-4.5"/></svg>
    </div>
    <div>
      <h1>企業資訊設備資產管理系統</h1>
      <small>IT 資產管理平台 ｜ 帳實一致 · 授權合規 · 全生命週期</small>
    </div>
  </div>
  <div class="livepill"><span class="dot" aria-hidden="true"></span>監控中 · 同步於 08:42</div>
</header>
<nav class="navwrap" aria-label="主要功能"><div class="nav" id="nav"></div></nav>
<main class="wrap"><div id="screen"></div></main>
<script>
"use strict";
var C={
  txt:"#1E293B",mut:"#475569",line:"#E2E8F0",primary:"#2563EB",
  secondary:"#3B82F6",accent:"#EA580C",ok:"#047857",warn:"#C2410C",
  bad:"#DC2626",info:"#2563EB",panel:"#FFFFFF",soft:"#F1F5F9"
};
var MODULES=[
  {ic:"box",name:"資產清冊",desc:"硬體資產建檔與序號追蹤"},
  {ic:"check",name:"軟體授權",desc:"授權席次與合規稽核"},
  {ic:"receipt",name:"採購入帳",desc:"資產採購與財務入帳"},
  {ic:"cycle",name:"生命週期",desc:"派發、報廢與汰換管理"},
  {ic:"scan",name:"定期盤點",desc:"帳實核對與差異處理"},
  {ic:"audit",name:"稽核報表",desc:"盤點準確率與合規報表"}
];
var PATHS={
  box:'<path d="M4 7.5 12 3l8 4.5-8 4.5-8-4.5Z"/><path d="M4 7.5V17l8 4 8-4V7.5M12 12v9"/>',
  check:'<path d="M12 3 5 6v5c0 4.8 2.9 8.2 7 10 4.1-1.8 7-5.2 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/>',
  receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  cycle:'<path d="M20 7h-6V1"/><path d="M20 7a9 9 0 1 0 1 7"/><path d="m20 7-4-4"/>',
  scan:'<path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><path d="M7 12h10M9 9v6M13 9v6M16 9v6"/>',
  audit:'<path d="M9 4h6l1 2h3v15H5V6h3l1-2Z"/><path d="m9 13 2 2 4-5M9 8h6"/>',
  trend:'<path d="m4 15 5-5 4 4 7-8"/><path d="M15 6h5v5"/>',
  flat:'<path d="M5 12h14"/><path d="m16 9 3 3-3 3"/>',
  down:'<path d="m4 9 5 5 4-4 7 7"/><path d="M15 17h5v-5"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>'
};
function icon(n){return '<svg class="icon" aria-hidden="true" viewBox="0 0 24 24">'+(PATHS[n]||PATHS.box)+'</svg>'}
var charts=[];
function disposeCharts(){for(var i=0;i<charts.length;i++)try{charts[i].dispose()}catch(e){}charts=[]}
function mk(id){var el=document.getElementById(id);if(!el)return null;var c=echarts.init(el);charts.push(c);return c}
var AXIS={
  axisLine:{lineStyle:{color:C.line}},
  axisLabel:{color:C.mut,fontFamily:"Work Sans"},
  splitLine:{lineStyle:{color:"#E9EFF8"}},
  axisTick:{show:false}
};
function kpi(o){
  var col=o.c||C.primary;
  return '<div class="card kpi" style="--kpi:'+col+'"><div class="bar"></div>'+
    '<div class="lab">'+icon(o.ic||"chart")+o.lab+'</div>'+
    '<div class="val">'+o.val+'</div>'+
    '<div class="sub '+(o.cls||"flat")+'">'+icon(o.arrow||"flat")+o.sub+'</div></div>'
}
function bdg(cls,txt){return '<span class="bdg '+cls+'">'+txt+'</span>'}
function head(i){
  return '<section class="screen-head"><div class="ic">'+icon(MODULES[i].ic)+'</div>'+
    '<div><h2>'+MODULES[i].name+'</h2><p>'+MODULES[i].desc+'</p></div></section>'
}
function s0(){
  var assets=[
    ["AST-24-00871","A 牌筆電 L5540","筆電","CN-8FJ2K1","研發部 · 林彥廷","3F-A12","使用中","b-ok"],
    ["AST-24-00920","B 牌桌機 800 G9","桌機","BX-77QW3E","財務部 · 陳品妤","5F-F03","使用中","b-ok"],
    ["AST-23-00612","D 牌交換器 C9300-48P","網路設備","DX-9300X8","機房 · IDC-01","B1-機房","使用中","b-ok"],
    ["AST-24-01044","MacBook Pro 14","筆電","MB-4KL9P2","設計部 · 王思涵","4F-D07","維修中","b-warn"],

  {r:s0,d:d0},{r:s1,d:d1},{r:s2,d:d2},
  {r:s3,d:d3},{r:s4,d:d4},{r:s5,d:d5}
];
function buildNav(){
  var h="";
  MODULES.forEach(function(m,i){
    h+='<button type="button" data-i="'+i+'" aria-label="'+m.name+'">'+icon(m.ic)+'<span class="lbl">'+m.name+'</span></button>'
  });
  document.getElementById("nav").innerHTML=h;
  document.querySelectorAll("#nav button").forEach(function(btn){
    btn.addEventListener("click",function(){
      var i=+this.getAttribute("data-i");
      if(location.hash!=="#v"+i)location.hash="v"+i;
      else show(i);
      try{window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}catch(e){}
    })
  })
}
function show(i){
  disposeCharts();
  var box=document.getElementById("screen");
  box.innerHTML=SCREENS[i].r();
  document.querySelectorAll("#nav button").forEach(function(btn){
    var active=+btn.getAttribute("data-i")===i;
    btn.classList.toggle("active",active);
    btn.setAttribute("aria-current",active?"page":"false")
  });
  void box.offsetHeight;
  SCREENS[i].d()
}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  show(m?Math.min(+m[1],5):0)
}
window.addEventListener("resize",function(){
  charts.forEach(function(c){try{c.resize()}catch(e){}})
});
window.addEventListener("hashchange",fromHash);
buildNav();
fromHash();
</script>
</body>
