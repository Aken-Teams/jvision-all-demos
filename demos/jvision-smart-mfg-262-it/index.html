<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ITAM（IT資產管理）｜資產維運控制台</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#c2410c; --accent2:#fb923c;
  --bg:#0d1117; --panel:#161b22; --panel2:#1c232d; --line:#2a323d;
  --txt:#e6edf3; --mut:#8b949e; --mut2:#6b7580;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --info:#60a5fa;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}
body{
  font-family:"Inter","Noto Sans TC",sans-serif;
  background:var(--bg);color:var(--txt);
  font-size:14px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.ms{font-family:"Material Symbols Outlined";font-size:20px;line-height:1;vertical-align:middle}
.topbar{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(90deg,#111820,#0d1117);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px 18px;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{
  width:34px;height:34px;border-radius:9px;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 4px 14px rgba(194,65,12,.4);
}
.brand h1{font-size:15px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-size:11px;color:var(--mut);font-weight:500}
.livepill{
  margin-left:auto;display:flex;align-items:center;gap:6px;
  background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.35);
  color:var(--ok);padding:5px 11px;border-radius:20px;font-size:12px;font-weight:600;
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.navwrap{background:var(--panel);border-bottom:1px solid var(--line);padding:0 12px}
.nav{display:flex;flex-wrap:wrap;gap:4px;max-width:1360px;margin:0 auto}
.nav button{
  background:transparent;border:none;cursor:pointer;
  color:var(--mut);font-family:inherit;font-size:13px;font-weight:600;
  padding:12px 14px;border-bottom:2px solid transparent;
  display:flex;align-items:center;gap:8px;min-width:0;
  transition:.15s;
}
.nav button:hover{color:var(--txt)}
.nav button.active{color:var(--accent2);border-bottom-color:var(--accent2)}
.nav button .ms{font-size:19px}
.wrap{max-width:1360px;margin:0 auto;padding:20px 18px 60px}
.screen-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.screen-head .ic{
  width:44px;height:44px;border-radius:11px;flex:none;
  background:rgba(194,65,12,.15);border:1px solid rgba(251,146,60,.3);
  color:var(--accent2);display:flex;align-items:center;justify-content:center;
}
.screen-head .ic .ms{font-size:24px}
.screen-head h2{font-size:19px;font-weight:800}
.screen-head p{color:var(--mut);font-size:13px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:1.6fr 1fr}
.g32{grid-template-columns:1fr 1.6fr}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}
}
.grid>*{min-width:0}
.card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:16px;
}
.card.pad0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.card-h h3{font-size:14px;font-weight:700}
.card-h .ms{font-size:18px;color:var(--mut)}
.kpi{position:relative;overflow:hidden}
.kpi .lab{color:var(--mut);font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:28px;font-weight:800;margin-top:6px;font-family:"Inter"}
.kpi .sub{font-size:12px;margin-top:4px;font-weight:600}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--mut)}
.chart{width:100%;height:280px;overflow:hidden}
.chart.sm{height:220px}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th{
  text-align:left;color:var(--mut);font-weight:600;font-size:12px;
  padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
  background:var(--panel2);
}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.mono{font-family:"Inter";font-variant-numeric:tabular-nums;letter-spacing:.2px}
.bdg{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.b-ok{background:rgba(52,211,153,.14);color:var(--ok)}
.b-warn{background:rgba(251,191,36,.14);color:var(--warn)}
.b-bad{background:rgba(248,113,113,.14);color:var(--bad)}
.b-info{background:rgba(96,165,250,.14);color:var(--info)}
.b-mut{background:rgba(139,148,158,.14);color:var(--mut)}
.b-acc{background:rgba(251,146,60,.16);color:var(--accent2)}
.prog{height:7px;background:var(--panel2);border-radius:6px;overflow:hidden;min-width:70px}
.prog i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.lane{display:flex;flex-direction:column;gap:10px;min-width:0}
.lane-h{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;color:var(--mut);padding-bottom:8px;border-bottom:1px dashed var(--line)}
.ticket{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:9px;padding:10px 11px}
.ticket .t1{font-size:12px;font-weight:700}
.ticket .t2{font-size:11px;color:var(--mut);margin-top:3px}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 16px 0}
.tl-item::before{content:"";position:absolute;left:-19px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--accent2);border:2px solid var(--bg);box-shadow:0 0 0 3px rgba(251,146,60,.15)}
.tl-item .tt{font-size:13px;font-weight:700}
.tl-item .td{font-size:12px;color:var(--mut);margin-top:2px}
.tl-item .tm{font-size:11px;color:var(--mut2);font-family:"Inter"}
.pctcell{display:flex;align-items:center;gap:8px;min-width:0}
.strip{display:flex;gap:14px;flex-wrap:wrap}
.strip .s{flex:1;min-width:120px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.strip .s .l{font-size:11px;color:var(--mut);font-weight:600}
.strip .s .v{font-size:20px;font-weight:800;margin-top:2px}
.muted{color:var(--mut);font-size:12px}
.pill-tabs{display:flex;gap:6px;flex-wrap:wrap}
.pill-tabs span{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--panel2);color:var(--mut);border:1px solid var(--line)}
.pill-tabs span.on{background:rgba(194,65,12,.18);color:var(--accent2);border-color:rgba(251,146,60,.4)}
.hint{font-size:11px;color:var(--mut2);margin-top:14px;display:flex;align-items:center;gap:6px}
@media(max-width:560px){
  .nav button .lbl{display:none}
  .nav button{padding:12px 12px}
  .kpi .val{font-size:24px}
  .brand small{display:none}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <div class="logo"><span class="ms">inventory_2</span></div>
    <div>
      <h1>ITAM 資產維運控制台</h1>
      <small>IT 資產管理平台 ｜ 帳實一致 · 授權合規 · 全生命週期</small>
    </div>
  </div>
  <div class="livepill"><span class="dot"></span> 監控中 · 同步於 08:42</div>
</div>
<div class="navwrap">
  <div class="nav" id="nav"></div>
</div>
<div class="wrap"><div id="screen"></div></div>

<script>
"use strict";
var C={txt:"#e6edf3",mut:"#8b949e",line:"#2a323d",accent:"#c2410c",accent2:"#fb923c",ok:"#34d399",warn:"#fbbf24",bad:"#f87171",info:"#60a5fa",panel:"#161b22"};

var MODULES=[
  {ic:"inventory_2",name:"資產清冊",desc:"硬體資產建檔與序號追蹤"},
  {ic:"verified",name:"軟體授權",desc:"授權席次與合規稽核"},
  {ic:"request_quote",name:"採購入帳",desc:"資產採購與財務入帳"},
  {ic:"account_tree",name:"生命週期",desc:"派發、報廢與汰換管理"},
  {ic:"fact_check",name:"定期盤點",desc:"帳實核對與差異處理"},
  {ic:"gavel",name:"稽核報表",desc:"盤點準確率與合規報表"}
];

var charts=[];
function disposeCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
function mk(id){var el=document.getElementById(id);if(!el)return null;var c=echarts.init(el);charts.push(c);return c;}
var AXIS={axisLine:{lineStyle:{color:C.line}},axisLabel:{color:C.mut},splitLine:{lineStyle:{color:"rgba(42,50,61,.6)"}},axisTick:{show:false}};

function kpi(o){
  return '<div class="card kpi"><div class="bar" style="background:'+(o.c||C.accent2)+'"></div>'+
    '<div class="lab"><span class="ms" style="font-size:16px;color:'+(o.c||C.accent2)+'">'+o.ic+'</span>'+o.lab+'</div>'+
    '<div class="val">'+o.val+'</div>'+
    '<div class="sub '+(o.cls||"flat")+'"><span class="ms" style="font-size:14px">'+(o.arrow||"trending_flat")+'</span>'+o.sub+'</div></div>';
}
function bdg(cls,txt){return '<span class="bdg '+cls+'">'+txt+'</span>';}
function head(i){
  return '<div class="screen-head"><div class="ic"><span class="ms">'+MODULES[i].ic+'</span></div>'+
    '<div style="min-width:0"><h2>'+MODULES[i].name+'</h2><p>'+MODULES[i].desc+'</p></div></div>';
}

/* ===== SCREEN 0 : 資產清冊 ===== */
function s0(){
  var assets=[
    {id:"AST-24-00871",nm:"A 牌筆電 L5540",cat:"筆電",sn:"CN-8FJ2K1",own:"研發部 · 林彥廷",loc:"3F-A12",st:"使用中",stc:"b-ok"},
    {id:"AST-24-00920",nm:"B 牌桌機 800 G9",cat:"桌機",sn:"BX-77QW3E",own:"財務部 · 陳品妤",loc:"5F-F03",st:"使用中",stc:"b-ok"},
    {id:"AST-23-00612",nm:"D 牌交換器 C9300-48P",cat:"網路設備",sn:"DX-9300X8",own:"機房 · IDC-01",loc:"B1-機房",st:"使用中",stc:"b-ok"},
    {id:"AST-24-01044",nm:"MacBook Pro 14",cat:"筆電",sn:"MB-4KL9P2",own:"設計部 · 王思涵",loc:"4F-D07",st:"維修中",stc:"b-warn"},
    {id:"AST-22-00305",nm:"A 牌伺服器 R750",cat:"伺服器",sn:"PE-R750A2",own:"機房 · IDC-01",loc:"B1-機房",st:"使用中",stc:"b-ok"},
    {id:"AST-21-00118",nm:"C 牌筆電 T14",cat:"筆電",sn:"CX-T14G2X",own:"待汰換",loc:"倉庫-W2",st:"待報廢",stc:"b-bad"},
    {id:"AST-24-01180",nm:"iPad Pro 12.9",cat:"行動裝置",sn:"IP-129M4",own:"業務部 · 郭承恩",loc:"外勤",st:"使用中",stc:"b-ok"},
    {id:"AST-24-00988",nm:"E 牌防火牆 FG-100F",cat:"網路設備",sn:"EX-100F71",own:"機房 · IDC-01",loc:"B1-機房",st:"庫存",stc:"b-info"}
  ];
  var rows="";
  for(var i=0;i<assets.length;i++){var a=assets[i];
    rows+='<tr><td class="mono">'+a.id+'</td><td>'+a.nm+'</td><td>'+bdg("b-mut",a.cat)+'</td>'+
      '<td class="mono muted">'+a.sn+'</td><td>'+a.own+'</td><td class="muted">'+a.loc+'</td><td>'+bdg(a.stc,a.st)+'</td></tr>';
  }
  return head(0)+
  '<div class="grid g4" style="margin-bottom:14px">'+
    kpi({ic:"inventory_2",lab:"資產總數",val:"3,842",sub:"本月 +58",cls:"up",arrow:"trending_up",c:C.accent2})+
    kpi({ic:"qr_code_2",lab:"已貼標建檔",val:"98.4%",sub:"+1.2%",cls:"up",arrow:"trending_up",c:C.ok})+
    kpi({ic:"build",lab:"維修中",val:"27",sub:"+3 較上週",cls:"down",arrow:"trending_up",c:C.warn})+
    kpi({ic:"warning",lab:"待報廢",val:"64",sub:"逾齡 5 年以上",cls:"flat",arrow:"trending_flat",c:C.bad})+
  '</div>'+
  '<div class="grid g23">'+
    '<div class="card pad0">'+
      '<div class="card-h" style="padding:16px 16px 0"><h3>資產清冊 · 即時明細</h3>'+
        '<div class="pill-tabs"><span class="on">全部</span><span>使用中</span><span>庫存</span><span>維修</span></div></div>'+
      '<div class="tblwrap"><table><thead><tr><th>資產編號</th><th>品名</th><th>類別</th><th>序號</th><th>保管人 / 單位</th><th>位置</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '</div>'+
    '<div class="card"><div class="card-h"><h3>資產類別分佈</h3><span class="ms">donut_small</span></div>'+
      '<div id="c0a" class="chart sm"></div>'+
      '<div class="hint"><span class="ms" style="font-size:14px">qr_code_scanner</span>掃描條碼即可跳轉單筆資產履歷</div>'+
    '</div>'+
  '</div>';
}
function d0(){
  var c=mk("c0a");if(!c)return;
  c.setOption({
    tooltip:{trigger:"item"},
    legend:{right:0,top:"center",orient:"vertical",textStyle:{color:C.mut,fontSize:11},itemWidth:9,itemHeight:9},
    series:[{type:"pie",radius:["48%","72%"],center:["34%","50%"],avoidLabelOverlap:false,
      itemStyle:{borderColor:C.panel,borderWidth:2},label:{show:false},
      data:[
        {value:1420,name:"筆電",itemStyle:{color:C.accent2}},
        {value:960,name:"桌機",itemStyle:{color:C.accent}},
        {value:540,name:"網路設備",itemStyle:{color:C.info}},
        {value:380,name:"伺服器",itemStyle:{color:C.ok}},
        {value:542,name:"行動裝置",itemStyle:{color:C.warn}}
      ]}]
  });
}

/* ===== SCREEN 1 : 軟體授權 ===== */
function s1(){
  var lic=[
    {nm:"辦公套裝 E3",tot:520,used:498,exp:"2026-11-30",st:"合規",stc:"b-ok"},
    {nm:"設計軟體套裝",tot:60,used:67,exp:"2026-09-15",st:"超用 7 席",stc:"b-bad"},
    {nm:"CAD 軟體",tot:35,used:29,exp:"2027-01-20",st:"合規",stc:"b-ok"},
    {nm:"開發工具套裝",tot:48,used:45,exp:"2026-08-31",st:"即將到期",stc:"b-warn"},
    {nm:"虛擬化平台授權",tot:16,used:16,exp:"2026-12-10",st:"滿載",stc:"b-warn"},
    {nm:"視訊會議平台",tot:200,used:143,exp:"2027-03-01",st:"合規",stc:"b-ok"}
  ];
  var rows="";
  for(var i=0;i<lic.length;i++){var l=lic[i];var pct=Math.round(l.used/l.tot*100);var over=l.used>l.tot;
    rows+='<tr><td>'+l.nm+'</td><td class="mono">'+l.used+' / '+l.tot+'</td>'+
      '<td><div class="pctcell"><div class="prog" style="flex:1"><i style="width:'+Math.min(pct,100)+'%;'+(over?"background:linear-gradient(90deg,#f87171,#fca5a5)":"")+'"></i></div><span class="mono" style="color:'+(over?C.bad:C.mut)+'">'+pct+'%</span></div></td>'+
      '<td class="mono muted">'+l.exp+'</td><td>'+bdg(l.stc,l.st)+'</td></tr>';
  }
  return head(1)+
  '<div class="grid g4" style="margin-bottom:14px">'+
    kpi({ic:"verified",lab:"軟體合規率",val:"94.2%",sub:"+3.1% 季增",cls:"up",arrow:"trending_up",c:C.ok})+
    kpi({ic:"apps",lab:"納管軟體",val:"128",sub:"授權合約 42 份",cls:"flat",arrow:"trending_flat",c:C.accent2})+
    kpi({ic:"error",lab:"超用授權",val:"3",sub:"需補購 / 回收",cls:"down",arrow:"trending_up",c:C.bad})+
    kpi({ic:"schedule",lab:"90 天內到期",val:"9",sub:"應提前續約",cls:"flat",arrow:"trending_flat",c:C.warn})+
  '</div>'+
  '<div class="grid g32">'+
    '<div class="card"><div class="card-h"><h3>席次使用率 Top</h3><span class="ms">stacked_bar_chart</span></div>'+
      '<div id="c1a" class="chart"></div></div>'+
    '<div class="card pad0"><div class="card-h" style="padding:16px 16px 0"><h3>授權合規明細</h3>'+bdg("b-acc","即時稽核")+'</div>'+
      '<div class="tblwrap"><table><thead><tr><th>軟體</th><th>使用 / 授權</th><th>使用率</th><th>到期日</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
  '</div>';
}
function d1(){
  var c=mk("c1a");if(!c)return;
  c.setOption({
    tooltip:{trigger:"axis",axisPointer:{type:"shadow"}},
    grid:{left:8,right:16,top:32,bottom:8,containLabel:true},
    legend:{textStyle:{color:C.mut},top:0,data:["已用席次","剩餘席次"]},
    xAxis:{type:"value",max:540,axisLine:AXIS.axisLine,axisLabel:AXIS.axisLabel,splitLine:AXIS.splitLine},
    yAxis:{type:"category",data:["虛擬化","CAD","開發工具","設計軟體","辦公套裝","視訊會議"],axisLine:AXIS.axisLine,axisLabel:AXIS.axisLabel,splitLine:{show:false}},
    series:[
      {name:"已用席次",type:"bar",stack:"a",data:[16,29,45,67,498,143],itemStyle:{color:C.accent}},
      {name:"剩餘席次",type:"bar",stack:"a",data:[0,6,3,0,22,57],itemStyle:{color:"#3a4552"}}
    ]
  });
}

/* ===== SCREEN 2 : 採購入帳 ===== */
function s2(){
  var po=[
    {po:"PO-2026-0731",item:"A 牌筆電 L5540 ×20",vendor:"O技電腦",amt:"1,180,000",st:"已入帳",stc:"b-ok",dep:"研發部"},
    {po:"PO-2026-0742",item:"E 牌防火牆 FG-100F ×2",vendor:"O壹科技",amt:"420,000",st:"驗收中",stc:"b-warn",dep:"資訊部"},
    {po:"PO-2026-0755",item:"MacBook Pro 14 ×5",vendor:"O誼數位",amt:"485,000",st:"待入帳",stc:"b-info",dep:"設計部"},
    {po:"PO-2026-0760",item:"B 牌桌機 800 ×15",vendor:"O強國際",amt:"675,000",st:"已入帳",stc:"b-ok",dep:"財務部"},
    {po:"PO-2026-0768",item:"PowerEdge R750 ×1",vendor:"O通資科",amt:"890,000",st:"請購核准",stc:"b-mut",dep:"機房"}
  ];
  var rows="";
  for(var i=0;i<po.length;i++){var p=po[i];
    rows+='<tr><td class="mono">'+p.po+'</td><td>'+p.item+'</td><td class="muted">'+p.vendor+'</td>'+
      '<td>'+p.dep+'</td><td class="mono">NT$'+p.amt+'</td><td>'+bdg(p.stc,p.st)+'</td></tr>';
  }
  return head(2)+

/* ---------- router ---------- */
var SCREENS=[{r:s0,d:d0},{r:s1,d:d1},{r:s2,d:d2},{r:s3,d:d3},{r:s4,d:d4},{r:s5,d:d5}];
function buildNav(){
  var h="";
  for(var i=0;i<MODULES.length;i++){
    h+='<button data-i="'+i+'"><span class="ms">'+MODULES[i].ic+'</span><span class="lbl">'+MODULES[i].name+'</span></button>';
  }
  document.getElementById("nav").innerHTML=h;
  var btns=document.querySelectorAll("#nav button");
  for(var j=0;j<btns.length;j++){
    btns[j].addEventListener("click",function(){show(+this.getAttribute("data-i"));try{window.scrollTo(0,0);}catch(e){}});
  }
}
function show(i){
  disposeCharts();
  var box=document.getElementById("screen");
  box.innerHTML=SCREENS[i].r();
  var btns=document.querySelectorAll("#nav button");
  for(var k=0;k<btns.length;k++){btns[k].classList.toggle("active",+btns[k].getAttribute("data-i")===i);}
  void box.offsetHeight;
  SCREENS[i].d();
}
window.addEventListener("resize",function(){for(var i=0;i<charts.length;i++){try{charts[i].resize();}catch(e){}}});
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
