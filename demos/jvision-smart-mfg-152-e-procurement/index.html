<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>電子採購平台 e-Procurement</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#e11d48; --accent2:#fb7185; --accent-soft:#fff1f2;
  --ink:#1f2430; --sub:#6b7280; --line:#eef0f4; --bg:#f6f7fb; --card:#ffffff;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.55;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
button{font-family:inherit;cursor:pointer}
.app{display:flex;flex-direction:column;min-height:100vh}
/* ===== top bar ===== */
.topbar{
  display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--card);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{
  width:38px;height:38px;border-radius:11px;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 6px 16px rgba(225,29,72,.32);
}
.logo .material-symbols-outlined{font-size:22px}
.brand h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.2px}
.brand p{font-size:11px;margin:0;color:var(--sub)}
.top-spacer{flex:1}
.top-search{
  display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);
  border-radius:10px;padding:7px 12px;min-width:0;color:var(--sub);
}
.top-search input{border:0;background:transparent;outline:none;font-family:inherit;font-size:13px;width:150px;min-width:0;color:var(--ink)}
.top-user{display:flex;align-items:center;gap:9px;min-width:0}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#334155,#0f172a);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.top-user .ux small{display:block;color:var(--sub);font-size:11px}
.top-user .ux b{font-size:13px}
/* ===== nav ===== */
.nav{
  display:flex;gap:6px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);
  position:sticky;top:63px;z-index:25;flex-wrap:wrap;overflow-x:auto;
}
.nav button{
  display:flex;align-items:center;gap:8px;border:1px solid transparent;background:transparent;
  color:var(--sub);padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;white-space:nowrap;flex:none;
}
.nav button .material-symbols-outlined{font-size:19px}
.nav button:hover{background:var(--accent-soft);color:var(--accent)}
.nav button.active{background:var(--accent);color:#fff;box-shadow:0 5px 14px rgba(225,29,72,.28)}
.nav button .idx{font-size:11px;opacity:.7;font-weight:700}
/* ===== layout ===== */
.wrap{padding:18px 20px 40px;max-width:1400px;margin:0 auto;width:100%}
.screen-head{margin-bottom:16px}
.screen-head h2{margin:0 0 4px;font-size:19px;font-weight:800;display:flex;align-items:center;gap:9px}
.screen-head h2 .material-symbols-outlined{color:var(--accent);font-size:24px}
.screen-head p{margin:0;color:var(--sub);font-size:13px}
/* signature split pane */
.split{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.split-narrow{grid-template-columns:340px 1fr}
.pane{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);min-width:0}
.pane-head{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid var(--line);gap:8px;flex-wrap:wrap}
.pane-head h3{margin:0;font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px}
.pane-head h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.pane-body{padding:14px 15px}
/* list items */
.listitem{
  display:flex;gap:11px;padding:12px 15px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start;
  border-left:3px solid transparent;transition:background .12s;min-width:0;
}
.listitem:hover{background:var(--accent-soft)}
.listitem.sel{background:var(--accent-soft);border-left-color:var(--accent)}
.listitem .li-ic{width:34px;height:34px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--accent)}
.listitem .li-ic .material-symbols-outlined{font-size:19px}
.li-main{min-width:0;flex:1}
.li-main .t{font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.li-main .t .code{color:var(--sub);font-weight:600;font-size:11px;flex:none}
.li-main .s{color:var(--sub);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;position:relative;overflow:hidden;min-width:0}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.kpi .lab{color:var(--sub);font-size:12px;display:flex;align-items:center;gap:6px}
.kpi .lab .material-symbols-outlined{font-size:16px;color:var(--accent)}
.kpi .val{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.kpi .val small{font-size:13px;font-weight:600;color:var(--sub)}
.kpi .delta{font-size:11px;font-weight:700;margin-top:4px;display:inline-flex;align-items:center;gap:3px}
.kpi .delta.up{color:var(--ok)} .kpi .delta.down{color:var(--bad)}
.kpi .delta .material-symbols-outlined{font-size:14px}
/* generic */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);min-width:0}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-h .material-symbols-outlined{font-size:19px;color:var(--accent);vertical-align:middle;margin-right:6px}
.card-b{padding:15px 16px}
.chart-wrap{position:relative;width:100%;overflow:hidden}
/* tables */
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th{text-align:left;color:var(--sub);font-weight:600;font-size:11.5px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafbfd}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--accent-soft)}
.mono{font-variant-numeric:tabular-nums}
/* badges / pills */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.tag .material-symbols-outlined{font-size:13px}
.t-ok{background:#dcfce7;color:#166534}
.t-warn{background:#fef3c7;color:#92400e}
.t-bad{background:#fee2e2;color:#991b1b}
.t-info{background:#dbeafe;color:#1e40af}
.t-mut{background:#eef0f4;color:#475569}
.t-accent{background:var(--accent-soft);color:var(--accent)}
.bar{height:7px;border-radius:6px;background:var(--line);overflow:hidden;min-width:60px}
.bar>span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn .material-symbols-outlined{font-size:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.muted{color:var(--sub)}
.divider{height:1px;background:var(--line);margin:13px 0}
/* detail rows */
.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13px}
.dl dt{color:var(--sub)}
.dl dd{margin:0;font-weight:600;text-align:right}
/* timeline */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 16px 4px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-22px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--accent2);display:flex;align-items:center;justify-content:center}
.tl-dot.done{background:var(--accent);border-color:var(--accent)}
.tl-dot.done .material-symbols-outlined{font-size:10px;color:#fff}
.tl-item .tt{font-weight:700;font-size:13px}
.tl-item .ts{color:var(--sub);font-size:12px}
.tl-item .tw{color:var(--sub);font-size:11px;margin-top:1px}
/* approval steps */
.appr{display:flex;flex-direction:column;gap:0}
.appr-step{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--line)}
.appr-step:last-child{border-bottom:0}
.appr-node{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:13px}
.appr-node.done{background:var(--ok)}
.appr-node.cur{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);animation:pulse 2s ease-in-out infinite}
.appr-node.wait{background:#cbd5e1}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px var(--accent-soft)}50%{box-shadow:0 0 0 8px rgba(225,29,72,.12)}}
.appr-info{flex:1;min-width:0}
.appr-info .an{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.appr-info .ar{color:var(--sub);font-size:12px}
.appr-info .at{color:var(--sub);font-size:11px;margin-top:2px}
/* board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.col{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.col-h{font-weight:700;font-size:12.5px;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center}
.col-h .cnt{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:1px 8px;font-size:11px;color:var(--sub)}
.tkt{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:9px;box-shadow:0 1px 2px rgba(15,23,42,.03)}
.tkt:last-child{margin-bottom:0}
.tkt .tk-t{font-weight:700;font-size:12.5px}
.tkt .tk-s{color:var(--sub);font-size:11.5px;margin-top:3px}
.tkt .tk-f{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.tkt .tk-av{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.stripe{height:4px;margin:-10px -10px 8px;border-radius:10px 10px 0 0}
/* compare quotes */
.qcard{border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0;position:relative}
.qcard.best{border-color:var(--accent);box-shadow:0 6px 18px rgba(225,29,72,.12)}
.qcard .best-flag{position:absolute;top:-10px;right:12px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px}
.qcard .qh{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.qcard .qh .qav{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
.qcard .qh .qn{font-weight:700;font-size:13.5px}
.qcard .qh .qsub{color:var(--sub);font-size:11px}
.qprice{font-size:22px;font-weight:800;letter-spacing:-.5px}
.qprice small{font-size:12px;color:var(--sub);font-weight:600}
.qrow{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px dashed var(--line)}
.qrow:last-of-type{border-bottom:0}
.qrow span:first-child{color:var(--sub)}
.stars{color:var(--accent2);letter-spacing:1px;font-size:12px}
/* alert list */
.alert{display:flex;gap:11px;padding:12px;border-radius:11px;border:1px solid var(--line);margin-bottom:10px;align-items:flex-start;background:var(--card)}
.alert:last-child{margin-bottom:0}
.alert .al-ic{width:34px;height:34px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center}
.alert.high{border-left:4px solid var(--bad)} .alert.high .al-ic{background:#fee2e2;color:var(--bad)}
.alert.mid{border-left:4px solid var(--warn)} .alert.mid .al-ic{background:#fef3c7;color:var(--warn)}
.alert.low{border-left:4px solid var(--info)} .alert.low .al-ic{background:#dbeafe;color:var(--info)}
.alert .al-b{flex:1;min-width:0}
.alert .al-b .al-t{font-weight:700;font-size:13px}
.alert .al-b .al-s{color:var(--sub);font-size:12px;margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600}
.chip .material-symbols-outlined{font-size:15px;color:var(--accent)}
.foot{padding:16px 20px;text-align:center;color:var(--sub);font-size:12px;border-top:1px solid var(--line);background:var(--card);margin-top:auto}
/* receiving */
.recv{display:flex;align-items:center;gap:14px}
.check-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.check-row:last-child{border-bottom:0}
.check-row .cbx{width:22px;height:22px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);color:var(--sub)}
.check-row .cbx.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.check-row .cbx.ng{background:var(--bad);border-color:var(--bad);color:#fff}
.check-row .cbx .material-symbols-outlined{font-size:15px}
.check-row .cinfo{flex:1;min-width:0}
.check-row .cinfo b{font-size:13px}
.check-row .cinfo small{display:block;color:var(--sub);font-size:11.5px}
/* ===== RWD ===== */
@media(max-width:1080px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .grid3{grid-template-columns:1fr 1fr}
  .board{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:860px){
  .split,.split-narrow{grid-template-columns:1fr}
  .grid2,.grid3{grid-template-columns:1fr}
  .nav{top:auto;position:static}
}
@media(max-width:560px){
  .kpis{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .top-search{display:none}
  .nav button .txt{display:none}
  .nav button{padding:8px 11px}
  .brand p{display:none}
  .top-user .ux{display:none}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">shopping_cart_checkout</span></div>
      <div>
        <h1>電子採購平台 e-Procurement</h1>
        <p>供應商協同 · 詢比議價 · 交期風險控管</p>

    </div>
    <div class="top-spacer"></div>

  <div class="wrap"><div id="view"></div></div>

</div>

var SUPPLIERS=[
  {code:"SUP-018",name:"鴻鋼精密材料",cat:"金屬原料",score:94,grade:"A",otd:96,open:5},
  {code:"SUP-042",name:"東和刀具工業",cat:"切削刀具",score:91,grade:"A",otd:93,open:3},

  var base={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{size:11}}}},
    scales:{x:{grid:{display:false},ticks:{font:{size:11}}},y:{grid:{color:'#eef0f4'},ticks:{font:{size:11}}}}};

    scales:extra.scales||base.scales,
    cutout:extra.cutout};
}

    var mark=s.st==='done'?'<span class="material-symbols-outlined">check</span>':s.st==='cur'?'●':(i+1);
    var badge=s.st==='done'?tag('t-ok','已核准','check'):s.st==='cur'?tag('t-warn','處理中'):tag('t-mut','等待中');
    return '<div class="appr-step"><div class="appr-node '+cls+'">'+mark+'</div>'+
      '<div class="appr-info"><div class="an">'+s.role+' '+badge+'</div>'+
      '<div class="ar">'+s.name+'</div><div class="at">'+s.ts+'</div></div></div>';
  }).join('');
  var scls={warn:'t-warn',info:'t-info',ok:'t-ok'}[a.cls];
  return '<div class="pane-head"><h3><span class="material-symbols-outlined">approval</span>'+a.code+'</h3>'+tag(scls,a.stat)+'</div>'+
    '<div class="pane-body">'+
    '<div style="font-size:15px;font-weight:800">'+a.title+'</div>'+
    '<dl class="dl" style="margin-top:10px"><dt>供應商</dt><dd>'+a.sup+'</dd><dt>訂單金額</dt><dd>'+a.amt+'</dd></dl>'+
    '<div class="alert low" style="margin-top:12px;border-left-color:var(--accent)"><div class="al-ic" style="background:var(--accent-soft);color:var(--accent)"><span class="material-symbols-outlined">gavel</span></div>'+
      '<div class="al-b"><div class="al-t">套用簽核規則</div><div class="al-s">'+a.rule+'</div></div></div>'+
    '<div class="divider"></div>'+
    '<b style="font-size:13px;display:block;margin-bottom:6px">簽核路徑</b>'+
    '<div class="appr">'+steps+'</div>'+
    '<div class="divider"></div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
      '<button class="btn primary"><span class="material-symbols-outlined">check_circle</span>核准</button>'+
      '<button class="btn"><span class="material-symbols-outlined">reply</span>退回</button>'+
      '<button class="btn ghost"><span class="material-symbols-outlined">forward</span>轉簽</button>'+
      '<button class="btn ghost"><span class="material-symbols-outlined">history</span>稽核軌跡</button>'+
    '</div></div>';
}
function pickAppr(i){
  var nodes=document.querySelectorAll('[data-appr]');
  for(var k=0;k<nodes.length;k++)nodes[k].classList.toggle('sel',+nodes[k].getAttribute('data-appr')===i);
  el('apprDetail').innerHTML=apprDetail(APPROVALS[i]);
}

/* ================= screen 4 : PO tracking ================= */
function s4(){
  var order=['已下單','備貨中','運送中','已到貨'];
  var stripes={'已下單':'#94a3b8','備貨中':'#d97706','運送中':'#2563eb','已到貨':'#16a34a'};
  var cols=order.map(function(k){
    var group=POS.filter(function(p){return p.stat===k});
    var cards=group.map(function(p){
      return '<div class="tkt"><div class="stripe" style="background:'+stripes[k]+'"></div>'+
        '<div class="tk-t">'+p.item+'</div><div class="tk-s">'+p.code+' · '+p.sup+'</div>'+
        '<div class="bar" style="margin-top:8px"><span style="width:'+p.prog+'%"></span></div>'+
        '<div class="tk-f"><span class="muted" style="font-size:11px">預計到貨 '+p.eta+'</span><span class="tk-av">'+p.sup.substring(0,1)+'</span></div></div>';
    }).join('')||'<div class="muted" style="font-size:12px;padding:6px">無訂單</div>';
    return '<div class="col"><div class="col-h">'+k+'<span class="cnt">'+group.length+'</span></div>'+cards+'</div>';
  }).join('');
  var rows=POS.map(function(p){
    var cls={info:'t-info',warn:'t-warn',ok:'t-ok',mut:'t-mut'}[p.cls];
    return '<tr><td class="mono">'+p.code+'</td><td>'+p.sup+'</td><td>'+p.item+'</td><td class="mono">'+p.amt+'</td>'+
      '<td class="mono">'+p.eta+'</td><td style="min-width:110px"><div class="bar"><span style="width:'+p.prog+'%"></span></div></td>'+
      '<td>'+tag(cls,p.stat)+'</td></tr>';
  }).join('');
  return ''+
  '<div class="screen-head"><h2><span class="material-symbols-outlined">receipt_long</span>採購訂單追蹤</h2>'+
  '<p>核准後轉為正式採購訂單送供應商確認，追蹤出貨與交期狀態。</p></div>'+
  '<div class="kpis">'+
    kpi('receipt_long','進行中 PO','24','張','up','+3 本週')+
    kpi('local_shipping','運送中','6','張','up','ETA 3 日內')+
    kpi('inventory','待驗收到貨','4','批','up','含 1 批異常')+
    kpi('paid','本月採購金額','8.6','百萬','up','+12%')+
  '</div>'+
  '<div class="card" style="margin-bottom:16px"><div class="card-h"><span><span class="material-symbols-outlined">view_kanban</span>訂單進度看板</span></div>'+
    '<div class="card-b"><div class="board">'+cols+'</div></div></div>'+
  '<div class="card"><div class="card-h"><span><span class="material-symbols-outlined">table_rows</span>採購訂單明細</span><button class="btn"><span class="material-symbols-outlined">download</span>匯出</button></div>'+
    '<div class="card-b"><div class="tbl-scroll"><table><thead><tr><th>PO 編號</th><th>供應商</th><th>品項</th><th>金額</th><th>ETA</th><th>進度</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div></div></div>';
}

/* ================= screen 5 : delivery risk + receiving ================= */
function s5(){
  var alerts=RISKS.map(function(r){
    return '<div class="alert '+r.lv+'"><div class="al-ic"><span class="material-symbols-outlined">'+r.ic+'</span></div>'+
      '<div class="al-b"><div class="al-t">'+r.t+'</div><div class="al-s">'+r.s+'</div></div>'+
      '<button class="btn" style="flex:none;align-self:center"><span class="material-symbols-outlined">bolt</span>'+r.act+'</button></div>';
  }).join('');
  var checks=RECV.map(function(c){
    var ok=c.res==='ok';
    return '<div class="check-row"><div class="cbx '+(ok?'ok':'ng')+'"><span class="material-symbols-outlined">'+(ok?'check':'close')+'</span></div>'+
      '<div class="cinfo"><b>'+c.item+'</b><small>'+c.code+' · '+c.po+' · '+c.sup+'</small></div>'+
      '<div style="text-align:right;flex:none"><b class="mono">'+c.qty+'</b><br>'+tag(ok?'t-ok':'t-bad',ok?'驗收合格':'數量短缺')+'</div></div>';
  }).join('');
  return ''+
  '<div class="screen-head"><h2><span class="material-symbols-outlined">inventory_2</span>交期風險與驗收</h2>'+
  '<p>缺料預警與到貨監控，進料檢驗與驗收入庫，並更新採購週期指標。</p></div>'+
  '<div class="split split-narrow">'+
    '<div style="display:flex;flex-direction:column;gap:16px;min-width:0">'+
      '<div class="card"><div class="card-b" style="padding:14px 16px"><div class="recv">'+
        '<div class="chart-wrap" style="height:120px;width:120px;flex:none"><canvas id="c5a"></canvas></div>'+
        '<div><div class="muted" style="font-size:12px">本月準時到貨率</div><div style="font-size:30px;font-weight:800;letter-spacing:-1px">92%</div>'+
        '<div style="margin-top:4px">'+tag('t-ok','較上月 +2%','trending_up')+'</div></div></div></div></div>'+
      '<div class="card"><div class="card-h"><span><span class="material-symbols-outlined">event_upcoming</span>近期到貨</span></div>'+
        '<div class="card-b"><div class="tl">'+
          tl('done','SUS304 板材（部分）','08/13 已入庫 · 鴻鋼','GR-3311')+
          tl('done','氣壓缸與電磁閥','08/15 驗收合格 · 泰盛','GR-3312')+
          tl('cur','鎢鋼銑刀組','08/19 預計到貨 · 東和','PO-57991')+
          tl('cur','雙浪紙箱','08/22 備貨中 · 綠盛','PO-57968')+
        '</div></div></div>'+
    '</div>'+
    '<div style="display:flex;flex-direction:column;gap:16px;min-width:0">'+
      '<div class="card"><div class="card-h"><span><span class="material-symbols-outlined">notifications_active</span>交期風險預警</span><span class="tag t-bad">高風險 2</span></div>'+
        '<div class="card-b">'+alerts+'</div></div>'+
      '<div class="card"><div class="card-h"><span><span class="material-symbols-outlined">fact_check</span>進料檢驗與驗收</span><span class="tag t-warn">1 項待處理</span></div>'+
        '<div class="card-b">'+checks+
        '<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn primary"><span class="material-symbols-outlined">inventory</span>驗收入庫</button>'+
        '<button class="btn"><span class="material-symbols-outlined">report</span>開立 SCAR</button></div></div></div>'+
    '</div>'+
  '</div>';
}
function tl(st,t,s,w){
  return '<div class="tl-item"><div class="tl-dot '+(st==='done'?'done':'')+'">'+(st==='done'?'<span class="material-symbols-outlined">check</span>':'')+'</div>'+
    '<div class="tt">'+t+'</div><div class="ts">'+s+'</div><div class="tw">'+w+'</div></div>';
}
function chart5(){
  CHARTS.a=new Chart(el('c5a'),{type:'doughnut',data:{labels:['準時','延遲'],
    datasets:[{data:[92,8],backgroundColor:['#e11d48','#f1f5f9'],borderWidth:0}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'74%',plugins:{legend:{display:false},tooltip:{enabled:false}}}});
}

/* ================= render ================= */
var SCREENS=[s0,s1,s2,s3,s4,s5];
function show(i){
  destroyCharts();
  var btns=document.querySelectorAll('[data-i]');
  for(var k=0;k<btns.length;k++)btns[k].classList.toggle('active',+btns[k].getAttribute('data-i')===i);
  var view=el('view');
  view.innerHTML=SCREENS[i]();
  void view.offsetHeight;
  if(i===0)chart0();
  else if(i===2)chart2();
  else if(i===5)chart5();
}
function buildNav(){
  var h='';
  for(var i=0;i<NAV.length;i++){
    h+='<button data-i="'+i+'" onclick="show('+i+')"><span class="idx">0'+(i+1)+'</span><span class="material-symbols-outlined">'+NAV[i].ic+'</span><span class="txt">'+NAV[i].t+'</span></button>';
  }
  el('nav').innerHTML=h;
}
buildNav();

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
</body>
</html>
