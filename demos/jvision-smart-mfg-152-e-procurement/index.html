<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>電子採購平台 e-Procurement</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --ok:#15803D;
  --warn:#A94908;
  --bad:#DC2626;
  --radius:8px;
  --shadow:0 10px 30px rgba(15,23,42,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  background:var(--color-background);
  color:var(--ink);
  font-family:"Fira Sans",sans-serif;
  font-size:14px;
  line-height:1.55;
}
button,input{font:inherit}
button,[onclick]{cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:18px;
  min-height:72px;padding:12px clamp(16px,3vw,36px);
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(12px);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  width:42px;height:42px;display:grid;place-items:center;flex:none;
  color:#fff;background:var(--blue);border-radius:6px;
  box-shadow:5px 5px 0 #BFDBFE;
}
.logo svg{width:23px;height:23px}
.brand h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
.brand p{margin:1px 0 0;color:var(--muted);font-size:11px}
.spacer{flex:1}
.search{
  width:min(300px,28vw);display:flex;align-items:center;gap:8px;
  padding:8px 11px;background:var(--color-background);
  border:1px solid var(--line);border-radius:6px;
}
.search svg{width:17px;color:var(--muted)}
.search input{width:100%;border:0;outline:0;background:transparent;color:var(--ink)}
.user{display:flex;align-items:center;gap:9px}
.avatar{
  width:36px;height:36px;display:grid;place-items:center;
  color:#fff;background:#0F172A;border-radius:50%;font-weight:700
}
.user small{display:block;color:var(--muted)}
.nav{
  position:sticky;top:72px;z-index:20;
  display:flex;gap:4px;padding:10px clamp(16px,3vw,36px);
  overflow-x:auto;background:#fff;border-bottom:1px solid var(--line)
}
.nav button{
  min-height:42px;display:flex;align-items:center;gap:8px;flex:none;
  padding:8px 13px;color:var(--muted);background:transparent;
  border:1px solid transparent;border-radius:6px;font-weight:600;
  transition:background .2s,color .2s,border-color .2s,transform .2s;
}
.nav button:hover{color:var(--blue);background:#EFF6FF;border-color:#BFDBFE;transform:translateY(-1px)}
.nav button.active{color:#fff;background:var(--blue);border-color:var(--blue)}
.nav svg{width:18px;height:18px}
.idx,.mono,.code,td.num,.value{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.idx{font-size:10px;opacity:.72}
.wrap{width:100%;max-width:1440px;margin:auto;padding:28px clamp(16px,3vw,40px) 48px}
.hero{
  position:relative;overflow:hidden;display:grid;grid-template-columns:1fr auto;
  gap:24px;align-items:end;margin-bottom:20px;padding:24px 26px;
  color:#fff;background:#172554;border-radius:var(--radius);
  box-shadow:var(--shadow)
}
.hero:after{
  content:"";position:absolute;right:-55px;top:-85px;width:230px;height:230px;
  border:42px solid rgba(59,130,246,.3);border-radius:50%
}
.hero>*{position:relative;z-index:1}
.eyebrow{margin-bottom:7px;color:#BFDBFE;font:600 11px "Fira Code";letter-spacing:.13em;text-transform:uppercase}
.hero h2{margin:0;font-size:clamp(24px,3vw,38px);line-height:1.12;letter-spacing:-.04em}
.hero p{max-width:720px;margin:9px 0 0;color:#DBEAFE}
.hero-side{display:flex;gap:8px;align-items:center}
.hero-mark{
  min-width:104px;padding:10px 12px;color:#172554;background:#fff;
  border-radius:6px;text-align:center;font-weight:700
}
.hero-mark span{display:block;font:700 23px "Fira Code"}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi,.card,.pane,.qcard{
  min-width:0;background:var(--color-card);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:0 2px 0 rgba(15,23,42,.03);
  transition:border-color .22s,box-shadow .22s,transform .22s
}
.kpi:hover,.card:hover,.qcard:hover{border-color:#93C5FD;box-shadow:var(--shadow);transform:translateY(-2px)}
.kpi{padding:17px 18px;border-top:3px solid var(--blue)}
.kpi .label{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}
.kpi .label svg{width:17px;color:var(--blue)}
.kpi .value{margin-top:8px;font-size:26px;font-weight:700;letter-spacing:-.05em}
.kpi .value small{font:500 12px "Fira Sans";color:var(--muted)}
.delta{display:inline-flex;align-items:center;gap:4px;margin-top:5px;font-size:11px;font-weight:600}
.delta.ok{color:var(--ok)}.delta.bad{color:var(--bad)}
.delta svg{width:14px}
.split{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.pane,.card{overflow:hidden}
.head{
  min-height:50px;display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700
}
.head span:first-child{display:flex;align-items:center;gap:7px}
.head svg{width:18px;color:var(--blue)}
.body{padding:16px}
.listitem{
  display:flex;gap:11px;padding:13px 15px;border-bottom:1px solid var(--line);
  border-left:4px solid transparent;transition:background .2s,border-color .2s
}
.listitem:last-child{border-bottom:0}
.listitem:hover,.listitem.sel{background:#EFF6FF;border-left-color:var(--blue)}
.li-icon{
  width:34px;height:34px;display:grid;place-items:center;flex:none;
  color:var(--blue);background:#DBEAFE;border-radius:6px
}
.li-icon svg{width:18px}
.li-main{min-width:0;flex:1}
.li-title{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:13px}
.code{color:var(--muted);font-size:10.5px;white-space:nowrap}
.sub{margin-top:2px;color:var(--muted);font-size:12px}
.meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.tag{
  display:inline-flex;align-items:center;gap:4px;padding:3px 8px;
  border:1px solid transparent;border-radius:999px;font-size:11px;
  font-weight:600;white-space:nowrap
}
.tag svg{width:13px;height:13px}
.ok{color:#166534;background:#DCFCE7;border-color:#BBF7D0}
.warn{color:#854D0E;background:#FEF9C3;border-color:#FDE68A}
.bad{color:#991B1B;background:#FEE2E2;border-color:#FECACA}
.info{color:#1E40AF;background:#DBEAFE;border-color:#BFDBFE}
.neutral{color:#334155;background:#F1F5F9;border-color:#CBD5E1}
.accent{color:#7C2D12;background:#FFEDD5;border-color:#FED7AA}
.btn{
  min-height:38px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 13px;color:var(--ink);background:#fff;border:1px solid #CBD5E1;
  border-radius:6px;font-weight:600;transition:background .2s,border-color .2s,transform .2s
}
.btn:hover{background:#F8FAFC;border-color:#94A3B8;transform:translateY(-1px)}
.btn svg{width:16px}
.btn.primary{color:var(--color-on-accent);background:var(--color-accent);border-color:#C2410C}
.btn.primary:hover{background:#C2410C;color:#fff}
.chart{position:relative;height:220px}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:13px}
.tbl{overflow-x:auto}
th{
  padding:11px 12px;text-align:left;color:#334155;background:#F1F5F9;
  border-bottom:2px solid #CBD5E1;font-size:11px;font-weight:700;white-space:nowrap
}
td{padding:11px 12px;border-bottom:1px solid var(--line)}
tbody tr:hover{background:#F8FAFC}
tbody tr:last-child td{border-bottom:0}
td.num{text-align:right}
.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:12px 0}
.dl dt{color:var(--muted)}.dl dd{margin:0;text-align:right;font-weight:600}
.divider{height:1px;margin:14px 0;background:var(--line)}
.bar{height:7px;overflow:hidden;background:#E2E8F0;border-radius:999px}
.bar span{display:block;height:100%;background:var(--blue);border-radius:inherit}
.alert{
  display:flex;align-items:flex-start;gap:11px;margin-bottom:10px;padding:12px;
  background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:6px
}
.alert.high{border-left-color:var(--bad)}.alert.mid{border-left-color:#B45309}
.alert-icon{width:33px;height:33px;display:grid;place-items:center;flex:none;border-radius:6px;background:#F1F5F9}
.alert.high .alert-icon{color:var(--bad);background:#FEE2E2}
.alert.mid .alert-icon{color:#92400E;background:#FEF3C7}
.alert-icon svg{width:18px}
.alert-main{min-width:0;flex:1}.alert-title{font-weight:700}.alert-copy{color:var(--muted);font-size:12px}
.qcard{position:relative;padding:17px}
.qcard.best{border:2px solid var(--blue)}
.flag{position:absolute;right:12px;top:-11px;padding:3px 9px;color:#fff;background:var(--blue);border-radius:999px;font-size:10px;font-weight:700}
.qhead{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.qavatar{width:36px;height:36px;display:grid;place-items:center;color:#fff;background:var(--blue);border-radius:6px;font-weight:700}
.qprice{font:700 23px "Fira Code";letter-spacing:-.04em}
.qrow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12px}
.qrow span{color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.col{padding:10px;background:#F1F5F9;border:1px solid var(--line);border-radius:6px}
.colhead{display:flex;justify-content:space-between;margin-bottom:9px;font-weight:700}
.ticket{margin-bottom:9px;padding:11px;background:#fff;border:1px solid var(--line);border-top:4px solid var(--blue);border-radius:6px}
.ticket:last-child{margin-bottom:0}
.ticket b{display:block}.ticket small{color:var(--muted)}
.timeline{position:relative;padding-left:25px}
.timeline:before{content:"";position:absolute;left:7px;top:5px;bottom:5px;width:2px;background:#CBD5E1}
.timeitem{position:relative;padding-bottom:17px}
.timeitem:before{content:"";position:absolute;left:-23px;top:3px;width:12px;height:12px;background:#fff;border:3px solid var(--blue);border-radius:50%}
.timeitem.done:before{background:var(--blue)}
.approval{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.node{width:36px;height:36px;display:grid;place-items:center;flex:none;color:#fff;background:#94A3B8;border-radius:50%;font-weight:700}
.node.done{background:var(--ok)}.node.cur{background:var(--color-accent);color:#000;box-shadow:0 0 0 5px #FFEDD5}
.check{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.checkmark{width:24px;height:24px;display:grid;place-items:center;flex:none;color:#fff;background:var(--ok);border-radius:5px}
.checkmark.ng{background:var(--bad)}
.checkmark svg{width:15px}
.check-info{flex:1}.check-info small{display:block;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.footer{margin-top:auto;padding:18px;text-align:center;color:var(--muted);background:#fff;border-top:1px solid var(--line);font-size:12px}
.enter{animation:enter .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@media(max-width:1080px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .grid3{grid-template-columns:repeat(2,1fr)}
  .board{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:800px){
  .split,.grid2,.grid3{grid-template-columns:1fr}
  .nav{position:static}
  .hero{grid-template-columns:1fr}
}
@media(max-width:560px){
  .topbar{min-height:64px}.nav{top:64px}
  .search,.user div:last-child,.brand p,.nav .txt{display:none}
  .nav button{padding:9px 11px}
  .kpis,.board{grid-template-columns:1fr}
  .hero{padding:21px 18px}.hero-side{display:none}
  .wrap{padding-top:18px}
  .alert{flex-wrap:wrap}.alert .btn{width:100%}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation:none!important;transition:none!important}
  .enter{opacity:1;transform:none}
}
</style>
</head>
