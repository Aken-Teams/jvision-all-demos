<style>
:root{
  --green:#15803d; --green2:#4ade80; --green-d:#166534; --green-l:#dcfce7;
  --ink:#0f2417; --muted:#5b7365; --line:#e2ede6; --bg:#f2f7f3; --card:#ffffff;
  --amber:#d97706; --red:#dc2626; --blue:#2563eb; --slate:#64748b;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;font-size:20px}
button{font-family:inherit;cursor:pointer}
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(120deg,var(--green-d),var(--green));color:#fff;box-shadow:0 2px 14px rgba(21,128,61,.28)}
.topbar-in{max-width:1360px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.brand .logo .material-symbols-outlined{font-size:24px}
.brand b{font-size:16px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.brand span{display:block;font-size:11px;opacity:.82;font-weight:500}
.store-pill{margin-left:auto;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:600;white-space:nowrap;flex:none}
.store-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--green2);box-shadow:0 0 0 0 rgba(74,222,128,.7);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.7)}70%{box-shadow:0 0 0 7px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.nav{background:var(--green-d);border-bottom:1px solid rgba(255,255,255,.08)}
.nav-in{max-width:1360px;margin:0 auto;padding:8px 12px;display:flex;gap:7px;flex-wrap:wrap;min-width:0}
.nav button{flex:none;white-space:nowrap;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#e8f5ec;padding:8px 14px;border-radius:10px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px;transition:.16s}
.nav button .material-symbols-outlined{font-size:19px}
.nav button:hover{background:rgba(255,255,255,.16)}
.nav button.on{background:var(--green2);color:#0a3d1e;border-color:var(--green2);box-shadow:0 4px 12px rgba(74,222,128,.3)}
main{max-width:1360px;margin:0 auto;padding:20px 16px 48px;min-width:0}
.scr-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px;min-width:0}
.scr-head h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.3px}
.scr-head p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:20px;background:var(--green-l);color:var(--green-d)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;min-width:0;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-12px;top:-12px;width:56px;height:56px;border-radius:50%;background:var(--green-l);opacity:.5}
.kpi .k-ico{width:38px;height:38px;border-radius:11px;background:var(--green-l);color:var(--green-d);display:grid;place-items:center;margin-bottom:10px}
.kpi .k-val{font-size:25px;font-weight:800;letter-spacing:.4px}
.kpi .k-lab{font-size:12.5px;color:var(--muted);margin-top:2px;font-weight:500}
.kpi .k-sub{font-size:11.5px;margin-top:6px;font-weight:600}
.up{color:var(--green)}.dn{color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.card h3{margin:0 0 14px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .material-symbols-outlined{font-size:20px;color:var(--green)}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.4px}
td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:hover{background:#f7fbf8}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px}
.b-green{background:var(--green-l);color:var(--green-d)}
.b-amber{background:#fef3c7;color:#92400e}
.b-red{background:#fee2e2;color:#991b1b}
.b-blue{background:#dbeafe;color:#1e40af}
.b-slate{background:#e2e8f0;color:#334155}
.chartbox{position:relative;height:260px;width:100%}
.chartbox.sm{height:200px}
canvas{max-width:100%}
.mini-bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden}
.mini-bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--green),var(--green2))}
.pos-wrap{display:grid;grid-template-columns:1fr 360px;gap:16px}
.menu-cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.menu-cats button{border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 14px;border-radius:20px;font-size:13px;font-weight:600}
.menu-cats button.on{background:var(--green);color:#fff;border-color:var(--green)}
.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.dish{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff;transition:.16s;cursor:pointer}
.dish:hover{border-color:var(--green2);box-shadow:0 6px 16px rgba(21,128,61,.1);transform:translateY(-2px)}
.dish .emoji{font-size:30px}
.dish .dn2{font-weight:700;font-size:14px;margin-top:6px}
.dish .dp{color:var(--green-d);font-weight:800;font-size:15px;margin-top:3px}
.dish .dmeta{font-size:11px;color:var(--muted);margin-top:4px}
.ticket{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;min-width:0}
.ticket .thd{display:flex;justify-content:space-between;align-items:center;border-bottom:2px dashed var(--line);padding-bottom:11px;margin-bottom:6px;gap:8px;flex-wrap:wrap}
.oitem{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.oitem .oq{width:26px;height:26px;border-radius:8px;background:var(--green-l);color:var(--green-d);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.oitem .on2{flex:1;min-width:0}
.oitem .on2 b{font-size:13.5px;font-weight:700}
.oitem .on2 small{display:block;color:var(--muted);font-size:11px}
.oitem .op{font-weight:700;font-size:13.5px}
.tsum{margin-top:auto;padding-top:12px}
.tsum .row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:var(--muted)}
.tsum .row.tot{font-size:19px;font-weight:800;color:var(--ink);border-top:2px solid var(--line);margin-top:6px;padding-top:10px}
.paybtn{margin-top:12px;width:100%;background:var(--green);color:#fff;border:none;padding:14px;border-radius:12px;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.zone{background:#eef5f0;border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.zone .zh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700;font-size:13.5px}
.zone .zh small{background:#fff;border:1px solid var(--line);border-radius:20px;padding:2px 9px;font-size:11px;color:var(--muted)}
.tbl-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:10px;border-left:4px solid var(--slate);position:relative}
.tbl-card.free{border-left-color:var(--green2)}
.tbl-card.dining{border-left-color:var(--green)}
.tbl-card.bill{border-left-color:var(--amber)}
.tbl-card.book{border-left-color:var(--blue)}
.tbl-card .tno{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px}
.tbl-card .tmeta{font-size:11.5px;color:var(--muted);margin-top:5px;display:flex;flex-wrap:wrap;gap:4px 10px}
.tbl-card .tmeta span{display:inline-flex;align-items:center;gap:3px}
.tbl-card .tmeta .material-symbols-outlined{font-size:14px}
.st-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.kds{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.kcard{border-radius:14px;border:1px solid var(--line);background:#fff;overflow:hidden;min-width:0}
.kcard .khd{padding:10px 12px;color:#fff;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px}
.kcard.new .khd{background:var(--green)}
.kcard.cook .khd{background:var(--amber)}
.kcard.urgent .khd{background:var(--red)}
.kcard.done .khd{background:var(--slate)}
.kcard .kbody{padding:11px 12px}
.kline{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
.kline b{font-weight:700}.kline small{color:var(--muted);display:block;font-size:11px}
.kcard .kfoot{padding:8px 12px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.timer{font-weight:800;font-family:"Inter"}
.timer.warn{color:var(--amber)}.timer.hot{color:var(--red)}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}
.tier{border-radius:15px;padding:15px;color:#fff;position:relative;overflow:hidden;min-width:0}
.tier b{font-size:15px;font-weight:800}
.tier .tc{font-size:27px;font-weight:800;margin-top:6px}
.tier .tl{font-size:12px;opacity:.9;margin-top:2px}
.tier .material-symbols-outlined{position:absolute;right:10px;top:10px;font-size:38px;opacity:.28}
.mlist .mrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;font-size:15px}
.progress-cell{display:flex;align-items:center;gap:8px;min-width:120px}
.progress-cell .mini-bar{flex:1}
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 16px 4px}
.tl-item::before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--green);border:2px solid #fff;box-shadow:0 0 0 2px var(--green-l)}
.tl-item.amber::before{background:var(--amber);box-shadow:0 0 0 2px #fef3c7}
.tl-item b{font-size:13.5px;font-weight:700}
.tl-item small{color:var(--muted);font-size:11.5px;display:block}
.tl-time{font-size:11px;color:var(--muted);font-weight:600}
@media(max-width:1100px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .board{grid-template-columns:repeat(2,1fr)}
  .kds{grid-template-columns:repeat(2,1fr)}
  .tiers{grid-template-columns:repeat(2,1fr)}
  .menu-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:820px){
  .grid2,.grid3,.pos-wrap{grid-template-columns:1fr}
  .pos-wrap{gap:16px}
}
@media(max-width:560px){
  .kpis{grid-template-columns:1fr}
  .board,.kds,.tiers,.menu-grid{grid-template-columns:1fr}
  .nav button .navtx{display:none}
  .nav button{padding:9px 12px}
  .scr-head h1{font-size:19px}
}
.shell>*{min-width:0}
</style>
</head>

var charts={};
function killCharts(){for(var k in charts){try{charts[k].destroy();}catch(e){}}charts={};}

function scrHead(t,d,tag){
  return '<div class="scr-head"><div><h1>'+t+'</h1><p>'+d+'</p></div><span class="tag"><span class="material-symbols-outlined">bolt</span>'+tag+'</span></div>';
}
function kpi(ic,val,lab,dir,sub){
  var c=dir==="up"?"up":dir==="dn"?"dn":"";
  return '<div class="kpi"><div class="k-ico"><span class="material-symbols-outlined">'+ic+'</span></div><div class="k-val">'+val+'</div><div class="k-lab">'+lab+'</div><div class="k-sub '+c+'">'+sub+'</div></div>';
}
function station(n,v,c){
  return '<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><b>'+n+'</b><span style="color:'+c+';font-weight:700">'+v+'%</span></div><div class="mini-bar"><i style="width:'+v+'%;background:'+c+'"></i></div></div>';
}

var GREEN="#15803d",GREEN2="#4ade80",GRID="rgba(21,128,61,.08)";
function baseOpts(extra){
  var o={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{family:"Inter",size:12}}}}};
  if(extra)for(var k in extra)o[k]=extra[k];
  return o;
}

  }
  if(i===5){
    var h=document.getElementById("hourChart");if(h)charts.hour=new Chart(h,{type:"line",data:{labels:["11時","12時","13時","14時","17時","18時","19時","20時","21時"],datasets:[{label:"營收 (千)",data:[18,42,38,12,16,44,52,48,22],borderColor:GREEN,backgroundColor:"rgba(74,222,128,.18)",fill:true,tension:.4,borderWidth:3,pointBackgroundColor:GREEN}]},options:baseOpts({plugins:{legend:{display:false}},scales:{y:{grid:{color:GRID},ticks:{font:{family:"Inter"}}},x:{grid:{display:false},ticks:{font:{family:"Inter"}}}}})});
    var s=document.getElementById("srcChart");if(s)charts.src=new Chart(s,{type:"doughnut",data:{labels:["內用","外帶","外送 (平台)","線上訂位"],datasets:[{data:[58,18,19,5],backgroundColor:[GREEN,GREEN2,"#a7f3d0","#166534"],borderWidth:2,borderColor:"#fff"}]},options:baseOpts({cutout:"58%",plugins:{legend:{position:"bottom",labels:{font:{family:"Inter",size:12},padding:14}}}})});
    var t=document.getElementById("topChart");if(t)charts.top=new Chart(t,{type:"bar",data:{labels:["招牌牛肉麵","珍珠奶茶","鹽酥蝦","三杯雞飯","麻辣臭豆腐","手工水餃"],datasets:[{label:"售出份數",data:[142,128,96,88,74,63],backgroundColor:GREEN,borderRadius:6}]},options:baseOpts({indexAxis:"y",plugins:{legend:{display:false}},scales:{x:{grid:{color:GRID},ticks:{font:{family:"Inter"}}},y:{grid:{display:false},ticks:{font:{family:"Noto Sans TC"}}}}})});
    var w=document.getElementById("weekChart");if(w)charts.week=new Chart(w,{type:"bar",data:{labels:["8/07","8/08","8/09","8/10","8/11","8/12","8/13"],datasets:[{label:"營收 (千)",data:[152,168,161,178,205,232,186],backgroundColor:[GREEN2,GREEN2,GREEN2,GREEN2,GREEN2,GREEN2,GREEN],borderRadius:6}]},options:baseOpts({plugins:{legend:{display:false}},scales:{y:{grid:{color:GRID},ticks:{font:{family:"Inter"}}},x:{grid:{display:false},ticks:{font:{family:"Inter"}}}}})});
  }
}

var RENDER=[v0,v1,v2,v3,v4,v5];
function show(i){
  i=Math.max(0,Math.min(i,RENDER.length-1));
  killCharts();
  var nav=document.getElementById("nav");
  var view=document.getElementById("view");
  view.innerHTML=RENDER[i]();
  Array.prototype.forEach.call(nav.querySelectorAll("[data-i]"),function(b){
    b.classList.toggle("on",+b.getAttribute("data-i")===i);
  });
  void view.offsetHeight;
  initCharts(i);
}

(function(){
  var nav=document.getElementById("nav");
  nav.innerHTML=NAV.map(function(n){
    return '<button data-i="'+n.i+'"><span class="material-symbols-outlined">'+n.ic+'</span><span class="navtx">'+n.t+'</span></button>';
  }).join("");
  Array.prototype.forEach.call(nav.querySelectorAll("[data-i]"),function(b){
    b.addEventListener("click",function(){show(+b.getAttribute("data-i"));try{window.scrollTo(0,0);}catch(e){}});
  });
  show(0);
})();

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
