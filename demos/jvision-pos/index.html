<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>門市銷售 POS｜Jvision 餐廳一體化平台</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;500;600;700;800&family=Rubik:wght@300;400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000;
  --color-secondary:#10b981;
  --color-on-secondary:#0f172a;
  --color-accent:#ea580c;
  --color-on-accent:#000;
  --color-background:#ecfdf5;
  --color-foreground:#064e3b;
  --color-card:#fff;
  --color-card-foreground:#064e3b;
  --color-muted:#e8f1f3;
  --color-muted-foreground:#475569;
  --color-border:#a7f3d0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#059669;
  --blue:#2563eb;
  --ink:#064e3b;
  --muted:#475569;
  --line:#a7f3d0;
  --green:#059669;
  --green2:#10b981;
  --green-d:#065f46;
  --green-l:#d1fae5;
  --amber:#c2410c;
  --red:#dc2626;
  --slate:#64748b;
  --bg:#ecfdf5;
  --card:#fff;
  --shadow:0 8px 0 rgba(6,78,59,.08),0 18px 42px rgba(6,78,59,.09);
  --shadow-sm:0 4px 0 rgba(6,78,59,.08),0 10px 24px rgba(6,78,59,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:"Nunito Sans",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 8% 4%,rgba(16,185,129,.18),transparent 23rem),
    radial-gradient(circle at 96% 25%,rgba(234,88,12,.09),transparent 27rem),
    var(--bg);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:500;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
  font-size:20px;
}
.topbar{
  position:sticky;
  top:0;
  z-index:40;
  color:#fff;
  background:#064e3b;
  border-bottom:1px solid rgba(255,255,255,.14);
}
.topbar::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.18;
  background-image:
    linear-gradient(45deg,transparent 47%,rgba(255,255,255,.25) 48% 52%,transparent 53%);
  background-size:26px 26px;
}
.topbar-in{
  position:relative;
  z-index:1;
  max-width:1440px;
  margin:auto;
  padding:12px 22px;
  display:flex;
  align-items:center;
  gap:16px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{
  width:44px;
  height:44px;
  flex:none;
  display:grid;
  place-items:center;
  color:#052e25;
  background:var(--color-secondary);
  border:2px solid #6ee7b7;
  border-radius:13px 5px 13px 5px;
  box-shadow:4px 4px 0 rgba(0,0,0,.22);
}
.brand .logo .material-symbols-outlined{font-size:26px}
.brand b{
  display:block;
  font-family:"Rubik","Nunito Sans",sans-serif;
  font-size:17px;
  font-weight:800;
  letter-spacing:.02em;
}
.brand span{display:block;font-size:11.5px;color:#d1fae5;font-weight:600}
.store-pill{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 12px;
  color:#ecfdf5;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.22);
  border-radius:999px;
  font-size:12.5px;
  font-weight:700;
  white-space:nowrap;
}
.store-pill .dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#6ee7b7;
  border:2px solid #064e3b;
  box-shadow:0 0 0 2px #6ee7b7;
  animation:pulse 2.2s ease-out infinite;
}
.nav{
  position:sticky;
  top:69px;
  z-index:35;
  background:rgba(236,253,245,.94);
  border-bottom:1px solid var(--line);
  box-shadow:0 7px 20px rgba(6,78,59,.06);
  backdrop-filter:blur(14px);
}
.nav-in{
  max-width:1440px;
  margin:auto;
  padding:10px 20px;
  display:flex;
  gap:8px;
  overflow-x:auto;
  scrollbar-width:none;
}
.nav-in::-webkit-scrollbar{display:none}
.nav button{
  min-height:42px;
  flex:none;
  display:flex;
  align-items:center;
  gap:7px;
  padding:9px 14px;
  color:#065f46;
  background:#fff;
  border:1px solid var(--line);
  border-radius:11px;
  font-size:13.5px;
  font-weight:800;
  white-space:nowrap;
  box-shadow:0 3px 0 rgba(6,78,59,.08);
  transition:transform .22s ease,background-color .22s ease,color .22s ease,box-shadow .22s ease;
}
.nav button:hover{
  transform:translateY(-2px);
  color:#fff;
  background:#047857;
  box-shadow:0 6px 0 rgba(6,78,59,.14);
}
.nav button.on{
  color:#052e25;
  background:var(--color-secondary);
  border-color:#047857;
  box-shadow:4px 4px 0 #065f46;
}
main{max-width:1440px;margin:auto;padding:28px 22px 64px;min-width:0}
.shell>*{min-width:0}
.scr-head{
  position:relative;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:18px;
  margin-bottom:22px;
  padding:24px 26px;
  overflow:hidden;
  background:#064e3b;
  color:#fff;
  border:1px solid #065f46;
  border-radius:22px 8px 22px 8px;
  box-shadow:var(--shadow);
}
.scr-head::before,.scr-head::after{
  content:"";
  position:absolute;
  pointer-events:none;
}
.scr-head::before{
  width:180px;
  height:180px;
  right:7%;
  top:-116px;
  border:24px solid rgba(16,185,129,.3);
  border-radius:50%;
}
.scr-head::after{
  width:90px;
  height:90px;
  right:-28px;
  bottom:-34px;
  background:var(--color-accent);
  transform:rotate(28deg);
  opacity:.85;
}
.scr-head>div,.scr-head>.tag{position:relative;z-index:1}
.scr-head h1{
  margin:0;
  font-family:"Rubik","Nunito Sans",sans-serif;
  font-size:clamp(25px,3vw,37px);
  line-height:1.08;
  font-weight:800;
  letter-spacing:-.02em;
}
.scr-head p{max-width:760px;margin:8px 0 0;color:#d1fae5;font-size:14px;font-weight:600}
.tag{
  display:inline-flex;
  align-items:center;
  gap:6px;
  flex:none;
  min-height:38px;
  padding:8px 12px;
  color:#052e25;
  background:#6ee7b7;
  border:1px solid #a7f3d0;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
  box-shadow:3px 3px 0 rgba(0,0,0,.24);
}
.kpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:15px;
  margin-bottom:20px;
}
.kpi{
  position:relative;
  min-width:0;
  overflow:hidden;
  padding:18px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px 7px 18px 7px;
  box-shadow:var(--shadow-sm);
  transition:transform .24s ease,box-shadow .24s ease,border-color .24s ease;
}
.kpi:hover{
  transform:translateY(-4px);
  border-color:var(--green);
  box-shadow:0 8px 0 rgba(5,150,105,.15),0 22px 40px rgba(6,78,59,.12);
}
.kpi::after{
  content:"";
  position:absolute;
  right:-20px;
  top:-23px;
  width:86px;
  height:86px;
  border-radius:24px;
  background:linear-gradient(135deg,#a7f3d0,#ecfdf5);
  transform:rotate(18deg);
}
.kpi .k-ico{
  position:relative;
  z-index:1;
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  margin-bottom:13px;
  color:#fff;
  background:var(--green);
  border-radius:12px 5px 12px 5px;
  box-shadow:3px 3px 0 #a7f3d0;
}
.kpi .k-val{
  font-family:"Rubik","Nunito Sans",sans-serif;
  font-size:27px;
  line-height:1.1;
  font-weight:800;
  font-variant-numeric:tabular-nums;
}
.kpi .k-lab{margin-top:4px;color:var(--muted);font-size:12.5px;font-weight:700}
.kpi .k-sub{margin-top:8px;font-size:11.5px;font-weight:800}
.up{color:#047857}.dn{color:#b91c1c}
.card,.ticket{
  min-width:0;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px 8px 20px 8px;
  box-shadow:var(--shadow-sm);
}
.card{padding:20px}
.card h3{
  margin:0 0 17px;
  display:flex;
  align-items:center;
  gap:9px;
  color:#064e3b;
  font-family:"Rubik","Nunito Sans",sans-serif;
  font-size:16px;
  font-weight:800;
}
.card h3 .material-symbols-outlined{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--green);
  border-radius:10px 4px 10px 4px;
  font-size:19px;
}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
th{
  padding:11px 10px;
  color:#334155;
  background:#e8f1f3;
  border-top:1px solid #cbd5e1;
  border-bottom:1px solid #cbd5e1;
  text-align:left;
  white-space:nowrap;
  font-size:11.5px;
  font-weight:800;
  letter-spacing:.035em;
}
th:first-child{border-left:1px solid #cbd5e1;border-radius:10px 0 0 10px}
th:last-child{border-right:1px solid #cbd5e1;border-radius:0 10px 10px 0}
td{
  padding:12px 10px;
  border-bottom:1px solid #d9eee4;
  white-space:nowrap;
}
td:nth-child(n+3){font-variant-numeric:tabular-nums}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#ecfdf5}
.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:25px;
  padding:4px 9px;
  border:1px solid transparent;
  border-radius:999px;
  font-size:11.5px;
  line-height:1;
  font-weight:800;
  white-space:nowrap;
}
.badge::before{content:"";width:6px;height:6px;border-radius:2px;background:currentColor}
.b-green{color:#065f46;background:#d1fae5;border-color:#6ee7b7}
.b-amber{color:#9a3412;background:#ffedd5;border-color:#fdba74}
.b-red{color:#991b1b;background:#fee2e2;border-color:#fca5a5}
.b-blue{color:#1e40af;background:#dbeafe;border-color:#93c5fd}
.b-slate{color:#334155;background:#e2e8f0;border-color:#cbd5e1}
.chartbox{position:relative;width:100%;height:270px}
.chartbox.sm{height:210px}
canvas{max-width:100%}
.mini-bar{height:9px;overflow:hidden;background:#d8e5e5;border:1px solid #c6d4d6;border-radius:999px}
.mini-bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--green),#34d399)}
.pos-wrap{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:18px}
.menu-cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.menu-cats button{
  min-height:38px;
  padding:7px 15px;
  color:#065f46;
  background:#fff;
  border:1px solid var(--line);
  border-radius:999px;
  font-size:13px;
  font-weight:800;
  transition:transform .2s ease,background-color .2s ease,color .2s ease;
}
.menu-cats button:hover{transform:translateY(-2px);background:#d1fae5}
.menu-cats button.on{color:#fff;background:#047857;border-color:#047857;box-shadow:3px 3px 0 #a7f3d0}
.menu-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.dish{
  min-height:154px;
  padding:14px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px 6px 16px 6px;
  cursor:pointer;
  box-shadow:0 4px 0 rgba(6,78,59,.07);
  transition:transform .22s ease,border-color .22s ease,background-color .22s ease,box-shadow .22s ease;
}
.dish:hover{
  transform:translateY(-4px) rotate(-.35deg);
  background:#f0fdf4;
  border-color:var(--green);
  box-shadow:5px 6px 0 #a7f3d0;
}
.dish:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.dish .food-icon{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  color:#9a3412;
  background:#ffedd5;
  border:1px solid #fdba74;
  border-radius:12px 5px 12px 5px;
}
.dish .food-icon .material-symbols-outlined{font-size:25px}
.dish .dn2{margin-top:9px;font-size:14px;font-weight:800}
.dish .dp{
  margin-top:5px;
  color:#065f46;
  font-family:"Rubik",sans-serif;
  font-size:16px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
}
.dish .dmeta{margin-top:4px;color:var(--muted);font-size:11.5px;font-weight:600}
.ticket{
  position:sticky;
  top:135px;
  align-self:start;
  display:flex;
  flex-direction:column;
  padding:18px;
  border-top:5px solid var(--color-accent);
}
.ticket .thd{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:9px;
  flex-wrap:wrap;
  margin-bottom:7px;
  padding-bottom:13px;
  border-bottom:2px dashed var(--line);
}
.oitem{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #d9eee4}
.oitem .oq{
  width:29px;
  height:29px;
  flex:none;
  display:grid;
  place-items:center;
  color:#fff;
  background:#047857;
  border-radius:9px 4px 9px 4px;
  font-family:"Rubik",sans-serif;
  font-size:13px;
  font-weight:800;
}
.oitem .on2{flex:1;min-width:0}
.oitem .on2 b{font-size:13.5px;font-weight:800}
.oitem .on2 small{display:block;color:var(--muted);font-size:11px}
.oitem .op{font-family:"Rubik",sans-serif;font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums}
.tsum{margin-top:auto;padding-top:13px}
.tsum .row{display:flex;justify-content:space-between;padding:4px 0;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.tsum .row.tot{
  margin-top:7px;
  padding-top:11px;
  color:var(--ink);
  border-top:2px solid var(--line);
  font-family:"Rubik",sans-serif;
  font-size:20px;
  font-weight:800;
}
.paybtn{
  width:100%;
  min-height:50px;
  margin-top:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  color:#fff;
  background:#c2410c;
  border:1px solid #9a3412;
  border-radius:13px 5px 13px 5px;
  box-shadow:5px 5px 0 #fed7aa;
  font-size:15px;
  font-weight:800;
  transition:transform .2s ease,background-color .2s ease,box-shadow .2s ease;
}
.paybtn:hover{transform:translateY(-2px);background:#9a3412;box-shadow:7px 7px 0 #fed7aa}
.board{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:15px}
.zone{
  min-width:0;
  padding:13px;
  background:#e1f5ec;
  border:1px solid var(--line);
  border-radius:18px 7px 18px 7px;
}
.zone .zh{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:11px;
  font-size:13.5px;
  font-weight:800;
}
.zone .zh small{
  padding:3px 9px;
  color:#334155;
  background:#fff;
  border:1px solid #cbd5e1;
  border-radius:999px;
  font-size:11px;
}
.tbl-card{
  position:relative;
  margin-bottom:10px;
  padding:12px;
  background:#fff;
  border:1px solid var(--line);
  border-left:5px solid var(--slate);
  border-radius:12px 5px 12px 5px;
  box-shadow:0 3px 0 rgba(6,78,59,.06);
}
.tbl-card.free{border-left-color:#10b981}
.tbl-card.dining{border-left-color:#047857}
.tbl-card.bill{border-left-color:#c2410c}
.tbl-card.book{border-left-color:#2563eb}
.tbl-card .tno{display:flex;align-items:center;gap:7px;font-family:"Rubik",sans-serif;font-size:15px;font-weight:800}
.tbl-card .tmeta{display:flex;flex-wrap:wrap;gap:5px 10px;margin-top:6px;color:var(--muted);font-size:11.5px}
.tbl-card .tmeta span{display:inline-flex;align-items:center;gap:3px}
.tbl-card .tmeta .material-symbols-outlined{font-size:14px}
.st-dot{
  width:10px;
  height:10px;
  display:inline-block;
  border:2px solid currentColor;
  border-radius:3px;
  vertical-align:-1px;
}
.kds{display:grid;grid-template-columns:repeat(4,minmax(245px,1fr));gap:14px}
.kcard{
  min-width:0;
  overflow:hidden;
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px 6px 16px 6px;
  box-shadow:var(--shadow-sm);
}
.kcard .khd{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:11px 13px;
  color:#fff;
  font-family:"Rubik",sans-serif;
  font-size:14px;
  font-weight:800;
}
.kcard.new .khd{background:#047857}
.kcard.cook .khd{background:#b45309}
.kcard.urgent .khd{background:#b91c1c}
.kcard.done .khd{background:#475569}
.kcard .khd span:last-child::before{content:"●";margin-right:5px;font-size:9px}
.kcard .kbody{padding:11px 13px}
.kline{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kline b{font-weight:800}
.kline small{display:block;color:var(--muted);font-size:11px}
.kcard .kfoot{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:9px 13px;
  color:var(--muted);
  background:#f8fafc;
  border-top:1px solid var(--line);
  font-size:11.5px;
}
.timer{font-family:"Rubik",sans-serif;font-weight:800;font-variant-numeric:tabular-nums}
.timer.warn{color:#9a3412}.timer.hot{color:#b91c1c}
.tiers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.tier{
  position:relative;
  min-width:0;
  overflow:hidden;
  padding:17px;
  color:#fff;
  border:1px solid rgba(0,0,0,.16);
  border-radius:18px 7px 18px 7px;
  box-shadow:5px 6px 0 rgba(6,78,59,.14);
}
.tier b{font-family:"Rubik",sans-serif;font-size:15px;font-weight:800}
.tier .tc{margin-top:7px;font-family:"Rubik",sans-serif;font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.tier .tl{margin-top:2px;font-size:12px;font-weight:600}
.tier>.material-symbols-outlined{position:absolute;right:10px;top:10px;font-size:40px;opacity:.3}
.mlist .mrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.avatar{
  width:42px;
  height:42px;
  flex:none;
  display:grid;
  place-items:center;
  color:#fff;
  border:2px solid #fff;
  border-radius:13px 5px 13px 5px;
  box-shadow:3px 3px 0 #a7f3d0;
  font-family:"Rubik",sans-serif;
  font-size:15px;
  font-weight:800;
}
.progress-cell{display:flex;align-items:center;gap:8px;min-width:120px}
.progress-cell .mini-bar{flex:1}
.timeline{position:relative;padding-left:24px}
.timeline::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:3px;background:var(--line);border-radius:3px}
.tl-item{position:relative;padding:0 0 17px 5px}
.tl-item::before{
  content:"✓";
  position:absolute;
  left:-23px;
  top:1px;
  width:17px;
  height:17px;
  display:grid;
  place-items:center;
  color:#fff;
  background:#047857;
  border:2px solid #fff;
  border-radius:5px;

  var o={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:"#334155",font:{family:"Nunito Sans",size:12,weight:"600"}}}}};
  if(extra)for(var k in extra)o[k]=extra[k];
  return o;
}

  if(i===5){

    var t=document.getElementById("topChart");
    if(t)charts.top=new Chart(t,{type:"bar",data:{labels:["招牌牛肉麵","珍珠奶茶","鹽酥蝦","三杯雞飯","麻辣臭豆腐","手工水餃"],datasets:[{label:"售出份數",data:[142,128,96,88,74,63],backgroundColor:[GREEN,GREEN2,ACCENT,"#34d399","#047857","#6ee7b7"],borderRadius:7}]},options:baseOpts({indexAxis:"y",plugins:{legend:{display:false}},scales:{x:{grid:{color:GRID},ticks:{color:"#475569",font:{family:"Rubik"}}},y:{grid:{display:false},ticks:{color:"#334155",font:{family:"Nunito Sans",weight:"600"}}}}})});
    var w=document.getElementById("weekChart");

  }
}

var RENDER=[v0,v1,v2,v3,v4,v5];
function show(i){
  i=Math.max(0,Math.min(i,RENDER.length-1));
  killCharts();
  var nav=document.getElementById("nav"),view=document.getElementById("view");
  view.innerHTML=RENDER[i]();
  Array.prototype.forEach.call(nav.querySelectorAll("[data-i]"),function(b){
    var active=+b.getAttribute("data-i")===i;
    b.classList.toggle("on",active);
    b.setAttribute("aria-current",active?"page":"false");
  });
  void view.offsetHeight;
  initCharts(i);
}
function navigate(i){
  var next="#v"+i;
  if(location.hash!==next)location.hash=next;
  else show(i);
  try{window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});}catch(e){window.scrollTo(0,0);}
}
(function(){
  var nav=document.getElementById("nav");
  nav.innerHTML=NAV.map(function(n){
    return'<button type="button" data-i="'+n.i+'" aria-label="'+n.t+'"><span class="material-symbols-outlined">'+n.ic+'</span><span class="navtx">'+n.t+'</span></button>';
  }).join("");
  Array.prototype.forEach.call(nav.querySelectorAll("[data-i]"),function(b){
    b.addEventListener("click",function(){navigate(+b.getAttribute("data-i"));});
  });
})();
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  var n=document.querySelectorAll("[data-i]").length||6;
  show(m?Math.min(+m[1],n-1):0);
  try{window.scrollTo(0,0);}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
