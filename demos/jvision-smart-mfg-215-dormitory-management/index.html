<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>員工宿舍管理系統（Dormitory Management）</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{--accent:#1d4ed8;--accent2:#60a5fa;--bg:#f1f5f9;--card:#ffffff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;overflow-x:hidden;}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
header{background:linear-gradient(100deg,#1d4ed8,#2563eb);color:#fff;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(29,78,216,.25);}
.hbar{max-width:1360px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.logo .material-symbols-outlined{font-size:24px;}
.brand h1{font-size:16px;margin:0;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brand p{margin:0;font-size:11px;opacity:.82;white-space:nowrap;}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0;}
.nb{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.10);color:#fff;border:1px solid rgba(255,255,255,.14);padding:8px 12px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap;}
.nb:hover{background:rgba(255,255,255,.22);}
.nb.on{background:#fff;color:var(--accent);border-color:#fff;}
.nb .material-symbols-outlined{font-size:18px;}
main{max-width:1360px;margin:0 auto;padding:20px 18px 60px;}
.scr-h{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.scr-h h2{margin:0;font-size:22px;font-weight:900;}
.scr-h .tag{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);padding:4px 10px;border-radius:20px;font-weight:600;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;}
.card h3{margin:0 0 12px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:20px;color:var(--accent);}
.grid{display:grid;gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:1.6fr 1fr;}
.g32{grid-template-columns:1fr 1.5fr;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;position:relative;overflow:hidden;min-width:0;}
.kpi .ic{width:40px;height:40px;border-radius:10px;background:#eff6ff;color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600;}
.kpi .val{font-size:26px;font-weight:900;line-height:1.1;margin:2px 0;}
.kpi .sub{font-size:11px;color:var(--muted);}
.kpi .dt{font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;display:inline-block;}
.up{background:#dcfce7;color:#166534;}.dn{background:#fee2e2;color:#991b1b;}.fl{background:#e0e7ff;color:#3730a3;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap;font-size:12px;}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-block;}
.p-ok{background:#dcfce7;color:#166534;}.p-warn{background:#fef3c7;color:#92400e;}.p-bad{background:#fee2e2;color:#991b1b;}.p-info{background:#dbeafe;color:#1e40af;}.p-mut{background:#f1f5f9;color:#475569;}
.chart{width:100%;overflow:hidden;}
.bar-line{height:8px;border-radius:6px;background:#eef2f7;overflow:hidden;}
.bar-line>span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#1d4ed8,#60a5fa);}
.floor{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;}
.room{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;min-width:0;}
.room .rn{font-weight:800;font-size:13px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.beds{display:flex;gap:5px;flex-wrap:wrap;}
.bed{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;}
.b-use{background:#1d4ed8;}.b-free{background:#e2e8f0;color:#94a3b8;}.b-hold{background:#f59e0b;}.b-out{background:#94a3b8;}
.kan{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.col{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0;}
.col>.ch{font-size:13px;font-weight:800;margin-bottom:10px;display:flex;justify-content:space-between;}
.tk{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:9px;border-left:3px solid var(--accent);}
.tk .tt{font-size:13px;font-weight:700;margin-bottom:4px;}
.tk .tm{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;}
.tl{position:relative;padding-left:22px;}
.tl:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl-i{position:relative;padding:0 0 16px 6px;}
.tl-i:before{content:"";position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent2);}
.tl-i .tt{font-size:13px;font-weight:700;}
.tl-i .tm{font-size:11px;color:var(--muted);}
.tl-i .td{font-size:12px;color:#334155;margin-top:2px;}
.chk{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:11px;margin-bottom:9px;background:#fff;}
.chk .ck{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.chk .ck.done{background:#dcfce7;color:#16a34a;}.chk .ck.wait{background:#fef3c7;color:#d97706;}.chk .ck.na{background:#f1f5f9;color:#94a3b8;}
.chk .cx{flex:1;min-width:0;}
.chk .cx .a{font-size:13px;font-weight:700;}
.chk .cx .b{font-size:11px;color:var(--muted);}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block;}
.mt{margin-top:16px;}
.flowbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.flowbar .fs{flex:1;min-width:120px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:12px;position:relative;}
.flowbar .fs b{display:block;font-size:13px;color:var(--accent);margin-bottom:2px;}
.flowbar .fs small{color:var(--muted);}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;gap:10px;}
.mrow:last-child{border-bottom:none;}
.mrow b{font-weight:800;}
@media(max-width:820px){
 .g4,.g3,.g2,.g23,.g32,.kan{grid-template-columns:1fr;}
 .g4.half{grid-template-columns:1fr 1fr;}
}
@media(max-width:560px){
 .nb span.txt{display:none;}
 .nb{padding:8px 10px;}
 .scr-h h2{font-size:18px;}
}
</style>
</head>
<body>
<header>
 <div class="hbar">
  <div class="brand">
   <div class="logo"><span class="material-symbols-outlined">apartment</span></div>
   <div>
    <h1>員工宿舍管理系統</h1>
    <p>Dormitory Management · 床位調度 · 住宿費代扣 · 門禁稽核</p>
   </div>
  </div>
  <nav id="nav"></nav>
 </div>
</header>
<main><div id="app"></div></main>
<script>
var MODS=[
 {icon:"dashboard",name:"宿舍總覽"},
 {icon:"account_tree",name:"床位分配"},
 {icon:"receipt_long",name:"住宿費代扣"},
 {icon:"shield",name:"門禁訪客"},
 {icon:"build",name:"報修違規"},
 {icon:"fact_check",name:"退宿點交"}
];
var app=document.getElementById("app");
function navHTML(){
 var h="";
 for(var i=0;i<MODS.length;i++){
  h+='<button class="nb" data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span><span class="txt">'+MODS[i].name+'</span></button>';
 }
 return h;
}
document.getElementById("nav").innerHTML=navHTML();

function ic(n){return '<span class="material-symbols-outlined">'+n+'</span>';}
function kpi(icn,lbl,val,sub,dt,cls){
 return '<div class="kpi"><div class="ic">'+ic(icn)+'</div><div class="lbl">'+lbl+'</div><div class="val">'+val+'</div><div class="sub">'+sub+'</div>'+(dt?'<div style="margin-top:8px"><span class="dt '+cls+'">'+dt+'</span></div>':'')+'</div>';
}
function bar(p){return '<div class="bar-line"><span style="width:'+p+'%"></span></div>';}
function mkChart(id,opt){
 var el=document.getElementById(id);
 if(!el)return;
 try{var c=new ApexCharts(el,opt);c.render();}catch(e){}
}

/* ============ SCREEN 0: 宿舍總覽 ============ */
function s0(){
 var h='<div class="scr-h"><h2>宿舍總覽</h2><span class="tag">即時床位使用率看板</span></div>';
 h+='<div class="grid g4">';
 h+=kpi("hotel","總床位數","1,248","A/B/C 三棟宿舍","+48 本季擴充","up");
 h+=kpi("groups","目前入住","1,061","含外籍移工 372 人","入住率 85.0%","fl");
 h+=kpi("bed","可用空床","172","可即時分配","-23 本週","dn");
 h+=kpi("receipt_long","住宿費對帳","99.2%","本月代扣正確率","達標","up");
 h+='</div>';
 h+='<div class="grid g23 mt">';
 h+='<div class="card"><h3>'+ic("monitoring")+'近 6 週床位使用率</h3><div id="c0a" class="chart"></div></div>';
 h+='<div class="card"><h3>'+ic("donut_small")+'各棟入住分布</h3><div id="c0b" class="chart"></div></div>';
 h+='</div>';
 var blds=[
  {n:"A 棟 · 男性宿舍",cap:520,use:468},
  {n:"B 棟 · 女性宿舍",cap:408,use:351},
  {n:"C 棟 · 移工宿舍",cap:320,use:242}
 ];
 h+='<div class="grid g2 mt">';
 h+='<div class="card"><h3>'+ic("apartment")+'棟別使用概況</h3>';
 for(var i=0;i<blds.length;i++){var b=blds[i];var p=Math.round(b.use/b.cap*100);
  h+='<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span style="font-weight:700">'+b.n+'</span><b>'+b.use+' / '+b.cap+'（'+p+'%）</b></div>'+bar(p)+'</div>';
 }
 h+='</div>';
 var alerts=[
  {t:"C 棟 302 室水管滲漏待派工",lv:"p-bad",tm:"08:12"},
  {t:"B 棟本月住宿費 3 筆代扣差異待核",lv:"p-warn",tm:"09:40"},
  {t:"A 棟今日退宿 5 人待點交",lv:"p-info",tm:"10:05"},
  {t:"外籍移工新入住 12 人待分配床位",lv:"p-info",tm:"11:20"},
  {t:"A 棟訪客登記逾時未離場 2 筆",lv:"p-warn",tm:"12:30"}
 ];
 h+='<div class="card"><h3>'+ic("notifications_active")+'今日待辦提醒</h3>';
 for(var j=0;j<alerts.length;j++){var a=alerts[j];
  h+='<div class="mrow"><span>'+a.t+'</span><span class="pill '+a.lv+'">'+a.tm+'</span></div>';
 }
 h+='</div></div>';
 app.innerHTML=h;
 void app.offsetHeight;
 mkChart("c0a",{
  chart:{type:"area",height:280,redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false}},
  colors:["#1d4ed8"],dataLabels:{enabled:false},stroke:{curve:"smooth",width:3},
  fill:{type:"gradient",gradient:{opacityFrom:.4,opacityTo:.05}},
  series:[{name:"使用率(%)",data:[79,81,80,83,84,85]}],
  xaxis:{categories:["第1週","第2週","第3週","第4週","第5週","第6週"]},
  yaxis:{min:60,max:100,labels:{formatter:function(v){return v+"%";}}},
  grid:{borderColor:"#eef2f7"}
 });
 mkChart("c0b",{
  chart:{type:"donut",height:280,redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false}},
  colors:["#1d4ed8","#60a5fa","#93c5fd"],labels:["A 棟","B 棟","C 棟"],
  series:[468,351,242],legend:{position:"bottom"},dataLabels:{enabled:true},
  plotOptions:{pie:{donut:{size:"62%"}}}
 });
}

/* ============ SCREEN 1: 床位分配 ============ */
function s1(){
 var h='<div class="scr-h"><h2>床位分配</h2><span class="tag">房間床位視覺化調度</span></div>';
 h+='<div class="grid g4 half">';
 h+=kpi("bed","可分配空床","172","三棟合計","","fl");
 h+=kpi("pending_actions","待分配申請","24","含移工 12 人","","fl");
 h+=kpi("swap_horiz","本週異動","57","入住 39 / 遷床 18","","fl");
 h+=kpi("event_available","今日可入住","16","已備妥床位卡","","up");
 h+='</div>';
 h+='<div class="grid g32 mt">';
 var rooms=[
  {n:"A-201",beds:["u","u","u","f"]},{n:"A-202",beds:["u","u","f","f"]},
  {n:"A-203",beds:["u","u","u","u"]},{n:"A-205",beds:["u","h","f","f"]},
  {n:"A-206",beds:["u","u","u","f"]},{n:"A-207",beds:["o","o","u","u"]},
  {n:"B-301",beds:["u","u","f"]},{n:"B-302",beds:["u","u","u"]},
  {n:"B-303",beds:["u","h","f"]},{n:"B-305",beds:["u","u","f"]},
  {n:"C-101",beds:["u","u","u","u","f","f"]},{n:"C-102",beds:["u","u","u","f","f","f"]}
 ];
 h+='<div class="card"><h3>'+ic("grid_view")+'樓層床位圖（A/B/C 棟）</h3><div class="floor">';
 for(var i=0;i<rooms.length;i++){var r=rooms[i];var use=0;
  var bh="";for(var k=0;k<r.beds.length;k++){var s=r.beds[k];
   var cl=s=="u"?"b-use":s=="f"?"b-free":s=="h"?"b-hold":"b-out";
   if(s=="u")use++;
   bh+='<div class="bed '+cl+'">'+(k+1)+'</div>';
  }
  h+='<div class="room"><div class="rn"><span>'+r.n+'</span><span style="font-size:11px;color:#64748b;font-weight:600">'+use+'/'+r.beds.length+'</span></div><div class="beds">'+bh+'</div></div>';
 }
 h+='</div><div class="legend"><span><i class="dot" style="background:#1d4ed8"></i>已入住</span><span><i class="dot" style="background:#e2e8f0"></i>空床</span><span><i class="dot" style="background:#f59e0b"></i>保留</span><span><i class="dot" style="background:#94a3b8"></i>停用</span></div></div>';
 var reqs=[
  {id:"AP-2401",nm:"陳建宏",gd:"男",sh:"日班",nt:"本國",sug:"A-205 · 3床",st:"p-warn",stt:"待確認"},
  {id:"AP-2402",nm:"Nguyen T.",gd:"男",sh:"夜班",nt:"越南",sug:"C-102 · 4床",st:"p-info",stt:"可分配"},
  {id:"AP-2403",nm:"林雅婷",gd:"女",sh:"日班",nt:"本國",sug:"B-301 · 3床",st:"p-info",stt:"可分配"},
  {id:"AP-2404",nm:"Sutrisno",gd:"男",sh:"夜班",nt:"印尼",sug:"C-102 · 5床",st:"p-info",stt:"可分配"},
  {id:"AP-2405",nm:"王志明",gd:"男",sh:"日班",nt:"本國",sug:"A-202 · 3床",st:"p-warn",stt:"待確認"}
 ];
 h+='<div class="card"><h3>'+ic("assignment_ind")+'待分配申請</h3><div style="overflow-x:auto"><table><thead><tr><th>申請單</th><th>姓名</th><th>性別</th><th>班別</th><th>國籍</th><th>建議床位</th><th>狀態</th></tr></thead><tbody>';
 for(var j=0;j<reqs.length;j++){var q=reqs[j];
  h+='<tr><td style="font-weight:700">'+q.id+'</td><td>'+q.nm+'</td><td>'+q.gd+'</td><td>'+q.sh+'</td><td>'+q.nt+'</td><td>'+q.sug+'</td><td><span class="pill '+q.st+'">'+q.stt+'</span></td></tr>';
 }
 h+='</tbody></table></div></div>';
 h+='</div>';
 app.innerHTML=h;
 void app.offsetHeight;
}

/* ============ SCREEN 2: 住宿費代扣 ============ */
function s2(){
 var h='<div class="scr-h"><h2>住宿費代扣</h2><span class="tag">住宿費計算與薪資對帳</span></div>';
 h+='<div class="grid g4">';
 h+=kpi("payments","本月應收","NT$ 848,600","1,061 人 · 分級計費","+3.1%","fl");
 h+=kpi("account_balance_wallet","已代扣","NT$ 841,800","與薪資系統同步","99.2%","up");
 h+=kpi("error","差異待核","NT$ 6,800","共 3 筆","-5 筆","dn");
 h+=kpi("verified","對帳正確率","99.2%","本月結算","達標","up");
 h+='</div>';
 h+='<div class="grid g2 mt">';
 h+='<div class="card"><h3>'+ic("bar_chart")+'近 6 月代扣金額趨勢</h3><div id="c2a" class="chart"></div></div>';
 h+='<div class="card"><h3>'+ic("pie_chart")+'費用等級分布</h3><div id="c2b" class="chart"></div></div>';
 h+='</div>';
 var rows=[
  {emp:"陳建宏",bed:"A-205-3",lv:"單人套房",amt:"2,400",days:30,st:"p-ok",stt:"已代扣"},
  {emp:"林雅婷",bed:"B-301-1",lv:"雙人房",amt:"1,200",days:30,st:"p-ok",stt:"已代扣"},
  {emp:"Nguyen T.",bed:"C-102-2",lv:"移工四人房",amt:"800",days:22,st:"p-warn",stt:"差異待核"},
  {emp:"王志明",bed:"A-202-2",lv:"雙人房",amt:"1,200",days:30,st:"p-ok",stt:"已代扣"},
  {emp:"Sutrisno",bed:"C-102-5",lv:"移工六人房",amt:"600",days:15,st:"p-warn",stt:"差異待核"},
  {emp:"張淑芬",bed:"B-303-1",lv:"雙人房",amt:"1,200",days:30,st:"p-ok",stt:"已代扣"},
  {emp:"李冠廷",bed:"A-206-4",lv:"四人房",amt:"900",days:30,st:"p-mut",stt:"新入住"}
 ];
 h+='<div class="card mt"><h3>'+ic("table_rows")+'本月住宿費代扣明細</h3><div style="overflow-x:auto"><table><thead><tr><th>員工</th><th>床位</th><th>房型等級</th><th>金額(NT$)</th><th>計費天數</th><th>狀態</th></tr></thead><tbody>';
 for(var i=0;i<rows.length;i++){var r=rows[i];
  h+='<tr><td style="font-weight:700">'+r.emp+'</td><td>'+r.bed+'</td><td>'+r.lv+'</td><td>'+r.amt+'</td><td>'+r.days+' 天</td><td><span class="pill '+r.st+'">'+r.stt+'</span></td></tr>';
 }
 h+='</tbody></table></div></div>';
 app.innerHTML=h;
 void app.offsetHeight;
 mkChart("c2a",{
  chart:{type:"bar",height:290,redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false}},

var SCREENS=[s0,s1,s2,s3,s4,s5];
function show(i){
 var btns=document.querySelectorAll("[data-i]");
 for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
 SCREENS[i]();
}
var nbtns=document.querySelectorAll("[data-i]");
for(var q=0;q<nbtns.length;q++){
 nbtns[q].addEventListener("click",function(){show(+this.getAttribute("data-i"));try{window.scrollTo(0,0);}catch(e){}});
}
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
