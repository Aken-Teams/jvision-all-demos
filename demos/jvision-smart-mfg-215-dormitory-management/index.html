<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>員工宿舍管理系統（Dormitory Management）</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
 --color-primary:#0D9488;
 --color-on-primary:#000000;
 --color-secondary:#2DD4BF;
 --color-on-secondary:#0F172A;
 --color-accent:#D97706;
 --color-on-accent:#000000;
 --color-background:#F0FDFA;
 --color-foreground:#134E4A;
 --color-card:#FFFFFF;
 --color-card-foreground:#134E4A;
 --color-muted:#E8F1F4;
 --color-muted-foreground:#475569;
 --color-border:#5EEAD4;
 --color-destructive:#DC2626;
 --color-on-destructive:#FFFFFF;
 --color-ring:#0D9488;
 --blue:#0D9488;
 --ink:#134E4A;
 --muted:#475569;
 --line:#99E6DC;
 --shadow:0 12px 30px rgba(19,78,74,.07);
 --shadow-hover:0 16px 38px rgba(19,78,74,.12);
 --serif:"Cormorant Garamond","Crimson Pro","Noto Serif TC","PingFang TC",serif;
 --body:"Crimson Pro","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
 --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%;overflow-x:hidden}
body{
 background:
  linear-gradient(rgba(13,148,136,.035) 1px,transparent 1px),
  linear-gradient(90deg,rgba(13,148,136,.035) 1px,transparent 1px),
  var(--color-background);
 background-size:32px 32px;
 color:var(--ink);
 font-family:var(--body);
 font-size:16px;
 line-height:1.45;
 -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,a,[data-i]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
 outline:3px solid var(--color-ring);
 outline-offset:3px;
}
.material-symbols-outlined{
 width:1em;
 height:1em;
 display:inline-flex;
 align-items:center;
 justify-content:center;
 flex:0 0 auto;
}
.material-symbols-outlined svg{
 width:100%;
 height:100%;
 fill:none;
 stroke:currentColor;
 stroke-width:1.8;
 stroke-linecap:round;
 stroke-linejoin:round;
}
header{
 position:sticky;
 top:0;
 z-index:50;
 color:#fff;
 background:rgba(15,118,110,.97);
 border-bottom:1px solid rgba(255,255,255,.22);
 box-shadow:0 8px 25px rgba(19,78,74,.18);
 backdrop-filter:blur(14px);
}
.hbar{
 width:min(100% - 32px,1400px);
 min-height:74px;
 margin:auto;
 display:flex;
 align-items:center;
 gap:24px;
}
.brand{
 display:flex;
 align-items:center;
 gap:12px;
 min-width:270px;
}
.logo{
 width:42px;
 height:42px;
 display:grid;
 place-items:center;
 flex:0 0 auto;
 color:#042f2e;
 background:var(--color-secondary);
 border:1px solid rgba(255,255,255,.5);
 border-radius:8px;
 box-shadow:4px 4px 0 rgba(4,47,46,.26);
}
.logo .material-symbols-outlined{font-size:25px}
.brand h1{
 margin:0;
 font-family:var(--serif);
 font-size:21px;
 font-weight:700;
 line-height:1.05;
 letter-spacing:.02em;
}
.brand p{
 margin:4px 0 0;
 color:#ccfbf1;
 font-family:var(--body);
 font-size:12px;
 line-height:1.15;
 white-space:nowrap;
}
nav{
 margin-left:auto;
 display:flex;
 align-items:center;
 gap:4px;
 overflow-x:auto;
 scrollbar-width:none;
}
nav::-webkit-scrollbar{display:none}
.nb{
 min-height:44px;
 padding:9px 11px;
 display:inline-flex;
 align-items:center;
 justify-content:center;
 gap:6px;
 color:#ecfeff;
 background:transparent;
 border:1px solid transparent;
 border-radius:6px;
 font-size:14px;
 font-weight:600;
 white-space:nowrap;
 transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .2s ease;
}
.nb:hover{
 background:rgba(255,255,255,.12);
 border-color:rgba(255,255,255,.24);
}
.nb.on{
 color:#042f2e;
 background:#fff;
 border-color:#fff;
 box-shadow:inset 0 -3px 0 var(--color-accent);
}
.nb .material-symbols-outlined{font-size:18px}
main{
 width:min(100% - 36px,1400px);
 margin:auto;
 padding:34px 0 70px;
}
.scr-h{
 margin-bottom:22px;
 padding-bottom:14px;
 display:flex;
 align-items:flex-end;
 gap:14px;
 border-bottom:1px solid var(--line);
}
.scr-h:before{
 content:"";
 width:6px;
 height:42px;
 flex:0 0 auto;
 background:var(--color-accent);
}
.scr-h h2{
 margin:0;
 font-family:var(--serif);
 font-size:34px;
 font-weight:700;
 line-height:.95;
 letter-spacing:-.02em;
}
.scr-h .tag{
 margin-left:auto;
 padding:5px 10px;
 color:#285e59;
 background:#fff;
 border:1px solid var(--line);
 border-radius:4px;
 font-size:13px;
 font-weight:600;
}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g32{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
.mt{margin-top:18px}
.card,.kpi{
 min-width:0;
 background:var(--color-card);
 border:1px solid var(--line);
 border-radius:8px;
 box-shadow:var(--shadow);
 transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease;
}
.card:hover,.kpi:hover{
 border-color:var(--color-primary);
 box-shadow:var(--shadow-hover);
 transform:translateY(-2px);
}
.card{padding:20px}
.card h3{
 margin:0 0 17px;
 display:flex;
 align-items:center;
 gap:9px;
 color:#134e4a;
 font-family:var(--serif);
 font-size:20px;
 font-weight:700;
 line-height:1.1;
}
.card h3 .material-symbols-outlined{
 width:26px;
 height:26px;
 padding:5px;
 color:#042f2e;
 background:#ccfbf1;
 border-radius:4px;
 font-size:16px;
}
.kpi{
 min-height:168px;
 padding:18px;
 position:relative;
 overflow:hidden;
}
.kpi:after{
 content:"";
 position:absolute;
 right:-20px;
 bottom:-32px;
 width:94px;
 height:94px;
 border:16px solid rgba(45,212,191,.12);
 transform:rotate(35deg);
}
.kpi .ic{
 width:36px;
 height:36px;
 margin-bottom:18px;
 display:grid;
 place-items:center;
 color:#075e58;
 background:#ccfbf1;
 border:1px solid #99f6e4;
 border-radius:6px;
}
.kpi .ic .material-symbols-outlined{font-size:20px}
.kpi .lbl{
 color:var(--muted);
 font-size:13px;
 font-weight:600;
 letter-spacing:.02em;
}
.kpi .val{
 margin:3px 0;
 color:#0f3f3c;
 font-family:var(--serif);
 font-size:30px;
 font-weight:700;
 line-height:1.1;
 font-variant-numeric:tabular-nums;
}
.kpi .sub{color:var(--muted);font-size:12px}
.kpi .dt{
 padding:3px 8px;
 display:inline-flex;
 align-items:center;
 gap:4px;
 border:1px solid currentColor;
 border-radius:4px;
 font-size:11px;
 font-weight:700;
}
.kpi .dt:before,.pill:before{
 content:"";
 width:6px;
 height:6px;
 flex:0 0 auto;
 background:currentColor;
 border-radius:50%;
}
.up{color:#166534;background:#f0fdf4}
.dn{color:#991b1b;background:#fef2f2}
.fl{color:#115e59;background:#f0fdfa}
.chart{width:100%;min-height:260px;overflow:hidden}
.table-wrap{overflow-x:auto}
table{
 width:100%;
 border-collapse:collapse;
 color:#173f3c;
 font-size:14px;
 font-variant-numeric:tabular-nums;
}
th{
 padding:10px 12px;
 text-align:left;
 color:#285e59;
 background:#e6fffb;
 border-top:1px solid var(--line);
 border-bottom:2px solid var(--color-primary);
 font-size:12px;
 font-weight:700;
 letter-spacing:.03em;
 white-space:nowrap;
}
td{
 padding:11px 12px;
 border-bottom:1px solid #d5efeb;
 white-space:nowrap;
}
tbody tr:nth-child(even){background:#f8fffe}
tbody tr:hover{background:#ecfdf9}
tr:last-child td{border-bottom:0}
td.code,.code{
 font-family:var(--mono);
 font-size:.92em;
 font-variant-numeric:tabular-nums;
}
td.num,.num{
 text-align:right;
 font-variant-numeric:tabular-nums;
}
.pill{
 padding:3px 8px;
 display:inline-flex;
 align-items:center;
 gap:6px;
 border:1px solid currentColor;
 border-radius:4px;
 font-size:11px;
 font-weight:700;
 line-height:1.2;
}
.p-ok{color:#166534;background:#f0fdf4}
.p-warn{color:#854d0e;background:#fefce8}
.p-bad{color:#991b1b;background:#fef2f2}
.p-info{color:#115e59;background:#f0fdfa}
.p-mut{color:#475569;background:#f1f5f9}
.bar-line{
 height:9px;
 overflow:hidden;
 background:#dbe9e8;
 border-radius:2px;
}
.bar-line>span{
 height:100%;
 display:block;
 background:linear-gradient(90deg,var(--color-primary),var(--color-secondary));
 border-radius:2px;
}
.floor{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(126px,1fr));
 gap:10px;
}
.room{
 min-width:0;
 padding:11px;
 background:#fbfffe;
 border:1px solid var(--line);
 border-radius:6px;
 transition:border-color .2s ease,transform .2s ease;
}
.room:hover{border-color:var(--color-primary);transform:translateY(-2px)}
.room .rn{
 margin-bottom:9px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:8px;
 font-family:var(--mono);
 font-size:13px;
 font-weight:700;
}
.room .rn small{color:var(--muted);font-family:var(--mono)}
.beds{display:flex;gap:5px;flex-wrap:wrap}
.bed{
 width:36px;
 min-height:36px;
 padding:3px 2px;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 color:#fff;
 border:1px solid transparent;
 border-radius:4px;
 font-family:var(--mono);
 font-size:11px;
 font-weight:700;
 line-height:1;
}
.bed small{
 margin-top:3px;
 font-family:var(--body);
 font-size:9px;
 font-weight:600;
}
.b-use{background:#0f766e}
.b-free{color:#334155;background:#e2e8f0;border-color:#94a3b8}
.b-hold{color:#422006;background:#fbbf24;border-color:#a16207}
.b-out{color:#fff;background:#64748b}
.legend{
 margin-top:12px;
 display:flex;
 flex-wrap:wrap;
 gap:14px;
 color:var(--muted);
 font-size:12px;
}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{
 width:10px;
 height:10px;
 display:inline-block;
 border:1px solid rgba(0,0,0,.2);
 border-radius:2px;
}
.kan{
 min-width:840px;
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:12px;
}
.col{
 min-width:0;
 padding:11px;
 background:#f3faf9;
 border-top:3px solid var(--color-primary);
 border-radius:4px;
}
.col>.ch{
 margin-bottom:10px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 font-size:14px;
 font-weight:700;
}
.tk{
 margin-bottom:9px;
 padding:11px;
 background:#fff;
 border:1px solid var(--line);
 border-left:4px solid var(--color-primary);
 border-radius:4px;
 box-shadow:0 4px 12px rgba(19,78,74,.05);
}
.tk:last-child{margin-bottom:0}
.tk .tt{margin-bottom:5px;font-size:14px;font-weight:700}
.tk .tm{
 display:flex;
 justify-content:space-between;
 gap:8px;
 flex-wrap:wrap;
 color:var(--muted);
 font-size:11px;
}
.tl{position:relative;padding-left:24px}
.tl:before{
 content:"";
 position:absolute;
 left:6px;
 top:5px;
 bottom:5px;
 width:1px;
 background:var(--color-primary);
}
.tl-i{position:relative;padding:0 0 17px 7px}
.tl-i:last-child{padding-bottom:0}
.tl-i:before{
 content:"";
 position:absolute;
 left:-22px;
 top:4px;
 width:10px;
 height:10px;
 background:#fff;
 border:3px solid var(--color-primary);
 border-radius:50%;
}
.tl-i .tt{font-size:14px;font-weight:700}
.tl-i .tm{
 color:var(--muted);
 font-family:var(--mono);
 font-size:11px;
}
.tl-i .td{margin-top:3px;color:#355e5a;font-size:13px}
.chk{
 margin-bottom:9px;
 padding:12px;
 display:flex;
 align-items:center;
 gap:12px;
 background:#fbfffe;
 border:1px solid var(--line);
 border-radius:5px;
}
.chk .ck{
 width:28px;
 height:28px;
 display:grid;
 place-items:center;
 flex:0 0 auto;
 border:1px solid currentColor;
 border-radius:4px;
}
.chk .ck.done{color:#166534;background:#f0fdf4}
.chk .ck.wait{color:#854d0e;background:#fefce8}
.chk .ck.na{color:#475569;background:#f1f5f9}
.chk .ck .material-symbols-outlined{font-size:16px}
.chk .cx{min-width:0;flex:1}
.chk .cx .a{font-size:14px;font-weight:700}
.chk .cx .b{color:var(--muted);font-size:12px}
.flowbar{
 display:grid;
 grid-template-columns:repeat(5,minmax(0,1fr));
 gap:10px;
}
.flowbar .fs{
 min-width:0;
 padding:13px;
 position:relative;
 background:#fff;
 border:1px solid var(--line);
 border-radius:5px;
}
.flowbar .fs:not(:last-child):after{
 content:"";
 position:absolute;
 top:50%;
 right:-7px;
 width:12px;
 height:12px;
 z-index:2;
 background:#fff;
 border-top:1px solid var(--line);
 border-right:1px solid var(--line);
 transform:translateY(-50%) rotate(45deg);
}
.flowbar .fs b{
 margin-bottom:3px;
 display:block;
 color:#075e58;
 font-size:14px;
}
.flowbar .fs small{color:var(--muted);font-size:11px}
.mrow{
 padding:9px 0;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:12px;
 border-bottom:1px dashed var(--line);
 font-size:14px;
}
.mrow:last-child{border-bottom:0}
.mrow b{font-weight:700}
#app>*,.card,.kpi{animation:reveal .36s ease both}
.kpi:nth-child(2),.card:nth-child(2){animation-delay:.04s}
.kpi:nth-child(3),.card:nth-child(3){animation-delay:.08s}
.kpi:nth-child(4),.card:nth-child(4){animation-delay:.12s}
@keyframes reveal{
 from{opacity:0;transform:translateY(12px)}
 to{opacity:1;transform:translateY(0)}
}
@media(max-width:1100px){
 .hbar{width:calc(100% - 24px);gap:12px}
 .brand{min-width:245px}
 .brand p{display:none}
 .nb{padding-inline:9px}
 .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
 .g23,.g32{grid-template-columns:1fr}
}
@media(max-width:768px){
 header{position:relative}
 .hbar{padding:12px 0;display:block}
 .brand{margin-bottom:11px}
 nav{
  margin:0 -2px;
  padding:2px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  overflow:visible;
 }
 .nb{min-width:0}
 main{width:calc(100% - 28px);padding-top:24px}
 .scr-h{align-items:flex-start}
 .scr-h h2{font-size:29px}
 .scr-h .tag{margin-left:0}
 .g2,.g3{grid-template-columns:1fr}
 .flowbar{grid-template-columns:1fr 1fr}
 .flowbar .fs:not(:last-child):after{display:none}
 .card{padding:16px}
}
@media(max-width:480px){
 .brand h1{font-size:19px}
 .nb{padding:8px 5px;font-size:12px}
 .nb .material-symbols-outlined{display:none}
 main{width:calc(100% - 20px)}
 .scr-h{display:grid;grid-template-columns:6px 1fr}
 .scr-h:before{grid-row:1 / span 2}
 .scr-h .tag{grid-column:2}
 .g4,.g4.half{grid-template-columns:1fr}
 .kpi{min-height:150px}
 .flowbar{grid-template-columns:1fr}
 .mrow{align-items:flex-start}
}
@media(prefers-reduced-motion:reduce){
 html{scroll-behavior:auto}
 *,*:before,*:after{
  animation-duration:.01ms!important;
  animation-iteration-count:1!important;
  transition-duration:.01ms!important;
  scroll-behavior:auto!important;
 }
 .card:hover,.kpi:hover,.room:hover{transform:none}
}
</style>
</head>
<body>
<header>
 <div class="hbar">
  <div class="brand">
   <div class="logo"><span class="material-symbols-outlined">apartment</span></div>
   <div>
    <h1>員工宿舍管理系統</h1>
    <p>Dormitory Management · 床位調度 · 住宿費代扣 · 門禁稽核</p>
   </div>
  </div>
  <nav id="nav" aria-label="主要功能"></nav>
 </div>
</header>
<main><div id="app"></div></main>
<script>
var ICONS={
 apartment:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V4h10v17M14 9h6v12M8 8h2M8 12h2M8 16h2M17 13h1M17 17h1M2 21h20"/></svg>',
 dashboard:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="4"/><rect x="14" y="11" width="7" height="10"/><rect x="3" y="14" width="7" height="7"/></svg>',
 account_tree:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="6" height="5"/><rect x="15" y="16" width="6" height="5"/><rect x="3" y="16" width="6" height="5"/><path d="M6 8v4h12v4M6 12v4"/></svg>',
 receipt_long:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>',
 shield:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 5 3 8 7 10 4-2 7-5 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg>',
 build:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6 4-3 3 3-3 4-3-1-7 7 1 3-2 2-4-4 2-2 3 1 7-7-1-3Z"/></svg>',
 fact_check:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M7 11l2 2 4-4M15 12h3M7 17h11"/></svg>',
 hotel:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19v-8h18v8M3 16h18M6 11V7h5a3 3 0 0 1 3 3v1M3 21v-2M21 21v-2"/></svg>',
 groups:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2"/><path d="M3 20v-2a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v2M15 14h1a5 5 0 0 1 5 5v1"/></svg>',
 bed:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19V7M3 15h18v4M7 15v-4h5a3 3 0 0 1 3 3v1M3 11h4v4M6 21v-2M19 21v-2"/></svg>',
 monitoring:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18M6 16l4-5 4 3 5-7"/></svg>',
 donut_small:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-9V3Z"/><path d="M16 3.9A9 9 0 0 1 20.1 8H16V3.9Z"/></svg>',
 notifications_active:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4M4 4 2 6M20 4l2 2"/></svg>',
 grid_view:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>',
 assignment_ind:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 3V1h6v2M8 17c0-2 1.5-3 4-3s4 1 4 3M12 12a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/></svg>',

var SCREENS=[s0,s1,s2,s3,s4,s5];
function show(i){
 var index=Math.max(0,Math.min(Number(i)||0,SCREENS.length-1));
 var btns=document.querySelectorAll("[data-i]");
 for(var b=0;b<btns.length;b++){
  var on=Number(btns[b].getAttribute("data-i"))===index;
  btns[b].classList.toggle("on",on);
  btns[b].setAttribute("aria-current",on?"page":"false");
 }
 SCREENS[index]();
}
var nbtns=document.querySelectorAll("[data-i]");
for(var q=0;q<nbtns.length;q++){
 nbtns[q].addEventListener("click",function(){
  var index=Number(this.getAttribute("data-i"));
  var hash="#v"+index;
  if(location.hash===hash)show(index);else location.hash=hash;
  try{window.scrollTo({top:0,behavior:window.matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}catch(e){window.scrollTo(0,0)}
 });
}
function fromHash(){
 var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
 show(m?Math.min(Number(m[1]),SCREENS.length-1):0);
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
