<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>營建缺失改善追蹤台 · Construction Defect Management</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400&family=Playfair+Display:ital@1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
 --color-primary:#64748B;--color-on-primary:#FFFFFF;
 --color-secondary:#94A3B8;--color-on-secondary:#0F172A;
 --color-accent:#EA580C;--color-on-accent:#000000;
 --color-background:#F8FAFC;--color-foreground:#334155;
 --color-card:#FFFFFF;--color-card-foreground:#334155;
 --color-muted:#EBF0F5;--color-muted-foreground:#475569;
 --color-border:#E2E8F0;--color-destructive:#DC2626;
 --color-on-destructive:#FFFFFF;--color-ring:#64748B;
 --blue:#64748B;--ink:#334155;--muted:#475569;--line:#E2E8F0;
 --ok:#15803D;--warn:#B45309;--bad:#DC2626;--info:#1D4ED8;
 --shadow:0 12px 32px rgba(15,23,42,.07);
 --shadow-sm:0 5px 18px rgba(15,23,42,.055)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:Inter,"PingFang TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit}
button,.seg span,.pin{cursor:pointer}
button:focus-visible,.seg span:focus-visible,.pin:focus-visible{outline:3px solid rgba(100,116,139,.42);outline-offset:3px}
.material-symbols-outlined{font-size:20px;line-height:1;vertical-align:middle;font-variation-settings:"FILL" 0,"wght" 400}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 16px 18px;background:#0F172A;color:#F8FAFC;display:flex;flex-direction:column;overflow:auto;z-index:5}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 24px;border-bottom:1px solid rgba(255,255,255,.1)}
.logo{width:42px;height:42px;display:grid;place-items:center;flex:none;border:1px solid rgba(255,255,255,.25);border-radius:8px;background:#1E293B;color:#FFF;box-shadow:inset 0 -4px 0 var(--color-accent);font-size:17px;font-weight:800}
.brand b{display:block;font-size:15px;line-height:1.35;letter-spacing:.02em}
.brand small{display:block;margin-top:3px;color:#CBD5E1;font:9px/1.2 "JetBrains Mono",monospace;letter-spacing:.12em}
#nav{display:flex;flex-direction:column;gap:4px;padding-top:20px}
#nav button{position:relative;width:100%;min-height:44px;padding:11px 12px;border:0;border-radius:7px;background:transparent;color:#CBD5E1;text-align:left;display:flex;align-items:center;gap:11px;font-weight:600;font-size:13px;transition:background-color .2s,color .2s,transform .2s}
#nav button:hover{background:#1E293B;color:#FFF;transform:translateX(2px)}
#nav button.on{background:#FFF;color:#0F172A;box-shadow:0 8px 20px rgba(0,0,0,.18)}
#nav button.on:before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--color-accent)}
#nav button .material-symbols-outlined{color:#94A3B8}
#nav button.on .material-symbols-outlined{color:var(--color-accent)}
.foot{margin-top:auto;padding:18px 8px 0;border-top:1px solid rgba(255,255,255,.1);color:#CBD5E1;font-size:11px;line-height:1.9}
.foot b{color:#FFF;font-weight:600}
.main{min-width:0;padding:22px clamp(16px,2.5vw,38px) 40px}
.hero{position:relative;min-height:196px;margin-bottom:18px;padding:28px clamp(22px,4vw,48px);overflow:hidden;border-radius:12px;background:#E9EEF3;border:1px solid #DCE3EA;display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(248,250,252,.97) 0 53%,rgba(248,250,252,.58) 72%,rgba(248,250,252,.1)),repeating-linear-gradient(90deg,transparent 0 49px,rgba(100,116,139,.07) 50px),repeating-linear-gradient(0deg,transparent 0 49px,rgba(100,116,139,.07) 50px)}
.hero:after{content:"";position:absolute;width:390px;height:250px;right:-40px;top:-32px;border:1px solid rgba(100,116,139,.32);background:linear-gradient(145deg,rgba(255,255,255,.5),rgba(100,116,139,.08));transform:skewY(-8deg) rotate(-5deg);box-shadow:-22px 22px 0 rgba(100,116,139,.08),-44px 44px 0 rgba(100,116,139,.04)}
.hero-copy,.hero-side{position:relative;z-index:1}
.eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:#475569;font:10px/1 "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase}
.eyebrow:before{content:"";width:24px;height:2px;background:var(--color-accent)}
.hero h1{margin:0;color:#0F172A;font-size:clamp(28px,4vw,48px);line-height:1.04;letter-spacing:-.045em;font-weight:800}
.hero h1 em{font-family:"Playfair Display",serif;font-weight:400;color:var(--color-accent)}
.hero p{max-width:640px;margin:12px 0 0;color:#475569;font-size:13px;line-height:1.65}
.hero-side{align-self:flex-start;min-width:170px;text-align:right}
.live{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border:1px solid #CBD5E1;border-radius:999px;background:rgba(255,255,255,.82);color:#334155;font-size:11px;font-weight:700}
.live .material-symbols-outlined{font-size:16px;color:var(--ok)}
.hero-code{display:block;margin-top:44px;color:#64748B;font:10px/1.6 "JetBrains Mono",monospace}
.value-strip{margin:-34px 22px 20px;position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);background:#FFF;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.value{padding:14px 18px;display:flex;align-items:center;gap:11px}
.value+.value{border-left:1px solid var(--line)}
.value .material-symbols-outlined{color:var(--color-accent)}
.value b{display:block;color:#0F172A;font-size:12px}
.value small{display:block;margin-top:3px;color:var(--muted);font-size:10px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi,.card{background:var(--color-card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-sm)}
.kpi{position:relative;min-height:126px;padding:17px 18px;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;width:100%;height:3px;background:#CBD5E1}
.kpi.alert:before{background:var(--color-accent)}
.kpi .l{color:var(--muted);font-size:11px;font-weight:600}
.kpi .v{margin-top:8px;color:#0F172A;font-size:28px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:11px;letter-spacing:0}
.kpi .d{margin-top:5px;font-size:10.5px;font-weight:600}
.kpi .ic{position:absolute;right:15px;top:15px;color:#94A3B8}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.38fr) minmax(310px,.9fr)}
.g11,.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{padding:17px}
.card h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px;color:#0F172A;font-size:13px;font-weight:700}
.card h3>.material-symbols-outlined{color:var(--color-accent);font-size:19px}
.tag{display:inline-flex;align-items:center;gap:4px;border:1px solid transparent;border-radius:999px;padding:3px 8px;font-size:10px;font-weight:700;white-space:nowrap}
.tag:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.t-ok{background:#ECFDF3;color:#166534;border-color:#BBF7D0}
.t-warn{background:#FFFBEB;color:#92400E;border-color:#FDE68A}
.t-bad{background:#FEF2F2;color:#B91C1C;border-color:#FECACA}
.t-info{background:#EFF6FF;color:#1D4ED8;border-color:#BFDBFE}
.t-rose{background:#FFF7ED;color:#C2410C;border-color:#FED7AA}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.data{width:100%;border-collapse:collapse;font-size:11.5px}
table.data th,table.data td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{background:#F1F5F9;color:#475569;font-size:10.5px;font-weight:700;letter-spacing:.02em}
table.data tr:last-child td{border-bottom:0}
table.data tbody tr:hover,table.data tr:not(:first-child):hover{background:#FAFCFE}
table.data td:first-child b,table.data td:nth-child(n+2):has(+td:last-child){font-variant-numeric:tabular-nums}
table.data td:first-child b,.mono{font-family:"JetBrains Mono",monospace;font-size:.96em}
table.data td[data-num],.num-cell{text-align:right;font-variant-numeric:tabular-nums}
.chart{height:250px}
.timeline{display:flex;align-items:flex-start;margin:10px 2px 0}
.step{position:relative;flex:1;padding-top:18px;color:#475569;font-size:10px;text-align:center}
.step:before{content:"";position:absolute;top:5px;left:50%;right:-50%;height:2px;background:#CBD5E1}
.step:last-child:before{display:none}
.step:after{content:"";position:absolute;top:0;left:calc(50% - 6px);width:10px;height:10px;border:2px solid #FFF;border-radius:50%;background:#64748B;box-shadow:0 0 0 1px #94A3B8}
.step.current:after{background:var(--color-accent);box-shadow:0 0 0 2px #FED7AA}
.step b{display:block;margin-bottom:2px;color:#334155;font-size:10.5px}
.bar{height:7px;overflow:hidden;border-radius:8px;background:#E2E8F0}
.bar i{display:block;height:100%;border-radius:8px;background:var(--color-accent)}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ph{aspect-ratio:4/3;border:1px dashed #94A3B8;border-radius:8px;background:linear-gradient(145deg,#F8FAFC,#EEF2F6);color:#64748B;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;font-size:10px}
.ph .material-symbols-outlined{font-size:22px}
.field{display:flex;flex-direction:column;gap:12px}
.frow{display:flex;flex-direction:column;gap:5px}
.frow label{color:#475569;font-size:10.5px;font-weight:700}
.frow .inp{min-height:40px;padding:10px 12px;border:1px solid var(--line);border-radius:7px;background:#F8FAFC;color:#334155;font-size:11.5px;line-height:1.55}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg span{padding:7px 11px;border:1px solid #CBD5E1;border-radius:7px;background:#FFF;color:#475569;font-size:10.5px;font-weight:700;transition:border-color .2s,background .2s,color .2s}
.seg span:hover{border-color:#64748B}
.seg span.sel{border-color:var(--color-accent);background:#FFF7ED;color:#C2410C}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:11px;color:#475569;font-size:10.5px}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border:2px solid currentColor;border-radius:2px;background:transparent}
.plan-wrap{padding:18px;perspective:900px;background:linear-gradient(180deg,#F8FAFC,#EEF2F6);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.plan{display:block;width:100%;filter:drop-shadow(0 20px 15px rgba(15,23,42,.13));transform:rotateX(48deg) rotateZ(-2deg) scale(.96);transform-origin:center;transition:transform .35s ease}
.plan-wrap:hover .plan{transform:rotateX(42deg) rotateZ(0) scale(.98)}
.plan text{font-family:Inter,"PingFang TC",sans-serif;fill:#475569}
.pin circle{transition:transform .2s;transform-box:fill-box;transform-origin:center}
.pin:hover circle{transform:scale(1.18)}
.pinlist{display:flex;flex-direction:column;gap:8px}
.pi{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#FFF}
.pi .num{width:25px;height:25px;display:grid;place-items:center;flex:none;border-radius:6px;color:#FFF;font:10px "JetBrains Mono",monospace}
.pi .pm{min-width:0;flex:1}
.pi .pm b{display:block;color:#334155;font-size:11px}
.pi .pm small{display:block;margin-top:3px;color:#64748B;font-size:10px}
.kb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:start}
.kcol{display:flex;flex-direction:column;gap:8px;padding:9px;border:1px solid var(--line);border-radius:9px;background:#F1F5F9}
.kh{display:flex;align-items:center;justify-content:space-between;padding:2px 3px 5px;color:#334155;font-size:11px;font-weight:800}
.kh span{min-width:22px;padding:2px 6px;border:1px solid #CBD5E1;border-radius:999px;background:#FFF;text-align:center;font:9px "JetBrains Mono",monospace}
.kcard{padding:10px;border:1px solid var(--line);border-left:3px solid #64748B;border-radius:7px;background:#FFF;box-shadow:0 2px 6px rgba(15,23,42,.04)}
.kcard.b1{border-left-color:var(--bad)}.kcard.b2{border-left-color:var(--warn)}.kcard.b3{border-left-color:var(--info)}.kcard.b4{border-left-color:var(--ok)}
.kcard b{display:block;color:#334155;font-size:10.5px}
.kcard b:first-letter{font-family:"JetBrains Mono",monospace}
.kcard small{display:block;margin-top:4px;color:#64748B;font-size:9.5px;line-height:1.45}
.kf{display:flex;align-items:center;justify-content:space-between;margin-top:8px;color:#475569;font-size:9.5px}
.ava{width:21px;height:21px;display:inline-grid;place-items:center;border-radius:50%;background:#334155;color:#FFF;font-size:9px;font-weight:700}
.vrow{margin-bottom:11px;padding:13px;border:1px solid var(--line);border-radius:9px}
.vrow:last-child{margin-bottom:0}
.vhd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.vhd b{font-size:11.5px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.lbl{display:flex;align-items:center;gap:5px;margin-bottom:5px;color:#475569;font-size:10px;font-weight:700}
.mini{display:flex;gap:7px}
.btn{min-height:36px;padding:7px 12px;border-radius:7px;border:1px solid transparent;font-size:10.5px;font-weight:700;transition:background .2s,box-shadow .2s,transform .2s}
.btn:hover{transform:translateY(-1px)}
.btn.ok{background:var(--color-accent);color:#000;border-color:#C2410C}
.btn.ok:hover{background:#F97316}
.btn.no{background:#FFF;color:#B91C1C;border-color:#FCA5A5}
@media(max-width:1024px){
 .shell{grid-template-columns:218px minmax(0,1fr)}
 .kpis{grid-template-columns:repeat(2,1fr)}
 .g2{grid-template-columns:1fr}
 .kb{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:768px){
 .shell{display:block}
 .side{position:static;height:auto;padding:14px}
 .brand{padding-bottom:12px}
 #nav{padding-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
 #nav button{justify-content:center;padding:9px 7px;font-size:11px}
 #nav button:hover{transform:none}
 .foot{display:none}
 .hero{min-height:180px;align-items:flex-end}
 .hero-side{display:none}
 .value-strip{margin:-28px 10px 18px}
 .value{padding:12px}.value small{display:none}
 .g11,.two{grid-template-columns:1fr}
}
@media(max-width:480px){
 .main{padding:14px 12px 30px}
 #nav button{min-height:48px;flex-direction:column;gap:4px}
 .hero{padding:24px 20px;min-height:200px}
 .hero h1{font-size:31px}
 .value-strip{grid-template-columns:1fr;margin:-22px 8px 16px}
 .value+.value{border-left:0;border-top:1px solid var(--line)}
 .kpis,.kb{grid-template-columns:1fr}
 .photos{grid-template-columns:repeat(3,1fr)}
 .cmp{grid-template-columns:1fr}
 .card{padding:13px}
}
@media(prefers-reduced-motion:reduce){
 html{scroll-behavior:auto}
 *,*:before,*:after{animation:none!important;transition:none!important}
 .plan,.plan-wrap:hover .plan{transform:rotateX(44deg) rotateZ(0) scale(.97)}
}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
 <div class="brand"><div class="logo">缺</div><div><b>營建缺失改善追蹤台</b><small>FIELD QUALITY CONTROL</small></div></div>
 <div id="nav" aria-label="主要功能"></div>
 <div class="foot"><b>工區 A/B/C 棟 · 樓層 18F</b><br/>本月缺失 156 · 已關閉 128<br/>平均改善時效 2.0 天</div>
</aside>
<main class="main">
 <section class="hero">
  <div class="hero-copy">
   <div class="eyebrow">Construction intelligence / 2026</div>
   <h1 id="vt">缺失總覽</h1>
   <p id="vd"></p>
  </div>
  <div class="hero-side">
   <div class="live"><span class="material-symbols-outlined">sync</span>平面圖即時同步</div>
   <span class="hero-code">SITE A/B/C<br/>18F · LIVE DATA</span>
  </div>
 </section>
 <div class="value-strip" aria-label="系統價值">
  <div class="value"><span class="material-symbols-outlined">location_on</span><div><b>現場精準定位</b><small>平面圖與缺失單雙向連結</small></div></div>
  <div class="value"><span class="material-symbols-outlined">account_tree</span><div><b>改善閉環管理</b><small>登錄、指派、複驗全程追蹤</small></div></div>
  <div class="value"><span class="material-symbols-outlined">query_stats</span><div><b>品質決策依據</b><small>時效、風險與績效即時彙整</small></div></div>
 </div>
 <div id="view"></div>
</main>
</div>
<script>
const MOD=[
["缺失總覽","dashboard","缺失總覽","缺失、改善與複驗全局戰情，掌握品質閉環節奏"],
["缺失登錄","edit_note","缺失登錄","巡查發現缺失開立單，含照片佐證、分類與分級"],
["平面圖標記","map","平面圖標記","樓層平面圖釘標缺失位置，一眼掌握熱區分佈"],
["改善看板","view_kanban","改善看板","待改善／改善中／待複驗／已關閉四欄推進"],
["複驗關閉","verified","複驗關閉","比對改善前後照片，複驗驗收與結案關閉"],
["品質統計","insert_chart","品質統計","缺失類型分佈、改善時效與責任單位排名"]];
const nav=document.getElementById("nav"),view=document.getElementById("view"),vt=document.getElementById("vt"),vd=document.getElementById("vd");
MOD.forEach((m,i)=>{const b=document.createElement("button");b.dataset.i=i;b.className=i===0?"on":"";b.innerHTML='<span class="material-symbols-outlined" aria-hidden="true">'+m[1]+"</span><span>"+m[0]+"</span>";b.onclick=()=>show(i);nav.appendChild(b)});

const DEF=[
["DF-3316","A 棟 5F 樓梯間","樓梯扶手鬆動未鎖固","高","待改善","陳志明","t-bad"],
["DF-3315","B 棟 3F 衛浴","磁磚空鼓3處","中","改善中","豐邦泥作","t-warn"],
["DF-3314","A 棟 8F 外牆","窗框滲水痕跡","高","待複驗","昇泰防水","t-info"],
["DF-3313","C 棟 2F 天花","輕鋼架水平誤差","中","改善中","大成裝修","t-warn"],
["DF-3312","B 棟 6F 陽台","欄杆高度不足","低","已關閉","O安金屬","t-ok"],
["DF-3311","A 棟 1F 大廳","地坪石材色差","低","已關閉","大成裝修","t-ok"]];
const KAN={
"待改善":[["DF-3316","樓梯扶手鬆動","A 棟 5F 樓梯間","高","陳","逾期 1 天","b1"],["DF-3318","門框歪斜","C 棟 4F","中","王","今日到期","b1"]],
"改善中":[["DF-3315","磁磚空鼓3處","B 棟 3F 衛浴","中","豐","剩 2 天","b2"],["DF-3313","輕鋼架水平誤差","C 棟 2F 天花","中","成","剩 3 天","b2"]],
