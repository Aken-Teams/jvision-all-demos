<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>營建缺失閉環台 · Construction Defect Closed-Loop</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--accent:#be185d;--accent2:#e11d48;--ink:#1c1420;--bg:#faf3f6;--card:#fff;--line:#f0dfe7;--mut:#8a6f7c;--ok:#16a34a;--warn:#f59e0b;--bad:#e11d48;--info:#2563eb}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.shell>*{min-width:0}
.side{background:var(--card);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.side .bd{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.side .lg{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#fff;flex:none;box-shadow:0 8px 20px rgba(190,24,93,.4);font-family:"Noto Sans TC"}
.side .bd b{font-size:15px;font-weight:800;font-family:"Noto Sans TC";display:block}
.side .bd span{font-size:9px;color:var(--accent);letter-spacing:1px}
.side button{display:flex;align-items:center;gap:11px;background:transparent;border:0;color:#5f4a54;font:inherit;font-weight:600;font-size:13.5px;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left;width:100%;font-family:"Noto Sans TC"}
.side button .material-symbols-outlined{font-size:20px;color:#c9a6b6}
.side button:hover{background:#fcf1f6}
.side button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.side button.on .material-symbols-outlined{color:#fff}
.side .foot{margin-top:auto;padding:12px 10px 2px;font-size:11px;color:var(--mut);border-top:1px solid var(--line);line-height:1.8}
.main{padding:22px 24px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.live{background:#fce7f0;color:#be185d;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:p 1.4s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px 15px 20px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent),var(--accent2))}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.28}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .9fr}
.g11{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#dcfce7;color:#15803d}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#dbeafe;color:#1d4ed8}.t-rose{background:#fce7f0;color:#be185d}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#fcf1f6}
.chart{height:250px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.two>*{min-width:0}
.bar{height:8px;background:#f3e3ea;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.scroll{overflow-x:auto}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ph{aspect-ratio:4/3;border:1.5px dashed #e0bccd;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#c592a8;font-size:11px;background:#fcf4f8;text-align:center}
.ph .material-symbols-outlined{font-size:22px}
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start}
.kb>*{min-width:0}
.kcol{background:#fcf1f6;border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:9px}
.kcol .kh{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:800;font-family:"Noto Sans TC";padding:2px 4px 4px}
.kcol .kh span{background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 8px;font-size:11px;color:var(--mut)}
.kcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 11px;border-left:4px solid var(--accent)}
.kcard.b1{border-left-color:var(--bad)}.kcard.b2{border-left-color:var(--warn)}.kcard.b3{border-left-color:var(--info)}.kcard.b4{border-left-color:var(--ok)}
.kcard b{font-size:12.5px;font-family:"Noto Sans TC";display:block}
.kcard small{color:var(--mut);font-size:11px;display:block;margin-top:2px}
.kcard .kf{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:10.5px;color:var(--mut)}
.ava{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:inline-grid;place-items:center;font-size:10px;font-weight:800}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp>div{min-width:0}
.cmp .lbl{font-size:11px;font-weight:700;color:var(--mut);margin-bottom:5px;display:flex;align-items:center;gap:5px}
.vrow{border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:12px}
.vrow .vhd{display:flex;align-items:center;gap:9px;margin-bottom:6px;flex-wrap:wrap}
.vrow .vhd b{font-size:13px;font-family:"Noto Sans TC"}
.btn{font-size:11.5px;font-weight:700;padding:6px 13px;border-radius:9px;border:0;cursor:pointer;font-family:"Noto Sans TC"}
.btn.ok{background:var(--ok);color:#fff}.btn.no{background:#fff;border:1px solid var(--bad);color:var(--bad)}
.mini{display:flex;gap:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.plan{width:100%;border:1px solid var(--line);border-radius:12px;background:#fcf4f8;display:block}
.plan text{font-family:"Noto Sans TC",Inter;fill:#8a6f7c}
.pin{cursor:pointer}
.pinlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.pi{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:11px;padding:9px 11px}
.pi .num{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800;font-family:Inter}
.pi .pm{flex:1;min-width:0}
.pi .pm b{font-size:12.5px;font-family:"Noto Sans TC"}
.pi .pm small{display:block;color:var(--mut);font-size:11px}
.field{display:flex;flex-direction:column;gap:11px}
.frow{display:flex;flex-direction:column;gap:4px}
.frow label{font-size:11.5px;font-weight:700;color:var(--mut)}
.frow .inp{border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:12.5px;background:#fcf4f8}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg span{font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:9px;border:1.5px solid var(--line);color:#a98;cursor:pointer}
.seg span.sel{border-color:var(--accent);background:#fce7f0;color:var(--accent)}
@media(max-width:860px){
 .shell{grid-template-columns:1fr}
 .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;overflow:visible}
 .side .bd{width:100%;padding-bottom:8px}
 .side button{width:auto;flex:none}
 .side .foot{display:none}
 .kpis{grid-template-columns:repeat(2,1fr)}
 .g2,.g11,.two{grid-template-columns:1fr}
 .kb{grid-template-columns:repeat(2,1fr)}
 .cmp{grid-template-columns:1fr}
}
@media(max-width:430px){
 .kb{grid-template-columns:1fr}
 .photos{grid-template-columns:repeat(3,1fr)}
 .main{padding:16px 14px}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="bd"><div class="lg">閉</div><div><b>營建缺失閉環台</b><span>DEFECT CLOSED-LOOP</span></div></div>
    <div id="nav"></div>
    <div class="foot">工區 A/B/C 棟 · 樓層 18F<br/>本月缺失 156 · 已關閉 128<br/>平均改善時效 2.0 天</div>
  </aside>
  <main class="main">
    <div class="vh"><div><h2 id="vt">缺失總覽</h2><p id="vd"></p></div><div class="live"><i></i>平面圖即時同步</div></div>
    <div id="view"></div>
  </main>
</div>
<script>
const MOD=[
["缺失總覽","dashboard","缺失總覽","缺失、改善與複驗全局戰情，掌握品質閉環節奏"],
["缺失登錄","edit_note","缺失登錄","巡查發現缺失開立單，含照片佐證、分類與分級"],
["平面圖標記","map","平面圖標記","樓層平面圖釘標缺失位置，一眼掌握熱區分佈"],
["改善看板","view_kanban","改善看板","待改善／改善中／待複驗／已關閉四欄推進"],
["複驗關閉","verified","複驗關閉","比對改善前後照片，複驗驗收與結案關閉"],
["品質統計","insert_chart","品質統計","缺失類型分佈、改善時效與責任單位排名"]];
const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span>'+m[0];b.onclick=()=>show(i);nav.appendChild(b);});

const DEF=[
["DF-3316","A 棟 5F 樓梯間","樓梯扶手鬆動未鎖固","高","待改善","陳志明","t-bad"],
["DF-3315","B 棟 3F 衛浴","磁磚空鼓3處","中","改善中","豐邦泥作","t-warn"],
["DF-3314","A 棟 8F 外牆","窗框滲水痕跡","高","待複驗","昇泰防水","t-info"],
["DF-3313","C 棟 2F 天花","輕鋼架水平誤差","中","改善中","大成裝修","t-warn"],
["DF-3312","B 棟 6F 陽台","欄杆高度不足","低","已關閉","O安金屬","t-ok"],
["DF-3311","A 棟 1F 大廳","地坪石材色差","低","已關閉","大成裝修","t-ok"]];
const KAN={
"待改善":[["DF-3316","樓梯扶手鬆動","A 棟 5F 樓梯間","高","陳","逾期 1 天","b1"],["DF-3318","門框歪斜","C 棟 4F","中","王","今日到期","b1"]],
"改善中":[["DF-3315","磁磚空鼓3處","B 棟 3F 衛浴","中","豐","剩 2 天","b2"],["DF-3313","輕鋼架水平誤差","C 棟 2F 天花","中","成","剩 3 天","b2"]],
"待複驗":[["DF-3314","窗框滲水痕跡","A 棟 8F 外牆","高","昇","已上傳照片","b3"],["DF-3317","插座接線裸露","B 棟 1F","中","陳","待排複驗","b3"]],
"已關閉":[["DF-3312","欄杆高度不足","B 棟 6F 陽台","低","泰","複驗合格","b4"],["DF-3311","地坪石材色差","A 棟 1F 大廳","低","成","複驗合格","b4"]]
};
const VER=[
["DF-3314","窗框滲水痕跡","A 棟 8F 外牆 · 昇泰防水","高"],
["DF-3317","插座接線裸露","B 棟 1F · 陳志明","中"]];
const PINS=[
[92,70,"var(--bad)","1","DF-3316 樓梯扶手鬆動","高 · 待改善"],
[214,58,"var(--warn)","2","DF-3315 磁磚空鼓","中 · 改善中"],
[330,92,"var(--info)","3","DF-3314 窗框滲水","高 · 待複驗"],
[150,178,"var(--warn)","4","DF-3313 輕鋼架誤差","中 · 改善中"],
[300,196,"var(--ok)","5","DF-3312 欄杆高度","低 · 已關閉"]];

function photos(n,label){let h='';for(let i=0;i<n;i++)h+='<div class="ph"><span class="material-symbols-outlined">photo_camera</span>'+(label||'照片')+'</div>';return h;}
function sevtag(s){return '<span class="tag '+(s=='高'?'t-bad':s=='中'?'t-warn':'t-info')+'">'+s+'</span>';}
function floorplan(){
 var rooms=[[24,32,150,86,"樓梯間"],[184,32,130,86,"衛浴"],[324,32,52,86,"陽台"],
  [24,140,120,86,"客廳"],[154,140,110,86,"臥室"],[274,140,102,86,"外牆立面"]];
 var r=rooms.map(function(m){return '<rect x="'+m[0]+'" y="'+m[1]+'" width="'+m[2]+'" height="'+m[3]+'" rx="6" fill="#fff" stroke="#e6c6d6" stroke-width="1.5"/><text x="'+(m[0]+8)+'" y="'+(m[1]+18)+'" font-size="11">'+m[4]+'</text>';}).join('');
 var p=PINS.map(function(k){return '<g class="pin"><circle cx="'+k[0]+'" cy="'+k[1]+'" r="12" fill="'+k[2]+'" stroke="#fff" stroke-width="2"/><text x="'+k[0]+'" y="'+(k[1]+4)+'" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">'+k[3]+'</text><title>'+k[4]+'　'+k[5]+'</title></g>';}).join('');
 return '<svg class="plan" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid meet" role="img" aria-label="樓層平面圖缺失標記"><rect x="12" y="14" width="376" height="232" rx="10" fill="none" stroke="#d9a9c0" stroke-width="2" stroke-dasharray="5 4"/><text x="20" y="238" font-size="10">A 棟 5F 平面圖 · 缺失定位</text>'+r+p+'</svg>';
}

const SCREENS=[
/* 0 缺失總覽 */
()=>`<div class="kpis">
 <div class="kpi"><span class="material-symbols-outlined ic">bug_report</span><div class="l">本月缺失</div><div class="v">156<small style="font-size:12px"> 件</small></div><div class="d up">▲ 巡查覆蓋 97%</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">pending_actions</span><div class="l">待改善缺失</div><div class="v" style="color:var(--bad)">28</div><div class="d dn">逾期 3 · 高風險 5</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">timelapse</span><div class="l">平均改善時效</div><div class="v">2.0<small style="font-size:12px"> 天</small></div><div class="d up">▼ 較 7.4 天</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">verified</span><div class="l">複驗關閉率</div><div class="v">82.1<small style="font-size:12px">%</small></div><div class="d up">▲ 一次通過 88%</div></div>
</div>
<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">assignment_late</span>近期缺失單 <span class="tag t-bad" style="margin-left:auto">高風險 2</span></h3><div class="scroll"><table class="data"><tr><th>缺失單</th><th>位置</th><th>缺失描述</th><th>嚴重</th><th>狀態</th></tr>${DEF.map(d=>`<tr><td><b>${d[0]}</b></td><td>${d[1]}</td><td>${d[2]}</td><td>${sevtag(d[3])}</td><td><span class="tag ${d[6]}">${d[4]}</span></td></tr>`).join('')}</table></div></div>
 <div class="card"><h3><span class="material-symbols-outlined">donut_large</span>缺失狀態分佈</h3><div class="chart" id="c_stat" style="height:210px"></div>
  <h3 style="margin-top:14px"><span class="material-symbols-outlined">trending_up</span>週改善完成率</h3><div class="chart" id="c_trend" style="height:150px"></div></div>
</div>`,

/* 1 缺失登錄 (v1 巡查發現缺失) */
()=>`<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">edit_note</span>缺失單登錄 · DF-3316</h3>
  <div class="field">
   <div class="frow"><label>缺失位置</label><div class="inp">A 棟 5F 樓梯間（座標 X:92 Y:70）</div></div>
   <div class="frow"><label>缺失類型</label><div class="seg"><span class="sel">結構安全</span><span>裝修飾面</span><span>防水滲漏</span><span>機電</span></div></div>
   <div class="frow"><label>缺失描述</label><div class="inp">樓梯扶手固定螺栓鬆動未鎖固，晃動幅度過大</div></div>
   <div class="frow"><label>嚴重度分級</label><div class="seg"><span class="sel">高風險</span><span>中</span><span>低</span></div></div>
   <div class="frow"><label>責任單位 · 改善期限</label><div class="inp">陳志明（自營金屬班）　2026-08-15（3 天）</div></div>
  </div>
  <div class="lbl" style="margin-top:12px;font-size:11px;font-weight:700;color:var(--mut)">缺失現況照片佐證</div><div class="photos" style="grid-template-columns:repeat(3,1fr)">${photos(3,'缺失照')}</div></div>
 <div class="card"><h3><span class="material-symbols-outlined">format_list_bulleted</span>今日新增缺失</h3><div class="scroll"><table class="data"><tr><th>單號</th><th>位置</th><th>嚴重</th></tr>${DEF.slice(0,5).map(d=>`<tr><td><b>${d[0]}</b><br/><small style="color:var(--mut)">${d[2]}</small></td><td>${d[1]}</td><td>${sevtag(d[3])}</td></tr>`).join('')}</table></div>
  <div class="legend"><span><i class="dot" style="background:var(--bad)"></i>高 5</span><span><i class="dot" style="background:var(--warn)"></i>中 13</span><span><i class="dot" style="background:var(--info)"></i>低 10</span></div>
  <div style="margin-top:12px;font-size:12px;color:var(--mut)">巡查進度 5 / 6 樓層</div><div class="bar" style="margin-top:6px"><i style="width:83%"></i></div></div>
</div>`,

/* 2 平面圖標記 (v2 平面圖定位登錄) */
()=>`<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">map</span>樓層平面圖 · 缺失定位 <span class="tag t-rose" style="margin-left:auto">點釘標查看</span></h3>
  ${floorplan()}
  <div class="legend"><span><i class="dot" style="background:var(--bad)"></i>高風險</span><span><i class="dot" style="background:var(--warn)"></i>中</span><span><i class="dot" style="background:var(--info)"></i>待複驗</span><span><i class="dot" style="background:var(--ok)"></i>已關閉</span></div></div>

function draw(i){

 if(i==0){
  var c=mk('c_stat');if(c)c.setOption({tooltip:{trigger:'item'},legend:{bottom:0,textStyle:{fontSize:10.5},itemWidth:11,itemHeight:11},series:[{type:'pie',radius:['46%','72%'],center:['50%','42%'],label:{show:false},data:[{value:28,name:'待改善',itemStyle:{color:'#e11d48'}},{value:33,name:'改善中',itemStyle:{color:'#f59e0b'}},{value:17,name:'待複驗',itemStyle:{color:'#2563eb'}},{value:78,name:'已關閉',itemStyle:{color:'#16a34a'}}]}]});

 }
}
function show(i){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));vt.textContent=MOD[i][2];vd.textContent=MOD[i][3];view.innerHTML=SCREENS[i]();draw(i);}

</script>
