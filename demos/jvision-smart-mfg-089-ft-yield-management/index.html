<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FT Yield Management（最終測試良率管理）｜Jvision 系統 Demo</title>
  <meta name="description" content="半導體最終測試良率管理：測試數據採集、良率看板、Bin 分佈分析、異常判定與批次攔截處置" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --color-primary:#2563eb;
      --color-on-primary:#fff;
      --color-secondary:#3b82f6;
      --color-on-secondary:#000;
      --color-accent:#ea580c;
      --color-on-accent:#000;
      --color-background:#f8fafc;
      --color-foreground:#1e293b;
      --color-card:#fff;
      --color-card-foreground:#1e293b;
      --color-muted:#e9eff8;
      --color-muted-foreground:#475569;
      --color-border:#e2e8f0;
      --color-destructive:#dc2626;
      --color-on-destructive:#fff;
      --color-ring:#2563eb;
      --blue:#2563eb;
      --ink:#1e293b;
      --muted:#475569;
      --line:#e2e8f0;
      --good:#15803d;
      --warn:#a74406;
      --bad:#b91c1c;
      --info:#075985;
      --black:#0f172a;
      --grid:rgba(37,99,235,.075);
      --shadow:6px 6px 0 #0f172a;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:auto}
    html,body{margin:0;min-height:100%}
    body{
      background-color:var(--color-background);
      background-image:
        linear-gradient(var(--grid) 1px,transparent 1px),
        linear-gradient(90deg,var(--grid) 1px,transparent 1px);
      background-size:32px 32px;
      color:var(--ink);
      font-family:"Fira Sans",system-ui,sans-serif;
      line-height:1.5;
      -webkit-font-smoothing:antialiased;
    }
    button{font:inherit}
    button,a{cursor:pointer}
    button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
      outline:3px solid var(--color-ring);
      outline-offset:3px;
    }
    .material-symbols-outlined{
      font-family:"Material Symbols Outlined";
      font-weight:500;
      font-style:normal;
      line-height:1;
      vertical-align:middle;
    }
    .layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
    .sidebar{
      position:sticky;
      top:0;
      z-index:20;
      height:100vh;
      display:flex;
      flex-direction:column;
      gap:20px;
      padding:22px 18px;
      overflow:auto;
      color:#fff;
      background:var(--black);
      border-right:4px solid var(--black);
    }
    .brand{
      display:grid;
      grid-template-columns:48px minmax(0,1fr);
      gap:12px;
      align-items:center;
      padding-bottom:20px;
      border-bottom:2px solid #475569;
    }
    .logo{
      width:48px;
      height:48px;
      display:grid;
      place-items:center;
      color:#000;
      background:var(--color-accent);
      border:2px solid #fff;
      box-shadow:4px 4px 0 var(--color-primary);
    }
    .logo .material-symbols-outlined{font-size:27px}
    .brand b{
      display:block;
      font-family:"Fira Code",monospace;
      font-size:14px;
      line-height:1.2;
      letter-spacing:.04em;
    }
    .brand span:not(.material-symbols-outlined){
      display:block;
      margin-top:4px;
      color:#cbd5e1;
      font-size:11px;
    }
    .navwrap{display:flex;flex-direction:column;gap:8px}
    .navbtn{
      position:relative;
      width:100%;
      min-height:48px;
      display:grid;
      grid-template-columns:24px minmax(0,1fr) 24px;
      align-items:center;
      gap:10px;
      padding:10px 11px;
      color:#e2e8f0;
      text-align:left;
      background:transparent;
      border:2px solid #475569;
      border-radius:0;
    }
    .navbtn:hover{color:#fff;background:#1e293b;border-color:#94a3b8}
    .navbtn.active{
      left:8px;
      color:#000;
      background:var(--color-accent);
      border-color:#fff;
      box-shadow:-8px 0 0 var(--color-primary);
      font-weight:700;
    }
    .navbtn .material-symbols-outlined{font-size:20px}
    .nlabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .nnum{
      font-family:"Fira Code",monospace;
      color:inherit;
      font-size:10px;
      text-align:right;
    }
    .sidefoot{
      margin-top:auto;
      padding-top:14px;
      color:#cbd5e1;
      border-top:2px solid #475569;
      font-family:"Fira Code",monospace;
      font-size:10px;
      line-height:1.7;
    }
    .main{min-width:0}
    .topbar{
      position:sticky;
      top:0;
      z-index:15;
      min-height:94px;
      display:flex;
      align-items:center;
      gap:18px;
      padding:18px 28px;
      background:rgba(248,250,252,.96);
      border-bottom:4px solid var(--black);
    }
    .tt{min-width:0}
    .topbar h1{
      margin:0;
      font-size:clamp(20px,2vw,29px);
      font-weight:700;
      line-height:1.1;
      letter-spacing:-.035em;
    }
    .topbar p{margin:6px 0 0;color:var(--muted);font-size:12px}
    .top-badge{
      margin-left:auto;
      display:inline-flex;
      align-items:center;
      gap:7px;
      flex:0 0 auto;
      padding:8px 12px;
      color:#fff;
      background:var(--color-primary);
      border:2px solid var(--black);
      box-shadow:3px 3px 0 var(--black);
      font-family:"Fira Code",monospace;
      font-size:11px;
      font-weight:700;
    }
    .top-badge .material-symbols-outlined{font-size:17px}
    .content{width:100%;max-width:1600px;margin:0 auto;padding:28px 28px 48px}
    .screen-intro{
      position:relative;
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:22px;
      align-items:end;
      min-height:168px;
      margin-bottom:22px;
      padding:24px;
      overflow:hidden;
      color:#fff;
      background:var(--color-primary);
      border:3px solid var(--black);
      box-shadow:var(--shadow);
    }
    .screen-intro::after{
      content:"FT / QUALITY";
      position:absolute;
      right:-12px;
      top:-18px;
      color:rgba(255,255,255,.12);
      font:700 clamp(42px,7vw,96px)/1 "Fira Code",monospace;
      white-space:nowrap;
      pointer-events:none;
    }
    .eyebrow{
      position:relative;
      z-index:1;
      display:inline-block;
      margin-bottom:12px;
      padding:4px 8px;
      color:#000;
      background:#fff;
      border:2px solid var(--black);
      font:700 10px/1.4 "Fira Code",monospace;
      letter-spacing:.12em;
    }
    .screen-intro h2{
      position:relative;
      z-index:1;
      max-width:680px;
      margin:0;
      font-size:clamp(25px,4vw,48px);
      line-height:1;
      letter-spacing:-.055em;
    }
    .screen-intro p{
      position:relative;
      z-index:1;
      max-width:680px;
      margin:12px 0 0;
      color:#eff6ff;
      font-size:13px;
    }
    .hero-mark{
      position:relative;
      z-index:1;
      width:112px;
      height:112px;
      display:grid;
      place-items:center;
      color:#000;
      background:var(--color-accent);
      border:3px solid var(--black);
      box-shadow:7px 7px 0 #fff;
    }
    .hero-mark .material-symbols-outlined{font-size:54px}
    .grid{display:grid;gap:16px;min-width:0}
    .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .g23{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
    .g32{grid-template-columns:minmax(280px,1fr) minmax(0,2fr)}
    .card,.kpi{
      min-width:0;
      background:var(--color-card);
      border:2px solid var(--black);
      border-radius:0;
    }
    .card{padding:18px}
    .card.major{box-shadow:5px 5px 0 var(--color-muted)}
    .card h3{
      margin:0 0 4px;
      font-size:15px;
      font-weight:700;
      letter-spacing:-.01em;
    }
    .card .sub{margin:0 0 15px;color:var(--muted);font-size:11px}
    .sechead{display:flex;align-items:center;gap:10px;margin:0 0 16px}
    .sechead>.material-symbols-outlined{
      flex:0 0 auto;
      padding:8px;
      color:#fff;
      background:var(--color-primary);
      border:2px solid var(--black);
      font-size:20px;
    }
    .sechead h2{margin:0;font-size:16px}
    .sub2{margin:2px 0 0;color:var(--muted);font-size:11px}
    .kpi{
      position:relative;
      min-height:142px;
      padding:16px 16px 15px 20px;
      overflow:hidden;
      box-shadow:4px 4px 0 var(--black);
    }
    .kpi:nth-child(even){transform:translateY(7px)}
    .strip{position:absolute;inset:0 auto 0 0;width:7px;background:var(--color-primary)}
    .kpi:nth-child(2n) .strip{background:var(--color-accent)}
    .klab{
      display:flex;
      align-items:center;
      gap:7px;
      color:var(--muted);
      font-size:11px;
      font-weight:600;
    }
    .klab .material-symbols-outlined{
      color:var(--color-primary);
      font-size:18px;
    }
    .kval{
      margin-top:9px;
      font:700 clamp(26px,3vw,36px)/1.1 "Fira Code",monospace;
      letter-spacing:-.06em;
      font-variant-numeric:tabular-nums;
    }
    .kval small{
      margin-left:4px;
      color:var(--muted);
      font-family:"Fira Sans",sans-serif;
      font-size:13px;
      letter-spacing:0;
    }
    .ktag{
      margin-top:10px;
      display:inline-flex;
      align-items:center;
      font-size:11px;
      font-weight:700;
    }
    .ktag .material-symbols-outlined{font-size:15px}
    .up{color:var(--good)}
    .down{color:var(--bad)}
    .flat{color:var(--muted)}
    .chartbox{position:relative;width:100%;overflow:hidden}
    .table-wrap{overflow-x:auto;border:2px solid var(--black)}
    .tbl{
      width:100%;
      min-width:560px;
      border-collapse:collapse;
      color:var(--ink);
      font-size:12px;
    }
    .tbl th{
      padding:10px 11px;
      color:#fff;
      text-align:left;
      white-space:nowrap;
      background:var(--black);
      border-right:1px solid #475569;
      font:600 10px/1.3 "Fira Code",monospace;
      letter-spacing:.06em;
    }
    .tbl th:last-child{border-right:0}
    .tbl td{
      padding:10px 11px;
      white-space:nowrap;
      border-right:1px solid var(--line);
      border-bottom:1px solid var(--line);
    }
    .tbl td:last-child{border-right:0}
    .tbl tbody tr:last-child td{border-bottom:0}
    .tbl tbody tr:nth-child(even) td{background:#f1f5f9}
    .tbl tbody tr:hover td{background:#dbeafe}
    .tbl td:nth-last-child(-n+4){font-variant-numeric:tabular-nums}
    .num{text-align:right!important;font-variant-numeric:tabular-nums}
    .mono{
      font-family:"Fira Code",monospace;
      font-variant-numeric:tabular-nums;
      font-weight:600;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:5px;
      min-height:24px;
      padding:3px 8px;
      border:1px solid currentColor;
      border-radius:0;
      font-size:10px;
      font-weight:700;
    }
    .pill.g{color:#14532d;background:#dcfce7}
    .pill.y{color:#78350f;background:#fef3c7}
    .pill.r{color:#7f1d1d;background:#fee2e2}
    .pill.b{color:#0c4a6e;background:#e0f2fe}
    .pill.n{color:#334155;background:#e2e8f0}
    .dot{width:8px;height:8px;display:inline-block;border:1px solid currentColor}
    .barrow{
      display:grid;
      grid-template-columns:100px minmax(70px,1fr) 62px;
      align-items:center;
      gap:10px;
      margin-bottom:13px;
    }
    .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:600}
    .bartrack{height:13px;overflow:hidden;background:var(--color-muted);border:1px solid var(--black)}
    .barfill{height:100%;background:var(--color-primary)}
    .barrow:nth-of-type(even) .barfill{background:var(--color-accent)}
    .bv{text-align:right;font:600 11px "Fira Code",monospace;font-variant-numeric:tabular-nums}
    .board{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:12px;min-width:760px}
    .col{padding:11px;background:var(--color-muted);border:2px solid var(--black)}
    .ch{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:11px;
      padding-bottom:8px;
      border-bottom:2px solid var(--black);
      font-size:11px;
      font-weight:700;
    }
    .cnt{
      min-width:24px;
      padding:2px 6px;
      color:#fff;
      text-align:center;
      background:var(--black);
      font-family:"Fira Code",monospace;
    }
    .ticket{
      margin-bottom:9px;
      padding:10px;
      background:#fff;
      border:2px solid var(--black);
      border-left:7px solid var(--color-primary);
    }
    .ticket:last-child{margin-bottom:0}
    .tid{color:var(--muted);font:600 10px "Fira Code",monospace}
    .tt2{margin:4px 0 7px;font-size:12px;font-weight:700}
    .tm{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:10px}
    .tm .material-symbols-outlined{font-size:14px}
    .tl{position:relative;padding-left:28px}
    .tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:3px;background:var(--black)}
    .tlitem{position:relative;padding-bottom:18px}
    .tlitem:last-child{padding-bottom:0}
    .tdot{
      position:absolute;
      left:-28px;
      top:1px;
      width:16px;
      height:16px;
      background:#fff;
      border:3px solid var(--color-accent);
    }
    .tlitem.done .tdot{background:var(--color-primary);border-color:var(--black)}
    .th{font-size:12px;font-weight:700}
    .tsub{margin-top:2px;color:var(--muted);font:500 10px "Fira Code",monospace}
    .tbody{margin-top:6px;padding:8px 10px;background:#f8fafc;border:1px solid var(--black);font-size:11px}
    .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:13px;color:var(--muted);font-size:10px}
    .legend span{display:inline-flex;align-items:center;gap:5px}
    .wafer{
      width:min(100%,320px);
      display:grid;
      grid-template-columns:repeat(11,1fr);
      gap:3px;
      margin:0 auto;
      padding:10px;
      background:#e2e8f0;
      border:2px solid var(--black);
    }
    .wcell{aspect-ratio:1;border:1px solid rgba(15,23,42,.2)}
    .note{
      display:flex;
      gap:9px;
      align-items:flex-start;
      padding:12px;
      color:#7f1d1d;
      background:#fff1f2;
      border:2px solid var(--color-destructive);
      font-size:11px;
      font-weight:600;
    }
    .note .material-symbols-outlined{flex:0 0 auto;font-size:18px}
    .stepbtn{
      min-height:42px;
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:9px 14px;
      color:#fff;
      background:var(--color-primary);
      border:2px solid var(--black);
      border-radius:0;
      box-shadow:3px 3px 0 var(--black);
      font-size:11px;
      font-weight:700;
    }
    .stepbtn:hover{background:#1d4ed8;box-shadow:1px 1px 0 var(--black);transform:translate(2px,2px)}
    .stepbtn.ghost{color:#000;background:var(--color-accent)}
    .stepbtn.ghost:hover{background:#c2410c}
    .prog{height:12px;overflow:hidden;background:var(--color-muted);border:1px solid var(--black)}
    .prog>i{display:block;height:100%;background:var(--color-primary)}
    .kv{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:14px;
      padding:9px 0;
      border-bottom:1px dashed #94a3b8;
      font-size:11px;
    }
    .kv:last-child{border-bottom:0}
    .kv b{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
    .section-gap{margin-bottom:20px}
    @media (prefers-reduced-motion:no-preference){
      .navbtn,.stepbtn{transition:background-color .18s,color .18s,border-color .18s,box-shadow .18s,transform .18s}
      #screen>*{animation:reveal .36s ease-out both}
      #screen>*:nth-child(2){animation-delay:.04s}
      #screen>*:nth-child(3){animation-delay:.08s}
      @keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    }
    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}
    }
    @media(max-width:1180px){
      .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
      .g23,.g32{grid-template-columns:1fr}
    }
    @media(max-width:900px){
      .layout{display:block}
      .sidebar{
        position:relative;
        width:100%;
        height:auto;
        padding:14px;
        gap:12px;
        border-right:0;
        border-bottom:4px solid var(--black);
      }
      .brand{padding-bottom:12px}
      .navwrap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
      .navbtn.active{left:0;box-shadow:0 4px 0 var(--color-primary)}
      .sidefoot{display:none}
      .topbar{top:0;padding:15px 18px}
      .content{padding:22px 18px 42px}
    }
    @media(max-width:640px){
      .navwrap{grid-template-columns:repeat(2,minmax(0,1fr))}
      .nnum{display:none}
      .navbtn{grid-template-columns:22px minmax(0,1fr)}
      .topbar{align-items:flex-start}
      .top-badge{padding:7px 9px;font-size:9px}
      .screen-intro{grid-template-columns:1fr;min-height:0;padding:20px}
      .hero-mark{width:72px;height:72px}
      .hero-mark .material-symbols-outlined{font-size:36px}
      .g4,.g3,.g2{grid-template-columns:1fr}
      .kpi:nth-child(even){transform:none}
      .barrow{grid-template-columns:88px minmax(60px,1fr) 52px}
      .kv{grid-template-columns:1fr}
      .kv b{text-align:left}
    }
    @media(max-width:390px){
      .brand{grid-template-columns:42px minmax(0,1fr)}
      .logo{width:42px;height:42px}
      .navbtn{padding:9px 8px;font-size:11px}
      .content{padding:18px 12px 36px}
      .topbar{padding:13px 12px}
      .topbar p{display:none}
      .top-badge{margin-left:0}
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">precision_manufacturing</span></div>
        <div>
          <b>FT YIELD MGMT</b>
          <span>產品最終測試良率管理</span>
        </div>
      </div>
      <nav class="navwrap" id="nav" aria-label="主要功能"></nav>
      <div class="sidefoot">FAB-2 / FT AREA / V3.2<br />資料為模擬展示用途</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="tt">
          <h1 id="pgTitle">測試數據採集</h1>
          <p id="pgSub">測試機台即時串接與 STDF/Log 匯入</p>
        </div>
        <div class="top-badge"><span class="material-symbols-outlined">bolt</span>即時 · Fab-2 FT</div>
      </header>
      <div class="content" id="screen" aria-live="polite"></div>
    </main>
  </div>

  <script>
  (function(){
    "use strict";

    var accent="#2563eb", accent2="#ea580c";
    var charts={};

    function destroyCharts(){
      for(var k in charts){
        try{ charts[k].destroy(); }catch(e){}
      }
      charts={};
    }

    var NAV=[
      {icon:"monitoring",name:"測試數據採集",sub:"測試機台即時串接與 STDF/Log 匯入"},
      {icon:"dashboard",name:"良率看板",sub:"FT 良率即時監控與趨勢"},
      {icon:"insights",name:"Bin 分佈分析",sub:"Hard/Soft Bin 分佈與 Pareto"},
      {icon:"warning",name:"異常判定",sub:"良率異常偵測與 SBL/YBL 告警"},
      {icon:"shield",name:"批次攔截處置",sub:"低良率批次隔離與放行決策"},
      {icon:"account_tree",name:"追溯稽核",sub:"Lot / 測試機台追溯與稽核紀錄"}
    ];

    var nav=document.getElementById("nav");
    var navHtml="";
    for(var i=0;i<NAV.length;i++){

          '</section>'+
        '</div>';
    }

    function s5(){
      var logs=[
        {t:"09:41",u:"系統",act:"STDF 匯入",obj:"LOT-24911 / FT-B01",res:"良率 96.2%"},
        {t:"09:12",u:"系統",act:"YBL 告警觸發",obj:"LOT-24908",res:"AL-8841"},
        {t:"09:05",u:"陳彥廷",act:"批次隔離",obj:"LOT-24908",res:"停止出貨"},
        {t:"08:48",u:"林孟潔",act:"複測放行",obj:"LOT-24888",res:"95.8% 達標"},
        {t:"08:20",u:"王柏森",act:"門檻調整",obj:"YL-MCU8-2024Q3",res:"YBL 92→92.5%"},

      ];

        rows+='<tr><td class="mono">'+g.t+'</td><td>'+g.u+'</td><td>'+g.act+'</td>'+

      return hero(5)+
        '<div class="grid g4 section-gap">'+
          kpi("account_tree","可追溯批次","1,284","批",'<span class="up"><span class="material-symbols-outlined">check</span>100% 覆蓋</span>')+
          kpi("bolt","追溯耗時","15","秒",'<span class="up"><span class="material-symbols-outlined">trending_down</span>-92%</span>')+
          kpi("history","稽核紀錄","8,417","筆",'<span class="flat"><span class="material-symbols-outlined">lock</span>不可竄改</span>')+
          kpi("fact_check","稽核合規","100","%",'<span class="up"><span class="material-symbols-outlined">verified</span>近 90 天</span>')+
        '</div>'+
        '<div class="grid g32 section-gap">'+
          '<section class="card major"><h3>批次追溯鏈</h3><p class="sub">LOT-24908 · 由 FT 回溯至 Wafer / 測試機台</p><div class="tl">'+
            tlitem("done","Wafer Sort（CP）","W07 · 2026-08-09","CP 良率 93.1% · Prober PB-03")+
            tlitem("done","封裝 Assembly","AS-LOT-11902 · 2026-08-11","QFN-48 · Line 2")+
            tlitem("done","最終測試 FT","FT-B02 · TP_RF_v02","良率 88.4% · 觸發 YBL")+
            tlitem("","批次隔離","2026-08-14 09:05","品質經理 陳彥廷 · 待複測")+
          '</div></section>'+
          '<section class="card"><h3>追溯查詢維度</h3><p class="sub">關聯覆蓋率</p>'+
            bar("測試機台",100,100,"%")+bar("測試程式",100,100,"%")+bar("Wafer/CP",98,100,"%")+bar("封裝批",96,100,"%")+bar("良率門檻",100,100,"%")+bar("操作人員",100,100,"%")+
          '</section>'+
        '</div>'+
        '<section class="card"><h3>稽核操作紀錄</h3><p class="sub">系統與人員操作留痕（不可竄改）</p>'+
          '<div class="table-wrap"><table class="tbl"><thead><tr><th>時間</th><th>操作者</th><th>動作</th><th>對象</th><th>結果</th></tr></thead><tbody>'+rows+'</tbody></table></div></section>';
    }

    var GRID="#d9e2ef", TICK="#475569";

    function baseOpts(){
      return {
        responsive:true,
        maintainAspectRatio:false,
        animation:window.matchMedia("(prefers-reduced-motion: reduce)").matches?false:{duration:350},
        plugins:{
          legend:{
            labels:{
              color:"#1e293b",
              boxWidth:12,
              boxHeight:12,
              font:{family:"Fira Sans",size:11,weight:"600"}
            }
          },
          tooltip:{
            titleFont:{family:"Fira Code"},
            bodyFont:{family:"Fira Sans"},
            backgroundColor:"#0f172a",
            titleColor:"#fff",
            bodyColor:"#fff",
            cornerRadius:0,
            padding:10
          }
        },
        scales:{
          x:{
            grid:{display:false},
            border:{color:"#0f172a"},
            ticks:{color:TICK,font:{family:"Fira Code",size:9}}
          },
          y:{
            grid:{color:GRID},
            border:{color:"#0f172a"},
            ticks:{color:TICK,font:{family:"Fira Code",size:9}}
          }
        }
      };
    }

    function mkChart(id,cfg){
      var el=document.getElementById(id);
      if(!el)return;
      charts[id]=new Chart(el.getContext("2d"),cfg);
    }

    function initCharts(idx){
      if(idx===0){
        var lab=[],d=[];
        for(var h=0;h<12;h++){
          lab.push(((22+h)%24)+":00");
          d.push(900+Math.round(Math.sin(h/2)*300+h*60));
        }
        mkChart("c0a",{
          type:"bar",
          data:{labels:lab,datasets:[{
            label:"解析 die（千顆）",
            data:d,
            backgroundColor:lab.map(function(_,i){return i%3===2?accent2:accent;}),
            borderColor:"#0f172a",
            borderWidth:1,
            borderRadius:0,
            barThickness:14
          }]},
          options:baseOpts()
        });
      }else if(idx===1){
        var days=[];
        for(var i=1;i<=14;i++)days.push("D"+i);
        var y=[94.1,94.6,95.0,95.3,94.8,95.6,95.9,95.2,94.4,95.8,96.1,95.7,95.9,96.3];
        var o=baseOpts();
        o.scales.y.min=90;
        o.scales.y.max=98;
        mkChart("c1a",{
          type:"line",
          data:{labels:days,datasets:[
            {label:"FT 良率 %",data:y,borderColor:accent,backgroundColor:"rgba(37,99,235,.13)",fill:true,tension:0,pointRadius:3,pointBackgroundColor:"#fff",pointBorderColor:"#0f172a",pointBorderWidth:1.5,borderWidth:3},
            {label:"目標 95%",data:days.map(function(){return 95;}),borderColor:"#ea580c",borderDash:[6,4],pointRadius:0,borderWidth:2,fill:false}
          ]},
          options:o
        });
        var o2=baseOpts();
        o2.indexAxis="y";
        o2.scales.x.min=80;
        o2.scales.x.max=100;
        o2.plugins.legend.display=false;
        mkChart("c1b",{
          type:"bar",
          data:{labels:["MCU8-A","PMIC-D","RF-T2","LOGIC-C","SENSOR-E"],datasets:[{
            label:"良率 %",
            data:[95.1,97.4,88.4,96.0,93.2],
            backgroundColor:[accent,accent,"#dc2626",accent2,"#475569"],
            borderColor:"#0f172a",
            borderWidth:1,
            borderRadius:0
          }]},
          options:o2
        });
      }else if(idx===2){
        var bl=["Bin4","Bin7","Bin9","Bin12","Bin15","其他"];
        var bv=[1.70,0.90,0.72,0.50,0.15,0.12];
        var cum=[],s=0,tot=0;
        for(var a=0;a<bv.length;a++)tot+=bv[a];
        for(var b=0;b<bv.length;b++){s+=bv[b];cum.push(+(s/tot*100).toFixed(1));}
        var o3=baseOpts();
        o3.scales.y1={
          position:"right",
          grid:{display:false},
          border:{color:"#0f172a"},
          min:0,
          max:100,
          ticks:{color:TICK,font:{family:"Fira Code",size:9},callback:function(v){return v+"%";}}
        };
        mkChart("c2a",{
          data:{labels:bl,datasets:[
            {type:"bar",label:"占比 %",data:bv,backgroundColor:[accent2,accent,accent,accent,accent,accent],borderColor:"#0f172a",borderWidth:1,borderRadius:0,yAxisID:"y",order:2},
            {type:"line",label:"累積 %",data:cum,borderColor:"#0f172a",backgroundColor:"#0f172a",yAxisID:"y1",tension:0,pointRadius:4,pointStyle:"rect",borderWidth:2,order:1}
          ]},
          options:o3
        });
      }else if(idx===3){
        var ll=[];
        for(var j=1;j<=10;j++)ll.push("L"+j);
        var yd=[95.6,95.1,94.8,95.9,96.2,95.3,94.9,93.4,92.1,88.4];
        var o4=baseOpts();
        o4.scales.y.min=85;
        o4.scales.y.max=98;
        mkChart("c3a",{
          type:"line",
          data:{labels:ll,datasets:[
            {label:"批次良率 %",data:yd,borderColor:accent,backgroundColor:"rgba(37,99,235,.11)",fill:true,tension:0,pointRadius:4,borderWidth:3,pointStyle:"rect",pointBackgroundColor:yd.map(function(v){return v<92?"#dc2626":accent;})},
            {label:"YBL 下限 92%",data:ll.map(function(){return 92;}),borderColor:"#dc2626",borderDash:[6,4],pointRadius:0,borderWidth:2,fill:false},
            {label:"目標 95%",data:ll.map(function(){return 95;}),borderColor:accent2,borderDash:[3,3],pointRadius:0,borderWidth:2,fill:false}
          ]},
          options:o4
        });
      }else if(idx===4){
        var o5=baseOpts();
        o5.scales={};
        o5.cutout="58%";
        o5.plugins.legend.position="right";
        mkChart("c4a",{
          type:"doughnut",
          data:{
            labels:["複測放行","局部報廢","降規使用","待決策"],
            datasets:[{
              data:[9,3,3,2],
              backgroundColor:[accent,"#dc2626",accent2,"#64748b"],
              borderWidth:3,
              borderColor:"#fff"
            }]
          },
          options:o5
        });
      }
    }

    var screens=[s0,s1,s2,s3,s4,s5];

    function show(i){
      i=Math.max(0,Math.min(i,screens.length-1));
      destroyCharts();

      var btns=document.querySelectorAll("[data-i]");
      for(var b=0;b<btns.length;b++){
        var active=+btns[b].getAttribute("data-i")===i;
        btns[b].classList.toggle("active",active);
        btns[b].setAttribute("aria-current",active?"page":"false");
      }

      document.getElementById("pgTitle").textContent=NAV[i].name;
      document.getElementById("pgSub").textContent=NAV[i].sub;

      var container=document.getElementById("screen");
      container.innerHTML=screens[i]();
      void container.offsetHeight;
      initCharts(i);
    }

    window.__show=show;

    function fromHash(){
      var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
      if(!m){
        show(0);
        return;
      }
      var n=document.querySelectorAll("[data-i]").length||6;
      show(Math.min(+m[1],n-1));
      try{window.scrollTo(0,0);}catch(e){}
    }

    window.addEventListener("hashchange",fromHash);
    fromHash();
  })();
  </script>
