<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FT Yield Management（最終測試良率管理）｜Jvision 系統 Demo</title>
  <meta name="description" content="半導體最終測試良率管理：測試數據採集、良率看板、Bin 分佈分析、異常判定與批次攔截處置" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --accent:#b45309; --accent2:#f59e0b; --accent-soft:#fef3c7;
      --bg:#f4f5f7; --panel:#ffffff; --ink:#1f2937; --muted:#6b7280;
      --line:#e5e7eb; --sidebar:#1c1917; --sidebar2:#292524;
      --good:#16a34a; --warn:#f59e0b; --bad:#dc2626; --info:#0ea5e9;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{
      font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
      background:var(--bg); color:var(--ink); line-height:1.5;
      -webkit-font-smoothing:antialiased;
    }
    .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
    .layout{display:flex; min-height:100vh; align-items:stretch;}
    /* sidebar */
    .sidebar{
      width:248px; flex:0 0 248px; background:var(--sidebar); color:#e7e5e4;
      display:flex; flex-direction:column; padding:20px 14px; gap:6px; min-width:0;
    }
    .brand{display:flex; align-items:center; gap:11px; padding:6px 8px 16px;}
    .brand .logo{
      width:40px; height:40px; border-radius:11px; flex:0 0 40px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      display:flex; align-items:center; justify-content:center; color:#fff;
    }
    .brand .logo .material-symbols-outlined{font-size:24px;}
    .brand b{display:block; font-size:14px; letter-spacing:.3px;}
    .brand span{display:block; font-size:11px; color:#a8a29e;}
    .navwrap{display:flex; flex-direction:column; gap:4px; min-width:0;}
    .navbtn{
      display:flex; align-items:center; gap:12px; width:100%;
      background:transparent; border:0; color:#d6d3d1; cursor:pointer;
      padding:11px 12px; border-radius:10px; text-align:left; font:inherit;
      font-size:13.5px; transition:background .15s,color .15s; min-width:0;
    }
    .navbtn .material-symbols-outlined{font-size:21px; flex:0 0 auto;}
    .navbtn .nlabel{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
    .navbtn .nnum{margin-left:auto; font-size:11px; color:#78716c; flex:0 0 auto;}
    .navbtn:hover{background:#3a3531; color:#fff;}
    .navbtn.active{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff;}
    .navbtn.active .nnum{color:#fff5e6;}
    .sidefoot{margin-top:auto; padding:12px 10px 2px; font-size:11px; color:#78716c; border-top:1px solid #3a3531;}
    /* main */
    .main{flex:1 1 auto; min-width:0; display:flex; flex-direction:column;}
    .topbar{
      background:var(--panel); border-bottom:1px solid var(--line);
      padding:16px 26px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    }
    .topbar .tt{min-width:0;}
    .topbar h1{margin:0; font-size:18px; font-weight:800; letter-spacing:.2px;}
    .topbar p{margin:2px 0 0; font-size:12.5px; color:var(--muted);}
    .top-badge{
      margin-left:auto; display:inline-flex; align-items:center; gap:6px;
      background:var(--accent-soft); color:#92400e; padding:6px 12px;
      border-radius:999px; font-size:12px; font-weight:700; flex:0 0 auto;
    }
    .top-badge .material-symbols-outlined{font-size:16px;}
    .content{padding:24px 26px 44px; min-width:0;}
    /* generic */
    .grid{display:grid; gap:16px; min-width:0;}
    .g4{grid-template-columns:repeat(4,1fr);}
    .g3{grid-template-columns:repeat(3,1fr);}
    .g2{grid-template-columns:repeat(2,1fr);}
    .g23{grid-template-columns:2fr 1fr;}
    .g32{grid-template-columns:1fr 2fr;}
    .card{
      background:var(--panel); border:1px solid var(--line); border-radius:14px;
      padding:18px; min-width:0;
    }
    .card h3{margin:0 0 3px; font-size:14px; font-weight:800;}
    .card .sub{margin:0 0 14px; font-size:12px; color:var(--muted);}
    .sechead{display:flex; align-items:center; gap:9px; margin:0 0 15px; min-width:0;}
    .sechead .material-symbols-outlined{
      font-size:20px; color:var(--accent); background:var(--accent-soft);
      padding:7px; border-radius:9px; flex:0 0 auto;
    }
    .sechead h2{margin:0; font-size:16px; font-weight:800;}
    .sechead .sub2{margin:0; font-size:12px; color:var(--muted);}
    /* kpi */
    .kpi{
      background:var(--panel); border:1px solid var(--line); border-radius:14px;
      padding:16px 17px; min-width:0; position:relative; overflow:hidden;
    }
    .kpi .klab{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px;}
    .kpi .klab .material-symbols-outlined{font-size:16px; color:var(--accent);}
    .kpi .kval{font-size:27px; font-weight:900; margin-top:8px; letter-spacing:-.5px;}
    .kpi .kval small{font-size:14px; font-weight:700; color:var(--muted);}
    .kpi .ktag{margin-top:7px; font-size:11.5px; font-weight:700; display:inline-flex; align-items:center; gap:3px;}
    .kpi .ktag .material-symbols-outlined{font-size:14px;}
    .up{color:var(--good);} .down{color:var(--bad);} .flat{color:var(--muted);}
    .kpi .strip{position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--accent);}
    /* chart wrap */
    .chartbox{position:relative; width:100%; overflow:hidden;}
    /* table */
    .tbl{width:100%; border-collapse:collapse; font-size:12.5px; min-width:560px;}
    .tbl th{
      text-align:left; padding:10px 12px; font-size:11px; font-weight:700;
      color:var(--muted); text-transform:uppercase; letter-spacing:.4px;
      border-bottom:2px solid var(--line); background:#fafafa; white-space:nowrap;
    }
    .tbl td{padding:11px 12px; border-bottom:1px solid var(--line); white-space:nowrap;}
    .tbl tr:last-child td{border-bottom:0;}
    .tbl tr:hover td{background:#fffbeb;}
    .mono{font-family:"Inter",monospace; font-variant-numeric:tabular-nums; font-weight:600;}
    /* pills */
    .pill{display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700;}
    .pill.g{background:#dcfce7; color:#166534;}
    .pill.y{background:#fef3c7; color:#92400e;}
    .pill.r{background:#fee2e2; color:#991b1b;}
    .pill.b{background:#e0f2fe; color:#075985;}
    .pill.n{background:#f3f4f6; color:#374151;}
    .dot{width:8px; height:8px; border-radius:50%; display:inline-block;}
    /* bars */
    .barrow{display:flex; align-items:center; gap:12px; margin-bottom:13px; min-width:0;}
    .barrow .bl{width:92px; flex:0 0 92px; font-size:12.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
    .bartrack{flex:1 1 auto; height:11px; background:#f1f0ee; border-radius:999px; overflow:hidden; min-width:0;}
    .barfill{height:100%; border-radius:999px; background:linear-gradient(90deg,var(--accent),var(--accent2));}
    .barrow .bv{width:64px; flex:0 0 64px; text-align:right; font-size:12px; font-weight:700; font-variant-numeric:tabular-nums;}
    /* board */
    .board{display:grid; grid-template-columns:repeat(4,1fr); gap:13px; min-width:640px;}
    .col{background:#fafafa; border:1px solid var(--line); border-radius:12px; padding:12px; min-width:0;}
    .col .ch{font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:space-between; margin-bottom:11px;}
    .col .ch .cnt{background:#e7e5e4; color:#57534e; border-radius:999px; padding:1px 9px; font-size:11px;}
    .ticket{background:#fff; border:1px solid var(--line); border-radius:10px; padding:11px; margin-bottom:9px; border-left:3px solid var(--accent);}
    .ticket .tid{font-size:10.5px; color:var(--muted); font-weight:700;}
    .ticket .tt2{font-size:12.5px; font-weight:700; margin:3px 0 6px;}
    .ticket .tm{font-size:11px; color:var(--muted); display:flex; align-items:center; gap:5px;}
    .ticket .tm .material-symbols-outlined{font-size:14px;}
    /* timeline */
    .tl{position:relative; padding-left:26px; min-width:0;}
    .tl::before{content:""; position:absolute; left:8px; top:4px; bottom:4px; width:2px; background:var(--line);}
    .tlitem{position:relative; padding-bottom:20px; min-width:0;}
    .tlitem:last-child{padding-bottom:0;}
    .tlitem .tdot{position:absolute; left:-24px; top:2px; width:14px; height:14px; border-radius:50%; background:var(--panel); border:3px solid var(--accent);}
    .tlitem.done .tdot{background:var(--accent); border-color:var(--accent);}
    .tlitem .th{font-size:13px; font-weight:800;}
    .tlitem .tsub{font-size:11.5px; color:var(--muted); margin-top:2px;}
    .tlitem .tbody{font-size:12.5px; margin-top:6px; background:#fafafa; border:1px solid var(--line); border-radius:9px; padding:9px 11px;}
    /* misc */
    .flexcards{display:flex; flex-wrap:wrap; gap:12px; min-width:0;}
    .minicard{flex:1 1 150px; background:#fafafa; border:1px solid var(--line); border-radius:11px; padding:13px; min-width:0;}
    .minicard .ml{font-size:11.5px; color:var(--muted);}
    .minicard .mv{font-size:20px; font-weight:900; margin-top:4px;}
    .legend{display:flex; flex-wrap:wrap; gap:14px; margin-top:12px; font-size:12px; color:var(--muted);}
    .legend span{display:inline-flex; align-items:center; gap:6px;}
    .wafer{display:grid; grid-template-columns:repeat(11,1fr); gap:3px; max-width:340px; margin:0 auto;}
    .wcell{aspect-ratio:1/1; border-radius:3px; background:#e5e7eb;}
    .note{background:var(--accent-soft); border:1px solid #fcd34d; border-radius:11px; padding:12px 14px; font-size:12.5px; color:#78350f; display:flex; gap:9px; align-items:flex-start;}
    .note .material-symbols-outlined{font-size:18px; color:var(--accent); flex:0 0 auto; margin-top:1px;}
    .gauge-wrap{display:flex; align-items:center; gap:18px; flex-wrap:wrap; min-width:0;}
    .stepbtn{display:inline-flex; align-items:center; gap:5px; background:var(--accent); color:#fff; border:0; border-radius:9px; padding:8px 14px; font:inherit; font-size:12.5px; font-weight:700; cursor:pointer;}
    .stepbtn.ghost{background:#fff; color:var(--accent); border:1px solid var(--accent);}
    .prog{height:9px; border-radius:999px; background:#f1f0ee; overflow:hidden;}
    .prog > i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2));}
    .kv{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dashed var(--line); font-size:12.5px;}
    .kv:last-child{border-bottom:0;}
    .kv b{font-weight:800;}
    /* responsive */
    @media(max-width:1100px){ .g4{grid-template-columns:repeat(2,1fr);} }
    @media(max-width:860px){
      .layout{flex-direction:column;}
      .sidebar{width:auto; flex:none; flex-direction:row; flex-wrap:wrap; align-items:center; padding:12px 14px; gap:8px;}
      .brand{padding:0 10px 0 4px; flex:0 0 auto;}
      .sidefoot{display:none;}
      .navwrap{flex-direction:row; flex-wrap:wrap; gap:6px; flex:1 1 100%;}
      .navbtn{width:auto; padding:9px 12px;}
      .navbtn .nnum{display:none;}
    }
    @media(max-width:820px){
      .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
    }
    @media(max-width:560px){
      .navbtn .nlabel{display:none;}
      .navbtn{padding:9px;}
      .content{padding:18px 14px 40px;}
      .topbar{padding:14px 16px;}
      .top-badge{margin-left:0;}
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo"><span class="material-symbols-outlined">precision_manufacturing</span></div>
        <div>
          <b>FT Yield MGMT</b>
          <span>最終測試良率管理</span>
        </div>
      </div>
      <nav class="navwrap" id="nav"></nav>
      <div class="sidefoot">Fab-2 · FT Area · v3.2<br/>資料為模擬展示用途</div>
    </aside>
    <main class="main">
      <div class="topbar">
        <div class="tt">
          <h1 id="pgTitle">測試數據採集</h1>
          <p id="pgSub">測試機台即時串接與 STDF/Log 匯入</p>
        </div>
        <div class="top-badge"><span class="material-symbols-outlined">bolt</span>即時 · Fab-2 FT</div>
      </div>
      <div class="content" id="screen"></div>
    </main>
  </div>

  <script>
  (function(){
    var accent="#b45309", accent2="#f59e0b";
    var charts={};
    function destroyCharts(){ for(var k in charts){ try{charts[k].destroy();}catch(e){} } charts={}; }

    var NAV=[
      {icon:"monitoring", name:"測試數據採集", sub:"測試機台即時串接與 STDF/Log 匯入"},
      {icon:"dashboard", name:"良率看板", sub:"FT 良率即時監控與趨勢"},
      {icon:"insights", name:"Bin 分佈分析", sub:"Hard/Soft Bin 分佈與 Pareto"},
      {icon:"warning", name:"異常判定", sub:"良率異常偵測與 SBL/YBL 告警"},
      {icon:"shield", name:"批次攔截處置", sub:"低良率批次隔離與放行決策"},
      {icon:"account_tree", name:"追溯稽核", sub:"Lot / 測試機台追溯與稽核紀錄"}
    ];

    // ---------- nav ----------
    var nav=document.getElementById("nav");
    var html="";
    for(var i=0;i<NAV.length;i++){
      html+='<button class="navbtn" data-i="'+i+'">'+
        '<span class="material-symbols-outlined">'+NAV[i].icon+'</span>'+
        '<span class="nlabel">'+NAV[i].name+'</span>'+
        '<span class="nnum">0'+i+'</span></button>';
    }
    nav.innerHTML=html;
    nav.addEventListener("click",function(e){
      var b=e.target.closest("[data-i]"); if(!b) return;
      location.hash="v"+b.getAttribute("data-i");
    });

    function esc(s){return String(s);}
    function bar(label,val,max,unit){
      var pct=Math.max(2,Math.round(val/max*100));
      return '<div class="barrow"><div class="bl">'+label+'</div>'+
        '<div class="bartrack"><div class="barfill" style="width:'+pct+'%"></div></div>'+
        '<div class="bv">'+val+(unit||"")+'</div></div>';
    }

    // ---------- screen 0: 測試數據採集 ----------
    function s0(){
      var machines=[
        {id:"FT-A01", model:"Advantest V93000", lot:"LOT-24915", prog:"TP_MCU8_v12", site:"8", thr:"3.2M", state:"執行中", pct:72, sc:"g"},
        {id:"FT-A02", model:"Teradyne UltraFLEX", lot:"LOT-24917", prog:"TP_PMIC_v07", site:"4", thr:"1.8M", state:"執行中", pct:41, sc:"g"},
        {id:"FT-A03", model:"Advantest V93000", lot:"LOT-24902", prog:"TP_MCU8_v12", site:"8", thr:"—", state:"待料", pct:0, sc:"n"},
        {id:"FT-B01", model:"Teradyne J750", lot:"LOT-24911", prog:"TP_LOGIC_v03", site:"16", thr:"4.6M", state:"執行中", pct:88, sc:"g"},
        {id:"FT-B02", model:"Chroma 3680", lot:"LOT-24908", prog:"TP_RF_v02", site:"2", thr:"0.4M", state:"異常", pct:33, sc:"r"},
        {id:"FT-B03", model:"Teradyne UltraFLEX", lot:"LOT-24919", prog:"TP_PMIC_v07", site:"4", thr:"2.1M", state:"執行中", pct:57, sc:"g"}
      ];
      var rows="";
      for(var i=0;i<machines.length;i++){var m=machines[i];
        var st=m.sc==="g"?'<span class="pill g"><span class="dot" style="background:#16a34a"></span>'+m.state+'</span>':
               m.sc==="r"?'<span class="pill r"><span class="dot" style="background:#dc2626"></span>'+m.state+'</span>':
               '<span class="pill n">'+m.state+'</span>';
        rows+='<tr><td class="mono">'+m.id+'</td><td>'+m.model+'</td><td class="mono">'+m.lot+'</td>'+
          '<td class="mono">'+m.prog+'</td><td style="text-align:center">'+m.site+'</td>'+
          '<td class="mono">'+m.thr+'</td><td>'+st+'</td>'+
          '<td><div class="prog" style="width:110px"><i style="width:'+m.pct+'%"></i></div></td></tr>';
      }
      return ''+
      '<div class="grid g4" style="margin-bottom:18px">'+
        kpi("hub","串接測試機台","24","台",'<span class="up"><span class="material-symbols-outlined">check_circle</span>22 台在線</span>')+
        kpi("dataset","今日採集筆數","18.4","M<small> die</small>",'<span class="up"><span class="material-symbols-outlined">trending_up</span>+6.2% vs 昨</span>')+
        kpi("sync","解析延遲","1.8","秒",'<span class="up"><span class="material-symbols-outlined">bolt</span>即時串流</span>')+
        kpi("error","解析失敗檔","3","筆",'<span class="down"><span class="material-symbols-outlined">warning</span>需重傳</span>')+
      '</div>'+
      '<div class="grid g23" style="margin-bottom:18px">'+
        '<div class="card"><h3>測試機台採集狀態</h3><p class="sub">STDF / Log 即時串接與測試程式對應</p>'+
          '<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>機台</th><th>機型</th><th>Lot</th><th>測試程式</th><th>Site</th><th>吞吐</th><th>狀態</th><th>進度</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
        '<div class="card"><h3>近 12 小時採集量</h3><p class="sub">每小時解析 die 數（千顆）</p>'+
          '<div class="chartbox" style="height:230px"><canvas id="c0a"></canvas></div></div>'+
      '</div>'+
      '<div class="grid g2">'+
        '<div class="card"><h3>資料來源健康度</h3><p class="sub">近一小時各介面連線品質</p>'+
          bar("STDF 串流",99,100,"%")+bar("MES 對接",97,100,"%")+bar("Wafer Map",94,100,"%")+bar("測試程式庫",100,100,"%")+bar("時鐘同步",96,100,"%")+
        '</div>'+
        '<div class="card"><h3>解析事件</h3><p class="sub">最新資料採集動作</p>'+
          '<div class="tl">'+
            tlitem("done","FT-B01 · LOT-24911 解析完成","09:41 · 4.6M die 匯入","Hard Bin 已對應，良率初算 96.2%")+
            tlitem("done","FT-A01 批次切換","09:28 · TP_MCU8_v12","載入良率門檻檔 YL-MCU8-2024Q3")+
            tlitem("","FT-B02 解析告警","09:12 · Log 格式異常","Site 2 缺 EOL 標記，已排入重傳佇列")+
            tlitem("done","FT-A02 開始採集","08:55 · LOT-24917","串流建立，延遲 1.6s")+
          '</div>'+
        '</div>'+
      '</div>';
    }

    // ---------- screen 1: 良率看板 ----------
    function s1(){
      var lots=[
        {id:"LOT-24911", prod:"MCU8-A", tested:"4.60M", yield:96.2, tgt:95, d:"+1.2", sc:"g"},
        {id:"LOT-24915", prod:"MCU8-A", tested:"3.20M", yield:94.1, tgt:95, d:"-0.9", sc:"y"},
        {id:"LOT-24917", prod:"PMIC-D", tested:"1.80M", yield:97.8, tgt:96, d:"+1.8", sc:"g"},
        {id:"LOT-24908", prod:"RF-T2", tested:"0.40M", yield:88.4, tgt:93, d:"-4.6", sc:"r"},
        {id:"LOT-24919", prod:"PMIC-D", tested:"2.10M", yield:96.9, tgt:96, d:"+0.9", sc:"g"}
      ];
      var rows="";
      for(var i=0;i<lots.length;i++){var l=lots[i];
        var p=l.sc==="g"?"g":l.sc==="y"?"y":"r";
        rows+='<tr><td class="mono">'+l.id+'</td><td>'+l.prod+'</td><td class="mono">'+l.tested+'</td>'+
          '<td class="mono"><b>'+l.yield+'%</b></td><td class="mono">'+l.tgt+'%</td>'+
          '<td class="mono '+(l.d.charAt(0)==="+"?"up":"down")+'">'+l.d+'%</td>'+
          '<td><span class="pill '+p+'">'+(l.sc==="g"?"達標":l.sc==="y"?"觀察":"未達標")+'</span></td></tr>';
      }
      return ''+
      '<div class="grid g4" style="margin-bottom:18px">'+

      var btns=document.querySelectorAll("[data-i]");
      for(var b=0;b<btns.length;b++){ btns[b].classList.toggle("active", +btns[b].getAttribute("data-i")===i); }
      document.getElementById("pgTitle").textContent=NAV[i].name;
      document.getElementById("pgSub").textContent=NAV[i].sub;
      var container=document.getElementById("screen");
      container.innerHTML=screens[i]();
      void container.offsetHeight;
      initCharts(i);
    }
    window.__show=show;

    function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
    window.addEventListener("hashchange",fromHash);fromHash();
  })();
  </script>
</body>
