<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#4f46e5;--accent2:#818cf8;--bg:#f5f6fb;--panel:#ffffff;
  --ink:#1e2140;--muted:#6b7091;--line:#e6e7f2;--soft:#eef0fb;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#0891b2;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.app{display:flex;min-height:100vh;min-width:0;}
.side{
  width:248px;flex:0 0 248px;background:linear-gradient(180deg,#312e81,#4f46e5);
  color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;min-width:0;
}
.brand{padding:22px 20px 16px;display:flex;align-items:center;gap:11px;}
.brand .logo{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:0 0 40px;}
.brand .logo .material-symbols-outlined{font-size:24px;}
.brand h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.3px;}
.brand p{margin:2px 0 0;font-size:11px;opacity:.75;}
.nav{padding:8px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto;}
.nav .navbtn{
  display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;border:0;
  background:transparent;color:rgba(255,255,255,.82);font:inherit;font-size:13.5px;cursor:pointer;
  text-align:left;width:100%;min-width:0;transition:.15s;font-weight:500;
}
.nav .navbtn .material-symbols-outlined{font-size:21px;flex:0 0 auto;}
.nav .navbtn .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nav .navbtn .idx{margin-left:auto;font-size:11px;opacity:.5;font-weight:700;flex:0 0 auto;}
.nav .navbtn:hover{background:rgba(255,255,255,.1);color:#fff;}
.nav .navbtn.on{background:#fff;color:var(--accent);font-weight:700;box-shadow:0 6px 16px rgba(0,0,0,.18);}
.nav .navbtn.on .idx{opacity:.55;}
.side .foot{margin-top:auto;padding:16px 20px;font-size:11px;opacity:.7;line-height:1.6;border-top:1px solid rgba(255,255,255,.14);}
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  background:var(--panel);border-bottom:1px solid var(--line);padding:15px 26px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:20;
}
.topbar .tt{min-width:0;}
.topbar .tt h2{margin:0;font-size:18px;font-weight:800;display:flex;align-items:center;gap:9px;}
.topbar .tt h2 .material-symbols-outlined{color:var(--accent);font-size:23px;}
.topbar .tt p{margin:3px 0 0;font-size:12.5px;color:var(--muted);}
.topbar .spacer{flex:1;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:12px;font-weight:700;}
.chip .material-symbols-outlined{font-size:16px;}
.wrap{padding:22px 26px 40px;min-width:0;}
.grid{display:grid;gap:16px;min-width:0;}
.kpis{grid-template-columns:repeat(4,1fr);}
.g2{grid-template-columns:1fr 1fr;}
.g3{grid-template-columns:repeat(3,1fr);}
.split{grid-template-columns:340px 1fr;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;box-shadow:0 1px 2px rgba(30,33,64,.04);}
.card h3{margin:0 0 14px;font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
.card h3 .sub{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:600;}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 17px;min-width:0;position:relative;overflow:hidden;}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--accent2);}
.kpi .val{font-size:25px;font-weight:800;margin-top:8px;letter-spacing:-.5px;}
.kpi .val small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px;}
.kpi .dt{font-size:11.5px;margin-top:5px;font-weight:600;}
.up{color:var(--ok);}.down{color:var(--bad);}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
th,td{padding:10px 11px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
th{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;background:#fafbff;}
td{font-weight:500;}
tbody tr:hover{background:#fafbff;}
.tnum{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;}
.b-ok{background:#dcfce7;color:#15803d;}
.b-warn{background:#fef3c7;color:#b45309;}
.b-bad{background:#fee2e2;color:#b91c1c;}
.b-info{background:#cffafe;color:#0e7490;}
.b-mut{background:#eef0f6;color:#555b7a;}
.chartbox{position:relative;overflow:hidden;}
.bar{height:8px;border-radius:999px;background:var(--soft);overflow:hidden;min-width:56px;display:inline-block;vertical-align:middle;}
.bar>span{display:block;height:100%;border-radius:999px;background:var(--accent);}
.lst{display:flex;flex-direction:column;gap:9px;max-height:560px;overflow:auto;padding-right:4px;}
.lrow{border:1px solid var(--line);border-radius:13px;padding:12px 13px;cursor:pointer;background:var(--panel);transition:.14s;min-width:0;}
.lrow:hover{border-color:var(--accent2);background:#fafbff;}
.lrow.on{border-color:var(--accent);background:var(--soft);box-shadow:0 4px 12px rgba(79,70,229,.12);}
.lrow .lr-top{display:flex;align-items:center;gap:8px;justify-content:space-between;}
.lrow .lr-cust{font-weight:800;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lrow .lr-meta{font-size:11.5px;color:var(--muted);margin-top:5px;display:flex;justify-content:space-between;gap:8px;}
.lrow .lr-amt{font-weight:800;font-variant-numeric:tabular-nums;}
.detail .dl{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin:2px 0 16px;}
.detail .dl .k{font-size:11.5px;color:var(--muted);font-weight:600;}
.detail .dl .v{font-size:14.5px;font-weight:800;margin-top:2px;}
.tl{position:relative;padding-left:22px;margin:0;}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl li{list-style:none;position:relative;padding:0 0 15px;}
.tl li::before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent2);}
.tl li .tt2{font-weight:700;font-size:13px;}
.tl li .tm{font-size:11.5px;color:var(--muted);margin-top:2px;}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;}
.mini{display:flex;align-items:center;gap:9px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fafbff;min-width:0;}
.mini .ic{width:36px;height:36px;border-radius:10px;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 36px;}
.mini .mtx{min-width:0;}
.mini .mtx .m1{font-size:11.5px;color:var(--muted);font-weight:600;}
.mini .mtx .m2{font-size:16px;font-weight:800;}
.aging-bars{display:flex;flex-direction:column;gap:12px;}
.ab-row{display:grid;grid-template-columns:96px 1fr 96px;align-items:center;gap:12px;min-width:0;}
.ab-row .abl{font-size:12.5px;font-weight:700;}
.ab-row .abv{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;font-size:13px;}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;min-width:0;}
.col{background:#fafbff;border:1px solid var(--line);border-radius:14px;padding:11px;min-width:0;}
.col .ch{font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;padding:0 3px;}
.col .ch .cnt{background:var(--soft);color:var(--accent);border-radius:999px;padding:1px 8px;font-size:11px;}
.tk{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:8px;cursor:pointer;transition:.14s;}
.tk:hover{border-color:var(--accent2);transform:translateY(-1px);}
.tk .tkc{font-weight:800;font-size:12.5px;}
.tk .tkm{font-size:11px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:6px;}
.audit{display:flex;flex-direction:column;gap:0;}
.arow{display:flex;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);min-width:0;}
.arow .aic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 34px;background:var(--soft);color:var(--accent);}
.arow .ax{min-width:0;flex:1;}
.arow .a1{font-weight:700;font-size:13px;}
.arow .a2{font-size:11.5px;color:var(--muted);margin-top:3px;}
.arow .at{font-size:11.5px;color:var(--muted);white-space:nowrap;font-weight:600;}
.hint{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.6;}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr);}.board{grid-template-columns:repeat(2,1fr);}}
@media(max-width:860px){
  .app{flex-direction:column;}
  .side{width:100%;flex:0 0 auto;height:auto;position:sticky;top:0;flex-direction:row;align-items:center;overflow:auto;}
  .brand{padding:12px 16px;flex:0 0 auto;}
  .brand p{display:none;}
  .nav{flex-direction:row;padding:8px;overflow:auto;flex:1;}
  .nav .navbtn{width:auto;flex:0 0 auto;padding:9px 12px;}
  .nav .navbtn .idx{display:none;}
  .side .foot{display:none;}
}
@media(max-width:820px){
  .g2,.g3,.split{grid-template-columns:1fr;}
  .board{grid-template-columns:1fr;}
}
@media(max-width:560px){
  .kpis{grid-template-columns:1fr;}
  .nav .navbtn .txt{display:none;}
  .wrap{padding:16px 14px 32px;}
  .topbar{padding:12px 14px;}
  .ab-row{grid-template-columns:72px 1fr 78px;}
  .detail .dl{grid-template-columns:1fr;}
}
</style>
</head>

function kpi(ic,lab,val,unit,dt){
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+ic+'</span>'+lab+'</div>'
    +'<div class="val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'

}

function scr0(){
  var invRows=INV.map(function(v,i){
    var stc=v.st==="草稿"?"b-mut":(v.st==="待寄送"?"b-warn":(v.st==="已確認"?"b-info":"b-ok"));
    return '<div class="lrow'+(i===0?" on":"")+'" onclick="pickInv('+i+')">'
      +'<div class="lr-top"><span class="lr-cust">'+v.cust+'</span><span class="badge '+stc+'">'+v.st+'</span></div>'
      +'<div class="lr-meta"><span>'+v.no+'</span><span class="lr-amt">'+money(v.amt)+'</span></div></div>';
  }).join("");
  return ''
   +'<div class="grid kpis" style="margin-bottom:16px">'
   +kpi("receipt_long","本月開票張數","142","張",'<span class="up">▲ 較上月 +11</span>')
   +kpi("request_quote","本月請款金額","NT$28.4M","",'<span class="up">▲ +6.2%</span>')
   +kpi("schedule","待寄送發票","7","張",'<span class="down">▼ 需今日寄出</span>')
   +kpi("draft","草稿未確認","3","張",'<span class="down">▼ 待覆核開立</span>')
   +'</div>'
   +'<div class="grid split">'
   +'<div class="card"><h3><span class="material-symbols-outlined">list_alt</span>待開立 / 請款發票<span class="sub">'+INV.length+' 筆</span></h3>'
   +'<div class="lst" id="invList">'+invRows+'</div></div>'
   +'<div class="card detail" id="invDetail"></div>'
   +'</div>';

function show(i){
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++)btns[k].classList.toggle("on",+btns[k].getAttribute("data-i")===i);
  var m=MODULES[i];
  document.getElementById("scIcon").textContent=m.icon;
  document.getElementById("scName").textContent=m.name;
  document.getElementById("scDesc").textContent=m.desc;
  Object.keys(chartReg).forEach(killChart);
  var c=document.getElementById("screen");
  c.innerHTML=RENDER[i]();
  void c.offsetHeight;
  if(i===0)pickInv(0);
  charts(i);
}
