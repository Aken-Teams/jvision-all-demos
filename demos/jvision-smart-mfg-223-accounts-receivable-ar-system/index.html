<style>
:root{
  --color-primary:#0F172A;--color-on-primary:#FFFFFF;
  --color-secondary:#1E293B;--color-on-secondary:#FFFFFF;
  --color-accent:#22C55E;--color-on-accent:#0F172A;
  --color-background:#020617;--color-foreground:#F8FAFC;
  --color-card:#0E1223;--color-card-foreground:#F8FAFC;
  --color-muted:#1A1E2F;--color-muted-foreground:#94A3B8;
  --color-border:#334155;--color-destructive:#EF4444;
  --color-on-destructive:#000000;--color-ring:#FFFFFF;
  --blue:#22C55E;--ink:#F8FAFC;--muted:#94A3B8;--line:#334155;
  --ok:#4ADE80;--warn:#FBBF24;--bad:#F87171;--info:#38BDF8;
  --panel:#0E1223;--soft:#1A1E2F;--sidebar:#070B16;
  --shadow:0 18px 48px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html{color-scheme:dark;scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:"Fira Sans",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,a,[onclick]{cursor:pointer}
button{font:inherit}
.app{display:flex;min-height:100vh;min-width:0}
.side{position:sticky;top:0;width:264px;flex:0 0 264px;height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#080d19 0%,#050812 100%);border-right:1px solid var(--line);z-index:30}
.brand{display:flex;align-items:center;gap:12px;padding:23px 19px 18px;border-bottom:1px solid rgba(51,65,85,.7)}
.logo{width:42px;height:42px;display:grid;place-items:center;border:1px solid rgba(74,222,128,.42);border-radius:11px;color:var(--ok);background:rgba(34,197,94,.1);box-shadow:0 0 22px rgba(34,197,94,.12)}
.logo svg{width:23px;height:23px}
.brand h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.04em}
.brand p{margin:3px 0 0;color:var(--muted);font:10px/1.4 "Fira Code",monospace;letter-spacing:.03em}
.nav{display:flex;flex-direction:column;gap:5px;padding:15px 11px;overflow:auto}
.navbtn{width:100%;min-width:0;display:flex;align-items:center;gap:11px;padding:11px 12px;color:#B7C3D4;background:transparent;border:1px solid transparent;border-radius:9px;text-align:left;transition:background .2s,border-color .2s,color .2s,transform .2s}
.navbtn svg{width:19px;height:19px;flex:0 0 auto}
.navbtn .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:500}

.navbtn:hover{color:#fff;background:#111827;border-color:#293548}

.navbtn.on svg,.navbtn.on .idx{color:var(--ok)}
.foot{margin-top:auto;padding:17px 20px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.7}
.main{flex:1;min-width:0}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;min-height:76px;padding:14px 26px;background:rgba(2,6,23,.88);border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}

.tt h2 svg{width:22px;height:22px;color:var(--ok);filter:drop-shadow(0 0 7px rgba(34,197,94,.34))}
.tt p{margin:4px 0 0;color:#A8B5C7;font-size:12px}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid var(--line);border-radius:7px;background:#0B1020;color:#CBD5E1;font-size:11px;font-weight:600;white-space:nowrap}
.chip svg{width:15px;height:15px;color:var(--ok)}
.wrap{padding:22px 26px 42px;min-width:0}
.grid{display:grid;gap:15px;min-width:0}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{grid-template-columns:340px minmax(0,1fr)}
.card,.kpi{min-width:0;background:linear-gradient(145deg,#101529,#0B0F1E);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow)}
.card{padding:18px}
.card h3{display:flex;align-items:center;gap:8px;margin:0 0 15px;font-size:14px;font-weight:600}
.card h3 svg{width:18px;height:18px;color:var(--ok)}
.card h3 .sub{margin-left:auto;color:var(--muted);font-size:11px;font-weight:500}
.kpi{position:relative;overflow:hidden;padding:16px 17px}

.kpi .lab{display:flex;align-items:center;gap:7px;color:#A8B5C7;font-size:11px;font-weight:600}
.kpi .lab svg{width:17px;height:17px;color:var(--ok)}

.kpi .val small{margin-left:4px;color:var(--muted);font:500 12px "Fira Sans",sans-serif}
.kpi .dt{margin-top:7px;font-size:11px;font-weight:600}
.up{color:var(--ok)}.down{color:#FCA5A5}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:12px}
th,td{padding:11px;border-bottom:1px solid #273449;white-space:nowrap}
th{color:#B8C4D5;background:#0A0F1D;font-size:10.5px;font-weight:600;letter-spacing:.055em;text-align:left}
td{color:#E2E8F0;font-weight:400}
tbody tr{transition:background .18s}
tbody tr:hover{background:rgba(30,41,59,.58)}
th:nth-child(n+2),td.tnum{text-align:right}
.tnum{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums;font-weight:600}
.mono,.lr-meta,.at{font-family:"Fira Code",monospace}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid currentColor;border-radius:999px;font-size:10.5px;font-weight:600}
.badge:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;box-shadow:0 0 7px currentColor}
.b-ok{color:#86EFAC;background:rgba(34,197,94,.1)}
.b-warn{color:#FCD34D;background:rgba(245,158,11,.1)}
.b-bad{color:#FCA5A5;background:rgba(239,68,68,.1)}
.b-info{color:#7DD3FC;background:rgba(14,165,233,.1)}
.b-mut{color:#CBD5E1;background:rgba(148,163,184,.1)}
.chartbox{position:relative;overflow:hidden}
.bar{display:inline-block;min-width:56px;height:7px;overflow:hidden;border-radius:99px;background:#263248;vertical-align:middle}
.bar>span{display:block;height:100%;border-radius:inherit;background:var(--ok);box-shadow:0 0 8px rgba(34,197,94,.25)}
.lst{display:flex;flex-direction:column;gap:8px;max-height:560px;padding-right:3px;overflow:auto}
.lrow{min-width:0;padding:12px;border:1px solid var(--line);border-radius:9px;background:#0A0F1D;transition:border-color .2s,background .2s,transform .2s}

.lr-top,.lr-meta{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lr-cust{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:600}
.lr-meta{margin-top:6px;color:#A8B5C7;font-size:10.5px}
.lr-amt{color:#F8FAFC;font-weight:600;font-variant-numeric:tabular-nums}

.tl{position:relative;margin:0;padding-left:23px}
.tl:before{position:absolute;content:"";left:6px;top:4px;bottom:5px;width:1px;background:var(--line)}
.tl li{position:relative;list-style:none;padding-bottom:15px}
.tl li:before{position:absolute;content:"";left:-21px;top:3px;width:8px;height:8px;border:2px solid var(--panel);border-radius:50%;background:var(--ok);box-shadow:0 0 0 1px var(--ok),0 0 9px rgba(34,197,94,.35)}
.tt2{font-size:12px;font-weight:600}.tm{margin-top:3px;color:#A8B5C7;font:10.5px "Fira Code",monospace}
.aging-bars{display:flex;flex-direction:column;gap:13px}
.ab-row{display:grid;grid-template-columns:96px minmax(80px,1fr) 100px;align-items:center;gap:12px}
.abl{font-size:12px;font-weight:600}.abv{text-align:right;font:600 12px "Fira Code",monospace}
.board{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:11px;min-width:820px}
.col{min-width:0;padding:10px;border:1px solid var(--line);border-radius:9px;background:#090E1B}
.ch{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 10px;font-size:11px;font-weight:600}
.cnt{padding:2px 7px;border-radius:99px;background:var(--soft);color:var(--ok);font:10px "Fira Code",monospace}
.tk{margin-bottom:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);transition:border-color .2s,transform .2s}
.tk:hover{border-color:var(--ok);transform:translateY(-1px)}
.tkc{font-size:12px;font-weight:600}.tkm{display:flex;justify-content:space-between;gap:7px;margin-top:6px;color:#B6C2D2;font:10px "Fira Code",monospace}
.audit{display:flex;flex-direction:column}
.arow{display:flex;gap:11px;min-width:0;padding:12px 3px;border-bottom:1px solid #273449}
.aic{display:grid;place-items:center;width:32px;height:32px;flex:0 0 32px;border-radius:7px;background:rgba(34,197,94,.09);color:var(--ok)}
.aic svg{width:17px;height:17px}.ax{min-width:0;flex:1}.a1{font-size:12px;font-weight:600}.a2{margin-top:4px;color:#A8B5C7;font-size:10.5px}.at{color:#A8B5C7;font-size:10px;white-space:nowrap}
.hint{margin-top:11px;color:#A8B5C7;font-size:11px;line-height:1.65}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
  .app{display:block}.side{position:sticky;width:100%;height:auto;flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--line)}
  .brand{flex:0 0 auto;padding:10px 14px;border-bottom:0}.brand p{display:none}.logo{width:36px;height:36px}
  .nav{flex:1;flex-direction:row;padding:8px;overflow:auto}.navbtn{width:auto;flex:0 0 auto;padding:9px 11px}.navbtn .idx{display:none}.foot{display:none}
  .topbar{top:57px}.split,.g2{grid-template-columns:1fr}
}
@media(max-width:560px){
  .brand h1,.navbtn .txt{display:none}.brand{padding-right:7px}.kpis{grid-template-columns:1fr}
  .wrap{padding:15px 13px 30px}.topbar{padding:11px 13px;align-items:flex-start}.topbar .chip{display:none}
  .tt h2{font-size:16px}.detail .dl{grid-template-columns:1fr}.ab-row{grid-template-columns:70px 1fr 82px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
