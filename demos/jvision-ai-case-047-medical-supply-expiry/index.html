<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>醫材效期庫存艙 · Medical Supply Expiry Ops</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--accent:#b45309;--accent2:#f59e0b;--ink:#3a2a12;--bg:#faf6ee;--card:#fff;--line:#ece1cf;--mut:#8a7a63;--ok:#15803d;--warn:#d97706;--bad:#dc2626;--red:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.shell{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
.shell>*{min-width:0}
.side{background:linear-gradient(188deg,#7c3f08,#5a2d05);color:#f5e6d0;padding:18px 14px;display:flex;flex-direction:column;gap:5px;position:sticky;top:0;height:100vh;overflow:auto}
.side .bd{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.side .lg{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent2),var(--accent));display:grid;place-items:center;font-weight:800;color:#fff;flex:none;box-shadow:0 6px 18px rgba(90,45,5,.55);font-family:"Noto Sans TC"}
.side .bd b{font-size:15px;font-weight:800;font-family:"Noto Sans TC";display:block;color:#fff}
.side .bd span{font-size:10px;color:var(--accent2);letter-spacing:1.2px}
.side button{display:flex;align-items:center;gap:11px;background:transparent;border:0;color:#f0dfc5;font:inherit;font-weight:600;font-size:13.5px;padding:11px 12px;border-radius:10px;cursor:pointer;text-align:left;width:100%;font-family:"Noto Sans TC";flex:none;white-space:nowrap}
.side button .material-symbols-outlined{font-size:20px;color:#e0b783}
.side button:hover{background:rgba(255,255,255,.07)}
.side button.on{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;font-weight:800}
.side button.on .material-symbols-outlined{color:#fff}
.side .foot{margin-top:auto;padding:12px 10px;font-size:11px;color:#d9b98d;border-top:1px solid rgba(255,255,255,.12);line-height:1.7}
.main{padding:22px 24px;min-width:0}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.live{background:#fbe6cf;color:#8a4c07;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--accent2);display:inline-block;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpis>*{min-width:0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.32}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .9fr}
.g11{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#dcfce7;color:#15803d}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-info{background:#fde8cf;color:#9a5308}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#fbf5ea}
table.data td b{font-family:"Noto Sans TC"}
.scroll{overflow-x:auto}
.rep{display:flex;flex-direction:column;gap:9px}
.ri{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:11px;padding:10px 13px;display:flex;align-items:center;gap:12px}
.ri.w{border-left-color:var(--warn)}.ri.i{border-left-color:var(--accent2)}
.ri .mid{flex:1;min-width:0}
.ri .mid b{font-size:13px;font-family:"Noto Sans TC"}
.ri .mid small{color:var(--mut);font-size:11.5px;display:block}
.ri .qty{text-align:right;flex:none}
.ri .qty b{font-family:Inter;font-size:15px}
.ri .qty small{display:block;font-size:10px;color:var(--mut)}
.chart{position:relative;height:250px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.two>*{min-width:0}
.tl{display:flex;flex-direction:column;gap:10px}
.tlr{display:grid;grid-template-columns:150px 1fr 62px;align-items:center;gap:12px}
.tlr .nm{font-size:12.5px;font-weight:700;font-family:"Noto Sans TC";white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlr .nm small{display:block;color:var(--mut);font-size:10.5px;font-weight:500}
.trk{height:16px;background:#f2e9d9;border-radius:8px;overflow:hidden;position:relative}
.trk i{display:block;height:100%;border-radius:8px}
.tlr .dd{font-size:12.5px;font-weight:800;text-align:right;font-family:Inter}
.axis{display:grid;grid-template-columns:150px 1fr 62px;gap:12px;font-size:10px;color:var(--mut);margin-top:2px}
.axis .sc{display:flex;justify-content:space-between}
.bar{height:8px;background:#f2e9d9;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:12px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.pill{display:inline-flex;align-items:center;gap:5px;background:#fbf1e2;border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:11.5px;font-weight:700;color:var(--accent)}
.binmap{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.bin{aspect-ratio:1.15;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;padding:2px;text-align:center;line-height:1.15}
.bin small{font-size:8px;opacity:.9;font-weight:600}
.dept{display:flex;flex-direction:column;gap:10px}
.dp{display:flex;align-items:center;gap:10px}
.dp .nm{width:78px;font-size:12px;font-weight:700;font-family:"Noto Sans TC";flex:none}
.dp .bar{flex:1}
.dp .vv{width:52px;text-align:right;font-size:12px;font-weight:800;font-family:Inter;flex:none}
.miniK{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.miniK>*{min-width:0}
.mk{background:#fbf5ea;border:1px solid var(--line);border-radius:13px;padding:12px 14px}
.mk .l{font-size:11.5px;color:var(--mut);font-weight:600}
.mk .v{font-size:21px;font-weight:800;font-family:Inter;margin-top:2px}
@media(max-width:860px){
 .shell{grid-template-columns:1fr}
 .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;overflow:visible}
 .side .bd{width:100%;padding-bottom:8px}.side button{width:auto}.side .foot{display:none}
}
@media(max-width:820px){
 .kpis{grid-template-columns:repeat(2,1fr)}
 .g2,.g11,.two{grid-template-columns:1fr}
 .binmap{grid-template-columns:repeat(4,1fr)}
 .tlr,.axis{grid-template-columns:110px 1fr 52px}
}
@media(max-width:480px){.miniK{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="bd"><div class="lg">效</div><div><b>醫材效期庫存艙</b><span>EXPIRY INVENTORY</span></div></div>
    <div id="nav"></div>
    <div class="foot">醫材品項 386 · 批號 1,024<br/>近效期 ≤30天 17 · 過期封存 4<br/>FEFO 遵循率 96.4%</div>
  </aside>
  <main class="main">
    <div class="vh"><div><h2 id="vt">效期總覽</h2><p id="vd"></p></div><div class="live"><i></i>FEFO 即時監控</div></div>
    <div id="view"></div>
  </main>
</div>
<script>
const MOD=[
["效期總覽","event_available","效期總覽","以 FEFO 檢視全院醫材效期分佈與關鍵指標"],
["近效期預警","notification_important","近效期預警","到期天數分級預警與待處理清單（FEFO）"],
["批號儲位","shelves","批號儲位","批號追溯、儲位定位與先到期先出上架"],
["領用消耗","medical_services","領用消耗","科別領用扣帳與批號消耗軌跡"],
["庫存盤點","inventory_2","庫存盤點","循環盤點、帳實差異與效期核對"],
["補貨管理","sync","補貨管理","安全存量、效期汰換與自動補貨"]];
const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span>'+m[0];b.onclick=()=>show(i);nav.appendChild(b);});

function ecol(d){return d<=30?'#dc2626':d<=60?'#f59e0b':d<=90?'#eab308':'#65a30d';}

const TL=[
["POC 血糖試紙","批 A2418 · 儲位 A-03",12],
["靜脈留置針 22G","批 IV0392 · 儲位 B-01",23],
["優碘棉片","批 IO7781 · 儲位 C-05",28],
["快篩試劑 Ag","批 QT2205 · 儲位 A-07",41],
["無菌手術縫線","批 SU1130 · 儲位 D-02",57],
["生理食鹽水 500ml","批 NS6640 · 儲位 E-04",74],
["拋棄式導尿管","批 FC3325 · 儲位 B-06",96],
["醫用口罩 N95","批 MK9902 · 儲位 F-01",128]];
const AXMAX=180;

const ALERT=[
["POC 血糖試紙","批 A2418",12,"A-03","12 盒","bad"],
["靜脈留置針 22G","批 IV0392",23,"B-01","340 支","bad"],
["優碘棉片","批 IO7781",28,"C-05","1,200 片","bad"],
["麻醉貼片","批 AN5540",34,"A-09","76 片","w"],
["快篩試劑 Ag","批 QT2205",41,"A-07","88 劑","w"],
["凝血試劑","批 CG1180","過期","LAB-2","封存 8 盒","x"]];

const LOTS=[
["POC 血糖試紙","A2418","A-03-2","2026/08/25",12,"12 盒","FEFO 首出","t-bad"],
["POC 血糖試紙","A2461","A-03-4","2026/11/10",89,"46 盒","備用批","t-warn"],
["靜脈留置針 22G","IV0392","B-01-1","2026/09/05",23,"340 支","FEFO 首出","t-bad"],
["快篩試劑 Ag","QT2205","A-07-3","2026/09/23",41,"88 劑","近效期","t-warn"],
["無菌手術縫線","SU1130","D-02-6","2026/10/09",57,"210 包","注意","t-warn"],
["醫用口罩 N95","MK9902","F-01-2","2026/12/19",128,"3,600 個","正常","t-ok"]];
const BINS=[
["A-01",44],["A-03",12],["A-05",140],["A-07",41],["B-01",23],["B-03",110],["B-06",96],["C-05",28],
["C-08",160],["D-02",57],["D-04",132],["E-04",74],["E-06",150],["F-01",128],["F-03",175],["LAB-2",0]];

const USE=[
["10:52","急診科","靜脈留置針 22G","IV0392","−24 支","王芷菱","已扣帳"],
["10:47","開刀房","無菌手術縫線","SU1130","−18 包","陳彥廷","已扣帳"],
["10:39","檢驗科","快篩試劑 Ag","QT2205","−12 劑","林宛蓉","已扣帳"],
["10:31","內科病房","POC 血糖試紙","A2418","−6 盒","黃庭瑋","已扣帳"],
["10:18","門診","優碘棉片","IO7781","−80 片","李思妤","已扣帳"],
["10:04","加護病房","生理食鹽水 500ml","NS6640","−30 瓶","吳孟儒","已扣帳"]];
const DEPT=[["急診科",92],["開刀房",78],["加護病房",64],["內科病房",51],["檢驗科",47],["門診",33]];

const COUNT=[
["CNT-2408","A 區 試劑櫃","82 儲位","−2 盒","效期不符 1","t-warn"],
["CNT-2407","B 區 針具","64 儲位","0","無差異","t-ok"],
["CNT-2406","C 區 敷料","96 儲位","−1 包","調查中","t-warn"],
["CNT-2405","冷藏 疫苗","28 儲位","0","無差異","t-ok"],
["CNT-2404","D 區 手術耗材","74 儲位","+1 包","已調整","t-ok"]];

const REP=[
["POC 血糖試紙","現量 12 / 安全 60","近效期汰換","+120 盒","i"],
["靜脈留置針 22G","現量 340 / 安全 800","低於安全存量","+600 支","bad"],
["優碘棉片","現量 1,200 / 安全 3,000","近效期汰換","+2,400 片","w"],
["凝血試劑","封存 8 / 安全 20","過期補貨","+24 盒","bad"],
["麻醉貼片","現量 76 / 安全 150","低於安全存量","+120 片","w"]];
const PO=[
["PO-72118","杏一醫材","POC 血糖試紙×120","2026/08/16","待核准","t-warn"],
["PO-72117","邁鑫生技","靜脈留置針×600","2026/08/15","已送出","t-ok"],
["PO-72116","康泰試劑","凝血試劑×24","2026/08/17","備貨中","t-info"],
["PO-72115","佳醫耗材","優碘棉片×2400","2026/08/18","草稿","t-warn"]];

function tlRows(){return TL.map(t=>{const d=t[2];const w=Math.max(4,Math.round((1-d/AXMAX)*100));return `<div class="tlr"><div class="nm">${t[0]}<small>${t[1]}</small></div><div class="trk"><i style="width:${w}%;background:${ecol(d)}"></i></div><div class="dd" style="color:${ecol(d)}">${d}<small style="color:var(--mut);font-weight:600">天</small></div></div>`;}).join('');}

const SCREENS=[
()=>`<div class="kpis">
 <div class="kpi"><span class="material-symbols-outlined ic">event_available</span><div class="l">近效期 ≤30 天</div><div class="v" style="color:var(--bad)">17</div><div class="d dn">▲ 較上週 +3 項</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">block</span><div class="l">已過期封存</div><div class="v" style="color:var(--bad)">4</div><div class="d" style="color:var(--mut)">待報廢核銷</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">rule</span><div class="l">FEFO 遵循率</div><div class="v">96.4<small style="font-size:12px">%</small></div><div class="d up">▲ 較 88%</div></div>
 <div class="kpi"><span class="material-symbols-outlined ic">savings</span><div class="l">效期損耗金額</div><div class="v">2.1<small style="font-size:12px"> 萬</small></div><div class="d up">▼ 較 9.4 萬</div></div>
</div>
<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">timeline</span>醫材效期時間軸（依到期天數 · 先到期先出）<span class="pill" style="margin-left:auto"><span class="material-symbols-outlined" style="font-size:15px">warning</span>紅=近效期</span></h3>
  <div class="tl">${tlRows()}</div>
  <div class="axis"><span></span><div class="sc"><span>0 天</span><span>90 天</span><span>180 天+</span></div><span></span></div>
  <div class="legend"><span><i style="background:#dc2626"></i>≤30 天 近效期</span><span><i style="background:#f59e0b"></i>31–60 天</span><span><i style="background:#eab308"></i>61–90 天</span><span><i style="background:#65a30d"></i>&gt;90 天 正常</span></div>
 </div>
 <div class="card"><h3><span class="material-symbols-outlined">donut_large</span>效期分佈</h3><div class="chart" style="height:210px"><canvas id="c_dist"></canvas></div>
  <h3 style="margin-top:14px"><span class="material-symbols-outlined">trending_down</span>效期損耗趨勢（6 週）</h3><div class="chart" style="height:150px"><canvas id="c_trend"></canvas></div>
 </div>
</div>`,
()=>`<div class="miniK">
 <div class="mk"><div class="l">≤30 天 待處理</div><div class="v" style="color:var(--bad)">17 項</div></div>
 <div class="mk"><div class="l">31–60 天 注意</div><div class="v" style="color:var(--warn)">24 項</div></div>
 <div class="mk"><div class="l">已過期封存</div><div class="v" style="color:var(--bad)">4 項</div></div>
</div>
<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">notification_important</span>近效期預警清單（FEFO 優先序）<span class="tag t-bad" style="margin-left:auto">須優先處理</span></h3>
  <div class="rep">${ALERT.map(a=>`<div class="ri ${a[5]=='w'?'w':a[5]=='x'?'':'i'}" ${a[5]=='x'?'style="border-left-color:var(--bad);background:#fef6f6"':''}><div class="mid"><b>${a[0]} · ${a[1]}</b><small>儲位 ${a[3]} · ${a[4]}</small></div><div class="qty"><b style="color:${a[5]=='x'?'var(--bad)':a[2]<=30?'var(--bad)':'var(--warn)'}">${a[2]==='過期'?'已過期':a[2]+' 天'}</b><small>${a[2]==='過期'?'封存':'到期倒數'}</small></div></div>`).join('')}</div>
 </div>
 <div class="card"><h3><span class="material-symbols-outlined">stacked_bar_chart</span>到期天數分級</h3><div class="chart" style="height:230px"><canvas id="c_grade"></canvas></div>
  <p style="font-size:11.5px;color:var(--mut);margin:12px 0 0">系統依 FEFO 每日重算到期天數，≤30 天自動推播護理長與櫃檯人員。</p>
 </div>
</div>`,
()=>`<div class="grid g2">
 <div class="card"><h3><span class="material-symbols-outlined">qr_code_2</span>批號追溯與儲位定位（同品項多批依 FEFO 排序）</h3><div class="scroll"><table class="data"><tr><th>品項</th><th>批號</th><th>儲位</th><th>到期日</th><th>倒數</th><th>庫存</th><th>狀態</th></tr>${LOTS.map(l=>`<tr><td><b>${l[0]}</b></td><td><code style="background:#fbf1e2;padding:1px 6px;border-radius:4px;color:var(--accent);font-weight:700">${l[1]}</code></td><td>${l[2]}</td><td>${l[3]}</td><td style="font-weight:800;color:${ecol(l[4])}">${l[4]} 天</td><td>${l[5]}</td><td><span class="tag ${l[7]}">${l[6]}</span></td></tr>`).join('')}</table></div></div>
 <div class="card"><h3><span class="material-symbols-outlined">shelves</span>儲位效期熱區</h3><div class="binmap" id="binmap"></div>
  <div class="legend"><span><i style="background:#dc2626"></i>近效期</span><span><i style="background:#f59e0b"></i>注意</span><span><i style="background:#65a30d"></i>正常</span><span><i style="background:#a8a29e"></i>封存</span></div>
  <p style="font-size:11.5px;color:var(--mut);margin:10px 0 0">格內上為儲位、下為最早到期批號倒數；紅色須優先揀取汰換。</p>

let charts={};
function destroyCharts(){Object.values(charts).forEach(c=>{try{c.destroy();}catch(e){}});charts={};}
const FONT="Inter, 'Noto Sans TC', sans-serif";
function binFill(){const el=document.getElementById('binmap');if(!el)return;el.innerHTML=BINS.map(b=>{const seal=b[1]===0;const c=seal?'#a8a29e':ecol(b[1]);return `<div class="bin" style="background:${c}"><b>${b[0]}</b><small>${seal?'封存':b[1]+'天'}</small></div>`;}).join('');}
function draw(i){
 destroyCharts();
 if(i==0){
  charts.dist=new Chart(document.getElementById('c_dist'),{type:'doughnut',data:{labels:['≤30 天','31–60 天','61–90 天','>90 天'],datasets:[{data:[17,24,39,306],backgroundColor:['#dc2626','#f59e0b','#eab308','#65a30d'],borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{font:{family:FONT,size:11},boxWidth:12}}}}});
  charts.trend=new Chart(document.getElementById('c_trend'),{type:'line',data:{labels:['第1週','第2週','第3週','第4週','第5週','第6週'],datasets:[{label:'損耗金額(萬)',data:[9.4,7.1,5.6,4.2,3.0,2.1],borderColor:'#b45309',backgroundColor:'rgba(180,83,9,.12)',fill:true,tension:.35,pointRadius:3,pointBackgroundColor:'#b45309'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{font:{family:FONT,size:10}}},x:{ticks:{font:{family:FONT,size:10}}}}}});
 }
 if(i==1){
  charts.grade=new Chart(document.getElementById('c_grade'),{type:'bar',data:{labels:['≤30 天','31–60 天','61–90 天','>90 天'],datasets:[{label:'品項數',data:[17,24,39,306],backgroundColor:['#dc2626','#f59e0b','#eab308','#65a30d'],borderRadius:6}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{font:{family:FONT,size:10}}},y:{ticks:{font:{family:FONT,size:11}}}}}});
 }
 if(i==2){binFill();}
 if(i==3){
  charts.use=new Chart(document.getElementById('c_use'),{type:'line',data:{labels:['週一','週二','週三','週四','週五','週六','週日'],datasets:[{label:'領用件數',data:[420,388,510,462,548,320,290],borderColor:'#b45309',backgroundColor:'rgba(245,158,11,.15)',fill:true,tension:.35,pointRadius:3,pointBackgroundColor:'#f59e0b'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{font:{family:FONT,size:10}}},x:{ticks:{font:{family:FONT,size:10}}}}}});
 }
 if(i==4){
  charts.count=new Chart(document.getElementById('c_count'),{type:'doughnut',data:{labels:['無差異','盤盈','盤虧','效期不符'],datasets:[{data:[318,9,14,3],backgroundColor:['#65a30d','#f59e0b','#dc2626','#b45309'],borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,cutout:'58%',plugins:{legend:{position:'bottom',labels:{font:{family:FONT,size:11},boxWidth:12}}}}});
 }
 if(i==5){
  charts.safe=new Chart(document.getElementById('c_safe'),{type:'bar',data:{labels:['血糖試紙','留置針','優碘棉片','凝血試劑','麻醉貼片'],datasets:[{label:'達成率 %',data:[20,42,40,15,51],backgroundColor:['#dc2626','#f59e0b','#f59e0b','#dc2626','#f59e0b'],borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,max:100,ticks:{font:{family:FONT,size:10}}},x:{ticks:{font:{family:FONT,size:10}}}}}});
 }
}
function show(i){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));vt.textContent=MOD[i][2];vd.textContent=MOD[i][3];view.innerHTML=SCREENS[i]();draw(i);}
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
</body>
</html>
