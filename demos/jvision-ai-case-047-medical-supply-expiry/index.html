<div class="rep">${ALERT.map(a=>`<div class="ri ${a[5]=="w"?"w":a[5]=="bad"?"":"i"}"><div class="mid"><b>${a[0]} · <span class="mono">${a[1]}</span></b><small>儲位 ${a[3]} · ${a[4]}</small></div><div class="qty"><b style="color:${a[5]=="x"?"var(--bad)":a[2]<=30?"var(--bad)":"var(--warn)"}">${a[2]==="過期"?"已過期":a[2]+" 天"}</b><small>${a[2]==="過期"?"封存":"到期倒數"}</small></div></div>`).join("")}</div></section>
<section class="card">${head("stacked_bar_chart","到期天數分級")}<div class="chart" style="height:230px"><canvas id="c_grade"></canvas></div><p class="note">系統依 FEFO 每日重算到期天數，≤30 天自動推播護理長與櫃檯人員。</p></section></div>`,
()=>`<div class="grid g2"><section class="card">${head("qr_code_2","批號追溯與儲位定位（同品項多批依 FEFO 排序）")}<div class="scroll"><table class="data"><tr><th>品項</th><th>批號</th><th>儲位</th><th>到期日</th><th>倒數</th><th>庫存</th><th>狀態</th></tr>${LOTS.map(l=>`<tr><td><b>${l[0]}</b></td><td><code class="lot">${l[1]}</code></td><td class="mono">${l[2]}</td><td class="mono">${l[3]}</td><td style="font-weight:700;color:${ecol(l[4])}">${l[4]} 天</td><td>${l[5]}</td><td><span class="tag ${l[7]}">${l[6]}</span></td></tr>`).join("")}</table></div></section>
<section class="card">${head("shelves","儲位效期熱區")}<div class="binmap" id="binmap"></div><div class="legend"><span><i style="background:#B91C1C"></i>近效期</span><span><i style="background:#A16207"></i>注意</span><span><i style="background:#047857"></i>正常</span><span><i style="background:#64748B"></i>封存</span></div><p class="note">格內上為儲位、下為最早到期批號倒數；標示「近效期」須優先揀取汰換。</p></section></div>`,
()=>`<div class="grid g2"><section class="card">${head("medical_services","科別領用扣帳軌跡（掃批號自動扣庫）")}<div class="scroll"><table class="data"><tr><th>時間</th><th>科別</th><th>品項</th><th>批號</th><th>異動</th><th>領用人</th><th>狀態</th></tr>${USE.map(u=>`<tr><td class="mono">${u[0]}</td><td><b>${u[1]}</b></td><td>${u[2]}</td><td><code class="lot">${u[3]}</code></td><td style="color:var(--bad);font-weight:700">${u[4]}</td><td>${u[5]}</td><td><span class="tag t-ok">${icon("check_circle")}${u[6]}</span></td></tr>`).join("")}</table></div></section>
<section class="card">${head("bar_chart","各科別今日領用量")}<div class="dept">${DEPT.map(d=>`<div class="dp"><div class="nm">${d[0]}</div><div class="bar" aria-label="${d[0]}領用量 ${d[1]}"><i style="width:${d[1]}%"></i></div><div class="vv">${d[1]}</div></div>`).join("")}</div>${head("insights","近 7 日消耗趨勢")}<div class="chart" style="height:150px"><canvas id="c_use"></canvas></div></section></div>`,
()=>`<div class="grid g2"><section class="card">${head("inventory_2","循環盤點任務（含效期核對）",`<span class="tag t-warn" style="margin-left:auto">${icon("search")}待調查 2</span>`)}<div class="scroll"><table class="data"><tr><th>單號</th><th>範圍</th><th>儲位數</th><th>帳實差異</th><th>結果</th></tr>${COUNT.map(c=>`<tr><td><b class="mono">${c[0]}</b></td><td>${c[1]}</td><td>${c[2]}</td><td style="font-weight:700;color:${c[3]==="0"?"var(--ok)":"var(--bad)"}">${c[3]}</td><td><span class="tag ${c[5]}">${c[4]}</span></td></tr>`).join("")}</table></div><div class="legend"><span>${icon("fact_check")}本輪 344 儲位 · 差異率 1.2% · 效期不符 1</span></div></section>
<section class="card">${head("pie_chart","盤點差異分佈")}<div class="chart"><canvas id="c_count"></canvas></div></section></div>`,
()=>`<div class="grid g2"><section class="card">${head("production_quantity_limits","補貨建議（安全存量 + 近效期汰換）")}<div class="rep">${REP.map(r=>`<div class="ri ${r[4]=="w"?"w":r[4]=="i"?"i":""}"><div class="mid"><b>${r[0]}</b><small>${r[1]} · ${r[2]}</small></div><div class="qty"><b style="color:var(--color-primary)">${r[3]}</b><small>建議補量</small></div></div>`).join("")}</div></section>
<section class="card">${head("local_shipping","採購單狀態")}<div class="scroll"><table class="data"><tr><th>單號</th><th>供應商</th><th>品項</th><th>預計到貨</th><th>狀態</th></tr>${PO.map(p=>`<tr><td><b class="mono">${p[0]}</b></td><td>${p[1]}</td><td>${p[2]}</td><td class="mono">${p[3]}</td><td><span class="tag ${p[5]}">${p[4]}</span></td></tr>`).join("")}</table></div>${head("bar_chart","安全存量達成率")}<div class="chart" style="height:150px"><canvas id="c_safe"></canvas></div></section></div>`
];
let charts={};
const FONT="'Atkinson Hyperlegible','Noto Sans TC',sans-serif";
const COLORS=["#B91C1C","#A16207","#0E7490","#047857"];
function destroyCharts(){Object.values(charts).forEach(c=>{try{c.destroy()}catch(e){}});charts={}}
function opts(horizontal=false){return{indexAxis:horizontal?"y":"x",responsive:true,maintainAspectRatio:false,animation:matchMedia("(prefers-reduced-motion: reduce)").matches?false:{duration:350},plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,grid:{color:"#D9EEF1"},ticks:{color:"#475569",font:{family:FONT,size:10}}},y:{beginAtZero:true,grid:{color:"#D9EEF1"},ticks:{color:"#475569",font:{family:FONT,size:10}}}}}}
function binFill(){const el=document.getElementById("binmap");if(!el)return;el.innerHTML=BINS.map(b=>{const seal=b[1]===0,c=seal?"#64748B":ecol(b[1]),status=seal?"封存":b[1]<=30?"近效期":b[1]<=60?"注意":"正常";return `<div class="bin" style="background:${c}" title="${b[0]}：${status}"><b class="mono">${b[0]}</b><small>${seal?"封存":b[1]+"天 · "+status}</small></div>`}).join("")}
function draw(i){
 destroyCharts();
 if(i===0){
  charts.dist=new Chart(document.getElementById("c_dist"),{type:"doughnut",data:{labels:["≤30 天 近效期","31–60 天 注意","61–90 天 留意",">90 天 正常"],datasets:[{data:[17,24,39,306],backgroundColor:COLORS,borderWidth:3,borderColor:"#fff"}]},options:{responsive:true,maintainAspectRatio:false,cutout:"62%",animation:matchMedia("(prefers-reduced-motion: reduce)").matches?false:{duration:350},plugins:{legend:{position:"bottom",labels:{color:"#475569",font:{family:FONT,size:11},boxWidth:12}}}}});
  charts.trend=new Chart(document.getElementById("c_trend"),{type:"line",data:{labels:["第1週","第2週","第3週","第4週","第5週","第6週"],datasets:[{label:"損耗金額(萬)",data:[9.4,7.1,5.6,4.2,3,2.1],borderColor:"#0891B2",backgroundColor:"rgba(8,145,178,.12)",fill:true,tension:.25,pointRadius:3,pointBackgroundColor:"#0891B2"}]},options:opts()});
 }
 if(i===1)charts.grade=new Chart(document.getElementById("c_grade"),{type:"bar",data:{labels:["≤30 天 近效期","31–60 天 注意","61–90 天 留意",">90 天 正常"],datasets:[{label:"品項數",data:[17,24,39,306],backgroundColor:COLORS,borderRadius:7}]},options:opts(true)});
 if(i===2)binFill();
 if(i===3)charts.use=new Chart(document.getElementById("c_use"),{type:"line",data:{labels:["週一","週二","週三","週四","週五","週六","週日"],datasets:[{label:"領用件數",data:[420,388,510,462,548,320,290],borderColor:"#0891B2",backgroundColor:"rgba(34,211,238,.14)",fill:true,tension:.25,pointRadius:3,pointBackgroundColor:"#0891B2"}]},options:opts()});
 if(i===4)charts.count=new Chart(document.getElementById("c_count"),{type:"doughnut",data:{labels:["無差異","盤盈","盤虧","效期不符"],datasets:[{data:[318,9,14,3],backgroundColor:["#047857","#0E7490","#B91C1C","#A16207"],borderWidth:3,borderColor:"#fff"}]},options:{responsive:true,maintainAspectRatio:false,cutout:"58%",animation:matchMedia("(prefers-reduced-motion: reduce)").matches?false:{duration:350},plugins:{legend:{position:"bottom",labels:{color:"#475569",font:{family:FONT,size:11},boxWidth:12}}}}});
 if(i===5)charts.safe=new Chart(document.getElementById("c_safe"),{type:"bar",data:{labels:["血糖試紙","留置針","優碘棉片","凝血試劑","麻醉貼片"],datasets:[{label:"達成率 %",data:[20,42,40,15,51],backgroundColor:["#B91C1C","#A16207","#A16207","#B91C1C","#0E7490"],borderRadius:7}]},options:{...opts(),scales:{...opts().scales,y:{...opts().scales.y,max:100}}}});
}
function show(i){
 nav.querySelectorAll("button").forEach(b=>{const on=+b.dataset.i===i;b.classList.toggle("on",on);b.setAttribute("aria-current",on?"page":"false")});
 vt.textContent=MOD[i][2];vd.textContent=MOD[i][3];view.innerHTML=`<div class="reveal">${SCREENS[i]()}</div>`;draw(i)
}
function fromHash(){const m=(location.hash||"").match(/(?:go=|v)([0-9]+)/),i=m?Math.min(+m[1],5):0;show(i);try{scrollTo(0,0)}catch(e){}}
addEventListener("hashchange",fromHash);
fromHash();
</script>
</body>
</html>
