<style>
:root{
 --color-primary:#059669;--color-on-primary:#000;--color-secondary:#10B981;--color-on-secondary:#0F172A;
 --color-accent:#EA580C;--color-on-accent:#000;--color-background:#ECFDF5;--color-foreground:#064E3B;
 --color-card:#FFF;--color-card-foreground:#064E3B;--color-muted:#E8F1F3;--color-muted-foreground:#475569;
 --color-border:#A7F3D0;--color-destructive:#DC2626;--color-on-destructive:#FFF;--color-ring:#059669;
 --blue:#1D4ED8;--ink:#064E3B;--muted:#475569;--line:#A7F3D0;
 --amber:#A64B00;--violet:#6D28D9;--green:#047857;--red:#B91C1C;
 --shadow:0 1px 2px rgba(6,78,59,.08),0 8px 24px rgba(6,78,59,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:#243F39;font-family:"Nunito Sans","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit}
button,[role=button]{cursor:pointer}
button:focus-visible,[role=button]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.icon{width:19px;height:19px;display:inline-block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 4px 18px rgba(6,78,59,.06)}
.navin{max-width:1500px;margin:auto;min-height:72px;padding:10px 22px;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:11px;white-space:nowrap}
.logo{width:42px;height:42px;display:grid;place-items:center;background:var(--color-primary);color:#fff;border-radius:8px}
.brand b{display:block;font:700 16px Rubik,sans-serif;color:var(--ink)}
.brand small{display:block;color:var(--muted);font-size:11px}
.tabs{display:flex;gap:2px;flex:1;overflow:auto;scrollbar-width:none}
.tabs button{border:0;border-bottom:3px solid transparent;background:#fff;color:var(--muted);padding:12px 11px 9px;display:flex;gap:6px;align-items:center;white-space:nowrap;font-weight:700;font-size:13px;transition:.2s}
.tabs button:hover{background:#F0FDF4;color:var(--ink)}
.tabs button.on{border-color:var(--color-primary);color:var(--color-primary)}
.navr{display:flex;align-items:center;gap:8px;white-space:nowrap}
.status{display:flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid var(--line);font-size:11px;font-weight:700}
.dot{width:8px;height:8px;background:var(--color-primary);border-radius:50%;box-shadow:0 0 0 3px #D1FAE5}
.avatar{width:34px;height:34px;display:grid;place-items:center;background:var(--ink);color:#fff;border-radius:50%;font-weight:700}
.wrap{max-width:1500px;margin:auto;padding:24px 22px 48px}
.head{display:flex;align-items:end;gap:16px;margin-bottom:18px}
.head h1{margin:0;font:700 25px Rubik,sans-serif;letter-spacing:-.02em;color:var(--ink)}
.head p{margin:3px 0 0;color:var(--muted);font-size:13px}
.actions{margin-left:auto;display:flex;gap:8px}
.btn{min-height:40px;border:1px solid var(--color-primary);border-radius:7px;padding:0 14px;background:var(--color-primary);color:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.22s}
.btn:hover{background:#047857;transform:translateY(-1px);box-shadow:0 6px 14px rgba(5,150,105,.18)}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:#F0FDF4;border-color:var(--color-primary)}
.card,.column,.ticket{background:var(--color-card);border:1px solid var(--line);box-shadow:var(--shadow)}
.card{padding:18px;border-radius:10px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1.45fr 1fr}
.sec{margin:0 0 14px;color:var(--ink);font:700 15px Rubik,sans-serif;display:flex;align-items:center;gap:7px}
.sec small{margin-left:auto;color:var(--muted);font:600 11px "Nunito Sans",sans-serif}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:8px;padding:15px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--color-primary)}
.klabel{color:var(--muted);font-size:12px;font-weight:700}.kvalue{font:700 27px Rubik,sans-serif;color:var(--ink);margin:5px 0 1px;font-variant-numeric:tabular-nums}.delta{font-size:11px;font-weight:700;color:var(--green)}.delta.risk{color:var(--red)}
.boardwrap,.tablewrap{overflow:auto}.board{min-width:1120px;display:grid;grid-template-columns:repeat(5,1fr);gap:11px}
.column{border-radius:8px;padding:11px;background:#F8FFFC}
.colhead{padding:2px 2px 10px;border-bottom:2px solid var(--line);display:flex;align-items:center;gap:6px;color:var(--ink);font-weight:700;font-size:13px}
.count{margin-left:auto;min-width:24px;padding:1px 7px;text-align:center;background:var(--ink);color:#fff;border-radius:20px;font:700 11px Rubik,sans-serif}
.job{margin-top:9px;padding:10px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--color-primary);border-radius:6px;transition:.22s}
.job:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.job.rush{border-left-color:var(--red);background:#FFF8F7}
.jobtop,.jobfoot,.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.code,.mono,time,td:first-child{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums}
.code{font-size:12px;font-weight:700;color:var(--ink)}
.badge,.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700}
.badge{background:#D1FAE5;color:#065F46}.badge.risk{background:#FEE2E2;color:#991B1B}.badge.warn{background:#FFEDD5;color:#9A3412}.badge.info{background:#DBEAFE;color:#1E40AF}
.person{margin:6px 0;color:#334E48;font-size:12px;font-weight:700}.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{background:var(--color-muted);color:#334E48;border-radius:4px;padding:2px 6px;font-size:10px;font-weight:700}
.jobfoot{margin-top:8px;padding-top:7px;border-top:1px dashed var(--line);font-size:10px;color:var(--muted)}
.list{display:grid;gap:8px}.listrow{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:7px;background:#fff}
.initial{width:35px;height:35px;display:grid;place-items:center;background:#D1FAE5;color:var(--ink);border-radius:6px;font-weight:700}
.info{flex:1;min-width:0}.info b{display:block;color:var(--ink);font-size:12px}.info small{display:block;color:var(--muted);font-size:10px}
.pos{display:grid;grid-template-columns:165px 1fr 330px;gap:14px;align-items:start}
.categories{display:grid;gap:7px}.categories button{padding:11px;text-align:left;border:1px solid var(--line);border-radius:6px;background:#fff;color:#334E48;font-weight:700}
.categories button:hover,.categories button.on{background:var(--color-primary);border-color:var(--color-primary);color:#fff}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px}
.product{border:1px solid var(--line);border-radius:7px;background:#fff;overflow:hidden;transition:.22s}
.product:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--color-primary)}
.product .pic{height:60px;display:grid;place-items:center;background:#D1FAE5;color:var(--color-primary)}
.product .meta{padding:9px}.product b{display:block;color:var(--ink);font-size:13px}.price{color:var(--color-primary);font-weight:700;font-variant-numeric:tabular-nums}.price small{color:var(--muted)}
.ticket{position:sticky;top:88px;border-radius:8px;padding:15px}.lineitem{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line)}
.lineicon{width:32px;height:32px;display:grid;place-items:center;background:#D1FAE5;color:var(--color-primary);border-radius:5px}.qty{display:flex;align-items:center;gap:6px}.qbtn{width:25px;height:25px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:4px}
.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{padding:4px 8px;border:1px solid var(--line);background:#fff;color:#334E48;border-radius:20px;font-size:10px}.chip.on{background:#FFEDD5;border-color:#FDBA74;color:#9A3412}
.total{font:700 20px Rubik,sans-serif;color:var(--ink);border-top:1px solid var(--line);margin-top:8px;padding-top:9px}.block{width:100%;margin-top:9px}
.racks{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}.rack{text-align:center;padding:11px 5px;border:2px solid var(--line);background:#fff;border-radius:6px}.rack.over{border-color:#FCA5A5;background:#FFF7F7}.rack.empty{border-style:dashed;background:#F1F5F4}.rack b{display:block;color:var(--ink)}
.member{padding:22px;border-radius:10px;background:linear-gradient(135deg,#064E3B,#059669);color:#fff;box-shadow:var(--shadow)}.member h2{margin:5px 0;font:700 24px Rubik,sans-serif}.member .balances{display:flex;gap:30px;margin-top:17px}.balances small{display:block;color:#D1FAE5}.balances b{font:700 22px Rubik,sans-serif;font-variant-numeric:tabular-nums}
.history{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.history .amount{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}.positive{color:var(--green)}.negative{color:var(--red)}
.options{display:grid;grid-template-columns:1fr 1fr;gap:9px}.option{padding:13px;text-align:center;border:2px solid var(--line);border-radius:7px;background:#fff}.option.selected{border-color:var(--color-primary);background:#F0FDF4}.option b{font:700 19px Rubik,sans-serif;color:var(--ink)}
.chart{height:290px}.rank{display:flex;align-items:center;gap:10px;padding:7px 0}.rankno{width:25px;height:25px;display:grid;place-items:center;background:#D1FAE5;color:var(--ink);font-weight:700;border-radius:4px}.rankname{width:110px;color:var(--ink);font-weight:700}.bar{height:8px;flex:1;background:#DCEAE5}.bar span{display:block;height:100%;background:var(--color-primary)}.rankval{width:65px;text-align:right;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
table{width:100%;min-width:540px;border-collapse:collapse;font-size:12px}th{padding:9px 10px;text-align:left;background:#F0FDF4;color:#334E48;border-bottom:2px solid var(--color-primary);font-weight:700}td{padding:10px;border-bottom:1px solid var(--line)}tbody tr:hover{background:#F0FDF4}td:nth-child(3),td:nth-child(4){text-align:right;font-variant-numeric:tabular-nums}
@keyframes enter{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.grid-item,.kpi,.job,.listrow,.product,.rack{animation:enter .4s backwards}.grid-item:nth-child(2n),.job:nth-child(2n),.product:nth-child(2n){animation-delay:.06s}
@media(max-width:1100px){.g2,.pos{grid-template-columns:1fr}.ticket{position:static}.categories{display:flex;overflow:auto}.categories button{white-space:nowrap}.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.navin{flex-wrap:wrap;gap:8px}.brand{flex:1}.tabs{order:3;width:100%}.navr .status:first-child{display:none}.wrap{padding:18px 14px 40px}.head{align-items:flex-start;flex-direction:column}.actions{margin:0;width:100%}.actions .btn{flex:1}.g2{grid-template-columns:1fr}}
@media(max-width:480px){.brand small,.navr .status{display:none}.tabs button{padding-inline:9px}.tabs button span{display:none}.kpis{grid-template-columns:1fr 1fr}.kvalue{font-size:22px}.card{padding:13px}.options{grid-template-columns:1fr}.member .balances{gap:14px;flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important;transform:none!important}}
</style>
</head>

<script>

const TABS=[

const kpis=()=>`<div class="kpis">${KPI.map(x=>`<div class="kpi grid-item"><div class="klabel">${x[0]}</div><div class="kvalue">${x[1]}</div><div class="delta ${x[3]}">${x[3]?"風險 · ":"趨勢 · "}${x[2]}</div></div>`).join("")}</div>`;
const board=()=>`<div class="boardwrap"><div class="board">${JOBS.map(c=>`<section class="column"><div class="colhead">${I(c[1])}${c[0]}<span class="count">${c[2].length}</span></div>${c[2].map(j=>`<article class="job ${j[5]?"rush":""}"><div class="jobtop"><span class="code">${j[0]}</span>${j[5]?'<span class="badge risk">! 急件</span>':""}</div><div class="person">${j[1]}</div><div class="tags"><span class="tag">${j[2]}</span><span class="tag">${j[3]}</span></div><div class="jobfoot"><span>明細已建檔</span><time>${j[4]}</time></div></article>`).join("")}</section>`).join("")}</div></div>`;
const notify=(all=true)=>`<div class="list">${NOTIFY.slice(0,all?6:4).map(n=>`<div class="listrow grid-item"><span class="initial">${n[0][0]}</span><div class="info"><b>${n[0]} · <span class="code">${n[2]}</span></b><small>${n[3]} · ${all?n[1]+" · ":""}${n[5]}</small></div><span class="badge ${n[6]}">${n[6]==="risk"?"! ":""}${n[4]}</span></div>`).join("")}</div>`;
const screens=[
()=>kpis()+`<div class="grid g2"><section class="card"><h2 class="sec">${I("laundry")}處理進度看板 · 即時<small>收件 3 · 清洗 3 · 整燙 2 · 待取 3</small></h2>${board()}</section><section class="card"><h2 class="sec">${I("bell")}今日取件通知</h2>${notify(false)}<h2 class="sec" style="margin-top:16px">${I("bell")}逾期未取關注</h2><div class="listrow"><span class="initial">許</span><div class="info"><b>#L-3076 · 禮服×1</b><small>待取逾 3 天 · 已發 2 次通知</small></div><span class="badge risk">! 催取</span></div></section></div>`,
()=>{let sub=ORDER.reduce((s,x)=>s+x[1]*x[2],0),cnt=ORDER.reduce((s,x)=>s+x[2],0);return `<div class="pos"><div class="categories">${CATS.map((x,i)=>`<button data-cat="${i}" class="${i===cat?"on":""}">${x}</button>`).join("")}</div><div class="products">${PRODUCTS[cat].map(x=>`<article class="product grid-item" role="button" tabindex="0"><div class="pic">${I("shirt")}</div><div class="meta"><b>${x[0]}</b><span class="price">${money(x[1])} <small>${x[2]}</small></span></div></article>`).join("")}</div><aside class="ticket"><h2 class="sec">收件單 <span class="code">#L-3095</span><small>王小姐 · 會員</small></h2>${ORDER.map(x=>`<div class="lineitem"><span class="lineicon">${I("shirt")}</span><div class="info"><b>${x[0]}</b><small>${x[3]||money(x[1])}</small></div><div class="qty"><button class="qbtn">−</button><b>${x[2]}</b><button class="qbtn">＋</button></div></div>`).join("")}<p class="klabel">污漬 / 破損註記</p><div class="chips">${["領口油漬","袖口汙","咖啡漬","墨水","泛黃","下擺破損"].map((x,i)=>`<button class="chip ${i<2?"on":""}">${x}</button>`).join("")}</div><div class="row" style="margin-top:12px"><span>衣物件數</span><span>${cnt} 件</span></div><div class="row"><span>預估取件</span><time>3/28 18:00</time></div><div class="row total"><span>合計</span><span>${money(sub)}</span></div><button class="btn block">${I("print")}開單並列印吊牌 · ${cnt} 件</button><button class="btn ghost block">${I("scan")}拍照註記衣物狀態</button></aside></div>`},
()=>board()+`<section class="card" style="margin-top:16px"><h2 class="sec">${I("chart")}看板說明<small>掃描吊牌即可推進，急件以文字與驚嘆號、逾期以到期日提醒</small></h2><div class="tags"><span class="tag">收件 · 完成開單清點的新單</span><span class="tag">清洗中 · 依材質水洗 / 乾洗處理</span><span class="tag">整燙 · 整燙套袋並上架定位</span><span class="tag">待取 · 已通知會員，等待取件</span><span class="tag">已取 · 結清並歸檔</span></div></section>`,
()=>`<div class="grid g2"><section class="card"><h2 class="sec">${I("bell")}取件通知清單<small>6 筆 · 逾期 2</small></h2>${notify()}</section><section class="card"><h2 class="sec">${I("chart")}通知設定與統計</h2><div class="kpis" style="grid-template-columns:repeat(3,1fr)">${[["18","今日簡訊"],["31","LINE 推播"],["3","逾期未取"]].map(x=>`<div class="kpi"><div class="kvalue">${x[0]}</div><div class="klabel">${x[1]}</div></div>`).join("")}</div>${[["完成即時通知","衣物進入待取自動發送","啟用"],["逾 7 天二次通知","每 3 天再次提醒","啟用"],["逾 14 天保管清單","轉列逾期保管並停止自動通知","2 筆"]].map(x=>`<div class="history">${I("bell")}<div class="info"><b>${x[0]}</b><small>${x[1]}</small></div><span class="badge ${x[2]==="2 筆"?"warn":""}">${x[2]}</span></div>`).join("")}<h2 class="sec" style="margin-top:16px">待取衣物架位一覽</h2><div class="racks">${RACKS.map(r=>`<div class="rack ${r[2]} grid-item">${I(r[2]==="empty"?"plus":"shirt")}<b class="code">${r[0]}</b><small>${r[2]==="empty"?"—":r[1]+" 件"}</small><span class="badge ${r[2]==="over"?"risk":""}">${r[2]==="over"?"! ":""}${r[3]}</span></div>`).join("")}</div></section></div>`,
()=>`<div class="grid g2"><div><section class="member"><small>白金會員 · PLATINUM</small><h2>王雅琪</h2><div class="code">會員卡號 8801-2345-6789</div><div class="balances"><div><small>儲值餘額</small><b>$4,280</b></div><div><small>回饋點數</small><b>2,150</b></div><div><small>本月件數</small><b>16 件</b></div></div></section><section class="card" style="margin-top:16px"><h2 class="sec">${I("card")}消費 / 儲值紀錄</h2>${[["收件開單 #L-3092","襯衫×3 西褲×2","-360","negative"],["儲值加值","現金儲值 · 贈 300 點","+3,000","positive"],["取件結清 #L-3040","大衣×1 圍巾×1","-350","negative"],["點數折抵","折抵 200 點","-200","negative"],["收件開單 #L-3011","床單×2 被套×1","-420","negative"]].map(x=>`<div class="history">${I("card")}<div class="info"><b>${x[0]}</b><small>${x[1]}</small></div><span class="amount ${x[3]}">${x[2]}</span></div>`).join("")}</section></div><section class="card"><h2 class="sec">${I("card")}快速儲值</h2><div class="options">${[[1000,"贈 50 點"],[3000,"贈 300 點"],[5000,"贈 600 點"],[10000,"贈 1500 點"]].map((x,i)=>`<button class="option ${i===1?"selected":""}"><b>${money(x[0])}</b><small>${x[1]}</small></button>`).join("")}</div><button class="btn block">${I("card")}確認儲值 $3,000</button><h2 class="sec" style="margin-top:20px">會員權益</h2>${[["洗衣 88 折","白金會員全品項優惠","生效中"],["免費到府收送","單次滿 $500 適用","可用"],["生日雙倍點數","3 月生日禮","本月"]].map(x=>`<div class="history">${I("card")}<div class="info"><b>${x[0]}</b><small>${x[1]}</small></div><span class="badge">${x[2]}</span></div>`).join("")}</section></div>`,
()=>kpis()+`<div class="grid g2"><section class="card"><h2 class="sec">${I("chart")}近 7 日收件量與營收</h2><div id="rev" class="chart"></div></section><section class="card"><h2 class="sec">${I("chart")}洗衣服務類型佔比</h2><div id="pie" class="chart"></div></section></div><div class="grid g2" style="margin-top:16px"><section class="card"><h2 class="sec">${I("chart")}熱門品項排行</h2>${[["襯衫",286],["西褲",214],["西裝外套",168],["洋裝",142],["大衣",96],["床單",84]].map((x,i)=>`<div class="rank"><span class="rankno">${i+1}</span><span class="rankname">${x[0]}</span><div class="bar"><span style="width:${x[1]/286*100}%"></span></div><span class="rankval">${x[1]} 件</span></div>`).join("")}</section><section class="card"><h2 class="sec">${I("chart")}今日收件明細</h2><div class="tablewrap"><table><thead><tr><th>單號</th><th>會員</th><th>件數</th><th>金額</th><th>取件日</th><th>狀態</th></tr></thead><tbody>${[["#L-3092","王小姐","5","$360","3/28","收件","info"],["#L-3089","黃小姐","1","$320","明日","清洗中","warn"],["#L-3082","周小姐","4","$240","今日","整燙","warn"],["#L-3076","許太太","1","$1,200","逾期","待取","risk"],["#L-3061","楊小姐","3","$180","已取","已取件",""],["#L-3058","何先生","4","$280","已取","已取件",""]].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td><td>${x[4]}</td><td><span class="badge ${x[6]}">${x[6]==="risk"?"! ":""}${x[5]}</span></td></tr>`).join("")}</tbody></table></div></section></div>`
];
const tabs=document.getElementById("tabs"),view=document.getElementById("view"),title=document.getElementById("title"),subtitle=document.getElementById("subtitle"),actions=document.getElementById("actions");
tabs.innerHTML=TABS.map((x,i)=>`<button data-i="${i}" aria-label="${x[1]}">${I(x[0])}<span>${x[1]}</span></button>`).join("");
function draw(i){
 charts.forEach(x=>x.dispose());charts=[];
 if(i!==5||!window.echarts)return;
 const text="#475569",line="#A7F3D0",green="#059669",orange="#EA580C";
 let a=echarts.init(document.getElementById("rev"));a.setOption({grid:{left:8,right:14,top:30,bottom:8,containLabel:true},tooltip:{trigger:"axis"},legend:{textStyle:{color:text}},xAxis:{type:"category",data:["3/21","3/22","3/23","3/24","3/25","3/26","3/27"],axisLabel:{color:text},axisLine:{lineStyle:{color:line}}},yAxis:[{type:"value",name:"件",axisLabel:{color:text},splitLine:{lineStyle:{color:"#E8F1F3"}}},{type:"value",name:"$",axisLabel:{color:text},splitLine:{show:false}}],series:[{name:"收件量",type:"bar",data:[28,34,31,26,40,45,38],itemStyle:{color:green,borderRadius:[3,3,0,0]}},{name:"營收",type:"line",yAxisIndex:1,smooth:true,data:[9200,11400,10100,8600,12800,14200,12480],lineStyle:{color:orange,width:3},itemStyle:{color:orange}}]});charts.push(a);
 let b=echarts.init(document.getElementById("pie"));b.setOption({tooltip:{trigger:"item",formatter:"{b}: {c}%"},legend:{bottom:0,textStyle:{color:text}},series:[{type:"pie",radius:["45%","70%"],center:["50%","43%"],label:{show:false},itemStyle:{borderColor:"#fff",borderWidth:3},data:[{name:"水洗",value:44,itemStyle:{color:"#059669"}},{name:"乾洗",value:31,itemStyle:{color:"#10B981"}},{name:"寢具家飾",value:15,itemStyle:{color:"#EA580C"}},{name:"精品皮件",value:10,itemStyle:{color:"#064E3B"}}]}]});charts.push(b)
}
function show(i){
 i=Math.max(0,Math.min(5,i));
 tabs.querySelectorAll("[data-i]").forEach(x=>{let on=+x.dataset.i===i;x.classList.toggle("on",on);x.setAttribute("aria-current",on?"page":"false")});
 title.textContent=TABS[i][1];subtitle.textContent=TABS[i][2];
 actions.innerHTML=ACT[i].map(x=>`<button class="btn ${x[2]?"ghost":""}">${I(x[0])}${x[1]}</button>`).join("");
 view.innerHTML=screens[i]();draw(i)
}
tabs.addEventListener("click",e=>{let b=e.target.closest("[data-i]");if(!b)return;location.hash="v"+b.dataset.i});
view.addEventListener("click",e=>{let b=e.target.closest("[data-cat]");if(!b)return;cat=+b.dataset.cat;show(1)});
function fromHash(){let m=location.hash.match(/(?:go=|v)([0-9]+)/);show(m?+m[1]:0);scrollTo(0,0)}
addEventListener("hashchange",fromHash);
addEventListener("resize",()=>charts.forEach(x=>x.resize()));
fromHash();
</script>
</body>
</html>
