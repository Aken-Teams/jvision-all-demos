<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雲端資源管理平台（CMP）</title>
<meta name="description" content="多雲盤點、FinOps 成本控管到用量監控的雲端資源管理平台">
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;--color-on-primary:#fff;
  --color-secondary:#3b82f6;--color-on-secondary:#000;
  --color-accent:#ea580c;--color-on-accent:#000;
  --color-background:#f8fafc;--color-foreground:#1e293b;
  --color-card:#fff;--color-card-foreground:#1e293b;
  --color-muted:#e9eff8;--color-muted-foreground:#475569;
  --color-border:#e2e8f0;--color-destructive:#dc2626;
  --color-on-destructive:#fff;--color-ring:#2563eb;
  --blue:#2563eb;--ink:#1e293b;--muted:#475569;--line:#e2e8f0;
  --ok:#15803d;--warn:#b45309;--danger:#dc2626;--info:#0369a1;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{
  margin:0;background-color:var(--color-background);color:var(--ink);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:32px 32px;font-family:"Work Sans",sans-serif;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden
}
button,a{font:inherit}
button{cursor:pointer}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;
  font-size:20px;line-height:1;vertical-align:middle
}
.topbar{
  position:sticky;top:0;z-index:50;display:grid;grid-template-columns:minmax(240px,1fr) 2fr;
  align-items:stretch;background:#fff;border-bottom:3px solid var(--ink)
}
.brand{
  display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--blue);
  color:#fff;border-right:3px solid var(--ink)
}
.logo{
  width:42px;height:42px;display:grid;place-items:center;background:#fff;color:var(--blue);
  border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);flex:none
}
.brand b{display:block;font-family:"Outfit",sans-serif;font-size:16px;font-weight:700}
.brand small{display:block;font-size:11px;opacity:.9}
.nav{display:grid;grid-template-columns:repeat(6,1fr);min-width:0}
.nav button{
  min-height:68px;padding:8px 6px;border:0;border-left:1px solid var(--line);
  background:#fff;color:var(--ink);font-size:12px;font-weight:700
}
.nav button:hover{background:var(--color-muted)}
.nav button.on{background:var(--color-accent);color:var(--color-on-accent);box-shadow:inset 0 -6px 0 var(--ink)}
.nav button .material-symbols-outlined{display:block;margin:0 auto 5px}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);outline-offset:3px
}
.wrap{max-width:1440px;margin:auto;padding:28px 20px 64px}
.screen-head{
  position:relative;min-height:150px;padding:24px 34% 24px 24px;margin-bottom:18px;
  background:var(--ink);color:#fff;border:3px solid var(--ink);box-shadow:8px 8px 0 var(--color-accent)
}
.screen-head::after{
  content:"CMP / OPERATIONS";position:absolute;right:22px;bottom:10px;
  color:#94a3b8;font:700 13px "Work Sans",monospace;letter-spacing:.12em
}
.screen-head h1{
  margin:4px 0 6px;font:700 clamp(27px,4vw,48px)/1.02 "Outfit",sans-serif;
  letter-spacing:-.035em
}
.screen-head p{max-width:720px;margin:0;color:#cbd5e1;font-size:14px}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:4px 8px;background:var(--color-accent);
  color:#000;border:2px solid #fff;font-size:11px;font-weight:700;text-transform:uppercase
}
.grid{display:grid;gap:14px;min-width:0}.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1fr 1.4fr}
.card,.kpi{
  background:var(--color-card);border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink)
}
.card{padding:16px}.card h3{
  display:flex;align-items:center;gap:8px;margin:0 0 14px;padding-bottom:10px;
  border-bottom:2px solid var(--ink);font:700 15px "Outfit",sans-serif
}
.card h3>.material-symbols-outlined{color:var(--blue)}
.tail{margin-left:auto;color:var(--muted);font:600 11px "Work Sans",sans-serif}
.kpi{position:relative;padding:15px;overflow:hidden}
.kpi::before{
  content:"";position:absolute;right:-18px;top:-18px;width:62px;height:62px;
  background:var(--color-muted);border:2px solid var(--ink);transform:rotate(15deg)
}
.kpi .ic{
  width:36px;height:36px;display:grid;place-items:center;margin-bottom:12px;
  background:var(--blue);color:#fff;border:2px solid var(--ink);position:relative
}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:600}
.kpi .val{font:700 27px "Outfit",sans-serif;font-variant-numeric:tabular-nums}
.kpi .val span{font-size:13px;color:var(--muted)}
.kpi .sub{display:flex;align-items:center;gap:3px;margin-top:3px;font-size:11px;font-weight:700}
.up{color:var(--ok)}.down{color:var(--danger)}.flat{color:var(--muted)}
.chart{width:100%;height:280px}.chart.sm{height:220px}
.tblwrap{overflow:auto;border:2px solid var(--ink)}
table{width:100%;min-width:620px;border-collapse:collapse;font-size:12px}
th,td{padding:11px 12px;text-align:left;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--ink);color:#fff;font-size:11px;letter-spacing:.04em}
tbody tr:nth-child(even){background:#f1f5f9}tbody tr:hover{background:#dbeafe}
td.num{text-align:right;font-family:"Work Sans",monospace;font-variant-numeric:tabular-nums;font-weight:700}
.tag,.cloudtag{
  display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border:1px solid currentColor;
  font-size:10px;font-weight:700
}
.tag::before{content:"";width:6px;height:6px;background:currentColor}
.t-ok{background:#dcfce7;color:#166534}.t-warn{background:#fef3c7;color:#92400e}
.t-danger{background:#fee2e2;color:#b91c1c}.t-info{background:#e0f2fe;color:#075985}
.t-muted{background:#e2e8f0;color:#334155}.t-accent{background:#ffedd5;color:#9a3412}
.aws{background:#fff7ed;color:#9a3412}.azure{background:#e0f2fe;color:#075985}.gcp{background:#fee2e2;color:#991b1b}
.bar{height:10px;min-width:64px;background:#dbe3ef;border:1px solid var(--ink);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--blue)}
.board{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:10px}
.col{padding:9px;background:var(--color-muted);border:2px solid var(--ink)}
.col-h{display:flex;align-items:center;gap:7px;padding-bottom:8px;font-size:12px;font-weight:700}
.dot{width:10px;height:10px;border:1px solid var(--ink)}
.cnt{margin-left:auto;padding:0 6px;background:#fff;border:1px solid var(--ink);font-family:monospace}
.tk{
  margin-bottom:8px;padding:10px;background:#fff;border:2px solid var(--ink);
  border-left:6px solid var(--blue);box-shadow:3px 3px 0 #94a3b8
}
.tk .id{color:var(--muted);font:600 10px monospace}.tk .ti{margin:3px 0 7px;font-size:12px;font-weight:700}
.mt{display:flex;align-items:center;gap:5px;flex-wrap:wrap;color:var(--muted);font-size:10px}
.av{
  display:grid;place-items:center;width:21px;height:21px;margin-left:auto;background:var(--ink);
  color:#fff;border:1px solid var(--ink);font-size:9px;font-weight:700
}
.lrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border:0}.li{display:grid;place-items:center;width:34px;height:34px;flex:none;border:1px solid currentColor}
.lm{min-width:0;flex:1}.lm b{display:block;font-size:12px}.lm small{display:block;color:var(--muted);font-size:11px}
.lv{text-align:right;font:700 14px "Work Sans",monospace;font-variant-numeric:tabular-nums}
.tl{position:relative;padding-left:23px}.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:3px;background:var(--ink)}
.tl-item{position:relative;padding:0 0 18px 5px}.tl-item::before{content:"";position:absolute;left:-21px;top:4px;width:12px;height:12px;background:var(--color-accent);border:2px solid var(--ink)}
.tm{color:var(--muted);font:600 11px monospace}.tx{margin-top:4px;font-weight:700;font-size:13px}.dd{color:var(--muted);font-size:11px}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:11px}
.legend span{display:flex;align-items:center;gap:5px}.legend i{width:10px;height:10px;border:1px solid var(--ink)}
.foot{margin-top:28px;padding:15px;background:var(--ink);color:#cbd5e1;text-align:center;font-size:11px}
.grid-item{animation:enter .4s cubic-bezier(.2,.9,.25,1.25) both}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
  .grid-item{opacity:1;transform:none}
}
@media(max-width:1024px){
  .topbar{grid-template-columns:1fr}.brand{border-right:0;border-bottom:2px solid var(--ink)}
  .nav button{min-height:56px}.g4{grid-template-columns:repeat(2,1fr)}
  .g23,.g32{grid-template-columns:1fr}.screen-head{padding-right:22%}
}
@media(max-width:768px){
  .wrap{padding:18px 12px 48px}.nav{overflow-x:auto;grid-template-columns:repeat(6,minmax(88px,1fr))}
  .nav button{font-size:10px}.screen-head{min-height:0;padding:20px}
  .screen-head::after{display:none}.g2,.g3{grid-template-columns:1fr}.board{grid-template-columns:repeat(4,210px)}
}
@media(max-width:480px){
  .brand{padding:10px 12px}.brand small{display:none}.brand b{font-size:14px}
  .g4{grid-template-columns:1fr}.card,.kpi{box-shadow:3px 3px 0 var(--ink)}
  .screen-head h1{font-size:29px}.tail{display:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">cloud</span></div>
    <div><b>CMP 雲端資源管理平台</b><small>多雲盤點 · FinOps 成本控管 · 用量監控</small></div>
  </div>
  <nav class="nav" id="nav" aria-label="主要模組">
    <button data-i="0" onclick="show(0)"><span class="material-symbols-outlined">account_tree</span><span>多雲盤點</span></button>
    <button data-i="1" onclick="show(1)"><span class="material-symbols-outlined">request_quote</span><span>成本 FinOps</span></button>
    <button data-i="2" onclick="show(2)"><span class="material-symbols-outlined">monitoring</span><span>用量監控</span></button>
    <button data-i="3" onclick="show(3)"><span class="material-symbols-outlined">warning</span><span>超支告警</span></button>
    <button data-i="4" onclick="show(4)"><span class="material-symbols-outlined">trending_up</span><span>優化建議</span></button>
    <button data-i="5" onclick="show(5)"><span class="material-symbols-outlined">insights</span><span>月度報表</span></button>
  </nav>
</header>
<main class="wrap" id="app"></main>
<script>
"use strict";
var app=document.getElementById("app"),charts=[];
var BLUE="#2563eb",BLUE2="#3b82f6",ORANGE="#ea580c",INK="#1e293b";
var AX={lineStyle:{color:"#64748b"}},SPLIT={lineStyle:{color:"#dbe3ef"}};
function clearCharts(){charts.forEach(function(c){try{c.dispose()}catch(e){}});charts=[]}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts.push(c)}
window.addEventListener("resize",function(){charts.forEach(function(c){try{c.resize()}catch(e){}})});
function head(icon,module,title,text){
 return '<div class="screen-head grid-item"><span class="chip"><span class="material-symbols-outlined">'+icon+'</span>'+module+'</span><h1>'+title+'</h1><p>'+text+'</p></div>'
}
function kpi(icon,lab,val,unit,dir,sub){
 var cls=dir==="up"?"up":dir==="down"?"down":"flat",arr=dir==="up"?"north_east":dir==="down"?"south_east":"remove";
 return '<div class="kpi grid-item"><div class="ic"><span class="material-symbols-outlined">'+icon+'</span></div><div class="lab">'+lab+'</div><div class="val">'+val+(unit?'<span> '+unit+'</span>':'')+'</div><div class="sub '+cls+'"><span class="material-symbols-outlined">'+arr+'</span>'+sub+'</div></div>'
}
function card(title,icon,body,tail){
 return '<section class="card grid-item"><h3><span class="material-symbols-outlined">'+icon+'</span>'+title+(tail?'<span class="tail">'+tail+'</span>':'')+'</h3>'+body+'</section>'
}
function s0(){
 var cols=[
  ["待上架","#64748b",[["RSC-2041","prod-web-asg 自動擴縮群組","aws","EC2 · 8 台","K"],["RSC-2044","analytics-blob 儲存體","azure","Blob · 12TB","L"]]],
  ["盤點中","#2563eb",[["RSC-2039","order-db 主資料庫","aws","RDS · r6g","C"],["RSC-2036","ml-train GPU 叢集","gcp","A2 · 4 節點","H"],["RSC-2033","cdn-edge 邊緣節點","azure","Front Door","L"]]],
  ["已標籤","#ea580c",[["RSC-2028","payment-svc 容器服務","aws","EKS · pay","C"],["RSC-2025","bi-warehouse 資料倉儲","gcp","BigQuery","H"]]],
  ["已上架","#15803d",[["RSC-2019","corp-vpn 閘道","azure","VNet GW","L"],["RSC-2015","backup-vault 備援庫","aws","S3 · IA","K"],["RSC-2011","dns-zone 網域解析","gcp","Cloud DNS","H"]]]
 ],board="";
 cols.forEach(function(c){
  var items="";c[2].forEach(function(x){items+='<div class="tk"><div class="id">'+x[0]+'</div><div class="ti">'+x[1]+'</div><div class="mt"><span class="cloudtag '+x[2]+'">'+x[2].toUpperCase()+'</span><span>'+x[3]+'</span><span class="av">'+x[4]+'</span></div></div>'});
  board+='<div class="col"><div class="col-h"><span class="dot" style="background:'+c[1]+'"></span>'+c[0]+'<span class="cnt">'+c[2].length+'</span></div>'+items+'</div>'
 });
 return head("account_tree","模組一","多雲資源盤點與可視化","跨 AWS / Azure / GCP 統一資產目錄，看板追蹤資源上架流轉狀態。")+
 '<div class="grid g4" style="margin-bottom:14px">'+kpi("hub","納管資源總數","1,284","項","up","+36 本月")+kpi("cloud","接管雲帳號","17","個","flat","3 家 CSP")+kpi("label","標籤覆蓋率","88%","","up","+6pt")+kpi("warning","未標記資源","152","項","down","-24 待處理")+'</div>'+
 '<div class="grid g23">'+card("資源上架看板","view_kanban",'<div style="overflow:auto"><div class="board">'+board+"</div></div>","流程可視化 · 即時同步")+
 card("資源分布（依 CSP）","donut_large",'<div id="c0a" class="chart sm"></div><div class="legend"><span><i style="background:#f59e0b"></i>AWS 612</span><span><i style="background:#0ea5e9"></i>Azure 458</span><span><i style="background:#ef4444"></i>GCP 214</span></div>')+"</div>"
}
function s0charts(){mk("c0a",{tooltip:{trigger:"item"},series:[{type:"pie",radius:["46%","74%"],itemStyle:{borderColor:"#fff",borderWidth:3},label:{formatter:"{b}\n{d}%"},data:[{value:612,name:"AWS",itemStyle:{color:"#f59e0b"}},{value:458,name:"Azure",itemStyle:{color:"#0ea5e9"}},{value:214,name:"GCP",itemStyle:{color:"#ef4444"}}]}]})}
function s1(){
 var rows=[["電商平台","K. 陳",420000,398500,"aws","+4%"],["資料科學","H. 林",310000,352800,"gcp","+18%"],["企業內部系統","L. 王",180000,141200,"azure","-8%"],["行銷數據","C. 張",150000,132600,"aws","+2%"],["備援與災難復原","K. 陳",96000,88400,"azure","-3%"]],tr="";
 rows.forEach(function(r){var p=Math.round(r[3]/r[2]*100),over=r[3]>r[2];tr+='<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td><span class="cloudtag '+r[4]+'">'+r[4].toUpperCase()+'</span></td><td class="num">$'+r[2].toLocaleString()+'</td><td class="num">$'+r[3].toLocaleString()+'</td><td><div style="display:flex;align-items:center;gap:7px"><div class="bar" style="flex:1"><span style="width:'+Math.min(p,100)+'%;background:'+(over?"#dc2626":BLUE)+'"></span></div><b>'+p+'%</b></div></td><td><span class="tag '+(over?"t-danger":"t-ok")+'">'+r[5]+'</span></td></tr>'});
 return head("request_quote","模組二","成本分析與預算控管（FinOps）","花費歸屬至成本中心，對照預算進度，即時掌握超支風險。")+
 '<div class="grid g4" style="margin-bottom:14px">'+kpi("payments","本月累計花費","$1.11M","","up","已用 84% 預算")+kpi("savings","成本節省率","23.4%","","up","+5.1pt YoY")+kpi("percent","預算達成","84%","","flat","距上限 16%")+kpi("sell","未分攤花費","$62K","","down","-$18K")+'</div>'+
 '<div class="grid g23" style="margin-bottom:14px">'+card("月度花費趨勢（依服務類別）","stacked_bar_chart",'<div id="c1a" class="chart"></div>')+card("花費構成","pie_chart",'<div id="c1b" class="chart sm"></div>')+'</div>'+
 card("成本中心預算控管","account_balance_wallet",'<div class="tblwrap"><table><thead><tr><th>成本中心</th><th>負責人</th><th>主雲</th><th>月預算</th><th>已使用</th><th>使用進度</th><th>月增減</th></tr></thead><tbody>'+tr+"</tbody></table></div>","5 個成本中心")
}
function s1charts(){
 var common={tooltip:{trigger:"axis"},legend:{bottom:0},grid:{left:46,right:12,top:16,bottom:42},xAxis:{type:"category",data:["3月","4月","5月","6月","7月","8月"],axisLine:AX},yAxis:{type:"value",axisLabel:{formatter:"${value}K"},splitLine:SPLIT}};
 common.series=[{name:"運算",type:"bar",stack:"t",data:[420,438,455,470,486,502],itemStyle:{color:BLUE}},{name:"儲存",type:"bar",stack:"t",data:[180,186,190,196,205,214],itemStyle:{color:BLUE2}},{name:"網路",type:"bar",stack:"t",data:[120,128,132,138,144,150],itemStyle:{color:"#93c5fd"}},{name:"其他",type:"bar",stack:"t",data:[80,84,88,90,94,98],itemStyle:{color:"#dbeafe"}}];mk("c1a",common);
 mk("c1b",{tooltip:{trigger:"item"},series:[{type:"pie",radius:["42%","72%"],label:{formatter:"{b}\n{d}%"},data:[{value:502,name:"運算",itemStyle:{color:BLUE}},{value:214,name:"儲存",itemStyle:{color:BLUE2}},{value:150,name:"網路",itemStyle:{color:"#93c5fd"}},{value:98,name:"其他",itemStyle:{color:ORANGE}}]}]})
}
function usageRows(){
 var a=[["prod-web-asg","CPU",78,"warn"],["order-db (RDS)","CPU",64,"info"],["analytics-blob","儲存",92,"danger"],["ml-train GPU","GPU",88,"warn"],["cdn-edge","頻寬",41,"ok"],["payment-svc EKS","記憶體",57,"info"]],s="";
 a.forEach(function(r){var color=r[3]==="danger"?"#dc2626":r[3]==="warn"?"#b45309":BLUE;s+='<div class="lrow"><div class="li t-'+r[3]+'"><span class="material-symbols-outlined">memory</span></div><div class="lm"><b>'+r[0]+'</b><small>'+r[1]+' 使用率</small><div class="bar" style="margin-top:5px"><span style="width:'+r[2]+'%;background:'+color+'"></span></div></div><div class="lv">'+r[2]+'%</div></div>'});return s
}
