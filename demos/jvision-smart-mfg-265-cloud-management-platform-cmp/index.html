<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>雲端資源管理平台（CMP）</title>
<meta name="description" content="多雲盤點、FinOps 成本控管到用量監控的雲端資源管理平台"/>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#6d28d9;--accent2:#8b5cf6;--accent-soft:#ede9fe;
  --bg:#f5f4fb;--panel:#ffffff;--ink:#1e1b2e;--muted:#6b6880;
  --line:#e8e5f2;--ok:#16a34a;--warn:#f59e0b;--danger:#dc2626;--info:#0ea5e9;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;line-height:1.55;
  overflow-x:hidden;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
a{color:inherit;text-decoration:none;}

.topbar{
  position:sticky;top:0;z-index:50;background:linear-gradient(100deg,#4c1d95,#6d28d9);
  color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  box-shadow:0 4px 18px rgba(76,29,149,.25);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand .logo{
  width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.16);
  display:grid;place-items:center;flex:none;
}
.brand .logo .material-symbols-outlined{font-size:22px;}
.brand b{font-size:15px;font-weight:800;white-space:nowrap;}
.brand small{display:block;font-size:11px;opacity:.8;font-weight:400;}
.nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto;min-width:0;}
.nav button{
  border:0;background:rgba(255,255,255,.08);color:#fff;cursor:pointer;
  padding:8px 12px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:6px;transition:.15s;
}
.nav button .material-symbols-outlined{font-size:18px;}
.nav button:hover{background:rgba(255,255,255,.2);}
.nav button.on{background:#fff;color:var(--accent);}

.wrap{max-width:1360px;margin:0 auto;padding:20px 18px 60px;}
.screen-head{margin:4px 0 16px;}
.screen-head h1{font-size:22px;font-weight:800;margin:0 0 4px;letter-spacing:.2px;}
.screen-head p{margin:0;color:var(--muted);font-size:13.5px;}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-bottom:8px;}

.grid{display:grid;gap:14px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:2fr 1fr;}
.g32{grid-template-columns:1fr 1.4fr;}
.grid>*{min-width:0;}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
.card h3 .tail{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted);}

.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;position:relative;overflow:hidden;min-width:0;}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:var(--accent-soft);opacity:.6;}
.kpi .ic{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:10px;position:relative;z-index:1;}
.kpi .ic .material-symbols-outlined{font-size:22px;}
.kpi .lab{font-size:12.5px;color:var(--muted);font-weight:500;position:relative;z-index:1;}
.kpi .val{font-size:25px;font-weight:800;margin-top:2px;position:relative;z-index:1;letter-spacing:.3px;}
.kpi .sub{font-size:12px;margin-top:3px;font-weight:600;position:relative;z-index:1;display:flex;align-items:center;gap:2px;}
.up{color:var(--ok);}.down{color:var(--danger);}.flat{color:var(--muted);}

.chart{width:100%;height:280px;overflow:hidden;}
.chart.sm{height:220px;}

.tblwrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px;}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{background:#faf9fe;font-weight:700;color:var(--muted);font-size:12px;}
tbody tr:hover{background:#faf9ff;}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;}
.t-ok{background:#dcfce7;color:#15803d;}
.t-warn{background:#fef3c7;color:#b45309;}
.t-danger{background:#fee2e2;color:#b91c1c;}
.t-info{background:#e0f2fe;color:#0369a1;}
.t-muted{background:#eef0f5;color:#5b6070;}
.t-accent{background:var(--accent-soft);color:var(--accent);}

.bar{height:8px;border-radius:999px;background:#eee9f7;overflow:hidden;min-width:60px;}
.bar>span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent2),var(--accent));}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;min-width:0;}
@media(max-width:820px){.board{grid-template-columns:1fr;}}
.col{background:#f7f5fd;border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0;}
.col-h{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13px;margin-bottom:10px;padding:0 2px;}
.col-h .dot{width:9px;height:9px;border-radius:50%;flex:none;}
.col-h .cnt{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11px;color:var(--muted);}
.tk{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:11px;padding:10px 11px;margin-bottom:9px;}
.tk .id{font-size:11px;color:var(--muted);font-weight:600;}
.tk .ti{font-size:13px;font-weight:700;margin:3px 0 6px;}
.tk .mt{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--muted);}
.tk .av{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700;flex:none;}

.tl{position:relative;padding-left:22px;}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl-item{position:relative;padding:0 0 16px 4px;}
.tl-item::before{content:"";position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent-soft);}
.tl-item .tm{font-size:11.5px;color:var(--muted);font-weight:600;}
.tl-item .tx{font-size:13px;font-weight:700;margin-top:2px;}
.tl-item .dd{font-size:12px;color:var(--muted);margin-top:1px;}

.lrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0;}
.lrow:last-child{border-bottom:0;}
.lrow .li{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;}
.lrow .lm{min-width:0;flex:1;}
.lrow .lm b{font-size:13px;font-weight:700;display:block;}
.lrow .lm small{font-size:11.5px;color:var(--muted);}
.lrow .lv{text-align:right;font-weight:700;font-size:14px;flex:none;}

.cloudtag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;}
.aws{background:#fff3e0;color:#c05621;}
.azure{background:#e0f2fe;color:#0369a1;}
.gcp{background:#fee2e2;color:#b91c1c;}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}

.foot{margin-top:26px;text-align:center;color:var(--muted);font-size:12px;}

@media(max-width:560px){
  .nav button span.txt{display:none;}
  .nav button{padding:8px;}
  .brand small{display:none;}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined">cloud</span></div>
    <div>
      <b>CMP 雲端資源管理平台</b>
      <small>多雲盤點 · FinOps 成本控管 · 用量監控</small>
    </div>
  </div>
  <nav class="nav" id="nav">
    <button data-i="0" onclick="show(0)"><span class="material-symbols-outlined">account_tree</span><span class="txt">多雲盤點</span></button>
    <button data-i="1" onclick="show(1)"><span class="material-symbols-outlined">request_quote</span><span class="txt">成本 FinOps</span></button>
    <button data-i="2" onclick="show(2)"><span class="material-symbols-outlined">monitoring</span><span class="txt">用量監控</span></button>
    <button data-i="3" onclick="show(3)"><span class="material-symbols-outlined">warning</span><span class="txt">超支告警</span></button>
    <button data-i="4" onclick="show(4)"><span class="material-symbols-outlined">trending_up</span><span class="txt">優化建議</span></button>
    <button data-i="5" onclick="show(5)"><span class="material-symbols-outlined">insights</span><span class="txt">月度報表</span></button>
  </nav>
</header>

<main class="wrap" id="app"></main>

<script>
"use strict";
var app=document.getElementById("app");
var charts=[];
function clearCharts(){for(var i=0;i<charts.length;i++){try{charts[i].dispose();}catch(e){}}charts=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts.push(c);}
window.addEventListener("resize",function(){for(var i=0;i<charts.length;i++){try{charts[i].resize();}catch(e){}}});

function setNav(i){
  var b=document.querySelectorAll("#nav button");
  for(var k=0;k<b.length;k++){b[k].classList.toggle("on",k===i);}
}

var PURPLE="#6d28d9",PURPLE2="#8b5cf6",AX={color:"#8a8798"},SPLIT={lineStyle:{color:"#eee9f7"}};

function kpi(icon,lab,val,unit,dir,sub){
  var cls=dir==="up"?"up":(dir==="down"?"down":"flat");
  var arr=dir==="up"?"north_east":(dir==="down"?"south_east":"remove");
  return '<div class="kpi"><div class="ic"><span class="material-symbols-outlined">'+icon+'</span></div>'+
    '<div class="lab">'+lab+'</div><div class="val">'+val+(unit?'<span style="font-size:14px;color:var(--muted);font-weight:600"> '+unit+'</span>':'')+'</div>'+
    '<div class="sub '+cls+'"><span class="material-symbols-outlined" style="font-size:14px">'+arr+'</span>'+sub+'</div></div>';
}

/* ===== screen 0: multi-cloud inventory (kanban signature) ===== */
function s0(){
  var cols=[
    {t:"待上架",dot:"#94a3b8",items:[
      {id:"RSC-2041",ti:"prod-web-asg 自動擴縮群組",cloud:"aws",tag:"EC2 · 8 台",who:"K"},
      {id:"RSC-2044",ti:"analytics-blob 儲存體",cloud:"azure",tag:"Blob · 12TB",who:"L"}
    ]},
    {t:"盤點中",dot:"#8b5cf6",items:[
      {id:"RSC-2039",ti:"order-db 主資料庫",cloud:"aws",tag:"RDS · r6g",who:"C"},
      {id:"RSC-2036",ti:"ml-train GPU 叢集",cloud:"gcp",tag:"A2 · 4 節點",who:"H"},
      {id:"RSC-2033",ti:"cdn-edge 邊緣節點",cloud:"azure",tag:"Front Door",who:"L"}
    ]},
    {t:"已標籤",dot:"#0ea5e9",items:[
      {id:"RSC-2028",ti:"payment-svc 容器服務",cloud:"aws",tag:"EKS · pay",who:"C"},
      {id:"RSC-2025",ti:"bi-warehouse 資料倉儲",cloud:"gcp",tag:"BigQuery",who:"H"}
    ]},
    {t:"已上架",dot:"#16a34a",items:[
      {id:"RSC-2019",ti:"corp-vpn 閘道",cloud:"azure",tag:"VNet GW",who:"L"},
      {id:"RSC-2015",ti:"backup-vault 備援庫",cloud:"aws",tag:"S3 · IA",who:"K"},
      {id:"RSC-2011",ti:"dns-zone 網域解析",cloud:"gcp",tag:"Cloud DNS",who:"H"}
    ]}
  ];
  var board="";
  for(var i=0;i<cols.length;i++){
    var c=cols[i],cards="";
    for(var j=0;j<c.items.length;j++){
      var it=c.items[j];
      cards+='<div class="tk"><div class="id">'+it.id+'</div><div class="ti">'+it.ti+'</div>'+
        '<div class="mt"><span class="cloudtag '+it.cloud+'">'+it.cloud.toUpperCase()+'</span><span>'+it.tag+'</span><span class="av" style="margin-left:auto">'+it.who+'</span></div></div>';
    }
    board+='<div class="col"><div class="col-h"><span class="dot" style="background:'+c.dot+'"></span>'+c.t+'<span class="cnt">'+c.items.length+'</span></div>'+cards+'</div>';
  }
  return ''+
  '<div class="screen-head"><span class="chip"><span class="material-symbols-outlined" style="font-size:16px">account_tree</span>模組一</span>'+
  '<h1>多雲資源盤點與可視化</h1><p>跨 AWS / Azure / GCP 統一資產目錄，看板追蹤資源上架流轉狀態。</p></div>'+
  '<div class="grid g4" style="margin-bottom:14px">'+
    kpi("hub","納管資源總數","1,284","項","up","+36 本月")+
    kpi("cloud","接管雲帳號","17","個","flat","3 家 CSP")+
    kpi("label","標籤覆蓋率","88%","","up","+6pt")+
    kpi("warning","未標記資源","152","項","down","-24 待處理")+
  '</div>'+
  '<div class="grid g23">'+
    '<div class="card"><h3><span class="material-symbols-outlined">view_kanban</span>資源上架看板<span class="tail">流程可視化 · 即時同步</span></h3><div style="overflow-x:auto"><div class="board">'+board+'</div></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>資源分布（依 CSP）</h3><div id="c0a" class="chart sm"></div>'+
      '<div class="legend"><span><i style="background:#f59e0b"></i>AWS 612</span><span><i style="background:#0ea5e9"></i>Azure 458</span><span><i style="background:#ef4444"></i>GCP 214</span></div></div>'+
  '</div>';
}
function s0charts(){
  mk("c0a",{
    tooltip:{trigger:"item"},
    series:[{type:"pie",radius:["48%","76%"],center:["50%","50%"],avoidLabelOverlap:false,
      itemStyle:{borderColor:"#fff",borderWidth:2},
      label:{show:true,formatter:"{b}\n{d}%",fontSize:11},
      data:[
        {value:612,name:"AWS",itemStyle:{color:"#f59e0b"}},
        {value:458,name:"Azure",itemStyle:{color:"#0ea5e9"}},
        {value:214,name:"GCP",itemStyle:{color:"#ef4444"}}
      ]}]
  });
}

/* ===== screen 1: FinOps cost analysis ===== */
function s1(){
  var rows=[
    {cc:"電商平台",own:"K. 陳",bud:420000,use:398500,cloud:"aws",trend:"+4%"},
    {cc:"資料科學",own:"H. 林",bud:310000,use:352800,cloud:"gcp",trend:"+18%"},
    {cc:"企業內部系統",own:"L. 王",bud:180000,use:141200,cloud:"azure",trend:"-8%"},
    {cc:"行銷數據",own:"C. 張",bud:150000,use:132600,cloud:"aws",trend:"+2%"},
    {cc:"備援與災難復原",own:"K. 陳",bud:96000,use:88400,cloud:"azure",trend:"-3%"}
  ];
  var tr="";
  for(var i=0;i<rows.length;i++){
    var r=rows[i],pct=Math.round(r.use/r.bud*100),over=r.use>r.bud;
    tr+='<tr><td><b>'+r.cc+'</b></td><td>'+r.own+'</td><td><span class="cloudtag '+r.cloud+'">'+r.cloud.toUpperCase()+'</span></td>'+
      '<td class="num">$'+r.bud.toLocaleString()+'</td><td class="num">$'+r.use.toLocaleString()+'</td>'+
      '<td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><span style="width:'+Math.min(pct,100)+'%;'+(over?'background:linear-gradient(90deg,#f87171,#dc2626)':'')+'"></span></div><b style="font-size:12px;'+(over?'color:#dc2626':'')+'">'+pct+'%</b></div></td>'+
      '<td><span class="tag '+(over?"t-danger":"t-ok")+'">'+r.trend+'</span></td></tr>';
  }
  return ''+
  '<div class="screen-head"><span class="chip"><span class="material-symbols-outlined" style="font-size:16px">request_quote</span>模組二</span>'+
  '<h1>成本分析與預算控管（FinOps）</h1><p>花費歸屬至成本中心，對照預算進度，即時掌握超支風險。</p></div>'+
  '<div class="grid g4" style="margin-bottom:14px">'+
    kpi("payments","本月累計花費","$1.11M","","up","已用 84% 預算")+
    kpi("savings","成本節省率","23.4%","","up","+5.1pt YoY")+
    kpi("percent","預算達成","84%","","flat","距上限 16%")+
    kpi("sell","未分攤花費","$62K","","down","-$18K")+
  '</div>'+
  '<div class="grid g23" style="margin-bottom:14px">'+
    '<div class="card"><h3><span class="material-symbols-outlined">stacked_bar_chart</span>月度花費趨勢（依服務類別）</h3><div id="c1a" class="chart"></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">pie_chart</span>花費構成</h3><div id="c1b" class="chart sm"></div></div>'+
  '</div>'+
  '<div class="card"><h3><span class="material-symbols-outlined">account_balance_wallet</span>成本中心預算控管<span class="tail">'+rows.length+' 個成本中心</span></h3>'+
    '<div class="tblwrap"><table><thead><tr><th>成本中心</th><th>負責人</th><th>主雲</th><th>月預算</th><th>已使用</th><th>使用進度</th><th>月增減</th></tr></thead><tbody>'+tr+'</tbody></table></div></div>';
}
function s1charts(){
  mk("c1a",{
    tooltip:{trigger:"axis"},legend:{bottom:0,textStyle:{fontSize:11},itemWidth:12,itemHeight:8},
    grid:{left:44,right:14,top:16,bottom:44},
    xAxis:{type:"category",data:["3月","4月","5月","6月","7月","8月"],axisLine:AX,axisLabel:AX},
    yAxis:{type:"value",axisLabel:{formatter:"${value}K",color:"#8a8798"},splitLine:SPLIT},
    series:[
      {name:"運算",type:"bar",stack:"t",data:[420,438,455,470,486,502],itemStyle:{color:PURPLE}},
      {name:"儲存",type:"bar",stack:"t",data:[180,186,190,196,205,214],itemStyle:{color:PURPLE2}},
      {name:"網路",type:"bar",stack:"t",data:[120,128,132,138,144,150],itemStyle:{color:"#c4b5fd"}},
      {name:"其他",type:"bar",stack:"t",data:[80,84,88,90,94,98],itemStyle:{color:"#e9d5ff"}}
    ]
  });
  mk("c1b",{
    tooltip:{trigger:"item",formatter:"{b}: {d}%"},
    series:[{type:"pie",radius:["40%","72%"],label:{fontSize:11,formatter:"{b}\n{d}%"},
      itemStyle:{borderColor:"#fff",borderWidth:2},
      data:[
        {value:502,name:"運算",itemStyle:{color:PURPLE}},
        {value:214,name:"儲存",itemStyle:{color:PURPLE2}},
        {value:150,name:"網路",itemStyle:{color:"#c4b5fd"}},
        {value:98,name:"其他",itemStyle:{color:"#e9d5ff"}}
      ]}]
  });
}

/* ===== screen 2: usage monitoring ===== */
function s2(){
  var res=[
    {n:"prod-web-asg",m:"CPU",v:78,c:"warn"},
    {n:"order-db (RDS)",m:"CPU",v:64,c:"info"},
    {n:"analytics-blob",m:"儲存",v:92,c:"danger"},
    {n:"ml-train GPU",m:"GPU",v:88,c:"warn"},
    {n:"cdn-edge",m:"頻寬",v:41,c:"ok"},
    {n:"payment-svc EKS",m:"記憶體",v:57,c:"info"}
  ];
  var gauges="";
  for(var i=0;i<res.length;i++){
    var r=res[i];

function s2charts(){

  mk("c2b",{
    tooltip:{trigger:"axis"},legend:{bottom:0,textStyle:{fontSize:11}},grid:{left:40,right:14,top:16,bottom:40},
