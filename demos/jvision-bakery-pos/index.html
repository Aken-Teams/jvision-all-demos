<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>烘焙門市 POS｜Jvision 系統 Demo</title>
<meta name="description" content="前台結帳、會員到進銷存的門市一體化（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@300;400;500;600;700&family=Playfair+Display+SC:wght@400;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#1E3A8A;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#A16207;
  --color-on-accent:#FFFFFF;
  --color-background:#F8FAFC;
  --color-foreground:#1E40AF;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E40AF;
  --color-muted:#E9EEF5;
  --color-muted-foreground:#475569;
  --color-border:#BFDBFE;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#1E3A8A;
  --blue:#1E3A8A;
  --ink:#172554;
  --muted:#526174;
  --line:#BFDBFE;
  --success:#166534;
  --success-soft:#DCFCE7;
  --warning:#92400E;
  --warning-soft:#FEF3C7;
  --danger-soft:#FEE2E2;
  --info-soft:#DBEAFE;
  --shadow-sm:0 1px 2px rgba(30,58,138,.05);
  --shadow-md:0 12px 34px rgba(30,58,138,.09);
  --radius-sm:10px;
  --radius-md:16px;
  --radius-lg:24px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  background:var(--color-background);
  color:#334155;
  font-family:"Karla","Microsoft JhengHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;
  line-height:1;
}
.pos{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{
  position:sticky;top:0;z-index:30;height:100vh;
  display:flex;flex-direction:column;gap:6px;
  padding:22px 16px;
  color:#DBEAFE;
  background:
    radial-gradient(circle at 20% 5%,rgba(59,130,246,.28),transparent 28%),
    linear-gradient(160deg,#172554 0%,#1E3A8A 62%,#172554 100%);
  box-shadow:8px 0 30px rgba(23,37,84,.1);
}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 24px}
.logo{
  width:44px;height:44px;flex:none;border-radius:14px;
  display:grid;place-items:center;color:var(--color-primary);
  background:#FFF;box-shadow:0 8px 22px rgba(0,0,0,.2);
}
.logo .material-symbols-outlined{font-size:26px}
.brand-text strong{
  display:block;color:#FFF;font-family:"Playfair Display SC",serif;
  font-size:17px;line-height:1.1;letter-spacing:.02em;
}
.brand-text small{display:block;margin-top:4px;color:#BFDBFE;font-size:11px}
.nav-label{
  padding:0 12px 7px;color:#93C5FD;font-size:10px;font-weight:700;
  letter-spacing:.15em;text-transform:uppercase;
}
.rail button{
  width:100%;min-height:48px;padding:0 13px;border:1px solid transparent;
  border-radius:12px;background:transparent;color:#DBEAFE;
  display:flex;align-items:center;gap:12px;
  font-size:14px;font-weight:600;text-align:left;
  transition:background .2s ease,color .2s ease,border-color .2s ease,transform .2s ease;
}
.rail button:hover{background:rgba(255,255,255,.1);color:#FFF;transform:translateX(2px)}
.rail button.on{
  color:#172554;background:#FFF;border-color:#FFF;
  box-shadow:0 8px 20px rgba(0,0,0,.16);
}
.rail button.on .material-symbols-outlined{color:var(--color-accent)}
.rail button .material-symbols-outlined{font-size:21px}
.rail .sp{margin-top:auto}
.rail-footer{
  margin-top:14px;padding:14px;border:1px solid rgba(191,219,254,.25);
  border-radius:14px;background:rgba(255,255,255,.06);
}
.rail-footer span{display:block;color:#FFF;font-size:12px;font-weight:700}
.rail-footer small{display:block;margin-top:3px;color:#BFDBFE;font-size:11px}
.main{min-width:0}
.top{
  position:sticky;top:0;z-index:20;min-height:78px;
  display:flex;align-items:center;gap:18px;padding:14px 30px;
  background:rgba(248,250,252,.94);border-bottom:1px solid var(--line);
  backdrop-filter:blur(16px);
}
.title-eyebrow{
  margin-bottom:3px;color:var(--color-accent);font-size:10px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;
}
.top h1{
  margin:0;color:var(--ink);font-family:"Playfair Display SC",serif;
  font-size:23px;line-height:1.15;
}
.store{margin-top:4px;color:var(--muted);font-size:12px}
.top .r{margin-left:auto;display:flex;align-items:center;gap:10px}
.chip{
  min-height:34px;padding:0 11px;border:1px solid var(--line);
  border-radius:999px;background:#FFF;color:var(--ink);
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;font-weight:700;white-space:nowrap;
}
.chip.status{border-color:#86EFAC;background:var(--success-soft);color:var(--success)}
.chip.revenue{border-color:#FCD34D;background:var(--warning-soft);color:#78350F}
.ava{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  color:#FFF;background:var(--color-accent);font-weight:700;
  box-shadow:0 7px 18px rgba(161,98,7,.22);
}
.body{padding:26px 30px 44px;min-width:0}
.view-head{
  margin-bottom:20px;padding:24px 26px;border:1px solid #93C5FD;
  border-radius:var(--radius-lg);overflow:hidden;position:relative;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  background:
    radial-gradient(circle at 88% 10%,rgba(255,255,255,.18),transparent 22%),
    linear-gradient(120deg,#172554,#1E3A8A 60%,#1D4ED8);
  color:#FFF;box-shadow:var(--shadow-md);
}
.view-head:after{
  content:"";position:absolute;right:-32px;bottom:-56px;width:210px;height:210px;
  border:1px solid rgba(255,255,255,.14);border-radius:50%;
}
.view-head-copy{position:relative;z-index:1}
.view-head small{
  display:block;color:#BFDBFE;font-size:11px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;
}
.view-head h2{
  margin:5px 0 4px;font-family:"Playfair Display SC",serif;
  font-size:26px;font-weight:700;
}
.view-head p{margin:0;color:#DBEAFE;font-size:13px}
.view-head-icon{
  width:58px;height:58px;flex:none;border:1px solid rgba(255,255,255,.28);
  border-radius:18px;display:grid;place-items:center;
  background:rgba(255,255,255,.12);position:relative;z-index:1;
}
.view-head-icon .material-symbols-outlined{font-size:29px}
.card,.cart,.kpi,.prod,.ord,.si,.mc{
  background:var(--color-card);border:1px solid var(--line);
  box-shadow:var(--shadow-sm);
}
.card{padding:20px;border-radius:var(--radius-md)}
.btn{
  min-height:42px;padding:0 17px;border:1px solid var(--color-primary);
  border-radius:var(--radius-sm);display:inline-flex;align-items:center;justify-content:center;gap:7px;
  color:var(--color-on-primary);background:var(--color-primary);
  font-weight:700;font-size:14px;
  box-shadow:0 7px 16px rgba(30,58,138,.16);
  transition:transform .2s ease,box-shadow .2s ease,background .2s ease;
}
.btn:hover{background:#172554;transform:translateY(-1px);box-shadow:0 10px 22px rgba(30,58,138,.22)}
.btn.accent{border-color:var(--color-accent);background:var(--color-accent)}
.btn.accent:hover{background:#854D0E}
.btn.ghost{background:#FFF;color:var(--color-primary);box-shadow:none}
.btn.ghost:hover{background:var(--info-soft)}
.btn.block{width:100%;min-height:50px;font-size:16px}
.btn .material-symbols-outlined{font-size:19px}
h3.sec{
  margin:0 0 15px;color:var(--ink);display:flex;align-items:center;gap:8px;
  font-family:"Playfair Display SC",serif;font-size:16px;
}
h3.sec .material-symbols-outlined{color:var(--color-accent)}
.pos3{display:grid;grid-template-columns:148px minmax(360px,1fr) 350px;gap:18px;align-items:start}
.catlist{display:flex;flex-direction:column;gap:8px}
.catlist button{
  min-height:48px;padding:0 13px;border:1px solid var(--line);border-radius:12px;
  display:flex;align-items:center;gap:9px;background:#FFF;color:#334155;
  font-weight:700;text-align:left;
  transition:border-color .2s ease,background .2s ease,color .2s ease,transform .2s ease;
}
.catlist button:hover{border-color:var(--color-secondary);background:#EFF6FF;transform:translateX(2px)}
.catlist button.on{border-color:var(--color-primary);background:var(--color-primary);color:#FFF}
.catlist button .material-symbols-outlined{color:var(--color-accent)}
.catlist button.on .material-symbols-outlined{color:#FDE68A}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px}
.prod{
  padding:0;overflow:hidden;border-radius:var(--radius-md);text-align:left;
  transition:transform .24s ease,box-shadow .24s ease,border-color .24s ease;
}
.prod:hover{transform:translateY(-4px);border-color:#93C5FD;box-shadow:var(--shadow-md)}
.prod .ph{
  height:104px;display:grid;place-items:center;color:var(--color-primary);
  background:
    radial-gradient(circle at 72% 22%,rgba(161,98,7,.13),transparent 23%),
    linear-gradient(145deg,#EFF6FF,#FFF 60%,#FEF3C7);
  border-bottom:1px solid #DBEAFE;
}
.food-mark{
  width:54px;height:54px;border:1px solid #93C5FD;border-radius:17px;
  display:grid;place-items:center;background:rgba(255,255,255,.78);
  box-shadow:0 8px 20px rgba(30,58,138,.1);
}
.food-mark .material-symbols-outlined{font-size:29px}
.prod .info{padding:12px}
.prod .info b{display:block;color:var(--ink);font-size:14px}
.prod .pr{margin-top:5px;color:#854D0E;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.cart{
  position:sticky;top:98px;padding:18px;border-radius:var(--radius-md);
  box-shadow:var(--shadow-md);
}
.cart-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:9px}
.cart-h b{color:var(--ink);font-family:"Playfair Display SC",serif;font-size:17px}
.cart-h .tag{color:var(--muted);font-size:11px;text-align:right}
.ci{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #DCE8F7}
.ci .em{
  width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;
  color:var(--color-primary);background:var(--info-soft);
}
.ci .em .material-symbols-outlined{font-size:20px}
.ci .nm{min-width:0;flex:1}
.ci .nm b{display:block;color:var(--ink);font-size:13px}
.ci .nm small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.qty{display:flex;align-items:center;gap:7px}
.qty>span{min-width:14px;color:var(--ink);font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.qbtn{
  width:28px;height:28px;padding:0;border:1px solid var(--line);border-radius:8px;
  color:var(--color-primary);background:#FFF;font-weight:700;
  transition:background .2s ease,border-color .2s ease;
}
.qbtn:hover{border-color:var(--color-primary);background:var(--info-soft)}
.cart-sum{margin-top:13px;font-size:14px}
.cart-sum .row{display:flex;justify-content:space-between;padding:4px 0}
.cart-sum .row span:last-child{font-variant-numeric:tabular-nums}
.cart-sum .total{
  margin-top:8px;padding-top:12px;border-top:1px dashed #93C5FD;
  color:var(--ink);font-size:22px;font-weight:700;
}
.pays{display:flex;gap:7px;margin:13px 0}
.pays button{
  min-height:39px;flex:1;padding:0 6px;border:1px solid var(--line);
  border-radius:9px;background:#FFF;color:#475569;font-size:12px;font-weight:700;
  transition:background .2s ease,border-color .2s ease,color .2s ease;
}
.pays button:hover{border-color:var(--color-secondary);background:#EFF6FF}
.pays button.on{border-color:var(--color-primary);background:var(--info-soft);color:var(--color-primary)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:17px 18px;border-radius:var(--radius-md);position:relative;overflow:hidden}
.kpi:before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--color-accent);
}
.kpi .l{color:var(--muted);font-size:12px;font-weight:600}
.kpi .v{margin-top:6px;color:var(--ink);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .v small{margin-left:3px;color:var(--muted);font-size:13px}
.kpi .d{
  margin-top:4px;color:var(--success);display:flex;align-items:center;gap:4px;
  font-size:12px;font-weight:700;
}
.kpi .d:before{content:"✓";font-family:Arial,sans-serif}
.grid{display:grid;gap:18px}
.grid>*{min-width:0}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:13px}
.tb{
  min-height:118px;border:2px solid var(--line);border-radius:15px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  color:var(--ink);background:#FFF;font-weight:700;
  transition:transform .2s ease,box-shadow .2s ease;
}
.tb:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.tb small{color:#475569;font-size:11px;font-weight:600}
.tb.free{border-color:#86EFAC;background:#F0FDF4}
.tb.busy{border-color:#FCA5A5;background:#FEF2F2;color:#991B1B}
.tb.rsv{border-color:#FCD34D;background:#FFFBEB;color:#78350F}
.tb .material-symbols-outlined{font-size:25px}
.res-row{
  display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);
}
.res-row .material-symbols-outlined{color:var(--color-accent)}
.res-row span:last-child{color:var(--ink);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.orders{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.ord{
  padding:16px;border-radius:var(--radius-md);border-top:4px solid var(--color-primary);
  transition:transform .22s ease,box-shadow .22s ease;
}
.ord:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.ord-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.ord-h b{color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.badge{
  padding:4px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;
  font-size:11px;font-weight:700;
}
.badge:before{font-family:"Material Symbols Outlined";font-size:14px}
.b-din{background:var(--info-soft);color:#1E40AF}
.b-din:before{content:"restaurant"}
.b-take{background:var(--warning-soft);color:#78350F}
.b-take:before{content:"shopping_bag"}
.b-del{background:#E0F2FE;color:#075985}
.b-del:before{content:"delivery_truck_speed"}
.ord ul{margin:8px 0;padding-left:19px;color:#475569;font-size:13px}
.ord li{margin:3px 0}
.ord-f{display:flex;align-items:center;justify-content:space-between;margin-top:10px;color:#475569;font-size:12px}
.ord-f span:before{content:"●";margin-right:6px;color:var(--color-accent);font-size:8px}
.ord-f b{color:#854D0E;font-size:16px;font-variant-numeric:tabular-nums}
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.si{
  padding:16px;border-radius:14px;
  transition:transform .22s ease,box-shadow .22s ease;
}
.si:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.si b{color:var(--ink);font-size:14px}
.bar{height:9px;margin:10px 0 7px;border-radius:999px;overflow:hidden;background:var(--color-muted)}
.bar span{display:block;height:100%;border-radius:inherit}
.si small{color:#475569;font-size:11px;font-variant-numeric:tabular-nums}
.lowt{
  padding:3px 7px;border-radius:6px;display:inline-flex;align-items:center;gap:3px;
  color:#991B1B;background:var(--danger-soft);font-size:10px;font-weight:700;
}
.lowt:before{content:"warning";font-family:"Material Symbols Outlined";font-size:13px}
.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}
.mc{
  padding:17px;border-radius:var(--radius-md);
  background:linear-gradient(145deg,#FFF 45%,#EFF6FF);
  transition:transform .22s ease,box-shadow .22s ease;
}
.mc:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.mc-t{display:flex;align-items:center;gap:10px}
.mc-av{
  width:42px;height:42px;flex:none;border-radius:13px;display:grid;place-items:center;
  color:#FFF;background:var(--color-primary);font-family:"Playfair Display SC",serif;font-weight:700;
}
.mc-t b{color:var(--ink)}
.mc-t small{display:block;margin-top:2px;color:var(--muted);font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.mc-pts{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between}
.mc-pts div span{display:block;color:var(--muted);font-size:11px}
.mc-pts div b{color:#854D0E;font-size:18px;font-variant-numeric:tabular-nums}
.tier{margin-left:auto;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:700}
.tier:before{margin-right:3px;font-family:"Material Symbols Outlined";font-size:12px;vertical-align:-2px}
.t-gold{color:#78350F;background:var(--warning-soft)}
.t-gold:before{content:"workspace_premium"}
.t-slv{color:#334155;background:#E2E8F0}
.t-slv:before{content:"verified"}
.chart{width:100%;height:280px}
.rank-row{display:flex;align-items:center;gap:12px}
.rank-no{
  width:28px;height:28px;flex:none;border-radius:8px;display:grid;place-items:center;
  color:#FFF;background:var(--color-primary);font-weight:700;font-variant-numeric:tabular-nums;
}
.rank-name{width:120px;color:var(--ink)}
.rank-row .bar{flex:1;margin:0}
.rank-value{min-width:64px;color:var(--ink);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.grid-item{animation:reveal .42s cubic-bezier(.34,1.4,.64,1) both}
.grid-item:nth-child(2){animation-delay:.05s}
.grid-item:nth-child(3){animation-delay:.1s}
.grid-item:nth-child(4){animation-delay:.15s}
.grid-item:nth-child(5){animation-delay:.2s}
.grid-item:nth-child(6){animation-delay:.25s}
@keyframes reveal{
  from{opacity:0;transform:translateY(16px) scale(.96)}
  to{opacity:1;transform:none}
}
.mobile-nav{display:none}
@media(max-width:1180px){
  .pos{grid-template-columns:84px minmax(0,1fr)}
  .rail{padding:18px 11px}
  .brand{justify-content:center;padding:3px 0 20px}
  .brand-text,.nav-label,.rail button span:last-child,.rail-footer{display:none}
  .rail button{justify-content:center;padding:0}
  .pos3{grid-template-columns:128px minmax(320px,1fr)}
  .cart{position:static;grid-column:1/-1}
  .kpis{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:768px){
  .pos{display:block;padding-bottom:76px}
  .rail{
    position:fixed;left:0;right:0;top:auto;bottom:0;z-index:50;width:auto;height:68px;
    padding:7px 8px;display:grid;grid-template-columns:repeat(6,1fr);gap:3px;
    background:#172554;border-top:1px solid #3B82F6;
  }
  .brand,.nav-label,.rail .sp,.rail-footer,.rail button[data-i="settings"]{display:none}
  .rail button{min-height:52px;flex-direction:column;gap:2px;font-size:9px}
  .rail button span:last-child{display:block}
  .rail button .material-symbols-outlined{font-size:20px}
  .top{min-height:70px;padding:11px 16px}
  .title-eyebrow,.store,.chip.revenue{display:none}
  .top h1{font-size:20px}
  .top .r{gap:7px}
  .chip{padding:0 8px;font-size:11px}
  .body{padding:16px 14px 28px}
  .view-head{padding:20px;margin-bottom:16px}
  .view-head h2{font-size:22px}
  .view-head-icon{width:48px;height:48px}
  .pos3{grid-template-columns:1fr}

<body>

<script>

const PROD={0:[["🥐","可頌",55],["🍞","鮮奶吐司",80],["🥖","法國長棍",65],["🥯","貝果",45],["🫓","丹麥酥",70],["🧈","奶油餐包",30],["🍞","全麥吐司",85],["🥖","蒜香法國",60],["🥐","巧克力可頌",68],["🥯","起司貝果",55],["🍞","肉鬆麵包",50],["🍈","菠蘿麵包",45]],1:[["🍰","草莓鮮奶油",120],["🎂","巧克力蛋糕",520],["🧁","杯子蛋糕",60],["🍮","焦糖布丁",45],["🥧","蘋果派",95],["🍩","甜甜圈",40],["🍰","提拉米蘇",130],["🥧","檸檬塔",110],["🧀","重乳酪蛋糕",140],["🎂","黑森林",480],["🍮","抹茶布丁",50],["🧁","紅絲絨杯子",70]],2:[["🍪","手工餅乾",40],["🥨","蝴蝶酥",55],["🍘","馬卡龍",60],["🍬","牛軋餅",75],["🧈","費南雪",50],["🐚","瑪德蓮",48],["🍪","巧克力豆餅",45],["🥜","堅果塔",65]],3:[["☕","美式咖啡",80],["🥤","鮮奶茶",65],["🧃","柳橙汁",70],["☕","拿鐵",90],["☕","卡布奇諾",90],["🧋","紅茶拿鐵",75],["🍫","熱可可",85],["🍵","抹茶拿鐵",95]],4:[["🎁","經典禮盒",680],["🎀","節慶禮盒",980],["💝","喜餅禮盒",1280],["🍼","彌月禮盒",880],["🧺","下午茶組",560]]};
const CART=[["🥐","可頌",55,2],["🍰","草莓鮮奶油",120,1],["☕","美式咖啡",80,1],["🥯","起司貝果",55,2],["🍮","焦糖布丁",45,1]];
const KPI=[["結帳等待","1.9","分鐘","−更快"],["翻桌率","92","%","+22%"],["備料浪費","5.6","%","−63%"],["訂位掌握率","94","%","+45%"]];
const TABLES=[["A1","free"],["A2","busy"],["A3","free"],["A4","rsv"],["A5","busy"],["B1","busy"],["B2","free"],["B3","busy"],["B4","free"],["B5","rsv"],["C1","rsv"],["C2","free"],["C3","busy"],["C4","free"],["C5","busy"],["D1","free"],["D2","busy"],["D3","free"],["VIP1","rsv"],["VIP2","busy"]];
const ORDERS=[["#A238","din","內用 A2",[["可頌","×2"],["拿鐵","×1"]],230,"備餐中"],["#T091","take","外帶",[["草莓蛋糕","×1"],["禮盒","×1"]],800,"待取"],["#D145","del","外送 · foodpanda",[["吐司","×2"],["甜甜圈","×3"]],280,"配送中"],["#A240","din","內用 B1",[["法國長棍","×1"],["美式","×2"]],225,"已上桌"],["#T093","take","外帶",[["蝴蝶酥","×4"]],220,"製作中"],["#A241","din","內用 C1",[["杯子蛋糕","×3"]],180,"待製作"],["#D146","del","外送 · Uber",[["提拉米蘇","×2"],["拿鐵","×2"]],440,"備餐中"],["#T094","take","外帶",[["喜餅禮盒","×1"]],1280,"待取"],["#A242","din","內用 VIP1",[["黑森林","×1"],["卡布","×4"]],840,"用餐中"],["#T095","take","外帶",[["菠蘿麵包","×3"],["柳橙汁","×2"]],275,"製作中"],["#D147","del","外送 · foodpanda",[["起司蛋糕","×1"]],140,"配送中"],["#A243","din","內用 B3",[["費南雪","×6"],["熱可可","×2"]],470,"待製作"]];
const STOCK=[["高筋麵粉",18,40],["低筋麵粉",26,30],["奶油",6,20],["鮮奶",8,15],["草莓",3,12],["巧克力",22,20],["雞蛋",30,25],["酵母",5,8],["砂糖",45,30],["抹茶粉",4,10],["咖啡豆",12,15],["包裝盒",120,80],["鮮奶油",9,18],["起司",7,14]];
const MEMBERS=[["林小美","0912-***-321",2480,"gold"],["陳大文","0928-***-118",860,"slv"],["王詩涵","0955-***-902",5120,"gold"],["李俊宏","0933-***-455",1240,"slv"],["張惠雯","0966-***-733",3300,"gold"],["黃建國","0977-***-201",540,"slv"],["吳雅婷","0910-***-664",1980,"slv"],["劉承翰","0988-***-127",4260,"gold"],["蔡宜蓁","0921-***-508",720,"slv"]];
let cat=0,pay=0,current=0;
const money=n=>"$"+n.toLocaleString("zh-TW");
const icon=n=>`<span class="material-symbols-outlined" aria-hidden="true">${n}</span>`;
const foodIcon=()=>CATS[cat][0];
const hero=i=>`<section class="view-head grid-item"><div class="view-head-copy"><small>幸福烘焙 · 門市營運中心</small><h2>${NAMES[i]}</h2><p>${DESCS[i]}</p></div><div class="view-head-icon">${icon(MODS[i][0])}</div></section>`;
function checkout(){
  const cats=CATS.map((c,i)=>`<button type="button" class="${i===cat?"on":""}" data-cat="${i}" aria-pressed="${i===cat}">${icon(c[0])}<span>${c[1]}</span></button>`).join("");
  const prods=(PROD[cat]||[]).map((p,i)=>`<button type="button" class="prod grid-item" aria-label="選擇${p[1]}，${money(p[2])}"><span class="ph"><span class="food-mark">${icon(foodIcon())}</span></span><span class="info"><b>${p[1]}</b><span class="pr">${money(p[2])}</span></span></button>`).join("");
  const sub=CART.reduce((s,c)=>s+c[2]*c[3],0),tax=Math.round(sub*.05);
  const items=CART.map(c=>`<div class="ci"><span class="em">${icon(foodIcon())}</span><div class="nm"><b>${c[1]}</b><small>${money(c[2])}</small></div><div class="qty"><button type="button" class="qbtn" aria-label="減少${c[1]}數量">−</button><span>${c[3]}</span><button type="button" class="qbtn" aria-label="增加${c[1]}數量">＋</button></div></div>`).join("");
  return hero(0)+`<div class="pos3"><nav class="catlist grid-item" aria-label="商品分類">${cats}</nav><section class="prods" aria-label="${CATS[cat][1]}商品">${prods}</section><aside class="cart grid-item" aria-label="目前訂單"><div class="cart-h"><b>目前訂單</b><span class="tag">內用 · A2 · 3 件</span></div>${items}<div class="cart-sum"><div class="row"><span>小計</span><span>${money(sub)}</span></div><div class="row"><span>營業稅 5%</span><span>${money(tax)}</span></div><div class="row total"><span>應收</span><span>${money(sub+tax)}</span></div></div><div class="pays" aria-label="付款方式">${["現金","信用卡","行動支付"].map((x,i)=>`<button type="button" class="${pay===i?"on":""}" data-pay="${i}" aria-pressed="${pay===i}">${x}</button>`).join("")}</div><button type="button" class="btn accent block">${icon("payments")}結帳 ${money(sub+tax)}</button></aside></div>`;
}
const kpiRow=()=>`<div class="kpis">${KPI.map(k=>`<div class="kpi grid-item"><div class="l">${k[0]}</div><div class="v">${k[1]}<small>${k[2]}</small></div><div class="d">${k[3]}</div></div>`).join("")}</div>`;
const SCREENS={
0:checkout,
1:()=>hero(1)+`<div class="grid" style="grid-template-columns:1.6fr 1fr"><section class="card grid-item"><h3 class="sec">${icon("table_restaurant")}座位圖 · 大廳</h3><div class="tables">${TABLES.map(t=>`<div class="tb ${t[1]} grid-item">${icon(t[1]==="free"?"check_circle":t[1]==="busy"?"restaurant":"bookmark")}<span>${t[0]}</span><small>${t[1]==="free"?"空桌":t[1]==="busy"?"用餐中":"已訂位"}</small></div>`).join("")}</div></section><section class="card grid-item"><h3 class="sec">${icon("event")}今日訂位</h3>${["18:00 林小姐 4 位 · A4","18:30 陳先生 2 位 · C1","19:15 王小姐 6 位 · 包廂","20:00 公司聚餐 10 位"].map(r=>`<div class="res-row">${icon("schedule")}<span>${r}</span></div>`).join("")}<button type="button" class="btn ghost" style="margin-top:14px;width:100%">${icon("add")}新增訂位</button></section></div>`,
2:()=>hero(2)+`<div class="orders">${ORDERS.map(o=>`<article class="ord grid-item"><div class="ord-h"><b>${o[0]}</b><span class="badge b-${o[1]}">${o[2]}</span></div><ul>${o[3].map(x=>`<li>${x[0]} ${x[1]}</li>`).join("")}</ul><div class="ord-f"><span>${o[5]}</span><b>${money(o[4])}</b></div></article>`).join("")}</div>`,
3:()=>hero(3)+`<div class="stk">${STOCK.map(s=>{const pct=Math.min(100,Math.round(s[1]/(s[2]*1.5)*100)),low=s[1]<s[2];return `<article class="si grid-item"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>${s[0]}</b>${low?'<span class="lowt">叫貨</span>':""}</div><div class="bar" role="progressbar" aria-label="${s[0]}庫存水位" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%;background:${low?"var(--color-destructive)":"var(--success)"}"></span></div><small>庫存 ${s[1]} · 安全量 ${s[2]}</small></article>`}).join("")}</div>`,
4:()=>hero(4)+`<div class="mem">${MEMBERS.map(m=>`<article class="mc grid-item"><div class="mc-t"><span class="mc-av">${m[0].slice(-1)}</span><div><b>${m[0]}</b><small>${m[1]}</small></div><span class="tier ${m[3]==="gold"?"t-gold":"t-slv"}">${m[3]==="gold"?"金卡":"銀卡"}</span></div><div class="mc-pts"><div><span>紅利點數</span><b>${m[2].toLocaleString("zh-TW")}</b></div><div style="text-align:right"><span>本月消費</span><b style="color:var(--ink)">${money(Math.round(m[2]*1.6))}</b></div></div></article>`).join("")}</div>`,
5:()=>hero(5)+kpiRow()+`<div class="grid" style="grid-template-columns:1.5fr 1fr"><section class="card grid-item"><h3 class="sec">${icon("show_chart")}今日各時段營收</h3><div id="cH" class="chart" role="img" aria-label="今日各時段營收長條圖"></div></section><section class="card grid-item"><h3 class="sec">${icon("pie_chart")}付款方式佔比</h3><div id="cP" class="chart" role="img" aria-label="付款方式佔比圓餅圖"></div></section></div><section class="card grid-item" style="margin-top:18px"><h3 class="sec">${icon("local_fire_department")}熱銷排行</h3><div class="grid">${[["可頌",312],["鮮奶吐司",245],["草莓鮮奶油",188],["美式咖啡",176],["蝴蝶酥",140]].map((x,i)=>`<div class="rank-row"><span class="rank-no">${i+1}</span><b class="rank-name">${x[0]}</b><div class="bar" role="progressbar" aria-label="${x[0]}銷售比例" aria-valuenow="${Math.round(x[1]/312*100)}" aria-valuemin="0" aria-valuemax="100"><span style="width:${x[1]/312*100}%;background:var(--color-primary)"></span></div><span class="rank-value">${x[1]} 件</span></div>`).join("")}</div></section>`
};
let charts=[];
function draw(i){
  charts.forEach(c=>{try{c.dispose()}catch(e){}});charts=[];
  if(!window.echarts||i!==5)return;
  const text="#526174",line="#DCE8F7",primary="#1E3A8A",accent="#A16207";
  const h=document.getElementById("cH");
  if(h){
    const c=echarts.init(h);
    c.setOption({grid:{left:8,right:16,top:20,bottom:8,containLabel:true},tooltip:{trigger:"axis"},xAxis:{type:"category",data:["08","10","12","14","16","18","20"],axisLine:{lineStyle:{color:"#BFDBFE"}},axisLabel:{color:text,fontFamily:"Karla"}},yAxis:{type:"value",splitLine:{lineStyle:{color:line}},axisLabel:{color:text,fontFamily:"Karla"}},series:[{name:"營收",type:"bar",data:[2400,5200,8600,4100,3800,7200,7100],itemStyle:{color:primary,borderRadius:[7,7,0,0]},emphasis:{itemStyle:{color:accent}}}]});
    charts.push(c);
  }
  const p=document.getElementById("cP");
  if(p){
    const c=echarts.init(p);
    c.setOption({tooltip:{trigger:"item"},legend:{bottom:0,textStyle:{fontSize:11,color:text,fontFamily:"Karla"}},series:[{type:"pie",radius:["46%","72%"],center:["50%","44%"],itemStyle:{borderColor:"#FFF",borderWidth:3},label:{show:false},data:[{name:"行動支付",value:44,itemStyle:{color:primary}},{name:"信用卡",value:33,itemStyle:{color:accent}},{name:"現金",value:23,itemStyle:{color:"#64748B"}}]}]});
    charts.push(c);
  }
}
const rail=document.getElementById("rail"),view=document.getElementById("view"),vt=document.getElementById("vt");
rail.innerHTML=`<div class="brand"><div class="logo">${icon("bakery_dining")}</div><div class="brand-text"><strong>烘焙門市 POS</strong><small>Store Operations</small></div></div><div class="nav-label">Operations</div>`+MODS.map((m,i)=>`<button type="button" data-i="${i}" class="${i===0?"on":""}" aria-label="${m[1]}" aria-current="${i===0?"page":"false"}">${icon(m[0])}<span>${m[1]}</span></button>`).join("")+`<div class="sp"></div><button type="button" data-i="settings" aria-label="設定">${icon("settings")}<span>設定</span></button><div class="rail-footer"><span>信義門市</span><small>收銀台 01 · 已連線</small></div>`;
function show(i){
  if(!Number.isInteger(i)||i<0||i>5)i=0;
  current=i;
  rail.querySelectorAll("button[data-i]").forEach(b=>{
    const on=b.dataset.i===String(i);
    b.classList.toggle("on",on);
    b.setAttribute("aria-current",on?"page":"false");
  });
  vt.textContent=NAMES[i];
  view.innerHTML=SCREENS[i]();
  draw(i);
}
rail.addEventListener("click",e=>{
  const b=e.target.closest("button[data-i]");
  if(!b||b.dataset.i==="settings")return;
  const i=+b.dataset.i;
  if(location.hash!==`#v${i}`)location.hash=`v${i}`;
  else show(i);
});
view.addEventListener("click",e=>{
  const cb=e.target.closest("[data-cat]");
  if(cb){cat=+cb.dataset.cat;view.innerHTML=SCREENS[0]();return}
  const pb=e.target.closest("[data-pay]");
  if(pb){pay=+pb.dataset.pay;view.innerHTML=SCREENS[0]()}
});
window.addEventListener("resize",()=>charts.forEach(c=>c.resize()));
function fromHash(){
  const m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  const i=m?Math.min(+m[1],5):0;
  show(i);
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
