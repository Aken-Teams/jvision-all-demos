<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>烘焙門市 POS｜Jvision 系統 Demo</title>
<meta name="description" content="前台結帳、會員到進銷存的門市一體化（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
  :root{ --rose:#e11d48; --rose-d:#9f1239; --amber:#f59e0b; --cream:#fdf6f0; --ink:#43302b; --body:#6b5750; --muted:#9c8b84; --line:#efe2d8; --green:#16a34a; }
  *{ box-sizing:border-box; } html,body{ margin:0; height:100%; }
  body{ font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif; background:var(--cream); color:var(--body); -webkit-font-smoothing:antialiased; }
  .material-symbols-outlined{ font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
  .pos{ display:grid; grid-template-columns:82px 1fr; min-height:100vh; }
  /* left icon rail */
  .rail{ background:linear-gradient(180deg,var(--rose),var(--rose-d)); display:flex; flex-direction:column; align-items:center; padding:16px 0; gap:6px; position:sticky; top:0; height:100vh; }
  .rail .logo{ width:46px; height:46px; border-radius:14px; background:#fff; color:var(--rose); display:grid; place-content:center; margin-bottom:14px; box-shadow:0 6px 16px rgba(0,0,0,.15); }
  .rail button{ width:60px; padding:9px 4px; border:0; background:none; color:#ffe4e6; border-radius:13px; display:flex; flex-direction:column; align-items:center; gap:3px; font:inherit; font-size:10px; font-weight:700; cursor:pointer; transition:background .15s; }
  .rail button .material-symbols-outlined{ font-size:23px; }
  .rail button:hover{ background:rgba(255,255,255,.14); }
  .rail button.on{ background:#fff; color:var(--rose); }
  .rail .sp{ margin-top:auto; }
  /* main */
  .main{ min-width:0; display:flex; flex-direction:column; }
  .top{ display:flex; align-items:center; gap:16px; padding:16px 26px; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; }
  .top h1{ margin:0; font-size:20px; font-weight:900; color:var(--ink); }
  .top .store{ font-size:12px; color:var(--muted); }
  .top .r{ margin-left:auto; display:flex; align-items:center; gap:14px; }
  .chip{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:800; color:var(--rose); background:#ffe4e6; border-radius:999px; padding:6px 12px; }
  .ava{ width:36px; height:36px; border-radius:50%; background:var(--amber); color:#fff; font-weight:800; display:grid; place-content:center; }
  .body{ flex:1; padding:20px 26px 40px; min-width:0; }
  .btn{ display:inline-flex; align-items:center; gap:6px; height:40px; padding:0 16px; border-radius:12px; border:0; background:var(--rose); color:#fff; font:inherit; font-weight:800; font-size:14px; cursor:pointer; }
  .btn.ghost{ background:#fff; color:var(--rose); border:1px solid var(--line); }
  .btn.block{ width:100%; justify-content:center; height:48px; font-size:16px; }
  .btn .material-symbols-outlined{ font-size:19px; }
  h3.sec{ margin:0 0 12px; font-size:15px; font-weight:800; color:var(--ink); display:flex; align-items:center; gap:8px; } h3.sec .material-symbols-outlined{ color:var(--rose); }
  .card{ background:#fff; border:1px solid var(--line); border-radius:18px; padding:18px 20px; }
  /* ===== POS checkout: 3 columns ===== */
  .pos3{ display:grid; grid-template-columns:150px 1fr 340px; gap:18px; align-items:start; }
  .catlist{ display:flex; flex-direction:column; gap:8px; }
  .catlist button{ text-align:left; border:1px solid var(--line); background:#fff; border-radius:13px; padding:13px 14px; font:inherit; font-weight:800; font-size:14px; color:var(--body); cursor:pointer; display:flex; align-items:center; gap:9px; }
  .catlist button .material-symbols-outlined{ color:var(--rose); }
  .catlist button.on{ background:var(--rose); color:#fff; border-color:var(--rose); } .catlist button.on .material-symbols-outlined{ color:#fff; }
  .prods{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:14px; }
  .prod{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:0; overflow:hidden; cursor:pointer; transition:transform .12s,box-shadow .12s; }
  .prod:hover{ transform:translateY(-3px); box-shadow:0 12px 24px rgba(225,29,72,.12); }
  .prod .ph{ height:82px; display:grid; place-content:center; font-size:34px; background:linear-gradient(135deg,#fff1f2,#ffe4e6); }
  .prod .info{ padding:11px 12px; } .prod .info b{ display:block; font-size:14px; color:var(--ink); } .prod .info .pr{ color:var(--rose); font-weight:900; font-size:15px; margin-top:3px; }
  /* cart */
  .cart{ background:#fff; border:1px solid var(--line); border-radius:18px; padding:16px; position:sticky; top:90px; }
  .cart-h{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; } .cart-h b{ font-size:16px; color:var(--ink); } .cart-h .tag{ font-size:12px; color:var(--muted); }
  .ci{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .ci .em{ width:38px; height:38px; border-radius:10px; background:#fff1f2; display:grid; place-content:center; font-size:20px; flex:none; }
  .ci .nm{ flex:1; } .ci .nm b{ font-size:13px; color:var(--ink); display:block; } .ci .nm small{ color:var(--muted); font-size:12px; }
  .ci .qty{ display:flex; align-items:center; gap:8px; } .ci .qty span{ font-weight:800; color:var(--ink); }
  .qbtn{ width:24px; height:24px; border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--rose); font-weight:800; cursor:pointer; }
  .cart-sum{ margin-top:14px; font-size:14px; } .cart-sum .row{ display:flex; justify-content:space-between; padding:4px 0; color:var(--body); }
  .cart-sum .total{ font-size:22px; font-weight:900; color:var(--ink); border-top:1px dashed var(--line); margin-top:8px; padding-top:12px; }
  .pays{ display:flex; gap:8px; margin:12px 0; } .pays button{ flex:1; border:1px solid var(--line); background:#fff; border-radius:11px; padding:9px; font:inherit; font-size:12px; font-weight:800; color:var(--body); cursor:pointer; } .pays button.on{ background:#fff1f2; border-color:var(--rose); color:var(--rose); }
  /* KPI + grids */
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:20px; }
  .kpi{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px 18px; }
  .kpi .l{ font-size:12px; font-weight:700; color:var(--muted); } .kpi .v{ font-size:27px; font-weight:900; color:var(--ink); margin-top:6px; } .kpi .v small{ font-size:14px; color:var(--muted); } .kpi .d{ font-size:12px; font-weight:800; color:var(--green); margin-top:4px; }
  .grid{ display:grid; gap:18px; } .grid>*{ min-width:0; }
  /* tables (座位圖) */
  .tables{ display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:14px; }
  .tb{ aspect-ratio:1; border-radius:16px; border:2px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-weight:800; color:var(--ink); background:#fff; }
  .tb small{ font-weight:600; color:var(--muted); font-size:11px; }
  .tb.free{ border-color:#bbf7d0; background:#f0fdf4; } .tb.busy{ border-color:#fecaca; background:#fef2f2; color:var(--rose); } .tb.rsv{ border-color:#fde68a; background:#fffbeb; }
  .tb .material-symbols-outlined{ font-size:26px; }
  /* order queue */
  .orders{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; }
  .ord{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px; border-top:4px solid var(--rose); }
  .ord-h{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; } .ord-h b{ color:var(--ink); }
  .badge{ font-size:11px; font-weight:800; border-radius:999px; padding:2px 9px; } .b-din{ background:#ffe4e6; color:var(--rose); } .b-take{ background:#fef3c7; color:#b45309; } .b-del{ background:#e0f2fe; color:#0369a1; }
  .ord ul{ margin:6px 0; padding-left:18px; font-size:13px; color:var(--body); } .ord ul li{ margin:2px 0; }
  .ord-f{ display:flex; align-items:center; justify-content:space-between; margin-top:8px; font-size:12px; color:var(--muted); } .ord-f b{ color:var(--rose); font-size:15px; }
  /* stock */
  .stk{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; }
  .si{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; } .si b{ color:var(--ink); font-size:14px; }
  .bar{ height:8px; border-radius:999px; background:var(--line); overflow:hidden; margin:9px 0 7px; } .bar span{ display:block; height:100%; }
  .si small{ font-size:11px; color:var(--muted); } .lowt{ font-size:10px; font-weight:800; color:var(--rose); background:#ffe4e6; border-radius:6px; padding:2px 7px; }
  /* members */
  .mem{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
  .mc{ background:linear-gradient(135deg,#fff,#fff1f2); border:1px solid var(--line); border-radius:16px; padding:16px; }
  .mc-t{ display:flex; align-items:center; gap:10px; } .mc-av{ width:40px; height:40px; border-radius:50%; background:var(--rose); color:#fff; display:grid; place-content:center; font-weight:800; }
  .mc-t b{ color:var(--ink); } .mc-t small{ display:block; color:var(--muted); font-size:11px; }
  .mc-pts{ margin-top:12px; display:flex; justify-content:space-between; } .mc-pts div span{ font-size:11px; color:var(--muted); display:block; } .mc-pts div b{ color:var(--rose); font-size:18px; }
  .tier{ font-size:10px; font-weight:800; border-radius:999px; padding:2px 9px; } .t-gold{ background:#fef3c7; color:#b45309; } .t-slv{ background:#f1f5f9; color:#475569; }
  .chart{ width:100%; height:280px; }
  @media (max-width:1000px){ .pos3{ grid-template-columns:1fr; } .cart{ position:static; } .catlist{ flex-direction:row; overflow-x:auto; } .grid{ grid-template-columns:1fr !important; } }
</style>
</head>
<body>
<div class="pos">
  <aside class="rail" id="rail"></aside>
  <div class="main">
    <header class="top"><div><h1 id="vt">前台結帳</h1><div class="store">幸福烘焙 · 信義門市 · 收銀台 01</div></div><div class="r"><span class="chip"><span class="material-symbols-outlined" style="font-size:16px;">wifi</span>營業中</span><span class="chip" style="background:#fef3c7;color:#b45309;">今日營收 $38,420</span><span class="ava">店</span></div></header>
    <div class="body" id="view"></div>
  </div>
</div>
<script>
const MODS=[["point_of_sale","結帳"],["table_restaurant","桌位"],["receipt_long","訂單"],["inventory_2","進銷存"],["loyalty","會員"],["insights","日結"]];
const NAMES=["前台結帳","桌位訂位","訂單管理","庫存進銷","會員行銷","日結報表"];
const CATS=[["bakery_dining","麵包"],["cake","蛋糕"],["cookie","餅乾"],["local_cafe","飲品"],["redeem","禮盒"]];
const PROD={0:[["🥐","可頌",55],["🍞","鮮奶吐司",80],["🥖","法國長棍",65],["🥯","貝果",45],["🫓","丹麥酥",70],["🧈","奶油餐包",30],["🍞","全麥吐司",85],["🥖","蒜香法國",60],["🥐","巧克力可頌",68],["🥯","起司貝果",55],["🍞","肉鬆麵包",50],["🍈","菠蘿麵包",45]],1:[["🍰","草莓鮮奶油",120],["🎂","巧克力蛋糕",520],["🧁","杯子蛋糕",60],["🍮","焦糖布丁",45],["🥧","蘋果派",95],["🍩","甜甜圈",40],["🍰","提拉米蘇",130],["🥧","檸檬塔",110],["🧀","重乳酪蛋糕",140],["🎂","黑森林",480],["🍮","抹茶布丁",50],["🧁","紅絲絨杯子",70]],2:[["🍪","手工餅乾",40],["🥨","蝴蝶酥",55],["🍘","馬卡龍",60],["🍬","牛軋餅",75],["🧈","費南雪",50],["🐚","瑪德蓮",48],["🍪","巧克力豆餅",45],["🥜","堅果塔",65]],3:[["☕","美式咖啡",80],["🥤","鮮奶茶",65],["🧃","柳橙汁",70],["☕","拿鐵",90],["☕","卡布奇諾",90],["🧋","紅茶拿鐵",75],["🍫","熱可可",85],["🍵","抹茶拿鐵",95]],4:[["🎁","經典禮盒",680],["🎀","節慶禮盒",980],["💝","喜餅禮盒",1280],["🍼","彌月禮盒",880],["🧺","下午茶組",560]]};
const CART=[["🥐","可頌",55,2],["🍰","草莓鮮奶油",120,1],["☕","美式咖啡",80,1],["🥯","起司貝果",55,2],["🍮","焦糖布丁",45,1]];
const KPI=[["結帳等待","1.9","分鐘","−更快"],["翻桌率","92","%","+22%"],["備料浪費","5.6","%","−63%"],["訂位掌握率","94","%","+45%"]];
const TABLES=[["A1","free"],["A2","busy"],["A3","free"],["A4","rsv"],["A5","busy"],["B1","busy"],["B2","free"],["B3","busy"],["B4","free"],["B5","rsv"],["C1","rsv"],["C2","free"],["C3","busy"],["C4","free"],["C5","busy"],["D1","free"],["D2","busy"],["D3","free"],["VIP1","rsv"],["VIP2","busy"]];
const ORDERS=[["#A238","din","內用 A2",[["可頌","×2"],["拿鐵","×1"]],230,"備餐中"],["#T091","take","外帶",[["草莓蛋糕","×1"],["禮盒","×1"]],800,"待取"],["#D145","del","外送 · foodpanda",[["吐司","×2"],["甜甜圈","×3"]],280,"配送中"],["#A240","din","內用 B1",[["法國長棍","×1"],["美式","×2"]],225,"已上桌"],["#T093","take","外帶",[["蝴蝶酥","×4"]],220,"製作中"],["#A241","din","內用 C1",[["杯子蛋糕","×3"]],180,"待製作"],["#D146","del","外送 · Uber",[["提拉米蘇","×2"],["拿鐵","×2"]],440,"備餐中"],["#T094","take","外帶",[["喜餅禮盒","×1"]],1280,"待取"],["#A242","din","內用 VIP1",[["黑森林","×1"],["卡布","×4"]],840,"用餐中"],["#T095","take","外帶",[["菠蘿麵包","×3"],["柳橙汁","×2"]],275,"製作中"],["#D147","del","外送 · foodpanda",[["起司蛋糕","×1"]],140,"配送中"],["#A243","din","內用 B3",[["費南雪","×6"],["熱可可","×2"]],470,"待製作"]];
const STOCK=[["高筋麵粉",18,40],["低筋麵粉",26,30],["奶油",6,20],["鮮奶",8,15],["草莓",3,12],["巧克力",22,20],["雞蛋",30,25],["酵母",5,8],["砂糖",45,30],["抹茶粉",4,10],["咖啡豆",12,15],["包裝盒",120,80],["鮮奶油",9,18],["起司",7,14]];
const MEMBERS=[["林小美","0912-***-321",2480,"gold"],["陳大文","0928-***-118",860,"slv"],["王詩涵","0955-***-902",5120,"gold"],["李俊宏","0933-***-455",1240,"slv"],["張惠雯","0966-***-733",3300,"gold"],["黃建國","0977-***-201",540,"slv"],["吳雅婷","0910-***-664",1980,"slv"],["劉承翰","0988-***-127",4260,"gold"],["蔡宜蓁","0921-***-508",720,"slv"]];
let cat=0, pay=0;
const money=n=>"$"+n.toLocaleString();
function checkout(){
  const cats=CATS.map((c,i)=>`<button class="${i===cat?"on":""}" data-cat="${i}"><span class="material-symbols-outlined">${c[0]}</span>${c[1]}</button>`).join("");
  const prods=(PROD[cat]||[]).map(p=>`<div class="prod"><div class="ph">${p[0]}</div><div class="info"><b>${p[1]}</b><div class="pr">${money(p[2])}</div></div></div>`).join("");
  const sub=CART.reduce((s,c)=>s+c[2]*c[3],0), tax=Math.round(sub*0.05);
  const items=CART.map(c=>`<div class="ci"><span class="em">${c[0]}</span><div class="nm"><b>${c[1]}</b><small>${money(c[2])}</small></div><div class="qty"><button class="qbtn">−</button><span>${c[3]}</span><button class="qbtn">＋</button></div></div>`).join("");
  return `<div class="pos3">
    <div class="catlist">${cats}</div>
    <div><div class="prods">${prods}</div></div>
    <div class="cart"><div class="cart-h"><b>目前訂單</b><span class="tag">內用 · A2 · 3 件</span></div>${items}
      <div class="cart-sum"><div class="row"><span>小計</span><span>${money(sub)}</span></div><div class="row"><span>營業稅 5%</span><span>${money(tax)}</span></div><div class="row total"><span>應收</span><span>${money(sub+tax)}</span></div></div>
      <div class="pays"><button class="${pay===0?"on":""}" data-pay="0">現金</button><button class="${pay===1?"on":""}" data-pay="1">信用卡</button><button class="${pay===2?"on":""}" data-pay="2">行動支付</button></div>
      <button class="btn block"><span class="material-symbols-outlined">payments</span>結帳 ${money(sub+tax)}</button></div>
  </div>`;
}
const kpiRow=()=>`<div class="kpis">${KPI.map(k=>`<div class="kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}<small>${k[2]}</small></div><div class="d">${k[3]}</div></div>`).join("")}</div>`;
const SCREENS={
 0:checkout,
 1:()=>`<div class="grid" style="grid-template-columns:1.6fr 1fr;"><div class="card"><h3 class="sec"><span class="material-symbols-outlined">table_restaurant</span>座位圖 · 大廳</h3><div class="tables">${TABLES.map(t=>`<div class="tb ${t[1]}"><span class="material-symbols-outlined">${t[1]==="free"?"check_circle":t[1]==="busy"?"restaurant":"bookmark"}</span>${t[0]}<small>${t[1]==="free"?"空桌":t[1]==="busy"?"用餐中":"已訂位"}</small></div>`).join("")}</div></div><div class="card"><h3 class="sec"><span class="material-symbols-outlined">event</span>今日訂位</h3>${["18:00 林小姐 4 位 · A4","18:30 陳先生 2 位 · C1","19:15 王小姐 6 位 · 包廂","20:00 公司聚餐 10 位"].map(r=>`<div style="display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);"><span class="material-symbols-outlined" style="color:var(--rose);">schedule</span><span style="font-size:14px;color:var(--ink);font-weight:600;">${r}</span></div>`).join("")}<button class="btn ghost" style="margin-top:12px;width:100%;justify-content:center;"><span class="material-symbols-outlined">add</span>新增訂位</button></div></div>`,
 2:()=>`<div class="orders">${ORDERS.map(o=>`<div class="ord"><div class="ord-h"><b>${o[0]}</b><span class="badge b-${o[1]}">${o[2]}</span></div><ul>${o[3].map(x=>`<li>${x[0]} ${x[1]}</li>`).join("")}</ul><div class="ord-f"><span>${o[5]}</span><b>${money(o[4])}</b></div></div>`).join("")}</div>`,
 3:()=>`<div class="stk">${STOCK.map(s=>{const pct=Math.min(100,Math.round(s[1]/(s[2]*1.5)*100));const low=s[1]<s[2];return `<div class="si"><div style="display:flex;justify-content:space-between;align-items:center;"><b>${s[0]}</b>${low?'<span class="lowt">叫貨</span>':""}</div><div class="bar"><span style="width:${pct}%;background:${low?"var(--rose)":"var(--green)"};"></span></div><small>庫存 ${s[1]} · 安全量 ${s[2]}</small></div>`;}).join("")}</div>`,
 4:()=>`<div class="mem">${MEMBERS.map(m=>`<div class="mc"><div class="mc-t"><span class="mc-av">${m[0].slice(-1)}</span><div><b>${m[0]}</b><small>${m[1]}</small></div><span class="tier ${m[3]==="gold"?"t-gold":"t-slv"}" style="margin-left:auto;">${m[3]==="gold"?"金卡":"銀卡"}</span></div><div class="mc-pts"><div><span>紅利點數</span><b>${m[2].toLocaleString()}</b></div><div style="text-align:right;"><span>本月消費</span><b style="color:var(--ink);">${money(Math.round(m[2]*1.6))}</b></div></div></div>`).join("")}</div>`,
 5:()=>kpiRow()+`<div class="grid" style="grid-template-columns:1.5fr 1fr;"><div class="card"><h3 class="sec"><span class="material-symbols-outlined">show_chart</span>今日各時段營收</h3><div id="cH" class="chart"></div></div><div class="card"><h3 class="sec"><span class="material-symbols-outlined">pie_chart</span>付款方式佔比</h3><div id="cP" class="chart"></div></div></div><div class="card" style="margin-top:18px;"><h3 class="sec"><span class="material-symbols-outlined">local_fire_department</span>熱銷排行</h3><div class="grid" style="grid-template-columns:1fr;">${[["可頌",312],["鮮奶吐司",245],["草莓鮮奶油",188],["美式咖啡",176],["蝴蝶酥",140]].map((x,i)=>`<div style="display:flex;align-items:center;gap:12px;"><span style="width:26px;height:26px;border-radius:8px;background:#ffe4e6;color:var(--rose);font-weight:900;display:grid;place-content:center;">${i+1}</span><b style="width:120px;color:var(--ink);">${x[0]}</b><div class="bar" style="flex:1;margin:0;"><span style="width:${x[1]/312*100}%;background:var(--rose);"></span></div><span style="font-weight:800;color:var(--ink);">${x[1]} 件</span></div>`).join("")}</div></div>`
};
let charts=[];
function draw(i){charts.forEach(c=>{try{c.dispose();}catch(e){}});charts=[];if(!window.echarts||i!==5)return;
 const h=document.getElementById("cH"); if(h){const c=echarts.init(h);c.setOption({grid:{left:6,right:16,top:20,bottom:6,containLabel:true},tooltip:{trigger:"axis"},xAxis:{type:"category",data:["08","10","12","14","16","18","20"],axisLabel:{color:"#9c8b84"}},yAxis:{type:"value",splitLine:{lineStyle:{color:"#f3e9e2"}},axisLabel:{color:"#9c8b84"}},series:[{type:"bar",data:[2400,5200,8600,4100,3800,7200,7100],itemStyle:{color:"#e11d48",borderRadius:[6,6,0,0]}}]});charts.push(c);}
 const p=document.getElementById("cP"); if(p){const c=echarts.init(p);c.setOption({tooltip:{trigger:"item"},legend:{bottom:0,textStyle:{fontSize:11}},series:[{type:"pie",radius:["46%","72%"],center:["50%","44%"],itemStyle:{borderColor:"#fff",borderWidth:2},label:{show:false},data:[{name:"行動支付",value:44,itemStyle:{color:"#e11d48"}},{name:"信用卡",value:33,itemStyle:{color:"#f59e0b"}},{name:"現金",value:23,itemStyle:{color:"#94a3b8"}}]}]});charts.push(c);}
}
const rail=document.getElementById("rail"),view=document.getElementById("view"),vt=document.getElementById("vt");
rail.innerHTML=`<div class="logo"><span class="material-symbols-outlined">bakery_dining</span></div>`+MODS.map((m,i)=>`<button data-i="${i}" class="${i===0?"on":""}"><span class="material-symbols-outlined">${m[0]}</span>${m[1]}</button>`).join("")+`<div class="sp"></div><button data-i="settings"><span class="material-symbols-outlined">settings</span>設定</button>`;
function show(i){rail.querySelectorAll("button[data-i]").forEach(b=>b.classList.toggle("on",b.dataset.i===String(i)));vt.textContent=NAMES[i];view.innerHTML=SCREENS[i]();draw(i);}
rail.addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(!b||b.dataset.i==="settings")return;show(+b.dataset.i);});
view.addEventListener("click",e=>{const cb=e.target.closest("[data-cat]");if(cb){cat=+cb.dataset.cat;view.innerHTML=SCREENS[0]();return;}const pb=e.target.closest("[data-pay]");if(pb){pay=+pb.dataset.pay;view.innerHTML=SCREENS[0]();}});
window.addEventListener("resize",()=>charts.forEach(c=>c.resize()));
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m)return;var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
</body>
