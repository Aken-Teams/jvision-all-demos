<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>公司治理評鑑與改善追蹤 · 經營治理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&amp;family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&amp;family=Crimson+Pro:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&amp;family=Noto+Sans+TC:wght@400;500;700;900&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;

  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --accent:#0D9488;
  --accent2:#2DD4BF;
  --accent-soft:#CCFBF1;
  --accent-soft2:#99F6E4;
  --bg:#F0FDFA;
  --panel:#FFFFFF;
  --th:#DFF8F5;
  --hov:#ECFEFF;
  --track:#CCFBF1;
  --sidebar:#0F766E;
  --sidebar2:#0F766E;
  --side-edge:#000000;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#0F766E;
  --r:0px;
  --glow:transparent;
}

*{box-sizing:border-box}
html{scroll-behavior:auto}
html,body{margin:0;padding:0;min-width:320px}
body{
  background-color:var(--bg);
  background-image:linear-gradient(rgba(13,148,136,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(13,148,136,.08) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink);
  font-family:"Crimson Pro","Noto Sans TC",serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,[role="button"],a{cursor:pointer}
h1,h2,h3,h4,.brand-txt b,.nav button,.tile b,.pcard b,.lane-row .body b,.rep-row .sku b,.tl-item b,.tl-i b{
  color:var(--ink);
  font-family:"Cormorant Garamond","Noto Sans TC",serif;
  font-weight:700;
  margin:0;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-style:normal;
  font-weight:normal;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
  box-shadow:0 0 0 2px #fff;
}

.app{display:flex;min-height:100vh}
.sidebar{
  background:var(--sidebar);
  border-right:3px solid #000;
  color:#fff;
  display:flex;
  flex:none;
  flex-direction:column;
  height:100vh;
  padding:20px 14px;
  position:sticky;
  top:0;
  width:258px;
  z-index:20;
}
.brand{
  align-items:center;
  border-bottom:3px solid #000;
  display:flex;
  gap:12px;
  margin:-20px -14px 18px;
  min-width:0;
  padding:20px 14px 18px;
}
.brand-logo{
  align-items:center;
  background:var(--color-accent);
  border:3px solid #000;
  color:var(--color-on-accent);
  display:flex;
  flex:none;
  height:46px;
  justify-content:center;
  width:46px;
}
.brand-logo .material-symbols-outlined{font-size:27px}
.brand-txt{min-width:0}
.brand-txt b{color:#fff;display:block;font-size:18px;letter-spacing:.03em;line-height:1.1}
.brand-txt span{
  color:#CCFBF1;
  display:block;
  font-family:"Cinzel","Noto Sans TC",serif;
  font-size:9px;
  font-weight:600;
  letter-spacing:.12em;
  margin-top:5px;
}
.nav{display:flex;flex-direction:column;gap:8px;min-width:0}
.nav button{
  align-items:center;
  background:#fff;
  border:2px solid #000;
  color:var(--ink);
  display:flex;
  font-size:15px;
  font-weight:700;
  gap:10px;
  min-height:46px;
  min-width:0;
  padding:9px 10px;
  text-align:left;
  transition:background-color .18s ease,color .18s ease,transform .18s ease;
  white-space:nowrap;
  width:100%;
}
.nav button:hover{background:var(--color-secondary);color:#000;transform:translate(2px,-2px)}
.nav button.on{
  background:var(--color-accent);
  box-shadow:4px 4px 0 #000;
  color:#000;
  transform:translate(-2px,-2px);
}
.nav button .material-symbols-outlined{flex:none;font-size:21px}
.nav .idx{
  border-left:2px solid currentColor;
  font-family:"Cinzel",monospace;
  font-size:10px;
  margin-left:auto;
  opacity:.8;
  padding-left:8px;
}
.side-foot{
  border-top:2px solid #000;
  color:#CCFBF1;
  font-size:12px;
  line-height:1.65;
  margin-top:auto;
  padding:14px 4px 0;
}
.side-foot b{color:#fff;font-family:"Crimson Pro",monospace}

.main{flex:1;min-width:0;padding:28px 30px 64px}
.topbar{
  align-items:flex-start;
  background:var(--panel);
  border:3px solid #000;
  box-shadow:7px 7px 0 var(--color-primary);
  display:flex;
  flex-wrap:wrap;
  gap:18px;
  justify-content:space-between;
  margin-bottom:24px;
  padding:18px 20px;
}
.topbar h1{align-items:center;display:flex;font-size:clamp(25px,2.5vw,38px);gap:10px;line-height:1.05}
.topbar h1 .material-symbols-outlined{color:var(--color-primary);font-size:30px}
.topbar .sub{color:var(--muted);font-size:14px;font-weight:600;margin-top:7px}
.top-right{align-items:center;display:flex;flex-wrap:wrap;gap:8px}
.chip{
  align-items:center;
  background:var(--color-muted);
  border:2px solid #000;
  color:var(--ink);
  display:inline-flex;
  font-family:"Crimson Pro","Noto Sans TC",serif;
  font-size:13px;
  font-weight:700;
  gap:7px;
  min-height:36px;
  padding:6px 10px;
}
.chip .dot{background:var(--ok);border:2px solid #000;height:10px;width:10px}
.avatar{
  align-items:center;
  background:var(--color-accent);
  border:2px solid #000;
  color:#000;
  display:flex;
  flex:none;
  font-family:"Cinzel","Noto Sans TC",serif;
  font-size:13px;
  font-weight:700;
  height:36px;
  justify-content:center;
  width:36px;
}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{
  background:var(--panel);
  border:2px solid #000;
  border-radius:0;
  box-shadow:5px 5px 0 var(--color-border);
  min-width:0;
}
.card,.sec{padding:18px}
.sec{margin-bottom:16px}
.card.pad0,.card.p0{overflow:hidden;padding:0}
.card-h{
  align-items:center;
  border-bottom:2px solid var(--line);
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:space-between;
  margin:-2px -2px 16px;
  padding:0 2px 12px;
}
.pad0>.card-h{margin:0!important;padding:16px 18px 12px!important}
.card-h h3,.sec>h3{align-items:center;display:flex;font-size:18px;gap:8px}
.card-h h3 .material-symbols-outlined,.sec>h3 .material-symbols-outlined{color:var(--color-primary);font-size:21px}
.card-h .hint{background:var(--color-muted);border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:700;padding:3px 7px}
.sec>h3{margin-bottom:13px}
.sec>p{color:var(--muted);font-size:14px;line-height:1.75;margin:0 0 13px}
.dl{display:grid;font-size:14px;gap:10px 18px;grid-template-columns:136px minmax(0,1fr);margin:0}
.dl dt{color:var(--muted);font-size:13px;font-weight:700}
.dl dd{line-height:1.7;margin:0}

.kpi,.stat{overflow:hidden;padding:16px 17px;position:relative}
.kpi::after{
  background:var(--color-secondary);
  border-bottom:2px solid #000;
  border-left:2px solid #000;
  content:"";
  height:26px;
  position:absolute;
  right:0;
  top:0;
  width:26px;
}
.kpi .ico,.tile .ti{
  align-items:center;
  background:var(--color-primary);
  border:2px solid #000;
  color:#000;
  display:flex;
  height:39px;
  justify-content:center;
  position:relative;
  width:39px;
  z-index:1;
}
.kpi .ico .material-symbols-outlined,.tile .ti .material-symbols-outlined{font-size:21px}
.kpi .lbl,.stat .lbl{align-items:center;color:var(--muted);display:flex;font-size:13px;font-weight:700;gap:5px;margin-top:12px}
.stat .lbl{margin-top:0}
.stat .lbl .material-symbols-outlined{color:var(--color-primary);font-size:16px}
.kpi .val,.stat .val,.tile .tv{
  color:var(--ink);
  font-family:"Cinzel","Crimson Pro",monospace;
  font-size:clamp(23px,2vw,30px);
  font-variant-numeric:tabular-nums lining-nums;
  font-weight:700;
  letter-spacing:-.03em;
  margin-top:3px;
}
.kpi .val small,.stat .val small{color:var(--muted);font-family:"Crimson Pro","Noto Sans TC",serif;font-size:13px;font-weight:700;margin-left:4px}
.kpi .delta,.stat .d{align-items:center;border-bottom:2px solid currentColor;display:inline-flex;font-size:12px;font-weight:700;gap:3px;margin-top:7px;padding-bottom:1px}
.delta.up,.d.up{color:var(--ok)}
.delta.down,.d.down{color:#B91C1C}
.delta.flat,.d.flat{color:var(--muted)}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:15px}

.tile{display:flex;flex-direction:column;gap:8px;padding:17px}
.tile:nth-child(even){box-shadow:5px 5px 0 var(--color-accent)}
.tile b{font-size:17px}
.tile p{color:var(--muted);font-size:13px;font-weight:600;line-height:1.55;margin:0}

.card.pad0>div[style*="overflow-x"]{border-top:2px solid #000}
div[style*="overflow-x"]{scrollbar-color:var(--color-primary) var(--color-muted);scrollbar-width:thin}
table{border-collapse:collapse;font-size:14px;width:100%}
th{
  background:var(--color-primary);
  border-bottom:2px solid #000;
  border-right:1px solid #000;
  color:#000;
  font-family:"Crimson Pro","Noto Sans TC",serif;
  font-size:12px;
  font-weight:700;
  letter-spacing:.04em;
  padding:11px 13px;
  text-align:left;
  white-space:nowrap;
}
th:last-child{border-right:0}
td{
  background:#fff;
  border-bottom:1px solid var(--line);
  color:var(--ink);
  font-variant-numeric:tabular-nums;
  padding:11px 13px;
  white-space:nowrap;
}
tbody tr:nth-child(even) td{background:#F7FFFE}
tbody tr:hover td{background:#CCFBF1}
tr:last-child td{border-bottom:0}
td:nth-child(n+2){text-align:right}
.mono,td:first-child{
  font-family:"Cinzel","Crimson Pro",monospace;
  font-variant-numeric:tabular-nums lining-nums;
  font-weight:600;
  letter-spacing:.01em;
  text-align:left;
}
.tag{
  align-items:center;
  border:1px solid currentColor;
  display:inline-flex;
  font-size:12px;
  font-weight:700;
  gap:4px;
  padding:3px 8px;
  white-space:nowrap;
}
.t-ok{background:#DCFCE7;color:#166534}
.t-warn{background:#FEF3C7;color:#92400E}
.t-bad{background:#FEE2E2;color:#991B1B}
.t-info,.t-acc,.t-pink{background:#CCFBF1;color:#115E59}
.t-gray{background:#E2E8F0;color:#334155}

.bar{background:var(--track);border:1px solid #000;height:10px;min-width:64px;overflow:hidden}
.bar>i{background:var(--color-primary);display:block;height:100%}
.prog{align-items:center;display:flex;gap:8px;min-width:0}
.prog small{color:var(--muted);flex:none;font-family:"Cinzel",monospace;font-size:11px;font-variant-numeric:tabular-nums;font-weight:700;text-align:right;width:40px}

.tl{padding-left:28px;position:relative}
.tl::before{background:#000;bottom:4px;content:"";left:7px;position:absolute;top:4px;width:2px}
.tl-item,.tl-i{padding:0 0 18px;position:relative}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{background:#fff;border:4px solid var(--color-primary);height:15px;left:-28px;position:absolute;top:3px;width:15px}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}
.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}
.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font-family:"Cinzel",monospace;font-size:11px;font-weight:700}
.tl-item b,.tl-i b{display:block;font-size:15px;margin:2px 0}
.tl-item p,.tl-i p{color:var(--muted);font-size:13px;margin:0}

.chk{align-items:center;border-bottom:1px dashed var(--line);display:flex;font-size:14px;gap:9px;padding:9px 2px}
.chk:last-child{border-bottom:0}
.chk .material-symbols-outlined{font-size:20px}
.chk .ok{color:var(--ok)}
.chk .wait{color:var(--muted)}
.chk .bad{color:var(--bad)}
.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}
.chk small{color:var(--muted);font-size:12px}
.note{border-top:1px dashed var(--line);color:var(--muted);font-size:12px;line-height:1.7;margin-top:13px;padding-top:12px}

.board{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr))}
.col{background:var(--color-muted);border:2px solid #000;display:flex;flex-direction:column;gap:10px;padding:11px}
.col-h{align-items:center;display:flex;font-size:14px;font-weight:700;justify-content:space-between;padding:3px 3px 7px}
.col-h .cnt{background:#fff;border:1px solid #000;color:var(--muted);font-family:"Cinzel",monospace;font-size:11px;padding:1px 8px}
.pcard{background:#fff;border:2px solid #000;border-left:7px solid var(--color-primary);padding:11px 12px}
.pcard b{font-size:15px}
.pcard .meta{align-items:center;color:var(--muted);display:flex;font-size:12px;gap:8px;justify-content:space-between;margin-top:5px}
.pcard .who,.who{align-items:center;color:var(--ink);display:inline-flex;font-size:12px;gap:6px;margin-top:8px}
.mini-av,.av{align-items:center;background:var(--color-accent);border:1px solid #000;color:#000;display:flex;flex:none;font-family:"Cinzel",monospace;font-size:10px;font-weight:700;height:21px;justify-content:center;width:21px}
.av{display:inline-flex;height:28px;width:28px}

.lane{display:flex;flex-direction:column;gap:11px}
.lane-row{align-items:center;background:#fff;border:2px solid #000;display:flex;gap:13px;min-width:0;padding:12px 14px}
.lane-row .num{align-items:center;background:var(--color-accent);border:2px solid #000;color:#000;display:flex;flex:none;font-family:"Cinzel",monospace;font-size:13px;font-weight:700;height:34px;justify-content:center;width:34px}
.lane-row .body{flex:1;min-width:0}
.lane-row .body b{font-size:15px}
.lane-row .body p{color:var(--muted);font-size:12px;margin:2px 0 0}
.steps{align-items:center;display:flex;flex:none}
.steps .s{align-items:center;background:#fff;border:2px solid var(--muted);color:var(--muted);display:flex;font-size:11px;height:24px;justify-content:center;width:24px;z-index:1}
.steps .ln{background:var(--line);height:2px;width:20px}
.steps .s.done{background:var(--color-primary);border-color:#000;color:#000}
.steps .s.cur{border:3px double var(--color-primary);color:var(--ink)}
.steps .ln.done{background:var(--color-primary)}

.rep-row{align-items:center;border-bottom:1px dashed var(--line);display:flex;gap:13px;min-width:0;padding:12px 4px}
.rep-row:last-child{border-bottom:0}
.rep-row .sku{flex:1;min-width:0}
.rep-row .sku b{display:block;font-size:15px}
.rep-row .sku span{color:var(--muted);font-size:12px}
.gauge{flex:none;width:110px}
.gauge .track{background:var(--track);border:1px solid #000;height:10px;overflow:hidden;position:relative}
.gauge .track i{background:var(--color-primary);display:block;height:100%}
.gauge small{color:var(--muted);display:block;font-family:"Cinzel",monospace;font-size:10px;margin-top:3px;text-align:right}
.band{background:var(--track);border:1px solid #000;height:28px;min-width:150px;position:relative}
.band .rng{background:var(--accent-soft2);bottom:0;position:absolute;top:0}
.band .mid{background:#000;bottom:-3px;position:absolute;top:-3px;width:2px}
.band .me{background:var(--color-accent);border:2px solid #000;height:22px;position:absolute;top:2px;width:12px}

.apexcharts-canvas text{font-family:"Crimson Pro","Noto Sans TC",serif!important}
.apexcharts-gridline{stroke:var(--line)}
.apexcharts-legend-text{color:var(--muted)!important}

#screen{align-items:start;display:grid;gap:16px;grid-auto-rows:min-content;grid-template-columns:392px minmax(0,1fr)}
#screen>*{grid-column:1/-1;margin-top:0!important}
#screen>.grid.g4:first-child{background:transparent!important;border:0!important;display:grid!important;gap:14px;grid-column:1;grid-row:1;grid-template-columns:repeat(2,minmax(0,1fr))!important;padding:0!important}
#screen>.grid.g4:first-child>*{background:var(--panel)!important;border:2px solid #000!important;border-radius:0!important;box-shadow:5px 5px 0 var(--color-border)!important;flex:none!important;padding:16px!important}
#screen>.grid.g4:first-child>.tile:nth-child(even){box-shadow:5px 5px 0 var(--color-accent)!important}
#screen>.grid.g4:first-child>.tile .ti{height:36px;margin:0;overflow:visible;width:36px}
#screen>*:nth-child(2){grid-column:2;grid-row:1}
#screen>*:nth-child(2).grid{grid-template-columns:minmax(0,1fr)}
#screen>*:nth-child(2)>.card:first-child{min-height:318px}

@media(max-width:1120px){
  #screen{grid-template-columns:minmax(0,1fr)}
  #screen>*,#screen>.grid.g4:first-child,#screen>*:nth-child(2){grid-column:1;grid-row:auto}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{align-items:center;border-bottom:3px solid #000;border-right:0;flex-direction:row;flex-wrap:wrap;height:auto;padding:12px 14px;position:static;width:100%}
  .brand{border:0;margin:0;padding:0 12px 0 0}
  .brand-logo{height:40px;width:40px}
  .side-foot{display:none}
  .nav{display:grid;flex:1;gap:7px;grid-template-columns:repeat(4,minmax(0,1fr))}
  .nav button{justify-content:center;min-height:44px;padding:8px}
  .nav .idx{display:none}
  .main{padding:20px 16px 48px}
  .topbar{box-shadow:5px 5px 0 var(--color-primary)}
}
@media(max-width:768px){
  .g2,.g3,.g23,.g32{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .lane-row{align-items:flex-start;flex-wrap:wrap}
  .steps{margin-left:47px}
}
@media(max-width:560px){
  body{font-size:14px}
  .sidebar{align-items:stretch;display:block}
  .brand{margin-bottom:12px}
  .nav{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nav button{justify-content:flex-start}
  .nav .txt{display:inline}
  .main{padding:16px 10px 40px}
  .topbar{padding:15px}
  .topbar h1{font-size:25px}
  .top-right{width:100%}
  .chip{flex:1;justify-content:center}
  #screen>.grid.g4:first-child,.g4{grid-template-columns:1fr 1fr!important}
  .tile{padding:14px}
  .tile .tv{font-size:20px}
  .card,.sec{padding:15px}
  .rep-row{align-items:flex-start;flex-direction:column}
  .gauge{width:100%}
}
@media(max-width:390px){
  #screen>.grid.g4:first-child,.g4{grid-template-columns:1fr!important}
  .nav button{font-size:13px}
  .top-right .chip:nth-child(2){display:none}
  .dl{gap:2px 0;grid-template-columns:1fr}
  .dl dt{margin-top:9px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto!important}

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

  return '<div class="kpi"><div class="ico"><span class="material-symbols-outlined">'+k.ico+'</span></div>'+
   '<div class="lbl">'+esc(k.lbl)+'</div><div class="val">'+k.val+(k.u?'<small>'+k.u+'</small>':'')+'</div>'+
   '<div class="delta '+k.cls+'"><span class="material-symbols-outlined">'+ic+'</span>'+esc(k.d)+'</div></div>'}).join("")+'</div>'}

function tbl(h,r){return '<div style="overflow-x:auto"><table><thead><tr>'+h.map(function(x){return '<th>'+esc(x)+'</th>'}).join("")+
 '</tr></thead><tbody>'+r.map(function(x){return '<tr>'+x.map(function(c,i){return '<td'+(i===0?' class="mono"':'')+'>'+c+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div>'}
