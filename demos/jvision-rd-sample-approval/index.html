<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>客戶樣品送樣與承認書管理 · PLM 研發管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700&family=Roboto+Mono:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700&family=Roboto+Mono:wght@300;400;500;700&display=swap');

:root{
  --color-primary:#15803D;
  --color-on-primary:#FFFFFF;
  --color-secondary:#22C55E;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDF4;
  --color-foreground:#14532D;
  --color-card:#FFFFFF;
  --color-card-foreground:#14532D;
  --color-muted:#E8F0F1;
  --color-muted-foreground:#475569;
  --color-border:#BBF7D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#15803D;
  --blue:#15803D;
  --ink:#14532D;
  --muted:#475569;
  --line:#BBF7D0;
  --accent:#15803D;
  --accent2:#22C55E;
  --accent-soft:#DCFCE7;
  --accent-soft2:#BBF7D0;
  --bg:#F0FDF4;
  --panel:#FFFFFF;
  --th:#ECFDF3;
  --hov:#F5FFF8;
  --track:#DDEBE2;
  --sidebar:#123B27;
  --sidebar2:#0B2D1D;
  --side-edge:rgba(255,255,255,.14);
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#0369A1;
  --r:20px;
  --shadow-sm:0 2px 8px rgba(20,83,45,.06);
  --shadow-md:0 14px 34px rgba(20,83,45,.10);
  --glow:rgba(34,197,94,.22);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  min-width:320px;
  font-family:"Exo",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;
  line-height:1.5;
  color:var(--ink);
  background:
    radial-gradient(circle at 88% 4%,rgba(34,197,94,.13),transparent 27rem),
    radial-gradient(circle at 12% 92%,rgba(217,119,6,.08),transparent 24rem),
    var(--bg);
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font:inherit}
button,a,[role="button"]{cursor:pointer}
h1,h2,h3,h4{margin:0;font-family:"Exo",system-ui,sans-serif;color:var(--ink);letter-spacing:.01em}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px;border-radius:8px}
::selection{background:#BBF7D0;color:#052E16}

.app{display:flex;min-height:100vh}
.sidebar{
  width:252px;
  flex:none;
  min-width:0;
  position:sticky;
  top:0;
  height:100vh;
  z-index:10;
  display:flex;
  flex-direction:column;
  padding:24px 16px 18px;
  overflow:hidden;
  color:#F0FDF4;
  background:
    radial-gradient(circle at 18% 8%,rgba(34,197,94,.27),transparent 11rem),
    linear-gradient(165deg,var(--sidebar),var(--sidebar2));
  border-right:1px solid var(--side-edge);
  box-shadow:10px 0 30px rgba(6,36,22,.08);
}
.sidebar::after{
  content:"";
  position:absolute;
  right:-76px;
  bottom:9%;
  width:190px;
  height:250px;
  border:1px solid rgba(187,247,208,.13);
  border-radius:72% 28% 64% 36% / 38% 62% 38% 62%;
  transform:rotate(-18deg);
  pointer-events:none;
}
.brand{position:relative;z-index:1;display:flex;align-items:center;gap:12px;min-width:0;padding:2px 8px 24px}
.brand-logo{
  width:44px;
  height:44px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#052E16;
  background:linear-gradient(145deg,#86EFAC,#22C55E);
  border:1px solid rgba(255,255,255,.28);
  border-radius:58% 42% 63% 37% / 42% 55% 45% 58%;
  box-shadow:0 10px 24px rgba(34,197,94,.23);
}
.brand-logo .material-symbols-outlined{font-size:23px}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-size:15px;font-weight:700;letter-spacing:.05em;color:#FFFFFF}
.brand-txt span{display:block;margin-top:2px;font-family:"Roboto Mono",monospace;font-size:9.5px;letter-spacing:.12em;color:#BBF7D0}
.nav{position:relative;z-index:1;display:flex;flex-direction:column;gap:6px;min-width:0;margin-top:4px}
.nav button{
  min-height:46px;
  min-width:0;
  display:flex;
  align-items:center;
  gap:11px;
  padding:11px 12px;
  border:1px solid transparent;
  border-radius:15px 20px 20px 15px;
  background:transparent;
  color:#D1FAE5;
  text-align:left;
  font-size:13.5px;
  font-weight:500;
  white-space:nowrap;
  transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s ease,box-shadow .2s ease;
}
.nav button .material-symbols-outlined{font-size:20px;flex:none}
.nav button:hover{color:#FFFFFF;background:rgba(255,255,255,.09);border-color:rgba(187,247,208,.17);transform:translateX(2px)}
.nav button.on{color:#052E16;background:linear-gradient(110deg,#86EFAC,#4ADE80);border-color:#BBF7D0;box-shadow:0 10px 22px rgba(0,0,0,.17)}
.nav .idx{margin-left:auto;font-family:"Roboto Mono",monospace;font-size:10px;font-weight:700;opacity:.72}
.side-foot{position:relative;z-index:1;margin-top:auto;padding:15px 10px 2px;border-top:1px solid rgba(255,255,255,.13);font-size:10.5px;line-height:1.75;color:#A7F3D0}
.side-foot b{color:#FFFFFF;font-family:"Roboto Mono",monospace}
.main{flex:1;min-width:0;padding:27px clamp(16px,2.5vw,36px) 64px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px;flex-wrap:wrap}
.topbar h1{display:flex;align-items:center;gap:10px;font-size:clamp(20px,2vw,26px);font-weight:700}
.topbar h1 .material-symbols-outlined{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);font-size:22px;background:#FFFFFF;border:1px solid var(--line);border-radius:58% 42% 55% 45% / 45% 55% 45% 55%;box-shadow:var(--shadow-sm)}
.topbar .sub{margin:5px 0 0 51px;font-size:12.5px;color:var(--muted)}
.top-right{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.chip{min-height:34px;display:inline-flex;align-items:center;gap:7px;padding:7px 12px;color:#334155;background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:999px;font-size:11.5px;font-weight:600;box-shadow:var(--shadow-sm)}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(21,128,61,.13);animation:pulse 2.4s ease-in-out infinite}
.avatar{width:36px;height:36px;flex:none;display:flex;align-items:center;justify-content:center;color:#FFFFFF;background:linear-gradient(145deg,#15803D,#22C55E);border:2px solid #FFFFFF;border-radius:52% 48% 66% 34% / 43% 58% 42% 57%;font-weight:700;font-size:12px;box-shadow:var(--shadow-sm)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(21,128,61,.12)}50%{box-shadow:0 0 0 7px rgba(21,128,61,.04)}}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
.card,.sec,.kpi,.stat,.tile{
  min-width:0;
  color:var(--color-card-foreground);
  background:rgba(255,255,255,.94);
  border:1px solid var(--line);
  box-shadow:var(--shadow-sm);
  transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.card:hover,.sec:hover,.kpi:hover,.stat:hover,.tile:hover{border-color:#86EFAC;box-shadow:var(--shadow-md);transform:translateY(-2px)}
.card,.sec{padding:18px;border-radius:22px 18px 24px 17px}
.sec{margin-bottom:16px}
.sec>h3,.card-h h3{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:700}
.sec>h3{margin-bottom:13px}
.sec>h3 .material-symbols-outlined,.card-h h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.sec>p{margin:0 0 13px;font-size:13px;line-height:1.8;color:var(--muted)}
.dl{display:grid;grid-template-columns:136px minmax(0,1fr);gap:10px 18px;margin:0;font-size:13px}
.dl dt{color:var(--muted);font-size:12px;font-weight:600}
.dl dd{margin:0;line-height:1.8}
.card.pad0,.card.p0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card.pad0>.card-h,.card.p0>.card-h{padding:18px 18px 0!important}
.card-h .hint{padding:4px 9px;color:var(--muted);background:var(--th);border-radius:999px;font-size:10.5px;font-weight:600}

.kpi,.stat,.tile{position:relative;overflow:hidden;border-left:4px solid var(--accent);border-radius:8px 22px 22px 8px;padding:17px 18px}
.kpi::before,.stat::before,.tile::before{content:"";position:absolute;right:-30px;top:-42px;width:112px;height:96px;background:rgba(34,197,94,.08);border-radius:64% 36% 59% 41% / 43% 63% 37% 57%;transform:rotate(22deg);pointer-events:none}
.kpi::after{display:none}
.kpi .ico,.tile .ti{position:absolute;right:14px;top:14px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--accent);background:#ECFDF3;border:1px solid #BBF7D0;border-radius:60% 40% 55% 45% / 43% 57% 43% 57%;z-index:1}
.kpi .ico .material-symbols-outlined,.tile .ti .material-symbols-outlined{font-size:20px}
.kpi .lbl,.stat .lbl{position:relative;z-index:1;margin-top:0;padding-right:38px;color:var(--muted);font-size:11.5px;font-weight:600}
.stat .lbl{display:flex;align-items:center;gap:5px}
.stat .lbl .material-symbols-outlined{font-size:15px;color:var(--accent)}
.kpi .val,.stat .val,.tile .tv{position:relative;z-index:1;margin-top:8px;font-family:"Roboto Mono",monospace;font-size:clamp(23px,2vw,29px);font-weight:700;line-height:1.15;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.kpi .val small,.stat .val small{margin-left:4px;color:var(--muted);font-family:"Exo",sans-serif;font-size:12px;font-weight:600;letter-spacing:0}
.kpi .delta,.stat .d{position:relative;z-index:1;margin-top:7px;display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700}
.delta.up,.d.up{color:#166534}.delta.down,.d.down{color:#B91C1C}.delta.flat,.d.flat{color:#475569}
.delta .material-symbols-outlined,.d .material-symbols-outlined{font-size:15px}
.tile{display:flex;flex-direction:column;gap:7px;min-height:140px}
.tile b{padding-right:40px;font-size:13px;font-weight:700}
.tile p{position:relative;z-index:1;margin:0;color:var(--muted);font-size:11.5px;line-height:1.6}

.table-wrap,[style*="overflow-x:auto"]{scrollbar-width:thin;scrollbar-color:#86EFAC #ECFDF3}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;font-variant-numeric:tabular-nums}
th{padding:12px 14px;color:#334155;background:var(--th);border-bottom:1px solid var(--line);text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
th:first-child{padding-left:18px}
th:last-child{padding-right:18px}
td{padding:12px 14px;color:#1F3D2C;background:#FFFFFF;border-bottom:1px solid #DCFCE7;white-space:nowrap;transition:background-color .18s ease}
td:first-child{padding-left:18px}
td:last-child{padding-right:18px}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--hov)}
.mono{font-family:"Roboto Mono",monospace;font-weight:600;letter-spacing:.01em;font-variant-numeric:tabular-nums}
td b{font-family:"Roboto Mono",monospace;font-variant-numeric:tabular-nums}
table:has(th:nth-child(10)) td:nth-child(5),table:has(th:nth-child(10)) td:nth-child(9){text-align:right;font-family:"Roboto Mono",monospace}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border:1px solid transparent;border-radius:999px;font-size:10.5px;font-weight:700;line-height:1.2;white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;flex:none;border-radius:50%;background:currentColor}
.t-ok{color:#166534;background:#DCFCE7;border-color:#86EFAC}
.t-warn{color:#92400E;background:#FEF3C7;border-color:#FCD34D}
.t-bad{color:#B91C1C;background:#FEE2E2;border-color:#FCA5A5}
.t-info{color:#075985;background:#E0F2FE;border-color:#7DD3FC}
.t-gray{color:#475569;background:#F1F5F9;border-color:#CBD5E1}
.t-acc,.t-pink{color:#166534;background:#ECFDF3;border-color:#86EFAC}

.bar{height:8px;min-width:56px;overflow:hidden;background:var(--track);border-radius:999px}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--color-secondary))}
.prog{display:flex;align-items:center;gap:8px;min-width:0}
.prog small{width:42px;flex:none;color:var(--muted);font-family:"Roboto Mono",monospace;font-size:10.5px;font-weight:600;text-align:right}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item,.tl-i{position:relative;padding:0 0 18px}
.tl-item:last-child,.tl-i:last-child{padding-bottom:0}
.tl-dot,.tl-d{position:absolute;left:-25px;top:3px;width:14px;height:14px;background:#FFFFFF;border:3px solid var(--accent);border-radius:55% 45% 58% 42%}
.tl-dot.warn,.tl-d.warn{border-color:var(--warn)}.tl-dot.bad,.tl-d.bad{border-color:var(--bad)}.tl-dot.ok,.tl-d.ok{border-color:var(--ok)}
.tl-time,.tl-t{color:var(--muted);font-family:"Roboto Mono",monospace;font-size:10.5px;font-weight:600}
.tl-item b,.tl-i b{display:block;margin:2px 0;font-size:12.5px}
.tl-item p,.tl-i p{margin:0;color:var(--muted);font-size:11.5px}
.chk{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:12.5px}
.chk:last-child{border-bottom:none}
.chk .material-symbols-outlined{font-size:19px}.chk .ok{color:var(--ok)}.chk .wait{color:var(--muted)}.chk .bad{color:var(--bad)}.chk .warn{color:var(--warn)}
.chk .n{flex:1;min-width:0}.chk small{color:var(--muted);font-size:11px}
.note{margin-top:13px;padding:12px 13px;color:#3F4F46;background:#F7FEF9;border:1px dashed #86EFAC;border-radius:12px;font-size:11.5px;line-height:1.7}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.col{display:flex;flex-direction:column;gap:9px;padding:12px;background:#ECFDF3;border:1px solid var(--line);border-radius:18px 24px 17px 22px}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 6px;font-size:12.5px;font-weight:700}
.col-h .cnt{padding:2px 9px;color:var(--muted);background:#FFFFFF;border:1px solid var(--line);border-radius:999px;font-family:"Roboto Mono",monospace;font-size:10.5px}
.pcard{padding:12px;background:#FFFFFF;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px 16px 16px 8px;box-shadow:var(--shadow-sm)}
.pcard b{font-size:12.5px}.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;color:var(--muted);font-size:10.5px}
.pcard .who{margin-top:8px;color:var(--ink);font-size:11px}
.mini-av,.av{flex:none;display:inline-flex;align-items:center;justify-content:center;color:#166534;background:#DCFCE7;border:1px solid #86EFAC;border-radius:50%;font-weight:700}
.mini-av{width:19px;height:19px;font-size:9px}.av{width:27px;height:27px;font-size:10px}
.who{display:inline-flex;align-items:center;gap:6px}
.lane{display:flex;flex-direction:column;gap:11px}
.lane-row{display:flex;align-items:center;gap:13px;min-width:0;padding:13px 14px;background:#FFFFFF;border:1px solid var(--line);border-radius:14px 20px 20px 14px}
.lane-row .num{width:32px;height:32px;flex:none;display:flex;align-items:center;justify-content:center;color:#FFFFFF;background:var(--accent);border-radius:55% 45% 60% 40%;font-family:"Roboto Mono",monospace;font-size:12px;font-weight:700}
.lane-row .body{flex:1;min-width:0}.lane-row .body b{font-size:13.5px}.lane-row .body p{margin:2px 0 0;color:var(--muted);font-size:11.5px}
.steps{display:flex;align-items:center;flex:none}.steps .s{width:24px;height:24px;z-index:1;display:flex;align-items:center;justify-content:center;color:#64748B;background:#FFFFFF;border:2px solid #CBD5E1;border-radius:50%;font-family:"Roboto Mono",monospace;font-size:10px}.steps .ln{width:20px;height:2px;background:#CBD5E1}.steps .s.done{color:#FFFFFF;background:var(--accent);border-color:var(--accent)}.steps .s.cur{color:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px rgba(21,128,61,.12);animation:pulse 2s ease-in-out infinite}.steps .ln.done{background:var(--accent)}
.rep-row{display:flex;align-items:center;gap:13px;min-width:0;padding:12px 4px;border-bottom:1px dashed var(--line)}.rep-row:last-child{border-bottom:none}.rep-row .sku{flex:1;min-width:0}.rep-row .sku b{display:block;font-size:13px}.rep-row .sku span{color:var(--muted);font-size:11px}.gauge{width:110px;flex:none}.gauge .track{height:8px;overflow:hidden;background:var(--track);border-radius:999px}.gauge .track i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--color-secondary));border-radius:999px}.gauge small{display:block;margin-top:3px;color:var(--muted);font-family:"Roboto Mono",monospace;font-size:10px;text-align:right}
.band{position:relative;height:26px;min-width:150px;background:var(--track);border-radius:999px}.band .rng{position:absolute;top:0;bottom:0;background:#BBF7D0;border-radius:999px}.band .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:#475569}.band .me{position:absolute;top:3px;width:12px;height:20px;background:var(--accent);border-radius:6px;box-shadow:0 2px 7px var(--glow)}

#screen{display:grid;grid-template-columns:400px minmax(0,1fr);grid-auto-rows:min-content;gap:16px;align-items:start}
#screen>*{grid-column:1/-1;margin-top:0!important;animation:reveal .35s ease-out both}
#screen>.grid.g4:first-child{grid-column:1;grid-row:1;display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:13px;background:none!important;border:none!important;padding:0!important}
#screen>.grid.g4:first-child>*{flex:none!important}
#screen>*:nth-child(2){grid-column:2;grid-row:1}
#screen>*:nth-child(2).grid{grid-template-columns:minmax(0,1fr)}
#screen>*:nth-child(2)>.card:first-child{min-height:312px}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:1120px){
  #screen{grid-template-columns:minmax(0,1fr)}
  #screen>*,#screen>.grid.g4:first-child,#screen>*:nth-child(2){grid-column:1;grid-row:auto}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;flex-direction:row;align-items:center;flex-wrap:wrap;padding:12px 14px;gap:7px;border-right:0;border-bottom:1px solid var(--side-edge)}
  .sidebar::after{display:none}
  .brand{padding:0 12px 0 3px}.brand-logo{width:39px;height:39px}.side-foot{display:none}
  .nav{flex:1;flex-direction:row;flex-wrap:wrap;gap:6px;margin-top:0}
  .nav button{min-height:42px;padding:9px 11px}.nav button:hover{transform:none}.nav .idx{display:none}
  .main{padding:20px 16px 48px}
  .topbar .sub{margin-left:0}
}
@media(max-width:820px){.g2,.g3,.g23,.g32{grid-template-columns:1fr}}
@media(max-width:560px){
  .g4,#screen>.grid.g4:first-child{grid-template-columns:1fr 1fr!important}
  .board{grid-template-columns:1fr}
