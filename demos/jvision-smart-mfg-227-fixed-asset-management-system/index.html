<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>固定資產管理系統（Fixed Asset Management System）｜Jvision Demo</title>
<meta name="description" content="資產卡建檔、折舊計算、盤點、異動、維修與報廢處置的單一平台" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#16a34a;--accent2:#4ade80;--ink:#0f2417;--muted:#5b6b60;
  --line:#e3ece6;--bg:#f4f8f5;--card:#ffffff;--soft:#eef6f0;
  --warn:#d97706;--danger:#dc2626;--info:#0891b2;
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;padding:0}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;font-size:20px}
a{color:inherit;text-decoration:none}

/* top nav */
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(100deg,#0f5132,#16a34a);color:#fff;box-shadow:0 2px 10px rgba(15,81,50,.25)}
.topbar-inner{max-width:1360px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:12px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px;white-space:nowrap}
.brand .logo{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center}
.brand small{display:block;font-weight:500;font-size:11px;opacity:.85;letter-spacing:.5px}
.nav{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.nav button{display:flex;align-items:center;gap:7px;border:0;cursor:pointer;background:rgba(255,255,255,.10);color:#fff;padding:8px 13px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:600;transition:.15s;white-space:nowrap}
.nav button:hover{background:rgba(255,255,255,.22)}
.nav button.active{background:#fff;color:#0f5132}
.nav button .material-symbols-outlined{font-size:19px}
.userchip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:600;white-space:nowrap}
.userchip .av{width:26px;height:26px;border-radius:50%;background:var(--accent2);color:#0f5132;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px}

main{max-width:1360px;margin:0 auto;padding:22px 18px 60px}
.screen-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.screen-head h1{margin:0;font-size:22px;font-weight:900;display:flex;align-items:center;gap:9px}
.screen-head h1 .material-symbols-outlined{color:var(--accent);font-size:26px}
.screen-head p{margin:5px 0 0;color:var(--muted);font-size:13.5px}
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--soft);color:var(--accent);border:1px solid var(--line);padding:5px 11px;border-radius:20px;font-size:12px;font-weight:700}

.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.split-73{grid-template-columns:1.9fr 1.1fr}
.split-64{grid-template-columns:1.4fr 1fr}
@media(max-width:820px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .g2,.g3,.split-73,.split-64{grid-template-columns:1fr}
}
@media(max-width:480px){ .kpis{grid-template-columns:1fr} }

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 1px 2px rgba(15,36,23,.03)}
.card h3{margin:0 0 4px;font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:7px}
.card h3 .material-symbols-outlined{color:var(--accent);font-size:20px}
.card .sub{color:var(--muted);font-size:12px;margin:0 0 12px}

.kpi{position:relative;overflow:hidden}
.kpi .lbl{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .val{font-size:27px;font-weight:900;margin-top:4px;letter-spacing:-.5px}
.kpi .val small{font-size:13px;font-weight:700;color:var(--muted)}
.kpi .delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;margin-top:6px}
.kpi .delta.up{color:var(--accent)}
.kpi .delta.down{color:var(--danger)}
.kpi .ic{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:10px;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center}

.chart{width:100%;overflow:hidden}

/* kanban */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:820px){ .board{grid-template-columns:1fr} }
.col{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.col-h{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:13px;margin-bottom:9px;padding:0 3px}
.col-h .cnt{background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 9px;font-size:11.5px;color:var(--muted)}
.kb{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;padding:10px;margin-bottom:9px;box-shadow:0 1px 2px rgba(15,36,23,.04)}
.kb:last-child{margin-bottom:0}
.kb .no{font-size:11px;color:var(--muted);font-weight:700;font-family:"Inter"}
.kb .nm{font-weight:700;font-size:13.5px;margin:2px 0 6px}
.kb .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:11px;color:var(--muted)}
.kb .meta span{background:var(--soft);border-radius:6px;padding:2px 7px}
.kb.warn{border-left-color:var(--warn)}
.kb.info{border-left-color:var(--info)}
.kb.danger{border-left-color:var(--danger)}

/* table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;background:var(--soft)}
tbody tr:hover{background:var(--soft)}
td.num{font-family:"Inter";font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700}
.pill.ok{background:#dcfce7;color:#166534}
.pill.warn{background:#fef3c7;color:#92400e}
.pill.bad{background:#fee2e2;color:#991b1b}
.pill.info{background:#cffafe;color:#155e75}
.pill.grey{background:#eef2f0;color:#5b6b60}
.bar{height:7px;border-radius:6px;background:var(--line);overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 16px 8px}
.tl-item:last-child{padding-bottom:0}
.tl-item .dot{position:absolute;left:-22px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.tl-item.warn .dot{border-color:var(--warn)}
.tl-item.info .dot{border-color:var(--info)}
.tl-item .t{font-weight:800;font-size:13.5px}
.tl-item .d{color:var(--muted);font-size:12.5px;margin-top:2px}
.tl-item .when{font-size:11px;color:var(--accent);font-weight:700;font-family:"Inter"}

.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px}
.dotc{width:10px;height:10px;border-radius:3px;display:inline-block}

.list-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row .ico{width:36px;height:36px;border-radius:9px;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.list-row .body{flex:1;min-width:0}
.list-row .body .r1{font-weight:700;font-size:13.5px}
.list-row .body .r2{color:var(--muted);font-size:12px;margin-top:2px}
.list-row .amt{font-weight:800;font-family:"Inter";white-space:nowrap}

.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
@media(max-width:560px){ .mini{grid-template-columns:1fr} }
.mini .m{background:var(--soft);border-radius:10px;padding:11px 13px}
.mini .m .l{font-size:11.5px;color:var(--muted);font-weight:600}
.mini .m .v{font-size:19px;font-weight:900;margin-top:2px}
.footnote{color:var(--muted);font-size:11.5px;margin-top:14px;text-align:center}
@media(max-width:560px){ .nav button span.txt{display:none} .nav button{padding:8px 10px} }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="logo"><span class="material-symbols-outlined">domain</span></span>
      <span>固定資產管理系統<small>Fixed Asset Management System</small></span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="userchip"><span class="av">會</span><span>會計專員 · 林珮如</span></div>
  </div>
</header>
<main><div id="view"></div></main>

<script>
(function(){
"use strict";

var NAV=[
  {i:0,ic:"inventory_2",t:"資產卡建檔"},
  {i:1,ic:"trending_up",t:"折舊計算"},
  {i:2,ic:"fact_check",t:"資產盤點"},
  {i:3,ic:"account_tree",t:"異動管理"},
  {i:4,ic:"build",t:"維修保養"},
  {i:5,ic:"gavel",t:"報廢處置"}
];

var nav=document.getElementById("nav");
NAV.forEach(function(n){
  var b=document.createElement("button");
  b.setAttribute("data-i",n.i);
  b.innerHTML='<span class="material-symbols-outlined">'+n.ic+'</span><span class="txt">'+n.t+'</span>';
  b.addEventListener("click",function(){location.hash="v"+n.i;});
  nav.appendChild(b);
});

var charts=[];
function clearCharts(){ charts.forEach(function(c){try{c.destroy();}catch(e){}}); charts=[]; }
function mk(id,opt){
  var el=document.getElementById(id); if(!el) return;
  var c=new ApexCharts(el,opt); c.render(); charts.push(c);
}
var BASE={chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:'Inter,"Noto Sans TC",sans-serif'}};
function cfg(o){ o.chart=Object.assign({},BASE.chart,o.chart||{}); return o; }
var GREEN="#16a34a",GREEN2="#4ade80",AMBER="#d97706",CYAN="#0891b2",RED="#dc2626",GREY="#94a3b8";

function head(ic,title,sub,tag){
  return '<div class="screen-head"><div><h1><span class="material-symbols-outlined">'+ic+'</span>'+title+'</h1><p>'+sub+'</p></div>'+(tag?'<div class="tag"><span class="material-symbols-outlined" style="font-size:16px">bolt</span>'+tag+'</div>':'')+'</div>';
}
function kpi(lbl,val,unit,delta,dir,ic){
  return '<div class="card kpi"><div class="ic"><span class="material-symbols-outlined">'+ic+'</span></div>'+
    '<div class="lbl">'+lbl+'</div><div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div>'+
    (delta?'<div class="delta '+dir+'"><span class="material-symbols-outlined" style="font-size:15px">'+(dir==="up"?"trending_up":"trending_down")+'</span>'+delta+'</div>':'')+'</div>';
}

/* ===== screen 0: 資產卡建檔 (KANBAN signature) ===== */
function s0(v){
  var cols=[
    {t:"待建檔",cls:"info",items:[
      {no:"REQ-2408-041",nm:"CNC 五軸加工中心",meta:["機械設備","取得 NT$4,850,000","2026-08-10"],c:"info"},
      {no:"REQ-2408-039",nm:"雷射切割機 LX-8",meta:["機械設備","取得 NT$2,120,000","2026-08-09"],c:"info"}
    ]},
    {t:"編號中",cls:"warn",items:[
      {no:"REQ-2408-036",nm:"堆高機 3.5T 電動",meta:["運輸設備","取得 NT$680,000","待分類"],c:"warn"},
      {no:"REQ-2408-034",nm:"伺服器機櫃 R740",meta:["資訊設備","取得 NT$395,000","待分類"],c:"warn"}
    ]},
    {t:"待覆核",cls:"",items:[
      {no:"FA-A-01288",nm:"空壓機 75HP",meta:["動力設備","NT$540,000","財務經理"],c:""},
      {no:"FA-A-01287",nm:"AGV 搬運車 x2",meta:["自動化設備","NT$1,260,000","財務經理"],c:""}
    ]},
    {t:"已建檔",cls:"",items:[
      {no:"FA-A-01285",nm:"精密量測儀 CMM",meta:["檢測設備","NT$1,880,000","已產生條碼"],c:""},
      {no:"FA-A-01284",nm:"注塑機 220T",meta:["機械設備","NT$3,100,000","已產生條碼"],c:""}
    ]}
  ];
  var board='<div class="board">'+cols.map(function(c){
    return '<div class="col"><div class="col-h"><span>'+c.t+'</span><span class="cnt">'+c.items.length+'</span></div>'+
      c.items.map(function(k){
        return '<div class="kb '+(k.c||'')+'"><div class="no">'+k.no+'</div><div class="nm">'+k.nm+'</div>'+
          '<div class="meta">'+k.meta.map(function(m){return '<span>'+m+'</span>';}).join('')+'</div></div>';
      }).join('')+'</div>';
  }).join('')+'</div>';

  v.innerHTML=head("inventory_2","資產卡建檔","依取得憑證登錄資產卡、產生唯一資產編號與條碼，設定分類、成本與存放地點","看板式建檔流程")+
    '<div class="grid kpis" style="margin-bottom:14px">'+
      kpi("本月新增資產","38","件","+12 件","up","add_box")+
      kpi("待建檔請購","6","件","-3 件","up","pending_actions")+
      kpi("資產卡總數","2,486","筆","","","inventory_2")+
      kpi("本月取得成本","46.8","百萬","+8.5%","up","request_quote")+
    '</div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">view_kanban</span>建檔作業看板</h3><p class="sub">拖動式流程：待建檔 → 編號中 → 待覆核 → 已建檔（示意）</p>'+board+'</div>';
}

/* ===== screen 1: 折舊計算 ===== */
function s1(v){
  v.innerHTML=head("trending_up","折舊計算","依直線法或餘額遞減法設定耐用年限與殘值，系統每月自動提列折舊並累計未折餘額","雙折舊法引擎")+
    '<div class="grid kpis" style="margin-bottom:14px">'+
      kpi("本月折舊費用","1.84","百萬","+2.1%","down","payments")+
      kpi("累計折舊","318.6","百萬","","","stacked_line_chart")+
      kpi("資產淨值","742.3","百萬","-0.9%","down","account_balance")+
      kpi("已全額提列","214","件","+7 件","up","task_alt")+
    '</div>'+
    '<div class="grid split-73" style="margin-bottom:14px">'+
      '<div class="card"><h3><span class="material-symbols-outlined">show_chart</span>折舊法比較（單一資產 12 期）</h3><p class="sub">CNC 五軸加工中心 NT$4,850,000 · 殘值 10% · 8 年</p><div id="c1a" class="chart"></div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>各分類淨值占比</h3><p class="sub">全廠資產帳面淨值分布</p><div id="c1b" class="chart"></div></div>'+
    '</div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">table_rows</span>本月折舊提列明細</h3><p class="sub">依資產卡自動計算，可拋轉總帳傳票</p>'+
    '<div class="tbl-wrap"><table><thead><tr><th>資產編號</th><th>名稱</th><th>方法</th><th>取得成本</th><th>本月折舊</th><th>累計折舊</th><th>淨值</th></tr></thead><tbody>'+
    [["FA-A-01284","注塑機 220T","直線法","3,100,000","32,292","968,750","2,131,250"],
     ["FA-A-01285","精密量測儀 CMM","餘額遞減","1,880,000","23,500","611,000","1,269,000"],
     ["FA-A-01202","空壓機 75HP","直線法","540,000","5,625","236,250","303,750"],
     ["FA-A-01180","堆高機 3.5T","直線法","680,000","9,444","453,333","226,667"],
     ["FA-A-01099","伺服器機櫃","餘額遞減","395,000","6,583","244,000","151,000"]
    ].map(function(r){
      var m=r[2]==="直線法"?'<span class="pill info">'+r[2]+'</span>':'<span class="pill grey">'+r[2]+'</span>';
      return '<tr><td class="num">'+r[0]+'</td><td>'+r[1]+'</td><td>'+m+'</td><td class="num">'+r[3]+'</td><td class="num">'+r[4]+'</td><td class="num">'+r[5]+'</td><td class="num">'+r[6]+'</td></tr>';
    }).join('')+
    '</tbody></table></div></div>';

  void v.offsetHeight;
  mk("c1a",cfg({
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"line",height:300},
    series:[{name:"直線法 淨值",data:[4850,4304,3759,3213,2668,2122,1577,1031,486,485,485,485]},
            {name:"餘額遞減 淨值",data:[4850,3638,2728,2046,1535,1151,863,647,486,485,485,485]}],
    colors:[GREEN,AMBER],stroke:{width:3,curve:"straight"},
    xaxis:{categories:["Q1","Q2","Q3","Q4","Q5","Q6","Q7","Q8","Q9","Q10","Q11","Q12"],labels:{style:{fontSize:"11px"}}},
    yaxis:{labels:{formatter:function(x){return x+"k";},style:{fontSize:"11px"}}},
    dataLabels:{enabled:false},legend:{position:"top",fontSize:"12px"},grid:{borderColor:"#eef6f0"}
  }));
  mk("c1b",cfg({
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"donut",height:300},
    series:[286,198,142,68,48],
    labels:["機械設備","自動化設備","檢測設備","運輸設備","資訊設備"],
    colors:[GREEN,GREEN2,CYAN,AMBER,GREY],
    dataLabels:{enabled:true,formatter:function(x){return x.toFixed(0)+"%";},style:{fontSize:"11px"}},
    legend:{position:"bottom",fontSize:"12px"},
    plotOptions:{pie:{donut:{size:"62%",labels:{show:true,total:{show:true,label:"淨值(百萬)",formatter:function(){return "742.3";}}}}}}
  }));
}

/* ===== screen 2: 資產盤點 ===== */
function s2(v){
  var rows=[
    ["A2-01","CNC 五軸加工中心","1F 加工區","一號廠","已盤","ok"],
    ["A2-02","雷射切割機 LX-8","1F 加工區","一號廠","已盤","ok"],
    ["A2-05","堆高機 3.5T","B1 倉儲","一號廠","盤盈","info"],
    ["A2-07","伺服器機櫃 R740","3F 機房","總部","待查","warn"],
    ["A2-09","精密量測儀 CMM","2F 品保室","二號廠","已盤","ok"],
    ["A2-11","AGV 搬運車 #3","1F 物流","二號廠","盤虧","bad"],
    ["A2-14","空壓機 75HP","B1 動力室","一號廠","已盤","ok"]
  ];
  var mp={ok:"已盤點",info:"盤盈",warn:"待查核",bad:"盤虧"};
  v.innerHTML=head("fact_check","資產盤點","以行動裝置掃描條碼進行盤點，系統即時比對帳面與實物，標記盤盈盤虧與待查資產","條碼即時比對")+
    '<div class="mini">'+
      '<div class="m"><div class="l">盤點進度</div><div class="v">86.4%</div></div>'+

function show(i){
  clearCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){ btns[k].classList.toggle("active",+btns[k].getAttribute("data-i")===i); }
  var v=document.getElementById("view");
  v.innerHTML="";
  SCREENS[i](v);
  var fn=document.createElement("div");
  fn.className="footnote";
  fn.textContent="Jvision 固定資產管理系統 Demo · 純前端示意資料，非真實帳務";
  v.appendChild(fn);
}

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
})();
