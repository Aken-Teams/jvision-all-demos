<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>固定資產管理系統（Fixed Asset Management System）｜Jvision Demo</title>
<meta name="description" content="資產卡建檔、折舊計算、盤點、異動、維修與報廢處置的單一平台" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#0F172A;
  --color-on-primary:#FFFFFF;
  --color-secondary:#1E293B;
  --color-on-secondary:#FFFFFF;
  --color-accent:#22C55E;
  --color-on-accent:#0F172A;
  --color-background:#020617;
  --color-foreground:#F8FAFC;
  --color-card:#0E1223;
  --color-card-foreground:#F8FAFC;
  --color-muted:#1A1E2F;
  --color-muted-foreground:#94A3B8;
  --color-border:#334155;
  --color-destructive:#EF4444;
  --color-on-destructive:#000000;
  --color-ring:#FFFFFF;
  --blue:#22C55E;
  --ink:#F8FAFC;
  --muted:#94A3B8;
  --line:#334155;
  --amber:#FBBF24;
  --cyan:#22D3EE;
  --red:#EF4444;
  --green-soft:#123622;
  --amber-soft:#3A2A0C;
  --red-soft:#3B1218;
  --cyan-soft:#0B3440;
}
*{box-sizing:border-box;min-width:0}
html{color-scheme:dark;scroll-behavior:auto}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  font-family:"Fira Sans",system-ui,sans-serif;
  background:
    linear-gradient(rgba(51,65,85,.14) 1px,transparent 1px),
    linear-gradient(90deg,rgba(51,65,85,.14) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--color-foreground);
  -webkit-font-smoothing:antialiased;
}
button,a{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
  font-size:20px;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(2,6,23,.97);
  color:var(--color-foreground);
  border-bottom:2px solid var(--color-border);
}
.topbar:before{
  content:"";
  position:absolute;
  inset:auto 0 -2px;
  width:26%;
  height:2px;
  background:var(--color-accent);
}
.topbar-inner{
  width:100%;
  max-width:1480px;
  margin:0 auto;
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  align-items:stretch;
  gap:0;
  padding:0 20px;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 22px 12px 0;
  border-right:1px solid var(--color-border);
  font-weight:700;
  font-size:16px;
  white-space:nowrap;
}
.brand .logo{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  color:var(--color-on-accent);
  background:var(--color-accent);
  border:2px solid var(--color-accent);
}
.brand small{
  display:block;
  margin-top:2px;
  color:var(--color-muted-foreground);
  font:500 10px/1.2 "Fira Code",monospace;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.nav{
  display:flex;
  align-items:stretch;
  overflow-x:auto;
  scrollbar-width:thin;
}
.nav button{
  min-height:62px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  flex:1 0 auto;
  border:0;
  border-right:1px solid var(--color-border);
  background:transparent;
  color:#CBD5E1;
  padding:10px 14px;
  font-size:13px;
  font-weight:600;
  white-space:nowrap;
  transition:background-color .16s,color .16s;
}
.nav button:first-child{border-left:0}
.nav button:hover{background:var(--color-muted);color:#FFFFFF}
.nav button.active{
  color:var(--color-on-accent);
  background:var(--color-accent);
}
.nav button.active .material-symbols-outlined{font-variation-settings:"FILL" 1}
.userchip{
  display:flex;
  align-items:center;
  gap:9px;
  padding:10px 0 10px 18px;
  border-left:1px solid var(--color-border);
  color:#CBD5E1;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
}
.userchip .av{
  width:32px;
  height:32px;
  display:grid;
  place-items:center;
  background:var(--color-foreground);
  color:var(--color-background);
  border:2px solid var(--color-foreground);
  font:700 12px "Fira Code",monospace;
}
main{width:100%;max-width:1480px;margin:0 auto;padding:28px 20px 64px}
.screen-head{
  position:relative;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:end;
  gap:24px;
  margin-bottom:22px;
  padding:22px 24px;
  background:var(--color-primary);
  border:2px solid var(--color-border);
  border-left:8px solid var(--color-accent);
}
.screen-head:after{
  content:"SYSTEM / ASSET_LEDGER";
  position:absolute;
  right:20px;
  top:13px;
  color:#64748B;
  font:600 9px "Fira Code",monospace;
  letter-spacing:.14em;
}
.screen-head h1{
  margin:0;
  display:flex;
  align-items:center;
  gap:10px;
  color:#FFFFFF;
  font-size:clamp(22px,3vw,34px);
  font-weight:700;
  line-height:1.1;
  letter-spacing:-.035em;
}
.screen-head h1 .material-symbols-outlined{
  color:var(--color-accent);
  font-size:30px;
}
.screen-head p{
  max-width:850px;
  margin:9px 0 0;
  color:#CBD5E1;
  font-size:13px;
  line-height:1.6;
}
.tag{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:8px 11px;
  color:var(--color-on-accent);
  background:var(--color-accent);
  border:2px solid var(--color-accent);
  font:700 11px "Fira Code",monospace;
  letter-spacing:.02em;
  white-space:nowrap;
}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.split-73{grid-template-columns:minmax(0,1.9fr) minmax(300px,1.1fr)}
.split-64{grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr)}
.card{
  position:relative;
  background:var(--color-card);
  color:var(--color-card-foreground);
  border:1px solid var(--color-border);
  padding:17px;
  box-shadow:7px 7px 0 rgba(15,23,42,.9);
}
.card:before{
  content:"";
  position:absolute;
  left:-1px;
  top:-1px;
  width:42px;
  height:3px;
  background:var(--color-accent);
}
.card h3{
  margin:0 0 5px;
  display:flex;
  align-items:center;
  gap:8px;
  color:#FFFFFF;
  font-size:14px;
  font-weight:700;
  line-height:1.35;
}
.card h3 .material-symbols-outlined{
  color:var(--color-accent);
  font-size:20px;
}
.card .sub{
  margin:0 0 14px;
  color:var(--color-muted-foreground);
  font-size:12px;
  line-height:1.5;
}
.kpi{
  min-height:128px;
  overflow:hidden;
  padding:18px;
}
.kpi:nth-child(even){background:var(--color-muted)}
.kpi .lbl{
  max-width:calc(100% - 48px);
  color:#CBD5E1;
  font-size:12px;
  font-weight:600;
}
.kpi .val{
  margin-top:10px;
  color:#FFFFFF;
  font:700 clamp(24px,3vw,31px)/1 "Fira Code",monospace;
  letter-spacing:-.05em;
  font-variant-numeric:tabular-nums;
}
.kpi .val small{
  color:var(--color-muted-foreground);
  font:600 12px "Fira Sans",sans-serif;
  letter-spacing:0;
}
.kpi .delta{
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin-top:10px;
  padding:3px 6px;
  border:1px solid currentColor;
  font:600 11px "Fira Code",monospace;
}
.kpi .delta.up{color:#4ADE80}
.kpi .delta.down{color:#FCA5A5}
.kpi .ic{
  position:absolute;
  right:14px;
  top:14px;
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  background:var(--color-primary);
  color:var(--color-accent);
  border:1px solid var(--color-border);
}
.chart{width:100%;overflow:hidden}
.board{
  display:grid;
  grid-template-columns:repeat(4,minmax(220px,1fr));
  gap:10px;
  overflow-x:auto;
}
.col{
  padding:10px;
  background:#090D1B;
  border:1px solid var(--color-border);
}
.col-h{
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:33px;
  margin-bottom:9px;
  padding:0 2px 8px;
  border-bottom:2px solid var(--color-border);
  color:#FFFFFF;
  font-size:12px;
  font-weight:700;
  letter-spacing:.04em;
}
.col-h .cnt{
  min-width:26px;
  padding:2px 7px;
  text-align:center;
  background:var(--color-accent);
  color:var(--color-on-accent);
  border:1px solid var(--color-accent);
  font:700 11px "Fira Code",monospace;
}
.kb{
  margin-bottom:9px;
  padding:11px;
  background:var(--color-card);
  border:1px solid var(--color-border);
  border-left:5px solid var(--color-accent);
}
.kb:last-child{margin-bottom:0}
.kb:hover{border-color:#64748B}
.kb .no{
  color:#A7B5C9;
  font:600 10px "Fira Code",monospace;
  letter-spacing:.04em;
}
.kb .nm{
  margin:5px 0 8px;
  color:#FFFFFF;
  font-size:13px;
  font-weight:700;
  line-height:1.35;
}
.kb .meta{display:flex;flex-wrap:wrap;gap:5px;color:#CBD5E1;font-size:10px}
.kb .meta span{
  padding:3px 6px;
  background:var(--color-muted);
  border:1px solid var(--color-border);
}
.kb.warn{border-left-color:var(--amber)}
.kb.info{border-left-color:var(--cyan)}
.kb.danger{border-left-color:var(--red)}
.tbl-wrap{
  overflow-x:auto;
  border:1px solid var(--color-border);
}
table{
  width:100%;
  min-width:620px;
  border-collapse:collapse;
  font-size:12px;
}
th,td{
  padding:11px 12px;
  text-align:left;
  border-right:1px solid var(--color-border);
  border-bottom:1px solid var(--color-border);
  white-space:nowrap;
}
th:last-child,td:last-child{border-right:0}
tbody tr:last-child td{border-bottom:0}
th{
  position:sticky;
  top:0;
  z-index:1;
  color:#E2E8F0;
  background:var(--color-secondary);
  font:700 10px "Fira Code",monospace;
  letter-spacing:.07em;
  text-transform:uppercase;
}
tbody tr:nth-child(even){background:rgba(26,30,47,.65)}
tbody tr:hover{background:#20283A}
td{color:#E2E8F0}
td.num{
  text-align:right;
  color:#FFFFFF;
  font-family:"Fira Code",monospace;
  font-weight:600;
  font-variant-numeric:tabular-nums;
}
td:first-child.num{text-align:left}
.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 8px;
  border:1px solid currentColor;
  font-size:10px;
  font-weight:700;
  line-height:1;
}
.pill:before{
  content:"";
  width:6px;
  height:6px;
  background:currentColor;
}
.pill.ok{background:var(--green-soft);color:#86EFAC}
.pill.warn{background:var(--amber-soft);color:#FDE68A}
.pill.bad{background:var(--red-soft);color:#FCA5A5}
.pill.info{background:var(--cyan-soft);color:#67E8F9}
.pill.grey{background:#252A3B;color:#CBD5E1}
.bar{height:8px;min-width:70px;background:var(--color-muted);border:1px solid var(--color-border);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--color-accent)}
.tl{position:relative;padding-left:28px}
.tl:before{
  content:"";
  position:absolute;
  left:7px;
  top:4px;
  bottom:4px;
  width:2px;
  background:var(--color-border);
}
.tl-item{position:relative;padding:0 0 19px 10px}
.tl-item:last-child{padding-bottom:0}
.tl-item .dot{
  position:absolute;
  left:-28px;
  top:1px;
  width:16px;
  height:16px;
  background:var(--color-card);
  border:4px solid var(--color-accent);
}
.tl-item.warn .dot{border-color:var(--amber)}
.tl-item.info .dot{border-color:var(--cyan)}
.tl-item .t{color:#FFFFFF;font-size:13px;font-weight:700;line-height:1.4}
.tl-item .d{margin-top:4px;color:#CBD5E1;font-size:12px;line-height:1.5}
.tl-item .when{
  margin-top:5px;
  color:#86EFAC;
  font:600 10px "Fira Code",monospace;
}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;color:#CBD5E1;font-size:11px}
.legend span{
  display:flex;
  align-items:center;
  gap:6px;
  padding:4px 7px;
  border:1px solid var(--color-border);
}
.dotc{width:8px;height:8px;display:inline-block}
.list-row{
  display:grid;
  grid-template-columns:38px minmax(0,1fr) auto;
  align-items:center;
  gap:12px;
  padding:12px 4px;
  border-bottom:1px solid var(--color-border);
}
.list-row:last-child{border-bottom:0}
.list-row .ico{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  flex-shrink:0;
  background:var(--color-muted);
  color:var(--color-accent);
  border:1px solid var(--color-border);
}
.list-row .body .r1{color:#FFFFFF;font-size:13px;font-weight:700;line-height:1.4}
.list-row .body .r2{margin-top:3px;color:#A7B5C9;font-size:11px;line-height:1.45}
.list-row .amt{
  color:#FFFFFF;
  font:700 11px "Fira Code",monospace;
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.mini{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:14px;
}
.mini .m{
  position:relative;
  padding:14px 16px;
  background:var(--color-muted);
  border:1px solid var(--color-border);
  border-top:4px solid var(--color-accent);
}
.mini .m:nth-child(2){transform:translateY(7px)}
.mini .m .l{color:#CBD5E1;font-size:11px;font-weight:600}
.mini .m .v{
  margin-top:5px;
  color:#FFFFFF;
  font:700 20px "Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
.footnote{
  margin-top:22px;
  padding-top:14px;
  border-top:1px solid var(--color-border);
  color:var(--color-muted-foreground);
  text-align:center;
  font:500 10px "Fira Code",monospace;
}
#view>*{animation:reveal .35s ease-out both}
@keyframes reveal{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}
.apexcharts-text,.apexcharts-legend-text{fill:#CBD5E1!important;color:#CBD5E1!important}
.apexcharts-gridline{stroke:#334155!important}
.apexcharts-tooltip,.apexcharts-xaxistooltip{
  background:#0F172A!important;
  color:#F8FAFC!important;
  border:1px solid #475569!important;
  box-shadow:none!important;
}
.apexcharts-tooltip-title{background:#1E293B!important;border-bottom:1px solid #475569!important}
@media(max-width:1100px){
  .topbar-inner{grid-template-columns:auto 1fr}
  .userchip{display:none}
  .kpis{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:820px){
  .topbar-inner{display:flex;flex-wrap:wrap;padding:0}
  .brand{width:100%;padding:10px 16px;border-right:0;border-bottom:1px solid var(--color-border)}
  .nav{width:100%}
  .nav button{min-height:52px;padding:9px 12px}
  main{padding:18px 12px 48px}
  .screen-head{grid-template-columns:1fr;padding:20px 16px}
  .screen-head:after{display:none}
  .tag{justify-self:start}
  .g2,.g3,.split-73,.split-64{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(4,260px)}
}
@media(max-width:560px){
  .nav button span.txt{display:none}
  .nav button{min-width:54px;padding:8px}
  .kpis,.mini{grid-template-columns:1fr}
  .mini .m:nth-child(2){transform:none}
  .screen-head h1{align-items:flex-start;font-size:23px}
  .card{padding:14px;box-shadow:4px 4px 0 rgba(15,23,42,.9)}
  .list-row{grid-template-columns:36px minmax(0,1fr)}
  .list-row>div:last-child{grid-column:2;text-align:left!important}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  #view>*{opacity:1;transform:none;animation:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="logo"><span class="material-symbols-outlined" aria-hidden="true">domain</span></span>
      <span>固定資產管理系統<small>Fixed Asset Management System</small></span>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
    <div class="userchip"><span class="av">會</span><span>會計專員 · 林珮如</span></div>
  </div>
</header>
<main><div id="view"></div></main>
<script>
(function(){
"use strict";

var NAV=[
  {i:0,ic:"inventory_2",t:"資產卡建檔"},
  {i:1,ic:"trending_up",t:"折舊計算"},
  {i:2,ic:"fact_check",t:"資產盤點"},
  {i:3,ic:"account_tree",t:"異動管理"},
  {i:4,ic:"build",t:"維修保養"},
  {i:5,ic:"gavel",t:"報廢處置"}
];

var nav=document.getElementById("nav");
NAV.forEach(function(n){
  var b=document.createElement("button");
  b.type="button";
  b.setAttribute("data-i",n.i);
  b.setAttribute("aria-label",n.t);
  b.innerHTML='<span class="material-symbols-outlined" aria-hidden="true">'+n.ic+'</span><span class="txt">'+n.t+'</span>';
  b.addEventListener("click",function(){location.hash="v"+n.i;});
  nav.appendChild(b);
});

var charts=[];
function clearCharts(){
  charts.forEach(function(c){try{c.destroy();}catch(e){}});
  charts=[];
}
function mk(id,opt){
  var el=document.getElementById(id);
  if(!el)return;
  var c=new ApexCharts(el,opt);
  c.render();
  charts.push(c);
}
var BASE={
  chart:{
    redrawOnParentResize:false,
    redrawOnWindowResize:false,
    animations:{enabled:false},
    toolbar:{show:false},
    fontFamily:'"Fira Sans",sans-serif',
    foreColor:"#CBD5E1",
    background:"transparent"
  },
  theme:{mode:"dark"},
  grid:{borderColor:"#334155"},
  tooltip:{theme:"dark"}
};
function cfg(o){
  o.chart=Object.assign({},BASE.chart,o.chart||{});
  o.theme=Object.assign({},BASE.theme,o.theme||{});
  o.tooltip=Object.assign({},BASE.tooltip,o.tooltip||{});
  o.grid=Object.assign({},BASE.grid,o.grid||{});
  return o;
}
var GREEN="#22C55E",GREEN2="#86EFAC",AMBER="#FBBF24",CYAN="#22D3EE",RED="#EF4444",GREY="#64748B";

function head(ic,title,sub,tag){
  return '<div class="screen-head"><div><h1><span class="material-symbols-outlined" aria-hidden="true">'+ic+'</span>'+title+'</h1><p>'+sub+'</p></div>'+
    (tag?'<div class="tag"><span class="material-symbols-outlined" aria-hidden="true" style="font-size:16px">bolt</span>'+tag+'</div>':'')+'</div>';
}
function kpi(lbl,val,unit,delta,dir,ic){
  return '<div class="card kpi"><div class="ic"><span class="material-symbols-outlined" aria-hidden="true">'+ic+'</span></div>'+
    '<div class="lbl">'+lbl+'</div><div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div>'+

      '<div class="card"><h3><span class="material-symbols-outlined" aria-hidden="true">bar_chart</span>報廢原因分布（本年）</h3><p class="sub">依處置原因統計件數</p><div id="c5a" class="chart"></div></div>'+
    '</div>';

  void v.offsetHeight;
  mk("c5a",cfg({
    chart:{type:"bar",height:340},
    series:[{name:"件數",data:[26,17,12,6,3]}],
    plotOptions:{bar:{borderRadius:0,columnWidth:"52%",distributed:true}},
    xaxis:{categories:["超過年限","故障報廢","汰換升級","出售處置","毀損遺失"],labels:{style:{fontSize:"11px"}}},
    yaxis:{labels:{style:{fontSize:"11px"}}},
    dataLabels:{enabled:true,style:{fontSize:"12px",colors:["#F8FAFC"]}},
    legend:{show:false},
    colors:[GREEN,GREEN2,CYAN,AMBER,RED]
  }));
}

var SCREENS=[s0,s1,s2,s3,s4,s5];

function show(i){
  clearCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){
    var active=+btns[k].getAttribute("data-i")===i;
    btns[k].classList.toggle("active",active);
    btns[k].setAttribute("aria-current",active?"page":"false");
  }
  var v=document.getElementById("view");
  v.innerHTML="";
  SCREENS[i](v);
  var fn=document.createElement("div");
  fn.className="footnote";
  fn.textContent="Jvision 固定資產管理系統 Demo · 純前端示意資料，非真實帳務";
  v.appendChild(fn);
}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  if(!m){show(0);return;}
  var n=document.querySelectorAll("[data-i]").length||6;
  show(Math.min(+m[1],n-1));
  try{window.scrollTo(0,0);}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
})();
</script>
