<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>內部控制管理系統 · 內控循環 · 自評 · 缺失改善</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --accent:#ea580c; --accent2:#fb923c; --accent-soft:#fff3ec;
  --ink:#1c1917; --muted:#78716c; --line:#e7e5e4; --bg:#f7f5f4;
  --sidebar:#231a14; --sidebar2:#3a2a1e; --card:#ffffff;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#2563eb;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.app{display:flex; min-height:100vh; align-items:stretch;}
.sidebar{
  width:246px; flex:0 0 246px; background:linear-gradient(180deg,var(--sidebar),var(--sidebar2));
  color:#f5f0eb; padding:22px 16px; display:flex; flex-direction:column; gap:6px;
  position:sticky; top:0; height:100vh; overflow-y:auto; min-width:0;
}
.brand{display:flex; align-items:center; gap:11px; padding:4px 6px 16px; border-bottom:1px solid rgba(255,255,255,.1); margin-bottom:10px;}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 38px;}
.brand .logo .material-symbols-outlined{font-size:22px;}
.brand b{font-size:15px;font-weight:700;letter-spacing:.3px;display:block;font-family:"Noto Sans TC";}
.brand span{font-size:11px;color:#c9bcb0;}
.nav{display:flex;flex-direction:column;gap:4px;min-width:0;}
.navbtn{
  display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:10px;cursor:pointer;
  color:#d8ccc0;font-size:14px;font-weight:500;border:none;background:transparent;width:100%;text-align:left;
  font-family:"Noto Sans TC";transition:background .15s,color .15s;min-width:0;
}
.navbtn .material-symbols-outlined{font-size:21px;flex:0 0 auto;}
.navbtn .nlabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.navbtn .nnum{margin-left:auto;font-size:11px;opacity:.5;flex:0 0 auto;}
.navbtn:hover{background:rgba(255,255,255,.07);color:#fff;}
.navbtn.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px -6px rgba(234,88,12,.6);}
.navbtn.on .nnum{opacity:.85;}
.sidefoot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:#a89a8d;line-height:1.6;}
.main{flex:1 1 auto;min-width:0;padding:26px 30px 60px;}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px;min-width:0;}
.topbar h1{font-size:21px;margin:0;font-family:"Noto Sans TC";font-weight:700;min-width:0;}
.topbar .sub{color:var(--muted);font-size:13px;}
.pill{margin-left:auto;display:inline-flex;align-items:center;gap:7px;background:var(--accent-soft);color:var(--accent);padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:600;}
.pill .material-symbols-outlined{font-size:17px;}
.grid{display:grid;gap:16px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:2fr 1fr;}
.g32{grid-template-columns:1fr 2fr;}
@media(max-width:820px){
  .g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr;}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0;box-shadow:0 1px 2px rgba(28,25,23,.03);}
.card h3{margin:0 0 4px;font-size:15px;font-family:"Noto Sans TC";font-weight:700;display:flex;align-items:center;gap:8px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
.card .cap{font-size:12px;color:var(--muted);margin:0 0 14px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 17px;min-width:0;position:relative;overflow:hidden;}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent),var(--accent2));}
.kpi .klab{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.kpi .klab .material-symbols-outlined{font-size:16px;color:var(--accent);}
.kpi .kval{font-size:27px;font-weight:800;margin-top:7px;letter-spacing:-.5px;font-family:"Inter";}
.kpi .kval small{font-size:14px;font-weight:600;color:var(--muted);margin-left:3px;}
.kpi .kfoot{font-size:11.5px;margin-top:6px;display:flex;align-items:center;gap:4px;}
.kpi .kfoot .material-symbols-outlined{font-size:15px;}
.up{color:var(--ok);} .down{color:var(--bad);} .flat{color:var(--muted);}
.tblwrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line);}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px;}
th,td{padding:10px 13px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
th{background:#faf8f7;color:var(--muted);font-weight:600;font-size:12px;}
tbody tr:last-child td{border-bottom:none;}
tr:hover td{background:#fdfaf8;}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;}
.b-ok{background:#dcfce7;color:#15803d;} .b-warn{background:#fef3c7;color:#b45309;}
.b-bad{background:#fee2e2;color:#b91c1c;} .b-info{background:#dbeafe;color:#1d4ed8;}
.b-mute{background:#f1f0ef;color:#57534e;} .b-acc{background:var(--accent-soft);color:var(--accent);}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.bar{height:8px;border-radius:5px;background:#f1efed;overflow:hidden;min-width:80px;}
.bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.chartbox{position:relative;overflow:hidden;}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;min-width:0;}
@media(max-width:820px){.board{grid-template-columns:1fr;}}
.col{background:#faf8f7;border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0;}
.col .chd{font-size:12.5px;font-weight:700;font-family:"Noto Sans TC";margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
.col .chd .cnt{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11px;color:var(--muted);}
.ticket{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;padding:10px 11px;margin-bottom:9px;font-size:12.5px;}
.ticket .tt{font-weight:600;font-family:"Noto Sans TC";}
.ticket .tm{color:var(--muted);font-size:11px;margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.tl{position:relative;padding-left:26px;}
.tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl .ev{position:relative;padding:0 0 18px 6px;}
.tl .ev::before{content:"";position:absolute;left:-21px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid var(--accent);}
.tl .ev.done::before{background:var(--accent);}
.tl .ev .et{font-weight:700;font-family:"Noto Sans TC";font-size:13.5px;}
.tl .ev .ed{font-size:12px;color:var(--muted);margin-top:2px;}
.tl .ev .em{font-size:11px;color:#a8a29e;margin-top:3px;}
.lrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0;}
.lrow:last-child{border-bottom:none;}
.lrow .ic{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 34px;}
.lrow .ic .material-symbols-outlined{font-size:19px;}
.lrow .lt{font-size:13px;font-weight:600;font-family:"Noto Sans TC";min-width:0;}
.lrow .ls{font-size:11.5px;color:var(--muted);}
.lrow .lend{margin-left:auto;text-align:right;font-size:12px;flex:0 0 auto;}
.doc{border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.doc .dh{background:var(--sidebar);color:#fff;padding:16px 18px;}
.doc .dh b{font-size:16px;font-family:"Noto Sans TC";}
.doc .dh span{font-size:12px;color:#c9bcb0;display:block;margin-top:3px;}
.doc .db{padding:16px 18px;font-size:13px;color:#44403c;}
.doc .db p{margin:0 0 10px;}
.signrow{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;}
.sign{flex:1 1 150px;min-width:0;border:1px dashed var(--line);border-radius:10px;padding:11px 13px;}
.sign span{font-size:11px;color:var(--muted);}
.sign b{font-size:13.5px;font-family:"Noto Sans TC";display:block;margin-top:3px;}
.sign .sk{font-size:11px;color:var(--accent);font-weight:600;margin-top:4px;display:flex;align-items:center;gap:4px;}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.chip{background:#faf8f7;border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:12px;min-width:0;}
.chip b{color:var(--accent);}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
@media(max-width:860px){
  .app{flex-direction:column;}
  .sidebar{width:100%;flex:0 0 auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px;gap:8px;}
  .brand{border-bottom:none;margin:0;padding:0 10px 0 0;flex:0 0 auto;}
  .nav{flex-direction:row;flex-wrap:wrap;flex:1 1 100%;gap:6px;}
  .navbtn{width:auto;padding:8px 12px;}
  .navbtn .nnum{display:none;}
  .sidefoot{display:none;}
  .main{padding:20px 16px 50px;}
}
@media(max-width:560px){
  .navbtn .nlabel{display:none;}
  .navbtn{padding:9px 11px;}
  .brand span{display:none;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">verified_user</span></div>
      <div><b>內控管理平台</b><span>Internal Control System</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">
      稽核室 · 財務部 · 法務部<br/>與稽核系統 / ERM / ERP 同步<br/>年度自評週期 2026 Q3
    </div>
  </aside>
  <main class="main">
    <div id="screen"></div>
  </main>
</div>

<script>
"use strict";
var MODS=[
  {icon:"account_tree", label:"循環盤點",  title:"內控循環盤點", sub:"循環與作業流程文件版本控管"},
  {icon:"fact_check",   label:"自評問卷",  title:"自我評估問卷 (RCSA)", sub:"控制自我評估問卷派發與執行"},
  {icon:"warning",      label:"缺失登錄",  title:"內控缺失登錄", sub:"缺失分級登錄與風險評估"},
  {icon:"build",        label:"改善追蹤",  title:"缺失改善追蹤", sub:"改善行動計畫與完成率追蹤"},
  {icon:"verified",     label:"覆核確認",  title:"稽核覆核確認", sub:"覆核與證據佐證留痕"},
  {icon:"gavel",        label:"聲明書",    title:"內控聲明書產出", sub:"聲明書彙整與簽核產出"}
];
var chartRef=null;
function destroyChart(){ if(chartRef){ try{chartRef.destroy();}catch(e){} chartRef=null; } }
function esc(s){return String(s).replace(/[&<>]/g,function(c){return c==="&"?"&amp;":c==="<"?"&lt;":"&gt;";});}
function bar(p){return '<div class="bar"><i style="width:'+Math.max(0,Math.min(100,p))+'%"></i></div>';}

function s0(){
  var cycles=[
    {c:"銷售與收款循環", code:"C-01", docs:12, ver:"v4.2", ctrl:18, own:"稽核室", upd:"2026-07-28", st:"已核定", cls:"b-ok"},
    {c:"採購與付款循環", code:"C-02", docs:15, ver:"v3.8", ctrl:22, own:"財務部", upd:"2026-08-02", st:"審核中", cls:"b-warn"},
    {c:"生產與存貨循環", code:"C-03", docs:20, ver:"v5.1", ctrl:27, own:"稽核室", upd:"2026-08-06", st:"已核定", cls:"b-ok"},
    {c:"薪工循環",       code:"C-04", docs:8,  ver:"v2.6", ctrl:11, own:"人資部", upd:"2026-07-15", st:"待更新", cls:"b-bad"},
    {c:"融資循環",       code:"C-05", docs:9,  ver:"v3.0", ctrl:13, own:"財務部", upd:"2026-08-04", st:"已核定", cls:"b-ok"},
    {c:"固定資產循環",   code:"C-06", docs:10, ver:"v2.9", ctrl:14, own:"總務部", upd:"2026-07-22", st:"審核中", cls:"b-warn"},
    {c:"投資循環",       code:"C-07", docs:7,  ver:"v1.8", ctrl:9,  own:"財務部", upd:"2026-06-30", st:"待更新", cls:"b-bad"}
  ];
  var rows=cycles.map(function(x){
    return '<tr><td><b>'+esc(x.code)+'</b></td><td>'+esc(x.c)+'</td><td>'+x.docs+' 份</td>'+
      '<td><span class="badge b-acc">'+esc(x.ver)+'</span></td><td>'+x.ctrl+'</td><td>'+esc(x.own)+'</td>'+
      '<td>'+esc(x.upd)+'</td><td><span class="badge '+x.cls+'">'+esc(x.st)+'</span></td></tr>';
  }).join("");
  return head(0)+
  '<div class="grid g4" style="margin-bottom:16px">'+
    kpi("account_tree","內控循環","7","個循環納入盤點","flat","account_tree","涵蓋全公司")+
    kpi("description","控制文件","81","份現行版本文件","up","trending_up","本季新增 6 份")+
    kpi("rule","控制點","114","項控制活動","flat","checklist","對應風險 96 項")+
    kpi("warning","待更新版本","2","循環文件逾期","down","priority_high","需 8/20 前更新")+
  '</div>'+
  '<div class="grid g23">'+
    '<div class="card"><h3><span class="material-symbols-outlined">table_chart</span>內控循環文件盤點清單</h3>'+
      '<p class="cap">各循環現行文件版本、控制點數與盤點狀態</p>'+
      '<div class="tblwrap"><table><thead><tr><th>代號</th><th>內控循環</th><th>文件</th><th>版本</th><th>控制點</th><th>負責單位</th><th>最後更新</th><th>盤點狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
      '<div class="legend"><span><span class="badge b-ok">已核定</span>版本已確認</span><span><span class="badge b-warn">審核中</span>覆核進行中</span><span><span class="badge b-bad">待更新</span>逾期需更新</span></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>控制點分布</h3>'+
      '<p class="cap">各循環控制活動占比</p>'+
      '<div class="chartbox" style="height:260px"><canvas id="c0a"></canvas></div></div>'+
  '</div>';
}
function s0chart(){
  var el=document.getElementById("c0a"); if(!el) return;
  chartRef=new Chart(el,{type:"doughnut",
    data:{labels:["生產與存貨","採購與付款","銷售與收款","固定資產","融資","薪工","投資"],
      datasets:[{data:[27,22,18,14,13,11,9],backgroundColor:["#ea580c","#fb923c","#f59e0b","#fdba74","#fbbf24","#fed7aa","#c2410c"],borderWidth:2,borderColor:"#fff"}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:"58%",plugins:{legend:{position:"right",labels:{boxWidth:12,font:{size:11}}}}}});
}

function s1(){
  var q=[
    {dept:"銷售部",  total:24, done:24, no:3, rate:100},
    {dept:"採購部",  total:28, done:25, no:5, rate:89},
    {dept:"生產部",  total:32, done:28, no:6, rate:88},
    {dept:"財務部",  total:22, done:22, no:1, rate:100},
    {dept:"人資部",  total:14, done:9,  no:2, rate:64},
    {dept:"資訊部",  total:18, done:12, no:4, rate:67}
  ];
  var rows=q.map(function(x){
    var cls=x.rate>=95?"b-ok":x.rate>=80?"b-warn":"b-bad";
    return '<tr><td><b>'+esc(x.dept)+'</b></td><td>'+x.total+'</td><td>'+x.done+'</td>'+
      '<td>'+(x.total-x.done)+'</td><td><span class="badge b-bad">'+x.no+'</span></td>'+
      '<td style="min-width:150px">'+bar(x.rate)+'</td><td><span class="badge '+cls+'">'+x.rate+'%</span></td></tr>';
  }).join("");
  return head(1)+
  '<div class="grid g4" style="margin-bottom:16px">'+
    kpi("fact_check","問卷派發","138","項自評問卷","flat","send","6 個部門")+
    kpi("task_alt","已回覆","120","項完成作答","up","trending_up","覆蓋率 87%")+
    kpi("rule","不符合項","21","項需登錄缺失","down","priority_high","占 17.5%")+
    kpi("groups","控制負責人","34","位參與自評","flat","groups","全數已指派")+
  '</div>'+
  '<div class="grid g32">'+
    '<div class="card"><h3><span class="material-symbols-outlined">insights</span>自評結果分布</h3>'+
      '<p class="cap">各構面符合 / 部分符合 / 不符合</p>'+
      '<div class="chartbox" style="height:240px"><canvas id="c1a"></canvas></div>'+
      '<div class="legend"><span><span class="dot" style="background:#16a34a"></span>符合 99</span><span><span class="dot" style="background:#fb923c"></span>部分符合 18</span><span><span class="dot" style="background:#dc2626"></span>不符合 21</span></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">groups</span>各部門自評進度</h3>'+
      '<p class="cap">問卷完成率與不符合項數</p>'+
      '<div class="tblwrap"><table><thead><tr><th>部門</th><th>題數</th><th>已答</th><th>未答</th><th>不符合</th><th>完成率</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
  '</div>';
}
function s1chart(){
  var el=document.getElementById("c1a"); if(!el) return;
  chartRef=new Chart(el,{type:"bar",
    data:{labels:["設計面","執行面","文件面","覆核面"],
      datasets:[
        {label:"符合",data:[30,26,24,19],backgroundColor:"#16a34a",stack:"a"},
        {label:"部分符合",data:[5,6,4,3],backgroundColor:"#fb923c",stack:"a"},
        {label:"不符合",data:[4,7,6,4],backgroundColor:"#dc2626",stack:"a"}
      ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:11}}}},
      scales:{x:{stacked:true,grid:{display:false},ticks:{font:{size:11}}},y:{stacked:true,beginAtZero:true,ticks:{font:{size:11}}}}}});
}

function s2(){
  var defs=[
    {id:"D-2601", t:"應收帳齡覆核未每月執行", cyc:"銷售與收款", lv:"高", cls:"b-bad", src:"稽核發現", own:"財務部", due:"2026-08-25"},
    {id:"D-2602", t:"採購請款未落實三方比對", cyc:"採購與付款", lv:"高", cls:"b-bad", src:"自評不符合", own:"採購部", due:"2026-08-22"},
    {id:"D-2603", t:"存貨盤點差異調整權限過大", cyc:"生產與存貨", lv:"中", cls:"b-warn", src:"稽核發現", own:"生產部", due:"2026-09-05"},

function kpi(icon,lab,val,unit,dir,dico,foot,valsmall){

function buildNav(){
  var nav=document.getElementById("nav");
  nav.innerHTML=MODS.map(function(m,i){
    return '<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+esc(m.icon)+'</span>'+
      '<span class="nlabel">'+esc(m.label)+'</span><span class="nnum">'+(i+1)+'</span></button>';
  }).join("");
  var btns=nav.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){
    (function(b){b.addEventListener("click",function(){ location.hash="go="+b.getAttribute("data-i"); });})(btns[k]);
  }
}
function show(i){
  destroyChart();
  var container=document.getElementById("screen");
  container.innerHTML=RENDER[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){ btns[k].classList.toggle("on", +btns[k].getAttribute("data-i")===i); }
  void container.offsetHeight;
  if(CHARTS[i]) CHARTS[i]();
}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
