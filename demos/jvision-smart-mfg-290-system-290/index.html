<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>內部控制管理系統 · 內控循環 · 自評 · 缺失改善</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#2DD4BF;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#5EEAD4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;
  --blue:#0D9488;
  --ink:#134E4A;
  --muted:#475569;
  --line:#5EEAD4;
  --bg:#F0FDFA;
  --sidebar:#082F2D;
  --sidebar2:#134E4A;
  --card:#FFFFFF;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#DC2626;
  --info:#1D4ED8;
  --accent:#D97706;
  --accent2:#2DD4BF;
  --accent-soft:#FEF3C7;
  --border-heavy:2px solid #134E4A;
  --shadow:6px 6px 0 #134E4A;
}
*{box-sizing:border-box;}
html{scroll-behavior:auto;}
html,body{margin:0;padding:0;min-width:320px;}
body{
  background-color:var(--color-background);
  background-image:linear-gradient(rgba(13,148,136,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(13,148,136,.08) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Crimson Pro","Noto Serif TC","Times New Roman",serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;}
button,a,[data-i]{cursor:pointer;}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:4px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
.app{display:flex;min-height:100vh;align-items:stretch;}
.sidebar{
  width:268px;
  flex:0 0 268px;
  min-width:0;
  height:100vh;
  position:sticky;
  top:0;
  z-index:10;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:24px 18px;
  color:#F0FDFA;
  background:var(--sidebar);
  border-right:4px solid var(--color-accent);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
  padding:0 0 20px;
  border-bottom:2px solid var(--color-secondary);
}
.brand .logo{
  width:48px;
  height:48px;
  flex:0 0 48px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--color-on-accent);
  background:var(--color-accent);
  border:2px solid #000;
  box-shadow:4px 4px 0 var(--color-secondary);
}
.brand .logo .material-symbols-outlined{font-size:27px;}
.brand b{
  display:block;
  color:#FFF;
  font-family:"Cinzel","Noto Serif TC",serif;
  font-size:15px;
  font-weight:600;
  letter-spacing:.04em;
}
.brand span{font-size:12px;color:#CCFBF1;}
.nav{display:flex;flex-direction:column;gap:8px;min-width:0;}
.navbtn{
  width:100%;
  min-width:0;
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 12px;
  border:2px solid transparent;
  border-radius:0;
  background:transparent;
  color:#CCFBF1;
  text-align:left;
  font-family:"Crimson Pro","Noto Serif TC",serif;
  font-size:16px;
  font-weight:600;
  transition:background-color .18s ease,color .18s ease,transform .18s ease,border-color .18s ease;
}
.navbtn .material-symbols-outlined{font-size:22px;flex:0 0 auto;}
.navbtn .nlabel{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.navbtn .nnum{
  margin-left:auto;
  color:#99F6E4;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:12px;
}
.navbtn:hover{color:#000;background:var(--color-secondary);border-color:#000;transform:translate(-2px,-2px);}
.navbtn.on{color:#000;background:var(--color-accent);border-color:#000;box-shadow:4px 4px 0 var(--color-secondary);}
.navbtn.on .nnum{color:#000;}
.sidefoot{
  margin-top:auto;
  padding-top:18px;
  border-top:2px solid var(--color-secondary);
  color:#CCFBF1;
  font-size:12px;
  line-height:1.7;
}
.main{flex:1 1 auto;min-width:0;padding:32px clamp(18px,3vw,48px) 64px;}
#screen{max-width:1500px;margin:0 auto;animation:screen-in .36s ease-out both;}
@keyframes screen-in{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
.topbar{
  position:relative;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:4px 22px;
  align-items:end;
  min-width:0;
  margin:0 0 28px;
  padding:22px 24px 20px;
  background:var(--color-card);
  border:var(--border-heavy);
  box-shadow:var(--shadow);
}
.topbar::before{
  content:"CONTROL / OVERSIGHT";
  position:absolute;
  top:-13px;
  left:20px;
  padding:3px 9px;
  color:#000;
  background:var(--color-secondary);
  border:2px solid var(--ink);
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:10px;
  font-weight:700;
  letter-spacing:.1em;
}
.topbar h1{
  min-width:0;
  margin:0;
  color:var(--color-card-foreground);
  font-family:"Cormorant Garamond","Noto Serif TC",serif;
  font-size:clamp(28px,3vw,44px);
  font-weight:700;
  line-height:1;
  letter-spacing:-.02em;
}
.topbar .sub{grid-column:1;color:var(--muted);font-size:15px;}
.pill{
  grid-column:2;
  grid-row:1 / span 2;
  align-self:center;
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:10px 14px;
  color:#000;
  background:var(--color-accent);
  border:2px solid #000;
  border-radius:0;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
}
.pill .material-symbols-outlined{font-size:18px;}
.grid{display:grid;gap:18px;min-width:0;}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g23{grid-template-columns:minmax(0,2fr) minmax(300px,1fr);}
.g32{grid-template-columns:minmax(300px,1fr) minmax(0,2fr);}
.card,.kpi{
  min-width:0;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:var(--border-heavy);
  border-radius:0;
}
.card{padding:21px;box-shadow:4px 4px 0 rgba(19,78,74,.28);}
.card:nth-child(even){transform:translateY(6px);}
.card h3{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0 0 4px;
  font-family:"Cormorant Garamond","Noto Serif TC",serif;
  font-size:21px;
  font-weight:700;
  line-height:1.15;
}
.card h3 .material-symbols-outlined{
  padding:5px;
  color:#000;
  background:var(--color-secondary);
  border:1px solid var(--ink);
  font-size:19px;
}
.card .cap{margin:0 0 16px;color:var(--muted);font-size:14px;}
.kpi{
  position:relative;
  overflow:hidden;
  padding:18px 18px 16px;
  box-shadow:4px 4px 0 var(--color-border);
}
.kpi:nth-child(2n){border-top:7px solid var(--color-primary);}
.kpi:nth-child(2n+1){border-top:7px solid var(--color-accent);}
.kpi .klab{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:14px;font-weight:600;}
.kpi .klab .material-symbols-outlined{color:var(--color-primary);font-size:18px;}
.kpi .kval{
  margin-top:6px;
  color:var(--ink);
  font-family:"Cormorant Garamond",Georgia,serif;
  font-size:clamp(34px,3vw,45px);
  font-variant-numeric:tabular-nums lining-nums;
  font-weight:700;
  line-height:1;
  letter-spacing:-.02em;
}
.kpi .kval small{margin-left:4px;color:var(--muted);font-size:15px;font-weight:600;letter-spacing:0;}
.kpi .kfoot{display:flex;align-items:center;gap:5px;margin-top:10px;font-size:13px;font-weight:600;}
.kpi .kfoot .material-symbols-outlined{font-size:17px;}
.up{color:var(--ok);}.down{color:#B91C1C;}.flat{color:var(--muted);}
.tblwrap{overflow-x:auto;border:2px solid var(--ink);border-radius:0;background:#FFF;}
table{width:100%;min-width:600px;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;}
th,td{padding:11px 13px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;}
th:last-child,td:last-child{border-right:0;}
th{
  color:#062E2B;
  background:var(--color-secondary);
  font-family:"Cinzel","Noto Serif TC",serif;
  font-size:12px;
  font-weight:600;
  letter-spacing:.025em;
}
tbody tr:last-child td{border-bottom:0;}
tbody tr:nth-child(even) td{background:#F0FDFA;}
tbody tr:hover td{background:#FEF3C7;}
td:first-child,td:last-child{
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-variant-numeric:tabular-nums;
}
td:nth-child(n+3){text-align:right;}
th:nth-child(n+3){text-align:right;}
td[style*="white-space:normal"]{text-align:left;}
.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:0;
  font-family:"Crimson Pro","Noto Serif TC",serif;
  font-size:12px;
  font-weight:600;
  line-height:1.25;
  white-space:nowrap;
}
.b-ok{color:#166534;background:#DCFCE7;}.b-warn{color:#92400E;background:#FEF3C7;}
.b-bad{color:#991B1B;background:#FEE2E2;}.b-info{color:#1E40AF;background:#DBEAFE;}
.b-mute{color:#334155;background:#E2E8F0;}.b-acc{color:#713F12;background:#FDE68A;}
.dot{width:9px;height:9px;display:inline-block;border:1px solid currentColor;border-radius:0;}
.bar{height:10px;min-width:80px;overflow:hidden;background:var(--color-muted);border:1px solid var(--ink);border-radius:0;}
.bar>i{display:block;height:100%;background:var(--color-primary);border-radius:0;}
.chartbox{position:relative;overflow:hidden;}
.board{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:12px;min-width:780px;}
.col{min-width:0;padding:12px;background:var(--color-muted);border:2px solid var(--ink);border-radius:0;}
.col .chd{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
  padding-bottom:8px;
  border-bottom:2px solid var(--ink);
  font-family:"Cinzel","Noto Serif TC",serif;
  font-size:13px;
  font-weight:600;
}
.col .chd .cnt{padding:1px 8px;color:#000;background:var(--color-secondary);border:1px solid #000;border-radius:0;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;}
.ticket{margin-bottom:10px;padding:11px;color:var(--ink);background:#FFF;border:1px solid var(--ink);border-left:6px solid var(--color-accent);border-radius:0;font-size:13px;box-shadow:2px 2px 0 var(--color-border);}
.ticket .tt{font-weight:600;}
.ticket .tm{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:5px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;}
.tl{position:relative;padding-left:28px;}
.tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:3px;background:var(--ink);}
.tl .ev{position:relative;padding:0 0 20px 8px;}
.tl .ev::before{content:"";position:absolute;left:-25px;top:3px;width:13px;height:13px;background:#FFF;border:3px solid var(--color-accent);border-radius:0;}
.tl .ev.done::before{background:var(--color-primary);border-color:var(--ink);}
.tl .ev.done::after{content:"✓";position:absolute;left:-23px;top:-2px;color:#FFF;font-family:Arial,sans-serif;font-size:11px;font-weight:700;}
.tl .ev .et{font-size:15px;font-weight:700;}
.tl .ev .ed{margin-top:3px;color:var(--muted);font-size:13px;}
.tl .ev .em{margin-top:4px;color:#475569;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;}
.lrow{display:flex;align-items:center;gap:12px;min-width:0;padding:12px 0;border-bottom:1px solid var(--line);}
.lrow:last-child{border-bottom:0;}
.lrow .ic{width:38px;height:38px;flex:0 0 38px;display:flex;align-items:center;justify-content:center;color:#000;background:var(--color-secondary);border:1px solid var(--ink);border-radius:0;}
.lrow .ic .material-symbols-outlined{font-size:20px;}
.lrow .lt{min-width:0;font-size:14px;font-weight:600;}
.lrow .ls{color:var(--muted);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;}
.lrow .lend{flex:0 0 auto;margin-left:auto;text-align:right;font-size:12px;}
.doc{overflow:hidden;border:2px solid var(--ink);border-radius:0;}
.doc .dh{padding:17px 19px;color:#FFF;background:var(--sidebar);border-bottom:6px solid var(--color-accent);}
.doc .dh b{font-family:"Cormorant Garamond","Noto Serif TC",serif;font-size:21px;}
.doc .dh span{display:block;margin-top:3px;color:#CCFBF1;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;}
.doc .db{padding:18px 19px;color:#292524;background:#FFFEF8;font-size:15px;}
.doc .db p{margin:0 0 12px;}
.signrow{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px;}
.sign{flex:1 1 150px;min-width:0;padding:12px 13px;background:#FFF;border:2px dashed var(--ink);border-radius:0;}
.sign span{color:var(--muted);font-size:12px;}
.sign b{display:block;margin-top:3px;font-size:15px;}
.sign .sk{display:flex;align-items:center;gap:4px;margin-top:5px;color:var(--ok);font-size:12px;font-weight:600;}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.chip{min-width:0;padding:7px 10px;color:#334155;background:var(--color-muted);border:1px solid var(--ink);border-radius:0;font-size:13px;}
.chip b{color:#8A4B05;}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:13px;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
@media(max-width:1120px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));}
  .g23,.g32{grid-template-columns:1fr;}
  .card:nth-child(even){transform:none;}
}
@media(max-width:860px){
  .app{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:static;flex:0 0 auto;padding:14px;border-right:0;border-bottom:4px solid var(--color-accent);}
  .brand{margin:0;padding:0 0 12px;}
  .brand .logo{width:42px;height:42px;flex-basis:42px;}
  .nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;}
  .navbtn{justify-content:flex-start;padding:10px 9px;}
  .navbtn .nnum{display:none;}
  .sidefoot{display:none;}
  .main{padding:28px 16px 48px;}
}
@media(max-width:600px){
  body{background-size:24px 24px;}
  .nav{grid-template-columns:repeat(2,minmax(0,1fr));}
  .navbtn{font-size:14px;}
  .topbar{grid-template-columns:1fr;padding:22px 16px 16px;}
  .topbar h1{font-size:31px;}
  .topbar .sub{grid-column:1;}
  .pill{grid-column:1;grid-row:auto;justify-self:start;margin-top:9px;}
  .g4,.g3,.g2{grid-template-columns:1fr;}
  .card{padding:16px;}
  .kpi .kval{font-size:39px;}
  .tblwrap{margin-right:-16px;}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
  #screen{animation:none;}
  .navbtn:hover{transform:none;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">verified_user</span></div>
      <div><b>內控管理平台</b><span>Internal Control System</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">
      稽核室 · 財務部 · 法務部<br/>與稽核系統 / ERM / ERP 同步<br/>年度自評週期 2026 Q3
    </div>
  </aside>
  <main class="main">
    <div id="screen"></div>
  </main>
</div>

<script>
"use strict";
var MODS=[
  {icon:"account_tree", label:"循環盤點",  title:"內控循環盤點", sub:"循環與作業流程文件版本控管"},
  {icon:"fact_check",   label:"自評問卷",  title:"自我評估問卷 (RCSA)", sub:"控制自我評估問卷派發與執行"},
  {icon:"warning",      label:"缺失登錄",  title:"內控缺失登錄", sub:"缺失分級登錄與風險評估"},
  {icon:"build",        label:"改善追蹤",  title:"缺失改善追蹤", sub:"改善行動計畫與完成率追蹤"},
  {icon:"verified",     label:"覆核確認",  title:"稽核覆核確認", sub:"覆核與證據佐證留痕"},
  {icon:"gavel",        label:"聲明書",    title:"內控聲明書產出", sub:"聲明書彙整與簽核產出"}
];
var chartRef=null;
function destroyChart(){ if(chartRef){ try{chartRef.destroy();}catch(e){} chartRef=null; } }
function esc(s){return String(s).replace(/[&<>]/g,function(c){return c==="&"?"&amp;":c==="<"?"&lt;":"&gt;";});}
function bar(p){return '<div class="bar"><i style="width:'+Math.max(0,Math.min(100,p))+'%"></i></div>';}

function s0(){
  var cycles=[
    {c:"銷售與收款循環", code:"C-01", docs:12, ver:"v4.2", ctrl:18, own:"稽核室", upd:"2026-07-28", st:"已核定", cls:"b-ok"},
    {c:"採購與付款循環", code:"C-02", docs:15, ver:"v3.8", ctrl:22, own:"財務部", upd:"2026-08-02", st:"審核中", cls:"b-warn"},
    {c:"生產與存貨循環", code:"C-03", docs:20, ver:"v5.1", ctrl:27, own:"稽核室", upd:"2026-08-06", st:"已核定", cls:"b-ok"},
    {c:"薪工循環",       code:"C-04", docs:8,  ver:"v2.6", ctrl:11, own:"人資部", upd:"2026-07-15", st:"待更新", cls:"b-bad"},
    {c:"融資循環",       code:"C-05", docs:9,  ver:"v3.0", ctrl:13, own:"財務部", upd:"2026-08-04", st:"已核定", cls:"b-ok"},
    {c:"固定資產循環",   code:"C-06", docs:10, ver:"v2.9", ctrl:14, own:"總務部", upd:"2026-07-22", st:"審核中", cls:"b-warn"},
    {c:"投資循環",       code:"C-07", docs:7,  ver:"v1.8", ctrl:9,  own:"財務部", upd:"2026-06-30", st:"待更新", cls:"b-bad"}
  ];
  var rows=cycles.map(function(x){
    return '<tr><td><b>'+esc(x.code)+'</b></td><td>'+esc(x.c)+'</td><td>'+x.docs+' 份</td>'+
      '<td><span class="badge b-acc">'+esc(x.ver)+'</span></td><td>'+x.ctrl+'</td><td>'+esc(x.own)+'</td>'+
      '<td>'+esc(x.upd)+'</td><td><span class="badge '+x.cls+'">'+esc(x.st)+'</span></td></tr>';
  }).join("");
  return head(0)+

  var sm=valsmall?'<small>'+esc(valsmall)+'</small>':(unit?'<small>'+esc(unit)+'</small>':"");
  return '<div class="kpi"><div class="klab"><span class="material-symbols-outlined">'+esc(icon)+'</span>'+esc(lab)+'</div>'+
    '<div class="kval">'+esc(val)+sm+'</div>'+
    '<div class="kfoot '+cls+'"><span class="material-symbols-outlined">'+esc(dico)+'</span>'+esc(foot)+'</div></div>';
}
var RENDER=[s0,s1,s2,s3,s4,s5];
var CHARTS=[s0chart,s1chart,s2chart,s3chart,s4chart,s5chart];

function buildNav(){
  var nav=document.getElementById("nav");
  nav.innerHTML=MODS.map(function(m,i){
    return '<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+esc(m.icon)+'</span>'+
      '<span class="nlabel">'+esc(m.label)+'</span><span class="nnum">'+(i+1)+'</span></button>';
  }).join("");
  var btns=nav.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){
    (function(b){b.addEventListener("click",function(){ location.hash="go="+b.getAttribute("data-i"); });})(btns[k]);
  }
}
function show(i){
  destroyChart();
  var container=document.getElementById("screen");
  container.innerHTML=RENDER[i]();
  var btns=document.querySelectorAll("[data-i]");
  for(var k=0;k<btns.length;k++){ btns[k].classList.toggle("on", +btns[k].getAttribute("data-i")===i); }
  void container.offsetHeight;
  if(CHARTS[i]) CHARTS[i]();
}
buildNav();
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
