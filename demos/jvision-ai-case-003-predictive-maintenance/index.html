<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>設備預兆管家 · Predictive Maintenance</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400&family=Playfair+Display:ital@1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#16A34A;
  --color-on-primary:#000000;
  --color-secondary:#22C55E;
  --color-on-secondary:#0F172A;
  --color-accent:#DC2626;
  --color-on-accent:#FFFFFF;
  --color-background:#F0FDF4;
  --color-foreground:#14532D;
  --color-card:#FFFFFF;
  --color-card-foreground:#14532D;
  --color-muted:#E8F0F1;
  --color-muted-foreground:#475569;
  --color-border:#BBF7D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#16A34A;
  --amber:#B45309;
  --amber-bg:#FEF3C7;
  --blue:#166534;
  --ink:#14261A;
  --muted:#475569;
  --line:#86EFAC;
  --black:#07150C;
  --paper:#FFFFFF;
}
*{box-sizing:border-box}
html{background:var(--color-background)}
body{
  margin:0;
  min-width:320px;
  font-family:Inter,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  background:
    linear-gradient(rgba(20,83,45,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(20,83,45,.055) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--ink);
  line-height:1.5;
}
button,a,[role="button"]{cursor:pointer}
button,input,select,textarea{font:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:4px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-size:21px;
  line-height:1;
  vertical-align:middle;
  font-variation-settings:"FILL" 0,"wght" 600,"GRAD" 0,"opsz" 24;
}
.shell{display:grid;grid-template-columns:254px minmax(0,1fr);min-height:100vh}
.shell>*{min-width:0}
.side{
  position:sticky;
  top:0;
  z-index:20;
  height:100vh;
  display:flex;
  flex-direction:column;
  gap:0;
  overflow:auto;
  padding:0;
  color:#fff;
  background:var(--black);
  border-right:4px solid var(--color-primary);
}
.side .bd{
  display:grid;
  grid-template-columns:54px 1fr;
  align-items:center;
  gap:13px;
  min-height:104px;
  padding:18px 16px;
  background:var(--color-primary);
  color:var(--color-on-primary);
  border-bottom:3px solid #000;
}
.side .lg{
  width:54px;
  height:54px;
  display:grid;
  place-items:center;
  flex:none;
  background:#000;
  color:#fff;
  border:2px solid #000;
  font-size:21px;
  font-weight:800;
}
.side .bd b{
  display:block;
  max-width:130px;
  font-size:17px;
  font-weight:800;
  line-height:1.15;
  letter-spacing:.02em;
}
.side .bd span{
  display:block;
  margin-top:5px;
  font-family:"JetBrains Mono",monospace;
  font-size:9px;
  line-height:1.35;
  letter-spacing:.11em;
}
#nav{display:flex;flex-direction:column}
.side button{
  position:relative;
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  min-height:56px;
  padding:13px 17px;
  border:0;
  border-bottom:1px solid #285535;
  background:transparent;
  color:#DDFBE5;
  text-align:left;
  font-size:14px;
  font-weight:700;
}
.side button::after{
  content:"";
  position:absolute;
  right:13px;
  width:8px;
  height:8px;
  border-top:2px solid currentColor;
  border-right:2px solid currentColor;
  transform:rotate(45deg);
}
.side button:hover{background:#163C23;color:#fff}
.side button.on{
  background:#fff;
  color:#07150C;
  box-shadow:inset 9px 0 0 var(--color-primary);
}
.side button.on::after{color:var(--color-accent)}
.side .foot{
  margin-top:auto;
  padding:16px 17px 20px;
  border-top:3px solid var(--color-primary);
  color:#DDFBE5;
  font-family:"JetBrains Mono",monospace;
  font-size:11px;
  line-height:1.8;
}
.main{min-width:0;padding:26px clamp(16px,2.8vw,42px) 42px}
.vh{
  position:relative;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  min-height:110px;
  margin:0 0 20px;
  padding:18px 20px;
  background:var(--paper);
  border:3px solid var(--ink);
  box-shadow:8px 8px 0 var(--color-primary);
}
.vh::before{
  content:"OPERATIONS / RELIABILITY";
  position:absolute;
  top:0;
  left:0;
  padding:3px 8px;
  background:var(--ink);
  color:#fff;
  font-family:"JetBrains Mono",monospace;
  font-size:9px;
  letter-spacing:.12em;
}
.vh h2{
  margin:17px 0 0;
  font-size:clamp(26px,3.2vw,48px);
  font-weight:800;
  line-height:1;
  letter-spacing:-.045em;
}
.vh h2::after{
  content:".";
  color:var(--color-accent);
}
.vh p{
  max-width:700px;
  margin:9px 0 0;
  color:var(--muted);
  font-size:13px;
  font-weight:600;
}
.live{
  display:flex;
  align-items:center;
  gap:8px;
  flex:none;
  min-height:39px;
  padding:7px 11px;
  border:2px solid var(--ink);
  background:#DCFCE7;
  color:#14532D;
  font-size:11px;
  font-weight:800;
  letter-spacing:.02em;
}
.live i{
  width:10px;
  height:10px;
  background:var(--color-primary);
  border:2px solid #052E16;
  animation:pulse 1.4s steps(2,end) infinite;
}
@keyframes pulse{50%{opacity:.25}}
.kpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:0;
  margin:0 0 20px;
  border:3px solid var(--ink);
  background:var(--ink);
}
.kpi{
  position:relative;
  min-height:145px;
  padding:17px 18px;
  overflow:hidden;
  background:var(--paper);
  border-right:2px solid var(--ink);
}
.kpi:last-child{border-right:0}
.kpi:nth-child(2){background:#DCFCE7}
.kpi:nth-child(3){background:#FFF7ED}
.kpi .l{
  padding-right:32px;
  color:var(--muted);
  font-size:11px;
  font-weight:800;
  letter-spacing:.04em;
}
.kpi .v{
  margin-top:14px;
  color:var(--ink);
  font-size:38px;
  font-weight:800;
  line-height:1;
  letter-spacing:-.05em;
  font-variant-numeric:tabular-nums;
}
.kpi .v small{font-size:12px!important;letter-spacing:0}
.kpi .d{
  margin-top:11px;
  color:#166534;
  font-size:11px;
  font-weight:800;
}
.kpi:nth-child(3) .d{color:#9A3412}
.kpi .ic{
  position:absolute;
  top:14px;
  right:13px;
  display:grid;
  width:31px;
  height:31px;
  place-items:center;
  background:var(--ink);
  color:#fff;
  opacity:1;
}
.grid{display:grid;gap:20px}
.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.42fr) minmax(330px,.88fr)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.two>*{min-width:0}
.card{
  position:relative;
  min-width:0;
  padding:18px;
  background:var(--color-card);
  color:var(--color-card-foreground);
  border:2px solid var(--ink);
  box-shadow:5px 5px 0 var(--line);
}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin:-18px -18px 17px;
  padding:12px 15px;
  border-bottom:2px solid var(--ink);
  background:var(--color-muted);
  color:var(--ink);
  font-size:13px;
  font-weight:800;
  letter-spacing:.02em;
}
.card h3 .material-symbols-outlined{color:var(--color-primary)}
.card h3[style]{margin-top:18px!important}
.hg{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(226px,1fr));
  gap:10px;
}
.hc{
  position:relative;
  min-width:0;
  padding:13px;
  background:#fff;
  border:2px solid var(--ink);
}
.hc:nth-child(2n){background:#F7FFF9}
.hc .hh{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
  margin-bottom:11px;
}
.hc .hh b{
  display:block;
  font-family:"JetBrains Mono",monospace;
  font-size:13px;
  line-height:1.25;
}
.hc .hh small{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-size:10.5px;
}
.score{text-align:right;flex:none}
.score .n{
  color:var(--ink)!important;
  font-size:27px;
  font-weight:800;
  line-height:1;
  font-variant-numeric:tabular-nums;
}
.score small{font-size:9px;color:var(--muted)}
.hbar{
  height:11px;
  margin:4px 0 10px;
  overflow:hidden;
  background:#D9E5DD;
  border:1px solid var(--ink);
}
.hbar i{display:block;height:100%;border-right:2px solid var(--ink)}
.hc .rul{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  color:var(--muted);
  font-size:10.5px;
}
.hc .rul b{
  color:var(--ink);
  font-family:"JetBrains Mono",monospace;
}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:25px;
  padding:3px 8px;
  border:1px solid currentColor;
  font-size:10px;
  font-weight:800;
  line-height:1.2;
  white-space:nowrap;
}
.tag::before{
  content:"";
  width:7px;
  height:7px;
  background:currentColor;
  border:1px solid currentColor;
}
.t-ok{background:#DCFCE7;color:#166534}
.t-warn{background:#FEF3C7;color:#92400E}
.t-bad{background:#FEE2E2;color:#B91C1C}
.t-run{background:#DBEAFE;color:#1E40AF}
.chart{height:230px;min-width:0}
.alist{display:flex;flex-direction:column;gap:8px}
.al{
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:10px 11px;
  background:#FFFBEB;
  color:#78350F;
  border:2px solid #92400E;
  border-left-width:8px;
}
.al.bad{
  background:#FEF2F2;
  color:#7F1D1D;
  border-color:#B91C1C;
}
.al .material-symbols-outlined{
  flex:none;
  margin-top:1px;
  color:#92400E;
  font-size:19px;
}
.al.bad .material-symbols-outlined{color:#B91C1C}
.al b{display:block;font-size:11.5px}
.al small{
  display:block;
  margin-top:2px;
  color:#5F4633;
  font-size:10.5px;
}
.al.bad small{color:#6B3D3D}
.scroll{
  width:100%;
  overflow-x:auto;
  border:2px solid var(--ink);
}
table.data{
  width:100%;
  min-width:620px;
  border-collapse:collapse;
  background:#fff;
  font-size:12px;
  font-variant-numeric:tabular-nums;
}
table.data th,table.data td{
  padding:11px 12px;
  border-right:1px solid #9BC9A9;
  border-bottom:1px solid #9BC9A9;
  text-align:left;
  vertical-align:middle;
}
table.data th:last-child,table.data td:last-child{border-right:0}
table.data tr:last-child td{border-bottom:0}
table.data th{
  position:sticky;
  top:0;
  z-index:1;
  background:var(--ink);
  color:#fff;
  font-size:10.5px;
  font-weight:800;
  letter-spacing:.05em;
  white-space:nowrap;
}
table.data tbody tr:nth-child(even){background:#F0FDF4}
table.data tbody tr:hover{background:#DCFCE7}
table.data td:first-child,
table.data td:nth-child(2),
table.data td:last-child{
  font-family:"JetBrains Mono",monospace;
}
table.data th:last-child,table.data td:last-child{text-align:right}
.cal{
  display:grid;
  grid-template-columns:repeat(7,minmax(72px,1fr));
  gap:0;
  min-width:610px;
  border-top:2px solid var(--ink);
  border-left:2px solid var(--ink);
}
.cal .dh{
  padding:7px 4px;
  background:var(--ink);
  color:#fff;
  border-right:1px solid #fff;
  text-align:center;
  font-size:10px;
  font-weight:800;
}
.cal .cd{
  min-height:80px;
  padding:7px;
  background:#fff;
  border-right:2px solid var(--ink);
  border-bottom:2px solid var(--ink);
  font-size:10.5px;
}
.cal .cd .dn{
  color:var(--ink);
  font-family:"JetBrains Mono",monospace;
  font-size:11px;
  font-weight:800;
}
.cal .cd .ev{
  margin-top:6px;
  padding:4px 5px;
  background:#DCFCE7;
  color:#14532D;
  border-left:5px solid var(--color-primary);
  font-size:9.5px;
  font-weight:800;
  line-height:1.35;
}
.cal .cd .ev::before{content:"保養｜"}
.cal .cd .ev.w{
  background:var(--amber-bg);
  color:#78350F;
  border-color:var(--amber);
}
.cal .cd .ev.w::before{content:"停機｜"}
.cal .cd.dim{background:#F3F7F4}
.tl{
  position:relative;
  max-width:900px;
  padding-left:31px;
}
.tl::before{
  content:"";
  position:absolute;
  top:4px;
  bottom:6px;
  left:9px;
  width:4px;
  background:var(--ink);
}
.ti{
  position:relative;
  margin-bottom:10px;
  padding:12px 14px;
  background:#fff;
  border:2px solid var(--ink);
}
.ti:nth-child(odd){transform:translateX(8px);background:#F0FDF4}
.ti::before{
  content:"";
  position:absolute;
  top:16px;
  left:-33px;
  width:14px;
  height:14px;
  background:var(--color-primary);
  border:3px solid var(--ink);
}
.ti .tt{font-size:12.5px;font-weight:800}
.ti small{
  display:block;
  margin-top:2px;
  color:var(--muted);
  font-family:"JetBrains Mono",monospace;
  font-size:10px;
}
.ti .dsc{
  margin-top:6px;
  color:#33473A;
  font-size:11.5px;
}
.grid-item{animation:enter .4s cubic-bezier(.2,.9,.25,1.25) both}
.grid-item:nth-child(2){animation-delay:.06s}
.grid-item:nth-child(3){animation-delay:.12s}
.grid-item:nth-child(4){animation-delay:.18s}
@keyframes enter{
  from{opacity:0;transform:translateY(16px) scale(.92)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@media(max-width:1024px){
  .shell{grid-template-columns:218px minmax(0,1fr)}
  .side .bd{grid-template-columns:46px 1fr}
  .side .lg{width:46px;height:46px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi:nth-child(2){border-right:0}
  .kpi:nth-child(-n+2){border-bottom:2px solid var(--ink)}
  .g2{grid-template-columns:1fr}
}
@media(max-width:768px){
  body{background-size:24px 24px}
  .shell{display:block}
  .side{
    position:relative;
    height:auto;
    overflow:visible;
    border-right:0;
    border-bottom:4px solid var(--color-primary);
  }
  .side .bd{
    min-height:78px;
    padding:12px 14px;
    grid-template-columns:44px 1fr;
  }
  .side .lg{width:44px;height:44px;font-size:18px}
  .side .bd b{max-width:none;font-size:16px}
  #nav{
    display:grid;
    grid-template-columns:repeat(3,1fr);
  }
  .side button{
    justify-content:center;
    min-height:54px;
    padding:10px 8px;
    border-right:1px solid #285535;
    font-size:12px;
  }
  .side button::after{display:none}
  .side button.on{box-shadow:inset 0 6px 0 var(--color-primary)}
  .side .foot{display:none}
  .main{padding:18px 14px 32px}
  .vh{min-height:0;padding:16px;box-shadow:5px 5px 0 var(--color-primary)}
  .vh h2{font-size:31px}
  .two{grid-template-columns:1fr}
}
@media(max-width:520px){
  #nav{grid-template-columns:repeat(2,1fr)}
  .side button{justify-content:flex-start}
  .vh{align-items:flex-start;flex-direction:column}
  .live{align-self:stretch;justify-content:center}
  .kpis{grid-template-columns:1fr}
  .kpi{
    min-height:118px;
    border-right:0;
    border-bottom:2px solid var(--ink);
  }
  .kpi:nth-child(3){border-bottom:2px solid var(--ink)}
  .kpi:last-child{border-bottom:0}
  .kpi .v{font-size:33px}
  .card{padding:14px;box-shadow:4px 4px 0 var(--line)}
  .card h3{margin:-14px -14px 14px;padding:11px 12px}
  .hg{grid-template-columns:1fr}
  .hc .rul{align-items:flex-start;flex-direction:column}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
  }
  .grid-item{opacity:1!important;transform:none!important}
  .live i{opacity:1!important}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="bd">
      <div class="lg" aria-hidden="true">兆</div>
      <div><b>設備預兆管家</b><span>PREDICTIVE · CMMS</span></div>
    </div>
    <nav id="nav" aria-label="主要功能"></nav>
    <div class="foot">監測 42 台設備<br/>今日預警 3 · 維修中 2</div>
  </aside>
  <main class="main">
    <header class="vh">
      <div><h2 id="vt">預兆診斷</h2><p id="vd"></p></div>
      <div class="live" role="status"><i aria-hidden="true"></i><span>感測即時監測中</span></div>
    </header>
    <div id="view"></div>
  </main>
</div>
<script>
const MOD=[
  ["預兆診斷","sensors","預兆診斷","感測數據異常偵測、健康評分與剩餘壽命 RUL"],
  ["維修工單","build","維修工單","維修派工、進度追蹤與工時登錄"],
  ["保養排程","calendar_month","保養排程","預防保養行事曆與週期排程"],
  ["備品管理","inventory_2","備品管理","備品庫存、安全存量與用量追蹤"],
  ["OEE 稼動","speed","稼動 OEE","設備稼動率、性能與可用率監控"],
  ["履歷追溯","history","履歷追溯","設備維護履歷與根因追溯"]
];
const nav=document.getElementById("nav");
const view=document.getElementById("view");
const vt=document.getElementById("vt");
const vd=document.getElementById("vd");

MOD.forEach((m,i)=>{
  const b=document.createElement("button");
  b.type="button";
  b.dataset.i=i;
  b.className=i===0?"on":"";
  b.setAttribute("aria-current",i===0?"page":"false");
  b.innerHTML='<span class="material-symbols-outlined" aria-hidden="true">'+m[1]+"</span><span>"+m[0]+"</span>";
  b.addEventListener("click",()=>show(i,true));
  nav.appendChild(b);
});

const HEALTH=[
  ["CNC-01","五軸加工中心",42,"bad","2 天","振動 RMS 超標","t-bad"],
  ["INJ-03","射出成型機",68,"warn","11 天","油溫偏高趨勢","t-warn"],
  ["ROB-07","六軸機械手臂",91,"ok","96 天","正常","t-ok"],
  ["PMP-02","冷卻循環泵",58,"warn","6 天","電流諧波異常","t-warn"],
  ["CMP-05","空壓機組",88,"ok","72 天","正常","t-ok"],
  ["CNV-09","輸送帶系統",95,"ok","120 天","正常","t-ok"]
];
const ALERTS=[
  ["CNC-01 主軸振動 RMS 4.8mm/s","超過警戒 4.5，建議 48 小時內停機檢修","bad"],
  ["PMP-02 電流諧波失真 9.2%","軸承磨損預兆，已自動開立維修工單","bad"],
  ["INJ-03 液壓油溫 62°C","連續 3 日上升，建議排程換油","warn"]
];
const WO=[

function resizeCharts(){charts.forEach(c=>{if(c&&!c.isDisposed())c.resize()})}
function show(i,updateHash){
  const index=Math.max(0,Math.min(Number(i)||0,MOD.length-1));
  clearCharts();
  nav.querySelectorAll("button").forEach(b=>{
    const active=Number(b.dataset.i)===index;
    b.classList.toggle("on",active);
    b.setAttribute("aria-current",active?"page":"false");
  });
  vt.textContent=MOD[index][2];
  vd.textContent=MOD[index][3];
  view.innerHTML=SCREENS[index]();
  draw(index);
  if(updateHash){
    const target="#v"+index;
    if(location.hash!==target)history.pushState(null,"",target);
  }
}
function fromHash(){
  const m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  const n=document.querySelectorAll("[data-i]").length||6;
  show(m?Math.min(Number(m[1]),n-1):0,false);
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
window.addEventListener("resize",resizeCharts,{passive:true});
fromHash();
