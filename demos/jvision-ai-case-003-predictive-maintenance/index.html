<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>設備預兆管家 · Predictive Maintenance</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--ink:#0e1a17;--accent:#10b981;--accent2:#34d399;--bg:#eef3f1;--card:#fff;--line:#e0e8e5;--mut:#5b6b66;--ok:#16a34a;--warn:#f59e0b;--bad:#ef4444}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.shell>*{min-width:0}
.side{background:linear-gradient(180deg,#0b1f1a,#0e2a22);color:#d1fae5;padding:18px 14px;display:flex;flex-direction:column;gap:5px;position:sticky;top:0;height:100vh;overflow:auto}
.side .bd{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.side .lg{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#04231a;flex:none;box-shadow:0 0 20px rgba(16,185,129,.55)}
.side .bd b{font-size:15px;font-weight:800;font-family:"Noto Sans TC";display:block;color:#fff}
.side .bd span{font-size:10px;color:#6ee7b7;letter-spacing:1.5px}
.side button{display:flex;align-items:center;gap:11px;background:transparent;border:0;color:#a7f3d0;font:inherit;font-weight:600;font-size:13.5px;padding:11px 12px;border-radius:10px;cursor:pointer;text-align:left;width:100%;font-family:"Noto Sans TC"}
.side button .material-symbols-outlined{font-size:20px}
.side button:hover{background:rgba(255,255,255,.05)}
.side button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04231a;font-weight:800}
.side .foot{margin-top:auto;padding:12px 10px;font-size:11px;color:#6ee7b7;border-top:1px solid rgba(255,255,255,.08)}
.main{padding:22px 24px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:21px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.live{background:#d1fae5;color:#047857;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:#10b981;display:inline-block;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px;color:var(--ok)}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.5}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .85fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.hg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:13px}
.hc{border:1px solid var(--line);border-radius:14px;padding:14px;position:relative}
.hc .hh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.hc .hh b{font-family:"Noto Sans TC";font-size:14px;display:block}
.hc .hh small{color:var(--mut);font-size:11px}
.score{text-align:center;flex:none}
.score .n{font-size:22px;font-weight:800;font-family:Inter;line-height:1}
.score small{font-size:9.5px;color:var(--mut)}
.hbar{height:8px;background:#eef3f1;border-radius:6px;overflow:hidden;margin:4px 0 8px}
.hbar i{display:block;height:100%;border-radius:6px}
.hc .rul{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut)}
.hc .rul b{color:var(--ink)}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#dcfce7;color:#15803d}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#fee2e2;color:#b91c1c}.t-run{background:#dbeafe;color:#1d4ed8}
.chart{height:230px}
.alist{display:flex;flex-direction:column;gap:9px}
.al{display:flex;gap:11px;align-items:flex-start;border-left:3px solid var(--warn);background:#fffbeb;border-radius:0 10px 10px 0;padding:9px 12px}
.al.bad{border-color:var(--bad);background:#fef2f2}
.al .material-symbols-outlined{font-size:19px;color:var(--warn);flex:none}
.al.bad .material-symbols-outlined{color:var(--bad)}
.al b{font-size:12.5px;font-family:"Noto Sans TC"}
.al small{display:block;color:var(--mut);font-size:11px;margin-top:1px}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#f5f8f7}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two>*{min-width:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.cal .dh{text-align:center;font-size:11px;color:var(--mut);font-weight:700;padding:4px 0}
.cal .cd{border:1px solid var(--line);border-radius:9px;min-height:66px;padding:6px;font-size:11px}
.cal .cd .dn{font-weight:700;color:var(--mut);font-size:11px}
.cal .cd .ev{margin-top:3px;background:#d1fae5;color:#047857;border-radius:5px;padding:2px 4px;font-size:9.5px;font-weight:700;line-height:1.3}
.cal .cd .ev.w{background:#fef3c7;color:#b45309}
.cal .cd.dim{background:#fafcfb}
.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.ti{position:relative;padding:0 0 16px 4px}
.ti::before{content:"";position:absolute;left:-21px;top:2px;width:13px;height:13px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.ti .tt{font-size:12.5px;font-family:"Noto Sans TC";font-weight:700}
.ti small{color:var(--mut);font-size:11px}
.ti .dsc{font-size:12px;color:#3f504b;margin-top:2px}
.scroll{overflow-x:auto}
.hamb{display:none}
@media(max-width:860px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;overflow:visible}.side .bd{width:100%;padding-bottom:8px}.side button{width:auto;flex:none}.side .foot{display:none}.kpis{grid-template-columns:repeat(2,1fr)}.g2,.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="bd"><div class="lg">兆</div><div><b>設備預兆管家</b><span>PREDICTIVE · CMMS</span></div></div>
    <div id="nav"></div>
    <div class="foot">監測 42 台設備<br/>今日預警 3 · 維修中 2</div>
  </aside>
  <main class="main">
    <div class="vh"><div><h2 id="vt">預兆診斷</h2><p id="vd"></p></div><div class="live"><i></i>感測即時監測中</div></div>
    <div id="view"></div>
  </main>
</div>
<script>
const MOD=[["預兆診斷","sensors","預兆診斷","感測數據異常偵測、健康評分與剩餘壽命 RUL"],
["維修工單","build","維修工單","維修派工、進度追蹤與工時登錄"],
["保養排程","calendar_month","保養排程","預防保養行事曆與週期排程"],
["備品管理","inventory_2","備品管理","備品庫存、安全存量與用量追蹤"],
["OEE 稼動","speed","稼動 OEE","設備稼動率、性能與可用率監控"],
["履歷追溯","history","履歷追溯","設備維護履歷與根因追溯"]];
const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span>'+m[0];b.onclick=()=>show(i);nav.appendChild(b);});

const HEALTH=[["CNC-01","五軸加工中心",42,"bad","2 天","振動 RMS 超標","t-bad"],["INJ-03","射出成型機",68,"warn","11 天","油溫偏高趨勢","t-warn"],["ROB-07","六軸機械手臂",91,"ok","96 天","正常","t-ok"],["PMP-02","冷卻循環泵",58,"warn","6 天","電流諧波異常","t-warn"],["CMP-05","空壓機組",88,"ok","72 天","正常","t-ok"],["CNV-09","輸送帶系統",95,"ok","120 天","正常","t-ok"]];
const ALERTS=[["CNC-01 主軸振動 RMS 4.8mm/s","超過警戒 4.5，建議 48 小時內停機檢修","bad"],["PMP-02 電流諧波失真 9.2%","軸承磨損預兆，已自動開立維修工單","bad"],["INJ-03 液壓油溫 62°C","連續 3 日上升，建議排程換油","warn"]];
const WO=[["MO-4471","CNC-01","主軸振動異常","林工程師","維修中","t-run","3.5h"],["MO-4470","PMP-02","軸承更換","陳工程師","待料","t-warn","—"],["MO-4468","INJ-03","液壓換油","黃工程師","已排程","t-ok","1.0h"],["MO-4465","ROB-07","定期潤滑","張工程師","已完成","t-ok","0.8h"],["MO-4463","CMP-05","濾芯更換","劉工程師","已完成","t-ok","0.5h"]];
const SPARE=[["SP-BR08","主軸軸承 7014C","6","10","低於安全庫存","t-warn"],["SP-OL22","液壓油 46# 20L","24","8","充足","t-ok"],["SP-FT15","空壓濾芯","3","6","低於安全庫存","t-warn"],["SP-BL03","傳動皮帶 A-52","18","6","充足","t-ok"],["SP-SN09","振動感測器","4","4","臨界","t-bad"],["SP-VG11","油封組 φ40","30","10","充足","t-ok"]];
const OEETBL=[["CNC-01",72,88,95,60],["INJ-03",85,90,97,74],["ROB-07",96,94,99,89],["PMP-02",80,86,96,66],["CMP-05",93,95,99,87]];
const HIST=[["2026-08-12 09:20","CNC-01 主軸振動預警觸發","系統","感測 RMS 4.8mm/s，自動開立 MO-4471"],["2026-08-12 14:05","MO-4471 派工維修","林工程師","研判軸承磨損，領用 SP-BR08 主軸軸承"],["2026-08-13 08:30","更換主軸軸承並校正","林工程師","更換 7014C 軸承，重新動平衡校正"],["2026-08-13 11:15","試車確認","王主管","振動降至 1.2mm/s，稼動恢復正常"],["2026-08-13 11:40","復機完成","王主管","MO-4471 結案，履歷歸檔"]];

const SCREENS=[
()=>`<div class="kpis">
  <div class="kpi"><span class="material-symbols-outlined ic">query_stats</span><div class="l">非計畫停機</div><div class="v">6<small style="font-size:12px"> h/月</small></div><div class="d">▼ 較 24h 降 75%</div></div>
  <div class="kpi"><span class="material-symbols-outlined ic">favorite</span><div class="l">平均設備健康度</div><div class="v">78<small style="font-size:12px">分</small></div><div class="d">▲ 監測 42 台</div></div>
  <div class="kpi"><span class="material-symbols-outlined ic">warning</span><div class="l">今日預兆預警</div><div class="v">3</div><div class="d">2 高風險 · 1 中</div></div>
  <div class="kpi"><span class="material-symbols-outlined ic">schedule</span><div class="l">平均故障排除</div><div class="v">25<small style="font-size:12px"> 分</small></div><div class="d">▼ 較 90 分</div></div>
</div>
<div class="grid g2">
  <div class="card"><h3><span class="material-symbols-outlined">monitor_heart</span>設備健康監測</h3><div class="hg">${HEALTH.map(h=>{const col=h[3]=='bad'?'#ef4444':h[3]=='warn'?'#f59e0b':'#10b981';return `<div class="hc"><div class="hh"><div><b>${h[0]}</b><small>${h[1]}</small></div><div class="score"><div class="n" style="color:${col}">${h[2]}</div><small>健康分</small></div></div><div class="hbar"><i style="width:${h[2]}%;background:${col}"></i></div><div class="rul"><span>剩餘壽命 <b>${h[4]}</b></span><span class="tag ${h[6]}">${h[5]}</span></div></div>`;}).join('')}</div></div>
  <div class="card"><h3><span class="material-symbols-outlined">graphic_eq</span>CNC-01 主軸振動趨勢</h3><div class="chart" id="c_vib"></div><h3 style="margin-top:14px"><span class="material-symbols-outlined">notifications_active</span>即時預警</h3><div class="alist">${ALERTS.map(a=>`<div class="al ${a[2]}"><span class="material-symbols-outlined">${a[2]=='bad'?'error':'warning'}</span><div><b>${a[0]}</b><small>${a[1]}</small></div></div>`).join('')}</div></div>
</div>`,
()=>`<div class="card"><h3><span class="material-symbols-outlined">build</span>維修工單 <span class="tag t-run" style="margin-left:auto">進行中 2 · 待料 1</span></h3><div class="scroll"><table class="data"><tr><th>單號</th><th>設備</th><th>故障/項目</th><th>負責</th><th>狀態</th><th>工時</th></tr>${WO.map(w=>`<tr><td><b>${w[0]}</b></td><td>${w[1]}</td><td>${w[2]}</td><td>${w[3]}</td><td><span class="tag ${w[5]}">${w[4]}</span></td><td>${w[6]}</td></tr>`).join('')}</table></div></div>`,
()=>{const days=['一','二','三','四','五','六','日'];const ev={2:['ROB-07 潤滑'],5:['CMP-05 濾芯',1],9:['INJ-03 換油'],12:['CNC-01 軸承',1],15:['全廠點檢'],19:['PMP-02 校正'],23:['CNV-09 保養'],26:['壓力測試']};let cells='';for(let d=1;d<=28;d++){const e=ev[d];cells+=`<div class="cd${e?'':' dim'}"><div class="dn">${d}</div>${e?`<div class="ev${e[1]?' w':''}">${e[0]}</div>`:''}</div>`;}return `<div class="card"><h3><span class="material-symbols-outlined">calendar_month</span>本月預防保養行事曆</h3><div class="cal">${days.map(d=>`<div class="dh">${d}</div>`).join('')}${cells}</div><p style="font-size:11.5px;color:var(--mut);margin:12px 0 0"><span class="tag t-ok">綠</span> 例行保養　<span class="tag t-warn">黃</span> 需停機　依設備週期與稼動時數自動排程。</p></div>`;},
()=>`<div class="grid g2"><div class="card"><h3><span class="material-symbols-outlined">inventory_2</span>備品庫存</h3><div class="scroll"><table class="data"><tr><th>料號</th><th>品名</th><th>庫存</th><th>安全量</th><th>狀態</th></tr>${SPARE.map(s=>`<tr><td><b>${s[0]}</b></td><td>${s[1]}</td><td>${s[2]}</td><td>${s[3]}</td><td><span class="tag ${s[5]}">${s[4]}</span></td></tr>`).join('')}</table></div></div><div class="card"><h3><span class="material-symbols-outlined">pie_chart</span>備品庫存狀態</h3><div class="chart" style="height:260px" id="c_sp"></div></div></div>`,
()=>`<div class="two"><div class="card"><h3><span class="material-symbols-outlined">speed</span>全廠平均 OEE</h3><div class="chart" id="c_oee"></div></div><div class="card"><h3><span class="material-symbols-outlined">show_chart</span>近 7 日稼動趨勢</h3><div class="chart" id="c_tr"></div></div></div><div class="card" style="margin-top:16px"><h3><span class="material-symbols-outlined">precision_manufacturing</span>各設備稼動明細</h3><div class="scroll"><table class="data"><tr><th>設備</th><th>可用率</th><th>性能</th><th>良率%</th><th>OEE</th></tr>${OEETBL.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}%</td><td>${r[2]}%</td><td>${r[3]}</td><td><b style="color:#10b981">${r[4]}%</b></td></tr>`).join('')}</table></div></div>`,
()=>`<div class="card"><h3><span class="material-symbols-outlined">history</span>CNC-01 維護履歷追溯</h3><div class="tl">${HIST.map(h=>`<div class="ti"><div class="tt">${h[1]}</div><small>${h[0]} · ${h[2]}</small><div class="dsc">${h[3]}</div></div>`).join('')}</div></div>`
];

function draw(i){
  if(i==0){const c=echarts.init(document.getElementById('c_vib'));c.setOption({grid:{left:36,right:12,top:16,bottom:24},tooltip:{trigger:'axis'},xAxis:{type:'category',data:['08:00','09:00','10:00','11:00','12:00','13:00','now'],axisLabel:{fontSize:10}},yAxis:{type:'value',name:'mm/s',nameTextStyle:{fontSize:10},axisLabel:{fontSize:10}},series:[{type:'line',smooth:true,data:[1.1,1.4,2.2,3.1,3.9,4.5,4.8],areaStyle:{color:'rgba(239,68,68,.12)'},lineStyle:{color:'#ef4444',width:3},itemStyle:{color:'#ef4444'},markLine:{silent:true,data:[{yAxis:4.5,label:{formatter:'警戒',fontSize:10}},],lineStyle:{color:'#f59e0b',type:'dashed'}}}]});}
  if(i==3){const c=echarts.init(document.getElementById('c_sp'));c.setOption({tooltip:{trigger:'item'},legend:{bottom:0,textStyle:{fontSize:11}},series:[{type:'pie',radius:['45%','72%'],center:['50%','44%'],label:{fontSize:11},data:[{value:3,name:'充足',itemStyle:{color:'#16a34a'}},{value:2,name:'低於安全量',itemStyle:{color:'#f59e0b'}},{value:1,name:'臨界',itemStyle:{color:'#ef4444'}}]}]});}
  if(i==4){const g=echarts.init(document.getElementById('c_oee'));g.setOption({series:[{type:'gauge',progress:{show:true,width:16,itemStyle:{color:'#10b981'}},axisLine:{lineStyle:{width:16}},pointer:{width:5},axisTick:{show:false},splitLine:{length:12},axisLabel:{fontSize:10},detail:{formatter:'{value}%',fontSize:30,offsetCenter:[0,'62%'],color:'#0e1a17'},data:[{value:78,name:'OEE'}],title:{offsetCenter:[0,'88%'],fontSize:13}}]});const t=echarts.init(document.getElementById('c_tr'));t.setOption({grid:{left:36,right:12,top:18,bottom:24},tooltip:{trigger:'axis'},xAxis:{type:'category',data:['8/7','8/8','8/9','8/10','8/11','8/12','8/13'],axisLabel:{fontSize:10}},yAxis:{type:'value',min:60,max:100,axisLabel:{fontSize:10}},series:[{type:'line',smooth:true,data:[70,72,68,75,74,77,78],areaStyle:{color:'rgba(16,185,129,.14)'},lineStyle:{color:'#10b981',width:3},itemStyle:{color:'#10b981'}}]});}
}
function show(i){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));vt.textContent=MOD[i][2];vd.textContent=MOD[i][3];view.innerHTML=SCREENS[i]();draw(i);}
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
<script src="/shared/jv-agent-bridge.js?v=2" defer></script>
</body>
</html>
