<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>軟韌體版本與發布管理 · PLM 研發管理系統</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@300;400;500;600;700&family=Roboto+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#15803D;
  --color-on-primary:#FFFFFF;
  --color-secondary:#22C55E;
  --color-on-secondary:#0F172A;
  --color-accent:#D97706;
  --color-on-accent:#000000;
  --color-background:#F0FDF4;
  --color-foreground:#14532D;
  --color-card:#FFFFFF;
  --color-card-foreground:#14532D;
  --color-muted:#E8F0F1;
  --color-muted-foreground:#475569;
  --color-border:#BBF7D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#15803D;

  --blue:#15803D;
  --ink:#14532D;
  --muted:#475569;
  --line:#BBF7D0;

  --primary-soft:#DCFCE7;
  --secondary-soft:#ECFDF5;
  --accent-soft:#FEF3C7;
  --danger-soft:#FEE2E2;
  --panel:#FFFFFF;
  --surface:#F7FFF9;
  --surface-strong:#E7F8EC;
  --sidebar:#123B28;
  --sidebar-end:#0B2D1E;
  --ok:#15803D;
  --warn:#B45309;
  --bad:#B91C1C;
  --info:#166534;
  --shadow:0 1px 2px rgba(20,83,45,.07),0 14px 34px rgba(20,83,45,.09);
  --shadow-hover:0 4px 10px rgba(20,83,45,.08),0 18px 42px rgba(20,83,45,.13);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  color:var(--ink);
  background:
    radial-gradient(circle at 82% 6%,rgba(34,197,94,.12),transparent 25rem),
    radial-gradient(circle at 5% 92%,rgba(217,119,6,.08),transparent 22rem),
    var(--color-background);
  font-family:"Exo",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,[role="button"]{cursor:pointer}
h1,h2,h3,h4,p{margin-top:0}
h1,h2,h3,h4,.brand-txt b,.nav button{font-family:"Exo",sans-serif}
:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.app{display:flex;min-height:100vh}
.sidebar{
  position:sticky;top:0;z-index:20;
  width:254px;height:100vh;flex:none;
  display:flex;flex-direction:column;
  padding:22px 16px;
  overflow:hidden;
  color:#F0FDF4;
  background:
    radial-gradient(circle at 12% 8%,rgba(34,197,94,.25),transparent 13rem),
    linear-gradient(165deg,var(--sidebar),var(--sidebar-end));
  border-right:1px solid rgba(187,247,208,.18);
}
.sidebar::before,.sidebar::after{
  content:"";position:absolute;pointer-events:none;border-radius:48% 52% 62% 38%;
  border:1px solid rgba(187,247,208,.11);transform:rotate(-12deg)
}
.sidebar::before{width:250px;height:180px;left:-100px;top:34%}
.sidebar::after{width:190px;height:130px;right:-90px;bottom:6%}
.brand{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:3px 7px 23px}
.brand-logo{
  width:44px;height:44px;flex:none;
  display:grid;place-items:center;
  color:var(--color-on-primary);
  background:linear-gradient(145deg,var(--color-secondary),var(--color-primary));
  border:1px solid rgba(255,255,255,.24);
  border-radius:16px 12px 18px 11px;
  box-shadow:0 12px 28px rgba(0,0,0,.24);
}
.brand-logo svg{width:23px;height:23px}
.brand-txt{min-width:0}
.brand-txt b{display:block;color:#FFF;font-size:16px;font-weight:700;letter-spacing:.04em}
.brand-txt span{display:block;margin-top:2px;color:#BBF7D0;font:500 10px/1.3 "Roboto Mono",monospace;letter-spacing:.12em}
.nav{position:relative;z-index:1;display:flex;flex-direction:column;gap:6px}
.nav button{
  width:100%;min-height:44px;
  display:flex;align-items:center;gap:11px;
  padding:10px 12px;
  border:1px solid transparent;border-radius:16px 12px 17px 11px;
  background:transparent;color:#D1FAE5;
  text-align:left;font-size:13.5px;font-weight:600;
  transition:background-color .2s,border-color .2s,color .2s,transform .2s;
}
.nav button svg{width:20px;height:20px;flex:none}
.nav button:hover{color:#FFF;background:rgba(255,255,255,.09);border-color:rgba(187,247,208,.2);transform:translateX(2px)}
.nav button.on{
  color:#062814;background:#DCFCE7;border-color:#86EFAC;
  box-shadow:0 10px 28px rgba(0,0,0,.18);
}
.nav .idx{margin-left:auto;color:inherit;opacity:.68;font:500 10px "Roboto Mono",monospace}
.side-foot{
  position:relative;z-index:1;margin-top:auto;padding:15px 9px 2px;
  border-top:1px solid rgba(187,247,208,.17);
  color:#BBF7D0;font-size:11px;line-height:1.75
}
.side-foot b{color:#FFF;font-family:"Roboto Mono",monospace}
.main{flex:1;min-width:0;padding:25px 30px 58px}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  margin-bottom:22px;padding:0 2px;flex-wrap:wrap
}
.topbar h1{display:flex;align-items:center;gap:11px;margin:0;font-size:23px;line-height:1.25;font-weight:700;letter-spacing:-.02em}
.title-icon{
  width:40px;height:40px;display:grid;place-items:center;
  border-radius:14px 10px 16px 10px;color:var(--color-primary);
  background:var(--primary-soft);border:1px solid var(--color-border)
}
.title-icon svg{width:21px;height:21px}
.topbar .sub{margin-top:4px;color:var(--muted);font-size:12.5px}
.top-right{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.chip{
  min-height:34px;display:inline-flex;align-items:center;gap:7px;
  padding:6px 11px;border:1px solid var(--line);border-radius:999px;
  color:var(--muted);background:rgba(255,255,255,.82);
  box-shadow:0 4px 14px rgba(20,83,45,.04);font-size:11.5px;font-weight:600
}
.chip svg{width:15px;height:15px;color:var(--primary)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(21,128,61,.13)}
.avatar{
  width:36px;height:36px;display:grid;place-items:center;flex:none;
  color:#FFF;background:linear-gradient(145deg,var(--color-primary),#166534);
  border:2px solid #DCFCE7;border-radius:50%;font-weight:700
}
.grid{display:grid;gap:15px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g32{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.grid>*{min-width:0}
.card,.tile{
  position:relative;min-width:0;background:rgba(255,255,255,.94);
  border:1px solid rgba(134,239,172,.78);border-radius:20px 15px 23px 16px;
  box-shadow:var(--shadow);transition:transform .22s,box-shadow .22s,border-color .22s
}
.card:hover,.tile:hover{border-color:#86EFAC;box-shadow:var(--shadow-hover)}
.card{padding:17px}
.card.pad0{padding:0;overflow:hidden}
.card-h{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-bottom:13px;flex-wrap:wrap
}
.card.pad0 .card-h{padding:17px 17px 0}
.card-h h3{display:flex;align-items:center;gap:8px;margin:0;font-size:14px;font-weight:700}
.card-h h3 svg{width:18px;height:18px;color:var(--color-primary)}
.card-h .hint{color:var(--muted);font-size:11.5px}
.tile{padding:17px;overflow:hidden}
.tile::after{
  content:"";position:absolute;width:92px;height:72px;right:-31px;top:-30px;
  border-radius:53% 47% 61% 39%;background:rgba(34,197,94,.1);transform:rotate(18deg)
}
.tile .ti{
  position:relative;z-index:1;width:38px;height:38px;display:grid;place-items:center;
  margin-bottom:11px;color:var(--color-primary);background:var(--primary-soft);
  border:1px solid var(--color-border);border-radius:14px 10px 16px 10px
}
.tile .ti svg{width:20px;height:20px}
.tile b{display:block;font-size:12px;color:var(--muted);font-weight:600}
.tile .tv{margin-top:3px;font:700 25px/1.2 "Roboto Mono",monospace;color:var(--ink);letter-spacing:-.04em}
.tile p{margin:7px 0 0;color:var(--muted);font-size:11.5px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
th{
  padding:11px 13px;text-align:left;white-space:nowrap;
  color:#315B46;background:#EAF8EE;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  font-size:11px;font-weight:700;letter-spacing:.02em
}
th:first-child{padding-left:17px}
th:last-child{padding-right:17px}
td{padding:11px 13px;white-space:nowrap;border-bottom:1px solid #DCFCE7;color:#183E2A}
td:first-child{padding-left:17px}
td:last-child{padding-right:17px}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background-color .18s}
tbody tr:hover{background:#F0FDF4}
td:first-child,.mono,td b,.tile .tv{font-family:"Roboto Mono",monospace;font-variant-numeric:tabular-nums}
td:nth-child(n+3){font-variant-numeric:tabular-nums}
.tag{
  display:inline-flex;align-items:center;gap:5px;padding:4px 9px;
  border:1px solid currentColor;border-radius:999px;font-size:10.5px;font-weight:700;line-height:1.2
}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.t-ok{color:#166534;background:#DCFCE7}
.t-warn{color:#92400E;background:#FEF3C7}
.t-bad{color:#991B1B;background:#FEE2E2}
.t-info,.t-acc,.t-pink{color:#166534;background:#DCFCE7}
.t-gray{color:#475569;background:#F1F5F9}
.progress-shell{height:3px;position:fixed;z-index:50;left:254px;right:0;top:0;background:rgba(187,247,208,.45)}
.progress-shell i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--color-primary),var(--color-accent))}
.chapter{animation:reveal .36s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(min-width:1140px){
  #screen{display:grid;grid-template-columns:minmax(0,1.28fr) minmax(0,1fr);gap:15px;align-items:start}
  #screen>*{margin-top:0!important}
  #screen>.grid.g4:first-child{grid-column:1/-1}
  #screen>*:nth-child(2){grid-column:2;grid-row:2}
  #screen>*:nth-child(2).grid{grid-template-columns:1fr}
  #screen>*:nth-child(3){grid-column:1;grid-row:2}
  #screen>*:nth-child(n+4){grid-column:1/-1}
}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:860px){
  .app{display:block}.sidebar{position:static;width:100%;height:auto;padding:12px 14px}
  .brand{padding:0 4px 10px}.side-foot{display:none}.nav{display:grid;grid-template-columns:repeat(4,1fr)}
  .nav button{justify-content:center}.nav .idx{display:none}.main{padding:20px 16px 46px}
  .progress-shell{left:0}.topbar{align-items:flex-start}
}
@media(max-width:768px){.g2,.g3,.g32{grid-template-columns:1fr}}
@media(max-width:560px){
  .g4{grid-template-columns:1fr 1fr}.nav button{padding:10px 7px}.nav button span:not(.nav-icon){display:none}
  .topbar h1{font-size:19px}.tile{padding:14px}.tile .tv{font-size:21px}.chip:nth-child(2){display:none}
}
@media(max-width:375px){.main{padding-inline:12px}.g4{grid-template-columns:1fr}.nav{gap:4px}.card{padding:14px}}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .chapter{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<div class="progress-shell" aria-hidden="true"><i id="scroll-progress"></i></div>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo" data-icon="memory"></div>
      <div class="brand-txt"><b>韌體發布台</b><span>FIRMWARE RELEASE</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
    <div class="side-foot">在管韌體 24 條線<br>版本 486 個<br>版本 <b>v1.0.0</b> · 純 UI 展示</div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div>
        <h1><span class="title-icon" id="th-ico"></span><span id="th-title"></span></h1>
        <div class="sub" id="th-sub"></div>
      </div>
      <div class="top-right">
        <span class="chip"><span class="dot"></span>系統連線正常</span>
        <span class="chip"><span data-icon="calendar_today"></span>2026/08/20</span>
        <div class="avatar" aria-label="資管使用者">資</div>
      </div>
    </header>
    <div id="screen" aria-live="polite"></div>
  </main>
</div>
<script>
var ICONS={
dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>',
memory:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="3"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 2v3m6-3v3M9 19v3m6-3v3M2 9h3m-3 6h3m14-6h3m-3 6h3"/></svg>',
call_split:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 4v5a3 3 0 0 0 3 3h4a3 3 0 0 1 3 3v5M17 4v4a4 4 0 0 1-4 4H7"/><path d="m4 17 3 3 3-3M14 7l3-3 3 3"/></svg>',
rocket_launch:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M14 5c3.5-2.8 6-2 6-2s.8 2.5-2 6l-5 5-4-4 5-5Z"/><path d="m9 10-4 1-2 3 5 1m5-1 1 5 3-2 1-4M8 16l-3 3m6-1-3 3"/><circle cx="16" cy="7" r="1.5"/></svg>',
bug_report:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="6" y="7" width="12" height="13" rx="6"/><path d="M9 7V5a3 3 0 0 1 6 0v2M3 10h3m12 0h3M3 15h3m12 0h3M9 11h6M9 15h6"/></svg>',
tag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 13 13 20 3 10V3h7l10 10Z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>',
warning:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 9v5m0 3h.01"/></svg>',
show_chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m3 17 6-6 4 4 8-9"/><path d="M16 6h5v5"/></svg>',
donut_large:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M11 3a9 9 0 1 0 10 10h-8a2 2 0 0 1-2-2V3Z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15V3.5Z"/></svg>',
grid_view:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
bar_chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 20V10h4v10m4 0V4h4v16m4 0v-7h-4"/></svg>',
checklist:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m3 6 2 2 4-4M3 13l2 2 4-4M3 20l2 2 4-4M12 6h9m-9 7h9m-9 7h9"/></svg>',
schedule:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
block:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/></svg>',
timer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M9 2h6m-3 3v8l4 2"/></svg>',
equalizer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 20V9m0-5v1m8 15v-4m0-8V4m8 16v-8m0-8v4"/><circle cx="4" cy="7" r="2"/><circle cx="12" cy="13" r="2"/><circle cx="20" cy="10" r="2"/></svg>',
priority_high:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6m0 4h.01"/></svg>',
replay:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2L4 8"/><path d="M4 3v5h5"/></svg>',
insights:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 19h18M5 16l4-5 4 3 6-8"/><circle cx="5" cy="16" r="1"/><circle cx="9" cy="11" r="1"/><circle cx="13" cy="14" r="1"/><circle cx="19" cy="6" r="1"/></svg>',
calendar_today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4m8-4v4M3 10h18"/></svg>'
};
function icon(name){return ICONS[name]||ICONS.dashboard}
var charts=[];
function killCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy()}catch(e){}}charts=[]}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function tbl(h,r){return '<div style="overflow-x:auto"><table><thead><tr>'+h.map(function(x){return'<th>'+esc(x)+'</th>'}).join("")+'</tr></thead><tbody>'+r.map(function(x){return'<tr>'+x.map(function(c,i){return'<td'+(i===0?' class="mono"':'')+'>'+c+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div>'}
function card(t,ic,body,hint){return'<section class="card chapter"><div class="card-h"><h3>'+icon(ic)+t+'</h3>'+(hint?'<span class="hint">'+hint+'</span>':'')+'</div>'+body+'</section>'}
function cardT(t,ic,body,hint){return'<section class="card pad0 chapter"><div class="card-h"><h3>'+icon(ic)+t+'</h3>'+(hint?'<span class="hint">'+hint+'</span>':'')+'</div>'+body+'</section>'}
function tile(ic,t,v,p){return'<article class="tile chapter"><div class="ti">'+icon(ic)+'</div><b>'+t+'</b><div class="tv">'+v+'</div><p>'+p+'</p></article>'}
var AX={style:{colors:"#475569",fontSize:"11px",fontFamily:"Roboto Mono"}};
var CB={redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:'Exo, sans-serif'};
function push(el,opt){var n=document.getElementById(el);if(!n)return;var c=new ApexCharts(n,opt);c.render();charts.push(c)}

function hydrateIcons(root){Array.prototype.forEach.call((root||document).querySelectorAll("[data-icon]"),function(n){n.innerHTML=icon(n.getAttribute("data-icon"))})}
function buildNav(){
 var n=document.getElementById("nav");
 n.innerHTML=MODULES.map(function(m,i){return'<button type="button" data-i="'+i+'" aria-label="'+esc(m.name)+'"><span class="nav-icon">'+icon(m.icon)+'</span><span>'+m.name+'</span><span class="idx">0'+(i+1)+'</span></button>'}).join("");
 Array.prototype.forEach.call(n.querySelectorAll("[data-i]"),function(b){b.addEventListener("click",function(){location.hash="go="+b.getAttribute("data-i")})})
}
function show(i){
 killCharts();
 var m=MODULES[i];
 document.getElementById("th-ico").innerHTML=icon(m.icon);
 document.getElementById("th-title").textContent=m.name;
 document.getElementById("th-sub").textContent=m.sub;
 Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){
  var active=+b.getAttribute("data-i")===i;b.classList.toggle("on",active);
  if(active)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")
 });
 RENDER[i](document.getElementById("screen"))
}
function fromHash(){
 var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
 show(m?Math.min(+m[1],MODULES.length-1):0);
 try{window.scrollTo(0,0)}catch(e){}
}
function updateProgress(){
 var d=document.documentElement,max=d.scrollHeight-d.clientHeight;
 document.getElementById("scroll-progress").style.width=(max?Math.min(100,d.scrollTop/max*100):0)+"%"
}
hydrateIcons(document);buildNav();
window.addEventListener("hashchange",fromHash);
window.addEventListener("scroll",updateProgress,{passive:true});
window.addEventListener("resize",updateProgress,{passive:true});
fromHash();updateProgress();
