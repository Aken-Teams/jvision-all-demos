.scroll{overflow-x:auto}
.kbcat{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}

.sb0{background:#F3E8FF;color:#6B21A8}.sb1{background:#D1FAE5;color:#065F46}.sb2{background:#FFE4E6;color:#9F1239}.sb3{background:#FEF3C7;color:#92400E}.sb4{background:#E0E7FF;color:#3730A3}

.post{padding:13px 15px;border-radius:17px}

.ava{width:29px;height:29px;display:inline-grid;place-items:center;flex:none;border:2px solid white;border-radius:50%;color:white;font-weight:700}

.pf .n{margin-left:auto;text-align:right;flex:none}.pf .n b{color:#4338CA;font-size:18px;font-variant-numeric:tabular-nums}
.sug{margin-bottom:11px;padding:12px 14px;border-radius:16px;background:#F5F3FF}

.step:last-child{border:0}.step .num{width:25px;height:25px;display:grid;place-items:center;flex:none;border:2px solid #312E81;border-radius:50%;background:#4F46E5;color:white;font-weight:700;box-shadow:0 3px 0 #312E81}
.mini{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:38px;padding:7px 14px;border:2px solid transparent;border-radius:12px;font-weight:700;transition:transform .2s ease-out,box-shadow .2s ease-out}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(2px)}
.btn.ok{border-color:#312E81;background:#4F46E5;color:white;box-shadow:0 4px 0 #312E81}
.btn.no{border-color:#B91C1C;background:#fff;color:#B91C1C;box-shadow:0 4px 0 #FECACA}
.btn.gh{border-color:#94A3B8;background:#fff;color:#334155;box-shadow:0 4px 0 #CBD5E1}
.bar{height:11px;overflow:hidden;border:2px solid #C7D2FE;border-radius:999px;background:#E0E7FF}
.bar i{display:block;height:100%;border-radius:999px}
.gaprow,.kbrow{display:flex;align-items:flex-start;gap:9px;padding:10px 0;border-bottom:2px dashed var(--line);font-size:13px}
.gaprow .material-symbols-outlined{color:#B45309}.gaprow .n{margin-left:auto;color:#92400E;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.kbrow>.material-symbols-outlined{color:#4338CA}.kbrow>div{flex:1}.kbrow>div:last-child{text-align:right}
.grid-item{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes pulse{50%{transform:scale(.72);opacity:.55}}
@keyframes rise{from{opacity:0;transform:translateY(15px) scale(.96)}}
@media(max-width:1024px){.topin{align-items:flex-start;flex-wrap:wrap}.nav{order:3;width:100%}.live{margin-left:auto}.kbgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g11,.two{grid-template-columns:1fr}.main{padding:18px}.post.reply{margin-left:12px}}
@media(max-width:560px){.top{padding:8px}.topin{border-radius:17px}.brand{flex:1}.live{width:100%;justify-content:center}.nav button span:not(.material-symbols-outlined){display:none}.nav button{padding:10px}.kbgrid{grid-template-columns:1fr}.vh h2{font-size:26px}}
@media(max-width:430px){.kpis{grid-template-columns:1fr}.main{padding:14px 12px 35px}.card{padding:14px}.vh{align-items:start}.gaprow{flex-wrap:wrap}.gaprow .n{width:100%;margin-left:29px;text-align:left}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
