<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>教師備課知識庫 · Teacher Lesson KB</title>
<meta name="description" content="教案課程資源庫、共備協作討論、教材版本管理與 AI 備課助理"/>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--accent:#7c3aed;--accent2:#a78bfa;--ink:#241b3a;--bg:#f4f1fb;--card:#fff;--line:#e7e1f7;--mut:#6b6486;--ok:#0d9488;--warn:#f59e0b;--bad:#e11d48;--info:#4f46e5}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
/* top nav */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(120deg,#fff,#f7f3fe);border-bottom:1px solid var(--line);box-shadow:0 4px 18px rgba(124,58,237,.06)}
.topin{max-width:1360px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:11px 22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;flex:none}
.brand .lg{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:900;color:#fff;box-shadow:0 8px 20px rgba(124,58,237,.4);font-family:"Noto Sans TC"}
.brand b{font-size:15px;font-weight:800;font-family:"Noto Sans TC";display:block;line-height:1.2}
.brand span{font-size:9px;color:var(--accent);letter-spacing:1.5px;font-weight:700}
.nav{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.nav button{display:flex;align-items:center;gap:7px;background:transparent;border:0;color:#544d6e;font:inherit;font-weight:600;font-size:13px;padding:9px 13px;border-radius:11px;cursor:pointer;font-family:"Noto Sans TC";white-space:nowrap}
.nav button .material-symbols-outlined{font-size:19px;color:#b3a4dd}
.nav button:hover{background:#efe9fc}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px rgba(124,58,237,.32)}
.nav button.on .material-symbols-outlined{color:#fff}
.live{background:#ede4fe;color:#6d28d9;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px;flex:none}
.live i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:p 1.4s infinite}
@keyframes p{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(124,58,237,.5)}50%{opacity:.35;box-shadow:0 0 0 6px rgba(124,58,237,0)}}
.main{max-width:1360px;margin:0 auto;padding:22px 24px 40px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:22px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.kpis>*{min-width:0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent),var(--accent2))}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;color:var(--accent);opacity:.24}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .85fr}
.g11{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--accent)}
.tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.t-ok{background:#ccfbf1;color:#0f766e}.t-warn{background:#fef3c7;color:#b45309}.t-bad{background:#ffe4e6;color:#be123c}.t-info{background:#e0e7ff;color:#4338ca}.t-vio{background:#ede4fe;color:#6d28d9}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#f4effc}
table.data tr:hover td{background:#faf7ff}
.chartbox{position:relative;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.two>*{min-width:0}
.bar{height:8px;background:#ece5fa;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.scroll{overflow-x:auto}
/* KB signature — 教案資源卡 */
.kbcat{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pill{font-size:12px;font-weight:700;padding:6px 13px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--mut);cursor:default;font-family:"Noto Sans TC"}
.pill.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.kbgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.kbgrid>*{min-width:0}
.acard{border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:#fff;display:flex;flex-direction:column;gap:7px;position:relative;overflow:hidden}
.acard:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.acard.sj0:before{background:linear-gradient(180deg,#7c3aed,#a78bfa)}
.acard.sj1:before{background:linear-gradient(180deg,#0d9488,#2dd4bf)}
.acard.sj2:before{background:linear-gradient(180deg,#e11d48,#fb7185)}
.acard.sj3:before{background:linear-gradient(180deg,#f59e0b,#fcd34d)}
.acard.sj4:before{background:linear-gradient(180deg,#4f46e5,#818cf8)}
.acard .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff}
.sj0 .ic{background:linear-gradient(135deg,#7c3aed,#a78bfa)}.sj1 .ic{background:linear-gradient(135deg,#0d9488,#2dd4bf)}.sj2 .ic{background:linear-gradient(135deg,#e11d48,#fb7185)}.sj3 .ic{background:linear-gradient(135deg,#f59e0b,#fcd34d)}.sj4 .ic{background:linear-gradient(135deg,#4f46e5,#818cf8)}
.acard b{font-size:13px;font-family:"Noto Sans TC";line-height:1.4}
.acard .m{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--mut);flex-wrap:wrap;margin-top:auto}
.acard .m span{display:flex;align-items:center;gap:3px}
.acard .m .material-symbols-outlined{font-size:14px}
.subj{font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:20px}
.sb0{background:#ede4fe;color:#6d28d9}.sb1{background:#ccfbf1;color:#0f766e}.sb2{background:#ffe4e6;color:#be123c}.sb3{background:#fef3c7;color:#b45309}.sb4{background:#e0e7ff;color:#4338ca}
/* 共備討論 thread */
.thread{display:flex;flex-direction:column;gap:12px}
.post{border:1px solid var(--line);border-radius:13px;padding:12px 14px;background:#fff}
.post.op{border-left:4px solid var(--accent);background:linear-gradient(90deg,#faf7ff,#fff)}
.post.reply{margin-left:24px;background:#faf9fd}
.ph{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.ph b{font-size:12.5px;font-family:"Noto Sans TC"}
.ph small{color:var(--mut);font-size:11px}
.ava{width:26px;height:26px;border-radius:50%;color:#fff;display:inline-grid;place-items:center;font-size:11px;font-weight:800;font-family:"Noto Sans TC";flex:none}
.av0{background:linear-gradient(135deg,#7c3aed,#a78bfa)}.av1{background:linear-gradient(135deg,#0d9488,#2dd4bf)}.av2{background:linear-gradient(135deg,#e11d48,#fb7185)}.av3{background:linear-gradient(135deg,#4f46e5,#818cf8)}
.post p{margin:0;font-size:12.5px;line-height:1.65;color:#3d3555}
.pmeta{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--mut)}
.pmeta span{display:flex;align-items:center;gap:4px}
.pmeta .material-symbols-outlined{font-size:14px}
/* version diff */
.vlist{display:flex;flex-direction:column;gap:0}
.vrow{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line);position:relative}
.vrow:last-child{border-bottom:0}
.vdot{width:11px;height:11px;border-radius:50%;background:var(--accent);flex:none;margin-top:4px;box-shadow:0 0 0 4px #ede4fe}
.vrow.old .vdot{background:#c4b8e6;box-shadow:0 0 0 4px #f1edfa}
.vrow b{font-size:12.5px;font-family:"Noto Sans TC"}
.vrow small{color:var(--mut);font-size:11px;display:block;margin-top:2px}
.vtag{font-family:Inter;font-weight:800;color:var(--accent);font-size:12px}
.diff{border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:12px;font-family:"Noto Sans TC"}
.diff .dl{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px}
.diff .dl:last-child{border-bottom:0}
.diff .add{background:#effcf6}.diff .del{background:#fff1f3;text-decoration:line-through;color:#9b6}
.diff .del{color:#b98}.diff .add .mk{color:#0d9488;font-weight:800}.diff .del .mk{color:#e11d48;font-weight:800}
/* teaching portfolio */
.pf{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.pf:last-child{border-bottom:0}
.pf .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;flex:none;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.pf b{font-size:12.5px;font-family:"Noto Sans TC"}
.pf small{color:var(--mut);font-size:11px;display:block}
.pf .n{margin-left:auto;text-align:right;flex:none}
.pf .n b{font-family:Inter;font-size:15px;color:var(--accent)}
/* AI 備課 */
.sug{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#f7f3fe;margin-bottom:10px}
.sug b{font-size:12.5px;font-family:"Noto Sans TC";display:block;margin-bottom:4px}
.sug small{color:var(--mut);font-size:11.5px;line-height:1.6}
.conf{display:inline-block;font-size:10.5px;font-weight:800;color:var(--accent);background:#ede4fe;padding:1px 8px;border-radius:20px;margin-left:6px}
.step{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
.step:last-child{border-bottom:0}
.step .num{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800;font-family:Inter;flex:none}
.step b{font-size:12.5px;font-family:"Noto Sans TC"}
.step small{color:var(--mut);font-size:11px;display:block;margin-top:1px}
.mini{display:flex;gap:6px;flex-wrap:wrap}
.btn{font-size:11.5px;font-weight:700;padding:6px 13px;border-radius:9px;border:0;cursor:pointer;font-family:"Noto Sans TC"}
.btn.ok{background:var(--accent);color:#fff}.btn.no{background:#fff;border:1px solid var(--bad);color:var(--bad)}.btn.gh{background:#fff;border:1px solid var(--line);color:var(--mut)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.gaprow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12px}
.gaprow .material-symbols-outlined{color:var(--warn);font-size:17px;flex:none}
.gaprow .n{margin-left:auto;font-family:Inter;font-weight:800;color:var(--warn);flex:none}
.kbrow{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
.kbrow .material-symbols-outlined{color:var(--accent);font-size:18px;flex:none;margin-top:2px}
.kbrow b{font-size:12.5px;font-family:"Noto Sans TC"}
.kbrow small{color:var(--mut);font-size:11px;display:block}
@media(max-width:820px){
 .kpis{grid-template-columns:repeat(2,1fr)}
 .g2,.g11,.two,.kbgrid{grid-template-columns:1fr}
 .post.reply{margin-left:12px}
}
@media(max-width:560px){
 .nav button span:not(.material-symbols-outlined){display:none}
 .nav button{padding:9px 11px}
}
@media(max-width:430px){
 .kpis{grid-template-columns:1fr}
 .main{padding:16px 14px}
}
</style>
</head>
<body>
<header class="top">
 <div class="topin">
  <div class="brand"><div class="lg">備</div><div><b>教師備課知識庫</b><span>TEACHER LESSON KB</span></div></div>
  <nav class="nav" id="nav"></nav>
  <div class="live"><i></i>共備協作進行中</div>
 </div>
</header>
<main class="main">
 <div class="vh"><div><h2 id="vt">備課總覽</h2><p id="vd"></p></div></div>
 <div id="view"></div>
</main>
<script>
const MOD=[
["備課總覽","dashboard","備課總覽","教案知識庫、共備協作與 AI 備課的全局儀表"],
["教案知識庫","menu_book","教案知識庫","教案／學習單／簡報依科目年級分類與使用數"],
["共備協作","groups","共備協作","同領域教師共備討論串與教學問題共解"],
["教材版本","history_edu","教材版本","教材與學習單版本歷程、差異比對與定稿"],
["教學檔案","folder_shared","教學檔案","教師個人教學檔案、觀課紀錄與成長歷程"],
["使用分析","insights","使用分析","資源使用熱度、共備參與度與備課工時分析"]];
const nav=document.getElementById('nav'),view=document.getElementById('view'),vt=document.getElementById('vt'),vd=document.getElementById('vd');
MOD.forEach((m,i)=>{const b=document.createElement('button');b.dataset.i=i;b.className=i==0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+m[1]+'</span><span>'+m[0]+'</span>';b.onclick=()=>show(i);nav.appendChild(b);});

/* 教案資源 [icon,title,subjIdx,subjName,grade,type,uses,updated] */
const KB=[
["science","國小自然｜水的三態與循環探究教案","1","自然","五年級","教案 · 3 節",412,"2 天前"],
["calculate","國中數學｜一元一次方程式差異化學習單","4","數學","七年級","學習單",356,"4 天前"],
["menu_book","國語｜寓言故事閱讀理解與提問設計","0","國語","四年級","教案 · 2 節",528,"昨天"],
["public","國中社會｜臺灣地形與氣候互動簡報","2","社會","八年級","簡報",287,"1 週前"],
["translate","國小英語｜日常對話情境教學活動","3","英語","六年級","教案 · 4 節",401,"3 天前"],
["science","國中理化｜電路串並聯探究實驗設計","1","自然","九年級","實驗單",233,"5 天前"],
["calculate","國小數學｜分數加減概念操作教案","4","數學","五年級","教案 · 3 節",468,"2 天前"],
["history_edu","國語｜文言文翻譯與賞析共備講義","0","國語","九年級","講義",312,"6 天前"],
["groups","國中社會｜公民議題辯論教學設計","2","社會","八年級","教案 · 2 節",198,"1 週前"]];
const SUBJ=["全部","國語","自然","社會","英語","數學"];
const SUBJIDX={"國語":0,"自然":1,"社會":2,"英語":3,"數學":4};

/* 共備討論串 [avIdx,name,role,time,text,likes,replies,isReply] */
const THREAD=[
[0,"林郁芳","五年級自然領召 · 發起","2 小時前","本學期「水的三態」單元想加入實作觀察，大家有沒有推薦適合的探究流程？學生對蒸發與凝結常常混淆，希望有更直觀的活動。",18,4,false],
[1,"陳建宏","自然科教師","1 小時前","我這邊有做過「冰塊融化計時」搭配溫度紀錄表，學生分組觀察效果不錯，已上傳到教案知識庫（國小自然·水的三態）供參考。",12,0,true],
[2,"黃佩琪","自然科教師","54 分鐘前","建議加入「杯壁凝結水珠」的引導提問，讓學生自己推論水從哪裡來，比直接講解印象深刻。學習單我改成表格式，附差異化版本。",9,0,true],
[3,"AI 備課助理","AI 建議","41 分鐘前","已彙整 3 則共備意見，草擬三段式探究流程（觀察→提問→推論）並產出對應學習單，可於教材版本頁一鍵套用為 v2.3 草稿。",7,0,true],
[0,"林郁芳","五年級自然領召 · 發起","30 分鐘前","太感謝！我把 AI 草稿與大家的意見整合後發佈定稿，下週共備會議再一起檢視實作成效。",5,0,true]];

/* 版本歷程 [ver,title,author,time,note,isOld] */
const VERS=[
["v2.3","水的三態與循環探究教案（定稿）","林郁芳","30 分鐘前","整合共備意見與 AI 探究流程，新增差異化學習單",false],
["v2.2","水的三態與循環探究教案","黃佩琪","54 分鐘前","調整凝結引導提問、學習單改表格式",true],
["v2.1","水的三態與循環探究教案","陳建宏","1 小時前","加入冰塊融化計時實作活動",true],
["v2.0","水的三態與循環探究教案","林郁芳","本學期初","上學年教案基礎修訂，更新對應課綱學習表現",true]];

/* 教學檔案 [icon,name,meta,count,unit] */
const PORT=[
["description","本學期自編教案","國小自然 · 五年級 · 已共備 6 份",14,"份"],
["videocam","公開觀課紀錄","含議課回饋與教學省思",3,"次"],
["assignment","學生學習單成果","含差異化與延伸挑戰版本",22,"份"],
["workspace_premium","專業成長時數","研習·共備·公開授課累計",36,"小時"]];

/* AI 備課建議 [title,text,tag] */
const AISUG=[
["差異化教學建議","依班級三層次程度提供加深加廣與補救版學習單，補救版聚焦三態名詞與生活實例對應。","差異化"],
["跨科連結","可與數學「溫度折線圖」統整，讓學生記錄融化過程並繪製折線圖，強化資料判讀。","跨科"],
["形成性評量","設計 3 題出場券（Exit Ticket）快速檢核學生對蒸發、凝結、凝固的辨識。","評量"]];
const AISTEP=[
["情境引入","展示雨後窗戶水珠與結冰照片，喚起生活經驗並提問「水去哪了」。"],
