<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>佣金結算系統 Commission Settlement</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#0F172A;
  --color-card:#FFFFFF;
  --color-card-foreground:#0F172A;
  --color-muted:#F1F5FD;
  --color-muted-foreground:#475569;
  --color-border:#E4ECFC;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:var(--color-primary);
  --ink:var(--color-foreground);
  --muted:var(--color-muted-foreground);
  --line:var(--color-border);
  --accent:var(--color-primary);
  --accent2:var(--color-secondary);
  --bg:var(--color-background);
  --panel:var(--color-card);
  --soft:var(--color-muted);
  --ok:#047857;
  --warn:#A16207;
  --bad:var(--color-destructive);
  --black:#020617;
  --grid:rgba(37,99,235,.075);
}
*{box-sizing:border-box}
html{min-width:320px;background:var(--bg);scrollbar-gutter:stable}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  background-color:var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Fira Sans","Noto Sans TC",sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,a,[role="button"]{cursor:pointer}
button{font:inherit}
::selection{background:var(--color-primary);color:var(--color-on-primary)}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  font-size:21px;
  line-height:1;
  vertical-align:middle;
  font-variation-settings:"FILL" 0,"wght" 600,"GRAD" 0,"opsz" 24;
}
.app{display:flex;align-items:stretch;min-height:100vh}
.sidebar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  flex:0 0 272px;
  flex-direction:column;
  gap:8px;
  width:272px;
  height:100vh;
  min-width:0;
  padding:18px;
  overflow-y:auto;
  background:var(--black);
  color:#fff;
  border-right:4px solid var(--color-primary);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  margin:0 0 18px;
  padding:0 0 20px;
  border-bottom:2px solid #334155;
}
.brand .logo{
  display:flex;
  flex:0 0 48px;
  align-items:center;
  justify-content:center;
  width:48px;
  height:48px;
  color:#fff;
  background:var(--color-primary);
  border:2px solid #fff;
  border-radius:0;
}
.brand .logo .material-symbols-outlined{font-size:27px}
.brand b{
  display:block;
  font-size:17px;
  font-weight:800;
  line-height:1.15;
  letter-spacing:.02em;
}
.brand span:not(.material-symbols-outlined){
  display:block;
  margin-top:5px;
  color:#CBD5E1;
  font-family:"Fira Code",monospace;
  font-size:10px;
  line-height:1.3;
  letter-spacing:.035em;
  text-transform:uppercase;
}
.nav{display:flex;flex-direction:column;gap:7px;min-width:0}
.navbtn{
  position:relative;
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  min-width:0;
  min-height:48px;
  padding:11px 12px;
  overflow:hidden;
  color:#CBD5E1;
  background:transparent;
  border:2px solid #334155;
  border-radius:0;
  font-size:13px;
  font-weight:700;
  text-align:left;
  transition:background-color 180ms ease,color 180ms ease,border-color 180ms ease,transform 180ms ease;
}
.navbtn:hover{
  color:#fff;
  background:#172554;
  border-color:var(--color-secondary);
  transform:translateX(3px);
}
.navbtn:focus-visible{outline-color:#93C5FD;outline-offset:2px}
.navbtn.on{
  color:var(--color-on-primary);
  background:var(--color-primary);
  border-color:#fff;
  box-shadow:none;
}
.navbtn.on::before{
  position:absolute;
  inset:0 auto 0 0;
  width:5px;
  background:#fff;
  content:"";
}
.navbtn .material-symbols-outlined{flex:0 0 auto;font-size:21px}
.navbtn .nt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navnum{
  margin-left:auto;
  color:inherit;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:700;
  opacity:.75;
}
.side-foot{
  margin-top:auto;
  padding:16px 4px 2px;
  color:#CBD5E1;
  border-top:2px solid #334155;
  font-family:"Fira Code","Noto Sans TC",monospace;
  font-size:10px;
  line-height:1.7;
}
.main{
  flex:1 1 auto;
  min-width:0;
  max-width:1680px;
  padding:30px 34px 64px;
}
.topbar{
  position:relative;
  display:flex;
  align-items:flex-end;
  gap:18px;
  min-height:104px;
  margin-bottom:24px;
  padding:22px 24px;
  background:var(--color-card);
  border:3px solid var(--ink);
}
.topbar::after{
  position:absolute;
  right:-3px;
  bottom:-11px;
  left:42px;
  height:8px;
  background:var(--color-primary);
  border:3px solid var(--ink);
  content:"";
}
.topbar h1{
  margin:0;
  font-size:clamp(25px,3vw,42px);
  font-weight:800;
  line-height:1;
  letter-spacing:-.035em;
}
.topbar .sub{
  max-width:680px;
  margin-top:11px;
  color:var(--muted);
  font-size:13px;
  font-weight:500;
}
.pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  min-height:38px;
  margin-left:auto;
  padding:7px 11px;
  color:var(--ink);
  background:#ECFDF5;
  border:2px solid var(--ink);
  border-radius:0;
  font-family:"Fira Code","Noto Sans TC",monospace;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
.pill .dot{
  width:10px;
  height:10px;
  background:var(--color-accent);
  border:2px solid var(--ink);
  border-radius:0;
  box-shadow:none;
}
#view{min-width:0;animation:view-in 350ms ease-out both}
@keyframes view-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:18px;min-width:0}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.two{grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr)}
.two-a{grid-template-columns:repeat(2,minmax(0,1fr))}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{
  position:relative;
  min-width:0;
  padding:18px;
  background:var(--panel);
  border:2px solid var(--ink);
  border-radius:0;
  box-shadow:6px 6px 0 var(--line);
}
.card:hover{border-color:var(--color-primary);transition:border-color 180ms ease}
.kpi{min-height:164px;padding:17px 18px 20px;overflow:hidden}
.kpi:nth-child(1){background:#EFF6FF}
.kpi:nth-child(2){background:#fff}
.kpi:nth-child(3){background:#ECFDF5}
.kpi:nth-child(4){background:#F8FAFC}
.kpi::after{
  position:absolute;
  right:-22px;
  bottom:-30px;
  width:78px;
  height:78px;
  background:transparent;
  border:12px solid var(--color-primary);
  content:"";
  transform:rotate(12deg);
}
.kpi:nth-child(3)::after{border-color:var(--color-accent)}
.kpi .k-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi .k-ic{
  display:flex;
  align-items:center;
  justify-content:center;
  width:38px;
  height:38px;
  color:#fff;
  background:var(--ink);
  border:2px solid var(--ink);
  border-radius:0;
}
.kpi .k-ic .material-symbols-outlined{font-size:21px}
.kpi .k-val{
  position:relative;
  z-index:1;
  margin:14px 0 2px;
  font-family:"Fira Code","Noto Sans TC",monospace;
  font-size:clamp(22px,2.3vw,31px);
  font-weight:700;
  line-height:1.05;
  letter-spacing:-.045em;
  font-variant-numeric:tabular-nums;
}
.kpi .k-lab{
  position:relative;
  z-index:1;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}
.kpi .k-delta{
  position:relative;
  z-index:1;
  display:inline-flex;
  align-items:center;
  gap:3px;
  margin-top:9px;
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:700;
}
.kpi .k-delta.up{color:var(--ok)}
.kpi .k-delta.down{color:var(--bad)}
.kpi .k-delta.flat{color:var(--muted)}
.k-delta .material-symbols-outlined{font-size:16px}
.sec-h{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0 0 17px;
  padding-bottom:12px;
  border-bottom:2px solid var(--ink);
  font-size:15px;
  font-weight:800;
  line-height:1.3;
}
.sec-h .material-symbols-outlined{color:var(--color-primary);font-size:21px}
.sec-h .tag{
  margin-left:auto;
  padding:4px 8px;
  color:var(--ink);
  background:var(--color-muted);
  border:1px solid var(--ink);
  border-radius:0;
  font-family:"Fira Code","Noto Sans TC",monospace;
  font-size:10px;
  font-weight:700;
  white-space:nowrap;
}
.scroll{max-width:100%;overflow-x:auto;scrollbar-color:var(--color-primary) var(--color-muted)}
table{width:100%;min-width:620px;border-collapse:separate;border-spacing:0;font-size:12.5px}
th{
  padding:10px 12px;
  color:#fff;
  background:var(--ink);
  border-right:1px solid #475569;
  border-bottom:2px solid var(--ink);
  font-family:"Fira Code","Noto Sans TC",monospace;
  font-size:10px;
  font-weight:700;
  letter-spacing:.04em;
  text-align:left;
  text-transform:uppercase;
  white-space:nowrap;
}
th:last-child{border-right:0}
td{
  padding:12px;
  background:#fff;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  white-space:nowrap;
}
td:last-child{border-right:0}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#EFF6FF;transition:background-color 160ms ease}
td.mono,
.mono,
.amt,
.bv,
.sv,
.fv,
.tl-time{
  font-family:"Fira Code","Noto Sans TC",monospace;
  font-variant-numeric:tabular-nums;
}
td.mono{text-align:right;font-weight:600}
tbody td:first-child.mono{text-align:left}
[style*="color:#b91c1c"]{color:var(--bad)!important}
[style*="color:#b45309"]{color:var(--color-primary)!important}
[style*="color:#15803d"]{color:var(--ok)!important}
.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:25px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:0;
  font-size:10px;
  font-weight:800;
  line-height:1.2;
  white-space:nowrap;
}
.badge::before{width:6px;height:6px;background:currentColor;content:""}
.b-ok{color:#065F46;background:#D1FAE5}
.b-warn{color:#854D0E;background:#FEF3C7}
.b-bad{color:#991B1B;background:#FEE2E2}
.b-info{color:#1E40AF;background:#DBEAFE}
.b-mut{color:#334155;background:#E2E8F0}
.chart-box{min-width:0;overflow:hidden}
.apexcharts-canvas,.apexcharts-svg{max-width:100%!important}
.apexcharts-text,.apexcharts-legend-text{font-family:"Fira Sans","Noto Sans TC",sans-serif!important;fill:var(--muted)!important;color:var(--muted)!important}
.apexcharts-gridline{stroke:var(--line)!important;stroke-dasharray:0!important}
.apexcharts-tooltip,.apexcharts-xaxistooltip{
  background:#fff!important;
  border:2px solid var(--ink)!important;
  border-radius:0!important;
  box-shadow:4px 4px 0 var(--line)!important;
  color:var(--ink)!important;
}
.apexcharts-tooltip-title{background:var(--color-muted)!important;border-bottom:1px solid var(--ink)!important}
.apexcharts-legend-marker{border-radius:0!important}
.apexcharts-pie-series .apexcharts-series:nth-child(1) path{fill:#2563EB!important}
.apexcharts-pie-series .apexcharts-series:nth-child(2) path{fill:#059669!important}
.apexcharts-pie-series .apexcharts-series:nth-child(3) path{fill:#60A5FA!important}
.apexcharts-pie-series .apexcharts-series:nth-child(4) path{fill:#94A3B8!important}
.bars{display:flex;flex-direction:column;gap:13px}
.bar-row{display:grid;grid-template-columns:130px minmax(80px,1fr) 72px;gap:10px;align-items:center;min-width:0}
.bar-row .bl{overflow:hidden;font-size:12px;font-weight:700;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:14px;min-width:0;overflow:hidden;background:#E2E8F0;border:1px solid var(--ink);border-radius:0}
.bar-fill{height:100%;background:var(--color-primary);border-radius:0}
.bar-row .bv{color:var(--color-primary);font-size:11px;font-weight:700;text-align:right}
.tl{position:relative;margin:0;padding-left:30px;list-style:none}
.tl::before{position:absolute;top:5px;bottom:5px;left:9px;width:3px;background:var(--ink);content:""}
.tl-item{position:relative;padding:0 0 22px 9px}
.tl-item:last-child{padding-bottom:0}
.tl-item .dot{
  position:absolute;
  top:2px;
  left:-27px;
  width:16px;
  height:16px;
  background:#fff;
  border:3px solid var(--ink);
  border-radius:0;
  box-shadow:none;
}
.tl-item.done .dot{background:var(--color-accent);border-color:var(--ink);box-shadow:none}
.tl-item.done .dot::after{
  position:absolute;
  top:1px;
  left:3px;
  width:4px;
  height:7px;
  border-right:2px solid #fff;
  border-bottom:2px solid #fff;
  content:"";
  transform:rotate(45deg);
}
.tl-item.now .dot{background:var(--color-primary);border-color:var(--ink);box-shadow:none}
.tl-t{font-size:13px;font-weight:800}
.tl-d{margin-top:3px;color:var(--muted);font-size:11.5px}
.tl-time{margin-top:3px;color:var(--color-primary);font-size:10px;font-weight:700}
.board{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:12px;min-width:880px}
.col{min-width:0;padding:12px;background:var(--color-muted);border:2px solid var(--ink);border-radius:0}
.col:nth-child(even){transform:translateY(8px)}
.col-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;padding:0 1px 9px;border-bottom:2px solid var(--ink);font-size:12px;font-weight:800}
.col-h .cnt{min-width:25px;padding:2px 6px;color:#fff;background:var(--ink);border:1px solid var(--ink);border-radius:0;font-family:"Fira Code",monospace;font-size:10px;text-align:center}
.tk{margin-bottom:9px;padding:11px;background:#fff;border:1px solid var(--ink);border-left:5px solid var(--color-primary);border-radius:0}
.tk:last-child{margin-bottom:0}
.tk-t{margin-bottom:7px;font-size:12px;font-weight:700;line-height:1.45}
.tk-m{display:flex;justify-content:space-between;gap:9px;color:var(--muted);font-size:10.5px;line-height:1.45}
.tk .amt{color:var(--color-primary);font-weight:700}
.leftbar{display:none}
.stat-line{display:flex;flex-direction:column;gap:0;border:1px solid var(--ink)}
.stat-row{display:flex;align-items:center;gap:12px;min-width:0;padding:12px;border-bottom:1px solid var(--line)}
.stat-row:last-child{border-bottom:0}
.stat-row .si{display:flex;flex:0 0 38px;align-items:center;justify-content:center;width:38px;height:38px;color:#fff;background:var(--color-primary);border:1px solid var(--ink);border-radius:0}
.stat-row .st{flex:1 1 auto;min-width:0}
.stat-row .st b{display:block;font-size:12.5px;font-weight:800}
.stat-row .st span{display:block;margin-top:2px;color:var(--muted);font-size:10.5px}
.stat-row .sv{color:var(--ink);font-size:13px;font-weight:700;text-align:right}
.flowstrip{display:grid;grid-template-columns:1.05fr 1.25fr .8fr 1fr;gap:13px;margin-bottom:4px}
.fchip{position:relative;min-width:0;padding:15px;background:#fff;border:2px solid var(--ink);border-radius:0;box-shadow:4px 4px 0 var(--line);overflow:hidden}
.fchip:nth-child(2){background:#EFF6FF}
.fchip:nth-child(4){background:#ECFDF5}
.fchip::before{position:absolute;top:0;right:0;left:0;height:5px;background:var(--color-primary);content:""}
.fchip:nth-child(4)::before{background:var(--color-accent)}
.fchip .fn{color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.fchip .fv{margin-top:6px;font-size:18px;font-weight:700;letter-spacing:-.025em}
.fchip .fb{margin-top:4px;color:var(--color-primary);font-size:10.5px;font-weight:700}
.mini-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:10.5px}
.mini-legend i{display:inline-block;width:11px;height:11px;margin-right:5px;border:1px solid var(--ink);border-radius:0;vertical-align:-1px}
.note{margin-top:13px;padding:10px 12px;color:#334155;background:var(--color-muted);border-left:4px solid var(--color-primary);font-size:11px;line-height:1.7}
@media(max-width:1100px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .three{grid-template-columns:1fr}
  .flowstrip{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:960px){
  .two,.two-a{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(4,minmax(210px,1fr))}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{
    position:relative;
    width:auto;
    height:auto;
    min-height:0;
    padding:12px 14px;
    border-right:0;
    border-bottom:4px solid var(--color-primary);
  }
  .brand{margin:0;padding:0 0 11px}
  .brand .logo{width:42px;height:42px;flex-basis:42px}
  .nav{display:grid;grid-template-columns:repeat(6,minmax(48px,1fr));gap:5px}
  .navbtn{justify-content:center;min-height:44px;padding:8px}
  .navbtn:hover{transform:translateY(-2px)}
  .navbtn .nt,.navnum{display:none}
  .side-foot{display:none}
  .main{width:100%;padding:22px 16px 44px}
  .topbar{min-height:0;padding:18px}
}
@media(max-width:600px){
  body{background-size:24px 24px}
  .main{padding-right:12px;padding-left:12px}
  .topbar{align-items:flex-start;flex-direction:column;gap:14px;margin-bottom:21px}
  .topbar::after{left:20px}
  .topbar h1{font-size:28px}
  .pill{margin-left:0;white-space:normal}
  .kpis{grid-template-columns:1fr}
  .kpi{min-height:145px}
  .flowstrip{grid-template-columns:1fr}
  .card{padding:14px;box-shadow:4px 4px 0 var(--line)}
  .sec-h{align-items:flex-start;flex-wrap:wrap}
  .sec-h .tag{margin-left:0}
  .bar-row{grid-template-columns:92px minmax(65px,1fr) 60px}
  .stat-row{align-items:flex-start;flex-wrap:wrap}
  .stat-row .st{min-width:calc(100% - 54px)}
  .stat-row .sv{width:100%;padding-left:50px;text-align:left}
}
@media(max-width:380px){
  .nav{grid-template-columns:repeat(3,1fr)}
  .bar-row{grid-template-columns:1fr 58px}
  .bar-row .bl{grid-column:1/-1}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
    transition-duration:.01ms!important;
  }
  #view{animation:none}
  .navbtn:hover,.col:nth-child(even){transform:none}
}
</style>
</head>
<body>
<div class="app">

/* ---------- helpers ---------- */
function kpiCard(k){
  var arrow=k.dir==="up"?"trending_up":(k.dir==="down"?"trending_down":"remove");
  var dcls=k.dir==="flat"?"flat":k.dir;
  var delta=k.d?('<div class="k-delta '+dcls+'"><span class="material-symbols-outlined">'+arrow+'</span>'+esc(k.d)+'</div>'):'';
  return '<div class="card kpi"><div class="k-top"><div class="k-ic"><span class="material-symbols-outlined">'+k.ic+'</span></div></div>'+
    '<div class="k-val">'+esc(k.val)+'</div><div class="k-lab">'+esc(k.lab)+'</div>'+delta+'</div>';
}
function statRow(ic,t,s,v){
  return '<div class="stat-row"><div class="si"><span class="material-symbols-outlined">'+ic+'</span></div>'+
    '<div class="st"><b>'+esc(t)+'</b><span>'+esc(s)+'</span></div><div class="sv">'+esc(v)+'</div></div>';
}

var SCREENS=[s0,s1,s2,s3,s4,s5];

/* ---------- nav ---------- */
var navEl=document.getElementById("nav");
navEl.innerHTML=MODS.map(function(m,i){
  return '<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+m.ic+'</span><span class="nt">'+esc(m.name)+'</span><span class="navnum">0'+(i+1)+'</span></button>';
}).join("");

function show(i){
  destroyCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){ btns[j].classList.toggle("on",+btns[j].getAttribute("data-i")===i); }
  var m=MODS[i]||MODS[0];
  document.getElementById("scr-title").textContent=m.name;
  document.getElementById("scr-sub").textContent=m.sub;
  view.innerHTML="";
  void view.offsetHeight;
  (SCREENS[i]||SCREENS[0])();
}
navEl.addEventListener("click",function(e){
  var b=e.target.closest?e.target.closest("[data-i]"):null;
  if(!b) return;
  location.hash="v"+(+b.getAttribute("data-i"));
});

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
})();
</script>
