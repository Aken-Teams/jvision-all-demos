<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>佣金結算系統 Commission Settlement</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#b45309;--accent2:#f59e0b;--bg:#f6f3ee;--panel:#ffffff;--ink:#3a2e1e;
  --muted:#8a7a63;--line:#ece3d6;--soft:#fbf7f0;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;font-size:20px}
.app{display:flex;min-height:100vh;align-items:stretch}
.sidebar{
  width:250px;flex:0 0 250px;background:var(--panel);border-right:1px solid var(--line);
  padding:20px 16px;display:flex;flex-direction:column;gap:6px;min-width:0;
}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
.brand .logo{
  width:40px;height:40px;border-radius:11px;flex:0 0 40px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;color:#fff;
}
.brand .logo .material-symbols-outlined{font-size:24px}
.brand b{font-size:15px;font-weight:800;display:block;line-height:1.3}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.5px}
.nav{display:flex;flex-direction:column;gap:4px;min-width:0}
.navbtn{
  display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:10px;border:none;
  background:transparent;color:var(--muted);font-family:inherit;font-size:13.5px;font-weight:600;
  cursor:pointer;text-align:left;width:100%;min-width:0;transition:background .12s,color .12s;
}
.navbtn .material-symbols-outlined{font-size:21px;flex:0 0 auto}
.navbtn .nt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navbtn:hover{background:var(--soft);color:var(--ink)}
.navbtn.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px -8px rgba(180,83,9,.7)}
.navnum{margin-left:auto;font-size:11px;opacity:.75;font-weight:700}
.side-foot{margin-top:auto;padding:12px 10px 2px;font-size:11px;color:var(--muted);border-top:1px solid var(--line)}
.main{flex:1 1 auto;min-width:0;padding:24px 28px 48px}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.topbar h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.3px}
.topbar .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.pill{margin-left:auto;display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12px;font-weight:600;color:var(--muted)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(21,128,61,.15)}
.grid{display:grid;gap:16px;min-width:0}
.kpis{grid-template-columns:repeat(4,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 17px;min-width:0}
.kpi .k-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi .k-ic{width:36px;height:36px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.kpi .k-ic .material-symbols-outlined{font-size:20px}
.kpi .k-val{font-size:26px;font-weight:800;margin:10px 0 2px;letter-spacing:.5px}
.kpi .k-lab{font-size:12px;color:var(--muted);font-weight:600}
.kpi .k-delta{font-size:11.5px;font-weight:700;margin-top:8px;display:inline-flex;align-items:center;gap:3px}
.kpi .k-delta.up{color:var(--ok)}.kpi .k-delta.down{color:var(--bad)}.kpi .k-delta.flat{color:var(--muted)}
.k-delta .material-symbols-outlined{font-size:15px}
.two{grid-template-columns:1.5fr 1fr}
.two-a{grid-template-columns:1fr 1fr}
.three{grid-template-columns:repeat(3,1fr)}
.sec-h{display:flex;align-items:center;gap:9px;margin:0 0 14px;font-size:14.5px;font-weight:800}
.sec-h .material-symbols-outlined{color:var(--accent);font-size:20px}
.sec-h .tag{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted);background:var(--soft);border:1px solid var(--line);padding:4px 10px;border-radius:999px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
th{text-align:left;font-size:11px;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.4px}
td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--soft)}
.mono{font-variant-numeric:tabular-nums;font-weight:700}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700}
.b-ok{background:rgba(21,128,61,.12);color:var(--ok)}
.b-warn{background:rgba(180,83,9,.13);color:var(--warn)}
.b-bad{background:rgba(185,28,28,.11);color:var(--bad)}
.b-info{background:rgba(245,158,11,.15);color:#92600b}
.b-mut{background:var(--soft);color:var(--muted)}
.chart-box{overflow:hidden;min-width:0}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:120px 1fr 64px;gap:10px;align-items:center;min-width:0}
.bar-row .bl{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:10px;border-radius:999px;background:var(--soft);overflow:hidden;min-width:0}
.bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.bar-row .bv{font-size:12px;font-weight:700;text-align:right;color:var(--accent)}
.tl{position:relative;padding-left:24px;margin:0;list-style:none}
.tl:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 18px 8px}
.tl-item:last-child{padding-bottom:0}
.tl-item .dot{position:absolute;left:-20px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--panel);box-shadow:0 0 0 2px var(--accent)}
.tl-item.done .dot{background:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.tl-item.now .dot{background:var(--accent2);box-shadow:0 0 0 2px var(--accent2)}
.tl-t{font-size:13px;font-weight:700}
.tl-d{font-size:11.5px;color:var(--muted);margin-top:2px}
.tl-time{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:2px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0}
.col{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:11px;min-width:0}
.col-h{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:800;margin-bottom:10px;padding:0 2px}
.col-h .cnt{font-size:11px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.tk{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:9px}
.tk:last-child{margin-bottom:0}
.tk-t{font-size:12.5px;font-weight:700;margin-bottom:5px}
.tk-m{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.tk .amt{color:var(--accent);font-weight:800;font-variant-numeric:tabular-nums}
.leftbar{width:3px;border-radius:3px;height:14px;display:inline-block;margin-right:6px;vertical-align:-2px}
.stat-line{display:flex;flex-direction:column;gap:11px}
.stat-row{display:flex;align-items:center;gap:12px;min-width:0}
.stat-row .si{width:34px;height:34px;border-radius:9px;flex:0 0 34px;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--accent)}
.stat-row .st{flex:1 1 auto;min-width:0}
.stat-row .st b{font-size:13px;display:block}
.stat-row .st span{font-size:11px;color:var(--muted)}
.stat-row .sv{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.flowstrip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.fchip{flex:1 1 150px;min-width:0;background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:12px 13px}
.fchip .fn{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.4px}
.fchip .fv{font-size:15px;font-weight:800;margin-top:4px}
.fchip .fb{font-size:11px;color:var(--accent);font-weight:700;margin-top:4px}
.mini-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--muted)}
.mini-legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.note{font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:12px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:1fr}}
@media(max-width:960px){.two,.two-a{grid-template-columns:1fr}.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{width:auto;flex:none;border-right:none;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px;gap:8px}
  .brand{border-bottom:none;margin:0;padding:0 10px 0 0;flex:0 0 auto}
  .nav{flex-direction:row;flex-wrap:wrap;flex:1 1 100%}
  .navbtn{width:auto;flex:0 0 auto;padding:9px 12px}
  .navnum{display:none}
  .side-foot{display:none}
  .main{padding:18px 16px 40px}
}
@media(max-width:560px){
  .navbtn .nt{display:none}
  .navbtn{padding:9px 11px}
  .bar-row{grid-template-columns:88px 1fr 52px}
  .kpis{grid-template-columns:1fr 1fr}
}
@media(max-width:430px){
  .board{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">payments</span></div>
      <div>
        <b>佣金結算</b>
        <span>Commission Settlement</span>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">結算週期 2026-08 · 財務部<br/>資料為示範用假資料</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="scr-title">佣金核算</h1>
        <div class="sub" id="scr-sub">依成交訂單與佣金規則計算應付佣金</div>
      </div>
      <div class="pill"><span class="dot"></span>結算引擎 · 同步正常</div>
    </div>
    <div id="view"></div>
  </main>
</div>
<script>
(function(){
"use strict";
var MODS=[
  {ic:"calculate",name:"佣金核算",sub:"依成交訂單與佣金規則計算應付佣金"},
  {ic:"receipt_long",name:"請款單產出",sub:"彙整核算結果，批次產出佣金請款單"},
  {ic:"fact_check",name:"財務審核",sub:"多層級簽核與差異比對，控管付款風險"},
  {ic:"payments",name:"多幣別付款",sub:"匯率換算、付款排程與銀行檔產出"},
  {ic:"account_balance",name:"扣款沖銷",sub:"預付款、退貨扣款與債權沖抵管理"},
  {ic:"insights",name:"結算報表",sub:"結算準確率、付款及時率與稽核歸檔"}
];
var view=document.getElementById("view");
var chartRegistry={};
function destroyCharts(){
  for(var k in chartRegistry){ if(chartRegistry[k]){ try{chartRegistry[k].destroy();}catch(e){} } }
  chartRegistry={};
}
function mkChart(id,opt){
  var el=document.getElementById(id);
  if(!el) return;
  opt.chart=opt.chart||{};
  opt.chart.redrawOnParentResize=false;
  opt.chart.redrawOnWindowResize=false;
  opt.chart.animations={enabled:false};
  opt.chart.fontFamily='Inter,"Noto Sans TC",sans-serif';
  opt.chart.toolbar={show:false};
  try{ var c=new ApexCharts(el,opt); c.render(); chartRegistry[id]=c; }catch(e){}
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function nf(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,",");}

/* ---------- screen builders ---------- */

function s0(){
  var kpis=[
    {ic:"summarize",lab:"本期核算訂單",val:"1,284",d:"+8.6%",dir:"up"},
    {ic:"payments",lab:"應付佣金總額",val:"NT$ 9.42M",d:"+4.1%",dir:"up"},
    {ic:"percent",lab:"平均佣金率",val:"6.8%",d:"-0.3pt",dir:"down"},
    {ic:"rule",lab:"規則命中率",val:"99.2%",d:"+1.1pt",dir:"up"}
  ];
  var rows=[
    {no:"SO-2026-4471",ag:"宏遠代理",amt:184200,rate:"7.0%",rule:"階梯 R-A2",st:"已核算",b:"b-ok"},
    {no:"SO-2026-4468",ag:"東昇通路",amt:96400,rate:"6.5%",rule:"標準 R-B1",st:"已核算",b:"b-ok"},
    {no:"SO-2026-4462",ag:"立群企業",amt:312800,rate:"8.0%",rule:"階梯 R-A3",st:"待複核",b:"b-warn"},
    {no:"SO-2026-4459",ag:"日新貿易",amt:57600,rate:"5.5%",rule:"標準 R-B1",st:"已核算",b:"b-ok"},
    {no:"SO-2026-4455",ag:"宏遠代理",amt:228900,rate:"7.5%",rule:"促案 R-C1",st:"規則衝突",b:"b-bad"},
    {no:"SO-2026-4451",ag:"合泰行銷",amt:141000,rate:"6.8%",rule:"階梯 R-A2",st:"已核算",b:"b-ok"}
  ];
  var trs=rows.map(function(r){
    return '<tr><td class="mono">'+esc(r.no)+'</td><td>'+esc(r.ag)+'</td><td class="mono">NT$ '+nf(r.amt)+'</td><td class="mono">'+esc(r.rate)+'</td><td>'+esc(r.rule)+'</td><td><span class="badge '+r.b+'">'+esc(r.st)+'</span></td></tr>';
  }).join("");
  view.innerHTML=
  '<div class="grid kpis">'+kpis.map(kpiCard).join("")+'</div>'+
  '<div class="grid two" style="margin-top:16px">'+
    '<div class="card"><div class="sec-h"><span class="material-symbols-outlined">monitoring</span>近 6 週佣金核算金額<span class="tag">單位：萬元</span></div><div class="chart-box" id="c0a"></div></div>'+
    '<div class="card"><div class="sec-h"><span class="material-symbols-outlined">donut_small</span>佣金規則佔比</div><div class="chart-box" id="c0b"></div></div>'+
  '</div>'+
  '<div class="card" style="margin-top:16px"><div class="sec-h"><span class="material-symbols-outlined">table_rows</span>核算明細（本期）<span class="tag">6 / 1,284 筆</span></div>'+
    '<div class="scroll"><table><thead><tr><th>訂單編號</th><th>代理商</th><th>佣金金額</th><th>佣金率</th><th>套用規則</th><th>狀態</th></tr></thead><tbody>'+trs+'</tbody></table></div></div>';
  void view.offsetHeight;
  mkChart("c0a",{
    chart:{type:"area",height:270},
    series:[{name:"核算金額",data:[712,798,760,842,905,942]}],
    xaxis:{categories:["W27","W28","W29","W30","W31","W32"],labels:{style:{colors:"#8a7a63"}}},
    yaxis:{labels:{style:{colors:"#8a7a63"},formatter:function(v){return v+"萬";}}},
    colors:["#b45309"],
    fill:{type:"gradient",gradient:{shadeIntensity:1,opacityFrom:.4,opacityTo:.05}},
    stroke:{curve:"smooth",width:3},
    dataLabels:{enabled:false},
    grid:{borderColor:"#ece3d6",strokeDashArray:4},
    tooltip:{y:{formatter:function(v){return v+" 萬元";}}}
  });
  mkChart("c0b",{
    chart:{type:"donut",height:270},
    series:[46,31,15,8],
    labels:["階梯佣金","標準佣金","促案佣金","專案佣金"],
    colors:["#b45309","#f59e0b","#d97706","#e2c79a"],
    legend:{position:"bottom",fontSize:"12px"},
    dataLabels:{enabled:true,formatter:function(v){return Math.round(v)+"%";}},
    stroke:{width:2,colors:["#fff"]},
    plotOptions:{pie:{donut:{size:"62%"}}}
  });
}

function s1(){
  var kpis=[
    {ic:"receipt_long",lab:"本期請款單",val:"186 張",d:"+12",dir:"up"},
    {ic:"payments",lab:"請款總金額",val:"NT$ 8.91M",d:"+3.4%",dir:"up"},
    {ic:"call_split",lab:"扣抵預付款",val:"NT$ 0.51M",d:"-",dir:"flat"},
    {ic:"pending_actions",lab:"待送審",val:"23 張",d:"+5",dir:"down"}
  ];
  var rows=[
    {no:"INV-CM-08-0142",ag:"宏遠代理",gross:413100,off:52000,net:361100,st:"已產出",b:"b-ok"},
    {no:"INV-CM-08-0141",ag:"立群企業",gross:312800,off:0,net:312800,st:"待送審",b:"b-warn"},
    {no:"INV-CM-08-0140",ag:"東昇通路",gross:96400,off:18000,net:78400,st:"已產出",b:"b-ok"},
    {no:"INV-CM-08-0139",ag:"合泰行銷",gross:141000,off:0,net:141000,st:"已產出",b:"b-ok"},
    {no:"INV-CM-08-0138",ag:"日新貿易",gross:57600,off:12000,net:45600,st:"待送審",b:"b-warn"}
  ];
  var trs=rows.map(function(r){
    return '<tr><td class="mono">'+esc(r.no)+'</td><td>'+esc(r.ag)+'</td><td class="mono">NT$ '+nf(r.gross)+'</td><td class="mono" style="color:#b91c1c">-'+nf(r.off)+'</td><td class="mono" style="color:#b45309;font-weight:800">NT$ '+nf(r.net)+'</td><td><span class="badge '+r.b+'">'+esc(r.st)+'</span></td></tr>';
  }).join("");
  view.innerHTML=
  '<div class="grid kpis">'+kpis.map(kpiCard).join("")+'</div>'+
  '<div class="grid two" style="margin-top:16px">'+
    '<div class="card"><div class="sec-h"><span class="material-symbols-outlined">bar_chart</span>各代理商請款金額<span class="tag">Top 6</span></div><div class="chart-box" id="c1a"></div></div>'+
    '<div class="card"><div class="sec-h"><span class="material-symbols-outlined">timeline</span>請款單產出時間軸</div>'+
      '<ul class="tl">'+
        '<li class="tl-item done"><span class="dot"></span><div class="tl-t">核算資料鎖定</div><div class="tl-d">1,284 筆訂單完成核算並凍結</div><div class="tl-time">08/12 09:20</div></li>'+
        '<li class="tl-item done"><span class="dot"></span><div class="tl-t">預付款扣抵</div><div class="tl-d">沖抵 12 家代理商預付款 NT$ 0.51M</div><div class="tl-time">08/12 10:05</div></li>'+
        '<li class="tl-item now"><span class="dot"></span><div class="tl-t">批次產出請款單</div><div class="tl-d">已產出 186 張，23 張待送審</div><div class="tl-time">08/13 14:40</div></li>'+
        '<li class="tl-item"><span class="dot"></span><div class="tl-t">送財務審核</div><div class="tl-d">預計 08/14 送出</div><div class="tl-time">排程中</div></li>'+
      '</ul></div>'+
  '</div>'+
  '<div class="card" style="margin-top:16px"><div class="sec-h"><span class="material-symbols-outlined">description</span>請款單明細<span class="tag">含預付款扣抵</span></div>'+

/* ---------- helpers ---------- */
function kpiCard(k){
  var arrow=k.dir==="up"?"trending_up":(k.dir==="down"?"trending_down":"remove");
  var dcls=k.dir==="flat"?"flat":k.dir;
  var delta=k.d?('<div class="k-delta '+dcls+'"><span class="material-symbols-outlined">'+arrow+'</span>'+esc(k.d)+'</div>'):'';
  return '<div class="card kpi"><div class="k-top"><div class="k-ic"><span class="material-symbols-outlined">'+k.ic+'</span></div></div>'+
    '<div class="k-val">'+esc(k.val)+'</div><div class="k-lab">'+esc(k.lab)+'</div>'+delta+'</div>';
}
function statRow(ic,t,s,v){
  return '<div class="stat-row"><div class="si"><span class="material-symbols-outlined">'+ic+'</span></div>'+
    '<div class="st"><b>'+esc(t)+'</b><span>'+esc(s)+'</span></div><div class="sv">'+esc(v)+'</div></div>';
}

var SCREENS=[s0,s1,s2,s3,s4,s5];

/* ---------- nav ---------- */
var navEl=document.getElementById("nav");
navEl.innerHTML=MODS.map(function(m,i){
  return '<button class="navbtn" data-i="'+i+'"><span class="material-symbols-outlined">'+m.ic+'</span><span class="nt">'+esc(m.name)+'</span><span class="navnum">0'+(i+1)+'</span></button>';
}).join("");

function show(i){
  destroyCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){ btns[j].classList.toggle("on",+btns[j].getAttribute("data-i")===i); }
  var m=MODS[i]||MODS[0];
  document.getElementById("scr-title").textContent=m.name;
  document.getElementById("scr-sub").textContent=m.sub;
  view.innerHTML="";
  void view.offsetHeight;
  (SCREENS[i]||SCREENS[0])();
}
navEl.addEventListener("click",function(e){
  var b=e.target.closest?e.target.closest("[data-i]"):null;
  if(!b) return;
  location.hash="v"+(+b.getAttribute("data-i"));
});

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}
window.addEventListener("hashchange",fromHash);fromHash();
})();
</script>
