<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>多店銷售洞察台 · Multi-Store Analytics</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;500;600;700&family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000000;
  --color-secondary:#10B981;
  --color-on-secondary:#0F172A;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#ECFDF5;
  --color-foreground:#064E3B;
  --color-card:#FFFFFF;
  --color-card-foreground:#064E3B;
  --color-muted:#E8F1F3;
  --color-muted-foreground:#475569;
  --color-border:#A7F3D0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#059669;
  --blue:#059669;
  --ink:#064E3B;
  --muted:#475569;
  --line:#A7F3D0;
  --panel:#FFFFFF;
  --panel2:#F3FAF7;
  --ok:#047857;
  --warn:#B45309;
  --bad:#B91C1C;
  --vio:#6D28D9;
  --shadow:0 1px 2px rgba(6,78,59,.06),0 10px 26px rgba(6,78,59,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  color:var(--ink);
  background:
    linear-gradient(rgba(5,150,105,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(5,150,105,.035) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  font-family:"Nunito Sans",sans-serif;
  line-height:1.5;
}
button{font:inherit}
button,.crumb,.chip .c{cursor:pointer}
button:focus-visible,.crumb:focus-visible,.chip .c:focus-visible{
  outline:3px solid rgba(5,150,105,.28);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-size:20px;
  line-height:1;
  vertical-align:middle;
  font-variation-settings:"FILL" 0,"wght" 500,"GRAD" 0,"opsz" 24;
}
.top{
  position:sticky;
  z-index:20;
  top:0;
  display:flex;
  align-items:center;
  gap:24px;
  min-height:72px;
  padding:10px clamp(16px,3vw,40px);
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.94);
  box-shadow:0 1px 0 rgba(6,78,59,.04);
  backdrop-filter:blur(14px);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  display:grid;
  place-items:center;
  width:42px;
  height:42px;
  flex:none;
  border-radius:10px;
  color:#fff;
  background:var(--color-primary);
  box-shadow:4px 4px 0 #A7F3D0;
  font-family:Rubik,sans-serif;
  font-weight:700;
}
.brand b{
  display:block;
  font-size:15px;
  font-weight:700;
  letter-spacing:.02em;
}
.brand span{
  display:block;
  color:var(--color-primary);
  font-family:Rubik,sans-serif;
  font-size:9px;
  font-weight:600;
  letter-spacing:.17em;
}
.tick{
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px 10px;
  border:1px solid var(--line);
  border-radius:999px;
  color:#065F46;
  background:#F0FDF4;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}
.tick i{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--ok);
  animation:pulse 1.8s ease-in-out infinite;
}
.nav{
  display:flex;
  align-items:center;
  gap:4px;
  min-width:0;
  margin-left:auto;
}
.nav button{
  display:flex;
  align-items:center;
  gap:6px;
  min-height:42px;
  padding:8px 10px;
  border:1px solid transparent;
  border-radius:8px;
  color:var(--muted);
  background:transparent;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
  transition:background-color .2s,color .2s,border-color .2s,transform .2s;
}
.nav button:hover{
  color:var(--ink);
  border-color:var(--line);
  background:#F0FDF4;
  transform:translateY(-1px);
}
.nav button.on{
  color:#fff;
  border-color:var(--color-primary);
  background:var(--color-primary);
}
.wrap{width:min(1360px,100%);margin:auto;padding:28px clamp(16px,3vw,40px) 48px}
.vh{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:20px;
}
.vh h2{
  margin:0;
  font-family:Rubik,"Nunito Sans",sans-serif;
  font-size:clamp(23px,2.4vw,32px);
  line-height:1.15;
  letter-spacing:-.025em;
}
.vh p{max-width:680px;margin:7px 0 0;color:var(--muted);font-size:13px}
.pill{
  display:flex;
  align-items:center;
  min-height:38px;
  padding:8px 14px;
  border:1px solid #FDBA74;
  border-radius:999px;
  color:#7C2D12;
  background:#FFF7ED;
  font-family:Rubik,sans-serif;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
}
.view{display:none}
.view.on{display:block;animation:reveal .35s ease-out both}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi,.card,.bp{
  border:1px solid var(--line);
  background:var(--panel);
  box-shadow:var(--shadow);
}
.kpi{
  position:relative;
  overflow:hidden;
  min-width:0;
  min-height:130px;
  padding:18px;
  border-radius:12px;
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.kpi::before{
  position:absolute;
  top:0;
  right:0;
  width:64px;
  height:5px;
  background:var(--color-primary);
  content:"";
}
.kpi:hover,.card:hover,.bp:hover{
  border-color:#6EE7B7;
  box-shadow:0 2px 4px rgba(6,78,59,.07),0 16px 34px rgba(6,78,59,.1);
}
.kpi:hover{transform:translateY(-2px)}
.kpi .l{color:var(--muted);font-size:12px;font-weight:700}
.kpi .v{
  margin-top:6px;
  color:#052E25;
  font-family:Rubik,sans-serif;
  font-size:28px;
  font-weight:600;
  font-variant-numeric:tabular-nums;
}
.kpi .d{margin-top:5px;font-size:11px;font-weight:700}
.up{color:#047857}.dn{color:#B91C1C}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.35fr) minmax(300px,.9fr)}
.g11{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{
  min-width:0;
  padding:18px;
  border-radius:12px;
  transition:border-color .22s ease,box-shadow .22s ease;
}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 14px;
  color:#052E25;
  font-family:Rubik,"Nunito Sans",sans-serif;
  font-size:14px;
  font-weight:600;
  letter-spacing:-.01em;
}
.card h3 .material-symbols-outlined{color:var(--color-primary)}
.chart{height:230px}
.tag{
  display:inline-flex;
  align-items:center;
  min-height:22px;
  padding:2px 8px;
  border:1px solid transparent;
  border-radius:999px;
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
}
.t-r{color:#991B1B;border-color:#FECACA;background:#FEF2F2}
.t-a{color:#92400E;border-color:#FED7AA;background:#FFF7ED}
.t-b{color:#065F46;border-color:#A7F3D0;background:#ECFDF5}
.t-g{color:#065F46;border-color:#BBF7D0;background:#F0FDF4}
.t-v{color:#5B21B6;border-color:#DDD6FE;background:#F5F3FF}
.scroll{overflow:auto}
table.data{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  font-size:12px;
}
table.data th,table.data td{
  padding:11px 12px;
  border-bottom:1px solid var(--line);
  text-align:left;
  white-space:nowrap;
}
table.data th{
  color:#334155;
  background:#F0FDF4;
  font-size:10px;
  font-weight:800;
  letter-spacing:.06em;
  text-transform:uppercase;
}
table.data tr:hover td{background:#F7FCFA}
table.data th.num,table.data td.num,.num{text-align:right}
.num,.rev,.val,[class*="kv"],table.data td:nth-child(n+2){
  font-family:Rubik,sans-serif;
  font-variant-numeric:tabular-nums;
}
table.data td:nth-child(2){font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;color:var(--muted);font-size:11px}
.legend span{display:flex;align-items:center;gap:6px}
.dot{display:inline-block;width:9px;height:9px;border:1px solid rgba(6,78,59,.25);border-radius:2px}
.bars{display:flex;flex-direction:column;gap:12px}
.br{display:grid;grid-template-columns:90px 1fr 48px;align-items:center;gap:10px;font-size:12px}
.br b{font-weight:700}
.br .track,.sc .bar{overflow:hidden;background:#DDEAE6}
.br .track{height:10px;border-radius:2px}
.br .track i,.sc .bar i{display:block;height:100%}
.br .val{text-align:right;font-weight:600}
.storelist{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}
.sc,.kc,.oz,.prev,.sched{
  border:1px solid var(--line);
  background:var(--panel2);
}
.sc{
  position:relative;
  overflow:hidden;
  padding:14px;
  border-radius:9px;
  transition:background-color .2s,border-color .2s,transform .2s;
}
.sc:hover{border-color:#6EE7B7;background:#fff;transform:translateY(-2px)}
.sc .top2{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.sc b{font-size:13px}
.sc .rev{margin-top:7px;color:#052E25;font-size:19px;font-weight:600}
.sc small{display:block;margin-top:2px;color:var(--muted);font-size:11px}
.sc .bar{height:6px;margin-top:10px;border-radius:2px}
.fi{
  display:flex;
  align-items:flex-start;
  gap:10px;
  margin-bottom:9px;
  padding:11px 12px;
  border:1px solid var(--line);
  border-left:4px solid var(--color-primary);
  border-radius:8px;
  background:#FAFFFD;
}
.fi>.material-symbols-outlined{flex:none;color:var(--color-primary);font-size:19px}
.fi.r{border-left-color:var(--bad)}.fi.r>.material-symbols-outlined{color:var(--bad)}
.fi.a{border-left-color:var(--warn)}.fi.a>.material-symbols-outlined{color:var(--warn)}
.fi.g{border-left-color:var(--ok)}.fi.g>.material-symbols-outlined{color:var(--ok)}
.fi b{font-size:12px}
.fi small{display:block;margin-top:2px;color:var(--muted);font-size:11px;line-height:1.5}
.dl{display:flex;align-items:center;gap:7px;margin-bottom:15px;color:var(--muted);font-size:12px}
.dl .crumb{
  padding:6px 10px;
  border:1px solid var(--line);
  border-radius:7px;
  color:var(--ink);
  background:#fff;
  font-weight:700;
}
.dl .crumb.act{color:#fff;border-color:var(--color-primary);background:var(--color-primary)}
.dl .material-symbols-outlined{font-size:16px}
.bsc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.bp{
  position:relative;
  overflow:hidden;
  min-width:0;
  padding:16px;
  border-radius:12px;
  transition:border-color .22s ease,box-shadow .22s ease;
}
.bp::before{position:absolute;inset:0 auto 0 0;width:4px;content:""}
.bp.f::before{background:#059669}.bp.c::before{background:#047857}
.bp.p::before{background:#EA580C}.bp.l::before{background:#6D28D9}
.bp .bh{display:flex;align-items:center;gap:9px;margin-bottom:13px}
.bp .bh .material-symbols-outlined{font-size:22px}
.bp.f .bh .material-symbols-outlined{color:#059669}
.bp.c .bh .material-symbols-outlined{color:#047857}
.bp.p .bh .material-symbols-outlined{color:#C2410C}
.bp.l .bh .material-symbols-outlined{color:#6D28D9}
.bp .bh b{font-size:14px}
.bp .bh small{display:block;color:var(--muted);font-size:10px}
.bkpi{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px dashed var(--line)}
.bkpi .kl{color:var(--muted);font-size:11px}
.bkpi .kv{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600}
.bkpi .kg{padding:2px 6px;border-radius:999px;font-size:9px;font-weight:800}
.mini{height:44px;margin-top:7px}
.kb{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.kc{padding:14px;border-radius:9px}
.kc .material-symbols-outlined{color:var(--color-primary);font-size:23px}
.kc b{display:block;margin:7px 0 4px;font-size:13px}
.kc p{margin:0;color:var(--muted);font-size:11px;line-height:1.6}
.kc .mt{margin-top:8px;color:#047857;font-size:10px;font-weight:800}
.rep{display:grid;grid-template-columns:minmax(330px,.85fr) minmax(0,1.15fr);gap:16px}
.opt{display:flex;flex-direction:column;gap:9px}
.oz{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:11px 12px;
  border-radius:8px;
}
.oz b{font-size:12px}
.oz small{display:block;color:var(--muted);font-size:10px}
.chip{display:inline-flex;flex-wrap:wrap;gap:5px}
.chip .c{
  padding:3px 8px;
  border:1px solid #6EE7B7;
  border-radius:999px;
  color:#065F46;
  background:#D1FAE5;
  font-size:10px;
  font-weight:800;
}
.chip .c.off{color:var(--muted);border-color:#CBD5E1;background:#fff}
.prev{padding:16px;border-style:dashed;border-radius:10px}
.prev .ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.prev .ph b{font-size:14px}.prev .ph small{display:block;color:var(--muted);font-size:10px}
.sched{
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:8px;
  padding:10px 11px;
  border-radius:8px;
  font-size:11px;
}
.sched .material-symbols-outlined{color:var(--color-primary);font-size:18px}
.sched .r{margin-left:auto;color:var(--muted)}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:1080px){
  .top{gap:14px}.tick{display:none}
  .nav button{padding:8px}.nav button span:not(.material-symbols-outlined){display:none}
  .kpis,.bsc{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.rep{grid-template-columns:1fr}
}
@media(max-width:700px){
  .top{align-items:flex-start;flex-wrap:wrap}
  .nav{width:100%;overflow-x:auto;margin-left:0;padding-bottom:2px}
  .nav button{flex:1;justify-content:center;min-width:44px}
  .wrap{padding-top:20px}.vh{align-items:flex-start;flex-direction:column}
  .g11,.g3{grid-template-columns:1fr}
  .dl{overflow-x:auto;padding-bottom:4px}.dl>*{flex:none}
}
@media(max-width:480px){
  .brand span{display:none}.kpis,.bsc{grid-template-columns:1fr}
  .kpi{min-height:116px}.card{padding:14px}
  .br{grid-template-columns:82px 1fr 42px}.sched{align-items:flex-start;flex-wrap:wrap}
  .sched .r{width:100%;margin-left:27px}.chart{height:220px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .view.on{animation:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo">洞</div><div><b>多店銷售洞察台</b><span>MULTI-STORE ANALYTICS</span></div></div>
  <div class="tick"><i></i><span>同步正常 · 28 門市即時同步</span></div>
  <nav class="nav" id="nav" aria-label="主要功能"></nav>
</header>
<main class="wrap">
  <div class="vh"><div><h2 id="vt">經營儀表板</h2><p id="vd"></p></div><div class="pill" id="badge">本月營收 NT$ 86.4M</div></div>
  <div id="view"></div>
</main>
<script>
var MOD=[
["經營儀表板","dashboard","經營儀表板","28 門市營收、客單與達成率的即時經營看板"],
["趨勢分析","trending_up","趨勢分析","多門市/多通路營收與客流走勢與同期比較"],
["指標下鑽","zoom_in","指標下鑽","從區域→門市→品類→單品逐層鑽取營收明細"],
["平衡計分卡","scoreboard","平衡計分卡","財務/顧客/流程/學習四構面策略 KPI 對齊"],
["AI 洞察","auto_awesome","AI 洞察","自動偵測異常、機會與行動建議"],
["報表匯出","description","報表匯出","自訂報表、排程寄送與多格式匯出"]
];
var nav=document.getElementById("nav"),view=document.getElementById("view"),vt=document.getElementById("vt"),vd=document.getElementById("vd"),badge=document.getElementById("badge");
MOD.forEach(function(m,i){
  var b=document.createElement("button");
  b.type="button";b.dataset.i=i;b.className=i===0?"on":"";
  b.setAttribute("aria-label",m[0]);b.setAttribute("aria-current",i===0?"page":"false");
  b.innerHTML='<span class="material-symbols-outlined" aria-hidden="true">'+m[1]+'</span><span>'+m[0]+'</span>';
  b.onclick=function(){location.hash="v"+i};
  nav.appendChild(b);
});
var BADGE=["本月營收 NT$ 86.4M","近 12 週 +18.6%","下鑽 · 北區/信義","綜合達成 94%","洞察 5 則 · 待處理 2","排程 6 · 今日已寄 3"];
var STORES=[
["信義旗艦店","北區","NT$ 8.42M",112,"g"],["南港 CITYLINK","北區","NT$ 6.18M",104,"g"],
["台中大遠百","中區","NT$ 5.74M",98,"b"],["新竹巨城","北區","NT$ 4.96M",96,"b"],
["高雄夢時代","南區","NT$ 5.31M",92,"b"],["台南南紡","南區","NT$ 3.88M",84,"a"],
["桃園統領","北區","NT$ 3.42M",78,"a"],["板橋大遠百","北區","NT$ 4.11M",89,"b"]
];
var FEED=[
["信義旗艦店客單創新高","客單價 NT$ 1,284，較上月 +11%，會員回購帶動","g","即時"],
["台南南紡達成率落後","本月僅 84%，週末客流較同期 -9%，建議加碼檔期","a","1 小時前"],
["美妝品類跨店缺貨","3 門市熱銷色號可售天數 < 2 天，已觸發補貨","r","2 小時前"],
["線上到店取貨成長","BOPIS 佔比升至 21%，帶動連帶購買率 +6pt","g","昨日"]
];
var CHANNEL=[["實體門市",62,"#059669"],["官網電商",23,"#10B981"],["外送平台",9,"#EA580C"],["社群導購",6,"#6D28D9"]];
var DRILL={
 region:[["北區",34.6,"#059669"],["中區",18.2,"#10B981"],["南區",21.4,"#EA580C"],["東區",6.8,"#6D28D9"],["電商倉",5.4,"#0F766E"]],
 store:[["信義旗艦店",8.42],["南港 CITYLINK",6.18],["新竹巨城",4.96],["板橋大遠百",4.11],["桃園統領",3.42]],
 cat:[["美妝保養",3.28],["女裝",2.14],["3C 配件",1.42],["生活家居",.98],["食品飲料",.6]],
 sku:[["精華液 30ml #玫瑰","BW-3021","NT$ 486K",1284,"g"],["粉底液 #自然色","BW-1188","NT$ 372K",930,"g"],["保濕面膜 5入","BW-2044","NT$ 298K",1490,"b"],["護唇膏 #裸粉","BW-0912","NT$ 184K",1533,"b"],["卸妝油 200ml","BW-3310","NT$ 156K",624,"a"]]
