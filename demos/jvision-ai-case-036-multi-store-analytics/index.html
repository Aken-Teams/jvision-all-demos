<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>多店銷售洞察台 · Multi-Store Analytics</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--accent:#0369a1;--accent2:#38bdf8;--bg:#0b1220;--panel:#111c31;--panel2:#0d1728;--line:#1d2c44;--ink:#e6eef8;--mut:#8296b3;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--vio:#a78bfa}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;vertical-align:middle;line-height:1}
.top{background:linear-gradient(90deg,#0a1526,#12213a);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:11px 20px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:900;color:#031321;flex:none;box-shadow:0 0 20px rgba(56,189,248,.5)}
.brand b{font-size:15px;font-weight:800;display:block;font-family:"Noto Sans TC"}
.brand span{font-size:10px;color:var(--accent2);letter-spacing:2px}
.tick{margin-left:14px;display:flex;align-items:center;gap:7px;background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.3);padding:5px 11px;border-radius:8px;font-size:11.5px;font-weight:700;color:#7dd3fc;white-space:nowrap;min-width:0}
.tick i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;animation:bl 1.6s infinite}
@keyframes bl{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(34,197,94,.5)}50%{opacity:.4;box-shadow:0 0 0 5px rgba(34,197,94,0)}}
.nav{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap;min-width:0}
.nav button{border:0;background:transparent;color:var(--mut);font:inherit;font-weight:600;font-size:13px;padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:18px}
.nav button:hover{background:#182640;color:var(--ink)}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.wrap{max-width:1320px;margin:0 auto;padding:20px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{margin:0;font-size:20px;font-family:"Noto Sans TC";font-weight:900}
.vh p{margin:3px 0 0;color:var(--mut);font-size:13px}
.pill{background:rgba(3,105,161,.22);color:#7dd3fc;border:1px solid rgba(56,189,248,.4);padding:6px 13px;border-radius:8px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:7px;white-space:nowrap}
.view{display:none;animation:f .3s}
.view.on{display:block}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}
.kpis>*{min-width:0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 15px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,rgba(56,189,248,.16),transparent 70%)}
.kpi .l{font-size:11.5px;color:var(--mut);font-weight:600}
.kpi .v{font-size:24px;font-weight:800;margin-top:3px;font-family:Inter}
.kpi .d{font-size:11px;font-weight:700;margin-top:2px}
.up{color:#86efac}.dn{color:#fca5a5}
.grid{display:grid;gap:15px}.grid>*{min-width:0}
.g2{grid-template-columns:1.35fr .9fr}
.g11{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px}
.card h3{margin:0 0 12px;font-size:13.5px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px;flex-wrap:wrap;color:var(--ink)}
.card h3 .material-symbols-outlined{color:var(--accent2)}
.chart{height:230px}
.tag{font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;white-space:nowrap}
.t-r{background:rgba(239,68,68,.2);color:#fca5a5}.t-a{background:rgba(245,158,11,.2);color:#fcd34d}.t-b{background:rgba(56,189,248,.2);color:#7dd3fc}.t-g{background:rgba(34,197,94,.2);color:#86efac}.t-v{background:rgba(167,139,250,.2);color:#c4b5fd}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px}
table.data tr:hover td{background:var(--panel2)}
.num{font-family:Inter;font-weight:700;text-align:right}
.scroll{overflow-x:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:6px}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.bars{display:flex;flex-direction:column;gap:11px}
.br{display:grid;grid-template-columns:96px 1fr 60px;align-items:center;gap:10px;font-size:12px}
.br b{font-family:"Noto Sans TC";font-weight:700}
.br .track{height:12px;background:#16233b;border-radius:6px;overflow:hidden}
.br .track i{display:block;height:100%;border-radius:6px}
.br .val{font-family:Inter;font-weight:800;text-align:right}
.bsc{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.bsc>*{min-width:0}
.bp{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;position:relative;overflow:hidden}
.bp::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.bp.f::before{background:#38bdf8}.bp.c::before{background:#22c55e}.bp.p::before{background:#f59e0b}.bp.l::before{background:#a78bfa}
.bp .bh{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.bp .bh .material-symbols-outlined{font-size:22px}
.bp.f .bh .material-symbols-outlined{color:#38bdf8}.bp.c .bh .material-symbols-outlined{color:#22c55e}.bp.p .bh .material-symbols-outlined{color:#f59e0b}.bp.l .bh .material-symbols-outlined{color:#a78bfa}
.bp .bh b{font-family:"Noto Sans TC";font-size:14px}
.bp .bh small{color:var(--mut);font-size:10px;display:block}
.bkpi{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:7px 0;border-top:1px dashed var(--line)}
.bkpi:first-of-type{border-top:0}
.bkpi .kl{font-size:11.5px;color:var(--mut)}
.bkpi .kv{font-family:Inter;font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px}
.bkpi .kg{font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:10px}
.mini{height:44px;margin-top:8px}
.dl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);margin-bottom:12px;flex-wrap:wrap}
.dl .crumb{background:var(--panel2);border:1px solid var(--line);padding:5px 11px;border-radius:8px;font-weight:700;color:var(--ink);font-family:"Noto Sans TC"}
.dl .crumb.act{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.dl .material-symbols-outlined{font-size:16px}
.kc{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:14px}
.kb{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:13px}
.kb>*{min-width:0}
.kc .material-symbols-outlined{color:var(--accent2);font-size:24px}
.kc b{display:block;font-family:"Noto Sans TC";font-size:14px;margin:7px 0 5px}
.kc p{margin:0;font-size:12px;color:var(--mut);line-height:1.6}
.kc .mt{margin-top:9px;font-size:11px;color:var(--accent2);font-weight:700}
.fi{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:9px;background:var(--panel2);border-left:3px solid var(--accent2);margin-bottom:9px}
.fi .material-symbols-outlined{font-size:18px;flex:none;color:var(--accent2)}
.fi.r{border-color:var(--bad)}.fi.r>.material-symbols-outlined{color:var(--bad)}
.fi.a{border-color:var(--warn)}.fi.a>.material-symbols-outlined{color:var(--warn)}
.fi.g{border-color:var(--ok)}.fi.g>.material-symbols-outlined{color:var(--ok)}
.fi b{font-size:12.5px;font-family:"Noto Sans TC"}
.fi small{display:block;color:var(--mut);font-size:11px;margin-top:2px;line-height:1.5}
.storelist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.storelist>*{min-width:0}
.sc{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px;position:relative;overflow:hidden}
.sc .top2{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.sc b{font-family:"Noto Sans TC";font-size:13.5px}
.sc .rev{font-family:Inter;font-size:20px;font-weight:900;margin-top:5px}
.sc small{color:var(--mut);font-size:11px;display:block;margin-top:3px}
.sc .bar{height:6px;background:#16233b;border-radius:4px;overflow:hidden;margin-top:9px}
.sc .bar i{display:block;height:100%}
.rep{display:grid;grid-template-columns:.85fr 1.15fr;gap:15px}.rep>*{min-width:0}
.opt{display:flex;flex-direction:column;gap:9px}
.oz{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--panel2);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.oz b{font-family:"Noto Sans TC";font-size:12.5px}
.oz small{color:var(--mut);font-size:11px;display:block}
.chip{display:inline-flex;gap:5px;flex-wrap:wrap}
.chip .c{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:rgba(56,189,248,.14);color:#7dd3fc;border:1px solid rgba(56,189,248,.3)}
.chip .c.off{background:transparent;color:var(--mut);border-color:var(--line)}
.prev{border:1px dashed var(--line);border-radius:12px;background:var(--panel2);padding:16px}
.prev .ph{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:11px;margin-bottom:13px;gap:8px;flex-wrap:wrap}
.prev .ph b{font-family:"Noto Sans TC";font-size:15px}
.prev .ph small{color:var(--mut);font-size:11px;display:block}
.sched{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:9px;background:var(--panel);border:1px solid var(--line);margin-bottom:8px;font-size:12px;flex-wrap:wrap}
.sched .material-symbols-outlined{color:var(--accent2);font-size:18px}
.sched b{font-family:"Noto Sans TC"}
.sched .r{margin-left:auto;color:var(--mut)}
@media(max-width:980px){.kpis,.bsc{grid-template-columns:repeat(2,1fr)}.g2,.g11,.g3,.rep{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:14px}.tick{display:none}.nav button span:not(.material-symbols-outlined){display:none}.nav button{padding:9px}.kpis,.bsc{grid-template-columns:1fr}}
</style>
</head>
<body>

function(){return '<div class="kpis">'+
 '<div class="kpi"><div class="l">本月總營收</div><div class="v">86.4<small style="font-size:12px">M</small></div><div class="d up">▲ 達成率 94% · 同期 +18.6%</div></div>'+

 '<div class="grid g2">'+

 '<div class="legend"><span><span class="dot" style="background:#38bdf8"></span>實體門市</span><span><span class="dot" style="background:#22c55e"></span>官網電商</span><span><span class="dot" style="background:#f59e0b"></span>外送/社群</span></div></div>'+

 '</div>'+
 '<div class="card" style="margin-top:15px"><h3><span class="material-symbols-outlined">storefront</span>門市營收 Top 8 · 達成率</h3><div class="storelist">'+
 STORES.map(function(s){var c=s[4]=='g'?'var(--ok)':s[4]=='b'?'var(--accent2)':'var(--warn)';return '<div class="sc"><div class="top2"><b>'+s[0]+'</b><span class="tag '+(s[4]=='g'?'t-g':s[4]=='b'?'t-b':'t-a')+'">'+s[1]+'</span></div><div class="rev">'+s[2]+'</div><small>達成率 '+s[3]+'%</small><div class="bar"><i style="width:'+Math.min(100,s[3])+'%;background:'+c+'"></i></div></div>';}).join('')+
