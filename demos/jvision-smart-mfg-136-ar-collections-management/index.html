<style>
:root{--accent:#ea580c;--accent2:#fb923c;--bg:#f5f5f4;--card:#ffffff;--ink:#1c1917;--muted:#78716c;--line:#e7e5e4;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Inter","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
.msym{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.04);}
.tbInner{max-width:1360px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.logo .msym{font-size:22px;}
.bTitle{font-weight:800;font-size:15px;line-height:1.2;letter-spacing:.2px;}
.bSub{font-size:11px;color:var(--muted);}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0;}
.nav button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fafaf9;color:var(--muted);padding:8px 12px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;min-width:0;}
.nav button .msym{font-size:18px;}
.nav button:hover{border-color:var(--accent2);color:var(--accent);}
.nav button.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(234,88,12,.25);}
main{max-width:1360px;margin:0 auto;padding:20px 18px 60px;}
.scrHead{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.scrHead .ic{width:44px;height:44px;border-radius:11px;background:#fff7ed;color:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto;border:1px solid #fed7aa;}
.scrHead .ic .msym{font-size:24px;}
.scrHead h2{font-size:20px;font-weight:800;line-height:1.2;}
.scrHead p{font-size:13px;color:var(--muted);margin-top:3px;max-width:70ch;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;}
.cardH{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.cardH .msym{font-size:19px;color:var(--accent);}
.cardH h3{font-size:14px;font-weight:700;}
.cardH .sub{font-size:11px;color:var(--muted);margin-left:auto;}
.grid{display:grid;gap:14px;min-width:0;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g23{grid-template-columns:2fr 1fr;}
@media(max-width:820px){.g4,.g3,.g2,.g23{grid-template-columns:1fr;}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0;position:relative;overflow:hidden;}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);}
.kpi .kl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.kpi .kl .msym{font-size:16px;}
.kpi .kv{font-size:25px;font-weight:800;margin-top:8px;letter-spacing:-.5px;}
.kpi .kv small{font-size:13px;font-weight:600;color:var(--muted);}
.kpi .kd{font-size:11px;margin-top:5px;font-weight:600;display:flex;align-items:center;gap:2px;}
.up{color:var(--bad);}.down{color:var(--ok);}
.chart{width:100%;height:280px;overflow:hidden;}
.chartS{width:100%;height:230px;overflow:hidden;}
.tblWrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line);}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px;}
th{background:#fafaf9;text-align:left;padding:10px 12px;font-weight:700;color:var(--muted);font-size:11.5px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#fff7ed;}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;}
.t-ok{background:#dcfce7;color:#15803d;}
.t-warn{background:#ffedd5;color:#c2410c;}
.t-bad{background:#fee2e2;color:#b91c1c;}
.t-gray{background:#f3f4f6;color:#4b5563;}
.mono{font-variant-numeric:tabular-nums;font-weight:700;}
.bar{height:7px;border-radius:99px;background:#f1f0ef;overflow:hidden;min-width:60px;}
.bar>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:0;}
@media(max-width:820px){.board{grid-template-columns:1fr;}}
.col{background:#fafaf9;border:1px solid var(--line);border-radius:13px;padding:11px;min-width:0;}
.colH{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;margin-bottom:10px;padding-bottom:9px;border-bottom:2px solid var(--line);}
.colH .cnt{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:99px;font-size:11px;padding:1px 9px;color:var(--muted);}
.colH .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
.kcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.03);border-left:3px solid var(--accent);min-width:0;}
.kcard:last-child{margin-bottom:0;}
.kcard .kt{font-weight:700;font-size:13px;margin-bottom:6px;display:flex;justify-content:space-between;gap:6px;align-items:baseline;}
.kcard .amt{color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap;}
.kcard .kmeta{font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:5px 10px;margin-top:6px;align-items:center;}
.kcard .kmeta span{display:inline-flex;align-items:center;gap:3px;}
.kcard .kmeta .msym{font-size:14px;}
.who{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;}
.tl{position:relative;padding-left:26px;}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tlItem{position:relative;padding-bottom:18px;}
.tlItem:last-child{padding-bottom:0;}
.tlDot{position:absolute;left:-24px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;border:3px solid var(--accent);}
.tlItem.done .tlDot{background:var(--accent);}
.tlTime{font-size:11px;color:var(--muted);font-weight:600;}
.tlBody{font-size:13px;margin-top:2px;}
.tlNote{font-size:12px;color:var(--muted);margin-top:3px;background:#fafaf9;border:1px solid var(--line);border-radius:8px;padding:6px 9px;}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:8px;}
.sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto;}
.rowFlex{display:flex;align-items:center;gap:8px;min-width:0;}
.assignRow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;min-width:0;}
.assignRow:last-child{border-bottom:none;}
.av{width:36px;height:36px;border-radius:10px;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.scoreRing{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:0 0 auto;color:#fff;}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line);}
@media(max-width:560px){.nav button span.txt{display:none;}.nav button{padding:8px;}.bSub{display:none;}}
</style>
</head>

function show(i){
 disposeCharts();
 var btns=document.querySelectorAll("[data-i]");
 for(var b=0;b<btns.length;b++){btns[b].classList.toggle("active",+btns[b].getAttribute("data-i")===i);}

}
