<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" href="../../favicon.svg"/>
<title>應收帳款催收管理 AR/Collections Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#059669;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#0F172A;
  --color-card:#FFFFFF;
  --color-card-foreground:#0F172A;
  --color-muted:#F1F5FD;
  --color-muted-foreground:#475569;
  --color-border:#E4ECFC;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#0F172A;
  --muted:#475569;
  --line:#E4ECFC;
  --accent:#2563EB;
  --accent2:#3B82F6;
  --bg:#F8FAFC;
  --card:#FFFFFF;
  --ok:#047857;
  --warn:#B45309;
  --bad:#DC2626;
}

*{box-sizing:border-box;margin:0;padding:0;}
html{background:var(--color-background);scroll-behavior:auto;}
body{
  min-width:320px;
  font-family:"Inter","Noto Sans TC",system-ui,sans-serif;
  background-color:var(--color-background);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--ink);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,a,[role="button"]{cursor:pointer;}
button{font:inherit;}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
::selection{background:var(--blue);color:#fff;}
.msym{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  background:#fff;
  border-bottom:3px solid var(--ink);
}
.tbInner{
  width:min(100%,1440px);
  margin:0 auto;
  padding:0 22px;
  display:flex;
  align-items:stretch;
  gap:20px;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:250px;
  padding:12px 18px 12px 0;
  border-right:3px solid var(--ink);
}
.logo{
  width:46px;
  height:46px;
  border:3px solid var(--ink);
  border-radius:0;
  background:var(--blue);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
}
.logo .msym{font-size:25px;}
.bTitle{
  font-size:15px;
  font-weight:900;
  line-height:1.15;
  letter-spacing:-.02em;
}
.bSub{
  margin-top:3px;
  color:var(--muted);
  font-size:10px;
  font-weight:600;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.nav{
  display:flex;
  align-items:stretch;
  gap:0;
  margin-left:auto;
  min-width:0;
  overflow-x:auto;
  scrollbar-width:thin;
}
.nav button{
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  border:0;
  border-left:1px solid var(--line);
  border-radius:0;
  background:#fff;
  color:var(--muted);
  padding:10px 14px;
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
  transition:background-color .16s ease,color .16s ease;
}
.nav button:last-child{border-right:1px solid var(--line);}
.nav button .msym{font-size:19px;}
.nav button:hover{background:var(--color-muted);color:var(--blue);}
.nav button.active{
  background:var(--blue);
  color:#fff;
  border-color:var(--ink);
  box-shadow:inset 0 -6px 0 var(--color-accent);
}

main{
  width:min(calc(100% - 36px),1400px);
  margin:0 auto;
  padding:34px 0 64px;
}
#screen>*,.scrHead,.kpi,.card{animation:brutal-in .35s ease-out both;}
.scrHead{
  position:relative;
  width:calc(100% - 4%);
  min-height:112px;
  margin:0 0 26px 4%;
  padding:22px 250px 22px 24px;
  display:flex;
  align-items:center;
  gap:16px;
  background:var(--ink);
  color:#fff;
  border:3px solid var(--ink);
}
.scrHead::after{
  content:"COLLECTIONS / WORKSPACE";
  position:absolute;
  right:-3px;
  top:-3px;
  bottom:-3px;
  width:220px;
  padding:20px;
  display:flex;
  align-items:flex-end;
  justify-content:flex-end;
  background:var(--color-accent);
  color:#001b11;
  border-left:3px solid var(--ink);
  font-size:11px;
  font-weight:900;
  letter-spacing:.12em;
  text-align:right;
}
.scrHead .ic{
  width:54px;
  height:54px;
  border:3px solid #fff;
  border-radius:0;
  background:var(--blue);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
}
.scrHead .ic .msym{font-size:29px;}
.scrHead h2{
  font-size:clamp(22px,2.4vw,34px);
  font-weight:900;
  line-height:1.05;
  letter-spacing:-.045em;
}
.scrHead p{
  max-width:68ch;
  margin-top:8px;
  color:#CBD5E1;
  font-size:13px;
  font-weight:500;
}

.grid{display:grid;gap:16px;min-width:0;}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g23{grid-template-columns:minmax(0,2fr) minmax(300px,1fr);}
.card,.kpi{
  min-width:0;
  background:var(--card);
  color:var(--ink);
  border:2px solid var(--ink);
  border-radius:0;
  box-shadow:6px 6px 0 var(--line);
}
.card{padding:18px;}
.cardH{
  min-height:35px;
  display:flex;
  align-items:center;
  gap:8px;
  margin:-18px -18px 18px;
  padding:10px 14px;
  border-bottom:2px solid var(--ink);
  background:var(--color-muted);
}
.cardH .msym{font-size:19px;color:var(--blue);}
.cardH h3{
  color:var(--ink);
  font-size:13px;
  font-weight:900;
  letter-spacing:.02em;
}
.cardH .sub{
  margin-left:auto;
  color:var(--muted);
  font-size:10px;
  font-weight:700;
  letter-spacing:.04em;
}
.kpi{
  position:relative;
  overflow:hidden;
  padding:18px 18px 20px;
}
.kpi::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:7px;
  background:var(--blue);
}
.kpi:nth-child(even)::before{background:var(--color-accent);}
.kpi .kl{
  min-height:24px;
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:11px;
  font-weight:800;
  letter-spacing:.04em;
  text-transform:uppercase;
}
.kpi .kl .msym{font-size:17px;color:var(--blue);}
.kpi .kv{
  margin-top:13px;
  font-size:clamp(24px,2.1vw,32px);
  font-weight:900;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.055em;
  line-height:1;
}
.kpi .kv small{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:0;}
.kpi .kd{
  min-height:20px;
  margin-top:10px;
  display:flex;
  align-items:center;
  gap:3px;
  font-size:11px;
  font-weight:800;
}
.up{color:var(--bad);}
.down{color:var(--ok);}
.chart{width:100%;height:280px;overflow:hidden;}
.chartS{width:100%;height:230px;overflow:hidden;}

.tblWrap{
  width:100%;
  overflow-x:auto;
  border:2px solid var(--ink);
  border-radius:0;
  background:#fff;
}
table{
  width:100%;
  min-width:620px;
  border-collapse:collapse;
  color:var(--ink);
  font-size:12px;
}
th{
  padding:11px 12px;
  background:var(--ink);
  color:#fff;
  border-right:1px solid #475569;
  border-bottom:2px solid var(--ink);
  text-align:left;
  font-size:10px;
  font-weight:900;
  letter-spacing:.06em;
  white-space:nowrap;
}
th:last-child{border-right:0;}
td{
  padding:11px 12px;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  white-space:nowrap;
  vertical-align:middle;
}
td:last-child{border-right:0;}
tr:last-child td{border-bottom:0;}
tbody tr:nth-child(even){background:var(--color-muted);}
tbody tr:hover{background:#DBEAFE;}
td.mono{text-align:right;}
td:first-child.mono{text-align:left;}
.mono{
  font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  font-variant-numeric:tabular-nums;
  font-weight:700;
  letter-spacing:-.02em;
}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  min-height:24px;
  padding:3px 8px;
  border:1px solid currentColor;
  border-radius:0;
  font-size:10px;
  font-weight:900;
  line-height:1.2;
}
.t-ok{background:#D1FAE5;color:#065F46;}
.t-warn{background:#FEF3C7;color:#92400E;}
.t-bad{background:#FEE2E2;color:#991B1B;}
.t-gray{background:#E2E8F0;color:#334155;}

.bar{
  height:10px;
  min-width:60px;
  overflow:hidden;
  background:#E2E8F0;
  border:1px solid var(--ink);
  border-radius:0;
}
.bar>span{
  display:block;
  height:100%;
  border-radius:0;
  background:var(--blue);
  border-right:1px solid var(--ink);
}
.board{
  display:grid;
  grid-template-columns:repeat(4,minmax(230px,1fr));
  gap:0;
  min-width:0;
  border:2px solid var(--ink);
}
.col{
  min-width:0;
  padding:12px;
  background:var(--color-muted);
  border:0;
  border-right:2px solid var(--ink);
  border-radius:0;
}
.col:last-child{border-right:0;}
.colH{
  display:flex;
  align-items:center;
  gap:8px;
  margin:-12px -12px 12px;
  padding:11px 12px;
  background:#fff;
  border-bottom:2px solid var(--ink);
  font-size:12px;
  font-weight:900;
}
.colH .cnt{
  margin-left:auto;
  padding:2px 8px;
  background:var(--ink);
  color:#fff;
  border:1px solid var(--ink);
  border-radius:0;
  font-family:"SFMono-Regular",Consolas,monospace;
  font-size:10px;
}
.colH .dot{
  width:10px;
  height:10px;
  border:2px solid var(--ink);
  border-radius:0;
  flex:0 0 auto;
}
.kcard{
  min-width:0;
  margin-bottom:10px;
  padding:11px;
  background:#fff;
  border:2px solid var(--ink);
  border-left-width:7px;
  border-radius:0;
  box-shadow:3px 3px 0 #CBD5E1;
}
.kcard:last-child{margin-bottom:0;}
.kcard .kt{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:8px;
  margin-bottom:8px;
  font-size:12px;
  font-weight:900;
}
.kcard .amt{
  color:#1D4ED8;
  font-family:"SFMono-Regular",Consolas,monospace;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.kcard .kmeta{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:6px 10px;
  margin-top:7px;
  color:var(--muted);
  font-size:10px;
  font-weight:600;
}
.kcard .kmeta span{display:inline-flex;align-items:center;gap:3px;}
.kcard .kmeta .msym{font-size:14px;}
.who{
  width:25px;
  height:25px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  background:var(--blue);
  color:#fff;
  border:2px solid var(--ink);
  border-radius:0;
  font-size:10px;
  font-weight:900;
}

.tl{position:relative;padding-left:31px;}
.tl::before{
  content:"";
  position:absolute;
  left:8px;
  top:4px;
  bottom:4px;
  width:4px;
  background:var(--ink);
}
.tlItem{position:relative;padding-bottom:20px;}
.tlItem:last-child{padding-bottom:0;}
.tlDot{
  position:absolute;
  left:-31px;
  top:1px;
  width:20px;
  height:20px;
  background:#fff;
  border:4px solid var(--blue);
  border-radius:0;
}
.tlItem.done .tlDot{background:var(--color-accent);border-color:var(--ink);}
.tlTime{
  color:var(--muted);
  font-family:"SFMono-Regular",Consolas,monospace;
  font-size:10px;
  font-weight:700;
}
.tlBody{margin-top:4px;font-size:12px;}
.tlNote{
  margin-top:6px;
  padding:9px 10px;
  background:var(--color-muted);
  color:#334155;
  border:1px solid var(--ink);
  border-radius:0;
  font-size:11px;
  line-height:1.55;
}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;color:var(--muted);font-size:11px;}
.sw{
  width:12px;
  height:12px;
  border:1px solid var(--ink);
  border-radius:0;
  flex:0 0 auto;
}
.rowFlex{display:flex;align-items:center;gap:8px;min-width:0;}
.assignRow{
  display:flex;
  align-items:center;
  gap:14px;
  min-width:0;
  padding:13px 0;
  border-bottom:2px solid var(--line);
  flex-wrap:wrap;
}
.assignRow:last-child{border-bottom:0;}
.av{
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  color:#fff;
  border:2px solid var(--ink);
  border-radius:0;
  font-size:13px;
  font-weight:900;
}
.scoreRing{
  width:46px;
  height:46px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  color:#fff;
  border:3px solid var(--ink);
  border-radius:0;
  font-family:"SFMono-Regular",Consolas,monospace;
  font-size:13px;
  font-weight:900;
}
.foot{
  margin-top:34px;
  padding:17px;
  background:#fff;
  color:var(--muted);
  border:2px solid var(--ink);
  font-size:10px;
  font-weight:600;
  letter-spacing:.03em;
  text-align:center;
}

@keyframes brutal-in{
  from{opacity:0;transform:translateY(12px);}
  to{opacity:1;transform:translateY(0);}
}

@media(max-width:1100px){
  .tbInner{padding:0 16px;flex-wrap:wrap;gap:0;}
  .brand{width:100%;min-width:0;border-right:0;border-bottom:1px solid var(--line);}
  .nav{width:100%;margin-left:0;}
  .nav button{min-height:52px;flex:1;padding:8px 10px;}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));}
  .g23{grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);}
  .board{grid-template-columns:repeat(2,minmax(230px,1fr));}
  .col:nth-child(2){border-right:0;}
  .col:nth-child(-n+2){border-bottom:2px solid var(--ink);}
}

@media(max-width:768px){
  body{background-size:24px 24px;}
  main{width:min(calc(100% - 24px),1400px);padding-top:22px;}
  .scrHead{width:100%;margin-left:0;padding:18px;align-items:flex-start;}
  .scrHead::after{display:none;}
  .scrHead h2{font-size:24px;}
  .g3,.g2,.g23{grid-template-columns:1fr;}
  .card,.kpi{box-shadow:4px 4px 0 var(--line);}
  .board{grid-template-columns:1fr;}
  .col,.col:nth-child(2){border-right:0;border-bottom:2px solid var(--ink);}
  .col:last-child{border-bottom:0;}
  .chart{height:260px;}
}

@media(max-width:560px){
  .tbInner{padding:0 10px;}
  .brand{padding:10px 0;}
  .logo{width:42px;height:42px;}
  .bSub{display:none;}
  .nav button{min-width:48px;min-height:48px;padding:8px;}
  .nav button span.txt{display:none;}
  main{width:calc(100% - 20px);padding:16px 0 40px;}
  .scrHead{min-height:0;padding:15px;gap:12px;}
  .scrHead .ic{width:46px;height:46px;}
  .scrHead h2{font-size:21px;}
  .scrHead p{font-size:12px;}
  .g4{grid-template-columns:1fr;}
  .card{padding:14px;}
  .cardH{margin:-14px -14px 14px;padding:10px;align-items:flex-start;flex-wrap:wrap;}
  .cardH .sub{width:100%;margin-left:27px;}
  .kpi .kv{font-size:28px;}
  .tblWrap{margin-inline:0;}
  table{font-size:11px;}
  th,td{padding:10px;}
  .assignRow{align-items:flex-start;}
}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  #screen>*,.scrHead,.kpi,.card{animation:none!important;transform:none!important;}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="tbInner">
    <div class="brand">
      <div class="logo"><span class="msym">request_quote</span></div>
      <div>
        <div class="bTitle">應收帳款催收管理</div>
        <div class="bSub">AR / Collections Management</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</header>
<main>
  <div id="screen"></div>
  <div class="foot">純 UI 系統展示（無後端）· 畫面與資料皆為擬真示範 · 應收帳款催收管理 AR/Collections Management</div>
</main>
<script>
(function(){
"use strict";
var charts={};
function disposeCharts(){for(var k in charts){if(charts[k]){try{charts[k].dispose();}catch(e){}}}charts={};}
function mkChart(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);charts[id]=c;}

var MODULES=[
 {icon:"monitoring",name:"應收監控儀表",desc:"到期與逾期帳款總覽，追蹤 DSO 與逾期回收率，掌握整體催收健康度。"},

 {icon:"account_tree",name:"催收看板",desc:"催收任務依「待聯繫→催收中→已承諾→已回款」看板流轉，一眼掌握進度。"},
 {icon:"history",name:"催收跟進紀錄",desc:"每筆聯繫、承諾付款與實際回款的完整時間軸，供追蹤與稽核。"},
 {icon:"warning",name:"呆帳風險評估",desc:"客戶信用評分與呆帳風險排序，標示高風險客戶並上報處理決議。"},
 {icon:"groups",name:"業財協同派工",desc:"業務與財務協同指派催收任務、平衡工作量並升級疑難案件。"}
];

function money(n){return "NT$"+n.toLocaleString("en-US");}

var invoices=[
 {no:"INV-24118",cust:"O達精密工業",amt:1280000,due:"2026-08-20",over:0,lvl:"未到期",owner:"陳",risk:"低"},
 {no:"INV-24095",cust:"O興金屬",amt:865000,due:"2026-08-02",over:12,lvl:"1-30",owner:"林",risk:"低"},
 {no:"INV-23980",cust:"永O塑膠",amt:2140000,due:"2026-07-11",over:34,lvl:"31-60",owner:"王",risk:"中"},
 {no:"INV-23842",cust:"鴻O電子",amt:3560000,due:"2026-06-08",over:67,lvl:"61-90",owner:"李",risk:"高"},
 {no:"INV-23611",cust:"O都會建材",amt:980000,due:"2026-04-30",over:106,lvl:"90+",owner:"張",risk:"高"},
 {no:"INV-24102",cust:"聯O食品機械",amt:520000,due:"2026-08-05",over:9,lvl:"1-30",owner:"陳",risk:"低"},
 {no:"INV-23755",cust:"O發五金",amt:1740000,due:"2026-05-22",over:84,lvl:"61-90",owner:"王",risk:"高"}

var SCREENS=[screen0,screen1,screen2,screen3,screen4,screen5];
function setHTML(h){document.getElementById("screen").innerHTML=h;}

function show(i){
 disposeCharts();
 var btns=document.querySelectorAll("[data-i]");
 for(var b=0;b<btns.length;b++){btns[b].classList.toggle("active",+btns[b].getAttribute("data-i")===i);}
 var container=document.getElementById("screen");
 container.innerHTML="";
 void container.offsetHeight;
 SCREENS[i]();
}
