<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FMEA 失效模式與影響分析｜Jvision 系統 Demo</title>
<meta name="description" content="從失效模式列舉、S×O×D 評分、RPN 排序到改善驗證的品質風險閉環" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;
  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#E2E8F0;
  --amber:#B45309;
  --green:#047857;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
html,body{margin:0;min-height:100%}
body{
  background:
    linear-gradient(var(--color-border) 1px,transparent 1px),
    linear-gradient(90deg,var(--color-border) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  color:var(--ink);
  font-family:"Fira Sans",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
button,a,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  line-height:1;
  vertical-align:middle;
}
.layout{display:flex;min-height:100vh}
.sidebar{
  position:sticky;
  top:0;
  z-index:20;
  width:270px;
  height:100vh;
  flex:none;
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:18px;
  color:#fff;
  background:#111827;
  border-right:4px solid var(--ink);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:4px 0 20px;
  border-bottom:2px solid #fff;
}
.brand .logo{
  width:48px;
  height:48px;
  flex:none;
  display:grid;
  place-items:center;
  color:var(--color-on-primary);
  background:var(--blue);
  border:2px solid #fff;
  box-shadow:5px 5px 0 var(--color-accent);
}
.brand .logo .material-symbols-outlined{font-size:27px}
.brand b{
  display:block;
  font-size:16px;
  font-weight:700;
  letter-spacing:.02em;
}
.brand span:not(.material-symbols-outlined){
  display:block;
  margin-top:3px;
  color:#CBD5E1;
  font-size:11px;
}
.navlbl{
  padding:12px 2px 2px;
  color:#93C5FD;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:700;
  letter-spacing:.16em;
  text-transform:uppercase;
}
.nav{display:flex;flex-direction:column;gap:8px}
.nav button{
  width:100%;
  min-height:46px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px 11px;
  color:#E2E8F0;
  background:transparent;
  border:2px solid #64748B;
  border-radius:0;
  text-align:left;
  font-size:13px;
  font-weight:600;
  transition:background-color .18s,color .18s,transform .18s,box-shadow .18s;
}
.nav button:hover{
  color:#fff;
  background:#1E3A8A;
  transform:translate(-2px,-2px);
  box-shadow:4px 4px 0 #60A5FA;
}
.nav button.on{
  color:#fff;
  background:var(--blue);
  border-color:#fff;
  box-shadow:6px 6px 0 var(--color-accent);
}
.nav button .material-symbols-outlined{font-size:21px;flex:none}
.nav button .nt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sfoot{
  margin-top:auto;
  padding-top:16px;
  color:#CBD5E1;
  border-top:2px solid #64748B;
  font-family:"Fira Code",monospace;
  font-size:10px;
  line-height:1.8;
}
.main{min-width:0;flex:1}
.topbar{
  position:sticky;
  top:0;
  z-index:15;
  min-height:118px;
  display:flex;
  align-items:center;
  gap:22px;
  padding:20px 28px;
  background:rgba(248,250,252,.96);
  border-bottom:4px solid var(--ink);
  backdrop-filter:blur(8px);
}
.htxt{min-width:0}
.topbar h1{
  margin:0;
  font-size:clamp(24px,3vw,42px);
  font-weight:700;
  line-height:1;
  letter-spacing:-.045em;
}
.topbar h1::before{
  content:"RISK // ";
  color:var(--blue);
  font-family:"Fira Code",monospace;
  font-size:.38em;
  letter-spacing:.08em;
  vertical-align:middle;
}
.topbar p{
  margin:10px 0 0;
  color:var(--muted);
  font-size:13px;
}
.chipset{
  margin-left:auto;
  display:flex;
  justify-content:flex-end;
  gap:8px;
  flex-wrap:wrap;
}
.chip{
  min-height:36px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:7px 10px;
  color:var(--ink);
  background:#fff;
  border:2px solid var(--ink);
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:700;
  box-shadow:3px 3px 0 var(--blue);
}
.chip:last-child{box-shadow:3px 3px 0 var(--color-accent)}
.chip .material-symbols-outlined{font-size:17px}
.content{padding:28px 28px 56px}
#screen{animation:screen-in .4s cubic-bezier(.2,.8,.2,1) both}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g2u{grid-template-columns:1.5fr 1fr}
.g2v{grid-template-columns:1fr 1.4fr}
.card,.kpi{
  min-width:0;
  background:var(--color-card);
  border:2px solid var(--ink);
  border-radius:0;
  box-shadow:7px 7px 0 #CBD5E1;
}
.card{padding:19px}
.card:nth-child(even){box-shadow:7px 7px 0 #BFDBFE}
.card h3{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0 0 4px;
  font-size:15px;
  font-weight:700;
}
.card h3 .material-symbols-outlined{
  width:30px;
  height:30px;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--blue);
  border:2px solid var(--ink);
  font-size:18px;
}
.card .csub{
  margin:0 0 16px;
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
}
.kpi{
  position:relative;
  overflow:hidden;
  padding:17px 16px 16px;
}
.kpi::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:9px;
  height:100%;
  background:var(--blue);
  border-right:2px solid var(--ink);
}
.kpi:nth-child(2n)::before{background:var(--color-accent)}
.kpi .kt{
  display:flex;
  align-items:center;
  gap:7px;
  padding-left:5px;
  color:var(--muted);
  font-size:12px;
  font-weight:600;
}
.kpi .kt .material-symbols-outlined{color:var(--blue);font-size:18px}
.kpi .kv{
  margin-top:8px;
  padding-left:5px;
  font-family:"Fira Code",monospace;
  font-size:clamp(24px,2.5vw,32px);
  font-weight:700;
  letter-spacing:-.05em;
  line-height:1.15;
  font-variant-numeric:tabular-nums;
}
.kpi .kd{
  display:flex;
  align-items:center;
  gap:4px;
  margin-top:7px;
  padding-left:5px;
  font-size:11px;
  font-weight:700;
}
.kpi .kd .material-symbols-outlined{font-size:16px}
.up{color:var(--green)}
.down{color:var(--color-destructive)}
.chart{width:100%;height:300px;min-width:0}
.chart.sm{height:230px}
.overflow{overflow-x:auto;scrollbar-color:var(--blue) var(--color-muted)}
table{
  width:100%;
  min-width:560px;
  border-collapse:separate;
  border-spacing:0;
  font-size:12px;
}
th,td{
  padding:11px 12px;
  border-right:1px solid #CBD5E1;
  border-bottom:1px solid #CBD5E1;
  text-align:left;
  white-space:nowrap;
}
th:first-child,td:first-child{border-left:1px solid #CBD5E1}
th{
  color:#fff;
  background:var(--ink);
  border-color:#64748B;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
}
tbody tr:nth-child(even){background:#F1F5F9}
tbody tr:hover{background:#DBEAFE}
td:nth-last-child(-n+4){font-variant-numeric:tabular-nums}
td b,.id,.tlm{font-family:"Fira Code",monospace}
.tag{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:4px 8px;
  border:1px solid currentColor;
  border-radius:0;
  font-size:10px;
  font-weight:700;
}
.t-hi{color:#991B1B;background:#FEE2E2}
.t-hi::before{content:"!";font-family:"Fira Code",monospace}
.t-md{color:#92400E;background:#FEF3C7}
.t-md::before{content:"▲";font-size:8px}
.t-lo{color:#065F46;background:#D1FAE5}
.t-lo::before{content:"✓"}
.t-neu{color:#334155;background:#E2E8F0}
.rpn{font-weight:700}
.legend{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:12px;
  color:var(--muted);
  font-size:11px;
}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:11px;height:11px;border:1px solid var(--ink);display:inline-block}
.mtx{
  display:grid;
  grid-template-columns:auto repeat(10,1fr);
  gap:3px;
  min-width:520px;
}
.mtx .lbl{
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--muted);
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:700;
}
.mtx .cell{
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  border:1px solid var(--ink);
  border-radius:0;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:700;
  transition:transform .18s,box-shadow .18s;
}
.mtx .cell:hover{z-index:2;transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--ink)}
.axis-y{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#1E40AF;
  font-family:"Fira Code",monospace;
  font-size:10px;
  font-weight:700;
  writing-mode:vertical-rl;
  transform:rotate(180deg);
}
.board{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  min-width:720px;
}
.col{
  min-width:0;
  padding:11px;
  background:var(--color-muted);
  border:2px solid var(--ink);
}
.col:nth-child(2){transform:translateY(10px)}
.col:nth-child(4){transform:translateY(-5px)}
.colh{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
  padding-bottom:8px;
  border-bottom:2px solid var(--ink);
  font-size:12px;
  font-weight:700;
}
.cnt{
  min-width:25px;
  padding:2px 6px;
  color:#fff;
  background:var(--ink);
  text-align:center;
  font-family:"Fira Code",monospace;
  font-size:10px;
}
.tk{
  margin-bottom:9px;
  padding:10px;
  background:#fff;
  border:2px solid var(--ink);
  border-left-width:8px;
  box-shadow:3px 3px 0 #94A3B8;
}
.tk .id{
  color:var(--muted);
  font-size:10px;
  font-weight:700;
  letter-spacing:.05em;
}
.tk .ti{
  margin:4px 0 8px;
  font-size:12px;
  font-weight:700;
  line-height:1.45;
  white-space:normal;
}
.tk .mt{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  color:var(--muted);
  font-size:10px;
}
.av{
  width:25px;
  height:25px;
  flex:none;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--blue);
  border:1px solid var(--ink);
  font-size:10px;
  font-weight:700;
}
.deltap{color:#065F46;font-family:"Fira Code",monospace;font-size:10px;font-weight:700}
.tl{position:relative;margin:0;padding-left:30px}
.tl::before{
  content:"";
  position:absolute;
  top:4px;
  bottom:4px;
  left:8px;
  width:4px;
  background:var(--ink);
}
.tl li{position:relative;list-style:none;padding:0 0 21px 6px}
.tl li::before{
  content:"✓";
  position:absolute;
  top:0;
  left:-30px;
  width:20px;
  height:20px;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--blue);
  border:2px solid var(--ink);
  font-size:10px;
  font-weight:700;
}
.tl li.wait::before{content:"…";color:var(--ink);background:#F59E0B}
.tl .tlh{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  font-size:13px;
  font-weight:700;
}
.tl .tld{margin-top:4px;color:var(--muted);font-size:12px;line-height:1.55}
.tl .tlm{margin-top:4px;color:#64748B;font-size:10px;font-weight:600}
.prog{
  height:12px;
  margin-top:7px;
  overflow:hidden;
  background:#CBD5E1;
  border:2px solid var(--ink);
}
.prog i{display:block;height:100%;background:var(--blue)}
.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 8px;
  color:#1E40AF;
  background:#DBEAFE;
  border:1px solid var(--blue);
  font-size:10px;
  font-weight:700;
}
.gauge-wrap{display:flex;gap:9px;flex-wrap:wrap}
.mini{
  min-width:0;
  flex:1;
  padding:12px;
  background:var(--color-muted);
  border:2px solid var(--ink);
}
.mini .mv{
  font-family:"Fira Code",monospace;
  font-size:20px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.mini .ml{margin-top:3px;color:var(--muted);font-size:10px;font-weight:600}
.rev{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px 0;
  border-bottom:2px solid var(--line);
  font-size:12px;
}
.rev:last-child{border-bottom:0}
.rev .ric{
  width:34px;
  height:34px;
  flex:none;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--blue);
  border:2px solid var(--ink);
}
.rev .ric .material-symbols-outlined{font-size:18px}
.hint{
  margin-top:15px;
  padding:10px 12px;
  color:#334155;
  background:#EFF6FF;
  border:2px dashed var(--blue);
  font-size:11px;
  line-height:1.6;
}
@keyframes screen-in{
  from{opacity:0;transform:translateY(16px) scale(.985)}
  to{opacity:1;transform:none}
}
@media(max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chipset{max-width:330px}
}
@media(max-width:860px){
  .layout{display:block}
  .sidebar{
    position:relative;
    width:100%;
    height:auto;
    padding:12px;
    border-right:0;
    border-bottom:4px solid var(--ink);
  }
  .brand{padding:2px 2px 12px}
  .navlbl,.sfoot{display:none}
  .nav{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:7px;
  }
  .nav button{justify-content:flex-start}
  .topbar{top:0;padding:17px 18px}
  .content{padding:22px 18px 45px}
}
@media(max-width:768px){
  .g3,.g2,.g2u,.g2v{grid-template-columns:1fr}
  .topbar{align-items:flex-start;flex-direction:column}
  .chipset{width:100%;max-width:none;margin-left:0;justify-content:flex-start}
  .card,.kpi{box-shadow:5px 5px 0 #CBD5E1}
}
@media(max-width:560px){
  .nav{grid-template-columns:repeat(6,1fr)}
  .nav button{min-width:0;justify-content:center;padding:9px 6px}
  .nav button .nt{display:none}
  .topbar h1{font-size:26px}
  .chip{flex:1;justify-content:center;padding-inline:6px;font-size:9px}
  .g4{grid-template-columns:1fr}
  .content{padding:18px 13px 38px}
  .card{padding:15px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
    transition-duration:.01ms!important;
  }
  #screen{animation:none}
  .nav button:hover,.mtx .cell:hover{transform:none}
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">policy</span></div>
      <div><b>FMEA 風險中心</b><span>失效模式與影響分析</span></div>
    </div>
    <div class="navlbl">分析模組</div>
    <nav class="nav" id="nav" aria-label="分析模組"></nav>
    <div class="sfoot">Jvision QMS · FMEA v4.2<br/>專案：EV 電控模組 PFMEA-2408</div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="htxt">
        <h1 id="scTitle">FMEA 風險總覽</h1>
        <p id="scSub">專案風險分布與 RPN 熱區儀表</p>
      </div>
      <div class="chipset">
        <span class="chip"><span class="material-symbols-outlined">groups</span>團隊 8 人</span>
        <span class="chip"><span class="material-symbols-outlined">bug_report</span>失效模式 46</span>
        <span class="chip"><span class="material-symbols-outlined">warning</span>高風險 7</span>
      </div>
    </header>
    <div class="content"><div id="screen"></div></div>
  </main>
</div>
<script>
var MODS=[
  {icon:"dashboard",name:"風險總覽",sub:"專案風險分布與 RPN 熱區儀表"},
  {icon:"table_chart",name:"失效模式工作表",sub:"功能/失效/影響與現行管制列舉"},
  {icon:"grid_view",name:"S×O×D 評分矩陣",sub:"嚴重度發生度偵測度評分校準"},
  {icon:"leaderboard",name:"RPN 排序帕累托",sub:"高風險項目排序與 80/20 分析"},
  {icon:"task_alt",name:"改善措施追蹤",sub:"建議措施看板與 RPN 前後對比"},
  {icon:"verified",name:"驗證關閉稽核",sub:"改善驗證證據與版本追溯紀錄"}
];
var chartReg=[];
function disposeCharts(){for(var i=0;i<chartReg.length;i++){try{chartReg[i].dispose()}catch(e){}}chartReg=[]}
function mkChart(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);chartReg.push(c)}
function rpnTag(v){var c=v>=200?"t-hi":v>=100?"t-md":"t-lo";return '<span class="tag '+c+'">'+v+'</span>'}
var axis="#64748B",split="#E2E8F0",blue="#2563EB",orange="#EA580C",red="#DC2626",green="#047857";

function v0(){
  var kpis=[
    {t:"RPN 總風險",v:"6,842",d:"較上版 -18%",ic:"speed",up:1},
    {t:"高風險項目",v:"7 項",d:"RPN ≥ 200",ic:"priority_high",up:0},
    {t:"改善完成率",v:"78%",d:"36 / 46 項",ic:"trending_up",up:1},

function initV5(){}

var RENDER=[v0,v1,v2,v3,v4,v5];
var INIT=[initV0,initV1,initV2,initV3,initV4,initV5];
var current=-1;
function buildNav(){
  var h="";
  for(var i=0;i<MODS.length;i++)h+='<button type="button" data-i="'+i+'" aria-label="'+MODS[i].name+'"><span class="material-symbols-outlined" aria-hidden="true">'+MODS[i].icon+'</span><span class="nt">'+MODS[i].name+'</span></button>';
  document.getElementById("nav").innerHTML=h;
  var btns=document.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++)btns[j].addEventListener("click",function(){location.hash="v"+this.getAttribute("data-i")})
}
function show(i){
  if(i===current)return;
  current=i;
  disposeCharts();
  var c=document.getElementById("screen");
  c.innerHTML=RENDER[i]();
  document.getElementById("scTitle").textContent=MODS[i].name;
  document.getElementById("scSub").textContent=MODS[i].sub;
  var btns=document.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){
    var on=+btns[j].getAttribute("data-i")===i;
    btns[j].className=on?"on":"";
    btns[j].setAttribute("aria-current",on?"page":"false")
  }
  void c.offsetHeight;
  INIT[i]();
  try{window.scrollTo(0,0)}catch(e){}
}
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  show(m?Math.min(+m[1],MODS.length-1):0)
}
buildNav();
window.addEventListener("hashchange",fromHash);
window.addEventListener("resize",function(){for(var i=0;i<chartReg.length;i++)chartReg[i].resize()});
fromHash();
</script>
