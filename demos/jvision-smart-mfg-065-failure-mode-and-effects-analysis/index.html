<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FMEA 失效模式與影響分析｜Jvision 系統 Demo</title>
<meta name="description" content="從失效模式列舉、S×O×D 評分、RPN 排序到改善驗證的品質風險閉環" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --accent:#15803d;--accent2:#4ade80;--accent-d:#0f5c2e;
  --bg:#f1f5f2;--panel:#ffffff;--ink:#14231a;--sub:#5f7369;--line:#e2eae4;
  --sidebar:#0d2419;--sidebar2:#123423;--warn:#dc2626;--amber:#d97706;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.layout{display:flex;min-height:100vh;align-items:stretch}
.sidebar{width:250px;flex:none;background:linear-gradient(180deg,var(--sidebar),var(--sidebar2));color:#dcefe3;display:flex;flex-direction:column;padding:20px 14px;gap:6px}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px}
.brand .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#04120a;flex:none}
.brand .logo .material-symbols-outlined{font-size:24px}
.brand b{font-size:15px;font-weight:800;letter-spacing:.3px;display:block}
.brand span{font-size:11px;color:#8fbfa4;font-weight:500}
.navlbl{font-size:10px;letter-spacing:1.5px;color:#6f9b82;text-transform:uppercase;padding:10px 10px 4px;font-weight:700}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;background:transparent;border:0;color:#b6d4c4;text-align:left;padding:11px 12px;border-radius:11px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;min-width:0;transition:.15s}
.nav button .material-symbols-outlined{font-size:21px;flex:none}
.nav button .nt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button:hover{background:rgba(74,222,128,.1);color:#eafff2}
.nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;box-shadow:0 6px 16px -6px rgba(21,128,61,.8)}
.sfoot{margin-top:auto;padding:14px 10px 4px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#7fa992;line-height:1.7}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 26px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.topbar .htxt{min-width:0}
.topbar h1{margin:0;font-size:18px;font-weight:800;letter-spacing:.2px}
.topbar p{margin:3px 0 0;font-size:12.5px;color:var(--sub)}
.chipset{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:#eaf6ee;color:var(--accent-d);border:1px solid #cfe8d8;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700}
.chip .material-symbols-outlined{font-size:16px}
.content{padding:24px 26px 40px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g2u{grid-template-columns:1.5fr 1fr}
.g2v{grid-template-columns:1fr 1.4fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.card h3{margin:0 0 3px;font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent)}
.card .csub{margin:0 0 14px;font-size:12px;color:var(--sub)}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;position:relative;overflow:hidden;min-width:0}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--accent),var(--accent2))}
.kpi .kt{font-size:12px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .kt .material-symbols-outlined{font-size:16px;color:var(--accent)}
.kpi .kv{font-size:27px;font-weight:900;margin-top:8px;letter-spacing:.5px}
.kpi .kd{font-size:11.5px;margin-top:5px;font-weight:700;display:flex;align-items:center;gap:4px}
.kpi .kd .material-symbols-outlined{font-size:15px}
.up{color:var(--accent)}.down{color:var(--warn)}
.chart{width:100%;height:300px;min-width:0}
.chart.sm{height:230px}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.5px;color:var(--sub);text-transform:uppercase;font-weight:700;background:#f6faf7}
tbody tr:hover{background:#f4faf6}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.t-hi{background:#fde8e8;color:var(--warn)}
.t-md{background:#fef1e1;color:var(--amber)}
.t-lo{background:#e6f7ec;color:var(--accent-d)}
.t-neu{background:#eef2f7;color:#475569}
.rpn{font-weight:900;font-size:13px}
.overflow{overflow-x:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
/* matrix */
.mtx{display:grid;grid-template-columns:auto repeat(10,1fr);gap:4px;min-width:520px}
.mtx .lbl{font-size:10.5px;color:var(--sub);display:flex;align-items:center;justify-content:center;font-weight:700}
.mtx .cell{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;cursor:default;transition:.12s}
.mtx .cell:hover{transform:scale(1.12);z-index:2;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.axis-y{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;font-weight:700;color:var(--accent-d);display:flex;align-items:center;justify-content:center}
/* board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;min-width:720px}
.col{background:#f6faf7;border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.colh{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:800;margin-bottom:10px}
.colh .cnt{background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 9px;font-size:11px;color:var(--sub)}
.tk{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 11px;margin-bottom:9px}
.tk .id{font-size:10.5px;color:var(--sub);font-weight:700;letter-spacing:.5px}
.tk .ti{font-size:12.5px;font-weight:700;margin:3px 0 7px;line-height:1.4;white-space:normal}
.tk .mt{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--sub)}
.av{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04120a;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.deltap{font-weight:800;color:var(--accent);font-size:11px}
/* timeline */
.tl{position:relative;padding-left:26px;margin:0}
.tl::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl li{position:relative;list-style:none;padding:0 0 18px 4px}
.tl li::before{content:"";position:absolute;left:-22px;top:2px;width:13px;height:13px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 2px var(--accent2)}
.tl li.done::before{background:var(--accent)}
.tl li.wait::before{background:#cbd5cf;box-shadow:0 0 0 2px #e2eae4}
.tl .tlh{font-size:13px;font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl .tld{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.6}
.tl .tlm{font-size:11px;color:#93a89c;margin-top:3px;font-weight:600}
.prog{height:8px;border-radius:6px;background:#e6f0e9;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:6px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:9px;font-size:11.5px;font-weight:700;background:#eaf6ee;color:var(--accent-d)}
.gauge-wrap{display:flex;gap:12px;flex-wrap:wrap}
.mini{flex:1;min-width:0;background:#f6faf7;border:1px solid var(--line);border-radius:12px;padding:12px}
.mini .mv{font-size:20px;font-weight:900}
.mini .ml{font-size:11px;color:var(--sub);font-weight:600}
.rev{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.rev:last-child{border-bottom:0}
.rev .ric{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;background:#eaf6ee;color:var(--accent-d)}
.rev .ric .material-symbols-outlined{font-size:18px}
.hint{font-size:11.5px;color:var(--sub);background:#f6faf7;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;margin-top:14px;line-height:1.6}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
  .layout{flex-direction:column}
  .sidebar{width:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px;gap:8px}
  .brand{padding:4px 8px;flex:1 1 auto}
  .navlbl,.sfoot{display:none}
  .nav{flex-direction:row;flex-wrap:wrap;gap:6px;width:100%}
  .nav button{flex:none;white-space:nowrap;padding:9px 12px}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g2u,.g2v{grid-template-columns:1fr}
}
@media(max-width:560px){
  .nav button .nt{display:none}
  .nav button{padding:9px 11px}
  .content{padding:18px 14px 34px}
  .topbar{padding:14px 16px}
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">policy</span></div>
      <div><b>FMEA 風險中心</b><span>失效模式與影響分析</span></div>
    </div>
    <div class="navlbl">分析模組</div>
    <nav class="nav" id="nav"></nav>
    <div class="sfoot">Jvision QMS · FMEA v4.2<br/>專案：EV 電控模組 PFMEA-2408</div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="htxt">
        <h1 id="scTitle">FMEA 風險總覽</h1>
        <p id="scSub">專案風險分布與 RPN 熱區儀表</p>
      </div>
      <div class="chipset">
        <span class="chip"><span class="material-symbols-outlined">groups</span>團隊 8 人</span>
        <span class="chip"><span class="material-symbols-outlined">bug_report</span>失效模式 46</span>
        <span class="chip"><span class="material-symbols-outlined">warning</span>高風險 7</span>
      </div>
    </div>
    <div class="content"><div id="screen"></div></div>
  </div>
</div>
<script>
var MODS=[
  {icon:"dashboard",name:"風險總覽",sub:"專案風險分布與 RPN 熱區儀表"},
  {icon:"table_chart",name:"失效模式工作表",sub:"功能/失效/影響與現行管制列舉"},
  {icon:"grid_view",name:"S×O×D 評分矩陣",sub:"嚴重度發生度偵測度評分校準"},
  {icon:"leaderboard",name:"RPN 排序帕累托",sub:"高風險項目排序與 80/20 分析"},
  {icon:"task_alt",name:"改善措施追蹤",sub:"建議措施看板與 RPN 前後對比"},
  {icon:"verified",name:"驗證關閉稽核",sub:"改善驗證證據與版本追溯紀錄"}
];
var chartReg=[];
function disposeCharts(){for(var i=0;i<chartReg.length;i++){try{chartReg[i].dispose();}catch(e){}}chartReg=[];}
function mkChart(id,opt){var el=document.getElementById(id);if(!el)return;var c=echarts.init(el);c.setOption(opt);chartReg.push(c);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function rpnTag(v){var c=v>=200?"t-hi":v>=100?"t-md":"t-lo";return '<span class="tag '+c+'">'+v+'</span>';}

/* ---------- screen 0: 風險總覽 ---------- */
function v0(){
  var kpis=[
    {t:"RPN 總風險",v:"6,842",d:"較上版 -18%",ic:"speed",up:1},
    {t:"高風險項目",v:"7 項",d:"RPN ≥ 200",ic:"priority_high",up:0},
    {t:"改善完成率",v:"78%",d:"36 / 46 項",ic:"trending_up",up:1},
    {t:"平均偵測度",v:"4.3",d:"目標 ≤ 4.0",ic:"visibility",up:0}
  ];
  var k=kpis.map(function(x){return '<div class="kpi"><div class="kt"><span class="material-symbols-outlined">'+x.ic+'</span>'+x.t+'</div><div class="kv">'+x.v+'</div><div class="kd '+(x.up?"up":"down")+'"><span class="material-symbols-outlined">'+(x.up?"arrow_downward":"warning")+'</span>'+x.d+'</div></div>';}).join("");
  return '<div class="grid g4" style="margin-bottom:16px">'+k+'</div>'
    +'<div class="grid g2u" style="margin-bottom:16px">'
      +'<div class="card"><h3><span class="material-symbols-outlined">show_chart</span>RPN 版本趨勢</h3><p class="csub">歷次改版總 RPN 與高風險項目數變化</p><div class="overflow"><div id="c0a" class="chart"></div></div></div>'
      +'<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>失效類別分布</h3><p class="csub">依失效機理分類佔比</p><div class="overflow"><div id="c0b" class="chart"></div></div></div>'
    +'</div>'
    +'<div class="grid g2v">'
      +'<div class="card"><h3><span class="material-symbols-outlined">radar</span>子系統風險輪廓</h3><p class="csub">六大子系統平均 RPN 雷達</p><div class="overflow"><div id="c0c" class="chart"></div></div></div>'
      +'<div class="card"><h3><span class="material-symbols-outlined">notifications_active</span>今日風險提醒</h3><p class="csub">系統依規則自動排序</p>'
        +'<div class="rev"><div class="ric" style="background:#fde8e8;color:#dc2626"><span class="material-symbols-outlined">error</span></div><div style="min-width:0"><b>FM-014 焊點虛焊</b> RPN 336，逾期未指派措施<br/><span style="color:var(--sub);font-size:11px">RULE-02 · 影響功能需先隔離</span></div></div>'
        +'<div class="rev"><div class="ric"><span class="material-symbols-outlined">pending_actions</span></div><div style="min-width:0"><b>FM-021 過溫保護失效</b> 措施待驗證證據<br/><span style="color:var(--sub);font-size:11px">RULE-03 · 無證據不得關閉</span></div></div>'
        +'<div class="rev"><div class="ric" style="background:#fef1e1;color:#d97706"><span class="material-symbols-outlined">schedule</span></div><div style="min-width:0"><b>FM-008 密封圈老化</b> 驗證預計 08/20 完成<br/><span style="color:var(--sub);font-size:11px">改善驗證進行中</span></div></div>'
        +'<div class="hint">高風險項目改善完成率與 RPN 下降幅度為製程工程部核心驗收指標。</div>'
      +'</div>'
    +'</div>';
}
function initV0(){
  mkChart("c0a",{grid:{left:44,right:16,top:30,bottom:28},legend:{data:["總 RPN","高風險項目"],top:0,textStyle:{fontSize:11}},tooltip:{trigger:"axis"},
    xAxis:{type:"category",data:["v1.0","v1.1","v2.0","v2.1","v3.0","v3.1"],axisLine:{lineStyle:{color:"#cbd5cf"}}},
    yAxis:[{type:"value",name:"RPN",splitLine:{lineStyle:{color:"#eef3ef"}}},{type:"value",name:"項目",splitLine:{show:false}}],
    series:[{name:"總 RPN",type:"line",smooth:true,data:[9820,9100,8340,7660,7210,6842],areaStyle:{color:"rgba(21,128,61,.12)"},itemStyle:{color:"#15803d"},lineStyle:{width:3}},
      {name:"高風險項目",type:"bar",yAxisIndex:1,data:[19,16,13,11,9,7],barWidth:16,itemStyle:{color:"#4ade80",borderRadius:[4,4,0,0]}}]});
  mkChart("c0b",{tooltip:{trigger:"item"},legend:{bottom:0,textStyle:{fontSize:11}},
    series:[{type:"pie",radius:["42%","70%"],center:["50%","44%"],itemStyle:{borderColor:"#fff",borderWidth:2},label:{fontSize:11},
      data:[{value:14,name:"機械/疲勞",itemStyle:{color:"#15803d"}},{value:11,name:"電氣/短路",itemStyle:{color:"#4ade80"}},{value:9,name:"熱/過溫",itemStyle:{color:"#d97706"}},{value:7,name:"密封/洩漏",itemStyle:{color:"#0f5c2e"}},{value:5,name:"軟體/邏輯",itemStyle:{color:"#86efac"}}]}]});
  mkChart("c0c",{tooltip:{},radar:{indicator:[{name:"電控",max:300},{name:"動力",max:300},{name:"熱管理",max:300},{name:"感測",max:300},{name:"連接器",max:300},{name:"外殼",max:300}],radius:"64%",splitLine:{lineStyle:{color:"#e2eae4"}},axisName:{fontSize:11,color:"#5f7369"}},
    series:[{type:"radar",areaStyle:{color:"rgba(21,128,61,.18)"},lineStyle:{color:"#15803d"},itemStyle:{color:"#15803d"},data:[{value:[248,176,205,132,158,94]}]}]});
}

/* ---------- screen 1: 失效模式工作表 ---------- */
var WS=[
  {id:"FM-014",fn:"焊點結構固定",mode:"虛焊/冷焊",eff:"接觸不良致模組斷電",cause:"回焊溫度不足",ctl:"AOI 100% 檢測",s:9,o:4,d:9,cls:"電氣"},
  {id:"FM-021",fn:"過溫保護",mode:"保護未觸發",eff:"電池熱失控風險",cause:"NTC 校正漂移",ctl:"上線校正抽檢",s:10,o:3,d:8,cls:"熱"},
  {id:"FM-008",fn:"外殼密封",mode:"密封圈老化",eff:"進水短路",cause:"材料耐候不足",ctl:"IP67 抽樣測試",s:8,o:4,d:7,cls:"密封"},
  {id:"FM-030",fn:"電流量測",mode:"取樣電阻偏移",eff:"SOC 估算誤差",cause:"溫漂係數大",ctl:"出廠標定",s:6,o:5,d:6,cls:"感測"},
  {id:"FM-005",fn:"連接器鎖固",mode:"端子鬆脫",eff:"間歇性斷訊",cause:"插拔力衰減",ctl:"拉力抽測",s:7,o:4,d:5,cls:"連接器"},
  {id:"FM-018",fn:"BMS 均衡控制",mode:"均衡邏輯錯誤",eff:"電芯過充",cause:"韌體邊界條件",ctl:"HIL 回歸測試",s:9,o:2,d:6,cls:"軟體"},
  {id:"FM-042",fn:"散熱片貼合",mode:"導熱膠空洞",eff:"局部過熱",cause:"點膠量不穩",ctl:"X-Ray 抽檢",s:6,o:4,d:5,cls:"熱"}
];
function v1(){
  var rows=WS.map(function(r){var rpn=r.s*r.o*r.d;var cls=r.cls==="電氣"?"t-hi":r.cls==="熱"?"t-md":"t-neu";
    return '<tr><td><b>'+r.id+'</b></td><td>'+r.fn+'</td><td>'+r.mode+'</td><td style="white-space:normal;min-width:150px">'+r.eff+'</td><td>'+r.cause+'</td><td>'+r.ctl+'</td><td style="text-align:center">'+r.s+'</td><td style="text-align:center">'+r.o+'</td><td style="text-align:center">'+r.d+'</td><td>'+rpnTag(rpn)+'</td></tr>';}).join("");
  return '<div class="grid g4" style="margin-bottom:16px">'

var RENDER=[v0,v1,v2,v3,v4,v5];
var INIT=[initV0,initV1,initV2,initV3,initV4,initV5];
function buildNav(){
  var h="";for(var i=0;i<MODS.length;i++){h+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+MODS[i].icon+'</span><span class="nt">'+MODS[i].name+'</span></button>';}
  document.getElementById("nav").innerHTML=h;
  var btns=document.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){btns[j].addEventListener("click",function(){show(+this.getAttribute("data-i"));try{window.scrollTo(0,0);}catch(e){}});}
}
function show(i){
  disposeCharts();
  var c=document.getElementById("screen");
  c.innerHTML=RENDER[i]();
  document.getElementById("scTitle").textContent=MODS[i].name;
  document.getElementById("scSub").textContent=MODS[i].sub;
  var btns=document.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){btns[j].className=(+btns[j].getAttribute("data-i")===i)?"on":"";}
  void c.offsetHeight;
  INIT[i]();
}
buildNav();
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
