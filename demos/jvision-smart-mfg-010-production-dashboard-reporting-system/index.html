<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>生產報表看板系統（Production Dashboard/Reporting System）｜Jvision 系統 Demo</title>
<meta name="description" content="訂單到入庫的製造現場全流程數位化（純 UI 展示）。" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root {
  --color-primary: #2563EB;
  --color-on-primary: #FFFFFF;
  --color-secondary: #3B82F6;
  --color-on-secondary: #000000;
  --color-accent: #EA580C;
  --color-on-accent: #000000;
  --color-background: #F8FAFC;
  --color-foreground: #1E293B;
  --color-card: #FFFFFF;
  --color-card-foreground: #1E293B;
  --color-muted: #E9EFF8;
  --color-muted-foreground: #475569;
  --color-border: #E2E8F0;
  --color-destructive: #DC2626;
  --color-on-destructive: #FFFFFF;
  --color-ring: #2563EB;

  --blue: var(--color-primary);
  --ink: var(--color-foreground);
  --muted: var(--color-muted-foreground);
  --line: var(--color-border);

  --bg: var(--color-background);
  --pnl: var(--color-card);
  --body: #334155;
  --red: var(--color-destructive);
  --red-d: #B91C1C;
  --org: var(--color-accent);
  --green: #15803D;
  --amber: #B45309;
  --sky: #0369A1;
  --sidebar: #0F172A;
  --sidebar-2: #172554;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, .05);
  --shadow-md: 0 8px 24px rgba(15, 23, 42, .07);
}

*, *::before, *::after { box-sizing: border-box; }
html { color-scheme: light; scroll-behavior: smooth; }
html, body { margin: 0; min-width: 320px; }
body {
  background: var(--color-background);
  color: var(--body);
  font-family: "Fira Sans", "Microsoft JhengHei", sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, select, textarea { font: inherit; }
button, [role="button"], a { cursor: pointer; }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible {
  outline: 3px solid var(--color-ring);
  outline-offset: 3px;
}
::selection { color: #fff; background: var(--color-primary); }
.material-symbols-outlined {
  font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 24;
}

.shell {
  display: grid;
  grid-template-columns: 244px minmax(0, 1fr);
  min-height: 100vh;
}
.shell > * { min-width: 0; }
.side {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  height: 100vh;
  min-width: 0;
  color: #CBD5E1;
  background:
    linear-gradient(180deg, rgba(37, 99, 235, .15), transparent 34%),
    var(--sidebar);
  border-right: 1px solid rgba(148, 163, 184, .18);
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 78px;
  padding: 16px 18px;
  border-bottom: 1px solid rgba(148, 163, 184, .18);
}
.brand .lg {
  display: grid;
  flex: none;
  width: 42px;
  height: 42px;
  place-content: center;
  color: var(--color-on-primary);
  background: var(--color-primary);
  border: 1px solid rgba(255, 255, 255, .18);
  border-radius: 8px;
  box-shadow: 4px 4px 0 rgba(59, 130, 246, .2);
}
.brand .lg .material-symbols-outlined { font-size: 23px; }
.brand b {
  display: block;
  color: #FFF;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: .01em;
}
.brand small { color: #94A3B8; font-size: 11px; }
.nav {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
  padding: 16px 12px;
}
.nav .t {
  padding: 8px 12px 7px;
  color: #94A3B8;
  font-family: "Fira Code", monospace;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.nav button {
  position: relative;
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  min-height: 44px;
  padding: 10px 12px;
  overflow: hidden;
  color: #CBD5E1;
  text-align: left;
  white-space: nowrap;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px;
  transition: color 200ms ease, background-color 200ms ease, border-color 200ms ease, transform 200ms ease;
}
.nav button .material-symbols-outlined {
  flex: none;
  color: #94A3B8;
  font-size: 21px;
  transition: color 200ms ease;
}
.nav button:hover {
  color: #FFF;
  background: rgba(255, 255, 255, .07);
  border-color: rgba(148, 163, 184, .22);
  transform: translateX(2px);
}
.nav button.on {
  color: #FFF;
  background: var(--color-primary);
  border-color: #60A5FA;
  box-shadow: 3px 3px 0 rgba(96, 165, 250, .2);
}
.nav button.on::before {
  position: absolute;
  top: 8px;
  bottom: 8px;
  left: 0;
  width: 3px;
  content: "";
  background: #FFF;
}
.nav button.on .material-symbols-outlined { color: #FFF; }
.side-f {
  padding: 16px 18px 18px;
  background: rgba(2, 6, 23, .28);
  border-top: 1px solid rgba(148, 163, 184, .18);
}
.shift { color: #94A3B8; font-size: 11px; }
.shift b { display: block; margin-bottom: 3px; color: #FFF; font-size: 13px; }
.live {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin-top: 10px;
  color: #BFDBFE;
  font-size: 11px;
  font-weight: 700;
}
.live .dot {
  width: 8px;
  height: 8px;
  background: #60A5FA;
  border: 2px solid #DBEAFE;
  border-radius: 50%;
  animation: pulse 1.8s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(96, 165, 250, .35); }
  50% { box-shadow: 0 0 0 6px rgba(96, 165, 250, 0); }
}

.main { min-width: 0; }
.top {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 18px;
  min-height: 78px;
  padding: 14px 28px;
  background: rgba(255, 255, 255, .94);
  border-bottom: 1px solid var(--color-border);
  box-shadow: var(--shadow-sm);
  backdrop-filter: blur(12px);
}
.top h1 {
  margin: 0;
  color: var(--color-foreground);
  font-size: clamp(18px, 2vw, 21px);
  font-weight: 700;
  letter-spacing: -.02em;
}
.top .sub { margin-top: 2px; color: var(--color-muted-foreground); font-size: 12px; }
.top .r { display: flex; align-items: center; gap: 12px; margin-left: auto; }
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 34px;
  padding: 6px 11px;
  color: #991B1B;
  font-size: 12px;
  font-weight: 700;
  background: #FEF2F2;
  border: 1px solid #FCA5A5;
  border-radius: 5px;
}
.ava {
  display: grid;
  flex: none;
  width: 36px;
  height: 36px;
  place-content: center;
  color: #FFF;
  font-weight: 700;
  background: var(--color-primary);
  border: 2px solid #DBEAFE;
  border-radius: 50%;
}
.body { width: 100%; max-width: 1600px; margin: 0 auto; padding: 24px 28px 48px; }
.vh {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--color-border);
}
.vh h2 {
  margin: 0;
  color: var(--color-foreground);
  font-size: clamp(21px, 2.3vw, 27px);
  font-weight: 700;
  letter-spacing: -.035em;
}
.vh p { margin: 4px 0 0; color: var(--color-muted-foreground); font-size: 13px; }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-width: 92px;
  min-height: 42px;
  padding: 0 16px;
  color: var(--color-on-primary);
  font-weight: 700;
  font-size: 13px;
  background: var(--color-primary);
  border: 1px solid var(--color-primary);
  border-radius: 6px;
  box-shadow: 3px 3px 0 #BFDBFE;
  transition: color 200ms ease, background-color 200ms ease, border-color 200ms ease, box-shadow 200ms ease, transform 200ms ease;
}
.btn:hover { background: #1D4ED8; border-color: #1D4ED8; transform: translateY(-1px); box-shadow: 4px 5px 0 #BFDBFE; }
.btn:active { transform: translateY(1px); box-shadow: 1px 1px 0 #BFDBFE; }
.btn.ghost { color: var(--color-on-accent); background: var(--color-accent); border-color: #C2410C; box-shadow: 3px 3px 0 #FED7AA; }
.btn.ghost:hover { background: #C2410C; border-color: #9A3412; color: #FFF; box-shadow: 4px 5px 0 #FED7AA; }
.btn .material-symbols-outlined { font-size: 18px; }

.kpis {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 18px;
}
.kpis > *, .grid > *, .lineboard > *, .rcat > *, .dgrid > * { min-width: 0; }
.kpi, .card, .lb, .pstep, .fitem .fc, .rc, .dcell {
  animation: grid-in 400ms both cubic-bezier(.2, .8, .2, 1.15);
}
.kpis > :nth-child(2), .lineboard > :nth-child(2), .dgrid > :nth-child(2), .rcat > :nth-child(2) { animation-delay: 60ms; }
.kpis > :nth-child(3), .lineboard > :nth-child(3), .dgrid > :nth-child(3), .rcat > :nth-child(3) { animation-delay: 120ms; }
.kpis > :nth-child(4), .lineboard > :nth-child(4), .dgrid > :nth-child(4), .rcat > :nth-child(4) { animation-delay: 180ms; }
.kpis > :nth-child(n+5), .lineboard > :nth-child(n+5), .dgrid > :nth-child(n+5), .rcat > :nth-child(n+5) { animation-delay: 240ms; }
@keyframes grid-in {
  from { opacity: 0; transform: translateY(12px) scale(.97); }
  to { opacity: 1; transform: none; }
}
.kpi {
  position: relative;
  min-height: 132px;
  padding: 17px 18px 15px;
  overflow: hidden;
  background: var(--color-card);
  border: 1px solid var(--color-border);
  border-radius: 8px;
  box-shadow: var(--shadow-sm);
  transition: border-color 220ms ease, box-shadow 220ms ease, transform 220ms ease;
}
.kpi::before {
  position: absolute;
  top: 0;
  right: 0;
  left: 0;
  height: 3px;
  content: "";
  background: var(--color-primary);
}
.kpi:hover { border-color: #93C5FD; box-shadow: var(--shadow-md); transform: translateY(-2px); }
.kpi .l {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--color-muted-foreground);
  font-size: 12px;
  font-weight: 600;
}
.kpi .l .material-symbols-outlined { color: var(--color-primary); font-size: 18px; }
.kpi .v {
  margin-top: 8px;
  color: var(--color-foreground);
  font-family: "Fira Code", monospace;
  font-size: clamp(24px, 2.5vw, 30px);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.05em;
}
.kpi .v small { margin-left: 3px; color: var(--color-muted-foreground); font-family: "Fira Sans", sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0; }
.kpi .d { margin-top: 4px; font-size: 11px; font-weight: 700; }
.kpi .d.up { color: #166534; }
.kpi .d.down { color: #991B1B; }
.kpi .d.up::before { content: "↑ "; }
.kpi .d.down::before { content: "↓ "; }

.grid { display: grid; gap: 18px; }
.g21 { grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); }
.g12 { grid-template-columns: minmax(280px, 1fr) minmax(0, 2fr); }
.g11 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g32 { grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr); }
.card {
  min-width: 0;
  padding: 18px 20px;
  background: var(--color-card);
  border: 1px solid var(--color-border);
  border-radius: 8px;
  box-shadow: var(--shadow-sm);
  transition: border-color 220ms ease, box-shadow 220ms ease;
}
.card:hover { border-color: #CBD5E1; box-shadow: var(--shadow-md); }
.card > h3 {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 15px;
  color: var(--color-card-foreground);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -.01em;
}
.card > h3 .material-symbols-outlined { color: var(--color-primary); font-size: 20px; }
.card > h3 .grow {
  margin-left: auto;
  color: var(--color-primary);
  font-family: "Fira Code", monospace;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .02em;
}
.chart-wrap { position: relative; width: 100%; height: 260px; }
.chart-wrap.sm { height: 215px; }

.tbl {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 12px;
}
.tbl th {
  padding: 10px 12px;
  color: #334155;
  text-align: left;
  white-space: nowrap;
  background: var(--color-muted);
  border-top: 1px solid #D8E1EE;
  border-bottom: 1px solid #CBD5E1;
  font-family: "Fira Code", monospace;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .04em;
}
.tbl th:first-child { border-left: 1px solid #D8E1EE; border-radius: 5px 0 0 0; }
.tbl th:last-child { border-right: 1px solid #D8E1EE; border-radius: 0 5px 0 0; }
.tbl td {
  padding: 11px 12px;
  color: #334155;
  white-space: nowrap;
  background: #FFF;
  border-bottom: 1px solid var(--color-border);
  transition: background-color 180ms ease;
}
.tbl tbody tr:hover td { background: #EFF6FF; }
.tbl td[style*="font-variant-numeric"], .tbl td[style*="color:#71717a"] {
  font-family: "Fira Code", monospace;
  font-variant-numeric: tabular-nums;
}
.tbl td[style*="font-variant-numeric"] { text-align: right; }
.tbl td[style*="color:#18181b"] { color: var(--color-foreground) !important; }
.tbl td[style*="color:#71717a"] { color: var(--color-muted-foreground) !important; }

.tag, .sev {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
  border: 1px solid transparent;
  font-size: 10px;
  font-weight: 700;
  line-height: 1.5;
}
.tag { padding: 2px 8px; border-radius: 999px; }
.tag::before, .sev::before { font-family: "Fira Sans", sans-serif; font-weight: 700; }
.t-run, .t-ok { color: #166534; background: #F0FDF4; border-color: #86EFAC; }
.t-run::before, .t-ok::before { content: "✓"; }
.t-warn { color: #92400E; background: #FFFBEB; border-color: #FCD34D; }
.t-warn::before { content: "!"; }
.t-stop { color: #991B1B; background: #FEF2F2; border-color: #FCA5A5; }
.t-stop::before { content: "×"; }
.t-idle { color: #3730A3; background: #EEF2FF; border-color: #A5B4FC; }
.t-idle::before { content: "–"; }
.t-off { color: #3F3F46; background: #F4F4F5; border-color: #D4D4D8; }
.t-off::before { content: "×"; }

.lineboard {
  display: grid;
  grid-template-columns: repeat(3, minmax(220px, 1fr));
  gap: 12px;
}
.lb {
  position: relative;
  padding: 15px;
  background: var(--color-card);
  border: 1px solid var(--color-border);
  border-top: 3px solid var(--color-primary) !important;
  border-radius: 6px;
  transition: border-color 200ms ease, box-shadow 200ms ease, transform 200ms ease;
}
.lb:hover { border-color: #93C5FD; box-shadow: var(--shadow-md); transform: translateY(-2px); }
.lb .h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 7px; }
.lb .h b, .dcell b { color: var(--color-foreground); font-family: "Fira Code", monospace; font-size: 13px; }
.lb .prod { min-height: 18px; margin-bottom: 11px; color: var(--color-muted-foreground); font-size: 11px; }
.lb .prog { height: 7px; overflow: hidden; background: #E2E8F0; border-radius: 2px; }
.lb .prog span { display: block; height: 100%; background: var(--color-primary); border-radius: inherit; }
.lb .row { display: flex; justify-content: space-between; gap: 12px; margin-top: 10px; font-size: 11px; }
.lb .row b { display: block; color: var(--color-foreground); font-family: "Fira Code", monospace; font-size: 14px; font-variant-numeric: tabular-nums; }
.lb .row b[style] { color: var(--color-foreground) !important; }
.lb .row span { color: var(--color-muted-foreground); font-size: 10px; }

.pipe { display: flex; align-items: stretch; gap: 0; overflow-x: auto; padding: 3px 2px 8px; scrollbar-color: #94A3B8 #E2E8F0; }
.pstep {
  flex: 1;
  min-width: 154px;
  padding: 15px 12px;
  text-align: center;
  background: var(--color-card);
  border: 1px solid var(--color-border);
  border-radius: 6px;
}
.pstep .ic {
  display: grid;
  width: 38px;
  height: 38px;
  margin: 0 auto 9px;
  place-content: center;
  color: var(--color-primary);
  background: #EFF6FF;
  border: 1px solid #BFDBFE;
  border-radius: 5px;
}
.pstep b { display: block; color: var(--color-foreground); font-size: 12px; }
.pstep small { color: var(--color-muted-foreground); font-size: 10px; }
.pstep .n { margin-top: 7px; color: var(--color-primary); font-family: "Fira Code", monospace; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.parrow { display: flex; flex: none; align-items: center; padding: 0 3px; color: var(--color-primary); }

.feed { position: relative; padding-left: 27px; }
.feed::before { position: absolute; top: 5px; bottom: 5px; left: 9px; width: 2px; content: ""; background: #CBD5E1; }
.fitem { position: relative; padding: 0 0 14px; }
.fitem:last-child { padding-bottom: 0; }
.fitem .dot { position: absolute; top: 4px; left: -23px; width: 14px; height: 14px; border: 3px solid #FFF; border-radius: 50%; box-shadow: 0 0 0 1px #94A3B8; }
.fitem .fc { padding: 12px 14px; background: var(--color-card); border: 1px solid var(--color-border); border-radius: 6px; }
.fitem .fh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.fitem .fh b { color: var(--color-foreground); font-size: 13px; }
.fitem .fh .when { margin-left: auto; color: var(--color-muted-foreground); font-family: "Fira Code", monospace; font-size: 10px; white-space: nowrap; }
.fitem p { margin: 6px 0 0; color: var(--body); font-size: 12px; line-height: 1.55; }
.sev { padding: 2px 7px; border-radius: 4px; }
.sev.s3 { color: #991B1B; background: #FEF2F2; border-color: #FCA5A5; }
.sev.s3::before { content: "×"; }
.sev.s2 { color: #92400E; background: #FFFBEB; border-color: #FCD34D; }
.sev.s2::before { content: "!"; }
.sev.s1 { color: #1E40AF; background: #EFF6FF; border-color: #93C5FD; }
.sev.s1::before { content: "i"; }
.fitem .fh span[style*="color:#71717a"] { color: var(--color-muted-foreground) !important; }

.rcat { display: grid; grid-template-columns: repeat(2, minmax(190px, 1fr)); gap: 11px; }
.rc { padding: 14px; background: var(--color-card); border: 1px solid var(--color-border); border-radius: 6px; transition: border-color 200ms ease, box-shadow 200ms ease, transform 200ms ease; }
.rc:hover { border-color: #93C5FD; box-shadow: var(--shadow-md); transform: translateY(-2px); }
.rc .ic {
  display: grid;
  width: 36px;
  height: 36px;
  margin-bottom: 9px;
  place-content: center;
  color: #FFF;
  background: var(--color-primary);
  border-radius: 5px;
}
.rc b { color: var(--color-foreground); font-size: 13px; }
.rc small { display: block; margin-top: 4px; color: var(--color-muted-foreground); font-size: 10px; line-height: 1.55; }
.rc .meta { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 10px; }
.rc .meta span { padding: 3px 6px; color: #334155; font-family: "Fira Code", monospace; font-size: 9px; font-weight: 600; background: var(--color-muted); border: 1px solid #D8E1EE; border-radius: 3px; }

.dgrid { display: grid; grid-template-columns: repeat(3, minmax(140px, 1fr)); gap: 9px; }
.dcell { padding: 12px; background: var(--color-card); border: 1px solid var(--color-border); border-radius: 5px; transition: border-color 200ms ease, box-shadow 200ms ease; }
.dcell:hover { border-color: #93C5FD; box-shadow: var(--shadow-sm); }
.dcell .top2 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dcell .st { flex: none; width: 10px; height: 10px; border: 2px solid #FFF; border-radius: 50%; box-shadow: 0 0 0 1px #64748B !important; }
