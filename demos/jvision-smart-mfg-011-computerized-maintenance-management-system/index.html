<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CMMS 設備維護管理系統</title>
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --c1:#0891b2; --c2:#22d3ee; --ink:#0f2530; --mut:#5b7683;
  --bg:#eef4f6; --card:#ffffff; --line:#dbe6ea; --soft:#f3f8fa;
  --ok:#16a34a; --warn:#f59e0b; --bad:#dc2626; --info:#2563eb;
  --shadow:0 1px 2px rgba(8,145,178,.06),0 8px 24px rgba(8,60,80,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(100deg,#083344,#0e5a70);color:#fff;box-shadow:0 4px 18px rgba(8,50,66,.25)}
.topinner{max-width:1360px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--c1),var(--c2));display:flex;align-items:center;justify-content:center;color:#04222c;flex:none;box-shadow:0 3px 10px rgba(34,211,238,.4)}
.logo .material-symbols-outlined{font-size:24px}
.brand b{font-size:16px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.brand span{display:block;font-size:11px;color:#9fd8e6;font-weight:500}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;min-width:0}
.nav button{flex:none;white-space:nowrap;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);color:#cfeef6;border:1px solid rgba(255,255,255,.12);padding:8px 12px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.nav button:hover{background:rgba(255,255,255,.16);color:#fff}
.nav button.on{background:linear-gradient(135deg,var(--c1),var(--c2));color:#04222c;border-color:transparent;box-shadow:0 3px 10px rgba(34,211,238,.4)}
.nav button .material-symbols-outlined{font-size:18px}
.wrap{max-width:1360px;margin:0 auto;padding:20px 18px 48px}
.scr-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.scr-head h1{font-size:20px;margin:0;font-weight:800;display:flex;align-items:center;gap:9px}
.scr-head h1 .material-symbols-outlined{color:var(--c1);font-size:24px}
.scr-head p{margin:4px 0 0;color:var(--mut);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;font-size:12px;font-weight:700;background:var(--soft);border:1px solid var(--line);color:var(--c1)}
.grid{display:grid;gap:14px;min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.4fr 1fr}
.grid>*{min-width:0}
@media(max-width:820px){.g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px}
.card h3 .material-symbols-outlined{font-size:18px;color:var(--c1)}
.card h3 small{margin-left:auto;font-size:11px;color:var(--mut);font-weight:500}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,rgba(8,145,178,.1),rgba(34,211,238,.14))}
.kpi .lab{font-size:12px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .lab .material-symbols-outlined{font-size:17px;color:var(--c1)}
.kpi .val{font-size:27px;font-weight:800;margin:6px 0 2px;letter-spacing:-.5px}
.kpi .val small{font-size:13px;color:var(--mut);font-weight:600}
.kpi .dt{font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.up{color:var(--ok)} .down{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th{text-align:left;font-size:11.5px;color:var(--mut);font-weight:700;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap;background:var(--soft)}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700}
.t-ok{background:#dcfce7;color:#15803d} .t-warn{background:#fef3c7;color:#b45309}
.t-bad{background:#fee2e2;color:#b91c1c} .t-info{background:#dbeafe;color:#1d4ed8}
.t-mut{background:#e2e8f0;color:#475569}
.bar{height:7px;border-radius:6px;background:var(--line);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--c1),var(--c2))}
.ov{overflow-x:auto;-webkit-overflow-scrolling:touch}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:720px}
.col{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.col-h{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.col-h .dot{width:9px;height:9px;border-radius:50%}
.col-h .cnt{margin-left:auto;font-size:11px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 8px;font-weight:700;color:var(--mut)}
.wo{background:#fff;border:1px solid var(--line);border-left:4px solid var(--c1);border-radius:9px;padding:10px;margin-bottom:9px;box-shadow:0 1px 3px rgba(8,60,80,.05)}
.wo:last-child{margin-bottom:0}
.wo .id{font-size:11px;color:var(--mut);font-weight:700;font-family:"Inter"}
.wo .tt{font-size:13px;font-weight:700;margin:3px 0 6px}
.wo .mt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--mut)}
.wo .mt .material-symbols-outlined{font-size:14px}
.av{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2));color:#04222c;font-size:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;min-width:640px}
.cal .dh{text-align:center;font-size:11.5px;font-weight:700;color:var(--mut);padding:4px 0}
.cel{background:var(--soft);border:1px solid var(--line);border-radius:9px;min-height:78px;padding:6px}
.cel .d{font-size:11.5px;font-weight:700;color:var(--mut)}
.cel.tod{border-color:var(--c1);box-shadow:inset 0 0 0 1px var(--c1)}
.ev{font-size:10.5px;font-weight:700;border-radius:5px;padding:2px 5px;margin-top:4px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.pm{background:#cffafe;color:#0e7490} .ev.cm{background:#fef3c7;color:#b45309} .ev.cal2{background:#e0e7ff;color:#4338ca}
.tl{position:relative}
.tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl li{list-style:none;position:relative;padding:0 0 16px}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;left:-21px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--c1);box-shadow:0 0 0 3px rgba(8,145,178,.16)}
.tl .tm{font-size:11px;color:var(--c1);font-weight:800}
.tl .th{font-size:13px;font-weight:700;margin:2px 0 2px}
.tl .td2{font-size:12px;color:var(--mut)}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
.row:last-child{border-bottom:none}
.mini{font-size:11px;color:var(--mut)}
.chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--soft);border:1px solid var(--line);color:var(--c1)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);font-weight:600;margin-top:8px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
.foot{max-width:1360px;margin:0 auto;padding:8px 18px 30px;color:var(--mut);font-size:12px;text-align:center}
@media(max-width:560px){.nav button .txt{display:none} .nav button{padding:8px 10px} .kpi .val{font-size:23px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topinner">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">precision_manufacturing</span></div>
      <div><b>CMMS 設備維護</b><span>Computerized Maintenance Management System</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </div>
</header>
<main class="wrap"><div id="app"></div></main>
<div class="foot">CMMS 設備維護管理系統 · 純前端展示 Demo · 保養 · 維修 · 預兆 · 備品全生命週期</div>

<script>
var NAV=[
  {i:0,ic:"calendar_month",t:"保養排程"},
  {i:1,ic:"view_kanban",t:"工單看板"},
  {i:2,ic:"sensors",t:"預兆診斷"},
  {i:3,ic:"inventory_2",t:"備品庫存"},
  {i:4,ic:"speed",t:"OEE 稼動"},
  {i:5,ic:"history",t:"維護履歷"}
];
var app=document.getElementById("app");
var _charts=[];
function killCharts(){for(var k=0;k<_charts.length;k++){try{_charts[k].destroy();}catch(e){}}_charts=[];}

(function(){var h="";for(var n=0;n<NAV.length;n++){h+='<button data-i="'+NAV[n].i+'"><span class="material-symbols-outlined">'+NAV[n].ic+'</span><span class="txt">'+NAV[n].t+'</span></button>';}document.getElementById("nav").innerHTML=h;})();

function head(ic,title,sub,pill){
  return '<div class="scr-head"><div><h1><span class="material-symbols-outlined">'+ic+'</span>'+title+'</h1><p>'+sub+'</p></div>'+(pill?'<span class="pill"><span class="material-symbols-outlined" style="font-size:16px">bolt</span>'+pill+'</span>':'')+'</div>';
}
function kpi(ic,lab,val,unit,dt,up){
  return '<div class="kpi"><div class="lab"><span class="material-symbols-outlined">'+ic+'</span>'+lab+'</div><div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div><div class="dt '+(up?'up':'down')+'"><span class="material-symbols-outlined" style="font-size:15px">'+(up?'trending_up':'trending_down')+'</span>'+dt+'</div></div>';
}

// ===== SCREEN 0 : 預防保養排程 (calendar) =====
function s0(){
  var kh='<div class="grid g4">'+
    kpi("event_available","本月計畫保養","128","件","準時率 94%",true)+
    kpi("schedule","即將到期(7日)","17","件","-4 vs 上週",true)+
    kpi("running_with_errors","逾期未執行","3","件","+1 需關注",false)+
    kpi("timer","平均保養工時","1.8","小時","-0.3h",true)+
    '</div>';
  var dh=["日","一","二","三","四","五","六"];
  var evmap={3:[["pm","CNC-07 週保"]],5:[["cm","AHU-2 濾網"]],8:[["pm","注塑機#3"],["cal2","精度校正"]],
    11:[["pm","空壓機A 季保"]],13:[["cm","輸送帶潤滑"]],14:[["pm","CNC-12 週保"],["pm","焊接臂#5"]],
    17:[["cal2","扭力校正"]],19:[["pm","冷卻塔清洗"]],21:[["pm","電控櫃巡檢"]],
    24:[["cm","泵浦密封"]],26:[["pm","CNC-07 週保"],["cm","風扇軸承"]],28:[["pm","注塑機#3"]]};
  var cal='<div class="ov"><div class="cal">';
  for(var d0=0;d0<7;d0++)cal+='<div class="dh">'+dh[d0]+'</div>';
  var start=5,days=31;
  for(var b=0;b<start;b++)cal+='<div class="cel" style="background:transparent;border:none"></div>';
  for(var dd=1;dd<=days;dd++){
    var tod=dd===14?' tod':'';var ev=evmap[dd]||[];var evh='';
    for(var e=0;e<ev.length;e++)evh+='<div class="ev '+ev[e][0]+'">'+ev[e][1]+'</div>';
    cal+='<div class="cel'+tod+'"><div class="d">'+dd+'</div>'+evh+'</div>';
  }
  cal+='</div></div><div class="legend"><span><i style="background:#22d3ee"></i>預防保養(PM)</span><span><i style="background:#f59e0b"></i>矯正保養(CM)</span><span><i style="background:#6366f1"></i>校正/檢定</span></div>';

  var plans=[
    ["CNC-07 五軸加工中心","週保養","每週三","08/17","王志明","91"],
    ["注塑機 #3","月保養","每月8日","09/08","陳建宏","76"],
    ["空壓機 A 機組","季保養","每季","09/11","林俊傑","62"],
    ["冷卻塔 CT-1","半年保","每半年","10/19","黃雅婷","44"],
    ["電控總櫃","雙週巡檢","每雙週一","08/21","王志明","83"]
  ];
  var pr='<div class="ov"><table><thead><tr><th>設備</th><th>保養類型</th><th>週期</th><th>下次到期</th><th>負責人</th><th>週期進度</th></tr></thead><tbody>';
  for(var p=0;p<plans.length;p++){var r=plans[p];pr+='<tr><td><b>'+r[0]+'</b></td><td><span class="tag t-info">'+r[1]+'</span></td><td>'+r[2]+'</td><td>'+r[3]+'</td><td>'+r[4]+'</td><td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i style="width:'+r[5]+'%"></i></div><span class="mini">'+r[5]+'%</span></div></td></tr>';}
  pr+='</tbody></table></div>';

  app.innerHTML=head("calendar_month","預防保養排程","依保養週期與運轉時數自動排定計畫，避免保養遺漏導致突發停機","本月準時率 94%")+
    kh+
    '<div class="grid g32" style="margin-top:14px">'+
      '<div class="card"><h3><span class="material-symbols-outlined">calendar_month</span>8 月保養行事曆 <small>今日 8/14</small></h3>'+cal+'</div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>保養類型分佈</h3><div id="c0pie" style="min-height:230px"></div></div>'+
    '</div>'+
    '<div class="card" style="margin-top:14px"><h3><span class="material-symbols-outlined">checklist</span>保養計畫清單</h3>'+pr+'</div>';

  void app.offsetHeight;
  var pie=new ApexCharts(document.querySelector("#c0pie"),{
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"donut",height:230,animations:{enabled:false},redrawOnParentResize:false,redrawOnWindowResize:false},
    series:[54,28,12,6],labels:["週保養","月保養","季保養","校正檢定"],
    colors:["#0891b2","#22d3ee","#0e7490","#a5f3fc"],
    legend:{position:"bottom",fontSize:"12px"},dataLabels:{enabled:true,formatter:function(v){return Math.round(v)+"%";}},
    stroke:{width:2,colors:["#fff"]},plotOptions:{pie:{donut:{size:"62%"}}}
  });
  pie.render();_charts.push(pie);
}

// ===== SCREEN 1 : 維修工單看板 (KANBAN) =====
function s1(){
  var cols=[
    {t:"待派工",c:"#94a3b8",wo:[
      ["WO-24081","輸送帶異音偏移","AHU-2 冷氣風機","一般","黃雅婷","2h前"],
      ["WO-24082","主軸溫度偏高告警","CNC-07","高","王志明","40m前"]
    ]},
    {t:"維修中",c:"#0891b2",wo:[
      ["WO-24076","油壓幫浦滲漏更換密封","注塑機 #3","高","陳建宏","進行 1.5h"],
      ["WO-24079","電控櫃散熱風扇故障","電控總櫃","一般","林俊傑","進行 0.5h"],
      ["WO-24080","刀庫換刀卡頓","CNC-12","急","王志明","進行 2h"]
    ]},
    {t:"試車確認",c:"#f59e0b",wo:[
      ["WO-24072","伺服馬達更換後試車","焊接臂 #5","高","陳建宏","待驗證"]
    ]},
    {t:"復機完成",c:"#16a34a",wo:[
      ["WO-24070","冷卻塔水泵軸承更換","冷卻塔 CT-1","一般","黃雅婷","已復機"],
      ["WO-24069","感測器校正","CNC-07","低","林俊傑","已復機"]
    ]}
  ];
  function prTag(p){var m={"急":"t-bad","高":"t-warn","一般":"t-info","低":"t-mut"};return '<span class="tag '+(m[p]||"t-mut")+'">'+p+'</span>';}
  var board='<div class="ov"><div class="board">';
  for(var c=0;c<cols.length;c++){
    var col=cols[c];board+='<div class="col"><div class="col-h"><span class="dot" style="background:'+col.c+'"></span>'+col.t+'<span class="cnt">'+col.wo.length+'</span></div>';
    for(var w=0;w<col.wo.length;w++){var o=col.wo[w];var ini=o[4].charAt(0);
      board+='<div class="wo" style="border-left-color:'+col.c+'"><div class="id">'+o[0]+' · '+o[2]+'</div><div class="tt">'+o[1]+'</div><div class="mt">'+prTag(o[3])+'<span class="av">'+ini+'</span>'+o[4]+'<span style="margin-left:auto"><span class="material-symbols-outlined">schedule</span>'+o[5]+'</span></div></div>';
    }
    board+='</div>';
  }
  board+='</div></div>';

  var kh='<div class="grid g4">'+
    kpi("assignment","進行中工單","8","件","負載均衡",true)+
    kpi("priority_high","急件/高優先","3","件","+1 需注意",false)+
    kpi("bolt","平均回應時間","18","分","-6 min",true)+
    kpi("task_alt","本週完工率","89","%","+5%",true)+
    '</div>';

  app.innerHTML=head("view_kanban","維修工單看板","報修派工到完工的狀態流轉，會造成停線或安全風險者最高優先","進行中 8 件")+
    kh+
    '<div class="card" style="margin-top:14px"><h3><span class="material-symbols-outlined">view_kanban</span>工單狀態看板 <small>待派工 → 維修中 → 試車確認 → 復機完成</small></h3>'+board+'</div>'+
    '<div class="grid g2" style="margin-top:14px">'+
      '<div class="card"><h3><span class="material-symbols-outlined">stacked_bar_chart</span>近 7 日工單開立/完工</h3><div id="c1bar" style="min-height:250px"></div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">pie_chart</span>報修來源分佈</h3><div id="c1pie" style="min-height:250px"></div></div>'+
    '</div>';

  void app.offsetHeight;
  var bar=new ApexCharts(document.querySelector("#c1bar"),{
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:"bar",height:250,toolbar:{show:false},animations:{enabled:false},redrawOnParentResize:false,redrawOnWindowResize:false},
    series:[{name:"開立",data:[9,12,7,14,10,6,8]},{name:"完工",data:[7,10,9,11,12,8,7]}],
    colors:["#0891b2","#22d3ee"],plotOptions:{bar:{columnWidth:"58%",borderRadius:4}},
    dataLabels:{enabled:false},xaxis:{categories:["8/8","8/9","8/10","8/11","8/12","8/13","8/14"]},
    legend:{position:"top"},grid:{borderColor:"#eef4f6"}
  });
  bar.render();_charts.push(bar);
  var pie=new ApexCharts(document.querySelector("#c1pie"),{

var SCREENS=[s0,s1,s2,s3,s4,s5];
function show(i){
  killCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle("on",+btns[b].getAttribute("data-i")===i);}
  (SCREENS[i]||s0)();
}
(function(){var btns=document.querySelectorAll("[data-i]");for(var b=0;b<btns.length;b++){btns[b].addEventListener("click",function(){show(+this.getAttribute("data-i"));try{window.scrollTo(0,0);}catch(e){}});}})();
show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
