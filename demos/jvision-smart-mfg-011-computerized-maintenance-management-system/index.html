<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMMS 設備維護管理系統</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
--color-primary:#16A34A;--color-on-primary:#000;--color-secondary:#22C55E;
--color-on-secondary:#0F172A;--color-accent:#DC2626;--color-on-accent:#FFF;
--color-background:#F0FDF4;--color-foreground:#14532D;--color-card:#FFF;
--color-card-foreground:#14532D;--color-muted:#E8F0F1;--color-muted-foreground:#475569;
--color-border:#BBF7D0;--color-destructive:#DC2626;--color-on-destructive:#FFF;
--color-ring:#16A34A;--blue:#16A34A;--ink:#14532D;--muted:#475569;--line:#BBF7D0;
--amber:#B45309;--shadow:0 1px 0 rgba(20,83,45,.05),0 9px 24px rgba(20,83,45,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--color-background);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,a{font:inherit}
button{cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--color-ring);outline-offset:3px}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);box-shadow:0 4px 16px rgba(20,83,45,.05)}
.topinner{max-width:1440px;margin:auto;min-height:76px;padding:12px 24px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:12px;min-width:max-content}
.logo{width:42px;height:42px;display:grid;place-items:center;background:var(--color-primary);color:#052E16;border-radius:8px}
.logo svg{width:24px}
.brand b{display:block;font-size:15px;letter-spacing:.03em}
.brand small{display:block;margin-top:3px;color:var(--muted);font-size:10px;letter-spacing:.08em}
.nav{margin-left:auto;display:flex;gap:4px;overflow-x:auto;padding:3px}
.nav button{display:flex;align-items:center;gap:7px;min-height:42px;padding:9px 11px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.nav button:hover{background:var(--color-background);color:var(--ink);border-color:var(--line)}
.nav button.on{background:var(--ink);color:#fff}
.icon{display:inline-grid;place-items:center;width:18px;height:18px;flex:none}
.icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1440px;margin:auto;padding:30px 24px 56px}
.scr-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px}
.eyebrow{margin-bottom:7px;color:var(--blue);font:600 10px "JetBrains Mono",monospace;letter-spacing:.16em;text-transform:uppercase}
.scr-head h1{margin:0;font-size:clamp(24px,3vw,38px);line-height:1.05;letter-spacing:-.04em}
.scr-head p{max-width:760px;margin:9px 0 0;color:var(--muted);font-size:13px;line-height:1.65}
.pill,.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;font-weight:700;white-space:nowrap}
.pill{padding:8px 12px;background:#fff;border:1px solid var(--line);font-size:11px;box-shadow:var(--shadow)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g23{grid-template-columns:2fr 1fr}.g32{grid-template-columns:1.4fr 1fr}
.card,.kpi{background:var(--color-card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.card{padding:18px;min-width:0}
.card h3{display:flex;align-items:center;gap:8px;margin:0 0 16px;font-size:13px;letter-spacing:.01em}
.card h3 svg{width:18px;color:var(--blue)}
.card h3 small{margin-left:auto;color:var(--muted);font-size:10px;font-weight:500}
.kpi{position:relative;padding:17px 18px;border-top:3px solid var(--blue);overflow:hidden;transition:transform .2s,box-shadow .2s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(20,83,45,.11)}
.kpi:after{content:"";position:absolute;right:-24px;top:-30px;width:80px;height:80px;border:1px solid var(--line);transform:rotate(45deg)}
.lab{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;font-weight:700}
.val{margin:9px 0 6px;font-size:29px;line-height:1;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.val small{color:var(--muted);font-size:11px;letter-spacing:0}
.dt{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700}
.up{color:#166534}.down{color:#B91C1C}
.status-icon{font-size:12px}
.ov{max-width:100%;overflow:auto}
table{width:100%;min-width:580px;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th{padding:10px 11px;background:#F7FCF8;border-block:1px solid var(--line);color:var(--muted);font-size:10px;text-align:left;letter-spacing:.04em;white-space:nowrap}
td{padding:11px;border-bottom:1px solid #DCFCE7;white-space:nowrap}
tbody tr{transition:background .2s}tbody tr:hover{background:#F7FCF8}
td:nth-child(n+3){font-variant-numeric:tabular-nums}
.tag{padding:4px 8px;font-size:10px;border:1px solid currentColor}
.t-ok{background:#F0FDF4;color:#166534}.t-warn{background:#FFFBEB;color:#92400E}.t-bad{background:#FEF2F2;color:#B91C1C}.t-info{background:#F0FDF4;color:#166534}.t-mut{background:#F1F5F9;color:#475569}
.mono,.id,.mini{font-family:"JetBrains Mono",monospace}.mini{color:var(--muted);font-size:10px}
.bar{height:7px;overflow:hidden;background:#E2E8F0;border-radius:1px}.bar i{display:block;height:100%;background:var(--blue)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;min-width:760px}
.col{padding:10px;background:#F7FCF8;border:1px solid var(--line);border-radius:6px}
.col-h{display:flex;align-items:center;gap:7px;padding:3px 2px 10px;border-bottom:1px solid var(--line);font-size:11px;font-weight:800}
.col-h .cnt{margin-left:auto;padding:2px 7px;background:#fff;border:1px solid var(--line);border-radius:999px;font:10px "JetBrains Mono"}
.wo{margin-top:9px;padding:11px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:4px;transition:transform .2s,box-shadow .2s}
.wo:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.wo .id{color:var(--muted);font-size:9px}.wo .tt{margin:6px 0 9px;font-size:11px;font-weight:700;line-height:1.45}
.mt{display:flex;align-items:center;gap:7px;flex-wrap:wrap;color:var(--muted);font-size:9px}
.av{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:9px;font-weight:800}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;min-width:650px}
.dh{text-align:center;color:var(--muted);font-size:10px;font-weight:700;padding:5px}
.cel{min-height:78px;padding:7px;background:#FAFFFB;border:1px solid #DCFCE7;border-radius:4px}.cel.tod{border:2px solid var(--blue)}
.d{font:10px "JetBrains Mono";color:var(--muted)}
.ev{margin-top:4px;padding:3px 5px;border-left:3px solid currentColor;background:#fff;font-size:9px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.pm{color:#166534}.ev.cm{color:#92400E}.ev.cal2{color:#4338CA}
.legend{display:flex;gap:15px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:10px}.legend i{display:inline-block;width:8px;height:8px;margin-right:5px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #DCFCE7;font-size:11px}.row:last-child{border:0}
.chip{padding:3px 7px;background:#F0FDF4;border:1px solid var(--line);border-radius:3px;color:#166534;font-size:9px;font-weight:700}
.tl{position:relative}.tl:before{content:"";position:absolute;left:8px;top:4px;bottom:5px;width:1px;background:var(--line)}
.tl li{position:relative;list-style:none;padding:0 0 20px}.tl li:before{content:"";position:absolute;left:-22px;top:3px;width:9px;height:9px;border:3px solid #DCFCE7;background:var(--blue);border-radius:50%}
.tm{color:#166534;font:10px "JetBrains Mono";font-weight:700}.th{margin:4px 0;font-size:12px;font-weight:700}.td2{color:var(--muted);font-size:11px;line-height:1.55}
.foot{padding:0 20px 28px;text-align:center;color:var(--muted);font-size:10px}
.reveal{animation:reveal .35s ease-out both}@keyframes reveal{from{opacity:0;transform:translateY(12px)}}
@media(max-width:960px){.topinner{align-items:flex-start;flex-direction:column;gap:8px}.nav{width:100%;margin:0}.g4{grid-template-columns:repeat(2,1fr)}.g23,.g32{grid-template-columns:1fr}}
@media(max-width:640px){.topinner,.wrap{padding-left:14px;padding-right:14px}.scr-head{align-items:flex-start;flex-direction:column}.g4,.g2{grid-template-columns:1fr}.brand small{display:none}.nav button{min-width:42px;justify-content:center}.nav .txt{display:none}.card{padding:13px}.val{font-size:26px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topbar"><div class="topinner">
<div class="brand"><div class="logo" id="brandIcon"></div><div><b>CMMS 設備維護</b><small>COMPUTERIZED MAINTENANCE MANAGEMENT SYSTEM</small></div></div>
<nav class="nav" id="nav" aria-label="主要功能"></nav>
</div></header>
<main class="wrap"><div id="app" class="reveal"></div></main>
<footer class="foot">CMMS 設備維護管理系統 · 純前端展示 Demo · 保養 · 維修 · 預兆 · 備品全生命週期</footer>
<script>
const icons={
gear:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 3.5h5l.6 2.2 1.5.9 2.2-.7 2.5 4.3-1.6 1.6v1.8l1.6 1.6-2.5 4.3-2.2-.7-1.5.9-.6 2.2h-5l-.6-2.2-1.5-.9-2.2.7-2.5-4.3 1.6-1.6v-1.8l-1.6-1.6 2.5-4.3 2.2.7 1.5-.9z"/><circle cx="12" cy="12" r="3"/></svg>',
calendar:'<svg viewBox="0 0 24 24"><path d="M5 3v3M19 3v3M4 8h16M4 5h16v16H4z"/><path d="M8 12h2M14 12h2M8 16h2"/></svg>',
board:'<svg viewBox="0 0 24 24"><path d="M4 4h6v16H4zM14 4h6v10h-6z"/></svg>',
sensor:'<svg viewBox="0 0 24 24"><path d="M12 18v3M8 21h8M12 14a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M6.4 5.4a9 9 0 0 0 0 11.2M17.6 5.4a9 9 0 0 1 0 11.2"/></svg>',
box:'<svg viewBox="0 0 24 24"><path d="m4 7 8-4 8 4v10l-8 4-8-4zM4 7l8 4 8-4M12 11v10"/></svg>',
speed:'<svg viewBox="0 0 24 24"><path d="M4 17a8 8 0 1 1 16 0"/><path d="m12 15 4-5M7 18h10"/></svg>',
history:'<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2-5.3L4 9"/><path d="M4 4v5h5M12 8v5l3 2"/></svg>',
chart:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
list:'<svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>'
};
brandIcon.innerHTML=icons.gear;
const NAV=[["calendar","保養排程"],["board","工單看板"],["sensor","預兆診斷"],["box","備品庫存"],["speed","OEE 稼動"],["history","維護履歷"]];
const app=document.getElementById("app"),nav=document.getElementById("nav");let charts=[];
nav.innerHTML=NAV.map((n,i)=>`<button data-i="${i}" aria-label="${n[1]}"><span class="icon">${icons[n[0]]}</span><span class="txt">${n[1]}</span></button>`).join("");
function kill(){charts.forEach(c=>{try{c.destroy()}catch(e){}});charts=[]}
function head(title,sub,pill){return `<section class="scr-head"><div><div class="eyebrow">Equipment reliability / Operations</div><h1>${title}</h1><p>${sub}</p></div><span class="pill"><span class="dot"></span>${pill}</span></section>`}
function kpi(l,v,u,d,up=true){return `<article class="kpi"><div class="lab">${l}</div><div class="val">${v}${u?` <small>${u}</small>`:""}</div><div class="dt ${up?"up":"down"}"><span class="status-icon" aria-hidden="true">${up?"↑":"!"}</span>${d}</div></article>`}
function title(t,s=""){return `<h3>${icons.chart}${t}${s?`<small>${s}</small>`:""}</h3>`}
function opts(type,h){return{chart:{type,height:h,toolbar:{show:false},animations:{enabled:false},fontFamily:"Inter"},colors:["#16A34A","#22C55E","#B45309","#86EFAC"],dataLabels:{enabled:false},grid:{borderColor:"#DCFCE7"},legend:{fontSize:"11px"},stroke:{width:2}}}
function mount(sel,o){let c=new ApexCharts(document.querySelector(sel),o);c.render();charts.push(c)}
function s0(){
let ev={3:[["pm","CNC-07 週保"]],5:[["cm","AHU-2 濾網"]],8:[["pm","注塑機#3"],["cal2","精度校正"]],11:[["pm","空壓機A 季保"]],13:[["cm","輸送帶潤滑"]],14:[["pm","CNC-12 週保"],["pm","焊接臂#5"]],17:[["cal2","扭力校正"]],19:[["pm","冷卻塔清洗"]],21:[["pm","電控櫃巡檢"]],24:[["cm","泵浦密封"]],26:[["pm","CNC-07 週保"],["cm","風扇軸承"]],28:[["pm","注塑機#3"]]};
let cal='<div class="ov"><div class="cal">'+["日","一","二","三","四","五","六"].map(x=>`<div class="dh">${x}</div>`).join("")+'<div class="cel" style="visibility:hidden"></div>'.repeat(5);
for(let d=1;d<=31;d++)cal+=`<div class="cel${d===14?" tod":""}"><div class="d">${d}</div>${(ev[d]||[]).map(x=>`<div class="ev ${x[0]}">${x[1]}</div>`).join("")}</div>`;
cal+='</div></div><div class="legend"><span><i style="background:#16A34A"></i>預防保養(PM)</span><span><i style="background:#B45309"></i>矯正保養(CM)</span><span><i style="background:#4338CA"></i>校正/檢定</span></div>';
let rows=[["CNC-07 五軸加工中心","週保養","每週三","08/17","王志明",91],["注塑機 #3","月保養","每月8日","09/08","陳建宏",76],["空壓機 A 機組","季保養","每季","09/11","林俊傑",62],["冷卻塔 CT-1","半年保","每半年","10/19","黃雅婷",44],["電控總櫃","雙週巡檢","每雙週一","08/21","王志明",83]];
let tb=`<div class="ov"><table><thead><tr><th>設備</th><th>保養類型</th><th>週期</th><th>下次到期</th><th>負責人</th><th>週期進度</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${r[0]}</b></td><td><span class="tag t-info">● ${r[1]}</span></td><td>${r[2]}</td><td class="mono">${r[3]}</td><td>${r[4]}</td><td><div style="display:flex;gap:7px;align-items:center"><div class="bar" style="width:80px"><i style="width:${r[5]}%"></i></div><span class="mini">${r[5]}%</span></div></td></tr>`).join("")}</tbody></table></div>`;
app.innerHTML=head("預防保養排程","依保養週期與運轉時數自動排定計畫，避免保養遺漏導致突發停機","本月準時率 94%")+`<div class="grid g4">${kpi("本月計畫保養","128","件","準時率 94%")}${kpi("即將到期(7日)","17","件","-4 vs 上週")}${kpi("逾期未執行","3","件","+1 需關注",false)}${kpi("平均保養工時","1.8","小時","-0.3h")}</div><div class="grid g32" style="margin-top:12px"><section class="card">${title("8 月保養行事曆","今日 8/14")}${cal}</section><section class="card">${title("保養類型分佈")}<div id="pie" style="min-height:230px"></div></section></div><section class="card" style="margin-top:12px">${title("保養計畫清單")}${tb}</section>`;
let o=opts("donut",230);Object.assign(o,{series:[54,28,12,6],labels:["週保養","月保養","季保養","校正檢定"],legend:{position:"bottom"},plotOptions:{pie:{donut:{size:"64%"}}},dataLabels:{enabled:true,formatter:v=>Math.round(v)+"%"}});mount("#pie",o)
}
function s1(){
let cs=[["待派工","#64748B",[["WO-24081","輸送帶異音偏移","AHU-2 冷氣風機","一般","黃雅婷","2h前"],["WO-24082","主軸溫度偏高告警","CNC-07","高","王志明","40m前"]]],["維修中","#16A34A",[["WO-24076","油壓幫浦滲漏更換密封","注塑機 #3","高","陳建宏","進行 1.5h"],["WO-24079","電控櫃散熱風扇故障","電控總櫃","一般","林俊傑","進行 0.5h"],["WO-24080","刀庫換刀卡頓","CNC-12","急","王志明","進行 2h"]]],["試車確認","#B45309",[["WO-24072","伺服馬達更換後試車","焊接臂 #5","高","陳建宏","待驗證"]]],["復機完成","#166534",[["WO-24070","冷卻塔水泵軸承更換","冷卻塔 CT-1","一般","黃雅婷","已復機"],["WO-24069","感測器校正","CNC-07","低","林俊傑","已復機"]]]];
let cls={急:"t-bad",高:"t-warn",一般:"t-info",低:"t-mut"};
let board=`<div class="ov"><div class="board">${cs.map(c=>`<div class="col"><div class="col-h"><span class="dot" style="color:${c[1]}"></span>${c[0]}<span class="cnt">${c[2].length}</span></div>${c[2].map(w=>`<article class="wo" style="border-left-color:${c[1]}"><div class="id">${w[0]} · ${w[2]}</div><div class="tt">${w[1]}</div><div class="mt"><span class="tag ${cls[w[3]]}">● ${w[3]}</span><span class="av">${w[4][0]}</span>${w[4]}<span style="margin-left:auto">${w[5]}</span></div></article>`).join("")}</div>`).join("")}</div></div>`;
app.innerHTML=head("維修工單看板","報修派工到完工的狀態流轉，會造成停線或安全風險者最高優先","進行中 8 件")+`<div class="grid g4">${kpi("進行中工單","8","件","負載均衡")}${kpi("急件/高優先","3","件","+1 需注意",false)}${kpi("平均回應時間","18","分","-6 min")}${kpi("本週完工率","89","%","+5%")}</div><section class="card" style="margin-top:12px">${title("工單狀態看板","待派工 → 維修中 → 試車確認 → 復機完成")}${board}</section><div class="grid g2" style="margin-top:12px"><section class="card">${title("近 7 日工單開立/完工")}<div id="bar1"></div></section><section class="card">${title("報修來源分佈")}<div id="pie1"></div></section></div>`;
let a=opts("bar",250);Object.assign(a,{series:[{name:"開立",data:[9,12,7,14,10,6,8]},{name:"完工",data:[7,10,9,11,12,8,7]}],xaxis:{categories:["8/8","8/9","8/10","8/11","8/12","8/13","8/14"]},plotOptions:{bar:{borderRadius:2,columnWidth:"58%"}}});mount("#bar1",a);
let b=opts("pie",250);Object.assign(b,{series:[42,26,18,14],labels:["預兆系統告警","現場人工報修","巡檢發現","保養轉維修"],legend:{position:"bottom"},dataLabels:{enabled:true,formatter:v=>Math.round(v)+"%"}});mount("#pie1",b)
}
