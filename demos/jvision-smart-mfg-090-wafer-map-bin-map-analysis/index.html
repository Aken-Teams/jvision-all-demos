<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>晶圓分布圖缺陷分析</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#2563EB;
  --color-on-primary:#FFFFFF;
  --color-secondary:#3B82F6;
  --color-on-secondary:#000000;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F8FAFC;
  --color-foreground:#1E293B;
  --color-card:#FFFFFF;
  --color-card-foreground:#1E293B;
  --color-muted:#E9EFF8;
  --color-muted-foreground:#475569;
  --color-border:#E2E8F0;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#2563EB;

  --blue:#2563EB;
  --ink:#1E293B;
  --muted:#475569;
  --line:#CBD5E1;

  --ok:#047857;
  --warn:#B45309;
  --bad:#DC2626;
  --purple:#6D28D9;
  --black:#0F172A;
  --shadow:6px 6px 0 #0F172A;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{
  margin:0;
  color:var(--ink);
  background:
    linear-gradient(var(--color-border) 1px,transparent 1px),
    linear-gradient(90deg,var(--color-border) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  font-family:"Fira Sans",sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,a,[data-i]{cursor:pointer}
button{font:inherit}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-size:20px;
  line-height:1;
  vertical-align:middle;
}
:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.topbar{
  position:sticky;
  inset:0 0 auto;
  z-index:50;
  color:#fff;
  background:var(--black);
  border-bottom:4px solid var(--color-accent);
}
.topbar-in{
  width:min(1500px,100%);
  margin:auto;
  display:grid;
  grid-template-columns:auto 1fr;
  align-items:stretch;
}
.brand{
  min-width:270px;
  padding:12px 18px;
  display:flex;
  align-items:center;
  gap:12px;
  color:var(--black);
  background:var(--color-accent);
  border-right:4px solid #fff;
}
.logo{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--black);
  border:2px solid #fff;
}
.brand b{
  display:block;
  font-size:16px;
  font-weight:700;
  letter-spacing:.02em;
}
.brand small{
  display:block;
  font:500 10px/1.3 "Fira Code",monospace;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.nav{
  min-width:0;
  display:flex;
  align-items:stretch;
  overflow-x:auto;
}
.nav button{
  min-width:126px;
  min-height:66px;
  padding:8px 12px;
  border:0;
  border-right:1px solid #475569;
  color:#CBD5E1;
  background:transparent;
  font-size:12px;
  font-weight:600;
}
.nav button:hover{
  color:#fff;
  background:#1E293B;
}
.nav button.on{
  color:#fff;
  background:var(--color-primary);
  box-shadow:inset 0 -5px 0 #fff;
}
.nav button .material-symbols-outlined{
  display:block;
  margin:0 auto 4px;
}
.wrap{
  width:min(1440px,100%);
  margin:auto;
  padding:28px 20px 48px;
}
.screen-head{
  position:relative;
  min-height:180px;
  margin:0 0 24px;
  padding:28px min(33%,440px) 28px 28px;
  color:#fff;
  background:var(--color-primary);
  border:3px solid var(--black);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.screen-head:after{
  content:"WAFER / QUALITY / 090";
  position:absolute;
  top:0;
  right:0;
  width:30%;
  height:100%;
  display:grid;
  place-items:center;
  padding:20px;
  color:var(--black);
  background:var(--color-accent);
  border-left:3px solid var(--black);
  font:700 clamp(16px,2.4vw,34px)/1.1 "Fira Code",monospace;
  text-align:center;
  word-break:break-word;
}
.screen-head h1{
  max-width:800px;
  margin:0 0 10px;
  font-size:clamp(28px,4vw,54px);
  line-height:1;
  letter-spacing:-.04em;
}
.screen-head p{
  max-width:760px;
  margin:0;
  color:#EFF6FF;
  font-size:14px;
}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-32{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g-23{grid-template-columns:minmax(280px,1fr) minmax(0,2fr)}
.card{
  min-width:0;
  padding:18px;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:2px solid var(--black);
  box-shadow:3px 3px 0 var(--black);
}
.card.pad0{padding:0;overflow:hidden}
.card h3{
  margin:0 0 4px;
  display:flex;
  align-items:center;
  gap:8px;
  font-size:15px;
  font-weight:700;
}
.card h3 .material-symbols-outlined{color:var(--color-primary)}
.card .sub{
  margin:0 0 14px;
  color:var(--muted);
  font-size:12px;
}
.kpi{position:relative;overflow:hidden}
.kpi:before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:8px;
  background:var(--color-primary);
}
.kpi:nth-child(even):before{background:var(--color-accent)}
.kpi .lab{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:12px;
  font-weight:600;
  text-transform:uppercase;
}
.kpi .val{
  margin:8px 0 2px;
  font:700 clamp(25px,3vw,38px)/1 "Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
.kpi .val small{font-size:12px;color:var(--muted)}
.delta{font:600 11px "Fira Code",monospace}
.delta.up{color:var(--ok)}
.delta.down{color:var(--bad)}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 8px;
  border:1px solid currentColor;
  font-size:11px;
  font-weight:700;
  line-height:1.25;
}
.tag:before{font-family:"Material Symbols Outlined";font-size:13px}
.tag.red{color:#991B1B;background:#FEE2E2}
.tag.red:before{content:"warning"}
.tag.org{color:#9A3412;background:#FFEDD5}
.tag.org:before{content:"priority_high"}
.tag.grn{color:#065F46;background:#D1FAE5}
.tag.grn:before{content:"check_circle"}
.tag.blu{color:#1E40AF;background:#DBEAFE}
.tag.blu:before{content:"info"}
.tag.gry{color:#334155;background:#F1F5F9}
.tag.gry:before{content:"label"}
.tag.prp{color:#5B21B6;background:#EDE9FE}
.tag.prp:before{content:"category"}
.tbl-wrap,.board-wrap{overflow:auto}
table{
  width:100%;
  min-width:560px;
  border-collapse:collapse;
  font-size:12px;
}
th,td{
  padding:11px 13px;
  border:1px solid var(--line);
  text-align:left;
  white-space:nowrap;
}
th{
  color:#fff;
  background:var(--black);
  font-size:11px;
  font-weight:700;
  letter-spacing:.03em;
  text-transform:uppercase;
}
tbody tr:nth-child(even){background:#F8FAFC}
tbody tr:hover{background:#DBEAFE}
td.num,th.num{
  text-align:right;
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
td:first-child,td code,.tid{
  font-family:"Fira Code",monospace;
  font-variant-numeric:tabular-nums;
}
.bar{
  height:10px;
  min-width:64px;
  overflow:hidden;
  background:var(--color-muted);
  border:1px solid var(--black);
}
.bar i{display:block;height:100%}
.chart{width:100%;overflow:hidden}
.pill-row,.legend{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.pill-row{margin:0 0 18px}
.pill{
  min-height:38px;
  padding:7px 12px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:var(--ink);
  background:#fff;
  border:2px solid var(--black);
  font-size:12px;
  font-weight:600;
}
.pill.on{
  color:#fff;
  background:var(--color-primary);
  box-shadow:3px 3px 0 var(--black);
}
.wafer{
  width:100%;
  max-width:360px;
  aspect-ratio:1;
  margin:auto;
  display:grid;
  gap:2px;
  padding:8px;
  background:var(--black);
  border:2px solid var(--black);
}
.die{width:100%;height:100%;border:1px solid rgba(15,23,42,.15)}
.legend{margin-top:14px;font-size:11px}
.legend .li{display:flex;align-items:center;gap:6px}
.legend .sw{
  width:13px;
  height:13px;
  border:1px solid var(--black);
}
.dot{
  display:inline-block;
  width:10px;
  height:10px;
  margin-right:6px;
  border:1px solid var(--black);
}
.stat-mini{
  min-height:54px;
  padding:10px 0;
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid var(--line);
}
.stat-mini:last-child{border:0}
.stat-mini .ic{
  width:36px;
  height:36px;
  flex:none;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--color-primary)!important;
  border:2px solid var(--black);
}
.stat-mini .g{min-width:0;flex:1}
.stat-mini .g b{display:block;font-size:13px}
.stat-mini .g span{display:block;color:var(--muted);font-size:11px}
.ai{
  margin:0 0 12px;
  padding:13px;
  background:#EFF6FF;
  border:2px solid var(--black);
  border-left:8px solid var(--color-primary);
}
.ai:last-child{margin:0}
.ai .ah{margin-bottom:4px;display:flex;align-items:center;gap:7px;font-weight:700}
.ai .ad{color:#334155;font-size:12px}
.progress-lbl{
  margin:13px 0 5px;
  display:flex;
  justify-content:space-between;
  font:600 11px "Fira Code",monospace;
}
.board{
  min-width:1000px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
}
.col{
  padding:10px;
  background:var(--color-muted);
  border:2px solid var(--black);
}
.col-h{
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  font-weight:700;
}
.cnt{
  padding:0 7px;
  color:#fff;
  background:var(--black);
  font-family:"Fira Code",monospace;
}
.tk{
  margin-bottom:9px;
  padding:10px;
  background:#fff;
  border:2px solid var(--black);
  border-left:7px solid var(--color-primary);
}
.tk:last-child{margin:0}
.tk .tid{color:var(--muted);font-size:10px;font-weight:700}
.tk .tt{margin:3px 0 8px;font-size:12px;font-weight:700}
.tk .meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.av{
  width:24px;
  height:24px;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--black);
  border:1px solid var(--black);
  font-size:10px;
  font-weight:700;
}
.footer-cta{
  margin-top:24px;
  padding:20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  color:#fff;
  background:var(--black);
  border:3px solid var(--black);
  box-shadow:6px 6px 0 var(--color-accent);
}
.footer-cta b{font-size:18px}
.footer-cta span{display:block;color:#CBD5E1;font-size:12px}
.footer-cta button{
  min-height:44px;
  padding:9px 18px;
  color:#111827;
  background:var(--color-accent);
  border:3px solid #fff;
  font-weight:700;
}
.foot{
  padding:24px 0 4px;
  color:var(--muted);
  font:500 11px "Fira Code",monospace;
  text-align:center;
}
@media(max-width:1024px){
  .topbar-in{grid-template-columns:1fr}
  .brand{border-right:0;border-bottom:3px solid #fff}
  .nav button{min-width:118px}
  .g-kpi{grid-template-columns:repeat(2,1fr)}
  .g-32,.g-23{grid-template-columns:1fr}
}
@media(max-width:768px){
  .wrap{padding:18px 12px 36px}
  .screen-head{padding:24px 24px 118px;min-height:280px}
  .screen-head:after{
    inset:auto 0 0;
    width:100%;
    height:88px;
    border-left:0;
    border-top:3px solid var(--black);
  }
  .g-2,.g-3{grid-template-columns:1fr}
  .footer-cta{align-items:stretch;flex-direction:column}
}
@media(max-width:480px){
  .brand{min-width:0}
  .brand small{display:none}
  .nav button{min-width:64px;min-height:56px;padding:7px}
  .nav .lb{display:none}
  .g-kpi{grid-template-columns:1fr}
  .screen-head h1{font-size:31px}
}
@media(prefers-reduced-motion:no-preference){
  .grid-item,.card,.screen-head{
    animation:grid-in .4s cubic-bezier(.34,1.56,.64,1) both;
  }
  .grid-item:nth-child(2),.card:nth-child(2){animation-delay:.06s}
  .grid-item:nth-child(3),.card:nth-child(3){animation-delay:.12s}
  .grid-item:nth-child(4),.card:nth-child(4){animation-delay:.18s}
  .nav button,.footer-cta button{transition:background-color .18s,color .18s,box-shadow .18s}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
}
@keyframes grid-in{
  from{opacity:0;transform:translateY(16px) scale(.92)}
  to{opacity:1;transform:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined" aria-hidden="true">biotech</span></div>
      <div>
        <b>晶圓分布圖缺陷分析</b>
        <small>QUALITY INSPECTION / WAFER MAP</small>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
  </div>
</header>

<main class="wrap">
  <div id="app"></div>
  <section class="footer-cta" aria-label="分析行動">
    <div><b>從分布異常到可稽核結案</b><span>六階段品質檢驗管線 · 資料、判定與證據集中管理</span></div>
    <button type="button" id="nextScreen">前往下一分析階段</button>
  </section>
  <footer class="foot">純 UI 系統展示 · 資料皆為擬真示範 · 晶圓圖分析平台 v090</footer>
</main>

<script>
"use strict";
var NAV=[
  {i:0,ic:"dashboard",lb:"測試數據匯入"},
  {i:1,ic:"biotech",lb:"Bin Map 視覺化"},
  {i:2,ic:"account_tree",lb:"空間圖形辨識"},
  {i:3,ic:"insights",lb:"多批次疊圖"},
  {i:4,ic:"warning",lb:"異常關聯分析"},
  {i:5,ic:"fact_check",lb:"根因與結案"}
];
var charts=[],current=0;
var C={blue:"#2563EB",orange:"#EA580C",green:"#047857",red:"#DC2626",purple:"#6D28D9",slate:"#64748B"};
var BINCOL={"1":"#047857","2":"#EA580C","3":"#DC2626","4":"#6D28D9","5":"#2563EB","6":"#0F766E","0":"#E2E8F0"};
var BINNAME={"1":"Pass","2":"Open","3":"Short","4":"Leakage","5":"Idd 超標","6":"Vt 偏移","0":"未測"};

function clearCharts(){
  charts.forEach(function(ch){try{ch.destroy()}catch(e){}});
  charts=[];
}
function mk(id,opt){
  var el=document.getElementById(id);
  if(!el)return;
  opt.chart=Object.assign({
    redrawOnParentResize:false,
    redrawOnWindowResize:false,
    animations:{enabled:false},
    toolbar:{show:false},
    fontFamily:"Fira Sans"
  },opt.chart||{});
  opt.grid=Object.assign({borderColor:"#CBD5E1",strokeDashArray:0},opt.grid||{});
  var ch=new ApexCharts(el,opt);
  ch.render();
  charts.push(ch);
}
function genWafer(seed,pat){
  var N=13,cells=[],cx=6,R=6.35,s=seed;
  function rnd(){s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff}
  for(var y=0;y<N;y++)for(var x=0;x<N;x++){
    var d=Math.hypot(x-cx,y-cx),r=rnd(),b="1";
    if(d>R){cells.push("-1");continue}
    if(pat==="edge"&&d>R-1.3)b=r<.7?"3":"2";
    else if(pat==="ring"&&d>R-2.4&&d<R-1.1)b=r<.65?"5":"6";
    else if(pat==="cluster"&&x>=8&&x<=11&&y>=2&&y<=5)b=r<.7?"4":"3";
    else if(pat==="scratch"&&Math.abs((x-2)-(y-2))<1&&x>1&&x<11)b=r<.75?"2":"3";
    else b=r<.06?(r<.03?"2":"3"):"1";
    cells.push(b);
  }
  return{N:N,cells:cells};
}
function waferHTML(w){
  return '<div class="wafer" style="grid-template-columns:repeat('+w.N+',1fr)">'+w.cells.map(function(b){
    if(b==="-1")return '<div class="die" style="background:transparent;border:0"></div>';
    return '<div class="die" title="Bin '+b+' · '+BINNAME[b]+'" style="background:'+BINCOL[b]+'"></div>';
  }).join("")+"</div>";
}
function waferYield(w){
  var p=0,t=0;
  w.cells.forEach(function(b){if(b!=="-1"){t++;if(b==="1")p++}});
  return t?p/t*100:0;
}
function kpi(ic,lab,val,unit,dir){
  var delta=dir?'<div class="delta '+dir+'"><span class="material-symbols-outlined">'+(dir==="up"?"trending_up":"trending_down")+'</span> '+unit+'</div>':"";
  return '<div class="card kpi grid-item"><div class="lab"><span class="material-symbols-outlined">'+ic+'</span>'+lab+'</div><div class="val">'+val+(dir?"":' <small>'+unit+"</small>")+"</div>"+delta+"</div>";
}
function ai(h,d){
  return '<div class="ai"><div class="ah"><span class="material-symbols-outlined">auto_awesome</span>'+h+'</div><div class="ad">'+d+"</div></div>";
}
function health(nm,val,cls){
  return '<div class="stat-mini"><div class="ic"><span class="material-symbols-outlined">task_alt</span></div><div class="g"><b>'+nm+'</b><span>管線檢核關卡</span></div><span class="tag '+cls+'">'+val+"</span></div>";
}
function waferCard(title,w,y){
  var cls=y>=90?"grn":y>=80?"org":"red";
  return '<div class="card grid-item"><h3 style="justify-content:space-between"><span><span class="material-symbols-outlined">radio_button_checked</span> '+title+'</span><span class="tag '+cls+'">良率 '+y.toFixed(1)+'%</span></h3><div style="margin-top:12px">'+waferHTML(w)+"</div></div>";
}
function head(title,desc){
  return '<section class="screen-head"><h1>'+title+'</h1><p>'+desc+"</p></section>";
}

function s0(c){
  var lots=[
    ["LOT-24518A","AP3021-N7",25,"STDF v4",14320,100,"已解析","grn"],
    ["LOT-24521C","RF7712-N6",25,"STDF v4",9880,64,"解析中","org"],
    ["LOT-24524B","PM4408-N5",24,"CSV",12060,100,"已解析","grn"],
    ["LOT-24527D","AP3021-N7",25,"STDF v4",14210,88,"待驗證","blu"],
    ["LOT-24530E","SN9901-N7",12,"CSV",5940,32,"欄位對映","red"],
    ["LOT-24533F","RF7712-N6",25,"STDF v4",9910,100,"已解析","grn"]
  ];
  var rows=lots.map(function(l){

    return '<button type="button" data-i="'+n.i+'" aria-label="'+n.lb+'"><span class="material-symbols-outlined" aria-hidden="true">'+n.ic+'</span><span class="lb">'+n.lb+"</span></button>";
  }).join("");
  nav.querySelectorAll("[data-i]").forEach(function(btn){
    btn.addEventListener("click",function(){location.hash="go="+this.getAttribute("data-i")});
  });
})();
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  show(m?+m[1]:0);
  try{window.scrollTo(0,0)}catch(e){}
}
document.getElementById("nextScreen").addEventListener("click",function(){
  location.hash="go="+((current+1)%SCREENS.length);
});
window.addEventListener("hashchange",fromHash);
fromHash();
</script>
</body>
