<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>旅宿房況營收台 · Hospitality Room & Revenue</title>
<meta name="description" content="從房況圖、OTA/直訂訂房、入住退房到房價營收與清潔排房的旅宿營運台（純 UI 展示）。"/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --acc:#3730a3; --acc2:#4f46e5; --acc-d:#26216e; --acc-l:#eef2ff;
  --ink:#111827; --body:#374151; --mut:#6b7280; --line:#e5e7eb; --bg:#f5f5fb; --card:#fff;
  --vac:#16a34a; --occ:#4f46e5; --clean:#d97706; --fix:#dc2626; --out:#64748b;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--body);-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;font-size:20px;vertical-align:middle;line-height:1}

/* top nav */
.top{position:sticky;top:0;z-index:30;background:linear-gradient(120deg,var(--acc),var(--acc-d));box-shadow:0 4px 18px rgba(55,48,163,.28)}
.topin{max-width:1360px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:11px 24px;flex-wrap:wrap;min-width:0}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#fff;flex:none;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.22)}
.logo::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 55%,rgba(255,255,255,.28) 100%)}
.logo .material-symbols-outlined{font-size:24px;position:relative;z-index:1}
.brand b{font-size:16px;font-weight:900;color:#fff;display:block;font-family:"Noto Sans TC"}
.brand span{font-size:10.5px;color:#c7d2fe;letter-spacing:2.5px;font-weight:700}
.nav{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap;min-width:0}
.nav button{border:0;background:transparent;color:#c7d2fe;font:inherit;font-weight:700;font-size:13px;padding:9px 13px;border-radius:11px;cursor:pointer;display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap;font-family:"Noto Sans TC"}
.nav button .material-symbols-outlined{font-size:19px}
.nav button:hover{background:rgba(255,255,255,.12);color:#fff}
.nav button.on{background:#fff;color:var(--acc);box-shadow:0 5px 14px rgba(0,0,0,.16)}
.nav button.on .material-symbols-outlined{color:var(--acc2)}
.who{display:flex;align-items:center;gap:9px;padding-left:10px;border-left:1px solid rgba(255,255,255,.2);flex:none}
.ava{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--acc);font-weight:900;display:grid;place-items:center;font-size:14px}
.who small{font-size:11px;color:#c7d2fe;display:block}
.who b{font-size:12.5px;color:#fff}

.wrap{max-width:1360px;margin:0 auto;padding:22px 24px 48px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.ph h1{margin:0;font-size:22px;font-family:"Noto Sans TC";font-weight:900;color:var(--ink);display:flex;align-items:center;gap:10px}
.ph h1 .bar{width:5px;height:24px;border-radius:3px;background:linear-gradient(180deg,var(--acc),var(--acc2))}
.ph p{margin:5px 0 0 15px;color:var(--mut);font-size:13px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--acc-l);color:var(--acc);padding:6px 13px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:5px}
.pill.live{background:#dcfce7;color:#166534}
.pill .material-symbols-outlined{font-size:16px}
.pill .live-dot{width:8px;height:8px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 0 rgba(22,163,74,.5);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.5)}70%{box-shadow:0 0 0 7px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}

.view{display:none}
.view.on{display:block;animation:f .28s ease}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--acc),var(--acc2))}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:66px;height:66px;border-radius:50%;background:radial-gradient(circle,rgba(79,70,229,.10),transparent 70%)}
.kpi .l{font-size:12px;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:6px}
.kpi .l .material-symbols-outlined{font-size:17px;color:var(--acc)}
.kpi .v{font-size:27px;font-weight:900;margin-top:6px;color:var(--ink);font-family:Inter}
.kpi .v small{font-size:13px;color:var(--mut);font-weight:700}
.kpi .d{font-size:11.5px;font-weight:800;margin-top:3px}
.up{color:var(--ok)}.dn{color:var(--bad)}

.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:1.5fr 1fr}
.g11{grid-template-columns:1fr 1fr}
.g21{grid-template-columns:1.35fr 1fr}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px 18px;min-width:0}
.card h3{margin:0 0 14px;font-size:14.5px;font-family:"Noto Sans TC";font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--acc);font-size:20px}
.card h3 .grow{margin-left:auto;font-size:12px;font-weight:800;color:var(--acc2);cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px;border-radius:10px;border:0;background:var(--acc);color:#fff;font:inherit;font-weight:800;font-size:13px;cursor:pointer;font-family:"Noto Sans TC"}
.btn .material-symbols-outlined{font-size:18px}

.chart{width:100%;height:270px}

/* legend */
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--body)}
.leg span{display:inline-flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;border-radius:4px;display:inline-block}
.d-vac{background:var(--vac)}.d-occ{background:var(--occ)}.d-clean{background:var(--clean)}.d-fix{background:var(--fix)}.d-out{background:var(--out)}

/* ===== signature 1: 房況圖 樓層×房號 ===== */
.gridwrap{overflow-x:auto;padding-bottom:4px}
.roomgrid{border-collapse:separate;border-spacing:6px;min-width:660px}
.roomgrid th{font-size:11px;font-weight:800;color:var(--mut);padding:2px 4px;text-align:center;white-space:nowrap}
.floorlab{font-size:13px;font-weight:900;color:var(--acc);text-align:right;padding-right:8px;white-space:nowrap}
.room{width:84px;height:58px;border-radius:11px;padding:7px 8px;color:#fff;position:relative;cursor:pointer;transition:.15s;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.room:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.16)}
.room .r-no{font-size:12.5px;font-weight:900}
.room .r-tag{font-size:10.5px;font-weight:700;position:absolute;bottom:6px;left:8px;opacity:.95}
.room .r-ty{font-size:9px;position:absolute;top:8px;right:8px;opacity:.9;font-weight:700}
.r-vac{background:linear-gradient(135deg,#16a34a,#15803d)}
.r-occ{background:linear-gradient(135deg,#4f46e5,#3730a3)}
.r-clean{background:linear-gradient(135deg,#ea9412,#d97706)}
.r-fix{background:linear-gradient(135deg,#dc2626,#b91c1c)}
.r-out{background:linear-gradient(135deg,#94a3b8,#64748b)}

/* ===== signature 2: 訂房看板 pipeline ===== */
.pipe{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:12px;overflow-x:auto;padding-bottom:4px}
.pcol{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:11px;min-width:0}
.pch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.pch b{color:var(--ink);font-size:13px;font-family:"Noto Sans TC"}
.pch .sum{font-size:11px;font-weight:800;color:var(--acc);background:#e0e7ff;border-radius:999px;padding:2px 9px}
.bkg{background:#fff;border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:11px;padding:11px 12px;margin-bottom:9px;box-shadow:0 1px 3px rgba(17,24,39,.05);cursor:pointer;transition:.15s}
.bkg:hover{transform:translateX(3px);box-shadow:0 5px 14px rgba(17,24,39,.1)}
.bkg .lt{display:flex;align-items:center;justify-content:space-between;gap:6px}
.bkg b{color:var(--ink);font-size:13px;font-family:"Noto Sans TC"}
.bkg .need{color:var(--acc2);font-weight:900;font-size:12.5px;margin:5px 0 2px}
.bkg small{color:var(--mut);font-size:11px;display:block}
.bkg .lf{display:flex;align-items:center;gap:6px;margin-top:7px}
.chan{font-size:10px;font-weight:800;border-radius:6px;padding:1px 7px;white-space:nowrap}
.c-ota{background:#e0e7ff;color:#3730a3}.c-web{background:#dcfce7;color:#166534}.c-corp{background:#fef3c7;color:#b45309}.c-walk{background:#fee2e2;color:#b91c1c}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--mut);font-weight:800;padding:11px 12px;border-bottom:2px solid var(--line);background:var(--bg);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:hover td{background:#f8f8fd}
.tblwrap{overflow-x:auto}
.tag{font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px;white-space:nowrap}
.t-ok{background:#dcfce7;color:#166534}.t-wait{background:#fef3c7;color:#92400e}.t-rej{background:#fee2e2;color:#991b1b}.t-info{background:#e0e7ff;color:#3730a3}

/* rows w/ time */
.visit{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.visit:first-of-type{border-top:0}
.vtime{width:60px;flex:none;text-align:center}
.vtime b{display:block;font-size:15px;color:var(--acc);font-weight:900;font-family:Inter}
.vtime small{font-size:10.5px;color:var(--mut)}
.vmid{flex:1;min-width:0}
.vmid b{font-size:13.5px;color:var(--ink);font-family:"Noto Sans TC"}
.vmid small{display:block;color:var(--mut);font-size:11.5px}
.prog{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:6px}
.prog span{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}

.cstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.cs{background:var(--bg);border-radius:12px;padding:13px;text-align:center;border:1px solid var(--line)}
.cs b{display:block;font-size:20px;color:var(--ink);font-weight:900;font-family:Inter}
.cs span{font-size:11px;color:var(--mut)}
.cs.acc b{color:var(--acc2)}

.tl-i{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.tl-i:first-of-type{border-top:0}
.tl-ic{width:32px;height:32px;border-radius:9px;background:var(--acc-l);color:var(--acc);display:grid;place-items:center;flex:none}
.tl-ic .material-symbols-outlined{font-size:18px}
.tl-i b{color:var(--ink);font-size:13px;font-family:"Noto Sans TC"}
.tl-i small{display:block;color:var(--mut);font-size:12px}
.tl-i .when{margin-left:auto;font-size:11px;color:#9aa1ad;white-space:nowrap}

.alert{border-radius:14px;padding:15px 16px;border:1px solid}
.alert h4{margin:0 0 6px;font-size:14px;font-family:"Noto Sans TC";display:flex;align-items:center;gap:7px}
.alert p{margin:0;font-size:12.5px;line-height:1.6}
.a-red{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
.a-amber{background:#fffbeb;border-color:#fde68a;color:#b45309}
.a-navy{background:#eef2ff;border-color:#c7d2fe;color:#3730a3}

.ai-row{display:flex;gap:11px;background:linear-gradient(135deg,#eef2ff,#f5f3ff);border:1px solid #e0e3f5;border-radius:13px;padding:12px 13px;margin-bottom:10px}
.ai-ic{width:32px;height:32px;border-radius:9px;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none}
.ai-ic.g{background:var(--acc2)}
.ai-row p{margin:0;font-size:13px;color:var(--body);line-height:1.55}
.ai-row b{color:var(--ink)}

/* target rows */
.trow{display:grid;grid-template-columns:120px 1fr 130px;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.trow .nm{font-size:13px;font-weight:800;color:var(--ink);font-family:"Noto Sans TC"}
.trow .nm small{display:block;color:var(--mut);font-weight:600;font-size:11px}
.tbar{height:12px;border-radius:999px;background:var(--line);overflow:hidden;position:relative}
.tbar span{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.trow .pct{text-align:right;font-size:14px;font-weight:900;color:var(--acc);font-family:Inter}
.trow .pct small{display:block;font-size:11px;color:var(--mut);font-weight:600}

/* clean board */
.clist{display:flex;flex-direction:column;gap:9px}
.crow{display:flex;align-items:center;gap:11px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.crm{width:52px;flex:none;font-size:15px;font-weight:900;color:var(--acc);font-family:Inter}
.crmid{flex:1;min-width:0}
.crmid b{font-size:13px;color:var(--ink);font-family:"Noto Sans TC"}
.crmid small{display:block;color:var(--mut);font-size:11px}

@media (max-width:900px){
  .kpis{grid-template-columns:1fr 1fr}
  .g2,.g11,.g21{grid-template-columns:1fr !important}
}
@media (max-width:560px){
  .topin{padding:10px 14px}
  .wrap{padding:16px 14px 34px}
  .kpis{grid-template-columns:1fr 1fr}
  .who small{display:none}
  .nav button span:last-child{display:none}
  .nav button{padding:9px}
  .trow{grid-template-columns:92px 1fr 84px}
}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <div class="brand">
      <span class="logo"><span class="material-symbols-outlined">hotel</span></span>
      <div><b>旅宿房況營收台</b><span>HOSPITALITY DESK</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="who"><span class="ava">妍</span><div><b>周映妍</b><small>房務督導 · 沐嵐溫泉行館</small></div></div>
  </div>
</header>

<main class="wrap" id="views"></main>

<script>

];

/* 房價營收 房型 */

/* ===================== HELPERS ===================== */
function av(n){return '<span style="width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc-d));color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;flex:none;">'+n.slice(-1)+'</span>';}

function kpiRow(list){
  return '<div class="kpis">'+list.map(function(k){
    return '<div class="kpi"><div class="l"><span class="material-symbols-outlined">'+k[4]+'</span>'+k[0]+'</div>'
      +'<div class="v">'+k[1]+'<small> '+k[2]+'</small></div>'
      +'<div class="d '+(k[3].charAt(0)==='-'?'dn':'up')+'">'+k[3]+'</div></div>';
  }).join('')+'</div>';
}

function roomGrid(){
  var thead='<tr><th style="text-align:right;padding-right:8px;color:var(--acc);">樓層</th>'+COLS.map(function(c,ci){return '<th>'+c+'<br><span style="font-weight:600;color:#9aa1ad;">'+TYPES[ci].slice(0,2)+'</span></th>';}).join('')+'</tr>';
  var rows=ROOMS.map(function(row,fi){
    var tds=row.map(function(st,ci){
      var no=FLOORS[fi].replace('F','')+COLS[ci];
      return '<td><div class="room r-'+({v:'vac',o:'occ',c:'clean',x:'fix',u:'out'})[st]+'" title="'+no+' · '+TYPES[ci]+' · '+SLABEL[st]+'">'
        +'<div class="r-no">'+no+'</div>'
        +'<div class="r-ty">'+TYPES[ci].slice(0,2)+'</div>'
        +'<div class="r-tag">'+STAGTX[st]+'</div></div></td>';
    }).join('');
    return '<tr><td class="floorlab">'+FLOORS[fi]+'</td>'+tds+'</tr>';
  }).join('');
  return '<div class="gridwrap"><table class="roomgrid"><thead>'+thead+'</thead><tbody>'+rows+'</tbody></table></div>';
}

function pipeline(){
  return '<div class="pipe">'+STAGES.map(function(s){
    var it=BOOKS.filter(function(d){return d[2]===s;});
    return '<div class="pcol"><div class="pch"><b>'+s+'</b><span class="sum">'+it.length+' 筆</span></div>'
      +it.map(function(d){
        return '<div class="bkg"><div class="lt"><b>'+d[0]+'</b><span class="chan c-'+d[4]+'">'+d[5]+'</span></div>'
          +'<div class="need">'+d[1]+'</div><small>入住人數：'+d[3]+'</small>'
          +'<div class="lf">'+av(d[0])+'<small>'+CHAN[d[4]]+'</small></div></div>';
      }).join('')+'</div>';
  }).join('')+'</div>';
}

function legend(){
  return '<div class="leg">'
    +'<span><i class="dot d-vac"></i>空房</span>'
    +'<span><i class="dot d-occ"></i>入住</span>'
    +'<span><i class="dot d-clean"></i>清潔</span>'
    +'<span><i class="dot d-fix"></i>維修</span>'

}

var nav=document.getElementById('nav'), views=document.getElementById('views');
nav.innerHTML=NAV.map(function(m,i){return '<button data-i="'+i+'" class="'+(i===0?'on':'')+'"><span class="material-symbols-outlined">'+m[0]+'</span><span>'+m[1]+'</span></button>';}).join('');

views.innerHTML=NAV.map(function(m,i){
  return '<section class="view'+(i===0?' on':'')+'" data-view="'+i+'">'
    +'<div class="ph"><div><h1><span class="bar"></span>'+NAMES[i]+'</h1><p>'+DESC[i]+'</p></div>'
    +'<div class="pills"><span class="pill live"><span class="live-dot"></span>即時房況</span><span class="pill"><span class="material-symbols-outlined">calendar_month</span>2026/08/13</span></div></div>'
    +'<div class="vbody"></div></section>';
}).join('');
var vbodies=views.querySelectorAll('.vbody');
var built=[];

function show(i){
  nav.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',+b.dataset.i===i);});
  views.querySelectorAll('.view').forEach(function(v){v.classList.toggle('on',+v.dataset.view===i);});
  if(!built[i]){ vbodies[i].innerHTML=SCREENS[i](); built[i]=true; }
  draw(i);
}
nav.addEventListener('click',function(e){var b=e.target.closest('button[data-i]');if(b)show(+b.dataset.i);});
window.addEventListener('resize',function(){charts.forEach(function(c){try{c.resize();}catch(e){}});});
show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m)return;var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
