<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>旅宿房況營收台 · Hospitality Room & Revenue</title>
<meta name="description" content="從房況圖、OTA/直訂訂房、入住退房到房價營收與清潔排房的旅宿營運台（純 UI 展示）。"/>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@300;400;500;600;700&family=Playfair+Display+SC:wght@400;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#1e3a8a;
  --color-on-primary:#fff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000;
  --color-accent:#a16207;
  --color-on-accent:#fff;
  --color-background:#f8fafc;
  --color-foreground:#1e40af;
  --color-card:#fff;
  --color-card-foreground:#1e40af;
  --color-muted:#e9eef5;
  --color-muted-foreground:#475569;
  --color-border:#bfdbfe;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#1e3a8a;

  --blue:#1e3a8a;
  --ink:#172033;
  --muted:#475569;
  --line:#bfdbfe;

  --acc:var(--color-primary);
  --acc2:var(--color-secondary);
  --acc-d:#10245e;
  --acc-l:#eff6ff;
  --body:#334155;
  --mut:var(--muted);
  --bg:var(--color-background);
  --card:var(--color-card);
  --vac:#15803d;
  --occ:#1e40af;
  --clean:#a16207;
  --fix:#b91c1c;
  --out:#64748b;
  --ok:#15803d;
  --warn:#92400e;
  --bad:#b91c1c;
  --shadow:0 8px 24px rgba(30,58,138,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  font-family:Karla,"Microsoft JhengHei",sans-serif;
  background:
    linear-gradient(rgba(30,58,138,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(30,58,138,.025) 1px,transparent 1px),
    var(--bg);
  background-size:32px 32px;
  color:var(--body);
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,a,[role="button"],.room,.bkg,.grow{cursor:pointer}
button,input,select,textarea{font:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--color-ring);
  outline-offset:3px;
}
.material-symbols-outlined{
  font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
  font-size:19px;
  line-height:1;
  vertical-align:middle;
}
.top{
  position:sticky;
  top:0;
  z-index:30;
  color:#fff;
  background:rgba(255,255,255,.97);
  border-bottom:1px solid var(--line);
  box-shadow:0 3px 14px rgba(30,58,138,.08);
  backdrop-filter:blur(14px);
}
.topin{
  width:min(100%,1440px);
  min-height:72px;
  margin:auto;
  padding:10px 28px;
  display:flex;
  align-items:center;
  gap:22px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:224px}
.logo{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  flex:none;
  color:#fff;
  background:var(--acc);
  border:1px solid var(--acc);
  border-radius:4px;
  box-shadow:4px 4px 0 #dbeafe;
}
.logo .material-symbols-outlined{font-size:23px}
.brand b{
  display:block;
  color:var(--ink);
  font-family:"Playfair Display SC","Microsoft JhengHei",serif;
  font-size:16px;
  font-weight:700;
  letter-spacing:.04em;
}
.brand div>span{
  display:block;
  margin-top:1px;
  color:var(--mut);
  font-size:10px;
  font-weight:700;
  letter-spacing:.16em;
}
.nav{
  display:flex;
  align-items:center;
  gap:2px;
  min-width:0;
  margin-left:auto;
}
.nav button{
  min-height:42px;
  padding:8px 10px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:0;
  border-bottom:2px solid transparent;
  border-radius:2px;
  background:transparent;
  color:#475569;
  font-weight:700;
  font-size:12px;
  white-space:nowrap;
  transition:background-color .2s ease,color .2s ease,border-color .2s ease;
}
.nav button:hover{background:#eff6ff;color:var(--acc)}
.nav button.on{
  color:var(--acc);
  border-bottom-color:var(--color-accent);
  background:#eff6ff;
}
.nav button.on .material-symbols-outlined{font-variation-settings:'FILL' 1}
.who{
  min-width:190px;
  padding-left:18px;
  display:flex;
  align-items:center;
  gap:9px;
  border-left:1px solid var(--line);
}
.ava{
  width:36px;
  height:36px;
  display:grid;
  place-items:center;
  flex:none;
  border-radius:50%;
  background:#e0e7ff;
  color:var(--acc);
  font-weight:700;
  border:1px solid #93c5fd;
}
.who b{display:block;color:var(--ink);font-size:12px}
.who small{display:block;color:var(--mut);font-size:10px}
.wrap{width:min(100%,1440px);margin:auto;padding:26px 28px 52px}
.ph{
  min-height:62px;
  margin-bottom:18px;
  padding-bottom:16px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;
  border-bottom:1px solid var(--line);
}
.ph h1{
  margin:0;
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--ink);
  font-family:"Playfair Display SC","Microsoft JhengHei",serif;
  font-size:24px;
  line-height:1.2;
  letter-spacing:.02em;
}
.ph h1 .bar{width:24px;height:3px;background:var(--color-accent)}
.ph p{margin:6px 0 0 34px;color:var(--mut);font-size:13px}
.pills{display:flex;gap:7px;flex-wrap:wrap}
.pill{
  min-height:30px;
  padding:5px 10px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:1px solid var(--line);
  border-radius:3px;
  background:#fff;
  color:#334155;
  font-size:11px;
  font-weight:700;
}
.pill.live{border-color:#86efac;background:#f0fdf4;color:#166534}
.live-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#15803d;
  box-shadow:0 0 0 3px #dcfce7;
}
.view{display:none}
.view.on{display:block;animation:reveal .35s ease both}
@keyframes reveal{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:none}
}
.kpis{
  margin-bottom:16px;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
}
.kpi{
  min-height:116px;
  padding:15px 16px 14px;
  position:relative;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:4px;
  background:#fff;
  box-shadow:var(--shadow);
  transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
}
.kpi:hover{
  transform:translateY(-2px);
  border-color:#60a5fa;
  box-shadow:0 12px 28px rgba(30,58,138,.11);
}
.kpi:before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:3px;
  background:var(--acc);
}
.kpi .l{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--mut);
  font-size:11px;
  font-weight:700;
  letter-spacing:.02em;
}
.kpi .l .material-symbols-outlined{color:var(--acc);font-size:17px}
.kpi .v{
  margin-top:8px;
  color:var(--ink);
  font-size:28px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  line-height:1;
}
.kpi .v small{font-size:12px;color:var(--mut);font-weight:600}
.kpi .d{margin-top:8px;font-size:11px;font-weight:700}
.up{color:#166534}.dn{color:#991b1b}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
.g2{grid-template-columns:1.5fr 1fr}
.g11{grid-template-columns:1fr 1fr}
.g21{grid-template-columns:1.35fr 1fr}
.card{
  min-width:0;
  padding:16px 17px;
  border:1px solid var(--line);
  border-radius:4px;
  background:#fff;
  box-shadow:var(--shadow);
}
.card h3{
  margin:0 0 14px;
  min-height:25px;
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  color:var(--ink);
  font-size:14px;
  font-weight:700;
  letter-spacing:.01em;
}
.card h3>.material-symbols-outlined{
  width:28px;
  height:28px;
  display:grid;
  place-items:center;
  color:var(--acc);
  background:#eff6ff;
  border:1px solid #dbeafe;
  border-radius:3px;
}
.grow{
  margin-left:auto;
  color:var(--acc);
  font-size:11px;
  font-weight:700;
  transition:color .2s ease;
}
.grow:hover{color:var(--color-accent);text-decoration:underline}
.btn{
  min-height:40px;
  padding:0 15px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  border:1px solid var(--color-accent);
  border-radius:3px;
  background:var(--color-accent);
  color:#fff;
  font-weight:700;
  font-size:13px;
  transition:background-color .2s ease,transform .2s ease;
}
.btn:hover{background:#854d0e;transform:translateY(-1px)}
.chart{width:100%;height:270px}
.leg{display:flex;gap:15px;flex-wrap:wrap;color:#334155;font-size:11px;font-weight:700}
.leg span{display:inline-flex;align-items:center;gap:6px}
.dot{
  width:10px;
  height:10px;
  display:inline-block;
  border-radius:2px;
  border:1px solid rgba(15,23,42,.18);
}
.d-vac{background:var(--vac)}.d-occ{background:var(--occ)}
.d-clean{background:var(--clean)}.d-fix{background:var(--fix)}.d-out{background:var(--out)}
.gridwrap,.tblwrap{overflow-x:auto;scrollbar-color:#93c5fd #eff6ff}
.roomgrid{min-width:690px;border-collapse:separate;border-spacing:6px}
.roomgrid th{
  padding:3px 4px;
  color:var(--mut);
  font-size:10px;
  font-weight:700;
  text-align:center;
  white-space:nowrap;
}
.floorlab{
  padding-right:8px;
  color:var(--acc);
  font-size:12px;
  font-weight:700;
  text-align:right;
  white-space:nowrap;
}
.room{
  width:86px;
  height:60px;
  padding:7px 8px;
  position:relative;
  border-radius:3px;
  color:#fff;
  border:1px solid rgba(255,255,255,.35);
  box-shadow:0 3px 8px rgba(15,23,42,.09);
  transition:transform .2s ease,box-shadow .2s ease;
}
.room:hover,.room:focus-visible{
  transform:translateY(-2px);
  box-shadow:0 8px 18px rgba(15,23,42,.18);
}
.room .r-no{
  font:700 12px ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:.03em;
}
.room .r-tag{position:absolute;left:8px;bottom:6px;font-size:10px;font-weight:700}
.room .r-ty{position:absolute;right:8px;top:8px;font-size:9px;font-weight:700}
.r-vac{background:#15803d}.r-occ{background:#1e40af}
.r-clean{background:#a16207}.r-fix{background:#b91c1c}.r-out{background:#64748b}
.pipe{
  padding-bottom:5px;
  display:grid;
  grid-auto-flow:column;
  grid-auto-columns:minmax(230px,1fr);
  gap:10px;
  overflow-x:auto;
}
.pcol{
  min-width:0;
  padding:10px;
  border:1px solid var(--line);
  border-radius:4px;
  background:#f8fafc;
}
.pch{margin-bottom:9px;display:flex;align-items:center;justify-content:space-between}
.pch b{color:var(--ink);font-size:12px}
.pch .sum{
  padding:2px 7px;
  border:1px solid #bfdbfe;
  border-radius:2px;
  background:#eff6ff;
  color:var(--acc);
  font-size:10px;
  font-weight:700;
}
.bkg{
  margin-bottom:8px;
  padding:10px;
  border:1px solid #dbeafe;
  border-left:3px solid var(--acc);
  border-radius:3px;
  background:#fff;
  box-shadow:0 2px 6px rgba(30,58,138,.05);
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.bkg:hover{
  transform:translateX(2px);
  border-color:#60a5fa;
  box-shadow:0 7px 16px rgba(30,58,138,.1);
}
.bkg .lt{display:flex;align-items:center;justify-content:space-between;gap:7px}
.bkg b{color:var(--ink);font-size:12px}
.bkg .need{margin:5px 0 2px;color:var(--acc);font-size:12px;font-weight:700}
.bkg small{display:block;color:var(--mut);font-size:10px}
.bkg .lf{margin-top:7px;display:flex;align-items:center;gap:6px}
.chan,.tag{
  padding:2px 7px;
  display:inline-flex;
  align-items:center;
  border:1px solid transparent;
  border-radius:2px;
  font-size:10px;
  font-weight:700;
  line-height:1.35;
  white-space:nowrap;
}
.c-ota,.t-info{background:#eff6ff;border-color:#93c5fd;color:#1e3a8a}
.c-web,.t-ok{background:#f0fdf4;border-color:#86efac;color:#166534}
.c-corp,.t-wait{background:#fffbeb;border-color:#fcd34d;color:#854d0e}
.c-walk,.t-rej{background:#fef2f2;border-color:#fca5a5;color:#991b1b}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{
  padding:9px 10px;
  border-top:1px solid var(--line);
  border-bottom:2px solid var(--acc);
  background:#eff6ff;
  color:#334155;
  font-size:10px;
  font-weight:700;
  letter-spacing:.04em;
  text-align:left;
  white-space:nowrap;
}
.tbl td{
  padding:10px;
  border-bottom:1px solid #dbeafe;
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.tbl tbody tr:nth-child(even) td{background:#fbfdff}
.tbl tbody tr:hover td{background:#eff6ff}
.tbl td:nth-last-child(-n+3){text-align:right}
.tbl th:nth-last-child(-n+3){text-align:right}
.tbl td:first-child{font-variant-numeric:tabular-nums}
.visit{
  padding:11px 0;
  display:flex;
  align-items:center;
  gap:12px;
  border-top:1px solid #dbeafe;
}
.visit:first-of-type{border-top:0}
.vtime{width:60px;flex:none;text-align:center}
.vtime b{
  display:block;
  color:var(--acc);
  font:700 14px ui-monospace,SFMono-Regular,Consolas,monospace;
}
.vtime small,.vmid small{color:var(--mut);font-size:10px}
.vmid{min-width:0;flex:1}
.vmid b{color:var(--ink);font-size:12px}
.vmid small{display:block}
.prog,.tbar{
  overflow:hidden;
  background:#dbeafe;
  border-radius:2px;
}
.prog{height:5px;margin-top:6px}
.prog span,.tbar span{display:block;height:100%;background:var(--acc)}
.cstat{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
  gap:9px;
}
.cs{
  padding:12px;
  border:1px solid var(--line);
  border-radius:3px;
  background:#f8fafc;
  text-align:center;
}
.cs b{display:block;color:var(--ink);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.cs span{color:var(--mut);font-size:10px}
.cs.acc b{color:var(--acc)}
.tl-i{
  padding:10px 0;
  display:flex;
  gap:10px;
  border-top:1px solid #dbeafe;
}
.tl-i:first-of-type{border-top:0}
.tl-ic{
  width:30px;
  height:30px;
  display:grid;
  place-items:center;
  flex:none;
  border:1px solid #bfdbfe;
  border-radius:3px;
  background:#eff6ff;
  color:var(--acc);
}
.tl-ic .material-symbols-outlined{font-size:17px}
.tl-i b{color:var(--ink);font-size:12px}
.tl-i small{display:block;color:var(--mut);font-size:10px}
.alert{
  padding:13px 14px;
  border:1px solid;
  border-left-width:4px;
  border-radius:3px;
}
.alert h4{
  margin:0 0 5px;
  display:flex;
  align-items:center;
  gap:6px;
  font-size:13px;
}
.alert p{margin:0;font-size:11px;line-height:1.6}
.a-red{background:#fef2f2;border-color:#dc2626;color:#7f1d1d}
.a-amber{background:#fffbeb;border-color:#a16207;color:#713f12}
.a-navy{background:#eff6ff;border-color:#1e3a8a;color:#172554}
.ai-row{
  margin-bottom:9px;
  padding:11px 12px;
  display:flex;
  gap:10px;
  border:1px solid #bfdbfe;
  border-radius:3px;
  background:#f8fafc;
}
.ai-ic{
  width:30px;
  height:30px;
  display:grid;
  place-items:center;
  flex:none;
  border-radius:3px;
  background:var(--acc);
  color:#fff;
}
.ai-ic.g{background:var(--color-accent)}
.ai-row p{margin:0;color:#334155;font-size:12px;line-height:1.55}
.ai-row b{color:var(--ink)}
.trow{
  padding:11px 0;
  display:grid;
  grid-template-columns:115px 1fr 130px;
  align-items:center;
  gap:11px;
  border-top:1px solid #dbeafe;
}
.trow:first-of-type{border-top:0}
.trow .nm{color:var(--ink);font-size:12px;font-weight:700}
.trow .nm small{display:block;color:var(--mut);font-size:10px;font-weight:500}
.tbar{height:10px}
.trow .pct{
  color:var(--acc);
  font-size:13px;
  font-weight:700;
  text-align:right;
  font-variant-numeric:tabular-nums;
}
.trow .pct small{display:block;color:var(--mut);font-size:10px;font-weight:500}
.clist{display:flex;flex-direction:column;gap:7px}
.crow{
  padding:9px 11px;
  display:flex;
  align-items:center;
  gap:10px;
  border:1px solid #dbeafe;
  border-radius:3px;
  background:#f8fafc;
}
.crm{
  width:50px;
  flex:none;
  color:var(--acc);
  font:700 14px ui-monospace,SFMono-Regular,Consolas,monospace;
}
.crmid{min-width:0;flex:1}
.crmid b{color:var(--ink);font-size:12px}
.crmid small{display:block;color:var(--mut);font-size:10px}
@media(max-width:1120px){
  .topin{align-items:flex-start;flex-wrap:wrap}
  .brand{min-width:0}.nav{order:3;width:100%;overflow-x:auto}
  .who{margin-left:auto}
}
@media(max-width:900px){
  .kpis{grid-template-columns:1fr 1fr}
  .g2,.g11,.g21{grid-template-columns:1fr!important}
}
@media(max-width:600px){
  .topin{padding:9px 14px;gap:10px}
  .brand div>span{display:none}
  .who{min-width:0;padding-left:10px}
  .who div{display:none}
  .nav button{min-height:44px;padding:8px 11px}
  .nav button span:last-child{display:none}
  .wrap{padding:18px 14px 34px}
  .ph{align-items:flex-start}
  .ph h1{font-size:21px}
  .ph p{margin-left:0}
  .pills{width:100%}
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .kpi{min-height:108px;padding:13px}
  .kpi .v{font-size:23px}
  .card{padding:14px 12px}
  .trow{grid-template-columns:86px 1fr 84px}
}
@media(max-width:390px){
  .kpis{grid-template-columns:1fr}
  .ph h1{font-size:19px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  .view.on{animation:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <div class="brand">
      <span class="logo" aria-hidden="true"><span class="material-symbols-outlined">hotel</span></span>
      <div><b>旅宿房況營收台</b><span>HOSPITALITY DESK</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="主要功能"></nav>
    <div class="who">
      <span class="ava" aria-hidden="true">妍</span>
      <div><b>周映妍</b><small>房務督導 · 沐嵐溫泉行館</small></div>
    </div>
  </div>
</header>

function av(n){
  return '<span style="width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;flex:none">'+n.slice(-1)+'</span>';
}
function kpiRow(list){
  return '<div class="kpis">'+list.map(function(k){
    var delta=k[3],neutral=/待|領先|含|\/|告急|阿美/.test(delta);
    return '<article class="kpi"><div class="l"><span class="material-symbols-outlined" aria-hidden="true">'+k[4]+'</span>'+k[0]+'</div>'+
      '<div class="v">'+k[1]+'<small> '+k[2]+'</small></div>'+
      '<div class="d '+(neutral?'':delta.charAt(0)==="-"?"dn":"up")+'">'+delta+'</div></article>';
  }).join("")+'</div>';
}
function roomGrid(){
  var thead='<tr><th style="text-align:right;padding-right:8px;color:var(--acc)">樓層</th>'+
    COLS.map(function(c,ci){
      return '<th>'+c+'<br><span style="font-weight:500;color:#64748b">'+TYPES[ci].slice(0,2)+'</span></th>';
    }).join("")+'</tr>';
  var rows=ROOMS.map(function(row,fi){
    return '<tr><td class="floorlab">'+FLOORS[fi]+'</td>'+row.map(function(st,ci){
      var no=FLOORS[fi].replace("F","")+COLS[ci];
      return '<td><div class="room r-'+({v:"vac",o:"occ",c:"clean",x:"fix",u:"out"})[st]+
        '" tabindex="0" role="button" aria-label="'+no+'，'+TYPES[ci]+'，'+SLABEL[st]+'">'+
        '<div class="r-no">'+no+'</div><div class="r-ty">'+TYPES[ci].slice(0,2)+'</div>'+
        '<div class="r-tag">'+STAGTX[st]+'</div></div></td>';
    }).join("")+'</tr>';
  }).join("");
  return '<div class="gridwrap"><table class="roomgrid"><thead>'+thead+'</thead><tbody>'+rows+'</tbody></table></div>';
}
function pipeline(){

    return '<section class="pcol"><div class="pch"><b>'+s+'</b><span class="sum">'+it.length+' 筆</span></div>'+

          '<div class="lf">'+av(d[0])+'<small>'+CHAN[d[4]]+'</small></div></article>';
      }).join("")+'</section>';
  }).join("")+'</div>';
}

}).join("");
views.innerHTML=NAV.map(function(m,i){
  return '<section class="view'+(i===0?" on":"")+'" data-view="'+i+'" aria-labelledby="view-title-'+i+'">'+
    '<div class="ph"><div><h1 id="view-title-'+i+'"><span class="bar"></span>'+NAMES[i]+'</h1><p>'+DESC[i]+'</p></div>'+
    '<div class="pills"><span class="pill live"><span class="live-dot" aria-hidden="true"></span>即時房況</span>'+
    '<span class="pill"><span class="material-symbols-outlined" aria-hidden="true">calendar_month</span>2026/08/13</span></div></div>'+
    '<div class="vbody"></div></section>';
}).join("");
var vbodies=views.querySelectorAll(".vbody"),built=[];
function show(i){
  nav.querySelectorAll("button").forEach(function(b){
    var active=+b.dataset.i===i;
    b.classList.toggle("on",active);
    b.setAttribute("aria-current",active?"page":"false");
  });
  views.querySelectorAll(".view").forEach(function(v){v.classList.toggle("on",+v.dataset.view===i)});
  if(!built[i]){vbodies[i].innerHTML=SCREENS[i]();built[i]=true}
  draw(i);
}
nav.addEventListener("click",function(e){
  var b=e.target.closest("button[data-i]");
  if(!b)return;
  var i=+b.dataset.i;
  if(location.hash!=="#v"+i)location.hash="v"+i;
  else show(i);
});
nav.addEventListener("keydown",function(e){
  if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight")return;
  var buttons=[].slice.call(nav.querySelectorAll("button")),current=buttons.indexOf(document.activeElement);
  if(current<0)return;
  e.preventDefault();
  var next=(current+(e.key==="ArrowRight"?1:-1)+buttons.length)%buttons.length;
  buttons[next].focus();
  buttons[next].click();
});
window.addEventListener("resize",function(){
  charts.forEach(function(c){try{c.resize()}catch(e){}});
});
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  var i=m?Math.min(+m[1],NAV.length-1):0;
  show(i);
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
fromHash();
