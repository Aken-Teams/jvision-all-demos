<style>
:root{
  --color-primary:#059669;
  --color-on-primary:#000;
  --color-secondary:#10b981;
  --color-on-secondary:#0f172a;
  --color-accent:#059669;
  --color-on-accent:#000;
  --color-background:#ecfdf5;
  --color-foreground:#064e3b;
  --color-card:#fff;
  --color-card-foreground:#064e3b;
  --color-muted:#e8f1f3;
  --color-muted-foreground:#475569;
  --color-border:#a7f3d0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#059669;
  --blue:#059669;
  --ink:#064e3b;
  --muted:#475569;
  --line:#86d8b8;
  --good:#047857;
  --warn:#92400e;
  --bad:#b91c1c;
  --info:#075985;
  --shadow:6px 6px 0 #064e3b;
}
*{box-sizing:border-box;min-width:0}
html{background:var(--color-background);color:var(--ink);font-family:"Fira Sans",sans-serif}
body{margin:0;overflow-x:hidden;background-image:linear-gradient(rgba(5,150,105,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(5,150,105,.08) 1px,transparent 1px);background-size:32px 32px}
button,a{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible{outline:4px solid var(--color-ring);outline-offset:3px}
svg{display:block}
.icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter;flex:none}
.topbar{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:auto 1fr auto;background:#fff;border-bottom:3px solid var(--ink)}
.brand{display:flex;align-items:center;gap:12px;padding:12px 18px;border-right:3px solid var(--ink)}
.logo{display:grid;place-items:center;width:42px;height:42px;color:#000;background:var(--color-primary);border:3px solid var(--ink)}
.brand strong{display:block;font-size:17px;font-weight:700}
.brand small{display:block;margin-top:2px;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px;letter-spacing:.06em}
.nav{display:flex;align-items:stretch;overflow-x:auto}
.nav button{display:flex;align-items:center;gap:7px;padding:10px 13px;color:var(--ink);white-space:nowrap;background:#fff;border:0;border-right:2px solid var(--ink);font-size:13px;font-weight:600}
.nav button:hover{background:var(--color-border)}
.nav button.on{color:#000;background:var(--color-primary);box-shadow:inset 0 -5px 0 var(--ink)}
.topmeta{display:flex;align-items:center;gap:8px;padding:12px 16px;border-left:3px solid var(--ink);font-family:"Fira Code",monospace;font-size:11px;white-space:nowrap}
.signal{width:12px;height:12px;background:var(--good);border:2px solid var(--ink)}
.wrap{max-width:1440px;margin:auto;padding:24px 20px 64px}
.head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:20px;margin-bottom:22px;padding:22px;background:var(--ink);color:#fff;border:3px solid var(--ink);box-shadow:8px 8px 0 var(--color-secondary)}
.eyebrow{margin:0 0 8px;color:#a7f3d0;font-family:"Fira Code",monospace;font-size:11px;font-weight:700;letter-spacing:.12em}
.head h1{margin:0;font-size:clamp(25px,4vw,46px);font-weight:700;line-height:1}
.head p{max-width:720px;margin:11px 0 0;color:#d1fae5;font-size:14px;line-height:1.6}
.headmeta{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.pill,.tag{display:inline-flex;align-items:center;gap:6px;border:2px solid currentColor;font-family:"Fira Code",monospace;font-size:11px;font-weight:700}
.pill{padding:7px 9px;color:#fff;background:#064e3b}
.tag{padding:4px 7px;background:#fff}
.grid{display:grid;gap:15px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(300px,1fr)}
.g32{grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr)}
.mt{margin-top:15px}
.card,.kpi,.statbox,.report-card,.col{background:var(--color-card);border:3px solid var(--ink)}
.card{padding:17px}
.card.pad0{padding:0;overflow:hidden}
.cardhead{padding:17px 17px 7px}
.ctitle{display:flex;align-items:center;gap:8px;margin:0 0 4px;font-size:14px;font-weight:700;text-transform:uppercase}
.ctitle:before{content:"";width:12px;height:12px;background:var(--color-primary);border:2px solid var(--ink)}
.csub{margin:0 0 14px;color:var(--muted);font-size:12px;line-height:1.5}
.kpi{position:relative;padding:15px;overflow:hidden}
.kpi:nth-child(2n){transform:translateY(7px)}
.kpi:before{content:attr(data-n);position:absolute;top:8px;right:10px;color:#b5e5d1;font-family:"Fira Code",monospace;font-size:32px;font-weight:700}
.kpi .lab,.statbox .lab{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.kpi .val{margin-top:9px;font-family:"Fira Code",monospace;font-size:clamp(22px,3vw,31px);font-weight:700}
.kpi .val small,.statbox small{font-size:11px;color:var(--muted)}
.delta{display:inline-flex;align-items:center;gap:5px;margin-top:7px;padding:3px 5px;border:1px solid currentColor;font-family:"Fira Code",monospace;font-size:10px;font-weight:700}
.statbox{padding:14px}
.statbox .val{margin-top:7px;font-family:"Fira Code",monospace;font-size:21px;font-weight:700}
.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.info{color:var(--info)}
.t-good{color:var(--good);background:#d1fae5}
.t-warn{color:var(--warn);background:#fef3c7}
.t-bad{color:var(--bad);background:#fee2e2}
.t-info{color:var(--info);background:#e0f2fe}
.t-mut{color:var(--muted);background:var(--color-muted)}
.t-acc{color:var(--ink);background:#a7f3d0}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:11px 12px;color:#fff;background:var(--ink);border:1px solid #fff;text-align:left;white-space:nowrap;font-family:"Fira Code",monospace;font-size:10px;letter-spacing:.04em}
td{padding:11px 12px;border:1px solid var(--line);white-space:nowrap}
tbody tr:nth-child(even){background:#f0fdf7}
tbody tr:hover{background:#d1fae5}
.num{text-align:right;font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.mono{font-family:"Fira Code",monospace;font-variant-numeric:tabular-nums}
.bar{height:11px;background:var(--color-muted);border:2px solid var(--ink)}
.bar i{display:block;height:100%;background:var(--color-primary)}
.board{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:12px;min-width:900px}
.col{padding:10px;background:#ecfdf5}
.colh{display:flex;justify-content:space-between;gap:8px;padding:5px 3px 10px;border-bottom:3px solid var(--ink);font-size:12px;font-weight:700}
.cnt{padding:1px 6px;color:#000;background:var(--color-secondary);border:2px solid var(--ink);font-family:"Fira Code",monospace}
.ticket{margin-top:9px;padding:10px;background:#fff;border:2px solid var(--ink);border-left:7px solid var(--color-primary)}
.ticket b{font-size:13px}
.ticket p{margin:5px 0;color:var(--muted);font-size:11px;line-height:1.5}
.ticketfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px}
.mx th,.mx td{text-align:center}
.mx th:first-child,.mx td:first-child{text-align:left}
.cell{display:inline-flex;align-items:center;justify-content:center;width:31px;height:31px;border:2px solid currentColor;font-family:"Fira Code",monospace;font-weight:700}
.c-ok{color:var(--good);background:#d1fae5}
.c-no{color:var(--bad);background:#fee2e2}
.c-wait{color:var(--warn);background:#fef3c7}
.c-na{color:var(--muted);background:#e8f1f3}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:13px;color:var(--muted);font-size:11px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border:2px solid var(--ink)}
.todo{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:11px 0;border-bottom:2px solid var(--line)}
.avatar{display:grid;place-items:center;width:32px;height:32px;color:#000;background:var(--color-primary);border:2px solid var(--ink);font-family:"Fira Code",monospace;font-weight:700}
.todo p{margin:4px 0 0;color:var(--muted);font-size:11px}
.timeline{border-left:4px solid var(--ink);margin-left:8px;padding-left:20px}
.event{position:relative;padding:0 0 19px}
.event:before{content:"";position:absolute;left:-30px;top:2px;width:14px;height:14px;background:#fff;border:4px solid var(--color-primary)}
.event.pass:before{background:var(--color-primary)}
.event.reject:before{background:var(--color-destructive);border-color:var(--ink)}
.event h4{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0;font-size:13px}
.event .time{margin:4px 0;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px}
.event p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}
.report-card{padding:14px}
.report-card:nth-child(odd){box-shadow:5px 5px 0 var(--color-secondary)}
.reporttop{display:flex;align-items:start;justify-content:space-between;gap:8px}
.report-card h3{margin:0;font-size:14px}
.report-card p{margin:3px 0 12px;color:var(--muted);font-size:11px}
.progressmeta{display:flex;justify-content:space-between;margin-top:7px;color:var(--muted);font-family:"Fira Code",monospace;font-size:10px}
.note{display:flex;gap:10px;padding:12px 14px;color:var(--ink);background:#d1fae5;border:3px solid var(--ink);font-size:12px;line-height:1.6}
.note:before{content:"!";display:grid;place-items:center;flex:none;width:22px;height:22px;color:#000;background:var(--color-secondary);border:2px solid var(--ink);font-family:"Fira Code",monospace;font-weight:700}
.chart{min-height:280px}
.actions{display:grid;gap:8px;margin-top:13px}
.action{display:flex;align-items:center;gap:8px;padding:9px;border:2px solid var(--ink);background:#ecfdf5;font-size:12px;font-weight:600}
@keyframes enter{from{opacity:0;transform:scale(.94) translateY(16px)}to{opacity:1;transform:none}}
.grid-item,.card,.kpi,.statbox,.report-card,.col{animation:enter .4s both}
.grid-item:nth-child(2),.kpi:nth-child(2),.report-card:nth-child(2){animation-delay:.06s}
.grid-item:nth-child(3),.kpi:nth-child(3),.report-card:nth-child(3){animation-delay:.12s}
.grid-item:nth-child(4),.kpi:nth-child(4),.report-card:nth-child(4){animation-delay:.18s}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;scroll-behavior:auto!important}
}
@media(max-width:1100px){
  .topbar{grid-template-columns:auto 1fr}
  .topmeta{display:none}
  .g4{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:768px){
  .topbar{display:block;position:relative}
  .brand{border-right:0;border-bottom:3px solid var(--ink)}
  .nav button{min-height:48px}
  .head{grid-template-columns:1fr}
  .headmeta{justify-content:flex-start}
  .g23,.g32,.g3,.g2{grid-template-columns:1fr}
}
@media(max-width:480px){
  .wrap{padding:15px 10px 48px}
  .brand small{font-size:9px}
  .nav .label{display:none}
  .nav button{flex:1;justify-content:center;padding:10px}
  .head{padding:17px;box-shadow:5px 5px 0 var(--color-secondary)}
  .g4{grid-template-columns:1fr}
  .kpi:nth-child(2n){transform:none}
}
</style>
</head>
