<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>供應鏈碳數據站 · Supplier Carbon Data Terminal</title>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#7c3aed;--accent2:#a78bfa;--bg:#0e0b1a;--panel:#171226;--panel2:#1f1833;
  --line:#2c2440;--txt:#ece9f6;--muted:#9a92b8;--good:#34d399;--warn:#fbbf24;--bad:#f87171;--info:#60a5fa;
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html,body{background:var(--bg);color:var(--txt);font-family:"Inter","Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle}
a{color:inherit;text-decoration:none}

.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(90deg,#130f22,#1a1330);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;flex:none}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;box-shadow:0 4px 16px rgba(124,58,237,.5)}
.brand .logo .material-symbols-outlined{font-size:23px}
.brand b{font-size:16px;font-weight:800;letter-spacing:.3px}
.brand span{display:block;font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.5px}
.nav{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 auto;min-width:0}
.nav button{flex:none;white-space:nowrap;display:flex;align-items:center;gap:7px;background:transparent;border:1px solid transparent;color:var(--muted);padding:8px 13px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;transition:.15s}
.nav button .material-symbols-outlined{font-size:19px}
.nav button:hover{background:var(--panel2);color:var(--txt)}
.nav button.on{background:linear-gradient(135deg,var(--accent),#6d28d9);color:#fff;border-color:var(--accent2);box-shadow:0 3px 12px rgba(124,58,237,.4)}
.topmeta{display:flex;align-items:center;gap:14px;flex:none;color:var(--muted);font-size:12px}
.topmeta .dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(52,211,153,.2);display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.wrap{max-width:1360px;margin:0 auto;padding:22px 18px 60px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-size:22px;font-weight:800;font-family:"Noto Sans TC";display:flex;align-items:center;gap:10px}
.head h1 .material-symbols-outlined{color:var(--accent2);font-size:26px}
.head p{color:var(--muted);font-size:13px;margin-top:5px;max-width:640px;line-height:1.6}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-size:12px;color:var(--muted);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.pill .material-symbols-outlined{font-size:16px;color:var(--accent2)}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.6fr 1fr}
@media(max-width:820px){.g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.card.pad0{padding:0;overflow:hidden}
.ctitle{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--txt);margin-bottom:2px}
.ctitle .material-symbols-outlined{font-size:18px;color:var(--accent2)}
.csub{font-size:11.5px;color:var(--muted);margin-bottom:12px}

.kpi{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:15px 16px;position:relative;overflow:hidden}
.kpi .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;margin-bottom:11px}
.kpi .ic .material-symbols-outlined{font-size:20px;color:#fff}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:600}
.kpi .val{font-size:26px;font-weight:800;margin-top:3px;letter-spacing:.5px}
.kpi .val small{font-size:13px;color:var(--muted);font-weight:600}
.kpi .delta{font-size:11.5px;font-weight:700;margin-top:6px;display:inline-flex;align-items:center;gap:3px}
.kpi .delta .material-symbols-outlined{font-size:15px}
.up{color:var(--good)}.down{color:var(--bad)}.flat{color:var(--muted)}
.kpi .spark{position:absolute;right:-6px;bottom:-6px;opacity:.13;font-size:78px;color:var(--accent2)}

table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel2);white-space:nowrap}
tbody td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(124,58,237,.06)}
.num{font-variant-numeric:tabular-nums;text-align:right}

.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700}
.tag .material-symbols-outlined{font-size:14px}
.t-good{background:rgba(52,211,153,.14);color:var(--good)}
.t-warn{background:rgba(251,191,36,.14);color:var(--warn)}
.t-bad{background:rgba(248,113,113,.14);color:var(--bad)}
.t-info{background:rgba(96,165,250,.14);color:var(--info)}
.t-mut{background:rgba(154,146,184,.14);color:var(--muted)}
.t-acc{background:rgba(167,139,250,.16);color:var(--accent2)}

.bar{height:7px;border-radius:99px;background:var(--panel2);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}

.avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none}

.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:820px){.board{grid-template-columns:1fr}}
.col{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:11px;display:flex;flex-direction:column;gap:9px}
.colh{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;padding:2px 3px 8px;border-bottom:1px solid var(--line)}
.colh .cnt{background:var(--panel2);border-radius:99px;padding:1px 9px;font-size:11px;color:var(--muted)}
.tk{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;padding:10px 11px}
.tk .co{font-size:13px;font-weight:700}
.tk .mt{font-size:11px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tk .rowb{margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}

.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tli{position:relative;padding-bottom:16px}
.tli:last-child{padding-bottom:0}
.tli .node{position:absolute;left:-22px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--panel);border:2px solid var(--accent2);display:grid;place-items:center}
.tli .node.done{background:var(--good);border-color:var(--good)}
.tli .node.warn{background:var(--warn);border-color:var(--warn)}
.tli .node .material-symbols-outlined{font-size:10px;color:#0e0b1a}
.tli h4{font-size:13px;font-weight:700}
.tli .tm{font-size:11px;color:var(--muted);margin:2px 0 4px}
.tli p{font-size:12px;color:var(--muted);line-height:1.55}

.mx{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
.mx th{padding:9px 8px;font-size:11px;color:var(--muted);background:var(--panel2);border-bottom:1px solid var(--line);text-align:center}
.mx th:first-child{text-align:left}
.mx td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:center}
.mx td:first-child{text-align:left;font-weight:600;white-space:nowrap}
.cell{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px}
.cell .material-symbols-outlined{font-size:16px}
.c-ok{background:rgba(52,211,153,.16);color:var(--good)}
.c-no{background:rgba(248,113,113,.16);color:var(--bad)}
.c-wait{background:rgba(251,191,36,.16);color:var(--warn)}
.c-na{background:rgba(154,146,184,.1);color:var(--muted)}

.statbox{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:13px}
.statbox .l{font-size:11.5px;color:var(--muted);font-weight:600}
.statbox .v{font-size:20px;font-weight:800;margin-top:3px}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.report-card{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:13px;padding:15px;display:flex;flex-direction:column;gap:10px}
.report-card .rh{display:flex;align-items:center;gap:10px}
.report-card .rh .ic{width:36px;height:36px;border-radius:9px;background:rgba(124,58,237,.18);display:grid;place-items:center;color:var(--accent2)}
.report-card .rh b{font-size:14px;font-weight:700}
.report-card .rh small{display:block;font-size:11px;color:var(--muted)}
.report-card .prog{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}

.chartbox{width:100%;overflow:hidden}
.notewrap{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:12px;color:var(--muted);line-height:1.6;display:flex;gap:9px}
.notewrap .material-symbols-outlined{font-size:18px;color:var(--accent2);flex:none}

.flexrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mono{font-variant-numeric:tabular-nums}

@media(max-width:560px){
  .nav button span.lbl{display:none}
  .nav button{padding:8px 10px}
  .topmeta{display:none}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">

<div class="wrap"><div id="app"></div></div>

<script>
"use strict";
var MODULES=[
  {icon:"dashboard",name:"碳盤查總覽",t:"供應鏈碳排總覽儀表：範疇分布、排放趨勢與盤查進度"},
  {icon:"hub",name:"供應商協同",t:"問卷發送與回覆進度看板：追蹤各家回填狀態與逾期名單"},
  {icon:"table_chart",name:"活動數據",t:"活動量登錄與排放換算：套用係數自動換算各範疇 CO2e"},
  {icon:"fact_check",name:"佐證核對",t:"憑證缺漏矩陣與資料校驗：列出缺件並退回補件"},
  {icon:"verified",name:"查證確認",t:"異常複核與第三方查證：升級追蹤與查證意見軌跡"},
  {icon:"assessment",name:"揭露報告",t:"CBAM／CDP 揭露與匯出：減碳趨勢與稽核軌跡"}
];

function nf(n){try{return (n===null||n===undefined||isNaN(n))?"-":Number(n).toLocaleString("en-US");}catch(e){return String(n);}}
function tag(cls,ic,txt){return '<span class="tag '+cls+'">'+(ic?'<span class="material-symbols-outlined">'+ic+'</span>':'')+txt+'</span>';}
function barPct(p){var v=Math.max(0,Math.min(100,p||0));return '<div class="bar"><i style="width:'+v+'%"></i></div>';}

var CHARTS=[];
function killCharts(){for(var i=0;i<CHARTS.length;i++){try{CHARTS[i].destroy();}catch(e){}}CHARTS=[];}
var AXLAB={style:{colors:'#9a92b8',fontSize:'11px'}};
function baseOpts(extra){
  var o={chart:{background:'transparent',fontFamily:'Inter, Noto Sans TC',toolbar:{show:false},
    redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false}},
    theme:{mode:'dark'},grid:{borderColor:'#2c2440',strokeDashArray:4},
    tooltip:{theme:'dark'},dataLabels:{enabled:false},legend:{labels:{colors:'#9a92b8'}}};
  for(var k in extra)o[k]=extra[k];
  return o;
}
function mkChart(sel,opts){var ch=new ApexCharts(document.querySelector(sel),opts);CHARTS.push(ch);ch.render();return ch;}

/* ---------- data ---------- */
var SUPPLIERS=[
  {co:"宏昇金屬",tier:"Tier1",cat:"金屬加工",resp:"李佳蓉",due:"03/28",prog:100,scope1:1820,scope2:940,scope3:310,st:"done",risk:"low"},
  {co:"和陽電子",tier:"Tier1",cat:"電子零件",resp:"陳彥廷",due:"03/28",prog:72,scope1:640,scope2:1210,scope3:180,st:"filling",risk:"mid"},
  {co:"綠川塑膠",tier:"Tier1",cat:"塑膠射出",resp:"王思穎",due:"03/25",prog:35,scope1:1490,scope2:780,scope3:260,st:"filling",risk:"high"},
  {co:"台興包裝",tier:"Tier2",cat:"紙材包裝",resp:"林哲宇",due:"03/30",prog:0,scope1:520,scope2:410,scope3:95,st:"sent",risk:"mid"},
  {co:"永昌物流",tier:"Tier1",cat:"倉儲運輸",resp:"張雅琪",due:"03/22",prog:88,scope1:2340,scope2:530,scope3:1420,st:"filling",risk:"high"},
  {co:"聯達化工",tier:"Tier2",cat:"表面處理",resp:"黃冠霖",due:"04/02",prog:0,scope1:980,scope2:1120,scope3:340,st:"sent",risk:"mid"},
  {co:"鼎宸機械",tier:"Tier1",cat:"機械組件",resp:"李佳蓉",due:"03/26",prog:100,scope1:760,scope2:690,scope3:210,st:"done",risk:"low"},
  {co:"欣光紡織",tier:"Tier2",cat:"紡織染整",resp:"陳彥廷",due:"03/29",prog:54,scope1:1150,scope2:1680,scope3:420,st:"filling",risk:"high"}
];
var ACTIVITY=[
  {co:"宏昇金屬",item:"外購電力",qty:412000,unit:"kWh",factor:0.494,src:"台電係數",co2e:203.5,doc:"ok"},
  {co:"宏昇金屬",item:"天然氣",qty:86000,unit:"m³",factor:2.093,src:"環境部",co2e:180.0,doc:"ok"},
  {co:"和陽電子",item:"外購電力",qty:658000,unit:"kWh",factor:0.494,src:"台電係數",co2e:325.1,doc:"wait"},
  {co:"綠川塑膠",item:"柴油",qty:24500,unit:"L",factor:2.606,src:"環境部",co2e:63.8,doc:"miss"},
  {co:"綠川塑膠",item:"外購電力",qty:390000,unit:"kWh",factor:0.494,src:"台電係數",co2e:192.7,doc:"ok"},
  {co:"永昌物流",item:"柴油(車隊)",qty:186000,unit:"L",factor:2.606,src:"環境部",co2e:484.7,doc:"wait"},
  {co:"永昌物流",item:"外購電力",qty:210000,unit:"kWh",factor:0.494,src:"台電係數",co2e:103.7,doc:"ok"},
  {co:"欣光紡織",item:"蒸汽",qty:14200,unit:"GJ",factor:0.0653,src:"供應商實測",co2e:92.7,doc:"miss"}
];
var EVIDENCE=[
  {co:"宏昇金屬",bill:"ok",fuel:"ok",third:"ok",inv:"ok"},
  {co:"和陽電子",bill:"ok",fuel:"wait",third:"na",inv:"ok"},
  {co:"綠川塑膠",bill:"ok",fuel:"no",third:"no",inv:"wait"},
  {co:"台興包裝",bill:"wait",fuel:"na",third:"na",inv:"no"},
  {co:"永昌物流",bill:"ok",fuel:"wait",third:"wait",inv:"ok"},
  {co:"鼎宸機械",bill:"ok",fuel:"ok",third:"na",inv:"ok"},
  {co:"欣光紡織",bill:"ok",fuel:"no",third:"na",inv:"wait"}
];
var VERIFY=[
  {co:"永昌物流",issue:"車隊柴油較前期增加 34%，超出複核門檻",state:"escalate",who:"ESG 主管",tm:"今日 10:24",lvl:"warn"},
  {co:"綠川塑膠",issue:"柴油活動數據缺原始憑證，暫不納入正式盤查",state:"reject",who:"李佳蓉",tm:"今日 09:12",lvl:"bad"},
  {co:"欣光紡織",issue:"蒸汽採供應商實測係數，待第三方查證意見",state:"pending",who:"外部查證機構",tm:"昨日 16:40",lvl:"warn"},
  {co:"和陽電子",issue:"外購電力憑證上傳，等待複核確認",state:"pending",who:"王思穎",tm:"昨日 14:05",lvl:"info"},
  {co:"宏昇金屬",issue:"全項活動數據與憑證一致，查證通過",state:"pass",who:"外部查證機構",tm:"03/24",lvl:"good"},
  {co:"鼎宸機械",issue:"範疇一二資料完整，查證通過",state:"pass",who:"外部查證機構",tm:"03/23",lvl:"good"}
];

/* ---------- SCREEN 0 ---------- */
function v0(c){
  var totalS1=0,totalS2=0,totalS3=0,done=0;
  for(var i=0;i<SUPPLIERS.length;i++){totalS1+=SUPPLIERS[i].scope1;totalS2+=SUPPLIERS[i].scope2;totalS3+=SUPPLIERS[i].scope3;if(SUPPLIERS[i].st==="done")done++;}
  var total=totalS1+totalS2+totalS3;
  var kpis=[
    {ic:"co2",bg:"linear-gradient(135deg,#7c3aed,#a78bfa)",lab:"供應鏈總排放",val:nf(Math.round(total)),u:"tCO2e",d:"-8.4%",dir:"up",sp:"eco"},
    {ic:"groups",bg:"linear-gradient(135deg,#0ea5e9,#38bdf8)",lab:"納管供應商",val:"48",u:"／52 家",d:"+6 家",dir:"up",sp:"hub"},
    {ic:"task_alt",bg:"linear-gradient(135deg,#10b981,#34d399)",lab:"數據完整率",val:"93",u:"%",d:"+35%",dir:"up",sp:"fact_check"},
    {ic:"schedule",bg:"linear-gradient(135deg,#f59e0b,#fbbf24)",lab:"逾期未回覆",val:"3",u:"家",d:"-5 家",dir:"up",sp:"pending_actions"}
  ];
  var kh="";for(var k=0;k<kpis.length;k++){var x=kpis[k];
    kh+='<div class="kpi"><div class="ic" style="background:'+x.bg+'"><span class="material-symbols-outlined">'+x.ic+'</span></div>'+
      '<div class="lab">'+x.lab+'</div><div class="val">'+x.val+' <small>'+x.u+'</small></div>'+
      '<div class="delta '+x.dir+'"><span class="material-symbols-outlined">trending_'+(x.dir==="up"?"up":"down")+'</span>'+x.d+' 較前期</div>'+
      '<span class="material-symbols-outlined spark">'+x.sp+'</span></div>';}
  var byCat={};
  for(var i2=0;i2<SUPPLIERS.length;i2++){var s=SUPPLIERS[i2];var t=s.scope1+s.scope2+s.scope3;byCat[s.cat]=(byCat[s.cat]||0)+t;}
  var catArr=[];for(var cc in byCat)catArr.push({c:cc,v:byCat[cc]});
  catArr.sort(function(a,b){return b.v-a.v;});
  var maxCat=catArr[0]?catArr[0].v:1;
  var rows="";
  for(var r=0;r<catArr.length;r++){var it=catArr[r];
    rows+='<tr><td>'+it.c+'</td><td style="width:45%">'+barPct(it.v/maxCat*100)+'</td><td class="num mono">'+nf(it.v)+' t</td></tr>';}
  c.innerHTML=

  void c.offsetHeight;
  mkChart("#ch5",baseOpts({
    chart:{type:'line',height:300,background:'transparent',toolbar:{show:false},redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false}},
    series:[
      {name:'實際排放',data:[12460,11980,11420,10870,10520,10175]},
      {name:'SBTi 目標路徑',data:[12460,11800,11150,10500,9850,9200]}
    ],
    colors:['#a78bfa','#34d399'],
    stroke:{width:[3,2],dashArray:[0,6],curve:'smooth'},
    markers:{size:[4,0]},
    xaxis:{categories:['2020','2021','2022','2023','2024','2025'],labels:{style:{colors:'#9a92b8'}},axisBorder:{color:'#2c2440'}},
    yaxis:{labels:{style:{colors:'#9a92b8'},formatter:function(v){return nf(Math.round(v));}}},
    legend:{position:'top',labels:{colors:'#9a92b8'}}
  }));
}

var RENDER=[v0,v1,v2,v3,v4,v5];

function buildNav(){
  var n=document.getElementById("nav");var h="";
  for(var i=0;i<MODULES.length;i++){h+='<button data-i="'+i+'"><span class="material-symbols-outlined">'+MODULES[i].icon+'</span><span class="lbl">'+MODULES[i].name+'</span></button>';}
  n.innerHTML=h;
  var btns=n.querySelectorAll("[data-i]");
  for(var j=0;j<btns.length;j++){btns[j].addEventListener("click",function(){show(+this.getAttribute("data-i"));});}
}

function show(i){
  i=Math.max(0,Math.min(MODULES.length-1,i||0));
  killCharts();
  var btns=document.querySelectorAll("[data-i]");
  for(var b=0;b<btns.length;b++){btns[b].className=(+btns[b].getAttribute("data-i")===i)?"on":"";}
  var m=MODULES[i];
  var app=document.getElementById("app");
  app.innerHTML=
    '<div class="head"><div><h1><span class="material-symbols-outlined">'+m.icon+'</span>'+m.name+'</h1><p>'+m.t+'</p></div>'+
    '<div class="flexrow"><span class="pill"><span class="material-symbols-outlined">calendar_today</span>盤查年度 2025</span>'+
    '<span class="pill"><span class="material-symbols-outlined">layers</span>模組 '+(i+1)+' / 6</span></div></div>'+
    '<div id="screen"></div>';
  var screen=document.getElementById("screen");
  void screen.offsetHeight;
  RENDER[i](screen);
}

buildNav();
show(0);

function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
</script>
