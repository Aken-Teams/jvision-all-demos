<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>產品有害物質法規管理</title>
<meta name="description" content="限用物質資料庫、供應商聲明、物質篩檢與合規判定的純 UI 展示">
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#2563eb;
  --color-on-primary:#fff;
  --color-secondary:#3b82f6;
  --color-on-secondary:#000;
  --color-accent:#ea580c;
  --color-on-accent:#000;
  --color-background:#f8fafc;
  --color-foreground:#1e293b;
  --color-card:#fff;
  --color-card-foreground:#1e293b;
  --color-muted:#e9eff8;
  --color-muted-foreground:#475569;
  --color-border:#e2e8f0;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#2563eb;
  --blue:var(--color-primary);
  --ink:var(--color-foreground);
  --muted:var(--color-muted-foreground);
  --line:var(--color-border);
  --ok:#15803d;
  --warn:#a14405;
  --bad:#b91c1c;
  --info:#1d4ed8;
  --sidebar:#0f172a;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.04);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%}
body{
  background:var(--color-background);
  color:var(--ink);
  font-family:"Fira Sans","Noto Sans TC",system-ui,sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased
}
button{font:inherit}
button,a,[role="button"]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid rgba(37,99,235,.34);
  outline-offset:3px
}
.material-symbols-outlined{
  font-family:"Material Symbols Outlined";
  font-weight:normal;
  font-style:normal;
  font-size:20px;
  line-height:1;
  vertical-align:middle
}
.app{display:flex;min-height:100vh}
.sidebar{
  position:sticky;
  top:0;
  z-index:20;
  width:264px;
  height:100vh;
  flex:none;
  display:flex;
  flex-direction:column;
  padding:22px 16px;
  background:var(--sidebar);
  color:#fff;
  border-right:1px solid #1e293b
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 8px 22px;
  border-bottom:1px solid #334155
}
.logo{
  width:42px;
  height:42px;
  flex:none;
  display:grid;
  place-items:center;
  color:#fff;
  background:var(--blue);
  border-radius:8px;
  box-shadow:0 6px 18px rgba(37,99,235,.28)
}
.logo .material-symbols-outlined{font-size:24px}
.htxt{min-width:0}
.brand b{
  display:block;
  font-size:15px;
  line-height:1.3;
  letter-spacing:.01em
}
.brand span:not(.material-symbols-outlined){
  display:block;
  margin-top:4px;
  color:#cbd5e1;
  font-size:11px;
  white-space:nowrap
}
.nav{
  display:flex;
  flex-direction:column;
  gap:5px;
  margin-top:18px
}
.nav button{
  position:relative;
  width:100%;
  min-height:44px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px 12px;
  color:#cbd5e1;
  text-align:left;
  border:1px solid transparent;
  border-radius:7px;
  background:transparent;
  transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .2s ease
}
.nav button:hover{
  color:#fff;
  background:#1e293b;
  border-color:#334155;
  transform:translateX(2px)
}
.nav button.active{
  color:#fff;
  background:var(--blue);
  border-color:#60a5fa;
  box-shadow:0 5px 18px rgba(37,99,235,.25)
}
.nav button.active::before{
  content:"";
  position:absolute;
  left:-16px;
  width:3px;
  height:24px;
  background:#fff
}
.nav button .material-symbols-outlined{flex:none;color:#94a3b8}
.nav button.active .material-symbols-outlined{color:#fff}
.navtxt{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-weight:500
}
.side-foot{
  margin-top:auto;
  padding:16px 8px 2px;
  color:#94a3b8;
  border-top:1px solid #334155;
  font-size:11px;
  line-height:1.7
}
.main{flex:1;min-width:0;padding:30px clamp(18px,3vw,44px) 52px}
#view{max-width:1440px;margin:0 auto;animation:view-in .35s ease both}
.topbar{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:22px;
  padding-bottom:18px;
  border-bottom:1px solid var(--line)
}
.htitle{min-width:0}
.topbar h1{
  margin:0 0 5px;
  color:#0f172a;
  font-size:clamp(22px,2vw,29px);
  line-height:1.2;
  letter-spacing:-.025em
}
.topbar .sub{max-width:800px;color:var(--muted);font-size:13px}
.pill{
  min-height:34px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  flex:none;
  padding:6px 12px;
  color:#1e40af;
  background:#eff6ff;
  border:1px solid #bfdbfe;
  border-radius:6px;
  font-size:12px;
  font-weight:600;
  white-space:nowrap
}
.pill .material-symbols-outlined{font-size:17px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.g12{grid-template-columns:minmax(280px,1fr) minmax(0,2fr)}
.card{
  min-width:0;
  padding:18px;
  color:var(--color-card-foreground);
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:8px;
  box-shadow:var(--shadow);
  transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease
}
.card:hover{
  border-color:#cbd5e1;
  box-shadow:0 2px 4px rgba(15,23,42,.06),0 12px 30px rgba(15,23,42,.07)
}
.card h3{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 4px;
  color:#0f172a;
  font-size:14px;
  font-weight:700
}
.card h3 .material-symbols-outlined{color:var(--blue);font-size:19px}
.csub{margin-bottom:14px;color:var(--muted);font-size:11.5px}
.kpi{
  position:relative;
  overflow:hidden;
  border-top:3px solid var(--blue)
}
.kpi::after{
  content:"";
  position:absolute;
  top:-30px;
  right:-30px;
  width:92px;
  height:92px;
  border:16px solid #eff6ff;
  border-radius:50%;
  opacity:.7;
  pointer-events:none
}
.kpi .klab{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  gap:7px;
  margin-bottom:12px;
  color:var(--muted);
  font-size:12px;
  font-weight:500
}
.kpi .klab .material-symbols-outlined{color:var(--blue);font-size:18px}
.kpi .kval{
  position:relative;
  z-index:1;
  color:#0f172a;
  font-family:"Fira Code",monospace;
  font-size:27px;
  font-weight:700;
  letter-spacing:-.04em;
  line-height:1.05;
  font-variant-numeric:tabular-nums
}
.kpi .kfoot{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:10px;
  font-size:11.5px;
  font-weight:500
}
.trend-up{color:var(--ok)}
.trend-dn{color:var(--bad)}
.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:24px;
  padding:3px 8px;
  border:1px solid transparent;
  border-radius:5px;
  font-size:11px;
  font-weight:600;
  white-space:nowrap
}
.badge::before{
  content:"";
  width:6px;
  height:6px;
  flex:none;
  border-radius:50%;
  background:currentColor
}
.b-ok{color:#166534;background:#f0fdf4;border-color:#bbf7d0}
.b-warn{color:#92400e;background:#fffbeb;border-color:#fde68a}
.b-bad{color:#991b1b;background:#fef2f2;border-color:#fecaca}
.b-info{color:#1e40af;background:#eff6ff;border-color:#bfdbfe}
.b-mut{color:#475569;background:#f1f5f9;border-color:#cbd5e1}
.scroll{
  width:100%;
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:7px;
  -webkit-overflow-scrolling:touch
}
table{
  width:100%;
  min-width:520px;
  border-collapse:collapse;
  font-size:12.5px
}
th,td{
  padding:11px 12px;
  border-bottom:1px solid var(--line);
  text-align:left;
  white-space:nowrap
}
th{
  color:#334155;
  background:#f1f5f9;
  font-size:11px;
  font-weight:700;
  letter-spacing:.035em
}
tbody tr{transition:background-color .18s ease}
tbody tr:hover{background:#f8fafc}
tbody tr:last-child td{border-bottom:0}
td:nth-child(4),th:nth-child(4){text-align:right;font-variant-numeric:tabular-nums}
.mono{
  color:#334155;
  font-family:"Fira Code",monospace;
  font-size:11.5px;
  font-variant-numeric:tabular-nums
}
.bar-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:13px;
  font-size:12.5px
}
.bar-row .nm{
  width:120px;
  flex:none;
  overflow:hidden;
  color:#334155;
  text-overflow:ellipsis;
  white-space:nowrap
}
.bar-track{
  flex:1;
  min-width:0;
  height:8px;
  overflow:hidden;
  background:var(--color-muted);
  border-radius:2px
}
.bar-fill{display:block;height:100%;border-radius:2px}
.bar-row .vv{
  width:42px;
  flex:none;
  text-align:right;
  font-family:"Fira Code",monospace;
  font-size:12px;
  font-weight:600;
  font-variant-numeric:tabular-nums
}
.board{
  display:grid;
  grid-template-columns:repeat(4,minmax(220px,1fr));
  gap:12px;
  min-width:920px;
  padding:12px;
  background:#f8fafc
}
.bcol{
  min-width:0;
  padding:11px;
  background:#f1f5f9;
  border:1px solid var(--line);
  border-radius:7px
}
.bcol h4{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:0 0 11px;
  color:#334155;
  font-size:12.5px
}
.cnt{
  min-width:24px;
  padding:1px 7px;
  color:var(--muted);
  text-align:center;
  background:#fff;
  border:1px solid var(--line);
  border-radius:4px;
  font-family:"Fira Code",monospace;
  font-size:10px
}
.ticket{
  margin-bottom:8px;
  padding:10px;
  background:#fff;
  border:1px solid var(--line);
  border-left:3px solid var(--blue);
  border-radius:5px;
  box-shadow:0 1px 2px rgba(15,23,42,.05);
  font-size:12px
}
.ticket:last-child{margin-bottom:0}
.ticket .tt{margin-bottom:5px;color:#0f172a;font-weight:600}
.ticket .meta{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
  color:var(--muted);
  font-size:11px
}
.tl{position:relative;padding-left:24px}
.tl::before{
  content:"";
  position:absolute;
  top:5px;
  bottom:5px;
  left:7px;
  width:2px;
  background:#bfdbfe
}
.tl-item{position:relative;margin-bottom:19px}
.tl-item:last-child{margin-bottom:0}
.tl-dot{
  position:absolute;
  top:3px;
  left:-22px;
  width:12px;
  height:12px;
  background:var(--blue);
  border:3px solid #fff;
  border-radius:50%;
  box-shadow:0 0 0 2px #93c5fd
}
.tl-h{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
  color:#0f172a;
  font-size:13px;
  font-weight:600
}
.tl-d{margin-top:5px;color:var(--muted);font-size:11.5px}
.tl-date{
  color:#1d4ed8;
  font-family:"Fira Code",monospace;
  font-size:11px;
  font-weight:600;
  font-variant-numeric:tabular-nums
}
.matrix{
  min-width:560px;
  border-collapse:separate;
  border-spacing:5px;
  font-size:11.5px
}
.matrix th{padding:6px;background:transparent;text-align:center}
.matrix td{
  padding:9px 6px;
  color:#fff;
  text-align:center;
  border:0;
  border-radius:4px;
  font-family:"Fira Code",monospace;
  font-weight:700
}
.matrix td.rowh{
  color:#334155;
  text-align:left;
  background:#f1f5f9;
  font-family:"Fira Sans",sans-serif;
  font-weight:600
}
.mx-ok{background:#15803d}
.mx-warn{background:#b45309}
.mx-bad{background:#b91c1c}
.mx-na{color:#334155!important;background:#cbd5e1}
.legend{
  display:flex;
  flex-wrap:wrap;
  gap:15px;
  margin-top:13px;
  color:var(--muted);
  font-size:11.5px
}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:2px}
.li-row{
  display:flex;
  align-items:center;
  gap:11px;
  min-height:59px;
  padding:10px 0;
  border-bottom:1px solid var(--line)
}
.li-row:last-child{border-bottom:0}
.li-ico{
  width:36px;
  height:36px;
  flex:none;
  display:grid;
  place-items:center;
  color:#1d4ed8;
  background:#eff6ff;
  border:1px solid #bfdbfe;
  border-radius:6px
}
.li-ico .material-symbols-outlined{font-size:19px}
.li-main{flex:1;min-width:0}
.li-main .t{
  overflow:hidden;
  color:#0f172a;
  font-size:12.5px;
  font-weight:600;
  text-overflow:ellipsis;
  white-space:nowrap
}
.li-main .s{margin-top:2px;color:var(--muted);font-size:11px}
.stat-strip{display:flex;flex-wrap:wrap;gap:25px;margin-top:8px}
.stat-strip .s{color:var(--muted);font-size:11px}
.stat-strip .s b{
  display:block;
  color:#0f172a;
  font-family:"Fira Code",monospace;
  font-size:20px;
  font-variant-numeric:tabular-nums
}
.chart-box{width:100%;min-width:0}
@keyframes view-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:1024px){
  .sidebar{width:228px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g21,.g12{grid-template-columns:1fr}
}
@media(max-width:768px){
  .app{display:block}
  .sidebar{
    position:relative;
    width:100%;
    height:auto;
    padding:14px
  }
  .brand{padding:0 3px 12px}
  .nav{
    flex-direction:row;
    overflow-x:auto;
    margin-top:12px;
    padding:2px 1px 7px
  }
  .nav button{width:auto;flex:none}
  .nav button.active::before{display:none}
  .side-foot{display:none}
  .main{padding:22px 16px 38px}
  .topbar{align-items:flex-start}
  .g2,.g3{grid-template-columns:1fr}
}
@media(max-width:520px){
  .navtxt{display:none}
  .nav button{width:44px;justify-content:center;padding:9px}
  .topbar{display:block}
  .pill{margin-top:13px}
  .g4{grid-template-columns:1fr}
  .card{padding:15px}
  .kpi .kval{font-size:25px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important
  }
  #view{animation:none}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">
    <div class="logo"><span class="material-symbols-outlined" aria-hidden="true">verified_user</span></div>
    <div class="htxt"><b>產品有害物質法規管理</b><span>RoHS / REACH Compliance</span></div>
  </div>
  <nav class="nav" id="nav" aria-label="主要功能">
    <button type="button" data-i="0" class="active"><span class="material-symbols-outlined" aria-hidden="true">science</span><span class="navtxt">限用物質資料庫</span></button>
    <button type="button" data-i="1"><span class="material-symbols-outlined" aria-hidden="true">assignment_turned_in</span><span class="navtxt">供應商聲明管理</span></button>
    <button type="button" data-i="2"><span class="material-symbols-outlined" aria-hidden="true">gavel</span><span class="navtxt">法規更新追蹤</span></button>
    <button type="button" data-i="3"><span class="material-symbols-outlined" aria-hidden="true">biotech</span><span class="navtxt">物質篩檢比對</span></button>
    <button type="button" data-i="4"><span class="material-symbols-outlined" aria-hidden="true">verified</span><span class="navtxt">合規判定審核</span></button>
    <button type="button" data-i="5"><span class="material-symbols-outlined" aria-hidden="true">summarize</span><span class="navtxt">合規報告產出</span></button>
  </nav>
  <div class="side-foot">純 UI 展示 · 擬真資料<br>無後端 · 資料不落地</div>
</aside>
<main class="main"><div id="view"></div></main>
</div>
<script>
(function(){
"use strict";
var charts=[];
var reduced=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var ACC="#2563eb",ACC2="#ea580c";
function destroyCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy()}catch(e){}}charts=[]}
function mk(id,opt){
  var el=document.getElementById(id);
  if(!el)return;
  var base={redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:!reduced,speed:350},toolbar:{show:false},fontFamily:"Fira Sans,sans-serif"};
  opt.chart=Object.assign(base,opt.chart||{});
  opt.grid=Object.assign({borderColor:"#e2e8f0",strokeDashArray:3},opt.grid||{});
  opt.tooltip=Object.assign({theme:"light"},opt.tooltip||{});
  var c=new ApexCharts(el,opt);c.render();charts.push(c)
}
function head(title,sub,pill){
  return '<div class="topbar"><div class="htitle"><h1>'+title+'</h1><div class="sub">'+sub+'</div></div><div class="pill"><span class="material-symbols-outlined" aria-hidden="true">'+pill.i+'</span>'+pill.t+'</div></div>'
}
function kpi(icon,lab,val,unit,foot,cls,tag){
  return '<div class="card kpi"><div class="klab"><span class="material-symbols-outlined" aria-hidden="true">'+icon+'</span>'+lab+'</div><div class="kval">'+val+'<span style="font:600 13px Fira Sans;color:var(--muted)"> '+unit+'</span></div><div class="kfoot '+cls+'"><span class="material-symbols-outlined" style="font-size:15px" aria-hidden="true">'+(cls==="trend-up"?"arrow_upward":"arrow_downward")+'</span>'+foot+' · '+tag+'</div></div>'
}
function barRow(nm,v,color){
  return '<div class="bar-row"><span class="nm">'+nm+'</span><span class="bar-track"><span class="bar-fill" style="width:'+Math.min(v,100)+'%;background:'+color+'"></span></span><span class="vv">'+v+'</span></div>'
}
function s0(){
  var subs=[
    ["Pb 鉛","7439-92-1","RoHS","1000 ppm","均質材料","管制","b-bad"],
    ["Cd 鎘","7440-43-9","RoHS","100 ppm","均質材料","管制","b-bad"],
    ["Hg 汞","7439-97-6","RoHS","1000 ppm","均質材料","管制","b-bad"],
    ["Cr(VI) 六價鉻","18540-29-9","RoHS","1000 ppm","均質材料","管制","b-bad"],
    ["PBB 多溴聯苯","59536-65-1","RoHS","1000 ppm","均質材料","管制","b-warn"],
    ["PBDE 多溴聯苯醚","32534-81-9","RoHS","1000 ppm","均質材料","管制","b-warn"],
    ["DEHP 鄰苯二甲酸酯","117-81-7","RoHS 4","1000 ppm","均質材料","管制","b-bad"],
