<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RoHS/REACH 有害物質法規符合性管理</title>
<meta name="description" content="限用物質資料庫、供應商聲明、物質篩檢與合規判定的純 UI 展示" />
<link rel="icon" href="../../favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --accent:#b45309;--accent2:#f59e0b;--accent-soft:#fef3c7;
  --bg:#f7f5f2;--panel:#ffffff;--ink:#1f2937;--muted:#6b7280;--line:#eadfd2;
  --ok:#16a34a;--warn:#f59e0b;--bad:#dc2626;--info:#2563eb;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Inter","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;vertical-align:middle;}
.app{display:flex;min-height:100vh;align-items:stretch;}
.sidebar{width:248px;flex:none;background:linear-gradient(180deg,#fffdf9,#fbf6ee);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;}
.brand{display:flex;gap:11px;align-items:center;padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:8px;}
.brand .logo{width:40px;height:40px;flex:none;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 4px 12px rgba(180,83,9,.28);}
.brand .logo .material-symbols-outlined{font-size:24px;}
.brand b{font-size:15px;display:block;letter-spacing:.2px;}
.brand span{font-size:11px;color:var(--muted);}
.nav{display:flex;flex-direction:column;gap:4px;}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:var(--ink);text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:500;transition:.15s;min-width:0;}
.nav button .material-symbols-outlined{font-size:21px;color:var(--muted);flex:none;}
.nav button:hover{background:#fff5e6;}
.nav button.active{background:linear-gradient(135deg,var(--accent),#c2610a);color:#fff;box-shadow:0 4px 12px rgba(180,83,9,.25);}
.nav button.active .material-symbols-outlined{color:#fff;}
.nav .navtxt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.side-foot{margin-top:auto;padding:12px 10px 4px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);}
.main{flex:1;min-width:0;padding:22px 26px 40px;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px;}
.topbar .htitle{min-width:0;}
.topbar h1{font-size:20px;margin:0 0 3px;font-weight:700;}
.topbar .sub{font-size:12.5px;color:var(--muted);}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:#92400e;border-radius:999px;padding:6px 13px;font-size:12px;font-weight:600;white-space:nowrap;}
.pill .material-symbols-outlined{font-size:16px;}
.grid{display:grid;gap:14px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g21{grid-template-columns:2fr 1fr;}
.g12{grid-template-columns:1fr 2fr;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 17px;min-width:0;box-shadow:0 1px 2px rgba(30,20,5,.03);}
.card h3{margin:0 0 3px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px;}
.card h3 .material-symbols-outlined{font-size:19px;color:var(--accent);}
.card .csub{font-size:11.5px;color:var(--muted);margin-bottom:12px;}
.kpi .kval{font-size:26px;font-weight:700;letter-spacing:-.5px;line-height:1.1;}
.kpi .klab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:8px;}
.kpi .klab .material-symbols-outlined{font-size:18px;color:var(--accent2);}
.kpi .kfoot{font-size:11.5px;margin-top:6px;display:flex;align-items:center;gap:5px;}
.trend-up{color:var(--ok);}.trend-dn{color:var(--bad);}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;}
.b-ok{background:#dcfce7;color:#15803d;}
.b-warn{background:#fef3c7;color:#b45309;}
.b-bad{background:#fee2e2;color:#b91c1c;}
.b-info{background:#dbeafe;color:#1d4ed8;}
.b-mut{background:#f1f0ee;color:#6b7280;}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px;}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid #f1ece4;white-space:nowrap;}
th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;background:#fdfaf5;}
tbody tr:hover{background:#fffaf0;}
td .mono,.mono{font-family:"Inter",monospace;font-size:12px;color:#374151;}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:11px;font-size:12.5px;}
.bar-row .nm{width:120px;flex:none;color:#374151;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-track{flex:1;height:9px;background:#f0ece5;border-radius:6px;overflow:hidden;min-width:0;}
.bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.bar-row .vv{width:44px;flex:none;text-align:right;font-weight:600;font-size:12px;}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.bcol{background:#fbf7f1;border:1px solid var(--line);border-radius:12px;padding:11px;min-width:0;}
.bcol h4{margin:0 0 10px;font-size:12.5px;display:flex;align-items:center;justify-content:space-between;font-weight:700;}
.bcol h4 .cnt{background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--muted);}
.ticket{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;padding:9px 10px;margin-bottom:8px;font-size:12px;box-shadow:0 1px 2px rgba(30,20,5,.03);}
.ticket .tt{font-weight:600;margin-bottom:4px;font-size:12.5px;}
.ticket .meta{color:var(--muted);font-size:11px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.tl{position:relative;padding-left:22px;}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line);}
.tl-item{position:relative;margin-bottom:16px;}
.tl-item:last-child{margin-bottom:0;}
.tl-dot{position:absolute;left:-19px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent-soft);}
.tl-item .tl-h{font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.tl-item .tl-d{font-size:11.5px;color:var(--muted);margin-top:3px;}
.tl-item .tl-date{font-size:11px;color:var(--accent);font-weight:600;}
.matrix{width:100%;border-collapse:separate;border-spacing:4px;min-width:560px;font-size:11.5px;}
.matrix th{background:transparent;text-align:center;padding:4px;}
.matrix td{text-align:center;border:0;border-radius:8px;padding:8px 6px;font-weight:600;color:#fff;font-size:11.5px;}
.matrix td.rowh{background:#fbf7f1;color:#374151;text-align:left;font-weight:600;white-space:nowrap;}
.mx-ok{background:#22c55e;}.mx-warn{background:#f59e0b;}.mx-bad{background:#ef4444;}.mx-na{background:#d6d3d1;color:#57534e;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:12px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block;}
.li-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f1ece4;font-size:12.5px;}
.li-row:last-child{border-bottom:0;}
.li-ico{width:34px;height:34px;flex:none;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;}
.li-ico .material-symbols-outlined{font-size:19px;}
.li-main{flex:1;min-width:0;}
.li-main .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.li-main .s{font-size:11px;color:var(--muted);}
.stat-strip{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;}
.stat-strip .s{font-size:12px;color:var(--muted);}
.stat-strip .s b{display:block;font-size:19px;color:var(--ink);font-weight:700;}
.chart-box{width:100%;min-width:0;}
@media(max-width:860px){
  .app{flex-direction:column;}
  .sidebar{width:auto;flex-direction:column;border-right:0;border-bottom:1px solid var(--line);padding:12px 14px;}
  .brand{border-bottom:0;margin-bottom:6px;padding-bottom:6px;}
  .nav{flex-direction:row;flex-wrap:wrap;}
  .nav button{flex:none;white-space:nowrap;}
  .side-foot{display:none;}
  .main{padding:18px 16px 34px;}
}
@media(max-width:820px){
  .g4,.g3,.g2,.g21,.g12{grid-template-columns:1fr;}
  .board{grid-template-columns:1fr 1fr;}
}
@media(max-width:560px){
  .nav .navtxt{display:none;}
  .nav button{padding:9px 11px;}
  .board{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><span class="material-symbols-outlined">recycling</span></div>
      <div class="htxt"><b>RoHS/REACH 合規</b><span>有害物質法規符合性管理</span></div>
    </div>
    <nav class="nav" id="nav">
      <button data-i="0" class="active"><span class="material-symbols-outlined">science</span><span class="navtxt">限用物質資料庫</span></button>
      <button data-i="1"><span class="material-symbols-outlined">assignment_turned_in</span><span class="navtxt">供應商聲明管理</span></button>
      <button data-i="2"><span class="material-symbols-outlined">gavel</span><span class="navtxt">法規更新追蹤</span></button>
      <button data-i="3"><span class="material-symbols-outlined">biotech</span><span class="navtxt">物質篩檢比對</span></button>
      <button data-i="4"><span class="material-symbols-outlined">verified</span><span class="navtxt">合規判定審核</span></button>
      <button data-i="5"><span class="material-symbols-outlined">summarize</span><span class="navtxt">合規報告產出</span></button>
    </nav>
    <div class="side-foot">純 UI 展示 · 擬真資料<br/>無後端 · 資料不落地</div>
  </aside>
  <main class="main">
    <div id="view"></div>
  </main>
</div>
<script>
(function(){
"use strict";
var charts=[];
function destroyCharts(){for(var i=0;i<charts.length;i++){try{charts[i].destroy();}catch(e){}}charts=[];}
function mk(id,opt){var el=document.getElementById(id);if(!el)return;var baseChart={redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},toolbar:{show:false},fontFamily:'Inter,Noto Sans TC,sans-serif'};opt.chart=Object.assign(baseChart,opt.chart||{});var c=new ApexCharts(el,opt);c.render();charts.push(c);}
var ACC='#b45309',ACC2='#f59e0b';

function head(title,sub,pill){
  return '<div class="topbar"><div class="htitle"><h1>'+title+'</h1><div class="sub">'+sub+'</div></div><div class="pill"><span class="material-symbols-outlined">'+pill.i+'</span>'+pill.t+'</div></div>';
}
function kpi(icon,lab,val,unit,foot,cls,tag){
  return '<div class="card kpi"><div class="klab"><span class="material-symbols-outlined">'+icon+'</span>'+lab+'</div><div class="kval">'+val+'<span style="font-size:14px;color:var(--muted);font-weight:600;"> '+unit+'</span></div><div class="kfoot '+cls+'"><span class="material-symbols-outlined" style="font-size:15px;">'+(cls==='trend-up'?'arrow_upward':'arrow_downward')+'</span>'+foot+' · '+tag+'</div></div>';
}
function barRow(nm,v,color){
  return '<div class="bar-row"><span class="nm">'+nm+'</span><span class="bar-track"><span class="bar-fill" style="width:'+Math.min(v,100)+'%;background:'+color+'"></span></span><span class="vv">'+v+'</span></div>';
}

/* ---------- Screen 0: 限用物質資料庫 ---------- */
function s0(){
  var subs=[
    ['Pb 鉛','7439-92-1','RoHS','1000 ppm','均質材料','管制','b-bad'],
    ['Cd 鎘','7440-43-9','RoHS','100 ppm','均質材料','管制','b-bad'],
    ['Hg 汞','7439-97-6','RoHS','1000 ppm','均質材料','管制','b-bad'],
    ['Cr(VI) 六價鉻','18540-29-9','RoHS','1000 ppm','均質材料','管制','b-bad'],
    ['PBB 多溴聯苯','59536-65-1','RoHS','1000 ppm','均質材料','管制','b-warn'],
    ['PBDE 多溴聯苯醚','32534-81-9','RoHS','1000 ppm','均質材料','管制','b-warn'],
    ['DEHP 鄰苯二甲酸酯','117-81-7','RoHS 4','1000 ppm','均質材料','管制','b-bad'],
    ['DBP','84-74-2','RoHS 4','1000 ppm','均質材料','管制','b-warn'],
    ['SCCP 短鏈氯化石蠟','85535-84-8','REACH SVHC','1000 ppm','均質材料','SVHC','b-info'],
    ['PFOA','335-67-1','REACH 限制','25 ppb','均質材料','限制','b-info']
  ];
  var rows='';
  for(var i=0;i<subs.length;i++){var s=subs[i];
    rows+='<tr><td><b>'+s[0]+'</b></td><td><span class="mono">'+s[1]+'</span></td><td>'+s[2]+'</td><td>'+s[3]+'</td><td>'+s[4]+'</td><td><span class="badge '+s[6]+'">'+s[5]+'</span></td></tr>';
  }
  var html=head('限用物質資料庫','RoHS 十項與 REACH SVHC 管制物質、CAS 編號與濃度門檻維護',{i:'science',t:'法規基準'});
  html+='<div class="grid g4">'+
    kpi('inventory_2','管制物質總數','281','項','+6 本季新增','trend-up','較上季')+
    kpi('rule','RoHS 管制項','10','項','含 4 項鄰苯','trend-up','2015/863')+
    kpi('warning','REACH SVHC','241','項','ECHA 最新清單','trend-up','2026 更新')+
    kpi('event_upcoming','待覆核物質','8','項','等待技術審查','trend-dn','本週到期')+
  '</div>';
  html+='<div class="grid g21" style="margin-top:14px;">'+
    '<div class="card"><h3><span class="material-symbols-outlined">table_chart</span>管制物質清單</h3><div class="csub">依法規別與均質材料門檻列示，可下鑽至料號比對</div><div class="scroll"><table><thead><tr><th>物質</th><th>CAS No.</th><th>法規別</th><th>門檻</th><th>適用基材</th><th>類別</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">donut_small</span>物質分類佔比</h3><div class="csub">依法規來源歸類</div><div id="c0" class="chart-box"></div></div>'+
  '</div>';
  return {html:html,init:function(){
    mk('c0',{chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:'donut',height:262},series:[10,241,18,12],labels:['RoHS 十項','REACH SVHC','REACH 限制','其他管制'],colors:[ACC,ACC2,'#2563eb','#94a3b8'],legend:{position:'bottom',fontSize:'12px'},dataLabels:{enabled:false},plotOptions:{pie:{donut:{size:'62%',labels:{show:true,total:{show:true,label:'物質總數',fontSize:'12px',formatter:function(){return '281';}}}}}}});
  }};
}

/* ---------- Screen 1: 供應商聲明管理 ---------- */
function s1(){
  var sup=[
    ['嘉鴻電子','SUP-1042','48/48','2026-07-30','IMDS','完成','b-ok'],
    ['昇O精密','SUP-1088','32/32','2026-08-02','FMD','完成','b-ok'],
    ['宏達塑膠','SUP-1120','19/26','2026-08-18','FMD','催收中','b-warn'],
    ['O亞化材','SUP-1155','7/14','2026-08-20','IMDS','催收中','b-warn'],
    ['聯欣連接器','SUP-1201','3/22','2026-08-05','—','逾期','b-bad'],
    ['華新線纜','SUP-1233','16/16','2026-08-08','IMDS','待審','b-info'],
    ['勝利表面處理','SUP-1290','9/9','2026-07-25','FMD','完成','b-ok'],
    ['富喬玻纖','SUP-1312','12/20','2026-08-19','FMD','催收中','b-warn']
  ];
  var rows='';
  for(var i=0;i<sup.length;i++){var s=sup[i];
    rows+='<tr><td><b>'+s[0]+'</b></td><td><span class="mono">'+s[1]+'</span></td><td>'+s[2]+'</td><td>'+s[3]+'</td><td>'+s[4]+'</td><td><span class="badge '+s[6]+'">'+s[5]+'</span></td></tr>';
  }
  var html=head('供應商聲明管理','追蹤限用物質聲明書（IMDS/FMD）蒐集與回覆完成率',{i:'assignment_turned_in',t:'聲明蒐集'});
  html+='<div class="grid g4">'+
    kpi('groups','納管供應商','86','家','涵蓋 342 料號','trend-up','+4 家')+
    kpi('task_alt','聲明完成率','78.4','%','目標 95%','trend-up','+6.2pt')+
    kpi('hourglass_top','催收中','23','家','平均逾期 3.1 天','trend-dn','需跟進')+
    kpi('report','逾期未回','5','家','列入供應風險','trend-dn','已升級')+
  '</div>';
  html+='<div class="grid g21" style="margin-top:14px;">'+
    '<div class="card"><h3><span class="material-symbols-outlined">fact_check</span>供應商聲明進度</h3><div class="csub">依料號涵蓋度與到期日排序</div><div class="scroll"><table><thead><tr><th>供應商</th><th>編號</th><th>料號覆蓋</th><th>到期日</th><th>格式</th><th>狀態</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
    '<div class="card"><h3><span class="material-symbols-outlined">filter_alt</span>聲明蒐集漏斗</h3><div class="csub">從發出到完整佐證</div><div id="c1" class="chart-box"></div></div>'+
  '</div>';
  html+='<div class="card" style="margin-top:14px;"><h3><span class="material-symbols-outlined">stacked_bar_chart</span>各月聲明回覆趨勢</h3><div class="csub">已回覆 vs 待回覆料號數</div><div id="c1b" class="chart-box"></div></div>';
  return {html:html,init:function(){
    mk('c1',{chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:'bar',height:262},plotOptions:{bar:{horizontal:true,distributed:true,borderRadius:5,barHeight:'62%'}},series:[{data:[342,318,286,268]}],xaxis:{categories:['已發出','已回覆','審核通過','完整佐證']},colors:[ACC,'#c2610a',ACC2,'#fbbf24'],dataLabels:{enabled:true},legend:{show:false}});
    mk('c1b',{chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:'bar',height:250,stacked:true},plotOptions:{bar:{columnWidth:'52%',borderRadius:4}},series:[{name:'已回覆',data:[186,214,242,268,286,318]},{name:'待回覆',data:[156,128,100,74,56,24]}],xaxis:{categories:['3月','4月','5月','6月','7月','8月']},colors:[ACC,'#e5d3bd'],dataLabels:{enabled:false},legend:{position:'top'}});
  }};
}

/* ---------- Screen 2: 法規更新追蹤 ---------- */
function s2(){
  var tl=[
    ['2026-06-27','ECHA 新增 5 項 SVHC','SVHC','高關注物質清單擴增至 241 項，影響 12 個料號需重新聲明。','b-bad'],

var screens=[s0,s1,s2,s3,s4,s5];
var container=document.getElementById('view');
function show(i){
  destroyCharts();
  var btns=document.querySelectorAll('[data-i]');
  for(var b=0;b<btns.length;b++){btns[b].classList.toggle('active',+btns[b].getAttribute('data-i')===i);}
  var scr=screens[i]();
  container.innerHTML=scr.html;
  void container.offsetHeight;
  if(scr.init)scr.init();
}
var navEl=document.getElementById('nav');
navEl.addEventListener('click',function(e){
  var t=e.target;while(t&&t!==navEl&&!t.hasAttribute('data-i'))t=t.parentNode;
  if(t&&t.hasAttribute('data-i'))show(+t.getAttribute('data-i'));
});
show(0);
function fromHash(){var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);if(!m){show(0);return;}var n=document.querySelectorAll("[data-i]").length||6;show(Math.min(+m[1],n-1));try{window.scrollTo(0,0);}catch(e){}}window.addEventListener("hashchange",fromHash);fromHash();
})();
