<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>工單管理系統 · Work Order Management System</title>
<meta name="description" content="訂單到入庫的製造現場全流程數位化"/>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{
  --color-primary:#18181b;
  --color-on-primary:#fff;
  --color-secondary:#3f3f46;
  --color-on-secondary:#fff;
  --color-accent:#2563eb;
  --color-on-accent:#fff;
  --color-background:#fafafa;
  --color-foreground:#09090b;
  --color-card:#fff;
  --color-card-foreground:#09090b;
  --color-muted:#e8ecf0;
  --color-muted-foreground:#475569;
  --color-border:#e4e4e7;
  --color-destructive:#dc2626;
  --color-on-destructive:#fff;
  --color-ring:#18181b;
  --blue:#2563eb;
  --ink:#09090b;
  --muted:#475569;
  --line:#e4e4e7;
  --acc:#2563eb;
  --acc2:#60a5fa;
  --bg:#fafafa;
  --card:#fff;
  --mut:#475569;
  --ok:#15803d;
  --warn:#b45309;
  --bad:#dc2626;
  --info:#2563eb;
  --shadow-sm:0 1px 2px rgba(9,9,11,.05);
  --shadow-md:0 12px 32px rgba(9,9,11,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--color-background)}
html,body{margin:0}
body{font-family:"Fira Sans",system-ui,sans-serif;background:var(--color-background);color:var(--color-foreground);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button,[data-i]{cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid rgba(37,99,235,.32);outline-offset:3px}
.material-symbols-outlined{font-size:20px;line-height:1;vertical-align:middle;font-variation-settings:"FILL" 0,"wght" 450,"GRAD" 0,"opsz" 24}
.shell{display:flex;min-height:100vh}
.shell>*{min-width:0}
.side{width:248px;flex:none;background:var(--color-primary);color:#f4f4f5;display:flex;flex-direction:column;padding:20px 16px;position:sticky;top:0;height:100vh;min-width:0;overflow:hidden}
.side::before{content:"";position:absolute;inset:0 0 auto;height:210px;background:radial-gradient(circle at 20% 0,rgba(37,99,235,.32),transparent 68%);pointer-events:none}
.brand{position:relative;display:flex;align-items:center;gap:12px;padding:2px 4px 20px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:16px}
.logo{width:42px;height:42px;border-radius:10px;background:var(--color-accent);display:grid;place-items:center;font:700 17px/1 "Fira Sans",sans-serif;color:#fff;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.15),0 10px 28px rgba(37,99,235,.28)}
.brand b{font-size:15px;font-weight:700;display:block;line-height:1.3;letter-spacing:.01em}
.brand span{display:block;margin-top:3px;font:500 9px/1.3 "Fira Code",monospace;color:#a1a1aa;letter-spacing:.13em}
.nav{position:relative;display:flex;flex-direction:column;gap:6px;min-width:0}
.nav button{position:relative;border:1px solid transparent;background:transparent;color:#d4d4d8;font-weight:500;font-size:13px;padding:11px 12px;border-radius:8px;display:flex;align-items:center;gap:11px;text-align:left;white-space:nowrap;transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .2s ease;min-width:0}
.nav button::after{content:"";position:absolute;right:10px;width:5px;height:5px;border-radius:50%;background:transparent;transition:.2s ease}
.nav button .material-symbols-outlined{font-size:20px;flex:none;color:#a1a1aa;transition:color .2s ease,transform .2s ease}
.nav button .tx{overflow:hidden;text-overflow:ellipsis}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff;border-color:rgba(255,255,255,.07);transform:translateX(2px)}
.nav button:hover .material-symbols-outlined{color:#93c5fd}
.nav button.on{background:#fff;color:#18181b;border-color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.nav button.on::after{background:var(--color-accent);box-shadow:0 0 0 3px rgba(37,99,235,.14)}
.nav button.on .material-symbols-outlined{color:var(--color-accent)}
.side .foot{position:relative;margin-top:auto;padding:16px 4px 0;border-top:1px solid rgba(255,255,255,.12);font:400 10.5px/1.8 "Fira Code",monospace;color:#a1a1aa}
.side .foot .live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:7px;box-shadow:0 0 0 3px rgba(34,197,94,.16);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.62;transform:scale(.78)}}
.main{flex:1;min-width:0;padding:26px clamp(18px,2.4vw,36px) 48px;background-image:linear-gradient(rgba(228,228,231,.38) 1px,transparent 1px),linear-gradient(90deg,rgba(228,228,231,.38) 1px,transparent 1px);background-size:32px 32px;background-position:-1px -1px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin:0 0 22px;padding-bottom:17px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ph h1{margin:0;font-size:clamp(21px,2vw,27px);font-weight:700;letter-spacing:-.025em;display:flex;align-items:center;gap:10px}
.ph h1 .material-symbols-outlined{width:36px;height:36px;border-radius:8px;background:var(--color-primary);color:#fff;font-size:20px;display:grid;place-items:center}
.ph p{margin:5px 0 0 46px;color:var(--muted);font-size:12.5px}
.pill{background:#fff;border:1px solid var(--line);color:var(--ink);padding:7px 11px;border-radius:7px;font:600 11px/1.4 "Fira Code",monospace;white-space:nowrap;box-shadow:var(--shadow-sm)}
.pill::before{content:"LIVE";display:inline-block;margin-right:9px;padding-right:9px;border-right:1px solid var(--line);color:var(--color-accent);font-size:9px;letter-spacing:.08em}
.view{display:none}
.view.on{display:block;animation:view-in .36s cubic-bezier(.22,1,.36,1)}
@keyframes view-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;position:relative;overflow:hidden;min-width:0;box-shadow:var(--shadow-sm);transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--color-accent);transform:scaleY(.28);transform-origin:bottom;transition:transform .3s ease}
.kpi::after{content:"";position:absolute;right:-30px;top:-34px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.09),transparent 68%);pointer-events:none}
.kpi:hover{transform:translateY(-3px);border-color:#bfdbfe;box-shadow:var(--shadow-md)}
.kpi:hover::before{transform:scaleY(1)}
.kpi .ic{width:34px;height:34px;border-radius:7px;background:#eff6ff;color:var(--blue);display:grid;place-items:center;margin-bottom:12px;border:1px solid #dbeafe}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:500}
.kpi .v{font:700 26px/1.25 "Fira Code",monospace;margin-top:4px;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:11px;font-weight:500;color:var(--muted);margin-left:4px;letter-spacing:0}
.kpi .d{font-size:10.5px;font-weight:600;margin-top:5px}
.up{color:var(--ok)}
.dn{color:var(--bad)}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g21{grid-template-columns:minmax(0,1.35fr) minmax(300px,.9fr)}
.g12{grid-template-columns:minmax(280px,.9fr) minmax(0,1.4fr)}
.g11{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:17px 18px;min-width:0;box-shadow:var(--shadow-sm);transition:border-color .25s ease,box-shadow .25s ease,transform .25s ease}
.card:hover{border-color:#d4d4d8;box-shadow:0 12px 34px rgba(9,9,11,.055)}
.card h3{margin:0 0 15px;padding-bottom:12px;border-bottom:1px solid #f1f1f3;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink)}
.card h3 .material-symbols-outlined{width:27px;height:27px;border-radius:6px;background:#eff6ff;color:var(--blue);font-size:17px;display:grid;place-items:center}
.card h3 .r{margin-left:auto;font:500 10.5px/1.4 "Fira Code",monospace;color:var(--muted)}
.scroll{overflow-x:auto;scrollbar-width:thin;scrollbar-color:#a1a1aa transparent}
.scroll:focus-within{outline:2px solid rgba(37,99,235,.22);outline-offset:2px}
.tag{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:5px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;border:1px solid currentColor}
.tag::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.t-wait{background:#fffbeb;color:#92400e}.t-run{background:#eff6ff;color:#1d4ed8}.t-done{background:#f0fdf4;color:#166534}.t-hold{background:#fef2f2;color:#b91c1c}.t-qc{background:#faf5ff;color:#7e22ce}.t-store{background:#f0f9ff;color:#0369a1}
table.data{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
table.data th,table.data td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{color:#3f3f46;font-weight:600;font-size:10.5px;background:#f4f4f5;text-transform:none;letter-spacing:.025em}
table.data th:first-child{border-radius:6px 0 0 6px}
table.data th:last-child{border-radius:0 6px 6px 0}
table.data tbody tr,table.data tr{transition:background-color .18s ease}
table.data tr:hover td{background:#f8fafc}
table.data tr:last-child td{border-bottom:0}
table.data td b{font-family:"Fira Code",monospace;font-weight:600;font-variant-numeric:tabular-nums}
table.data td:last-child{text-align:right;font-variant-numeric:tabular-nums}
table.data th:last-child{text-align:right}
.chart{min-height:40px}
.apexcharts-text,.apexcharts-legend-text{font-family:"Fira Sans",sans-serif!important}
.apexcharts-tooltip{border:1px solid var(--line)!important;box-shadow:var(--shadow-md)!important}
.split{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;align-items:stretch}
.split .arrow{display:grid;place-items:center;color:var(--blue)}
.split .arrow .material-symbols-outlined{width:38px;height:38px;border-radius:50%;border:1px solid #bfdbfe;background:#eff6ff;display:grid;place-items:center;font-size:22px;animation:nudge 2.2s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
.ord{border:1px solid var(--line);border-radius:8px;padding:14px;background:#fafafa}
.ord .hd{font-weight:700;font-size:14px;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.ord .row{display:flex;justify-content:space-between;gap:18px;font-size:12px;padding:6px 0;border-bottom:1px dashed #d4d4d8}
.ord .row:last-child{border-bottom:0}
.ord .row span:first-child{color:var(--muted)}
.ord .row b{font-family:"Fira Code",monospace;font-size:11.5px;text-align:right;font-variant-numeric:tabular-nums}
.wolist{display:flex;flex-direction:column;gap:9px}
.woc{border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:8px;padding:11px 13px;background:#fff;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.woc:hover{transform:translateX(3px);border-color:#bfdbfe;box-shadow:var(--shadow-sm)}
.woc .t{display:flex;align-items:center;gap:8px;font-weight:600;font-size:12.5px}
.woc .no{font:600 11.5px/1.4 "Fira Code",monospace;color:var(--blue)}
.woc small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.steps{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.stp{font-size:10px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;padding:3px 7px;border-radius:4px;font-weight:600}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:11px;align-items:start;min-width:950px}
.kcol{background:#f4f4f5;border:1px solid var(--line);border-radius:9px;padding:10px;min-width:0}
.kcol>h4{margin:0 0 10px;font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.kcol>h4 .cnt{background:#fff;border:1px solid var(--line);border-radius:4px;padding:1px 7px;font:600 10px/1.5 "Fira Code",monospace;color:var(--muted)}
.kcol .dotc{width:7px;height:7px;border-radius:2px;display:inline-block;margin-right:6px}
.kcards{display:flex;flex-direction:column;gap:8px}
.kc{background:#fff;border:1px solid var(--line);border-radius:7px;padding:10px;box-shadow:var(--shadow-sm);transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.kc:hover{transform:translateY(-2px);border-color:#93c5fd;box-shadow:0 8px 18px rgba(37,99,235,.09)}
.kc .no{font:600 10.5px/1.4 "Fira Code",monospace;color:var(--blue)}
.kc b{display:block;font-size:11.5px;margin:3px 0 6px}
.kc .mt{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--muted)}
.kc .mb{height:5px;background:#e4e4e7;border-radius:2px;overflow:hidden;margin-top:8px}
.kc .mb i{display:block;height:100%;background:var(--blue);transition:width .4s ease}
.avm{width:22px;height:22px;border-radius:6px;background:var(--color-primary);color:#fff;display:inline-grid;place-items:center;font-size:10px;font-weight:600}
.ring{width:132px;height:132px;border-radius:50%;margin:6px auto 14px;display:grid;place-items:center;background:conic-gradient(var(--blue) 0 88%,var(--color-muted) 88% 100%);box-shadow:inset 0 0 0 1px rgba(9,9,11,.05);animation:ring-in .7s cubic-bezier(.22,1,.36,1)}
@keyframes ring-in{from{transform:scale(.88) rotate(-12deg);opacity:.4}to{transform:none;opacity:1}}
.ring span{width:98px;height:98px;border-radius:50%;background:#fff;display:grid;place-items:center;font:700 28px/1 "Fira Code",monospace;color:var(--blue)}
.mini{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.mrow{display:flex;align-items:center;gap:10px;font-size:11.5px}
.mrow .lb{flex:1;min-width:0;color:var(--muted)}
.mrow .bar{width:90px;flex:none;height:7px;background:var(--color-muted);border-radius:2px;overflow:hidden}
.mrow .bar i{display:block;height:100%;background:var(--blue)}
.mrow b{font-family:"Fira Code",monospace;font-size:10.5px;font-variant-numeric:tabular-nums}
.alert{border:1px solid #fecaca;background:#fff7f7;border-left:4px solid var(--bad);border-radius:8px;padding:12px 13px;display:flex;gap:11px;align-items:flex-start;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.alert .ic{width:34px;height:34px;border-radius:7px;background:#fee2e2;color:var(--bad);display:grid;place-items:center;flex:none}
.alert b{font-size:12.5px;color:#991b1b}
.alert p{margin:3px 0 0;font-size:11.5px;color:#7f1d1d;line-height:1.65}
.tl{position:relative;padding-left:28px}
.tl::before{content:"";position:absolute;left:9px;top:5px;bottom:5px;width:2px;background:linear-gradient(var(--blue),var(--line))}
.tli{position:relative;padding:0 0 17px;transition:transform .2s ease}
.tli:hover{transform:translateX(3px)}
.tli:last-child{padding-bottom:0}
.tli .dot{position:absolute;left:-25px;top:2px;width:14px;height:14px;border-radius:4px;background:#fff;border:3px solid var(--blue);box-shadow:0 0 0 3px #eff6ff}
.tli.done .dot{background:var(--blue)}
.tli b{display:block;font-size:12px;margin-top:2px}
.tli small{display:block;color:var(--muted);font-size:10.5px;margin-top:2px}
.tli .tm{font:600 10px/1.5 "Fira Code",monospace;color:var(--blue)}
.prog{display:flex;flex-direction:column;gap:13px}
.pr{display:grid;grid-template-columns:88px minmax(0,1fr) 55px;gap:10px;align-items:center}
.pr b{font:600 10.5px/1.4 "Fira Code",monospace}
.pr .bar{height:10px;background:var(--color-muted);border-radius:3px;overflow:hidden;position:relative}
.pr .bar i{display:block;height:100%;border-radius:3px;background:var(--blue);transition:width .45s ease}
.pr small{font:600 10.5px/1.4 "Fira Code",monospace;text-align:right;font-variant-numeric:tabular-nums}
.trace{position:relative;display:flex;justify-content:space-between;margin:10px 4px 24px;counter-reset:s}
.trace::before{content:"";position:absolute;left:7%;right:7%;top:15px;height:2px;background:linear-gradient(90deg,var(--blue) 0 75%,var(--line) 75%);z-index:0}
.tstep{position:relative;z-index:1;text-align:center;flex:1;min-width:0}
.tstep .c{width:32px;height:32px;border-radius:7px;margin:0 auto 8px;display:grid;place-items:center;color:#fff;font:700 12px/1 "Fira Code",monospace;box-shadow:0 0 0 4px #fff}
.tstep b{font-size:11.5px;font-weight:600}
.tstep small{font-size:10.5px;color:var(--muted);display:block}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.bc{border:1px solid var(--line);border-radius:8px;padding:15px;text-align:left;background:#fafafa;position:relative;overflow:hidden}
.bc::after{content:"";position:absolute;right:0;top:0;width:34px;height:3px;background:var(--blue)}
.bc .v{font:700 25px/1.25 "Fira Code",monospace;color:var(--ink);font-variant-numeric:tabular-nums}
.bc small{font-size:10.5px;color:var(--muted);display:block;margin-top:4px}
@media(max-width:1024px){
  .side{width:218px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g21,.g12{grid-template-columns:1fr}
}
@media(max-width:860px){
  .shell{flex-direction:column}
  .side{width:auto;height:auto;position:relative;z-index:10;padding:12px 14px}
  .side::before{height:100%}
  .brand{border-bottom:0;padding-bottom:9px;margin-bottom:8px}
  .nav{flex-direction:row;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
  .nav button{flex:0 0 auto;padding:9px 11px}
  .nav button::after{display:none}
  .side .foot{display:none}
  .main{padding-top:20px}
  .g11{grid-template-columns:1fr}
  .split{grid-template-columns:1fr}
  .split .arrow{transform:rotate(90deg)}
  .split .arrow .material-symbols-outlined{animation:none}
  .big{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:560px){
  .main{padding:16px 12px 32px;background-size:24px 24px}
  .ph{align-items:flex-start;margin-bottom:16px}
  .ph p{margin-left:0;max-width:34ch}
  .pill{width:100%;display:flex;align-items:center;justify-content:center}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .kpi{padding:13px 12px}
  .kpi .v{font-size:21px}
  .card{padding:14px 12px}
  .card h3 .r{width:100%;margin-left:35px}
  .nav button .tx{display:none}
  .nav button{min-width:42px;min-height:42px;justify-content:center}
  .brand span{letter-spacing:.08em}
  .big{grid-template-columns:1fr}
  .trace{overflow-x:auto;justify-content:flex-start;padding-bottom:8px}
  .trace::before{left:35px;right:auto;width:420px}
  .tstep{flex:0 0 105px}
  table.data th,table.data td{padding:9px 10px}
}
@media(max-width:390px){
  .kpis{grid-template-columns:1fr}
  .ph h1{font-size:20px}
  .logo{width:38px;height:38px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .view.on{animation:none}
  .side .foot .live,.split .arrow .material-symbols-outlined,.ring{animation:none}
  .kpi:hover,.kc:hover,.woc:hover,.tli:hover,.nav button:hover{transform:none}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="logo">工</div>
      <div><b>工單管理系統</b><span>WORK ORDER · MES</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot"><span class="live"></span>現場連線中<br>ERP · MES · APS 已同步<br>更新於 08:42</div>
  </aside>
  <main class="main">
    <div class="ph">
      <div><h1 id="vt"><span class="material-symbols-outlined" id="vi">dashboard</span><span id="vtx">工單總覽</span></h1><p id="vs"></p></div>
      <div class="pill" id="pill">2026-08-13 · 早班</div>
    </div>
