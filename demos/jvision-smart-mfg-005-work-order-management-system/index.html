<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>工單管理系統 · Work Order Management System</title>
<meta name="description" content="訂單到入庫的製造現場全流程數位化"/>
<link rel="icon" href="../../favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<style>
:root{--acc:#ea580c;--acc2:#fb923c;--ink:#1c1917;--bg:#f5f4f2;--card:#fff;--line:#e7e5e4;--mut:#78716c;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#2563eb}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.material-symbols-outlined{font-size:20px;line-height:1;vertical-align:middle}
.shell{display:flex;min-height:100vh}
.shell>*{min-width:0}
/* sidebar */
.side{width:236px;flex:none;background:linear-gradient(180deg,#292524,#1c1917);color:#e7e5e4;display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh;min-width:0}
.brand{display:flex;align-items:center;gap:11px;padding:4px 6px 16px;border-bottom:1px solid rgba(255,255,255,.09);margin-bottom:14px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-weight:900;font-family:"Noto Sans TC";font-size:18px;color:#fff;flex:none;box-shadow:0 6px 18px rgba(234,88,12,.45)}
.brand b{font-size:15.5px;font-family:"Noto Sans TC";font-weight:900;display:block;line-height:1.25}
.brand span{font-size:10px;color:#a8a29e;letter-spacing:1.5px}
.nav{display:flex;flex-direction:column;gap:5px;min-width:0}
.nav button{border:0;background:transparent;color:#d6d3d1;font:inherit;font-weight:600;font-size:13.5px;padding:11px 12px;border-radius:11px;cursor:pointer;display:flex;align-items:center;gap:11px;text-align:left;flex:none;white-space:nowrap;transition:.15s;min-width:0}
.nav button .material-symbols-outlined{font-size:20px;flex:none}
.nav button .tx{overflow:hidden;text-overflow:ellipsis}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 6px 16px rgba(234,88,12,.4)}
.side .foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.09);font-size:11px;color:#a8a29e;line-height:1.7}
.side .foot .live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:6px;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(34,197,94,.6)}50%{opacity:.55;box-shadow:0 0 0 5px rgba(34,197,94,0)}}
/* main */
.main{flex:1;min-width:0;padding:22px 26px 40px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.ph h1{margin:0;font-size:22px;font-family:"Noto Sans TC";font-weight:900;display:flex;align-items:center;gap:9px}
.ph h1 .material-symbols-outlined{color:var(--acc);font-size:26px}
.ph p{margin:4px 0 0;color:var(--mut);font-size:13px}
.pill{background:#fff;border:1px solid var(--line);color:var(--acc);padding:7px 14px;border-radius:22px;font-size:12px;font-weight:700;white-space:nowrap}
.view{display:none}
.view.on{display:block;animation:f .28s}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* generic */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;position:relative;overflow:hidden;min-width:0}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,rgba(234,88,12,.12),transparent 70%)}
.kpi .ic{width:34px;height:34px;border-radius:10px;background:#fff7ed;color:var(--acc);display:grid;place-items:center;margin-bottom:9px}
.kpi .l{font-size:12px;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:3px;font-family:Inter}
.kpi .v small{font-size:12px;font-weight:600;color:var(--mut)}
.kpi .d{font-size:11px;font-weight:700;margin-top:3px}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g21{grid-template-columns:1.35fr .9fr}
.g12{grid-template-columns:.9fr 1.4fr}
.g11{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;min-width:0}
.card h3{margin:0 0 13px;font-size:14px;font-family:"Noto Sans TC";font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .material-symbols-outlined{color:var(--acc);font-size:20px}
.card h3 .r{margin-left:auto;font-weight:600;font-size:11.5px;color:var(--mut)}
.scroll{overflow-x:auto}
.tag{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;display:inline-block}
.t-wait{background:#fef3c7;color:#b45309}.t-run{background:#dbeafe;color:#1d4ed8}.t-done{background:#dcfce7;color:#15803d}
.t-hold{background:#fee2e2;color:#b91c1c}.t-qc{background:#f3e8ff;color:#7e22ce}.t-store{background:#e0f2fe;color:#0369a1}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{color:var(--mut);font-weight:700;font-size:11.5px;background:#faf9f7}
table.data tr:last-child td{border-bottom:0}
table.data td b{font-family:Inter}
.chart{min-height:40px}
/* v1 build */
.split{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:stretch}
.split .arrow{display:grid;place-items:center;color:var(--acc)}
.split .arrow .material-symbols-outlined{font-size:34px}
.ord{border:1px solid var(--line);border-radius:13px;padding:13px;background:#faf9f7}
.ord .hd{font-family:"Noto Sans TC";font-weight:900;font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.ord .row{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--line)}
.ord .row:last-child{border-bottom:0}
.ord .row span:first-child{color:var(--mut)}
.wolist{display:flex;flex-direction:column;gap:10px}
.woc{border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:11px;padding:11px 13px;background:#fff}
.woc .t{display:flex;align-items:center;gap:8px;font-family:"Noto Sans TC";font-weight:700;font-size:13.5px}
.woc .no{font-family:Inter;font-weight:800;color:var(--acc);font-size:12.5px}
.woc small{display:block;color:var(--mut);font-size:11.5px;margin-top:3px}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.stp{font-size:11px;background:#fff7ed;border:1px solid #fed7aa;color:#c2410c;padding:3px 9px;border-radius:8px;font-weight:600}
/* v2 kanban */
.kanban{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:start}
.kcol{background:#faf9f7;border:1px solid var(--line);border-radius:14px;padding:11px;min-width:0}
.kcol>h4{margin:0 0 10px;font-size:12.5px;font-family:"Noto Sans TC";font-weight:700;display:flex;align-items:center;justify-content:space-between}
.kcol>h4 .cnt{background:#fff;border:1px solid var(--line);border-radius:20px;padding:1px 9px;font-size:11px;color:var(--mut);font-family:Inter}
.kcol .dotc{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.kcards{display:flex;flex-direction:column;gap:9px}
.kc{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 11px;box-shadow:0 1px 2px rgba(28,25,23,.04)}
.kc .no{font-family:Inter;font-weight:800;font-size:11.5px;color:var(--acc)}
.kc b{display:block;font-family:"Noto Sans TC";font-size:12.5px;margin:2px 0 5px}
.kc .mt{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--mut)}
.kc .mb{height:5px;background:#f0eeec;border-radius:6px;overflow:hidden;margin-top:7px}
.kc .mb i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.avm{width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;font-family:"Noto Sans TC"}
/* v3 pick */
.ring{width:132px;height:132px;border-radius:50%;margin:4px auto 10px;display:grid;place-items:center;background:conic-gradient(var(--acc) 0 88%,#f0eeec 88% 100%)}
.ring span{width:100px;height:100px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:30px;font-weight:800;font-family:Inter;color:var(--acc)}
.mini{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.mrow{display:flex;align-items:center;gap:10px;font-size:12.5px}
.mrow .lb{flex:1;min-width:0}
.mrow .bar{width:90px;flex:none;height:8px;background:#f0eeec;border-radius:6px;overflow:hidden}
.mrow .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.alert{border:1px solid #fecaca;background:#fef2f2;border-radius:12px;padding:12px 13px;display:flex;gap:11px;align-items:flex-start;margin-bottom:12px}
.alert .ic{width:34px;height:34px;border-radius:10px;background:#fee2e2;color:var(--bad);display:grid;place-items:center;flex:none}
.alert b{font-family:"Noto Sans TC";font-size:13px}
.alert p{margin:3px 0 0;font-size:12px;color:#7f1d1d;line-height:1.6}
/* v4 report timeline */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tli{position:relative;padding:0 0 16px}
.tli:last-child{padding-bottom:0}
.tli .dot{position:absolute;left:-22px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--acc)}
.tli.done .dot{background:var(--acc)}
.tli b{font-family:"Noto Sans TC";font-size:13px}
.tli small{display:block;color:var(--mut);font-size:11.5px;margin-top:2px}
.tli .tm{font-family:Inter;font-size:11px;color:var(--acc);font-weight:700}
.prog{display:flex;flex-direction:column;gap:12px}
.pr{display:grid;grid-template-columns:88px 1fr 74px;gap:10px;align-items:center}
.pr b{font-size:12.5px;font-family:"Noto Sans TC"}
.pr .bar{height:14px;background:#f0eeec;border-radius:8px;overflow:hidden;position:relative}
.pr .bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.pr small{font-size:12px;font-weight:700;text-align:right;font-family:Inter}
/* v5 trace */
.trace{position:relative;display:flex;justify-content:space-between;margin:8px 4px 20px;counter-reset:s}
.trace::before{content:"";position:absolute;left:6%;right:6%;top:15px;height:3px;background:var(--line);z-index:0}
.tstep{position:relative;z-index:1;text-align:center;flex:1;min-width:0}
.tstep .c{width:34px;height:34px;border-radius:50%;margin:0 auto 7px;display:grid;place-items:center;color:#fff;background:var(--acc);font-family:Inter;font-weight:800;font-size:13px;box-shadow:0 0 0 4px #fff}
.tstep small{font-size:11.5px;font-family:"Noto Sans TC";color:var(--mut);display:block}
.tstep b{font-size:12.5px;font-family:"Noto Sans TC"}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bc{border:1px solid var(--line);border-radius:13px;padding:14px;text-align:center;background:#faf9f7}
.bc .v{font-size:26px;font-weight:800;font-family:Inter;color:var(--acc)}
.bc small{font-size:11.5px;color:var(--mut);display:block;margin-top:3px}
/* responsive */
@media(max-width:860px){
  .shell{flex-direction:column}
  .side{width:auto;height:auto;position:static;flex-direction:column;padding:12px 14px}
  .brand{border-bottom:0;padding-bottom:10px;margin-bottom:10px}
  .nav{flex-direction:row;flex-wrap:wrap}
  .nav button{padding:9px 12px}
  .side .foot{display:none}
}
@media(max-width:820px){
  .kanban{grid-template-columns:repeat(3,1fr)}
  .g21,.g12,.g11{grid-template-columns:1fr}
  .split{grid-template-columns:1fr}
  .split .arrow{transform:rotate(90deg)}
  .big{grid-template-columns:1fr}
}
@media(max-width:560px){
  .main{padding:16px 14px 32px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kanban{grid-template-columns:1fr}
  .nav button .tx{display:none}
  .nav button{padding:10px}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="logo">工</div>
      <div><b>工單管理系統</b><span>WORK ORDER · MES</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot"><span class="live"></span>現場連線中<br>ERP · MES · APS 已同步<br>更新於 08:42</div>
  </aside>
  <main class="main">
    <div class="ph">
      <div><h1 id="vt"><span class="material-symbols-outlined" id="vi">dashboard</span><span id="vtx">工單總覽</span></h1><p id="vs"></p></div>
      <div class="pill" id="pill">2026-08-13 · 早班</div>
    </div>
    <div id="stage"></div>
  </main>
</div>
<script>
const NAV=[
["工單總覽","dashboard","工單總覽","全廠工單狀態、關鍵指標與即時看板"],
["工單建立拆分","note_add","工單建立拆分","訂單轉工單、拆併單與工序展開派發"],
["工單狀態追蹤","view_kanban","工單狀態追蹤","待排程到已入庫的看板式狀態流轉"],
["物料領用","inventory_2","物料領用","工單領料齊套、發料紀錄與缺料預警"],
["工時報工","schedule","工時報工","現場報工、工時登錄與進度回報"],
["完工結案","fact_check","完工結案","品檢判定、入庫回報與結案歸檔追溯"]
];
const nav=document.getElementById('nav'),stage=document.getElementById('stage');
NAV.forEach((n,i)=>{const b=document.createElement('button');b.setAttribute('data-i',i);b.className=i===0?'on':'';b.innerHTML='<span class="material-symbols-outlined">'+n[1]+'</span><span class="tx">'+n[0]+'</span>';b.onclick=()=>show(i);nav.appendChild(b);});

let chart=null;
function esc(s){return String(s)}
function money(n){return (n||0).toLocaleString('en-US')}

/* ---------- render helpers per screen ---------- */
function scr0(){
  const kpi=[
    ["assignment","進行中工單","46","▲ 今日新增 12","up","ic"],
    ["task_alt","準時完工率","91%","▲ 較上月 9%","up","ic"],
    ["timer","平均週期時間","3.4","▼ 縮短 0.8 天","up","ic","天"],
    ["report","異常待處理","5","▼ 較昨日 3","up","ic","件"]
  ];
  let k='<div class="kpis">';
  kpi.forEach(x=>{k+='<div class="kpi"><div class="ic"><span class="material-symbols-outlined">'+x[0]+'</span></div><div class="l">'+x[1]+'</div><div class="v">'+x[2]+(x[6]?'<small>'+x[6]+'</small>':'')+'</div><div class="d '+x[4]+'">'+x[3]+'</div></div>';});
  k+='</div>';
  const board=[
    ["WO-24081","車用連接器 8,000","C 線","t-run","生產中",72],
    ["WO-24079","散熱鰭片 3,200","B 線","t-run","生產中",41],
    ["WO-24085","感測外殼 12,000","待派","t-wait","待排程",0],
    ["WO-24076","精密齒輪 900","QC","t-qc","待品檢",100],
    ["WO-24072","鋁擠型件 6,400","入庫","t-store","已入庫",100],
    ["WO-24083","電源端子 5,000","缺料","t-hold","異常暫停",18]
  ];
  let tb='<table class="data"><tr><th>工單號</th><th>品項/數量</th><th>位置</th><th>狀態</th><th>進度</th></tr>';
  board.forEach(r=>{tb+='<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td><td><span class="tag '+r[3]+'">'+r[4]+'</span></td><td><b>'+r[5]+'%</b></td></tr>';});
  tb+='</table>';
  return '<div class="view on">'+k+
    '<div class="grid g21">'+
      '<div class="card"><h3><span class="material-symbols-outlined">list_alt</span>今日工單一覽<span class="r">6 / 46 筆</span></h3><div class="scroll">'+tb+'</div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">donut_large</span>工單狀態分佈</h3><div class="chart" id="c_status" style="height:270px"></div></div>'+
    '</div>'+
    '<div class="grid g11" style="margin-top:16px">'+
      '<div class="card"><h3><span class="material-symbols-outlined">trending_up</span>準時完工率趨勢（近 6 週）</h3><div class="chart" id="c_trend" style="height:250px"></div></div>'+
      '<div class="card"><h3><span class="material-symbols-outlined">factory</span>各產線本日產出（pcs）</h3><div class="chart" id="c_line" style="height:250px"></div></div>'+
    '</div>'+
  '</div>';
}
function init0(){
  new ApexCharts(document.getElementById('c_status'),{
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:'donut',height:270,redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false}},
    series:[9,18,6,5,8],labels:['待排程','生產中','待品檢','異常暫停','已入庫'],
    colors:['#d97706','#2563eb','#7e22ce','#dc2626','#0369a1'],
    legend:{position:'bottom',fontSize:'12px'},dataLabels:{enabled:false},
    plotOptions:{pie:{donut:{size:'62%',labels:{show:true,total:{show:true,label:'工單總數',fontSize:'12px',formatter:()=>'46'}}}}}
  }).render();
  new ApexCharts(document.getElementById('c_trend'),{
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:'area',height:250,toolbar:{show:false},redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false}},
    series:[{name:'準時完工率',data:[82,84,86,87,89,91]}],colors:['#ea580c'],
    stroke:{width:3,curve:'smooth'},fill:{type:'gradient',gradient:{opacityFrom:.4,opacityTo:.05}},
    dataLabels:{enabled:false},xaxis:{categories:['第1週','第2週','第3週','第4週','第5週','第6週'],labels:{style:{fontSize:'11px'}}},
    yaxis:{min:70,max:100,labels:{formatter:v=>v+'%',style:{fontSize:'11px'}}},grid:{borderColor:'#f0eeec'}
  }).render();
  new ApexCharts(document.getElementById('c_line'),{
    chart:{redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false},type:'bar',height:250,toolbar:{show:false},redrawOnParentResize:false,redrawOnWindowResize:false,animations:{enabled:false}},
    series:[{name:'產出',data:[5440,3120,10800,4260,6180]}],colors:['#fb923c'],
    plotOptions:{bar:{borderRadius:6,columnWidth:'52%',distributed:false}},dataLabels:{enabled:false},
    xaxis:{categories:['A 線','B 線','C 線','D 線','E 線'],labels:{style:{fontSize:'11px'}}},
    yaxis:{labels:{formatter:v=>(v/1000)+'k',style:{fontSize:'11px'}}},grid:{borderColor:'#f0eeec'}
  }).render();
}

function scr1(){
  const wos=[
    ["WO-24086-1","車用連接器 A 型","4,000 pcs","C 線 · 8/16 交","衝壓,電鍍,壓接,檢測"],
    ["WO-24086-2","車用連接器 A 型","4,000 pcs","A 線 · 8/17 交","衝壓,電鍍,壓接,檢測"],
    ["WO-24087","散熱鰭片 SB-9","3,200 pcs","B 線 · 8/18 交","擠型,裁切,陽極,包裝"]
  ];
  let wl='<div class="wolist">';
  wos.forEach(w=>{wl+='<div class="woc"><div class="t"><span class="no">'+w[0]+'</span>'+w[1]+'</div><small>'+w[2]+' · '+w[3]+'</small><div class="steps">'+w[4].split(',').map(s=>'<span class="stp">'+s+'</span>').join('')+'</div></div>';});
  wl+='</div>';
